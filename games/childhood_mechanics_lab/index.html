<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Bee Jar Camp</title>
  <link rel="stylesheet" href="./tokens.css">
  <style>
    /* Hallmark · macrostructure: game workbench · tone: playful field-journal · anchor hue: honey */
    @layer base {
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: clip;
        background: var(--color-paper);
        color: var(--color-ink);
        font-family: var(--font-body);
        overscroll-behavior: none;
      }

      body {
        position: fixed;
        inset: 0;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }

      canvas {
        display: block;
        width: 100dvw;
        height: 100dvh;
        touch-action: none;
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
    }
  </style>
</head>
<body>
  <canvas id="game" aria-label="Bee Jar Camp canvas game"></canvas>
  <p class="sr-only">
    Bee Jar Camp is a canvas game about luring bees, sending them on backyard expeditions, collecting found objects, and upgrading a handmade jar nest.
  </p>
  <script src="./game.js"></script>
</body>
</html>
