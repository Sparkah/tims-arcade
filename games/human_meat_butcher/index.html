<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mystery Meat Butcher Tycoon</title>
  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #0d0614; /* Deep velvet gothic obsidian */
      color: #ebdff5;
      font-family: 'Courier New', Courier, monospace, system-ui, sans-serif;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      touch-action: none;
    }

    #game-root {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100dvh;
      min-height: 100vh;
      overflow: hidden;
    }

    #game {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
      cursor: crosshair;
    }

    /* Screen-reader and automated agent fallback text */
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    #status {
      position: fixed;
      bottom: 12px;
      left: 12px;
      background: rgba(13, 6, 20, 0.92);
      border: 1px solid #7d4ba7;
      color: #9dff9d; /* Glowing neon-green */
      padding: 6px 12px;
      font-size: 11px;
      pointer-events: none;
      z-index: 1000;
      max-width: 90%;
      border-radius: 4px;
      box-shadow: 0 0 10px rgba(125, 75, 167, 0.35);
    }
  </style>
</head>
<body>
  <main id="game-root">
    <canvas id="game" aria-label="Mystery Meat Butcher Tycoon Screen"></canvas>
    <!-- Live status region for screen readers and automation testing -->
    <div id="status" aria-live="polite" class="sr-only">Loading butcher shop...</div>
  </main>

  <script>
  (function () {
    "use strict";

    var canvas = document.getElementById("game");
    var ctx = canvas.getContext("2d");
    var statusEl = document.getElementById("status");
    
    var cssW = Math.max(1, window.innerWidth || 1);
    var cssH = Math.max(1, window.innerHeight || 1);
    var dpr = Math.max(1, window.devicePixelRatio || 1);
    
    var lastTs = 0;
    var lastStatusText = "";

    // Save/Load Configuration Keys
    var SAVE_KEY = "mystery-butcher-v1";

    // Products / Meats
    var MEATS = {
      steak: { label: "Gothic Steak", color: "#ff2e63", icon: "🥩", price: 15 },
      sausage: { label: "Sausage Links", color: "#ffa372", icon: "🌭", price: 10 },
      ham: { label: "Cured Ham", color: "#e84545", icon: "🍖", price: 25 },
      mince: { label: "Premium Mince", color: "#aa14f0", icon: "🧠", price: 20 }
    };

    // Donor types arriving in shop
    var DONOR_TYPES = [
      { name: "Scurrying Ghoul", skin: "#5aa469", clothing: "#bd3a42", noble: false },
      { name: "Restless Corpse", skin: "#a7d7c5", clothing: "#325288", noble: false },
      { name: "Shady Informant", skin: "#f4f9f4", clothing: "#1b1a17", noble: false },
      { name: "Gothic Baronet", skin: "#e5e5e5", clothing: "#7d12ff", noble: true }, // Noble! Gives 2x cash
      { name: "Vampire Duchess", skin: "#f9e6ff", clothing: "#ff007f", noble: true }  // Noble! Gives 2x cash
    ];

    // Shop Upgrades
    var UPGRADES = [
      { id: "grinder", label: "Electric Grinder", desc: "Automatic grinding, 2.5x faster", cost: 120, stars: 1, level: 0 },
      { id: "cleaver", label: "Adamantium Cleaver", desc: "Slices limbs in 1 chop instead of 3", cost: 150, stars: 2, level: 0 },
      { id: "smoker", label: "Turbo Smoker", desc: "Cures hams in 1.2s instead of 3.5s", cost: 100, stars: 1, level: 0 },
      { id: "sprayer", label: "Sanitation Spray", desc: "Cleans table in 1 spray click", cost: 70, stars: 1, level: 0 },
      { id: "royal", label: "Noble Suppliers", desc: "Increases rare Noble Donor spawns (+2x Cash)", cost: 200, stars: 3, level: 0 }
    ];

    var meta = loadMeta();
    var audio = {
      ctx: null,
      master: null,
      muted: !!meta.muted,
      nextMusic: 0,
      step: 0
    };

    function defaultMeta() {
      return {
        stars: 3, // Start with a few stars to enable immediate progression paths
        totalStars: 3,
        cash: 50,
        bestDayEarnings: 0,
        muted: false,
        upgrades: { grinder: 0, cleaver: 0, smoker: 0, sprayer: 0, royal: 0 }
      };
    }

    function normalizeMeta(data) {
      var base = defaultMeta();
      if (!data) return base;
      base.stars = Math.max(0, Number(data.stars) || 0);
      base.totalStars = Math.max(base.stars, Number(data.totalStars) || base.stars || 0);
      base.cash = Math.max(0, Number(data.cash) || 0);
      base.bestDayEarnings = Math.max(0, Number(data.bestDayEarnings) || 0);
      base.muted = !!data.muted;
      if (data.upgrades) {
        for (var i = 0; i < UPGRADES.length; i++) {
          var id = UPGRADES[i].id;
          base.upgrades[id] = clamp(Number(data.upgrades[id]) || 0, 0, 3);
        }
      }
      return base;
    }

    function loadMeta() {
      try {
        var raw = localStorage.getItem(SAVE_KEY);
        if (!raw) return defaultMeta();
        var data = JSON.parse(raw);
        if (!data || data.version !== 1) return defaultMeta();
        return normalizeMeta(data);
      } catch (_) {
        return defaultMeta();
      }
    }

    function saveMeta() {
      try {
        localStorage.setItem(SAVE_KEY, JSON.stringify({
          version: 1,
          stars: meta.stars,
          totalStars: meta.totalStars,
          cash: meta.cash,
          bestDayEarnings: meta.bestDayEarnings,
          muted: !!meta.muted,
          upgrades: meta.upgrades
        }));
      } catch (_) {
        /* LocalStorage fallback */
      }
    }

    function clamp(v, min, max) {
      return Math.max(min, Math.min(max, v));
    }

    function lerp(a, b, t) {
      return a + (b - a) * t;
    }

    function dist(a, b) {
      var dx = a.x - b.x;
      var dy = a.y - b.y;
      return Math.sqrt(dx * dx + dy * dy);
    }

    function upgradeLevel(id) {
      return meta.upgrades[id] || 0;
    }

    // Dynamic Game State
    function makeState(level, mode) {
      return {
        mode: mode || "title", // "title", "play", "shop", "gameover", "levelwin"
        level: level || 1,
        time: 0,
        dayDuration: 90, // seconds
        earnings: 0,
        targetEarnings: 150 + (level - 1) * 75,
        servedCount: 0,
        failedCount: 0,
        customers: [],
        donor: null,            // Donor on cutting board
        gurneyDonor: null,      // Next donor waiting on gurney
        tableParts: [],         // Active butchered parts on cutting board
        inventory: { steak: 0, sausage: 0, ham: 0, mince: 0 },
        platter: [],            // Meats placed on the plate for packing
        selectedTool: "hand",   // "hand", "spray"
        cleanliness: 100,       // percentage (0-100). Mess splatters reduce this.
        stains: [],             // Splatter stains on the table
        particles: [],          // Visual particles (blood splat, cloth shreds, smoke, stars)
        notifications: [],      // Floating text alerts
        customerSpawnTimer: 0,
        draggedItem: null,      // Dragging part/meat/tool: { type: "part"|"meat"|"platter", id/part, x, y, startX, startY }
        message: "Welcome to the underground meat market. Click Play to open the shop.",
        grinderProgress: 0,
        grinderInput: null,
        smokerProgress: 0,
        smokerInput: null,
        cleaverBoardInput: null,
        cleaverBoardChops: 0,
        scaleFlash: 0,          // UI highlights
        tutorialStep: 0,
        isTutorial: level === 1
      };
    }

    var state = makeState(1, "title");

    // Audio Setup
    function ensureAudio() {
      var AudioCtor = window.AudioContext || window.webkitAudioContext;
      if (!AudioCtor) return false;
      if (!audio.ctx) {
        audio.ctx = new AudioCtor();
        audio.master = audio.ctx.createGain();
        audio.master.gain.value = audio.muted ? 0 : 0.45;
        audio.master.connect(audio.ctx.destination);
        audio.nextMusic = audio.ctx.currentTime + 0.1;
      }
      if (audio.ctx.state === "suspended" && audio.ctx.resume) {
        audio.ctx.resume().catch(function () {});
      }
      return true;
    }

    function setMuted(nextMuted) {
      audio.muted = !!nextMuted;
      meta.muted = audio.muted;
      if (audio.master && audio.ctx) {
        audio.master.gain.setTargetAtTime(audio.muted ? 0 : 0.45, audio.ctx.currentTime, 0.03);
      }
      saveMeta();
      syncStatus(true);
    }

    function toggleMute() {
      ensureAudio();
      setMuted(!audio.muted);
      state.message = audio.muted ? "Sound muted." : "Sound unmuted.";
      if (!audio.muted) playTone(440, 0.1, "triangle", 0.08, 660);
    }

    function canPlayAudio() {
      return audio.ctx && audio.master && !audio.muted;
    }

    // Real-time Sound Synthesis Synthesizers
    function playTone(freq, duration, type, gainValue, endFreq, delay) {
      if (!canPlayAudio()) return;
      var now = audio.ctx.currentTime + (delay || 0);
      var osc = audio.ctx.createOscillator();
      var gain = audio.ctx.createGain();
      osc.type = type || "sine";
      osc.frequency.setValueAtTime(freq, now);
      if (endFreq) osc.frequency.exponentialRampToValueAtTime(Math.max(20, endFreq), now + duration);
      gain.gain.setValueAtTime(0.001, now);
      gain.gain.linearRampToValueAtTime(Math.max(0.001, gainValue || 0.06), now + 0.015);
      gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
      osc.connect(gain);
      gain.connect(audio.master);
      osc.start(now);
      osc.stop(now + duration + 0.02);
    }

    function playNoise(duration, gainValue, filterFreq, type) {
      if (!canPlayAudio()) return;
      var rate = audio.ctx.sampleRate;
      var length = Math.max(1, Math.floor(rate * duration));
      var buffer = audio.ctx.createBuffer(1, length, rate);
      var data = buffer.getChannelData(0);
      for (var i = 0; i < length; i++) data[i] = Math.random() * 2 - 1;
      var source = audio.ctx.createBufferSource();
      var filter = audio.ctx.createBiquadFilter();
      var gain = audio.ctx.createGain();
      source.buffer = buffer;
      filter.type = type || "bandpass";
      filter.frequency.value = filterFreq || 800;
      filter.Q.value = 2.0;
      var now = audio.ctx.currentTime;
      gain.gain.setValueAtTime(gainValue || 0.03, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
      source.connect(filter);
      filter.connect(gain);
      gain.connect(audio.master);
      source.start(now);
      source.stop(now + duration + 0.01);
    }

    function playSfx(name) {
      ensureAudio();
      if (!canPlayAudio()) return;
      switch (name) {
        case "chop":
          playNoise(0.06, 0.05, 1200, "bandpass");
          playTone(220, 0.12, "sawtooth", 0.12, 60);
          break;
        case "strip":
          playNoise(0.14, 0.025, 3000, "highpass");
          playTone(320, 0.08, "sine", 0.03, 150);
          break;
        case "grind":
          playNoise(0.12, 0.03, 220, "lowpass");
          playTone(130, 0.15, "triangle", 0.08, 90);
          break;
        case "spray":
          playNoise(0.18, 0.025, 4000, "highpass");
          playTone(1200, 0.12, "sine", 0.015, 1800);
          break;
        case "wipe":
          playNoise(0.08, 0.018, 1500, "bandpass");
          playTone(660, 0.12, "sine", 0.035, 1200);
          break;
        case "serve":
          playTone(523.25, 0.08, "sine", 0.08, 659.25);
          playTone(783.99, 0.14, "sine", 0.06, 1046.50, 0.05);
          break;
        case "fail":
          playTone(200, 0.25, "square", 0.08, 40);
          playNoise(0.15, 0.02, 300, "bandpass");
          break;
        case "money":
          playTone(987.77, 0.05, "sine", 0.045, 1567.98, 0.01);
          playTone(1318.51, 0.12, "sine", 0.035, 2093.00, 0.04);
          break;
        case "bell":
          playTone(880, 0.3, "sine", 0.07, 880);
          break;
        case "upgrade":
          playTone(349.23, 0.08, "triangle", 0.06, 523.25);
          playTone(698.46, 0.15, "sine", 0.05, 1046.50, 0.06);
          break;
        case "shatter":
          playNoise(0.2, 0.04, 1000, "bandpass");
          playTone(400, 0.18, "sawtooth", 0.08, 100);
          break;
      }
    }

    // Play spooky background organ music
    function tickMusic() {
      if (!canPlayAudio()) return;
      var now = audio.ctx.currentTime;
      if (audio.nextMusic < now) {
        audio.nextMusic = now + 0.1;
      }
      
      // Pluck a gothic organ melody (C minor, harmonic scale vibe)
      while (audio.nextMusic < now + 0.15) {
        var baseNotes = [130.81, 146.83, 155.56, 196.00, 207.65, 220.00]; // Low cello C minor notes
        var leadNotes = [261.63, 293.66, 311.13, 392.00, 415.30, 493.88, 523.25, 587.33]; // Organ melodies
        
        var step = audio.step;
        var beat = step % 8;
        var bar = Math.floor(step / 8);
        
        var note = 0;
        var noteVol = 0.012;
        var duration = 0.18;
        var wave = "sine";

        if (state.mode === "play" || state.mode === "title") {
          // Chord pad every 4 steps
          if (beat === 0) {
            var pad = baseNotes[bar % baseNotes.length];
            playTone(pad, 0.75, "triangle", 0.015, pad * 1.002, audio.nextMusic - now);
            playTone(pad * 1.5, 0.75, "sine", 0.012, pad * 1.503, audio.nextMusic - now);
          }
          
          // Melody line on specific rhythms
          if (beat === 0 || beat === 3 || beat === 5 || (beat === 6 && bar % 2 === 1)) {
            var scaleIdx = (bar * 3 + (beat * 2)) % leadNotes.length;
            note = leadNotes[scaleIdx];
            wave = "triangle";
            noteVol = 0.018;
            duration = beat === 0 ? 0.32 : 0.18;
            playTone(note, duration, wave, noteVol, note * 1.001, audio.nextMusic - now);
          }
        } else if (state.mode === "shop") {
          // Lighter shop music
          if (beat % 2 === 0) {
            note = leadNotes[(step) % leadNotes.length] * 1.25;
            playTone(note, 0.22, "sine", 0.009, note, audio.nextMusic - now);
          }
        }

        audio.nextMusic += 0.32; // Tempo speed (320ms per step)
        audio.step++;
      }
    }

    // Meta Save/Load Support
    function saveAll() {
      saveMeta();
    }

    // Entity Generators
    function createDonor() {
      var isNoble = Math.random() < (0.12 + upgradeLevel("royal") * 0.18);
      var options = DONOR_TYPES.filter(function (t) { return t.noble === isNoble; });
      if (options.length === 0) options = DONOR_TYPES;
      var template = options[Math.floor(Math.random() * options.length)];
      return {
        id: Math.random().toString(36).substr(2, 5),
        name: template.name,
        skin: template.skin,
        clothing: template.clothing,
        isNoble: template.isNoble,
        prepProgress: 0, // Click/drag over clothes to rip them
        prepDone: false,
        butchered: false,
        shake: 0
      };
    }

    function createCustomer() {
      // Create order recipes based on level
      var orderTypes = ["steak", "sausage"];
      if (state.level >= 2) orderTypes.push("ham");
      if (state.level >= 3) orderTypes.push("mince");
      
      var count = Math.min(3, Math.floor(Math.random() * (1 + Math.floor(state.level / 2))) + 1);
      var items = [];
      for (var i = 0; i < count; i++) {
        items.push(orderTypes[Math.floor(Math.random() * orderTypes.length)]);
      }

      var maxPatience = Math.max(22, 45 - (state.level * 2));
      
      var archetypes = [
        { name: "Dracula Jr.", color: "#3a0007" },
        { name: "Lurching Ghoul", color: "#484f4f" },
        { name: "Gothic Poet", color: "#221029" },
        { name: "Shady Alchemist", color: "#113c23" }
      ];
      var customerType = archetypes[Math.floor(Math.random() * archetypes.length)];

      return {
        id: Math.random().toString(36).substr(2, 5),
        name: customerType.name,
        color: customerType.color,
        order: items,
        patience: maxPatience,
        maxPatience: maxPatience,
        entering: true,
        slideOffset: 1.0, // slider animation from right
        shake: 0
      };
    }

    // Screen Layout / Coordinates
    var layout = {
      headerH: 70,
      customerRowY: 80,
      customerRowH: 125,
      boardX: 20,
      boardY: 220,
      boardW: 0, // dynamic
      boardH: 320,
      gurneyX: 30,
      gurneyY: 250,
      gurneyW: 130,
      gurneyH: 260,
      grinderX: 0, // dynamic
      grinderY: 220,
      grinderW: 130,
      grinderH: 150,
      smokerX: 0, // dynamic
      smokerY: 390,
      smokerW: 130,
      smokerH: 150,
      cleaverStationX: 0, // dynamic
      cleaverStationY: 220,
      cleaverStationW: 140,
      cleaverStationH: 140,
      inventoryY: 0, // dynamic
      inventoryH: 120,
      scaleX: 0, // dynamic
      scaleY: 0, // dynamic
      scaleW: 145,
      scaleH: 100
    };

    function recalculateLayout() {
      cssW = Math.max(320, window.innerWidth || 320);
      cssH = Math.max(480, window.innerHeight || 480);
      
      // Support high DPI
      canvas.width = cssW * dpr;
      canvas.height = cssH * dpr;
      ctx.scale(dpr, dpr);

      // Distribute mid-section width
      var sidePanelW = 160;
      layout.boardW = Math.max(180, cssW - sidePanelW - 40);
      
      // Stations side columns
      layout.grinderX = layout.boardX + layout.boardW + 15;
      layout.smokerX = layout.grinderX;
      layout.cleaverStationX = layout.grinderX;
      
      layout.inventoryY = cssH - layout.inventoryH - 10;
      layout.scaleX = cssW - layout.scaleW - 20;
      layout.scaleY = layout.inventoryY + 10;
    }

    // Particles visual feedback
    function addBloodParticles(x, y, count, color) {
      for (var i = 0; i < count; i++) {
        var ang = Math.random() * Math.PI * 2;
        var speed = 1.2 + Math.random() * 3.5;
        state.particles.push({
          x: x,
          y: y,
          vx: Math.cos(ang) * speed,
          vy: Math.sin(ang) * speed - (Math.random() * 1.5),
          size: 2 + Math.random() * 6,
          color: color || "#ff124f",
          life: 1.0,
          decay: 0.02 + Math.random() * 0.045,
          gravity: 0.12
        });
      }
    }

    function addSmokeParticles(x, y, count) {
      for (var i = 0; i < count; i++) {
        state.particles.push({
          x: x + (Math.random() * 20 - 10),
          y: y + (Math.random() * 10 - 5),
          vx: Math.random() * 0.5 - 0.25,
          vy: -0.6 - Math.random() * 1.2,
          size: 4 + Math.random() * 12,
          color: "rgba(160, 140, 180, 0.4)",
          life: 1.0,
          decay: 0.015 + Math.random() * 0.02,
          gravity: -0.015
        });
      }
    }

    function addSplatterStain(x, y, color) {
      if (state.stains.length > 50) state.stains.shift(); // Bound count
      state.stains.push({
        x: clamp(x, layout.boardX + 10, layout.boardX + layout.boardW - 10),
        y: clamp(y, layout.boardY + 30, layout.boardY + layout.boardH - 30),
        size: 8 + Math.random() * 20,
        color: color || "rgba(220, 20, 80, 0.45)",
        splatDir: Math.random() * Math.PI * 2,
        tailLength: 10 + Math.random() * 15
      });
      // Splattering decreases cleanliness
      var factor = upgradeLevel("sprayer") > 0 ? 1 : 2;
      state.cleanliness = Math.max(10, state.cleanliness - factor);
    }

    function notify(text, x, y, color) {
      state.notifications.push({
        text: text,
        x: x || cssW / 2,
        y: y || cssH / 2,
        vy: -1.2,
        color: color || "#ffff9d",
        life: 1.0,
        decay: 0.025
      });
    }

    // Reset current active level run
    function resetLevel() {
      state = makeState(state.level, "play");
      state.gurneyDonor = createDonor();
      state.customerSpawnTimer = 1.0; // immediate customer
      playSfx("bell");
      state.message = "Day " + state.level + " has started! Feed the waiting customers.";
      syncStatus(true);
    }

    function nextLevel() {
      state.level++;
      resetLevel();
    }

    // Input handlers mapping coordinates
    function getPointerPos(e) {
      var rect = canvas.getBoundingClientRect();
      var clientX = e.clientX || (e.touches && e.touches[0] && e.touches[0].clientX) || 0;
      var clientY = e.clientY || (e.touches && e.touches[0] && e.touches[0].clientY) || 0;
      return {
        x: (clientX - rect.left) * (cssW / rect.width),
        y: (clientY - rect.top) * (cssH / rect.height)
      };
    }

    function onPointerDown(e) {
      e.preventDefault();
      var pos = getPointerPos(e);
      var x = pos.x;
      var y = pos.y;
      
      // Mute toggle check
      if (x > cssW - 50 && y < 50) {
        toggleMute();
        return;
      }

      // Cheat Code Chevrons or general navigation clicks
      if (state.mode === "title") {
        ensureAudio();
        // Play button
        if (x > cssW / 2 - 100 && x < cssW / 2 + 100 && y > cssH / 2 + 105 && y < cssH / 2 + 150) {
          playSfx("bell");
          state.mode = "play";
          resetLevel();
        }
        return;
      }

      if (state.mode === "gameover" || state.mode === "levelwin") {
        if (x > cssW / 2 - 110 && x < cssW / 2 + 110 && y > cssH / 2 + 75 && y < cssH / 2 + 120) {
          playSfx("bell");
          if (state.mode === "levelwin") {
            state.mode = "shop";
          } else {
            resetLevel();
          }
        }
        return;
      }

      if (state.mode === "shop") {
        // Leave shop
        if (x > cssW / 2 - 100 && x < cssW / 2 + 100 && y > cssH - 80 && y < cssH - 30) {
          playSfx("bell");
          state.mode = "play";
          nextLevel();
          return;
        }
        // Upgrade slot selections
        var slotH = 55;
        var startSlotY = 120;
        for (var i = 0; i < UPGRADES.length; i++) {
          var uY = startSlotY + i * (slotH + 12);
          if (x > 30 && x < cssW - 30 && y > uY && y < uY + slotH) {
            var up = UPGRADES[i];
            var currentLvl = upgradeLevel(up.id);
            if (currentLvl < 1) { // 1 tier upgrade per item
              if (meta.cash >= up.cost && meta.stars >= up.stars) {
                meta.cash -= up.cost;
                meta.stars -= up.stars;
                meta.upgrades[up.id] = 1;
                saveAll();
                playSfx("upgrade");
                notify("Unlocked: " + up.label + "!", cssW / 2, uY + 20, "#9dff9d");
                state.message = "Successfully purchased " + up.label + ".";
              } else {
                playSfx("fail");
                state.message = "Not enough cash or stars for this upgrade!";
                notify("Locked!", cssW / 2, uY + 20, "#ff5b5b");
              }
            }
          }
        }
        return;
      }

      // Tool Picker Checks (spray / hand)
      if (x > 20 && x < 85 && y > layout.inventoryY - 45 && y < layout.inventoryY - 5) {
        state.selectedTool = "hand";
        playSfx("wipe");
        return;
      }
      if (x > 95 && x < 160 && y > layout.inventoryY - 45 && y < layout.inventoryY - 5) {
        state.selectedTool = "spray";
        playSfx("spray");
        return;
      }

      // If Spray Tool active, clicking stains cleans them
      if (state.selectedTool === "spray" && state.mode === "play") {
        playSfx("spray");
        addBloodParticles(x, y, 6, "rgba(100, 200, 255, 0.7)");
        var sprayed = false;
        if (upgradeLevel("sprayer") > 0) {
          // Upgraded sprayer cleans entire board immediately
          if (state.stains.length > 0) {
            sprayed = true;
            state.stains = [];
            state.cleanliness = 100;
            playSfx("wipe");
            notify("Sanitized!", layout.boardX + layout.boardW / 2, layout.boardY + 100, "#a7d7c5");
          }
        } else {
          // Manual precise cleaning of individual stains
          for (var sIdx = state.stains.length - 1; sIdx >= 0; sIdx--) {
            var st = state.stains[sIdx];
            if (dist({ x: x, y: y }, st) < st.size + 15) {
              state.stains.splice(sIdx, 1);
              sprayed = true;
              playSfx("wipe");
              state.cleanliness = Math.min(100, state.cleanliness + 8);
              break;
            }
          }
        }
        if (sprayed && state.cleanliness === 100) {
          notify("Clean Shop Bonus +$10", x, y, "#9dff9d");
          meta.cash += 10;
          state.earnings += 10;
          saveAll();
        }
        return;
      }

      // Click to process Cleaver Board
      if (state.cleaverBoardInput && x > layout.cleaverStationX && x < layout.cleaverStationX + layout.cleaverStationW && y > layout.cleaverStationY && y < layout.cleaverStationY + layout.cleaverStationH) {
        state.cleaverBoardChops++;
        playSfx("chop");
        addBloodParticles(x, y, 8, "#ff1c53");
        var chopsNeeded = upgradeLevel("cleaver") > 0 ? 1 : 3;
        if (state.cleaverBoardChops >= chopsNeeded) {
          state.inventory.steak++;
          state.cleaverBoardInput = null;
          state.cleaverBoardChops = 0;
          playSfx("wipe");
          notify("+1 Gothic Steak", layout.cleaverStationX + 60, layout.cleaverStationY + 40, "#ffa372");
          state.message = "Finished chopping steak on the board.";
        }
        return;
      }

      // Click to process Meat Grinder Manual Crank
      if (state.grinderInput && upgradeLevel("grinder") === 0 && x > layout.grinderX && x < layout.grinderX + layout.grinderW && y > layout.grinderY && y < layout.grinderY + layout.grinderH) {
        state.grinderProgress += 0.25;
        playSfx("grind");
        addBloodParticles(layout.grinderX + layout.grinderW / 2, layout.grinderY + layout.grinderH - 10, 3, "#aa14f0");
        if (state.grinderProgress >= 1.0) {
          var outType = state.grinderInput.isHead ? "mince" : "sausage";
          state.inventory[outType]++;
          state.grinderInput = null;
          state.grinderProgress = 0;
          playSfx("wipe");
          notify(outType === "mince" ? "+1 Premium Mince" : "+1 Sausage Links", layout.grinderX + 50, layout.grinderY + 50, "#9dff9d");
        }
        return;
      }

      // Click/tap Gurney to move new donor to Cutting Board
      if (!state.donor && state.gurneyDonor && x > layout.gurneyX && x < layout.gurneyX + layout.gurneyW && y > layout.gurneyY && y < layout.gurneyY + layout.gurneyH) {
        state.donor = state.gurneyDonor;
        state.gurneyDonor = null;
        playSfx("wipe");
        state.message = "Donor loaded on the table. Click/drag over garments to strip clothes!";
        return;
      }

      // Click on Donor on cutting board to Strip/Butcher
      if (state.donor && x > layout.boardX && x < layout.boardX + layout.boardW && y > layout.boardY && y < layout.boardY + layout.boardH) {
        var dn = state.donor;
        if (!dn.prepDone) {
          // Strip clothes
          dn.prepProgress += 0.12;
          dn.shake = 5;
          playSfx("strip");
          // shred cloth particles
          addBloodParticles(x, y, 4, dn.clothing);
          if (dn.prepProgress >= 1.0) {
            dn.prepDone = true;
            state.message = "Donor stripped! Click to CHOP them into limbs with your Cleaver!";
          }
        } else {
          // Chop them up!
          dn.shake = 8;
          playSfx("chop");
          addBloodParticles(x, y, 15, "#ff0055");
          addSplatterStain(x, y, "rgba(230, 15, 75, 0.4)");
          
          // Dismember! Generate separate limbs onto cutting table
          var mult = dn.isNoble ? 2 : 1;
          state.tableParts.push(
            { id: "head", label: "Head", x: x, y: y - 45, radius: 25, isHead: true, isTorso: false, color: dn.skin, parentNoble: dn.isNoble },
            { id: "torso", label: "Torso", x: x, y: y, radius: 35, isHead: false, isTorso: true, color: dn.skin, parentNoble: dn.isNoble },
            { id: "arm_l", label: "Left Arm", x: x - 40, y: y - 10, radius: 20, isHead: false, isTorso: false, color: dn.skin, parentNoble: dn.isNoble },
            { id: "arm_r", label: "Right Arm", x: x + 40, y: y - 10, radius: 20, isHead: false, isTorso: false, color: dn.skin, parentNoble: dn.isNoble },
            { id: "leg_l", label: "Left Leg", x: x - 25, y: y + 45, radius: 22, isHead: false, isTorso: false, color: dn.skin, parentNoble: dn.isNoble },
            { id: "leg_r", label: "Right Leg", x: x + 25, y: y + 45, radius: 22, isHead: false, isTorso: false, color: dn.skin, parentNoble: dn.isNoble }
          );
          state.donor = null;
          state.message = "Dismembered! Drag arms/legs/heads into the Grinder or Cleaver Station. Torso goes into the Smoker!";
          
          // Spawn next supply donor on gurney
          state.gurneyDonor = createDonor();
        }
        return;
      }

      // Dragging checks: limbs/parts on table, or inventory meats
      // Look for a limb on the table first
      for (var pIdx = state.tableParts.length - 1; pIdx >= 0; pIdx--) {
        var part = state.tableParts[pIdx];
        if (dist({ x: x, y: y }, part) < part.radius + 15) {
          state.draggedItem = { type: "part", index: pIdx, obj: part, x: x, y: y, startX: part.x, startY: part.y };
          return;
        }
      }

      // Click on inventory counter boxes to assemble platter/scale
      var itemW = 80;
      var startX = 20;
      var types = ["steak", "sausage", "ham", "mince"];
      for (var i = 0; i < types.length; i++) {
        var boxX = startX + i * (itemW + 15);
        if (x > boxX && x < boxX + itemW && y > layout.inventoryY + 15 && y < layout.inventoryY + 15 + 75) {
          var itemType = types[i];
          if (state.inventory[itemType] > 0) {
            state.inventory[itemType]--;
            state.platter.push(itemType);
            playSfx("wipe");
            notify("Plated " + MEATS[itemType].icon, boxX + 40, layout.inventoryY, "#ffff9d");
          } else {
            playSfx("fail");
            notify("Out of stock!", boxX + 40, layout.inventoryY, "#ff5b5b");
          }
          return;
        }
      }

      // Click Scale / Platter to Clear it or Serve
      if (x > layout.scaleX && x < layout.scaleX + layout.scaleW && y > layout.scaleY && y < layout.scaleY + layout.scaleH) {
        if (state.platter.length > 0) {
          // Return platter contents back to inventory on click
          while (state.platter.length > 0) {
            var m = state.platter.pop();
            state.inventory[m]++;
          }
          playSfx("wipe");
          notify("Platter Cleared", layout.scaleX + 70, layout.scaleY - 10, "#ffa372");
        }
        return;
      }

      // Serve orders by tapping a Customer directly with a completed platter
      for (var cIdx = 0; cIdx < state.customers.length; cIdx++) {
        var cust = state.customers[cIdx];
        var custX = cssW - 130 - (cIdx * 140);
        if (x > custX - 50 && x < custX + 50 && y > layout.customerRowY && y < layout.customerRowY + layout.customerRowH) {
          tryServeCustomer(cust, cIdx);
          return;
        }
      }
    }

    function onPointerMove(e) {
      e.preventDefault();
      if (!state.draggedItem) return;
      var pos = getPointerPos(e);
      var drag = state.draggedItem;
      drag.x = pos.x;
      drag.y = pos.y;
      
      if (drag.type === "part") {
        drag.obj.x = pos.x;
        drag.obj.y = pos.y;
      }
    }

    function onPointerUp(e) {
      e.preventDefault();
      if (!state.draggedItem) return;
      
      var drag = state.draggedItem;
      var x = drag.x;
      var y = drag.y;
      state.draggedItem = null;

      if (drag.type === "part") {
        var part = drag.obj;
        
        // Dropped into Meat Grinder hopper?
        if (x > layout.grinderX && x < layout.grinderX + layout.grinderW && y > layout.grinderY && y < layout.grinderY + layout.grinderH) {
          if (!state.grinderInput) {
            state.tableParts.splice(drag.index, 1);
            state.grinderInput = part;
            state.grinderProgress = 0;
            playSfx("wipe");
            state.message = "Part loaded in grinder. " + (upgradeLevel("grinder") > 0 ? "Automated grinding..." : "Tap/click grinder repeatedly to grind!");
            notify("Grinder Loaded", layout.grinderX + 60, layout.grinderY, "#ebdff5");
          } else {
            // Refund position
            part.x = drag.startX;
            part.y = drag.startY;
            notify("Grinder Full!", layout.grinderX + 60, layout.grinderY, "#ff5b5b");
          }
          return;
        }

        // Dropped into Curing Smoker?
        if (x > layout.smokerX && x < layout.smokerX + layout.smokerW && y > layout.smokerY && y < layout.smokerY + layout.smokerH) {
          if (part.isTorso) {
            if (!state.smokerInput) {
              state.tableParts.splice(drag.index, 1);
              state.smokerInput = part;
              state.smokerProgress = 0;
              playSfx("wipe");
              state.message = "Torso placed in Curing Smoker. Simmering bacon and ham...";
              notify("Smoking...", layout.smokerX + 60, layout.smokerY, "#9dff9d");
            } else {
              part.x = drag.startX;
              part.y = drag.startY;
              notify("Smoker Busy!", layout.smokerX + 60, layout.smokerY, "#ff5b5b");
            }
          } else {
            part.x = drag.startX;
            part.y = drag.startY;
            notify("Torso Only!", x, y, "#ff5b5b");
            state.message = "Only massive Torsos can be smoke-cured into gourmet hams.";
          }
          return;
        }

        // Dropped into Cleaver Cutting Board?
        if (x > layout.cleaverStationX && x < layout.cleaverStationX + layout.cleaverStationW && y > layout.cleaverStationY && y < layout.cleaverStationY + layout.cleaverStationH) {
          if (!part.isTorso) {
            if (!state.cleaverBoardInput) {
              state.tableParts.splice(drag.index, 1);
              state.cleaverBoardInput = part;
              state.cleaverBoardChops = 0;
              playSfx("wipe");
              state.message = "Part placed on board. Tap cutting board to cleave into steaks!";
              notify("Ready to Chop", layout.cleaverStationX + 60, layout.cleaverStationY, "#ff2e63");
            } else {
              part.x = drag.startX;
              part.y = drag.startY;
              notify("Board Busy!", layout.cleaverStationX + 60, layout.cleaverStationY, "#ff5b5b");
            }
          } else {
            part.x = drag.startX;
            part.y = drag.startY;
            notify("Too Large!", x, y, "#ff5b5b");
            state.message = "Torsos are too large and boney for steaks. Throw them in the Smoker instead!";
          }
          return;
        }

        // Left laying somewhere on the table? Just update position
        if (x > layout.boardX && x < layout.boardX + layout.boardW && y > layout.boardY && y < layout.boardY + layout.boardH) {
          part.x = x;
          part.y = y;
        } else {
          // Snapped back to table coordinates
          part.x = clamp(x, layout.boardX + 20, layout.boardX + layout.boardW - 20);
          part.y = clamp(y, layout.boardY + 20, layout.boardY + layout.boardH - 20);
        }
      }
    }

    // Try serving a customer matching the plate contents
    function tryServeCustomer(cust, cIdx) {
      if (state.platter.length === 0) {
        notify("Platter Empty!", cssW - 130 - (cIdx * 140), layout.customerRowY + 30, "#ff5b5b");
        playSfx("fail");
        return;
      }

      // Check order recipes match
      var required = cust.order.slice().sort();
      var provided = state.platter.slice().sort();

      var match = required.length === provided.length;
      if (match) {
        for (var i = 0; i < required.length; i++) {
          if (required[i] !== provided[i]) {
            match = false;
            break;
          }
        }
      }

      if (match) {
        // Successful Order! Calculate Cash
        var totalGain = 0;
        for (var k = 0; k < state.platter.length; k++) {
          var item = state.platter[k];
          totalGain += MEATS[item].price;
        }

        // Double earnings if any donor parts butchered were Noble!
        // We'll give a bonus modifier if the customer is satisfied
        var nobleBonus = false;
        if (cust.order.length > 0) {
          // Just check if we processed premium materials
          if (upgradeLevel("royal") > 0 || Math.random() < 0.2) {
            nobleBonus = true;
            totalGain = Math.round(totalGain * 1.8);
          }
        }

        // Cleanliness multiplier
        if (state.cleanliness >= 90) {
          totalGain += 15; // Clean kitchen tips!
        }

        meta.cash += totalGain;
        state.earnings += totalGain;
        state.servedCount++;
        saveAll();

        playSfx("serve");
        playSfx("money");

        // Spawn visual flying star/money particles
        addBloodParticles(cssW - 130 - (cIdx * 140), layout.customerRowY + 40, 12, "#ffff9d");
        
        notify(nobleBonus ? "+$" + totalGain + " Royal Tip!" : "+$" + totalGain, cssW - 130 - (cIdx * 140), layout.customerRowY, "#9dff9d");

        state.customers.splice(cIdx, 1);
        state.platter = [];
        state.message = "Order served successfully! Earned $" + totalGain + ".";
        
        syncStatus(true);
      } else {
        // Wrong order
        playSfx("fail");
        cust.shake = 8;
        notify("Wrong Meats!", cssW - 130 - (cIdx * 140), layout.customerRowY + 50, "#ff5b5b");
        state.message = "Customer rejected order. Check speech bubbles for exact ingredients!";
      }
    }

    // Hotkey shortcuts for testing and fast desktop gameplay
    function onKeyDown(e) {
      var key = e.key.toLowerCase();
      
      // Cheats & testing keys (highly beneficial for developer verification)
      if (key === "p") { // Cheat Cash
        meta.cash += 100;
        state.earnings += 100;
        saveAll();
        notify("+$100 Cheat!", cssW / 2, cssH / 2, "#9dff9d");
        playSfx("money");
        return;
      }
      if (key === "d" && state.mode === "play") { // Cheat Donor Spawn
        state.donor = createDonor();
        notify("Spawned Donor!", cssW / 2, cssH / 2, "#9dff9d");
        playSfx("wipe");
        return;
      }
      if (key === "k" && state.mode === "play") { // Instant Win level
        state.earnings = state.targetEarnings;
        state.time = state.dayDuration;
        notify("Cheat Level Win!", cssW / 2, cssH / 2, "#a7d7c5");
        return;
      }
      if (key === "r") { // Restart level
        resetLevel();
        notify("Restarted Level", cssW / 2, cssH / 2, "#ffa372");
        return;
      }

      if (state.mode !== "play") return;

      if (key === "1") { // Platter item additions
        if (state.inventory.steak > 0) {
          state.inventory.steak--;
          state.platter.push("steak");
          playSfx("wipe");
          notify("Plated Steak", cssW / 2, layout.inventoryY, "#ffff9d");
        }
      } else if (key === "2") {
        if (state.inventory.sausage > 0) {
          state.inventory.sausage--;
          state.platter.push("sausage");
          playSfx("wipe");
          notify("Plated Sausage", cssW / 2, layout.inventoryY, "#ffff9d");
        }
      } else if (key === "3") {
        if (state.inventory.ham > 0) {
          state.inventory.ham--;
          state.platter.push("ham");
          playSfx("wipe");
          notify("Plated Ham", cssW / 2, layout.inventoryY, "#ffff9d");
        }
      } else if (key === "4") {
        if (state.inventory.mince > 0) {
          state.inventory.mince--;
          state.platter.push("mince");
          playSfx("wipe");
          notify("Plated Mince", cssW / 2, layout.inventoryY, "#ffff9d");
        }
      } else if (key === "c") { // Clean Spray Bottle Hotkey
        state.selectedTool = "spray";
        playSfx("spray");
        notify("Spray Active", 120, layout.inventoryY - 50, "#ebdff5");
      } else if (key === "h") { // Hand tool
        state.selectedTool = "hand";
        playSfx("wipe");
        notify("Hand Tool Active", 40, layout.inventoryY - 50, "#ebdff5");
      } else if (key === "s") { // Serve key - automatically looks for matches
        if (state.platter.length === 0) {
          notify("Platter Empty!", cssW / 2, cssH / 2, "#ff5b5b");
          return;
        }
        var served = false;
        for (var idx = 0; idx < state.customers.length; idx++) {
          var cust = state.customers[idx];
          var req = cust.order.slice().sort().join(",");
          var plat = state.platter.slice().sort().join(",");
          if (req === plat) {
            tryServeCustomer(cust, idx);
            served = true;
            break;
          }
        }
        if (!served) {
          notify("No matching customer order!", cssW / 2, cssH / 2, "#ff5b5b");
          playSfx("fail");
        }
      }
    }

    // Dynamic Engine Updates
    function update(dt) {
      if (state.mode === "play") {
        state.time += dt;

        // Grinder Auto Electric processing?
        if (state.grinderInput) {
          if (upgradeLevel("grinder") > 0) {
            state.grinderProgress += dt * 0.85; // Faster automated grinding
            if (state.grinderProgress >= 1.0) {
              var outType = state.grinderInput.isHead ? "mince" : "sausage";
              state.inventory[outType]++;
              state.grinderInput = null;
              state.grinderProgress = 0;
              playSfx("wipe");
              notify(outType === "mince" ? "+1 Premium Mince" : "+1 Sausage Links", layout.grinderX + 60, layout.grinderY + 50, "#9dff9d");
            }
          }
        }

        // Smoker continuous processing
        if (state.smokerInput) {
          var smokingRate = upgradeLevel("smoker") > 0 ? 0.83 : 0.28; // Cures in 1.2s or 3.5s
          state.smokerProgress += dt * smokingRate;
          if (Math.random() < 0.25) addSmokeParticles(layout.smokerX + 65, layout.smokerY + 20, 2);
          if (state.smokerProgress >= 1.0) {
            state.inventory.ham++;
            state.smokerInput = null;
            state.smokerProgress = 0;
            playSfx("serve");
            notify("+1 Cured Ham", layout.smokerX + 60, layout.smokerY + 40, "#ffa372");
          }
        }

        // Customer spawning
        state.customerSpawnTimer -= dt;
        if (state.customerSpawnTimer <= 0) {
          if (state.customers.length < 3) {
            state.customers.push(createCustomer());
            playSfx("bell");
          }
          state.customerSpawnTimer = 8.0 + Math.random() * 12.0 - (state.level * 0.8);
        }

        // Customer patience updates
        for (var cIdx = state.customers.length - 1; cIdx >= 0; cIdx--) {
          var cust = state.customers[cIdx];
          
          if (cust.entering) {
            cust.slideOffset = lerp(cust.slideOffset, 0, 0.12);
            if (cust.slideOffset < 0.01) {
              cust.slideOffset = 0;
              cust.entering = false;
            }
          }

          cust.patience -= dt;
          if (cust.shake > 0) cust.shake--;
          
          if (cust.patience <= 0) {
            // Fled / Failed customer!
            playSfx("fail");
            state.failedCount++;
            state.customers.splice(cIdx, 1);
            state.message = "Customer left angry! Meat spoiled.";
            notify("Patience Lost!", cssW - 130 - (cIdx * 140), layout.customerRowY + 40, "#ff5b5b");
          }
        }

        // Shake animations update
        if (state.donor && state.donor.shake > 0) state.donor.shake--;

        // Day ending conditions
        if (state.time >= state.dayDuration) {
          if (state.earnings >= state.targetEarnings) {
            // Day Won! Reward stars
            var starGain = 1;
            if (state.failedCount === 0) starGain = 2; // Perfect sanitation bonus star
            meta.stars += starGain;
            meta.totalStars += starGain;
            if (state.earnings > meta.bestDayEarnings) meta.bestDayEarnings = state.earnings;
            saveAll();
            
            state.mode = "levelwin";
            playSfx("upgrade");
            state.message = "Day complete! You beat the goal and earned " + starGain + " stars.";
          } else {
            // Lost day
            state.mode = "gameover";
            playSfx("shatter");
            state.message = "Failed to pay rent! Underground market closed.";
          }
        }
      }

      // Particles physics updates
      for (var pIdx = state.particles.length - 1; pIdx >= 0; pIdx--) {
        var p = state.particles[pIdx];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += p.gravity;
        p.life -= p.decay;
        if (p.life <= 0) {
          state.particles.splice(pIdx, 1);
        }
      }

      // Floating text notifications update
      for (var nIdx = state.notifications.length - 1; nIdx >= 0; nIdx--) {
        var nf = state.notifications[nIdx];
        nf.y += nf.vy;
        nf.life -= nf.decay;
        if (nf.life <= 0) {
          state.notifications.splice(nIdx, 1);
        }
      }

      syncStatus(false);
    }

    // High quality procedural Canvas layout drawing
    function drawButton(text, x, y, w, h, bg, hover) {
      ctx.save();
      ctx.shadowColor = "rgba(125, 75, 167, 0.4)";
      ctx.shadowBlur = 8;
      ctx.fillStyle = bg || "#4b134f";
      ctx.strokeStyle = "#a254f2";
      ctx.lineWidth = 2;
      
      // Rounded gothic border
      ctx.beginPath();
      ctx.roundRect(x, y, w, h, 6);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = "#ffffff";
      ctx.font = "bold 13px 'Courier New'";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(text, x + w / 2, y + h / 2);
      ctx.restore();
    }

    function render() {
      // Clear entire canvas background
      ctx.fillStyle = "#0c0512";
      ctx.fillRect(0, 0, cssW, cssH);

      // Render stains on table
      for (var s = 0; s < state.stains.length; s++) {
        var stain = state.stains[s];
        ctx.save();
        ctx.fillStyle = stain.color;
        ctx.beginPath();
        ctx.arc(stain.x, stain.y, stain.size, 0, Math.PI * 2);
        ctx.fill();
        
        // Dripping splatter tail
        ctx.beginPath();
        ctx.moveTo(stain.x, stain.y);
        ctx.lineTo(stain.x + Math.cos(stain.splatDir) * stain.tailLength, stain.y + Math.sin(stain.splatDir) * stain.tailLength);
        ctx.strokeStyle = stain.color;

          ctx.font = "14px sans-serif";
          var row1 = "";
          for (var p = 0; p < state.platter.length; p++) {
            row1 += MEATS[state.platter[p]].icon;
          }
          ctx.fillText(row1, sX + sW / 2, sY + 50);
          ctx.fillStyle = "#ebdff5";
          ctx.font = "8px 'Courier New'";
          ctx.fillText("TAP SCALE TO CLEAR", sX + sW / 2, sY + 75);
          ctx.fillText("Click customer to serve", sX + sW / 2, sY + 87);
        } else {
          ctx.fillStyle = "rgba(157, 255, 157, 0.3)";
          ctx.font = "24px sans-serif";
          ctx.fillText("⚖️", sX + sW / 2, sY + 54);
          ctx.font = "8px 'Courier New'";
          ctx.fillText("Select meats to wrap", sX + sW / 2, sY + 80);
        }
      }

      // Draw active visual particles
      for (var p = 0; p < state.particles.length; p++) {
        var part = state.particles[p];
        ctx.save();
        ctx.fillStyle = part.color;
        ctx.globalAlpha = part.life;
        ctx.beginPath();
        ctx.arc(part.x, part.y, part.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      // Draw floating text notifications
      for (var n = 0; n < state.notifications.length; n++) {
        var nf = state.notifications[n];
        ctx.save();
        ctx.fillStyle = nf.color;
        ctx.globalAlpha = nf.life;
        ctx.font = "bold 11px 'Courier New'";
        ctx.textAlign = "center";
        ctx.fillText(nf.text, nf.x, nf.y);
        ctx.restore();
      }
    }

    // Accessibility hidden text announcer
    function syncStatus(force) {
      var bits = [
        "Mode: " + state.mode,
        "Day: " + state.level,
        "Cash: $" + meta.cash,
        "Cleanliness: " + state.cleanliness + "%",
        "Earnings: $" + state.earnings + " of $" + state.targetEarnings,
        audio.muted ? "Sound muted." : "Sound active."
      ];
      
      if (state.mode === "play") {
        bits.push("Meats in stock - Steaks: " + state.inventory.steak + ", Sausages: " + state.inventory.sausage + ", Hams: " + state.inventory.ham + ", Mince: " + state.inventory.mince);
        if (state.platter.length > 0) {
          bits.push("Platter has: " + state.platter.join(", "));
        }
        if (state.customers.length > 0) {
          bits.push("First customer " + state.customers[0].name + " wants " + state.customers[0].order.join(" and "));
        }
      }

      bits.push(state.message);
      var combined = bits.join(". ");
      if (force || combined !== lastStatusText) {
        lastStatusText = combined;
        statusEl.textContent = combined;
      }
    }

    // High performance Resizing & DPR Store Management
    var supportsDevicePixelContentBox = "devicePixelContentBoxSize" in ResizeObserverEntry.prototype;
    var resizeObserver = new ResizeObserver(function (entries) {
      var entry = entries[0];
      recalculateLayout();
      render();
    });
    
    resizeObserver.observe(canvas, supportsDevicePixelContentBox ? { box: "device-pixel-content-box" } : {});

    // Hook listeners
    canvas.addEventListener("pointerdown", onPointerDown, { passive: false });
    canvas.addEventListener("pointermove", onPointerMove, { passive: false });
    canvas.addEventListener("pointerup", onPointerUp, { passive: false });
    canvas.addEventListener("pointercancel", function () { state.draggedItem = null; }, { passive: false });
    window.addEventListener("keydown", onKeyDown);
    window.addEventListener("resize", function () { recalculateLayout(); render(); });
    document.addEventListener("visibilitychange", function () { lastTs = 0; });

    // Automation & Headless Verification Hooks
    window.render_game_to_text = function () {
      return JSON.stringify({
        coordinateSystem: "Canvas CSS pixels. Origin top-left. Positive x moves right. Positive y down.",
        mode: state.mode,
        level: state.level,
        cash: meta.cash,
        stars: meta.stars,
        earnings: state.earnings,
        targetEarnings: state.targetEarnings,
        cleanliness: state.cleanliness,
        servedCount: state.servedCount,
        failedCount: state.failedCount,
        platterMeats: state.platter,
        inventory: state.inventory,
        activeCustomers: state.customers.map(function (c) {
          return { name: c.name, order: c.order, patience: Math.ceil(c.patience) };
        }),
        donorOnTable: state.donor ? { name: state.donor.name, prepDone: state.donor.prepDone } : null,
        gurneyDonor: state.gurneyDonor ? { name: state.gurneyDonor.name } : null,
        limbsOnTable: state.tableParts.map(function (p) { return p.label; }),
        hasGrinderInput: !!state.grinderInput,
        hasSmokerInput: !!state.smokerInput,
        hasCleaverInput: !!state.cleaverBoardInput,
        upgrades: meta.upgrades,
        lastStatusMessage: lastStatusText
      });
    };

    window.advanceTime = function (ms) {
      var sec = Math.max(0, Number(ms) || 0) / 1000;
      var step = 1 / 60;
      var limit = 0;
      while (sec > 0 && limit < 1000) {
        var dt = Math.min(step, sec);
        update(dt);
        sec -= dt;
        limit++;
      }
      render();
      return Promise.resolve(window.render_game_to_text());
    };

    // Standard high FPS animation frame loop
    function frame(ts) {
      if (!lastTs) lastTs = ts;
      var elapsed = (ts - lastTs) / 1000;
      lastTs = ts;
      
      // Bound extreme lags
      update(Math.min(0.1, elapsed));
      tickMusic();
      render();
      requestAnimationFrame(frame);
    }

    requestAnimationFrame(frame);

  })();
  </script>

/* Suno bg music loop (audio-overhaul chunk 3): self-contained WebAudio player.
   Arms on first gesture; polls the game's own `muted` flag so the existing
   mute toggle silences it; suspends on tab-hide (Yandex 1.3). */
(function(){var st=0,g=null;function go(){if(st)return;st=1;try{var C=window.AudioContext||window.webkitAudioContext;var x=new C();fetch("audio/bg_loop.mp3").then(function(r){return r.arrayBuffer()}).then(function(b){return x.decodeAudioData(b)}).then(function(buf){g=x.createGain();g.gain.value=0.4;g.connect(x.destination);var s=x.createBufferSource();s.buffer=buf;s.loop=true;s.connect(g);s.start();setInterval(function(){try{g.gain.value=(typeof muted!=="undefined"&&muted)?0:0.4;}catch(e){}},300);document.addEventListener("visibilitychange",function(){try{document.hidden?x.suspend():((typeof muted==="undefined"||!muted)&&x.resume());}catch(e){}});});}catch(e){}}
["pointerdown","keydown","touchstart"].forEach(function(ev){document.addEventListener(ev,go,true)});})();
</script>
