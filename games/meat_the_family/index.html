// ════════════════════════════════════════════════════════════════════════════
// HELPERS
// ════════════════════════════════════════════════════════════════════════════
function t(k) { return GF.t(k); }
function money(n) { return (GF.lang === 'ru' ? '₽' : '$') + n; }  // dirty cash: RUB for RU, $ for EN
function rnd(a, b) { return a + Math.random() * (b - a); }
function pick(arr) { return arr[(Math.random() * arr.length) | 0]; }
function trayCap() { return TRAY_CAP0 + upg.fridge * 2; }
function chopSweet() { return CHOP_SWEET0 + upg.cleaver * CHOP_SWEET_PER; }
function grindTaps() { return Math.max(3, GRIND_TAPS0 - upg.grinder); }
function smokeWindow() { return SMOKE_WINDOW0 + upg.smoker * SMOKE_WINDOW_PER; }
function decorMult() { return 1 + upg.decor * 0.15; }
function patienceFor(day) { return Math.max(PATIENCE_FLOOR, PATIENCE_BASE - (day - 1) * PATIENCE_PER_DAY); }
function arrivalFor(day) { return Math.max(ARRIVAL_FLOOR, (ARRIVAL_BASE - (day - 1) * ARRIVAL_PER_DAY) / (CFG.tuning.speed_mult || 1)); }
function stationUnlocked(st) { return st === 'chop' || (st === 'grind' && day >= 2) || (st === 'smoke' && day >= 3); }
function unlockedProducts() { var a = ['steak']; if (day >= 2) a.push('sausage'); if (day >= 3) a.push('ham'); return a; }
function trayCount(type) { var n = 0; for (var i = 0; i < tray.length; i++) if (tray[i].type === type) n++; return n; }
function toast(msg, col) { toasts.push({ msg: msg, col: col || '#ffe08a', t: 0 }); if (toasts.length > 4) toasts.shift(); }
function save() { try { GF.saveRun(); } catch (e) {} }

function snapshot() {
  return { gs: gs, overlay: overlay, cash: cash, score: score, respect: respect, heat: heat,
    day: day, rank: rank, servedToday: servedToday, quotaToday: quotaToday, servedTotal: servedTotal,
    upg: upg, bribeCost: bribeCost, inspectPauseDays: inspectPauseDays, reviveUsed: reviveUsed,
    inspectedTier: inspectedTier,
    tray: tray.map(function (p) { return { type: p.type, prem: p.prem }; }),
    queue: queue.map(function (c) { return { sp: c.sp, order: c.order, wantsPrem: c.wantsPrem, pat: c.pat, patMax: c.patMax }; }),
    smoke: { state: smoke.state, t: smoke.t }, goReason: goReason };
}
function restore(s) {
  if (!s) return;
  gs = s.gs || 'MENU'; overlay = s.overlay || null;
  cash = s.cash || 0; score = s.score || 0; respect = (s.respect != null ? s.respect : RESPECT_START);
  heat = s.heat || 0; day = s.day || 1; rank = s.rank || 0;
  servedToday = s.servedToday || 0; quotaToday = s.quotaToday || DAY_QUOTA_BASE; servedTotal = s.servedTotal || 0;
  if (s.upg) upg = s.upg; bribeCost = s.bribeCost || BRIBE_COST0; inspectPauseDays = s.inspectPauseDays || 0;
  reviveUsed = !!s.reviveUsed; if (s.inspectedTier) inspectedTier = s.inspectedTier;
  goReason = s.goReason || 'fish';
  tray = (s.tray || []).map(function (p) { return { type: p.type, prem: !!p.prem }; });
  queue = (s.queue || []).map(function (c) { return mkCustomerFrom(c); });
  if (s.smoke) { smoke.state = s.smoke.state || 'empty'; smoke.t = s.smoke.t || 0; }
}

// ════════════════════════════════════════════════════════════════════════════
function startGame() {
  cash = 0; score = 0; respect = RESPECT_START; heat = 0;
  day = 1; rank = 0; servedToday = 0; quotaToday = DAY_QUOTA_BASE; servedTotal = 0;
  arrivalTimer = 1.2; spawnedAny = false;
  upg = { cleaver: 0, grinder: 0, fridge: 0, smoker: 0, decor: 0 };
  reviveUsed = false; bribeCost = BRIBE_COST0; inspectPauseDays = 0;
  inspectedTier = [false, false];
  queue = []; tray = []; toasts = [];
  chop = { marker: 0, dir: 1, cd: 0, flash: 0 };
  grind = { fill: 0, startT: 0, active: false, flash: 0 };
  smoke = { state: 'empty', t: 0, flash: 0 };
  mini = null; inspectState = null; sitdown = null; overlay = null;
  gs = 'PLAYING';
  // one pre-seeded customer so the first serve is possible immediately
  spawnCustomer(true);
  GF.gameStarted();
  if (!seenTutorial()) startTutorial();
  save();
}

function gameOver(reason) {
  goReason = reason;
  var nb = score > best;
  if (nb) { best = score; try { localStorage.setItem(BEST_KEY, best); } catch (e) {} newBestFlash = 1.2; }
  gs = 'GAMEOVER'; overlay = null;
  GF.sfx('lose'); GF.juice.flash('rgba(20,0,0,0.5)', 420, 0.5);
  GF.gameEnded();
  pendingAd = true;
  if (nb && best > 0) GF.happytime();
  save();
}

function seenTutorial() { try { return !!localStorage.getItem(TUT_KEY); } catch (e) { return false; } }

function mkCustomerFrom(c) {
  var sp = SPECIES[c.sp] || SPECIES.rat;
  return { sp: c.sp, order: c.order, wantsPrem: !!c.wantsPrem, pat: (c.pat != null ? c.pat : c.patMax),
    patMax: c.patMax || patienceFor(day), spawnT: 0, x: 0, appear: 1, leaving: 0, barkIdx: c.barkIdx || 0, barkT: 0 };
}

function rollSpecies() {
  var pool = [];
  for (var i = 0; i < SPECIES_ORDER.length; i++) {
    var sp = SPECIES[SPECIES_ORDER[i]];
    if (day >= sp.minDay) { var w = (sp.id === 'rat' ? 5 : sp.id === 'bear' ? 4 : sp.id === 'hyena' ? 3 : 2); for (var k = 0; k < w; k++) pool.push(sp.id); }
  }
  return pool.length ? pick(pool) : 'rat';
}

function rollOrder() {
  var prods = unlockedProducts();
  var maxItems = day <= 1 ? 1 : day <= 3 ? 2 : 3;
  var n = 1 + ((Math.random() * maxItems) | 0);
  if (n > maxItems) n = maxItems;
  var order = {};
  for (var i = 0; i < n; i++) { var p = pick(prods); order[p] = (order[p] || 0) + 1; }
  return order;
}

function spawnCustomer(force) {
  if (queue.length >= QUEUE_CAP) {
    if (!force) {
      // overflow strike (the 6th arrival to a full line)
      respect = Math.max(0, respect - RESPECT_LOSS_OVFLOW);
      toast(t('tooMany'), '#ff7a6a'); GF.sfx('error'); GF.juice.shake(6, 220); GF.juice.flash('rgba(80,0,0,0.35)', 260, 0.4);
      if (respect <= 0) gameOver('fish');
    }
    return;
  }
  var spId = force ? 'rat' : rollSpecies();
  var sp = SPECIES[spId];
  var order = force ? { steak: 1 } : rollOrder();
  var pm = patienceFor(day) * sp.patMult;
  queue.push({ sp: spId, order: order, wantsPrem: sp.wantsPrem, pat: pm, patMax: pm, spawnT: 0, x: 0, appear: 0, leaving: 0, barkIdx: (Math.random() * 2) | 0, barkT: 3.0 });
  spawnedAny = true;
  GF.sfx('spawn');
}

// ── serving ──────────────────────────────────────────────────────────────
function orderList(order) { var a = []; for (var k in order) if (order.hasOwnProperty(k)) for (var i = 0; i < order[k]; i++) a.push(k); return a; }

function canServe(c) {
  for (var k in c.order) if (c.order.hasOwnProperty(k)) { if (trayCount(k) < c.order[k]) return false; }
  return true;
}

function serveCustomer(idx) {
  var c = queue[idx];
  if (!c) return;
  if (!canServe(c)) { toast(t('noStock'), '#ff9a5a'); GF.sfx('error'); c.shake = 0.3; return;
  }
  var sp = SPECIES[c.sp];
  var consumed = [];
  var informant = !!sp.informant;
  for (var k in c.order) {
    if (!c.order.hasOwnProperty(k)) continue;
    var need = c.order[k];
    // Pidge (informant): consume NORMAL cuts first (avoid heat). Others: prime first.
    var idxs = [];
    for (var i = 0; i < tray.length; i++) if (tray[i].type === k) idxs.push(i);
    idxs.sort(function (a, b) { var pa = tray[a].prem ? 1 : 0, pb = tray[b].prem ? 1 : 0; return informant ? pa - pb : pb - pa; });
    var take = idxs.slice(0, need);
    take.sort(function (a, b) { return b - a; });
    for (var j = 0; j < take.length; j++) { consumed.push(tray[take[j]]); tray.splice(take[j], 1); }
  }
  var premCount = 0; for (var m = 0; m < consumed.length; m++) if (consumed[m].prem) premCount++;
  // payout
  var base = consumed.length * CASH_PER_PRODUCT;
  var premBonus = premCount * CASH_PER_PRODUCT;
  var speedFrac = c.pat / c.patMax; var tip = Math.round(TIP_MAX * Math.max(0, speedFrac));
  if (CFG.events && CFG.events.double_tips) tip *= 2;
  var mult = sp.payMult * decorMult() * (CFG.tuning.pay_mult || 1);
  if (c.wantsPrem) { mult *= (premCount === consumed.length && consumed.length > 0) ? 1.5 : 0.6; }
  var gain = Math.max(1, Math.round((base + premBonus + tip) * mult));
  cash += gain; score = cash;
  // respect
  var rg = RESPECT_GAIN_BASE + premCount * RESPECT_PREM_BONUS;
  if (c.wantsPrem && premCount === consumed.length && consumed.length > 0) rg += 6;
  respect = Math.min(RESPECT_MAX, respect + rg);
  // heat: informant saw a prime
  if (informant && premCount > 0) { heat = Math.min(HEAT_MAX, heat + PIDGE_HEAT); toast(t('pidgeSaw'), '#ff8a6a'); }
  // fx
  var cx = c._cx || GF.cx, cy = c._cy || GF.cy;
  GF.juice.floatText(cx, cy - 18 * GF.S, '+' + money(gain), { color: '#ffe08a', size: 20 });
  GF.juice.particles.burst(cx, cy, { color: premCount > 0 ? '#ffd24a' : '#ffb64a', count: premCount > 0 ? 16 : 9 });
  GF.sfx(premCount > 0 ? 'reward' : 'coin');
  if (Math.random() < 0.5) GF.juice.floatText(cx, cy + 16 * GF.S, '"' + serveBark() + '"', { color: '#bfe0ff', size: 11 });
  queue.splice(idx, 1);
  servedToday++; servedTotal++;
  // rank up
  var nr = rank; for (var ri = RANK_CASH.length - 1; ri >= 0; ri--) { if (score >= RANK_CASH[ri]) { nr = ri; break; } }
  if (nr > rank) { rank = nr; toast(t('rankUp') + ': ' + t('ranks')[rank], '#ffd24a'); GF.sfx('levelup'); GF.juice.flash('rgba(255,200,60,0.25)', 300, 0.4); }
  // tutorial serve step
  if (GF.tutorial.active && GF.tutorial.step === 1) GF.tutorial.next();
  GF.funnel.mark('first_serve');
  // day complete?
  if (servedToday >= quotaToday) completeDay();
  save();
}

function completeDay() {
  GF.sfx('win'); GF.juice.flash('rgba(255,200,80,0.22)', 380, 0.4);
  overlay = 'DAYEND';
}

function advanceDay() {
  day++;
  servedToday = 0;
  quotaToday = DAY_QUOTA_BASE + (day - 1) * DAY_QUOTA_PER;
  queue = []; arrivalTimer = 1.4; spawnedAny = false;
  smoke = { state: 'empty', t: 0, flash: 0 }; grind.fill = 0; grind.active = false;
  if (inspectPauseDays > 0) inspectPauseDays--;
  // unlock toasts
  if (day === 2) toast(t('grind') + ' + ' + t('sausage'), '#9ad2ff');
  if (day === 3) toast(t('smoke') + ' + ' + t('ham'), '#9ad2ff');
  overlay = null;
  save();
}

function continueFromDayEnd() {
  // sit-down every N days
  if (day % SIT_DOWN_EVERY === 0) { startSitdown(); }
  else { advanceDay(); }
}

// ── SIT-DOWN ───────────────────────────────────────────────────────────────
function startSitdown() {
  var pool = DOSSIERS.slice();
  for (var i = pool.length - 1; i > 0; i--) { var j = (Math.random() * (i + 1)) | 0; var tmp = pool[i]; pool[i] = pool[j]; pool[j] = tmp; }
  sitdown = { cards: pool.slice(0, 3), picked: -1, pickT: 0 };
  overlay = 'SITDOWN';
  GF.sfx('unlock');
}
function pickDossier(i) {
  if (!sitdown || sitdown.picked >= 0) return;
  var d = sitdown.cards[i];
  sitdown.picked = i; sitdown.revealT = 0;
  // grant stock into next-day tray
  advanceDay();               // sets up the next day (also clears overlay)...
  overlay = 'SITDOWN';        // ...but hold the overlay for the punchline beat
  var st = d.stock;
  function add(type, n, premChance) { for (var q = 0; q < n && tray.length < trayCap(); q++) tray.push({ type: type, prem: Math.random() < premChance }); }
  add('steak', st.steak, st.prem); add('sausage', st.sausage, st.prem); add('ham', st.ham, st.prem);
  heat = Math.max(0, Math.min(HEAT_MAX, heat + d.heat));
  if (d.pauseInspect) inspectPauseDays = 2;
  sitdown.reveal = (GF.lang === 'ru' ? d.conseq_ru : d.conseq);
  GF.sfx('unlock'); GF.arp([392, 294, 196], 110, 0.24, 'sawtooth', 0.12); // ominous comedy stinger
  GF.juice.flash('rgba(120,90,180,0.18)', 300, 0.4);
  save();
}

// ── INSPECTION ───────────────────────────────────────────────────────────
function startInspection() {
  var toks = [];
  var nFlag = 2 + ((Math.random() * 2) | 0);
  var total = 5;
  for (var i = 0; i < total; i++) toks.push({ type: pick(['steak', 'sausage', 'ham']), flag: i < nFlag, cleared: false });
  for (var s = toks.length - 1; s > 0; s--) { var j = (Math.random() * (s + 1)) | 0; var tm = toks[s]; toks[s] = toks[j]; toks[j] = tm; }
  inspectState = { tokens: toks, sweep: 0, result: null, resT: 0 };
  overlay = 'INSPECT';
  GF.sfx('hurt');
}
function tapInspectToken(i) {
  var st = inspectState; if (!st || st.result) return;
  var tk = st.tokens[i]; if (!tk || tk.cleared) return;
  if (tk.flag) { tk.cleared = true; GF.sfx('tap'); GF.juice.particles.burst(tk._x || GF.cx, tk._y || GF.cy, { color: '#7CFC9A', count: 8 }); }
  else { GF.sfx('error'); st.sweep = Math.min(1, st.sweep + 0.12); }
  var remaining = 0; for (var k = 0; k < st.tokens.length; k++) if (st.tokens[k].flag && !st.tokens[k].cleared) remaining++;
  if (remaining === 0) finishInspection(true);
}
function finishInspection(pass) {
  var st = inspectState; if (!st) return;
  st.result = pass ? 'pass' : 'fail'; st.resT = 0;
  if (pass) { heat = Math.max(0, heat - INSPECT_PASS_DROP); toast(t('inspectPass'), '#7CFC9A'); GF.sfx('levelup'); }
  else { heat = Math.min(HEAT_MAX, heat + INSPECT_FAIL_RISE); toast(t('inspectFail'), '#ff7a6a'); GF.sfx('hit'); GF.juice.shake(8, 300); }
  save();
}

// ── stations ───────────────────────────────────────────────────────────────
function doChop() {
  if (chop.cd > 0) return;
  // Forgiving by design: every chop yields at least a normal steak; the skill
  // is landing the sweet spot for a PRIME cut (double pay). The first tutorial
  // cut is always prime so the opening beat feels great.
  var m = chop.marker; var sweet = chopSweet();
  var lo = 0.5 - sweet / 2, hi = 0.5 + sweet / 2;
  var prem = (m >= lo && m <= hi);
  if (GF.tutorial.active && GF.tutorial.step === 0) prem = true;
  chop.cd = CHOP_COOLDOWN; chop.flash = prem ? 1 : 0.5;
  if (tray.length >= trayCap()) { toast(GF.lang === 'ru' ? 'Поднос полон' : 'Tray full', '#ffb85a'); GF.sfx('error'); return; }
  tray.push({ type: 'steak', prem: prem });
  GF.sfx(prem ? 'merge' : 'tap'); if (prem) GF.juice.punch(chop, 'flash', 0.5, 160);
  GF.juice.particles.burst(L.chop.x + L.chop.w / 2, L.chop.y + L.chop.h * 0.35, { color: prem ? '#ffd24a' : '#c8565f', count: prem ? 12 : 6 });
  if (GF.tutorial.active && GF.tutorial.step === 0) GF.tutorial.next();
}
function doGrind() {
  if (!stationUnlocked('grind')) return;
  if (!grind.active) { grind.active = true; grind.fill = 0; grind.startT = 0; }
  grind.fill += 1 / grindTaps();
  grind.flash = 0.5;
  GF.sfx('tap');
  if (grind.fill >= 1) {
    var prem = grind.startT <= GRIND_WINDOW;
    if (tray.length < trayCap()) {
      tray.push({ type: 'sausage', prem: prem });
      GF.sfx(prem ? 'merge' : 'pickup');
      GF.juice.particles.burst(L.grind.x + L.grind.w / 2, L.grind.y + L.grind.h * 0.35, { color: prem ? '#ffd24a' : '#b9663e', count: prem ? 12 : 6 });
    } else { toast(GF.lang === 'ru' ? 'Поднос полон' : 'Tray full', '#ffb85a'); }
    grind.active = false; grind.fill = 0;
  }
}
function doSmoke() {
  if (!stationUnlocked('smoke')) return;
  if (smoke.state === 'empty') { smoke.state = 'cooking'; smoke.t = 0; GF.sfx('spawn'); }
  else if (smoke.state === 'ready') {
    if (tray.length < trayCap()) { tray.push({ type: 'ham', prem: true }); GF.sfx('merge'); GF.juice.particles.burst(L.smoke.x + L.smoke.w / 2, L.smoke.y + L.smoke.h * 0.35, { color: '#ffd24a', count: 12 }); }
    smoke.state = 'empty'; smoke.t = 0;
  } else if (smoke.state === 'over') {
    if (tray.length < trayCap()) { tray.push({ type: 'ham', prem: false }); GF.sfx('pickup'); }
    smoke.state = 'empty'; smoke.t = 0;
  }
}

function tryBribe() {
  if (cash < bribeCost || heat <= 0) return;
  cash -= bribeCost; score = cash;
  heat = Math.max(0, heat - BRIBE_DROP);
  bribeCost += BRIBE_STEP;
  GF.sfx('coin'); toast(GF.lang === 'ru' ? 'Подмазал.' : 'Badge greased.', '#9ad2ff');
  save();
}

// ════════════════════════════════════════════════════════════════════════════
// UPDATE
// ════════════════════════════════════════════════════════════════════════════
function update(dt) {
  GF.juice.update(dt);
  GF.tutorial.update(dt);
  tutWatchdog(dt);
  for (var i = toasts.length - 1; i >= 0; i--) { toasts[i].t += dt; if (toasts[i].t > 2.6) toasts.splice(i, 1); }
  if (newBestFlash > 0) newBestFlash = Math.max(0, newBestFlash - dt);
  if (gs !== 'PLAYING') return;

  // chop marker always sweeps (skill = tap timing)
  chop.marker += chop.dir * CHOP_SPEED * dt;
  if (chop.marker >= 1) { chop.marker = 1; chop.dir = -1; }
  if (chop.marker <= 0) { chop.marker = 0; chop.dir = 1; }
  if (chop.cd > 0) chop.cd = Math.max(0, chop.cd - dt);
  if (chop.flash > 0) chop.flash = Math.max(0, chop.flash - dt * 3);
  if (grind.flash > 0) grind.flash = Math.max(0, grind.flash - dt * 3);
  if (smoke.flash > 0) smoke.flash = Math.max(0, smoke.flash - dt * 3);

  // grind decay if you stop mashing
  if (grind.active) { grind.startT += dt; grind.fill = Math.max(0, grind.fill - GRIND_DECAY * dt * 0.35); if (grind.fill <= 0 && grind.startT > 0.4) grind.active = false; }

  // smoke cook
  if (smoke.state === 'cooking') { smoke.t += dt; if (smoke.t >= SMOKE_TIME) { smoke.state = 'ready'; smoke.t = 0; smoke.flash = 1; GF.sfx('unlock'); } }
  else if (smoke.state === 'ready') { smoke.t += dt; if (smoke.t >= smokeWindow()) { smoke.state = 'over'; smoke.t = 0; } }
  else if (smoke.state === 'over') { smoke.t += dt; if (smoke.t >= SMOKE_RUIN) { smoke.state = 'empty'; smoke.t = 0; } }

  // overlays pause the queue/heat
  if (overlay === 'SITDOWN') {
    if (sitdown && sitdown.picked >= 0) { sitdown.revealT += dt; if (sitdown.revealT > 1.5) { overlay = null; sitdown = null; save(); } }
    return;
  }
  if (overlay === 'INSPECT') { updateInspect(dt); return; }
  if (overlay) return;

  // tutorial safe: no arrivals / no patience drain until the coach ends
  var coach = GF.tutorial.active;

  if (!coach) {
    arrivalTimer -= dt;
    if (arrivalTimer <= 0) { arrivalTimer = arrivalFor(day) * rnd(0.8, 1.15); spawnCustomer(false); }
  }

  // patience
  for (var q = queue.length - 1; q >= 0; q--) {
    var c = queue[q];
    if (c.appear < 1) c.appear = Math.min(1, c.appear + dt * 4);
    if (c.shake) c.shake = Math.max(0, c.shake - dt);
    if (c.barkT > 0) c.barkT = Math.max(0, c.barkT - dt);
    if (!coach) {
      c.pat -= dt;
      if (c.pat <= 0) {
        queue.splice(q, 1);
        respect = Math.max(0, respect - RESPECT_LOSS_IMPAT);
        toast(SPECIES[c.sp][GF.lang === 'ru' ? 'name_ru' : 'name'] + ' ' + t('walkedOff'), '#ff7a6a');
        GF.sfx('hurt'); GF.juice.shake(6, 220); GF.juice.flash('rgba(80,0,0,0.3)', 240, 0.4);
        if (respect <= 0) { gameOver('fish'); return; }
      }
    }
  }

  // heat drift + inspections (from day 3)
  if (day >= HEAT_START_DAY && !coach) {
    heat = Math.min(HEAT_MAX, heat + HEAT_RATE * dt);
    if (heat >= HEAT_MAX) { gameOver('raid'); return; }
    for (var ti = 0; ti < INSPECT_AT.length; ti++) {
      if (heat >= INSPECT_AT[ti] && !inspectedTier[ti]) {
        inspectedTier[ti] = true;
        if (inspectPauseDays <= 0) { startInspection(); return; }
      }
      if (heat < INSPECT_AT[ti] - 6) inspectedTier[ti] = false;
    }
  }
}

var _tutStepT = 0, _tutLastStep = -1;
function tutWatchdog(dt) {
  if (!GF.tutorial.active) { _tutLastStep = -1; return; }
  if (GF.tutorial.step !== _tutLastStep) { _tutLastStep = GF.tutorial.step; _tutStepT = 0; }
  _tutStepT += dt;
  var step = GF.tutorial.step;
  // never wedge: force-advance a manual step that the player hasn't completed
  var limit = step === 0 ? 9 : step === 1 ? 7 : 3.5;
  if (_tutStepT >= limit) { GF.tutorial.next(); _tutStepT = 0; }
}

function updateInspect(dt) {
  var st = inspectState; if (!st) return;
  if (st.result) { st.resT += dt; if (st.resT > 1.3) { overlay = null; inspectState = null; } return; }
  st.sweep += dt / INSPECT_TIME;
  if (st.sweep >= 1) finishInspection(false);
}

// ════════════════════════════════════════════════════════════════════════════
// LAYOUT
// ════════════════════════════════════════════════════════════════════════════
function layout() {
  var W = GF.W, H = GF.H, S = GF.S;
  hit = {};
  var hudH = Math.min(H * 0.14, 96 * S);
  var qTop = hudH + 4 * S;
  var qH = Math.min(H * 0.19, 150 * S);
  var trTop = qTop + qH + 4 * S;
  var trH = Math.min(H * 0.10, 80 * S);
  var stTop = trTop + trH + 6 * S;
  var stH = H - stTop - 6 * S;
  L = { W: W, H: H, S: S, hudH: hudH, qTop: qTop, qH: qH, trTop: trTop, trH: trH, stTop: stTop, stH: stH };

  // HUD buttons
  var bs = Math.max(26, 30 * S);
  hit.mute = { x: W - bs - 6 * S, y: 6 * S, w: bs, h: bs };
  hit.help = { x: W - bs * 2 - 12 * S, y: 6 * S, w: bs, h: bs };

  // queue cards
  var pad = 8 * S, gap = 6 * S;
  var cw = (W - pad * 2 - gap * (QUEUE_CAP - 1)) / QUEUE_CAP;
  var ch = qH - 8 * S;
  hit.cust = [];
  for (var i = 0; i < queue.length; i++) {
    var cx = pad + i * (cw + gap);
    hit.cust.push({ x: cx, y: qTop + 2 * S, w: cw, h: ch, idx: i });
    queue[i]._cx = cx + cw / 2; queue[i]._cy = qTop + ch * 0.4;
  }

  // stations
  var sp2 = 8 * S, sgap = 8 * S;
  var sw = (W - sp2 * 2 - sgap * 2) / 3;
  L.chop = { x: sp2, y: stTop, w: sw, h: stH };
  L.grind = { x: sp2 + sw + sgap, y: stTop, w: sw, h: stH };
  L.smoke = { x: sp2 + (sw + sgap) * 2, y: stTop, w: sw, h: stH };
  hit.chop = L.chop; hit.grind = L.grind; hit.smoke = L.smoke;

  // bribe button (appears when heat elevated + affordable)
  if (gs === 'PLAYING' && !overlay && heat >= 40 && cash >= bribeCost) {
    var bw = Math.min(W * 0.5, 210 * S), bh = 30 * S;
    hit.bribe = { x: W / 2 - bw / 2, y: trTop + trH * 0.5 - bh / 2, w: bw, h: bh };
  } else hit.bribe = null;
}

// ════════════════════════════════════════════════════════════════════════════
// DRAW
// ════════════════════════════════════════════════════════════════════════════
function draw(c) {
  var W = GF.W, H = GF.H, S = GF.S;
  layout();
  drawBackground(c, W, H, S);
  if (gs === 'MENU') { drawMenu(c, W, H, S); GF.juice.drawFlash(c); return; }

  drawStations(c, S);
  drawTray(c, S);
  drawQueue(c, S);
  drawHUD(c, W, H, S);
  drawToasts(c, W, S);

  GF.juice.particles.draw(c);
  GF.juice.texts.draw(c);

  if (overlay === 'DAYEND') drawDayEnd(c, W, H, S);
  else if (overlay === 'SITDOWN') drawSitdown(c, W, H, S);
  else if (overlay === 'INSPECT') drawInspect(c, W, H, S);

  if (gs === 'GAMEOVER') drawGameOver(c, W, H, S);

  if (GF.tutorial.active) GF.tutorial.draw(c);
  GF.juice.drawFlash(c);
}

function drawBackground(c, W, H, S) {
  var g = c.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#3a2233'); g.addColorStop(0.5, '#281824'); g.addColorStop(1, '#170f16');
  c.fillStyle = g; c.fillRect(0, 0, W, H);
  // faint noir city window band behind the queue (atmosphere only)
  if (L.qTop) {
    var wy = L.qTop - 2 * S, wh = (L.qH || 100) + 4 * S;
    c.fillStyle = 'rgba(40,54,84,0.16)'; c.fillRect(0, wy, W, wh);
    c.fillStyle = 'rgba(20,28,48,0.14)';
    for (var i = 0; i < 7; i++) { var bx = (i * 0.145) * W + 4 * S, bw = W * 0.09; c.fillRect(bx, wy + wh * (0.2 + (i % 3) * 0.12), bw, wh * (0.55 - (i % 3) * 0.1)); }
  }
  // warm wood counter band behind stations
  if (L.stTop) {
    c.fillStyle = '#3e2a20'; c.fillRect(0, L.stTop - 6 * S, W, H - L.stTop + 6 * S);
    c.fillStyle = 'rgba(255,220,180,0.05)'; c.fillRect(0, L.stTop - 6 * S, W, 3 * S);
  }
}

function drawHUD(c, W, H, S) {
  var hudH = L.hudH;
  c.fillStyle = 'rgba(12,8,14,0.7)'; c.fillRect(0, 0, W, hudH);
  c.fillStyle = 'rgba(255,255,255,0.06)'; c.fillRect(0, hudH - 2 * S, W, 2 * S);
  var pad = 8 * S;
  // Respect bar (left)
  var barW = Math.min(W * 0.42, 168 * S), barH = 12 * S;
  drawMeter(c, pad, 8 * S, barW, barH, respect / RESPECT_MAX, '#e0555f', '#4a2028');
  c.fillStyle = '#ffd7db'; c.font = 'bold ' + fs(11, S) + 'px sans-serif'; c.textAlign = 'left'; c.textBaseline = 'middle';
  c.fillText(t('respect'), pad + 3 * S, 8 * S + barH / 2);
  // Heat bar (under respect) - only meaningful from day 3
  var showHeat = day >= HEAT_START_DAY || heat > 0;
  if (showHeat) {
    drawMeter(c, pad, 8 * S + barH + 5 * S, barW, barH, heat / HEAT_MAX, heat > 70 ? '#ff5a4a' : '#8a6bff', '#241a3a');
    c.fillStyle = '#d8ccff'; c.font = 'bold ' + fs(11, S) + 'px sans-serif';
    c.fillText(t('heat'), pad + 3 * S, 8 * S + barH + 5 * S + barH / 2);
  }
  // Cash (center)
  c.textAlign = 'center'; c.fillStyle = '#ffd24a'; c.font = 'bold ' + fs(20, S) + 'px sans-serif'; c.textBaseline = 'top';
  c.fillText(money(cash), W / 2, 6 * S);
  c.fillStyle = '#b7a06a'; c.font = 'bold ' + fs(9, S) + 'px sans-serif'; c.fillText(t('ranks')[rank], W / 2, 6 * S + fs(20, S) + 2 * S);
  // Day + envelope (right) — anchored BELOW the real button bottom so it never
  // rides up into the mute/help buttons on narrow screens (buttons have a 26px
  // floor, so a scaled offset alone collides at ~360px wide).
  c.textAlign = 'right';
  var ry = hit.mute.y + hit.mute.h + 11 * S;
  c.fillStyle = '#cfe6ff'; c.font = 'bold ' + fs(11, S) + 'px sans-serif'; c.textBaseline = 'middle';
  c.fillText(t('day') + ' ' + day, W - pad, ry);
  c.fillStyle = '#8fe0a0'; c.font = 'bold ' + fs(11, S) + 'px sans-serif';
  c.fillText(t('envelope') + ' ' + servedToday + '/' + quotaToday, W - pad, ry + 15 * S);
  // buttons
  GF.drawMuteIcon(c, hit.mute.x + hit.mute.w / 2, hit.mute.y + hit.mute.h / 2, hit.mute.w * 0.42, GF.muted);
  drawIconBtn(c, hit.help, '?', S);
  // bribe
  if (hit.bribe) {
    var b = hit.bribe;
    var pulse = 0.5 + 0.5 * Math.sin(GF._tt ? GF._tt : Date.now() / 300);
    c.save(); c.shadowColor = 'rgba(255,120,60,' + (0.3 + 0.2 * pulse) + ')'; c.shadowBlur = 12 * S;
    GF.rr(c, b.x, b.y, b.w, b.h, b.h / 2); c.fillStyle = '#7a3320'; c.fill(); c.restore();
    c.strokeStyle = '#ffb07a'; c.lineWidth = 1.5 * S; GF.rr(c, b.x, b.y, b.w, b.h, b.h / 2); c.stroke();
    var blab = t('bribe') + '  -' + money(bribeCost);
    c.fillStyle = '#ffe0c8'; c.font = 'bold ' + fitFont(c, blab, b.w - 20 * S, 11, S) + 'px sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle';
    c.fillText(blab, b.x + b.w / 2, b.y + b.h / 2);
  }
}

function drawMeter(c, x, y, w, h, frac, col, bg) {
  frac = Math.max(0, Math.min(1, frac));
  GF.rr(c, x, y, w, h, h / 2); c.fillStyle = bg; c.fill();
  if (frac > 0.001) { GF.rr(c, x, y, w * frac, h, h / 2); c.fillStyle = col; c.fill(); }
  c.strokeStyle = 'rgba(255,255,255,0.14)'; c.lineWidth = 1; GF.rr(c, x, y, w, h, h / 2); c.stroke();
}

function drawIconBtn(c, r, glyph, S) {
  c.fillStyle = 'rgba(255,255,255,0.08)'; GF.rr(c, r.x, r.y, r.w, r.h, 7 * S); c.fill();
  c.strokeStyle = 'rgba(255,255,255,0.2)'; c.lineWidth = 1; GF.rr(c, r.x, r.y, r.w, r.h, 7 * S); c.stroke();
  c.fillStyle = '#dfe6ee'; c.font = 'bold ' + fs(15, S) + 'px sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle';
  c.fillText(glyph, r.x + r.w / 2, r.y + r.h / 2 + 1);
}

function drawQueue(c, S) {
  for (var i = 0; i < queue.length; i++) {
    var cu = queue[i], r = hit.cust[i]; if (!r) continue;
    var sp = SPECIES[cu.sp];
    var app = cu.appear;
    var ox = cu.shake ? Math.sin(cu.shake * 60) * 3 * S : 0;
    c.save(); c.translate(r.x + r.w / 2 + ox, r.y + r.h / 2); c.globalAlpha = app; c.scale(0.7 + 0.3 * app, 0.7 + 0.3 * app); c.translate(-(r.x + r.w / 2), -(r.y + r.h / 2));
    // card
    var served = canServe(cu);
    GF.rr(c, r.x, r.y, r.w, r.h, 8 * S);
    c.fillStyle = served ? '#2f3a2c' : '#25202b'; c.fill();
    c.strokeStyle = served ? '#7bd88a' : 'rgba(255,255,255,0.12)'; c.lineWidth = served ? 2 * S : 1; c.stroke();
    // animal head — clamp the sprite to the card so it never scales past the card
    // into the top HUD band on wide/landscape frames (Yandex 1.10.3).
    var headSz = Math.min(r.w * 0.5, r.h * 0.25);
    var headDraw = headSz * 2.1;
    drawAnimalHead(c, cu.sp, r.x + r.w / 2, r.y + 4 * S + headDraw / 2, headSz, S);
    // order bubble
    var items = orderList(cu.order);
    var isz = Math.min(r.w * 0.30, 20 * S);
    var totalW = items.length * isz + (items.length - 1) * 3 * S;
    var startX = r.x + r.w / 2 - totalW / 2;
    var oy = r.y + r.h * 0.63;
    c.fillStyle = 'rgba(0,0,0,0.28)'; GF.rr(c, startX - 4 * S, oy - isz / 2 - 3 * S, totalW + 8 * S, isz + 6 * S, 5 * S); c.fill();
    for (var k = 0; k < items.length; k++) drawProductIcon(c, items[k], startX + k * (isz + 3 * S) + isz / 2, oy, isz, cu.wantsPrem, S);
    if (cu.wantsPrem) { c.fillStyle = '#ffd24a'; c.font = 'bold ' + fs(8, S) + 'px sans-serif'; c.textAlign = 'center'; c.textBaseline = 'top'; c.fillText(t('premium'), r.x + r.w / 2, oy + isz * 0.7); }
    // patience ring at bottom
    var pf = cu.pat / cu.patMax;
    var pbW = r.w * 0.8, pbH = 5 * S, pbx = r.x + r.w * 0.1, pby = r.y + r.h - 9 * S;
    drawMeter(c, pbx, pby, pbW, pbH, pf, pf > 0.35 ? '#7bd88a' : '#ff8a5a', '#1c1620');
    // informant warning
    if (sp.informant) { c.fillStyle = '#ff9a6a'; c.font = 'bold ' + fs(8, S) + 'px sans-serif'; c.textAlign = 'center'; c.textBaseline = 'bottom'; c.fillText(GF.lang === 'ru' ? 'без прайма' : 'no prime', r.x + r.w / 2, r.y + r.h - 11 * S); }
    c.restore();
  }
  // comedy barks — speech bubbles over the upper card (drawn on top of all cards)
  for (var bi = 0; bi < queue.length; bi++) {
    var bc = queue[bi], br = hit.cust[bi]; if (!br || !(bc.barkT > 0)) continue;
    var txt = speciesBark(bc.sp, bc.barkIdx || 0); if (!txt) continue;
    var fade = bc.barkT > 2.6 ? (3.0 - bc.barkT) / 0.4 : bc.barkT < 0.45 ? bc.barkT / 0.45 : 1;
    fade = Math.max(0, Math.min(1, fade));
    var fsz = fs(9, S); c.font = 'bold ' + fsz + 'px sans-serif';
    var maxW = Math.min(br.w * 1.45, GF.W * 0.4);
    var words = txt.split(' '), lines = [], cur = '';
    for (var w = 0; w < words.length; w++) { var pr = cur ? cur + ' ' + words[w] : words[w]; if (c.measureText(pr).width > maxW - 14 * S && cur) { lines.push(cur); cur = words[w]; } else cur = pr; }
    if (cur) lines.push(cur);
    if (lines.length > 2) lines = [lines[0], lines.slice(1).join(' ')];
    var lw = 0; for (var li = 0; li < lines.length; li++) lw = Math.max(lw, c.measureText(lines[li]).width);
    var pw = lw + 16 * S, ph = lines.length * (fsz + 3 * S) + 8 * S;
    var pcx = br.x + br.w / 2;
    var px = Math.max(3 * S, Math.min(pcx - pw / 2, GF.W - pw - 3 * S));
    var py = br.y + 3 * S;
    c.save(); c.globalAlpha = fade;
    c.fillStyle = 'rgba(18,14,22,0.92)'; GF.rr(c, px, py, pw, ph, 7 * S); c.fill();
    c.strokeStyle = 'rgba(255,220,150,0.35)'; c.lineWidth = 1; GF.rr(c, px, py, pw, ph, 7 * S); c.stroke();
    c.fillStyle = 'rgba(18,14,22,0.92)'; c.beginPath(); c.moveTo(pcx - 5 * S, py + ph - 1); c.lineTo(pcx + 5 * S, py + ph - 1); c.lineTo(pcx, py + ph + 6 * S); c.fill();
    c.fillStyle = '#ffe6c2'; c.textAlign = 'center'; c.textBaseline = 'top';
    for (var lj = 0; lj < lines.length; lj++) c.fillText(lines[lj], px + pw / 2, py + 4 * S + lj * (fsz + 3 * S));
    c.restore();
  }
}

function drawTray(c, S) {
  var y = L.trTop, h = L.trH, W = L.W;
  c.fillStyle = 'rgba(20,14,18,0.55)'; c.fillRect(0, y, W, h);
  c.fillStyle = '#8a7a6a'; c.font = 'bold ' + fs(9, S) + 'px sans-serif'; c.textAlign = 'left'; c.textBaseline = 'top';
  var cap = trayCap();
  var isz = Math.min(h * 0.66, 34 * S);
  var gap = 5 * S, pad = 10 * S;
  var startX = pad;
  var cy = y + h / 2;
  for (var i = 0; i < cap; i++) {
    var x = startX + i * (isz + gap) + isz / 2;
    if (x + isz / 2 > W - pad) break;
    // slot
    c.fillStyle = 'rgba(255,255,255,0.05)'; GF.rr(c, x - isz / 2, cy - isz / 2, isz, isz, 6 * S); c.fill();
    var tk = tray[i];
    if (tk) drawProductIcon(c, tk.type, x, cy, isz * 0.9, tk.prem, S);
  }
}

function drawStations(c, S) {
  drawStation(c, L.chop, 'chop', S);
  drawStation(c, L.grind, 'grind', S);
  drawStation(c, L.smoke, 'smoke', S);
}

function drawStation(c, r, id, S) {
  var unlocked = stationUnlocked(id);
  GF.rr(c, r.x, r.y, r.w, r.h, 10 * S);
  c.fillStyle = unlocked ? '#33241c' : '#211a1e'; c.fill();
  c.strokeStyle = unlocked ? 'rgba(255,200,150,0.18)' : 'rgba(255,255,255,0.06)'; c.lineWidth = 1; c.stroke();
  var cx = r.x + r.w / 2;
  // label
  c.fillStyle = unlocked ? '#ffd9b0' : '#6a5f66'; c.font = 'bold ' + fs(12, S) + 'px sans-serif'; c.textAlign = 'center'; c.textBaseline = 'top';
  c.fillText(t(id), cx, r.y + 8 * S);
  if (!unlocked) {
    c.fillStyle = '#6a5f66'; c.font = 'bold ' + fs(9, S) + 'px sans-serif';
    c.fillText(t('locked'), cx, r.y + r.h / 2);
    c.fillText(t('day') + ' ' + (id === 'grind' ? 2 : 3), cx, r.y + r.h / 2 + 12 * S);
    return;
  }
  if (id === 'chop') drawChopStation(c, r, S);
  else if (id === 'grind') drawGrindStation(c, r, S);
  else drawSmokeStation(c, r, S);
}

// A wooden working surface that fills the tall station panel; returns the
// board's vertical span so content can center within it.
function drawBoard(c, r, S) {
  var bx = r.x + 8 * S, by = r.y + 30 * S, bw = r.w - 16 * S, bh = r.h - 42 * S;
  GF.rr(c, bx, by, bw, bh, 8 * S); c.fillStyle = '#4a3324'; c.fill();
  c.strokeStyle = 'rgba(0,0,0,0.25)'; c.lineWidth = 1; c.stroke();
  // plank grooves
  c.strokeStyle = 'rgba(0,0,0,0.14)'; c.lineWidth = 1;
  for (var i = 1; i < 3; i++) { c.beginPath(); c.moveTo(bx + (bw / 3) * i, by + 4 * S); c.lineTo(bx + (bw / 3) * i, by + bh - 4 * S); c.stroke(); }
  return { x: bx, y: by, w: bw, h: bh, cx: bx + bw / 2, midY: by + bh / 2 };
}

function drawChopStation(c, r, S) {
  var b = drawBoard(c, r, S), cx = b.cx;
  drawProductIcon(c, 'steak', cx, b.y + b.h * 0.32, Math.min(r.w * 0.6, 52 * S), false, S);
  // timing bar, centered lower on the board
  var bw = b.w * 0.86, bh = 14 * S, bx = cx - bw / 2, by = b.y + b.h * 0.66;
  var sweet = chopSweet();
  var lo = 0.5 - sweet / 2, hi = 0.5 + sweet / 2, ylo = lo - 0.16, yhi = hi + 0.16;
  GF.rr(c, bx, by, bw, bh, bh / 2); c.fillStyle = '#2b1f24'; c.fill();
  c.fillStyle = 'rgba(255,200,80,0.32)'; c.fillRect(bx + ylo * bw, by, (yhi - ylo) * bw, bh);
  c.fillStyle = '#7bd88a'; c.fillRect(bx + lo * bw, by, (hi - lo) * bw, bh);
  var mx = bx + chop.marker * bw;
  c.save(); if (chop.flash > 0) { c.shadowColor = '#fff'; c.shadowBlur = 10 * S * chop.flash; }
  c.fillStyle = '#fff'; c.fillRect(mx - 2 * S, by - 4 * S, 4 * S, bh + 8 * S); c.restore();
  c.fillStyle = '#e6cbb2'; c.font = 'bold ' + fs(10, S) + 'px sans-serif'; c.textAlign = 'center'; c.textBaseline = 'top';
  c.fillText(GF.lang === 'ru' ? 'жми в зелёном' : 'tap in green', cx, by + bh + 8 * S);
}

function drawGrindStation(c, r, S) {
  var b = drawBoard(c, r, S), cx = b.cx;
  drawProductIcon(c, 'sausage', cx, b.y + b.h * 0.32, Math.min(r.w * 0.6, 52 * S), false, S);
  var bw = b.w * 0.78, bh = 16 * S, bx = cx - bw / 2, by = b.y + b.h * 0.64;
  drawMeter(c, bx, by, bw, bh, grind.fill, grind.startT <= GRIND_WINDOW ? '#ffd24a' : '#b9663e', '#2b1f1a');
  c.fillStyle = '#e6cbb2'; c.font = 'bold ' + fs(10, S) + 'px sans-serif'; c.textAlign = 'center'; c.textBaseline = 'top';
  c.fillText(GF.lang === 'ru' ? 'жми быстро' : 'tap fast', cx, by + bh + 8 * S);
}

function drawSmokeStation(c, r, S) {
  var b = drawBoard(c, r, S), cx = b.cx, cy = b.y + b.h * 0.36;
  if (smoke.state === 'empty') {
    c.globalAlpha = 0.4; drawProductIcon(c, 'ham', cx, cy, Math.min(r.w * 0.6, 52 * S), false, S); c.globalAlpha = 1;
    c.fillStyle = '#e6cbb2'; c.font = 'bold ' + fs(10, S) + 'px sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle';
    c.fillText(GF.lang === 'ru' ? 'загрузить' : 'load ham', cx, b.y + b.h * 0.72);
  } else if (smoke.state === 'cooking') {
    // smoke wisps above the ham
    c.strokeStyle = 'rgba(220,210,200,0.4)'; c.lineWidth = 2 * S;
    for (var w = 0; w < 3; w++) { var wx = cx - 12 * S + w * 12 * S; c.beginPath(); c.moveTo(wx, cy - 24 * S); c.quadraticCurveTo(wx + Math.sin(smoke.t * 3 + w) * 6 * S, cy - 36 * S, wx, cy - 48 * S); c.stroke(); }
    drawProductIcon(c, 'ham', cx, cy, Math.min(r.w * 0.6, 52 * S), false, S);
    var pf = smoke.t / SMOKE_TIME;
    var bw = b.w * 0.78, bh = 12 * S, bx = cx - bw / 2, by = b.y + b.h * 0.66;
    drawMeter(c, bx, by, bw, bh, pf, '#e0a050', '#2b1f1a');
  } else if (smoke.state === 'ready') {
    c.save(); c.shadowColor = '#ffd24a'; c.shadowBlur = 16 * S * (0.6 + 0.4 * Math.sin(Date.now() / 150));
    drawProductIcon(c, 'ham', cx, cy, Math.min(r.w * 0.66, 58 * S), true, S); c.restore();
    c.fillStyle = '#ffe08a'; c.font = 'bold ' + fs(12, S) + 'px sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle';
    c.fillText(GF.lang === 'ru' ? 'ЗАБРАТЬ!' : 'COLLECT!', cx, b.y + b.h * 0.72);
  } else {
    c.globalAlpha = 0.6; drawProductIcon(c, 'ham', cx, cy, Math.min(r.w * 0.6, 52 * S), false, S); c.globalAlpha = 1;
    c.fillStyle = '#c9a98a'; c.font = 'bold ' + fs(10, S) + 'px sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle';
    c.fillText(GF.lang === 'ru' ? 'остыл - забрать' : 'cooled - take', cx, b.y + b.h * 0.72);
  }
}

// ── product & animal art (vector, cartoon) ──
function drawProductIcon(c, type, x, y, sz, prem, S) {
  S = S || GF.S;
  var p = PRODUCTS[type]; if (!p) return;
  c.save(); c.translate(x, y);
  if (prem) { c.shadowColor = 'rgba(255,210,74,0.8)'; c.shadowBlur = 8 * S; }
  c.lineJoin = 'round'; c.lineWidth = Math.max(1.5, sz * 0.06);
  c.strokeStyle = p.edge;
  if (type === 'steak') {
    // chunky irregular cut with a pale fat cap + marbling — a flat blob, NO bone
    c.fillStyle = p.color; c.beginPath();
    c.moveTo(-sz * 0.4, -sz * 0.12);
    c.quadraticCurveTo(-sz * 0.46, -sz * 0.36, -sz * 0.06, -sz * 0.34);
    c.quadraticCurveTo(sz * 0.44, -sz * 0.38, sz * 0.4, -sz * 0.02);
    c.quadraticCurveTo(sz * 0.44, sz * 0.36, sz * 0.04, sz * 0.34);
    c.quadraticCurveTo(-sz * 0.46, sz * 0.36, -sz * 0.4, -sz * 0.12);
    c.closePath(); c.fill(); c.stroke();
    c.fillStyle = p.fat; c.beginPath(); c.ellipse(sz * 0.31, sz * 0.0, sz * 0.08, sz * 0.24, 0, 0, Math.PI * 2); c.fill();
    c.strokeStyle = 'rgba(255,255,255,0.26)'; c.lineWidth = Math.max(1, sz * 0.035);
    c.beginPath(); c.moveTo(-sz * 0.22, -sz * 0.05); c.quadraticCurveTo(-sz * 0.02, -sz * 0.16, sz * 0.12, -sz * 0.04); c.stroke();
    c.beginPath(); c.moveTo(-sz * 0.2, sz * 0.12); c.quadraticCurveTo(0, sz * 0.02, sz * 0.1, sz * 0.14); c.stroke();
  } else if (type === 'sausage') {
    // horizontal chain of 3 linked sausages — elongated + segmented
    c.fillStyle = p.color;
    var lx = [-sz * 0.3, 0, sz * 0.3], ly = [sz * 0.07, -sz * 0.07, sz * 0.07];
    for (var i = 0; i < 3; i++) { c.beginPath(); c.ellipse(lx[i], ly[i], sz * 0.2, sz * 0.14, i === 1 ? -0.35 : 0.35, 0, Math.PI * 2); c.fill(); c.stroke(); }
    c.strokeStyle = p.edge; c.lineWidth = Math.max(1.5, sz * 0.05);
    c.beginPath(); c.moveTo(-sz * 0.17, sz * 0.03); c.lineTo(-sz * 0.11, -sz * 0.03); c.moveTo(sz * 0.11, -sz * 0.03); c.lineTo(sz * 0.17, sz * 0.03); c.stroke();
  } else {
    // ham drumstick: round meat end + a protruding white bone handle (distinct silhouette)
    c.save(); c.rotate(-0.26);
    c.strokeStyle = '#f4eee0'; c.lineWidth = sz * 0.14; c.lineCap = 'round';
    c.beginPath(); c.moveTo(0, sz * 0.02); c.lineTo(-sz * 0.42, sz * 0.24); c.stroke();
    c.fillStyle = '#f4eee0'; c.beginPath(); c.arc(-sz * 0.45, sz * 0.26, sz * 0.11, 0, Math.PI * 2); c.fill();
    c.beginPath(); c.arc(-sz * 0.34, sz * 0.14, sz * 0.085, 0, Math.PI * 2); c.fill();
    c.fillStyle = p.color; c.strokeStyle = p.edge; c.lineWidth = Math.max(1.5, sz * 0.06);
    c.beginPath(); c.arc(sz * 0.15, -sz * 0.02, sz * 0.31, 0, Math.PI * 2); c.fill(); c.stroke();
    c.fillStyle = p.fat; c.beginPath(); c.ellipse(sz * 0.24, -sz * 0.06, sz * 0.11, sz * 0.09, 0.3, 0, Math.PI * 2); c.fill();
    c.restore();
  }
  c.restore();
}

function drawAnimalHead(c, spId, x, y, sz, S) {
  var sp = SPECIES[spId];
  // AI sprite if present, else the cartoon vector head (fallback contract).
  GF.drawSprite(sp.sprite || '__none__', x, y, sz * 2.1, function () { drawAnimalVector(c, spId, x, y, sz, S); });
}
function drawAnimalVector(c, spId, x, y, sz, S) {
  var sp = SPECIES[spId];
  c.save(); c.translate(x, y);
  c.lineJoin = 'round'; c.lineWidth = Math.max(1.5, sz * 0.09); c.strokeStyle = 'rgba(0,0,0,0.35)';
  var R = sz * 0.5;
  if (spId === 'rat') {
    c.fillStyle = sp.ear; c.beginPath(); c.arc(-R * 0.7, -R * 0.7, R * 0.42, 0, Math.PI * 2); c.arc(R * 0.7, -R * 0.7, R * 0.42, 0, Math.PI * 2); c.fill();
    c.fillStyle = sp.body; c.beginPath(); c.ellipse(0, 0, R, R * 0.9, 0, 0, Math.PI * 2); c.fill(); c.stroke();
    c.fillStyle = '#e8c4d0'; c.beginPath(); c.moveTo(0, R * 0.1); c.lineTo(-R * 0.16, R * 0.5); c.lineTo(R * 0.16, R * 0.5); c.fill(); // snout
  } else if (spId === 'bear') {
    c.fillStyle = sp.ear; c.beginPath(); c.arc(-R * 0.72, -R * 0.66, R * 0.4, 0, Math.PI * 2); c.arc(R * 0.72, -R * 0.66, R * 0.4, 0, Math.PI * 2); c.fill(); c.stroke();
    c.fillStyle = sp.body; c.beginPath(); c.arc(0, 0, R, 0, Math.PI * 2); c.fill(); c.stroke();
    c.fillStyle = '#c9a878'; c.beginPath(); c.ellipse(0, R * 0.28, R * 0.45, R * 0.34, 0, 0, Math.PI * 2); c.fill();
  } else if (spId === 'hyena') {
    c.fillStyle = sp.ear; c.beginPath(); c.moveTo(-R, -R); c.lineTo(-R * 0.3, -R * 0.5); c.lineTo(-R * 0.55, -R * 0.1); c.fill();
    c.beginPath(); c.moveTo(R, -R); c.lineTo(R * 0.3, -R * 0.5); c.lineTo(R * 0.55, -R * 0.1); c.fill();
    c.fillStyle = sp.body; c.beginPath(); c.ellipse(0, 0, R * 0.92, R, 0, 0, Math.PI * 2); c.fill(); c.stroke();
    c.strokeStyle = '#6a5a3a'; c.lineWidth = Math.max(1, sz * 0.04); c.beginPath(); c.moveTo(-R * 0.4, -R * 0.2); c.lineTo(0, -R * 0.35); c.lineTo(R * 0.4, -R * 0.2); c.stroke();
  } else if (spId === 'pigeon') {
    c.fillStyle = sp.body; c.beginPath(); c.arc(0, 0, R, 0, Math.PI * 2); c.fill(); c.stroke();
    c.fillStyle = '#3a4a6a'; c.beginPath(); c.arc(0, -R * 0.15, R * 0.7, 0, Math.PI * 2); c.fill();
    c.fillStyle = '#e0a030'; c.beginPath(); c.moveTo(0, R * 0.05); c.lineTo(R * 0.5, R * 0.14); c.lineTo(0, R * 0.28); c.fill(); // beak
  } else { // cat (Don Gatto)
    c.fillStyle = sp.ear; c.beginPath(); c.moveTo(-R * 0.9, -R * 0.5); c.lineTo(-R * 0.5, -R * 1.05); c.lineTo(-R * 0.2, -R * 0.5); c.fill();

    c.fillStyle = sp.body; c.beginPath(); c.ellipse(0, 0, R * 1.05, R * 0.92, 0, 0, Math.PI * 2); c.fill(); c.stroke();

}

function drawLevelPips(c, x, y, lvl, max, S) {

function drawBtn(c, x, y, w, h, label, col, S) {
  GF.rr(c, x, y, w, h, h / 2);
  var g = c.createLinearGradient(0, y, 0, y + h);
  g.addColorStop(0, col); g.addColorStop(1, shade(col, -0.2));
  c.fillStyle = g; c.fill();
  c.fillStyle = '#fff'; c.textAlign = 'center'; c.textBaseline = 'middle';
  c.font = 'bold ' + fitFont(c, label, w - 24 * S, 15, S) + 'px sans-serif';
  c.fillText(label, x + w / 2, y + h / 2);
}
// Shrink a label's font (down to 10px floor) until it fits maxW — RU labels run
// +25-40% wider than EN, so every dynamic button label auto-fits its rect.
function fitFont(c, label, maxW, basePx, S) {
  var px = fs(basePx, S);
  c.font = 'bold ' + px + 'px sans-serif';
  while (px > 10 && c.measureText(label).width > maxW) { px--; c.font = 'bold ' + px + 'px sans-serif'; }
  return px;
}
function shade(hex, amt) {
  var n = parseInt(hex.slice(1), 16); var r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  r = Math.max(0, Math.min(255, r + amt * 255 | 0)); g = Math.max(0, Math.min(255, g + amt * 255 | 0)); b = Math.max(0, Math.min(255, b + amt * 255 | 0));
  return 'rgb(' + r + ',' + g + ',' + b + ')';
}

function fs(px, S) { return Math.round(GF.clamp(px * (S || GF.S), Math.max(9, px * 0.6), px * 1.5)); }
function wrapText(c, text, cx, y, maxW, lineH) {
  var words = String(text).split(/\s+/), lines = [], cur = '';
  for (var i = 0; i < words.length; i++) { var probe = cur ? cur + ' ' + words[i] : words[i]; if (c.measureText(probe).width > maxW && cur) { lines.push(cur); cur = words[i]; } else cur = probe; }
  if (cur) lines.push(cur);
  var sy = y - (lines.length - 1) * lineH / 2;
  c.textAlign = 'center';
  for (var j = 0; j < lines.length; j++) c.fillText(lines[j], cx, sy + j * lineH);
}
function wrapText2(c, text, x, y, maxW, lineH) {
  var words = String(text).split(/\s+/), lines = [], cur = '';
  for (var i = 0; i < words.length; i++) { var probe = cur ? cur + ' ' + words[i] : words[i]; if (c.measureText(probe).width > maxW && cur) { lines.push(cur); cur = words[i]; } else cur = probe; }
  if (cur) lines.push(cur);
  c.textAlign = 'left'; c.textBaseline = 'top';
  for (var j = 0; j < lines.length && j < 3; j++) c.fillText(lines[j], x, y + j * lineH);
}

// ════════════════════════════════════════════════════════════════════════════
// INPUT
// ════════════════════════════════════════════════════════════════════════════
function evtXY(e) {
  if (e.touches && e.touches.length) return { x: e.touches[0].clientX, y: e.touches[0].clientY };
  if (e.changedTouches && e.changedTouches.length) return { x: e.changedTouches[0].clientX, y: e.changedTouches[0].clientY };
  return { x: e.clientX, y: e.clientY };
}
function inR(x, y, r) { return r && x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h; }

function onTap(x, y) {
  // tutorial swallows taps it needs (but our stations still act via first-step forgiveness below)
  if (GF.tutorial.active) {
    // let the tutorial highlight/skip logic run; it returns true if consumed the tap
    if (GF.tutorial.handleClick(x, y)) { /* consumed (skip button) */ }
    // continue to station/serve handling so the gated action actually happens
  }

  if (gs === 'MENU') { startGame(); GF.sfx('click'); return; }

  if (gs === 'GAMEOVER') {
    if (hit.revive && inR(x, y, hit.revive)) { doRevive(); return; }
    if (hit.retry && inR(x, y, hit.retry)) {
      if (pendingAd) { pendingAd = false; GF.ads.interstitial(); }
      startGame(); GF.sfx('click'); return;
    }
    return;
  }

  // overlays
  if (overlay === 'DAYEND') {
    if (hit.upg) for (var i = 0; i < hit.upg.length; i++) { if (inR(x, y, hit.upg[i])) { buyUpgrade(hit.upg[i]); return; } }
    if (inR(x, y, hit.dayContinue)) { GF.sfx('click'); continueFromDayEnd(); return; }
    return;
  }
  if (overlay === 'SITDOWN') {
    if (sitdown && sitdown.picked >= 0) { if (sitdown.revealT > 0.4) { overlay = null; sitdown = null; save(); } return; }
    if (hit.dossier) for (var d = 0; d < hit.dossier.length; d++) { if (inR(x, y, hit.dossier[d])) { pickDossier(hit.dossier[d].idx); return; } }
    return;
  }
  if (overlay === 'INSPECT') {
    var st = inspectState; if (st && !st.result) { for (var k = 0; k < st.tokens.length; k++) { if (st.tokens[k]._box && inR(x, y, st.tokens[k]._box)) { tapInspectToken(k); return; } } }
    return;
  }

  // HUD buttons
  if (inR(x, y, hit.mute)) { GF.toggleMute(); GF.sfx('tap'); save(); return; }
  if (inR(x, y, hit.help)) { GF.tutorial.reopen(); GF.sfx('tap'); return; }
  if (hit.bribe && inR(x, y, hit.bribe)) { tryBribe(); return; }

  // First-step forgiveness: while the opening coach ("tap CHOP") is up, any tap
  // below the HUD cuts a steak - no hunting for the exact board (keeps time-to-
  // first-fun instant for new players and the blind boot probe).
  if (GF.tutorial.active && GF.tutorial.step === 0 && y > (L.hudH || 60)) { doChop(); return; }

  // stations
  if (inR(x, y, hit.chop)) { doChop(); return; }
  if (inR(x, y, hit.grind)) { doGrind(); return; }
  if (inR(x, y, hit.smoke)) { doSmoke(); return; }

  // serve a customer
  if (hit.cust) for (var q = 0; q < hit.cust.length; q++) { if (inR(x, y, hit.cust[q])) { serveCustomer(hit.cust[q].idx); return; } }
}

function buyUpgrade(u) {
  if (u.maxed || cash < u.cost) { GF.sfx('error'); return; }
  cash -= u.cost; score = cash; upg[u.id]++;
  GF.sfx('levelup'); GF.juice.flash('rgba(120,220,140,0.2)', 260, 0.35);
  save();
}

function doRevive() {
  if (reviveUsed) return;
  GF.rewardedAd(function () {
    reviveUsed = true;
    respect = Math.max(respect, 55); heat = Math.max(0, heat - 25);
    gs = 'PLAYING'; overlay = null;
    if (queue.length === 0) spawnCustomer(true);
    GF.sfx('levelup'); GF.juice.flash('rgba(120,220,140,0.25)', 320, 0.4);
    save();
  }, function () { /* no-fill / skip: stay on game over */ });
}

var ptr = { down: false, sx: 0, sy: 0, moved: false };
var cv = GF.canvas;
function pDown(x, y) { ptr.down = true; ptr.sx = x; ptr.sy = y; ptr.moved = false; }
function pMove(x, y) { if (!ptr.down) return; if (Math.abs(x - ptr.sx) + Math.abs(y - ptr.sy) > 12) ptr.moved = true; }
function pUp() { if (!ptr.down) return; ptr.down = false; if (!ptr.moved) onTap(ptr.sx, ptr.sy); }
cv.addEventListener('mousedown', function (e) { var p = evtXY(e); pDown(p.x, p.y); });
cv.addEventListener('mousemove', function (e) { if (ptr.down) { var p = evtXY(e); pMove(p.x, p.y); } });
window.addEventListener('mouseup', function () { pUp(); });
cv.addEventListener('touchstart', function (e) { e.preventDefault(); var p = evtXY(e); pDown(p.x, p.y); }, { passive: false });
cv.addEventListener('touchmove', function (e) { e.preventDefault(); var p = evtXY(e); pMove(p.x, p.y); }, { passive: false });
cv.addEventListener('touchend', function (e) { e.preventDefault(); pUp(); }, { passive: false });
document.addEventListener('keydown', function (e) {
  if (gs === 'MENU') { if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); startGame(); } return; }
  if (gs !== 'PLAYING' || overlay) return;
  if (e.code === 'Digit1' || e.code === 'KeyA') { doChop(); }
  else if (e.code === 'Digit2' || e.code === 'KeyS') { doGrind(); }
  else if (e.code === 'Digit3' || e.code === 'KeyD') { doSmoke(); }
  else if (e.code === 'Space') { e.preventDefault(); doChop(); }
});

// ════════════════════════════════════════════════════════════════════════════
// TUTORIAL (interactive, action-gated; demo hand via gf-lib)
// ════════════════════════════════════════════════════════════════════════════
function tutTargetChop() { var r = L.chop; return r ? { x: r.x + r.w / 2, y: r.y + r.h * 0.62, r: r.w * 0.5 } : { x: GF.cx, y: GF.H * 0.8, r: 40 }; }
function tutTargetCust() { var r = hit.cust && hit.cust[0]; return r ? { x: r.x + r.w / 2, y: r.y + r.h / 2, r: r.w * 0.55 } : { x: GF.cx, y: GF.H * 0.3, r: 40 }; }
function startTutorial() {
  GF.tutorial.start([
    { text: t('tut_chop'), target: tutTargetChop, advance: 'manual', gesture: 'tap' },
    { text: t('tut_serve'), target: tutTargetCust, advance: 'manual', gesture: 'tap' },
    { text: t('tut_line'), target: function () { return { x: GF.W / 2, y: GF.H * 0.32, r: 40 }; }, advance: 'auto', after: 3200, gesture: 'tap' }
  ], { storageKey: TUT_KEY });
}

// ════════════════════════════════════════════════════════════════════════════
// BOOT
// ════════════════════════════════════════════════════════════════════════════
GF.init({
  designW: 440, designH: 900,
  strings: STRINGS,
  sprites: SPRITE_NAMES,
  saveKey: SAVE_KEY,
  onReady: function () {
    try { best = parseInt(localStorage.getItem(BEST_KEY) || '0') || 0; } catch (e) {}
    GF.persist(SAVE_KEY, snapshot, restore);
    if (gs === 'PLAYING' && queue.length === 0) gs = 'MENU';
    if (gs === 'GAMEOVER') gs = 'MENU';
    if (gs === 'MENU') overlay = null;

    GF.bgMusic({ file: 'audio/bg_track.mp3', preset: 'synth', muted: GF.muted });

    GF.remoteConfig(SAVE_KEY, CFG, {
      clamps: { 'tuning.speed_mult': [0.5, 2], 'tuning.pay_mult': [0.5, 3] },
      onUpdate: function (cc) { CFG = cc; }
    }).then(function (cc) { CFG = cc; });

    if (window.__GF_AUTOSTART && !window._silent && gs === 'MENU') { startGame(); }
  },
  onUpdate: update,
  onDraw: draw
});

// ════════════════════════════════════════════════════════════════════════════
// TEST HOOKS
// ════════════════════════════════════════════════════════════════════════════
GF.exposeState(function () {
  return {
    gs: gs, overlay: overlay, cash: cash, score: score, best: best,
    respect: Math.round(respect), heat: Math.round(heat), day: day, rank: rank,
    rankName: (STRINGS.en.ranks[rank] || ''),
    queueLen: queue.length, trayLen: tray.length, trayCap: trayCap(),
    servedToday: servedToday, quotaToday: quotaToday, servedTotal: servedTotal,
    smoke: smoke.state, upg: upg, bribeCost: bribeCost
  };
});
GF.exposeBot(
  function () {
    var a = [];
    if (gs === 'MENU') return ['start'];
    if (gs === 'GAMEOVER') return ['start'];
    if (overlay === 'DAYEND') return ['continue_day', 'buy_upgrade'];
    if (overlay === 'SITDOWN') return ['pick_dossier'];
    if (overlay === 'INSPECT') return ['clear_token'];
    a.push('chop');
    if (stationUnlocked('grind')) a.push('grind');
    if (stationUnlocked('smoke')) a.push('smoke');
    // serve any customer we can fulfill
    for (var i = 0; i < queue.length; i++) if (canServe(queue[i])) { a.push('serve'); break; }
    if (heat >= 40 && cash >= bribeCost) a.push('bribe');
    return a;
  },
  function (action) {
    switch (action) {
      case 'start': if (gs === 'MENU' || gs === 'GAMEOVER') startGame(); break;
      case 'chop': doChop(); break;
      case 'grind': doGrind(); break;
      case 'smoke': doSmoke(); break;
      case 'serve': for (var i = 0; i < queue.length; i++) if (canServe(queue[i])) { serveCustomer(i); break; } break;
      case 'bribe': tryBribe(); break;
      case 'continue_day': continueFromDayEnd(); break;
      case 'buy_upgrade': { layout(); if (hit.upg) for (var u = 0; u < hit.upg.length; u++) if (!hit.upg[u].maxed && cash >= hit.upg[u].cost) { buyUpgrade(hit.upg[u]); break; } break; }
      case 'pick_dossier': pickDossier(0); break;
      case 'clear_token': if (inspectState) for (var k = 0; k < inspectState.tokens.length; k++) if (inspectState.tokens[k].flag && !inspectState.tokens[k].cleared) { tapInspectToken(k); break; } break;
    }
  }
);

// Reachability gate hook — single-screen layout, no scroll regions. Every
// interactive rect sits within the viewport by construction (see layout()).
GF.exposeReach(function () {
  // rects are populated by the most recent draw()/layout(); the gate waits a
  // frame after navigating, so we must NOT re-run layout() here (it would wipe
  // the overlay hit-rects that the draw functions set).
  var items = [];
  function add(id, r) { if (r && r.w > 0 && r.h > 0) items.push({ id: id, x: r.x, y: r.y, w: r.w, h: r.h, pinned: true }); }
  var screen = gs === 'MENU' ? 'menu' : gs === 'GAMEOVER' ? 'gameover' : (overlay ? overlay.toLowerCase() : 'counter');
  if (gs === 'MENU') {
    // menuPlay is set during drawMenu; fall back to a centered rect
    add('play', hit.menuPlay || { x: GF.W * 0.15, y: GF.H * 0.72, w: GF.W * 0.7, h: 58 * GF.S });
  } else if (gs === 'GAMEOVER') {
    if (hit.retry) add('retry', hit.retry); if (hit.revive) add('revive', hit.revive);
  } else if (overlay === 'DAYEND') {
    if (hit.upg) for (var i = 0; i < hit.upg.length; i++) add('upg_' + i, hit.upg[i]);
    add('continue', hit.dayContinue);
  } else if (overlay === 'SITDOWN') {
    if (hit.dossier) for (var d = 0; d < hit.dossier.length; d++) add('dossier_' + d, hit.dossier[d]);
  } else if (overlay === 'INSPECT') {
    if (inspectState) for (var k = 0; k < inspectState.tokens.length; k++) if (inspectState.tokens[k]._box) add('token_' + k, inspectState.tokens[k]._box);
  } else {
    add('mute', hit.mute); add('help', hit.help);
    if (hit.bribe) add('bribe', hit.bribe);
    add('chop', hit.chop); add('grind', hit.grind); add('smoke', hit.smoke);
    if (hit.cust) for (var q = 0; q < hit.cust.length; q++) add('cust_' + q, hit.cust[q]);
  }
  return { screen: screen, items: items, viewportH: GF.H, viewportW: GF.W, scrollMaxY: 0 };
});
GF.exposeTour([
  { name: 'menu', go: function () { gs = 'MENU'; overlay = null; } },
  { name: 'counter', go: function () {
      try { localStorage.setItem(TUT_KEY, '1'); } catch (e) {}
      GF.tutorial.active = false; overlay = null; gs = 'PLAYING'; heat = 0; cash = Math.max(cash, 40);
      if (queue.length < 3) { queue = []; for (var i = 0; i < 3; i++) spawnCustomer(true); }
    } },
  { name: 'dayend', go: function () { gs = 'PLAYING'; cash = 900; score = cash; overlay = 'DAYEND'; } },
  { name: 'sitdown', go: function () { gs = 'PLAYING'; startSitdown(); } },
  { name: 'inspect', go: function () { gs = 'PLAYING'; startInspection(); } },
  { name: 'gameover', go: function () { overlay = null; gs = 'GAMEOVER'; goReason = 'fish'; score = Math.max(score, 120); } }
]);

// Screenshot / harness hooks
window._setupForScreenshot = function (n) {
  try { localStorage.setItem(TUT_KEY, '1'); } catch (e) {}
  GF.tutorial.active = false;
  overlay = null; inspectState = null; sitdown = null;
  n = n || 1;
  // build a busy, mid-service counter
  gs = 'PLAYING';
  day = 3 + (n % 4); rank = 2; cash = 640 + n * 120; score = cash;
  quotaToday = DAY_QUOTA_BASE + (day - 1) * DAY_QUOTA_PER; servedToday = Math.min(quotaToday - 2, 3);
  respect = 82; heat = day >= 3 ? 46 : 0;
  upg = { cleaver: 1, grinder: 1, fridge: 1, smoker: 0, decor: 1 };
  // tray of mixed cuts
  tray = [{ type: 'steak', prem: true }, { type: 'steak', prem: false }, { type: 'sausage', prem: true }, { type: 'ham', prem: true }, { type: 'sausage', prem: false }];
  // full-ish queue of varied mobsters with orders
  queue = [];
  var setups = [
    { sp: 'bear', order: { steak: 2 }, pat: 0.7 },
    { sp: 'rat', order: { sausage: 1 }, pat: 0.9 },
    { sp: 'hyena', order: { steak: 1, ham: 1 }, pat: 0.45 },
    { sp: 'cat', order: { steak: 1, sausage: 1 }, pat: 0.8, wp: true },
    { sp: 'rat', order: { ham: 1 }, pat: 0.6 }
  ];
  var cnt = n === 2 ? 5 : n === 3 ? 4 : n >= 4 ? 5 : 3;
  for (var i = 0; i < cnt; i++) {
    var su = setups[i % setups.length]; var sp = SPECIES[su.sp];
    var pm = patienceFor(day) * sp.patMult;
    queue.push({ sp: su.sp, order: su.order, wantsPrem: !!su.wp, pat: pm * su.pat, patMax: pm, appear: 1, spawnT: 0, leaving: 0, barkIdx: (i % 2), barkT: (i === 0 ? 2.4 : 0) });
  }
  // active station flavor
  smoke.state = n === 2 ? 'ready' : 'cooking'; smoke.t = n === 2 ? 0 : 3.2;
  chop.marker = 0.5; grind.active = (n === 4); grind.fill = 0.55;
  GF.juice.particles.burst(GF.cx, GF.H * 0.5, { color: '#ffd24a', count: 10 });
};
window._jumpLevel = function (n) {
  if (n >= 99) { overlay = null; gs = 'GAMEOVER'; goReason = (n === 98 ? 'raid' : 'fish'); score = Math.max(score, cash, 120); best = Math.max(best, score); return; }
  window._setupForScreenshot(n || 1);
  gs = 'PLAYING';
};
window._setState = function (s) { if (s === 'PLAYING') gs = 'PLAYING'; else if (s === 'GAMEOVER' || s === 'GAME_OVER') { gs = 'GAMEOVER'; } else if (s === 'MENU') gs = 'MENU'; return gs; };
window.render_game_to_text = function () {
  return JSON.stringify({ mode: 'meat_the_family', gs: gs, overlay: overlay, cash: cash, respect: Math.round(respect), heat: Math.round(heat), day: day, rank: rank, queueLen: queue.length, trayLen: tray.length, smoke: smoke.state });
};

})();
</script>
