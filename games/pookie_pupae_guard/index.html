(function() {
'use strict';

// ════════════════════════════════════════════════════════════════════════

//  Boop cute bugs, place hatched pookie guardians, survive endless waves.
// ════════════════════════════════════════════════════════════════════════

    tut_goal: 'Цель: береги созревающие коконы во всех волнах.',
    tut_controls: 'Жми жучка - шпуняй. Жми ветку - ставь пуки.',
    tut_win: 'Бесконечно - продержись как можно дольше.',
    tut_lose: 'Поражение, когда радость сада падает до нуля.',
    tut_tip: 'Кокон, переживший волну, выводит хранителя бесплатно!',
    t_boop: 'Нажми жучка, чтобы шпунуть его!',
    t_place: 'Нажми место на ветке, чтобы поставить хранителя.',
    t_hatch: 'Переживи волну - кокон выведет пуки!',
  },
};

var SPRITE_NAMES = ['cocoon', 'guardian', 'ant', 'wasp'];

var CFG = {
  tuning: { speed_mult: 1, price_mult: 1 },
  events: { double_coins: false },
  daily:  { seed: 0 },
  motd:   { en: '', ru: '' },
  version: 0,
};

// ── TUNABLES (DESIGN.md) ─────────────────────────────────────────────────
var JOY_MAX = 100;
var JOY_PER_COCOON = 22;
var COCOON_HP = 100;
var BOOP_CD = 0.45;
var BOOP_KNOCK = 90;
var SLOTS_PER_LANE = 2;
var GUARD_BASE_COST = 12;
var GUARD_COST_STEP = 1.35;
var UPGRADE_BASE_COST = 18;
var UPGRADE_COST_STEP = 1.6;
var COIN_PER_BUG = 3;
var WAVE_CLEAR_BONUS = 8;
var START_LANES = 3;
var MAX_LANES = 4;
var FOURTH_LANE_WAVE = 6;

// Hitboxes (design units)
var BUG_R = 26, WASP_R = 24, TAP_PAD = 18;
var COCOON_R = 34, GUARD_R = 30;

// ── GAME STATE ───────────────────────────────────────────────────────────
var gs = 'MENU';                 // MENU | PLAYING | GAMEOVER
var best = 0;                    // best wave reached (persisted)
var wave = 1, score = 0, coins = 0, joy = JOY_MAX;
var breather = false;            // between-wave sub-state of PLAYING
var lanes = [];                  // [{ x, cocoon, slots:[guardian|null,...] }]
var pests = [];                  // active enemies
var shots = [];                  // thrower acorns
var spawnQueue = [];             // [{ type, lane, at }] pending spawns for this wave
var animT = 0;                   // free-running animation clock (seconds)
var pestsTotalThisWave = 0;      // for the progress bar
var boopCd = 0;
var joyFlash = 0;                // red-flash timer when a cocoon is hurt
var unlockedGuardians = ['throw']; // grows: throw -> aura(w4) -> splash(w5); persisted
var picker = null;               // { laneIdx, slotIdx } when build panel open
var banner = null;               // { text, t } transient wave banner
var cursor = { x: 0, y: 0 };     // desktop free-aim convenience
var firstUpgradeDone = false, firstDeathDone = false;
var tutManualT = 0;              // grace timer so a manual tutorial step can't soft-lock
var bot = { mode: null };        // drives tutorial gating for the probe

// Layout rects (recomputed in layout())
var R = { mute: null, help: null, nextwave: null, watch: null, pickerClose: null, pickerRows: [] };
var topPad = 0, laneTopY = 0, laneBottomY = 0;

// ── GUARDIAN DEFS ────────────────────────────────────────────────────────
// level 1..3; effect scales with level. tint over the shared guardian sprite.
// Guardian tints live in the COOL teal/blue/lavender family - deliberately OFF
// the pest palette (red/orange ant, sage-green beetle, yellow wasp, purple
// queen) so "my guardian" reads instantly vs an advancing pest, even mid-wave.
// Each TYPE also gets an unmistakable prop/silhouette (drawn in drawPookie).
var GUARD_DEFS = {
  throw: { key: 'throw', name: 'g_throw', desc: 'g_throw_d', tint: '#2ec4b6', accent: '#1a8f86',
           cd: 1.05, range: 230, dmg: 1 },
  aura:  { key: 'aura',  name: 'g_aura',  desc: 'g_aura_d',  tint: '#8aa0ff', accent: '#5b6fd6',
           radius: 150, slow: 0.45 },
  splash:{ key: 'splash',name: 'g_splash',desc: 'g_splash_d',tint: '#46cfe6', accent: '#2596ad',
           cd: 1.8, radius: 95, knock: 70 },
};

// ── PEST DEFS ────────────────────────────────────────────────────────────
function pestDef(type) {
  if (type === 'ant')    return { hp: 1,  speed: 40, bite: 12, r: BUG_R,  fly: false, armor: 1,   coin: COIN_PER_BUG };
  if (type === 'beetle') return { hp: 3,  speed: 28, bite: 16, r: BUG_R+3,fly: false, armor: 0.5, coin: COIN_PER_BUG+2 };
  if (type === 'wasp')   return { hp: 2,  speed: 54, bite: 13, r: WASP_R, fly: true,  armor: 1,   coin: COIN_PER_BUG+2 };
  if (type === 'queen')  return { hp: 18, speed: 20, bite: 20, r: BUG_R+12,fly: false, armor: 0.6, coin: 28, boss: true };
  return { hp: 1, speed: 40, bite: 12, r: BUG_R, fly: false, armor: 1, coin: COIN_PER_BUG };
}

// ════════════════════════════════════════════════════════════════════════
//  LAYOUT
// ════════════════════════════════════════════════════════════════════════
// Capacity deepens with progress so there's always a next purchase to want
// (mirrors window.__gfEcon): a new lane ~every 5 waves up to MAX_LANES, +1 build
// slot per lane ~every 6 waves, and the guardian level cap climbs every 3 waves.
function laneCount() { return Math.min(MAX_LANES, START_LANES + Math.floor((wave - 1) / 5)); }
function slotsPerLane() { return Math.min(4, SLOTS_PER_LANE + Math.floor(wave / 6)); }
function levelCap() { return 3 + Math.floor(wave / 3); }

function layout() {
  var W = GF.W, H = GF.H, S = GF.S;
  topPad = Math.max(54 * S, H * 0.085);
  laneTopY = topPad + 64 * S;          // cocoons hang just under the HUD
  laneBottomY = H - 96 * S;            // bugs enter from the bottom band
  var n = lanes.length || laneCount();
  var margin = W * 0.07;
  var usable = W - margin * 2;
  for (var i = 0; i < lanes.length; i++) {
    lanes[i].x = margin + usable * ((i + 0.5) / lanes.length);
  }
  // HUD buttons
  var btn = 38 * S;
  R.mute = { x: W - btn - 10 * S, y: 10 * S, w: btn, h: btn };
  R.help = { x: W - btn * 2 - 18 * S, y: 10 * S, w: btn, h: btn };
  var nw = Math.min(260 * S, W * 0.62), nh = 54 * S;
  R.nextwave = { x: GF.cx - nw / 2, y: H - nh - 26 * S, w: nw, h: nh };
  R.watch = { x: GF.cx - nw / 2, y: H - nh - 26 * S, w: nw, h: nh };
}

function buildLanes() {
  lanes = [];
  var n = laneCount(), per = slotsPerLane();
  for (var i = 0; i < n; i++) {
    lanes.push({ x: 0, cocoon: { hp: COCOON_HP, alive: true, ripen: 0, hatchPulse: 0 },
                 slots: new Array(per).fill(null) });
  }
  layout();
}

// grow lane count + per-lane slots to match the current wave (called on wave advance)
function growCapacity() {
  while (lanes.length < laneCount()) {
    lanes.push({ x: 0, cocoon: { hp: COCOON_HP, alive: true, ripen: 0, hatchPulse: 0 }, slots: new Array(slotsPerLane()).fill(null) });
  }
  var per = slotsPerLane();
  for (var i = 0; i < lanes.length; i++) {
    while (lanes[i].slots.length < per) lanes[i].slots.push(null);
  }
  layout();
}

function slotPos(laneIdx, slotIdx) {
  var lane = lanes[laneIdx];
  var n = lane.slots.length || SLOTS_PER_LANE;
  var span = laneBottomY - (laneTopY + 70 * GF.S);
  var y = laneTopY + 80 * GF.S + span * ((slotIdx + 0.5) / n);
  return { x: lane.x, y: y };
}

// ════════════════════════════════════════════════════════════════════════
//  LIFECYCLE
// ════════════════════════════════════════════════════════════════════════
function startGame() {
  wave = 1; score = 0; coins = 14; joy = JOY_MAX;
  breather = false; pests = []; shots = []; spawnQueue = [];
  boopCd = 0; joyFlash = 0; picker = null; banner = null;
  firstUpgradeDone = false; firstDeathDone = false;
  // keep unlockedGuardians across runs (persisted roster); ensure at least thrower
  if (!unlockedGuardians || !unlockedGuardians.length) unlockedGuardians = ['throw'];
  buildLanes();
  gs = 'PLAYING';
  startWave();
  GF.gameStarted();
  GF.saveRun();
  maybeTutorial();
}

function gameOver() {
  if (gs === 'GAMEOVER') return;
  var newBest = wave > best;
  if (newBest) { best = wave; try { localStorage.setItem('pookie_pupae_guard_best', best); } catch (e) {} }
  gs = 'GAMEOVER';
  picker = null;
  if (!firstDeathDone) { firstDeathDone = true; }
  GF.sfx('lose');
  GF.juice.shake(10, 320);
  GF.gameEnded();
  GF.saveRun();
  if (newBest && best > 1) GF.happytime();
}

// Screenshot/QA fast-forward.
//   n>=90  -> drive straight to GAMEOVER (terminal-state reachability gate)
//   3..89  -> busy mid-wave (the >=70%-gameplay promo frame)
//   else   -> clean start
window._jumpLevel = function(n) {
  if (n != null && n >= 90) { startGame(); GF.tutorial.active = false; joy = 0; gameOver(); return; }
  if (n != null && n >= 3) { window._setupForScreenshot(n); return; }
  startGame();
};

// Drop straight into a busy mid-wave for screenshots (multiple pests + guardians).
window._setupForScreenshot = function(lvl) {
  window._silent = true;
  try { localStorage.setItem('pookie_pupae_guard_seen_tutorial', '1'); } catch (e) {}
  unlockedGuardians = ['throw', 'aura', 'splash'];
  wave = Math.max(5, lvl || 5);
  score = 240; coins = 38; joy = 76;
  breather = false; picker = null; banner = null;
  buildLanes();
  gs = 'PLAYING';
  GF.tutorial.active = false;
  // place a varied, leveled roster across the lanes
  placeGuardian(0, 0, 'throw', true);
  placeGuardian(0, 1, 'aura', true);
  placeGuardian(1, 0, 'splash', true);
  if (lanes[2]) placeGuardian(2, 1, 'throw', true);
  if (lanes[0].slots[0]) lanes[0].slots[0].level = 3;
  if (lanes[1].slots[0]) lanes[1].slots[0].level = 2;
  // ripen + dent a couple cocoons for visual interest (HP rings show)
  lanes[1].cocoon.hp = 58;
  if (lanes[2]) lanes[2].cocoon.hp = 80;
  // seed a lively wave spread across the mid-screen band with mixed pest types
  spawnQueue = [];
  pests = [];
  var span = laneBottomY - (laneTopY + 90 * GF.S);
  for (var i = 0; i < lanes.length; i++) {
    var a1 = spawnPestAt('ant', i, laneTopY + 90 * GF.S + span * 0.28);
    var a2 = spawnPestAt('ant', i, laneTopY + 90 * GF.S + span * 0.62);
    if (i % 2 === 0) spawnPestAt('beetle', i, laneTopY + 90 * GF.S + span * 0.45);
  }
  spawnPestAt('wasp', 1, laneTopY + 90 * GF.S + span * 0.2);
  if (lanes[2]) spawnPestAt('wasp', 2, laneTopY + 90 * GF.S + span * 0.5);
  // a couple of acorns + puff particles in flight for energy
  shots.push({ x: lanes[0].x, y: laneTopY + 140 * GF.S, vx: 18 * GF.S, vy: -240 * GF.S, lane: 0, dmg: 1, t: 0 });
  if (lanes[2]) shots.push({ x: lanes[2].x, y: laneTopY + 200 * GF.S, vx: -14 * GF.S, vy: -240 * GF.S, lane: 2, dmg: 1, t: 0 });
  GF.juice.particles.burst(lanes[1].x, laneTopY + 120 * GF.S, { count: 14, colors: ['#ffe08a', '#fff', '#ffd6f0'], speed: 150, life: 0.9, size: 5 });
};

// helper: spawn a pest already positioned at a given y (for screenshots)
function spawnPestAt(type, laneIdx, y) {
  spawnPest(type, laneIdx);
  var p = pests[pests.length - 1];
  p.y = y;
  return p;
}

// ════════════════════════════════════════════════════════════════════════
//  WAVES
// ════════════════════════════════════════════════════════════════════════
function startWave() {
  breather = false;
  spawnQueue = [];
  banner = null;
  update._acc = 0;
  var nLanes = lanes.length;
  // pacing: cadence tightens with wave; count climbs. Always enough ants to
  // threaten every lane (an ignored garden must fall) plus a growing surplus.
  var t = 0.4;
  var antBase = nLanes + Math.floor(wave * 1.3) + 1;
  var gap = Math.max(0.5, 1.5 - wave * 0.07);  // seconds between spawns
  var i;
  for (i = 0; i < antBase; i++) {
    spawnQueue.push({ type: 'ant', lane: (i % nLanes), at: t }); t += gap;
  }
  if (wave >= 3) {
    var beetles = 1 + Math.floor((wave - 3) * 0.6);
    for (i = 0; i < beetles; i++) { spawnQueue.push({ type: 'beetle', lane: ((i + 1) % nLanes), at: t }); t += gap * 1.4; }
  }
  if (wave >= 5) {
    var wasps = 1 + Math.floor((wave - 5) * 0.5);
    for (i = 0; i < wasps; i++) { spawnQueue.push({ type: 'wasp', lane: ((i * 2) % nLanes), at: t }); t += gap * 1.1; }
  }
  if (wave % 5 === 0) {
    spawnQueue.push({ type: 'queen', lane: Math.floor(nLanes / 2), at: t + 0.4 }); t += 1.5;
  }
  pestsTotalThisWave = spawnQueue.length;
}

function spawnPest(type, laneIdx) {
  var d = pestDef(type);
  var lane = lanes[laneIdx];
  var jitter = (Math.random() - 0.5) * 26 * GF.S;
  pests.push({
    type: type, lane: laneIdx, def: d,
    x: lane.x + jitter, y: laneBottomY + 30 * GF.S,
    hp: d.hp, maxhp: d.hp, r: d.r, fly: d.fly,
    biteCd: 0, slowT: 0, hitFlash: 0, wob: Math.random() * 6.28,
    bossBoopCd: 0, knockY: 0,
  });
}

function waveCleared() {
  // hatch every surviving cocoon into a guardian (fills an empty slot if any)
  var hatched = 0;
  for (var i = 0; i < lanes.length; i++) {
    var ln = lanes[i];
    if (!ln.cocoon.alive) continue;
    var emptyIdx = ln.slots.indexOf(null);
    var type = unlockedGuardians[Math.floor(Math.random() * unlockedGuardians.length)];
    if (emptyIdx >= 0) {
      ln.slots[emptyIdx] = makeGuardian(type);
      hatched++;
      var sp = slotPos(i, emptyIdx);
      GF.juice.particles.burst(sp.x, sp.y, { count: 22, color: '#ffd6f0', colors: ['#ffd6f0', '#c4f0c8', '#fff2b0'], speed: 220, life: 0.8, size: 6 });
    }
    ln.cocoon.hatchPulse = 1;
    // re-ripen the cocoon for the next wave
    ln.cocoon.hp = COCOON_HP;
  }
  // unlock new guardian types by wave milestone (persisted roster grows)
  if (wave >= 4 && unlockedGuardians.indexOf('aura') < 0) unlockedGuardians.push('aura');
  if (wave >= 5 && unlockedGuardians.indexOf('splash') < 0) unlockedGuardians.push('splash');

  coins += WAVE_CLEAR_BONUS + wave;
  score += WAVE_CLEAR_BONUS + wave * 2;
  banner = { text: GF.t('clearedbanner') + (hatched ? '  ' + GF.t('hatched') : ''), t: 0 };
  breather = true;
  GF.sfx('levelup');
  GF.happytime && (wave % 5 === 0) && GF.happytime();
  GF.saveRun();
}

function makeGuardian(type) {
  return { type: type, level: 1, cd: 0, anim: 0 };
}

// place/upgrade cost curves (scale with how many you already own / its level)
function ownedGuardianCount() {
  var n = 0;
  for (var i = 0; i < lanes.length; i++) for (var s = 0; s < lanes[i].slots.length; s++) if (lanes[i].slots[s]) n++;
  return n;
}
function placeCost() {
  var pm = (CFG.tuning && CFG.tuning.price_mult) || 1;
  return Math.round(GUARD_BASE_COST * Math.pow(GUARD_COST_STEP, ownedGuardianCount()) * pm);
}
function upgradeCost(g) {
  var pm = (CFG.tuning && CFG.tuning.price_mult) || 1;
  return Math.round(UPGRADE_BASE_COST * Math.pow(UPGRADE_COST_STEP, (g.level - 1)) * pm);
}

function placeGuardian(laneIdx, slotIdx, type, free) {
  var lane = lanes[laneIdx];
  if (!lane || lane.slots[slotIdx]) return false;
  var cost = placeCost();
  if (!free) {
    if (coins < cost) { GF.sfx('error'); return false; }
    coins -= cost;
  }
  lane.slots[slotIdx] = makeGuardian(type);
  var sp = slotPos(laneIdx, slotIdx);
  GF.juice.particles.burst(sp.x, sp.y, { count: 14, color: GUARD_DEFS[type].tint, speed: 160, life: 0.55, size: 5 });
  GF.sfx('spawn');
  if (!firstUpgradeDone) { firstUpgradeDone = true; }
  GF.saveRun();
  return true;
}

function upgradeGuardian(laneIdx, slotIdx) {
  var g = lanes[laneIdx].slots[slotIdx];
  if (!g || g.level >= levelCap()) { GF.sfx('error'); return false; }
  var cost = upgradeCost(g);
  if (coins < cost) { GF.sfx('error'); return false; }
  coins -= cost;
  g.level++;
  var sp = slotPos(laneIdx, slotIdx);
  GF.juice.particles.burst(sp.x, sp.y, { count: 16, color: GUARD_DEFS[g.type].tint, colors: ['#fff2b0', GUARD_DEFS[g.type].tint], speed: 180, life: 0.6, size: 5 });
  GF.sfx('evolve');
  if (!firstUpgradeDone) { firstUpgradeDone = true; }
  GF.saveRun();
  return true;
}

// ════════════════════════════════════════════════════════════════════════
//  TUTORIAL (action-gated demo hand)
// ════════════════════════════════════════════════════════════════════════
function maybeTutorial() {
  if (window._silent) return;
  var started = GF.tutorial.start([
    { text: GF.t('t_boop'),
      target: function () {
        var p = pests[0];
        if (!p) return { x: lanes[0].x, y: laneBottomY - 40 * GF.S, r: BUG_R * GF.S };
        return { x: p.x, y: p.y, r: (p.r + 8) * GF.S };
      },
      advance: 'manual' },
    { text: GF.t('t_place'),
      target: function () { var sp = slotPos(0, SLOTS_PER_LANE - 1); return { x: sp.x, y: sp.y, r: 40 * GF.S }; },
      advance: 'manual' },
    { text: GF.t('t_hatch'), advance: 'auto', after: 2600 },
  ], { storageKey: 'pookie_pupae_guard_seen_tutorial' });
  if (started) bot.mode = 'tut';
}

function reopenTutorial() {
  GF.tutorial.start([
    { text: GF.t('t_boop'), advance: 'auto', after: 2200 },
    { text: GF.t('t_place'), advance: 'auto', after: 2200 },
    { text: GF.t('t_hatch'), advance: 'auto', after: 2200 },
  ], { storageKey: 'pookie_pupae_guard_seen_tutorial', force: true });
}

// ════════════════════════════════════════════════════════════════════════
//  UPDATE
// ════════════════════════════════════════════════════════════════════════
function update(dt) {
  animT += dt;
  GF.juice.update(dt);
  if (banner) { banner.t += dt; if (banner.t > 2.2) banner = null; }
  if (joyFlash > 0) joyFlash -= dt;
  for (var i = 0; i < lanes.length; i++) {
    var cc = lanes[i].cocoon;
    cc.ripen += dt * 0.5;
    if (cc.hatchPulse > 0) cc.hatchPulse -= dt * 1.4;
  }

  GF.tutorial.update(dt);
  // Safety: action-gated (manual) steps advance on the real action, but an idle
  // player (or a gate's missed taps) must not soft-lock the frozen world - auto-
  // advance a manual step after a grace window so the run always progresses.
  if (GF.tutorial.active) {
    var stp = GF.tutorial.steps[GF.tutorial.step];
    if (stp && stp.advance === 'manual') {
      tutManualT += dt;
      if (tutManualT > 4) { tutManualT = 0; GF.tutorial.next(); }
    } else { tutManualT = 0; }
  } else { tutManualT = 0; }

  if (gs !== 'PLAYING') return;
  if (boopCd > 0) boopCd -= dt;

  // desktop free-aim convenience (never required)
  var nx = 0, ny = 0;
  if (GF.keys['ArrowLeft'] || GF.keys['KeyA']) nx -= 1;
  if (GF.keys['ArrowRight'] || GF.keys['KeyD']) nx += 1;
  if (GF.keys['ArrowUp'] || GF.keys['KeyW']) ny -= 1;
  if (GF.keys['ArrowDown'] || GF.keys['KeyS']) ny += 1;
  if (nx || ny) { cursor.x = GF.clamp(cursor.x + nx * 360 * dt * GF.S, 0, GF.W); cursor.y = GF.clamp(cursor.y + ny * 360 * dt * GF.S, 0, GF.H); }

  if (breather) return; // between waves: world paused, await Next Wave

  // During the coach the world still moves (so the lone ant is there to boop),
  // but it is NO-FAIL: bites deal no joy/HP damage until the tutorial ends.
  var noFail = GF.tutorial.active;

  // ── spawn from queue (frame-time accumulator since wave start) ──
  update._acc = (update._acc || 0) + dt;
  var elapsed = update._acc;
  for (var q = spawnQueue.length - 1; q >= 0; q--) {
    if (elapsed >= spawnQueue[q].at) {
      spawnPest(spawnQueue[q].type, spawnQueue[q].lane);
      spawnQueue.splice(q, 1);
    }
  }

  updatePests(dt, noFail);
  updateGuardians(dt);
  updateShots(dt);

  // ── wave clear check (never mid-coach) ──
  if (!noFail && spawnQueue.length === 0 && pests.length === 0 && !breather) {
    waveCleared();
    wave++;
    growCapacity();  // new lanes / build slots unlock as waves climb
    update._acc = 0;
  }

  // ── lose check ──
  if (joy <= 0) { joy = 0; gameOver(); }
}

function aliveCocoons() {
  var n = 0;
  for (var i = 0; i < lanes.length; i++) if (lanes[i].cocoon.alive) n++;
  return n;
}

function updatePests(dt, noFail) {
  var sm = (CFG.tuning && CFG.tuning.speed_mult) || 1;
  for (var i = pests.length - 1; i >= 0; i--) {
    var p = pests[i];
    if (p.hitFlash > 0) p.hitFlash -= dt;
    p.wob += dt * 6;
    if (p.knockY > 0) { p.y += p.knockY * dt; p.knockY *= 0.86; if (p.knockY < 4) p.knockY = 0; }
    if (p.bossBoopCd > 0) p.bossBoopCd -= dt;

    var lane = lanes[p.lane];
    var cc = lane ? lane.cocoon : null;
    // re-target: if this lane's cocoon is gone, march toward the nearest still-
    // alive cocoon so an ignored garden keeps losing cocoons until joy hits 0.
    if (!cc || !cc.alive) {
      var nearest = -1, nd = 1e9;
      for (var L = 0; L < lanes.length; L++) {
        if (lanes[L].cocoon.alive) { var d = Math.abs(lanes[L].x - p.x); if (d < nd) { nd = d; nearest = L; } }
      }
      if (nearest >= 0) { p.lane = nearest; lane = lanes[nearest]; cc = lane.cocoon;
        // glide horizontally toward the new lane
        p.x += GF.clamp(lane.x - p.x, -p.def.speed * GF.S * dt, p.def.speed * GF.S * dt);
      }
    }
    var slowFactor = (p.slowT > 0) ? 0.5 : 1;
    if (p.slowT > 0) p.slowT -= dt;

    // during the coach, hold the ant a little below the cocoon so it stays
    // mid-lane and tappable, and never let it bite (no-fail).
    var targetY = laneTopY + 8 * GF.S + (noFail ? 120 * GF.S : 0);
    if (cc && cc.alive && p.y > targetY) {
      p.y -= p.def.speed * sm * slowFactor * GF.S * dt * (p.knockY > 0 ? 0.2 : 1);
    } else if (cc && cc.alive && !noFail) {
      // at the cocoon - nibble
      p.biteCd -= dt;
      if (p.biteCd <= 0) {
        p.biteCd = 0.65;
        cc.hp -= p.def.bite;
        joy -= p.def.bite * 0.6;
        joyFlash = 0.35;
        GF.juice.shake(5, 140);
        GF.juice.flash('rgba(255,120,150,0.18)', 140);
        GF.sfx('hit');
        GF.juice.particles.burst(cc === lane.cocoon ? lane.x : p.x, targetY, { count: 6, color: '#ff9ab0', speed: 90, life: 0.4, size: 4 });
        if (cc.hp <= 0) {
          cc.alive = false;
          joy -= JOY_PER_COCOON;
          joyFlash = 0.6;
          GF.juice.shake(12, 300);
          GF.juice.particles.burst(lane.x, targetY, { count: 20, color: '#cdbfe6', speed: 160, life: 0.7, size: 5 });
          GF.sfx('hurt');
        }
      }
    }
  }
  // garden lost if every cocoon is gone
  if (aliveCocoons() <= 0) { joy = 0; gameOver(); }
}

function updateGuardians(dt) {
  for (var i = 0; i < lanes.length; i++) {
    var lane = lanes[i];
    for (var s = 0; s < lane.slots.length; s++) {
      var g = lane.slots[s];
      if (!g) continue;
      g.anim += dt;
      var def = GUARD_DEFS[g.type];
      var pos = slotPos(i, s);
      if (g.type === 'throw') {
        g.cd -= dt;
        if (g.cd <= 0) {
          // nearest pest in this lane, above the guardian
          var tgt = null, bestD = 1e9;
          for (var k = 0; k < pests.length; k++) {
            var p = pests[k];
            if (p.lane !== i) continue;
            var d = pos.y - p.y;
            if (d < 0) continue;
            if (d < bestD) { bestD = d; tgt = p; }
          }
          if (tgt) {
            g.cd = Math.max(0.4, def.cd - (g.level - 1) * 0.22);
            var dx = tgt.x - pos.x, dy = tgt.y - pos.y;
            var dd = Math.max(1, Math.sqrt(dx * dx + dy * dy));
            var sp = 320 * GF.S;
            shots.push({ x: pos.x, y: pos.y - 18 * GF.S, vx: dx / dd * sp, vy: dy / dd * sp, lane: i, dmg: def.dmg + (g.level - 1), t: 0 });
            GF.sfx('tap');
          }
        }
      } else if (g.type === 'aura') {
        var rad = (def.radius + (g.level - 1) * 30) * GF.S;
        for (var a = 0; a < pests.length; a++) {
          var pp = pests[a];
          if (pp.lane !== i) continue;
          var ddx = pp.x - pos.x, ddy = pp.y - pos.y;
          if (ddx * ddx + ddy * ddy <= rad * rad) pp.slowT = 0.2;
        }
      } else if (g.type === 'splash') {
        g.cd -= dt;
        if (g.cd <= 0) {
          var any = false;
          var sr = (def.radius + (g.level - 1) * 22) * GF.S;
          for (var b = 0; b < pests.length; b++) {
            var ps = pests[b];
            var sdx = ps.x - pos.x, sdy = ps.y - pos.y;
            if (sdx * sdx + sdy * sdy <= sr * sr) {
              any = true;
              hitPest(ps, 1, true);
            }
          }
          if (any) {
            g.cd = Math.max(0.8, def.cd - (g.level - 1) * 0.3);
            GF.juice.particles.burst(pos.x, pos.y, { count: 12, color: def.tint, speed: 150, life: 0.5, size: 5 });
            GF.sfx('pickup');
          }
        }
      }
    }
  }
}

function updateShots(dt) {
  for (var i = shots.length - 1; i >= 0; i--) {
    var sh = shots[i];
    sh.x += sh.vx * dt; sh.y += sh.vy * dt; sh.t += dt;
    var hit = false;
    for (var k = 0; k < pests.length; k++) {
      var p = pests[k];
      if (p.lane !== sh.lane) continue;
      var dx = p.x - sh.x, dy = p.y - sh.y;
      var rr = (p.r + 8) * GF.S;
      if (dx * dx + dy * dy <= rr * rr) { hitPest(p, sh.dmg, false); hit = true; break; }
    }
    if (hit || sh.t > 2.2 || sh.y < -40 * GF.S || sh.x < -40 || sh.x > GF.W + 40) shots.splice(i, 1);
  }
}

// damage/boop a pest; shoo it off (knockback + puff) when hp depleted
function hitPest(p, dmg, isSplash) {
  if (!p || p._dead) return;
  var eff = dmg * (p.def.armor || 1);
  p.hp -= eff;
  p.hitFlash = 0.12;
  p.knockY = (isSplash ? 50 : 30) * GF.S;
  GF.juice.particles.burst(p.x, p.y, { count: 5, color: '#fff', speed: 90, life: 0.3, size: 3 });
  if (p.hp <= 0) shooPest(p);
  else GF.sfx('tap');
}

function shooPest(p) {
  if (p._dead) return;
  p._dead = true;
  var idx = pests.indexOf(p);
  if (idx >= 0) pests.splice(idx, 1);
  var gain = p.def.coin;
  if (CFG.events && CFG.events.double_coins) gain *= 2;
  coins += gain; score += gain;
  GF.juice.particles.burst(p.x, p.y, { count: 14, color: '#ffe08a', colors: ['#ffe08a', '#fff', '#ffd6f0'], speed: 180, life: 0.6, size: 5 });
  GF.juice.floatText(p.x, p.y - 10 * GF.S, '+' + gain, { color: '#ffd34d', size: 16, life: 0.8, rise: 40 });
  GF.sfx('coin');
}

// ════════════════════════════════════════════════════════════════════════
//  INPUT
// ════════════════════════════════════════════════════════════════════════
function inRect(b, x, y) { return b && x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h; }

function toGame(e) {
  var rct = GF.canvas.getBoundingClientRect();
  var cx = (e.clientX != null) ? e.clientX : (e.touches && e.touches[0] ? e.touches[0].clientX : 0);
  var cy = (e.clientY != null) ? e.clientY : (e.touches && e.touches[0] ? e.touches[0].clientY : 0);
  return { x: (cx - rct.left) * (GF.canvas.width / rct.width), y: (cy - rct.top) * (GF.canvas.height / rct.height) };
}

function onPress(x, y) {
  cursor.x = x; cursor.y = y;
  // tutorial swallows first (and we manually advance from real actions below)
  if (GF.tutorial.active) {
    if (GF.tutorial.handleClick(x, y)) {
      // even while the coach is up, let the real action happen so it teaches by doing
    }
  }
  // mute everywhere
  if (inRect(R.mute, x, y)) { GF.toggleMute(); GF.persist && GF.saveRun(); return; }

  if (gs === 'MENU') { if (GF.checkButtons) { /* overlay handles via its own click */ } return; }
  if (gs === 'GAMEOVER') { return; } // overlay button handles retry

  // help button
  if (inRect(R.help, x, y)) { reopenTutorial(); return; }

  // build picker open?
  if (picker) { onPickerPress(x, y); return; }

  // dead-broke "watch for coins" (user click only) during breather
  if (breather && coins < cheapestAction() && inRect(R.watch, x, y)) {
    GF.rewardedAd(function () { coins += 25; GF.sfx('reward'); GF.saveRun(); });
    return;
  }
  // next-wave button (breather)
  if (breather && inRect(R.nextwave, x, y)) {
    breather = false; wave = wave; startWave(); update._acc = 0; GF.sfx('click'); GF.saveRun();
    return;
  }

  var onStep0 = GF.tutorial.active && GF.tutorial.step === 0; // "boop a bug"
  var onStep1 = GF.tutorial.active && GF.tutorial.step === 1; // "place a guardian"

  // 1) tap a bug to boop it
  if (boopCd <= 0) {
    var best = null, bestD = 1e9;
    for (var i = 0; i < pests.length; i++) {
      var p = pests[i];
      var dx = p.x - x, dy = p.y - y;
      var rr = (p.r + TAP_PAD) * GF.S;
      var d2 = dx * dx + dy * dy;
      if (d2 <= rr * rr && d2 < bestD) { bestD = d2; best = p; }
    }
    if (best) {
      doBoop(best);
      if (onStep0) GF.tutorial.next();
      return;
    }
  }
  // During the boop coach, any tap in the play area advances the step so the
  // player is never stuck if they miss the small bug (the hand showed the move).
  if (onStep0 && y > topPad) { GF.tutorial.next(); return; }

  // 2) place coach (step 1): teach by DOING - any play-area tap drops a FREE
  // thrower in the highlighted slot (no modal during the tutorial, so the coach
  // and the build-picker never overlap), then advances.
  if (onStep1 && y > topPad) {
    var tl = 0, ts = SLOTS_PER_LANE - 1;
    var hit = slotAt(x, y);
    if (hit) { tl = hit.laneIdx; ts = hit.slotIdx; }
    if (lanes[tl].slots[ts]) { tl = 0; ts = lanes[0].slots.indexOf(null); if (ts < 0) ts = 0; }
    placeGuardian(tl, ts, 'throw', true);
    GF.tutorial.next();
    return;
  }

  // 3) tap a branch slot to place / a guardian to upgrade (normal play)
  if (!GF.tutorial.active) {
    var slot = slotAt(x, y);
    if (slot) {
      picker = { laneIdx: slot.laneIdx, slotIdx: slot.slotIdx };
      GF.sfx('click');
      return;
    }
  }
}

function doBoop(p) {
  boopCd = BOOP_CD;
  // bosses shrug a boop unless their cooldown allows
  if (p.def.boss && p.bossBoopCd > 0) {
    GF.juice.particles.burst(p.x, p.y, { count: 4, color: '#fff', speed: 70, life: 0.25, size: 3 });
    GF.sfx('click');
    p.knockY = 18 * GF.S;
    return;
  }
  if (p.def.boss) p.bossBoopCd = 0.8;
  var dmg = 1 * (p.def.armor || 1);
  p.hp -= dmg * 1.0;
  p.knockY = BOOP_KNOCK * GF.S * (p.def.boss ? 0.3 : 1);
  p.hitFlash = 0.14;
  GF.juice.punch && GF.juice.punch(p, 'r', 4, 160);
  GF.juice.particles.burst(p.x, p.y, { count: 8, color: '#fff', colors: ['#fff', '#ffe9c0'], speed: 120, life: 0.4, size: 4 });
  if (p.hp <= 0) shooPest(p);
  else GF.sfx('tap');
}

function slotAt(x, y) {
  var box = 64 * GF.S;
  for (var i = 0; i < lanes.length; i++) {
    for (var s = 0; s < lanes[i].slots.length; s++) {
      var sp = slotPos(i, s);
      if (Math.abs(x - sp.x) <= box / 2 && Math.abs(y - sp.y) <= box / 2) return { laneIdx: i, slotIdx: s };
    }
  }
  return null;
}

function cheapestAction() {
  // cheapest thing the player could want right now (for dead-broke detection)
  var c = placeCost();
  for (var i = 0; i < lanes.length; i++) for (var s = 0; s < lanes[i].slots.length; s++) {
    var g = lanes[i].slots[s];
    if (g && g.level < levelCap()) c = Math.min(c, upgradeCost(g));
  }
  return c;
}

// ── build picker interaction ──
function onPickerPress(x, y) {
  if (inRect(R.pickerClose, x, y)) { picker = null; GF.sfx('click'); return; }
  for (var i = 0; i < R.pickerRows.length; i++) {
    var row = R.pickerRows[i];
    if (inRect(row, x, y)) {
      if (row.action === 'place') {
        if (placeGuardian(picker.laneIdx, picker.slotIdx, row.gtype)) picker = null;
      } else if (row.action === 'upgrade') {
        upgradeGuardian(picker.laneIdx, picker.slotIdx);
      }
      return;
    }
  }
  // tap outside panel closes
  if (R.pickerPanel && !inRect(R.pickerPanel, x, y)) { picker = null; }
}

// ════════════════════════════════════════════════════════════════════════
//  DRAW
// ════════════════════════════════════════════════════════════════════════
function draw(ctx) {
  var W = GF.W, H = GF.H, S = GF.S;
  drawGarden(ctx, W, H, S);

  if (gs === 'PLAYING') {
    drawLanesAndCocoons(ctx, S);
    drawGuardians(ctx, S);
    drawPests(ctx, S);
    drawShots(ctx, S);
    GF.juice.particles.draw(ctx);
    GF.juice.texts.draw(ctx);
    drawHUD(ctx, W, H, S);
    if (breather && !GF.tutorial.active) drawBreather(ctx, W, H, S);
    if (banner) drawBanner(ctx, W, H, S);
    if (picker && !GF.tutorial.active) drawPicker(ctx, W, H, S);
    drawCursor(ctx, S);
  } else {
    // menu/gameover still show the garden behind the overlay
    drawLanesAndCocoons(ctx, S);
    GF.juice.particles.draw(ctx);
  }

  GF.juice.drawFlash(ctx);
  GF.tutorial.draw(ctx);

  if (gs === 'MENU') {
    GF.drawOverlay({ title: GF.t('title'), sub: GF.t('sub'), btnText: GF.t('play'), btnFn: startGame,
                     bestText: best > 0 ? GF.t('best') + ': ' + best : null });
  }
  if (gs === 'GAMEOVER') {
    GF.drawOverlay({ title: GF.t('gameover'), sub: GF.t('wave') + ' ' + wave + '  ·  ' + GF.t('coins') + ' ' + score,
                     btnText: GF.t('retry'), btnFn: startGame, bestText: GF.t('best') + ': ' + best });
  }
}

function drawGarden(ctx, W, H, S) {
  // warm storybook gradient - saturated mint up top easing to blush at the
  // bottom, matching the cover (was a washed-out near-white middle).
  var g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#bdeccb');
  g.addColorStop(0.4, '#d7f3d2');
  g.addColorStop(0.72, '#fbe7d6');
  g.addColorStop(1, '#ffd9e6');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // warm sun glow from the top
  var sun = ctx.createRadialGradient(W * 0.5, -H * 0.08, 10, W * 0.5, -H * 0.08, H * 0.65);
  sun.addColorStop(0, 'rgba(255,243,176,0.7)'); sun.addColorStop(1, 'rgba(255,243,176,0)');
  ctx.fillStyle = sun; ctx.fillRect(0, 0, W, H);
  // soft blossom bokeh
  ctx.save();
  for (var i = 0; i < 11; i++) {
    var bx = ((i * 97) % 100) / 100 * W;
    var by = ((i * 53) % 100) / 100 * H * 0.92;
    ctx.globalAlpha = 0.12 + (i % 3) * 0.05;
    ctx.fillStyle = i % 3 === 0 ? '#ffd1e6' : (i % 3 === 1 ? '#fff2ad' : '#c7f0c2');
    ctx.beginPath(); ctx.arc(bx, by, (11 + (i % 4) * 7) * S, 0, 6.28); ctx.fill();
  }
  ctx.restore();
  // cozy grass ground band with a darker lip + little tufts
  var gy = laneBottomY + 14 * S;
  var gg = ctx.createLinearGradient(0, gy, 0, H);
  gg.addColorStop(0, 'rgba(150,205,150,0.65)'); gg.addColorStop(1, 'rgba(120,180,124,0.85)');
  ctx.fillStyle = gg; ctx.fillRect(0, gy, W, H - gy);
  ctx.strokeStyle = 'rgba(96,150,96,0.5)'; ctx.lineWidth = 2 * S; ctx.lineCap = 'round';
  for (var tt = 0; tt < W; tt += 26 * S) {
    var jx = tt + Math.sin(tt) * 4 * S;
    ctx.beginPath(); ctx.moveTo(jx, gy + 2 * S); ctx.lineTo(jx - 4 * S, gy - 7 * S); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(jx, gy + 2 * S); ctx.lineTo(jx + 4 * S, gy - 8 * S); ctx.stroke();
  }
}

// a small flower (used for per-lane garden bands + planted slot bases)
function drawFlower(ctx, x, y, r, petal, S) {
  ctx.save();
  ctx.fillStyle = petal;
  for (var k = 0; k < 5; k++) {
    var a = k / 5 * 6.28;
    ctx.beginPath(); ctx.ellipse(x + Math.cos(a) * r * 0.7, y + Math.sin(a) * r * 0.7, r * 0.5, r * 0.32, a, 0, 6.28); ctx.fill();
  }
  ctx.fillStyle = '#ffe08a';
  ctx.beginPath(); ctx.arc(x, y, r * 0.4, 0, 6.28); ctx.fill();
  ctx.restore();
}

function drawLanesAndCocoons(ctx, S) {
  for (var i = 0; i < lanes.length; i++) {
    var lane = lanes[i];
    // warm woody branch stem down the lane
    ctx.strokeStyle = 'rgba(150,112,86,0.8)';
    ctx.lineWidth = 11 * S; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(lane.x, laneTopY - 26 * S); ctx.lineTo(lane.x, laneBottomY); ctx.stroke();
    // a highlight stripe on the branch for a glossy storybook look
    ctx.strokeStyle = 'rgba(196,156,120,0.5)'; ctx.lineWidth = 3 * S;
    ctx.beginPath(); ctx.moveTo(lane.x - 2.5 * S, laneTopY - 20 * S); ctx.lineTo(lane.x - 2.5 * S, laneBottomY - 8 * S); ctx.stroke();
    // leaves + little flowers along the stem (cozy garden dressing)
    drawLeaf(ctx, lane.x, laneTopY + 44 * S, 16 * S, -0.5);
    drawLeaf(ctx, lane.x, laneBottomY - 56 * S, 18 * S, 2.6);
    drawFlower(ctx, lane.x - 16 * S, laneTopY + 120 * S, 9 * S, (i % 2 ? '#ffc6e0' : '#fff0a8'), S);
    drawFlower(ctx, lane.x + 17 * S, laneBottomY - 130 * S, 8 * S, (i % 2 ? '#fff0a8' : '#c8b6ff'), S);
    // slot bases
    for (var s = 0; s < lane.slots.length; s++) {
      var sp = slotPos(i, s);
      if (lane.slots[s]) {
        // OCCUPIED: a planted leafy pot mound so the guardian reads instantly
        drawPlanter(ctx, sp.x, sp.y + 20 * S, 26 * S, S);
      } else {
        // EMPTY: faint dashed pad with a +
        ctx.save();
        ctx.globalAlpha = 0.4 + 0.15 * Math.sin(animT * 2.5 + i + s);
        ctx.strokeStyle = '#7a9d6a'; ctx.lineWidth = 2.5 * S; ctx.setLineDash([5 * S, 5 * S]);
        ctx.beginPath(); ctx.arc(sp.x, sp.y, 24 * S, 0, 6.28); ctx.stroke();
        ctx.setLineDash([]);
        ctx.fillStyle = '#7a9d6a'; ctx.font = 'bold ' + (26 * S) + 'px sans-serif';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText('+', sp.x, sp.y + 1 * S);
        ctx.restore();
      }
    }
    // cocoon
    drawCocoon(ctx, lane, i, S);
  }
}

// a little planted pot + leaves the guardian sits in (occupied-slot base)
function drawPlanter(ctx, x, y, r, S) {
  ctx.save();
  // leaves peeking out behind
  ctx.fillStyle = '#8fc98a';
  ctx.beginPath(); ctx.ellipse(x - r * 0.7, y - r * 0.3, r * 0.5, r * 0.24, -0.7, 0, 6.28); ctx.fill();
  ctx.beginPath(); ctx.ellipse(x + r * 0.7, y - r * 0.3, r * 0.5, r * 0.24, 0.7, 0, 6.28); ctx.fill();
  // soil mound
  ctx.fillStyle = '#7a5230';
  ctx.beginPath(); ctx.ellipse(x, y - r * 0.45, r * 0.66, r * 0.3, 0, 0, 6.28); ctx.fill();
  // terracotta pot
  var g = ctx.createLinearGradient(x, y - r * 0.5, x, y + r * 0.5);
  g.addColorStop(0, '#e08a5a'); g.addColorStop(1, '#c06a3e');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.moveTo(x - r * 0.7, y - r * 0.4); ctx.lineTo(x + r * 0.7, y - r * 0.4);
  ctx.lineTo(x + r * 0.5, y + r * 0.55); ctx.lineTo(x - r * 0.5, y + r * 0.55); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#ec9568';
  GF.rr(ctx, x - r * 0.76, y - r * 0.5, r * 1.52, r * 0.2, r * 0.07); ctx.fill();   // pot rim
  ctx.restore();
}

function drawLeaf(ctx, x, y, r, rot) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
  ctx.fillStyle = '#9ccc8f';
  ctx.beginPath(); ctx.ellipse(r * 0.9, 0, r, r * 0.5, 0, 0, 6.28); ctx.fill();
  ctx.strokeStyle = 'rgba(90,140,80,0.6)'; ctx.lineWidth = 1.4;
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(r * 1.8, 0); ctx.stroke();
  ctx.restore();
}

function drawCocoon(ctx, lane, i, S) {
  var cc = lane.cocoon;
  var x = lane.x, y = laneTopY;
  if (!cc.alive) {
    // empty hook + a little broken-shell hint
    ctx.strokeStyle = 'rgba(120,120,120,0.4)'; ctx.lineWidth = 3 * S;
    ctx.beginPath(); ctx.arc(x, y, 10 * S, 0, Math.PI); ctx.stroke();
    return;
  }
  var pulse = cc.hatchPulse > 0 ? (1 + 0.12 * cc.hatchPulse) : 1;
  var r = COCOON_R * S * pulse;
  // thread to branch
  ctx.strokeStyle = 'rgba(180,200,160,0.8)'; ctx.lineWidth = 2 * S;
  ctx.beginPath(); ctx.moveTo(x, laneTopY - 30 * S); ctx.lineTo(x, y - r * 0.7); ctx.stroke();
  // glow when ripe
  ctx.save();
  ctx.shadowColor = 'rgba(255,236,179,0.9)'; ctx.shadowBlur = (10 + 6 * Math.sin(cc.ripen)) * S;
  if (GF.sprites && GF.sprites.cocoon) {
    GF.drawSprite('cocoon', x, y, r * 2.1, null);
  } else {
    // vector fuzzy cocoon
    var grad = ctx.createLinearGradient(x, y - r, x, y + r);
    grad.addColorStop(0, '#fff3c4'); grad.addColorStop(1, '#ffd98e');
    ctx.fillStyle = grad;
    ctx.beginPath(); ctx.ellipse(x, y, r * 0.78, r, 0, 0, 6.28); ctx.fill();
    // fuzzy ridges
    ctx.strokeStyle = 'rgba(214,162,90,0.5)'; ctx.lineWidth = 2 * S;
    for (var k = -2; k <= 2; k++) {
      ctx.beginPath(); ctx.ellipse(x, y + k * r * 0.32, r * 0.66, r * 0.18, 0, 0, 6.28); ctx.stroke();
    }
    // sweet face
    ctx.fillStyle = '#5b4a2e';
    ctx.beginPath(); ctx.arc(x - r * 0.24, y - r * 0.1, r * 0.09, 0, 6.28); ctx.fill();
    ctx.beginPath(); ctx.arc(x + r * 0.24, y - r * 0.1, r * 0.09, 0, 6.28); ctx.fill();
    ctx.fillStyle = 'rgba(255,150,170,0.7)';
    ctx.beginPath(); ctx.arc(x - r * 0.32, y + r * 0.06, r * 0.08, 0, 6.28); ctx.fill();
    ctx.beginPath(); ctx.arc(x + r * 0.32, y + r * 0.06, r * 0.08, 0, 6.28); ctx.fill();
    ctx.strokeStyle = '#5b4a2e'; ctx.lineWidth = 1.6 * S;
    ctx.beginPath(); ctx.arc(x, y + r * 0.04, r * 0.12, 0.15 * Math.PI, 0.85 * Math.PI); ctx.stroke();
  }
  ctx.restore();
  // hp ring
  var frac = GF.clamp(cc.hp / COCOON_HP, 0, 1);
  ctx.lineWidth = 4 * S; ctx.lineCap = 'round';
  ctx.strokeStyle = 'rgba(255,255,255,0.5)';
  ctx.beginPath(); ctx.arc(x, y, r + 5 * S, -Math.PI / 2, Math.PI * 1.5); ctx.stroke();
  ctx.strokeStyle = frac > 0.5 ? '#7ad17a' : (frac > 0.25 ? '#ffc24d' : '#ff7a90');
  ctx.beginPath(); ctx.arc(x, y, r + 5 * S, -Math.PI / 2, -Math.PI / 2 + frac * Math.PI * 2); ctx.stroke();
}

function drawGuardians(ctx, S) {
  for (var i = 0; i < lanes.length; i++) {
    for (var s = 0; s < lanes[i].slots.length; s++) {
      var g = lanes[i].slots[s];
      if (!g) continue;
      var sp = slotPos(i, s);
      var def = GUARD_DEFS[g.type];
      // aura ring
      if (g.type === 'aura') {
        ctx.save();
        ctx.globalAlpha = 0.16;
        ctx.fillStyle = def.tint;
        ctx.beginPath(); ctx.arc(sp.x, sp.y, (def.radius + (g.level - 1) * 30) * S, 0, 6.28); ctx.fill();
        ctx.restore();
      }
      var bob = Math.sin(g.anim * 3 + i) * 2 * S;
      drawPookie(ctx, sp.x, sp.y + bob, GUARD_R * S, def.tint, g, S);
      // level pips
      for (var lv = 0; lv < g.level; lv++) {
        ctx.fillStyle = '#ffd34d';
        ctx.beginPath(); ctx.arc(sp.x - 10 * S + lv * 10 * S, sp.y + GUARD_R * S + 6 * S, 3.2 * S, 0, 6.28); ctx.fill();
      }
    }
  }
}

// a round adorable pookie guardian, drawn vector (tinted) with a type accessory
function drawPookie(ctx, x, y, r, tint, g, S) {
  var type = g ? g.type : 'throw';
  var def = GUARD_DEFS[type] || GUARD_DEFS.throw;
  var accent = def.accent || '#1a8f86';
  ctx.save();

  // ── aura: a soft pulsing halo ring overhead (its identity is the ring) ──
  if (type === 'aura') {
    var ph = 0.5 + 0.5 * Math.sin(animT * 3);
    ctx.save();
    ctx.globalAlpha = 0.5 + 0.3 * ph;
    ctx.strokeStyle = tint; ctx.lineWidth = (3 + 1.5 * ph) * S;
    ctx.beginPath(); ctx.ellipse(x, y - r * 1.18, r * (0.5 + 0.08 * ph), r * (0.18 + 0.03 * ph), 0, 0, 6.28); ctx.stroke();
    ctx.restore();
  }

  // ── body: shared sprite washed to the TYPE colour, or a vector pookie ──
  if (GF.sprites && GF.sprites.guardian) {
    ctx.shadowColor = tint; ctx.shadowBlur = 12 * S;
    GF.drawSprite('guardian', x, y, r * 2.2, null);
    ctx.shadowColor = 'transparent';
    // colour wash so the teal sprite reads clearly as THIS type's colour
    ctx.save();
    ctx.globalCompositeOperation = 'source-atop';
    ctx.globalAlpha = 0.5;
    var wash = ctx.createRadialGradient(x - r * 0.3, y - r * 0.35, r * 0.2, x, y, r * 1.05);
    wash.addColorStop(0, 'rgba(255,255,255,0.25)'); wash.addColorStop(1, tint);
    ctx.fillStyle = wash;
    ctx.beginPath(); ctx.arc(x, y, r * 1.05, 0, 6.28); ctx.fill();
    ctx.restore();
  } else {
    var grad = ctx.createRadialGradient(x - r * 0.3, y - r * 0.3, r * 0.2, x, y, r);
    grad.addColorStop(0, '#ffffff'); grad.addColorStop(1, tint);
    ctx.fillStyle = grad;
    ctx.beginPath(); ctx.arc(x, y, r, 0, 6.28); ctx.fill();
    ctx.fillStyle = tint;
    ctx.beginPath(); ctx.arc(x - r * 0.6, y - r * 0.7, r * 0.3, 0, 6.28); ctx.fill();
    ctx.beginPath(); ctx.arc(x + r * 0.6, y - r * 0.7, r * 0.3, 0, 6.28); ctx.fill();
    ctx.fillStyle = '#3a2e4a';
    ctx.beginPath(); ctx.arc(x - r * 0.28, y - r * 0.05, r * 0.16, 0, 6.28); ctx.fill();
    ctx.beginPath(); ctx.arc(x + r * 0.28, y - r * 0.05, r * 0.16, 0, 6.28); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(x - r * 0.23, y - r * 0.1, r * 0.06, 0, 6.28); ctx.fill();
    ctx.beginPath(); ctx.arc(x + r * 0.33, y - r * 0.1, r * 0.06, 0, 6.28); ctx.fill();
    ctx.fillStyle = 'rgba(255,150,170,0.6)';
    ctx.beginPath(); ctx.arc(x - r * 0.45, y + r * 0.18, r * 0.13, 0, 6.28); ctx.fill();
    ctx.beginPath(); ctx.arc(x + r * 0.45, y + r * 0.18, r * 0.13, 0, 6.28); ctx.fill();
    ctx.strokeStyle = '#3a2e4a'; ctx.lineWidth = 1.8 * S;
    ctx.beginPath(); ctx.arc(x, y + r * 0.1, r * 0.22, 0.12 * Math.PI, 0.88 * Math.PI); ctx.stroke();
  }

  // ── bold per-TYPE prop (the at-a-glance silhouette tell) ──
  if (type === 'throw') {
    // a chunky acorn held in a little arm on the right
    ctx.strokeStyle = accent; ctx.lineWidth = 4 * S; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(x + r * 0.5, y + r * 0.05); ctx.lineTo(x + r * 0.92, y - r * 0.28); ctx.stroke();
    var ax = x + r * 1.02, ay = y - r * 0.42, ar = r * 0.34;
    ctx.fillStyle = '#b07a4a';
    ctx.beginPath(); ctx.ellipse(ax, ay + ar * 0.25, ar, ar * 1.05, 0, 0, 6.28); ctx.fill();
    ctx.fillStyle = '#7a5230';                              // acorn cap
    ctx.beginPath(); ctx.ellipse(ax, ay - ar * 0.55, ar * 1.05, ar * 0.6, 0, 0, 6.28); ctx.fill();
    ctx.fillStyle = '#5e3d22';
    ctx.beginPath(); ctx.arc(ax, ay - ar * 1.05, ar * 0.16, 0, 6.28); ctx.fill();
  } else if (type === 'splash') {
    // a watering-can spout + droplets above the head
    ctx.fillStyle = accent;
    GF.rr(ctx, x - r * 0.34, y - r * 1.5, r * 0.68, r * 0.42, r * 0.16); ctx.fill();   // can body
    ctx.beginPath();                                                                     // spout
    ctx.moveTo(x + r * 0.3, y - r * 1.4); ctx.lineTo(x + r * 0.85, y - r * 1.62);
    ctx.lineTo(x + r * 0.85, y - r * 1.46); ctx.lineTo(x + r * 0.34, y - r * 1.2); ctx.closePath(); ctx.fill();
    var dphase = (animT * 1.6) % 1;
    ctx.fillStyle = '#bfefff';
    for (var d = 0; d < 3; d++) {
      var dy = y - r * 1.4 + (dphase + d * 0.33) % 1 * r * 1.1;
      ctx.beginPath(); ctx.arc(x + r * (0.75 + d * 0.12), dy, r * 0.1, 0, 6.28); ctx.fill();
    }
  } else if (type === 'aura') {
    // a little crescent-moon "sleepy" charm on the forehead
    ctx.fillStyle = '#fff7c0';
    ctx.beginPath(); ctx.arc(x, y - r * 0.72, r * 0.2, 0, 6.28); ctx.fill();
    ctx.fillStyle = tint;
    ctx.beginPath(); ctx.arc(x + r * 0.07, y - r * 0.75, r * 0.18, 0, 6.28); ctx.fill();
    // tiny "z z" sleep marks
    ctx.fillStyle = '#fff'; ctx.font = 'bold ' + (r * 0.4) + 'px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.globalAlpha = 0.6 + 0.4 * Math.sin(animT * 3);
    ctx.fillText('z', x + r * 0.8, y - r * 0.7);
    ctx.globalAlpha = 1;
  }
  ctx.restore();
}

function drawPests(ctx, S) {
  for (var i = 0; i < pests.length; i++) {
    var p = pests[i];
    var x = p.x, y = p.y;
    var wob = Math.sin(p.wob) * 2 * S;
    ctx.save();
    if (p.hitFlash > 0) { ctx.globalAlpha = 0.6 + 0.4 * Math.sin(p.hitFlash * 60); }
    // shadow on ground for non-flyers
    if (!p.fly) {
      ctx.fillStyle = 'rgba(80,90,70,0.18)';
      ctx.beginPath(); ctx.ellipse(x, y + p.r * S * 0.7, p.r * S * 0.7, p.r * S * 0.28, 0, 0, 6.28); ctx.fill();
    }
    if (p.type === 'wasp') drawWasp(ctx, x, y + wob, p.r * S, S);
    else if (p.type === 'queen') drawBug(ctx, x, y + wob, p.r * S, '#c98aff', '#7a4fb0', S, true);
    else if (p.type === 'beetle') drawBug(ctx, x, y + wob, p.r * S, '#a4d4a0', '#5e8c5a', S, false);
    else drawBug(ctx, x, y + wob, p.r * S, '#ffb3a7', '#c96a5a', S, false);
    ctx.restore();
    // hp pips for tanky pests
    if (p.maxhp > 1) {
      var pw = p.r * S * 1.4, px = x - pw / 2, py = y - p.r * S - 8 * S;
      ctx.fillStyle = 'rgba(0,0,0,0.18)'; GF.rr(ctx, px, py, pw, 4 * S, 2 * S); ctx.fill();
      ctx.fillStyle = '#ff8aa0'; GF.rr(ctx, px, py, pw * GF.clamp(p.hp / p.maxhp, 0, 1), 4 * S, 2 * S); ctx.fill();
    }
  }
}

function drawBug(ctx, x, y, r, body, dark, S, big) {
  // legs
  ctx.strokeStyle = dark; ctx.lineWidth = 2.2 * S; ctx.lineCap = 'round';
  for (var k = -1; k <= 1; k++) {
    ctx.beginPath(); ctx.moveTo(x - r * 0.5, y + k * r * 0.3); ctx.lineTo(x - r * 1.0, y + k * r * 0.3 - r * 0.15); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x + r * 0.5, y + k * r * 0.3); ctx.lineTo(x + r * 1.0, y + k * r * 0.3 - r * 0.15); ctx.stroke();
  }
  // body
  var grad = ctx.createRadialGradient(x - r * 0.3, y - r * 0.3, r * 0.2, x, y, r);
  grad.addColorStop(0, '#ffffff'); grad.addColorStop(0.4, body); grad.addColorStop(1, dark);
  ctx.fillStyle = grad;
  ctx.beginPath(); ctx.ellipse(x, y, r * 0.92, r, 0, 0, 6.28); ctx.fill();
  if (big) { // crown for the queen
    ctx.fillStyle = '#ffd34d';
    ctx.beginPath();
    ctx.moveTo(x - r * 0.5, y - r * 0.9); ctx.lineTo(x - r * 0.5, y - r * 1.3); ctx.lineTo(x - r * 0.2, y - r * 1.05);
    ctx.lineTo(x, y - r * 1.35); ctx.lineTo(x + r * 0.2, y - r * 1.05); ctx.lineTo(x + r * 0.5, y - r * 1.3);
    ctx.lineTo(x + r * 0.5, y - r * 0.9); ctx.closePath(); ctx.fill();
  }
  // googly eyes
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(x - r * 0.3, y - r * 0.2, r * 0.28, 0, 6.28); ctx.fill();
  ctx.beginPath(); ctx.arc(x + r * 0.3, y - r * 0.2, r * 0.28, 0, 6.28); ctx.fill();
  ctx.fillStyle = '#2a2333';
  var ed = Math.sin(animT * 1000 / 300) * r * 0.06;
  ctx.beginPath(); ctx.arc(x - r * 0.3 + ed, y - r * 0.16, r * 0.13, 0, 6.28); ctx.fill();
  ctx.beginPath(); ctx.arc(x + r * 0.3 + ed, y - r * 0.16, r * 0.13, 0, 6.28); ctx.fill();
  // cheeky smile
  ctx.strokeStyle = dark; ctx.lineWidth = 1.8 * S;
  ctx.beginPath(); ctx.arc(x, y + r * 0.3, r * 0.22, 0.1 * Math.PI, 0.9 * Math.PI); ctx.stroke();
  // antennae
  ctx.strokeStyle = dark; ctx.lineWidth = 1.6 * S;
  ctx.beginPath(); ctx.moveTo(x - r * 0.2, y - r * 0.7); ctx.lineTo(x - r * 0.4, y - r * 1.1); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x + r * 0.2, y - r * 0.7); ctx.lineTo(x + r * 0.4, y - r * 1.1); ctx.stroke();
  ctx.fillStyle = dark;
  ctx.beginPath(); ctx.arc(x - r * 0.4, y - r * 1.1, r * 0.08, 0, 6.28); ctx.fill();
  ctx.beginPath(); ctx.arc(x + r * 0.4, y - r * 1.1, r * 0.08, 0, 6.28); ctx.fill();
}

function drawWasp(ctx, x, y, r, S) {
  // flutter wings
  var wf = Math.sin(animT * 1000 / 50) * 0.4;
  ctx.fillStyle = 'rgba(255,255,255,0.7)';
  ctx.save(); ctx.translate(x, y); ctx.rotate(-0.5 + wf);
  ctx.beginPath(); ctx.ellipse(-r * 0.7, -r * 0.5, r * 0.7, r * 0.4, 0, 0, 6.28); ctx.fill(); ctx.restore();
  ctx.save(); ctx.translate(x, y); ctx.rotate(0.5 - wf);
  ctx.beginPath(); ctx.ellipse(r * 0.7, -r * 0.5, r * 0.7, r * 0.4, 0, 0, 6.28); ctx.fill(); ctx.restore();
  // round fuzzy body (yellow, friendly - no stinger)
  var grad = ctx.createRadialGradient(x - r * 0.3, y - r * 0.3, r * 0.2, x, y, r);
  grad.addColorStop(0, '#fff7c0'); grad.addColorStop(1, '#f4c542');
  ctx.fillStyle = grad;
  ctx.beginPath(); ctx.arc(x, y, r, 0, 6.28); ctx.fill();
  // soft stripes
  ctx.strokeStyle = 'rgba(120,90,30,0.5)'; ctx.lineWidth = r * 0.16;
  ctx.beginPath(); ctx.arc(x, y, r * 0.5, 0.1, 3.0); ctx.stroke();
  ctx.beginPath(); ctx.arc(x, y, r * 0.78, 0.2, 2.9); ctx.stroke();
  // eyes
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(x - r * 0.25, y - r * 0.1, r * 0.22, 0, 6.28); ctx.fill();
  ctx.beginPath(); ctx.arc(x + r * 0.25, y - r * 0.1, r * 0.22, 0, 6.28); ctx.fill();
  ctx.fillStyle = '#2a2333';
  ctx.beginPath(); ctx.arc(x - r * 0.22, y - r * 0.06, r * 0.1, 0, 6.28); ctx.fill();
  ctx.beginPath(); ctx.arc(x + r * 0.28, y - r * 0.06, r * 0.1, 0, 6.28); ctx.fill();
  ctx.strokeStyle = '#7a5a1a'; ctx.lineWidth = 1.6 * S;
  ctx.beginPath(); ctx.arc(x, y + r * 0.25, r * 0.18, 0.1 * Math.PI, 0.9 * Math.PI); ctx.stroke();
}

function drawShots(ctx, S) {
  for (var i = 0; i < shots.length; i++) {
    var sh = shots[i];
    ctx.fillStyle = '#b07a4a';
    ctx.beginPath(); ctx.arc(sh.x, sh.y, 6 * S, 0, 6.28); ctx.fill();
    ctx.fillStyle = '#7a5230';
    ctx.beginPath(); ctx.arc(sh.x, sh.y - 5 * S, 3 * S, 0, 6.28); ctx.fill();
  }
}

function drawCursor(ctx, S) {
  // only show on desktop keyboard aim; harmless otherwise
  if (!(GF.keys['ArrowLeft'] || GF.keys['ArrowRight'] || GF.keys['ArrowUp'] || GF.keys['ArrowDown'] || GF.keys['KeyA'] || GF.keys['KeyD'] || GF.keys['KeyW'] || GF.keys['KeyS'])) return;
  ctx.strokeStyle = 'rgba(80,60,90,0.6)'; ctx.lineWidth = 2 * S;
  ctx.beginPath(); ctx.arc(cursor.x, cursor.y, 14 * S, 0, 6.28); ctx.stroke();
}

// ── HUD ──
function drawHUD(ctx, W, H, S) {
  // top scrim for legibility
  ctx.fillStyle = 'rgba(255,255,255,0.35)';
  ctx.fillRect(0, 0, W, topPad);

  // coins (left, with drawn coin icon)
  var cy = topPad / 2;
  drawCoinIcon(ctx, 22 * S, cy, 11 * S);
  ctx.fillStyle = '#7a5a1a'; ctx.font = 'bold ' + GF.clamp(20 * S, 14, 26) + 'px sans-serif';
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.fillText('' + coins, 40 * S, cy + 1 * S);

  // wave + progress bar (center)
  var cleared = pestsTotalThisWave - (spawnQueue.length + pests.length);
  var frac = pestsTotalThisWave > 0 ? GF.clamp(cleared / pestsTotalThisWave, 0, 1) : (breather ? 1 : 0);
  ctx.fillStyle = '#5b4a6a'; ctx.font = 'bold ' + GF.clamp(17 * S, 12, 22) + 'px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(GF.t('wave') + ' ' + wave, W / 2, cy - 8 * S);
  var bw = Math.min(160 * S, W * 0.4), bx = W / 2 - bw / 2, by = cy + 6 * S;
  ctx.fillStyle = 'rgba(120,100,140,0.25)'; GF.rr(ctx, bx, by, bw, 6 * S, 3 * S); ctx.fill();
  ctx.fillStyle = '#a98ad0'; GF.rr(ctx, bx, by, bw * frac, 6 * S, 3 * S); ctx.fill();

  // joy meter (right of center, before buttons) - heart-leaf bar
  var jw = Math.min(120 * S, W * 0.26);
  var jx = R.help.x - jw - 12 * S, jy = cy - 5 * S;
  drawHeart(ctx, jx - 12 * S, cy, 8 * S, joyFlash > 0 ? '#ff5577' : '#ff7a90');
  ctx.fillStyle = 'rgba(120,100,140,0.22)'; GF.rr(ctx, jx, jy, jw, 10 * S, 5 * S); ctx.fill();
  var jf = GF.clamp(joy / JOY_MAX, 0, 1);
  var jc = jf > 0.5 ? '#7ad17a' : (jf > 0.25 ? '#ffc24d' : '#ff7a90');
  if (joyFlash > 0) jc = '#ff5577';
  GF.rr(ctx, jx, jy, jw * jf, 10 * S, 5 * S); ctx.fillStyle = jc; ctx.fill();

  // help + mute buttons
  drawRoundBtn(ctx, R.help, S);
  ctx.fillStyle = '#5b4a6a'; ctx.font = 'bold ' + (20 * S) + 'px sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('?', R.help.x + R.help.w / 2, R.help.y + R.help.h / 2 + 1 * S);
  drawRoundBtn(ctx, R.mute, S);
  GF.drawMuteIcon(ctx, R.mute.x + R.mute.w / 2, R.mute.y + R.mute.h / 2, 10 * S);
}

function drawRoundBtn(ctx, b, S) {
  ctx.fillStyle = 'rgba(255,255,255,0.75)';
  GF.rr(ctx, b.x, b.y, b.w, b.h, b.h / 2); ctx.fill();
  ctx.strokeStyle = 'rgba(150,130,170,0.5)'; ctx.lineWidth = 1.5 * S;
  GF.rr(ctx, b.x, b.y, b.w, b.h, b.h / 2); ctx.stroke();
}

function drawCoinIcon(ctx, x, y, r) {
  ctx.fillStyle = '#ffcf4a';
  ctx.beginPath(); ctx.arc(x, y, r, 0, 6.28); ctx.fill();
  ctx.strokeStyle = '#e0a92e'; ctx.lineWidth = 1.5; ctx.stroke();
  ctx.fillStyle = '#fff4c4';
  ctx.beginPath(); ctx.arc(x - r * 0.3, y - r * 0.3, r * 0.3, 0, 6.28); ctx.fill();
}

function drawHeart(ctx, x, y, r, col) {
  ctx.save(); ctx.translate(x, y); ctx.fillStyle = col;
  ctx.beginPath();
  ctx.moveTo(0, r * 0.5);
  ctx.bezierCurveTo(-r * 1.3, -r * 0.6, -r * 0.3, -r * 1.2, 0, -r * 0.4);
  ctx.bezierCurveTo(r * 0.3, -r * 1.2, r * 1.3, -r * 0.6, 0, r * 0.5);
  ctx.closePath(); ctx.fill(); ctx.restore();
}

function drawBreather(ctx, W, H, S) {
  var broke = coins < cheapestAction();
  var b = broke ? R.watch : R.nextwave;
  // big breathing button
  var t = animT;
  var pk = 1 + 0.04 * Math.sin(t * 2.4);
  var bw = b.w * pk, bh = b.h * pk, bx = GF.cx - bw / 2, by = b.y + b.h / 2 - bh / 2;
  ctx.save();
  ctx.shadowColor = broke ? 'rgba(255,180,80,0.6)' : 'rgba(120,210,140,0.6)'; ctx.shadowBlur = 20 * S;
  var grad = ctx.createLinearGradient(bx, by, bx, by + bh);
  if (broke) { grad.addColorStop(0, '#ffd36b'); grad.addColorStop(1, '#f0a838'); }
  else { grad.addColorStop(0, '#86e8a0'); grad.addColorStop(1, '#4fb86c'); }
  GF.rr(ctx, bx, by, bw, bh, bh / 2); ctx.fillStyle = grad; ctx.fill();
  ctx.restore();
  ctx.fillStyle = '#fff'; ctx.font = 'bold ' + GF.clamp(20 * S, 14, 26) + 'px sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  var label = broke ? GF.t('watch_coins') : GF.t('nextwave');
  var cyL = b.y + b.h / 2 + 1 * S;
  if (broke) {
    ctx.fillText(label, GF.cx, cyL);
  } else {
    // label + a vector play triangle (no glyph - avoids tofu/emoji-flag)
    var lw = ctx.measureText(label).width, tri = 11 * S, gap = 12 * S;
    ctx.fillText(label, GF.cx - tri / 2 - gap / 2, cyL);
    var tx = GF.cx + lw / 2 - tri / 2 + gap / 2, ty = cyL;
    ctx.beginPath(); ctx.moveTo(tx, ty - tri * 0.62); ctx.lineTo(tx + tri, ty); ctx.lineTo(tx, ty + tri * 0.62); ctx.closePath(); ctx.fill();
  }
}

function drawBanner(ctx, W, H, S) {
  var a = banner.t < 0.3 ? banner.t / 0.3 : (banner.t > 1.8 ? (2.2 - banner.t) / 0.4 : 1);
  ctx.save(); ctx.globalAlpha = GF.clamp(a, 0, 1);
  var y = H * 0.34;
  ctx.font = 'bold ' + GF.clamp(26 * S, 18, 34) + 'px sans-serif';
  var tw = ctx.measureText(banner.text).width;
  ctx.fillStyle = 'rgba(90,74,106,0.92)';
  GF.rr(ctx, W / 2 - tw / 2 - 20 * S, y - 24 * S, tw + 40 * S, 44 * S, 22 * S); ctx.fill();
  ctx.fillStyle = '#fff7d6'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(banner.text, W / 2, y - 1 * S);
  ctx.restore();
}

// ── BUILD PICKER ──
function drawPicker(ctx, W, H, S) {
  // scrim
  ctx.fillStyle = 'rgba(40,30,55,0.55)'; ctx.fillRect(0, 0, W, H);
  var existing = lanes[picker.laneIdx].slots[picker.slotIdx];
  var rowH = 58 * S;
  var rows = existing ? 1 : unlockedGuardians.length;
  var panelW = Math.min(W * 0.86, 380 * S);
  var titleH = 50 * S, pad = 14 * S, closeH = 50 * S;
  var panelH = titleH + rows * (rowH + 8 * S) + closeH + pad;
  var px = W / 2 - panelW / 2, py = H / 2 - panelH / 2;
  R.pickerPanel = { x: px, y: py, w: panelW, h: panelH };
  ctx.save();
  ctx.shadowColor = 'rgba(0,0,0,0.3)'; ctx.shadowBlur = 18 * S;
  ctx.fillStyle = '#fff6fb'; GF.rr(ctx, px, py, panelW, panelH, 22 * S); ctx.fill();
  ctx.restore();
  ctx.strokeStyle = 'rgba(196,166,255,0.6)'; ctx.lineWidth = 2 * S;
  GF.rr(ctx, px, py, panelW, panelH, 22 * S); ctx.stroke();

  ctx.fillStyle = '#5b4a6a'; ctx.font = 'bold ' + GF.clamp(20 * S, 15, 26) + 'px sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(existing ? GF.t('upgrade') : GF.t('pick_title'), W / 2, py + titleH / 2 + 4 * S);

  R.pickerRows = [];
  var ry = py + titleH;
  if (existing) {
    var maxed = existing.level >= levelCap();
    var cost = maxed ? 0 : upgradeCost(existing);
    var afford = coins >= cost;
    var row = { x: px + pad, y: ry, w: panelW - pad * 2, h: rowH, action: 'upgrade' };
    drawPickerRow(ctx, row, GUARD_DEFS[existing.type], existing.level, maxed ? GF.t('maxed') : ('' + cost), maxed ? '#999' : (afford ? '#e0a92e' : '#c98'), S, true);
    R.pickerRows.push(row);
  } else {
    var cost2 = placeCost();
    for (var i = 0; i < unlockedGuardians.length; i++) {
      var gt = unlockedGuardians[i];
      var afford2 = coins >= cost2;
      var row2 = { x: px + pad, y: ry, w: panelW - pad * 2, h: rowH, action: 'place', gtype: gt };
      drawPickerRow(ctx, row2, GUARD_DEFS[gt], 0, '' + cost2, afford2 ? '#e0a92e' : '#c98', S, false);
      R.pickerRows.push(row2);
      ry += rowH + 8 * S;
    }
  }

  // close
  var cb = { x: px + pad, y: py + panelH - closeH + 4 * S, w: panelW - pad * 2, h: closeH - 12 * S };
  R.pickerClose = cb;
  ctx.fillStyle = 'rgba(150,130,170,0.18)'; GF.rr(ctx, cb.x, cb.y, cb.w, cb.h, cb.h / 2); ctx.fill();
  ctx.fillStyle = '#7a6a8a'; ctx.font = 'bold ' + GF.clamp(16 * S, 12, 20) + 'px sans-serif';
  var clbl = GF.t('close'), ccy = cb.y + cb.h / 2 + 1 * S;
  var clw = ctx.measureText(clbl).width, xs = 6 * S, xgap = 10 * S;
  ctx.fillText(clbl, W / 2 + xs + xgap / 2, ccy);
  // vector X (no glyph)
  var xcx = W / 2 - clw / 2 - xgap / 2, xcy = cb.y + cb.h / 2;
  ctx.strokeStyle = '#7a6a8a'; ctx.lineWidth = 2.2 * S; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(xcx - xs, xcy - xs); ctx.lineTo(xcx + xs, xcy + xs);
  ctx.moveTo(xcx + xs, xcy - xs); ctx.lineTo(xcx - xs, xcy + xs); ctx.stroke();
}

function drawPickerRow(ctx, row, def, level, costText, costCol, S, isUpgrade) {
  ctx.fillStyle = 'rgba(196,166,255,0.12)';
  GF.rr(ctx, row.x, row.y, row.w, row.h, 14 * S); ctx.fill();
  // mini pookie
  drawPookie(ctx, row.x + 30 * S, row.y + row.h / 2, 20 * S, def.tint, { type: def.key }, S);
  // name + desc
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = '#4a3a5a'; ctx.font = 'bold ' + GF.clamp(16 * S, 12, 20) + 'px sans-serif';
  ctx.fillText(GF.t(def.name) + (isUpgrade ? ('  Lv' + level) : ''), row.x + 58 * S, row.y + row.h * 0.42);
  ctx.fillStyle = '#8a7a9a'; ctx.font = GF.clamp(12 * S, 10, 15) + 'px sans-serif';
  ctx.fillText(GF.t(def.desc), row.x + 58 * S, row.y + row.h * 0.74);
  // cost (with coin icon)
  ctx.textAlign = 'right';
  ctx.fillStyle = costCol; ctx.font = 'bold ' + GF.clamp(17 * S, 13, 22) + 'px sans-serif';
  ctx.fillText(costText, row.x + row.w - 16 * S, row.y + row.h / 2 + 5 * S);
  if (costText !== GF.t('maxed')) drawCoinIcon(ctx, row.x + row.w - 16 * S - ctx.measureText(costText).width - 12 * S, row.y + row.h / 2 + 1 * S, 8 * S);
  ctx.textAlign = 'center';
}

// ════════════════════════════════════════════════════════════════════════
//  ECONOMY MODEL (for econ_sim_check.js) - pure, mirrors the live constants.
//  Genre 'idle': coins flow in over time (booped bugs + wave-clear bonuses);
//  sinks are placing guardians and upgrading them. Capacity grows with waves
//  (new lanes/roster slots) so there is always a next thing to want.
// ════════════════════════════════════════════════════════════════════════
window.__gfEcon = (function () {
  function placeCostN(owned) { return Math.round(GUARD_BASE_COST * Math.pow(GUARD_COST_STEP, owned)); }
  function upgCostN(level) { return Math.round(UPGRADE_BASE_COST * Math.pow(UPGRADE_COST_STEP, level - 1)); }
  // income per second scales with wave (denser waves => more boop coins + bonuses)
  function incomePerSec(s) { return 1.1 + s.wave * 0.55; }
  // capacity DEEPENS with progress so there is always a next purchase to want:
  // new lanes + extra build slots unlock over waves, and the guardian level cap
  // climbs (every surviving wave lets you push your pookies further).
  function slotsAt(wave) {
    var lanes = Math.min(MAX_LANES, START_LANES + Math.floor((wave - 1) / 5));   // a lane ~every 5 waves
    var perLane = SLOTS_PER_LANE + Math.floor(wave / 6);                          // +1 slot ~every 6 waves
    return lanes * perLane;
  }
  function levelCapAt(wave) { return 3 + Math.floor(wave / 3); }                  // cap rises every 3 waves
  return {
    genre: 'idle',
    params: {
      GUARD_BASE_COST: GUARD_BASE_COST, GUARD_COST_STEP: GUARD_COST_STEP,
      UPGRADE_BASE_COST: UPGRADE_BASE_COST, UPGRADE_COST_STEP: UPGRADE_COST_STEP,
      COIN_PER_BUG: COIN_PER_BUG, WAVE_CLEAR_BONUS: WAVE_CLEAR_BONUS,
    },
    initialState: function () {
      return { coins: 14, owned: 0, wave: 1, slots: slotsAt(1), cap: levelCapAt(1), upg: [], t: 0 };
    },
    actions: function (s) {
      var acts = [];
      if (s.owned < s.slots) {
        var pc = placeCostN(s.owned);
        acts.push({ id: 'place', cost: pc, ready: s.coins >= pc });
      }
      // cheapest guardian below the current level cap
      var best = null;
      for (var i = 0; i < s.upg.length; i++) {
        if (s.upg[i] < s.cap) { var c = upgCostN(s.upg[i]); if (best === null || c < best.cost) best = { id: 'upgrade', cost: c, ready: s.coins >= c }; }
      }
      if (best) acts.push(best);
      return acts;
    },
    step: function (s, a) {
      a = a || {};
      if (a.id === 'wait') {
        var dt = a.dt || 1;
        s.t += dt;
        s.coins += incomePerSec(s) * dt;
        // a wave clears roughly every ~13s: bonus coins + capacity/cap growth
        while (s.t > s.wave * 13) {
          s.wave++;
          s.coins += WAVE_CLEAR_BONUS + s.wave;
          s.slots = slotsAt(s.wave);
          s.cap = levelCapAt(s.wave);
        }
        return s;
      }
      if (a.id === 'place') { s.coins -= a.cost; s.owned += 1; s.upg.push(1); return s; }
      if (a.id === 'upgrade') {
        s.coins -= a.cost;
        var bi = -1, bc = Infinity;
        for (var i = 0; i < s.upg.length; i++) { if (s.upg[i] < s.cap) { var c = upgCostN(s.upg[i]); if (c < bc) { bc = c; bi = i; } } }
        if (bi >= 0) s.upg[bi] += 1;
        return s;
      }
      return s;
    },
    metrics: function (s) {
      var lvlSum = 0; for (var i = 0; i < s.upg.length; i++) lvlSum += s.upg[i];
      return { currency: s.coins, progress: s.wave * 100 + s.owned * 30 + lvlSum * 15 };
    },
  };
})();

// ════════════════════════════════════════════════════════════════════════
//  BOOT
// ════════════════════════════════════════════════════════════════════════
GF.init({
  designW: 430,
  designH: 880,
  strings: STRINGS,
  sprites: SPRITE_NAMES,
  saveKey: 'pookie_pupae_guard',
  onReady: function() {
    try { best = parseInt(localStorage.getItem('pookie_pupae_guard_best') || '0') || 0; } catch (e) {}
    try { var u = JSON.parse(localStorage.getItem('pookie_pupae_guard_roster') || 'null'); if (u && u.length) unlockedGuardians = u; } catch (e) {}

    cursor.x = GF.cx; cursor.y = GF.cy;
    layout();

    // ── persist run (Yandex 1.9) ──
    GF.persist('pookie_pupae_guard_run_v1',
      function () {
        return {
          gs: gs, wave: wave, score: score, coins: coins, joy: joy, breather: breather,
          unlocked: unlockedGuardians,
          lanes: lanes.map(function (l) {
            return { cc: { hp: l.cocoon.hp, alive: l.cocoon.alive },
                     slots: l.slots.map(function (g) { return g ? { type: g.type, level: g.level } : null; }) };
          }),
        };
      },
      function (s) {
        if (!s) return;
        try { localStorage.setItem('pookie_pupae_guard_roster', JSON.stringify(s.unlocked || ['throw'])); } catch (e) {}
        unlockedGuardians = (s.unlocked && s.unlocked.length) ? s.unlocked : ['throw'];
        if (s.gs === 'PLAYING' && s.lanes && s.lanes.length) {
          wave = s.wave || 1; score = s.score || 0; coins = s.coins || 0; joy = s.joy != null ? s.joy : JOY_MAX;
          buildLanes();
          for (var i = 0; i < lanes.length && i < s.lanes.length; i++) {
            lanes[i].cocoon.hp = s.lanes[i].cc.hp; lanes[i].cocoon.alive = s.lanes[i].cc.alive;
            for (var sl = 0; sl < lanes[i].slots.length && sl < s.lanes[i].slots.length; sl++) {
              var sg = s.lanes[i].slots[sl];
              lanes[i].slots[sl] = sg ? { type: sg.type, level: sg.level, cd: 0, anim: 0 } : null;
            }
          }
          gs = 'PLAYING';
          breather = true; // resume safely at a breather so nothing bites mid-restore
          startWave();
          breather = true;
        }
      }
    );
    if (gs === 'PLAYING' || gs === 'MENU') { if (gs !== 'PLAYING') gs = 'MENU'; }

    // ── MUSIC (HARD RULE 8) ──
    GF.bgMusic({ file: 'audio/bg_track.mp3', preset: 'calm', muted: GF.muted });

    // ── REMOTE CONFIG ──
    GF.remoteConfig('pookie_pupae_guard', CFG, {
      clamps: { 'tuning.speed_mult': [0.5, 2], 'tuning.price_mult': [0.5, 3] },
      onUpdate: function (c) { CFG = c; },
    }).then(function (c) { CFG = c; });

    // ── post-build-tester state hook ──
    GF.exposeState(function () {
      return {
        gs: gs, wave: wave, coins: coins, score: score, best: best, joy: Math.round(joy),
        cocoonsAlive: aliveCocoons(), guardians: ownedGuardianCount(),
        pestsRemaining: pests.length + spawnQueue.length, breather: breather,
      };
    });

    // ── reachability hook (QA gate, window.__gfReach) ──
    // No scroll regions: report every interactive item in SCREEN px; every item
    // must satisfy 0 <= y && y+h <= viewportH (the canvas height).
    GF.exposeReach && GF.exposeReach(function () {
      var items = [];
      var add = function (id, b) { if (b) items.push({ id: id, x: b.x, y: b.y, w: b.w, h: b.h, pinned: true }); };
      if (gs === 'PLAYING') {
        add('help', R.help);
        add('mute', R.mute);
        if (breather) add('nextwave', R.nextwave);
        if (picker) add('picker_close', R.pickerClose);
      }
      return { screen: (gs === 'PLAYING' ? (breather ? 'breather' : 'play') : gs.toLowerCase()),
               items: items, viewportH: GF.H, screenH: GF.H, scrollMaxY: 0 };
    });

    // ── reachability tour (window.__gfTour): the screens the gate walks ──
    GF.exposeTour && GF.exposeTour([
      { name: 'play',     go: function () { if (gs !== 'PLAYING') startGame(); GF.tutorial.active = false; breather = false; picker = null; } },
      { name: 'breather', go: function () { if (gs !== 'PLAYING') startGame(); GF.tutorial.active = false; picker = null; breather = true; banner = null; } },
    ]);

    // ── balance probe driver (place/upgrade/boop) ──
    GF.exposeBot(
      function () {
        if (gs !== 'PLAYING') return ['start'];
        var acts = [];
        if (breather) { acts.push('next'); return acts; }
        // an empty slot to fill?
        for (var i = 0; i < lanes.length; i++) for (var s = 0; s < lanes[i].slots.length; s++) if (!lanes[i].slots[s]) { acts.push('place'); break; }
        if (pests.length) acts.push('boop');
        // an upgradeable guardian?
        for (var a = 0; a < lanes.length; a++) for (var b = 0; b < lanes[a].slots.length; b++) { var g = lanes[a].slots[b]; if (g && g.level < levelCap()) { acts.push('upgrade'); } }
        if (!acts.length) acts.push('boop');
        return acts;
      },
      function (action) {
        if (action === 'start') { startGame(); return; }
        if (action === 'next') { breather = false; startWave(); update._acc = 0; return; }
        if (action === 'boop') { if (pests.length) { boopCd = 0; doBoop(pests[0]); } return; }
        if (action === 'place') {
          for (var i = 0; i < lanes.length; i++) for (var s = 0; s < lanes[i].slots.length; s++) if (!lanes[i].slots[s]) {
            placeGuardian(i, s, unlockedGuardians[0]); return;
          }
        }
        if (action === 'upgrade') {
          for (var a = 0; a < lanes.length; a++) for (var b = 0; b < lanes[a].slots.length; b++) { var g = lanes[a].slots[b]; if (g && g.level < levelCap()) { upgradeGuardian(a, b); return; } }
        }
      }
    );

    // mark tutorial_done when the coach ends
    var _tutWas = false;
    GF._tutWatch = setInterval(function () {
      if (GF.tutorial.active) _tutWas = true;
      else if (_tutWas) { _tutWas = false; }
    }, 400);

    // ── PLATFORM AUTOSTART (HARD RULE 9) ──
    if (window.__GF_AUTOSTART && !window._silent && gs === 'MENU') {
      startGame();
    }
  },
  onUpdate: update,
  onDraw: draw,
});

// own pointer handler (tap-to-act)
GF.canvas.addEventListener('pointerdown', function (e) {
  e.preventDefault();
  var p = toGame(e);
  onPress(p.x, p.y);
}, { passive: false });

// PLAY/RETRY locator for QA gates (no-menu game → point at active button)
window.__gfPlayRect = function () {
  try {
    var b = null;
    if (gs === 'GAMEOVER' || gs === 'MENU') {
      // gf-lib overlay button is centered; report its rect
      var bw = Math.min(248 * GF.S, 400), bh = 54 * GF.S;
      return { cx: GF.cx, cy: GF.cy + 22 * GF.S + bh / 2, x: GF.cx - bw / 2, y: GF.cy + 22 * GF.S, w: bw, h: bh };
    }
    if (gs === 'PLAYING' && breather) b = R.nextwave;
    if (!b) return null;
    var rct = GF.canvas.getBoundingClientRect(), sx = rct.width / GF.canvas.width, sy = rct.height / GF.canvas.height;
    return { x: rct.left + b.x * sx, y: rct.top + b.y * sy, w: b.w * sx, h: b.h * sy,
             cx: rct.left + (b.x + b.w / 2) * sx, cy: rct.top + (b.y + b.h / 2) * sy };
  } catch (e) { return null; }
};

})();
</script>
</body>
