<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#08151d">
  <title>Airspace Stack</title>
  <link rel="stylesheet" href="./tokens.css">
</head>
<body>
  <main id="game-shell" class="game-shell">
    <h1 class="sr-only">Airspace Stack</h1>
    <section id="airspace" class="airspace" aria-label="Live approach radar">
      <canvas
        id="game"
        tabindex="0"
        role="img"
        aria-label="Top-down air traffic game. Drag aircraft to set routes. Tap aircraft to change altitude."
        aria-describedby="game-instructions"
      ></canvas>
      <button id="retry-button" class="sr-only" type="button" hidden>Retry stage</button>
    </section>
    <p id="game-instructions" class="sr-only">
      Drag an aircraft to draw its route. Tap an aircraft to change altitude.
      Red paths predict a collision. On failure, tap the game to retry.
      Keyboard: Tab selects, Enter routes to the runway, A changes altitude,
      R retries, M mutes, and F toggles fullscreen.
    </p>
    <div id="screen-reader-status" class="sr-only" role="status" aria-live="polite"></div>
  </main>
  <script src="./game.js"></script>
</body>
</html>
