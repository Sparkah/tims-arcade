<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#08151d">
  <title>Airspace Stack</title>
  <link rel="stylesheet" href="./tokens.css">
</head>
<body>
  <main id="game-shell" class="game-shell">
    <h1 class="sr-only">Airspace Stack</h1>
    <section id="airspace" class="airspace" aria-label="Live approach radar">
      <canvas
        id="game"
        tabindex="0"
        role="img"
        aria-label="Top-down air traffic game. Drag aircraft to set routes. Tap aircraft to change altitude."
        aria-describedby="game-instructions"
      ></canvas>
      <button id="retry-button" class="sr-only" type="button" hidden>Retry stage</button>
    </section>
    <p id="game-instructions" class="sr-only">
      Drag an aircraft to draw its route. Tap an aircraft to change altitude.
      Red paths predict a collision. On failure, tap the game to retry.
      Keyboard: Tab selects, Enter routes to the runway, A changes altitude,
      R retries, M mutes, and F toggles fullscreen.
    </p>
    <div id="screen-reader-status" class="sr-only" role="status" aria-live="polite"></div>
  </main>
  <script src="./game.js"></script>
<script>
/* Suno bg music loop (audio-overhaul chunk 4): self-contained WebAudio player.
   Arms on first gesture; polls `muted`/GF.muted so existing mute toggles
   silence it; suspends on tab-hide (Yandex 1.3). */
(function(){var st=0,g=null;function m(){try{if(typeof muted!=="undefined")return !!muted;if(window.GF&&"muted" in GF)return !!GF.muted;}catch(e){}return false;}function go(){if(st)return;st=1;try{var C=window.AudioContext||window.webkitAudioContext;var x=new C();fetch("audio/bg_loop.mp3").then(function(r){return r.arrayBuffer()}).then(function(b){return x.decodeAudioData(b)}).then(function(buf){g=x.createGain();g.gain.value=m()?0:0.4;g.connect(x.destination);var s=x.createBufferSource();s.buffer=buf;s.loop=true;s.connect(g);s.start();setInterval(function(){try{g.gain.value=m()?0:0.4;}catch(e){}},300);document.addEventListener("visibilitychange",function(){try{document.hidden?x.suspend():(!m()&&x.resume());}catch(e){}});});}catch(e){}}
["pointerdown","keydown","touchstart"].forEach(function(ev){document.addEventListener(ev,go,true)});})();
</script>
</body>
</html>
