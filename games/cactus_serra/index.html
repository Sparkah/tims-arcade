<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Cactus Serra</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { overflow: hidden; background: #000; font-family: 'Segoe UI', sans-serif; }
canvas { display: block; }

#ui {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  pointer-events: none; z-index: 10;
}

#health-bar-container {
  position: absolute; top: 20px; left: 20px;
  width: 220px; height: 28px;
  background: rgba(0,0,0,0.5); border-radius: 14px;
  border: 2px solid rgba(255,255,255,0.3);
  overflow: hidden;
}
#health-bar {
  width: 100%; height: 100%;
  background: linear-gradient(90deg, #e74c3c, #2ecc71);
  border-radius: 12px;
  transition: width 0.3s;
}
#health-text {
  position: absolute; top: 22px; left: 25px;
  color: white; font-size: 11px; font-weight: bold;
  text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
  line-height: 28px;
}

#score-display {
  position: absolute; top: 20px; right: 20px;
  color: white; font-size: 22px; font-weight: bold;
  text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
}

#water-display {
  position: absolute; top: 52px; right: 20px;
  color: #5dade2; font-size: 16px; font-weight: bold;
  text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
}

#damage-flash {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  background: rgba(255,0,0,0.3); opacity: 0;
  transition: opacity 0.1s;
  pointer-events: none; z-index: 5;
}

#minimap {
  position: absolute; bottom: 20px; right: 20px;
  width: 150px; height: 150px;
  border-radius: 50%;
  border: 2px solid rgba(255,255,255,0.4);
  background: rgba(0,0,0,0.4);
  overflow: hidden;
}
#minimap canvas {
  width: 100%; height: 100%;
  border-radius: 50%;
}

#start-screen, #game-over-screen {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  background: rgba(0,0,0,0.7);
  z-index: 100; pointer-events: all;
}

#start-screen h1 {
  font-size: 64px; color: #f39c12;
  text-shadow: 3px 3px 6px rgba(0,0,0,0.8);
  margin-bottom: 10px;
  font-family: Georgia, serif;
}
#start-screen h2 {
  font-size: 20px; color: #e8d5b0;
  margin-bottom: 40px; font-weight: normal;
}
#start-screen .controls-info {
  color: #ccc; font-size: 14px; line-height: 2;
  margin-bottom: 30px; text-align: center;
}

.btn {
  padding: 15px 50px; font-size: 22px;
  background: linear-gradient(135deg, #e67e22, #d35400);
  color: white; border: none; border-radius: 30px;
  cursor: pointer; pointer-events: all;
  text-transform: uppercase; letter-spacing: 2px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.4);
  transition: transform 0.2s, box-shadow 0.2s;
}
.btn:hover { transform: scale(1.05); box-shadow: 0 6px 20px rgba(0,0,0,0.5); }

#game-over-screen h1 { font-size: 52px; color: #e74c3c; margin-bottom: 10px; }
#game-over-screen .final-score { font-size: 28px; color: #f39c12; margin-bottom: 30px; }

#touch-controls {
  display: none; position: absolute; bottom: 20px; left: 20px;
  pointer-events: all;
}
#joystick-area {
  width: 130px; height: 130px;
  background: rgba(255,255,255,0.1);
  border: 2px solid rgba(255,255,255,0.3);
  border-radius: 50%;
  position: relative;
}
#joystick-knob {
  width: 50px; height: 50px;
  background: rgba(255,255,255,0.4);
  border-radius: 50%;
  position: absolute;
  top: 40px; left: 40px;
}

@media (pointer: coarse) {
  #touch-controls { display: block; }
}
</style>
</head>
<body>

<div id="damage-flash"></div>

<div id="ui">
  <div id="health-bar-container">
    <div id="health-bar"></div>
  </div>
  <div id="health-text">HP 100</div>
  <div id="score-display">Score: 0</div>
  <div id="water-display"></div>
  <div id="minimap"><canvas id="minimap-canvas" width="150" height="150"></canvas></div>
  <div id="touch-controls">
    <div id="joystick-area">
      <div id="joystick-knob"></div>
    </div>
  </div>
</div>

<div id="start-screen">
  <h1>Cactus Serra</h1>
  <h2>Survive the Desert of Thorns</h2>
  <div class="controls-info">
    WASD / Arrow Keys - Move<br>
    Mouse - Look Around<br>
    Collect water drops to heal<br>
    Avoid the cacti!
  </div>
  <button class="btn" id="start-btn">Enter Desert</button>
</div>

<div id="game-over-screen" style="display:none;">
  <h1>You Perished</h1>
  <div class="final-score" id="final-score">Score: 0</div>
  <button class="btn" id="restart-btn">Try Again</button>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';

// ── Config ──
const WORLD_SIZE = 200;
const CACTUS_COUNT = 250;
const WATER_COUNT = 15;
const PLAYER_SPEED = 12;
const PLAYER_RADIUS = 0.6;
const CACTUS_DAMAGE = 8;
const DAMAGE_COOLDOWN = 0.6;
const WATER_HEAL = 20;
const WATER_RESPAWN_TIME = 8;

// ── State ──
let health = 100;
let score = 0;
let waterCollected = 0;
let gameRunning = false;
let lastDamageTime = 0;
let elapsed = 0;

const keys = {};
const mouse = { x: 0, y: 0 };
let cameraYaw = 0;
let cameraPitch = 0.4;
let pointerLocked = false;

// ── Three.js Setup ──
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87CEEB);
scene.fog = new THREE.FogExp2(0xd4b896, 0.008);

const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 500);

// ── Lighting ──
const ambientLight = new THREE.AmbientLight(0xffeedd, 0.6);
scene.add(ambientLight);

const sunLight = new THREE.DirectionalLight(0xfff5e6, 1.8);
sunLight.position.set(50, 80, 30);
sunLight.castShadow = true;
sunLight.shadow.mapSize.set(2048, 2048);
sunLight.shadow.camera.left = -60;
sunLight.shadow.camera.right = 60;
sunLight.shadow.camera.top = 60;
sunLight.shadow.camera.bottom = -60;
sunLight.shadow.camera.near = 1;
sunLight.shadow.camera.far = 200;
scene.add(sunLight);

const hemiLight = new THREE.HemisphereLight(0x87CEEB, 0xd4a574, 0.4);
scene.add(hemiLight);

// ── Desert Ground ──
const groundGeo = new THREE.PlaneGeometry(WORLD_SIZE * 2, WORLD_SIZE * 2, 64, 64);
const positions = groundGeo.attributes.position;
for (let i = 0; i < positions.count; i++) {
  const x = positions.getX(i);
  const y = positions.getY(i);
  const z = Math.sin(x * 0.05) * Math.cos(y * 0.07) * 1.5 +
            Math.sin(x * 0.12 + y * 0.08) * 0.8;
  positions.setZ(i, z);
}
groundGeo.computeVertexNormals();

const groundMat = new THREE.MeshStandardMaterial({
  color: 0xd4a574,
  roughness: 0.95,
  metalness: 0.0
});
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// ── Sun Disc ──
const sunGeo = new THREE.SphereGeometry(8, 16, 16);
const sunMat = new THREE.MeshBasicMaterial({ color: 0xffe066 });
const sunMesh = new THREE.Mesh(sunGeo, sunMat);
sunMesh.position.set(150, 120, -100);
scene.add(sunMesh);

// ── Cactus Generation ──
const cacti = [];
const cactusGroup = new THREE.Group();
scene.add(cactusGroup);

function createCactus(x, z) {
  const group = new THREE.Group();
  const type = Math.random();
  const baseH = 2 + Math.random() * 4;
  const baseR = 0.3 + Math.random() * 0.3;

  const cactusColor = new THREE.Color().setHSL(0.28 + Math.random() * 0.06, 0.6 + Math.random() * 0.2, 0.3 + Math.random() * 0.1);
  const cactusMat = new THREE.MeshStandardMaterial({
    color: cactusColor, roughness: 0.8, metalness: 0.05
  });

  // Main trunk
  const trunkGeo = new THREE.CylinderGeometry(baseR * 0.85, baseR, baseH, 8);
  const trunk = new THREE.Mesh(trunkGeo, cactusMat);
  trunk.position.y = baseH / 2;
  trunk.castShadow = true;
  group.add(trunk);

  // Top cap
  const capGeo = new THREE.SphereGeometry(baseR * 0.85, 8, 6, 0, Math.PI * 2, 0, Math.PI / 2);
  const cap = new THREE.Mesh(capGeo, cactusMat);
  cap.position.y = baseH;
  cap.castShadow = true;
  group.add(cap);

  // Arms (50% chance)
  if (type > 0.3) {
    const armCount = Math.floor(1 + Math.random() * 2);
    for (let a = 0; a < armCount; a++) {
      const armH = 1 + Math.random() * 2;
      const armR = baseR * 0.6;
      const armY = baseH * (0.3 + Math.random() * 0.4);
      const armAngle = (a / armCount) * Math.PI * 2 + Math.random() * 0.5;

      // Horizontal part
      const hGeo = new THREE.CylinderGeometry(armR * 0.9, armR, baseR * 2, 6);
      const hMesh = new THREE.Mesh(hGeo, cactusMat);
      hMesh.rotation.z = Math.PI / 2;
      hMesh.position.set(Math.cos(armAngle) * baseR * 1.5, armY, Math.sin(armAngle) * baseR * 1.5);
      hMesh.castShadow = true;
      group.add(hMesh);

      // Vertical part
      const vGeo = new THREE.CylinderGeometry(armR * 0.8, armR * 0.9, armH, 6);
      const vMesh = new THREE.Mesh(vGeo, cactusMat);
      vMesh.position.set(Math.cos(armAngle) * baseR * 2.5, armY + armH / 2, Math.sin(armAngle) * baseR * 2.5);
      vMesh.castShadow = true;
      group.add(vMesh);

      // Arm cap
      const aCap = new THREE.Mesh(
        new THREE.SphereGeometry(armR * 0.8, 6, 4, 0, Math.PI * 2, 0, Math.PI / 2),
        cactusMat
      );
      aCap.position.set(Math.cos(armAngle) * baseR * 2.5, armY + armH, Math.sin(armAngle) * baseR * 2.5);
      group.add(aCap);
    }
  }

  // Spines
  const spineGeo = new THREE.ConeGeometry(0.02, 0.25, 3);
  const spineMat = new THREE.MeshStandardMaterial({ color: 0xf5e6c8, roughness: 0.5 });
  const spineCount = 12 + Math.floor(Math.random() * 15);
  for (let s = 0; s < spineCount; s++) {
    const spine = new THREE.Mesh(spineGeo, spineMat);
    const sy = 0.3 + Math.random() * (baseH - 0.5);
    const sa = Math.random() * Math.PI * 2;
    spine.position.set(
      Math.cos(sa) * (baseR + 0.1),
      sy,
      Math.sin(sa) * (baseR + 0.1)
    );
    spine.lookAt(
      Math.cos(sa) * (baseR + 2),
      sy + (Math.random() - 0.5) * 0.5,
      Math.sin(sa) * (baseR + 2)
    );
    group.add(spine);
  }

  // Flowers (20% chance)
  if (Math.random() > 0.8) {
    const flowerColors = [0xff69b4, 0xff4500, 0xffff00, 0xff1493];
    const fColor = flowerColors[Math.floor(Math.random() * flowerColors.length)];
    const fGeo = new THREE.SphereGeometry(0.12, 6, 6);
    const fMat = new THREE.MeshStandardMaterial({ color: fColor, emissive: fColor, emissiveIntensity: 0.2 });
    const flower = new THREE.Mesh(fGeo, fMat);
    flower.position.y = baseH + baseR * 0.5;
    group.add(flower);
  }

  group.position.set(x, 0, z);
  group.rotation.y = Math.random() * Math.PI * 2;
  cactusGroup.add(group);

  cacti.push({
    mesh: group, x, z,
    radius: baseR + 0.3,
    height: baseH
  });
}

function spawnCacti() {
  for (let i = 0; i < CACTUS_COUNT; i++) {
    let x, z, tooClose;
    do {
      x = (Math.random() - 0.5) * WORLD_SIZE * 1.8;
      z = (Math.random() - 0.5) * WORLD_SIZE * 1.8;
      tooClose = (Math.abs(x) < 4 && Math.abs(z) < 4); // keep spawn area clear
      if (!tooClose) {
        for (const c of cacti) {
          if (Math.hypot(c.x - x, c.z - z) < 2) { tooClose = true; break; }
        }
      }
    } while (tooClose);
    createCactus(x, z);
  }
}

// ── Water Drops ──
const waterDrops = [];
const waterGroup = new THREE.Group();
scene.add(waterGroup);

function createWaterDrop(x, z) {
  const group = new THREE.Group();

  const dropGeo = new THREE.SphereGeometry(0.3, 8, 8);
  const dropMat = new THREE.MeshStandardMaterial({
    color: 0x3498db, transparent: true, opacity: 0.8,
    roughness: 0.1, metalness: 0.3, emissive: 0x1a6bb5, emissiveIntensity: 0.3
  });
  const drop = new THREE.Mesh(dropGeo, dropMat);
  drop.position.y = 1.2;
  group.add(drop);

  // Glow ring
  const ringGeo = new THREE.RingGeometry(0.4, 0.6, 16);
  const ringMat = new THREE.MeshBasicMaterial({
    color: 0x5dade2, transparent: true, opacity: 0.3, side: THREE.DoubleSide
  });
  const ring = new THREE.Mesh(ringGeo, ringMat);
  ring.rotation.x = -Math.PI / 2;
  ring.position.y = 0.05;
  group.add(ring);

  group.position.set(x, 0, z);
  waterGroup.add(group);

  waterDrops.push({
    mesh: group, x, z, active: true, respawnTimer: 0
  });
}

function spawnWaterDrops() {
  for (let i = 0; i < WATER_COUNT; i++) {
    const x = (Math.random() - 0.5) * WORLD_SIZE * 1.5;
    const z = (Math.random() - 0.5) * WORLD_SIZE * 1.5;
    createWaterDrop(x, z);
  }
}

// ── Player ──
const playerGroup = new THREE.Group();
scene.add(playerGroup);

// Body
const bodyMat = new THREE.MeshStandardMaterial({ color: 0xe8b88a, roughness: 0.7 });
const bodyGeo = new THREE.CapsuleGeometry(0.35, 0.7, 8, 16);
const bodyMesh = new THREE.Mesh(bodyGeo, bodyMat);
bodyMesh.position.y = 1.1;
bodyMesh.castShadow = true;
playerGroup.add(bodyMesh);

// Head
const headGeo = new THREE.SphereGeometry(0.28, 12, 10);
const headMesh = new THREE.Mesh(headGeo, bodyMat);
headMesh.position.y = 1.85;
headMesh.castShadow = true;
playerGroup.add(headMesh);

// Hat
const hatBrimGeo = new THREE.CylinderGeometry(0.5, 0.5, 0.05, 12);
const hatMat = new THREE.MeshStandardMaterial({ color: 0x8B4513, roughness: 0.9 });
const hatBrim = new THREE.Mesh(hatBrimGeo, hatMat);
hatBrim.position.y = 2.05;
hatBrim.castShadow = true;
playerGroup.add(hatBrim);

const hatTopGeo = new THREE.CylinderGeometry(0.25, 0.3, 0.3, 8);
const hatTop = new THREE.Mesh(hatTopGeo, hatMat);
hatTop.position.y = 2.22;
hatTop.castShadow = true;
playerGroup.add(hatTop);

// Eyes
const eyeGeo = new THREE.SphereGeometry(0.04, 6, 6);
const eyeMat = new THREE.MeshBasicMaterial({ color: 0x222222 });
const leftEye = new THREE.Mesh(eyeGeo, eyeMat);
leftEye.position.set(-0.1, 1.9, 0.24);
playerGroup.add(leftEye);
const rightEye = new THREE.Mesh(eyeGeo, eyeMat);
rightEye.position.set(0.1, 1.9, 0.24);
playerGroup.add(rightEye);

// Legs (simple cylinders)
const legGeo = new THREE.CylinderGeometry(0.1, 0.12, 0.5, 6);
const legMat = new THREE.MeshStandardMaterial({ color: 0x3b5998, roughness: 0.8 });
const leftLeg = new THREE.Mesh(legGeo, legMat);
leftLeg.position.set(-0.15, 0.35, 0);
playerGroup.add(leftLeg);
const rightLeg = new THREE.Mesh(legGeo, legMat);
rightLeg.position.set(0.15, 0.35, 0);
playerGroup.add(rightLeg);

// Boots
const bootGeo = new THREE.BoxGeometry(0.16, 0.12, 0.22);
const bootMat = new THREE.MeshStandardMaterial({ color: 0x5c3317, roughness: 0.9 });
const leftBoot = new THREE.Mesh(bootGeo, bootMat);
leftBoot.position.set(-0.15, 0.1, 0.03);
playerGroup.add(leftBoot);
const rightBoot = new THREE.Mesh(bootGeo, bootMat);
rightBoot.position.set(0.15, 0.1, 0.03);
playerGroup.add(rightBoot);

// ── Dust Particles ──
const dustParticles = [];
const dustGeo = new THREE.SphereGeometry(0.08, 4, 4);
const dustMat = new THREE.MeshBasicMaterial({ color: 0xd4a574, transparent: true });

function spawnDust(x, z) {
  const dust = new THREE.Mesh(dustGeo, dustMat.clone());
  dust.position.set(x + (Math.random() - 0.5) * 0.5, 0.1, z + (Math.random() - 0.5) * 0.5);
  scene.add(dust);
  dustParticles.push({ mesh: dust, life: 0.5 + Math.random() * 0.5, vy: 0.5 + Math.random() * 0.5 });
}

// ── Rocks ──
function spawnRocks() {
  const rockMat = new THREE.MeshStandardMaterial({ color: 0x8B7355, roughness: 0.95 });
  for (let i = 0; i < 50; i++) {
    const geo = new THREE.DodecahedronGeometry(0.3 + Math.random() * 0.8, 0);
    const rock = new THREE.Mesh(geo, rockMat);
    rock.position.set(
      (Math.random() - 0.5) * WORLD_SIZE * 1.8,
      0.1,
      (Math.random() - 0.5) * WORLD_SIZE * 1.8
    );
    rock.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, 0);
    rock.scale.y = 0.5 + Math.random() * 0.5;
    rock.castShadow = true;
    rock.receiveShadow = true;
    scene.add(rock);
  }
}

// ── Tumbleweeds ──
const tumbleweeds = [];
function spawnTumbleweeds() {
  const twMat = new THREE.MeshStandardMaterial({ color: 0x9B7653, roughness: 1, wireframe: true });
  for (let i = 0; i < 8; i++) {
    const r = 0.3 + Math.random() * 0.4;
    const geo = new THREE.IcosahedronGeometry(r, 1);
    const tw = new THREE.Mesh(geo, twMat);
    tw.position.set(
      (Math.random() - 0.5) * WORLD_SIZE,
      r,
      (Math.random() - 0.5) * WORLD_SIZE
    );
    scene.add(tw);
    tumbleweeds.push({
      mesh: tw, r,
      vx: (Math.random() - 0.5) * 3,
      vz: (Math.random() - 0.5) * 3,
      rotSpeed: (Math.random() - 0.5) * 2
    });
  }
}

// ── Minimap ──
const minimapCanvas = document.getElementById('minimap-canvas');
const minimapCtx = minimapCanvas.getContext('2d');

function drawMinimap() {
  const ctx = minimapCtx;
  const w = 150, h = 150;
  const scale = w / 100;

  ctx.clearRect(0, 0, w, h);
  ctx.fillStyle = 'rgba(210,165,116,0.5)';
  ctx.fillRect(0, 0, w, h);

  // Cacti dots
  ctx.fillStyle = 'rgba(34,139,34,0.6)';
  for (const c of cacti) {
    const cx = (c.x - playerGroup.position.x) * scale + w / 2;
    const cz = (c.z - playerGroup.position.z) * scale + h / 2;
    if (cx > -5 && cx < w + 5 && cz > -5 && cz < h + 5) {
      ctx.fillRect(cx - 1, cz - 1, 2, 2);
    }
  }

  // Water dots
  ctx.fillStyle = '#3498db';
  for (const wd of waterDrops) {
    if (!wd.active) continue;
    const wx = (wd.x - playerGroup.position.x) * scale + w / 2;
    const wz = (wd.z - playerGroup.position.z) * scale + h / 2;
    if (wx > 0 && wx < w && wz > 0 && wz < h) {
      ctx.beginPath();
      ctx.arc(wx, wz, 3, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // Player arrow
  ctx.save();
  ctx.translate(w / 2, h / 2);
  ctx.rotate(cameraYaw);
  ctx.fillStyle = '#e74c3c';
  ctx.beginPath();
  ctx.moveTo(0, -6);
  ctx.lineTo(-4, 4);
  ctx.lineTo(4, 4);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

// ── Input ──
window.addEventListener('keydown', e => { keys[e.code] = true; });
window.addEventListener('keyup', e => { keys[e.code] = false; });

renderer.domElement.addEventListener('click', () => {
  if (gameRunning && !pointerLocked) renderer.domElement.requestPointerLock();
});

document.addEventListener('pointerlockchange', () => {
  pointerLocked = document.pointerLockElement === renderer.domElement;
});

// Mouse drag rotation (fallback when pointer lock not active)
let mouseDown = false;
let lastMouseX = 0, lastMouseY = 0;
renderer.domElement.addEventListener('mousedown', e => {
  if (!gameRunning) return;
  mouseDown = true;
  lastMouseX = e.clientX;
  lastMouseY = e.clientY;
});
window.addEventListener('mouseup', () => { mouseDown = false; });
window.addEventListener('mousemove', e => {
  if (!gameRunning) return;
  if (pointerLocked) {
    cameraYaw += e.movementX * 0.003;
    cameraPitch = Math.max(0.1, Math.min(1.2, cameraPitch - e.movementY * 0.003));
  } else if (mouseDown) {
    cameraYaw += (e.clientX - lastMouseX) * 0.005;
    cameraPitch = Math.max(0.1, Math.min(1.2, cameraPitch - (e.clientY - lastMouseY) * 0.005));
    lastMouseX = e.clientX;
    lastMouseY = e.clientY;
  }
});

// Touch joystick
let joystickActive = false;
let joystickCenter = { x: 0, y: 0 };
let joystickDelta = { x: 0, y: 0 };
const joystickArea = document.getElementById('joystick-area');
const joystickKnob = document.getElementById('joystick-knob');

joystickArea?.addEventListener('touchstart', e => {
  e.preventDefault();
  joystickActive = true;
  const rect = joystickArea.getBoundingClientRect();
  joystickCenter = { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };
});

document.addEventListener('touchmove', e => {
  if (!joystickActive) {
    // Camera rotation from right side of screen
    const touch = e.touches[e.touches.length - 1];
    if (touch.clientX > window.innerWidth / 2) {
      cameraYaw -= (e.touches[0].clientX - (mouse.lastTouchX || touch.clientX)) * 0.005;
      mouse.lastTouchX = touch.clientX;
    }
    return;
  }
  const touch = e.touches[0];
  const dx = touch.clientX - joystickCenter.x;
  const dy = touch.clientY - joystickCenter.y;
  const dist = Math.min(Math.sqrt(dx * dx + dy * dy), 50);
  const angle = Math.atan2(dy, dx);
  joystickDelta = { x: Math.cos(angle) * dist / 50, y: Math.sin(angle) * dist / 50 };
  joystickKnob.style.left = (40 + joystickDelta.x * 30) + 'px';
  joystickKnob.style.top = (40 + joystickDelta.y * 30) + 'px';
});

document.addEventListener('touchend', e => {
  joystickActive = false;
  joystickDelta = { x: 0, y: 0 };
  joystickKnob.style.left = '40px';
  joystickKnob.style.top = '40px';
  mouse.lastTouchX = null;
});

// ── UI ──
const healthBar = document.getElementById('health-bar');
const healthText = document.getElementById('health-text');
const scoreDisplay = document.getElementById('score-display');
const waterDisplay = document.getElementById('water-display');
const damageFlash = document.getElementById('damage-flash');
const startScreen = document.getElementById('start-screen');
const gameOverScreen = document.getElementById('game-over-screen');
const finalScoreEl = document.getElementById('final-score');

function updateUI() {
  healthBar.style.width = health + '%';
  healthText.textContent = 'HP ' + Math.ceil(health);
  scoreDisplay.textContent = 'Score: ' + Math.floor(score);
  waterDisplay.textContent = waterCollected > 0 ? 'Water: ' + waterCollected : '';
}

function flashDamage() {
  damageFlash.style.opacity = '1';
  setTimeout(() => damageFlash.style.opacity = '0', 150);
}

// ── Game Loop ──
const clock = new THREE.Clock();
let playerVel = new THREE.Vector3();
let walkCycle = 0;
let isMoving = false;
let dustTimer = 0;

function update() {
  if (!gameRunning) return;
  const dt = Math.min(clock.getDelta(), 0.05);
  elapsed += dt;
  score += dt * 5;

  // Player movement
  let moveX = 0, moveZ = 0;

  if (keys['KeyW'] || keys['ArrowUp']) moveZ += 1;
  if (keys['KeyS'] || keys['ArrowDown']) moveZ -= 1;
  if (keys['KeyA'] || keys['ArrowLeft']) moveX -= 1;
  if (keys['KeyD'] || keys['ArrowRight']) moveX += 1;

  // Joystick input
  moveX += joystickDelta.x;
  moveZ += joystickDelta.y;

  const moveLen = Math.sqrt(moveX * moveX + moveZ * moveZ);
  isMoving = moveLen > 0.1;

  if (isMoving) {
    const norm = 1 / moveLen;
    moveX *= norm;
    moveZ *= norm;

    // Rotate movement by camera yaw
    const sin = Math.sin(cameraYaw);
    const cos = Math.cos(cameraYaw);
    const mx = moveX * cos - moveZ * sin;
    const mz = moveX * sin + moveZ * cos;

    playerGroup.position.x += mx * PLAYER_SPEED * dt;
    playerGroup.position.z += mz * PLAYER_SPEED * dt;

    // Face movement direction
    playerGroup.rotation.y = Math.atan2(mx, mz);

    // Walk animation
    walkCycle += dt * 10;
    leftLeg.rotation.x = Math.sin(walkCycle) * 0.4;
    rightLeg.rotation.x = Math.sin(walkCycle + Math.PI) * 0.4;
    leftBoot.position.z = 0.03 + Math.sin(walkCycle) * 0.05;
    rightBoot.position.z = 0.03 + Math.sin(walkCycle + Math.PI) * 0.05;

    // Body bob
    bodyMesh.position.y = 1.1 + Math.abs(Math.sin(walkCycle)) * 0.05;

    // Dust
    dustTimer += dt;
    if (dustTimer > 0.15) {
      dustTimer = 0;
      spawnDust(playerGroup.position.x, playerGroup.position.z);
    }
  } else {
    leftLeg.rotation.x *= 0.9;
    rightLeg.rotation.x *= 0.9;
  }

  // Clamp to world
  const bound = WORLD_SIZE * 0.9;
  playerGroup.position.x = Math.max(-bound, Math.min(bound, playerGroup.position.x));
  playerGroup.position.z = Math.max(-bound, Math.min(bound, playerGroup.position.z));

  // Camera follow (third-person)
  const camDist = 8;
  const camHeight = 3 + cameraPitch * 4;
  const targetCamX = playerGroup.position.x - Math.sin(cameraYaw) * camDist;
  const targetCamZ = playerGroup.position.z - Math.cos(cameraYaw) * camDist;
  camera.position.x += (targetCamX - camera.position.x) * 5 * dt;
  camera.position.z += (targetCamZ - camera.position.z) * 5 * dt;
  camera.position.y += (camHeight - camera.position.y) * 5 * dt;
  camera.lookAt(playerGroup.position.x, 1.5, playerGroup.position.z);

  // Shadow follow
  sunLight.target.position.copy(playerGroup.position);
  sunLight.position.set(
    playerGroup.position.x + 50,
    80,
    playerGroup.position.z + 30
  );

  // Cactus collision
  const px = playerGroup.position.x;
  const pz = playerGroup.position.z;
  const now = elapsed;

  for (const c of cacti) {
    const dist = Math.hypot(c.x - px, c.z - pz);
    if (dist < PLAYER_RADIUS + c.radius) {
      if (now - lastDamageTime > DAMAGE_COOLDOWN) {
        health -= CACTUS_DAMAGE;
        lastDamageTime = now;
        flashDamage();

        // Push player back
        const pushX = (px - c.x) / dist;
        const pushZ = (pz - c.z) / dist;
        playerGroup.position.x += pushX * 0.8;
        playerGroup.position.z += pushZ * 0.8;
      }
    }
  }

  // Water collection
  for (const w of waterDrops) {
    if (!w.active) {
      w.respawnTimer -= dt;
      if (w.respawnTimer <= 0) {
        w.active = true;
        w.x = (Math.random() - 0.5) * WORLD_SIZE * 1.5;
        w.z = (Math.random() - 0.5) * WORLD_SIZE * 1.5;
        w.mesh.position.set(w.x, 0, w.z);
        w.mesh.visible = true;
      }
      continue;
    }

    // Animate
    w.mesh.children[0].position.y = 1.2 + Math.sin(elapsed * 3 + w.x) * 0.2;
    w.mesh.children[0].rotation.y = elapsed * 2;
    w.mesh.children[1].rotation.z = elapsed;

    const dist = Math.hypot(w.x - px, w.z - pz);
    if (dist < 1.5) {
      w.active = false;
      w.respawnTimer = WATER_RESPAWN_TIME;
      w.mesh.visible = false;
      health = Math.min(100, health + WATER_HEAL);
      waterCollected++;
      score += 50;
    }
  }

  // Dust update
  for (let i = dustParticles.length - 1; i >= 0; i--) {
    const d = dustParticles[i];
    d.life -= dt;
    d.mesh.position.y += d.vy * dt;
    d.mesh.material.opacity = d.life;
    d.mesh.scale.setScalar(1 + (0.5 - d.life) * 2);
    if (d.life <= 0) {
      scene.remove(d.mesh);
      dustParticles.splice(i, 1);
    }
  }

  // Tumbleweeds
  for (const tw of tumbleweeds) {
    tw.mesh.position.x += tw.vx * dt;
    tw.mesh.position.z += tw.vz * dt;
    tw.mesh.rotation.x += tw.rotSpeed * dt;
    tw.mesh.rotation.z += tw.rotSpeed * dt * 0.7;
    // Wrap around
    if (Math.abs(tw.mesh.position.x) > WORLD_SIZE) tw.mesh.position.x *= -0.9;
    if (Math.abs(tw.mesh.position.z) > WORLD_SIZE) tw.mesh.position.z *= -0.9;
  }

  // Game over
  if (health <= 0) {
    health = 0;
    gameRunning = false;
    document.exitPointerLock();
    finalScoreEl.textContent = `Score: ${Math.floor(score)} | Water: ${waterCollected}`;
    gameOverScreen.style.display = 'flex';
  }

  updateUI();
  drawMinimap();
}

function animate() {
  requestAnimationFrame(animate);
  update();
  renderer.render(scene, camera);
}

// ── Init ──
function startGame() {
  // Clear old
  while (cactusGroup.children.length) cactusGroup.remove(cactusGroup.children[0]);
  while (waterGroup.children.length) waterGroup.remove(waterGroup.children[0]);
  cacti.length = 0;
  waterDrops.length = 0;

  health = 100;
  score = 0;
  waterCollected = 0;
  elapsed = 0;
  lastDamageTime = 0;

  playerGroup.position.set(0, 0, 0);
  cameraYaw = 0;
  cameraPitch = 0.4;

  spawnCacti();
  spawnWaterDrops();
  updateUI();

  startScreen.style.display = 'none';
  gameOverScreen.style.display = 'none';
  gameRunning = true;
  clock.getDelta(); // reset
}

document.getElementById('start-btn').addEventListener('click', startGame);
document.getElementById('restart-btn').addEventListener('click', startGame);

spawnRocks();
spawnTumbleweeds();
animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>

/* Suno bg music loop (audio-overhaul): self-contained WebAudio player.

(function(){var st=0,g=null;function m(){try{if(typeof muted!=="undefined")return !!muted;if(window.GF&&"muted" in GF)return !!GF.muted;}catch(e){}return false;}function go(){if(st)return;st=1;try{var C=window.AudioContext||window.webkitAudioContext;var x=new C();fetch("audio/bg_loop.mp3").then(function(r){return r.arrayBuffer()}).then(function(b){return x.decodeAudioData(b)}).then(function(buf){g=x.createGain();g.gain.value=m()?0:0.4;g.connect(x.destination);var s=x.createBufferSource();s.buffer=buf;s.loop=true;s.connect(g);s.start();setInterval(function(){try{g.gain.value=m()?0:0.4;}catch(e){}},300);document.addEventListener("visibilitychange",function(){try{document.hidden?x.suspend():(!m()&&x.resume());}catch(e){}});});}catch(e){}}
["pointerdown","keydown","touchstart"].forEach(function(ev){document.addEventListener(ev,go,true)});})();
