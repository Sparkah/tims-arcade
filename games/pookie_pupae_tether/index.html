// Per-attempt runtime objects (rebuilt on startLevel)

function mkCreature(kind) {
  return { kind: kind, x: 0, y: 0, vx: 0, vy: 0, w: kind === 'pookie' ? POOKIE_W : PUPAE_W,
           h: kind === 'pookie' ? POOKIE_H : PUPAE_H, onGround: false, squash: 0, blink: Math.random() * 3,
           face: 0, atExit: false };
}

// ── LEVEL DATA ───────────────────────────────────────────────────────────
// Each level: { spawnP:[x,y], spawnU:[x,y], flower:[x,y], plat:[[x,y,w,h],...],

//   switch:[[x,y,gateId],...], lever:[[x,y,gateId],...], gate:[[id,x,y,w,h],...],

// Authored in DESIGN_W x DESIGN_H (480x800) portrait space. y grows downward.

// playfield fills a portrait screen and each puzzle is a real climb/swing.
// Side walls at x=[0..24] and x=[456..480] keep the duo on-screen.
var WALL_L = [0, 0, 24, 800], WALL_R = [456, 0, 24, 800];
var LEVELS = [

    gate:[[1,300,220,30,180]],

  // L4 — patrolling pest below, climb a tower above; Pupae shoves the bug.

  // L5 — tether swing: anchor Pupae on the post, swing Pookie over the pit.

    plat:[WALL_L, WALL_R, [24,360,150,30], [330,360,150,30], [60,300,40,60], [24,640,432,40]],

  // L6 — moving leaf platform bridges two towers.
  { twist:'mover', spawnP:[60,640], spawnU:[120,640], flower:[400,240],

    berry:[[250,520],[120,260]] },
  // L7 — honey slows you on the mid-ledge; a bug guards the top.
  { twist:'honey', spawnP:[60,680], spawnU:[120,680], flower:[400,220],
    plat:[WALL_L, WALL_R, [24,720,432,80], [80,540,320,28], [300,380,156,28], [60,260,200,28]],
    honey:[[140,524,220,16]],
    pest:[[360,366,280,430]],
    berry:[[330,360],[120,240]] },
  // L8 — water: Pupae floats across, ferry Pookie on its back; climb out.

    gate:[[2,300,300,30,240]],
    berry:[[360,500],[200,320]] },

  { twist:'combo1', spawnP:[60,680], spawnU:[120,680], flower:[400,200],
    plat:[WALL_L, WALL_R, [24,720,432,80], [60,560,180,28], [280,560,176,28], [120,400,240,28], [120,240,240,30]],
    switch:[[100,544,3]], gate:[[3,300,300,30,260]],
    pest:[[280,386,260,430]],
    berry:[[330,380],[200,300]] },
  // L11 — moving platform over a pool, then a swing to the goal.
  { twist:'combo2', spawnP:[60,360], spawnU:[110,360], flower:[400,300],
    plat:[WALL_L, WALL_R, [24,420,150,30], [330,420,150,30], [60,360,40,60], [24,640,432,40]],

  // L12 — capstone: switch + swing + pest + a high goal.
  { twist:'capstone', spawnP:[55,680], spawnU:[110,680], flower:[400,180],
    plat:[WALL_L, WALL_R, [24,720,180,80], [300,720,180,80], [300,560,156,28], [60,560,40,60], [120,420,260,28], [120,260,260,30]],
    switch:[[110,544,4]], gate:[[4,300,320,30,240]],
    pest:[[280,406,260,430]],

    berry:[[330,400],[200,320]] },
];

// Daily level = a deterministic re-skin of one base level by date seed.
function dailyLevelDef() {
  var base = LEVELS[(daySeed() % LEVELS.length)];
  return base;
}
function daySeed() {
  var d = new Date();
  return (d.getFullYear() * 372 + (d.getMonth() + 1) * 31 + d.getDate());
}

// ── PERSISTENCE KEYS ─────────────────────────────────────────────────────
var SAVE = 'pookie_pupae_tether';

function loadProgress() {
  try {
    maxUnlocked  = parseInt(localStorage.getItem(SAVE + '_unlocked') || '1') || 1;
    totalStars   = parseInt(localStorage.getItem(SAVE + '_stars') || '0') || 0;
    costume      = parseInt(localStorage.getItem(SAVE + '_costume') || '0') || 0;
    var ls = JSON.parse(localStorage.getItem(SAVE + '_levelstars') || '[]');
    if (Array.isArray(ls)) levelStars = ls;
    var co = JSON.parse(localStorage.getItem(SAVE + '_costumes') || 'null');
    if (Array.isArray(co)) costumesOwned = co;
  } catch (e) {}
  costumesOwned[0] = true;
  refreshDailyKeys();
}
function saveProgress() {
  try {
    localStorage.setItem(SAVE + '_unlocked', maxUnlocked);
    localStorage.setItem(SAVE + '_stars', totalStars);
    localStorage.setItem(SAVE + '_costume', costume);
    localStorage.setItem(SAVE + '_levelstars', JSON.stringify(levelStars));
    localStorage.setItem(SAVE + '_costumes', JSON.stringify(costumesOwned));
  } catch (e) {}
}
function refreshDailyKeys() {
  var d = new Date();
  dailyKey = d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate();
  dailyDoneKey = SAVE + '_daily_' + dailyKey;
}
function dailyDone() {
  try { return !!localStorage.getItem(dailyDoneKey); } catch (e) { return false; }
}
function markDailyDone() { try { localStorage.setItem(dailyDoneKey, '1'); } catch (e) {} }

// ── LEVEL BUILD ──────────────────────────────────────────────────────────
var isDaily = false;

function buildLevel(def) {
  platforms = []; pests = []; berries = []; switches = []; levers = []; gates = []; movers = []; waters = []; honeys = [];
  berriesGotThisRun = 0;
  (def.plat || []).forEach(function(p) { platforms.push({ x: p[0], y: p[1], w: p[2], h: p[3] }); });
  (def.water || []).forEach(function(p) { waters.push({ x: p[0], y: p[1], w: p[2], h: p[3] }); });
  (def.honey || []).forEach(function(p) { honeys.push({ x: p[0], y: p[1], w: p[2], h: p[3] }); });
  (def.gate || []).forEach(function(g) { gates.push({ id: g[0], x: g[1], y: g[2], w: g[3], h: g[4], open: false, t: 0 }); });
  (def.switch || []).forEach(function(s) { switches.push({ x: s[0], y: s[1], gateId: s[2], on: false }); });
  (def.lever || []).forEach(function(l) { levers.push({ x: l[0], y: l[1], gateId: l[2], on: false }); });
  (def.mover || []).forEach(function(m) {
    movers.push({ x0: m[0], y0: m[1], x: m[0], y: m[1], w: m[2], h: m[3], dx: m[4], dy: m[5], range: m[6], speed: m[7], t: 0 });
  });
  (def.pest || []).forEach(function(p) { pests.push({ x: p[0], y: p[1], w: PEST_W, h: PEST_H, min: p[2], max: p[3], dir: 1, t: Math.random() * 6 }); });
  var bs = def.berry || [];
  for (var i = 0; i < bs.length; i++) berries.push({ x: bs[i][0], y: bs[i][1], got: false });
  berryPairsTotal = Math.max(1, Math.floor(berries.length / 2));
  flower.x = def.flower[0]; flower.y = def.flower[1];
  pookie = mkCreature('pookie'); pupae = mkCreature('pupae');
  pookie.x = def.spawnP[0]; pookie.y = def.spawnP[1];
  pupae.x  = def.spawnU[0]; pupae.y  = def.spawnU[1];
}

function startLevel(n, daily) {
  isDaily = !!daily;
  level = daily ? 0 : n;
  lives = START_LIVES;
  activeChar = 'pookie';
  var def = daily ? dailyLevelDef() : LEVELS[n - 1];
  buildLevel(def);
  gs = 'PLAYING';
  winFlash = 0;
  GF.gameStarted();
  maybeStartTutorial();
  saveRun();
}

function softReset() {
  // Re-spawn both creatures at level start, keep lives count, re-arm berries.
  var def = isDaily ? dailyLevelDef() : LEVELS[level - 1];
  buildLevel(def);   // also re-arms berries (forgiving — they re-collect this attempt)
  activeChar = 'pookie';
  GF.juice.flash('rgba(255,120,150,0.5)', 220);
  GF.juice.shake(6, 260);
}

function loseLife(who) {
  if (gs !== 'PLAYING') return;
  if (GF.tutorial.active) return;  // no-fail during teach
  lives--;
  GF.sfx('hurt');
  if (who) GF.juice.particles.burst(who.x * GF.S - camX, who.y * GF.S - camY, { color: COL.bad, count: 14, speed: 200 });
  if (lives <= 0) {
    if (!firstDeathMarked) { firstDeathMarked = true; }
    gs = 'GAMEOVER';
    GF.gameEnded();
    saveRun();
  } else {
    softReset();
  }
}

// ── WIN / STARS ──────────────────────────────────────────────────────────
function computeStars() {
  var got = 0;
  for (var i = 0; i < berries.length; i++) if (berries[i].got) got++;
  var pairs = Math.floor(got / 2);
  return Math.min(MAX_STARS, 1 + pairs);
}

function winLevel() {
  var earned = computeStars();
  lastWinStars = earned;
  lastWinIsDaily = isDaily;
  GF.sfx('win');
  GF.happytime();
  GF.juice.particles.burst(flower.x * GF.S - camX, flower.y * GF.S - camY, { color: COL.flower, count: 26, speed: 230, life: 0.9 });

  if (isDaily) {
    markDailyDone();
    // Daily grants a flat couple of stars (capped) toward costumes.
    var add = Math.min(MAX_STARS, earned);
    totalStars += add;
  } else {
    var idx = level;
    var prev = levelStars[idx] || 0;
    if (earned > prev) { totalStars += (earned - prev); levelStars[idx] = earned; }
    if (level >= maxUnlocked && level < TOTAL_LEVELS) maxUnlocked = level + 1;
    if (!firstUpgradeMarked) { firstUpgradeMarked = true; }
  }
  // Auto-unlock any costume now affordable.
  for (var c = 1; c < COSTUME_COST.length; c++) {
    if (!costumesOwned[c] && totalStars >= COSTUME_COST[c]) { costumesOwned[c] = true; }
  }
  saveProgress();
  gs = 'WIN';
  winFlash = 1;
  GF.gameEnded();
  saveRun();
}

// ── FUNNEL MARKS ─────────────────────────────────────────────────────────
var firstDeathMarked = false, firstUpgradeMarked = false;

// ── TUTORIAL ─────────────────────────────────────────────────────────────
var tutStage = -1;  // -1 inactive; 0/1/2 active step
function maybeStartTutorial() {
  if (isDaily || level !== 1) return;
  var started = GF.tutorial.start([
    { _key: SAVE + '_seen_tutorial', advance: 'manual',
      text: GF.t('tut1'),
      target: function() { return { x: flower.x * GF.S - camX, y: flower.y * GF.S - camY, r: 34 * GF.S }; },
      target2: function() { return { x: GF.W * 0.72, y: GF.H * 0.5, r: 28 * GF.S }; }, gesture: 'tap' },
    { advance: 'manual', text: GF.t('tut2'),
      target: function() { return swapBtnTarget(); } },
    { advance: 'manual', text: GF.t('tut3'),
      target: function() { return { x: flower.x * GF.S - camX, y: flower.y * GF.S - camY, r: 34 * GF.S }; } },
  ], { storageKey: SAVE + '_seen_tutorial' });
  tutStage = started ? 0 : -1;
}

// ── INPUT: left/right screen-half steer + SWAP button ────────────────────
var heldDir = 0;      // -1 left, +1 right, 0 none (touch)
var swapBtn = { x: 0, y: 0, w: 0, h: 0 };
var helpBtn = { x: 0, y: 0, r: 0 };
var muteBtn = { x: 0, y: 0, r: 0 };
var backBtn = { x: 0, y: 0, w: 0, h: 0 };

function swapBtnTarget() {
  return { x: swapBtn.x + swapBtn.w / 2, y: swapBtn.y + swapBtn.h / 2, r: swapBtn.w / 2 };
}

function activeCre() { return activeChar === 'pookie' ? pookie : pupae; }
function otherCre()  { return activeChar === 'pookie' ? pupae : pookie; }

function doSwap() {
  activeChar = (activeChar === 'pookie') ? 'pupae' : 'pookie';
  GF.sfx('click');
  var a = activeCre();
  a.squash = 0.5;
  GF.juice.particles.burst(a.x * GF.S - camX, a.y * GF.S - camY, { color: COL.ribbon, count: 8, speed: 120, life: 0.4 });
  if (GF.tutorial.active && tutStage === 1) { tutStage = 2; GF.tutorial.next(); }
}

function tryJump() {
  var a = activeCre();
  if (a.onGround) {
    a.vy = -JUMP_V * GF.S;
    a.onGround = false;
    a.squash = 0.6;
    GF.sfx('tap');
  }
}

// Pointer handling — wire through canvas events directly (steer by side-half).
var canvas = document.getElementById('c');
var pointerDownX = 0, pointerDownY = 0, pointerMoved = false, pointerStartT = 0;

function rectF() { return canvas.getBoundingClientRect(); }
function toCanvas(clientX, clientY) {
  var r = rectF();
  return { x: (clientX - r.left) * (canvas.width / r.width) / (window.devicePixelRatio || 1),
           y: (clientY - r.top) * (canvas.height / r.height) / (window.devicePixelRatio || 1) };
}

function onDown(cx, cy) {
  pointerDownX = cx; pointerDownY = cy; pointerMoved = false; pointerStartT = Date.now();
  // Tutorial intercepts first.
  if (GF.tutorial.active) {
    var consumed = GF.tutorial.handleClick(cx, cy);
    // For the SWAP step, also let the real swap button work.
    if (tutStage === 1 && hit(swapBtn, cx, cy)) { doSwap(); return; }
    if (consumed && tutStage !== 0 && tutStage !== 2) return;
    // step 0 / 2 advance via movement, so fall through to steering.
  }
  if (gs === 'MAP')      { onMapDown(cx, cy); return; }
  if (gs === 'WARDROBE') { onWardrobeDown(cx, cy); return; }
  if (gs === 'WIN')      { onWinDown(cx, cy); return; }
  if (gs === 'GAMEOVER') { onGameOverDown(cx, cy); return; }
  if (gs === 'PLAYING') {
    // UI buttons first
    if (hit(swapBtn, cx, cy)) { doSwap(); return; }
    if (hitC(helpBtn, cx, cy)) { GF.tutorial.reopen(); tutStage = 0; return; }
    if (hitC(muteBtn, cx, cy)) { GF.toggleMute(); persistMute(); return; }
    if (hit(backBtn, cx, cy)) { gs = 'MAP'; GF.sfx('click'); saveRun(); return; }
    if (_pendingAd) { return; }  // (no ad UI in v0.1; placeholder)
    // Otherwise: steer toward the tapped half.
    heldDir = (cx < GF.W / 2) ? -1 : 1;
  }
}
function onMove(cx, cy) {
  if (Math.abs(cx - pointerDownX) > 8 || Math.abs(cy - pointerDownY) > 8) pointerMoved = true;
  if (gs === 'PLAYING' && heldDir !== 0) {
    heldDir = (cx < GF.W / 2) ? -1 : 1;  // allow dragging across the midline
  }
}
function onUp(cx, cy) {
  if (gs === 'PLAYING') {
    // quick tap (short, little movement) on a side → forgiving small jump
    var quick = (Date.now() - pointerStartT) < 200 && !pointerMoved;
    if (quick && !hit(swapBtn, cx, cy) && !hitC(helpBtn, cx, cy) && !hitC(muteBtn, cx, cy) && !hit(backBtn, cx, cy)) {
      tryJump();
    }
    heldDir = 0;
  }
}

canvas.addEventListener('mousedown', function(e) { var p = toCanvas(e.clientX, e.clientY); onDown(p.x, p.y); });
canvas.addEventListener('mousemove', function(e) { var p = toCanvas(e.clientX, e.clientY); onMove(p.x, p.y); });
window.addEventListener('mouseup', function(e) { var p = toCanvas(e.clientX, e.clientY); onUp(p.x, p.y); });
canvas.addEventListener('touchstart', function(e) { if (e.changedTouches[0]) { var t = e.changedTouches[0]; var p = toCanvas(t.clientX, t.clientY); onDown(p.x, p.y); } }, { passive: true });
canvas.addEventListener('touchmove', function(e) { if (e.changedTouches[0]) { var t = e.changedTouches[0]; var p = toCanvas(t.clientX, t.clientY); onMove(p.x, p.y); } }, { passive: true });
window.addEventListener('touchend', function(e) { if (e.changedTouches[0]) { var t = e.changedTouches[0]; var p = toCanvas(t.clientX, t.clientY); onUp(p.x, p.y); } }, { passive: true });

function hit(b, x, y) { return x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h; }
function hitC(b, x, y) { var dx = x - b.x, dy = y - b.y; return dx * dx + dy * dy <= b.r * b.r * 1.6; }

// ── MAP / WARDROBE / WIN / GAMEOVER click maps ───────────────────────────
var mapNodes = [];
function onMapDown(cx, cy) {
  if (hit(dailyBtn, cx, cy)) { if (!dailyDone()) { startLevel(0, true); } else { GF.sfx('error'); } return; }
  if (hit(wardrobeBtn, cx, cy)) { gs = 'WARDROBE'; GF.sfx('click'); return; }
  if (hitC(muteBtn, cx, cy)) { GF.toggleMute(); persistMute(); return; }
  for (var i = 0; i < mapNodes.length; i++) {
    var n = mapNodes[i];
    if (hit(n, cx, cy) && n.lvl <= maxUnlocked) { startLevel(n.lvl, false); return; }
  }
}
var wardrobeTiles = [];
function onWardrobeDown(cx, cy) {
  if (hit(backBtn, cx, cy)) { gs = 'MAP'; GF.sfx('click'); return; }
  for (var i = 0; i < wardrobeTiles.length; i++) {
    var t = wardrobeTiles[i];
    if (hit(t, cx, cy)) {
      if (costumesOwned[t.idx]) { costume = t.idx; GF.sfx('unlock'); saveProgress(); }
      else { GF.sfx('error'); }
      return;
    }
  }
}
function onWinDown(cx, cy) {
  if (hit(winNextBtn, cx, cy)) {
    if (!lastWinIsDaily && level < TOTAL_LEVELS) startLevel(level + 1, false);
    else { gs = 'MAP'; GF.sfx('click'); }
    return;
  }
  if (hit(winMapBtn, cx, cy)) { gs = 'MAP'; GF.sfx('click'); return; }
}
function onGameOverDown(cx, cy) {
  if (hit(goRetryBtn, cx, cy)) { startLevel(isDaily ? 0 : level, isDaily); return; }
  if (hit(goMapBtn, cx, cy)) { gs = 'MAP'; GF.sfx('click'); return; }
}

// Button rects (assigned during draw so they match current layout/scale)
var dailyBtn = {x:0,y:0,w:0,h:0}, wardrobeBtn = {x:0,y:0,w:0,h:0}, playBtn = {x:0,y:0,w:0,h:0};
var winNextBtn = {x:0,y:0,w:0,h:0}, winMapBtn = {x:0,y:0,w:0,h:0};
var goRetryBtn = {x:0,y:0,w:0,h:0}, goMapBtn = {x:0,y:0,w:0,h:0};

// ── KEYBOARD (desktop parity, same 2 affordances) ────────────────────────
var _pendingAd = false;
window.addEventListener('keydown', function(e) {
  if (gs !== 'PLAYING') {
    if (e.code === 'Enter' || e.code === 'Space') {
      if (gs === 'GAMEOVER') startLevel(isDaily ? 0 : level, isDaily);
      else if (gs === 'WIN') onWinDown(winNextBtn.x + 1, winNextBtn.y + 1);
    }
    return;
  }
  if (e.code === 'ArrowLeft' || e.code === 'KeyA') heldDir = -1;
  else if (e.code === 'ArrowRight' || e.code === 'KeyD') heldDir = 1;
  else if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') tryJump();
  else if (e.code === 'Tab') { e.preventDefault(); doSwap(); }
});
window.addEventListener('keyup', function(e) {
  if ((e.code === 'ArrowLeft' || e.code === 'KeyA') && heldDir === -1) heldDir = 0;
  if ((e.code === 'ArrowRight' || e.code === 'KeyD') && heldDir === 1) heldDir = 0;
});

function persistMute() { try { localStorage.setItem(SAVE + '_muted', GF.muted ? '1' : '0'); } catch (e) {} }

// ── PHYSICS HELPERS (AABB) ───────────────────────────────────────────────
function aabb(ax, ay, aw, ah, bx, by, bw, bh) {
  return ax < bx + bw && ax + aw > bx && ay < by + bh && ay + ah > by;
}
function creOnHoney(c) {
  for (var i = 0; i < honeys.length; i++) {
    var h = honeys[i];
    if (aabb(c.x - c.w/2, c.y - c.h/2, c.w, c.h, h.x, h.y - 4, h.w, h.h + 8)) return true;
  }
  return false;
}
function solids() {
  // Platforms + closed gates + movers + (Pupae stands on water).
  var s = platforms.slice();
  for (var i = 0; i < gates.length; i++) if (!gates[i].open) s.push(gates[i]);
  for (var j = 0; j < movers.length; j++) s.push(movers[j]);
  return s;
}

function moveCreature(c, ax, isActive) {
  var honeyF = creOnHoney(c) ? 0.45 : 1;
  var speedMult = (CFG.tuning.speed_mult || 1);
  c.vx += ax * MOVE_ACCEL * GF.S * honeyF * speedMult;
  c.vx *= MOVE_FRICTION;
  if (Math.abs(c.vx) < 0.02 * GF.S) c.vx = 0;
  if (ax !== 0) c.face = ax > 0 ? 1 : -1;

  var grav = GRAVITY * GF.S * (CFG.tuning.gravity_mult || 1);
  c.vy += grav;
  if (c.vy > 16 * GF.S) c.vy = 16 * GF.S;

  // Pupae floats on water
  var floats = false;
  if (c.kind === 'pupae') {
    for (var w = 0; w < waters.length; w++) {
      var wa = waters[w];
      if (aabb(c.x - c.w/2, c.y - c.h/2 + c.h*0.4, c.w, c.h*0.6, wa.x, wa.y, wa.w, wa.h)) {
        // buoyancy: push up to float at surface
        var surf = wa.y;
        if (c.y + c.h/2 > surf + 8) { c.vy -= grav * 1.8; c.vy *= 0.86; floats = true; c.onGround = true; }
      }
    }
  }

  // Horizontal move + resolve
  c.x += c.vx;
  var ss = solids();
  for (var i = 0; i < ss.length; i++) {
    var p = ss[i];
    if (aabb(c.x - c.w/2, c.y - c.h/2, c.w, c.h, p.x, p.y, p.w, p.h)) {
      if (c.vx > 0) c.x = p.x - c.w/2;
      else if (c.vx < 0) c.x = p.x + p.w + c.w/2;
      c.vx = 0;
    }
  }
  // Pookie can stand on Pupae (Pupae is a platform/anchor when idle-ish)
  if (c.kind === 'pookie') {
    if (aabb(c.x - c.w/2, c.y - c.h/2, c.w, c.h, pupae.x - pupae.w/2, pupae.y - pupae.h/2, pupae.w, pupae.h)) {
      if (c.vx > 0) c.x = pupae.x - pupae.w/2 - c.w/2 + 2;
      else if (c.vx < 0) c.x = pupae.x + pupae.w/2 + c.w/2 - 2;
    }
  }

  // Vertical move + resolve
  c.y += c.vy;
  var wasAir = !c.onGround;
  c.onGround = floats;
  for (var k = 0; k < ss.length; k++) {
    var q = ss[k];
    if (aabb(c.x - c.w/2, c.y - c.h/2, c.w, c.h, q.x, q.y, q.w, q.h)) {
      if (c.vy > 0) { c.y = q.y - c.h/2; c.onGround = true; if (q.dx !== undefined) { c.x += (q._lastDx||0); } }
      else if (c.vy < 0) { c.y = q.y + q.h + c.h/2; }
      c.vy = 0;
    }
  }
  // Pookie lands on Pupae's head
  if (c.kind === 'pookie') {
    if (aabb(c.x - c.w/2, c.y - c.h/2, c.w, c.h, pupae.x - pupae.w/2, pupae.y - pupae.h/2, pupae.w, pupae.h)) {
      if (c.vy > 0 && c.y < pupae.y) { c.y = pupae.y - pupae.h/2 - c.h/2; c.onGround = true; c.vy = 0; }
    }
  }
  if (c.onGround && wasAir && c.vy === 0) {
    c.squash = 0.5;
    GF.sfx('click');
    GF.juice.particles.burst(c.x * GF.S - camX, (c.y + c.h/2) * GF.S - camY, { color: c.kind === 'pookie' ? COL.pookieDk : COL.pupaeDk, count: 5, speed: 80, life: 0.3, gravity: 300 });
  }
}

// ── TETHER (spring constraint) ───────────────────────────────────────────
function applyTether() {
  var dx = pupae.x - pookie.x, dy = pupae.y - pookie.y;
  var d = Math.sqrt(dx * dx + dy * dy) || 0.0001;
  if (d > TETHER_MAX) {
    var over = d - TETHER_MAX;
    var nx = dx / d, ny = dy / d;
    // Pull both toward each other; the NON-active one moves more (player drags it).
    var pull = over * TETHER_K;
    var aP = (activeChar === 'pookie') ? 0.25 : 0.75;  // active resists, inactive yields
    var aU = 1 - aP;
    pookie.x += nx * pull * aP; pookie.y += ny * pull * aP * 0.6;
    pupae.x  -= nx * pull * aU; pupae.y  -= ny * pull * aU * 0.6;
    // give the dragged one a little velocity so it can be yanked off ledges
    if (activeChar === 'pookie') { pupae.vx -= nx * pull * 0.4; }
    else { pookie.vx += nx * pull * 0.4; }
  }
}

// ── UPDATE ───────────────────────────────────────────────────────────────
function update(dt) {
  GF.juice.update(dt);
  // creature idle anim
  pookie.blink += dt; pupae.blink += dt;
  if (pookie.squash > 0) pookie.squash = Math.max(0, pookie.squash - dt * 4);
  if (pupae.squash > 0)  pupae.squash  = Math.max(0, pupae.squash  - dt * 4);
  if (starBurst) { starBurst.t -= dt; if (starBurst.t <= 0) starBurst = null; }

  GF.tutorial.update(dt);

  if (gs !== 'PLAYING') { winFlash = Math.max(0, winFlash - dt); return; }

  // During the tutorial, freeze pests (no-fail) but allow movement so steps gate.
  // _ssFreeze also holds the pose for screenshots (no hazards/death).
  if (_ssFreeze > 0) _ssFreeze--;
  var freezeHazards = GF.tutorial.active || _ssFreeze > 0;

  // Input → active creature accel
  var ax = 0;
  if (heldDir !== 0) ax = heldDir;
  if (GF.keys && (GF.keys['ArrowLeft'] || GF.keys['KeyA'])) ax = -1;
  if (GF.keys && (GF.keys['ArrowRight'] || GF.keys['KeyD'])) ax = 1;

  var a = activeCre();
  var prevPX = pookie.x;
  // Auto-hop: if active creature walks into a 1-step ledge, hop it.
  autoHop(a, ax);
  moveCreature(a, ax, true);
  // The other creature: gentle gravity + settle, no steering.
  moveCreature(otherCre(), 0, false);

  applyTether();

  // Tutorial step gating by movement
  if (GF.tutorial.active) {
    if (tutStage === 0 && pookie.x > prevPX + 1 && pookie.x > LEVELS[0].spawnP[0] + 60) { tutStage = 1; GF.tutorial.next(); }
    else if (tutStage === 2 && activeChar === 'pupae' && pupae.vx > 0.3 * GF.S) {
      GF.tutorial.next();   // ends tutorial
      if (!tutDoneMarked) { tutDoneMarked = true; }
      tutStage = -1;
    }
  }

  // Pests
  for (var i = 0; i < pests.length; i++) {
    var pe = pests[i];
    pe.t += dt;
    if (!freezeHazards) {
      // chase Pookie if near, else patrol
      var chase = false;
      var ddx = pookie.x - pe.x;
      if (Math.abs(ddx) < 120 && Math.abs(pookie.y - pe.y) < 40) { pe.dir = ddx > 0 ? 1 : -1; chase = true; }
      pe.x += pe.dir * PEST_SPEED * GF.S * (chase ? 1.15 : 1);
      if (pe.x < pe.min) { pe.x = pe.min; pe.dir = 1; }
      if (pe.x > pe.max) { pe.x = pe.max; pe.dir = -1; }
    }
    // collisions
    if (aabb(pookie.x - pookie.w/2, pookie.y - pookie.h/2, pookie.w, pookie.h, pe.x - pe.w/2, pe.y - pe.h/2, pe.w, pe.h)) {
      if (!freezeHazards) loseLife(pookie);
    }
    // Pupae shoves the pest harmlessly
    if (aabb(pupae.x - pupae.w/2, pupae.y - pupae.h/2, pupae.w, pupae.h, pe.x - pe.w/2, pe.y - pe.h/2, pe.w, pe.h)) {
      pe.dir = (pe.x > pupae.x) ? 1 : -1;
      pe.x += pe.dir * 4 * GF.S;
      GF.sfx('pickup');
    }
  }

  // Movers
  for (var m = 0; m < movers.length; m++) {
    var mo = movers[m];
    mo.t += dt;
    var prevX = mo.x, prevY = mo.y;
    var off = Math.sin(mo.t * mo.speed) * mo.range;
    mo.x = mo.x0 + mo.dx * off;
    mo.y = mo.y0 + mo.dy * off;
    mo._lastDx = mo.x - prevX;
    // carry creatures resting on top
    [pookie, pupae].forEach(function(c) {
      if (Math.abs((c.y + c.h/2) - mo.y) < 6 && c.x > mo.x - mo.w/2 - c.w/2 && c.x < mo.x + mo.w/2 + c.w/2 && c.onGround) {
        c.x += (mo.x - prevX); c.y += (mo.y - prevY);
      }
    });
  }

  // Switches (Pupae weight only)
  for (var s = 0; s < switches.length; s++) {
    var sw = switches[s];
    var on = aabb(pupae.x - pupae.w/2, pupae.y - pupae.h/2 + 4, pupae.w, pupae.h, sw.x - 22, sw.y - 6, 44, 18);
    if (on !== sw.on) { sw.on = on; setGate(sw.gateId, on); GF.sfx(on ? 'levelup' : 'click'); }
  }
  // Levers (Pookie touch toggles)
  for (var l = 0; l < levers.length; l++) {
    var lv = levers[l];
    var touch = aabb(pookie.x - pookie.w/2, pookie.y - pookie.h/2, pookie.w, pookie.h, lv.x - 16, lv.y - 24, 32, 36);
    if (touch && !lv._wasTouch) { lv.on = !lv.on; setGate(lv.gateId, lv.on); GF.sfx('levelup'); }
    lv._wasTouch = touch;
  }

  // Berries (collect in pairs by index; pair = i, i+1)
  for (var b = 0; b < berries.length; b++) {
    var be = berries[b];
    if (be.got) continue;
    if (touchCre(pookie, be.x, be.y, BERRY_R) || touchCre(pupae, be.x, be.y, BERRY_R)) {
      be.got = true; berriesGotThisRun++;
      GF.sfx('coin');
      GF.juice.particles.burst(be.x * GF.S - camX, be.y * GF.S - camY, { color: COL.berry, count: 9, speed: 150, life: 0.5 });
      // award a star pip when a full pair completes
      var gotCount = 0; for (var z = 0; z < berries.length; z++) if (berries[z].got) gotCount++;
      if (gotCount % 2 === 0) {
        GF.juice.floatText(flower.x * GF.S - camX, (flower.y - 40) * GF.S - camY, '+1', { color: COL.star, size: 22 * GF.S, life: 1 });
        starBurst = { x: flower.x, y: flower.y - 40, t: 0.9 };
      }
    }
  }

  // Death by falling
  [pookie, pupae].forEach(function(c) {
    // Pookie sinks in water
    if (c.kind === 'pookie') {
      for (var w = 0; w < waters.length; w++) {
        var wa = waters[w];
        if (aabb(c.x - c.w/2, c.y + c.h*0.2, c.w, c.h*0.3, wa.x, wa.y + 6, wa.w, wa.h)) {
          // only drown if NOT standing on pupae
          var onPup = Math.abs((c.y + c.h/2) - (pupae.y - pupae.h/2)) < 8 && Math.abs(c.x - pupae.x) < pupae.w/2 + c.w/2;
          if (!onPup && !freezeHazards) { loseLife(c); }
        }
      }
    }
    if (c.y > DEATH_Y && !freezeHazards) loseLife(c);
  });

  // Win check: both overlap the flower
  pookie.atExit = touchCre(pookie, flower.x, flower.y, FLOWER_R);
  pupae.atExit  = touchCre(pupae, flower.x, flower.y, FLOWER_R);
  if (pookie.atExit && pupae.atExit && gs === 'PLAYING' && !GF.tutorial.active) {
    winLevel();
  }

  updateCamera();
  saveRunThrottle(dt);
}

function autoHop(c, ax) {
  if (!c.onGround || ax === 0) return;
  // look ahead: if a low step (<= ~JUMP reachable) is directly ahead at foot, hop
  var aheadX = c.x + ax * (c.w / 2 + 6);
  var footY = c.y + c.h / 2;
  var ss = solids();
  for (var i = 0; i < ss.length; i++) {
    var p = ss[i];
    if (aheadX > p.x && aheadX < p.x + p.w) {
      var stepTop = p.y;
      var rise = footY - stepTop;
      if (rise > 4 && rise < 56 * GF.S) { c.vy = -JUMP_V * GF.S * 0.92; c.onGround = false; c.squash = 0.5; GF.sfx('tap'); return; }
    }
  }
}

function setGate(id, open) {
  for (var i = 0; i < gates.length; i++) if (gates[i].id === id) gates[i].open = open;
}
function touchCre(c, x, y, r) {
  // circle (x,y,r) vs creature AABB
  var nx = Math.max(c.x - c.w/2, Math.min(x, c.x + c.w/2));
  var ny = Math.max(c.y - c.h/2, Math.min(y, c.y + c.h/2));
  var dx = x - nx, dy = y - ny;
  return dx * dx + dy * dy <= r * r;
}

function updateCamera() {
  // Levels fit one screen in portrait; center on midpoint of the two, clamp.
  var midX = (pookie.x + pupae.x) / 2, midY = (pookie.y + pupae.y) / 2;
  var targetX = midX * GF.S - GF.W / 2;
  var targetY = midY * GF.S - GF.H / 2;
  var worldW = DESIGN_W * GF.S, worldH = DESIGN_H * GF.S;
  targetX = GF.clamp(targetX, 0, Math.max(0, worldW - GF.W));
  targetY = GF.clamp(targetY, 0, Math.max(0, worldH - GF.H));
  // For portrait, usually world fits; keep gentle follow
  camX += (targetX - camX) * 0.12;
  camY += (targetY - camY) * 0.12;
  if (worldW <= GF.W) camX = (worldW - GF.W) / 2;
  if (worldH <= GF.H) camY = (worldH - GF.H) / 2;
}

// ── SAVE/RUN ─────────────────────────────────────────────────────────────
var _saveAcc = 0;
function saveRunThrottle(dt) { _saveAcc += dt; if (_saveAcc > 2) { _saveAcc = 0; saveRun(); } }
function saveRun() { try { GF.saveRun(); } catch (e) {} }
var tutDoneMarked = false;

// ── DRAW ─────────────────────────────────────────────────────────────────
function draw(ctx) {
  drawBackground(ctx);
  if (gs === 'PLAYING' || gs === 'WIN' || gs === 'GAMEOVER') {
    ctx.save();
    var ox = GF.juice.offsetX || 0, oy = GF.juice.offsetY || 0;
    ctx.translate(-camX + ox, -camY + oy);
    drawWorld(ctx);
    ctx.restore();
    GF.juice.particles.draw(ctx);
    GF.juice.texts.draw(ctx);
    drawHUD(ctx);
  }
  if (gs === 'MAP')      drawMap(ctx);
  if (gs === 'WARDROBE') drawWardrobe(ctx);
  if (gs === 'WIN')      drawWinOverlay(ctx);
  if (gs === 'GAMEOVER') drawGameOverOverlay(ctx);

  GF.tutorial.draw(ctx);
  GF.juice.drawFlash(ctx);
}

function drawBackground(ctx) {
  var g = ctx.createLinearGradient(0, 0, 0, GF.H);
  g.addColorStop(0, COL.skyTop); g.addColorStop(1, COL.skyBot);
  ctx.fillStyle = g; ctx.fillRect(0, 0, GF.W, GF.H);
  // soft blurred leaf blobs (parallax-ish, static)
  ctx.save();
  ctx.globalAlpha = 0.28;
  var blobs = [[0.15, 0.2, 70], [0.8, 0.32, 90], [0.5, 0.12, 55], [0.25, 0.7, 80], [0.85, 0.78, 70]];
  for (var i = 0; i < blobs.length; i++) {
    ctx.fillStyle = i % 2 ? COL.leaf : '#bfe3c0';
    ctx.beginPath();
    ctx.ellipse(blobs[i][0] * GF.W, blobs[i][1] * GF.H, blobs[i][2] * GF.S, blobs[i][2] * 0.7 * GF.S, 0, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
}

function wx(x) { return x * GF.S; }
function wy(y) { return y * GF.S; }

function drawWorld(ctx) {
  var S = GF.S;
  // Water
  for (var w = 0; w < waters.length; w++) {
    var wa = waters[w];
    ctx.fillStyle = COL.water;
    GF.rr(ctx, wa.x * S, wa.y * S, wa.w * S, wa.h * S, 8 * S); ctx.fill();
    ctx.fillStyle = COL.waterDk; ctx.globalAlpha = 0.5;
    for (var ww = 0; ww < wa.w; ww += 26) {
      ctx.beginPath();
      ctx.arc((wa.x + ww + 13) * S, (wa.y + 6) * S + Math.sin((performance.now()/400) + ww) * 2 * S, 8 * S, Math.PI, 0);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }
  // Platforms
  for (var i = 0; i < platforms.length; i++) drawPlatform(ctx, platforms[i]);
  // Movers
  for (var m = 0; m < movers.length; m++) {
    var mo = movers[m];
    // mover x is left-edge in data; draw at x..x+w
    ctx.fillStyle = COL.groundDk;
    GF.rr(ctx, mo.x * S, mo.y * S, mo.w * S, mo.h * S, 7 * S); ctx.fill();
    ctx.fillStyle = COL.leaf;
    GF.rr(ctx, mo.x * S, mo.y * S, mo.w * S, 5 * S, 4 * S); ctx.fill();
  }
  // Honey
  for (var h = 0; h < honeys.length; h++) {
    var ho = honeys[h];
    ctx.fillStyle = COL.honey;
    GF.rr(ctx, ho.x * S, ho.y * S, ho.w * S, ho.h * S, 6 * S); ctx.fill();
    ctx.fillStyle = COL.honeyDk; ctx.globalAlpha = 0.6;
    for (var d = 0; d < ho.w; d += 22) { ctx.beginPath(); ctx.arc((ho.x + d + 11) * S, (ho.y + ho.h) * S, 4 * S, 0, Math.PI * 2); ctx.fill(); }
    ctx.globalAlpha = 1;
  }
  // Gates
  for (var gI = 0; gI < gates.length; gI++) {
    var ga = gates[gI];
    if (ga.open) continue;
    ctx.fillStyle = COL.gate;
    GF.rr(ctx, ga.x * S, ga.y * S, ga.w * S, ga.h * S, 5 * S); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.4)'; ctx.lineWidth = 2 * S;
    for (var yy = ga.y + 14; yy < ga.y + ga.h; yy += 18) { ctx.beginPath(); ctx.moveTo(ga.x * S, yy * S); ctx.lineTo((ga.x + ga.w) * S, yy * S); ctx.stroke(); }
  }
  // Switches
  for (var s = 0; s < switches.length; s++) {
    var sw = switches[s];
    ctx.fillStyle = sw.on ? COL.switchOn : COL.switchOff;
    GF.rr(ctx, (sw.x - 24) * S, (sw.y - (sw.on ? 2 : 6)) * S, 48 * S, (sw.on ? 10 : 14) * S, 5 * S); ctx.fill();
    ctx.fillStyle = 'rgba(0,0,0,0.12)';
    GF.rr(ctx, (sw.x - 28) * S, (sw.y + 8) * S, 56 * S, 6 * S, 3 * S); ctx.fill();
  }
  // Levers
  for (var lv = 0; lv < levers.length; lv++) {
    var le = levers[lv];
    ctx.fillStyle = '#9c7a4e';
    GF.rr(ctx, (le.x - 4) * S, le.y * S, 8 * S, 20 * S, 3 * S); ctx.fill();
    ctx.save(); ctx.translate(le.x * S, le.y * S); ctx.rotate(le.on ? 0.6 : -0.6);
    ctx.fillStyle = COL.lever; GF.rr(ctx, -4 * S, -26 * S, 8 * S, 28 * S, 4 * S); ctx.fill();
    ctx.fillStyle = le.on ? COL.good : COL.berry; ctx.beginPath(); ctx.arc(0, -26 * S, 7 * S, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }
  // Berries
  for (var b = 0; b < berries.length; b++) { if (!berries[b].got) drawBerry(ctx, berries[b]); }
  // Pests (clearly a hazard — danger ring + warm tint)
  for (var pp = 0; pp < pests.length; pp++) drawPest(ctx, pests[pp]);
  // Exit flower (inanimate glowing goal)
  drawFlower(ctx);
  // Star pop when a berry pair completes (vector, not glyph)
  if (starBurst) {
    var sp = 1 - starBurst.t / 0.9;
    drawStar(ctx, starBurst.x * S, (starBurst.y - sp * 24) * S, (10 + sp * 14) * S, true);
  }
  // Tether ribbon
  drawTether(ctx);
  // Creatures (draw inactive first, active on top)
  if (activeChar === 'pookie') { drawCreature(ctx, pupae); drawCreature(ctx, pookie); }
  else { drawCreature(ctx, pookie); drawCreature(ctx, pupae); }
}

function drawPlatform(ctx, p) {
  var S = GF.S;
  ctx.fillStyle = COL.ground;
  GF.rr(ctx, p.x * S, p.y * S, p.w * S, p.h * S, Math.min(10 * S, p.w*S/2, p.h*S/2)); ctx.fill();
  // grassy top
  ctx.fillStyle = COL.leaf;
  GF.rr(ctx, p.x * S, p.y * S, p.w * S, Math.min(8 * S, p.h*S), 4 * S); ctx.fill();
  ctx.fillStyle = COL.groundDk; ctx.globalAlpha = 0.4;
  GF.rr(ctx, p.x * S, (p.y + p.h - 6) * S, p.w * S, 6 * S, 3 * S); ctx.fill();
  ctx.globalAlpha = 1;
}

function drawBerry(ctx, be) {
  var S = GF.S, x = be.x * S, y = be.y * S, bob = Math.sin(performance.now()/300 + be.x) * 2 * S;
  ctx.save(); ctx.translate(x, y + bob);
  ctx.fillStyle = COL.berry; ctx.beginPath(); ctx.arc(0, 0, BERRY_R * S * 0.85, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.55)'; ctx.beginPath(); ctx.arc(-3 * S, -3 * S, 3 * S, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = COL.berryLeaf; ctx.beginPath(); ctx.ellipse(0, -BERRY_R * S * 0.85, 5 * S, 3 * S, 0.4, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

// Pest — render so it UNMISTAKABLY reads as a hazard: a pulsing red danger
// ring + spiky warning halo under a warm-tinted sprite. Cartoon-menacing,
// never realistic (Yandex 8.3.6).
function drawPest(ctx, pe) {
  var S = GF.S, x = pe.x * S, y = pe.y * S;
  var t = performance.now() / 1000;
  var pulse = 0.5 + 0.5 * Math.sin(t * 5);
  ctx.save();
  // soft red danger halo
  ctx.globalAlpha = 0.22 + pulse * 0.18;
  var hr = (PEST_W * 0.85 + pulse * 6) * S;
  var g = ctx.createRadialGradient(x, y, hr * 0.3, x, y, hr);
  g.addColorStop(0, 'rgba(255,90,70,0.5)'); g.addColorStop(1, 'rgba(255,90,70,0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, hr, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
  // spiky dashed warning ring
  ctx.save();
  ctx.globalAlpha = 0.5 + pulse * 0.4;
  ctx.strokeStyle = '#ff5a46'; ctx.lineWidth = 2.2 * S;
  ctx.setLineDash([4 * S, 5 * S]); ctx.lineDashOffset = -t * 26;
  ctx.beginPath(); ctx.arc(x, y, (PEST_W * 0.6) * S, 0, Math.PI * 2); ctx.stroke();
  ctx.restore();
  // contact shadow
  ctx.save(); ctx.globalAlpha = 0.16; ctx.fillStyle = '#3a2a32';
  ctx.beginPath(); ctx.ellipse(x, y + PEST_H * 0.5 * S, PEST_W * 0.45 * S, 4 * S, 0, 0, Math.PI * 2); ctx.fill(); ctx.restore();
  // sprite (warm tint multiply so it skews danger even if the art is soft)
  var sz = Math.max(PEST_W, PEST_H) * 1.7 * S;
  var wob = Math.sin(t * 8 + pe.x) * 1.5 * S;  // angry jitter
  GF.drawSprite('pest', x + wob, y, sz, function(c, cx, cy, s) {
    drawPestFallback(c, cx, cy, s, t);
  });
  ctx.restore();
}
function drawPestFallback(c, x, y, s, t) {
  // spiky-shelled grumpy bug
  c.save(); c.translate(x, y);
  // spikes
  c.fillStyle = '#b0432e';
  for (var i = 0; i < 8; i++) { c.save(); c.rotate(i / 8 * Math.PI * 2);
    c.beginPath(); c.moveTo(-s*0.06, -s*0.28); c.lineTo(0, -s*0.42); c.lineTo(s*0.06, -s*0.28); c.closePath(); c.fill(); c.restore(); }
  // body
  c.fillStyle = '#e0653f'; c.beginPath(); c.ellipse(0, 0, s*0.3, s*0.27, 0, 0, Math.PI*2); c.fill();
  c.fillStyle = '#c2502e'; c.beginPath(); c.ellipse(0, s*0.06, s*0.3, s*0.2, 0, 0, Math.PI*2); c.fill();
  // angry brows + eyes
  c.strokeStyle = '#3a1e16'; c.lineWidth = s*0.045; c.lineCap = 'round';
  c.beginPath(); c.moveTo(-s*0.18, -s*0.12); c.lineTo(-s*0.04, -s*0.05); c.moveTo(s*0.18, -s*0.12); c.lineTo(s*0.04, -s*0.05); c.stroke();
  c.fillStyle = '#3a1e16';
  c.beginPath(); c.arc(-s*0.11, -s*0.01, s*0.045, 0, Math.PI*2); c.fill();
  c.beginPath(); c.arc(s*0.11, -s*0.01, s*0.045, 0, Math.PI*2); c.fill();
  // frown
  c.strokeStyle = '#3a1e16'; c.lineWidth = s*0.04;
  c.beginPath(); c.arc(0, s*0.18, s*0.08, Math.PI*1.15, Math.PI*1.85); c.stroke();
  c.restore();
}

function drawFlower(ctx) {
  var S = GF.S, x = flower.x * S, y = flower.y * S;
  var t = performance.now();
  var pulse = 0.5 + 0.5 * Math.sin(t / 350);
  // ── GOAL GLOW: a soft golden radial bloom so it obviously reads as the target
  ctx.save();
  ctx.globalAlpha = 0.5 + pulse * 0.35;
  var gr = (FLOWER_R + 16 + pulse * 12) * S;
  var rg = ctx.createRadialGradient(x, y, gr * 0.25, x, y, gr);
  rg.addColorStop(0, 'rgba(255,224,120,0.85)'); rg.addColorStop(1, 'rgba(255,224,120,0)');
  ctx.fillStyle = rg; ctx.beginPath(); ctx.arc(x, y, gr, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
  // rotating sparkle ring
  ctx.save();
  ctx.globalAlpha = 0.55 + pulse * 0.45;
  ctx.strokeStyle = COL.flowerCore; ctx.lineWidth = 2.5 * S;
  ctx.setLineDash([3 * S, 7 * S]); ctx.lineDashOffset = -t / 240;
  ctx.beginPath(); ctx.arc(x, y, (FLOWER_R + 8) * S, 0, Math.PI * 2); ctx.stroke();
  ctx.restore();
  // little twinkles orbiting the goal
  ctx.save();
  for (var k = 0; k < 3; k++) {
    var a = t / 700 + k * (Math.PI * 2 / 3);
    var tx = x + Math.cos(a) * (FLOWER_R + 14) * S, ty = y + Math.sin(a) * (FLOWER_R + 14) * S;
    var tw = (0.6 + 0.4 * Math.sin(t / 200 + k)) * 3 * S;
    ctx.fillStyle = '#fff8d8'; ctx.globalAlpha = 0.8;
    ctx.beginPath(); ctx.arc(tx, ty, tw, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
  var sz = FLOWER_R * 2.1 * S;
  GF.drawSprite('flower', x, y, sz, function(c, cx, cy, s) {
    // vector fallback — inanimate bloom, NO face
    c.save(); c.translate(cx, cy);
    for (var i = 0; i < 8; i++) { c.save(); c.rotate(i / 8 * Math.PI * 2); c.fillStyle = i % 2 ? '#ffd9e6' : COL.flower;
      c.beginPath(); c.ellipse(0, -s * 0.30, s * 0.15, s * 0.25, 0, 0, Math.PI * 2); c.fill(); c.restore(); }
    c.fillStyle = '#ffcf4d'; c.beginPath(); c.arc(0, 0, s * 0.20, 0, Math.PI * 2); c.fill();
    c.fillStyle = '#fff3c0'; c.beginPath(); c.arc(-s*0.05, -s*0.05, s * 0.08, 0, Math.PI * 2); c.fill();
    c.restore();
  });
  // both-home pips above flower
  drawHomePips(ctx, x, y - (FLOWER_R + 22) * S);
}

function drawHomePips(ctx, x, y) {
  var S = GF.S, r = 7 * S, gap = 20 * S;
  var pips = [{ on: pookie.atExit, col: COL.pookieDk }, { on: pupae.atExit, col: COL.pupaeDk }];
  for (var i = 0; i < 2; i++) {
    var px = x - gap / 2 + i * gap;
    ctx.fillStyle = pips[i].on ? COL.good : 'rgba(255,255,255,0.75)';
    ctx.beginPath(); ctx.arc(px, y, r, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = pips[i].col; ctx.lineWidth = 2 * S; ctx.stroke();
    if (pips[i].on) { ctx.strokeStyle = '#fff'; ctx.lineWidth = 2 * S; ctx.beginPath(); ctx.moveTo(px - 3*S, y); ctx.lineTo(px - 1*S, y + 3*S); ctx.lineTo(px + 4*S, y - 3*S); ctx.stroke(); }
  }
}

function drawTether(ctx) {
  var S = GF.S;
  var x1 = pookie.x * S, y1 = (pookie.y) * S, x2 = pupae.x * S, y2 = (pupae.y) * S;
  var midx = (x1 + x2) / 2, midy = (y1 + y2) / 2;
  var d = Math.hypot(x2 - x1, y2 - y1);
  var slack = Math.max(0, (TETHER_MAX * S - d)) * 0.4 + 8 * S;  // sag more when slack
  ctx.save();
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  // shadow ribbon
  ctx.strokeStyle = COL.ribbonDk; ctx.lineWidth = 7 * S;
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.quadraticCurveTo(midx, midy + slack, x2, y2); ctx.stroke();
  // top ribbon
  ctx.strokeStyle = COL.ribbon; ctx.lineWidth = 4.5 * S;
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.quadraticCurveTo(midx, midy + slack, x2, y2); ctx.stroke();
  // little heart bow at the sag midpoint
  ctx.fillStyle = COL.ribbon;
  ctx.beginPath(); ctx.arc(midx - 4 * S, midy + slack * 0.8, 4 * S, 0, Math.PI * 2); ctx.arc(midx + 4 * S, midy + slack * 0.8, 4 * S, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
  // taut warning glow
  if (d > TETHER_MAX * S * 0.92) {
    ctx.save(); ctx.globalAlpha = 0.5; ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5 * S;
    ctx.setLineDash([4 * S, 4 * S]);
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); ctx.restore();
  }
}

function drawCreature(ctx, c) {
  var S = GF.S;
  var x = c.x * S, y = c.y * S;
  var sq = c.squash;
  var sx = 1 + sq * 0.35, sy = 1 - sq * 0.35;
  var w = c.w * S, h = c.h * S;
  var isActive = (c.kind === activeChar);
  var t = performance.now();
  // ── ACTIVE creature: bold double glowing ring so "who am I steering" is instant
  if (isActive) {
    var pulse = 0.5 + 0.5 * Math.sin(t / 220);
    ctx.save();
    // soft glow disc under it
    ctx.globalAlpha = 0.30 + pulse * 0.22;
    var gr = ctx.createRadialGradient(x, y + h*0.1, w*0.3, x, y + h*0.1, w*1.15);
    gr.addColorStop(0, 'rgba(243,167,196,0.55)'); gr.addColorStop(1, 'rgba(243,167,196,0)');
    ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(x, y + h*0.1, w*1.15, 0, Math.PI*2); ctx.fill();
    ctx.restore();
    // bold solid ring + rotating dashed ring
    ctx.save();
    ctx.globalAlpha = 0.9;
    ctx.strokeStyle = COL.ribbonDk; ctx.lineWidth = 3.5 * S;
    ctx.beginPath(); ctx.ellipse(x, y + h * 0.1, w * 0.86 + pulse * 3 * S, h * 0.92 + pulse * 3 * S, 0, 0, Math.PI * 2); ctx.stroke();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 2 * S; ctx.globalAlpha = 0.7;
    ctx.setLineDash([5 * S, 6 * S]); ctx.lineDashOffset = -t / 200;
    ctx.beginPath(); ctx.ellipse(x, y + h * 0.1, w * 0.86 + pulse * 3 * S, h * 0.92 + pulse * 3 * S, 0, 0, Math.PI * 2); ctx.stroke();
    ctx.restore();
  }
  // contact shadow
  ctx.save(); ctx.globalAlpha = 0.18; ctx.fillStyle = '#3a2a32';
  ctx.beginPath(); ctx.ellipse(x, y + h / 2 + 2 * S, w * 0.5, 5 * S, 0, 0, Math.PI * 2); ctx.fill(); ctx.restore();

  ctx.save(); ctx.translate(x, y); ctx.scale(sx, sy);
  // Idle creature dimmed slightly so the active one pops.
  if (!isActive) ctx.globalAlpha = 0.74;
  var spriteSize = Math.max(w, h) * 1.5;
  GF.drawSprite(c.kind, 0, 0, spriteSize, function(cc, px, pyv, s) {
    drawCreatureFallback(cc, c, s);
  });
  drawCostume(ctx, c, w, h);
  ctx.restore();

  // ── Bouncing "you control me" chevron arrow above the ACTIVE creature
  if (isActive) {
    var bob = Math.abs(Math.sin(t / 240)) * 6 * S;
    var ayv = y - h * 0.7 - 10 * S - bob;
    ctx.save();
    ctx.fillStyle = COL.ribbonDk;
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.6 * S; ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(x, ayv + 8 * S);            // tip (points down at creature)
    ctx.lineTo(x - 8 * S, ayv - 4 * S);
    ctx.lineTo(x - 3 * S, ayv - 4 * S);
    ctx.lineTo(x - 3 * S, ayv - 9 * S);
    ctx.lineTo(x + 3 * S, ayv - 9 * S);
    ctx.lineTo(x + 3 * S, ayv - 4 * S);
    ctx.lineTo(x + 8 * S, ayv - 4 * S);
    ctx.closePath();
    ctx.fill(); ctx.stroke();
    ctx.restore();
  }
}

function drawCreatureFallback(c, cre, s) {
  var base = cre.kind === 'pookie' ? COL.pookie : COL.pupae;
  var dk = cre.kind === 'pookie' ? COL.pookieDk : COL.pupaeDk;
  c.fillStyle = dk; c.beginPath(); c.ellipse(0, s * 0.16, s * 0.36, s * 0.3, 0, 0, Math.PI * 2); c.fill();
  c.fillStyle = base; c.beginPath(); c.ellipse(0, 0, s * 0.34, s * 0.34, 0, 0, Math.PI * 2); c.fill();
  // eyes
  var blink = (cre.blink % 3.2) > 3.0 ? 0.1 : 1;
  c.fillStyle = '#3a2a32';
  c.beginPath(); c.ellipse(-s * 0.12, -s * 0.02, s * 0.06, s * 0.08 * blink, 0, 0, Math.PI * 2); c.fill();
  c.beginPath(); c.ellipse(s * 0.12, -s * 0.02, s * 0.06, s * 0.08 * blink, 0, 0, Math.PI * 2); c.fill();
  c.fillStyle = '#fff';
  c.beginPath(); c.arc(-s * 0.10, -s * 0.04, s * 0.02, 0, Math.PI * 2); c.fill();
  c.beginPath(); c.arc(s * 0.14, -s * 0.04, s * 0.02, 0, Math.PI * 2); c.fill();
  // cheeks
  c.fillStyle = 'rgba(240,140,170,0.5)';
  c.beginPath(); c.arc(-s * 0.2, s * 0.08, s * 0.05, 0, Math.PI * 2); c.fill();
  c.beginPath(); c.arc(s * 0.2, s * 0.08, s * 0.05, 0, Math.PI * 2); c.fill();
}

function drawCostume(ctx, c, w, h) {
  if (costume === 0) return;
  var topY = -h * 0.55;
  ctx.save();
  if (costume === 1) {            // bow
    ctx.fillStyle = COL.ribbon;
    ctx.beginPath(); ctx.moveTo(-2 * GF.S, topY); ctx.lineTo(-12 * GF.S, topY - 7 * GF.S); ctx.lineTo(-12 * GF.S, topY + 7 * GF.S); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(2 * GF.S, topY); ctx.lineTo(12 * GF.S, topY - 7 * GF.S); ctx.lineTo(12 * GF.S, topY + 7 * GF.S); ctx.closePath(); ctx.fill();
    ctx.fillStyle = COL.ribbonDk; ctx.beginPath(); ctx.arc(0, topY, 4 * GF.S, 0, Math.PI * 2); ctx.fill();
  } else if (costume === 2) {     // leaf hat
    ctx.fillStyle = COL.leaf;
    ctx.beginPath(); ctx.ellipse(0, topY - 2 * GF.S, 12 * GF.S, 7 * GF.S, 0.3, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = COL.groundDk; ctx.lineWidth = 1.5 * GF.S; ctx.beginPath(); ctx.moveTo(-8*GF.S, topY); ctx.lineTo(8*GF.S, topY - 3*GF.S); ctx.stroke();
  } else if (costume === 3) {     // crown
    ctx.fillStyle = COL.star;
    ctx.beginPath();
    ctx.moveTo(-12 * GF.S, topY + 4 * GF.S);
    ctx.lineTo(-12 * GF.S, topY - 4 * GF.S); ctx.lineTo(-6 * GF.S, topY); ctx.lineTo(0, topY - 6 * GF.S);
    ctx.lineTo(6 * GF.S, topY); ctx.lineTo(12 * GF.S, topY - 4 * GF.S); ctx.lineTo(12 * GF.S, topY + 4 * GF.S);
    ctx.closePath(); ctx.fill();
  }
  ctx.restore();
}

// ── HUD ──────────────────────────────────────────────────────────────────
function drawHUD(ctx) {
  var S = GF.S;
  // top bar: lives (left), level + pips (center handled at flower), stars (right), mute
  // hearts
  for (var i = 0; i < START_LIVES; i++) {
    var hx = (16 + i * 24) * S, hy = 22 * S;
    drawHeart(ctx, hx, hy, 9 * S, i < lives);
  }
  // level label (also the back-to-map tap target)
  ctx.fillStyle = COL.card;
  var lblW = 92 * S, lblH = 28 * S, lblX = GF.W / 2 - lblW / 2, lblY = 10 * S;
  GF.rr(ctx, lblX, lblY, lblW, lblH, 14 * S); ctx.fill();
  ctx.fillStyle = COL.ink; ctx.font = 'bold ' + (13 * S) + 'px Inter, system-ui, sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  var lvlTxt = isDaily ? GF.t('daily_label') : (GF.t('level') + ' ' + level);
  ctx.fillText(lvlTxt, GF.W / 2, lblY + lblH / 2);
  backBtn = { x: lblX, y: lblY, w: lblW, h: lblH };
  // a tiny back chevron to hint tappable
  ctx.strokeStyle = COL.cardLine; ctx.lineWidth = 2 * S;
  ctx.beginPath(); ctx.moveTo(lblX + 12 * S, lblY + lblH/2 - 4*S); ctx.lineTo(lblX + 8*S, lblY + lblH/2); ctx.lineTo(lblX + 12*S, lblY + lblH/2 + 4*S); ctx.stroke();

  // stars this run (right)
  var got = 0; for (var b = 0; b < berries.length; b++) if (berries[b].got) got++;
  var runStars = Math.min(MAX_STARS, 1 + Math.floor(got / 2));
  for (var s = 0; s < MAX_STARS; s++) {

function drawHeart(ctx, x, y, r, filled) {
  ctx.save(); ctx.translate(x, y);
  ctx.fillStyle = filled ? COL.berry : 'rgba(255,255,255,0.6)';
  ctx.beginPath();
  ctx.moveTo(0, r * 0.5);
  ctx.bezierCurveTo(-r, -r * 0.4, -r * 0.5, -r, 0, -r * 0.3);
  ctx.bezierCurveTo(r * 0.5, -r, r, -r * 0.4, 0, r * 0.5);
  ctx.fill();
  if (!filled) { ctx.strokeStyle = COL.berry; ctx.lineWidth = 1.5 * GF.S; ctx.stroke(); }
  ctx.restore();
}

function drawStar(ctx, x, y, r, filled) {
  ctx.save(); ctx.translate(x, y);
  ctx.fillStyle = filled ? COL.star : 'rgba(255,255,255,0.55)';
  ctx.beginPath();
  for (var i = 0; i < 5; i++) {
    var a = -Math.PI / 2 + i * Math.PI * 2 / 5;
    var a2 = a + Math.PI / 5;
    ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
    ctx.lineTo(Math.cos(a2) * r * 0.45, Math.sin(a2) * r * 0.45);
  }
  ctx.closePath(); ctx.fill();
  if (!filled) { ctx.strokeStyle = COL.star; ctx.lineWidth = 1.2 * GF.S; ctx.stroke(); }
  ctx.restore();
}

// number with a vector star to its left (no glyph in fillText)
function drawStarCount(ctx, cxp, cyp, n) {
  var S = GF.S;
  ctx.font = 'bold ' + (15 * S) + 'px Inter, system-ui, sans-serif';
  var txt = String(n);
  var tw = ctx.measureText(txt).width;

  ctx.fillStyle = COL.ribbonDk; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';

// ── MAP SCREEN ───────────────────────────────────────────────────────────
function drawMap(ctx) {
  var S = GF.S;
  // title
  ctx.fillStyle = COL.ink; ctx.font = 'bold ' + (26 * S) + 'px Inter, system-ui, sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  ctx.fillText(GF.t('title'), GF.W / 2, 24 * S);
  drawStarCount(ctx, GF.W / 2, 62 * S, totalStars);

  // two cute creatures peeking at top
  GF.drawSprite('pookie', GF.W * 0.5 - 46 * S, 96 * S, 56 * S, function(){});
  GF.drawSprite('pupae', GF.W * 0.5 + 46 * S, 100 * S, 60 * S, function(){});
  // ribbon between them
  ctx.strokeStyle = COL.ribbon; ctx.lineWidth = 4 * S; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(GF.W*0.5 - 30*S, 100*S); ctx.quadraticCurveTo(GF.W*0.5, 120*S, GF.W*0.5 + 30*S, 104*S); ctx.stroke();

  // level node grid
  mapNodes = [];
  var cols = 4, startY = 150 * S, nodeR = 26 * S, gapX = GF.W / (cols + 1), gapY = 64 * S;
  for (var i = 0; i < TOTAL_LEVELS; i++) {
    var col = i % cols, row = Math.floor(i / cols);
    var cxp = gapX * (col + 1), cyp = startY + row * gapY + nodeR;
    var lvl = i + 1;
    var unlocked = lvl <= maxUnlocked;
    var node = { x: cxp - nodeR, y: cyp - nodeR, w: nodeR * 2, h: nodeR * 2, lvl: lvl };
    mapNodes.push(node);
    // node circle
    ctx.fillStyle = unlocked ? (lvl === maxUnlocked && (levelStars[lvl]||0) === 0 ? '#fff7fb' : '#ffffff') : 'rgba(220,210,215,0.6)';
    ctx.save();
    if (unlocked) { ctx.shadowColor = 'rgba(224,123,165,0.4)'; ctx.shadowBlur = 8 * S; }
    ctx.beginPath(); ctx.arc(cxp, cyp, nodeR, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
    ctx.strokeStyle = unlocked ? COL.ribbon : 'rgba(150,140,145,0.5)'; ctx.lineWidth = 2.5 * S; ctx.stroke();
    // number or lock
    ctx.fillStyle = unlocked ? COL.ink : 'rgba(120,110,115,0.8)';
    ctx.font = 'bold ' + (18 * S) + 'px Inter, system-ui, sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    if (unlocked) ctx.fillText(String(lvl), cxp, cyp - 4 * S);
    else drawLock(ctx, cxp, cyp, 9 * S);
    // stars earned under node
    var st = levelStars[lvl] || 0;
    if (unlocked) for (var s = 0; s < MAX_STARS; s++) drawStar(ctx, cxp - 14 * S + s * 14 * S, cyp + 14 * S, 5 * S, s < st);
  }

  // BIG buttons row: DAILY + WARDROBE
  var rowY = GF.H - 150 * S;
  var bw = (GF.W - 48 * S) / 2, bh = 64 * S;
  dailyBtn = { x: 16 * S, y: rowY, w: bw, h: bh };
  wardrobeBtn = { x: GF.W - 16 * S - bw, y: rowY, w: bw, h: bh };
  var dReady = !dailyDone();
  drawBigButton(ctx, dailyBtn, GF.t('daily'), dReady ? COL.star : '#d9cdbf', dReady);
  drawBigButton(ctx, wardrobeBtn, GF.t('wardrobe'), COL.ribbon, false);

  // CONTINUE / PLAY big button (next unlocked level)
  playBtn = { x: 16 * S, y: GF.H - 74 * S, w: GF.W - 32 * S, h: 56 * S };

  var nextLvl = Math.min(maxUnlocked, TOTAL_LEVELS);
  drawBigButton(ctx, playBtn, GF.t('cont') + '  ·  ' + GF.t('level') + ' ' + nextLvl, COL.good, false);

  // mute
  muteBtn = { x: GF.W - 24 * S, y: 24 * S, r: 14 * S };
  GF.drawMuteIcon(ctx, muteBtn.x, muteBtn.y, 11 * S, GF.muted);

  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
}

function drawLock(ctx, x, y, r) {
  ctx.save(); ctx.translate(x, y);
  ctx.fillStyle = 'rgba(110,100,105,0.85)';
  GF.rr(ctx, -r, -r * 0.2, r * 2, r * 1.6, r * 0.3); ctx.fill();
  ctx.strokeStyle = 'rgba(110,100,105,0.85)'; ctx.lineWidth = 2 * GF.S;
  ctx.beginPath(); ctx.arc(0, -r * 0.2, r * 0.7, Math.PI, 0); ctx.stroke();
  ctx.restore();
}

function drawBigButton(ctx, b, label, col, glow) {
  var S = GF.S;
  ctx.save();
  if (glow) { var p = 0.5 + 0.5 * Math.sin(performance.now() / 300); ctx.shadowColor = col; ctx.shadowBlur = (8 + p * 12) * S; }
  else { ctx.shadowColor = 'rgba(0,0,0,0.15)'; ctx.shadowBlur = 6 * S; ctx.shadowOffsetY = 2 * S; }
  var grd = ctx.createLinearGradient(b.x, b.y, b.x, b.y + b.h);
  grd.addColorStop(0, lighten(col)); grd.addColorStop(1, col);
  ctx.fillStyle = grd; GF.rr(ctx, b.x, b.y, b.w, b.h, 16 * S); ctx.fill();
  ctx.restore();
  ctx.fillStyle = '#fff'; ctx.font = 'bold ' + (17 * S) + 'px Inter, system-ui, sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(label, b.x + b.w / 2, b.y + b.h / 2 + 1);
}
function lighten(hex) {
  if (hex[0] !== '#') return hex;
  var n = parseInt(hex.slice(1), 16), r = (n >> 16) + 30, g = ((n >> 8) & 255) + 30, b = (n & 255) + 30;
  r = Math.min(255, r); g = Math.min(255, g); b = Math.min(255, b);
  return 'rgb(' + r + ',' + g + ',' + b + ')';
}

// Reachability: every screen fits the viewport (no scroll). Report the main
// interactive targets per state so reachability_check.js can prove they're on-screen.
GF.exposeReach(function() {
  var items = [];
  function add(id, b) { if (b && b.w) items.push({ id: id, x: b.x, y: b.y, w: b.w, h: b.h }); }
  function addC(id, b) { if (b && b.r) items.push({ id: id, x: b.x - b.r, y: b.y - b.r, w: b.r * 2, h: b.r * 2 }); }
  if (gs === 'MAP') {
    for (var i = 0; i < mapNodes.length; i++) if (mapNodes[i].lvl <= maxUnlocked) add('lvl' + mapNodes[i].lvl, mapNodes[i]);
    add('daily', dailyBtn); add('wardrobe', wardrobeBtn); add('play', playBtn); addC('mute', muteBtn);
  } else if (gs === 'PLAYING') {
    add('swap', swapBtn); add('back', backBtn); addC('help', helpBtn); addC('mute', muteBtn);
  } else if (gs === 'WARDROBE') {
    for (var w = 0; w < wardrobeTiles.length; w++) add('costume' + wardrobeTiles[w].idx, wardrobeTiles[w]);
    add('back', backBtn);
  } else if (gs === 'WIN') { add('next', winNextBtn); add('map', winMapBtn); }
  else if (gs === 'GAMEOVER') { add('retry', goRetryBtn); add('map', goMapBtn); }
  return { screen: gs, items: items, screenH: GF.H, viewportH: GF.H };
});

// Tour: navigate the reachability checker across every screen.
GF.exposeTour([
  { name: 'MAP',      go: function() { gs = 'MAP'; } },
  { name: 'PLAYING',  go: function() { try { localStorage.setItem(SAVE + '_seen_tutorial', '1'); } catch (e) {} startLevel(4, false); GF.tutorial.active = false; } },
  { name: 'WARDROBE', go: function() { gs = 'WARDROBE'; } },
  { name: 'WIN',      go: function() { lastWinStars = 2; lastWinIsDaily = false; gs = 'WIN'; } },
  { name: 'GAMEOVER', go: function() { gs = 'GAMEOVER'; } },
]);

// Bot hook (lets the balance/funnel probe drive steering): actions = move L/R/swap
GF.exposeBot(
  function() { return ['left', 'right', 'swap', 'jump']; },
  function(a) {
    if (gs !== 'PLAYING') { if (gs === 'MAP') startLevel(Math.min(maxUnlocked, TOTAL_LEVELS), false); return; }
    if (a === 'left') heldDir = -1;
    else if (a === 'right') heldDir = 1;
    else if (a === 'swap') doSwap();
    else if (a === 'jump') tryJump();
  }
);

// Screenshot helper — drop into a mid-level with both creatures + tether +
// a hazard visible. Used by take_screenshots.js (via _jumpLevel).
window._setupForScreenshot = function(lvl) {
  maxUnlocked = TOTAL_LEVELS; totalStars = 18; costume = 1;
  try { localStorage.setItem(SAVE + '_seen_tutorial', '1'); } catch (e) {}
  var L = (lvl && lvl >= 1 && lvl <= TOTAL_LEVELS) ? lvl : 4;  // L4 = pest + climb tower
  startLevel(L, false);
  GF.tutorial.active = false; tutStage = -1;
  lives = START_LIVES;
  // Pose mid-level on a safe wide ledge so the tool's stray key-presses just
  // walk the duo harmlessly; tether spans, ledges + berries + goal in frame.
  if (L === 4) { pookie.x = 360; pookie.y = 416; pupae.x = 290; pupae.y = 416; activeChar = 'pookie'; }
  else if (L === 7) { pookie.x = 250; pookie.y = 516; pupae.x = 180; pupae.y = 516; }
  else { pookie.x = 240; pookie.y = 276; pupae.x = 160; pupae.y = 276; }
  pookie.vx = pookie.vy = pupae.vx = pupae.vy = 0;
  pookie.onGround = pupae.onGround = true;
  pookie.face = 1; pupae.face = 1;
  if (berries[0]) berries[0].got = true;   // show a filled star
  _ssFreeze = 26;  // ~26 frames: hold the pose (skip hazards/death) so the shot is clean
  updateCamera(); camX += (cameraTargetX() - camX); camY += (cameraTargetY() - camY);
};
var _ssFreeze = 0;  // screenshot pose-hold frames
// The screenshot tool calls _jumpLevel(n); make it land in a posed mid-level.
window._jumpLevel = function(n) { window._setupForScreenshot(n || 4); };
// Hooks for the locale-overflow checker (switch screen + read strings/font).
window._setState = function(st) {
  maxUnlocked = TOTAL_LEVELS; totalStars = 18;
  if (st === 'PLAYING') { window._setupForScreenshot(4); _ssFreeze = 0; }
  else if (st === 'MAP') { gs = 'MAP'; }
  else if (st === 'WARDROBE') { gs = 'WARDROBE'; }
  else if (st === 'WIN') { lastWinStars = 2; lastWinIsDaily = false; gs = 'WIN'; }
  else if (st === 'GAMEOVER') { gs = 'GAMEOVER'; }
};
window._getI18N = function() { return STRINGS; };
window._getFontBody = function() { return 'Inter, system-ui, sans-serif'; };
function cameraTargetX() { var w = DESIGN_W * GF.S; return (w <= GF.W) ? (w - GF.W) / 2 : GF.clamp(((pookie.x+pupae.x)/2) * GF.S - GF.W/2, 0, w - GF.W); }
function cameraTargetY() { var h = DESIGN_H * GF.S; return (h <= GF.H) ? (h - GF.H) / 2 : GF.clamp(((pookie.y+pupae.y)/2) * GF.S - GF.H/2, 0, h - GF.H); }

// ── BOOT ─────────────────────────────────────────────────────────────────
GF.init({
  designW: DESIGN_W,
  designH: DESIGN_H,
  strings: STRINGS,
  sprites: SPRITE_NAMES,
  saveKey: SAVE,
  onReady: function() {
    loadProgress();
    try { var m = localStorage.getItem(SAVE + '_muted'); if (m === '1') { if (!GF.muted) GF.toggleMute(); } } catch (e) {}

    // ── Persist run state across reload (Yandex 1.9) ──
    GF.persist(SAVE + '_run_v1',
      function() { return { gs: gs, level: level, lives: lives, activeChar: activeChar, isDaily: isDaily,
        pkx: pookie.x, pky: pookie.y, pux: pupae.x, puy: pupae.y,
        berries: berries.map(function(b){ return b.got ? 1 : 0; }) }; },
      function(s) {
        if (!s) return;
        if (s.gs === 'PLAYING' && typeof s.level === 'number') {
          isDaily = !!s.isDaily;
          var def = isDaily ? dailyLevelDef() : LEVELS[(s.level || 1) - 1];
          if (def) {
            level = s.level; buildLevel(def);
            lives = (typeof s.lives === 'number') ? s.lives : START_LIVES;
            activeChar = s.activeChar || 'pookie';
            if (typeof s.pkx === 'number') { pookie.x = s.pkx; pookie.y = s.pky; pupae.x = s.pux; pupae.y = s.puy; }
            if (Array.isArray(s.berries)) for (var i = 0; i < berries.length && i < s.berries.length; i++) berries[i].got = !!s.berries[i];
            gs = 'PLAYING';
            try { localStorage.setItem(SAVE + '_seen_tutorial', '1'); } catch (e) {}  // mid-run reload: don't re-teach
            return;
          }
        }
        gs = 'MAP';
      }
    );
    if (gs === 'PLAYING') { /* restored mid-run */ } else { gs = 'MAP'; }

    // ── MUSIC (HARD RULE 8) — looping calm bed, mute-aware ──
    GF.bgMusic({ file: 'audio/bg_track.mp3', preset: 'calm', muted: GF.muted });

    // ── REMOTE CONFIG (live-ops DATA channel; never blocks boot) ──
    GF.remoteConfig(SAVE, CFG, {
      clamps: { 'tuning.speed_mult': [0.6, 1.6], 'tuning.gravity_mult': [0.7, 1.4] },
      onUpdate: function(c) { CFG = c; },
    }).then(function(c) { CFG = c; });

    // ── PLATFORM AUTOSTART (HARD RULE 9) — drop straight into level 1 ──
    if (window.__GF_AUTOSTART && !window._silent && gs === 'MAP') {
      startLevel(Math.min(maxUnlocked || 1, TOTAL_LEVELS), false);
    }
  },
  onUpdate: update,
  onDraw: draw,
});

// ── YANDEX MUST-HAVES (kept) — GF.t() everywhere; GF.persist above;
// fullscreen-exit resize handled by gf-lib; ads on user-click only:
// _pendingAd flag is set on events and would be consumed in a click handler
// (no ad surface in v0.1 — dead-broke recovery is free: RETRY never blocks). ──

})();
</script>
