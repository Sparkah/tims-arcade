function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }

}
function face(c, x, y, r, skin) { c.fillStyle = skin; c.beginPath(); c.arc(x, y, r, 0, Math.PI * 2); c.fill(); }

function paintTele(c, x, y, r) {

function byId(id) { for (var i = 0; i < CAST.length; i++) if (CAST[i].id === id) return CAST[i]; return CAST[0]; }
function pickCaller() {
  var total = 0, i;
  for (i = 0; i < CAST.length; i++) total += CAST[i].weight;
  for (var tries = 0; tries < 7; tries++) {
    var rnd = Math.random() * total, acc = 0, chosen = CAST[0];
    for (i = 0; i < CAST.length; i++) { acc += CAST[i].weight; if (rnd <= acc) { chosen = CAST[i]; break; } }
    if (chosen.id !== prevId) return chosen;
  }
  return CAST[Math.floor(Math.random() * CAST.length)];
}

// ── LIFECYCLE ────────────────────────────────────────────────────────────
function startGame() {
  score = 0; streak = 0; mult = 1; hearts = 3; maxHearts = 3; callsHandled = 0;

  tutStep = tutorialDone ? -1 : 0;
  gs = 'PLAYING';
  GF.gameStarted();
  nextCall();
  GF.saveRun();
}
function nextCall() {
  pendingOver = false; lastResult = null;
  if (!tutorialDone && tutStep === 0) call = byId('pork');
  else if (!tutorialDone && tutStep === 1) call = byId('scam');
  else call = pickCaller();
  prevId = call.id;
  ringMax = clamp(3.4 - callsHandled * 0.07, 1.3, 3.4) * (CFG.tuning.ring_mult || 1);
  if (!tutorialDone && tutStep >= 0 && tutStep < 2) ringMax = 999; // freeze during teach

function tutActive() { return !tutorialDone && tutStep >= 0 && tutStep < 2 && gs === 'PLAYING' && phase === 'RING'; }

function decide(answered) {

  resolve(answered);

function resolve(answered) {

    mult = clamp(1 + Math.floor(streak / 3), 1, 8);
    var base = 10 * mult * (call.special === 'diq' ? 2 : 1);
    score += base;
    if (!call.good) { res.txt = GF.t('f_blocked'); res.col = '#9fd0ff'; GF.sfx('click'); burst(L.pcx, L.pcy, '#9fd0ff', 8, 3); }
    else if (call.special === 'gran' && hearts < maxHearts && Math.random() < 0.45) { hearts++; res.txt = GF.t('f_cookies'); res.col = '#ff9ecb'; GF.sfx('levelup'); burst(L.pcx, L.pcy, '#ff9ecb', 16, 4); }
    else if (call.special === 'diq') { res.txt = GF.t('f_double') + ' +' + base; res.col = '#c89bff'; flashCol = '#b06bff'; flash = 0.9; GF.sfx('reward'); burst(L.pcx, L.pcy, '#b06bff', 16, 5); }
    else { res.txt = GF.t('f_nice') + ' +' + base; GF.sfx('coin'); burst(L.pcx, L.pcy, '#7CFFB0', 8, 3); }

}

  else { res.txt = GF.t('f_missed'); GF.sfx('lose'); shake = 0.4; }

// ── UPDATE ───────────────────────────────────────────────────────────────
function update(dt) {
  t += dt;
  if (dt > 0.1) dt = 0.1;
  if (flash > 0) flash = Math.max(0, flash - dt * 1.8);
  if (shake > 0) shake = Math.max(0, shake - dt * 3.2);
  if (showHelp > 0) showHelp = Math.max(0, showHelp - dt);
  if (hintShake > 0) hintShake = Math.max(0, hintShake - dt * 2);
  for (var i = fx.length - 1; i >= 0; i--) {
    var p = fx[i]; p.x += p.vx; p.y += p.vy; p.vy += 0.18 * GF.S; p.life -= dt * 1.5;
    if (p.life <= 0) fx.splice(i, 1);
  }
  if (gs !== 'PLAYING') return;
  wobbleT += dt;
  var kd = GF.keys['ArrowLeft'] || GF.keys['KeyA'], ka = GF.keys['ArrowRight'] || GF.keys['KeyD'];
  if (phase === 'RING') {
    if (kd && !_kLatch) { _kLatch = true; decide(false); }
    else if (ka && !_kLatch) { _kLatch = true; decide(true); }
  }
  if (!kd && !ka) _kLatch = false;

  if (phase === 'RING') {
    if (!tutActive()) { ringT -= dt; if (ringT <= 0) { ringT = 0; timeout(); } }
  } else if (phase === 'RESULT') {
    phaseT -= dt;
    if (phaseT <= 0) { if (pendingOver) gameOver(); else nextCall(); }
  }
}

// ── LAYOUT ───────────────────────────────────────────────────────────────

  L.hudY = L.sbH + clamp(22 * S, 16, 34);
  L.heartX = L.colX + clamp(20 * S, 12, 30);

  L.btnR = clamp(CW * 0.135, 40, 96);
  var by = H - L.btnR - clamp(46 * S, 30, 80);
  L.btnDecline = { x: L.colX + CW * 0.27, y: by, r: L.btnR };
  L.btnAnswer = { x: L.colX + CW * 0.73, y: by, r: L.btnR };

}

// ── DRAW ─────────────────────────────────────────────────────────────────
function draw(ctx) {
  layout();

  var sx = 0, sy = 0;

  var accent = (call && gs === 'PLAYING') ? call.accent : '#6c5ce7';

  if (gs === 'MENU') drawMenu(ctx);

  drawFx(ctx);
  ctx.restore();
}

function drawHearts(ctx) {

  ctx.bezierCurveTo(x - r, y + r * 0.5, x - r * 0.4, y + r * 0.7, x, y + r * 1.0);
  ctx.bezierCurveTo(x + r * 0.4, y + r * 0.7, x + r, y + r * 0.5, x + r, y + r * 0.05);

// ── INPUT ────────────────────────────────────────────────────────────────
function onPress(x, y) {
  if (inCircle(x, y, L.btnMute)) { try { GF.toggleMute(); GF.setMusicMuted(GF.muted); } catch (e) {} return; }
  if (inCircle(x, y, L.btnHelp)) { showHelp = 4; tutorialDone = false; try { localStorage.removeItem('jp_tut_done'); } catch (e) {} return; }
  if (gs === 'MENU') { if (inRect(x, y, L.btnPlay)) startGame(); return; }
  if (gs === 'GAMEOVER') { if (inRect(x, y, L.btnPlay)) startGame(); return; }
  if (gs === 'PLAYING' && phase === 'RING') {
    if (inCircle(x, y, L.btnDecline)) decide(false);
    else if (inCircle(x, y, L.btnAnswer)) decide(true);
  }
}
var _cv = document.getElementById('c');
_cv.addEventListener('mousedown', function (e) { onPress(e.clientX, e.clientY); });
_cv.addEventListener('touchstart', function (e) {
  if (e.changedTouches && e.changedTouches.length) { e.preventDefault(); onPress(e.changedTouches[0].clientX, e.changedTouches[0].clientY); }
}, { passive: false });

// Screenshot helper - produce a busy mid-game frame (>=70% gameplay shots).
window._jumpLevel = function () {
  tutorialDone = true; startGame();
  score = 1280; streak = 9; mult = clamp(1 + Math.floor(streak / 3), 1, 8); callsHandled = 14; hearts = 2;
  call = byId('pork'); prevId = 'pork'; ringMax = 2.6; ringT = 1.7; phase = 'RING';
};

// ── BOOT ─────────────────────────────────────────────────────────────────
GF.init({
  designW: 450, designH: 800,
  strings: STRINGS, sprites: SPRITE_NAMES, saveKey: 'jp_calling',
  onReady: function () {
    try { best = parseInt(localStorage.getItem('jp_best') || '0') || 0; } catch (e) {}
    try { tutorialDone = localStorage.getItem('jp_tut_done') === '1'; } catch (e) {}
    GF.persist('jp_run_v1',
      function () { return { gs: (hearts <= 0 ? 'GAMEOVER' : gs), score: score, streak: streak, hearts: hearts, ch: callsHandled, best: Math.max(best, score) }; },
      function (s) {
        if (!s) return;
        if (s.best > best) best = s.best;
        if (s.gs === 'PLAYING') {
          score = s.score || 0; streak = s.streak || 0; mult = clamp(1 + Math.floor(streak / 3), 1, 8);
          hearts = Math.max(1, (typeof s.hearts === 'number' ? s.hearts : 3)); callsHandled = s.ch || 0; gs = 'PLAYING'; _resume = true;
        }
      }
    );
    if (_resume) { tutStep = tutorialDone ? -1 : 0; layout(); nextCall(); }
    else gs = 'MENU';

    GF.bgMusic({ file: 'audio/bg_track.mp3', preset: 'arcade', muted: GF.muted });
    GF.remoteConfig('jp_cfg', CFG, {
      clamps: { 'tuning.ring_mult': [0.6, 1.6] },
      onUpdate: function (c) { CFG = c; },
    }).then(function (c) { CFG = c; });

    GF.exposeState(function () { return { gs: gs, score: score, hearts: hearts, streak: streak, mult: mult, callsHandled: callsHandled, call: call ? call.id : null, phase: phase }; });
    GF.exposeBot(
      function () { return (gs === 'PLAYING' && phase === 'RING') ? ['answer', 'decline'] : []; },
      function (a) { if (gs === 'PLAYING' && phase === 'RING') { if (!tutorialDone && call) decide(call.good); else decide(a === 'answer'); } }
    );

    if (window.__GF_AUTOSTART && !window._silent && gs !== 'PLAYING') startGame();
  },
  onUpdate: update,
  onDraw: draw,
});

})();
</script>

/* Suno bg music loop (audio-overhaul): self-contained WebAudio player.
   Arms on first gesture; polls `muted`/GF.muted so existing mute toggles
   silence it; suspends on tab-hide (Yandex 1.3). */
(function(){var st=0,g=null;function m(){try{if(typeof muted!=="undefined")return !!muted;if(window.GF&&"muted" in GF)return !!GF.muted;}catch(e){}return false;}function go(){if(st)return;st=1;try{var C=window.AudioContext||window.webkitAudioContext;var x=new C();fetch("audio/bg_loop.mp3").then(function(r){return r.arrayBuffer()}).then(function(b){return x.decodeAudioData(b)}).then(function(buf){g=x.createGain();g.gain.value=m()?0:0.4;g.connect(x.destination);var s=x.createBufferSource();s.buffer=buf;s.loop=true;s.connect(g);s.start();setInterval(function(){try{g.gain.value=m()?0:0.4;}catch(e){}},300);document.addEventListener("visibilitychange",function(){try{document.hidden?x.suspend():(!m()&&x.resume());}catch(e){}});});}catch(e){}}
["pointerdown","keydown","touchstart"].forEach(function(ev){document.addEventListener(ev,go,true)});})();
