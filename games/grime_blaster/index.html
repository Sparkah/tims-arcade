<body>
<canvas id="c"></canvas>
<script src="./gf-lib.js"></script>
<script>
(function() {
'use strict';

// ── STRINGS (EN + RU — Yandex 8.2.3) ─────────────────────────────────────
var STRINGS = {
  en: {
    title: 'Grime Blaster',
    sub: 'Blast the filth. Beat the tank.',
    play: 'PLAY', retry: 'RETRY', next: 'NEXT JOB',
    clean: 'CLEAN', job: 'JOB', target: 'Strip to',
    water: 'WATER', soap: 'SOAP', shop: 'SHOP', back: 'BACK',
    gameover: 'OUT OF JOBS', spotless: 'SPOTLESS!',
    best: 'Best', bestjob: 'Best job', cash: 'Cash',
    refill: 'TANK DRY — TAP TO REFILL',
    refill_warn: 'Refilling costs 1 of 3 attempts',
    tool_water: 'WATER', tool_soap: 'SOAP',
    buy_nozzle: 'Nozzle', buy_pressure: 'Pressure', buy_tank: 'Tank', buy_soap: 'Soap',
    lvl: 'Lv', max: 'MAX', locked: 'LOCKED', paid: '+$',
    spotless_obj: 'Spotless = bonus $', help: 'HOW TO PLAY', close: 'tap to close',
    coach_spray: 'Hold & drag to BLAST the grime', coach_water: 'Fill the bar to the target line',
    coach_shop: 'Spend cash to upgrade your rig',
    tut_goal: 'Goal: Blast the grime until the surface is at least as clean as the target %.',
    tut_controls: 'Controls: Hold & drag anywhere to spray. Tap buttons for soap, shop, next job.',
    tut_win: 'Win: Endless — finish jobs for cash, upgrade your rig, push your record.',
    tut_lose: 'Lose: Fail 3 jobs (tank runs dry while still below target) and the run ends.',
    tut_tip: "Tip: Don't waste water on clean tiles. Grease needs soap; moss regrows; graffiti needs a close jet.",
    grease_hint: 'Grease! Switch to SOAP', moss_hint: 'Moss regrows if idle', graf_hint: 'Graffiti — hold close',
    attempts: 'Attempts',
  },
  ru: {
    title: 'Чистка Под Напором',
    sub: 'Смывай грязь. Береги бак.',
    play: 'ИГРАТЬ', retry: 'ЕЩЁ РАЗ', next: 'ДАЛЬШЕ',
    clean: 'ЧИСТО', job: 'ЗАКАЗ', target: 'Отмой до',
    water: 'ВОДА', soap: 'МЫЛО', shop: 'МАГАЗИН', back: 'НАЗАД',
    gameover: 'ЗАКАЗЫ КОНЧИЛИСЬ', spotless: 'ИДЕАЛЬНО!',
    best: 'Рекорд', bestjob: 'Лучший заказ', cash: 'Деньги',
    refill: 'БАК ПУСТ — НАЖМИ, ЧТОБЫ НАПОЛНИТЬ',
    refill_warn: 'Наполнение тратит 1 из 3 попыток',
    tool_water: 'ВОДА', tool_soap: 'МЫЛО',
    buy_nozzle: 'Сопло', buy_pressure: 'Напор', buy_tank: 'Бак', buy_soap: 'Мыло',
    lvl: 'Ур', max: 'МАКС', locked: 'ЗАКРЫТО', paid: '+$',
    spotless_obj: 'Идеально = бонус $', help: 'КАК ИГРАТЬ', close: 'нажми, чтобы закрыть',
    coach_spray: 'Зажми и веди — СМЫВАЙ грязь', coach_water: 'Заполни шкалу до отметки цели',
    coach_shop: 'Трать деньги на улучшения',
    tut_goal: 'Цель: смывай грязь, пока поверхность не станет чище указанного процента.',
    tut_controls: 'Управление: зажми и веди, чтобы мыть. Кнопки — мыло, магазин, дальше.',
    tut_win: 'Победа: бесконечно — выполняй заказы ради денег, улучшай аппарат, бей рекорд.',
    tut_lose: 'Поражение: провали 3 заказа (бак пуст, но цель не достигнута) — и конец.',
    tut_tip: 'Совет: не лей воду на чистое. Жир — мылом; мох отрастает; граффити — струёй вблизи.',
    grease_hint: 'Жир! Переключись на МЫЛО', moss_hint: 'Мох отрастает, если стоять', graf_hint: 'Граффити — мой вблизи',
    attempts: 'Попытки',
  },
};

var SPRITE_NAMES = ['nozzle', 'mud', 'grease', 'graffiti'];

// ── TUNABLES (DESIGN.md) ─────────────────────────────────────────────────
var TANK_SIZE   = 320;   // job-1 water; +90 per TANK lvl (≈27s of spray budget)
var WATER_DRAIN = 12;    // water/sec while jet fires
var SPRAY_RADIUS= 38;    // jet radius @ design scale; +14 per NOZZLE lvl
var LAYER_HP    = 0.85;  // spray-seconds dwell to strip one layer (snappy)
var TARGET_PCT  = 0.75;  // job-1 target
var JOB_SCALE   = 12;    // base grid cols
var SOAP_PER_LVL= 120;   // soap units per SOAP lvl
var JOB_BASE_PAY= 40;
var SPOTLESS_BONUS = 50;
var MOSS_REGROW = 6.0;   // sec idle before moss regrows a layer
var GRAF_DWELL  = 1.6;   // extra dwell multiplier for graffiti (close range)
var SOAP_DRAIN  = 16;    // soap/sec while soap jet fires
var MAX_FAILS   = 3;
var TANK_PER_LVL= 90;    // water added per TANK upgrade level

// layer type ids
var L_FILM=0, L_STAIN=1, L_MUD=2, L_GREASE=3, L_MOSS=4, L_GRAF=5;

// upgrade level caps
var CAP = { nozzle: 4, pressure: 1, tank: 5, soap: 3 }; // pressure lvl 0->1 (max 1 => strips 2)

// ── STATE ────────────────────────────────────────────────────────────────
var gs = 'PLAYING';            // PLAYING | JOBDONE | GAMEOVER | MENU
var jobNum = 1;
var cash = 0;
var failedJobs = 0;
var bestCash = 0, bestJob = 1;

var cols = 12, rows = 16;
var grid = [];                 // grid[r][c] = { layers:[typeIds top..], idle:sec, t:flash }
var totalCells = 0, cleanCells = 0;
var cleanPct = 0, target = TARGET_PCT;

var water = TANK_SIZE, soap = 0;
var tool = 'water';            // 'water' | 'soap'
var spotlessObjective = false;

// upgrades (run-scoped)
var up = { nozzle: 0, pressure: 0, tank: 0, soap: 0 };

// jet pointer
var spraying = false, jetX = 0, jetY = 0, jetT = 0;
var lastJetX = 0, lastJetY = 0;
var hissCooldown = 0;

// playfield rect (computed each layout)
var pf = { x: 0, y: 0, w: 0, h: 0, cell: 26 };

// coach / tutorial
var seenTut = false;
var coachStep = -1;            // -1 inactive, 0 spray, 1 water, 2 shop-hint (set at jobdone)
var coachArrowT = 0;
var helpOpen = false;
var hintMsg = null, hintT = 0;

// refill prompt
var needRefill = false;

// HUD button rects (filled in draw)
var btns = {};                 // name -> {x,y,w,h}
var shopBtns = {};             // shop buy buttons

var dragActive = false;        // pointer is down

// ── GRID / JOB SETUP ─────────────────────────────────────────────────────
function rint(a, b) { return a + Math.floor(Math.random() * (b - a + 1)); }
function chance(p) { return Math.random() < p; }

function jobTarget(n) {
  if (n === 1) return 0.75;
  if (n === 2) return 0.80;
  return GF.clamp(0.78 + n * 0.015, 0.78, 0.93);
}

function buildJob() {
  cols = Math.min(JOB_SCALE + Math.floor(jobNum / 2), 22);
  rows = Math.round(cols * 1.34);
  target = jobTarget(jobNum);
  spotlessObjective = (jobNum >= 4 && chance(0.5));

  // grime-type availability ramps with jobNum (the "new content" axis)
  var greaseOK = jobNum >= 2;
  var mossOK   = jobNum >= 4;
  var grafOK   = jobNum >= 6;

  // density of stacked layers ramps too
  var fillP   = GF.clamp(0.72 + jobNum * 0.02, 0.72, 0.97);   // chance a cell has any grime
  var deepP   = GF.clamp(0.30 + jobNum * 0.04, 0.30, 0.92);   // chance of 2+ layers
  var deepest = GF.clamp(0.10 + jobNum * 0.035, 0.10, 0.75);  // chance of full 3 layers

  grid = [];
  totalCells = cols * rows;
  cleanCells = 0;
  for (var r = 0; r < rows; r++) {
    var row = [];
    for (var c = 0; c < cols; c++) {
      var layers = [];
      if (chance(fillP)) {
        var depth = 1;
        if (chance(deepP)) depth = 2;
        if (chance(deepest)) depth = 3;
        // bottom-up build: film -> stain -> mud (then occasional specials on top)
        var base = [L_FILM, L_STAIN, L_MUD];
        for (var d = 0; d < depth; d++) layers.push(base[d]);
        // special override on TOP layer
        var top = layers[layers.length - 1];
        if (grafOK && chance(0.06)) layers[layers.length - 1] = L_GRAF;
        else if (mossOK && chance(0.09)) layers[layers.length - 1] = L_MOSS;
        else if (greaseOK && chance(0.13)) layers[layers.length - 1] = L_GREASE;
      } else {
        cleanCells++;
      }
      row.push({ layers: layers, idle: 0, t: 0, soaped: false });
    }
    grid.push(row);
  }
  // guarantee not already-complete
  recomputeClean();
  if (cleanPct >= target) { // too clean by chance — add grime back
    for (var rr2 = 0; rr2 < rows && cleanPct < target - 0.1; rr2++)
      for (var cc2 = 0; cc2 < cols && cleanPct < target - 0.1; cc2++) {
        if (grid[rr2][cc2].layers.length === 0) { grid[rr2][cc2].layers = [L_FILM, L_STAIN]; }
        recomputeClean();
      }
  }

  // tank sized from the grime to clear so EVERY job is winnable-but-tight: enough
  // water to strip the needed cells with good aim, plus a margin that SHRINKS as
  // jobNum rises (escalation). Wasting water on clean tiles still drains you dry.
  var layersTotal = 0;
  for (var ri = 0; ri < rows; ri++) for (var ci = 0; ci < cols; ci++) layersTotal += grid[ri][ci].layers.length;
  // water to strip the layers required to HIT the target (not 100%)
  var needFrac = GF.clamp(target + 0.04, 0, 1);             // strip a touch past target
  var layersToClear = layersTotal * needFrac;
  // each layer of dwell costs ~ (LAYER_HP * WATER_DRAIN) water IF the jet only
  // ever covers that one cell; in practice the radius covers many cells at once,
  // so effective cost per layer is far lower. Calibrate with an efficiency factor.
  var perLayerWater = LAYER_HP * WATER_DRAIN * 0.30;        // ~3 water/layer @ defaults
  var margin = GF.clamp(1.34 - jobNum * 0.035, 1.1, 1.34);  // tight even early, tighter later
  TANK_SIZE = Math.round(layersToClear * perLayerWater * margin + 45);
  water = TANK_SIZE + up.tank * TANK_PER_LVL;
  soap = up.soap * SOAP_PER_LVL;
  tool = 'water';
  needRefill = false;
}

function recomputeClean() {
  var clean = 0;
  for (var r = 0; r < rows; r++)
    for (var c = 0; c < cols; c++)
      if (grid[r][c].layers.length === 0) clean++;
  cleanCells = clean;
  cleanPct = totalCells > 0 ? clean / totalCells : 1;
}

// dirtiest cell (for the coach arrow)
function dirtiestCell() {
  var best = null, bestD = 0;
  for (var r = 0; r < rows; r++)
    for (var c = 0; c < cols; c++) {
      var n = grid[r][c].layers.length;
      if (n > bestD) { bestD = n; best = { r: r, c: c }; }
    }
  return best;
}

// ── LIFECYCLE ────────────────────────────────────────────────────────────
function startRun() {
  jobNum = 1; cash = 0; failedJobs = 0;
  up = { nozzle: 0, pressure: 0, tank: 0, soap: 0 };
  buildJob();
  gs = 'PLAYING';
  if (!seenTut) coachStep = 0; else coachStep = -1;
  GF.gameStarted();
  GF.saveRun();
}

function nextJob() {
  jobNum++;
  showShopHint = false;
  buildJob();
  gs = 'PLAYING';
  GF.gameStarted();
  GF.saveRun();
}

function completeJob() {
  var pay = JOB_BASE_PAY * jobNum;
  var spotless = cleanPct >= 0.999;
  if (spotless) pay += SPOTLESS_BONUS;
  if (spotlessObjective && spotless) pay += SPOTLESS_BONUS;
  cash += pay;
  if (cash > bestCash) bestCash = cash;
  if (jobNum > bestJob) bestJob = jobNum;
  persistBest();
  gs = 'JOBDONE';
  GF.sfx('win'); GF.setShake(spotless ? 6 : 3);
  GF.spawnFloat(GF.cx, GF.H * 0.4, '+$' + pay, spotless ? '#ffd24a' : '#7CFC9A');
  if (spotless) GF.spawnFloat(GF.cx, GF.H * 0.34, GF.t('spotless'), '#ffd24a');
  // show the "spend cash on upgrades" coach line on the FIRST job's shop only
  if (jobNum === 1 && !shopHintShown) showShopHint = true;
  GF.gameEnded();
  if (cash > 0 && (spotless)) GF.happytime();
  GF.saveRun();
}

function failJob() {
  failedJobs++;
  GF.sfx('hurt'); GF.setShake(9);
  GF.saveRun();
  if (failedJobs >= MAX_FAILS) {
    if (cash > bestCash) bestCash = cash;
    if (jobNum > bestJob) bestJob = jobNum;
    persistBest();
    gs = 'GAMEOVER';
    GF.gameEnded();
    if (bestJob > 1) GF.happytime();
    GF.saveRun();
  } else {
    // refill same job, keep grime state
    water = TANK_SIZE + up.tank * TANK_PER_LVL;
    soap = up.soap * SOAP_PER_LVL;
    needRefill = false;
    hint('refill_warn');
  }
}

function persistBest() {
  try {
    localStorage.setItem('grime_blaster_best_cash', bestCash);
    localStorage.setItem('grime_blaster_best_job', bestJob);
  } catch (e) {}
}

function hint(key) { hintMsg = GF.t(key); hintT = 2.2; }

// ── SHOP ─────────────────────────────────────────────────────────────────
function upgradePrice(kind) {
  var base = { nozzle: 60, pressure: 140, tank: 70, soap: 90 };
  return Math.round(base[kind] * (1 + up[kind] * 0.9));
}
function buyUpgrade(kind) {
  if (up[kind] >= CAP[kind]) return;
  var p = upgradePrice(kind);
  if (cash < p) { GF.sfx('error'); return; }
  cash -= p; up[kind]++;
  GF.sfx('unlock'); GF.spawnFloat(GF.cx, GF.H * 0.62, '-$' + p, '#ffd24a');
  if (kind === 'soap' && up.soap === 1) soap = SOAP_PER_LVL;
  if (kind === 'tank') water = Math.min(water + TANK_PER_LVL, TANK_SIZE + up.tank * TANK_PER_LVL);
  GF.saveRun();
}

// ── DERIVED ──────────────────────────────────────────────────────────────
function curSprayRadius() { return (SPRAY_RADIUS + up.nozzle * 14) * pf.cell / 26; }
function curStrip() { return (up.pressure >= 1) ? 2 : 1; }   // layers per pass
function hasSoap() { return up.soap > 0 || soap > 0; }

// ── INPUT (own pointer handlers; canvas coords == clientX/Y) ──────────────
var cv = document.getElementById('c');
function ppos(e) {
  if (e.touches && e.touches.length) return { x: e.touches[0].clientX, y: e.touches[0].clientY };
  if (e.changedTouches && e.changedTouches.length) return { x: e.changedTouches[0].clientX, y: e.changedTouches[0].clientY };
  return { x: e.clientX, y: e.clientY };
}
function inRect(p, b) { return b && p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h; }

function handleButtonTap(p) {
  // mute always available
  if (btns.mute && inRect(p, btns.mute)) { var m = GF.toggleMute(); GF.setMusicMuted(m); GF.sfx('click'); return true; }
  if (btns.help && inRect(p, btns.help)) { helpOpen = !helpOpen; GF.sfx('click'); return true; }
  if (helpOpen) { helpOpen = false; return true; }

  if (gs === 'JOBDONE') {
    var kinds = ['nozzle', 'pressure', 'tank', 'soap'];
    for (var i = 0; i < kinds.length; i++) {
      if (inRect(p, shopBtns[kinds[i]])) { buyUpgrade(kinds[i]); return true; }
    }
    if (btns.next && inRect(p, btns.next)) { GF.sfx('tap'); nextJob(); return true; }
    return true;
  }
  if (gs === 'GAMEOVER') {
    if (btns.retry && inRect(p, btns.retry)) { GF.sfx('tap'); startRun(); return true; }
    return true;
  }
  if (gs === 'PLAYING') {
    if (needRefill) { GF.sfx('tap'); failJob(); return true; }
    if (btns.tool && inRect(p, btns.tool)) { tool = (tool === 'water' ? 'soap' : 'water'); GF.sfx('click'); return true; }
    if (btns.shop && inRect(p, btns.shop)) { gs = 'JOBDONE'; GF.sfx('tap'); return true; } // quick shop access mid-run pauses to hub
  }
  return false;
}

function onDown(e) {
  var p = ppos(e);
  if (handleButtonTap(p)) { e.preventDefault(); return; }
  if (gs !== 'PLAYING' || needRefill) { e.preventDefault(); return; }
  // start spraying only if pointer is within the playfield
  if (p.y >= pf.y && p.y <= pf.y + pf.h) {
    dragActive = true; spraying = true;
    jetX = p.x; jetY = p.y; lastJetX = p.x; lastJetY = p.y;
  }
  e.preventDefault();
}
function onMove(e) {
  if (!dragActive || gs !== 'PLAYING') return;
  var p = ppos(e);
  jetX = p.x; jetY = p.y; spraying = (p.y >= pf.y - 10 && p.y <= pf.y + pf.h + 10);
  e.preventDefault();
}
function onUp(e) {
  dragActive = false; spraying = false;
  if (e && e.preventDefault) e.preventDefault();
}
cv.addEventListener('mousedown', onDown);
cv.addEventListener('mousemove', onMove);
window.addEventListener('mouseup', onUp);
cv.addEventListener('touchstart', onDown, { passive: false });
cv.addEventListener('touchmove', onMove, { passive: false });
cv.addEventListener('touchend', onUp, { passive: false });
cv.addEventListener('touchcancel', function () { dragActive = false; spraying = false; });

// ── UPDATE ───────────────────────────────────────────────────────────────
function update(dt) {
  jetT += dt;
  coachArrowT += dt;
  if (hintT > 0) hintT -= dt;

  // flashes decay
  for (var r = 0; r < rows; r++) for (var c = 0; c < cols; c++) {
    var cell = grid[r] && grid[r][c];
    if (cell && cell.t > 0) cell.t -= dt * 3;
  }

  if (gs !== 'PLAYING') return;

  // moss regrowth (idle) — only on jobs that have moss
  if (jobNum >= 4) {
    for (var r2 = 0; r2 < rows; r2++) for (var c2 = 0; c2 < cols; c2++) {
      var cl = grid[r2][c2];
      // a cell that currently shows moss on top, or was a moss cell and is now lighter, regrows
      if (cl._wasMoss && cl.layers.length < cl._mossMax) {
        cl.idle += dt;
        if (cl.idle >= MOSS_REGROW) {
          cl.idle = 0;
          cl.layers.push(L_MOSS);
          cl.t = 1;
          recomputeClean();
        }
      }
    }
  }

  if (spraying && !needRefill) {
    var drainTool = (tool === 'soap') ? 'soap' : 'water';
    var reserve = (drainTool === 'soap') ? soap : water;
    // coach (steps 0-1, job 1) is NO-FAIL: spraying strips grime but does NOT
    // drain the tank, so the player can't soft-lock or lose during the tutorial.
    var noFail = (coachStep === 0 || coachStep === 1) && jobNum === 1;
    if (reserve > 0 || noFail) {
      var drainRate = (drainTool === 'soap') ? SOAP_DRAIN : WATER_DRAIN;
      if (!noFail) {
        if (drainTool === 'soap') soap = Math.max(0, soap - drainRate * dt);
        else water = Math.max(0, water - drainRate * dt);
      }

      applySpray(dt, drainTool);

      // hiss sfx, rate-limited
      hissCooldown -= dt;
      if (hissCooldown <= 0) { GF.sfx('spawn'); hissCooldown = 0.13; }

      // spray particles along the jet
      if (jetT % 0.02 < dt) {
        var col = (tool === 'soap') ? '#dff4ff' : '#bfe6ff';
        GF.spawnParticles(jetX, jetY, col, 2);
      }
    }
    lastJetX = jetX; lastJetY = jetY;
  }

  // win check
  if (cleanPct >= target && gs === 'PLAYING') { completeJob(); return; }

  // lose check: tank dry below target
  if (!needRefill && water <= 0 && cleanPct < target && coachStep !== 0 && coachStep !== 1) {
    needRefill = true;
    spraying = false; dragActive = false;
  }
}

function applySpray(dt, drainTool) {
  var R = curSprayRadius();
  var R2 = R * R;
  var stripN = curStrip();
  // walk cells near the jet
  var c0 = Math.max(0, Math.floor((jetX - R - pf.x) / pf.cell));
  var c1 = Math.min(cols - 1, Math.ceil((jetX + R - pf.x) / pf.cell));
  var r0 = Math.max(0, Math.floor((jetY - R - pf.y) / pf.cell));
  var r1 = Math.min(rows - 1, Math.ceil((jetY + R - pf.y) / pf.cell));
  var anyStripped = false;
  for (var r = r0; r <= r1; r++) {
    for (var c = c0; c <= c1; c++) {
      var cell = grid[r][c];
      if (cell.layers.length === 0) continue;
      var ccx = pf.x + c * pf.cell + pf.cell / 2;
      var ccy = pf.y + r * pf.cell + pf.cell / 2;
      var dx = ccx - jetX, dy = ccy - jetY;
      if (dx * dx + dy * dy > R2) continue;
      cell.idle = 0;
      var top = cell.layers[cell.layers.length - 1];

      // GREASE: water does nothing until soaped
      if (top === L_GREASE) {
        if (drainTool === 'soap') {
          cell.soaped = true; cell.t = 1;
          if (jobNum >= 2 && jetT % 0.5 < dt) hint('grease_hint');
        } else {
          if (!cell.soaped) { if (jobNum >= 2 && Math.random() < 0.01) hint('grease_hint'); continue; }
        }
      }
      if (drainTool === 'soap' && top !== L_GREASE) continue; // soap only treats grease

      // dwell accumulation
      var perLayer = LAYER_HP;
      if (top === L_STAIN) perLayer = LAYER_HP * 1.25;
      if (top === L_GRAF) {
        // graffiti needs CLOSE jet — falloff by distance from centre
        var d = Math.sqrt(dx * dx + dy * dy);
        var closeness = 1 - GF.clamp(d / (R * 0.55), 0, 1);
        if (closeness <= 0.05) { if (Math.random() < 0.01) hint('graf_hint'); continue; }
        perLayer = LAYER_HP * GRAF_DWELL / Math.max(0.25, closeness);
      }
      if (top === L_MOSS) { cell._wasMoss = true; cell._mossMax = cell._mossMax || cell.layers.length; if (Math.random() < 0.004) hint('moss_hint'); }
      if (top === L_GREASE) perLayer = LAYER_HP * 0.9; // soaped grease strips a touch faster

      cell._dwell = (cell._dwell || 0) + dt;
      if (cell._dwell >= perLayer) {
        cell._dwell = 0;
        var stripCount = stripN;
        while (stripCount > 0 && cell.layers.length > 0) {
          var removed = cell.layers.pop();
          cell.t = 1;
          cell.soaped = false;
          anyStripped = true;
          stripCount--;
          // graffiti / grease block multi-strip past them in one go (the new layer needs its own rule)
          if (cell.layers.length > 0) {
            var nt = cell.layers[cell.layers.length - 1];
            if (nt === L_GREASE || nt === L_GRAF) break;
          }
        }
        // burst
        var pc = layerColor(removed);
        GF.spawnParticles(ccx, ccy, pc, 5);
        GF.sfx('pickup');
        if (cell.layers.length === 0) { GF.spawnParticles(ccx, ccy, '#9ad9ff', 4); }
      }
    }
  }
  if (anyStripped) {
    recomputeClean();
    // coach advances. Steps 0 & 1 are NO-FAIL (water can't drain to a loss); once
    // the player has made real progress the coach completes and NORMAL draining
    // resumes on the SAME job (so a wasteful player can still run the tank dry).
    if (coachStep === 0) { coachStep = 1; }
    else if (coachStep === 1 && cleanPct > 0.18) {
      coachStep = 8;   // tutorial done, normal play (NOT 0/1 -> draining/lose active)
      seenTut = true;
      try { localStorage.setItem('grime_blaster_seen_tutorial', '1'); } catch (e) {}
    }
  }
}

// ── LAYER LOOK ───────────────────────────────────────────────────────────
function layerColor(type) {
  switch (type) {
    case L_FILM:  return '#8b8f86';
    case L_STAIN: return '#6e4a35';
    case L_MUD:   return '#5a4327';
    case L_GREASE:return '#b9962f';
    case L_MOSS:  return '#4f7a3a';
    case L_GRAF:  return '#c0397f';
  }
  return '#777';
}

// ── DRAW ─────────────────────────────────────────────────────────────────
function layout() {
  var W = GF.W, H = GF.H;
  var top = Math.max(108 * GF.S, H * 0.16);            // HUD band
  var bottom = Math.max(86 * GF.S, H * 0.11);          // tool bar
  pf.x = Math.max(8 * GF.S, W * 0.02);
  pf.y = top;
  pf.w = W - pf.x * 2;
  pf.h = H - top - bottom;
  pf.cell = Math.min(pf.w / cols, pf.h / rows);
  // center grid
  pf.x += (pf.w - pf.cell * cols) / 2;
  pf.y += (pf.h - pf.cell * rows) / 2;
  pf.w = pf.cell * cols;
  pf.h = pf.cell * rows;
}

function draw(ctx) {
  var W = GF.W, H = GF.H, S = GF.S;
  layout();

  // bg
  var bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#1a2836'); bg.addColorStop(1, '#0f1820');
  ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);

  var sh = (typeof GF.setShake === 'function') ? null : null;
  drawSurface(ctx);
  drawGrime(ctx);
  if (gs === 'PLAYING' && spraying && !needRefill) drawJet(ctx);
  drawHUD(ctx);
  drawToolBar(ctx);

  if (gs === 'PLAYING') {
    if (coachStep >= 0 && coachStep <= 1 && !seenTut) drawCoach(ctx);
    if (needRefill) drawRefill(ctx);
    if (hintT > 0 && hintMsg) drawHint(ctx);
  }
  if (gs === 'JOBDONE') drawShop(ctx);
  if (gs === 'GAMEOVER') drawGameOver(ctx);
  if (helpOpen) drawHelp(ctx);
}

function drawSurface(ctx) {
  // the clean wall revealed under grime — tiled concrete/brick gradient
  ctx.save();
  ctx.beginPath(); GF.rr(ctx, pf.x, pf.y, pf.w, pf.h, 6 * GF.S); ctx.clip();
  var g = ctx.createLinearGradient(pf.x, pf.y, pf.x, pf.y + pf.h);
  g.addColorStop(0, '#c8cdd2'); g.addColorStop(0.5, '#b6bcc2'); g.addColorStop(1, '#a7aeb5');
  ctx.fillStyle = g; ctx.fillRect(pf.x, pf.y, pf.w, pf.h);
  // subtle brick mortar lines
  ctx.strokeStyle = 'rgba(120,128,136,0.35)'; ctx.lineWidth = Math.max(1, GF.S);
  var bh = pf.cell * 2;
  for (var y = pf.y + bh; y < pf.y + pf.h; y += bh) { ctx.beginPath(); ctx.moveTo(pf.x, y); ctx.lineTo(pf.x + pf.w, y); ctx.stroke(); }
  var bw = pf.cell * 2.5; var rowi = 0;
  for (var yy = pf.y; yy < pf.y + pf.h; yy += bh) {
    var off = (rowi % 2) * bw / 2;
    for (var x = pf.x + off; x < pf.x + pf.w; x += bw) { ctx.beginPath(); ctx.moveTo(x, yy); ctx.lineTo(x, yy + bh); ctx.stroke(); }
    rowi++;
  }
  ctx.restore();
  // frame
  ctx.strokeStyle = 'rgba(20,28,36,0.8)'; ctx.lineWidth = 2 * GF.S;
  GF.rr(ctx, pf.x, pf.y, pf.w, pf.h, 6 * GF.S); ctx.stroke();
}

function drawGrime(ctx) {
  var cell = pf.cell;
  for (var r = 0; r < rows; r++) {
    for (var c = 0; c < cols; c++) {
      var g = grid[r][c];
      var x = pf.x + c * cell, y = pf.y + r * cell;
      var n = g.layers.length;
      if (n === 0) {
        // freshly cleaned flash
        if (g.t > 0) { ctx.globalAlpha = Math.min(1, g.t) * 0.5; ctx.fillStyle = '#e9fbff'; ctx.fillRect(x, y, cell + 0.5, cell + 0.5); ctx.globalAlpha = 1; }
        continue;
      }
      // draw stacked layers bottom-up so the top is on top
      for (var li = 0; li < n; li++) {
        var type = g.layers[li];
        var inset = (n - 1 - li) * 0.5 * GF.S;
        drawLayerCell(ctx, type, x + inset, y + inset, cell - inset * 2, r, c, li, g);
      }
      // strip flash
      if (g.t > 0) { ctx.globalAlpha = Math.min(1, g.t) * 0.35; ctx.fillStyle = '#ffffff'; ctx.fillRect(x, y, cell + 0.5, cell + 0.5); ctx.globalAlpha = 1; }
    }
  }
}

function drawLayerCell(ctx, type, x, y, s, r, c, li, g) {
  var base = layerColor(type);
  ctx.fillStyle = base;
  ctx.fillRect(x, y, s + 0.5, s + 0.5);
  // procedural noise speckle (deterministic per cell+layer)
  var seed = ((r * 73856093) ^ (c * 19349663) ^ (li * 83492791)) >>> 0;
  var rng = seed;
  function nr() { rng = (rng * 1664525 + 1013904223) >>> 0; return rng / 4294967296; }
  ctx.save();
  if (type === L_GREASE) {
    // glossy highlight
    ctx.globalAlpha = g.soaped ? 0.35 : 0.6;
    var gg = ctx.createLinearGradient(x, y, x + s, y + s);
    gg.addColorStop(0, '#e6c24a'); gg.addColorStop(0.5, '#b9962f'); gg.addColorStop(1, '#8a6f1f');
    ctx.fillStyle = gg; ctx.fillRect(x, y, s, s);
    ctx.globalAlpha = 0.5; ctx.fillStyle = 'rgba(255,255,240,0.6)';
    ctx.beginPath(); ctx.ellipse(x + s * 0.35, y + s * 0.3, s * 0.18, s * 0.1, -0.5, 0, Math.PI * 2); ctx.fill();
    if (g.soaped) { ctx.globalAlpha = 0.7; ctx.fillStyle = 'rgba(230,245,255,0.7)'; for (var b = 0; b < 3; b++) { ctx.beginPath(); ctx.arc(x + nr() * s, y + nr() * s, s * 0.08, 0, Math.PI * 2); ctx.fill(); } }
  } else if (type === L_MOSS) {
    ctx.globalAlpha = 0.85;
    for (var m = 0; m < 6; m++) { ctx.fillStyle = (m % 2 ? '#3e6b2e' : '#5a8a3f'); ctx.beginPath(); ctx.arc(x + nr() * s, y + nr() * s, s * (0.1 + nr() * 0.14), 0, Math.PI * 2); ctx.fill(); }
  } else if (type === L_GRAF) {
    ctx.globalAlpha = 0.9;
    var cols2 = ['#c0397f', '#e7c14a', '#3fa7d6'];
    ctx.strokeStyle = cols2[(r + c) % 3]; ctx.lineWidth = Math.max(1.4, s * 0.16); ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(x + s * 0.15, y + s * 0.7); ctx.quadraticCurveTo(x + s * 0.5, y + s * 0.1, x + s * 0.85, y + s * 0.6); ctx.stroke();
  } else {
    // dirt speckle
    ctx.globalAlpha = 0.5;
    var dark = type === L_MUD ? '#3c2c18' : (type === L_STAIN ? '#4a2f20' : '#6a6e66');
    ctx.fillStyle = dark;
    for (var i = 0; i < 5; i++) { var px = x + nr() * s, py = y + nr() * s; var pr = s * (0.06 + nr() * 0.12); ctx.beginPath(); ctx.arc(px, py, pr, 0, Math.PI * 2); ctx.fill(); }
  }
  ctx.restore();
}

function drawJet(ctx) {
  var R = curSprayRadius();
  ctx.save();
  // jet glow circle
  var grad = ctx.createRadialGradient(jetX, jetY, 0, jetX, jetY, R);
  var col = tool === 'soap' ? 'rgba(180,230,255,' : 'rgba(120,200,255,';
  grad.addColorStop(0, col + '0.45)');
  grad.addColorStop(0.6, col + '0.18)');
  grad.addColorStop(1, col + '0)');
  ctx.fillStyle = grad; ctx.beginPath(); ctx.arc(jetX, jetY, R, 0, Math.PI * 2); ctx.fill();
  // jet stream from nozzle (above) to jet point
  var nx = jetX + R * 0.7, ny = jetY - R * 1.4;
  ctx.strokeStyle = tool === 'soap' ? 'rgba(220,245,255,0.8)' : 'rgba(180,225,255,0.85)';
  ctx.lineWidth = Math.max(3, R * 0.18); ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(nx, ny); ctx.lineTo(jetX, jetY); ctx.stroke();
  ctx.restore();
  // nozzle sprite (tracks pointer, sits above/right of the jet)
  var ns = R * 1.5;
  GF.drawSprite('nozzle', nx, ny, ns, function (cc, x, y, s) {
    cc.save(); cc.translate(x, y); cc.rotate(2.3);
    cc.fillStyle = '#2f3a45'; GF.rr(cc, -s * 0.12, -s * 0.42, s * 0.24, s * 0.55, s * 0.06); cc.fill();
    cc.fillStyle = '#f5a623'; GF.rr(cc, -s * 0.1, s * 0.05, s * 0.2, s * 0.3, s * 0.05); cc.fill();
    cc.restore();
  });
}

// rounded text helper for HUD pills
function pill(ctx, x, y, w, h, fill) { ctx.fillStyle = fill; GF.rr(ctx, x, y, w, h, h / 2); ctx.fill(); }

function drawHUD(ctx) {
  var W = GF.W, S = GF.S;
  var pad = 10 * S;
  var topY = pad;

  // JOB n (left) + cash (right)
  ctx.textBaseline = 'middle';
  ctx.font = 'bold ' + GF.clamp(15 * S, 12, 22) + 'px sans-serif';
  ctx.textAlign = 'left'; ctx.fillStyle = '#cdd6df';
  ctx.fillText(GF.t('job') + ' ' + jobNum, pad + 4 * S, topY + 12 * S);
  ctx.textAlign = 'right';
  ctx.fillStyle = '#ffd24a';
  drawCoin(ctx, W - pad - 70 * S, topY + 12 * S, 7 * S);
  ctx.fillStyle = '#ffd24a';
  ctx.fillText('$' + cash, W - pad, topY + 12 * S);

  // attempts dots (top center-ish under job)
  var ax = pad + 4 * S, ay = topY + 30 * S;
  for (var i = 0; i < MAX_FAILS; i++) {
    ctx.beginPath(); ctx.arc(ax + i * 16 * S, ay, 5 * S, 0, Math.PI * 2);
    ctx.fillStyle = i < (MAX_FAILS - failedJobs) ? '#5ad17a' : 'rgba(255,255,255,0.18)';
    ctx.fill();
  }

  // big CLEAN xx% (center)
  var pct = Math.floor(cleanPct * 100);
  var tpct = Math.floor(target * 100);
  ctx.textAlign = 'center';
  ctx.font = 'bold ' + GF.clamp(30 * S, 22, 44) + 'px sans-serif';
  var hit = cleanPct >= target;
  ctx.fillStyle = hit ? '#5ad17a' : '#ffffff';
  ctx.fillText(GF.t('clean') + ' ' + pct + '%', W / 2, topY + 22 * S);

  // progress bar with target notch
  var barY = topY + 44 * S, barH = 14 * S, barX = pad + 4 * S, barW = W - (pad + 4 * S) * 2;
  pill(ctx, barX, barY, barW, barH, 'rgba(255,255,255,0.12)');
  var fillW = barW * GF.clamp(cleanPct, 0, 1);
  var bg = ctx.createLinearGradient(barX, 0, barX + barW, 0);
  bg.addColorStop(0, hit ? '#3ec46a' : '#4aa3ff'); bg.addColorStop(1, hit ? '#7ff0a0' : '#7fd0ff');
  if (fillW > 1) { ctx.fillStyle = bg; GF.rr(ctx, barX, barY, fillW, barH, barH / 2); ctx.fill(); }
  // target notch
  var nx = barX + barW * target;
  ctx.fillStyle = '#ffd24a'; ctx.fillRect(nx - 1.5 * S, barY - 3 * S, 3 * S, barH + 6 * S);
  ctx.font = 'bold ' + GF.clamp(10 * S, 8, 14) + 'px sans-serif'; ctx.fillStyle = '#ffd24a';
  ctx.textBaseline = 'bottom'; ctx.fillText(tpct + '%', nx, barY - 4 * S); ctx.textBaseline = 'middle';

  // objective line
  ctx.font = GF.clamp(11 * S, 9, 15) + 'px sans-serif'; ctx.fillStyle = '#9fb0bf';
  var objTxt = GF.t('target') + ' ' + tpct + '%';
  if (spotlessObjective) objTxt += '   ·   ' + GF.t('spotless_obj') + (SPOTLESS_BONUS);
  ctx.fillText(objTxt, W / 2, barY + barH + 12 * S);

  // WATER gauge (lose-condition signal)
  var wgY = barY + barH + 24 * S, wgH = 12 * S;
  var soapShown = hasSoap();
  var wgW = soapShown ? (barW * 0.62 - 4 * S) : barW;
  // water
  pill(ctx, barX, wgY, wgW, wgH, 'rgba(255,255,255,0.1)');
  var wfrac = water / (TANK_SIZE + up.tank * TANK_PER_LVL);
  var low = wfrac < 0.22;
  var wcol = low ? (Math.sin(jetT * 8) > 0 ? '#ff5b5b' : '#ff8a5b') : '#43b6ff';
  if (wfrac > 0.001) { ctx.fillStyle = wcol; GF.rr(ctx, barX, wgY, wgW * GF.clamp(wfrac, 0, 1), wgH, wgH / 2); ctx.fill(); }
  ctx.font = 'bold ' + GF.clamp(9 * S, 7, 12) + 'px sans-serif'; ctx.fillStyle = '#fff'; ctx.textAlign = 'left';
  drawDrop(ctx, barX + 8 * S, wgY + wgH / 2, 5 * S, '#dff');
  ctx.fillText(GF.t('water'), barX + 18 * S, wgY + wgH / 2);
  // soap
  if (soapShown) {
    var sgX = barX + wgW + 8 * S, sgW = barW - wgW - 8 * S;
    pill(ctx, sgX, wgY, sgW, wgH, 'rgba(255,255,255,0.1)');
    var sfrac = soap / (Math.max(1, up.soap) * SOAP_PER_LVL);
    if (sfrac > 0.001) { ctx.fillStyle = '#c178ff'; GF.rr(ctx, sgX, wgY, sgW * GF.clamp(sfrac, 0, 1), wgH, wgH / 2); ctx.fill(); }
    ctx.fillStyle = '#fff'; ctx.fillText(GF.t('soap'), sgX + 8 * S, wgY + wgH / 2);
  }
  ctx.textBaseline = 'alphabetic';
}

function drawToolBar(ctx) {
  var W = GF.W, H = GF.H, S = GF.S;
  var barH = Math.max(86 * S, H * 0.11);
  var y = H - barH;
  // bar bg
  ctx.fillStyle = 'rgba(12,20,28,0.9)'; ctx.fillRect(0, y, W, barH);
  ctx.strokeStyle = 'rgba(255,255,255,0.06)'; ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();

  var pad = 12 * S;
  var bh = barH - pad * 2;
  var by = y + pad;

  if (gs === 'PLAYING') {
    // big tool toggle (left ~half)
    var tw = W * 0.5 - pad * 1.5;
    var tx = pad;
    var soapy = tool === 'soap';
    var tg = ctx.createLinearGradient(tx, by, tx, by + bh);
    if (soapy) { tg.addColorStop(0, '#b06fe0'); tg.addColorStop(1, '#8a4fc0'); }
    else { tg.addColorStop(0, '#3aa0ff'); tg.addColorStop(1, '#2575d0'); }
    ctx.fillStyle = tg; GF.rr(ctx, tx, by, tw, bh, 14 * S); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.font = 'bold ' + GF.clamp(17 * S, 13, 24) + 'px sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    var icx = tx + 26 * S;
    if (soapy) drawBubble(ctx, icx, by + bh / 2, 9 * S); else drawDrop(ctx, icx, by + bh / 2, 9 * S, '#dff');
    ctx.fillStyle = '#fff';
    ctx.fillText(soapy ? GF.t('tool_soap') : GF.t('tool_water'), tx + tw / 2 + 14 * S, by + bh / 2);
    // small "tap to swap" hint if soap owned — vector double-arrow (no emoji glyph)
    if (hasSoap()) { drawSwapIcon(ctx, tx + tw - 16 * S, by + bh / 2, 7 * S); }
    btns.tool = { x: tx, y: by, w: tw, h: bh };

    // SHOP button (right area)
    var sw = W * 0.28 - pad;
    var sx = tx + tw + pad;
    ctx.fillStyle = '#28323c'; GF.rr(ctx, sx, by, sw, bh, 14 * S); ctx.fill();
    ctx.strokeStyle = 'rgba(255,210,74,0.5)'; ctx.lineWidth = 1.5 * S; GF.rr(ctx, sx, by, sw, bh, 14 * S); ctx.stroke();
    ctx.fillStyle = '#ffd24a'; ctx.font = 'bold ' + GF.clamp(13 * S, 11, 18) + 'px sans-serif';
    ctx.fillText(GF.t('shop'), sx + sw / 2, by + bh / 2);
    btns.shop = { x: sx, y: by, w: sw, h: bh };

    // help + mute (far right column stacked)
    var ux = W - pad - bh * 0.46;
    drawIconBtn(ctx, ux, by + bh * 0.27, bh * 0.42, 'help');
    btns.help = { x: ux - bh * 0.27, y: by, w: bh * 0.54, h: bh * 0.5 };
    drawIconBtn(ctx, ux, by + bh * 0.74, bh * 0.42, 'mute');
    btns.mute = { x: ux - bh * 0.27, y: by + bh * 0.5, w: bh * 0.54, h: bh * 0.5 };
  } else {
    // JOBDONE / GAMEOVER bars handled by their overlays — still draw mute+help
    var ux2 = W - pad - bh * 0.46;
    drawIconBtn(ctx, ux2, by + bh / 2, bh * 0.42, 'mute');
    btns.mute = { x: ux2 - bh * 0.3, y: by, w: bh * 0.6, h: bh };
    btns.help = null;
  }
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
}

function drawIconBtn(ctx, cx, cy, r, kind) {
  ctx.save();
  ctx.fillStyle = 'rgba(255,255,255,0.08)';
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();
  if (kind === 'mute') { GF.drawMuteIcon(ctx, cx, cy, r * 0.62, GF.muted); }
  else { // ?
    ctx.fillStyle = '#cdd6df'; ctx.font = 'bold ' + (r * 1.1) + 'px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('?', cx, cy + r * 0.04);
  }
  ctx.restore();
}

// ── COACH (interactive tutorial over live play) ──────────────────────────
function drawCoach(ctx) {
  var W = GF.W, S = GF.S;
  // light scrim
  ctx.fillStyle = 'rgba(0,0,0,0.18)'; ctx.fillRect(0, 0, W, GF.H);
  var msg = coachStep === 0 ? GF.t('coach_spray') : GF.t('coach_water');
  // arrow at dirtiest cell (the mandated pointer)
  if (coachStep === 0) {
    var d = dirtiestCell();
    if (d) {
      var tx = pf.x + d.c * pf.cell + pf.cell / 2;
      var ty = pf.y + d.r * pf.cell + pf.cell / 2;
      var pulse = 0.5 + 0.5 * Math.sin(coachArrowT * 4);
      var rad = pf.cell * (1.2 + pulse * 0.5);
      ctx.save();
      ctx.strokeStyle = '#ffd24a'; ctx.lineWidth = 3 * S; ctx.globalAlpha = 0.9;
      ctx.beginPath(); ctx.arc(tx, ty, rad, 0, Math.PI * 2); ctx.stroke();
      // bouncing arrow above
      var ay = ty - rad - 20 * S - pulse * 8 * S;
      ctx.fillStyle = '#ffd24a';
      ctx.beginPath(); ctx.moveTo(tx, ay + 16 * S); ctx.lineTo(tx - 11 * S, ay); ctx.lineTo(tx + 11 * S, ay); ctx.closePath(); ctx.fill();
      ctx.restore();
    }
  }
  // message banner
  ctx.save();
  ctx.font = 'bold ' + GF.clamp(17 * S, 13, 24) + 'px sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  var bw = Math.min(W * 0.86, ctx.measureText(msg).width + 40 * S);
  var by = GF.H * 0.78;
  ctx.fillStyle = 'rgba(16,24,32,0.92)'; GF.rr(ctx, W / 2 - bw / 2, by - 20 * S, bw, 40 * S, 12 * S); ctx.fill();
  ctx.strokeStyle = 'rgba(255,210,74,0.6)'; ctx.lineWidth = 1.5 * S; GF.rr(ctx, W / 2 - bw / 2, by - 20 * S, bw, 40 * S, 12 * S); ctx.stroke();
  ctx.fillStyle = '#fff'; ctx.fillText(msg, W / 2, by);
  ctx.restore();
}

function drawHint(ctx) {
  var W = GF.W, S = GF.S;
  ctx.save();
  ctx.font = 'bold ' + GF.clamp(14 * S, 11, 20) + 'px sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  var bw = Math.min(W * 0.8, ctx.measureText(hintMsg).width + 32 * S);
  var by = pf.y + 22 * S;
  ctx.globalAlpha = GF.clamp(hintT, 0, 1);
  ctx.fillStyle = 'rgba(20,30,40,0.9)'; GF.rr(ctx, W / 2 - bw / 2, by - 16 * S, bw, 32 * S, 10 * S); ctx.fill();
  ctx.fillStyle = '#ffe08a'; ctx.fillText(hintMsg, W / 2, by);
  ctx.restore();
}

function drawRefill(ctx) {
  var W = GF.W, H = GF.H, S = GF.S;
  ctx.fillStyle = 'rgba(8,12,18,0.55)'; ctx.fillRect(0, 0, W, H);
  ctx.save();
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  var bw = Math.min(W * 0.86, 360 * S), bh = 120 * S;
  var bx = W / 2 - bw / 2, by = H / 2 - bh / 2;
  var pulse = 0.5 + 0.5 * Math.sin(jetT * 4);
  ctx.fillStyle = 'rgba(20,30,42,0.96)'; GF.rr(ctx, bx, by, bw, bh, 16 * S); ctx.fill();
  ctx.strokeStyle = 'rgba(255,91,91,' + (0.5 + 0.4 * pulse) + ')'; ctx.lineWidth = 2.5 * S; GF.rr(ctx, bx, by, bw, bh, 16 * S); ctx.stroke();
  ctx.fillStyle = '#ff8a8a'; ctx.font = 'bold ' + GF.clamp(15 * S, 12, 21) + 'px sans-serif';
  wrapCenter(ctx, GF.t('refill'), W / 2, by + 36 * S, bw - 30 * S, 20 * S);
  ctx.fillStyle = '#cdd6df'; ctx.font = GF.clamp(11 * S, 9, 15) + 'px sans-serif';
  ctx.fillText(GF.t('refill_warn'), W / 2, by + bh - 26 * S);
  // attempts remaining
  ctx.fillStyle = '#9fb0bf';
  ctx.fillText(GF.t('attempts') + ': ' + (MAX_FAILS - failedJobs - 1) + '/' + MAX_FAILS, W / 2, by + bh - 10 * S);
  ctx.restore();
}

// ── SHOP (JOBDONE hub) ───────────────────────────────────────────────────
function drawShop(ctx) {
  var W = GF.W, H = GF.H, S = GF.S;
  ctx.fillStyle = 'rgba(8,12,18,0.93)'; ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';

  var titleY = Math.max(72 * S, H * 0.12);
  ctx.fillStyle = '#7ff0a0'; ctx.font = 'bold ' + GF.clamp(26 * S, 20, 38) + 'px sans-serif';
  ctx.fillText(GF.t('job') + ' ' + jobNum + '  ✓', W / 2, titleY - 18 * S);
  ctx.fillStyle = '#ffd24a'; ctx.font = 'bold ' + GF.clamp(16 * S, 12, 22) + 'px sans-serif';
  ctx.fillText(GF.t('cash') + ': $' + cash, W / 2, titleY + 12 * S);

  // 4 upgrade rows (big full-width buttons)
  var kinds = ['nozzle', 'pressure', 'tank', 'soap'];
  var rowH = GF.clamp(58 * S, 44, 78);
  var gap = 10 * S;
  var listW = Math.min(W * 0.9, 420 * S);
  var lx = W / 2 - listW / 2;
  var startY = titleY + 40 * S;
  shopBtns = {};
  for (var i = 0; i < kinds.length; i++) {
    var k = kinds[i];
    var ry = startY + i * (rowH + gap);
    var lvl = up[k], maxed = lvl >= CAP[k];
    var price = upgradePrice(k);
    var afford = cash >= price && !maxed;
    // soap row shows LOCKED-ish but is buyable (it unlocks the tool)
    ctx.fillStyle = maxed ? 'rgba(60,70,80,0.6)' : (afford ? 'rgba(40,80,56,0.9)' : 'rgba(40,48,58,0.9)');
    GF.rr(ctx, lx, ry, listW, rowH, 14 * S); ctx.fill();
    ctx.strokeStyle = afford ? 'rgba(127,240,160,0.7)' : 'rgba(255,255,255,0.08)'; ctx.lineWidth = 1.5 * S;
    GF.rr(ctx, lx, ry, listW, rowH, 14 * S); ctx.stroke();
    // icon
    drawShopIcon(ctx, k, lx + 26 * S, ry + rowH / 2, 13 * S);
    // name + level
    ctx.textAlign = 'left'; ctx.fillStyle = '#fff'; ctx.font = 'bold ' + GF.clamp(15 * S, 12, 21) + 'px sans-serif';
    ctx.fillText(GF.t('buy_' + k), lx + 48 * S, ry + rowH / 2 - 9 * S);
    ctx.fillStyle = '#9fb0bf'; ctx.font = GF.clamp(11 * S, 9, 14) + 'px sans-serif';
    var lvlTxt = GF.t('lvl') + ' ' + lvl + '/' + CAP[k];
    if (k === 'soap' && lvl === 0) lvlTxt += '  ·  ' + (GF.lang === 'ru' ? 'жир' : 'grease');
    ctx.fillText(lvlTxt, lx + 48 * S, ry + rowH / 2 + 10 * S);
    // price / MAX
    ctx.textAlign = 'right'; ctx.font = 'bold ' + GF.clamp(15 * S, 12, 20) + 'px sans-serif';
    if (maxed) { ctx.fillStyle = '#7ff0a0'; ctx.fillText(GF.t('max'), lx + listW - 18 * S, ry + rowH / 2); }
    else { ctx.fillStyle = afford ? '#ffd24a' : '#7c8893'; ctx.fillText('$' + price, lx + listW - 18 * S, ry + rowH / 2); }
    ctx.textAlign = 'center';
    shopBtns[k] = { x: lx, y: ry, w: listW, h: rowH };
  }

  // NEXT JOB button
  var nbY = startY + kinds.length * (rowH + gap) + 8 * S;
  var nbW = listW, nbH = GF.clamp(60 * S, 46, 80);
  // keep on screen
  if (nbY + nbH > H - 16 * S) nbY = H - 16 * S - nbH;
  var pulse = 1 + 0.04 * Math.sin(jetT * 2.4);
  var pw = nbW * pulse, ph = nbH * pulse, px = W / 2 - pw / 2, py = nbY + nbH / 2 - ph / 2;
  var g = ctx.createLinearGradient(px, py, px, py + ph);
  g.addColorStop(0, '#2ee07a'); g.addColorStop(1, '#23a657');
  ctx.save(); ctx.shadowColor = 'rgba(46,224,122,0.5)'; ctx.shadowBlur = 20 * S;
  GF.rr(ctx, px, py, pw, ph, ph / 2); ctx.fillStyle = g; ctx.fill(); ctx.restore();
  ctx.fillStyle = '#fff'; ctx.font = 'bold ' + GF.clamp(19 * S, 15, 28) + 'px sans-serif'; ctx.textBaseline = 'middle';
  ctx.fillText('▶ ' + GF.t('next'), W / 2, nbY + nbH / 2);
  btns.next = { x: lx, y: nbY, w: nbW, h: nbH };

  // coach hint (shop step) — first job only
  if (showShopHint) {
    ctx.fillStyle = '#ffd24a'; ctx.font = 'bold ' + GF.clamp(12 * S, 9, 16) + 'px sans-serif'; ctx.textBaseline = 'middle';
    ctx.fillText(GF.t('coach_shop'), W / 2, startY - 14 * S);
    shopHintShown = true;
  }
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
}
var shopHintShown = false, showShopHint = false;

function drawGameOver(ctx) {
  var W = GF.W, H = GF.H, S = GF.S;
  GF.drawOverlay({
    title: GF.t('gameover'),
    sub: GF.t('bestjob') + ': ' + jobNum + '   ·   ' + GF.t('cash') + ': $' + cash,
    sub2: GF.t('best') + ': $' + bestCash + '   ·   ' + GF.t('bestjob') + ': ' + bestJob,
    btnText: GF.t('retry'), btnFn: startRun,
    bestText: null,
  });
  // GF.drawOverlay populated GF.buttons[0] with the retry hit-rect via its own
  // button system; we ALSO register our own so our pointer handler catches it.
  // Compute same rect as drawOverlay: centered.
  var wide = W / H > 1.15;
  var btnW = GF.clamp((wide ? 320 : 248) * S, 170, 400), btnH = GF.clamp((wide ? 64 : 54) * S, 42, 82);
  btns.retry = { x: W / 2 - btnW / 2, y: H / 2 + 22 * S, w: btnW, h: btnH };
}

// ── HELP PANEL ───────────────────────────────────────────────────────────
function drawHelp(ctx) {
  var W = GF.W, H = GF.H, S = GF.S;
  ctx.fillStyle = 'rgba(8,12,18,0.94)'; ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  ctx.fillStyle = '#7ff0a0'; ctx.font = 'bold ' + GF.clamp(22 * S, 18, 32) + 'px sans-serif';
  var y = Math.max(70 * S, H * 0.1);
  ctx.fillText(GF.t('help'), W / 2, y);
  y += 40 * S;
  var lines = [GF.t('tut_goal'), GF.t('tut_controls'), GF.t('tut_win'), GF.t('tut_lose'), GF.t('tut_tip')];
  ctx.font = GF.clamp(14 * S, 11, 19) + 'px sans-serif'; ctx.fillStyle = '#dbe4ec';
  var maxW = Math.min(W * 0.86, 480 * S);
  for (var i = 0; i < lines.length; i++) {
    y = wrapLeftBlock(ctx, lines[i], W / 2, y, maxW, GF.clamp(19 * S, 15, 26)) + 12 * S;
  }
  ctx.fillStyle = '#7c8893'; ctx.font = GF.clamp(12 * S, 10, 16) + 'px sans-serif';
  ctx.fillText('(' + GF.t('close') + ')', W / 2, Math.min(y + 8 * S, H - 30 * S));
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
}

// measured text wrap (centered block); returns the y after the last line
function wrapLeftBlock(ctx, text, cx, y, maxW, lineH) {
  var words = String(text).split(/\s+/), cur = '', lines = [];
  for (var i = 0; i < words.length; i++) {
    var probe = cur ? cur + ' ' + words[i] : words[i];
    if (ctx.measureText(probe).width > maxW && cur) { lines.push(cur); cur = words[i]; }
    else cur = probe;
  }
  if (cur) lines.push(cur);
  ctx.textAlign = 'center';
  for (var j = 0; j < lines.length; j++) ctx.fillText(lines[j], cx, y + j * lineH);
  return y + lines.length * lineH;
}
function wrapCenter(ctx, text, cx, y, maxW, lineH) {
  var words = String(text).split(/\s+/), cur = '', lines = [];
  for (var i = 0; i < words.length; i++) {
    var probe = cur ? cur + ' ' + words[i] : words[i];
    if (ctx.measureText(probe).width > maxW && cur) { lines.push(cur); cur = words[i]; }
    else cur = probe;
  }
  if (cur) lines.push(cur);
  var sy = y - ((lines.length - 1) * lineH) / 2;
  for (var j = 0; j < lines.length; j++) ctx.fillText(lines[j], cx, sy + j * lineH);
}

// ── VECTOR ICONS (never emoji) ───────────────────────────────────────────
function drawCoin(ctx, x, y, r) {
  ctx.save(); ctx.fillStyle = '#ffd24a'; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#caa01e'; ctx.font = 'bold ' + (r * 1.3) + 'px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('$', x, y + r * 0.05); ctx.restore();
}
function drawDrop(ctx, x, y, r, col) {
  ctx.save(); ctx.fillStyle = col || '#43b6ff';
  ctx.beginPath(); ctx.moveTo(x, y - r * 1.3); ctx.bezierCurveTo(x + r, y - r * 0.2, x + r, y + r * 0.6, x, y + r); ctx.bezierCurveTo(x - r, y + r * 0.6, x - r, y - r * 0.2, x, y - r * 1.3); ctx.closePath(); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.6)'; ctx.beginPath(); ctx.arc(x - r * 0.3, y, r * 0.25, 0, Math.PI * 2); ctx.fill(); ctx.restore();
}
function drawSwapIcon(ctx, x, y, r) {
  ctx.save(); ctx.strokeStyle = 'rgba(255,255,255,0.75)'; ctx.lineWidth = Math.max(1.2, r * 0.28); ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  // top arrow pointing right
  ctx.beginPath(); ctx.moveTo(x - r, y - r * 0.5); ctx.lineTo(x + r, y - r * 0.5); ctx.moveTo(x + r * 0.4, y - r); ctx.lineTo(x + r, y - r * 0.5); ctx.lineTo(x + r * 0.4, y); ctx.stroke();
  // bottom arrow pointing left
  ctx.beginPath(); ctx.moveTo(x + r, y + r * 0.5); ctx.lineTo(x - r, y + r * 0.5); ctx.moveTo(x - r * 0.4, y); ctx.lineTo(x - r, y + r * 0.5); ctx.lineTo(x - r * 0.4, y + r); ctx.stroke();
  ctx.restore();
}
function drawBubble(ctx, x, y, r) {
  ctx.save(); ctx.strokeStyle = '#fff'; ctx.lineWidth = Math.max(1.2, r * 0.16); ctx.fillStyle = 'rgba(193,120,255,0.5)';
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,0.7)'; ctx.beginPath(); ctx.arc(x - r * 0.3, y - r * 0.3, r * 0.22, 0, Math.PI * 2); ctx.fill(); ctx.restore();
}
function drawShopIcon(ctx, kind, x, y, r) {
  ctx.save();
  if (kind === 'nozzle') { // wide spray fan
    ctx.strokeStyle = '#7fd0ff'; ctx.lineWidth = r * 0.22; ctx.lineCap = 'round';
    for (var a = -0.6; a <= 0.6; a += 0.3) { ctx.beginPath(); ctx.moveTo(x - r * 0.5, y); ctx.lineTo(x + r * 0.8, y + Math.tan(a) * r); ctx.stroke(); }
  } else if (kind === 'pressure') { // double arrow
    ctx.fillStyle = '#ff8a5b'; ctx.beginPath(); ctx.moveTo(x - r, y); ctx.lineTo(x, y - r * 0.8); ctx.lineTo(x, y + r * 0.8); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + r, y - r * 0.8); ctx.lineTo(x + r, y + r * 0.8); ctx.closePath(); ctx.fill();
  } else if (kind === 'tank') { // water can
    ctx.fillStyle = '#43b6ff'; GF.rr(ctx, x - r * 0.7, y - r * 0.7, r * 1.4, r * 1.5, r * 0.25); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.5)'; GF.rr(ctx, x - r * 0.5, y + r * 0.1, r, r * 0.5, r * 0.1); ctx.fill();
  } else { // soap bubble
    drawBubble(ctx, x, y, r);
  }
  ctx.restore();
}

// ── SCREENSHOT / TEST HOOKS ──────────────────────────────────────────────
window._jumpLevel = function (n) {
  seenTut = true; try { localStorage.setItem('grime_blaster_seen_tutorial', '1'); } catch (e) {}
  coachStep = -1;
  jobNum = Math.max(1, n || 4);
  cash = 120 + jobNum * 30;
  up = { nozzle: Math.min(2, Math.floor(jobNum / 3)), pressure: jobNum >= 5 ? 1 : 0, tank: Math.min(2, Math.floor(jobNum / 4)), soap: jobNum >= 2 ? 1 : 0 };
  buildJob();
  gs = 'PLAYING';
  // strip a chunk so it looks mid-job (half-cleaned boundary — the clickable frame)
  var stripUntil = pf ? 0 : 0;
  recomputeClean();
};

// land on a half-cleaned mid-job state (most clickable frame). Strips the LEFT
// portion of the grid so there's a clear dirty-vs-clean boundary on screen.
window._setupForScreenshot = function (n) {
  window._jumpLevel(n || 4);
  // ensure layout known
  layout();
  // strip left ~55% of columns fully + scatter
  var cut = Math.floor(cols * 0.55);
  for (var r = 0; r < rows; r++)
    for (var c = 0; c < cols; c++) {
      if (c < cut) grid[r][c].layers = [];
      else if (Math.random() < 0.2 && grid[r][c].layers.length > 1) grid[r][c].layers.pop();
    }
  recomputeClean();
  // position a jet at the boundary so drawJet shows the stream mid-strip
  jetX = pf.x + cut * pf.cell;
  jetY = pf.y + pf.h * 0.45;
  spraying = true; dragActive = true; tool = 'water';
  water = (TANK_SIZE + up.tank * TANK_PER_LVL) * 0.66;
  // spawn some particles for life
  for (var i = 0; i < 14; i++) GF.spawnParticles(jetX + (Math.random() - 0.5) * pf.cell * 3, jetY + (Math.random() - 0.5) * pf.cell * 3, '#bfe6ff', 1);
};

window._setLang = function (l) { GF.lang = l; };
window._setState = function (s) { gs = s; };
window._getI18N = function () { return STRINGS; };
window._getFontBody = function () { return 'sans-serif'; };

// ── BOOT ─────────────────────────────────────────────────────────────────
GF.init({
  designW: 540,
  designH: 960,
  strings: STRINGS,
  sprites: SPRITE_NAMES,
  saveKey: 'grime_blaster',
  onReady: function () {
    try { bestCash = parseInt(localStorage.getItem('grime_blaster_best_cash') || '0') || 0; } catch (e) {}
    try { bestJob = parseInt(localStorage.getItem('grime_blaster_best_job') || '1') || 1; } catch (e) {}
    try { seenTut = localStorage.getItem('grime_blaster_seen_tutorial') === '1'; } catch (e) {}

    // ── Yandex 1.9 — persist run across reload ──
    GF.persist('grime_blaster_run_v1',
      function () {
        return {
          gs: gs, jobNum: jobNum, cash: cash, failedJobs: failedJobs,
          up: up, target: target, cleanPct: cleanPct, seenTut: seenTut,
        };
      },
      function (s) {
        if (!s) return;
        jobNum = s.jobNum || 1; cash = s.cash || 0; failedJobs = s.failedJobs || 0;
        up = s.up || { nozzle: 0, pressure: 0, tank: 0, soap: 0 };
        seenTut = !!s.seenTut;
        // rebuild a fresh job at the saved jobNum (don't try to resume exact grime grid)
        buildJob();
        gs = (s.gs === 'GAMEOVER') ? 'GAMEOVER' : 'PLAYING';
        coachStep = seenTut ? -1 : 0;
      }
    );
    // ensure a valid live job exists
    if (!grid.length) { buildJob(); gs = 'PLAYING'; coachStep = seenTut ? -1 : 0; }

    // ── MUSIC (HARD RULE 8) — cozy procedural bed ──
    GF.music('audio/bg_loop.mp3', 0.5);

    // ── PLATFORM AUTOSTART (HARD RULE 9) ──
    if (window.__GF_AUTOSTART && !window._silent) {
      seenTut = true; coachStep = -1;
      if (gs !== 'GAMEOVER') gs = 'PLAYING';
    }

    // ── STATE for post-build-tester gate ──
    GF.exposeState(function () {
      return {
        gs: gs, jobNum: jobNum, cash: cash, failedJobs: failedJobs,
        cleanPct: Math.round(cleanPct * 1000) / 1000, target: target,
        water: Math.round(water), soap: Math.round(soap), tool: tool,
        sprayRadius: Math.round(curSprayRadius()), pressureLvl: curStrip(),
        tankSize: TANK_SIZE + up.tank * TANK_PER_LVL, layerHP: LAYER_HP,
        nozzleLvl: up.nozzle, tankLvl: up.tank, soapLvl: up.soap,
        bestJob: bestJob, bestCash: bestCash, cols: cols, rows: rows,
      };
    });

    // ── BOT contract for the autonomous progression probe ──
    GF.exposeBot(
      function () {
        if (gs === 'GAMEOVER') return ['retry'];
        if (gs === 'JOBDONE') {
          var a = ['next_job'];
          if (cash >= upgradePrice('nozzle') && up.nozzle < CAP.nozzle) a.push('buy_nozzle');
          if (cash >= upgradePrice('tank') && up.tank < CAP.tank) a.push('buy_tank');
          if (cash >= upgradePrice('pressure') && up.pressure < CAP.pressure) a.push('buy_pressure');
          if (cash >= upgradePrice('soap') && up.soap < CAP.soap) a.push('buy_soap');
          return a;
        }
        if (needRefill) return ['refill'];
        // spray the dirtiest cell
        var d = dirtiestCell();
        if (d) return ['spray:' + d.r + ',' + d.c, 'switch_tool'];
        return ['spray:0,0'];
      },
      function (action) {
        if (action === 'retry') { startRun(); return; }
        if (action === 'next_job') { nextJob(); return; }
        if (action === 'refill') { failJob(); return; }
        if (action === 'switch_tool') { tool = (tool === 'water' ? 'soap' : 'water'); return; }
        if (action && action.indexOf('buy_') === 0) { buyUpgrade(action.slice(4)); return; }
        if (action && action.indexOf('spray:') === 0) {
          var parts = action.slice(6).split(','); var r = +parts[0] | 0, c = +parts[1] | 0;
          layout();
          jetX = pf.x + c * pf.cell + pf.cell / 2;
          jetY = pf.y + r * pf.cell + pf.cell / 2;
          spraying = true; dragActive = true;
          // dwell long enough to actually strip the cell stack under the jet
          // (one layer ~= LAYER_HP sec; 3 stacked layers ~= 3.5s). Bot tick = a
          // sustained hold on this patch so progression is measurable per action.
          for (var i = 0; i < 240 && gs === 'PLAYING'; i++) update(1 / 60);
          spraying = false; dragActive = false;
          return;
        }
      }
    );
  },
  onUpdate: update,
  onDraw: draw,
});

// ── YANDEX MUST-HAVES (read before deleting) ─────────────────────────────
// 1. ALL UI TEXT via GF.t()/STRINGS (8.2.3) — done (no hardcoded English fillText).
// 2. SAVE RUN STATE across reload (1.9) — GF.persist + GF.saveRun on every transition.
// 3. FULLSCREEN-EXIT RESIZE (1.6.2.3) — handled in gf-lib; not overridden.
// 4. ADS ON USER-CLICK ONLY (4.4) — no ads auto-fired anywhere.

})();
