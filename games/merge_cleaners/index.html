// ── Canvas ────────────────────────────────────────────────────────────────────
const canvas = document.getElementById('game');
const ctx    = canvas.getContext('2d');
const W = 800, H = 600;

function resize() {
    const s = Math.min(window.innerWidth / W, window.innerHeight / H);
    canvas.width  = W; canvas.height = H;
    canvas.style.width  = (W * s) + 'px';
    canvas.style.height = (H * s) + 'px';
}
resize();
window.addEventListener('resize', resize);

// Prevent pull-to-refresh, swipe nav, and context menu (Yandex rules 1.6.2.7, 1.10.2)
document.addEventListener('touchmove',   e => e.preventDefault(), { passive: false });
document.addEventListener('wheel',       e => e.preventDefault(), { passive: false });
document.addEventListener('contextmenu', e => e.preventDefault());

// Game loop error overlay — visible to user, never to DevTools (rule 1.14)
let _errShown = false;
function _showGameError(msg) {
    if (_errShown) return; _errShown = true;
    const d = document.createElement('div');
    d.style.cssText = 'position:fixed;top:0;left:0;background:rgba(200,0,0,0.88);color:#fff;padding:8px;font-size:12px;z-index:9999;max-width:100%';
    d.textContent = msg;
    document.body.appendChild(d);
    setTimeout(() => { d.remove(); _errShown = false; }, 8000);
}

// ── Asset loader ──────────────────────────────────────────────────────────────
const IMGS = {};
const GUN_SPRITES   = ['cleaner_t1_rag','cleaner_t2_sponge','cleaner_t3_brush','cleaner_t4_mop',
                        'cleaner_t5_vacuum','cleaner_t6_washer','cleaner_t7_steam','cleaner_t8_laser'];
const ENEMY_SPRITES = ['dirt_t1_dust','dirt_t2_crumb','dirt_t3_grime','dirt_t4_mold'];

[...GUN_SPRITES, ...ENEMY_SPRITES].forEach(id => {
    const img = new Image();
    img.src = 'assets/' + id + '.png';
    IMGS[id] = img;
});

function imgReady(id) {
    const img = IMGS[id];
    return img && img.complete && img.naturalWidth > 0;
}

// ── Audio engine (Web Audio API — no files) ───────────────────────────────────
let _ac = null;
let _muted = false;

function ac() {
    if (!_ac) { try { _ac = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {} }
    if (_ac && _ac.state === 'suspended') _ac.resume();
    return _ac;
}

function _play(fn) {
    if (_muted) return;
    const ctx2 = ac();
    if (!ctx2) return;
    try { fn(ctx2); } catch(e) {}
}

function sfxShoot(tier) { _play(ctx2 => {
    const g = ctx2.createGain();
    g.gain.setValueAtTime(0.18 - tier * 0.01, ctx2.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ctx2.currentTime + 0.12);
    g.connect(ctx2.destination);
    const o = ctx2.createOscillator();
    const freqs = [520, 460, 400, 340, 600, 280, 800, 240];
    o.type = tier >= 6 ? 'sawtooth' : 'square';
    o.frequency.setValueAtTime(freqs[tier] || 400, ctx2.currentTime);
    o.frequency.exponentialRampToValueAtTime((freqs[tier] || 400) * 0.4, ctx2.currentTime + 0.1);
    o.connect(g); o.start(); o.stop(ctx2.currentTime + 0.12);
}); }

function sfxMerge() { _play(ctx2 => {
    for (let i = 0; i < 3; i++) {
        const g = ctx2.createGain();
        const t = ctx2.currentTime + i * 0.07;
        g.gain.setValueAtTime(0.22, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + 0.18);
        g.connect(ctx2.destination);
        const o = ctx2.createOscillator();
        o.type = 'sine';
        o.frequency.setValueAtTime(440 + i * 220, t);
        o.connect(g); o.start(t); o.stop(t + 0.18);
    }
}); }

function sfxBuy() { _play(ctx2 => {
    const g = ctx2.createGain();
    g.gain.setValueAtTime(0.2, ctx2.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ctx2.currentTime + 0.15);
    g.connect(ctx2.destination);
    const o = ctx2.createOscillator();
    o.type = 'sine';
    o.frequency.setValueAtTime(660, ctx2.currentTime);
    o.frequency.exponentialRampToValueAtTime(880, ctx2.currentTime + 0.12);
    o.connect(g); o.start(); o.stop(ctx2.currentTime + 0.15);
}); }

function sfxWallHit() { _play(ctx2 => {
    const buf = ctx2.createBuffer(1, ctx2.sampleRate * 0.25, ctx2.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 2);
    const src = ctx2.createBufferSource();
    src.buffer = buf;
    const g = ctx2.createGain();
    g.gain.setValueAtTime(0.35, ctx2.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ctx2.currentTime + 0.25);
    const filt = ctx2.createBiquadFilter();
    filt.type = 'bandpass'; filt.frequency.value = 180; filt.Q.value = 0.8;
    src.connect(filt); filt.connect(g); g.connect(ctx2.destination);
    src.start(); src.stop(ctx2.currentTime + 0.25);
}); }

function sfxWaveClear() { _play(ctx2 => {
    const notes = [523, 659, 784, 1047];
    notes.forEach((freq, i) => {
        const t = ctx2.currentTime + i * 0.12;
        const g = ctx2.createGain();
        g.gain.setValueAtTime(0.2, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
        g.connect(ctx2.destination);
        const o = ctx2.createOscillator();
        o.type = 'sine'; o.frequency.value = freq;
        o.connect(g); o.start(t); o.stop(t + 0.3);
    });
}); }

function sfxGameOver() { _play(ctx2 => {
    const notes = [392, 330, 294, 220];
    notes.forEach((freq, i) => {
        const t = ctx2.currentTime + i * 0.18;
        const g = ctx2.createGain();
        g.gain.setValueAtTime(0.22, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + 0.35);
        g.connect(ctx2.destination);
        const o = ctx2.createOscillator();
        o.type = 'sawtooth'; o.frequency.value = freq;
        o.connect(g); o.start(t); o.stop(t + 0.35);
    });
}); }

function sfxAchievement() { _play(ctx2 => {
    const notes = [523, 659, 784, 659, 1047];
    notes.forEach((freq, i) => {
        const t = ctx2.currentTime + i * 0.09;
        const g = ctx2.createGain();
        g.gain.setValueAtTime(0.18, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + 0.22);
        g.connect(ctx2.destination);
        const o = ctx2.createOscillator();
        o.type = 'sine'; o.frequency.value = freq;
        o.connect(g); o.start(t); o.stop(t + 0.22);
    });
}); }

canvas.addEventListener('pointerdown', () => {

    _audioUnlocked = true;

function t(key, ...args) {
    const s = STRINGS[lang] || STRINGS.en;
    const val = (s[key] !== undefined) ? s[key] : (STRINGS.en[key] || key);
    return typeof val === 'function' ? val(...args) : val;
}
function tierName(tier) { return t('gun' + tier); }
function upgName(id)    { return t('u_' + id + '_n'); }
function upgDesc(id)    { return t('u_' + id + '_d'); }
function achName(id)    { return t('a_' + id + '_n'); }
function achDesc(id)    { return t('a_' + id + '_d'); }

function detectLang() {
    if (ysdk && ysdk.environment && ysdk.environment.i18n && ysdk.environment.i18n.lang) {
        const sl = ysdk.environment.i18n.lang;
        lang = ['ru','be','kk','uk','uz'].includes(sl) ? 'ru' : 'en';
        return; // must not fall through to navigator
    }
    const nl = (navigator.language || '').toLowerCase();
    lang = (nl.startsWith('ru')||nl.startsWith('be')||nl.startsWith('kk')||nl.startsWith('uk')||nl.startsWith('uz')) ? 'ru' : 'en';
}

function _yadCall(fn) { try { if (ysdk) fn(ysdk); } catch(e) {} }
function yadGameplayStart() { _yadCall(s => s.features.GameplayAPI?.start()); }
function yadGameplayStop()  { _yadCall(s => s.features.GameplayAPI?.stop());  }
function yadLoadingReady()  { _yadCall(s => s.features.LoadingAPI?.ready());  }

function showInterstitialAd(onDone) {
    if (!ysdk) { if (onDone) onDone(); return; }
    if (_adInProgress) { if (onDone) onDone(); return; }
    _adInProgress = true;
    yadGameplayStop();
    const prevMuted = _muted; _muted = true;
    try {
        ysdk.adv.showFullscreenAdv({ callbacks: {
            onClose: () => { _adInProgress = false; _muted = prevMuted; if (onDone) onDone(); },
            onError: () => { _adInProgress = false; _muted = prevMuted; if (onDone) onDone(); },
        }});
    } catch(e) { _adInProgress = false; _muted = prevMuted; if (onDone) onDone(); }
}

function showRewardedAd(onRewarded, onClose) {
    if (!ysdk) {
        // Dev fallback — simulate watched ad so features are testable locally
        if (onRewarded) onRewarded();
        if (onClose) onClose(true);
        return;
    }
    if (_adInProgress) { if (onClose) onClose(false); return; }
    _adInProgress = true;
    yadGameplayStop();
    const prevMuted = _muted; _muted = true;
    let rewarded = false;
    try {
        ysdk.adv.showRewardedVideo({ callbacks: {
            onRewarded: () => { rewarded = true; if (onRewarded) onRewarded(); },
            onClose:    () => { _adInProgress = false; _muted = prevMuted; if (STATE === 'play') yadGameplayStart(); if (onClose) onClose(rewarded); },
            onError:    () => { _adInProgress = false; _muted = prevMuted; if (onClose) onClose(false); },
        }});
    } catch(e) { _adInProgress = false; _muted = prevMuted; if (onClose) onClose(false); }
}

// ── Save / load ───────────────────────────────────────────────────────────────
const SAVE_KEY = 'mergeCleaners_save';
let saveData; // { cores, upgrades:{id:level}, achievements:[id,...], stats:{...} }

function defaultSave() {
    return {
        cores: 0,
        upgrades: Object.fromEntries(Object.keys(UPGRADE_DEFS).map(k => [k, 0])),
        achievements: [],
        tutorialDone: false,
        stats: {
            totalKills: 0, totalMerges: 0, maxWave: 0, gamesPlayed: 0,
            totalKillsRun: 0, maxWaveRun: 0, highestTierRun: 0,
            flawlessWaves: 0, fullGridAchieved: false,
        },
    };
}

function loadSave() {
    try {
        const raw = localStorage.getItem(SAVE_KEY);
        if (raw) {
            saveData = JSON.parse(raw);
            // Ensure all upgrade keys exist
            Object.keys(UPGRADE_DEFS).forEach(k => { if (!(k in saveData.upgrades)) saveData.upgrades[k] = 0; });
            if (!saveData.stats) saveData.stats = defaultSave().stats;
            if (!('tutorialDone' in saveData)) saveData.tutorialDone = false;
        } else {
            saveData = defaultSave();
        }
    } catch(e) { saveData = defaultSave(); }
}

function writeSave() {
    try { localStorage.setItem(SAVE_KEY, JSON.stringify(saveData)); } catch(e) {}
}

loadSave();

// ── Apply upgrades → compute TIERS ───────────────────────────────────────────
function recomputeTiers() {
    const u = saveData.upgrades;
    TIERS = BASE_TIERS.map(t => {
        const dmg = t.damage * Math.pow(1.15, u.dmg_boost);
        const rate = t.rate   * Math.pow(0.90, u.fire_rate);
        const bspd = t.bspeed * Math.pow(1.15, u.bullet_spd);
        return { ...t, damage: dmg, rate: Math.max(8, rate), bspeed: bspd };
    });
}

function getStartGold() {
    return 60 + saveData.upgrades.start_gold * 30;
}

function getBuyCostBase() {
    return BUY_COST_BASE * Math.pow(0.85, saveData.upgrades.buy_discount);
}

function getWaveBonus(w) {
    return Math.round(w * 10 * Math.pow(1.30, saveData.upgrades.wave_bonus));
}

function getGoldMult() {
    return Math.pow(1.20, saveData.upgrades.gold_mult);
}

function getMaxHp() {
    return 20 + saveData.upgrades.max_hp * 10;
}

function getCritChance() {
    return saveData.upgrades.crit_chance * 0.08;
}

function getFastStartGold(startWaveNum) {
    // Simulate waves 1..(startWaveNum-1) gold: base + all wave bonuses + kills estimate
    let g = getStartGold();
    for (let w = 1; w < startWaveNum; w++) {
        g += getWaveBonus(w);
        // Estimate kill gold: ~half of enemies * average reward
        const cfg = waveConfig(w);
        g += Math.round(cfg.count * 0.65 * cfg.reward * getGoldMult());
    }
    return Math.round(g);
}

function initGame() {
    recomputeTiers();

    wave = 0;

const FAST_START_WAVE = 10;

function initGameFastStart() {
    initGame();
    wave = FAST_START_WAVE - 1; // so next wave button starts wave 10
    gold = getFastStartGold(FAST_START_WAVE);
    // Pre-place a starter set of guns scaled to wave 10 strength
    // Give 6 guns: mix of T2–T4 spread across the right columns
    const starterTiers = [3, 2, 3, 2, 1, 2]; // T4,T3,T4,T3,T2,T3
    starterTiers.forEach(tier => {
        const cell = emptyCell();
        if (cell) guns.push({ col: cell.col, row: cell.row, tier, cd: 0 });

// ── Results / achievements ────────────────────────────────────────────────────
function computeResults() {
    const coresEarned = Math.max(1, Math.floor(wave * 3 + score / 80));
    saveData.cores += coresEarned;
    saveData.stats.gamesPlayed++;
    saveData.stats.totalKills += runKills;
    saveData.stats.totalMerges += runMerges;
    if (wave > saveData.stats.maxWave) saveData.stats.maxWave = wave;
    saveData.stats.maxWaveRun = wave;
    saveData.stats.highestTierRun = runHighestTier;
    saveData.stats.flawlessWaves += runFlawlessWaves;
    if (guns.length >= COLS * ROWS) saveData.stats.fullGridAchieved = true;

    const newAch = [];
    ACH_DEFS.forEach(def => {
        if (!saveData.achievements.includes(def.id) && def.check(saveData.stats)) {
            saveData.achievements.push(def.id);
            saveData.cores += def.coreReward;
            newAch.push(def);
        }
    });

    writeSave();
    runResults = { wave, score, coresEarned, newAchievements: newAch };
}

function checkAchievementsLive() {
    ACH_DEFS.forEach(def => {
        if (!saveData.achievements.includes(def.id) && def.check(saveData.stats)) {
            saveData.achievements.push(def.id);
            saveData.cores += def.coreReward;
            achToasts.push({ text: t('ach_toast', achName(def.id), def.coreReward), life: 180 });
            sfxAchievement();
            writeSave();
        }
    });
}

// ── Floor / level themes ──────────────────────────────────────────────────────
// 4 backgrounds based on current wave (kitchen → bathroom → hospital → spaceship)
function getFloorTint() {
    const w = wave || 0;
    // L1: kitchen (warm beige), L2: bathroom (cool blue), L3: hospital (clinical),
    // L4: spaceship deck (dark steel/violet)
    if (w >= 30)      return { bg:'#161a30', tile:'#2a2f50', name:'spaceship' };
    if (w >= 20)      return { bg:'#0e1e1e', tile:'#1a3a3a', name:'hospital'  };
    if (w >= 10)      return { bg:'#0e1a26', tile:'#1a2e44', name:'bathroom'  };
    return                   { bg:'#1a160d', tile:'#2e271a', name:'kitchen'   };
}

// ── Wave config ───────────────────────────────────────────────────────────────
function waveConfig(w) {
    const count  = 8  + w * 3;
    const tier   = Math.min(3, Math.floor(w / 4));
    const hpMult = 1  + w * 0.25;
    const spd    = 0.55 + w * 0.04;
    const reward = 4  + w * 2;
    const interval = Math.max(40, 100 - w * 4);
    return { count, tier, hpMult, spd, reward, interval };
}

function spawnEnemy(w) {
    const cfg = waveConfig(w);
    const type = Math.min(cfg.tier, 3);
    const ETYPES = [
        { color:'#b89968', glow:'#d4b886', baseHp:8  },  // Dust (sandy)
        { color:'#8b5a2b', glow:'#a87341', baseHp:18 },  // Crumb (brown)
        { color:'#6b8e23', glow:'#9acd32', baseHp:35 },  // Grime (olive/green)
        { color:'#3d5a3d', glow:'#5a8a5a', baseHp:70 },  // Mold (dark green boss)
    ];
    const et = ETYPES[type];
    const ehp = Math.round(et.baseHp * cfg.hpMult);
    const y   = GRID_Y + 10 + Math.random() * (ROWS * (CH + 4) - 20);
    enemies.push({
        x: W + 30, y,
        hp: ehp, maxHp: ehp,
        spd: cfg.spd + Math.random() * 0.15,
        reward: cfg.reward, type,
        color: et.color, glow: et.glow, r: 14 + type * 3,
    });
}

function _doStartWave() {
    wave++;
    waveActive = true;
    yadGameplayStart();
    const cfg = waveConfig(wave);
    waveEnemiesLeft = cfg.count;
    spawnInterval = cfg.interval;
    spawnTimer = 0; waveEndTimer = 0;
    runWaveHpBefore = hp;
    armorUsedThisWave = false;
}

function startWave() {
    if (STATE === 'tutorial') {
        saveData.tutorialDone = true;
        writeSave();
        STATE = 'play';
        showInterstitialAd(() => { _doStartWave(); });
        return;
    }
    _doStartWave();
}

// ── Grid ──────────────────────────────────────────────────────────────────────
function cellRect(col, row) {
    return { x: GRID_X + col * (CW + 4), y: GRID_Y + row * (CH + 4), w: CW, h: CH };
}
function gunAt(col, row) { return guns.find(g => g.col === col && g.row === row) || null; }
function emptyCell() {
    for (let c = COLS - 1; c >= 0; c--)
        for (let r = 0; r < ROWS; r++)
            if (!gunAt(c, r)) return { col: c, row: r };
    return null;
}

function buyGun() {
    const cell = emptyCell();
    if (!cell) { spawnFloat(GRID_X + COLS*(CW+4)/2, GRID_Y - 18, t('grid_full'), '#e74c3c'); return; }
    const cost = Math.round(getBuyCostBase() * Math.pow(BUY_COST_SCALE, buyCount));
    if (gold < cost) { spawnFloat(GRID_X + COLS*(CW+4)/2, GRID_Y - 18, t('need_gold', cost), '#e74c3c'); return; }
    gold -= cost; buyCount++;
    sfxBuy();
    guns.push({ col: cell.col, row: cell.row, tier: 0, cd: 0 });
    spawnFloat(cellRect(cell.col, cell.row).x + CW/2, cellRect(cell.col, cell.row).y, t('plus_gun'), '#2ecc71');
    if (STATE === 'tutorial') { if (tutStep === 0) tutStep = 1; else if (tutStep === 1) tutStep = 2; }
    if (guns.length >= COLS * ROWS) { saveData.stats.fullGridAchieved = true; checkAchievementsLive(); }
}

function tryMerge(col, row) {
    if (!selected) return false;
    if (selected.col === col && selected.row === row) { selected = null; return true; }
    const a = gunAt(selected.col, selected.row);
    const b = gunAt(col, row);
    if (!a) { selected = null; return false; }
    if (!b) {
        a.col = col; a.row = row; selected = null; return true;
    }
    if (a.tier !== b.tier) {
        const tc = b.col, tr = b.row;
        b.col = a.col; b.row = a.row;
        a.col = tc; a.row = tr;
        selected = null; return true;
    }
    if (a.tier >= TIERS.length - 1) {
        spawnFloat(cellRect(col, row).x + CW/2, cellRect(col, row).y, t('max_tier'), '#ffd700');
        selected = null; return true;
    }
    guns = guns.filter(g => !(g.col === selected.col && g.row === selected.row));
    b.tier = a.tier + 1; b.cd = 0;
    if (b.tier > runHighestTier) { runHighestTier = b.tier; saveData.stats.highestTierRun = runHighestTier; }
    spawnMergeParticles(cellRect(col, row).x + CW/2, cellRect(col, row).y + CH/2, TIERS[b.tier].glow);
    spawnFloat(cellRect(col, row).x + CW/2, cellRect(col, row).y - 10, '▲ ' + tierName(b.tier), TIERS[b.tier].glow);
    runMerges++; saveData.stats.totalMerges++;
    sfxMerge();
    if (STATE === 'tutorial' && tutStep === 2) tutStep = 3;
    checkAchievementsLive();
    selected = null; return true;
}

// ── Crate rewards ─────────────────────────────────────────────────────────────
function openCrate() {
    if (!crate || _adInProgress) return;
    const c = crate;
    crate = null;
    showRewardedAd(
        () => { // onRewarded
            const cell = emptyCell();
            if (!cell) { achToasts.push({ text: t('crate_full'), life: 160 }); return; }
            guns.push({ col: cell.col, row: cell.row, tier: c.tier, cd: 0 });
            if (c.tier > runHighestTier) { runHighestTier = c.tier; saveData.stats.highestTierRun = runHighestTier; }
            spawnMergeParticles(cellRect(cell.col, cell.row).x + CW/2, cellRect(cell.col, cell.row).y + CH/2, TIERS[c.tier].glow);
            spawnFloat(cellRect(cell.col, cell.row).x + CW/2, cellRect(cell.col, cell.row).y - 10, '🎁 ' + tierName(c.tier) + '!', TIERS[c.tier].glow);
            sfxMerge();
            checkAchievementsLive();
        },
        null
    );
}

function openMenuCrate() {
    if (_adInProgress) return;
    showRewardedAd(
        () => {
            saveData.cores += 10;
            writeSave();
            achToasts.push({ text: t('crate_reward'), life: 240 });
        },
        null
    );
}

function offerResurrect() {
    // Called when hp hits 0 — offer one rewarded ad to continue
    if (resurrectOffered || _adInProgress) { _finishRun(); return; }
    resurrectOffered = true;
    STATE = 'resurrect'; // special overlay state
}

function _finishRun() {
    sfxGameOver();
    yadGameplayStop();
    computeResults();
    STATE = 'results';
    showInterstitialAd(null);
}

function acceptResurrect() {
    showRewardedAd(
        () => { // onRewarded
            hp = 1;
            // Bonus: add best_tier - 1 gun if space available
            const cell = emptyCell();
            if (cell && guns.length > 0) {
                const bestTier = Math.max(...guns.map(g => g.tier));
                const bonusTier = Math.max(0, bestTier - 1);
                guns.push({ col: cell.col, row: cell.row, tier: bonusTier, cd: 0 });
                spawnMergeParticles(cellRect(cell.col, cell.row).x + CW/2, cellRect(cell.col, cell.row).y + CH/2, TIERS[bonusTier].glow);
                spawnFloat(cellRect(cell.col, cell.row).x + CW/2, cellRect(cell.col, cell.row).y - 10, '⚡ ' + tierName(bonusTier) + '!', '#ffd700');
            }
            spawnFloat(W/2, H/2, t('resurrected'), '#ffd700');
            sfxWaveClear();
            STATE = 'play';
            yadGameplayStart();
        },
        (rewarded) => {
            if (!rewarded) _finishRun(); // ad skipped / no reward
        }
    );
}

// ── Particles / floats ────────────────────────────────────────────────────────
function spawnMergeParticles(x, y, color) {
    for (let i = 0; i < 18; i++) {
        const a = Math.random() * Math.PI * 2, s = 1.5 + Math.random() * 3;
        particles.push({ x, y, dx: Math.cos(a)*s, dy: Math.sin(a)*s, life: 35, maxLife: 35, color, r: 2 + Math.random()*2 });
    }
}
function spawnHitParticles(x, y, color) {
    for (let i = 0; i < 5; i++) {
        const a = Math.random() * Math.PI * 2;
        particles.push({ x, y, dx: Math.cos(a)*(1+Math.random()*2), dy: Math.sin(a)*(1+Math.random()*2), life: 18, maxLife: 18, color, r: 1.5 });
    }
}
function spawnFloat(x, y, text, color) { floats.push({ x, y, vy: -0.8, text, life: 60, color }); }

// ── Input ─────────────────────────────────────────────────────────────────────
function getCanvasPos(e) {
    const r = canvas.getBoundingClientRect();
    const scaleX = W / r.width, scaleY = H / r.height;
    const cx = e.touches ? e.touches[0].clientX : e.clientX;
    const cy = e.touches ? e.touches[0].clientY : e.clientY;
    return { x: (cx - r.left) * scaleX, y: (cy - r.top) * scaleY };
}

function handleClick(px, py) {
    if (STATE === 'menu') {
        // Fast-start button (only when unlocked; H/2+168..204)
        if (saveData.stats.maxWave >= FAST_START_WAVE &&
            px >= W/2 - 120 && px <= W/2 + 120 && py >= H/2 + 168 && py <= H/2 + 204) {
            showInterstitialAd(() => { initGameFastStart(); STATE = 'play'; });
            return;
        }
        // Crate button (position shifts based on fast-start unlock)
        const crateY = saveData.stats.maxWave >= FAST_START_WAVE ? H/2 + 212 : H/2 + 172;
        if (px >= W/2 - 130 && px <= W/2 + 130 && py >= crateY && py <= crateY + 36) {
            openMenuCrate(); return;
        }
        // Any other click = start normal game (show interstitial first)
        showInterstitialAd(() => { initGame(); STATE = 'play'; });
        return;
    }
    if (STATE === 'results')  { handleResultsClick(px, py); return; }
    if (STATE === 'upgrades') { handleUpgradesClick(px, py); return; }
    if (STATE === 'resurrect') {
        // Buttons are drawn centered — watch ad or skip
        const bcy = H/2 + 80;
        if (px >= W/2 - 180 && px <= W/2 - 10 && py >= bcy && py <= bcy + 44) { acceptResurrect(); return; }
        if (px >= W/2 + 10  && px <= W/2 + 180 && py >= bcy && py <= bcy + 44) { _finishRun(); return; }
        return;
    }

    // Mute button (W-38, 58, 28, 18)
    if (px >= W - 38 && px <= W - 10 && py >= 58 && py <= 76) { _muted = !_muted; return; }

    // Buy button
    const bx = GRID_X, by = 88, bw = COLS*(CW+4)-4, bh = 28;
    if (px >= bx && px <= bx+bw && py >= by && py <= by+bh) { buyGun(); return; }

    // Supply crate click
    if (crate && Math.hypot(px - crate.x, py - crate.y) < 26) { openCrate(); return; }

    // Start wave button
    if (!waveActive) {
        const wx2 = DIVIDER_X + 10, wy = H - 56, ww = LANE_W - 10, wh = 42;
        if (px >= wx2 && px <= wx2+ww && py >= wy && py <= wy+wh) {
            if (STATE === 'tutorial' && tutStep < 3) return;
            startWave(); return;
        }
    }

    // Grid click
    for (let row = 0; row < ROWS; row++) {
        for (let col = 0; col < COLS; col++) {
            const r = cellRect(col, row);
            if (px >= r.x && px <= r.x+r.w && py >= r.y && py <= r.y+r.h) {
                if (selected) { tryMerge(col, row); }
                else if (gunAt(col, row)) { selected = { col, row }; }
                return;
            }
        }
    }
    selected = null;
}

canvas.addEventListener('click',     e => { const p = getCanvasPos(e); handleClick(p.x, p.y); });
canvas.addEventListener('touchstart', e => { e.preventDefault(); const p = getCanvasPos(e); handleClick(p.x, p.y); }, { passive: false });

// ── Results screen clicks ─────────────────────────────────────────────────────
const RES = { bx: W/2 - 200, by: H/2 - 170, bw: 400, bh: 340 };

function handleResultsClick(px, py) {
    const cx = W/2;
    // UPGRADES button
    if (px >= cx - 180 && px <= cx - 10 && py >= RES.by + RES.bh - 52 && py <= RES.by + RES.bh - 16) {
        STATE = 'upgrades'; return;
    }
    // PLAY AGAIN button
    if (px >= cx + 10 && px <= cx + 180 && py >= RES.by + RES.bh - 52 && py <= RES.by + RES.bh - 16) {
        initGame(); STATE = 'play'; return;
    }
    // MENU button (top-right of card)
    if (px >= RES.bx + RES.bw - 70 && px <= RES.bx + RES.bw - 5 && py >= RES.by + 8 && py <= RES.by + 30) {
        STATE = 'menu'; return;
    }
}

// ── Upgrades screen ───────────────────────────────────────────────────────────
let upgScroll = 0;
const BRANCH_ORDER = ['FIREPOWER','DEFENSE','ECONOMY'];
const BRANCH_COLORS = { FIREPOWER:'#e74c3c', DEFENSE:'#3498db', ECONOMY:'#f1c40f' };

function handleUpgradesClick(px, py) {
    // BACK button
    if (px >= 12 && px <= 120 && py >= 12 && py <= 42) { STATE = 'results'; return; }

    // Purchase upgrade cards
    const colW = (W - 24) / 3;
    BRANCH_ORDER.forEach((branch, bi) => {
        const bx = 12 + bi * colW;
        const upgInBranch = Object.entries(UPGRADE_DEFS).filter(([,d]) => d.branch === branch);
        upgInBranch.forEach(([id, def], ui) => {
            const ux = bx + 8, uy = 58 + ui * 115;
            const uw = colW - 16, uh = 108;
            if (px >= ux && px <= ux+uw && py >= uy && py <= uy+uh) {
                const curLv = saveData.upgrades[id];
                if (curLv >= def.maxLv) return;
                const cost = def.costs[curLv];
                if (saveData.cores >= cost) {
                    saveData.cores -= cost;
                    saveData.upgrades[id]++;
                    writeSave();
                    recomputeTiers();
                }
            }
        });
    });
}

// ── Gun firing ────────────────────────────────────────────────────────────────
function closestEnemy(gx, gy, range) {
    let best = null, bestDist = range;
    for (const en of enemies) {
        const d = Math.hypot(en.x - gx, en.y - gy);
        if (d < bestDist) { bestDist = d; best = en; }
    }
    return best;
}

function updateGuns() {
    const rateBoost = lastStandActive ? 0.5 : 1.0;
    for (const g of guns) {
        if (g.cd > 0) { g.cd -= (lastStandActive ? 2 : 1); continue; }
        const t = TIERS[g.tier];
        const r = cellRect(g.col, g.row);
        const gx = r.x + CW, gy = r.y + CH / 2;
        const target = closestEnemy(gx, gy, t.range);
        if (!target) continue;
        const dx = target.x - gx, dy = target.y - gy;
        const dist = Math.hypot(dx, dy) || 1;
        const isCrit = Math.random() < getCritChance();
        const dmg = isCrit ? t.damage * 2 : t.damage;
        bullets.push({
            x: gx, y: gy,
            dx: (dx / dist) * t.bspeed, dy: (dy / dist) * t.bspeed,
            dmg, color: isCrit ? '#fff' : t.glow, r: isCrit ? 5 : 3 + g.tier * 0.4,
        });
        g.cd = Math.round(t.rate * rateBoost);
        _sfxShootThisFrame++; if (_sfxShootThisFrame <= 3) sfxShoot(g.tier);
    }
}

function updateBullets() {
    for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        b.x += b.dx; b.y += b.dy;
        if (b.x > W + 20 || b.x < 0 || b.y < 0 || b.y > H) { bullets.splice(i, 1); continue; }
        let hit = false;
        for (let j = enemies.length - 1; j >= 0; j--) {
            const en = enemies[j];
            if (Math.hypot(b.x - en.x, b.y - en.y) < en.r + b.r) {
                en.hp -= b.dmg;
                spawnHitParticles(b.x, b.y, b.color);
                bullets.splice(i, 1);
                if (en.hp <= 0) {
                    const reward = Math.round(en.reward * getGoldMult());
                    gold += reward; score += reward; runKills++;
                    saveData.stats.totalKills++;
                    spawnFloat(en.x, en.y - en.r, '+' + reward + (lang==='ru'?' м':' s'), '#48dbfb');
                    spawnHitParticles(en.x, en.y, en.glow);
                    for (let k = 0; k < 8; k++) spawnHitParticles(en.x, en.y, en.color);
                    enemies.splice(j, 1);
                    checkAchievementsLive();
                }
                hit = true; break;
            }
        }
        if (hit) continue;
    }
}

function spawnWallExplosion(x, y, color, glow) {
    for (let k = 0; k < 22; k++) {
        const a = Math.random() * Math.PI * 2;
        const s = 1.5 + Math.random() * 4;
        particles.push({
            x, y,
            dx: Math.cos(a) * s, dy: Math.sin(a) * s,
            life: 28 + Math.random() * 22, maxLife: 50,
            color: Math.random() > 0.45 ? glow : color,
            r: 1.5 + Math.random() * 3,
        });
    }
    // Debris sparks toward base
    for (let k = 0; k < 8; k++) {
        particles.push({
            x, y,
            dx: -(1 + Math.random() * 3), dy: (Math.random() - 0.5) * 4,
            life: 20, maxLife: 20, color: '#f39c12', r: 1.5,
        });
    }
}

function updateEnemies() {
    for (let i = enemies.length - 1; i >= 0; i--) {
        const en = enemies[i];
        en.x -= en.spd;
        if (en.x < DIVIDER_X - en.r) {
            let dmg = 1;
            if (saveData.upgrades.armor >= 1 && !armorUsedThisWave) { dmg = 0; armorUsedThisWave = true; }
            spawnWallExplosion(DIVIDER_X - 4, en.y, en.color, en.glow);
            sfxWallHit();
            hp -= dmg;
            if (dmg > 0) spawnFloat(DIVIDER_X - 40, en.y - 18, t('minus_hp'), '#e74c3c');
            enemies.splice(i, 1);
            if (hp <= 1 && saveData.upgrades.last_stand >= 1 && !lastStandActive) {
                lastStandActive = true; lastStandTimer = 600;
                spawnFloat(W/2, H/2 - 40, t('last_stand_float'), '#f1c40f');
            }
            if (hp <= 0) { hp = 0; endRun(); }
        }
    }
}

function endRun() {
    offerResurrect();
}

// ── Update ────────────────────────────────────────────────────────────────────
let _sfxShootThisFrame = 0;
function update() {
    if (_gamePaused) return;
    if (STATE !== 'play' && STATE !== 'resurrect' && STATE !== 'tutorial') return;
    if (STATE === 'resurrect') return;
    _sfxShootThisFrame = 0;
    updateGuns();
    updateBullets();
    updateEnemies();

    if (lastStandActive) {
        lastStandTimer--;
        if (lastStandTimer <= 0) lastStandActive = false;
    }

    if (waveActive && waveEnemiesLeft > 0) {
        spawnTimer++;
        if (spawnTimer >= spawnInterval) { spawnEnemy(wave); waveEnemiesLeft--; spawnTimer = 0; }
    }

    if (waveActive && waveEnemiesLeft === 0 && enemies.length === 0) {
        waveEndTimer++;
        if (waveEndTimer > 60) {
            // Check flawless
            if (hp === runWaveHpBefore) {
                runFlawlessWaves++;
                saveData.stats.flawlessWaves++;
                spawnFloat(W/2, 120, t('flawless'), '#f1c40f');
            }
            // HP regen
            const regen = saveData.upgrades.hp_regen * 2;
            if (regen > 0) { hp = Math.min(maxHp, hp + regen); spawnFloat(DIVIDER_X - 40, 160, t('plus_hp', regen), '#2ecc71'); }
            waveActive = false;
            yadGameplayStop();
            const bonus = getWaveBonus(wave);
            gold += bonus; score += bonus;
            sfxWaveClear();
            spawnFloat(W/2, H/2 - 20, t('wave_clear', wave, bonus), '#f1c40f');
            checkAchievementsLive();
        }
    }

    // Supply crate spawning
    if (waveActive) crateSpawnTimer++;
    const _crateThreshold = crateFirstSpawned ? CRATE_REPEAT_INTERVAL : CRATE_FIRST_INTERVAL;
    if (crateSpawnTimer >= _crateThreshold && !crate && guns.length > 0 && emptyCell()) {
        const bestTier = Math.max(...guns.map(g => g.tier));
        crate = {
            x: LANE_X + 50 + Math.random() * (LANE_W - 120),
            y: GRID_Y + 20 + Math.random() * (ROWS * (CH + 4) - 50),
            life: CRATE_LIFETIME, maxLife: CRATE_LIFETIME,
            tier: Math.max(0, Math.ceil(bestTier / 2)),
        };
        crateSpawnTimer = 0;
        crateFirstSpawned = true;
    }
    if (crate) { crate.life--; if (crate.life <= 0) crate = null; }

    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.dx; p.y += p.dy; p.dx *= 0.93; p.dy *= 0.93; p.life--;
        if (p.life <= 0) particles.splice(i, 1);
    }
    for (let i = floats.length - 1; i >= 0; i--) {
        const f = floats[i]; f.y += f.vy; f.life--;
        if (f.life <= 0) floats.splice(i, 1);
    }
    for (let i = achToasts.length - 1; i >= 0; i--) {
        achToasts[i].life--;
        if (achToasts[i].life <= 0) achToasts.splice(i, 1);
    }
}

// ── Draw helpers ──────────────────────────────────────────────────────────────
function drawRR(x, y, w, h, r, fill, stroke, lw) {
    ctx.beginPath();
    ctx.moveTo(x+r, y); ctx.lineTo(x+w-r, y);
    ctx.arcTo(x+w, y, x+w, y+r, r); ctx.lineTo(x+w, y+h-r);
    ctx.arcTo(x+w, y+h, x+w-r, y+h, r); ctx.lineTo(x+r, y+h);
    ctx.arcTo(x, y+h, x, y+h-r, r); ctx.lineTo(x, y+r);
    ctx.arcTo(x, y, x+r, y, r); ctx.closePath();
    if (fill)  { ctx.fillStyle = fill; ctx.fill(); }
    if (stroke){ ctx.strokeStyle = stroke; ctx.lineWidth = lw||1; ctx.stroke(); }
}

function drawGun(x, y, w, h, tier) {
    const t = TIERS[tier];
    const cx = x + w/2, cy = y + h/2;
    const sid = GUN_SPRITES[tier];
    ctx.save();
    // Cell tint background
    ctx.shadowColor = t.glow; ctx.shadowBlur = 14;
    drawRR(x+3, y+3, w-6, h-6, 8, t.color + '22', t.glow + '99', 1.5);
    ctx.shadowBlur = 0;

    if (imgReady(sid)) {
        // Per-tier padding: pistol smaller, rest snug but not cramped
        const PAD = [16, 9, 9, 8, 9, 9, 8, 8];
        const pad = PAD[tier] || 9;
        const sz = w - pad * 2;
        const ox = x + pad, oy = y + (h - sz) / 2; // vertically centred
        ctx.shadowColor = t.glow; ctx.shadowBlur = 8;
        ctx.drawImage(IMGS[sid], ox, oy, sz, sz);
    } else {
        // Canvas fallback
        ctx.fillStyle = t.color;
        ctx.fillRect(cx + 8, cy - 3, 18, 6);
        ctx.shadowColor = t.glow; ctx.shadowBlur = 8;
        ctx.fillStyle = t.color;
        ctx.beginPath(); ctx.arc(cx, cy, 12 + tier, 0, Math.PI*2); ctx.fill();
        ctx.strokeStyle = t.glow; ctx.lineWidth = 2; ctx.stroke();
        ctx.shadowBlur = 0;
        ctx.fillStyle = '#fff'; ctx.font = 'bold 11px monospace';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText('T' + (tier+1), cx, cy);
    }
    ctx.restore();
}

function drawGunName(x, y, w, tier) {
    ctx.fillStyle = TIERS[tier].glow; ctx.font = '9px monospace';
    ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    ctx.fillText(tierName(tier), x + w/2, y + 4);
}

function drawEnemy(en) {
    const sid = ENEMY_SPRITES[Math.min(en.type, ENEMY_SPRITES.length - 1)];
    const sr  = en.r * 2.6; // sprite draw size
    ctx.save();
    if (imgReady(sid)) {
        ctx.shadowColor = en.glow; ctx.shadowBlur = 14;
        ctx.drawImage(IMGS[sid], en.x - sr/2, en.y - sr/2, sr, sr);
    } else {
        ctx.shadowColor = en.glow; ctx.shadowBlur = 12;
        ctx.fillStyle = en.color;
        ctx.beginPath(); ctx.arc(en.x, en.y, en.r, 0, Math.PI*2); ctx.fill();
        ctx.strokeStyle = en.glow; ctx.lineWidth = 2; ctx.stroke();
    }
    ctx.shadowBlur = 0;
    // HP bar always on top
    const bw = sr, bh = 4, bx = en.x - sr/2, by = en.y - sr/2 - 7;
    ctx.fillStyle = '#1a1a1a'; ctx.fillRect(bx, by, bw, bh);
    ctx.fillStyle = en.color;  ctx.fillRect(bx, by, bw * (en.hp / en.maxHp), bh);
    ctx.restore();
}

// ── Draw HUD ──────────────────────────────────────────────────────────────────
function drawHUD() {
    drawRR(0, 0, W, 82, 0, '#0e1e2e', null, 0);
    ctx.fillStyle = '#48dbfb'; ctx.font = 'bold 20px monospace';
    ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    ctx.fillText('💧 ' + gold, 12, 24);

    // Polish chips
    ctx.fillStyle = '#e0aaff'; ctx.font = 'bold 15px monospace';
    ctx.fillText('✨ ' + saveData.cores, 12, 48);

    const hpW = 170, hpH = 18, hpX = W/2 - hpW/2, hpY = 10;
    ctx.fillStyle = '#1a1a2e'; ctx.fillRect(hpX, hpY, hpW, hpH);
    const hpFrac = hp / maxHp;
    ctx.fillStyle = hpFrac > 0.5 ? '#2ecc71' : hpFrac > 0.25 ? '#f39c12' : '#e74c3c';
    if (lastStandActive) ctx.fillStyle = '#f1c40f';
    ctx.fillRect(hpX, hpY, hpW * hpFrac, hpH);
    ctx.strokeStyle = '#333'; ctx.lineWidth = 1; ctx.strokeRect(hpX, hpY, hpW, hpH);
    ctx.fillStyle = '#fff'; ctx.font = 'bold 11px monospace';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('HP ' + hp + '/' + maxHp, W/2, hpY + hpH/2);

    ctx.fillStyle = '#aaa'; ctx.font = '14px monospace'; ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
    ctx.fillText(t('wave_hud', wave), W - 12, 24);
    ctx.fillStyle = '#666'; ctx.font = '11px monospace';
    ctx.fillText(t('score_label', score), W - 12, 44);

    if (lastStandActive) {
        ctx.save(); ctx.shadowColor = '#f1c40f'; ctx.shadowBlur = 12;
        ctx.fillStyle = '#f1c40f'; ctx.font = 'bold 11px monospace'; ctx.textAlign = 'right';
        // anchor LEFT of the mute button (its left edge is W-38) so the timer
        // never prints over the speaker icon (reserved top-right control zone).
        ctx.fillText(t('last_stand_hud', Math.ceil(lastStandTimer / 60)), W - 44, 62);
        ctx.restore();
    }

    // Mute button (top-right corner)
    const mx = W - 38, my = 58, mw = 28, mh = 18;
    drawRR(mx, my, mw, mh, 4, '#1a1a2e', '#444', 1);
    ctx.fillStyle = _muted ? '#888' : '#aaa'; ctx.font = '12px monospace'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(_muted ? '🔇' : '🔊', mx + mw/2, my + mh/2);

    const cost = Math.round(getBuyCostBase() * Math.pow(BUY_COST_SCALE, buyCount));
    const canBuy = gold >= cost && emptyCell();
    drawRR(GRID_X, 88, COLS*(CW+4)-4, 28, 6, canBuy ? '#1a3a1a' : '#1a1a1a', canBuy ? '#2ecc71' : '#444', 1.5);
    ctx.fillStyle = canBuy ? '#2ecc71' : '#666';
    ctx.font = 'bold 13px monospace'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(t('buy_gun', cost), GRID_X + (COLS*(CW+4)-4)/2, 88 + 14);
}

// ── Draw grid ─────────────────────────────────────────────────────────────────
function drawGrid() {
    for (let row = 0; row < ROWS; row++) {
        for (let col = 0; col < COLS; col++) {
            const r = cellRect(col, row);
            const g = gunAt(col, row);
            const isSel = selected && selected.col === col && selected.row === row;
            const selGun = selected ? gunAt(selected.col, selected.row) : null;
            const canMerge = selGun && g && !isSel && g.tier === selGun.tier;
            const isEmpty = !g && selected;
            const border = isSel ? '#f1c40f' : canMerge ? '#2ecc71' : isEmpty ? '#4488ff' : g ? TIERS[g.tier].glow + '66' : '#1e1e2e';
            drawRR(r.x, r.y, r.w, r.h, 8, '#111122', border, isSel || canMerge || isEmpty ? 2 : 1);
            if (g) { drawGun(r.x, r.y, r.w, r.h, g.tier); drawGunName(r.x, r.y, r.w, g.tier); }
        }
    }
    if (selected) {
        const sg = gunAt(selected.col, selected.row);
        if (sg) {
            ctx.fillStyle = '#f1c40f88'; ctx.font = '10px monospace';
            ctx.textAlign = 'center'; ctx.textBaseline = 'top';
            ctx.fillText(t('grid_hint'), GRID_X + COLS*(CW+4)/2, GRID_Y + ROWS*(CH+4) + 6);
        }
    }
}

// ── Draw wall ─────────────────────────────────────────────────────────────────
function drawWall() {
    const wx = DIVIDER_X - 10, ww = 14;
    // Wall body
    ctx.fillStyle = '#1c2a38'; ctx.fillRect(wx, 0, ww, H);
    // Segment bricks
    const segH = 48;
    for (let y = 0; y < H; y += segH) {
        // Battlement cap
        ctx.fillStyle = '#253545';
        ctx.fillRect(wx - 5, y, ww + 10, 26);
        // Mortar line
        ctx.fillStyle = '#111e28';
        ctx.fillRect(wx, y + 26, ww, 2);
        // Highlight edge
        ctx.fillStyle = '#2e4a60';
        ctx.fillRect(wx - 5, y, 2, 26);
        // Shadow edge
        ctx.fillStyle = '#0e1820';
        ctx.fillRect(wx + ww + 3, y, 2, 26);
    }
    // Friendly glow on base side (clean teal)
    const grad = ctx.createLinearGradient(wx - 28, 0, wx, 0);
    grad.addColorStop(0, 'rgba(72,219,251,0)');
    grad.addColorStop(1, 'rgba(72,219,251,0.14)');
    ctx.fillStyle = grad; ctx.fillRect(wx - 28, 0, 28, H);
    // Danger glow on dirt side (olive grime)
    const grad2 = ctx.createLinearGradient(wx + ww, 0, wx + ww + 24, 0);
    grad2.addColorStop(0, 'rgba(154,205,50,0.14)');
    grad2.addColorStop(1, 'rgba(154,205,50,0)');
    ctx.fillStyle = grad2; ctx.fillRect(wx + ww, 0, 24, H);
}

// ── Draw lane ─────────────────────────────────────────────────────────────────
function drawLane() {
    // Floor background tinted by current level (kitchen/bath/hospital/spaceship)
    const floorTint = getFloorTint();
    ctx.fillStyle = floorTint.bg; ctx.fillRect(LANE_X, 0, LANE_W, H);
    // Tile grid lines
    ctx.strokeStyle = floorTint.tile; ctx.lineWidth = 1;
    for (let y = 0; y < H; y += 40) {
        ctx.beginPath(); ctx.moveTo(LANE_X, y); ctx.lineTo(W, y); ctx.stroke();
    }
    for (let x = LANE_X; x < W; x += 50) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
    }
    drawWall();
    enemies.forEach(drawEnemy);
    for (const b of bullets) {
        ctx.save(); ctx.shadowColor = b.color; ctx.shadowBlur = 8;
        ctx.fillStyle = b.color; ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI*2); ctx.fill();
        ctx.restore();
    }
    // Supply crate
    if (crate) {
        const pulse = 0.75 + 0.25 * Math.sin(Date.now() / 180);
        const cx = crate.x, cy = crate.y, sz = 40;
        const fadeAlpha = Math.min(1, crate.life / 60);
        ctx.save();
        ctx.globalAlpha = fadeAlpha;
        ctx.shadowColor = '#f39c12'; ctx.shadowBlur = 18 * pulse;
        drawRR(cx - sz/2, cy - sz/2, sz, sz, 6, '#3a1f05', '#f39c12', 2.5);
        // X-straps
        ctx.strokeStyle = '#c07830'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(cx - sz/2 + 6, cy - sz/2 + 6); ctx.lineTo(cx + sz/2 - 6, cy + sz/2 - 6); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(cx + sz/2 - 6, cy - sz/2 + 6); ctx.lineTo(cx - sz/2 + 6, cy + sz/2 - 6); ctx.stroke();
        ctx.shadowBlur = 0;
        ctx.fillStyle = '#ffd700'; ctx.font = 'bold 18px monospace';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText('?', cx, cy);
        ctx.fillStyle = '#ffd700'; ctx.font = 'bold 8px monospace';
        ctx.fillText(t('crate_open'), cx, cy + sz/2 + 11);
        // Tier badge
        ctx.fillStyle = TIERS[crate.tier].glow; ctx.font = 'bold 8px monospace';
        ctx.fillText('T' + (crate.tier + 1), cx, cy - sz/2 - 7);
        ctx.restore();
    }

    if (!waveActive) {
        const wx = DIVIDER_X + 10, wy = H - 56, ww = LANE_W - 10, wh = 42;
        drawRR(wx, wy, ww, wh, 8, '#0a1a0a', '#2ecc71', 2);
        ctx.fillStyle = '#2ecc71'; ctx.font = 'bold 16px monospace';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(wave === 0 ? t('start_wave_1') : t('next_wave', wave+1), wx + ww/2, wy + wh/2);
    } else {
        const cfg = waveConfig(wave);
        const total = cfg.count, done = total - waveEnemiesLeft;
        ctx.fillStyle = '#1a1a2e'; ctx.fillRect(DIVIDER_X + 10, H - 22, LANE_W - 10, 12);
        ctx.fillStyle = '#2980b9'; ctx.fillRect(DIVIDER_X + 10, H - 22, (LANE_W - 10) * (done / total), 12);
        ctx.fillStyle = '#aaa'; ctx.font = '9px monospace'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(t('wave_progress', wave, done, total), DIVIDER_X + 10 + (LANE_W-10)/2, H - 16);
        ctx.fillStyle = '#555'; ctx.font = '11px monospace'; ctx.textAlign = 'right';
        ctx.fillText(t('active_enemies', enemies.length), W - 8, H - 30);
    }
}

// ── Draw particles / floats ───────────────────────────────────────────────────
function drawParticles() {
    for (const p of particles) {
        ctx.save(); ctx.globalAlpha = p.life / p.maxLife;
        ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2); ctx.fill();
        ctx.restore();
    }
}

function drawFloats() {
    for (const f of floats) {
        ctx.save(); ctx.globalAlpha = Math.min(1, f.life / 20);
        ctx.shadowColor = f.color; ctx.shadowBlur = 6;
        ctx.fillStyle = f.color; ctx.font = 'bold 14px monospace';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(f.text, f.x, f.y); ctx.restore();
    }
}

function drawAchToasts() {
    achToasts.forEach((t, i) => {
        ctx.save();
        const alpha = Math.min(1, t.life / 40);

        const tx = DIVIDER_X + 10, ty = 80 + i * 32, tw = LANE_W - 20, th = 26;

        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';

        ctx.restore();

}

// ── Tutorial (interactive spotlight) ─────────────────────────────────────────
function drawTutorial() {
    if (tutStep >= 4) return;
    const pad     = 8;
    const pulse   = 0.5 + 0.5 * Math.sin(Date.now() / 300);
    const bounce  = Math.sin(Date.now() / 400) * 5;

    // Target rects for each step (canvas coords)
    const buyTr  = { x: GRID_X, y: 88, w: COLS*(CW+4)-4, h: 28 };
    const gridTr = { x: GRID_X, y: GRID_Y, w: COLS*(CW+4)-4, h: ROWS*(CH+4)-4 };
    const waveTr = { x: DIVIDER_X+10, y: H-56, w: LANE_W-10, h: 42 };
    const trs    = [buyTr, buyTr, gridTr, waveTr];
    const hints  = [t('tut_buy_first'), t('tut_buy_second'), t('tut_merge'), t('tut_start_wave')];

    const tr   = trs[tutStep];
    const hint = hints[tutStep];

    // Expanded clear zone (target + padding)
    let ex = tr.x - pad, ew = tr.w + pad*2;
    let ey = tr.y - pad, eh = tr.h + pad*2;

    // Hint pill placement: below for steps 0-2 (targets in upper area), above for step 3 (wave btn near bottom)
    const hintBelow = tutStep < 3;
    ctx.font = 'bold 13px monospace';
    const hintPW = Math.ceil(ctx.measureText(hint).width) + 28;
    const hintPH = 28;
    let hintPY, arrowY, arrowGlyph;

    if (hintBelow) {
        arrowGlyph = '↑';
        arrowY     = ey + eh + 8 + bounce;
        hintPY     = ey + eh + 32;
        eh         = hintPY + hintPH + 6 - ey;
    } else {
        arrowGlyph = '↓';
        arrowY     = ey - 10 + bounce;
        hintPY     = ey - 44;
        const newEy = hintPY - 6;
        eh = ey + eh - newEy;
        ey = newEy;
    }

    // Dark overlay — 4 rects leaving [ex,ey,ew,eh] clear
    ctx.fillStyle = 'rgba(0,0,0,0.72)';
    if (ey > 0)        ctx.fillRect(0,     0,     W,           ey);
    if (ey+eh < H)     ctx.fillRect(0,     ey+eh, W,           H - ey - eh);
    if (ex > 0)        ctx.fillRect(0,     ey,    ex,          eh);
    if (ex+ew < W)     ctx.fillRect(ex+ew, ey,    W - ex - ew, eh);

    // Pulsing gold border on actual target
    const tx = tr.x - pad, ty = tr.y - pad, tw2 = tr.w + pad*2, th2 = tr.h + pad*2;
    ctx.save();
    ctx.shadowColor = '#f1c40f'; ctx.shadowBlur = 18 * pulse;
    drawRR(tx, ty, tw2, th2, 10, null, 'rgba(241,196,15,' + (0.55 + 0.45*pulse) + ')', 2.5);
    ctx.restore();

    // Bouncing arrow
    ctx.save();
    ctx.shadowColor = '#f1c40f'; ctx.shadowBlur = 6;
    ctx.fillStyle = '#f1c40f'; ctx.font = 'bold 20px monospace';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(arrowGlyph, ex + ew/2, arrowY);
    ctx.restore();

    // Hint pill
    const hintX = Math.max(hintPW/2 + 4, Math.min(W - hintPW/2 - 4, ex + ew/2));
    drawRR(hintX - hintPW/2, hintPY, hintPW, hintPH, 7, 'rgba(0,0,0,0.90)', '#f1c40f', 1.5);
    ctx.fillStyle = '#f1c40f'; ctx.font = 'bold 13px monospace';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(hint, hintX, hintPY + hintPH/2);

    // Progress dots at very bottom
    for (let i = 0; i < 4; i++) {
        ctx.fillStyle = i < tutStep ? '#2ecc71' : i === tutStep ? '#f1c40f' : '#333';
        ctx.beginPath(); ctx.arc(W/2 - 30 + i*20, H - 10, 4, 0, Math.PI*2); ctx.fill();
    }
}

    ctx.fillStyle = '#0a0a0f'; ctx.fillRect(0, 0, W, H);

    drawRR(12, 12, 108, 30, 6, '#1a1a2e', '#555', 1);
    ctx.fillStyle = '#aaa'; ctx.font = 'bold 13px monospace'; ctx.textAlign='center'; ctx.textBaseline='middle';

    const colW = (W - 24) / 3;
    BRANCH_ORDER.forEach((branch, bi) => {
        const bx = 12 + bi * colW;
        const bc = BRANCH_COLORS[branch];

        ctx.fillStyle = bc; ctx.font = 'bold 13px monospace'; ctx.textAlign='center';
        ctx.fillText(t('br_' + branch), bx + colW/2, 54);

        const upgInBranch = Object.entries(UPGRADE_DEFS).filter(([,d]) => d.branch === branch);
        upgInBranch.forEach(([id, def], ui) => {
            const ux = bx + 8, uy = 62 + ui * 115;

            const maxed = curLv >= def.maxLv;

            const canAfford = !maxed && saveData.cores >= cost;

            drawRR(ux, uy, uw, uh, 8,
                canAfford ? '#0d1a0d' : '#0d0d18',
                maxed ? '#f1c40f' : canAfford ? bc : '#333', 1.5);

            ctx.font = 'bold 12px monospace'; ctx.textAlign='center'; ctx.textBaseline='top';
            ctx.fillText(upgName(id), ux + uw/2, uy + 8);

            ctx.fillStyle = '#888'; ctx.font = '10px monospace';
            ctx.fillText(upgDesc(id), ux + uw/2, uy + 26);

            // Level dots
            const dotSpacing = Math.min(14, (uw - 16) / def.maxLv);
            const dotsW = def.maxLv * dotSpacing - (dotSpacing - 10);
            let dx = ux + uw/2 - dotsW/2;
            for (let lv = 0; lv < def.maxLv; lv++) {
                ctx.fillStyle = lv < curLv ? bc : '#333';

        ctx.fillText(unlocked ? '+' + a.coreReward + '◈' : '?', ax + 29, ay + 22);
    });
}

// ── Main draw ─────────────────────────────────────────────────────────────────
function draw() {
    ctx.clearRect(0, 0, W, H);
    if (STATE === 'menu')     { drawMenu(); drawAchToasts(); return; }
    if (STATE === 'upgrades') { drawUpgrades(); return; }

    ctx.fillStyle = '#0d0d18'; ctx.fillRect(0, 0, W, H);
    drawLane();
    drawGrid();
    drawParticles();
    drawHUD();
    drawAchToasts();
    drawFloats();

    if (STATE === 'tutorial')   drawTutorial();
    if (STATE === 'results')    drawResults();
    if (STATE === 'resurrect')  drawResurrect();
}

// ── Loop ──────────────────────────────────────────────────────────────────────
function loop() {
    try { update(); } catch(e) { _showGameError('update: ' + (e.message || e)); }
    try { draw();   } catch(e) { _showGameError('draw: '   + (e.message || e)); }
    requestAnimationFrame(loop);
}

// ── Startup (gate behind SDK init so LoadingAPI.ready fires before game loop) ─
let _gameStarted = false;
function _startGameLoop() {
    if (_gameStarted) return;
    _gameStarted = true;
    yadLoadingReady();
    if (!saveData.tutorialDone) {
        initGame();
        STATE = 'tutorial';
        tutStep = 0;
    } else if (window.__GF_AUTOSTART) {
        // Platform builds (Yandex/CrazyGames) inject window.__GF_AUTOSTART → drop
        // returning players STRAIGHT into a run instead of the menu landing
        // (rule #9; first-run players still get the tutorial branch above). The
        // gallery build doesn't set the flag, so it keeps its menu.
        initGame();
        STATE = 'play';
    }
    loop();
}

// Screenshot-only escape hatch — lets the take_screenshots.js puppeteer
// driver land on a populated mid-wave state without needing to chain UI
// clicks (which are flaky across viewport sizes). Safe to ship: never
// invoked during normal play, no dev-only bundle gating needed.
window._setupForScreenshot = function (waveTarget) {
    if (typeof initGame === 'function') initGame();
    STATE = 'play';
    saveData.tutorialDone = true;
    gold = 4000;
    buyCount = 0;
    // Seed grid with mixed tiers so screenshots show progression variety
    // (rag → sponge → brush → mop), not 6 identical T1 rags.
    const seedTiers = [3, 2, 3, 2, 1, 2, 0, 1, 0, 0]; // Mop, Brush, Mop, Brush, Sponge, Brush, Rag, Sponge, Rag, Rag
    for (let i = 0; i < seedTiers.length; i++) {
        const cell = emptyCell();
        if (!cell) break;
        guns.push({ col: cell.col, row: cell.row, tier: seedTiers[i], cd: 0 });
        if (seedTiers[i] > runHighestTier) runHighestTier = seedTiers[i];
    }
    wave = Math.max(1, (waveTarget | 0) || 3);
    if (typeof startWave === 'function') startWave();
};
window._setLang = function (l) { lang = (l === 'ru' ? 'ru' : 'en'); };

// Promo recording mode — boots a deterministic 18s climax scene for the
// headless capture (Shared/skills/promo-video). Never user-facing: the
// trigger is `?promo=climax` only. Shipped builds with no query string
// take the normal _startGameLoop path.
function setupPromoClimax() {
    if (typeof initGame !== 'function') return;
    initGame();
    saveData.tutorialDone = true;
    STATE = 'play';
    gold = 9999;
    buyCount = 0;
    _muted = true;
    // Seed grid: mix of low + mid tiers so early merges read visually.
    // Layout (col,row,tier): 5x4 grid (0..4 x 0..3 by default).
    var seed = [
        [0,0,0],[1,0,0],[2,0,1],[3,0,1],[4,0,2],
        [0,1,0],[1,1,0],[2,1,1],[3,1,1],[4,1,2],
        [0,2,0],[1,2,0],[2,2,1],[3,2,1],
        [0,3,0],[1,3,0]
    ];
    guns = seed.map(function (s) { return { col: s[0], row: s[1], tier: s[2], cd: 0 }; });
    wave = 4;
    // Invincibility for the promo recording — bare reassignment hits the
    // script-scope binding so other code paths calling endRun() / offerResurrect()
    // see the no-ops. Without this the wall-breached modal appears late in the
    // 18s capture and overlays gameplay frames.
    maxHp = 20; hp = 20;
    endRun = function () { hp = 20; };
    offerResurrect = function () { hp = 20; };
    var _hpPin = setInterval(function () { hp = 20; }, 16);
    setTimeout(function () { clearInterval(_hpPin); }, 18000);
    if (typeof startWave === 'function') startWave();
    // Timeline of merge / buy / wave actions. Each tries to pick the
    // first two adjacent guns of the named tier; if none exist, no-op.
    var T0 = performance.now();
    function findPair(tier) {
        var a = null;
        for (var i = 0; i < guns.length; i++) {
            if (guns[i].tier === tier) {
                if (!a) { a = guns[i]; }
                else { return [a, guns[i]]; }
            }
        }
        return null;
    }
    function doMerge(tier) {
        var pair = findPair(tier);
        if (!pair) return;
        selected = { col: pair[0].col, row: pair[0].row };
        try { tryMerge(pair[1].col, pair[1].row); } catch (e) {}
    }
    var TIMELINE = [
        [1500, function () { doMerge(0); }],
        [3000, function () { doMerge(0); }],
        [4500, function () { doMerge(1); }],
        [6000, function () { if (typeof buyGun === 'function') { gold = 9999; buyGun(); } }],
        [7500, function () { doMerge(2); }],
        [9000, function () { doMerge(0); }],
        [10500, function () { doMerge(3); }],
        [12000, function () { if (typeof buyGun === 'function') { gold = 9999; buyGun(); } }],
        [13500, function () { doMerge(1); }],
        [15000, function () { doMerge(4); }],
        [16500, function () { doMerge(2); }],
    ];
    TIMELINE.forEach(function (entry) {
        setTimeout(entry[1], entry[0]);
    });
    loop();
}
window._setupForPromo = setupPromoClimax;
try {
    var _promoQ = new URLSearchParams(location.search);
    if (_promoQ.get('promo') === 'climax') {
        setTimeout(setupPromoClimax, 50);
    }
} catch (_) {}

const _sdkTimeout = setTimeout(_startGameLoop, 3000);
try {
    if (typeof YaGames !== 'undefined' && YaGames.init) {
        YaGames.init().then(function(sdk) {
            clearTimeout(_sdkTimeout);
            ysdk = sdk; window.ysdk = sdk;
            detectLang(); // override navigator guess with SDK language
            try {
                sdk.on('game_api_pause', function() {
                    _gamePaused = true;
                    _prePauseMuted = _muted; _muted = true;
                });
                sdk.on('game_api_resume', function() {
                    _gamePaused = false;
                    _muted = _prePauseMuted;
                });
            } catch(e) {}
            _startGameLoop();
        }).catch(function() {
            clearTimeout(_sdkTimeout);
            _startGameLoop();
        });
    } else {
        clearTimeout(_sdkTimeout);
        _startGameLoop();
    }
} catch(e) {
    clearTimeout(_sdkTimeout);
    _startGameLoop();
}
</script>
