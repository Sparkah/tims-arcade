<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Merge Defense</title>
<script src="/sdk.js"></script>
<style>
  :root{ --bg:#0e0f14; --panel:#171a22; --line:#2a2f3c; --ink:#e9edf5; --soft:#9aa3b5; --gold:#ffd86b; --grn:#5fd08a; --red:#ff5d6c; --blue:#6fb3ff; --purp:#c77dff; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; -webkit-user-select:none; user-select:none; }
  html,body{ margin:0; height:100%; background:var(--bg); color:var(--ink); font-family:-apple-system,system-ui,Segoe UI,Roboto,sans-serif; overflow:hidden; position:fixed; width:100%; touch-action:none; overscroll-behavior:none; }
  *::-webkit-scrollbar{ display:none; } *{ scrollbar-width:none; }
  #app{ height:100%; display:flex; flex-direction:column; align-items:center; }
  #wrap{ width:100%; max-width:460px; margin:0 auto; padding:8px; display:flex; flex-direction:column; height:100%; }
  .hud{ display:flex; gap:6px; align-items:center; font-size:13px; margin-bottom:4px; }
  .hp{ flex:1; height:16px; background:#2a1419; border:1px solid var(--line); border-radius:8px; overflow:hidden; position:relative; }
  .hp i{ display:block; height:100%; background:linear-gradient(90deg,#ff5d6c,#ff8a5c); width:100%; transition:width .15s; }
  .hp span{ position:absolute; inset:0; text-align:center; font-size:10px; line-height:16px; color:#fff; }
  .chip{ background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:4px 7px; font-weight:600; white-space:nowrap; }
  .chip.cores{ color:var(--gold); } .chip.wave{ color:var(--soft); } .chip.star{ color:var(--purp); }
  .forge{ font-size:11px; color:var(--blue); text-align:center; margin-bottom:6px; min-height:14px; line-height:1.35; }
  canvas#cv{ display:block; width:100%; flex:1; min-height:0; background:#0a0b0f; border:1px solid var(--line); border-radius:12px; touch-action:none; }
  .row{ display:flex; gap:6px; margin-top:8px; }
  .btn{ flex:1; background:var(--panel); border:1px solid var(--line); color:var(--ink); border-radius:10px; padding:11px 6px; font-size:13px; font-weight:600; cursor:pointer; text-align:center; }
  .btn.go{ background:#1f3a2a; border-color:var(--grn); color:var(--grn); }
  .btn.buy{ color:var(--gold); } .btn.work{ color:var(--blue); } .btn.inv{ color:var(--purp); }
  .btn:disabled{ opacity:.4; }
  .btn small{ display:block; font-size:9px; font-weight:400; opacity:.7; margin-top:1px; }
  .mini{ flex:0 0 auto; font-size:13px; padding:11px 12px; color:var(--soft); }
  .hint{ font-size:11px; color:var(--soft); margin-top:6px; text-align:center; line-height:1.45; min-height:30px; }

  /* ---- overlays (menu / tutorial / panels) ---- */
  .ov{ position:fixed; inset:0; background:rgba(6,8,12,.94); display:none; flex-direction:column; align-items:center; justify-content:center; padding:18px; z-index:6; }
  .ov.open{ display:flex; }
  .card{ background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:16px; width:100%; max-width:400px; max-height:88%; overflow-y:auto; }
  .card h2{ margin:0 0 4px; font-size:18px; } .card .sub{ color:var(--soft); font-size:12px; margin:0 0 14px; }
  .up{ display:flex; align-items:center; gap:10px; padding:9px; border:1px solid var(--line); border-radius:10px; margin-bottom:7px; }
  .up .em{ font-size:22px; width:26px; text-align:center; } .up .info{ flex:1; min-width:0; } .up .info b{ font-size:13px; } .up .info small{ display:block; color:var(--soft); font-size:11px; line-height:1.3; }
  .up button{ background:#3a3320; border:1px solid var(--gold); color:var(--gold); border-radius:8px; padding:8px 9px; font-size:12px; font-weight:600; cursor:pointer; white-space:nowrap; }
  .up button:disabled{ opacity:.4; }
  .up button.rv{ background:#13202e; border-color:var(--blue); color:var(--blue); }
  .up button.danger{ background:#2a1419; border-color:var(--red); color:var(--red); }

  /* ---- start menu ---- */
  #menu{ background:radial-gradient(120% 80% at 50% 18%, #14213a 0%, #0a0d16 60%, #07080d 100%); }
  #menu .logo{ font-size:clamp(34px,9vw,58px); font-weight:800; letter-spacing:-1px; text-align:center; line-height:1; text-shadow:0 0 30px rgba(111,179,255,.45); }
  #menu .logo b{ color:var(--gold); }
  #menu .tag{ color:var(--soft); font-size:14px; text-align:center; margin:8px 0 4px; }
  #playBtn{ margin:30px auto 0; width:min(86%,300px); padding:20px; border:none; border-radius:18px; font-size:23px; font-weight:800; letter-spacing:.5px; color:#06210f; cursor:pointer;
    background:linear-gradient(180deg,#7df0a8,#23c46a); box-shadow:0 10px 30px -6px rgba(45,224,122,.6), inset 0 1px 0 rgba(255,255,255,.4); animation:pulse 1.6s ease-in-out infinite; }
  @keyframes pulse{ 0%,100%{ transform:scale(1); box-shadow:0 10px 30px -6px rgba(45,224,122,.55); } 50%{ transform:scale(1.045); box-shadow:0 16px 40px -4px rgba(45,224,122,.8); } }
  #menu .menurow{ display:flex; gap:8px; margin-top:14px; width:min(86%,300px); }
  #menu .menurow button{ flex:1; background:var(--panel); border:1px solid var(--line); color:var(--soft); border-radius:10px; padding:11px; font-size:13px; font-weight:600; cursor:pointer; }
  #menu .comeback{ color:var(--grn); font-size:13px; text-align:center; margin-top:16px; min-height:18px; }
  #menu .rvbtn{ display:block; margin:10px auto 0; background:#13202e; border:1px solid var(--blue); color:var(--blue); border-radius:10px; padding:9px 18px; font-size:13px; font-weight:600; cursor:pointer; }
  @media (prefers-reduced-motion: reduce){ #playBtn{ animation:none; } }

  .tuts{ font-size:13px; line-height:1.5; }
  .tuts p{ margin:0 0 9px; } .tuts b{ color:var(--gold); }
  .tabbar{ display:flex; gap:6px; margin-bottom:10px; }
  .tabbar button{ flex:1; background:#11141c; border:1px solid var(--line); color:var(--soft); border-radius:8px; padding:8px; font-size:12px; font-weight:600; cursor:pointer; }
  .tabbar button.on{ color:var(--ink); border-color:var(--blue); background:#13202e; }
  .chipgrid{ display:grid; grid-template-columns:repeat(4,1fr); gap:7px; }
  .chipcell{ aspect-ratio:1; border:1px solid var(--line); border-radius:10px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; font-size:11px; cursor:pointer; position:relative; background:#10131b; }
  .chipcell.sel{ border-color:var(--gold); box-shadow:0 0 0 1px var(--gold); }
  .chipcell .ce{ font-size:20px; } .chipcell .ct{ font-size:9px; color:var(--soft); }
  .chipcell.empty{ opacity:.5; cursor:default; }
  .slotrow{ display:flex; gap:7px; justify-content:center; margin:4px 0 12px; }
  .slot{ width:54px; height:54px; border:1px dashed var(--line); border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:22px; cursor:pointer; background:#0e1119; position:relative; }
  .slot.lock{ opacity:.4; font-size:13px; }
  .slot .rm{ position:absolute; top:-6px; right:-6px; background:var(--red); color:#fff; width:18px; height:18px; border-radius:50%; font-size:12px; line-height:18px; text-align:center; }

  #toast{ position:fixed; left:50%; bottom:80px; transform:translateX(-50%); background:#0c120e; border:1px solid var(--gold); color:var(--gold); padding:10px 16px; border-radius:10px; font-size:13px; font-weight:600; opacity:0; pointer-events:none; transition:opacity .3s; z-index:9; text-align:center; max-width:90%; }
  #toast.show{ opacity:1; }
  .close{ margin-top:6px; }
</style>
</head>
<body>
<div id="app"><div id="wrap">
  <div class="hud">
    <button class="chip" id="menuBtn" style="cursor:pointer" aria-label="Menu">☰</button>
    <div class="hp"><i id="hpbar"></i><span id="hptext">100</span></div>
    <div class="chip wave" id="waveChip">W1</div>
    <div class="chip star" id="starChip" style="display:none">★0</div>
    <div class="chip cores" id="coresChip">◈ 0</div>
    <button class="chip" id="muteBtn" style="cursor:pointer" aria-label="Sound">♪</button>
    <button class="chip" id="helpBtn" style="cursor:pointer" aria-label="Help">?</button>
  </div>
  <div class="forge" id="forge"></div>
  <canvas id="cv" width="440" height="560"></canvas>
  <div class="row">
    <button class="btn go" id="waveBtn">▶</button>
    <button class="btn buy" id="gunBtn">+</button>
    <button class="btn inv" id="invBtn">🎛</button>
    <button class="btn work" id="workBtn">⚙</button>
  </div>
  <div class="hint" id="hint"></div>
</div></div>

<!-- START MENU (big animated PLAY) -->
<div id="menu" class="ov open">
  <div class="logo">MERGE<br><b>DEFENSE</b></div>
  <div class="tag" id="menuTag"></div>
  <button id="playBtn"></button>
  <div class="menurow">
    <button id="menuHelp"></button>
    <button id="menuLang">RU</button>
  </div>
  <div class="comeback" id="comeback"></div>
</div>

<!-- TUTORIAL -->
<div id="tut" class="ov">
  <div class="card">
    <h2 id="tutTitle"></h2>
    <div class="tuts" id="tutBody"></div>
    <button class="btn close" id="tutClose"></button>
  </div>
</div>

<!-- UPGRADES -->
<div id="work" class="ov">
  <div class="card">
    <h2 id="workTitle"></h2>
    <p class="sub" id="workSub"></p>
    <div id="upgrades"></div>
    <button class="btn close" id="closeWork"></button>
  </div>
</div>

<!-- INVENTORY (merge-able chips + loadout) -->
<div id="inv" class="ov">
  <div class="card">
    <h2 id="invTitle"></h2>
    <p class="sub" id="invSub"></p>
    <div class="slotrow" id="slotRow"></div>
    <div class="chipgrid" id="chipGrid"></div>
    <button class="btn close" id="closeInv"></button>
  </div>
</div>

<!-- PRESTIGE / ASCEND -->
<div id="asc" class="ov">
  <div class="card">
    <h2 id="ascTitle"></h2>
    <p class="sub" id="ascSub"></p>
    <div id="ascBody" class="tuts"></div>
    <div class="row" style="margin-top:4px">
      <button class="btn go" id="ascDo"></button>
      <button class="btn" id="ascClose"></button>
    </div>
  </div>
</div>

<div id="toast"></div>

// ---- platform / SDK layer (hand-rolled, standalone-safe) -------------------
var YA = null, PLAYER = null, READY_SENT = false;
function sdkReady(){ try{ if(YA && YA.features && YA.features.LoadingAPI && !READY_SENT){ YA.features.LoadingAPI.ready(); READY_SENT=true; } }catch(e){} }
function initSDK(cb){
  if (typeof YaGames === 'undefined'){ cb(); return; }
  YaGames.init().then(function(sdk){
    YA = sdk;
    // Yandex platform pause signal (§1.3/§4.7): fires on ad overlay, tab switch,
    // purchase dialog, minimize. Suspend ALL audio on pause, restore on resume.
    try{ if(sdk.on){ sdk.on('game_api_pause', platformPause); sdk.on('game_api_resume', platformResume); } }catch(e){}
    try{ var l = sdk.environment.i18n.lang; if(l) LANG = (l.indexOf('ru')===0)?'ru':'en'; }catch(e){}
    return sdk.getPlayer({ scopes:false }).then(function(p){ PLAYER=p; }).catch(function(){ PLAYER=null; });
  }).then(function(){ cb(); }).catch(function(){ cb(); });
}
var _lastCloud=0;
function cloudSave(obj){ if(!PLAYER) return; var n=Date.now(); if(n-_lastCloud<20000) return; _lastCloud=n; try{ PLAYER.setData({ mdsave:obj }, true).catch(function(){}); }catch(e){} }
function cloudLoad(cb){
  if(PLAYER){ PLAYER.getData(['mdsave']).then(function(d){ cb(d && d.mdsave ? d.mdsave : null); }).catch(function(){ cb(null); }); }
  else cb(null);
}
var _adBusy=false;
function showRewarded(onReward){
  // Single settle path (Yandex §4.5/1.14/§4.7): audio pauses on open, ALWAYS resumes
  // on any terminal path, the game never freezes, and a concurrent call is ignored.
  // Reward is credited on a watched video (onRewarded -> onClose) OR a true no-fill
  // (ad never opened) so the button is never dead; an opened-then-error or closed-early
  // ad grants NOTHING. A 180s backstop guarantees audio returns even if the SDK goes silent.
  if(_adBusy) return;
  var settled=false, opened=false, rewarded=false, wd, maxwd;
  function finish(give){ if(settled) return; settled=true; _adBusy=false; clearTimeout(wd); clearTimeout(maxwd); adAudioResume(); syncGameplay(); if(give) onReward(); }
  if(YA && YA.adv){
    _adBusy=true; gameplayStop();
    wd=setTimeout(function(){ if(!opened) finish(true); }, 4000);                          // no-fill: ad never opened -> grant + bail
    try{
      YA.adv.showRewardedVideo({ callbacks:{
        onOpen:function(){ opened=true; clearTimeout(wd); adAudioPause();                  // §4.7: silence the game while the ad is visible
          maxwd=setTimeout(function(){ finish(rewarded); }, 180000); },                    // backstop: SDK went silent after open
        onRewarded:function(){ rewarded=true; },                                           // credited on close (fully watched)
        onClose:function(){ finish(rewarded); },                                           // §4.7: restore audio; grant only if rewarded
        onError:function(){ finish(!opened); }                                             // no-fill -> grant; errored mid-watch -> no reward
      }});
    }catch(e){ finish(true); }
  } else onReward();                                                                        // standalone (no SDK): grant
}
function gameplayStart(){ try{ if(YA && YA.features && YA.features.GameplayAPI) YA.features.GameplayAPI.start(); }catch(e){} }
function gameplayStop(){ try{ if(YA && YA.features && YA.features.GameplayAPI) YA.features.GameplayAPI.stop(); }catch(e){} }
// GameplayAPI should be "started" only while actively in the PLAY screen with no
// overlay open and the tab visible; menus/panels/ads/hidden-tab = stopped.
var _gpOn=false;
function anyOverlayOpen(){ return ['menu','tut','work','inv','asc'].some(function(id){ var e=$(id); return e && e.classList.contains('open'); }); }
function syncGameplay(){ var on = (gs==='PLAY' && !anyOverlayOpen() && !document.hidden); if(on===_gpOn) return; _gpOn=on; if(on) gameplayStart(); else gameplayStop(); }

function t(k){ var s=(STR[LANG]&&STR[LANG][k]); return s==null?(STR.en[k]||k):s; }
// sequential formatter: each %x token in the string is filled by the next arg in order
function fmt(k){ var s=t(k), i=1, a=arguments; return s.replace(/%\w/g, function(){ return (a[i]!=null?a[i++]:''); }); }

// ---- elements --------------------------------------------------------------
var $=function(id){ return document.getElementById(id); };
var cv=$('cv'), g=cv.getContext('2d');

function toast(m){ var el=$('toast'); el.textContent=m; el.classList.add('show'); clearTimeout(el._x); el._x=setTimeout(function(){ el.classList.remove('show'); },2800); }

// ---- design constants ------------------------------------------------------
var COLS=5;
var TIER=['','🔫','🔫','🛡️','💥','🚀','⚡','☄️','🌟','👑'];
var TCOL=['','#6b7280','#7c9cc4','#5fa8d3','#c77dff','#ff8a5c','#ffd86b','#ff5d6c','#fff','#ffe9a8'];
var MAXTIER=TIER.length-1;
var AFFIX=['dmg','crit','splash','idle','gold'];
var AFEMOJI={dmg:'⚔️',crit:'🎯',splash:'💢',idle:'🌙',gold:'💰'};
var ACOL=['#6b7280','#6b7280','#5fa8d3','#c77dff','#ffd86b','#ff9a3c']; // chip tier color (idx by tier 1..5)
// per-chip-tier affix magnitude (%): scales with chip tier
function chipVal(af,tier){ var base={dmg:8,crit:4,splash:12,idle:15,gold:10}[af]||8; return base*tier; }

// ---- persistent state ------------------------------------------------------
var SAVEKEY='mergeDefense.v5';
var M = fresh();
function fresh(){
  var grid=[]; for(var i=0;i<COLS*4;i++) grid.push(0); for(var k=0;k<4;k++) grid[k]=1;
  return { v:5, grid:grid, rows:4, cores:30, wave:0, bestWave:0, stars:0,
    dmgLv:0, forgeLv:0, autoLv:0, idleLv:0, critLv:0, boardLv:0, slotLv:0,
    chips:[], equip:[], // equip: array of chip-objects equipped (length<=slots)
    lastGunGen:now(), lastVisit:now(), lastDaily:'', streak:0, seenTut:false, autoOn:true, savedAt:0, muted:false };
}
function now(){ return Date.now(); }
function load(){
  try{ var j=JSON.parse(localStorage.getItem(SAVEKEY)); if(j&&Array.isArray(j.grid)) return migrate(j); }catch(e){}
  return fresh();
}
function migrate(j){
  var f=fresh();
  for(var key in f){ if(j[key]===undefined) j[key]=f[key]; }
  if(j.rows && j.grid.length < COLS*j.rows){ while(j.grid.length<COLS*j.rows) j.grid.push(0); }
  if(!Array.isArray(j.chips)) j.chips=[]; if(!Array.isArray(j.equip)) j.equip=[];
  return j;
}
function save(){ M.savedAt=now(); try{ localStorage.setItem(SAVEKEY, JSON.stringify(M)); }catch(e){} cloudSave(M); }
function N(){ return COLS*M.rows; }

// ---- derived stats ---------------------------------------------------------
function prestigeMult(){ return 1 + M.stars*0.05; }
function equipSum(af){ var s=0; for(var i=0;i<M.equip.length;i++){ var c=M.equip[i]; if(c&&c.af===af) s+=chipVal(af,c.tier); } return s; }
function dmgMult(){ return (1 + M.dmgLv*0.18) * (1 + equipSum('dmg')/100) * prestigeMult(); }
function idleMult(){ return (1 + M.idleLv*0.20) * (1 + equipSum('idle')/100) * prestigeMult(); }
function goldMult(){ return (1 + equipSum('gold')/100) * prestigeMult(); }
function critChance(){ return Math.min(0.6, (M.critLv>0? 0.05+equipSum('crit')/100 : equipSum('crit')/100)); }
function critMult(){ return 1.6 + M.critLv*0.25; }
function splashFrac(){ return equipSum('splash')/100; }
function upCost(lv,base){ return Math.round(base*Math.pow(1.7,lv)); }
function slots(){ return 2 + M.slotLv; }
function gunDps(tt){ var d=4*Math.pow(tt,1.7)*dmgMult(); return d; }
function totalDps(){ var d=0; for(var i=0;i<M.grid.length;i++){ if(M.grid[i]>0) d+=gunDps(M.grid[i]); } return d; }

// forge
function hoursPerGun(){ return Math.max(0.7, 1.5 - M.forgeLv*0.15); }
function forgeCap(){ return 6 + M.forgeLv*2; }
function gunsReadyNow(){ return Math.min(forgeCap(), Math.floor((now()-M.lastGunGen)/3.6e6 / hoursPerGun())); }
function hoursToNextGun(){ var per=hoursPerGun(); var el=(now()-M.lastGunGen)/3.6e6; return Math.max(0, per-(el%per)); }
// auto-merger
function autoInterval(){ return Math.max(2, 6 - (M.autoLv-1)*0.8); }
function autoCap(){ return Math.min(MAXTIER-1, 2 + M.autoLv); }
// idle
var IDLE_INTERVAL=0.8, IDLE_SPD=48;
function idleHp(){ return 15 + M.wave*2.5; }
function idleReward(){ return Math.max(1, Math.round((1 + Math.floor(M.wave/3)) * goldMult() * idleMult())); }

// ---- grid helpers ----------------------------------------------------------
function emptyCells(){ var e=[]; for(var i=0;i<N();i++){ if(M.grid[i]===0) e.push(i); } return e; }
function placeGun(tier){ var e=emptyCells(); if(!e.length) return false; M.grid[e[(Math.random()*e.length)|0]]=tier; return true; }
function collectForge(silent){
  var ready=gunsReadyNow(); if(ready<=0) return 0;
  var per=hoursPerGun(), placed=0;
  while(placed<ready && emptyCells().length){ placeGun(1); placed++; }
  if(placed>=ready) M.lastGunGen=now(); else M.lastGunGen += placed*per*3.6e6;
  if(placed>0){ save(); if(!silent) toast(fmt('forge_ready', placed, placed>1?'s':'')); }
  return placed;
}

// ---- chips -----------------------------------------------------------------
function rollChip(maxTier){ var af=AFFIX[(Math.random()*AFFIX.length)|0]; var tier=1+ (Math.random()< (maxTier>1?0.25:0) ?1:0); if(tier>5)tier=5; return {af:af,tier:tier}; }
function addChip(c){ if(M.chips.length>=24) M.chips.shift(); M.chips.push(c); save(); }
function chipDropChance(){ return 0.10; }

// ---- combat state (transient; arsenal never wiped) -------------------------
var sel=-1, hp=100, enemies=[], bullets=[], inWave=false, spawnLeft=0, spawnT=0, attacking=0, isBoss=false, boss=null;
var idleT=0, saveT=4, dirty=false, autoT=0, gs='MENU', sparks=[];
var GRID_TOP=0, CELL=0, ROW_H=76, LINE_Y=0;
function layout(){ ROW_H=Math.min(76, Math.floor((H*0.5)/M.rows)); GRID_TOP=H-M.rows*ROW_H-6; CELL=Math.floor((W-12)/COLS); LINE_Y=GRID_TOP-6; }

// ---- merge interaction -----------------------------------------------------
function cellAt(px,py){ if(py<GRID_TOP) return -1; var c=Math.floor((px-6)/CELL), r=Math.floor((py-GRID_TOP)/ROW_H); if(c<0||c>=COLS||r<0||r>=M.rows) return -1; return r*COLS+c; }
cv.addEventListener('pointerdown', function(e){
  if(e.cancelable) e.preventDefault();   // belt-and-braces long-press / right-click guard (CSS alone is weak on iOS)
  if(gs!=='PLAY') return;
  var rect=cv.getBoundingClientRect();
  var px=(e.clientX-rect.left)*(W/rect.width), py=(e.clientY-rect.top)*(H/rect.height);
  var i=cellAt(px,py); if(i<0) return;
  if(sel===-1){ if(M.grid[i]>0) sel=i; return; }
  if(i===sel){ sel=-1; return; }
  if(M.grid[i]===0){ M.grid[i]=M.grid[sel]; M.grid[sel]=0; sel=-1; save(); }
  else if(M.grid[i]===M.grid[sel] && M.grid[i]<MAXTIER){ M.grid[i]++; M.grid[sel]=0; sel=-1; sfx('merge'); spark(i); save(); collectForge(true); }
  else { var tmp=M.grid[i]; M.grid[i]=M.grid[sel]; M.grid[sel]=tmp; sel=-1; save(); }
});

// ---- waves -----------------------------------------------------------------
function startWave(){
  if(inWave||gs!=='PLAY') return;
  attacking=M.wave+1; isBoss=(attacking%5===0);
  inWave=true; hp=100; enemies=[]; bullets=[]; boss=null;
  spawnLeft= isBoss?1:(4+attacking*2); spawnT=0;
  syncButtons();
}
function spawnEnemy(){ var ehp=18*Math.pow(1.22,attacking); enemies.push({x:6+Math.random()*(W-40),y:-20,hp:ehp,max:ehp,spd:18+attacking*1.6,kind:'wave'}); }
function spawnBoss(){ var ehp=18*Math.pow(1.22,attacking)*8; boss={x:W/2,y:-30,hp:ehp,max:ehp,spd:9+attacking*0.6,kind:'boss'}; enemies.push(boss); sfx('boss'); shake=Math.min(8,shake+3); }
function waveClear(){
  inWave=false; enemies=[]; bullets=[]; boss=null; M.wave=attacking; if(attacking>M.bestWave) M.bestWave=attacking;
  var bonus=Math.round((10+attacking*4)*(isBoss?2:1)*goldMult()); M.cores+=bonus;
  sfx('clear');
  if(isBoss){ addChip(rollChip(Math.min(5,1+Math.floor(attacking/10)))); sfx('chip'); toast(fmt('boss_clear', bonus)); }
  else { if(Math.random()<chipDropChance()){ addChip(rollChip(Math.min(5,1+Math.floor(attacking/15)))); sfx('chip'); setTimeout(function(){ toast(t('chip_drop')); },900); } toast(fmt('wave_clear', attacking, bonus)); }
  save(); syncButtons();
}
function waveFailed(){ inWave=false; enemies=[]; bullets=[]; boss=null; toast(t('wave_held')); save(); syncButtons(); }

// ---- main loop -------------------------------------------------------------
var last=performance.now();
// ---- audio: one shared context, synth SFX + procedural background music ------
var AC=null, mGain=null, sGain=null, muGain=null, _fireT=0, _mStep=0, _mNext=0, _adPaused=false, _platPaused=false;
function audioInit(){ if(AC) return; try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return; }
  mGain=AC.createGain(); mGain.gain.value=M.muted?0:0.6; mGain.connect(AC.destination);
  sGain=AC.createGain(); sGain.gain.value=0.55; sGain.connect(mGain);
  muGain=AC.createGain(); muGain.gain.value=0.30; muGain.connect(mGain); _mNext=AC.currentTime+0.1; }
// ---- central audio lifecycle gate (Yandex §1.3 + §4.7) ----------------------
// ALL game sound runs ONLY when: an AC exists, the player hasn't muted, the tab is
// visible, NO fullscreen ad is on screen, and the platform hasn't paused us. Every
// tone/sfx/music checks _audioBlocked(); the gate suspends/resumes the AudioContext.
// The 537866 rejection was audio playing under a rewarded ad - this makes that
// impossible from BOTH the ad callbacks AND the platform game_api_pause signal.
function _audioBlocked(){ return !AC || M.muted || _adPaused || _platPaused; }
function audioWantOn(){ return !!AC && !M.muted && !document.hidden && !_adPaused && !_platPaused; }
function applyAudioGate(){ try{ if(!AC) return; var pr; if(audioWantOn()){ if(AC.state==='suspended') pr=AC.resume(); } else if(AC.state==='running'){ pr=AC.suspend(); } if(pr&&pr.catch) pr.catch(function(){}); }catch(e){} if(AC) _mNext=AC.currentTime+0.05; }
function audioResume(){ applyAudioGate(); }                 // first-gesture / tab-refocus
function adAudioPause(){ _adPaused=true; applyAudioGate(); }     // ad onOpen
function adAudioResume(){ _adPaused=false; applyAudioGate(); }   // ad onClose / onError
function platformPause(){ _platPaused=true; applyAudioGate(); }  // Yandex game_api_pause
function platformResume(){ _platPaused=false; applyAudioGate(); }// Yandex game_api_resume
function tone(freq,dur,type,vol,bus){ if(_audioBlocked()) return; try{ var o=AC.createOscillator(),g2=AC.createGain(); o.type=type||'sine'; o.frequency.value=freq; o.connect(g2); g2.connect(bus||sGain); var n=AC.currentTime; g2.gain.setValueAtTime(0.0001,n); g2.gain.linearRampToValueAtTime(vol||0.25,n+0.012); g2.gain.exponentialRampToValueAtTime(0.0006,n+dur); o.start(n); o.stop(n+dur+0.03);}catch(e){} }
// short two-osc blip with a sweep - richer than a single tone (used for accents)
function blip(f1,f2,dur,type,vol,bus){ if(_audioBlocked()) return; try{ var o=AC.createOscillator(),g2=AC.createGain(); o.type=type||'sine'; o.connect(g2); g2.connect(bus||sGain); var n=AC.currentTime; o.frequency.setValueAtTime(f1,n); o.frequency.exponentialRampToValueAtTime(Math.max(40,f2),n+dur); g2.gain.setValueAtTime(0.0001,n); g2.gain.linearRampToValueAtTime(vol||0.2,n+0.01); g2.gain.exponentialRampToValueAtTime(0.0006,n+dur); o.start(n); o.stop(n+dur+0.03);}catch(e){} }
function sfx(name){ if(_audioBlocked()) return;
  if(name==='merge'){ tone(523,0.10,'triangle',0.26); tone(784,0.14,'sine',0.17); tone(1047,0.20,'sine',0.10); }   // rising fifth + octave sparkle
  else if(name==='chip'){ tone(880,0.09,'sine',0.22); tone(1320,0.13,'sine',0.14); tone(1760,0.10,'sine',0.07); }
  else if(name==='kill'){ blip(220,90,0.09,'square',0.06); }
  else if(name==='clear'){ [523,659,784,1047,1319].forEach(function(f,i){ setTimeout(function(){tone(f,0.22,'triangle',0.24);}, i*65); }); }
  else if(name==='boss'){ tone(58,0.75,'sawtooth',0.28); tone(92,0.55,'square',0.12); tone(46,0.85,'sine',0.18); blip(300,70,0.5,'sawtooth',0.10); }   // menacing detuned layers + downward sweep
  else if(name==='ascend'){ [262,330,392,523,659,784,1047,1319].forEach(function(f,i){ setTimeout(function(){tone(f,0.36,'triangle',0.28); if(i>3) tone(f*2,0.2,'sine',0.06);}, i*82); }); }
  else if(name==='buy'){ tone(660,0.08,'square',0.16); tone(990,0.06,'sine',0.09); }
  else if(name==='error'){ blip(180,120,0.18,'sawtooth',0.16); }
  else if(name==='daily'){ tone(784,0.12,'triangle',0.26); tone(1175,0.18,'sine',0.16); tone(1568,0.12,'sine',0.08); } }
function fireSound(power){ if(_audioBlocked()) return; var n=AC.currentTime; if(n-_fireT<0.07) return; _fireT=n; tone(140+power*120+Math.random()*40, 0.05+power*0.04, 'sawtooth', 0.03+power*0.06); }
// layered background loop (Am-F-C-G): plucked sub-bass + sustained pad + moving
// arp + an occasional sparkle lead. Warmer and fuller than a bare arp.
var MPROG=[[220,261.63,329.63],[174.61,220,261.63],[261.63,329.63,392],[196,246.94,293.66]];
function scheduleMusic(){ if(_audioBlocked()||gs!=='PLAY') return; var spb=60/96, sps=spb/2;
  while(_mNext < AC.currentTime + 0.3){ var ch=MPROG[(_mStep>>3)%MPROG.length], beat=_mStep%8;
    if(beat===0||beat===4) tone(ch[0]/2, sps*1.9, 'triangle', 0.16, muGain);                 // sub-bass pluck on the strong beats
    if(beat===0) ch.forEach(function(f){ tone(f, spb*4*0.92, 'sine', 0.026, muGain); });      // sustained pad chord per bar
    tone(ch[beat%3]*2, sps*0.82, 'sine', 0.05, muGain);                                        // arp line
    if(beat===6 && ((_mStep>>3)&1)) tone(ch[2]*4, sps*0.7, 'triangle', 0.032, muGain);         // sparkle lead every other bar
    _mNext+=sps; _mStep++; } }
function setMuted(m){ M.muted=m; save(); if(mGain&&AC){ try{ mGain.gain.setTargetAtTime(m?0:0.6, AC.currentTime, 0.02); }catch(e){} } var b=$('muteBtn'); if(b){ b.style.opacity=m?0.4:1; b.textContent=m?'♪✕':'♪'; } applyAudioGate(); }
// firepower 0..1 from the strongest tower → scales combat intensity (light->violent)
function firePower(){ var mx=0; for(var i=0;i<M.grid.length;i++){ if(M.grid[i]>mx) mx=M.grid[i]; } return Math.min(1,Math.max(0,(mx-1)/(MAXTIER-1))); }
var _fp=0, shake=0;
function spark(i){ var c=i%COLS, r=(i/COLS|0); var x=6+c*CELL+CELL/2, y=GRID_TOP+r*ROW_H+ROW_H/2; for(var k=0;k<8;k++){ sparks.push({x:x,y:y,vx:(Math.random()-.5)*120,vy:(Math.random()-.5)*120,life:.5}); } }

function autoMerge(){
  if(M.autoLv<=0 || !M.autoOn) return;
  var cap=autoCap();
  // find the lowest tier that has a mergeable pair (<= cap)
  for(var tt=1; tt<=cap; tt++){
    var idx=[]; for(var i=0;i<N();i++){ if(M.grid[i]===tt) idx.push(i); if(idx.length===2) break; }
    if(idx.length===2){ M.grid[idx[1]]++; M.grid[idx[0]]=0; spark(idx[1]); sfx('merge'); save(); collectForge(true); return; }
  }
}

function tick(nowt){
  var dt=Math.min(.05,(nowt-last)/1000); last=nowt;
  if(gs==='PLAY'){
    if(_ssMode){ _ssFrame(); requestAnimationFrame(tick); return; }   // promo-capture: hold a lively frame, skip combat logic
    // spawn
    if(inWave){ if(isBoss){ if(!boss && spawnLeft>0){ spawnBoss(); spawnLeft=0; } }
      else { spawnT-=dt; if(spawnLeft>0 && spawnT<=0){ spawnEnemy(); spawnLeft--; spawnT=Math.max(.35,1.4-attacking*0.04); } } }
    else { idleT-=dt; if(idleT<=0){ spawnIdle(); idleT=IDLE_INTERVAL; } }
    // auto-merger
    if(M.autoLv>0 && M.autoOn){ autoT-=dt; if(autoT<=0){ autoMerge(); autoT=autoInterval(); } }

    for(var e=0;e<enemies.length;e++) enemies[e].y+=enemies[e].spd*dt;

    _fp=firePower();
    var tdps=totalDps();
    if(enemies.length && tdps>0){
      var front=enemies[0]; for(var q=0;q<enemies.length;q++){ if(enemies[q].y>front.y) front=enemies[q]; }
      var dmg=tdps*dt; if(Math.random()<critChance()) dmg*=critMult();
      front.hp-=dmg;
      // splash
      var sf=splashFrac(); if(sf>0){ for(var s2=0;s2<enemies.length;s2++){ var en2=enemies[s2]; if(en2!==front && Math.abs(en2.x-front.x)<60 && Math.abs(en2.y-front.y)<70) en2.hp-=dmg*sf; } }
      // beams: sparse + soft when weak, dense when powerful (firePower-scaled)
      if(Math.random() < (0.22+0.5*_fp)){ var gi=[]; for(var gg=0;gg<N();gg++){ if(M.grid[gg]>0) gi.push(gg); } if(gi.length){ var gidx=gi[(Math.random()*gi.length)|0]; bullets.push({x:6+(gidx%COLS)*CELL+CELL/2,y:GRID_TOP+((gidx/COLS|0))*ROW_H+ROW_H*0.5,tx:front.x,ty:front.y,life:.12}); fireSound(_fp); } }
      var dead=[]; for(var d2=0;d2<enemies.length;d2++){ if(enemies[d2].hp<=0) dead.push(enemies[d2]); }
      for(var dd=0;dd<dead.length;dd++){ var en=dead[dd];
        if(en.kind==='idle'){ M.cores+=idleReward(); dirty=true; }
        else { M.cores+=Math.max(1,Math.round((en.kind==='boss'?20:1)*goldMult())); sfx('kill'); if(_fp>0.45) shake=Math.min(8, shake+(en.kind==='boss'?6:1.6)*_fp); }
      }
      if(dead.length){ enemies=enemies.filter(function(x){ return dead.indexOf(x)<0; }); if(boss && dead.indexOf(boss)>=0) boss=null; }
    }
    // breaches
    if(inWave){ var thr=enemies.filter(function(x){ return (x.kind==='wave'||x.kind==='boss') && x.y>=LINE_Y; });
      if(thr.length){ hp-= (isBoss?40:12)*thr.length; enemies=enemies.filter(function(x){ return !((x.kind==='wave'||x.kind==='boss')&&x.y>=LINE_Y); }); if(boss&&thr.indexOf(boss)>=0)boss=null; if(hp<=0){ hp=0; waveFailed(); } } }
    enemies=enemies.filter(function(x){ return !(x.kind==='idle' && x.y>=LINE_Y+8); });
    if(inWave && spawnLeft===0 && enemies.filter(function(x){return x.kind==='wave'||x.kind==='boss';}).length===0 && !boss) waveClear();

    for(var b=0;b<bullets.length;b++) bullets[b].life-=dt; bullets=bullets.filter(function(x){ return x.life>0; });
    for(var sp=0;sp<sparks.length;sp++){ sparks[sp].x+=sparks[sp].vx*dt; sparks[sp].y+=sparks[sp].vy*dt; sparks[sp].life-=dt; } sparks=sparks.filter(function(x){ return x.life>0; });
    if(shake>0) shake=Math.max(0, shake-dt*22);
    scheduleMusic();
    saveT-=dt; if(saveT<=0){ if(dirty){ save(); dirty=false; } saveT=4; }
    draw(); syncHud();
  }
  requestAnimationFrame(tick);
}
function spawnIdle(){ var ehp=idleHp(); enemies.push({x:6+Math.random()*(W-40),y:-20,hp:ehp,max:ehp,spd:IDLE_SPD,kind:'idle'}); }

// ---- draw ------------------------------------------------------------------
function draw(){
  g.clearRect(0,0,W,H);
  g.save(); if(shake>0.1){ g.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake); }
  var bg=g.createLinearGradient(0,0,0,LINE_Y); bg.addColorStop(0,'#0a1018'); bg.addColorStop(1,'#0c1622');
  g.fillStyle=bg; g.fillRect(0,0,W,LINE_Y);
  g.strokeStyle='rgba(90,120,160,0.06)'; g.lineWidth=1;
  for(var c=1;c<COLS;c++){ var x=6+c*CELL; g.beginPath(); g.moveTo(x,0); g.lineTo(x,LINE_Y); g.stroke(); }
  var danger=inWave && hp<=30;
  var band=g.createLinearGradient(0,LINE_Y-14,0,LINE_Y); band.addColorStop(0,'rgba(0,0,0,0)'); band.addColorStop(1, danger?'rgba(255,70,90,0.22)':'rgba(90,150,255,0.13)');
  g.fillStyle=band; g.fillRect(0,LINE_Y-14,W,14);
  g.strokeStyle=danger?'#ff6b78':'#4f7bd0'; g.lineWidth=2.5; g.setLineDash([10,7]); g.shadowColor=danger?'#ff5d6c':'#6fb3ff'; g.shadowBlur=8;
  g.beginPath(); g.moveTo(0,LINE_Y); g.lineTo(W,LINE_Y); g.stroke(); g.shadowBlur=0; g.setLineDash([]);
  if(!inWave){ g.fillStyle='#46566b'; g.font='12px sans-serif'; g.textAlign='center'; g.textBaseline='middle'; g.fillText(t('auto_def'), W/2, 20); }

  for(var en=0;en<enemies.length;en++) drawEnemy(enemies[en]);

  var firing=enemies.length>0 && totalDps()>0;
  for(var i=0;i<N();i++){
    var cc=i%COLS, rr=(i/COLS|0), gx=6+cc*CELL, gy=GRID_TOP+rr*ROW_H, w=CELL-5, h=ROW_H-5, on=(i===sel), tt=M.grid[i];
    var tg=g.createLinearGradient(0,gy,0,gy+h); tg.addColorStop(0,on?'#24344d':'#161b25'); tg.addColorStop(1,on?'#1a2740':'#0f131b');
    g.fillStyle=tg; if(on){ g.shadowColor='#ffd86b'; g.shadowBlur=12; } roundRect(gx,gy,w,h,9); g.fill(); g.shadowBlur=0;
    g.lineWidth=on?2:1; g.strokeStyle=on?'#ffd86b':'#262d3a'; roundRect(gx,gy,w,h,9); g.stroke();
    if(tt>0){
      drawGun(gx+w/2, gy+h/2-2, Math.min(1.25,ROW_H/60), tt, firing);
      g.fillStyle='rgba(8,10,16,0.78)'; roundRect(gx+w/2-13,gy+h-14,26,12,6); g.fill();
      g.fillStyle=TCOL[tt]; g.font='bold 9px sans-serif'; g.textAlign='center'; g.textBaseline='middle'; g.fillText(t('tier')+tt, gx+w/2, gy+h-8);
    } else { g.strokeStyle='rgba(120,140,170,0.12)'; g.lineWidth=1; g.setLineDash([3,4]); g.beginPath(); g.arc(gx+w/2,gy+h/2,11,0,7); g.stroke(); g.setLineDash([]); }
  }
  // beams: light + soft cyan when weak, thick + hot gold + glow when powerful (firePower)
  var bw0=lerp(1.4,6,_fp), gl=lerp(2,18,_fp), soft=_fp<0.4;
  for(var bl=0;bl<bullets.length;bl++){ var b=bullets[bl], a=Math.max(0,b.life/.12); g.save(); g.globalAlpha=a*(0.5+0.5*_fp);
    g.strokeStyle = soft ? 'rgba(150,200,255,0.7)' : 'rgba(255,'+Math.round(lerp(232,150,_fp))+',110,0.92)'; g.lineWidth=bw0; g.shadowColor=soft?'#7fb3ff':'#ffb04a'; g.shadowBlur=gl; g.beginPath(); g.moveTo(b.x,b.y); g.lineTo(b.tx,b.ty); g.stroke();
    g.shadowBlur=0; g.strokeStyle='rgba(255,255,255,'+(0.55+0.4*_fp).toFixed(2)+')'; g.lineWidth=Math.max(0.7,bw0*0.34); g.beginPath(); g.moveTo(b.x,b.y); g.lineTo(b.tx,b.ty); g.stroke();
    g.fillStyle='rgba(255,255,255,0.95)'; g.beginPath(); g.arc(b.tx,b.ty,lerp(1.6,5.5,_fp),0,7); g.fill(); g.restore(); }
  g.globalAlpha=1;
  for(var k=0;k<sparks.length;k++){ var s=sparks[k]; g.globalAlpha=Math.max(0,s.life/.5); g.fillStyle='#ffe08a'; g.beginPath(); g.arc(s.x,s.y,2.4,0,7); g.fill(); } g.globalAlpha=1;
  g.restore();
}
function roundRect(x,y,w,h,r){ g.beginPath(); g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r); g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath(); }
function lerp(a,b,tt){ return a+(b-a)*tt; }
function hx(c){ c=c.replace('#',''); if(c.length===3) c=c.split('').map(function(x){return x+x;}).join(''); return [parseInt(c.slice(0,2),16),parseInt(c.slice(2,4),16),parseInt(c.slice(4,6),16)]; }
function hexA(c,a){ var p=hx(c); return 'rgba('+p[0]+','+p[1]+','+p[2]+','+a+')'; }
function light(c,f){ var p=hx(c); f=(f==null)?0.45:f; return 'rgb('+Math.round(lerp(p[0],255,f))+','+Math.round(lerp(p[1],255,f))+','+Math.round(lerp(p[2],255,f))+')'; }
function dark(c,f){ var p=hx(c); f=(f==null)?0.45:f; return 'rgb('+Math.round(lerp(p[0],0,f))+','+Math.round(lerp(p[1],0,f))+','+Math.round(lerp(p[2],0,f))+')'; }
function drawGun(cx,cy,scale,tier,firing){
  var col=TCOL[tier]||'#8a93a6'; var R=12*scale, barrels=Math.min(5,1+Math.floor((tier-1)/1.6)), glow=Math.min(0.5,0.12+tier*0.05);
  g.save(); g.translate(cx,cy);
  g.fillStyle='rgba(0,0,0,0.35)'; g.beginPath(); g.ellipse(0,R*0.78,R*1.05,R*0.5,0,0,7); g.fill();
  var ga=g.createRadialGradient(0,0,2,0,0,R*2); ga.addColorStop(0,hexA(col,glow)); ga.addColorStop(1,hexA(col,0)); g.fillStyle=ga; g.beginPath(); g.arc(0,0,R*2,0,7); g.fill();
  var bw=Math.max(3,R*0.32), bl=R*1.1;
  for(var k=0;k<barrels;k++){ var off=(k-(barrels-1)/2)*(bw+2);
    g.fillStyle='#39414f'; roundRect(off-bw/2,-R-bl,bw,bl+R*0.6,bw*0.4); g.fill();
    g.fillStyle=col; roundRect(off-bw/2,-R-bl,bw,bw*1.1,bw*0.4); g.fill();
    if(firing){ var p=0.5+0.5*Math.sin(performance.now()/90+off+cx), tf=Math.min(1,(tier-1)/(MAXTIER-1)); g.fillStyle=hexA(tf<0.4?'#cfe6ff':'#fff',(0.3+0.55*tf)*p); g.beginPath(); g.arc(off,-R-bl,bw*(0.45+0.55*tf),0,7); g.fill(); } }
  var bgrad=g.createRadialGradient(-R*0.3,-R*0.4,R*0.2,0,0,R); bgrad.addColorStop(0,light(col)); bgrad.addColorStop(1,dark(col)); g.fillStyle=bgrad; g.beginPath(); g.arc(0,0,R,0,7); g.fill();
  g.lineWidth=1.5; g.strokeStyle=dark(col,0.55); g.beginPath(); g.arc(0,0,R,0,7); g.stroke();
  g.fillStyle=light(col,0.65); g.beginPath(); g.arc(0,0,R*0.34,0,7); g.fill();
  g.fillStyle='rgba(255,255,255,0.28)'; g.beginPath(); g.ellipse(-R*0.32,-R*0.42,R*0.42,R*0.22,-0.5,0,7); g.fill();
  g.restore();
}
function drawEnemy(en){
  var idle=en.kind==='idle', bossK=en.kind==='boss', tm=performance.now()/1000, wob=Math.sin(tm*6+en.x)*0.12, R=idle?8:(bossK?26:13);
  g.save(); g.translate(en.x,en.y);
  g.fillStyle='rgba(0,0,0,0.3)'; g.beginPath(); g.ellipse(0,R*0.72,R*0.9,R*0.4,0,0,7); g.fill();
  var c1=idle?'#9aa3b4':(bossK?'#ff7ae0':'#ff8472'), c2=idle?'#48505f':(bossK?'#7a1d6a':'#c2342f');
  var bd=g.createRadialGradient(-R*0.3,-R*0.4,R*0.2,0,0,R*1.05); bd.addColorStop(0,c1); bd.addColorStop(1,c2);
  g.fillStyle=bd; g.beginPath(); g.ellipse(0,0,R*(1+wob),R*(1-wob),0,0,7); g.fill();
  if(!idle){ g.fillStyle='rgba(0,0,0,0.28)'; g.beginPath(); g.arc(0,-R*0.12,R*0.92,0.18,Math.PI-0.18); g.fill();
    g.strokeStyle=c2; g.lineWidth=2; g.beginPath(); g.moveTo(-R*0.66,-R*0.66); g.lineTo(-R*1.02,-R*1.12); g.moveTo(R*0.66,-R*0.66); g.lineTo(R*1.02,-R*1.12); g.stroke(); }
  var ex=R*0.34, ey=-R*0.1, er=idle?R*0.17:R*0.2;
  g.fillStyle=idle?'#d2ecff':(bossK?'#fff':'#ffe27a'); g.beginPath(); g.arc(-ex,ey,er,0,7); g.arc(ex,ey,er,0,7); g.fill();
  g.fillStyle='#0f131a'; g.beginPath(); g.arc(-ex,ey,er*0.5,0,7); g.arc(ex,ey,er*0.5,0,7); g.fill();
  g.restore();
  if(!idle){ var bw=bossK?54:26; g.fillStyle='#000'; g.fillRect(en.x-bw/2,en.y-R-9,bw,bossK?5:3.5); g.fillStyle=(en.hp/en.max)>0.4?'#6fd08a':'#ffcf5c'; g.fillRect(en.x-bw/2,en.y-R-9,bw*Math.max(0,en.hp/en.max),bossK?5:3.5); }
}

// inventory
var chipSel=-1;
function renderInv(){
  $('slotRow').innerHTML='';
  var sl=slots();
  for(var i=0;i<5;i++){
    var s=document.createElement('div'); s.className='slot'+(i>=sl?' lock':'');
    if(i>=sl){ s.textContent='🔒'; }
    else { var c=M.equip[i];
      if(c){ s.textContent=AFEMOJI[c.af]; s.style.color=ACOL[c.tier]; var rm=document.createElement('div'); rm.className='rm'; rm.textContent='×';
        (function(idx){ rm.onclick=function(ev){ ev.stopPropagation(); if(M.equip[idx]){ M.chips.push(M.equip[idx]); M.equip[idx]=null; } save(); renderInv(); toast(t('unequipped')); }; })(i);
        s.appendChild(rm); }
      else { s.textContent='+'; (function(idx){ s.onclick=function(){ equipSelected(idx); }; })(i); }
    }
    $('slotRow').appendChild(s);
  }
  var grid=$('chipGrid'); grid.innerHTML='';
  if(M.chips.length===0){ var em=document.createElement('div'); em.style.cssText='grid-column:1/-1;color:var(--soft);font-size:12px;text-align:center;padding:14px'; em.textContent=t('empty_inv'); grid.appendChild(em); return; }
  for(var j=0;j<M.chips.length;j++){ (function(idx){
    var c=M.chips[idx]; var cell=document.createElement('div'); cell.className='chipcell'+(idx===chipSel?' sel':'');
    cell.style.borderColor=ACOL[c.tier];
    var ce=document.createElement('div'); ce.className='ce'; ce.textContent=AFEMOJI[c.af];
    var nm=document.createElement('div'); nm.textContent=t('af_'+c.af)+' '+t('tier')+c.tier; nm.style.color=ACOL[c.tier]; nm.style.fontSize='10px';
    var ct=document.createElement('div'); ct.className='ct'; ct.textContent='+'+chipVal(c.af,c.tier)+'%';
    cell.appendChild(ce); cell.appendChild(nm); cell.appendChild(ct);
    cell.onclick=function(){ onChipTap(idx); };
    grid.appendChild(cell);
  })(j); }
}
function onChipTap(idx){
  if(chipSel===-1){ chipSel=idx; renderInv(); return; }
  if(chipSel===idx){ chipSel=-1; renderInv(); return; }
  var a=M.chips[chipSel], b=M.chips[idx];
  if(a.af===b.af && a.tier===b.tier && a.tier<5){ b.tier++; M.chips.splice(chipSel,1); chipSel=-1; save(); sfx('chip'); toast(t('merged_chip')); renderInv(); }
  else { chipSel=idx; renderInv(); }
}
function equipSelected(slotIdx){
  if(chipSel<0){ toast(t('inv_sub').slice(0,0)||''); return; }
  var c=M.chips[chipSel]; M.equip[slotIdx]=c; M.chips.splice(chipSel,1); chipSel=-1; save(); toast(t('equipped')); renderInv();
}

// prestige
function ascTotal(){ var w=M.bestWave; if(w<10) return 0; return Math.floor(Math.pow(w-9, 0.6)); }  // total stars earned for reaching bestWave
function ascGain(){ return Math.max(0, ascTotal() - M.stars); }                                       // claimable now (can't re-farm the same wave)
function renderAsc(){
  var gain=ascGain();
  $('ascBody').innerHTML = M.bestWave>=10 ? fmt('asc_gain', gain, Math.round(M.stars*5), M.bestWave) : '<p>'+fmt('asc_locked',10)+'</p>';
  var b=$('ascDo'); b.disabled=gain<=0; b.textContent=t('asc_do');
}
function doAscend(){
  var gain=ascGain(); if(gain<=0) return;
  M.stars+=gain; sfx('ascend');
  // reset only the arsenal (guns) + cores; KEEP chips, stars and ALL upgrades (incl. dmgLv)
  var keep={ stars:M.stars, chips:M.chips, equip:M.equip, dmgLv:M.dmgLv, forgeLv:M.forgeLv, autoLv:M.autoLv, slotLv:M.slotLv, boardLv:M.boardLv, idleLv:M.idleLv, critLv:M.critLv,
    lastDaily:M.lastDaily, streak:M.streak, seenTut:true, autoOn:M.autoOn, bestWave:M.bestWave, lastGunGen:now(), lastVisit:now() };
  var f=fresh(); for(var k in keep) f[k]=keep[k];
  f.rows=Math.min(6,4+f.boardLv); f.grid=[]; for(var i=0;i<COLS*f.rows;i++) f.grid.push(0); for(var s=0;s<4;s++) f.grid[s]=1;
  f.cores=30; M=f;
  inWave=false; enemies=[]; bullets=[]; boss=null; sel=-1; hp=100;   // clear transient combat state
  save(); layout();
  closeAllPanels(); gs='PLAY'; syncGameplay(); toast(fmt('ascended', gain)); renderHudStatic();
}

function resize(){
  // size the canvas backing store to MATCH its CSS box exactly - crisp rendering,
  // correct hit math, and no aspect-ratio stretch on short/wide frames (Yandex
  // 1.6.2.3 / 1.10.3). A backing height floor here would distort the view when the
  // CSS box is shorter than the floor (yandex-testing "canvas stretch" FAIL).
  var r=cv.getBoundingClientRect();
  var w=Math.max(1, Math.round(r.width)), h=Math.max(1, Math.round(r.height));
  if(w!==W || h!==H){ cv.width=w; cv.height=h; W=w; H=h; layout(); }
}

// boot
var booted=false;
function boot(){
  M=load();
  var done=false;
  function go(cloud){ if(done) return; done=true;
    // newest save wins (savedAt); avoids clobbering freshly-spent cores/chips
    if(cloud && (cloud.savedAt||0) > (M.savedAt||0) && Array.isArray(cloud.grid)){ M=migrate(cloud); }
    finishBoot();
  }
  setTimeout(function(){ go(null); }, 5000);   // SDK/cloud-load timeout - never hang the menu
  cloudLoad(function(cloud){ go(cloud); });     // standalone path calls back with null synchronously
}
function finishBoot(){
  resize(); layout();
  window._offEarned=applyOffline(); M.lastVisit=now();
  window._gunsIn=collectForge(true);
  applyDaily();
  setLangUI(); renderHudStatic(); showMenu(); setMuted(M.muted);
  booted=true; $('playBtn').disabled=false;
  // Platform builds (Yandex/CrazyGames) inject window.__GF_AUTOSTART so the
  // player lands IN the game, not on the menu landing (rule #9). Suppress the
  // first-run tutorial overlay so autostart drops straight into gameplay; the

  if(window.__GF_AUTOSTART && !window._silent){ M.seenTut=true; save(); startGame(); }
  sdkReady();

window._setupForScreenshot=function(level){

  M.rows=4; M.grid=[];

  _ssMode=true; _fp=firePower(); syncHud(); syncButtons();
};
window._jumpLevel=window._setupForScreenshot;
// holds an action-packed combat frame: a boss + a fan of enemies pinned in place,
// guns constantly firing beams. No HP loss, no toasts, no audio - just a clean shot.
function _ssFrame(){
  if(!boss){ boss={x:W/2,y:Math.max(34,LINE_Y*0.26),hp:760,max:1000,spd:0,kind:'boss'}; enemies.push(boss); }
  while(enemies.length<6){ enemies.push({x:24+Math.random()*(W-48), y:30+Math.random()*(LINE_Y*0.55), hp:45,max:70,spd:0,kind:'wave'}); }
  var gi=[]; for(var gg=0;gg<N();gg++){ if(M.grid[gg]>0) gi.push(gg); }
  for(var bI=0;bI<2 && bullets.length<9 && gi.length && enemies.length;bI++){ var gidx=gi[(Math.random()*gi.length)|0], tgt=enemies[(Math.random()*enemies.length)|0];
    bullets.push({x:6+(gidx%COLS)*CELL+CELL/2, y:GRID_TOP+((gidx/COLS|0))*ROW_H+ROW_H*0.5, tx:tgt.x, ty:tgt.y, life:.12}); }
  for(var b=0;b<bullets.length;b++) bullets[b].life-=0.016; bullets=bullets.filter(function(x){ return x.life>0; });
  for(var s=0;s<sparks.length;s++){ sparks[s].x+=sparks[s].vx*0.016; sparks[s].y+=sparks[s].vy*0.016; sparks[s].life-=0.016; } sparks=sparks.filter(function(x){ return x.life>0; });

// Compose a landscape cover (kind='cover') or square icon (kind='icon') ENTIRELY
// from the game's own primitives (drawGun / drawEnemy / beams on the real combat

window._renderPromo=function(kind, scene){
  scene=scene||0; M.muted=false; gs='SHOT'; closeAll();
  var w = kind==='icon'?1024:1600, h = kind==='icon'?1024:(kind==='wide'?900:940);
  cv.width=w; cv.height=h; W=w; H=h;
  cv.style.position='fixed'; cv.style.left='0'; cv.style.top='0'; cv.style.width=w+'px'; cv.style.height=h+'px'; cv.style.maxWidth='none'; cv.style.zIndex='99999'; cv.style.border='0'; cv.style.borderRadius='0';
  var line=Math.round(h*(kind==='icon'?0.58:0.64));
  var bg=g.createLinearGradient(0,0,0,h); bg.addColorStop(0,'#0a1018'); bg.addColorStop(0.7,'#0c1622'); bg.addColorStop(1,'#090d14');

  g.strokeStyle='rgba(90,120,160,0.06)'; g.lineWidth=1.5;
  var cols=kind==='icon'?4:7; for(var c=1;c<cols;c++){ var x=w*c/cols; g.beginPath(); g.moveTo(x,0); g.lineTo(x,line); g.stroke(); }
  var band=g.createLinearGradient(0,line-26,0,line); band.addColorStop(0,'rgba(0,0,0,0)'); band.addColorStop(1,'rgba(90,150,255,0.16)'); g.fillStyle=band; g.fillRect(0,line-26,w,26);
  g.strokeStyle='#4f7bd0'; g.lineWidth=4; g.setLineDash([18,12]); g.shadowColor='#6fb3ff'; g.shadowBlur=14; g.beginPath(); g.moveTo(0,line); g.lineTo(w,line); g.stroke(); g.shadowBlur=0; g.setLineDash([]);
  var towers, foes, ts;
  if(kind==='icon'){ ts=h*0.115;
    towers=[{x:w*0.30,y:line+ts*1.5,s:ts,t:9},{x:w*0.70,y:line+ts*1.5,s:ts,t:8},{x:w*0.30,y:line+ts*3.4,s:ts*0.9,t:7},{x:w*0.70,y:line+ts*3.4,s:ts*0.9,t:6}];
    foes=[{x:w*0.5,y:h*0.16,k:'boss',R:h*0.12},{x:w*0.20,y:h*0.30,k:'wave',R:h*0.06},{x:w*0.80,y:h*0.30,k:'wave',R:h*0.06}];
  } else { ts=h*(kind==='wide'?0.088:0.082);
    var TT = scene? [4,7,9,6,8,5, 5,8,6] : [6,8,9,7,5,4, 4,6,5];
    var r1=line+ts*1.35, r2=line+ts*2.95;
    towers=[{x:w*0.095,y:r1,s:ts*0.95,t:TT[0]},{x:w*0.265,y:r1,s:ts*1.05,t:TT[1]},{x:w*0.44,y:r1,s:ts*1.12,t:TT[2]},{x:w*0.615,y:r1,s:ts*1.05,t:TT[3]},{x:w*0.785,y:r1,s:ts*0.98,t:TT[4]},{x:w*0.93,y:r1,s:ts*0.88,t:TT[5]},
            {x:w*0.18,y:r2,s:ts*0.88,t:TT[6]},{x:w*0.52,y:r2,s:ts*0.92,t:TT[7]},{x:w*0.85,y:r2,s:ts*0.88,t:TT[8]}];
    var fx=scene?0.08:0;
    foes=[{x:w*(0.5-fx),y:h*0.12,k:'boss',R:h*0.11},{x:w*(0.20+fx),y:h*0.23,k:'wave',R:h*0.05},{x:w*0.36,y:h*0.31,k:'wave',R:h*0.045},{x:w*(0.66+fx),y:h*0.27,k:'wave',R:h*0.05},{x:w*0.82,y:h*0.21,k:'wave',R:h*0.045},{x:w*0.5,y:h*0.35,k:'wave',R:h*0.04}];
  }
  for(var bi=0;bi<towers.length;bi++){ var tw=towers[bi], en=foes[bi%foes.length], hot=tw.t>=6;
    g.save(); g.globalAlpha=0.92; g.strokeStyle=hot?'rgba(255,200,110,0.92)':'rgba(150,200,255,0.8)'; g.lineWidth=hot?7:4; g.shadowColor=hot?'#ffb04a':'#7fb3ff'; g.shadowBlur=18;
    g.beginPath(); g.moveTo(tw.x,tw.y-tw.s); g.lineTo(en.x,en.y); g.stroke();
    g.shadowBlur=0; g.strokeStyle='rgba(255,255,255,0.9)'; g.lineWidth=hot?2.4:1.4; g.beginPath(); g.moveTo(tw.x,tw.y-tw.s); g.lineTo(en.x,en.y); g.stroke();
    g.fillStyle='rgba(255,255,255,0.95)'; g.beginPath(); g.arc(en.x,en.y,hot?7:5,0,7); g.fill(); g.restore(); }
  for(var ei=0;ei<foes.length;ei++){ var f=foes[ei], k=f.R/(f.k==='boss'?26:13); g.save(); g.translate(f.x,f.y); g.scale(k,k); g.translate(-f.x,-f.y); drawEnemy({x:f.x,y:f.y,kind:f.k,hp:72,max:100}); g.restore(); }
  for(var tih=0;tih<towers.length;tih++){ var t2=towers[tih]; drawGun(t2.x,t2.y,t2.s/12,t2.t,true); }
  for(var si=0;si<towers.length;si++){ var t3=towers[si]; for(var z=0;z<5;z++){ g.globalAlpha=Math.random()*0.6+0.2; g.fillStyle='#ffe08a'; g.beginPath(); g.arc(t3.x+(Math.random()-0.5)*t3.s, t3.y-t3.s+(Math.random()-0.5)*t3.s*0.6, Math.max(1.5,t3.s*0.05),0,7); g.fill(); } } g.globalAlpha=1;
