var CAMERA_COUNT = 3;

var CAMERA_RADIUS = 19;

var scene = { x: 0, y: 0, w: 0, h: 0, ui: 1, top: 0, bottom: 0 };

function seededRandom() {
  rngSeed = (rngSeed * 1664525 + 1013904223) >>> 0;
  return rngSeed / 4294967296;
}

function clamp(v, lo, hi) { return v < lo ? lo : v > hi ? hi : v; }
function lerp(a, b, t) { return a + (b - a) * t; }
function angleDiff(a, b) {
  var d = (a - b + Math.PI) % (Math.PI * 2) - Math.PI;
  return d < -Math.PI ? d + Math.PI * 2 : d;
}

function calcPathLengths() {
  for (var i = 0; i < PATHS.length; i++) {
    var pts = PATHS[i].pts;
    var len = 0;
    for (var j = 1; j < pts.length; j++) {
      var dx = pts[j][0] - pts[j - 1][0];
      var dy = pts[j][1] - pts[j - 1][1];
      len += Math.sqrt(dx * dx + dy * dy);
    }
    PATHS[i].len = Math.max(0.01, len);
  }
}

function layout() {
  var minSide = Math.max(1, Math.min(GF.W, GF.H));
  var raw = Math.min(GF.W / 440, GF.H / 760);
  var ui = clamp(raw, 0.72, 1.22);
  if (minSide < 420) ui = Math.max(ui, 0.82);
  var top = Math.round(clamp(82 * ui, 62, 104));
  var bottom = Math.round(clamp(104 * ui, 74, 122));
  if (GF.W < 520) top = Math.round(clamp(126 * ui, 98, 116));
  scene.x = 0;
  scene.y = top;
  scene.w = GF.W;
  scene.h = Math.max(150, GF.H - top - bottom);
  scene.ui = ui;
  scene.top = top;
  scene.bottom = bottom;
  uiRects.help = { x: GF.W - 44 * ui, y: 9 * ui, w: 32 * ui, h: 32 * ui };
  uiRects.mute = { x: GF.W - 82 * ui, y: 9 * ui, w: 32 * ui, h: 32 * ui };
  uiRects.retry = { x: GF.cx - 76 * ui, y: GF.cy + 82 * ui, w: 152 * ui, h: 44 * ui };
  uiRects.helpClose = { x: GF.cx - 70 * ui, y: GF.cy + 148 * ui, w: 140 * ui, h: 38 * ui };
}

function fs(base) {
  var boost = Math.min(GF.W, GF.H) < 430 ? 1.08 : 1;
  return Math.max(10, Math.round(base * scene.ui * boost));
}

function worldToScreen(x, y) {
  return { x: scene.x + x * scene.w, y: scene.y + y * scene.h };
}

function screenToWorld(x, y) {
  return { x: clamp((x - scene.x) / scene.w, 0, 1), y: clamp((y - scene.y) / scene.h, 0, 1) };
}

function worldDist(a, b) {
  var dx = (a.x - b.x) * scene.w;
  var dy = (a.y - b.y) * scene.h;
  return Math.sqrt(dx * dx + dy * dy);
}

function ptrPos(e) {
  var r = GF.canvas.getBoundingClientRect();
  var sx = GF.W / Math.max(1, r.width);
  var sy = GF.H / Math.max(1, r.height);
  return { x: (e.clientX - r.left) * sx, y: (e.clientY - r.top) * sy };
}

function hitRect(p, r) {
  return r && p.x >= r.x && p.x <= r.x + r.w && p.y >= r.y && p.y <= r.y + r.h;
}

function tSpecies(id) {
  return GF.t(SPECIES[id] ? SPECIES[id].key : 'species_none');
}

function sensLabel(idx) {
  return GF.t(SENS[idx].key);
}

function sfx(name, gapMs) {
  var now = Date.now();
  var gap = gapMs || 80;
  if (lastSfx[name] && now - lastSfx[name] < gap) return;
  lastSfx[name] = now;
  GF.sfx(name);
}

function saveMeta() {
  GF.saveRun();
}

function getMeta() {
  return {
    best: best,
    speciesSeen: speciesSeen
  };
}

function applyMeta(s) {
  if (!s || typeof s !== 'object') return;
  best = Math.max(0, Number(s.best) || 0);
  speciesSeen = s.speciesSeen && typeof s.speciesSeen === 'object' ? s.speciesSeen : {};
}

function targetForNight(n) {
  if (n <= 1) return { deer: 2, boar: 1 };
  if (n === 2) return { deer: 1, boar: 1, lizard: 2 };
  if (n === 3) return { deer: 2, boar: 1, lizard: 2 };
  if (n === 4) return { deer: 2, boar: 2, lizard: 2 };
  if (n === 5) return { deer: 2, boar: 1, lizard: 2, cat: 1 };
  return { deer: 2 + Math.floor((n - 6) / 2), boar: 2, lizard: 2 + Math.floor((n - 6) / 3), cat: 1 };
}

function targetLeft(species) {
  return Math.max(0, (targetCounts[species] || 0) - (quotaProgress[species] || 0));
}

function targetSummary() {
  var parts = [];
  var keys = ['deer', 'boar', 'lizard', 'cat'];
  for (var i = 0; i < keys.length; i++) {
    var k = keys[i];
    if (!targetCounts[k]) continue;
    parts.push(tSpecies(k) + ' ' + (quotaProgress[k] || 0) + '/' + targetCounts[k]);
  }
  return parts.join('  ');
}

function resetCameras() {
  cameras = [
    { x: 0.16, y: 0.87, node: -1, angle: -0.92, sens: 1, cooldown: 0, pulse: 0 },
    { x: 0.48, y: 0.88, node: -1, angle: -1.42, sens: 1, cooldown: 0, pulse: 0 },
    { x: 0.80, y: 0.87, node: -1, angle: -2.10, sens: 1, cooldown: 0, pulse: 0 }
  ];
  selectedCamera = 0;
}

function cloneFalseObjects(n) {
  falseObjects = [];
  var max = n >= 4 ? FALSE_OBJECTS_BASE.length : (n >= 3 ? 3 : 1);
  for (var i = 0; i < max; i++) {
    var o = FALSE_OBJECTS_BASE[i];
    falseObjects.push({ type: o.type, x: o.x, y: o.y, phase: o.phase, cd: 0 });
  }
}

function startGame(opts) {
  opts = opts || {};
  score = 0;
  night = 1;
  rngSeed = 7 + Math.floor(Date.now() % 997);
  resetCameras();
  startNight(1);
  gs = 'PLAYING';
  helpOpen = false;
  gameOverReason = 'reason_missed';
  cameraMovedFlag = false;
  cameraAimedFlag = false;
  deerPhotoFlag = false;
  lizardPhotoFlag = false;
  falsePhotoFlag = false;
  secondCameraHighFlag = false;
  try { tutorialDone = opts.suppressTutorial ? true : localStorage.getItem('trailcam_ranger_tutorial_v1') === '1'; } catch (e) { tutorialDone = !!opts.suppressTutorial; }
  coachStep = tutorialDone ? 99 : 0;
  GF.gameStarted();
}

function startNight(n) {
  night = Math.max(1, Math.floor(n));
  film = Math.max(10, START_FILM + Math.min(4, Math.floor((night - 1) / 2)) - Math.max(0, Math.floor((night - 7) / 3)));
  battery = START_BATTERY;
  missed = 0;
  movesLeft = Math.max(3, BASE_MOVES - Math.floor((night - 1) / 2));
  targetCounts = targetForNight(night);
  quotaProgress = {};
  quotaTarget = 0;
  for (var k in targetCounts) {
    if (Object.prototype.hasOwnProperty.call(targetCounts, k)) {
      quotaProgress[k] = 0;
      quotaTarget += targetCounts[k];
    }
  }
  quotaDone = 0;
  animals = [];
  photos = [];
  flashes = [];
  cloneFalseObjects(night);
  spawnTimer = 0.9;
  nightElapsed = 0;
  nightCompleteTimer = 0;
  catSpawned = false;
  tutorialSafeUntil = tutorialDone ? 0 : 8;
  if (night >= 2 && cameras[1]) {
    cameras[1].x = 0.42;
    cameras[1].y = 0.76;
    cameras[1].angle = -0.9;
  }
  if (night >= 5 && cameras[2]) {
    cameras[2].x = 0.84;
    cameras[2].y = 0.34;
    cameras[2].angle = Math.PI;
  }
  spawnAnimal(night >= 2 ? 'lizard' : 'deer', 0);
  if (night === 1) spawnAnimal('deer', 0);
}

function completeNight() {
  if (nightCompleteTimer > 0) return;
  nightCompleteTimer = NIGHT_COMPLETE_DELAY;
  score += 160 + night * 40 + Math.max(0, film) * 7;
  sfx('levelup', 300);
  GF.setShake(0.35);
  GF.spawnParticles(GF.cx, scene.y + scene.h * 0.45, '#f2d77a', 28);
  if (score > best) {
    best = score;
    saveMeta();
  }
}

function gameOver(reasonKey) {
  if (gs === 'GAMEOVER') return;
  gameOverReason = reasonKey || 'reason_missed';
  gs = 'GAMEOVER';
  sfx('lose', 500);
  GF.setShake(0.55);
  if (score > best) {
    best = score;
    saveMeta();
    GF.happytime();
  }
  GF.gameEnded();
  GF.ads.interstitial();
}

function pathPoint(path, t) {
  var pts = path.pts;
  var want = clamp(t, 0, 1) * path.len;
  var acc = 0;
  for (var i = 1; i < pts.length; i++) {
    var ax = pts[i - 1][0], ay = pts[i - 1][1];
    var bx = pts[i][0], by = pts[i][1];
    var dx = bx - ax, dy = by - ay;
    var seg = Math.sqrt(dx * dx + dy * dy);
    if (acc + seg >= want) {
      var q = (want - acc) / Math.max(0.001, seg);
      return { x: lerp(ax, bx, q), y: lerp(ay, by, q) };
    }
    acc += seg;
  }
  return { x: pts[pts.length - 1][0], y: pts[pts.length - 1][1] };
}

function spawnAnimal(species, preferredPath) {
  var spec = SPECIES[species];
  if (!spec) return;
  var pathIndex = preferredPath;
  if (typeof pathIndex !== 'number') {
    if (species === 'cat') pathIndex = 3;
    else if (species === 'lizard') pathIndex = 2;
    else if (species === 'boar') pathIndex = 1;
    else pathIndex = seededRandom() < 0.55 ? 0 : 1;
    if (night >= 6 && seededRandom() < 0.24) pathIndex = 4;
  }
  var speedScale = 1 + Math.min(0.75, (night - 1) * 0.065);
  var a = {
    species: species,
    path: pathIndex,
    t: 0,
    speed: spec.speed * speedScale * (0.90 + seededRandom() * 0.24),
    x: 0,
    y: 0,
    target: targetLeft(species) > 0,
    captured: false,
    pause: species === 'boar' ? 0.35 + seededRandom() * 0.65 : 0,
    wobble: seededRandom() * Math.PI * 2
  };
  var p = pathPoint(PATHS[pathIndex], 0);
  a.x = p.x;
  a.y = p.y;
  animals.push(a);
}

function chooseSpawnSpecies() {
  var pending = [];
  var keys = ['deer', 'boar', 'lizard', 'cat'];
  for (var i = 0; i < keys.length; i++) {
    var k = keys[i];
    for (var n = 0; n < targetLeft(k); n++) pending.push(k);
  }
  if (night >= 5 && !catSpawned && targetLeft('cat') > 0 && nightElapsed > 12) {
    catSpawned = true;
    return 'cat';
  }
  if (pending.length && seededRandom() < 0.78) {
    return pending[Math.floor(seededRandom() * pending.length)];
  }
  if (night >= 2 && seededRandom() < 0.26) return 'lizard';
  return seededRandom() < 0.58 ? 'deer' : 'boar';
}

function updateAnimals(dt) {
  for (var i = animals.length - 1; i >= 0; i--) {
    var a = animals[i];
    if (a.captured) {
      a.t += dt * 1.2;
      if (a.t > 1.04) animals.splice(i, 1);
      continue;
    }
    if (a.species === 'boar' && a.t > 0.38 && a.t < 0.52 && a.pause > 0) {
      a.pause -= dt;
    } else {
      a.t += dt * a.speed / PATHS[a.path].len;
    }
    var p = pathPoint(PATHS[a.path], a.t);
    a.x = p.x + Math.sin(nightElapsed * 2.2 + a.wobble) * 0.003;
    a.y = p.y + Math.cos(nightElapsed * 1.7 + a.wobble) * 0.003;
    if (a.t >= 1) {
      if (a.target && nightElapsed > tutorialSafeUntil && nightCompleteTimer <= 0) {
        missed++;
        sfx('hurt', 280);
        var sp = worldToScreen(a.x, a.y);
        GF.spawnFloat(sp.x, sp.y, GF.t('missed') + ' +1', '#ffb3a6');
        if (missed >= MAX_MISSED) gameOver('reason_missed');
      }
      animals.splice(i, 1);
    }
  }
}

function updateSpawns(dt) {
  if (nightCompleteTimer > 0 || gs !== 'PLAYING') return;
  spawnTimer -= dt;
  if (spawnTimer <= 0) {
    var species = chooseSpawnSpecies();
    spawnAnimal(species);
    var density = clamp(1 - (night - 1) * 0.045, 0.58, 1);
    spawnTimer = (2.6 + seededRandom() * 2.0) * density;
  }
}

function inCone(cam, x, y) {
  var c = { x: cam.x, y: cam.y };
  var p = { x: x, y: y };
  var d = worldDist(c, p);
  var range = CAMERA_RANGE * clamp(Math.min(scene.w / 440, scene.h / 560), 0.66, 1.42);
  if (d > range) return null;
  var ang = Math.atan2((y - cam.y) * scene.h, (x - cam.x) * scene.w);
  var ad = Math.abs(angleDiff(ang, cam.angle));
  if (ad > CONE_HALF_ANGLE) return null;
  return { d: d, range: range, aim: 1 - ad / CONE_HALF_ANGLE, close: 1 - d / range };
}

function canDetect(cam, animal, hit) {
  var spec = SPECIES[animal.species];
  var sens = SENS[cam.sens];
  var detect = spec.heat * sens.mult + hit.close * 0.42 + hit.aim * 0.10;
  if (animal.species === 'lizard' && cam.sens < 2 && hit.close < 0.72) return false;
  return detect >= spec.need;
}

function triggerAnimal(cam, animal) {
  var spec = SPECIES[animal.species];
  animal.captured = true;
  cam.cooldown = CAMERA_COOLDOWN;
  cam.pulse = 1;
  film -= 1;
  battery = Math.max(0, battery - SENS[cam.sens].battery);
  var wasTarget = targetLeft(animal.species) > 0;
  var pts = spec.score + night * 12 + (wasTarget ? 45 : 0);
  score += pts;
  if (wasTarget) {
    quotaProgress[animal.species] = (quotaProgress[animal.species] || 0) + 1;
    quotaDone++;
  }
  speciesSeen[animal.species] = true;
  saveMeta();
  addPhoto(animal.species, pts, true);
  var sp = worldToScreen(animal.x, animal.y);
  GF.spawnParticles(sp.x, sp.y, '#f6e191', 18);
  GF.spawnFloat(sp.x, sp.y - 8, '+' + String(pts), '#f9e68a');
  flashes.push({ x: cam.x, y: cam.y, life: 0.28 });
  sfx(wasTarget ? 'reward' : 'coin', 160);
  if (animal.species === 'deer') deerPhotoFlag = true;
  if (animal.species === 'lizard') lizardPhotoFlag = true;
  if (quotaDone >= quotaTarget) completeNight();
  if (film <= 0 && quotaDone < quotaTarget) gameOver('reason_film');
}

function addPhoto(kind, pts, good) {
  photos.unshift({ kind: kind, pts: pts || 0, good: !!good, age: 0 });
  if (photos.length > 5) photos.length = 5;
}

function triggerFalse(cam, obj) {
  cam.cooldown = CAMERA_COOLDOWN * 0.78;
  cam.pulse = 1;
  obj.cd = 2.5 + seededRandom() * 1.8;
  film -= FALSE_TRIGGER_DAMAGE;
  battery = Math.max(0, battery - SENS[cam.sens].battery * 0.75);
  score = Math.max(0, score - 12);
  addPhoto(obj.type === 'hotrock' ? 'photo_hotrock' : 'photo_grass', -12, false);
  var sp = worldToScreen(obj.x, obj.y);
  GF.spawnFloat(sp.x, sp.y, GF.t('photo_false'), '#ff9b83');
  GF.spawnParticles(sp.x, sp.y, '#ff7e6a', 12);
  flashes.push({ x: cam.x, y: cam.y, life: 0.20 });
  falsePhotoFlag = true;
  sfx('hit', 180);
  GF.setShake(0.16);
  if (film <= 0 && quotaDone < quotaTarget) gameOver('reason_film');
}

function updateDetection(dt) {
  for (var c = 0; c < cameras.length; c++) {
    var cam = cameras[c];
    cam.cooldown = Math.max(0, cam.cooldown - dt);
    cam.pulse = Math.max(0, cam.pulse - dt * 2.6);
    if (cam.cooldown > 0 || film <= 0 || battery <= 0 || nightCompleteTimer > 0) continue;
    for (var i = 0; i < animals.length; i++) {
      var a = animals[i];
      if (a.captured) continue;
      var hit = inCone(cam, a.x, a.y);
      if (hit && canDetect(cam, a, hit)) {
        triggerAnimal(cam, a);
        break;
      }
    }
    if (cam.cooldown > 0 || film <= 0) continue;
    for (var j = 0; j < falseObjects.length; j++) {
      var o = falseObjects[j];
      o.cd = Math.max(0, o.cd - dt);
      if (o.cd > 0) continue;
      var allowed = o.type === 'hotrock' ? SENS[cam.sens].falseRock : SENS[cam.sens].falseGrass;
      if (!allowed) continue;
      var fh = inCone(cam, o.x, o.y);
      if (!fh) continue;
      var wind = Math.sin(nightElapsed * (o.type === 'grass' ? 3.2 : 1.1) + o.phase);
      var active = o.type === 'hotrock' ? wind > 0.32 : wind > 0.68;
      if (active) {
        triggerFalse(cam, o);
        break;
      }
    }
  }
}

function updatePhotos(dt) {
  for (var i = photos.length - 1; i >= 0; i--) {
    photos[i].age += dt;
    if (photos[i].age > 8 && photos.length > 3) photos.splice(i, 1);
  }
  for (var j = flashes.length - 1; j >= 0; j--) {
    flashes[j].life -= dt;
    if (flashes[j].life <= 0) flashes.splice(j, 1);
  }
}

function updateCoach(dt) {
  if (tutorialDone || screenshotMode) return;
  coachPulse += dt;
  if (coachStep === 0 && cameraMovedFlag) coachStep = 1;
  if (coachStep === 1 && cameraAimedFlag) coachStep = 2;
  if (coachStep === 2 && deerPhotoFlag) coachStep = 3;
  if (coachStep === 3 && secondCameraHighFlag) coachStep = 4;
  if (coachStep === 4 && (falsePhotoFlag || lizardPhotoFlag || nightElapsed > 22)) {
    tutorialDone = true;
    coachStep = 99;
    try { localStorage.setItem('trailcam_ranger_tutorial_v1', '1'); } catch (e) {}
  }
}

function update(dt) {
  layout();
  if (gs !== 'PLAYING') return;
  nightElapsed += dt;
  updateCoach(dt);
  if (nightCompleteTimer > 0) {
    nightCompleteTimer -= dt;
    if (nightCompleteTimer <= 0) {
      startNight(night + 1);
      sfx('spawn', 220);
    }
  }
  updateSpawns(dt);
  updateAnimals(dt);
  updateDetection(dt);
  updatePhotos(dt);
  if (battery <= 0 && quotaDone < quotaTarget) {
    film = Math.min(film, 0);
    gameOver('reason_film');
  }
}

function nearestNode(wx, wy) {
  var bestNode = 0;
  var bestD = Infinity;
  var p = { x: wx, y: wy };
  for (var i = 0; i < NODES.length; i++) {
    var d = worldDist(p, NODES[i]);
    if (d < bestD) {
      bestD = d;
      bestNode = i;
    }
  }
  return bestNode;
}

function cycleSensitivity(idx) {
  var cam = cameras[idx];
  cam.sens = (cam.sens + 1) % SENS.length;
  if (idx === 1 && cam.sens === 2) secondCameraHighFlag = true;
  sfx('click', 80);
  GF.spawnParticles(worldToScreen(cam.x, cam.y).x, worldToScreen(cam.x, cam.y).y, '#8edcff', 10);
}

function selectCamera(idx) {
  selectedCamera = clamp(idx, 0, cameras.length - 1);
  sfx('tap', 70);
}

function screenCameraHit(p) {
  var hit = -1;
  var r = CAMERA_RADIUS * scene.ui * 1.35;
  for (var i = cameras.length - 1; i >= 0; i--) {
    var s = worldToScreen(cameras[i].x, cameras[i].y);
    var dx = p.x - s.x, dy = p.y - s.y;
    if (Math.sqrt(dx * dx + dy * dy) <= r) {
      hit = i;
      break;
    }
  }
  return hit;
}

function aimCameraAt(cam, p) {
  var wp = screenToWorld(p.x, p.y);
  cam.angle = Math.atan2((wp.y - cam.y) * scene.h, (wp.x - cam.x) * scene.w);
  cameraAimedFlag = true;
}

function onPointerDown(e) {
  layout();
  var p = ptrPos(e);
  if (hitRect(p, uiRects.mute)) {
    GF.toggleMute();
    sfx('click', 80);
    e.preventDefault();
    return;
  }
  if (hitRect(p, uiRects.help)) {
    helpOpen = !helpOpen;
    sfx('click', 80);
    e.preventDefault();
    return;
  }
  if (helpOpen && hitRect(p, uiRects.helpClose)) {
    helpOpen = false;
    sfx('click', 80);
    e.preventDefault();
    return;
  }
  if (gs === 'GAMEOVER') {
    if (hitRect(p, uiRects.retry)) {
      startGame();
      sfx('spawn', 120);
    }
    e.preventDefault();
    return;
  }
  if (helpOpen) {
    helpOpen = false;
    e.preventDefault();
    return;
  }
  var hit = screenCameraHit(p);
  if (hit >= 0) {
    var wasSelected = hit === selectedCamera;
    selectCamera(hit);
    pointer = { mode: 'camera', cam: hit, sx: p.x, sy: p.y, x: p.x, y: p.y, moved: false, wasSelected: wasSelected, startNode: cameras[hit].node };
    e.preventDefault();
    return;
  }
  if (p.y >= scene.y && p.y <= scene.y + scene.h) {
    pointer = { mode: 'aim', cam: selectedCamera, sx: p.x, sy: p.y, x: p.x, y: p.y, moved: true };
    aimCameraAt(cameras[selectedCamera], p);
    sfx('tap', 90);
    e.preventDefault();
  }
}

function onPointerMove(e) {
  if (!pointer || gs !== 'PLAYING') return;
  var p = ptrPos(e);
  pointer.x = p.x;
  pointer.y = p.y;
  var dx = p.x - pointer.sx;
  var dy = p.y - pointer.sy;
  if (Math.sqrt(dx * dx + dy * dy) > 8) pointer.moved = true;
  var cam = cameras[pointer.cam];
  if (pointer.mode === 'camera') {
    var wp = screenToWorld(p.x, p.y);
    cam.x = wp.x;
    cam.y = wp.y;
    aimCameraAt(cam, p);
  } else if (pointer.mode === 'aim') {
    aimCameraAt(cam, p);
  }
  e.preventDefault();
}

function onPointerUp(e) {
  if (!pointer) return;
  var p = ptrPos(e);
  var cam = cameras[pointer.cam];
  if (gs === 'PLAYING' && pointer.mode === 'camera') {
    if (!pointer.moved && pointer.wasSelected) {
      cycleSensitivity(pointer.cam);
    } else if (pointer.moved) {
      var wp = screenToWorld(p.x, p.y);
      var node = nearestNode(wp.x, wp.y);
      cam.x = NODES[node].x;
      cam.y = NODES[node].y;
      if (cam.node !== node && movesLeft > 0) {
        movesLeft--;
        cameraMovedFlag = true;
      }
      cam.node = node;
      aimCameraAt(cam, p);
      sfx('merge', 120);
      var sp = worldToScreen(cam.x, cam.y);
      GF.spawnParticles(sp.x, sp.y, '#80d890', 14);
    }
  }
  if (gs === 'PLAYING' && pointer.mode === 'aim') {
    aimCameraAt(cam, p);
  }
  pointer = null;
  e.preventDefault();
}

function onKeyDown(e) {
  if (e.code === 'Digit1') selectCamera(0);
  if (e.code === 'Digit2') selectCamera(1);
  if (e.code === 'Digit3') selectCamera(2);
  if (e.code === 'Space') {
    cycleSensitivity(selectedCamera);
    e.preventDefault();
  }
  if (e.code === 'KeyR' && gs === 'GAMEOVER') startGame();
  var cam = cameras[selectedCamera];
  if (!cam) return;
  var step = 0.08;
  if (e.code === 'ArrowLeft') { cam.angle -= step; cameraAimedFlag = true; }
  if (e.code === 'ArrowRight') { cam.angle += step; cameraAimedFlag = true; }
}

function drawText(c, txt, x, y, size, color, align, weight) {
  c.font = (weight || '600') + ' ' + String(size) + 'px system-ui, -apple-system, Segoe UI, sans-serif';
  c.fillStyle = color || '#f5f1df';
  c.textAlign = align || 'left';
  c.textBaseline = 'alphabetic';
  c.fillText(String(txt), x, y);
}

function fitText(c, txt, x, y, maxW, size, color, align, weight) {
  var s = size;
  c.font = (weight || '600') + ' ' + String(s) + 'px system-ui, -apple-system, Segoe UI, sans-serif';
  while (s > 10 && c.measureText(String(txt)).width > maxW) {
    s--;
    c.font = (weight || '600') + ' ' + String(s) + 'px system-ui, -apple-system, Segoe UI, sans-serif';
  }
  c.fillStyle = color || '#f5f1df';
  c.textAlign = align || 'left';
  c.textBaseline = 'alphabetic';
  c.fillText(String(txt), x, y);
}

function wrapLines(c, text, maxW, size, weight) {
  c.font = (weight || '600') + ' ' + String(size) + 'px system-ui, -apple-system, Segoe UI, sans-serif';
  var words = String(text).split(/\s+/);
  var lines = [];
  var line = '';
  for (var i = 0; i < words.length; i++) {
    var test = line ? line + ' ' + words[i] : words[i];
    if (c.measureText(test).width > maxW && line) {
      lines.push(line);
      line = words[i];
    } else {
      line = test;
    }
  }
  if (line) lines.push(line);
  return lines;
}

function roundRect(c, x, y, w, h, r) {
  GF.rr(c, x, y, w, h, r);
}

function drawBackground(c) {
  var g = c.createLinearGradient(0, scene.y, 0, scene.y + scene.h);
  g.addColorStop(0, '#243b24');
  g.addColorStop(0.58, '#31472a');
  g.addColorStop(1, '#1d2b1d');
  c.fillStyle = g;
  c.fillRect(0, scene.y, GF.W, scene.h);

  c.save();
  c.lineCap = 'round';
  c.lineJoin = 'round';
  for (var i = 0; i < PATHS.length; i++) {
    if (i === 4 && night < 6) continue;
    var path = PATHS[i];
    c.beginPath();
    for (var j = 0; j < path.pts.length; j++) {
      var p = worldToScreen(path.pts[j][0], path.pts[j][1]);
      if (j === 0) c.moveTo(p.x, p.y);
      else c.lineTo(p.x, p.y);
    }
    c.strokeStyle = 'rgba(118, 91, 53, 0.78)';
    c.lineWidth = Math.max(10, 16 * scene.ui);
    c.stroke();
    c.strokeStyle = 'rgba(210, 172, 101, 0.36)';
    c.lineWidth = Math.max(3, 5 * scene.ui);
    c.stroke();
  }
  c.restore();

  drawWaterhole(c, 0.52, 0.48, 0.21, 0.13);
  if (night >= 6) drawWaterhole(c, 0.70, 0.73, 0.13, 0.08);

  for (var k = 0; k < 28; k++) {
    var x = scene.x + ((k * 73) % Math.max(1, scene.w));
    var y = scene.y + ((k * 131) % Math.max(1, scene.h));
    c.fillStyle = k % 3 === 0 ? 'rgba(95,125,63,0.35)' : 'rgba(25,54,28,0.35)';
    c.beginPath();
    c.ellipse(x, y, (5 + (k % 5) * 2) * scene.ui, (2 + (k % 4)) * scene.ui, k, 0, Math.PI * 2);
    c.fill();
  }
}

function drawWaterhole(c, x, y, w, h) {
  var p = worldToScreen(x, y);
  var rx = scene.w * w;
  var ry = scene.h * h;
  var g = c.createRadialGradient(p.x, p.y, 4, p.x, p.y, Math.max(rx, ry));
  g.addColorStop(0, '#74b9bd');
  g.addColorStop(0.62, '#397b86');
  g.addColorStop(1, '#183a44');
  c.fillStyle = 'rgba(31, 23, 13, 0.35)';
  c.beginPath();
  c.ellipse(p.x + 4 * scene.ui, p.y + 5 * scene.ui, rx * 1.08, ry * 1.16, -0.1, 0, Math.PI * 2);
  c.fill();
  c.fillStyle = g;
  c.beginPath();
  c.ellipse(p.x, p.y, rx, ry, -0.1, 0, Math.PI * 2);
  c.fill();
  c.strokeStyle = 'rgba(220,196,128,0.45)';
  c.lineWidth = Math.max(2, 3 * scene.ui);
  c.stroke();
}

function drawNodes(c) {
  for (var i = 0; i < NODES.length; i++) {
    var p = worldToScreen(NODES[i].x, NODES[i].y);
    var active = i === 0 && !tutorialDone && coachStep === 0;
    var r = NODE_RADIUS * scene.ui * (active ? 1.2 + Math.sin(coachPulse * 5) * 0.08 : 0.92);
    c.beginPath();
    c.arc(p.x, p.y, r, 0, Math.PI * 2);
    c.fillStyle = active ? 'rgba(255,226,117,0.28)' : 'rgba(255,229,153,0.15)';
    c.fill();
    c.strokeStyle = active ? '#ffe275' : 'rgba(255,229,153,0.48)';
    c.lineWidth = Math.max(2, 2.5 * scene.ui);
    c.stroke();
  }
}

function drawCone(c, cam, selected) {
  var p = worldToScreen(cam.x, cam.y);
  var range = CAMERA_RANGE * clamp(Math.min(scene.w / 440, scene.h / 560), 0.66, 1.42);
  c.save();
  c.beginPath();
  c.moveTo(p.x, p.y);
  c.arc(p.x, p.y, range, cam.angle - CONE_HALF_ANGLE, cam.angle + CONE_HALF_ANGLE);
  c.closePath();
  c.fillStyle = selected ? 'rgba(98, 197, 255, 0.19)' : 'rgba(230, 220, 130, 0.12)';
  c.fill();
  c.strokeStyle = selected ? 'rgba(125, 223, 255, 0.55)' : 'rgba(238, 220, 132, 0.33)';
  c.lineWidth = Math.max(1, 2 * scene.ui);
  c.stroke();
  c.restore();
}

function drawCamera(c, cam, idx) {
  var p = worldToScreen(cam.x, cam.y);
  var selected = idx === selectedCamera;
  c.save();
  c.translate(p.x, p.y);
  c.rotate(cam.angle);
  c.strokeStyle = selected ? '#bff3ff' : '#e8dfc0';
  c.lineWidth = Math.max(2, 3 * scene.ui);
  c.beginPath();
  c.moveTo(-8 * scene.ui, 12 * scene.ui);
  c.lineTo(0, -10 * scene.ui);
  c.lineTo(8 * scene.ui, 12 * scene.ui);
  c.stroke();
  c.fillStyle = selected ? '#d6fbff' : '#e5d5a6';
  roundRect(c, -17 * scene.ui, -13 * scene.ui, 34 * scene.ui, 22 * scene.ui, 5 * scene.ui);
  c.fill();
  c.fillStyle = '#19221b';
  c.beginPath();
  c.arc(8 * scene.ui, -2 * scene.ui, 5 * scene.ui, 0, Math.PI * 2);
  c.fill();
  c.fillStyle = SENS[cam.sens].key === 'high' ? '#ffcf6e' : SENS[cam.sens].key === 'med' ? '#86d79b' : '#8ab4ff';
  c.fillRect(-12 * scene.ui, -8 * scene.ui, 9 * scene.ui, 5 * scene.ui);
  c.restore();
  if (cam.cooldown > 0) {
    c.beginPath();
    c.arc(p.x, p.y, 24 * scene.ui, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * (cam.cooldown / CAMERA_COOLDOWN));
    c.strokeStyle = '#ff9b83';
    c.lineWidth = Math.max(2, 3 * scene.ui);
    c.stroke();
  }
  if (cam.pulse > 0) {
    c.beginPath();
    c.arc(p.x, p.y, (28 + (1 - cam.pulse) * 38) * scene.ui, 0, Math.PI * 2);
    c.strokeStyle = 'rgba(255,255,255,' + String(0.35 * cam.pulse) + ')';
    c.lineWidth = Math.max(1, 2 * scene.ui);
    c.stroke();
  }
  var label = GF.t('cam') + ' ' + String(idx + 1);
  fitText(c, label, p.x, p.y + 36 * scene.ui, 62 * scene.ui, fs(12), '#f4efd1', 'center', '700');
}

function drawAnimal(c, a) {
  var spec = SPECIES[a.species];
  var p = worldToScreen(a.x, a.y);
  var r = spec.radius * scene.ui;
  c.save();
  c.translate(p.x, p.y);
  if (a.species === 'deer') {
    c.fillStyle = spec.color;
    c.beginPath();
    c.ellipse(0, 0, r * 1.25, r * 0.72, 0, 0, Math.PI * 2);
    c.fill();
    c.fillStyle = spec.dark;
    c.beginPath();
    c.arc(r * 0.95, -r * 0.18, r * 0.48, 0, Math.PI * 2);
    c.fill();
    c.strokeStyle = '#e8c98e';
    c.lineWidth = Math.max(1, 2 * scene.ui);
    c.beginPath();
    c.moveTo(r * 1.2, -r * 0.5);
    c.lineTo(r * 1.55, -r * 1.05);
    c.moveTo(r * 1.2, -r * 0.5);
    c.lineTo(r * 1.65, -r * 0.45);
    c.stroke();
  } else if (a.species === 'boar') {
    c.fillStyle = spec.color;
    c.beginPath();
    c.ellipse(0, 0, r * 1.35, r * 0.82, 0, 0, Math.PI * 2);
    c.fill();
    c.fillStyle = spec.dark;
    c.beginPath();
    c.arc(r * 1.12, 0, r * 0.46, 0, Math.PI * 2);
    c.fill();
    c.fillStyle = '#e6d5b0';
    c.fillRect(r * 1.32, -r * 0.18, r * 0.34, r * 0.10);
  } else if (a.species === 'lizard') {
    c.fillStyle = spec.color;
    c.beginPath();
    c.ellipse(0, 0, r * 1.55, r * 0.55, 0.2, 0, Math.PI * 2);
    c.fill();
    c.strokeStyle = spec.dark;
    c.lineWidth = Math.max(1, 2 * scene.ui);
    c.beginPath();
    c.moveTo(-r * 1.5, 0);
    c.lineTo(-r * 2.3, -r * 0.4);
    c.stroke();
  } else {
    c.fillStyle = spec.color;
    c.beginPath();
    c.ellipse(0, 0, r * 1.20, r * 0.66, 0, 0, Math.PI * 2);
    c.fill();
    c.fillStyle = spec.dark;
    c.beginPath();
    c.arc(r * 0.9, -r * 0.08, r * 0.42, 0, Math.PI * 2);
    c.fill();
    c.beginPath();
    c.moveTo(r * 0.76, -r * 0.48);
    c.lineTo(r * 0.92, -r * 1.0);
    c.lineTo(r * 1.16, -r * 0.44);
    c.fill();
  }
  if (a.target) {
    c.strokeStyle = 'rgba(255,226,117,0.85)';
    c.lineWidth = Math.max(1, 2 * scene.ui);
    c.beginPath();
    c.arc(0, 0, r * 1.75, 0, Math.PI * 2);
    c.stroke();
  }
  c.restore();
}

function drawFalseObjects(c) {
  for (var i = 0; i < falseObjects.length; i++) {
    var o = falseObjects[i];
    var p = worldToScreen(o.x, o.y);
    var wob = Math.sin(nightElapsed * (o.type === 'grass' ? 3.2 : 1.1) + o.phase);
    if (o.type === 'hotrock') {
      c.fillStyle = '#7a6a54';
      c.beginPath();
      c.ellipse(p.x, p.y, FALSE_OBJECT_RADIUS * scene.ui, 11 * scene.ui, 0.2, 0, Math.PI * 2);
      c.fill();
      c.fillStyle = 'rgba(255,126,90,' + String(0.18 + Math.max(0, wob) * 0.24) + ')';
      c.beginPath();
      c.arc(p.x + 3 * scene.ui, p.y - 2 * scene.ui, 8 * scene.ui, 0, Math.PI * 2);
      c.fill();
    } else {
      c.strokeStyle = '#9abc67';
      c.lineWidth = Math.max(2, 3 * scene.ui);
      c.beginPath();
      for (var j = 0; j < 5; j++) {
        var a = -0.8 + j * 0.4 + wob * 0.16;
        c.moveTo(p.x, p.y + 10 * scene.ui);
        c.lineTo(p.x + Math.sin(a) * 16 * scene.ui, p.y - 14 * scene.ui);
      }
      c.stroke();
    }
  }
}

function drawFlashes(c) {
  for (var i = 0; i < flashes.length; i++) {
    var f = flashes[i];
    var p = worldToScreen(f.x, f.y);
    c.fillStyle = 'rgba(255,255,230,' + String(clamp(f.life * 2.7, 0, 0.6)) + ')';
    c.beginPath();
    c.arc(p.x, p.y, (32 + (0.28 - f.life) * 150) * scene.ui, 0, Math.PI * 2);
    c.fill();
  }
}

function drawHUD(c) {
  var ui = scene.ui;
  var narrow = GF.W < 520;
  c.fillStyle = '#111a12';
  c.fillRect(0, 0, GF.W, scene.top);
  c.fillStyle = '#19261b';
  c.fillRect(0, scene.y + scene.h, GF.W, scene.bottom);
  c.strokeStyle = 'rgba(255,255,255,0.08)';
  c.lineWidth = 1;
  c.beginPath();
  c.moveTo(0, scene.top - 0.5);
  c.lineTo(GF.W, scene.top - 0.5);
  c.moveTo(0, scene.y + scene.h + 0.5);
  c.lineTo(GF.W, scene.y + scene.h + 0.5);
  c.stroke();

  var quotaText = GF.t('quota') + ' ' + String(quotaDone) + '/' + String(quotaTarget);
  if (narrow) {
    fitText(c, GF.t('title'), 10 * ui, 20 * ui, GF.W - 112 * ui, fs(16), '#f8edc8', 'left', '800');
    fitText(c, GF.t('night') + ' ' + String(night) + '  ' + GF.t('score') + ' ' + String(score), 10 * ui, 43 * ui, GF.W - 20 * ui, fs(12), '#d9e3c6', 'left', '700');
    var compact = GF.t('film') + ' ' + String(Math.max(0, film)) + '  ' + GF.t('battery') + ' ' + String(Math.round(battery)) + '%  ' + GF.t('missed') + ' ' + String(missed) + '/' + String(MAX_MISSED);
    fitText(c, compact, GF.cx, 64 * ui, GF.W - 20 * ui, fs(11), missed >= 2 || battery < 25 ? '#ffbba5' : '#dce8c9', 'center', '750');
    fitText(c, quotaText, GF.cx, 84 * ui, GF.W - 20 * ui, fs(14), '#f4dd8a', 'center', '800');
    fitText(c, targetSummary(), GF.cx, 103 * ui, GF.W - 20 * ui, fs(10), '#d8d3b4', 'center', '650');
  } else {
    drawText(c, GF.t('title'), 12 * ui, 23 * ui, fs(16), '#f8edc8', 'left', '800');
    fitText(c, GF.t('night') + ' ' + String(night) + '  ' + GF.t('score') + ' ' + String(score), 12 * ui, 46 * ui, Math.max(120, GF.W * 0.34), fs(13), '#d9e3c6', 'left', '700');

    fitText(c, quotaText, GF.cx, 24 * ui, Math.max(110, GF.W * 0.30), fs(15), '#f4dd8a', 'center', '800');
    fitText(c, targetSummary(), GF.cx, 48 * ui, Math.max(140, GF.W * 0.44), fs(12), '#d8d3b4', 'center', '650');

    var rightX = GF.W - 94 * ui;
    fitText(c, GF.t('film') + ' ' + String(Math.max(0, film)), rightX, 25 * ui, 86 * ui, fs(12), '#f1ddcb', 'right', '700');
    fitText(c, GF.t('battery') + ' ' + String(Math.round(battery)) + '%', rightX, 46 * ui, 92 * ui, fs(12), battery < 25 ? '#ff9b83' : '#d1efcf', 'right', '700');
    fitText(c, GF.t('missed') + ' ' + String(missed) + '/' + String(MAX_MISSED), rightX, 67 * ui, 92 * ui, fs(12), missed >= 2 ? '#ff9b83' : '#e8d6b8', 'right', '700');
  }

  drawIconButton(c, uiRects.help, GF.t('help_btn'));
  GF.drawMuteIcon(c, uiRects.mute.x + uiRects.mute.w / 2, uiRects.mute.y + uiRects.mute.h / 2, uiRects.mute.w * 0.48, GF.muted);

  var cam = cameras[selectedCamera] || cameras[0];
  var status = cam && cam.cooldown > 0 ? GF.t('cool') : GF.t('ready');
  var bottomY = scene.y + scene.h;
  var camText = GF.t('cam') + ' ' + String(selectedCamera + 1) + '  ' + GF.t('sens') + ' ' + sensLabel(cam ? cam.sens : 0);
  fitText(c, camText, 12 * ui, bottomY + 26 * ui, Math.max(150, GF.W * 0.48), fs(14), '#eef6d0', 'left', '800');
  fitText(c, GF.t('moves') + ' ' + String(movesLeft) + '  ' + status, 12 * ui, bottomY + 49 * ui, Math.max(150, GF.W * 0.48), fs(12), movesLeft <= 1 ? '#ffbd8a' : '#b8d4b1', 'left', '700');

  drawPhotoStrip(c, bottomY, ui);
}

function drawIconButton(c, r, label) {
  c.fillStyle = 'rgba(238,231,194,0.10)';
  roundRect(c, r.x, r.y, r.w, r.h, 8 * scene.ui);
  c.fill();
  c.strokeStyle = 'rgba(238,231,194,0.34)';
  c.lineWidth = 1;
  c.stroke();
  drawText(c, label, r.x + r.w / 2, r.y + r.h * 0.68, fs(18), '#f4efd1', 'center', '800');
}

function drawPhotoStrip(c, bottomY, ui) {
  var startX = Math.max(160 * ui, GF.W * 0.48);
  var count = GF.W < 420 ? 2 : 3;
  var gap = 7 * ui;
  var available = Math.max(90 * ui, GF.W - startX - 12 * ui - gap * (count - 1));
  var cardW = clamp(available / count, 58 * ui, 118 * ui);
  var cardH = 54 * ui;
  for (var i = 0; i < count; i++) {
    var x = startX + i * (cardW + gap);
    var y = bottomY + 14 * ui;
    var photo = photos[i];
    c.fillStyle = photo ? (photo.good ? '#eadfb7' : '#dac0a8') : 'rgba(234,223,183,0.10)';
    roundRect(c, x, y, cardW, cardH, 7 * ui);
    c.fill();
    c.strokeStyle = photo ? 'rgba(36,31,22,0.35)' : 'rgba(234,223,183,0.20)';
    c.stroke();
    if (!photo) continue;
    c.fillStyle = photo.good ? '#21321e' : '#4b2a22';
    var label = SPECIES[photo.kind] ? tSpecies(photo.kind) : GF.t(photo.kind);
    fitText(c, label, x + cardW / 2, y + 21 * ui, cardW - 8 * ui, fs(11), c.fillStyle, 'center', '800');
    var pts = photo.pts > 0 ? '+' + String(photo.pts) : String(photo.pts);
    fitText(c, pts, x + cardW / 2, y + 41 * ui, cardW - 8 * ui, fs(12), photo.good ? '#1b5130' : '#8e3328', 'center', '800');
  }
}

function drawCoach(c) {
  if (tutorialDone || screenshotMode || coachStep > 4) return;
  var key = ['coach_drag', 'coach_aim', 'coach_deer', 'coach_high', 'coach_rocks'][coachStep] || 'coach_drag';
  var ui = scene.ui;
  var w = Math.min(GF.W - 24 * ui, 430 * ui);
  var size = fs(13);
  var lines = wrapLines(c, GF.t(key), w - 28 * ui, size, '750');
  var h = 25 * ui + lines.length * (size + 4 * ui);
  var x = 12 * ui;
  var y = scene.y + scene.h - h - 12 * ui;
  c.fillStyle = 'rgba(13,20,15,0.86)';
  roundRect(c, x, y, w, h, 8 * ui);
  c.fill();
  c.strokeStyle = 'rgba(255,226,117,0.52)';
  c.lineWidth = Math.max(1, 2 * ui);
  c.stroke();
  for (var i = 0; i < lines.length; i++) {
    drawText(c, lines[i], x + 14 * ui, y + 24 * ui + i * (size + 4 * ui), size, '#fff0b6', 'left', '750');
  }
  drawCoachTarget(c);
}

function drawCoachTarget(c) {
  var p;
  if (coachStep === 0) p = worldToScreen(NODES[0].x, NODES[0].y);
  else if (coachStep === 1 || coachStep === 2) p = worldToScreen(cameras[0].x, cameras[0].y);
  else if (coachStep === 3) p = worldToScreen(cameras[1].x, cameras[1].y);
  else p = worldToScreen(falseObjects[0] ? falseObjects[0].x : 0.70, falseObjects[0] ? falseObjects[0].y : 0.32);
  var r = (32 + Math.sin(coachPulse * 6) * 5) * scene.ui;
  c.strokeStyle = 'rgba(255,226,117,0.95)';
  c.lineWidth = Math.max(2, 3 * scene.ui);
  c.beginPath();
  c.arc(p.x, p.y, r, 0, Math.PI * 2);
  c.stroke();
}

function drawHelp(c) {
  if (!helpOpen) return;
  var ui = scene.ui;
  var w = Math.min(GF.W - 28 * ui, 520 * ui);
  var x = (GF.W - w) / 2;
  var y = Math.max(12 * ui, scene.y + 10 * ui);
  var size = fs(13);
  var entries = [
    ['tut_goal', '#f4df99'],
    ['tut_controls', '#dfebd4'],
    ['tut_win', '#d5f0c2'],
    ['tut_lose', '#ffbeaa'],
    ['tut_tip', '#d6e4ff']
  ];
  var lineData = [];
  var total = 48 * ui;
  for (var i = 0; i < entries.length; i++) {
    var lines = wrapLines(c, GF.t(entries[i][0]), w - 28 * ui, size, '650');
    lineData.push({ lines: lines, color: entries[i][1] });
    total += lines.length * (size + 4 * ui) + 9 * ui;
  }
  total += 56 * ui;
  if (total > GF.H - 24 * ui) {
    y = 12 * ui;
    total = GF.H - 24 * ui;
  }
  c.fillStyle = 'rgba(10,16,13,0.94)';
  roundRect(c, x, y, w, total, 8 * ui);
  c.fill();
  c.strokeStyle = 'rgba(238,231,194,0.35)';
  c.stroke();
  drawText(c, GF.t('help_title'), x + 16 * ui, y + 29 * ui, fs(17), '#f8edc8', 'left', '800');
  var yy = y + 58 * ui;
  for (var j = 0; j < lineData.length; j++) {
    for (var k = 0; k < lineData[j].lines.length; k++) {
      drawText(c, lineData[j].lines[k], x + 16 * ui, yy, size, lineData[j].color, 'left', '650');
      yy += size + 4 * ui;
    }
    yy += 9 * ui;
  }
  uiRects.helpClose = { x: GF.cx - 70 * ui, y: y + total - 48 * ui, w: 140 * ui, h: 34 * ui };
  c.fillStyle = '#e6d68c';
  roundRect(c, uiRects.helpClose.x, uiRects.helpClose.y, uiRects.helpClose.w, uiRects.helpClose.h, 8 * ui);
  c.fill();
  fitText(c, GF.t('close'), GF.cx, uiRects.helpClose.y + 23 * ui, uiRects.helpClose.w - 12 * ui, fs(13), '#1b2116', 'center', '800');
}

function drawGameOver(c) {
  if (gs !== 'GAMEOVER') return;
  var ui = scene.ui;
  c.fillStyle = 'rgba(8, 12, 10, 0.82)';
  c.fillRect(0, 0, GF.W, GF.H);
  drawText(c, GF.t('gameover'), GF.cx, GF.cy - 72 * ui, fs(25), '#ffdfbd', 'center', '850');
  fitText(c, GF.t(gameOverReason), GF.cx, GF.cy - 38 * ui, Math.min(GF.W - 30 * ui, 430 * ui), fs(14), '#f1c1b4', 'center', '700');
  fitText(c, GF.t('score') + ' ' + String(score) + '  ' + GF.t('best') + ' ' + String(best), GF.cx, GF.cy - 8 * ui, Math.min(GF.W - 30 * ui, 430 * ui), fs(14), '#e4eed2', 'center', '750');
  var journal = journalText();
  fitText(c, GF.t('journal') + ': ' + journal, GF.cx, GF.cy + 23 * ui, Math.min(GF.W - 30 * ui, 430 * ui), fs(12), '#cedabf', 'center', '650');
  var r = uiRects.retry;
  c.fillStyle = '#e9d77a';
  roundRect(c, r.x, r.y, r.w, r.h, 8 * ui);
  c.fill();
  c.strokeStyle = 'rgba(255,255,255,0.28)';
  c.stroke();
  fitText(c, GF.t('retry'), GF.cx, r.y + 29 * ui, r.w - 12 * ui, fs(15), '#172014', 'center', '850');
}

function journalText() {
  var names = [];
  var keys = ['deer', 'boar', 'lizard', 'cat'];
  for (var i = 0; i < keys.length; i++) if (speciesSeen[keys[i]]) names.push(tSpecies(keys[i]));
  return names.length ? names.join(', ') : GF.t('species_none');
}

function drawCompleteBanner(c) {
  if (nightCompleteTimer <= 0 || gs !== 'PLAYING') return;
  var ui = scene.ui;
  var a = clamp(nightCompleteTimer / NIGHT_COMPLETE_DELAY, 0, 1);
  var y = scene.y + scene.h * 0.26;
  c.fillStyle = 'rgba(13,20,15,' + String(0.78 * a) + ')';
  roundRect(c, GF.cx - 150 * ui, y - 34 * ui, 300 * ui, 68 * ui, 8 * ui);
  c.fill();
  fitText(c, GF.t('next_night') + ' ' + String(night), GF.cx, y + 6 * ui, 270 * ui, fs(20), '#f7df87', 'center', '850');
}

function draw(c) {
  layout();
  c.clearRect(0, 0, GF.W, GF.H);
  drawBackground(c);
  drawFalseObjects(c);
  drawNodes(c);
  for (var i = 0; i < cameras.length; i++) drawCone(c, cameras[i], i === selectedCamera);
  for (var a = 0; a < animals.length; a++) drawAnimal(c, animals[a]);
  drawFlashes(c);
  for (var j = 0; j < cameras.length; j++) drawCamera(c, cameras[j], j);
  drawHUD(c);
  drawCompleteBanner(c);
  drawCoach(c);
  drawHelp(c);
  drawGameOver(c);
}

function botPlaceBest() {
  var cam = cameras[selectedCamera];
  var node = selectedCamera === 0 ? 0 : selectedCamera === 1 ? 3 : (night >= 5 ? 5 : 2);
  cam.x = NODES[node].x;
  cam.y = NODES[node].y;
  cam.node = node;
  cam.angle = selectedCamera === 0 ? 0.72 : selectedCamera === 1 ? -0.95 : -2.82;
  if (movesLeft > 0) movesLeft--;
  cameraMovedFlag = true;
}

function botActions() {
  if (gs === 'GAMEOVER') return ['retry'];
  var a = ['wait', 'place_best', 'aim_water', 'cycle_sensitivity'];
  if (selectedCamera < CAMERA_COUNT - 1) a.push('next_camera');
  else a.push('first_camera');
  if (night < 6) a.push('jump_late');
  return a;
}

function botAct(action) {
  if (action === 'retry') { startGame(); return true; }
  if (action === 'wait') { window.advanceTime(1200); return true; }
  if (action === 'place_best') { botPlaceBest(); return true; }
  if (action === 'aim_water') {
    var cam = cameras[selectedCamera];
    var target = selectedCamera === 2 && night >= 5 ? { x: 0.20, y: 0.38 } : { x: 0.52, y: 0.48 };
    cam.angle = Math.atan2((target.y - cam.y) * scene.h, (target.x - cam.x) * scene.w);
    cameraAimedFlag = true;
    return true;
  }
  if (action === 'cycle_sensitivity') { cycleSensitivity(selectedCamera); return true; }
  if (action === 'next_camera') { selectedCamera = Math.min(CAMERA_COUNT - 1, selectedCamera + 1); return true; }
  if (action === 'first_camera') { selectedCamera = 0; return true; }
  if (action === 'jump_late') { setupForScreenshot(6); return true; }
  return false;
}

function stateObject() {
  return {
    gs: gs,
    score: score,
    best: best,
    night: night,
    film: film,
    battery: Math.round(battery),
    quotaDone: quotaDone,
    quotaTarget: quotaTarget,
    missed: missed,
    movesLeft: movesLeft,
    speciesSeen: Object.keys(speciesSeen).filter(function(k) { return speciesSeen[k]; }),
    animals: animals.length,
    photos: photos.length,
    selectedCamera: selectedCamera,
    sensitivity: cameras[selectedCamera] ? SENS[cameras[selectedCamera].sens].key : 'med'
  };
}

function renderText() {
  var s = stateObject();
  var cams = cameras.map(function(cam, i) {
    return String(i + 1) + ':' + SENS[cam.sens].key + '@' + Math.round(cam.x * 100) + ',' + Math.round(cam.y * 100);
  }).join(' ');
  var targets = targetSummary();
  return [
    GF.t('title') + ' ' + s.gs,
    GF.t('night') + ' ' + String(s.night) + ' ' + GF.t('score') + ' ' + String(s.score),
    GF.t('quota') + ' ' + String(s.quotaDone) + '/' + String(s.quotaTarget) + ' ' + GF.t('film') + ' ' + String(s.film) + ' ' + GF.t('battery') + ' ' + String(s.battery) + ' ' + GF.t('missed') + ' ' + String(s.missed),
    GF.t('target') + ' ' + targets,
    GF.t('cam') + ' ' + cams,
    GF.t('journal') + ' ' + journalText()
  ].join('\n');
}

function setupForScreenshot(level) {
  screenshotMode = true;
  tutorialDone = true;
  coachStep = 99;
  helpOpen = false;
  gs = 'PLAYING';
  score = 620 + Math.max(0, level || 4) * 120;
  resetCameras();
  startNight(Math.max(1, level || 5));
  cameras[0].x = NODES[0].x; cameras[0].y = NODES[0].y; cameras[0].node = 0; cameras[0].angle = 0.72;
  cameras[1].x = NODES[3].x; cameras[1].y = NODES[3].y; cameras[1].node = 3; cameras[1].angle = -0.95; cameras[1].sens = 2;
  cameras[2].x = NODES[5].x; cameras[2].y = NODES[5].y; cameras[2].node = 5; cameras[2].angle = -0.25;
  spawnAnimal('deer', 0);
  spawnAnimal('boar', 1);
  spawnAnimal('lizard', 2);
  if (night >= 5) spawnAnimal('cat', 3);
  photos = [
    { kind: 'deer', pts: 145, good: true, age: 1 },
    { kind: 'lizard', pts: 210, good: true, age: 2 },
    { kind: 'photo_grass', pts: -12, good: false, age: 2.7 }
  ];
  speciesSeen.deer = true;
  speciesSeen.lizard = true;
}

window._jumpLevel = function(n) { setupForScreenshot(Number(n) || 5); };
window._setupForScreenshot = function(level) { setupForScreenshot(Number(level) || 5); };
window.advanceTime = function(ms) {
  var total = Math.max(0, Number(ms) || 0);
  var step = 1 / 30;
  var count = Math.ceil(total / 1000 / step);
  for (var i = 0; i < count; i++) update(step);
  return stateObject();
};
// Browser-game-QA reads render_game_to_text as JSON; return the structured state
// object (the same one exposed via GF.exposeState) rather than the human-readable
// renderText string. Pure format change, no gameplay logic touched.
window.render_game_to_text = function () { return JSON.stringify(stateObject()); };

calcPathLengths();
GF.canvas.addEventListener('pointerdown', onPointerDown, { passive: false });
GF.canvas.addEventListener('pointermove', onPointerMove, { passive: false });
GF.canvas.addEventListener('pointerup', onPointerUp, { passive: false });
GF.canvas.addEventListener('pointercancel', onPointerUp, { passive: false });
document.addEventListener('keydown', onKeyDown);

GF.exposeState(stateObject);
GF.exposeBot(botActions, botAct);
GF.exposeReach(function() {
  layout();
  var items = [
    { id: 'help', x: uiRects.help.x, y: uiRects.help.y, w: uiRects.help.w, h: uiRects.help.h, pinned: true },
    { id: 'mute', x: uiRects.mute.x, y: uiRects.mute.y, w: uiRects.mute.w, h: uiRects.mute.h, pinned: true }
  ];
  for (var i = 0; i < cameras.length; i++) {
    var p = worldToScreen(cameras[i].x, cameras[i].y);
    items.push({
      id: 'camera_' + String(i + 1),
      x: p.x - 28 * scene.ui,
      y: p.y - 28 * scene.ui,
      w: 56 * scene.ui,
      h: 56 * scene.ui
    });
  }
  if (gs === 'GAMEOVER') items.push({ id: 'retry', x: uiRects.retry.x, y: uiRects.retry.y, w: uiRects.retry.w, h: uiRects.retry.h, pinned: true });
  if (helpOpen) items.push({ id: 'help_close', x: uiRects.helpClose.x, y: uiRects.helpClose.y, w: uiRects.helpClose.w, h: uiRects.helpClose.h, pinned: true });
  return { screen: helpOpen ? 'help' : gs, viewportW: GF.W, viewportH: GF.H, screenH: GF.H, scrollMaxY: 0, items: items };
});
GF.exposeTour([
  { name: 'play', go: function() { if (gs !== 'PLAYING') startGame({ suppressTutorial: true }); helpOpen = false; } },
  { name: 'help', go: function() { if (gs !== 'PLAYING') startGame({ suppressTutorial: true }); helpOpen = true; } },
  { name: 'gameover', go: function() { gameOver('reason_missed'); helpOpen = false; } }
]);

GF.init({
  designW: 440,
  designH: 760,
  strings: STRINGS,
  saveKey: 'trailcam_ranger',
  onReady: function() {
    GF.persist('trailcam_ranger_meta_v1', getMeta, applyMeta);
    GF.bgMusic({ file: 'audio/bg_track.mp3', preset: 'tense', muted: GF.muted });
    if (!started) {
      started = true;
      startGame({ suppressTutorial: !!(window.__GF_AUTOSTART && !window._silent) });
    }
  },
  onUpdate: update,
  onDraw: draw
});

})();
</script>
</body>
</html>
