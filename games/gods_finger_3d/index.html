<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>God's Finger 3D: Destruction</title>
  <!-- PLATFORM_SDK -->
  <script src="/sdk.js"></script>
  <script src="./three.min.js"></script>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0c0814; position: fixed; touch-action: none; overscroll-behavior: none; font-family: 'Inter', system-ui, sans-serif; }
    #c3d { display: block; position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
    #c { display: block; position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; pointer-events: auto; background: transparent; }
  </style>
</head>
<body>
<canvas id="c3d"></canvas>
<canvas id="c"></canvas>
<script src="./gf-lib.js"></script>
<script>
(function() {
'use strict';

// ── COMPLIANCE ──
window.GF.exposeReach = function() {
  return typeof platformSafeInsets === 'function' ? platformSafeInsets() : { top: 0, bottom: 0, left: 0, right: 0 };
};

var isAudioMuted = false;
function muteAudio() { isAudioMuted = true; }
function unmuteAudio() { isAudioMuted = false; }
window.GF.pauseAudio = muteAudio;
window.GF.resumeAudio = unmuteAudio;
document.addEventListener('visibilitychange', function() {
  document.hidden ? muteAudio() : unmuteAudio();
});
try {
  if (window.ysdk) {
    window.ysdk.on('game_api_pause', muteAudio);
    window.ysdk.on('game_api_resume', unmuteAudio);
  }
} catch (e) {}

var lang = (navigator.language || 'en').slice(0, 2);
var dict = {
  en: { title: "GOD'S FINGER 3D", tap: "TAP ANYWHERE TO DESTROY", score: "SCORE: ", p: "+15" },
  ru: { title: "ПАЛЕЦ БОГА 3Д", tap: "НАЖМИТЕ ДЛЯ РАЗРУШЕНИЯ", score: "СЧЕТ: ", p: "+15" }
};
function t(k) { return (dict[lang] || dict.en)[k] || k; }

// ── THREE.JS ENGINE ──
var scene, camera, renderer, ground;
var blocks = [], floats = [];
var fX = 0, fY = 60, fZ = 0;
var targetFX = 0, targetFY = 60, targetFZ = 0;
var isPressing = false;
var fingerGroup;
var cameraTarget = new THREE.Vector3(0, 0, 0);
var score = 0;
var gs = 'MENU';
var currentShake = 0;

// Geometries & Materials (Cached)
var geoMap = {};
function getGeo(s) {
  if(!geoMap[s]) geoMap[s] = new THREE.BoxGeometry(s, s, s);
  return geoMap[s];
}
var matMap = {};
function getMat(c) {
  if(!matMap[c]) matMap[c] = new THREE.MeshStandardMaterial({color: c, roughness: 0.7, metalness: 0.1});
  return matMap[c];
}

function init3D() {
  var c3d = document.getElementById('c3d');
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x1a122e);
  scene.fog = new THREE.FogExp2(0x1a122e, 0.003);

  camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
  camera.position.set(0, 180, 160);
  camera.lookAt(0, 0, 0);

  renderer = new THREE.WebGLRenderer({ canvas: c3d, antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;

  var hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 0.6);
  scene.add(hemiLight);

  var dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
  dirLight.position.set(100, 200, 50);
  dirLight.castShadow = true;
  dirLight.shadow.mapSize.width = 2048;
  dirLight.shadow.mapSize.height = 2048;
  dirLight.shadow.camera.left = -200;
  dirLight.shadow.camera.right = 200;
  dirLight.shadow.camera.top = 200;
  dirLight.shadow.camera.bottom = -200;
  scene.add(dirLight);

  // Ground
  var gMat = new THREE.MeshStandardMaterial({ color: 0x241d3b, roughness: 0.9 });
  var gGeo = new THREE.PlaneGeometry(1000, 1000);
  ground = new THREE.Mesh(gGeo, gMat);
  ground.rotation.x = -Math.PI / 2;
  ground.receiveShadow = true;
  scene.add(ground);

  // Finger
  fingerGroup = new THREE.Group();
  var fMat = new THREE.MeshStandardMaterial({ color: 0xffd700, roughness: 0.2, metalness: 0.8, emissive: 0x332200 });
  var arm = new THREE.Mesh(new THREE.CylinderGeometry(5, 4, 80, 16), fMat);
  arm.position.y = 40;
  arm.castShadow = true;
  var tip = new THREE.Mesh(new THREE.SphereGeometry(4, 16, 16), fMat);
  tip.position.y = 0;
  tip.castShadow = true;
  fingerGroup.add(arm);
  fingerGroup.add(tip);
  
  // Disable raycast on finger so we don't click it
  fingerGroup.traverse(function(child) { if (child.isMesh) child.raycast = function() {}; });
  scene.add(fingerGroup);

  window.addEventListener('resize', function() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
}

function createBlock(x, y, z, s, col, isStatic) {
  var mesh = new THREE.Mesh(getGeo(s), getMat(col));
  mesh.position.set(x, y, z);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  scene.add(mesh);
  var b = {
    mesh: mesh, size: s, color: col, isStatic: isStatic, hp: 2,
    vx: 0, vy: 0, vz: 0, rx: 0, ry: 0, rz: 0
  };
  blocks.push(b);
  return b;
}

function buildCity() {
  blocks.forEach(function(b) { scene.remove(b.mesh); });
  blocks = [];
  var colors = [0xef476f, 0xf78c6b, 0xffd166, 0x06d6a0, 0x118ab2, 0x073b4c];
  
  for (var x = -5; x <= 5; x++) {
    for (var z = -5; z <= 5; z++) {
      if (Math.random() < 0.3) continue;
      if (Math.abs(x) < 1 && Math.abs(z) < 1) continue; // Clear center
      
      var px = x * 22;
      var pz = z * 22;
      var floors = 2 + Math.floor(Math.random() * 5);
      var col = colors[Math.floor(Math.random() * colors.length)];
      
      // Building base
      createBlock(px, 5, pz, 10, 0x555555, true).hp = 4;
      
      for (var f = 1; f <= floors; f++) {
         createBlock(px, 5 + f * 10, pz, 10, col, true);
      }
    }
  }
}

function shatterBlock(b, index) {
  scene.remove(b.mesh);
  blocks.splice(index, 1);
  if (b.size <= 5) return; // Don't shatter small debris
  
  var s = b.size / 2;
  var offsets = [
    [-s/2, -s/2, -s/2], [s/2, -s/2, -s/2], [-s/2, s/2, -s/2], [s/2, s/2, -s/2],
    [-s/2, -s/2, s/2], [s/2, -s/2, s/2], [-s/2, s/2, s/2], [s/2, s/2, s/2]
  ];
  offsets.forEach(function(off) {
     var nb = createBlock(
       b.mesh.position.x + off[0],
       b.mesh.position.y + off[1],
       b.mesh.position.z + off[2],
       s, b.color, false
     );
     nb.vx = b.vx * 0.4 + off[0] * (Math.random() * 6);
     nb.vy = b.vy * 0.4 + Math.random() * 20;
     nb.vz = b.vz * 0.4 + off[2] * (Math.random() * 6);
     nb.rx = (Math.random() - 0.5) * 15;
     nb.ry = (Math.random() - 0.5) * 15;
     nb.rz = (Math.random() - 0.5) * 15;
     nb.life = 1.5 + Math.random(); 
  });
  
  score += 15;
  currentShake = Math.max(currentShake, 0.6);
  floats.push({ pos: b.mesh.position.clone(), text: t('p'), y: 0, life: 1.0, color: '#00ff7f' });
}

function updatePhysics(dt) {
  var fPos = fingerGroup.position;
  var fRadius = 8;
  
  for (var i = blocks.length - 1; i >= 0; i--) {
     var b = blocks[i];
     
     // Finger Collision (Cylindrical intersection for downward smash)
     var dx = b.mesh.position.x - fPos.x;
     var dz = b.mesh.position.z - fPos.z;
     var distSq2D = dx*dx + dz*dz;
     var minDist = fRadius + b.size/2 + 2;
     
     if (distSq2D < minDist*minDist && fPos.y <= b.mesh.position.y + b.size/2) {
        b.isStatic = false;
        var dist = Math.sqrt(distSq2D) || 0.1;
        var dy = b.mesh.position.y - fPos.y;
        var force = (minDist - dist) * 25;
        b.vx += (dx/dist) * force;
        b.vy += Math.abs(dy/dist) * force + 15;
        b.vz += (dz/dist) * force;
        b.rx += (Math.random() - 0.5) * force;
        b.rz += (Math.random() - 0.5) * force;
        
        b.hp -= 1;
        if (b.hp <= 0 && b.size > 5) {
           shatterBlock(b, i);
           continue;
        } else {
           // Visual damage deformation
           b.mesh.scale.multiplyScalar(0.85);
           b.mesh.material = b.mesh.material.clone();
           b.mesh.material.color.lerp(new THREE.Color(0x111111), 0.4);
           currentShake = Math.max(currentShake, 0.25);
        }
     }
     
     // Dynamics Integration
     if (!b.isStatic) {
        b.vy -= 180 * dt; // Gravity
        b.mesh.position.x += b.vx * dt;
        b.mesh.position.y += b.vy * dt;
        b.mesh.position.z += b.vz * dt;
        
        b.mesh.rotation.x += b.rx * dt;
        b.mesh.rotation.y += b.ry * dt;
        b.mesh.rotation.z += b.rz * dt;
        
        // Ground Collision Bounce
        if (b.mesh.position.y < b.size/2) {
           b.mesh.position.y = b.size/2;
           b.vy *= -0.4;
           b.vx *= 0.65;
           b.vz *= 0.65;
           b.rx *= 0.65;
           b.rz *= 0.65;
           if (Math.abs(b.vy) < 8) b.vy = 0;
        }
        
        // Despawn / Sleep Logic
        if (b.life !== undefined) {
           b.life -= dt;
           if (b.life <= 0) {
              scene.remove(b.mesh);
              blocks.splice(i, 1);
              continue;
           } else {
              var s = Math.max(0.01, Math.min(1, b.life));
              b.mesh.scale.set(s, s, s);
           }
        } else if (Math.abs(b.vx) < 1 && Math.abs(b.vz) < 1 && b.mesh.position.y <= b.size/2 + 0.1) {
           b.isStatic = true;
           b.vx = 0; b.vy = 0; b.vz = 0;
           b.rx = 0; b.ry = 0; b.rz = 0;
        }
     }
  }
}

function updatePointer(e) {
  if (gs !== 'PLAYING') return;
  var rect = GF.canvas.getBoundingClientRect();
  var nx = ((e.clientX - rect.left) / rect.width) * 2 - 1;
  var ny = -((e.clientY - rect.top) / rect.height) * 2 + 1;
  
  var raycaster = new THREE.Raycaster();
  raycaster.setFromCamera(new THREE.Vector2(nx, ny), camera);
  
  // Intersect with absolute mathematical ground plane (y=0) to sweep accurately
  var plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
  var target = new THREE.Vector3();
  raycaster.ray.intersectPlane(plane, target);
  
  if (target) {
     targetFX = target.x;
     targetFZ = target.z;
  }
}

// ── INIT & GAME LOOP ──
GF.init({
  designW: 800, designH: 600,
  onReady: function() {
    init3D();
    buildCity();
    
    // Bind universal input directly to the canvas
    var onDown = function(e) {
      if (gs === 'MENU') {
         gs = 'PLAYING';
         score = 0;
         buildCity();
         return;
      }
      isPressing = true;
      targetFY = 0;
      updatePointer(e);
    };
    var onMove = function(e) { if (isPressing) updatePointer(e); };
    var onUp = function(e) { isPressing = false; targetFY = 60; };

    GF.canvas.addEventListener('pointerdown', onDown);
    GF.canvas.addEventListener('pointermove', onMove);
    window.addEventListener('pointerup', onUp);
    
    // Autostart compliance
    if (window.__GF_AUTOSTART && !window._silent) {
       gs = 'PLAYING';
       buildCity();
    }
  },
  onUpdate: function(dt) {
    if (dt > 0.1) dt = 0.1;
    if (gs !== 'PLAYING') return;
    
    // Fluid Finger Interpolation (Inertia & Weight)
    var lastFX = fX, lastFZ = fZ;
    fX += (targetFX - fX) * 0.35;
    fZ += (targetFZ - fZ) * 0.35;
    fY += (targetFY - fY) * (isPressing ? 0.45 : 0.15);
    fingerGroup.position.set(fX, fY, fZ);
    
    // Procedural Finger Sway based on velocity
    var velX = (fX - lastFX) / dt;
    var velZ = (fZ - lastFZ) / dt;
    fingerGroup.rotation.z = -velX * 0.0025;
    fingerGroup.rotation.x = velZ * 0.0025;
    
    // Smooth Camera Follow & Shake
    cameraTarget.x += (fX - cameraTarget.x) * 0.05;
    cameraTarget.z += (fZ - cameraTarget.z) * 0.05;
    
    currentShake = Math.max(0, currentShake - dt * 2.5);
    var sx = (Math.random() - 0.5) * currentShake * 10;
    var sy = (Math.random() - 0.5) * currentShake * 10;
    var sz = (Math.random() - 0.5) * currentShake * 10;
    
    camera.position.set(cameraTarget.x + sx, 160 + sy, cameraTarget.z + 140 + sz);
    camera.lookAt(cameraTarget.x, 0, cameraTarget.z);
    
    updatePhysics(dt);
  },
  onDraw: function(ctx, dt) {
    if (renderer && scene && camera) {
      renderer.render(scene, camera);
    }
    
    // Render 2D UI Overlays
    var w = GF.W, h = GF.H, s = GF.S;
    ctx.clearRect(0, 0, w, h);
    
    if (gs === 'MENU') {
      ctx.fillStyle = 'rgba(12, 8, 20, 0.75)';
      ctx.fillRect(0, 0, w, h);
      ctx.textAlign = 'center';
      ctx.fillStyle = '#fff';
      ctx.font = '900 ' + (48*s) + 'px sans-serif';
      ctx.fillText(t('title'), w/2, h/2 - 20*s);
      
      ctx.fillStyle = '#ffd700';
      ctx.font = 'bold ' + (16*s) + 'px sans-serif';
      ctx.fillText(t('tap'), w/2, h/2 + 20*s);
    } else if (gs === 'PLAYING') {
      ctx.textAlign = 'left';
      ctx.fillStyle = '#fff';
      ctx.font = '900 ' + (24*s) + 'px sans-serif';
      ctx.fillText(t('score') + score, 20*s, 40*s);
      
      // Render Projected 3D Floating Texts
      for (var i = floats.length - 1; i >= 0; i--) {
        var f = floats[i];
        f.life -= dt;
        f.y -= 30 * dt;
        if (f.life <= 0) { floats.splice(i, 1); continue; }
        
        var p = f.pos.clone();
        p.y += 15;
        p.project(camera);
        var px = (p.x * 0.5 + 0.5) * w;
        var py = (-p.y * 0.5 + 0.5) * h;
        
        ctx.save();
        ctx.globalAlpha = Math.max(0, f.life);
        ctx.fillStyle = f.color;
        ctx.font = 'bold ' + (18*s) + 'px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(f.text, px, py + f.y);
        ctx.restore();
      }
    }
  }
});

})();
</script>
</body>
</html>
