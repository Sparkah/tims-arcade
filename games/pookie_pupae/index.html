// Species album: 12 distinct pookies, gated by tier. color + pattern + name.
var SPECIES = [

// ── GAME STATE ───────────────────────────────────────────────────────────
var gs = 'MENU';                  // MENU | PLAYING | GAMEOVER

var best = 0;
var joy = T.JOY_START;
var food = 10;
var pookies = 0;                  // total hatched
var gardenLevel = 1;
var tier = 1;
var hatchesThisLevel = 0;
var slots = T.SLOTS_BASE;
var ripenMult = 1;                // shop: faster ripen (<1)
var spawnRich = 1;                // shop: richer garden (>1 rare odds)
var cats = [];                    // roaming caterpillars
var cocoons = [];                 // one per occupied slot
var spawnT = 0;
var warmT = 0;                    // run-start warm-up window (faster spawns)
var selFood = null;               // food id picked by tap (tap-then-tap path)

var crack = null;                 // { cocoon, pos, dir, speed, done }

// drag state for food chips
var drag = null;                  // { food, x, y } while dragging a chip
var gtime = 0;                    // accumulated seconds for cosmetic animation

// layout rects (recomputed each frame in layout())
var L = {};

function nowDay() { var d = new Date(); return d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate(); }

// ── HELPERS ──────────────────────────────────────────────────────────────
function speciesById(id) { for (var i = 0; i < SPECIES.length; i++) if (SPECIES[i].id === id) return SPECIES[i]; return SPECIES[0]; }
function foodById(id) { for (var i = 0; i < FOODS.length; i++) if (FOODS[i].id === id) return FOODS[i]; return FOODS[0]; }
function unlockedFoods() { var o = []; for (var i = 0; i < FOODS.length; i++) if (FOODS[i].tier <= tier) o.push(FOODS[i]); return o; }
function freeSlots() { return slots - cocoons.length; }
function hungryCount() { var n = 0; for (var i = 0; i < cats.length; i++) if (cats[i].fed < T.FEEDS_TO_COCOON) n++; return n; }

function toast(txt) { toastTxt = txt; toastT = 2.2; }

// quality 0..3 from crack accuracy; picks a species at/under current tier,
// biased toward rarer when quality is high.
function pickSpecies(quality) {
  var pool = [];
  for (var i = 0; i < SPECIES.length; i++) { if (SPECIES[i].tier <= tier) pool.push(SPECIES[i]); }
  // weight: base 1, +rare bonus scaled by quality and spawnRich
  var weights = pool.map(function(s) {
    var w = 1;
    if (s.rare > 0) w = (quality >= s.rare ? 1 + quality * 0.7 * spawnRich : 0.18 / (s.rare));
    return w;
  });
  // strong nudge toward an UNDISCOVERED species so the album fills
  for (var k = 0; k < pool.length; k++) if (!album[pool[k].id]) weights[k] *= 2.6;
  var tot = 0; for (var w2 = 0; w2 < weights.length; w2++) tot += weights[w2];
  var r = Math.random() * tot;
  for (var j = 0; j < pool.length; j++) { r -= weights[j]; if (r <= 0) return pool[j]; }
  return pool[pool.length - 1];
}

// ── GAME LIFECYCLE ───────────────────────────────────────────────────────
function startGame() {
  joy = T.JOY_START; food = 10; pookies = 0; gardenLevel = 1; tier = 1;
  hatchesThisLevel = 0; slots = T.SLOTS_BASE; ripenMult = 1; spawnRich = 1;
  cats = []; cocoons = []; spawnT = 0.4; warmT = T.WARMUP_SEC; selFood = null; drag = null; crack = null;
  prices = { slot: 8, ripen: 10, spawn: 12 };
  sub = null; toastT = 0;
  gs = 'PLAYING';
  layout();        // populate L before spawning (spawnCat reads L.gardenTop)
  spawnCat(true);  // first bug already on-screen near center (time-to-first-fun)
  spawnCat();      // a second bug crawls in so the opening nursery isn't sparse
  GF.gameStarted();
  startTutorial();
  GF.saveRun();
}

function gameOver() {
  if (pookies > best) { best = pookies; try { localStorage.setItem('pookie_pupae_best', best); } catch (e) {} }
  gs = 'GAMEOVER'; sub = null; crack = null; drag = null;
  GF.sfx('lose');
  GF.gameEnded();
  GF.saveRun();
}

// _jumpLevel(n): the gate uses small n for PLAYING reachability and a large n
// (99) to drive a TERMINAL state. For 99 we set up a busy garden then end it so
// gs becomes GAMEOVER immediately (the lose path is also reachable from real
// play as joy drains — see __gfEcon / the 60s drain).
window._jumpLevel = function(n) {
  setupForScreenshot(Math.min(5, (n && n < 90) ? n : 5));
  if (n && n >= 90) { joy = 0; gameOver(); }
};

// fast-forward to a busy late-game state (for screenshots + loop-depth gate)
function setupForScreenshot(lvl) {
  startGame();
  GF.tutorial.active = false;
  try { localStorage.setItem('pookie_pupae_seen_tutorial', '1'); } catch (e) {}
  lvl = lvl || 5;
  gardenLevel = Math.max(1, lvl); tier = Math.min(5, 1 + Math.floor((gardenLevel - 1) / 2));
  pookies = gardenLevel * T.LEVELUP_EVERY; food = 16; joy = 78;
  slots = Math.min(T.SLOTS_MAX, T.SLOTS_BASE + 2); ripenMult = 0.8; spawnRich = 1.4;
  // discover several species for a full-looking album
  for (var i = 0; i < SPECIES.length; i++) { if (SPECIES[i].tier <= tier && Math.random() < 0.7) { if (!album[SPECIES[i].id]) { album[SPECIES[i].id] = true; albumCount++; } } }
  cats = []; for (var c = 0; c < 4; c++) { spawnCat(); cats[c].fed = (c % T.FEEDS_TO_COCOON); }
  cocoons = [];
  for (var s = 0; s < slots; s++) {
    var sp = pickSpecies(s === 0 ? 3 : 1);
    cocoons.push({ slot: s, species: sp.id, ripen: (s === slots - 1 ? T.RIPEN_SEC : 0.3 + Math.random() * (T.RIPEN_SEC - 1)), dur: T.RIPEN_SEC * ripenMult, twin: tier >= 4 && s === 1, gold: tier >= 5 && s === 0 });
  }
}
window._setupForScreenshot = setupForScreenshot;

window._silent = window._silent || false;

// ── SPAWNING ─────────────────────────────────────────────────────────────
// onScreen=true places the bug already arrived near center (used for the very
// first caterpillar so the tutorial + first tap target a clearly visible bug).
function spawnCat(onScreen) {
  if (cats.length >= T.CAT_MAX) return;
  var side = Math.floor(Math.random() * 2); // 0 left, 1 right
  var midY = L.gardenTop + L.gardenH * 0.5;
  var gy = onScreen ? midY : (L.gardenTop + Math.random() * (L.gardenH - 60 * GF.S) + 30 * GF.S);
  var tx = onScreen ? GF.W * 0.5 : (60 * GF.S + Math.random() * (GF.W - 120 * GF.S));
  var c = {
    x: onScreen ? GF.W * 0.5 : (side ? GF.W + 40 * GF.S : -40 * GF.S),
    y: gy,
    tx: tx,
    ty: gy + (onScreen ? 0 : (Math.random() - 0.5) * 40 * GF.S),
    fed: 0, wander: T.CAT_WANDER_SEC, wob: Math.random() * 6.28,
    hue: Math.random(), born: 0, popping: 0,
  };
  cats.push(c);
}

// ── FEEDING ──────────────────────────────────────────────────────────────
function feedCat(cat, fid) {
  if (food < T.FEED_COST) { GF.sfx('error'); toast(GF.t('food') + ' 0'); return false; }
  food -= T.FEED_COST;
  cat.fed++;
  cat.wander = T.CAT_WANDER_SEC; // feeding resets the wander timer
  cat.lastFood = fid;
  cat.pop = 0.18;
  joy = Math.min(100, joy + T.JOY_FEED_GAIN);
  GF.sfx('pickup');
  var cr = catR(cat);
  GF.juice.particles.burst(cat.x, cat.y - cr * 0.4, { count: 8, color: foodById(fid).col, speed: 110, gravity: 320, size: 4, life: 0.5 });
  GF.juice.floatText(cat.x, cat.y - cr - 6 * GF.S, '+' + T.JOY_FEED_GAIN, { color: '#ff9ec4', size: 13 });
  if (tutStep === 0) tutAdvance();
  else if (tutStep === 1 && cat.fed >= T.FEEDS_TO_COCOON) {} // handled in cocoon
  if (cat.fed >= T.FEEDS_TO_COCOON) tryCocoon(cat);
  GF.saveRun();
  return true;
}

function tryCocoon(cat) {
  if (freeSlots() <= 0) {
    cat.ready = true; // fat & waiting; nudge the player
    toast(GF.t('needslot'));
    return;
  }
  // find a free slot index
  var used = {}; for (var i = 0; i < cocoons.length; i++) used[cocoons[i].slot] = true;
  var slotIdx = 0; while (used[slotIdx]) slotIdx++;
  // quality from food match: matching the tier's "preferred" food gives bonus
  var sp = pickSpecies(1);
  var gold = tier >= 5 && Math.random() < 0.18 * spawnRich;
  var twin = tier >= 4 && Math.random() < 0.22;
  cocoons.push({ slot: slotIdx, species: sp.id, ripen: 0, dur: T.RIPEN_SEC * ripenMult * (gold ? 1.3 : 1), twin: twin, gold: gold });
  // remove the caterpillar (it became the cocoon)
  var ix = cats.indexOf(cat); if (ix >= 0) cats.splice(ix, 1);
  GF.sfx('spawn');
  GF.juice.particles.burst(cat.x, cat.y, { count: 18, colors: ['#ffd6e3', '#d6f0ff', '#fff0bf'], speed: 150, gravity: -60, size: 5, life: 0.7 });
  if (tutStep === 1) tutAdvance();
  GF.saveRun();
}

// ── CRACKING (timing minigame) ───────────────────────────────────────────
function openCrack(coc) {
  if (coc.ripen < coc.dur) { GF.sfx('error'); return; }
  crack = { cocoon: coc, pos: 0, dir: 1, speed: 1.35 + tier * 0.06, done: false, result: 0 };
  sub = 'CRACK';
  GF.sfx('click');
}

function doCrack() {
  if (!crack || crack.done) return;
  var center = 0.5;
  var d = Math.abs(crack.pos - center);
  var quality; // 0 fine, 1 good, 2 great, 3 perfect
  if (d <= T.PERFECT_ZONE * 0.4) quality = 3;
  else if (d <= T.PERFECT_ZONE) quality = 2;
  else if (d <= T.PERFECT_ZONE * 2) quality = 1;
  else quality = 0;
  crack.done = true; crack.result = quality;
  crack.flashT = 0.5;
  hatch(crack.cocoon, quality);
}

function hatch(coc, quality) {
  // remove cocoon from slot
  var ix = cocoons.indexOf(coc); if (ix >= 0) cocoons.splice(ix, 1);
  var count = coc.twin ? 2 : 1;
  var bonus = (quality >= 2 ? 2 : 0) + (coc.gold ? 2 : 0);
  var gotNew = false;
  var px = GF.W * 0.5, py = GF.H * 0.42;
  for (var n = 0; n < count; n++) {
    var sp = pickSpecies(Math.max(quality, coc.gold ? 2 : 0));
    pookies++;
    food = Math.min(T.FOOD_CAP, food + T.FOOD_PER_HATCH + bonus + (CFG.events.double_food ? T.FOOD_PER_HATCH : 0));
    joy = Math.min(100, joy + T.JOY_HATCH_GAIN);
    hatchesThisLevel++;
    if (!album[sp.id]) { album[sp.id] = true; albumCount++; gotNew = true; coc._newSp = sp; saveAlbum(); }
    coc._lastSp = sp;
  }
  // feedback
  if (quality >= 3) { GF.sfx('evolve'); toast(GF.t('perfect')); }
  else if (quality >= 2) { GF.sfx('reward'); toast(GF.t('nice')); }
  else GF.sfx('unlock');
  GF.juice.floatText(px, py - 30 * GF.S, '+' + (T.FOOD_PER_HATCH + bonus) + ' ' + GF.t('food'), { color: '#ffd36b', size: 14 });
  GF.juice.floatText(px, py - 10 * GF.S, '+' + T.JOY_HATCH_GAIN + ' ' + GF.t('joy'), { color: '#ff9ec4', size: 14 });
  if (gotNew) {
    GF.juice.particles.burst(px, py, { count: 30, colors: ['#ff9ec4', '#9fd0ff', '#ffe08a', '#c4a0ff', '#8fe6df'], speed: 230, gravity: 120, size: 6, life: 1.0 });
    GF.juice.flash('#fff7fb', 240, 0.4);
    GF.happytime();
  } else {
    GF.juice.particles.burst(px, py, { count: 16, colors: ['#fff0bf', '#ffd6e3'], speed: 150, gravity: 160, size: 5, life: 0.7 });
  }
  GF.juice.shake(coc.gold ? 7 : 4, 240);
  // level up
  while (hatchesThisLevel >= T.LEVELUP_EVERY) {
    hatchesThisLevel -= T.LEVELUP_EVERY;
    gardenLevel++;
    var nt = Math.min(5, 1 + Math.floor((gardenLevel - 1) / 2));
    if (nt > tier) { tier = nt; toast(GF.t('tier') + ' ' + tier + '!'); GF.sfx('levelup'); GF.juice.flash('#eaffe9', 220, 0.3); }
  }
  if (tutStep === 2) tutAdvance();
  GF.saveRun();
}

function closeCrack() { crack = null; sub = null; }

// ── SHOP ─────────────────────────────────────────────────────────────────
function buy(what) {
  if (what === 'slot') {
    if (slots >= T.SLOTS_MAX) { toast(GF.t('maxed')); return; }
    if (food < prices.slot) { GF.sfx('error'); return; }
    food -= prices.slot; slots++; prices.slot = Math.round(prices.slot * 1.8);
  } else if (what === 'ripen') {
    if (ripenMult <= 0.55) { toast(GF.t('maxed')); return; }
    if (food < prices.ripen) { GF.sfx('error'); return; }
    food -= prices.ripen; ripenMult = Math.max(0.5, ripenMult - 0.15); prices.ripen = Math.round(prices.ripen * 1.7);
  } else if (what === 'spawn') {
    if (spawnRich >= 2.5) { toast(GF.t('maxed')); return; }
    if (food < prices.spawn) { GF.sfx('error'); return; }
    food -= prices.spawn; spawnRich = Math.min(2.6, spawnRich + 0.35); prices.spawn = Math.round(prices.spawn * 1.7);
  }
  GF.sfx('coin');
  GF.juice.particles.burst(GF.W * 0.5, GF.H * 0.5, { count: 16, colors: ['#8fd6b0', '#c6ecd0', '#fff'], speed: 160, gravity: 120, size: 5, life: 0.7 });
  GF.saveRun();
}

// ── DAILY MYSTERY EGG ────────────────────────────────────────────────────
function dailyReady() { return dailyClaimedDay !== nowDay(); }
function claimDaily() {
  if (!dailyReady()) { toast(GF.t('perday')); return; }
  dailyClaimedDay = nowDay();
  try { localStorage.setItem('pookie_pupae_daily', String(dailyClaimedDay)); } catch (e) {}
  // grant a guaranteed-new species if any remain at/under tier+1, else food
  var avail = []; for (var i = 0; i < SPECIES.length; i++) { if (SPECIES[i].tier <= tier + 1 && !album[SPECIES[i].id]) avail.push(SPECIES[i]); }
  if (avail.length) {
    var sp = avail[Math.floor(Math.random() * avail.length)];
    album[sp.id] = true; albumCount++; saveAlbum();
    toast(GF.t('claimed') + ' ' + (GF.lang === 'ru' ? sp.name_ru : sp.name));
    GF.juice.particles.burst(GF.W * 0.5, GF.H * 0.4, { count: 26, colors: [sp.col, sp.col2, '#fff'], speed: 200, gravity: 120, size: 6, life: 0.9 });
  } else {
    food = Math.min(T.FOOD_CAP, food + 8); toast('+8 ' + GF.t('food'));
  }
  GF.sfx('reward');
  GF.saveRun();
}

// ── PERSIST ──────────────────────────────────────────────────────────────
function saveAlbum() { try { localStorage.setItem('pookie_pupae_album', JSON.stringify(album)); } catch (e) {} }
function loadAlbum() {
  try { var s = localStorage.getItem('pookie_pupae_album'); if (s) { album = JSON.parse(s) || {}; } } catch (e) { album = {}; }
  albumCount = 0; for (var k in album) if (album[k]) albumCount++;
}

// ── TUTORIAL (hands-on, action-gated) ────────────────────────────────────
var tutStep = -1; // -1 inactive
function startTutorial() {
  var seen = false;
  try { seen = !!localStorage.getItem('pookie_pupae_seen_tutorial'); } catch (e) {}
  if (seen || window._silent) { tutStep = -1; return; }
  tutStep = 0;
  GF.tutorial.start([
    { text: GF.t('t_feed'), advance: 'manual',
      target: function() { var c = cats[0]; return c ? { x: c.x, y: c.y, r: catR(c) } : { x: GF.W / 2, y: L.gardenTop + 60 * GF.S, r: 40 }; },
      target2: function() { var c = cats[0]; return c ? { x: c.x, y: c.y, r: catR(c) } : null; },
      gesture: 'drag',
      // start the demo drag at the leaf chip
      _from: function() { return L.tray && L.tray.chips && L.tray.chips[0] ? L.tray.chips[0] : { x: GF.W * 0.2, y: GF.H - 60 * GF.S }; } },
    { text: GF.t('t_fill'), advance: 'manual',
      target: function() { var c = cats[0]; return c ? { x: c.x, y: c.y, r: catR(c) } : { x: GF.W / 2, y: L.gardenTop + 60 * GF.S, r: 40 }; },
      gesture: 'tap' },
    { text: GF.t('t_crack'), advance: 'manual',
      target: function() { var c = cocoons[0]; if (c) { var p = slotPos(c.slot); return { x: p.x, y: p.y, r: T.COCOON_R * GF.S }; } return { x: GF.W / 2, y: L.shelfY, r: 40 }; },
      gesture: 'tap' },
  ], { storageKey: 'pookie_pupae_seen_tutorial', force: true });
}
function tutAdvance() {
  if (tutStep < 0) return;
  GF.tutorial.next();
  tutStep++;
  if (tutStep >= 3) { tutStep = -1; }
}

// override the drag-demo origin: the lib draws hand from target->target2, but
// for step 0 we want tray-chip -> caterpillar. We point target at the chip and
// target2 at the caterpillar so the hand drags food onto the bug.
function patchTutTargets() {
  if (tutStep === 0 && GF.tutorial.steps && GF.tutorial.steps[0]) {
    var st = GF.tutorial.steps[0];
    st.target = function() { return st._from(); };
    st.target2 = function() { var c = cats[0]; return c ? { x: c.x, y: c.y, r: catR(c) } : null; };
  }
}

// ── UPDATE ───────────────────────────────────────────────────────────────
function update(dt) {
  gtime += dt;
  GF.juice.update(dt);
  if (toastT > 0) toastT -= dt;
  GF.tutorial.update(dt);

  layout();           // keep rects live for the MENU preview + GAMEOVER buttons too
  if (gs !== 'PLAYING') return;
  patchTutTargets();

  var frozen = GF.tutorial.active; // no-fail while teaching

  // crack-meter sweep (runs even in tutorial so the player can do step 3)
  if (sub === 'CRACK' && crack) {
    if (!crack.done) {
      crack.pos += crack.dir * crack.speed * dt;
      if (crack.pos >= 1) { crack.pos = 1; crack.dir = -1; }
      if (crack.pos <= 0) { crack.pos = 0; crack.dir = 1; }
    } else {
      crack.flashT -= dt;
      if (crack.flashT <= 0) closeCrack();
    }
    return; // pause the garden while the crack overlay is up
  }
  if (sub) return; // album/shop/daily panels pause the sim

  // food regen
  food = Math.min(T.FOOD_CAP, food + T.FOOD_REGEN * dt * (CFG.events.double_food ? 1.5 : 1));

  // joy drain (skipped while teaching)
  if (!frozen) {
    var drain = (T.JOY_DRAIN_BASE + T.JOY_PER_HUNGRY * hungryCount()) * dt * (CFG.tuning.joy_drain_mult || 1);
    // gentle ramp with garden level so late game runs hotter
    drain *= (1 + (gardenLevel - 1) * 0.05);
    joy -= drain;
    if (joy <= 0) { joy = 0; gameOver(); return; }
  }

  // spawn caterpillars — faster during the run-start warm-up so the nursery
  // fills quickly and the first ~45s never feels empty.
  if (!frozen) {
    if (warmT > 0) warmT -= dt;
    spawnT -= dt;
    var baseSpawn = warmT > 0 ? T.CAT_SPAWN_WARMUP : T.CAT_SPAWN_SEC;
    var spawnInterval = baseSpawn / (spawnRich) / (CFG.tuning.spawn_mult || 1) * Math.max(0.6, 1 - (tier - 1) * 0.08);
    if (spawnT <= 0 && cats.length < T.CAT_MAX) { spawnCat(); spawnT = spawnInterval; }
  }

  // caterpillars
  for (var i = cats.length - 1; i >= 0; i--) {
    var c = cats[i];
    c.born += dt; c.wob += dt * 3;
    if (c.pop > 0) c.pop -= dt;
    // crawl toward target, pick a new wander target periodically
    var dx = c.tx - c.x, dy = c.ty - c.y, d = Math.sqrt(dx * dx + dy * dy);
    var sp = (28 + (c.fed) * 4) * GF.S;
    if (d > 4) { c.x += (dx / d) * sp * dt; c.y += (dy / d) * sp * dt; }
    else if (!frozen) { c.tx = 60 * GF.S + Math.random() * (GF.W - 120 * GF.S); c.ty = L.gardenTop + 30 * GF.S + Math.random() * (L.gardenH - 60 * GF.S); }
    // if fat & waiting and a slot freed, cocoon now
    if (c.ready && freeSlots() > 0) { c.ready = false; tryCocoon(c); continue; }
    // hunger / wander-off
    if (!frozen && c.fed < T.FEEDS_TO_COCOON) {
      c.wander -= dt;
      if (c.wander <= 0) {
        // wanders off — small joy hit
        joy = Math.max(0, joy - 5);
        GF.juice.floatText(c.x, c.y, '-5', { color: '#e57', size: 13 });
        GF.sfx('hurt');
        cats.splice(i, 1);
        if (joy <= 0) { gameOver(); return; }
      }
    }
  }

  // cocoons ripen
  for (var j = 0; j < cocoons.length; j++) {
    var co = cocoons[j];
    if (co.ripen < co.dur) co.ripen += dt;
    if (co.ripen > co.dur) co.ripen = co.dur;
  }
}

// caterpillar radius grows with feeding
function catR(c) { return (T.CAT_R + c.fed * 4) * GF.S; }
// attach r() to each cat lazily
function ensureCatR() { for (var i = 0; i < cats.length; i++) if (!cats[i].r) (function(cc){ cc.r = function(){ return catR(cc); }; })(cats[i]); }

// ── LAYOUT (recompute rects; portrait-first) ─────────────────────────────
function layout() {
  ensureCatR();
  var W = GF.W, H = GF.H, S = GF.S;
  L.topH = Math.max(54 * S, H * 0.075);
  L.goalY = L.topH + 6 * S;
  L.gardenTop = L.topH + 34 * S;
  L.trayH = Math.max(86 * S, H * 0.12);
  // incubator shelf: 2 rows once we have >3 slots so cocoons stay big and the
  // crack cues never collide on a narrow portrait frame.
  L.slotCols = slots > 3 ? Math.ceil(slots / 2) : slots;
  L.slotRows = slots > 3 ? 2 : 1;
  L.shelfH = (L.slotRows > 1 ? Math.max(150 * S, H * 0.21) : Math.max(96 * S, H * 0.14));
  L.shelfY = H - L.trayH - L.shelfH * 0.5 - 4 * S; // center y of single-row shelf
  L.shelfTop = H - L.trayH - L.shelfH - 2 * S;
  L.gardenH = L.shelfTop - L.gardenTop - 6 * S;
  // tray chips (unlocked foods) along the bottom
  var uf = unlockedFoods();
  L.tray = { y: H - L.trayH * 0.5, chips: [] };
  var n = uf.length;
  var cw = Math.min(T.FOOD_CHIP_R * 2 + 18 * S, (W - 120 * S) / Math.max(1, n));
  var totalW = cw * n;
  var startX = (W - totalW) / 2 + cw / 2;
  for (var i = 0; i < n; i++) {
    L.tray.chips.push({ x: startX + i * cw, y: L.tray.y, r: T.FOOD_CHIP_R * S, food: uf[i].id });
  }
  // hub buttons (right side of tray): shop, album, daily
  var br = Math.max(20 * S, L.trayH * 0.26);
  L.btnShop = { x: W - 30 * S, y: L.tray.y, r: br };
  L.btnAlbum = { x: W - 30 * S, y: L.tray.y - br * 2.3, r: br * 0.92 };
  // top-bar small buttons: help + mute
  L.btnHelp = { x: 22 * S, y: L.topH + L.gardenTop * 0 + 0, r: 0 }; // set below
  L.btnHelp = { x: W - 26 * S, y: L.goalY + 0, r: 13 * S };
  L.btnMute = { x: W - 26 * S, y: 22 * S, r: 13 * S };
  // daily egg button floats near top-left under goal pill
  L.btnDaily = { x: 30 * S, y: L.goalY + 2 * S, r: 14 * S };
}

// incubator slot center position — lays out in L.slotRows x L.slotCols so 4-6
// cocoons sit on two roomy rows instead of one cramped row.
function slotPos(idx) {
  var W = GF.W, S = GF.S;
  var cols = L.slotCols || slots, rows = L.slotRows || 1;
  var col = idx % cols, row = Math.floor(idx / cols);
  var sw = Math.min(T.COCOON_R * 2 + 26 * S, (W - 40 * S) / cols);
  var totalW = sw * cols;
  var startX = (W - totalW) / 2 + sw / 2;
  // vertical: center the row block within the shelf
  var rowGap = (T.COCOON_R * 2 + 18 * S);
  var blockH = (rows - 1) * rowGap;
  var topY = L.shelfTop + (L.shelfH - blockH) / 2 + 4 * S;
  return { x: startX + col * sw, y: topY + row * rowGap };
}

// ── DRAW ─────────────────────────────────────────────────────────────────
function draw(ctx) {
  var W = GF.W, H = GF.H, S = GF.S;
  // soft pastel garden gradient
  var g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#d8f3e0'); g.addColorStop(0.5, '#f3e6f7'); g.addColorStop(1, '#fbe6ef');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  drawGardenDecor(ctx);

  if (gs === 'PLAYING' || gs === 'GAMEOVER') {
    ctx.save();
    ctx.translate(GF.juice.offsetX, GF.juice.offsetY);
    drawShelf(ctx);
    drawCats(ctx);
    drawCocoons(ctx);
    GF.juice.particles.draw(ctx);
    GF.juice.texts.draw(ctx);
    ctx.restore();

    drawTray(ctx);
    drawTopBar(ctx);
    drawGoal(ctx);
    drawHubButtons(ctx);
    if (drag) drawDragChip(ctx);

    if (sub === 'CRACK') drawCrack(ctx);
    else if (sub === 'ALBUM') drawAlbum(ctx);
    else if (sub === 'SHOP') drawShop(ctx);
    else if (sub === 'DAILY') drawDaily(ctx);

    drawToast(ctx);
    GF.juice.drawFlash(ctx);
    GF.tutorial.draw(ctx);
    drawTutFoodSpotlight(ctx);  // re-light the leaf chip ON TOP of the tutorial scrim
  }

  if (gs === 'MENU') {
    drawMenuPreview(ctx);
    GF.drawOverlay({
      title: GF.t('title'), sub: GF.t('sub'),
      btnText: GF.t('play'), btnFn: startGame,
      bestText: best > 0 ? GF.t('best') + ': ' + best : null,
    });
  }
  if (gs === 'GAMEOVER') {
    drawGameOver(ctx);
  }
}

function drawGardenDecor(ctx) {
  var W = GF.W, H = GF.H, S = GF.S;
  // a few soft leaves/clouds for cozy depth (cheap, static-ish)
  ctx.save();
  ctx.globalAlpha = 0.5;
  for (var i = 0; i < 5; i++) {
    var x = ((i * 137) % 100) / 100 * W;
    var y = L.gardenTop + ((i * 53) % 100) / 100 * (L.gardenH || H * 0.4);
    ctx.fillStyle = i % 2 ? '#c6ecd0' : '#e8d6f0';
    ctx.beginPath(); ctx.ellipse(x, y, 26 * S, 14 * S, i, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1; ctx.restore();
}

function drawShelf(ctx) {
  var W = GF.W, S = GF.S;
  // a cozy wooden incubator shelf with slot cradles
  ctx.fillStyle = '#e7cfa8';
  GF.rr(ctx, 12 * S, L.shelfTop, W - 24 * S, L.shelfH, 16 * S); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.25)';
  GF.rr(ctx, 12 * S, L.shelfTop, W - 24 * S, 8 * S, 8 * S); ctx.fill();
  for (var i = 0; i < slots; i++) {
    var p = slotPos(i);
    var occ = false; for (var j = 0; j < cocoons.length; j++) if (cocoons[j].slot === i) { occ = true; break; }
    // cradle
    ctx.fillStyle = occ ? 'rgba(255,255,255,0.35)' : 'rgba(150,120,90,0.22)';
    ctx.beginPath(); ctx.ellipse(p.x, p.y + T.COCOON_R * S * 0.7, T.COCOON_R * S * 0.95, T.COCOON_R * S * 0.4, 0, 0, Math.PI * 2); ctx.fill();
  }
  // ONE shared "Tap to crack!" cue above the shelf when any cocoon is ripe —
  // replaces the per-slot labels that used to collide on a full narrow shelf.
  var anyRipe = false; for (var r = 0; r < cocoons.length; r++) { if (cocoons[r].ripen >= cocoons[r].dur) { anyRipe = true; break; } }
  if (anyRipe) {
    var a = 0.7 + 0.3 * Math.sin(gtime * 5);
    ctx.save(); ctx.globalAlpha = a;
    ctx.fillStyle = '#e0852f'; ctx.font = 'bold ' + (12 * S) + 'px sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
    ctx.fillText(GF.t('crack'), W / 2, L.shelfTop - 7 * S);
    ctx.restore();
  }
}

// draw a pookie creature (vector fallback) tinted by species
function drawPookie(ctx, x, y, r, sp, t) {
  ctx.save(); ctx.translate(x, y);
  var bob = Math.sin((t || 0) * 3) * r * 0.05;
  ctx.translate(0, bob);
  // try sprite first (tinted overlay handled by re-coloring path fallback)
  var img = GF.sprites['pookie'];
  if (img && img.complete && img.naturalWidth > 0) {
    ctx.drawImage(img, -r, -r, r * 2, r * 2);
    // species color glow on top
    ctx.globalCompositeOperation = 'overlay';
    ctx.globalAlpha = 0.35; ctx.fillStyle = sp.col;
    ctx.beginPath(); ctx.arc(0, 0, r * 0.9, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  } else {
    // vector kawaii blob
    if (sp.pat === 'wing' || sp.pat === 'star') {
      ctx.fillStyle = sp.col2;
      ctx.beginPath(); ctx.ellipse(-r * 0.85, -r * 0.15, r * 0.6, r * 0.45, -0.5, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(r * 0.85, -r * 0.15, r * 0.6, r * 0.45, 0.5, 0, Math.PI * 2); ctx.fill();
    }
    var bg = ctx.createRadialGradient(-r * 0.3, -r * 0.4, r * 0.2, 0, 0, r);
    bg.addColorStop(0, sp.col2); bg.addColorStop(1, sp.col);
    ctx.fillStyle = bg;
    ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();
    // pattern
    if (sp.pat === 'spot') { ctx.fillStyle = 'rgba(255,255,255,0.5)'; for (var s = 0; s < 3; s++) { ctx.beginPath(); ctx.arc((s - 1) * r * 0.4, r * 0.15, r * 0.13, 0, Math.PI * 2); ctx.fill(); } }
    if (sp.pat === 'stripe') { ctx.strokeStyle = 'rgba(255,255,255,0.45)'; ctx.lineWidth = r * 0.12; for (var st = -1; st <= 1; st++) { ctx.beginPath(); ctx.arc(0, 0, r * (0.5 + st * 0.22), 0.2, Math.PI - 0.2); ctx.stroke(); } }
    if (sp.pat === 'star') { drawStar(ctx, 0, -r * 0.1, r * 0.28, '#fff'); }
    if (sp.pat === 'cheek') { ctx.fillStyle = 'rgba(255,140,170,0.5)'; ctx.beginPath(); ctx.arc(-r * 0.5, r * 0.2, r * 0.16, 0, Math.PI * 2); ctx.arc(r * 0.5, r * 0.2, r * 0.16, 0, Math.PI * 2); ctx.fill(); }
  }
  // big sparkly eyes (always vector so they read cute)
  drawCuteEyes(ctx, r);
  ctx.restore();
}

function drawCuteEyes(ctx, r) {
  ctx.fillStyle = '#3a2b3f';
  ctx.beginPath(); ctx.arc(-r * 0.32, -r * 0.05, r * 0.17, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(r * 0.32, -r * 0.05, r * 0.17, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(-r * 0.27, -r * 0.11, r * 0.06, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(r * 0.37, -r * 0.11, r * 0.06, 0, Math.PI * 2); ctx.fill();
  // smile
  ctx.strokeStyle = '#3a2b3f'; ctx.lineWidth = Math.max(1.4, r * 0.07); ctx.lineCap = 'round';
  ctx.beginPath(); ctx.arc(0, r * 0.12, r * 0.22, 0.15, Math.PI - 0.15); ctx.stroke();
}

function drawStar(ctx, x, y, r, col) {
  ctx.fillStyle = col; ctx.beginPath();
  for (var i = 0; i < 5; i++) {
    var a = -Math.PI / 2 + i * Math.PI * 2 / 5;
    var a2 = a + Math.PI / 5;
    ctx.lineTo(x + Math.cos(a) * r, y + Math.sin(a) * r);
    ctx.lineTo(x + Math.cos(a2) * r * 0.45, y + Math.sin(a2) * r * 0.45);
  }
  ctx.closePath(); ctx.fill();
}

function drawCats(ctx) {
  var S = GF.S, t = gtime;
  for (var i = 0; i < cats.length; i++) {
    var c = cats[i]; var r = catR(c);
    var pop = c.pop > 0 ? 1 + c.pop * 0.6 : 1;
    ctx.save(); ctx.translate(c.x, c.y); ctx.scale(pop, pop);
    var img = GF.sprites['caterpillar'];
    if (img && img.complete && img.naturalWidth > 0) {
      ctx.drawImage(img, -r, -r, r * 2, r * 2);
    } else {
      // segmented pastel caterpillar
      var hue = 90 + c.hue * 60;
      var segs = 3 + c.fed;
      for (var s = segs - 1; s >= 0; s--) {
        var off = (s - (segs - 1) / 2) * r * 0.5;
        var wob = Math.sin(c.wob + s * 0.7) * r * 0.12;
        var rr2 = r * (0.55 - s * 0.02) * (s === 0 ? 1.15 : 1);
        var grd = ctx.createRadialGradient(off - rr2 * 0.3, wob - rr2 * 0.3, rr2 * 0.2, off, wob, rr2);
        grd.addColorStop(0, 'hsl(' + hue + ',70%,85%)'); grd.addColorStop(1, 'hsl(' + hue + ',55%,68%)');
        ctx.fillStyle = grd; ctx.beginPath(); ctx.arc(off, wob, rr2, 0, Math.PI * 2); ctx.fill();
      }
      // face on head segment (leftmost)
      var hx = (-(segs - 1) / 2) * r * 0.5;
      ctx.save(); ctx.translate(hx, Math.sin(c.wob) * r * 0.12); drawCuteEyes(ctx, r * 0.5); ctx.restore();
      // little antennae
      ctx.strokeStyle = 'hsl(' + hue + ',45%,55%)'; ctx.lineWidth = Math.max(1.2, r * 0.06); ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(hx - r * 0.1, -r * 0.4); ctx.lineTo(hx - r * 0.2, -r * 0.7); ctx.moveTo(hx + r * 0.1, -r * 0.4); ctx.lineTo(hx + r * 0.2, -r * 0.7); ctx.stroke();
    }
    ctx.restore();
    // hunger / fatten meter ring
    var frac = c.fed / T.FEEDS_TO_COCOON;
    ctx.save(); ctx.lineWidth = 3.5 * S; ctx.lineCap = 'round';
    ctx.strokeStyle = 'rgba(255,255,255,0.5)';
    ctx.beginPath(); ctx.arc(c.x, c.y, r + 7 * S, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2); ctx.stroke();
    ctx.strokeStyle = c.ready ? '#ff8fb0' : '#7fd68f';
    ctx.beginPath(); ctx.arc(c.x, c.y, r + 7 * S, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * frac); ctx.stroke();
    ctx.restore();
    // hungry pulse if low on wander
    if (!c.ready && c.fed < T.FEEDS_TO_COCOON && c.wander < 5) {
      var a = 0.4 + 0.4 * Math.sin(t * 8);
      ctx.save(); ctx.globalAlpha = a; ctx.fillStyle = '#ff8a9e';
      ctx.font = 'bold ' + (16 * S) + 'px sans-serif'; ctx.textAlign = 'center';
      ctx.fillText('!', c.x, c.y - r - 10 * S); ctx.restore();
    }
  }
}

function drawCocoons(ctx) {
  var S = GF.S, t = gtime;
  for (var i = 0; i < cocoons.length; i++) {
    var co = cocoons[i]; var p = slotPos(co.slot);
    var ripe = co.ripen >= co.dur;
    var r = T.COCOON_R * S;
    var sway = Math.sin(t * 1.5 + co.slot) * 0.08;
    ctx.save(); ctx.translate(p.x, p.y - r * 0.2); ctx.rotate(sway);
    if (ripe) { var pulse = 1 + 0.05 * Math.sin(t * 5); ctx.scale(pulse, pulse); ctx.shadowColor = co.gold ? '#ffd45c' : '#fff4b0'; ctx.shadowBlur = 18 * S; }
    var img = GF.sprites['cocoon'];
    if (img && img.complete && img.naturalWidth > 0) {
      ctx.drawImage(img, -r, -r, r * 2, r * 2);
    } else {
      var grd = ctx.createLinearGradient(0, -r, 0, r);
      if (co.gold) { grd.addColorStop(0, '#ffe9a8'); grd.addColorStop(1, '#f0b840'); }
      else { grd.addColorStop(0, '#fff3da'); grd.addColorStop(1, '#e7c7a0'); }
      ctx.fillStyle = grd;
      ctx.beginPath(); ctx.ellipse(0, 0, r * 0.7, r, 0, 0, Math.PI * 2); ctx.fill();
      // fuzzy silk lines
      ctx.strokeStyle = 'rgba(255,255,255,0.45)'; ctx.lineWidth = 1.4 * S;
      for (var k = -2; k <= 2; k++) { ctx.beginPath(); ctx.moveTo(-r * 0.55, k * r * 0.3); ctx.lineTo(r * 0.55, k * r * 0.3 + r * 0.1); ctx.stroke(); }
      if (co.twin) { ctx.fillStyle = 'rgba(255,255,255,0.6)'; ctx.font = 'bold ' + (11 * S) + 'px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('x2', 0, r * 0.2); }
    }
    ctx.restore();
    // ripen ring
    var frac = Math.min(1, co.ripen / co.dur);
    ctx.save(); ctx.lineWidth = 3.5 * S; ctx.lineCap = 'round';
    ctx.strokeStyle = 'rgba(255,255,255,0.45)';
    ctx.beginPath(); ctx.arc(p.x, p.y - r * 0.2, r + 6 * S, -Math.PI / 2, Math.PI * 1.5); ctx.stroke();
    ctx.strokeStyle = ripe ? (co.gold ? '#ffce5c' : '#ffd36b') : '#b8a6f0';
    ctx.beginPath(); ctx.arc(p.x, p.y - r * 0.2, r + 6 * S, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * frac); ctx.stroke();
    ctx.restore();
    if (ripe) {
      // compact NON-TEXT ripe cue per cocoon (a pulsing crack chevron) so labels
      // never collide; the one shared "Tap to crack!" line is drawn on the shelf.
      var a = 0.6 + 0.4 * Math.sin(t * 6);
      var bob = Math.sin(t * 6) * 2 * S;
      ctx.save(); ctx.globalAlpha = a;
      ctx.strokeStyle = co.gold ? '#f0a830' : '#e0852f'; ctx.lineWidth = 2.6 * S; ctx.lineCap = 'round';
      var cy2 = p.y - r - 9 * S + bob;
      ctx.beginPath(); ctx.moveTo(p.x - 6 * S, cy2 + 4 * S); ctx.lineTo(p.x, cy2 - 2 * S); ctx.lineTo(p.x + 6 * S, cy2 + 4 * S); ctx.stroke();
      ctx.restore();
    }
  }
}

// During the feed tutorial step, the lib's scrim dims the whole board including
// the tray; re-light the food chip the player is told to grab so it reads as a
// bright tappable snack from frame 1 (drawn AFTER GF.tutorial.draw).
function drawTutFoodSpotlight(ctx) {
  if (!GF.tutorial.active || tutStep !== 0) return;
  if (!L.tray || !L.tray.chips || !L.tray.chips.length) return;
  var S = GF.S, ch = L.tray.chips[0], f = foodById(ch.food);
  var pulse = 0.5 + 0.5 * Math.sin(gtime * 4);
  ctx.save();
  // a soft bright disc clears the scrim around the chip, then a glow ring
  ctx.fillStyle = 'rgba(255,252,240,0.9)';
  ctx.beginPath(); ctx.arc(ch.x, ch.y, ch.r + 10 * S, 0, Math.PI * 2); ctx.fill();
  ctx.shadowColor = f.col; ctx.shadowBlur = (12 + pulse * 12) * S;
  drawFoodChip(ctx, ch.x, ch.y, ch.r, f);
  ctx.shadowColor = 'transparent';
  ctx.strokeStyle = '#fff'; ctx.lineWidth = (2.5 + pulse * 1.5) * S;
  ctx.beginPath(); ctx.arc(ch.x, ch.y, ch.r + 5 * S, 0, Math.PI * 2); ctx.stroke();
  ctx.restore();
}

function drawTray(ctx) {
  var W = GF.W, H = GF.H, S = GF.S;
  ctx.fillStyle = 'rgba(255,255,255,0.5)';
  GF.rr(ctx, 8 * S, H - L.trayH, W - 16 * S, L.trayH - 6 * S, 16 * S); ctx.fill();
  for (var i = 0; i < L.tray.chips.length; i++) {
    var ch = L.tray.chips[i]; var f = foodById(ch.food);
    var picked = selFood === ch.food;
    ctx.save();
    if (picked) { ctx.shadowColor = f.col; ctx.shadowBlur = 14 * S; }
    drawFoodChip(ctx, ch.x, ch.y, ch.r, f);
    ctx.restore();
    if (picked) { ctx.strokeStyle = '#fff'; ctx.lineWidth = 3 * S; ctx.beginPath(); ctx.arc(ch.x, ch.y, ch.r + 4 * S, 0, Math.PI * 2); ctx.stroke(); }
  }
}

function drawFoodChip(ctx, x, y, r, f) {
  // glossy berry/leaf snack
  ctx.save(); ctx.translate(x, y);
  ctx.fillStyle = 'rgba(255,255,255,0.6)';
  ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();
  var img = GF.sprites['food'];
  if (img && img.complete && img.naturalWidth > 0) {
    ctx.drawImage(img, -r * 0.85, -r * 0.85, r * 1.7, r * 1.7);
  } else {
    var grd = ctx.createRadialGradient(-r * 0.3, -r * 0.3, r * 0.1, 0, 0, r * 0.8);
    grd.addColorStop(0, f.col); grd.addColorStop(1, f.col2);
    ctx.fillStyle = grd;
    if (f.id === 'leaf') {
      ctx.beginPath(); ctx.ellipse(0, 0, r * 0.5, r * 0.78, 0.5, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.6)'; ctx.lineWidth = 1.6 * GF.S; ctx.beginPath(); ctx.moveTo(-r * 0.3, r * 0.4); ctx.lineTo(r * 0.3, -r * 0.4); ctx.stroke();
    } else {
      ctx.beginPath(); ctx.arc(0, 0, r * 0.62, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.55)'; ctx.beginPath(); ctx.arc(-r * 0.2, -r * 0.22, r * 0.16, 0, Math.PI * 2); ctx.fill();
    }
  }
  ctx.restore();
}

function drawDragChip(ctx) {
  var S = GF.S; var f = foodById(drag.food);
  ctx.save(); ctx.globalAlpha = 0.95;
  drawFoodChip(ctx, drag.x, drag.y, T.FOOD_CHIP_R * S * 1.1, f);
  ctx.restore();
}

function drawTopBar(ctx) {
  var W = GF.W, S = GF.S;
  // joy meter (left): the lose signal
  var bx = 12 * S, by = 12 * S, bw = W * 0.46, bh = 18 * S;
  ctx.fillStyle = 'rgba(255,255,255,0.55)'; GF.rr(ctx, bx, by, bw, bh, bh / 2); ctx.fill();
  var jf = joy / 100;
  var jc = joy < 25 ? '#ff6b6b' : joy < 50 ? '#ffb04d' : '#7fd68f';
  GF.rr(ctx, bx, by, Math.max(bh, bw * jf), bh, bh / 2); ctx.fillStyle = jc; ctx.fill();
  ctx.fillStyle = '#5a4a5f'; ctx.font = 'bold ' + (11 * S) + 'px sans-serif'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.fillText(GF.t('joy'), bx + 8 * S, by + bh / 2);
  // heart icon at meter end
  drawHeart(ctx, bx + bw - 4 * S, by + bh / 2, 9 * S, jc);

  // food (center-right): currency with a little food icon
  var fx = bx + bw + 18 * S;
  drawFoodChip(ctx, fx + 10 * S, by + bh / 2, 11 * S, FOODS[0]);
  ctx.fillStyle = '#5a4a5f'; ctx.font = 'bold ' + (15 * S) + 'px sans-serif'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.fillText(Math.floor(food) + '/' + T.FOOD_CAP, fx + 24 * S, by + bh / 2);

  // mute (top-right)
  GF.drawMuteIcon(ctx, L.btnMute.x, L.btnMute.y, L.btnMute.r, GF.muted);
}

function drawHeart(ctx, x, y, r, col) {
  ctx.save(); ctx.translate(x, y); ctx.fillStyle = col;
  ctx.beginPath();
  ctx.moveTo(0, r * 0.35);
  ctx.bezierCurveTo(-r, -r * 0.5, -r * 0.5, -r, 0, -r * 0.35);
  ctx.bezierCurveTo(r * 0.5, -r, r, -r * 0.5, 0, r * 0.35);
  ctx.fill(); ctx.restore();
}

function drawGoal(ctx) {
  var W = GF.W, S = GF.S;
  // next-goal pill + album counter (center, under top bar)
  var remain = T.LEVELUP_EVERY - hatchesThisLevel;
  var txt = GF.t('goalpre') + remain + GF.t('goalmid') + GF.t('lv') + ' ' + (gardenLevel + 1);
  var alb = albumCount + '/' + SPECIES.length;
  ctx.font = 'bold ' + (12 * S) + 'px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  var tw = ctx.measureText(txt).width;
  var albw = ctx.measureText(' ' + GF.t('score') + ' ' + alb).width;
  var padX = 12 * S, gap = 14 * S;
  var pillW = tw + albw + padX * 2 + gap;
  var pillX = (W - pillW) / 2, pillY = L.goalY, pillH = 22 * S;
  pillX = GF.clamp(pillX, 44 * S, W - pillW - 44 * S);
  ctx.fillStyle = 'rgba(90,74,95,0.85)'; GF.rr(ctx, pillX, pillY, pillW, pillH, pillH / 2); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.textAlign = 'left';
  ctx.fillText(txt, pillX + padX, pillY + pillH / 2);
  ctx.fillStyle = '#ffd6e3';
  ctx.fillText(GF.t('score') + ' ' + alb, pillX + padX + tw + gap, pillY + pillH / 2);

  // tier badge (right of pill, near help button area) — small
  ctx.textAlign = 'right'; ctx.fillStyle = '#7a5a8f'; ctx.font = 'bold ' + (11 * S) + 'px sans-serif';
  ctx.fillText(GF.t('lv') + ' ' + gardenLevel + ' · ' + GF.t('tier') + ' ' + tier, W - 44 * S, pillY + pillH / 2);

  // help button (?)
  ctx.fillStyle = 'rgba(90,74,95,0.8)'; ctx.beginPath(); ctx.arc(L.btnHelp.x, L.btnHelp.y, L.btnHelp.r, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.font = 'bold ' + (15 * S) + 'px sans-serif'; ctx.textAlign = 'center';
  ctx.fillText('?', L.btnHelp.x, L.btnHelp.y + 1 * S);

  // daily egg button (glows when ready)
  var dr = L.btnDaily.r;
  if (dailyReady()) { var pp = 0.6 + 0.4 * Math.sin(gtime * 4); ctx.save(); ctx.shadowColor = '#ffd66b'; ctx.shadowBlur = 14 * S * pp; }
  ctx.fillStyle = dailyReady() ? '#ffd66b' : 'rgba(200,190,180,0.7)';
  ctx.beginPath(); ctx.ellipse(L.btnDaily.x, L.btnDaily.y, dr * 0.8, dr, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.6)'; ctx.beginPath(); ctx.arc(L.btnDaily.x - dr * 0.2, L.btnDaily.y - dr * 0.2, dr * 0.2, 0, Math.PI * 2); ctx.fill();
  if (dailyReady()) ctx.restore();
}

function drawHubButtons(ctx) {
  var S = GF.S;
  // shop button
  drawCircleBtn(ctx, L.btnShop, '#b8a6f0', function() {
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 2.4 * S; ctx.lineCap = 'round';
    var r = L.btnShop.r * 0.5;
    ctx.beginPath(); ctx.moveTo(-r, -r * 0.4); ctx.lineTo(-r * 0.6, -r * 0.4); ctx.lineTo(-r * 0.3, r * 0.5); ctx.lineTo(r * 0.7, r * 0.5); ctx.lineTo(r, -r * 0.4); ctx.lineTo(-r * 0.3, -r * 0.4); ctx.stroke();
  });
  // album button (book)
  drawCircleBtn(ctx, L.btnAlbum, '#8fd6b0', function() {
    var r = L.btnAlbum.r * 0.5;
    ctx.fillStyle = '#fff'; GF.rr(ctx, -r, -r * 0.7, r * 2, r * 1.4, 3 * S); ctx.fill();
    ctx.strokeStyle = '#8fd6b0'; ctx.lineWidth = 1.6 * S; ctx.beginPath(); ctx.moveTo(0, -r * 0.7); ctx.lineTo(0, r * 0.7); ctx.stroke();
  });
}

function drawCircleBtn(ctx, b, col, iconFn) {
  ctx.save();
  ctx.shadowColor = 'rgba(0,0,0,0.15)'; ctx.shadowBlur = 6 * GF.S; ctx.shadowOffsetY = 2 * GF.S;
  ctx.fillStyle = col; ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
  ctx.save(); ctx.translate(b.x, b.y); iconFn(); ctx.restore();
}

// ── SUB-PANELS ───────────────────────────────────────────────────────────
function panelScrim(ctx) { ctx.fillStyle = 'rgba(60,40,70,0.6)'; ctx.fillRect(0, 0, GF.W, GF.H); }
function panelCard(ctx, title) {
  var W = GF.W, H = GF.H, S = GF.S;
  var pw = Math.min(W - 28 * S, 460 * S), ph = Math.min(H - 100 * S, 560 * S);
  var px = (W - pw) / 2, py = (H - ph) / 2;
  ctx.fillStyle = '#fff6fb'; GF.rr(ctx, px, py, pw, ph, 22 * S); ctx.fill();
  ctx.fillStyle = '#7a5a8f'; ctx.font = 'bold ' + (22 * S) + 'px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  ctx.fillText(title, px + pw / 2, py + 34 * S);
  // close X
  var cb = { x: px + pw - 26 * S, y: py + 26 * S, r: 16 * S };
  ctx.fillStyle = 'rgba(122,90,143,0.15)'; ctx.beginPath(); ctx.arc(cb.x, cb.y, cb.r, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#7a5a8f'; ctx.lineWidth = 2.4 * S; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(cb.x - 5 * S, cb.y - 5 * S); ctx.lineTo(cb.x + 5 * S, cb.y + 5 * S); ctx.moveTo(cb.x + 5 * S, cb.y - 5 * S); ctx.lineTo(cb.x - 5 * S, cb.y + 5 * S); ctx.stroke();
  L._closeBtn = cb;
  return { px: px, py: py, pw: pw, ph: ph };
}

function drawAlbum(ctx) {
  panelScrim(ctx);
  var c = panelCard(ctx, GF.t('album'));
  var S = GF.S;
  var cols = 3;
  var cellW = (c.pw - 40 * S) / cols, cellH = cellW * 1.15;
  var x0 = c.px + 20 * S, y0 = c.py + 54 * S;
  for (var i = 0; i < SPECIES.length; i++) {
    var sp = SPECIES[i];
    var cxp = x0 + (i % cols) * cellW + cellW / 2;
    var cyp = y0 + Math.floor(i / cols) * cellH + cellH / 2;
    var got = !!album[sp.id];
    ctx.fillStyle = got ? '#ffeef6' : 'rgba(180,160,180,0.18)';
    GF.rr(ctx, cxp - cellW / 2 + 4 * S, cyp - cellH / 2 + 4 * S, cellW - 8 * S, cellH - 8 * S, 12 * S); ctx.fill();
    if (got) {
      drawPookie(ctx, cxp, cyp - cellH * 0.12, cellW * 0.28, sp, gtime);
      ctx.fillStyle = '#7a5a8f'; ctx.font = 'bold ' + (11 * S) + 'px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
      ctx.fillText(GF.lang === 'ru' ? sp.name_ru : sp.name, cxp, cyp + cellH * 0.34);
      if (sp.rare >= 2) { drawStar(ctx, cxp + cellW * 0.28, cyp - cellH * 0.3, 6 * S, '#ffce5c'); }
    } else {
      ctx.fillStyle = 'rgba(120,100,120,0.5)'; ctx.font = 'bold ' + (28 * S) + 'px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('?', cxp, cyp - cellH * 0.1);
    }
  }
}

function drawShop(ctx) {
  panelScrim(ctx);
  var c = panelCard(ctx, GF.t('shop'));
  var S = GF.S;
  var items = [
    { id: 'slot', label: GF.t('buyslot'), price: prices.slot, maxed: slots >= T.SLOTS_MAX, sub: slots + '/' + T.SLOTS_MAX },
    { id: 'ripen', label: GF.t('buyripen'), price: prices.ripen, maxed: ripenMult <= 0.55, sub: Math.round((1 - ripenMult) * 100) + '%' },
    { id: 'spawn', label: GF.t('buyspawn'), price: prices.spawn, maxed: spawnRich >= 2.5, sub: '+' + Math.round((spawnRich - 1) * 100) + '%' },
  ];
  L._shopBtns = [];
  var iy = c.py + 70 * S, ih = 78 * S;
  for (var i = 0; i < items.length; i++) {
    var it = items[i];
    var ix = c.px + 20 * S, iw = c.pw - 40 * S;
    var by = iy + i * (ih + 10 * S);
    ctx.fillStyle = '#ffeef6'; GF.rr(ctx, ix, by, iw, ih, 14 * S); ctx.fill();
    ctx.fillStyle = '#7a5a8f'; ctx.font = 'bold ' + (16 * S) + 'px sans-serif'; ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
    ctx.fillText(it.label, ix + 16 * S, by + 30 * S);
    ctx.fillStyle = '#a98fc0'; ctx.font = (12 * S) + 'px sans-serif';
    ctx.fillText(it.sub, ix + 16 * S, by + 52 * S);
    // buy button
    var bw = 96 * S, bh = 46 * S, bx = ix + iw - bw - 14 * S, byb = by + (ih - bh) / 2;
    var afford = food >= it.price && !it.maxed;
    ctx.fillStyle = it.maxed ? '#cdbcd8' : (afford ? '#8fd6b0' : '#e0c8b0');
    GF.rr(ctx, bx, byb, bw, bh, bh / 2); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.font = 'bold ' + (14 * S) + 'px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    if (it.maxed) ctx.fillText(GF.t('maxed'), bx + bw / 2, byb + bh / 2);
    else { ctx.fillText(it.price + ' ' + GF.t('food'), bx + bw / 2, byb + bh / 2); }
    L._shopBtns.push({ x: bx, y: byb, w: bw, h: bh, id: it.id, maxed: it.maxed });
  }
}

function drawDaily(ctx) {
  panelScrim(ctx);
  var c = panelCard(ctx, GF.t('daily'));
  var S = GF.S;
  var cxp = c.px + c.pw / 2, cyp = c.py + c.ph * 0.42;
  // big egg
  var er = 70 * S;
  if (dailyReady()) { var pp = 0.7 + 0.3 * Math.sin(gtime * 4); ctx.save(); ctx.shadowColor = '#ffd66b'; ctx.shadowBlur = 30 * S * pp; }
  var grd = ctx.createLinearGradient(cxp, cyp - er, cxp, cyp + er);
  grd.addColorStop(0, '#fff3da'); grd.addColorStop(1, dailyReady() ? '#ffd66b' : '#d8cfc4');
  ctx.fillStyle = grd; ctx.beginPath(); ctx.ellipse(cxp, cyp, er * 0.78, er, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.5)'; for (var s = 0; s < 3; s++) { ctx.beginPath(); ctx.arc(cxp + (s - 1) * er * 0.4, cyp + s * er * 0.18, er * 0.12, 0, Math.PI * 2); ctx.fill(); }
  if (dailyReady()) ctx.restore();
  ctx.fillStyle = '#7a5a8f'; ctx.font = (14 * S) + 'px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  ctx.fillText(dailyReady() ? GF.t('mystery') : GF.t('perday'), cxp, cyp + er + 26 * S);
  // claim button
  var bw = 200 * S, bh = 56 * S, bx = cxp - bw / 2, by = c.py + c.ph - bh - 26 * S;
  ctx.fillStyle = dailyReady() ? '#8fd6b0' : '#cdbcd8';
  GF.rr(ctx, bx, by, bw, bh, bh / 2); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.font = 'bold ' + (18 * S) + 'px sans-serif'; ctx.textBaseline = 'middle';
  ctx.fillText(dailyReady() ? GF.t('daily') : GF.t('close'), cxp, by + bh / 2);
  L._dailyBtn = { x: bx, y: by, w: bw, h: bh };
}

function drawCrack(ctx) {
  var W = GF.W, H = GF.H, S = GF.S;
  panelScrim(ctx);
  var co = crack.cocoon;
  var cxp = W / 2, cyp = H * 0.4;
  // the cocoon, shaking
  var shakeX = crack.done ? 0 : Math.sin(gtime * 40) * 2 * S;
  ctx.save(); ctx.translate(cxp + shakeX, cyp);
  var r = 60 * S;
  if (crack.done && crack.flashT > 0) {
    // hatched pookie reveal
    var sp = co._lastSp || SPECIES[0];
    var k = 1 - crack.flashT / 0.5;
    drawPookie(ctx, 0, 0, r * (0.7 + k * 0.3), sp, gtime);
    if (co._newSp) {
      ctx.fillStyle = '#ff6fae'; ctx.font = 'bold ' + (22 * S) + 'px sans-serif'; ctx.textAlign = 'center';
      ctx.fillText(GF.t('newspecies'), 0, -r - 16 * S);
      ctx.fillStyle = '#7a5a8f'; ctx.font = 'bold ' + (16 * S) + 'px sans-serif';
      ctx.fillText(GF.lang === 'ru' ? sp.name_ru : sp.name, 0, r + 30 * S);
    }
  } else {
    var img = GF.sprites['cocoon'];
    if (img && img.complete && img.naturalWidth > 0) ctx.drawImage(img, -r, -r, r * 2, r * 2);
    else {
      var grd = ctx.createLinearGradient(0, -r, 0, r);
      if (co.gold) { grd.addColorStop(0, '#ffe9a8'); grd.addColorStop(1, '#f0b840'); }
      else { grd.addColorStop(0, '#fff3da'); grd.addColorStop(1, '#e7c7a0'); }
      ctx.fillStyle = grd; ctx.beginPath(); ctx.ellipse(0, 0, r * 0.7, r, 0, 0, Math.PI * 2); ctx.fill();
    }
  }
  ctx.restore();

  if (!crack.done) {
    // timing bar
    var bw = T.CRACK_BAR_W * S, bh = T.CRACK_BAR_H * S;
    var bx = (W - bw) / 2, by = H * 0.66;
    ctx.fillStyle = 'rgba(255,255,255,0.85)'; GF.rr(ctx, bx, by, bw, bh, bh / 2); ctx.fill();
    // perfect zone
    var pz = T.PERFECT_ZONE; var zx = bx + bw * (0.5 - pz), zw = bw * pz * 2;
    ctx.fillStyle = '#7fd68f'; GF.rr(ctx, zx, by, zw, bh, bh / 2); ctx.fill();
    var pz2 = pz * 0.4; var zx2 = bx + bw * (0.5 - pz2), zw2 = bw * pz2 * 2;
    ctx.fillStyle = '#ffd45c'; GF.rr(ctx, zx2, by, zw2, bh, bh / 2); ctx.fill();
    // marker
    var mx = bx + bw * crack.pos;
    ctx.fillStyle = '#7a5a8f'; GF.rr(ctx, mx - 3 * S, by - 6 * S, 6 * S, bh + 12 * S, 3 * S); ctx.fill();
    // label
    ctx.fillStyle = '#fff'; ctx.font = 'bold ' + (18 * S) + 'px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
    ctx.fillText(GF.t('crack'), W / 2, by - 18 * S);
    // tap anywhere hint zone is the whole screen; also a close X
    var cb = { x: W - 30 * S, y: 40 * S, r: 16 * S };
    ctx.fillStyle = 'rgba(255,255,255,0.3)'; ctx.beginPath(); ctx.arc(cb.x, cb.y, cb.r, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 2.4 * S; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(cb.x - 5 * S, cb.y - 5 * S); ctx.lineTo(cb.x + 5 * S, cb.y + 5 * S); ctx.moveTo(cb.x + 5 * S, cb.y - 5 * S); ctx.lineTo(cb.x - 5 * S, cb.y + 5 * S); ctx.stroke();
    L._crackClose = cb;
  }
}

function drawToast(ctx) {
  if (toastT <= 0) return;
  var W = GF.W, S = GF.S;
  var a = Math.min(1, toastT / 0.4);
  ctx.save(); ctx.globalAlpha = a;
  ctx.font = 'bold ' + (15 * S) + 'px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  var tw = ctx.measureText(toastTxt).width;
  var pw = tw + 28 * S, ph = 32 * S, px = (W - pw) / 2, py = GF.H * 0.3;
  ctx.fillStyle = 'rgba(90,74,95,0.92)'; GF.rr(ctx, px, py, pw, ph, ph / 2); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.fillText(toastTxt, W / 2, py + ph / 2);
  ctx.restore();
}

function drawMenuPreview(ctx) {
  // a couple cute creatures behind the menu so it reads as the brand
  var W = GF.W, H = GF.H, S = GF.S;
  drawPookie(ctx, W * 0.28, H * 0.32, 40 * S, SPECIES[1], gtime);
  drawPookie(ctx, W * 0.72, H * 0.3, 34 * S, SPECIES[4], gtime + 1);
  drawPookie(ctx, W * 0.5, H * 0.7, 30 * S, SPECIES[2], gtime + 2);
}

function drawGameOver(ctx) {
  var W = GF.W, H = GF.H, S = GF.S;
  ctx.fillStyle = 'rgba(60,40,70,0.86)'; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#fff'; ctx.textAlign = 'center';
  ctx.font = 'bold ' + GF.clamp(34 * S, 22, 52) + 'px sans-serif';
  ctx.fillText(GF.t('gameover'), W / 2, H * 0.34);
  ctx.font = (17 * S) + 'px sans-serif'; ctx.fillStyle = '#ffd6e3';
  ctx.fillText(GF.t('species') + ': ' + albumCount + '/' + SPECIES.length + '   ' + GF.t('hatched') + ': ' + pookies, W / 2, H * 0.34 + 34 * S);
  ctx.fillStyle = '#cbb'; ctx.font = (14 * S) + 'px sans-serif';
  ctx.fillText(GF.t('best') + ': ' + best, W / 2, H * 0.34 + 58 * S);

  // RETRY button
  var bw = GF.clamp(248 * S, 180, 360), bh = GF.clamp(56 * S, 44, 76);
  var bx = W / 2 - bw / 2, by = H * 0.56;
  ctx.fillStyle = '#8fd6b0'; GF.rr(ctx, bx, by, bw, bh, bh / 2); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.font = 'bold ' + (20 * S) + 'px sans-serif'; ctx.textBaseline = 'middle';
  ctx.fillText(GF.t('retry'), W / 2, by + bh / 2);
  L._retryBtn = { x: bx, y: by, w: bw, h: bh };

  // dead-broke recovery (non-RV, Yandex 1.15): cheer up the garden for free
  var rw = GF.clamp(260 * S, 190, 380), rh = GF.clamp(46 * S, 38, 60);
  var rx = W / 2 - rw / 2, ry = by + bh + 16 * S;
  ctx.fillStyle = 'rgba(255,255,255,0.18)'; GF.rr(ctx, rx, ry, rw, rh, rh / 2); ctx.fill();
  ctx.strokeStyle = '#ffd6e3'; ctx.lineWidth = 1.6 * S; GF.rr(ctx, rx, ry, rw, rh, rh / 2); ctx.stroke();
  ctx.fillStyle = '#ffd6e3'; ctx.font = (14 * S) + 'px sans-serif'; ctx.textBaseline = 'middle';
  ctx.fillText(GF.t('revive'), W / 2, ry + rh / 2);
  L._reviveBtn = { x: rx, y: ry, w: rw, h: rh };
  ctx.textBaseline = 'alphabetic';
}

// ── INPUT ────────────────────────────────────────────────────────────────
// raw pointer in canvas/client px (canvas fills viewport => client==canvas px)
function pointFromEvent(e) {
  var r = GF.canvas.getBoundingClientRect();
  var t = e.touches && e.touches[0] ? e.touches[0] : (e.changedTouches && e.changedTouches[0] ? e.changedTouches[0] : e);
  var sx = GF.canvas.width / r.width, sy = GF.canvas.height / r.height;
  return { x: (t.clientX - r.left) * sx, y: (t.clientY - r.top) * sy };
}

function hit(b, x, y) { if (!b) return false; var dx = x - b.x, dy = y - b.y; return dx * dx + dy * dy <= b.r * b.r; }
function hitRect(b, x, y) { return b && x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h; }

function onDown(x, y) {
  // tutorial gets first dibs on taps (but our manual steps advance from actions)
  if (GF.tutorial.active) {
    // allow real interaction during the tutorial (feeding/cracking) so steps gate on it.
    // still let skip work:
    var consumed = GF.tutorial.handleClick(x, y);
    if (consumed && !GF.tutorial.active) {} // skipped
    // do NOT early-return: we want the real action underneath to happen.
  }

  if (gs === 'MENU') return; // overlay buttons handled by gf-lib click handler
  if (gs === 'GAMEOVER') {
    if (hitRect(L._retryBtn, x, y)) { GF.sfx('click'); startGame(); return; }
    if (hitRect(L._reviveBtn, x, y)) { GF.sfx('reward'); reviveGarden(); return; }
    return;
  }

  // sub-panels
  if (sub === 'CRACK') {
    if (crack && !crack.done) {
      if (hit(L._crackClose, x, y)) { closeCrack(); return; }
      doCrack(); return;
    }
    return;
  }
  if (sub === 'ALBUM' || sub === 'SHOP' || sub === 'DAILY') {
    if (hit(L._closeBtn, x, y)) { GF.sfx('click'); sub = null; return; }
    if (sub === 'SHOP' && L._shopBtns) { for (var i = 0; i < L._shopBtns.length; i++) { if (hitRect(L._shopBtns[i], x, y) && !L._shopBtns[i].maxed) { buy(L._shopBtns[i].id); return; } } }
    if (sub === 'DAILY' && hitRect(L._dailyBtn, x, y)) { if (dailyReady()) claimDaily(); else { sub = null; } return; }
    return;
  }

  // top buttons
  if (hit(L.btnMute, x, y)) { GF.toggleMute(); return; }
  if (hit(L.btnHelp, x, y)) { GF.tutorial.reopen(); tutStep = 0; return; }
  if (hit(L.btnDaily, x, y)) { sub = 'DAILY'; GF.sfx('click'); return; }
  if (hit(L.btnShop, x, y)) { sub = 'SHOP'; GF.sfx('click'); return; }
  if (hit(L.btnAlbum, x, y)) { sub = 'ALBUM'; GF.sfx('click'); return; }

  // ripe cocoon tap -> open crack
  for (var c = 0; c < cocoons.length; c++) {
    var p = slotPos(cocoons[c].slot);
    var rr2 = (T.COCOON_R + 14) * GF.S;
    if ((x - p.x) * (x - p.x) + (y - p.y) * (y - p.y) <= rr2 * rr2) {
      if (cocoons[c].ripen >= cocoons[c].dur) { openCrack(cocoons[c]); return; }
    }
  }

  // food chip: start a drag
  for (var f = 0; f < L.tray.chips.length; f++) {
    if (hit(L.tray.chips[f], x, y)) {
      drag = { food: L.tray.chips[f].food, x: x, y: y };
      selFood = L.tray.chips[f].food;
      GF.sfx('tap');
      return;
    }
  }

  // tap-then-tap path: a food is selected, tapping a caterpillar feeds it
  if (selFood) {
    if (tryFeedAt(x, y, selFood)) { selFood = null; return; }
  }

  // one-tap-to-feed fallback: a direct tap on a hungry caterpillar feeds it the
  // cheapest unlocked food (so a player can just tap a bug; drag is for choosing
  // a specific food / higher-tier combos).
  if (tryFeedAt(x, y, unlockedFoods()[0].id)) return;
}

function onMove(x, y) {
  if (drag) { drag.x = x; drag.y = y; }
}

function onUp(x, y) {
  if (drag) {
    // drop on a caterpillar?
    tryFeedAt(x, y, drag.food);
    drag = null;
  }
}

function tryFeedAt(x, y, fid) {
  for (var i = 0; i < cats.length; i++) {
    var c = cats[i];
    var rad = catR(c) + 16 * GF.S;
    if ((x - c.x) * (x - c.x) + (y - c.y) * (y - c.y) <= rad * rad && c.fed < T.FEEDS_TO_COCOON) {
      return feedCat(c, fid);
    }
  }
  return false;
}

function reviveGarden() {
  // free non-RV pick-me-up: restart the run but KEEP this session's hatched count
  // as best already saved; give a joy cushion. Album persists regardless.
  var keep = pookies;
  startGame();
  joy = 70;
  GF.tutorial.active = false;
}

// wire raw pointer events on the canvas (drag + tap)
(function bindPointer() {
  var cv = GF.canvas;
  var downId = null;
  cv.addEventListener('pointerdown', function(e) { var p = pointFromEvent(e); onDown(p.x, p.y); }, { passive: true });
  cv.addEventListener('pointermove', function(e) { if (drag) { var p = pointFromEvent(e); onMove(p.x, p.y); } }, { passive: true });
  window.addEventListener('pointerup', function(e) { var p = pointFromEvent(e); onUp(p.x, p.y); }, { passive: true });
  // touch fallback (some webviews need it)
  cv.addEventListener('touchstart', function(e) { var p = pointFromEvent(e); onDown(p.x, p.y); }, { passive: false });
  cv.addEventListener('touchmove', function(e) { if (drag) { var p = pointFromEvent(e); onMove(p.x, p.y); } }, { passive: false });
  cv.addEventListener('touchend', function(e) { var p = pointFromEvent(e); onUp(p.x, p.y); }, { passive: false });
})();

// ── BOT + ECON HOOKS (for the balance probe + econ_sim_check) ────────────
GF.exposeBot(
  function() {
    if (gs !== 'PLAYING') return [];
    var acts = [];
    // crack a ripe cocoon
    for (var i = 0; i < cocoons.length; i++) if (cocoons[i].ripen >= cocoons[i].dur) { acts.push('crack'); break; }
    // feed a hungry cat if affordable
    if (food >= T.FEED_COST) for (var j = 0; j < cats.length; j++) if (cats[j].fed < T.FEEDS_TO_COCOON) { acts.push('feed'); break; }
    if (food >= prices.slot && slots < T.SLOTS_MAX) acts.push('buy_slot');
    if (sub === 'CRACK' && crack && !crack.done) acts.push('do_crack');
    return acts;
  },
  function(a) {
    if (a === 'feed') { for (var j = 0; j < cats.length; j++) if (cats[j].fed < T.FEEDS_TO_COCOON) { feedCat(cats[j], unlockedFoods()[0].id); return; } }
    else if (a === 'crack') { for (var i = 0; i < cocoons.length; i++) if (cocoons[i].ripen >= cocoons[i].dur) { openCrack(cocoons[i]); return; } }
    else if (a === 'do_crack') { if (crack) { crack.pos = 0.5; doCrack(); } }
    else if (a === 'buy_slot') { buy('slot'); }
  }
);

// Reachability gate (Yandex 1.10.x): every interactive control sits inside the
// viewport — the tray chips, hub buttons and top-bar controls are pinned and on
// short-wide / mobile frames must never hide under platform chrome. Reported in
// SCREEN px; panels fit the viewport (album is a fixed grid, no scroll needed).
GF.exposeReach(function() {
  var S = GF.S, items = [];
  function push(id, b, isRect) {
    if (!b) return;
    if (isRect) items.push({ id: id, x: b.x, y: b.y, w: b.w, h: b.h, pinned: true });
    else items.push({ id: id, x: b.x - b.r, y: b.y - b.r, w: b.r * 2, h: b.r * 2, pinned: true });
  }
  if (gs === 'PLAYING' && !sub) {
    for (var i = 0; i < (L.tray && L.tray.chips ? L.tray.chips.length : 0); i++) push('food_' + i, L.tray.chips[i]);
    push('shop', L.btnShop); push('album', L.btnAlbum);
    push('help', L.btnHelp); push('mute', L.btnMute); push('daily', L.btnDaily);
  } else if (gs === 'GAMEOVER') {
    push('retry', L._retryBtn, true); push('revive', L._reviveBtn, true);
  } else if (sub === 'SHOP' && L._shopBtns) {
    for (var k = 0; k < L._shopBtns.length; k++) push('buy_' + k, L._shopBtns[k], true);
    push('close', L._closeBtn);
  } else if (sub === 'CRACK') {
    push('crack_close', L._crackClose);
  } else if (sub) {
    push('close', L._closeBtn);
  }
  return { screen: gs + (sub ? ':' + sub : ''), items: items, screenH: GF.H };
});

// Screen tour for the reachability gate — navigate to each screen so the checker
// can prove every control fits the viewport at 393x852 AND 1280x720.
GF.exposeTour([
  { name: 'playing',  go: function() { if (gs !== 'PLAYING') setupForScreenshot(3); sub = null; layout(); } },
  { name: 'shop',     go: function() { if (gs !== 'PLAYING') setupForScreenshot(3); sub = 'SHOP'; layout(); draw(GF.ctx); } },
  { name: 'album',    go: function() { if (gs !== 'PLAYING') setupForScreenshot(3); sub = 'ALBUM'; layout(); draw(GF.ctx); } },
  { name: 'daily',    go: function() { if (gs !== 'PLAYING') setupForScreenshot(3); sub = 'DAILY'; layout(); draw(GF.ctx); } },
  { name: 'gameover', go: function() { setupForScreenshot(3); gs = 'GAMEOVER'; sub = null; layout(); draw(GF.ctx); } },
]);

GF.exposeState(function() {
  return {
    gs: gs, sub: sub, joy: Math.round(joy), food: Math.round(food),
    pookies: pookies, score: albumCount, albumCount: albumCount,
    gardenLevel: gardenLevel, tier: tier, slots: slots,
    cats: cats.length, cocoons: cocoons.length, hatchesThisLevel: hatchesThisLevel,
    best: best,
  };
});

// Pure economy model (~30 lines) wired to the SAME constants T.
// currency = food; progress = total hatched (pookies). Actions = feed (spend
// food, fattens toward a cocoon+hatch), buy_slot/ripen/spawn. 'wait' regenerates
// food and ripens. This mirrors the real loop closely enough for econ_sim_check.
window.__gfEcon = {
  genre: 'idle',   // food regen + cocoon ripening keep income flowing during idle gaps
  params: T,
  initialState: function() {
    return { food: 10, hatched: 0, slots: T.SLOTS_BASE, occ: 0, fedTotal: 0, ripe: 0, ripenT: 0,
             pSlot: 8, pRipen: 10, pSpawn: 12, ripenMult: 1, level: 1, tier: 1, hpl: 0 };
  },
  actions: function(s) {
    var out = [];
    // feeding: costs FEED_COST, but the meaningful "progression cost" the sim
    // tracks is a full cocoon's worth of food (FEEDS_TO_COCOON feeds).
    out.push({ id: 'feed', cost: T.FEED_COST, ready: s.food >= T.FEED_COST && s.occ < s.slots });
    // crack a ripe cocoon (free, yields food+progress) — keep cheap so the loop flows
    out.push({ id: 'crack', cost: 0, ready: s.ripe > 0 });
    out.push({ id: 'buy_slot', cost: s.pSlot, ready: s.food >= s.pSlot && s.slots < T.SLOTS_MAX });
    out.push({ id: 'buy_ripen', cost: s.pRipen, ready: s.food >= s.pRipen && s.ripenMult > 0.55 });
    out.push({ id: 'buy_spawn', cost: s.pSpawn, ready: s.food >= s.pSpawn });
    return out;
  },
  step: function(s, a) {
    s = Object.assign({}, s);
    if (a.id === 'wait') {
      var dt = a.dt || 1;
      s.food = Math.min(T.FOOD_CAP, s.food + T.FOOD_REGEN * dt);
      // ripen the oldest cocoon
      if (s.occ > 0) { s.ripenT += dt; if (s.ripenT >= T.RIPEN_SEC * s.ripenMult) { s.ripenT = 0; s.ripe = Math.min(s.occ, s.ripe + 1); } }
      return s;
    }
    if (a.id === 'feed') {
      s.food = Math.max(0, s.food - T.FEED_COST); s.fedTotal++;
      if (s.fedTotal % T.FEEDS_TO_COCOON === 0 && s.occ < s.slots) s.occ++;
      return s;
    }
    if (a.id === 'crack') {
      if (s.ripe > 0) {
        s.ripe--; s.occ = Math.max(0, s.occ - 1); s.hatched++; s.hpl++;
        s.food = Math.min(T.FOOD_CAP, s.food + T.FOOD_PER_HATCH);
        while (s.hpl >= T.LEVELUP_EVERY) { s.hpl -= T.LEVELUP_EVERY; s.level++; s.tier = Math.min(5, 1 + ((s.level - 1) >> 1)); }
      }
      return s;
    }
    if (a.id === 'buy_slot') { s.food -= s.pSlot; s.slots = Math.min(T.SLOTS_MAX, s.slots + 1); s.pSlot = Math.round(s.pSlot * 1.8); return s; }
    if (a.id === 'buy_ripen') { s.food -= s.pRipen; s.ripenMult = Math.max(0.5, s.ripenMult - 0.15); s.pRipen = Math.round(s.pRipen * 1.7); return s; }
    if (a.id === 'buy_spawn') { s.food -= s.pSpawn; s.pSpawn = Math.round(s.pSpawn * 1.7); return s; }
    return s;
  },
  metrics: function(s) { return { currency: s.food, progress: s.hatched }; },
};

// ── BOOT ─────────────────────────────────────────────────────────────────
GF.init({
  designW: 393, designH: 852,
  strings: STRINGS,
  sprites: SPRITE_NAMES,
  saveKey: 'pookie_pupae',
  onReady: function() {
    try { best = parseInt(localStorage.getItem('pookie_pupae_best') || '0') || 0; } catch (e) {}
    try { dailyClaimedDay = parseInt(localStorage.getItem('pookie_pupae_daily') || '0') || 0; } catch (e) {}
    loadAlbum();

    // Persist run state across reload (Yandex 1.9)
    GF.persist('pookie_pupae_run_v1',
      function() {
        return {
          gs: gs, joy: joy, food: food, pookies: pookies, gardenLevel: gardenLevel,
          tier: tier, hatchesThisLevel: hatchesThisLevel, slots: slots,
          ripenMult: ripenMult, spawnRich: spawnRich, prices: prices,
          cats: cats.map(function(c) { return { x: c.x, y: c.y, fed: c.fed, hue: c.hue, ready: !!c.ready, wander: c.wander }; }),
          cocoons: cocoons.map(function(o) { return { slot: o.slot, species: o.species, ripen: o.ripen, dur: o.dur, twin: !!o.twin, gold: !!o.gold }; }),
        };
      },
      function(s) {
        if (!s) return;
        gs = s.gs || 'MENU';
        joy = (typeof s.joy === 'number') ? s.joy : T.JOY_START;
        food = s.food || 10; pookies = s.pookies || 0;
        gardenLevel = s.gardenLevel || 1; tier = s.tier || 1;
        hatchesThisLevel = s.hatchesThisLevel || 0; slots = s.slots || T.SLOTS_BASE;
        ripenMult = s.ripenMult || 1; spawnRich = s.spawnRich || 1;
        if (s.prices) prices = s.prices;
        cats = []; if (s.cats) { for (var i = 0; i < s.cats.length; i++) { var sc = s.cats[i]; cats.push({ x: sc.x, y: sc.y, tx: sc.x, ty: sc.y, fed: sc.fed || 0, hue: sc.hue || 0, ready: !!sc.ready, wander: sc.wander || T.CAT_WANDER_SEC, wob: 0, born: 1, pop: 0 }); } }
        cocoons = []; if (s.cocoons) { for (var j = 0; j < s.cocoons.length; j++) cocoons.push(s.cocoons[j]); }
        if (gs === 'CRACK' || gs === 'SHOP' || gs === 'ALBUM' || gs === 'DAILY') gs = 'PLAYING';
      }
    );
    if (gs === 'PLAYING') { ensureCatR(); GF.gameStarted(); } // resumed mid-run
    else gs = 'MENU';

    // Music (HARD RULE 8): looping bg + procedural 'calm' fallback, mute-aware
    GF.bgMusic({ file: 'audio/bg_track.mp3', preset: 'calm', muted: GF.muted });

    // Remote config (live-ops, DATA only) — resolves instantly with defaults
    GF.remoteConfig('pookie_pupae', CFG, {
      clamps: { 'tuning.joy_drain_mult': [0.5, 2], 'tuning.spawn_mult': [0.5, 2] },
      onUpdate: function(c) { CFG = c; },
    }).then(function(c) { CFG = c; });

    // Platform autostart (HARD RULE 9): drop straight into gameplay
    if (window.__GF_AUTOSTART && !window._silent && gs === 'MENU') {
      startGame();
    }
  },
  onUpdate: update,
  onDraw: draw,
});

})();
</script>
