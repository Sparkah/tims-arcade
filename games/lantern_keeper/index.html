<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Lantern Keeper: Graveyard Shift</title>
    <link rel="stylesheet" href="src/styles.css" />
  </head>
  <body>
    <main class="game-shell">
      <header class="hud" id="hud">
        <div class="hud-row"><strong>Night:</strong> <span id="nightLabel">1/3</span></div>
        <div class="hud-row"><strong>Phase:</strong> <span id="phaseLabel">Start</span></div>
        <div class="hud-row"><strong>Time:</strong> <span id="timerLabel">0</span></div>
        <div class="hud-row"><strong>Health:</strong> <span id="healthLabel">60</span></div>
        <div class="hud-row"><strong>Guided/Lost:</strong> <span id="spiritsLabel">0 / 0</span></div>
      </header>

      <canvas id="gameCanvas" width="1280" height="720" aria-label="Lantern Keeper game"></canvas>

      <aside class="inventory" id="inventoryPanel">
        <div class="inv-title">Inventory</div>
        <div class="inv-grid">
          <button class="inv-item" id="selFuel1">T1 <span id="fuel1Count">0</span></button>
          <button class="inv-item" id="selFuel2">T2 <span id="fuel2Count">0</span></button>
          <button class="inv-item" id="selFuel3">T3 <span id="fuel3Count">0</span></button>
          <div class="inv-stat">Wax <span id="waxCount">0</span></div>
          <div class="inv-stat">Herb <span id="herbCount">0</span></div>
          <div class="inv-stat">Ember <span id="emberCount">0</span></div>
        </div>
        <div class="craft-row">
          <button id="craftT1">Craft T1 (1+1+1)</button>
          <button id="craftT2">Merge T2 (2xT1)</button>
          <button id="craftT3">Merge T3 (2xT2)</button>
        </div>
      </aside>

      <section class="overlay" id="overlay">
        <div class="overlay-card" id="overlayCard">
          <h1>Lantern Keeper</h1>
          <p>Restore warmth to guide spirits home.</p>
          <p>Move: WASD/Arrows | Interact: E | Craft: 1/2/3 | Fullscreen: F</p>
          <button id="startBtn">Start Run</button>
        </div>
      </section>

      <div class="mobile-controls" id="mobileControls">
        <div class="dpad">
          <button data-dir="up">▲</button>
          <button data-dir="left">◀</button>
          <button data-dir="down">▼</button>
          <button data-dir="right">▶</button>
        </div>
        <div class="actions">
          <button id="touchInteract">Interact</button>
          <button id="touchCraft1">T1</button>
          <button id="touchCraft2">T2</button>
          <button id="touchCraft3">T3</button>
        </div>
      </div>

      <div class="toast" id="toast"></div>
    </main>

    <script type="module" src="src/game.js"></script>
  </body>
</html>
