var ROWS = 4;
var COLS = 6;
var START_SPRAY = 9;
var START_BLADES = 7;
var START_TAGS = 3;
var PANIC_LIMIT = 6;
var BASE_SPREAD_INTERVAL = 5.8;
var INSPECT_REVEAL_SEC = 0.55;
var FIELD_COMPLETE_DELAY = 1.55;
var WRONG_ACTION_PANIC = 1;
var LEAF_W = 58;
var LEAF_H = 48;
var PATCH_RADIUS = 15;
var TOOL_BUTTON_H = 58;
var HUD_ROW_H = 34;

var TOOLS = [
  { id: 'inspect', key: 'tool_inspect', shortKey: 'short_inspect', color: '#72d6d1' },
  { id: 'prune', key: 'tool_prune', shortKey: 'short_prune', color: '#f0b35b' },
  { id: 'spray', key: 'tool_spray', shortKey: 'short_spray', color: '#8bd36c' },
  { id: 'quarantine', key: 'tool_quarantine', shortKey: 'short_quarantine', color: '#f07b7b' }
];

var DISEASES = {
  blight: { key: 'disease_blight', primary: 'prune', color: '#8a4f32', accent: '#d19158', score: 90 },
  mildew: { key: 'disease_mildew', primary: 'spray', color: '#dbe8d4', accent: '#91cfd0', score: 105 },
  rust: { key: 'disease_rust', primary: 'spray', alt: 'prune', color: '#c86c2d', accent: '#ffd06b', score: 130 },
  pest: { key: 'disease_pest', primary: 'quarantine', color: '#59422c', accent: '#f06c70', score: 160 }
};

var scene = { x: 0, y: 0, w: 0, h: 0, ui: 1, top: 0, bottom: 0 };
var uiRects = {};
var gs = 'PLAYING';
var gameOverReason = 'reason_panic';
var field = 1;
var score = 0;
var best = 0;
var highField = 1;
var spray = START_SPRAY;
var blades = START_BLADES;
var tags = START_TAGS;
var panic = 0;
var rowsTarget = 1;
var savedRows = 0;
var healthyPlants = ROWS * COLS;
var grid = [];
var rows = [];
var selectedTool = 'inspect';
var cursor = { row: 1, col: 2 };
var spreadTimer = BASE_SPREAD_INTERVAL;
var spreadInterval = BASE_SPREAD_INTERVAL;
var spreadFlash = [];
var fieldCompleteTimer = 0;
var elapsed = 0;
var coachPulse = 0;
var tutorialDone = false;
var coachStep = 0;
var helpOpen = false;
var rngSeed = 23917;
var started = false;
var lastSfx = {};
var lastMessage = { text: '', t: 0, color: '#ffffff' };
var diseaseLog = {};
var flags = { inspected: false, pickedPrune: false, treated: false };
var screenshotMode = false;

function clamp(v, lo, hi) { return v < lo ? lo : v > hi ? hi : v; }
function lerp(a, b, t) { return a + (b - a) * t; }
function seededRandom() {
  rngSeed = (rngSeed * 1664525 + 1013904223) >>> 0;
  return rngSeed / 4294967296;
}
function choice(arr) { return arr[Math.floor(seededRandom() * arr.length) % arr.length]; }
function roundRect(c, x, y, w, h, r) {
  r = Math.max(0, Math.min(r, w / 2, h / 2));
  c.beginPath();
  c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r);
  c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r);
  c.arcTo(x, y, x + w, y, r);
  c.closePath();
}
function sfx(name, gapMs) {
  var now = Date.now();
  var gap = gapMs || 80;
  if (lastSfx[name] && now - lastSfx[name] < gap) return;
  lastSfx[name] = now;
  GF.sfx(name);
}
function msg(key, color) {
  lastMessage.text = GF.t(key);
  lastMessage.t = 1.35;
  lastMessage.color = color || '#ffffff';
}

function layout() {
  var minSide = Math.max(1, Math.min(GF.W, GF.H));
  var raw = Math.min(GF.W / 440, GF.H / 760);
  var ui = clamp(raw, 0.72, 1.20);
  if (minSide < 420) ui = Math.max(ui, 0.82);
  var top = Math.round(clamp(90 * ui, 70, 112));
  var bottom = Math.round(clamp(88 * ui, 74, 106));
  if (GF.W < 560) {
    top = Math.round(clamp(130 * ui, 104, 140));
    bottom = Math.round(clamp(92 * ui, 78, 112));
  }
  scene.ui = ui;
  scene.top = top;
  scene.bottom = bottom;
  scene.x = Math.round(10 * ui);
  scene.y = top;
  scene.w = Math.max(220, GF.W - scene.x * 2);
  scene.h = Math.max(170, GF.H - top - bottom - 8 * ui);
  uiRects.help = { x: GF.W - 44 * ui, y: 8 * ui, w: 32 * ui, h: 32 * ui };
  uiRects.mute = { x: GF.W - 82 * ui, y: 8 * ui, w: 32 * ui, h: 32 * ui };
  uiRects.retry = { x: GF.cx - 76 * ui, y: GF.cy + 76 * ui, w: 152 * ui, h: 44 * ui };
  uiRects.helpClose = { x: GF.cx - 74 * ui, y: GF.cy + 172 * ui, w: 148 * ui, h: 40 * ui };
  uiRects.tools = [];
  var gap = 7 * ui;
  var toolY = GF.H - bottom + 14 * ui;
  var toolW = (GF.W - gap * 5) / 4;
  for (var i = 0; i < 4; i++) {
    uiRects.tools.push({ x: gap + i * (toolW + gap), y: toolY, w: toolW, h: TOOL_BUTTON_H * ui });
  }
}
function fs(base) {
  var boost = Math.min(GF.W, GF.H) < 430 ? 1.08 : 1;
  return Math.max(9, Math.round(base * scene.ui * boost));
}
function drawText(c, txt, x, y, size, color, align, weight) {
  c.font = (weight || '700') + ' ' + String(Math.round(size)) + 'px system-ui, -apple-system, Segoe UI, sans-serif';
  c.fillStyle = color || '#fff';
  c.textAlign = align || 'left';
  c.textBaseline = 'middle';
  c.fillText(String(txt), x, y);
}
function fitText(c, txt, x, y, maxW, size, color, align, weight) {
  var s = size;
  c.font = (weight || '700') + ' ' + String(Math.round(s)) + 'px system-ui, -apple-system, Segoe UI, sans-serif';
  while (s > 9 && c.measureText(String(txt)).width > maxW) {
    s -= 1;
    c.font = (weight || '700') + ' ' + String(Math.round(s)) + 'px system-ui, -apple-system, Segoe UI, sans-serif';
  }
  c.fillStyle = color || '#fff';
  c.textAlign = align || 'left';
  c.textBaseline = 'middle';
  c.fillText(String(txt), x, y);
}
function wrapLines(c, text, maxW, size, maxLines) {
  c.font = '650 ' + String(Math.round(size)) + 'px system-ui, -apple-system, Segoe UI, sans-serif';
  var words = String(text).split(/\s+/);
  var lines = [];
  var line = '';
  for (var i = 0; i < words.length; i++) {
    var next = line ? line + ' ' + words[i] : words[i];
    if (line && c.measureText(next).width > maxW) {
      lines.push(line);
      line = words[i];
      if (maxLines && lines.length >= maxLines - 1) break;
    } else {
      line = next;
    }
  }
  if (line) lines.push(line);
  if (maxLines && lines.length > maxLines) lines.length = maxLines;
  return lines;
}

function leafAt(row, col) {
  if (row < 0 || row >= ROWS || col < 0 || col >= COLS) return null;
  return grid[row] && grid[row][col];
}
function leafRect(row, col) {
  var cw = scene.w / COLS;
  var ch = scene.h / ROWS;
  var w = Math.min(LEAF_W * scene.ui, cw * 0.78);
  var h = Math.min(LEAF_H * scene.ui, ch * 0.58);
  var x = scene.x + col * cw + cw / 2;
  var y = scene.y + row * ch + ch / 2;
  return { x: x, y: y, w: w, h: h, left: x - w / 2, top: y - h / 2 };
}
function leafFromPoint(x, y) {
  if (x < scene.x || x > scene.x + scene.w || y < scene.y || y > scene.y + scene.h) return null;
  var col = clamp(Math.floor((x - scene.x) / Math.max(1, scene.w / COLS)), 0, COLS - 1);
  var row = clamp(Math.floor((y - scene.y) / Math.max(1, scene.h / ROWS)), 0, ROWS - 1);
  var r = leafRect(row, col);
  if (x < r.left - 8 * scene.ui || x > r.left + r.w + 8 * scene.ui || y < r.top - 8 * scene.ui || y > r.top + r.h + 8 * scene.ui) return null;
  return { row: row, col: col };
}
function hitRect(p, r) {
  return r && p.x >= r.x && p.x <= r.x + r.w && p.y >= r.y && p.y <= r.y + r.h;
}
function activeLeaf(lf) {
  return lf && (lf.status === 'suspect' || lf.status === 'infected') && !!lf.disease;
}
function rowActiveCount(r) {
  var n = 0;
  if (!grid[r] || rows[r].quarantined) return 0;
  for (var c = 0; c < COLS; c++) if (activeLeaf(grid[r][c])) n++;
  return n;
}
function activeCount() {
  var n = 0;
  for (var r = 0; r < ROWS; r++) n += rowActiveCount(r);
  return n;
}
function diseaseName(id) {
  return DISEASES[id] ? GF.t(DISEASES[id].key) : GF.t('none');
}
function currentResource(tool) {
  if (tool === 'spray') return spray;
  if (tool === 'prune') return blades;
  if (tool === 'quarantine') return tags;
  return 99;
}
function spendResource(tool) {
  if (tool === 'spray') {
    if (spray <= 0) return false;
    spray--;
  } else if (tool === 'prune') {
    if (blades <= 0) return false;
    blades--;
  } else if (tool === 'quarantine') {
    if (tags <= 0) return false;
    tags--;
  }
  return true;
}

function targetForField(n) {
  if (n <= 1) return 1;
  if (n <= 3) return 2;
  if (n <= 5) return 3;
  return 4;
}
function diseasePool(n) {
  var pool = ['blight'];
  if (n >= 2) pool.push('mildew');
  if (n >= 3) pool.push('rust');
  if (n >= 4) pool.push('pest');
  return pool;
}
function makeLeaf(row, col) {
  return {
    row: row,
    col: col,
    status: 'healthy',
    disease: null,
    inspected: false,
    severity: 0,
    reveal: 0,
    pulse: seededRandom() * Math.PI * 2,
    shade: 0.88 + seededRandom() * 0.20,
    justChanged: 0
  };
}
function spawnDisease(disease, row, col, inspected) {
  var lf = leafAt(row, col);
  if (!lf || rows[row].quarantined || lf.status === 'dead' || lf.status === 'cut') return false;
  lf.status = inspected ? 'infected' : 'suspect';
  lf.disease = disease;
  lf.inspected = !!inspected;
  lf.severity = 0.08 + seededRandom() * 0.18;
  lf.reveal = inspected ? INSPECT_REVEAL_SEC : 0;
  lf.justChanged = 0.9;
  rows[row].hadDisease = true;
  cursor.row = row;
  cursor.col = col;
  return true;
}
function clearLeaf(lf, mode) {
  var d = lf.disease;
  lf.disease = null;
  lf.inspected = true;
  lf.severity = 0;
  lf.reveal = 0;
  lf.justChanged = 0.8;
  if (mode === 'prune') lf.status = 'cut';
  else if (mode === 'quarantine') lf.status = 'quarantined';
  else lf.status = 'treated';
  return d;
}
function buildGrid() {
  grid = [];
  rows = [];
  for (var r = 0; r < ROWS; r++) {
    rows.push({ hadDisease: false, saved: false, quarantined: false, flash: 0 });
    var line = [];
    for (var c = 0; c < COLS; c++) line.push(makeLeaf(r, c));
    grid.push(line);
  }
}
function seedOutbreaks() {
  var pool = diseasePool(field);
  var order = [1, 2, 0, 3];
  var used = {};
  for (var i = 0; i < rowsTarget; i++) {
    var row = order[i % order.length];
    if (used[row]) row = i % ROWS;
    used[row] = true;
    var col = field === 1 ? 2 : clamp(1 + Math.floor(seededRandom() * (COLS - 2)), 1, COLS - 2);
    var disease = field === 1 ? 'blight' : pool[(i + field - 1) % pool.length];
    if (field >= 5 && i === rowsTarget - 1) disease = 'pest';
    spawnDisease(disease, row, col, false);
  }
}
function updateCounts() {
  var hp = 0;
  for (var r = 0; r < ROWS; r++) {
    for (var c = 0; c < COLS; c++) {
      var st = grid[r][c].status;
      if (st !== 'dead' && st !== 'cut') hp++;
    }
  }
  healthyPlants = hp;
}
function saveMeta() {
  if (score > best) best = score;
  if (field > highField) highField = field;
  GF.saveRun();
}
function getMeta() {
  return { best: best, highField: highField, diseaseLog: diseaseLog };
}
function applyMeta(s) {
  if (!s || typeof s !== 'object') return;
  best = Math.max(0, Number(s.best) || 0);
  highField = Math.max(1, Number(s.highField) || 1);
  diseaseLog = s.diseaseLog && typeof s.diseaseLog === 'object' ? s.diseaseLog : {};
}
function startField(n) {
  field = Math.max(1, Math.floor(n));
  rowsTarget = targetForField(field);
  spray = Math.max(4, START_SPRAY + Math.min(3, field) - Math.max(0, Math.floor((field - 5) / 2)));
  blades = Math.max(3, START_BLADES + Math.min(2, Math.floor(field / 2)) - Math.max(0, Math.floor((field - 6) / 2)));
  tags = Math.max(1, START_TAGS - Math.floor(Math.max(0, field - 4) / 3));
  panic = 0;
  savedRows = 0;
  spreadInterval = Math.max(2.6, BASE_SPREAD_INTERVAL - (field - 1) * 0.38);
  spreadTimer = field === 1 ? spreadInterval * 0.88 : spreadInterval * 0.62;
  fieldCompleteTimer = 0;
  elapsed = 0;
  selectedTool = 'inspect';
  buildGrid();
  seedOutbreaks();
  updateCounts();
  saveMeta();
}
function startGame(opts) {
  opts = opts || {};
  gs = 'PLAYING';
  score = 0;
  rngSeed = 23917 + Math.floor(Date.now() % 100000);
  flags = { inspected: false, pickedPrune: false, treated: false };
  helpOpen = false;
  screenshotMode = !!opts.screenshot;
  try { tutorialDone = opts.suppressTutorial ? true : localStorage.getItem('blight_patrol_tutorial_v1') === '1'; } catch (e) { tutorialDone = !!opts.suppressTutorial; }
  coachStep = tutorialDone ? 99 : 0;
  startField(1);
  GF.gameStarted();
}
function gameOver(reason) {
  if (gs === 'GAMEOVER') return;
  gameOverReason = reason || 'reason_panic';
  gs = 'GAMEOVER';
  sfx('lose', 500);
  GF.setShake(0.55);
  saveMeta();
  GF.gameEnded();
  GF.ads.interstitial();
}
function completeField() {
  if (fieldCompleteTimer > 0 || gs !== 'PLAYING') return;
  fieldCompleteTimer = FIELD_COMPLETE_DELAY;
  score += 220 + field * 45 + healthyPlants * 3 + (spray + blades + tags) * 9;
  sfx('levelup', 350);
  GF.setShake(0.25);
  GF.spawnParticles(GF.cx, scene.y + scene.h * 0.35, '#f5d36e', 30);
  saveMeta();
  if (score >= best && best > 0) GF.happytime();
}
function updateSavedRows() {
  for (var r = 0; r < ROWS; r++) {
    if (rows[r].saved) continue;
    if (rows[r].quarantined || (rows[r].hadDisease && rowActiveCount(r) === 0)) {
      rows[r].saved = true;
      rows[r].flash = 1;
      savedRows++;
      score += 85 + field * 12;
      sfx('reward', 140);
      var rr = leafRect(r, Math.floor(COLS / 2));
      GF.spawnParticles(rr.x, rr.y, '#95df72', 16);
      msg(rows[r].quarantined ? 'row_sealed' : 'row_saved', '#b8f58a');
      saveMeta();
    }
  }
  if (savedRows >= rowsTarget && activeCount() === 0) completeField();
}
function treatmentCorrect(tool, lf) {
  if (!activeLeaf(lf)) return false;
  var d = DISEASES[lf.disease];
  if (!d) return false;
  return d.primary === tool || d.alt === tool;
}
function wrongAction(x, y, resourceAlreadySpent) {
  if (!resourceAlreadySpent) {
    if (selectedTool !== 'inspect' && currentResource(selectedTool) <= 0) {
      msg('no_resource', '#ffaaa5');
      sfx('error', 180);
      panic = Math.min(PANIC_LIMIT, panic + WRONG_ACTION_PANIC);
      GF.setShake(0.28);
      return;
    }
  }
  panic = Math.min(PANIC_LIMIT, panic + WRONG_ACTION_PANIC);
  msg('wrong_tool', '#ffaaa5');
  sfx('error', 180);
  GF.setShake(0.25);
  GF.spawnFloat(x, y, '+' + GF.t('panic'), '#ffaaa5');
  if (panic >= PANIC_LIMIT) gameOver('reason_panic');
}
function inspectLeaf(lf) {
  if (rows[lf.row].quarantined) {
    msg('row_sealed', '#f4cf6b');
    sfx('click', 120);
    return;
  }
  if (activeLeaf(lf)) {
    lf.inspected = true;
    lf.status = 'infected';
    lf.reveal = INSPECT_REVEAL_SEC;

function spreadTargetFrom(lf) {

    var tmp = dirs[i]; dirs[i] = dirs[j]; dirs[j] = tmp;
  }
  for (var d = 0; d < dirs.length; d++) {

    var nc = lf.col + dirs[d][1];

    var dr = leafRect(dst.row, dst.col);

  if (coachStep === 1 && flags.pickedPrune) coachStep = 2;
  if (coachStep === 2 && flags.treated) {

    try { localStorage.setItem('blight_patrol_tutorial_v1', '1'); } catch (e) {}

function update(dt) {

  coachPulse += dt;
  for (var f = spreadFlash.length - 1; f >= 0; f--) {
    spreadFlash[f].t -= dt;
    if (spreadFlash[f].t <= 0) spreadFlash.splice(f, 1);
  }
  for (var r = 0; r < ROWS; r++) {
    if (rows[r].flash > 0) rows[r].flash -= dt * 1.8;
    for (var c = 0; c < COLS; c++) {
      var lf = grid[r] && grid[r][c];
      if (!lf) continue;
      lf.pulse += dt * 2.2;
      if (lf.justChanged > 0) lf.justChanged -= dt * 1.7;
      if (lf.reveal > 0) lf.reveal -= dt;
      if (activeLeaf(lf)) lf.severity += dt * (0.025 + field * 0.003);
    }
  }
  if (gs !== 'PLAYING') return;
  elapsed += dt;
  updateCoach(dt);
  if (fieldCompleteTimer > 0) {
    fieldCompleteTimer -= dt;
    if (fieldCompleteTimer <= 0) startField(field + 1);
    return;
  }
  if (elapsed > 8 || tutorialDone || screenshotMode) {
    spreadTimer -= dt;

    c.lineWidth = selected ? 2.4 * ui : 1.1 * ui;
    c.stroke();
    drawToolIcon(c, tool.id, r.x + r.w / 2, r.y + 19 * ui, 28 * ui, tool.color);
    var label = GF.W < 520 ? GF.t(tool.shortKey) : GF.t(tool.key);
    fitText(c, label, r.x + r.w / 2, r.y + r.h - 14 * ui, r.w - 8 * ui, fs(11), '#f9ffeb', 'center', '800');
  }
}
function drawCoach(c) {
  if (tutorialDone || screenshotMode || coachStep >= 99 || helpOpen || gs !== 'PLAYING') return;
  var keys = ['coach_inspect', 'coach_pick', 'coach_treat', 'coach_done'];
  var key = keys[Math.min(coachStep, keys.length - 1)];
  var ui = scene.ui;
  var w = Math.min(GF.W - 28 * ui, 360 * ui);
  var x = GF.cx - w / 2;
  var y = scene.y + 10 * ui;
  c.fillStyle = 'rgba(11,25,17,0.88)';
  roundRect(c, x, y, w, 60 * ui, 8 * ui);
  c.fill();
  c.strokeStyle = '#94e8bd';
  c.lineWidth = 1.5 * ui;
  c.stroke();
  var lines = wrapLines(c, GF.t(key), w - 24 * ui, fs(13), 2);
  for (var i = 0; i < lines.length; i++) drawText(c, lines[i], x + 12 * ui, y + 22 * ui + i * 18 * ui, fs(13), '#ecfff0', 'left', '750');
  if (coachStep === 0 || coachStep === 2) {
    var target = firstActiveLeaf();
    if (target) {
      var rr = leafRect(target.row, target.col);
      c.strokeStyle = 'rgba(255,244,151,0.9)';
      c.lineWidth = 3 * ui;
      c.beginPath();
      c.ellipse(rr.x, rr.y, rr.w * (0.74 + Math.sin(coachPulse * 5) * 0.08), rr.h * 0.80, 0, 0, Math.PI * 2);
      c.stroke();
    }
  }
}
function drawHelp(c) {
  if (!helpOpen) return;
  var ui = scene.ui;
  c.fillStyle = 'rgba(5,12,9,0.68)';
  c.fillRect(0, 0, GF.W, GF.H);
  var w = Math.min(GF.W - 28 * ui, 480 * ui);
  var h = Math.min(GF.H - 70 * ui, 380 * ui);
  var x = GF.cx - w / 2;
  var y = GF.cy - h / 2;
  c.fillStyle = '#173421';
  roundRect(c, x, y, w, h, 10 * ui);
  c.fill();
  c.strokeStyle = '#9be27f';
  c.lineWidth = 2 * ui;
  c.stroke();
  fitText(c, GF.t('help_title'), GF.cx, y + 30 * ui, w - 34 * ui, fs(20), '#f4ffe8', 'center', '900');
  var body = [
    GF.t('tut_goal'),
    GF.t('tut_controls'),
    GF.t('tut_win'),
    GF.t('tut_lose'),
    GF.t('tut_tip')
  ];
  var cy = y + 68 * ui;
  for (var i = 0; i < body.length; i++) {
    var lines = wrapLines(c, body[i], w - 42 * ui, fs(13), 3);
    for (var j = 0; j < lines.length; j++) {
      drawText(c, lines[j], x + 22 * ui, cy, fs(13), '#e7f7dc', 'left', '650');
      cy += 17 * ui;
    }
    cy += 8 * ui;
  }
  var br = uiRects.helpClose;
  c.fillStyle = '#e9f6c0';
  roundRect(c, br.x, br.y, br.w, br.h, 8 * ui);
  c.fill();
  fitText(c, GF.t('close'), br.x + br.w / 2, br.y + br.h / 2, br.w - 18 * ui, fs(14), '#173421', 'center', '900');
}
function drawGameOver(c) {
  if (gs !== 'GAMEOVER') return;
  var ui = scene.ui;
  c.fillStyle = 'rgba(5,12,9,0.70)';
  c.fillRect(0, 0, GF.W, GF.H);
  var w = Math.min(GF.W - 34 * ui, 430 * ui);
  var x = GF.cx - w / 2;
  var y = GF.cy - 142 * ui;
  c.fillStyle = '#20331f';
  roundRect(c, x, y, w, 250 * ui, 10 * ui);
  c.fill();
  c.strokeStyle = '#ef7b67';
  c.lineWidth = 2 * ui;
  c.stroke();
  fitText(c, GF.t('gameover'), GF.cx, y + 34 * ui, w - 26 * ui, fs(22), '#ffe0cc', 'center', '900');
  fitText(c, GF.t(gameOverReason), GF.cx, y + 66 * ui, w - 36 * ui, fs(13), '#f8d0ba', 'center', '750');
  fitText(c, GF.t('score') + ' ' + score + '  ' + GF.t('best') + ' ' + best, GF.cx, y + 102 * ui, w - 36 * ui, fs(14), '#f6ffdf', 'center', '800');
  fitText(c, GF.t('high_field') + ' ' + highField, GF.cx, y + 128 * ui, w - 36 * ui, fs(13), '#d8edca', 'center', '750');
  fitText(c, GF.t('log') + ': ' + logText(), GF.cx, y + 154 * ui, w - 36 * ui, fs(12), '#d2f4cc', 'center', '700');
  var br = uiRects.retry;
  c.fillStyle = '#f3e59c';
  roundRect(c, br.x, br.y, br.w, br.h, 8 * ui);
  c.fill();
  fitText(c, GF.t('retry'), br.x + br.w / 2, br.y + br.h / 2, br.w - 18 * ui, fs(15), '#24311c', 'center', '900');
}
function drawCompleteBanner(c) {
  if (fieldCompleteTimer <= 0 || gs !== 'PLAYING') return;
  var ui = scene.ui;
  var a = clamp(fieldCompleteTimer / FIELD_COMPLETE_DELAY, 0, 1);
  c.globalAlpha = Math.min(1, a + 0.15);
  c.fillStyle = 'rgba(18,42,25,0.86)';
  roundRect(c, GF.cx - 150 * ui, scene.y + scene.h * 0.20, 300 * ui, 70 * ui, 8 * ui);
  c.fill();
  fitText(c, GF.t('next_field') + ' ' + String(field), GF.cx, scene.y + scene.h * 0.20 + 35 * ui, 270 * ui, fs(20), '#f6e582', 'center', '900');
  c.globalAlpha = 1;
}
function draw(c) {
  layout();
  c.clearRect(0, 0, GF.W, GF.H);
  drawBackground(c);
  drawSpread(c);
  drawLeaves(c);
  drawHUD(c);
  drawToolbar(c);
  drawCompleteBanner(c);
  drawCoach(c);
  drawHelp(c);
  drawGameOver(c);
}

function firstActiveLeaf(inspectedOnly) {
  for (var r = 0; r < ROWS; r++) {
    if (rows[r].quarantined) continue;
    for (var c = 0; c < COLS; c++) {
      var lf = leafAt(r, c);
      if (activeLeaf(lf) && (!inspectedOnly || lf.inspected)) return lf;
    }
  }
  return null;
}
function correctToolFor(lf) {
  if (!lf || !lf.disease) return 'inspect';
  if (lf.disease === 'pest') return 'quarantine';
  if (lf.disease === 'blight') return 'prune';
  if (lf.disease === 'mildew') return 'spray';
  if (lf.disease === 'rust') return spray > 0 ? 'spray' : 'prune';
  return 'inspect';
}
function botActions() {
  if (gs === 'GAMEOVER') return ['retry'];
  var arr = ['wait', 'inspect_best', 'use_correct_tool', 'select_inspect', 'select_prune', 'select_spray', 'select_quarantine'];
  if (field < 6) arr.push('jump_late');
  return arr;
}
function botAct(action) {
  if (action === 'retry') { startGame({ suppressTutorial: true }); return true; }
  if (action === 'wait') { window.advanceTime(1200); return true; }
  if (action === 'jump_late') { setupForScreenshot(6); return true; }
  if (action.indexOf('select_') === 0) { setTool(action.replace('select_', '')); return true; }
  if (action === 'inspect_best') {
    var lf = firstActiveLeaf(false);
    if (!lf) return false;
    setTool('inspect');
    applyToolToLeaf(lf.row, lf.col);
    return true;
  }
  if (action === 'use_correct_tool') {
    var target = firstActiveLeaf(true) || firstActiveLeaf(false);
    if (!target) return false;
    if (!target.inspected) {
      setTool('inspect');
      applyToolToLeaf(target.row, target.col);
      return true;
    }
    setTool(correctToolFor(target));
    applyToolToLeaf(target.row, target.col);
    return true;
  }
  return false;
}
function stateObject() {
  return {
    gs: gs,
    score: score,
    best: best,
    field: field,
    spray: spray,
    blades: blades,
    tags: tags,
    panic: panic,
    savedRows: savedRows,
    rowsTarget: rowsTarget,
    healthyPlants: healthyPlants,
    activeDisease: activeCount(),
    selectedTool: selectedTool,
    cursor: { row: cursor.row, col: cursor.col },
    diseaseLog: Object.keys(diseaseLog).filter(function(k) { return diseaseLog[k]; }),
    spreadProgress: Number(clamp(1 - spreadTimer / Math.max(0.01, spreadInterval), 0, 1).toFixed(2))
  };
}
function logText() {
  var keys = Object.keys(diseaseLog).filter(function(k) { return diseaseLog[k]; });
  if (!keys.length) return GF.t('none');
  return keys.map(diseaseName).join(', ');
}
function renderText() {
  var active = [];
  for (var r = 0; r < ROWS; r++) {
    for (var c = 0; c < COLS; c++) {
      var lf = leafAt(r, c);
      if (!activeLeaf(lf)) continue;
      active.push({
        row: r,
        col: c,
        inspected: !!lf.inspected,
        disease: lf.inspected ? lf.disease : 'unknown',
        severity: Number(lf.severity.toFixed(2))
      });
    }
  }
  return JSON.stringify({
    title: GF.t('title'),
    coordinateSystem: 'grid origin top-left; row increases downward; col increases rightward',
    state: stateObject(),
    activePatches: active,
    rows: rows.map(function(row, i) { return { row: i, saved: row.saved, quarantined: row.quarantined, active: rowActiveCount(i) }; })
  });
}
function setupForScreenshot(level) {
  screenshotMode = true;
  tutorialDone = true;
  coachStep = 99;
  helpOpen = false;
  gs = 'PLAYING';
  score = 480 + Math.max(1, level || 5) * 140;
  rngSeed = 23917 + (Number(level) || 5) * 97;
  startField(Math.max(1, Number(level) || 5));
  selectedTool = 'inspect';
  for (var r = 0; r < ROWS; r++) {
    for (var c = 0; c < COLS; c++) {
      var lf = leafAt(r, c);
      if (activeLeaf(lf)) {
        lf.inspected = true;
        lf.status = 'infected';
        diseaseLog[lf.disease] = true;
      }
    }
  }
  spawnDisease('blight', 0, 1, true);
  spawnDisease('mildew', 2, 4, true);
  if (field >= 4) spawnDisease('pest', 3, 3, true);
  spreadTimer = spreadInterval * 0.78;
  updateCounts();
}
function handleKey(e) {
  if (e.code === 'Digit1') { setTool('inspect'); e.preventDefault(); return; }
  if (e.code === 'Digit2') { setTool('prune'); e.preventDefault(); return; }
  if (e.code === 'Digit3') { setTool('spray'); e.preventDefault(); return; }
  if (e.code === 'Digit4') { setTool('quarantine'); e.preventDefault(); return; }
  if (e.code === 'KeyF') {
    try {
      if (!document.fullscreenElement && GF.canvas.requestFullscreen) GF.canvas.requestFullscreen();
      else if (document.exitFullscreen) document.exitFullscreen();
    } catch (err) {}
    e.preventDefault();
    return;
  }
  if (gs === 'GAMEOVER' && (e.code === 'Space' || e.code === 'Enter')) {
    startGame({ suppressTutorial: true });
    e.preventDefault();
    return;
  }
  if (gs !== 'PLAYING') return;
  if (e.code === 'ArrowLeft') { cursor.col = Math.max(0, cursor.col - 1); e.preventDefault(); return; }
  if (e.code === 'ArrowRight') { cursor.col = Math.min(COLS - 1, cursor.col + 1); e.preventDefault(); return; }
  if (e.code === 'ArrowUp') { cursor.row = Math.max(0, cursor.row - 1); e.preventDefault(); return; }
  if (e.code === 'ArrowDown') { cursor.row = Math.min(ROWS - 1, cursor.row + 1); e.preventDefault(); return; }
  if (e.code === 'Space' || e.code === 'Enter') {
    applyToolToLeaf(cursor.row, cursor.col);
    e.preventDefault();
  }
}
function pointerPos(e) {
  var r = GF.canvas.getBoundingClientRect();
  var sx = GF.W / Math.max(1, r.width);
  var sy = GF.H / Math.max(1, r.height);
  return { x: (e.clientX - r.left) * sx, y: (e.clientY - r.top) * sy };
}
function handlePointerDown(e) {
  if (e.cancelable) e.preventDefault();
  layout();
  var p = pointerPos(e);
  if (helpOpen) {
    if (hitRect(p, uiRects.helpClose)) { helpOpen = false; sfx('click', 80); }
    return;
  }
  if (hitRect(p, uiRects.help)) { helpOpen = true; sfx('click', 80); return; }
  if (hitRect(p, uiRects.mute)) { GF.toggleMute(); sfx('click', 80); return; }
  if (gs === 'GAMEOVER') {
    if (hitRect(p, uiRects.retry)) startGame({ suppressTutorial: true });
    return;
  }
  for (var i = 0; i < uiRects.tools.length; i++) {
    if (hitRect(p, uiRects.tools[i])) {
      setTool(TOOLS[i].id);
      return;
    }
  }
  var hit = leafFromPoint(p.x, p.y);
  if (hit) applyToolToLeaf(hit.row, hit.col);
}

window._jumpLevel = function(n) { setupForScreenshot(Number(n) || 5); };
window._setupForScreenshot = function(level) { setupForScreenshot(Number(level) || 5); };
window.advanceTime = function(ms) {
  var total = Math.max(0, Number(ms) || 0);
  var step = 1 / 30;
  var count = Math.max(1, Math.ceil(total / 1000 / step));
  for (var i = 0; i < count; i++) update(step);
  if (GF.ctx) draw(GF.ctx);
  return stateObject();
};
window.render_game_to_text = renderText;

GF.canvas.addEventListener('pointerdown', handlePointerDown, { passive: false });
document.addEventListener('keydown', handleKey);
GF.exposeState(stateObject);
GF.exposeBot(botActions, botAct);
GF.exposeReach(function() {
  layout();
  var items = [
    { id: 'help', x: uiRects.help.x, y: uiRects.help.y, w: uiRects.help.w, h: uiRects.help.h, pinned: true },
    { id: 'mute', x: uiRects.mute.x, y: uiRects.mute.y, w: uiRects.mute.w, h: uiRects.mute.h, pinned: true }
  ];
  for (var i = 0; i < uiRects.tools.length; i++) {
    items.push({ id: 'tool_' + TOOLS[i].id, x: uiRects.tools[i].x, y: uiRects.tools[i].y, w: uiRects.tools[i].w, h: uiRects.tools[i].h, pinned: true });
  }
  for (var r = 0; r < ROWS; r++) {
    for (var c = 0; c < COLS; c++) {
      var rr = leafRect(r, c);
      items.push({ id: 'leaf_' + r + '_' + c, x: rr.left, y: rr.top, w: rr.w, h: rr.h });
    }
  }
  if (gs === 'GAMEOVER') items.push({ id: 'retry', x: uiRects.retry.x, y: uiRects.retry.y, w: uiRects.retry.w, h: uiRects.retry.h, pinned: true });
  if (helpOpen) items.push({ id: 'help_close', x: uiRects.helpClose.x, y: uiRects.helpClose.y, w: uiRects.helpClose.w, h: uiRects.helpClose.h, pinned: true });
  return { screen: helpOpen ? 'help' : gs, viewportW: GF.W, viewportH: GF.H, screenH: GF.H, scrollMaxY: 0, items: items };
});
GF.exposeTour([
  { name: 'play', go: function() { if (gs !== 'PLAYING') startGame({ suppressTutorial: true }); helpOpen = false; } },
  { name: 'help', go: function() { if (gs !== 'PLAYING') startGame({ suppressTutorial: true }); helpOpen = true; } },
  { name: 'gameover', go: function() { gameOver('reason_panic'); helpOpen = false; } }
]);

GF.init({
  designW: 440,
  designH: 760,
  strings: STRINGS,
  saveKey: 'blight_patrol',
  onReady: function() {
    GF.persist('blight_patrol_meta_v1', getMeta, applyMeta);
    GF.bgMusic({ file: 'audio/bg_track.mp3', preset: 'calm', muted: GF.muted });
    if (!started) {
      started = true;
      startGame({ suppressTutorial: !!(window.__GF_AUTOSTART && !window._silent) });
    }
  },
  onUpdate: update,
  onDraw: draw
});

})();
</script>
