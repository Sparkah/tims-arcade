<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Donut Launch</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
html, body {
  width: 100%; height: 100%;
  overflow: hidden; position: fixed;
  background: #1a0a2e;
  touch-action: none;
}
canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';

// ─── Canvas setup ────────────────────────────────────────────────────────────
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H;
function resize() {
  W = canvas.width  = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// ─── Save / Load ─────────────────────────────────────────────────────────────
const SAVE_KEY = 'donut_launch_save';
function defaultSave() {
  return { coins: 0, bestHeight: 0, upgrades: { power: 0, bounce: 0, gravity: 0, magnet: 0 } };
}
let save = defaultSave();
function loadSave() {
  try { const d = JSON.parse(localStorage.getItem(SAVE_KEY)); if (d) save = Object.assign(defaultSave(), d); } catch(e) {}
}
function writeSave() { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); }
loadSave();

// ─── Upgrade definitions ──────────────────────────────────────────────────────
const UPGRADES = [
  { key: 'power',   label: 'LAUNCH POWER', desc: '+15% launch speed', max: 5, cost: i => (i+1)*50 },
  { key: 'bounce',  label: 'BOUNCY',        desc: '+1 bacteria bounce', max: 5, cost: i => (i+1)*60 },
  { key: 'gravity', label: 'ANTI-GRAV',    desc: '-10% gravity pull',  max: 4, cost: i => (i+1)*80 },
  { key: 'magnet',  label: 'COIN MAGNET',  desc: '+40px coin range',   max: 3, cost: i => (i+1)*70 },
];

// ─── Game state ───────────────────────────────────────────────────────────────
let STATE = 'menu'; // menu | charging | flying | dead | shop
let held = false;
let holdTime = 0;
const MAX_HOLD = 1800; // ms

// Donut physics
let dx, dy, px, py; // velocity and position (world coords)
let cameraY = 0;    // world y at bottom of screen
let maxHeight = 0;
let runCoins = 0;
let bounceLeft = 0;
let magnetRange = 0;

// Particles
let particles = [];
// Obstacles
let obstacles = []; // {x,y,type,vy,bounced}
// Coins
let coins = [];

let lastTs = 0;
let animId = null;

// ─── Derived upgrade values ───────────────────────────────────────────────────
function getLaunchSpeed()   { return 900 + save.upgrades.power * 135; }   // px/s
function getBounces()       { return save.upgrades.bounce; }
function getGravity()       { return 1400 - save.upgrades.gravity * 140; } // px/s²
function getMagnetRange()   { return 40 + save.upgrades.magnet * 40; }

// ─── Obstacle generation ───────────────────────────────────────────────────────
const OBS_TYPES = ['bacteria', 'bacteria', 'bacteria', 'trampoline', 'spike', 'coin_cluster'];
function generateObstacles(fromY, toY) {
  const spacing = 220;
  for (let y = fromY; y > toY; y -= spacing) {
    const count = Math.random() < 0.3 ? 2 : 1;
    for (let i = 0; i < count; i++) {
      const type = OBS_TYPES[Math.floor(Math.random() * OBS_TYPES.length)];
      if (type === 'coin_cluster') {
        for (let c = 0; c < 5; c++) {
          coins.push({ x: 80 + Math.random()*(W-160), y: y - c*28, collected: false });
        }
      } else {
        obstacles.push({ x: 80 + Math.random()*(W-160), y, type, bounced: false });
      }
    }
  }
}

// ─── Init run ─────────────────────────────────────────────────────────────────
function initRun() {
  px = W / 2; py = H - 160;
  dx = 0; dy = 0;
  cameraY = 0;
  maxHeight = 0;
  runCoins = 0;
  bounceLeft = getBounces();
  magnetRange = getMagnetRange();
  particles = [];
  obstacles = [];
  coins = [];
  generateObstacles(-500, -4000);
}

// ─── Drawing helpers ──────────────────────────────────────────────────────────
function worldToScreen(wy) { return H - (wy - cameraY); }

function drawDonut(x, sy, spin) {
  ctx.save();
  ctx.translate(x, sy);
  ctx.rotate(spin);
  // outer ring
  ctx.beginPath();
  ctx.arc(0, 0, 28, 0, Math.PI*2);
  ctx.fillStyle = '#e8884f';
  ctx.fill();
  // glaze
  ctx.beginPath();
  ctx.arc(0, 0, 28, 0, Math.PI*2);
  ctx.strokeStyle = '#f5b97a';
  ctx.lineWidth = 5;
  ctx.stroke();
  // hole
  ctx.beginPath();
  ctx.arc(0, 0, 10, 0, Math.PI*2);
  ctx.fillStyle = '#1a0a2e';
  ctx.fill();
  // sprinkles
  const sprinkles = [[15,-10,'#ff6b9d'],[-14,8,'#6bdfff'],[5,18,'#b8ff6b'],[-5,-18,'#ffdd6b'],[20,5,'#ff6b6b']];
  for (const [sx,sy2,col] of sprinkles) {
    ctx.save();
    ctx.translate(sx, sy2);
    ctx.rotate(0.5);
    ctx.fillStyle = col;
    ctx.fillRect(-4,-1.5,8,3);
    ctx.restore();
  }
  ctx.restore();
}

function drawBacteria(x, sy, t) {
  ctx.save();
  ctx.translate(x, sy);
  const wobble = Math.sin(t*3) * 3;
  // body
  ctx.beginPath();
  ctx.ellipse(0, wobble, 22, 16, 0, 0, Math.PI*2);
  ctx.fillStyle = '#4dff91';
  ctx.fill();
  ctx.strokeStyle = '#00cc55';
  ctx.lineWidth = 2;
  ctx.stroke();
  // eyes
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(-7, wobble-2, 5, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc( 7, wobble-2, 5, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#111';
  ctx.beginPath(); ctx.arc(-7, wobble-1, 2.5, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc( 7, wobble-1, 2.5, 0, Math.PI*2); ctx.fill();
  // flagella
  ctx.strokeStyle = '#00cc55';
  ctx.lineWidth = 1.5;
  for (let i = -1; i <= 1; i+=2) {
    ctx.beginPath();
    ctx.moveTo(i*22, wobble);
    ctx.bezierCurveTo(i*35, wobble-10, i*40, wobble+10, i*50, wobble);
    ctx.stroke();
  }
  ctx.restore();
}

function drawTrampoline(x, sy) {
  ctx.save();
  ctx.translate(x, sy);
  ctx.fillStyle = '#ff4da6';
  ctx.fillRect(-30, -8, 60, 8);
  ctx.fillStyle = '#cc0066';
  ctx.fillRect(-34, 0, 8, 18);
  ctx.fillRect( 26, 0, 8, 18);
  ctx.restore();
}

function drawSpike(x, sy) {
  ctx.save();
  ctx.translate(x, sy);
  ctx.fillStyle = '#ff3333';
  for (let i = -2; i <= 2; i++) {
    ctx.beginPath();
    ctx.moveTo(i*14-8, 10);
    ctx.lineTo(i*14, -14);
    ctx.lineTo(i*14+8, 10);
    ctx.closePath();
    ctx.fill();
  }
  ctx.restore();
}

function drawCoin(x, sy) {
  ctx.save();
  ctx.translate(x, sy);
  ctx.beginPath();
  ctx.arc(0, 0, 10, 0, Math.PI*2);
  ctx.fillStyle = '#ffd700';
  ctx.fill();
  ctx.strokeStyle = '#ffaa00';
  ctx.lineWidth = 2;
  ctx.stroke();
  ctx.fillStyle = '#ffaa00';
  ctx.font = 'bold 10px sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('$', 0, 0);
  ctx.restore();
}

function drawParticles() {
  for (const p of particles) {
    ctx.save();
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();
  }
}

function spawnParticles(sx, sy, color, count=8) {
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 80 + Math.random() * 120;
    particles.push({
      x: sx, y: sy,
      vx: Math.cos(angle)*speed, vy: Math.sin(angle)*speed,
      r: 3 + Math.random()*4,
      life: 1,
      color
    });
  }
}

// ─── Power bar ────────────────────────────────────────────────────────────────
function drawPowerBar(power) {
  const bw = Math.min(W * 0.6, 280);
  const bh = 22;
  const bx = (W - bw) / 2;
  const by = H - 90;
  // bg
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.beginPath();
  ctx.roundRect(bx-2, by-2, bw+4, bh+4, 6);
  ctx.fill();
  // fill
  const hue = power < 0.7 ? 120 - power*60 : 0;
  ctx.fillStyle = `hsl(${hue},90%,50%)`;
  ctx.beginPath();
  ctx.roundRect(bx, by, bw * power, bh, 4);
  ctx.fill();
  // label
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 13px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('HOLD TO CHARGE', W/2, by - 8);
}

// ─── Height display ───────────────────────────────────────────────────────────
function drawHUD() {
  const h = Math.max(0, Math.floor(maxHeight / 10));
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 22px sans-serif';
  ctx.textAlign = 'right';
  ctx.fillText(`${h}m`, W - 16, 40);
  ctx.font = '14px sans-serif';
  ctx.fillStyle = '#ffd700';
  ctx.fillText(`🪙 ${runCoins}`, W - 16, 62);
  if (bounceLeft > 0) {
    ctx.fillStyle = '#ff4da6';
    ctx.fillText(`↑ ×${bounceLeft}`, W - 16, 84);
  }
}

// ─── Background sky gradient ──────────────────────────────────────────────────
function drawSky() {
  const altitude = maxHeight / 10; // metres
  let top, bottom;
  if (altitude < 200) {
    const t = altitude / 200;
    top    = lerpColor('#87ceeb', '#1a4080', t);
    bottom = lerpColor('#e8c88a', '#0a0a30', t);
  } else {
    top    = '#000010';
    bottom = '#0a0a30';
  }
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, top);
  grad.addColorStop(1, bottom);
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);
  // stars at high altitude
  if (altitude > 100) {
    const alpha = Math.min(1, (altitude-100)/200);
    ctx.globalAlpha = alpha;
    ctx.fillStyle = '#fff';
    for (let i = 0; i < 60; i++) {
      const sx = ((i*137 + cameraY*0.01) % W + W) % W;
      const sy = ((i*91 + cameraY*0.02) % H + H) % H;
      ctx.beginPath();
      ctx.arc(sx, sy, 1, 0, Math.PI*2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }
}

function lerpColor(a, b, t) {
  const ar = parseInt(a.slice(1,3),16), ag = parseInt(a.slice(3,5),16), ab = parseInt(a.slice(5,7),16);
  const br = parseInt(b.slice(1,3),16), bg = parseInt(b.slice(3,5),16), bb = parseInt(b.slice(5,7),16);
  const r = Math.round(ar + (br-ar)*t), g = Math.round(ag + (bg-ag)*t), bl = Math.round(ab + (bb-ab)*t);
  return `rgb(${r},${g},${bl})`;
}

// ─── Ground ───────────────────────────────────────────────────────────────────
function drawGround(sy) {
  ctx.fillStyle = '#4a2800';
  ctx.fillRect(0, sy, W, H - sy + 5);
  ctx.fillStyle = '#6b3d00';
  ctx.fillRect(0, sy, W, 8);
  // launcher platform
  ctx.fillStyle = '#888';
  ctx.fillRect(W/2 - 50, sy - 12, 100, 12);
  ctx.fillStyle = '#aaa';
  ctx.fillRect(W/2 - 50, sy - 12, 100, 4);
}

// ─── Menu screen ─────────────────────────────────────────────────────────────
let donutSpin = 0;
function drawMenu() {
  drawSky();
  const groundY = H - 80;
  drawGround(groundY);

  // Animated donut demo
  donutSpin += 0.03;
  const bounce = Math.sin(Date.now()*0.003) * 8;
  drawDonut(W/2, groundY - 60 + bounce, donutSpin);

  // Title
  ctx.textAlign = 'center';
  ctx.fillStyle = '#ffd700';
  ctx.font = 'bold 48px sans-serif';
  ctx.fillText('DONUT', W/2, H/2 - 80);
  ctx.fillStyle = '#ff6b9d';
  ctx.font = 'bold 28px sans-serif';
  ctx.fillText('LAUNCH!', W/2, H/2 - 44);

  ctx.fillStyle = '#fff';
  ctx.font = '16px sans-serif';
  ctx.fillText('Best: ' + Math.floor(save.bestHeight/10) + 'm', W/2, H/2 - 10);
  ctx.fillStyle = '#ffd700';
  ctx.fillText('🪙 ' + save.coins, W/2, H/2 + 16);

  // Play button
  const bw = 200, bh = 54, bx = (W-bw)/2, by = H/2 + 50;
  ctx.fillStyle = '#ff6b9d';
  ctx.beginPath();
  ctx.roundRect(bx, by, bw, bh, 12);
  ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 22px sans-serif';
  ctx.fillText('HOLD & LAUNCH!', W/2, by + bh/2 + 8);

  // Shop button
  const sw = 140, sh = 42, sx = (W-sw)/2, sy2 = H/2 + 120;
  ctx.fillStyle = '#5533aa';
  ctx.beginPath();
  ctx.roundRect(sx, sy2, sw, sh, 10);
  ctx.fill();
  ctx.fillStyle = '#ffd700';
  ctx.font = 'bold 18px sans-serif';
  ctx.fillText('🛒 SHOP', W/2, sy2 + sh/2 + 6);
}

// ─── Shop screen ─────────────────────────────────────────────────────────────
let shopScroll = 0;
function drawShop() {
  ctx.fillStyle = '#0d0020';
  ctx.fillRect(0, 0, W, H);

  ctx.textAlign = 'center';
  ctx.fillStyle = '#ffd700';
  ctx.font = 'bold 30px sans-serif';
  ctx.fillText('UPGRADE SHOP', W/2, 50);
  ctx.fillStyle = '#ffd700';
  ctx.font = '20px sans-serif';
  ctx.fillText(`🪙 ${save.coins}`, W/2, 80);

  const cardW = Math.min(W - 40, 340);
  const cardX = (W - cardW) / 2;

  UPGRADES.forEach((upg, i) => {
    const level = save.upgrades[upg.key];
    const maxed = level >= upg.max;
    const cost  = maxed ? 0 : upg.cost(level);
    const canBuy = !maxed && save.coins >= cost;
    const cy = 120 + i * 110;

    ctx.fillStyle = canBuy ? '#1a0a3e' : '#110018';
    ctx.strokeStyle = canBuy ? '#9933ff' : '#442266';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.roundRect(cardX, cy, cardW, 95, 10);
    ctx.fill();
    ctx.stroke();

    // label
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 16px sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText(upg.label, cardX + 16, cy + 26);
    ctx.fillStyle = '#bbb';
    ctx.font = '13px sans-serif';
    ctx.fillText(upg.desc, cardX + 16, cy + 46);

    // level dots
    for (let j = 0; j < upg.max; j++) {
      ctx.beginPath();
      ctx.arc(cardX + 16 + j*18, cy + 66, 7, 0, Math.PI*2);
      ctx.fillStyle = j < level ? '#9933ff' : '#333';
      ctx.fill();
    }

    // buy button
    ctx.textAlign = 'right';
    if (maxed) {
      ctx.fillStyle = '#44ff88';
      ctx.font = 'bold 14px sans-serif';
      ctx.fillText('MAX', cardX + cardW - 16, cy + 50);
    } else {
      const bw = 80, bh = 32;
      const bx = cardX + cardW - bw - 12;
      const by2 = cy + (95 - bh) / 2;
      ctx.fillStyle = canBuy ? '#9933ff' : '#442255';
      ctx.beginPath();
      ctx.roundRect(bx, by2, bw, bh, 8);
      ctx.fill();
      ctx.fillStyle = canBuy ? '#fff' : '#886699';
      ctx.font = 'bold 14px sans-serif';
      ctx.fillText(`🪙 ${cost}`, bx + bw/2, by2 + bh/2 + 5);
      ctx.textAlign = 'center';
    }
  });

  // Back button
  const backY = 120 + UPGRADES.length * 110 + 20;
  ctx.fillStyle = '#333';
  ctx.beginPath();
  ctx.roundRect((W-160)/2, backY, 160, 44, 10);
  ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 16px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('← BACK', W/2, backY + 28);
}

// ─── Death screen ─────────────────────────────────────────────────────────────
function drawDead() {
  drawSky();
  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  ctx.fillRect(0, 0, W, H);

  ctx.textAlign = 'center';
  ctx.fillStyle = '#ff4444';
  ctx.font = 'bold 40px sans-serif';
  ctx.fillText('SPLAT!', W/2, H/2 - 90);

  const h = Math.floor(maxHeight/10);
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 24px sans-serif';
  ctx.fillText(`Height: ${h}m`, W/2, H/2 - 44);
  if (h >= Math.floor(save.bestHeight/10) && h > 0) {
    ctx.fillStyle = '#ffd700';
    ctx.font = 'bold 18px sans-serif';
    ctx.fillText('NEW BEST! 🎉', W/2, H/2 - 16);
  }
  ctx.fillStyle = '#ffd700';
  ctx.font = '20px sans-serif';
  ctx.fillText(`+${runCoins} 🪙`, W/2, H/2 + 14);

  const bw = 200, bh = 50;
  // Try again
  ctx.fillStyle = '#ff6b9d';
  ctx.beginPath();
  ctx.roundRect((W-bw)/2, H/2 + 50, bw, bh, 12);
  ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 20px sans-serif';
  ctx.fillText('TRY AGAIN', W/2, H/2 + 82);
  // Shop
  ctx.fillStyle = '#5533aa';
  ctx.beginPath();
  ctx.roundRect((W-bw)/2, H/2 + 116, bw, bh, 12);
  ctx.fill();
  ctx.fillStyle = '#ffd700';
  ctx.fillText('🛒 SHOP', W/2, H/2 + 148);
}

// ─── Main loop ────────────────────────────────────────────────────────────────
let spinAngle = 0;
let prevObstacleGenY = 0;

function loop(ts) {
  animId = requestAnimationFrame(loop);
  const dt = Math.min((ts - lastTs) / 1000, 0.05);
  lastTs = ts;

  if (STATE === 'menu') {
    drawMenu();
    return;
  }
  if (STATE === 'shop') {
    drawShop();
    return;
  }
  if (STATE === 'dead') {
    drawDead();
    return;
  }

  // ── charging ──────────────────────────────────────────────────────────────
  if (STATE === 'charging') {
    if (held) holdTime = Math.min(holdTime + dt * 1000, MAX_HOLD);
    drawSky();
    const groundY = worldToScreen(0);
    drawGround(groundY);
    drawDonut(px, groundY - 60, spinAngle);
    const power = holdTime / MAX_HOLD;
    drawPowerBar(power);
    ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.font = '14px sans-serif';
    ctx.fillText('Release to launch!', W/2, H - 110);
    return;
  }

  // ── flying ────────────────────────────────────────────────────────────────
  if (STATE === 'flying') {
    const gravity = getGravity();
    dy -= gravity * dt;
    px += dx * dt;
    py += dy * dt;

    // horizontal bounds
    if (px < 28)  { px = 28;  dx = Math.abs(dx); }
    if (px > W-28){ px = W-28; dx = -Math.abs(dx); }

    // track height
    if (py > maxHeight) maxHeight = py;

    // update camera: keep donut vertically centered in upper half while rising
    const screenTarget = H * 0.4;
    const desiredCameraY = py - (H - screenTarget);
    if (desiredCameraY > cameraY) cameraY = desiredCameraY;

    // spin based on velocity
    spinAngle += (Math.abs(dx) + Math.abs(dy)) * 0.001;

    // generate more obstacles above
    const lookAhead = py + 3000;
    if (lookAhead > prevObstacleGenY) {
      generateObstacles(prevObstacleGenY, -lookAhead);
      prevObstacleGenY = lookAhead;
    }

    // update particles
    for (const p of particles) {
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vy += 200 * dt;
      p.life -= dt * 1.5;
    }
    particles = particles.filter(p => p.life > 0);

    // coin magnet & collection
    for (const c of coins) {
      if (c.collected) continue;
      const sx = c.x, sy = worldToScreen(c.y);
      const dist = Math.hypot(c.x - px, c.y - py);
      if (dist < magnetRange) {
        c.x += (px - c.x) * 8 * dt;
        c.y += (py - c.y) * 8 * dt;
      }
      if (dist < 30) {
        c.collected = true;
        runCoins++;
        spawnParticles(sx, worldToScreen(c.y), '#ffd700', 5);
      }
    }

    // obstacle collisions
    for (const obs of obstacles) {
      if (obs.bounced && obs.type !== 'bacteria') continue;
      const sx = obs.x, sy = worldToScreen(obs.y);
      const dist = Math.hypot(obs.x - px, obs.y - py);

      if (obs.type === 'spike') {
        if (dist < 32) {
          // kill some velocity
          dy *= 0.2; dx *= 0.2;
          spawnParticles(sx, sy, '#ff3333', 12);
        }
      } else if (obs.type === 'trampoline') {
        if (dist < 40 && dy < 0) {
          dy = Math.abs(dy) * 1.4;
          obs.bounced = true;
          spawnParticles(sx, sy, '#ff4da6', 10);
        }
      } else if (obs.type === 'bacteria') {
        if (dist < 40) {
          if (bounceLeft > 0) {
            dy = Math.abs(dy) * 1.2 + 200;
            dx = (Math.random() - 0.5) * 300;
            bounceLeft--;
            obs.bounced = true;
            spawnParticles(sx, sy, '#4dff91', 12);
          } else {
            // just push off
            const nx = (px - obs.x) / dist;
            const ny = (py - obs.y) / dist;
            dy += ny * 150;
            dx += nx * 100;
          }
        }
      }
    }

    // death: hit ground
    if (py < 0 && dy < 0) {
      save.coins += runCoins;
      if (maxHeight > save.bestHeight) save.bestHeight = maxHeight;
      writeSave();
      spawnParticles(px, worldToScreen(0), '#e8884f', 20);
      STATE = 'dead';
      return;
    }

    // ── draw ──────────────────────────────────────────────────────────────
    drawSky();
    const groundY = worldToScreen(0);
    drawGround(groundY);

    // obstacles
    for (const obs of obstacles) {
      const sy = worldToScreen(obs.y);
      if (sy < -60 || sy > H + 60) continue;
      if (obs.type === 'bacteria')    drawBacteria(obs.x, sy, ts/1000);
      else if (obs.type === 'trampoline') drawTrampoline(obs.x, sy);
      else if (obs.type === 'spike')  drawSpike(obs.x, sy);
    }

    // coins
    for (const c of coins) {
      if (c.collected) continue;
      const sy = worldToScreen(c.y);
      if (sy < -20 || sy > H + 20) continue;
      drawCoin(c.x, sy);
    }

    drawParticles();
    drawDonut(px, worldToScreen(py), spinAngle);
    drawHUD();
  }
}

// ─── Input ────────────────────────────────────────────────────────────────────
function getPos(e) {
  if (e.touches) return { x: e.touches[0].clientX, y: e.touches[0].clientY };
  return { x: e.clientX, y: e.clientY };
}

function onDown(e) {
  e.preventDefault();
  const pos = getPos(e);

  if (STATE === 'menu') {
    const bw = 200, bh = 54, bx = (W-bw)/2, by = H/2 + 50;
    const sw = 140, sh = 42, sx = (W-sw)/2, sy2 = H/2 + 120;
    if (pos.x >= bx && pos.x <= bx+bw && pos.y >= by && pos.y <= by+bh) {
      initRun();
      prevObstacleGenY = 3000;
      holdTime = 0;
      held = true;
      STATE = 'charging';
    } else if (pos.x >= sx && pos.x <= sx+sw && pos.y >= sy2 && pos.y <= sy2+sh) {
      STATE = 'shop';
    }
    return;
  }

  if (STATE === 'shop') {
    const cardW = Math.min(W - 40, 340);
    const cardX = (W - cardW) / 2;
    UPGRADES.forEach((upg, i) => {
      const level = save.upgrades[upg.key];
      const maxed = level >= upg.max;
      if (maxed) return;
      const cost = upg.cost(level);
      const cy = 120 + i * 110;
      const bw = 80, bh = 32;
      const bx = cardX + cardW - bw - 12;
      const by2 = cy + (95 - bh) / 2;
      if (pos.x >= bx && pos.x <= bx+bw && pos.y >= by2 && pos.y <= by2+bh) {
        if (save.coins >= cost) {
          save.coins -= cost;
          save.upgrades[upg.key]++;
          writeSave();
        }
      }
    });
    // Back button
    const backY = 120 + UPGRADES.length * 110 + 20;
    if (pos.y >= backY && pos.y <= backY + 44) {
      STATE = 'menu';
    }
    return;
  }

  if (STATE === 'charging') {
    held = true;
    return;
  }

  if (STATE === 'dead') {
    const bw = 200, bh = 50;
    if (pos.y >= H/2+50 && pos.y <= H/2+100) {
      initRun();
      prevObstacleGenY = 3000;
      holdTime = 0;
      held = true;
      STATE = 'charging';
    } else if (pos.y >= H/2+116 && pos.y <= H/2+166) {
      STATE = 'shop';
    }
  }
}

function onUp(e) {
  e.preventDefault();
  if (STATE === 'charging' && held) {
    held = false;
    const power = holdTime / MAX_HOLD;
    const speed = getLaunchSpeed() * power;
    py = 0;
    dy = speed;
    dx = (Math.random() - 0.5) * 200;
    spawnParticles(W/2, worldToScreen(0), '#e8884f', 15);
    STATE = 'flying';
  }
}

canvas.addEventListener('mousedown', onDown);
canvas.addEventListener('mouseup', onUp);
canvas.addEventListener('touchstart', onDown, { passive: false });
canvas.addEventListener('touchend', onUp, { passive: false });
document.addEventListener('contextmenu', e => e.preventDefault());

// ─── Start ────────────────────────────────────────────────────────────────────
requestAnimationFrame(ts => { lastTs = ts; loop(ts); });
</script>
<script>
/* Suno bg music loop (audio-overhaul): self-contained WebAudio player.
   Arms on first gesture; polls `muted`/GF.muted so existing mute toggles
   silence it; suspends on tab-hide (Yandex 1.3). */
(function(){var st=0,g=null;function m(){try{if(typeof muted!=="undefined")return !!muted;if(window.GF&&"muted" in GF)return !!GF.muted;}catch(e){}return false;}function go(){if(st)return;st=1;try{var C=window.AudioContext||window.webkitAudioContext;var x=new C();fetch("audio/bg_loop.mp3").then(function(r){return r.arrayBuffer()}).then(function(b){return x.decodeAudioData(b)}).then(function(buf){g=x.createGain();g.gain.value=m()?0:0.4;g.connect(x.destination);var s=x.createBufferSource();s.buffer=buf;s.loop=true;s.connect(g);s.start();setInterval(function(){try{g.gain.value=m()?0:0.4;}catch(e){}},300);document.addEventListener("visibilitychange",function(){try{document.hidden?x.suspend():(!m()&&x.resume());}catch(e){}});});}catch(e){}}
["pointerdown","keydown","touchstart"].forEach(function(ev){document.addEventListener(ev,go,true)});})();
</script>
