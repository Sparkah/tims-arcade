/* ===== PLATFORM: ads + analytics + lifecycle. Detects CrazyGames / Yandex / dev at runtime; per-platform SDK <script> swapped in at package time. ===== */
const Platform = (function(){
  let kind='dev', ysdk=null, ga=false;
  async function init(){
    try{
      if(window.CrazyGames && window.CrazyGames.SDK){ kind='crazygames'; await window.CrazyGames.SDK.init(); }
      else if(window.YaGames){ kind='yandex'; ysdk = await window.YaGames.init(); }
    }catch(e){}
    try{ const onDev=(location.hostname==='localhost'||location.hostname==='127.0.0.1'||!location.hostname);
      if(window.gameanalytics && window.GA_KEY && !onDev && kind!=='yandex'){ const G=window.gameanalytics.GameAnalytics; G('configureBuild','sl-0.1'); G('initialize', window.GA_KEY, window.GA_SECRET||''); ga=true; } }catch(e){}   // GA off localhost AND off Yandex (3rd-party analytics = rejection risk; CG + gallery only)
  }
  const gameplayStart=()=>{ try{ if(kind==='crazygames') window.CrazyGames.SDK.game.gameplayStart(); else if(ysdk&&ysdk.features&&ysdk.features.GameplayAPI) ysdk.features.GameplayAPI.start(); }catch(e){} };
  const gameplayStop =()=>{ try{ if(kind==='crazygames') window.CrazyGames.SDK.game.gameplayStop();  else if(ysdk&&ysdk.features&&ysdk.features.GameplayAPI) ysdk.features.GameplayAPI.stop();  }catch(e){} };
  const loadingDone  =()=>{ try{ if(kind==='crazygames') window.CrazyGames.SDK.game.loadingStop(); else if(ysdk&&ysdk.features&&ysdk.features.LoadingAPI) ysdk.features.LoadingAPI.ready(); }catch(e){} };
  function interstitial(done){ done=done||function(){}; let fired=false;
    const go=()=>{ if(fired) return; fired=true; clearTimeout(wd); Audio.setAdHold(false); Audio.resumeAudio(); done(); };
    Audio.pauseAudio();
    const wd=setTimeout(go, 8000);                     // no-fill watchdog: a silent ad SDK must never block the game
    const opened=()=>{ if(fired) return; clearTimeout(wd); Audio.setAdHold(true); };   // ad really showing -> HOLD audio until the real onClose/onError; a LATE onOpen after the watchdog already settled must not latch forever
    try{
      if(kind==='crazygames'){ window.CrazyGames.SDK.ad.requestAd('midgame', { adStarted:opened, adFinished:go, adError:go }); return; }
      if(kind==='yandex'&&ysdk){ ysdk.adv.showFullscreenAdv({ callbacks:{ onOpen:opened, onClose:go, onError:go } }); return; }
    }catch(e){}
    go();   // dev / no SDK: continue immediately
  }
  function rewarded(onReward, onSettled){ onReward=onReward||function(){}; onSettled=onSettled||function(){}; let done=false;
    const fin=()=>{ if(done) return; done=true; clearTimeout(wd); Audio.setAdHold(false); Audio.resumeAudio(); onSettled(); };
    Audio.pauseAudio();
    const wd=setTimeout(fin, 8000);
    const opened=()=>{ if(done) return; clearTimeout(wd); Audio.setAdHold(true); };   // rewarded runs 15-30s: HOLD audio until the real close; late onOpen after settle must not latch
    try{
      if(kind==='crazygames'){ window.CrazyGames.SDK.ad.requestAd('rewarded', { adStarted:opened, adFinished:function(){ onReward(); fin(); }, adError:function(err){ const c=String((err&&err.code)||err||''); if(/BasicLaunch|adsDisabled/i.test(c)) onReward(); fin(); } }); return; }
      if(kind==='yandex'&&ysdk){ let got=false; ysdk.adv.showRewardedVideo({ callbacks:{ onOpen:opened, onRewarded:function(){got=true;}, onClose:function(){ if(got) onReward(); fin(); }, onError:fin } }); return; }
    }catch(e){}
    onReward(); fin();   // dev / no SDK: grant immediately
  }
  function track(ev, data){ try{ if(ga){ const v=data&&typeof data.value==='number'?data.value:undefined; window.gameanalytics.GameAnalytics('addDesignEvent', String(ev).replace(/_/g,':'), v); } }catch(e){} }
  function progress(status, world, level){ try{ if(ga) window.gameanalytics.GameAnalytics('addProgressionEvent', status, world||'game', level||''); }catch(e){} }
  // ---- payments (Yandex IAP; non-consumables only). Fail-closed: on Yandex the
  // buy buttons only appear when getPayments resolved, and a grant happens ONLY
  // from a resolved purchase() or a restored getPurchases() entry. Dev/gallery
  // simulates success so the flows stay playtestable off-platform.
  let payments=null, catalog={}, ownedIds=new Set();
  async function initPayments(){
    if(kind!=='yandex'||!ysdk||!ysdk.getPayments) return;
    try{
      payments = await ysdk.getPayments();
      try{ const list=await payments.getCatalog(); (list||[]).forEach(it=>{ const id=it.id||it.productID; if(id) catalog[id]=it; }); }catch(e){}
      try{ const own=await payments.getPurchases(); (own||[]).forEach(p=>{ const id=p.productID||p.productId||p.id; if(id) ownedIds.add(id); }); }catch(e){}
    }catch(e){ payments=null; }
  }
  function paymentsReady(){ return kind!=='yandex' ? true : !!payments; }
  function priceOf(id){ const it=catalog[id]; return it ? (it.price || (it.priceValue!=null ? it.priceValue+' '+(it.priceCurrencyCode||'YAN') : null)) : null; }
  function ownedProducts(){ return Array.from(ownedIds); }
  function purchase(id, done){ done=done||function(){};
    if(kind!=='yandex'){ ownedIds.add(id); done(true); return; }           // dev/gallery simulation
    if(!payments){ done(false); return; }                                   // fail-closed: real API only
    payments.purchase({ id:id }).then(function(){ ownedIds.add(id); done(true); }).catch(function(){ done(false); });   // non-consumable: no consume
  }
  // ---- sticky banner (Yandex). Shown only on non-gameplay screens; callers gate on ads-free.
  function bannerShow(){ try{ if(kind==='yandex'&&ysdk&&ysdk.adv&&ysdk.adv.showBannerAdv) ysdk.adv.showBannerAdv(); }catch(e){} }
  function bannerHide(){ try{ if(kind==='yandex'&&ysdk&&ysdk.adv&&ysdk.adv.hideBannerAdv) ysdk.adv.hideBannerAdv(); }catch(e){} }
  return { init, loadingDone, gameplayStart, gameplayStop, interstitial, rewarded, track, progress, kind:()=>kind,
           initPayments, paymentsReady, priceOf, ownedProducts, purchase, bannerShow, bannerHide,
           langHint:()=>{ try{ return ysdk && ysdk.environment && ysdk.environment.i18n && ysdk.environment.i18n.lang; }catch(e){ return null; } } };
})();

  BODY_AREA: 1.05,        // frontal area for drag

/* =================== AUDIO (procedural) =================== */
const Audio = (()=>{
  let ctx, master, muted=save.muted, roar, roarGain, roarFilt, musicTimer=null, musicOn=false, step=0;
  // Real CC0 samples (freesound.org, see CREDITS.txt) decoded through Web Audio.
  // The old oscillator blips remain ONLY as a decode-failure fallback.
  const SFX_FILES={ launch:'assets/sfx/launch.mp3', perfect:'assets/sfx/perfect.mp3', coin:'assets/sfx/coin.mp3',
    bounce:'assets/sfx/bounce.mp3', land:'assets/sfx/land.mp3', crash:'assets/sfx/crash.mp3',
    rocket:'assets/sfx/rocket.mp3', zone:'assets/sfx/zone.mp3' };
  const sfxBuf={}; let sfxLoaded=0, sfxLoading=false;
  let musicBuf=null, musicSrc=null, musicGain=null;   // real CC0 theme loop ("Aurora Ride"); the old procedural arp survives only as a decode-failure fallback
  function loadSfx(){ if(sfxLoading||!ctx) return; sfxLoading=true;
    for(const k in SFX_FILES){ fetch(SFX_FILES[k]).then(r=>r.arrayBuffer()).then(ab=>ctx.decodeAudioData(ab))
      .then(b=>{ sfxBuf[k]=b; sfxLoaded++; }).catch(()=>{}); }
    fetch('assets/sfx/theme.mp3').then(r=>r.arrayBuffer()).then(ab=>ctx.decodeAudioData(ab))
      .then(b=>{ musicBuf=b; if(musicOn) startTheme(); }).catch(()=>{}); }
  function startTheme(){ if(!ctx||!musicBuf||musicSrc) return;
    musicGain=ctx.createGain(); musicGain.gain.value=0.55; musicGain.connect(master);
    musicSrc=ctx.createBufferSource(); musicSrc.buffer=musicBuf; musicSrc.loop=true;
    musicSrc.connect(musicGain); musicSrc.start(); }
  function stopTheme(){ try{ if(musicSrc){ musicSrc.stop(); musicSrc.disconnect(); } }catch(e){} musicSrc=null; }
  function sample(k, vol, rate){ if(!ctx||muted) return false; const b=sfxBuf[k]; if(!b) return false;
    const s=ctx.createBufferSource(); s.buffer=b; s.playbackRate.value=rate||1;
    const g=ctx.createGain(); g.gain.value=vol==null?0.8:vol; s.connect(g); g.connect(master); s.start(); return true; }
  function ensure(){ if(ctx) return; const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return; ctx=new AC();
    master=ctx.createGain(); master.gain.value=muted?0:0.8; master.connect(ctx.destination);
    loadSfx();
    // boost roar (persistent, gated by gain)
    const buf=ctx.createBuffer(1, ctx.sampleRate*2, ctx.sampleRate); const d=buf.getChannelData(0);
    for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
    roar=ctx.createBufferSource(); roar.buffer=buf; roar.loop=true;
    roarFilt=ctx.createBiquadFilter(); roarFilt.type='bandpass'; roarFilt.frequency.value=320; roarFilt.Q.value=0.8;
    roarGain=ctx.createGain(); roarGain.gain.value=0;
    roar.connect(roarFilt); roarFilt.connect(roarGain); roarGain.connect(master); roar.start();
  }
  let adHold=false;   // TRUE from ad onOpen until its real onClose/onError. While held, EVERY
                      // resume path (input handlers, visibility, anything) is a no-op — clicking the
                      // ad, tabbing away and coming back must NOT restart audio under the open ad.
  function resume(){ ensure(); if(adHold) return; if(ctx&&ctx.state==='suspended') ctx.resume(); }
  function tone(f,dur,type,vol,slideTo,delay){ if(!ctx||muted) return; const t0=ctx.currentTime+(delay||0);
    const o=ctx.createOscillator(); const g=ctx.createGain(); o.type=type||'sine'; o.frequency.setValueAtTime(f,t0);
    if(slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0+dur);
    g.gain.setValueAtTime(0.0001,t0); g.gain.exponentialRampToValueAtTime(vol||0.2, t0+0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t0+dur); o.connect(g); g.connect(master); o.start(t0); o.stop(t0+dur+0.02);
  }
  function noise(dur,vol,fStart,fEnd){ if(!ctx||muted) return; const t0=ctx.currentTime;
    const buf=ctx.createBuffer(1, ctx.sampleRate*dur, ctx.sampleRate); const d=buf.getChannelData(0);
    for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
    const s=ctx.createBufferSource(); s.buffer=buf; const f=ctx.createBiquadFilter(); f.type='bandpass';
    f.frequency.setValueAtTime(fStart||800,t0); if(fEnd) f.frequency.exponentialRampToValueAtTime(fEnd,t0+dur);
    const g=ctx.createGain(); g.gain.setValueAtTime(vol||0.3,t0); g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    s.connect(f); f.connect(g); g.connect(master); s.start(t0); s.stop(t0+dur);
  }
  // music: gentle bass + arp, ticked from main loop
  const SCALE=[0,3,5,7,10,12]; const ROOT=146.83; // D3
  let mtime=0;
  function tickMusic(dt){ if(!musicOn||!ctx||muted||ctx.state!=='running') return; mtime-=dt; if(mtime>0) return; mtime=0.30;   // a suspended ctx must not stack oscillators that burst on resume
    const beat=step%8;
    if(beat%2===0){ tone(ROOT/2*(beat===0?1:1), 0.34, 'triangle', 0.16); } // bass pulse
    const n=SCALE[(step*3)%SCALE.length]; tone(ROOT*Math.pow(2,n/12)*2, 0.26, 'sine', 0.05);
    if(beat===4){ tone(ROOT*Math.pow(2,7/12), 0.5,'sine',0.04); }
    step++;
  }
  return {
    resume,
    launch(){ resume(); if(!sample('launch',0.85,0.96+Math.random()*0.08)){ noise(0.35,0.5,180,60); tone(120,0.4,'sawtooth',0.25,40); } },
    perfect(){ if(!sample('perfect',0.7)){ tone(880,0.12,'square',0.18,1320); tone(1320,0.18,'square',0.12,1760,0.06); } },
    coin(){ if(!sample('coin',0.5,0.97+Math.random()*0.1)){ tone(1280,0.07,'square',0.12,1760); tone(1760,0.08,'square',0.1,2200,0.05); } },
    bounce(v){ if(!sample('bounce',Math.min(0.85,0.35+(v||0)*0.03),0.92+Math.random()*0.16)){ noise(0.12,Math.min(0.5,0.12+v*0.02),420,120); tone(90,0.12,'square',0.12,50); } },
    crash(){ if(!sample('crash',0.9)){ noise(0.5,0.6,300,40); tone(70,0.5,'sawtooth',0.3,30); } },
    rocket(){ resume(); if(!sample('rocket',0.7)){ noise(0.5,0.4,200,1200); tone(180,0.5,'sawtooth',0.2,900); } },
    boost(on){ ensure(); if(!roarGain||!ctx) return; roarGain.gain.cancelScheduledValues(ctx.currentTime);
      roarGain.gain.linearRampToValueAtTime(on&&!muted?0.16:0.0, ctx.currentTime+0.08); },
    land(){ if(!sample('land',0.5)) tone(520,0.1,'sine',0.1,300); },
    zone(){ resume(); if(!sample('zone',0.65)){ tone(523,0.16,'triangle',0.12); tone(659,0.16,'triangle',0.12,null,0.1); tone(880,0.34,'sine',0.14,null,0.2); } },
    nSamples(){ return sfxLoaded; },
    startMusic(){ resume(); musicOn=true; startTheme(); },
    stopMusic(){ musicOn=false; stopTheme(); },
    tick(dt){ if(musicSrc) return; tickMusic(dt); },   // procedural arp only while the real theme is unavailable
    hasTheme(){ return !!musicSrc; },
    toggleMute(){ muted=!muted; save.muted=muted; persist(); if(master) master.gain.value=muted?0:0.8; if(roarGain&&ctx) roarGain.gain.value=0; return muted; },
    isMuted(){ return muted; },
    pauseAudio(){ try{ if(roarGain&&ctx) roarGain.gain.value=0; if(master) master.gain.value=0; if(ctx&&ctx.state==='running') ctx.suspend(); }catch(e){} },   // ad open / tab hidden (Yandex 4.7 + 1.3)
    resumeAudio(){ try{ if(adHold) return; if(ctx&&ctx.state==='suspended') ctx.resume(); if(master) master.gain.value=muted?0:0.8; }catch(e){} },
    setAdHold(v){ adHold=!!v; if(adHold){ try{ if(master) master.gain.value=0; if(ctx&&ctx.state==='running') ctx.suspend(); }catch(e){} } },
    adHeld(){ return adHold; },
  };
})();

let pickups=[]; const pickupRoot=new THREE.Group(); scene.add(pickupRoot);
function rng(seed){ let s=seed%2147483647; if(s<=0)s+=2147483646; return ()=>(s=s*16807%2147483647)/2147483647; }
function pointInBlock(px, py, pad){   // is (px,py) inside any course block (+padding)? -> don't bury a pickup in a building
  for(const o of obstacles){ const u=o.userData; if(!u || u.type!=='block') continue;
    const hw=(u.w||4)/2+pad;
    if(px>o.position.x-hw && px<o.position.x+hw && py>(u.base||0)-pad && py<(u.top||0)+pad) return true; }
  return false;
}
function buildPickups(){
  while(pickupRoot.children.length){ disposeObj(pickupRoot.children[0]); pickupRoot.remove(pickupRoot.children[0]); }   // free last run's torus geos/materials
  pickups=[];
  const r=rng(1000+save.launches*7+save.best);
  const reach = Math.min(3600, Math.max(700, save.best*1.3 + 800));
  const coinGeo=new THREE.TorusGeometry(0.55,0.16,8,16); coinGeo.rotateY(Math.PI/2);
  const coinMat=new THREE.MeshStandardMaterial({color:0xffd23f,emissive:0xffae00,emissiveIntensity:0.45,roughness:0.3,metalness:0.6});
  const ringMat=new THREE.MeshStandardMaterial({color:0x4fd1ff,emissive:0x1f9fe0,emissiveIntensity:0.6,roughness:0.3,metalness:0.4});
  // HORIZONTAL trails of coins: a row at a height (low->high across the run), so you scoop a line as you fly along it
  let x=34, trail=0;
  while(x<reach){
    const ty=6+r()*42;                  // this trail's height (trails sit at different altitudes)
    const len=5+Math.floor(r()*6);      // coins in the line
    const gap=3.2+r()*1.0;              // horizontal spacing between coins
    const slope=(r()-0.5)*0.45;         // gentle rise/fall, but essentially a horizontal line
    for(let i=0;i<len;i++){
      const cy=Math.max(2, ty+i*slope);
      if(!pointInBlock(x, cy, 0.8)){   // skip any coin that would sit inside a building
        const m=new THREE.Mesh(coinGeo, coinMat);
        m.position.set(x, cy, (r()-0.5)*1.0);
        m.userData={ type:'coin', got:false, spin:2+r()*2 }; pickupRoot.add(m); pickups.push(m);
      }
      x += gap;
    }
    x += 14+r()*22; trail++;            // gap before the next trail
    if(trail%4===0){ // a boost ring up high between trails - rewards committing to altitude
      const ry=20+r()*24;
      if(!pointInBlock(x, ry, 2)){
        const ring=new THREE.Mesh(new THREE.TorusGeometry(1.8,0.2,8,22), ringMat); ring.rotation.y=Math.PI/2;
        ring.position.set(x, ry, 0); ring.userData={type:'ring',got:false,spin:1.2}; pickupRoot.add(ring); pickups.push(ring);
      }
      x += 14;
    }
  }
}

function makeBuilding(z, r){

  } else if(z.kind==='island'){

    const bot=new THREE.Mesh(GEO.cone, new THREE.MeshStandardMaterial({ color:0x6a584a, roughness:0.95, flatShading:true })); bot.scale.set(w*0.9,h*0.8,w*0.9); bot.rotation.z=Math.PI; bot.position.y=-h*0.4; g.add(bot);

// ---- destructible "house" = a stack of bricks; only struck bricks (and neighbours) collapse via physics ----
function buildHouseBricks(group, zone, w, base, top){
  while(group.children.length){ const c=group.children[0]; disposeObj(c); group.remove(c); }
  const H=Math.max(2, top-base);
  const cols=Math.max(1, Math.min(4, Math.round(w/2.4)));
  const rows=Math.max(1, Math.min(5, Math.round(H/1.6)));
  const bw=w/cols, bh=H/rows, bd=2.6, isTower=zone.kind==='tower';
  const bricks=[];
  for(let r=0;r<rows;r++) for(let c=0;c<cols;c++){
    const col=zone.bld[(c+r)%zone.bld.length];
    const mat=new THREE.MeshStandardMaterial({ color:col, roughness:0.82, metalness:0.05, flatShading:!isTower,
      emissive:isTower?0x140d06:0x000000, emissiveMap:isTower?winTex:null, emissiveIntensity:isTower?0.45:0 });
    const m=new THREE.Mesh(GEO.box, mat); m.scale.set(bw*0.96, bh*0.96, bd);
    const hx=-w/2+(c+0.5)*bw, hy=base+(r+0.5)*bh; m.position.set(hx, hy, 0); group.add(m);
    bricks.push({ mesh:m, hx, hy, half:[bw*0.48,bh*0.48,bd*0.5], body:null, hit:false, impulsed:false });
  }

function makeBlockObstacle(zi, wx, w, base, top){
  const g=new THREE.Group(); g.position.set(wx,0,0);
  const rr=buildHouseBricks(g, ZONES[zi], w, base, top);
  g.userData={ type:'block', zone:zi, w, base, top, color:ZONES[zi].bld[0], bricks:rr.bricks, brick:rr.brick, built:false, hit:false };
  return g;
}
function syncBlock(o){ const ud=o.userData; if(ud.built) deactivateHouse(o);
  const rr=buildHouseBricks(o, ZONES[ud.zone], ud.w, ud.base, ud.top); ud.bricks=rr.bricks; ud.brick=rr.brick; ud.hit=false; }

// physics bodies exist only for houses near the car (cheap)
function activateHouse(o){ const ud=o.userData; if(ud.built) return; const bk=ud.brick;
  const shape=new CANNON.Box(new CANNON.Vec3(bk.bw*0.48, bk.bh*0.48, bk.bd*0.5));
  for(const b of ud.bricks){ if(b.body) continue;
    const body=new CANNON.Body({ mass:1, shape, allowSleep:true, sleepSpeedLimit:0.7, sleepTimeLimit:0.35 });
    body.position.set(o.position.x+b.hx, b.hy, 0); body.sleepState=CANNON.Body.SLEEPING;
    physWorld.addBody(body); b.body=body; b.impulsed=false; }
  ud.built=true; physBuiltCount++;
}
function deactivateHouse(o){ const ud=o.userData; for(const b of ud.bricks){ if(b.body){ physWorld.removeBody(b.body); b.body=null; } }
  if(ud.built) physBuiltCount=Math.max(0,physBuiltCount-1); ud.built=false; }
function wakeNeighbors(ud, hb){ const rx=ud.brick.bw*1.7, ry=ud.brick.bh*1.7;
  for(const b of ud.bricks){ if(b===hb||!b.body) continue;
    if(Math.abs(b.mesh.position.x-hb.mesh.position.x)<rx && Math.abs(b.mesh.position.y-hb.mesh.position.y)<ry) b.body.wakeUp(); } }
function updatePhysics(dt){
  for(const o of obstacles){ const ud=o.userData; if(ud.type!=='block') continue;
    const d=Math.abs(o.position.x-car.x);
    if(d<PHYS_ACT && !ud.built) activateHouse(o);
    else if(ud.built && d>PHYS_ACT+45) deactivateHouse(o);
    if(ud.built){
      if(ud.wakeAll && !ud.woke){ for(const b of ud.bricks){ if(b.body) b.body.wakeUp(); } ud.woke=true; }   // whole house reacts (no floaters)
      for(const b of ud.bricks){ if(b.hit && !b.impulsed && b.body){ b.body.wakeUp();
        const ivx=ud.impactVx||14;
        b.body.applyImpulse(new CANNON.Vec3(Math.max(6,ivx*0.5)+(Math.random()-.5)*3, 6+Math.random()*5, 0),   // launched off in the impact direction
          new CANNON.Vec3((Math.random()-.5)*b.half[0], (Math.random()-.5)*b.half[1], 0));
        b.impulsed=true; wakeNeighbors(ud,b); } }
    }
  }
  if(physBuiltCount>0){ physWorld.step(1/60, dt, 3);
    for(const o of obstacles){ const ud=o.userData; if(!ud.built) continue;
      for(const b of ud.bricks){ const body=b.body; if(!body) continue;
        body.position.z=0; body.velocity.z=0; body.angularVelocity.x=0; body.angularVelocity.y=0;
        const q=body.quaternion; q.x=0; q.y=0; q.normalize();   // keep bricks rotating only in-plane (about Z)
        b.mesh.position.set(body.position.x-o.position.x, body.position.y, 0); b.mesh.quaternion.copy(q); } }
    if(car.physWreck && carWreckBody){   // drive the tumbling wreck + detect rest
      const cb=carWreckBody; cb.position.z=0; cb.velocity.z=0; cb.angularVelocity.x=0; cb.angularVelocity.y=0;
      const q=cb.quaternion; q.x=0; q.y=0; q.normalize();
      const pwx=car.x, pwy=car.y;   // previous wreck pos -> SWEPT coin pickup (no tunneling on a fast tumble)
      car.x=cb.position.x; car.y=cb.position.y; car.vx=cb.velocity.x; car.vy=cb.velocity.y; distance=Math.max(distance, car.x); checkZone();
      for(const p of pickups){ if(p.userData.got || p.userData.type!=='coin') continue;   // the wreck can still scoop up coins it tumbles through
        if(Math.abs(p.position.x-car.x)>9 && Math.abs(p.position.x-pwx)>9) continue;
        if(segDist(p.position.x,p.position.y,0, pwx,pwy,0, car.x,car.y,0) < 2.1){ p.userData.got=true; p.visible=false; runCoins++; Audio.coin(); puff(p.position.x,p.position.y,0,0xffd23f,0.5,1.2); syncHUD(); } }
      const spd=Math.hypot(cb.velocity.x, cb.velocity.y);
      if(gs==='FLY'){ car._wreckAge=(car._wreckAge||0)+dt;   // settle on low speed/sleep (any height - it can rest on rubble), + a hard timeout
        if(spd<1.3 || cb.sleepState===CANNON.Body.SLEEPING) car._settleT=(car._settleT||0)+dt; else car._settleT=0;
        if(car._settleT>0.6 || car._wreckAge>7){ gs='SETTLE'; settleTimer=0; } }
    }
    for(const p of wreckParts){ const b=p.body; b.position.z=0; b.velocity.z=0;   // flung debris follows its body (planar)
      p.mesh.position.set(b.position.x, b.position.y, 0); p.mesh.quaternion.copy(b.quaternion); }
  }
}

// ---- LEVELS: a fly-over course per map. Each new BIOME gets MORE obstacles (count + height escalate).
// Always the deterministic defaults: the level editor (and its saved custom layouts) was removed 2026-07-21. ----
const LEVELS_DEFAULT = (()=>{                 // generated so density rises per biome (deterministic seeded layout)
  const out={}; let s=918273645; const rnd=()=>{ s=(s*1103515245+12345)>>>0; return (s&0x3fffffff)/0x3fffffff; };
  for(let zi=0; zi<ZONES.length; zi++){
    const start=ZONES[zi].start, end=(zi+1<ZONES.length)?ZONES[zi+1].start:start+1700, usable=end-start-50;
    const n=5+zi*3, step=usable/n, arr=[];     // 5,8,11,14,17,20 obstacles -> later biomes are a denser gauntlet
    for(let i=0;i<n;i++){
      const lx=Math.max(34, Math.round(40 + i*step + (rnd()-0.5)*step*0.5));
      if(i%3===1){ arr.push({t:'boost', x:lx, y:Math.round(16+zi*6+rnd()*14)}); }   // a boost gate to reward committing to height
      else { const w=Math.round(6+zi*1.2+rnd()*5);
        if(zi>=4 && rnd()<0.4){ const base=Math.round(20+zi*5+rnd()*22); arr.push({t:'block', x:lx, w, base, top:base+Math.round(12+rnd()*16)}); }  // floating slab up high
        else arr.push({t:'block', x:lx, w, base:0, top:Math.round(12+zi*6+rnd()*(9+zi*2))}); }   // ground block, taller each biome
    }
    out[zi]=arr;
  }
  return out;
})();

try{ localStorage.removeItem('scrapLaunch3D.levels.v1'); }catch(e){}   // one-time: drop the old sparse-course save so the denser v2 biomes load
function loadLevels(){ LEVELS={}; for(let i=0;i<ZONES.length;i++){ LEVELS[i]=(LEVELS_DEFAULT[i]||[]).map(o=>Object.assign({},o)); }
  try{ localStorage.removeItem('scrapLaunch3D.levels.v2'); }catch(e){} }   // one-time cleanup of pre-removal custom layouts

const airRoot=new THREE.Group(); scene.add(airRoot); let airObs=[]; let airT=0;
function makePlane(){ const g=new THREE.Group();
  const body=new THREE.Mesh(GEO.box, new THREE.MeshStandardMaterial({color:0xe8eef5,roughness:0.5,metalness:0.3})); body.scale.set(2.6,0.55,0.6); g.add(body);

  const nose=new THREE.Mesh(GEO.cone, new THREE.MeshStandardMaterial({color:0xb9c6d6,metalness:0.5,roughness:0.3})); nose.scale.set(0.55,0.9,0.55); nose.rotation.z=-Math.PI/2; nose.position.set(1.5,0,0); g.add(nose);
  return g; }
function makeBlimp(){ const g=new THREE.Group();
  const hull=new THREE.Mesh(new THREE.SphereGeometry(1,12,10), new THREE.MeshStandardMaterial({color:0xdfe7f0,roughness:0.6,metalness:0.2})); hull.scale.set(3.4,1.3,1.3); g.add(hull);
  const fin=new THREE.Mesh(GEO.box, new THREE.MeshStandardMaterial({color:0xff8a2c})); fin.scale.set(0.7,0.9,0.1); fin.position.set(-3.0,0,0); g.add(fin);
  const gond=new THREE.Mesh(GEO.box, new THREE.MeshStandardMaterial({color:0x444c58})); gond.scale.set(1.0,0.4,0.5); gond.position.y=-1.35; g.add(gond);
  return g; }
function makeBird(r){ const g=new THREE.Group(); const mat=new THREE.MeshStandardMaterial({color:0x2a2f3a, roughness:0.85, flatShading:true});
  const n=2+((r()*2)|0);
  for(let i=0;i<n;i++){ const b=new THREE.Group();
    const body=new THREE.Mesh(GEO.box, mat); body.scale.set(0.55,0.22,0.22); b.add(body);
    for(const s of [1,-1]){ const w=new THREE.Mesh(GEO.box, mat); w.scale.set(0.32,0.06,0.95); w.position.set(0,0.05,s*0.5); w.rotation.x=s*0.55; b.add(w); }
    b.position.set((i-(n-1)/2)*1.5, (i%2)*0.9, (i-1)*0.6); g.add(b);
  }
  return g; }
const BALLOON_COL=[0xff6b6b,0xffd23f,0x6bd3ff,0x9b6bff,0xff9e2c,0x57e08a];
function makeBalloon(r){ const g=new THREE.Group(); const col=BALLOON_COL[(r()*BALLOON_COL.length)|0];
  const env=new THREE.Mesh(new THREE.SphereGeometry(1,12,12), new THREE.MeshStandardMaterial({color:col,roughness:0.55})); env.scale.set(1.55,1.95,1.55); env.position.y=0.7; g.add(env);
  const basket=new THREE.Mesh(GEO.box, new THREE.MeshStandardMaterial({color:0x7a5230,roughness:0.9})); basket.scale.set(0.55,0.6,0.55); basket.position.y=-1.5; g.add(basket);
  g.userData.col=col; return g; }
function mkAir(kind,r){   // mesh + per-kind size/drift params for one air hazard
  if(kind==='bird')    return { o:makeBird(r),    rad:2.5, ax:3+r()*4, ay:1.5+r()*1.6, sp:0.7+r()*0.5 };
  if(kind==='balloon'){ const o=makeBalloon(r); return { o, rad:2.9, col:o.userData.col, ax:4+r()*4, ay:2+r()*2, sp:0.3+r()*0.35 }; }
  if(kind==='plane')   return { o:makePlane(),   rad:3.2, ax:12, ay:2,   sp:0.45 };
  return                      { o:makeBlimp(),   rad:3.9, ax:6,  ay:2.6, sp:0.22 };
}
function placeAir(kind,x,y,r){ const m=mkAir(kind,r), o=m.o; o.position.set(x, y, (r()-0.5)*3);
  if(kind==='plane' && r()<0.5) o.rotation.y=Math.PI;
  o.traverse(q=>{ if(q.isMesh){ q.castShadow=false; q.receiveShadow=false; } });
  o.userData={ type:'air', kind, used:false, rad:m.rad, col:m.col, hx:x, hy:y, ph:r()*6.28, ax:m.ax, ay:m.ay, sp:m.sp };
  airRoot.add(o); airObs.push(o);
}
function buildAir(){
  const r=rng(31337), reach=Math.min(WORLD_LEN-120, 4600);
  // AMBIENT - three drifting bands so there's always something around (low birds, mid planes, high balloons)
  for(let x=70;  x<reach;){ placeAir('bird', x, ceilAt(x)*(0.12+r()*0.34), r);                 x += 86+r()*84; }
  for(let x=150; x<reach;){ placeAir(r()<0.5?'plane':'blimp', x, ceilAt(x)*(0.42+r()*0.38), r); x += 130+r()*120; }
  for(let x=210; x<reach;){ placeAir('balloon', x, ceilAt(x)*(0.7+r()*0.24), r);                x += 140+r()*120; }
  // GAUNTLETS - a tall WALL of 5 hazards covering the column, ONE interior gap as the channel. This is the maze.
  const SLOTS=[0.16,0.3,0.44,0.58,0.72,0.86];
  for(let gx=300; gx<reach;){ const c=ceilAt(gx), gap=1+((r()*(SLOTS.length-2))|0);   // gap is interior (edges always blocked) so you must thread it
    SLOTS.forEach((fy,si)=>{ if(si===gap) return;
      const k = fy<0.24 ? 'bird' : fy>0.8 ? 'balloon' : (r()<0.55 ? (r()<0.5?'plane':'blimp') : 'balloon');   // mostly big hazards = real coverage, few birds (cheap on mesh count)
      placeAir(k, gx+(r()-0.5)*8, c*fy, r); });
    gx += 230+r()*140; }
}
buildAir();

  gs='FLY';
  Platform.gameplayStart(); Platform.progress('Start','game','z'+zoneAt(0)); Platform.track('launch',{value:save.launches});
  setBoostBtn(); updateFuelBar();   // fresh fuel -> re-enable the boost button this run
  Audio.launch(); Audio.startMusic();
  if(perfect){ Audio.perfect(); flash(loc('PERFECT!'), '#7CFF8A'); save.lifePerfect++; }
  save.launches++; persist();
  syncHUD(); showScreens();
}

function fireRocket(){
  if(gs!=='FLY' || rocketsLeft<=0 || car.wrecked) return;
  rocketsLeft--;
  if(save.tutStep===2){ save.tutStep=3; persist(); }   // rocket taught -> tutorial complete
  const imp=CFG.ROCK_IMPULSE0 + curUp('rocket')*CFG.ROCK_IMP_PER;
  car.vx += Math.cos(car.pitch)*imp; car.vy += Math.sin(car.pitch)*imp*0.7 + 2;
  Audio.rocket(); camShake=0.5;
  for(let i=0;i<10;i++) puff(car.x-1.6, car.y, car.z+(Math.random()-.5), 0xffd23f, 0.7, 3);
  syncHUD();
}

function wreckCar(impactV){
  if(car.wrecked) return; car.wrecked=true;
  boosting=false; Audio.boost(false);   // dead car ignores controls
  Audio.crash(); camShake=Math.min(1.2, 0.5+impactV*0.03);
  // detach wheels/spoiler/wings as PHYSICS parts - they tumble and can knock bricks out of buildings too
  for(const w of wheels.slice()){ spawnPhysPart(w, car.vx*0.5+(Math.random()-.5)*5, 4+Math.random()*6); }
  wheels=[];
  if(spoiler){ spawnPhysPart(spoiler, car.vx*0.4+(Math.random()-.5)*3, 5+Math.random()*5); spoiler=null; }
  if(save.up.wing>0 && wings){ spawnPhysPart(wings, car.vx*0.3+(Math.random()-.5)*3, 3+Math.random()*4); wings=null; }
  // crumple body
  if(bodyMesh){ bodyMesh.scale.set(0.9,0.6,1.0); bodyMesh.material.color.set(0xb5432a); }
  if(cabinMesh){ cabinMesh.rotation.z=-0.4; cabinMesh.position.y=0.35; }
  for(let i=0;i<14;i++) puff(car.x+(Math.random()-.5)*2, car.y+0.4, car.z+(Math.random()-.5)*2, i<7?0x333333:0xffa53c, 1.0, 1.5);
  // become a REAL physics body: the wreck tumbles, bounces and piles up with any bricks
  carWreckBody = new CANNON.Body({ mass:6, shape:new CANNON.Box(new CANNON.Vec3(1.3,0.5,0.62)),
    allowSleep:true, sleepSpeedLimit:1.1, sleepTimeLimit:0.5,
    linearDamping:Math.max(0.04, 0.12-curUp('tire')*0.014), angularDamping:0.25 });   // bouncy-tires -> less damping -> slides further
  carWreckBody.position.set(car.x, Math.max(car.y, CFG.GROUND_Y), 0);
  carWreckBody.velocity.set(car.vx, car.vy, 0);
  carWreckBody.angularVelocity.set(0,0,-Math.sign(car.vx||1)*Math.min(9, 3+Math.abs(car.vx)*0.18));
  physWorld.addBody(carWreckBody); car.physWreck=true; car._settleT=0; car._wreckAge=0; physBuiltCount++;
}

/* =================== PHYSICS =================== */
function wrap(a){ while(a>Math.PI)a-=2*Math.PI; while(a<-Math.PI)a+=2*Math.PI; return a; }
// swept segment (P0 + d) vs an axis-aligned box -> entry {t, nx, ny} or null (so fast cars can't tunnel through bricks)
function sweptBox(px0,py0, dx,dy, minX,maxX,minY,maxY){
  let tmin=0, tmax=1, nx=0, ny=0;
  if(Math.abs(dx)<1e-9){ if(px0<minX||px0>maxX) return null; }
  else { let t1=(minX-px0)/dx, t2=(maxX-px0)/dx, n=-1; if(t1>t2){ const tt=t1;t1=t2;t2=tt; n=1; }
    if(t1>tmin){ tmin=t1; nx=n; ny=0; } if(t2<tmax) tmax=t2; if(tmin>tmax) return null; }
  if(Math.abs(dy)<1e-9){ if(py0<minY||py0>maxY) return null; }
  else { let t1=(minY-py0)/dy, t2=(maxY-py0)/dy, n=-1; if(t1>t2){ const tt=t1;t1=t2;t2=tt; n=1; }
    if(t1>tmin){ tmin=t1; nx=0; ny=n; } if(t2<tmax) tmax=t2; if(tmin>tmax) return null; }
  return { t:tmin, nx, ny };
}
// distance from point P to segment A->B (swept collision so fast flights don't tunnel through pickups)
function segDist(px,py,pz, ax,ay,az, bx,by,bz){
  const abx=bx-ax, aby=by-ay, abz=bz-az; const apx=px-ax, apy=py-ay, apz=pz-az;
  const len2=abx*abx+aby*aby+abz*abz || 1e-6;
  let t=(apx*abx+apy*aby+apz*abz)/len2; t=t<0?0:(t>1?1:t);
  const dx=px-(ax+abx*t), dy=py-(ay+aby*t), dz=pz-(az+abz*t);
  return Math.sqrt(dx*dx+dy*dy+dz*dz);
}

function stepFlight(dt){
  if(car.physWreck) return;   // the wreck is a physics body now - updatePhysics drives it
  flyTime+=dt;
  // ---- pitch control ----
  const sp0=Math.hypot(car.vx,car.vy);
  const velAng=Math.atan2(car.vy,car.vx);
  // player input (a wrecked car can't steer)
  if(!car.wrecked) car.pitch += pitchInput*CFG.PITCH_RATE*dt;
  // weathervane toward velocity (stability) - but the PILOT overrides it while actively holding UP/DN, so you can keep a dive or a climb
  if(sp0>3){ const toVel=wrap(velAng-car.pitch); const wv=(pitchInput!==0?0.22:1)*CFG.WEATHERVANE; car.pitch += toVel*Math.min(1,wv*dt*(sp0/24)); }
  car.pitch=Math.max(-CFG.PITCH_MAX, Math.min(CFG.PITCH_MAX, car.pitch));

  // ---- forces (mass=1) ----
  let ax=0, ay=-CFG.G;
  if(sp0>0.01){
    const q=0.5*CFG.AIR*sp0*sp0;
    const aoa=wrap(car.pitch-velAng);
    let clA=CFG.CL_AOA*aoa, stalled=false;
    if(Math.abs(aoa)>CFG.STALL){ stalled=true; const deep=Math.abs(aoa)-CFG.STALL;   // plateau through the zoom range, then DEEP-stall bleed so a pinned nose-up can't porpoise forever -> flights settle
      clA=CFG.CL_AOA*CFG.STALL*Math.sign(aoa)*Math.max(0.4, 1-Math.max(0,deep-0.4)*0.9); }
    const wingArea=CFG.WING_AREA0 + curUp('wing')*CFG.WING_PER + carPerk('lift');
    const cl=CFG.CL0+clA;
    const aeroF=Math.max(0.4, 1-curUp('aero')*CFG.AERO_PER);
    const cd=(CFG.CD0+CFG.CD_AOA*aoa*aoa+(stalled?0.5:0))*CFG.BODY_AREA*aeroF;
    const L=q*cl*wingArea;
    const D=q*cd;
    const ux=car.vx/sp0, uy=car.vy/sp0;
    ax-=D*ux; ay-=D*uy;            // drag opposite velocity
    ax+=L*(-uy); ay+=L*(ux);       // lift perpendicular (rotate +90)
  }
  // ---- boost ----
  if(boosting && fuel>0 && !car.wrecked){
    if(save.tutStep===1){ save.tutStep=2; tutBoostT=flyTime; persist(); }   // boost taught
    const th=CFG.THRUST0 + curUp('boost')*CFG.THRUST_PER;
    ax+=Math.cos(car.pitch)*th; ay+=Math.sin(car.pitch)*th;
    fuel=Math.max(0,fuel-dt);
    if(Math.random()<0.8) puff(car.x-1.6*Math.cos(car.pitch), car.y-1.6*Math.sin(car.pitch), car.z, 0xff9a3c, 0.55, 0.5);
    if(fuel<=0){ boosting=false; Audio.boost(false); setBoostBtn(); }
  }

  const px0=car.x, py0=car.y, pz0=car.z;
  car.vx+=ax*dt; car.vy+=ay*dt;
  // SOFT top-speed cap: sustained speed (dive/boost) bleeds down to the limit, but a launch/rocket/gate BURST can briefly overshoot so the power is felt. Upgrade Top Speed to raise it.
  const ms=maxSpeedNow(), sp=Math.hypot(car.vx,car.vy);
  if(sp>ms){ const over=sp-ms, bleed=Math.min(over,(over*2+4)*dt), k=(sp-bleed)/sp; car.vx*=k; car.vy*=k; }
  car.x+=car.vx*dt; car.y+=car.vy*dt;
  const ceil=ceilAt(car.x);
  if(car.y > ceil){ car.y=ceil; if(car.vy>0){ car.vy=-car.vy*0.45;   // hit the sky ceiling (rises per zone) -> bounce back down
    if(flyTime-_ceilFlash>0.8){ _ceilFlash=flyTime; flash(loc('TOO HIGH! ↓'),'#ff8a6c'); for(let i=0;i<6;i++) puff(car.x+(Math.random()-.5)*4, ceil, 0, 0xeaf2ff, 0.7, -1); } } }
  distance=Math.max(distance, car.x);
  checkZone();

  // ---- pickups (swept against this frame's travel segment) ----
  for(const p of pickups){ if(p.userData.got) continue;
    if(Math.abs(p.position.x-car.x)>120) continue;           // cheap far-cull
    const rad=p.userData.type==='ring'?2.0:1.5;
    if(segDist(p.position.x,p.position.y,p.position.z, px0,py0,pz0, car.x,car.y,car.z) < rad){ p.userData.got=true; p.visible=false;
      if(p.userData.type==='coin'){ runCoins++; Audio.coin(); puff(p.position.x,p.position.y,p.position.z,0xffd23f,0.5,1.2); }
      else { car.vx*=1.06; car.vy=Math.max(car.vy, 4)+3; Audio.land(); for(let i=0;i<6;i++) puff(p.position.x,p.position.y,p.position.z,0x4fd1ff,0.7,2); }
      syncHUD();
    }
  }

  // ---- obstacles: fly THROUGH boost gates (kick) / fly OVER blocks (smash them = lose speed, they shatter) ----
  if(!car.wrecked && obstaclesEnabled) for(const o of obstacles){ if(car.physWreck) break; const ud=o.userData; if(ud.used) continue;
    if(Math.abs(o.position.x-car.x)>170) continue;
    if(ud.type==='boost'){
      if(segDist(o.position.x,o.position.y,0, px0,py0,pz0, car.x,car.y,car.z) < 2.7){
        ud.used=true; o.visible=false; runBoosts++; car.vx+=9; car.vy=Math.max(car.vy,7)+9;
        Audio.rocket(); flash(loc('BOOST!'),'#39ff88'); camShake=Math.max(camShake,0.4);
        for(let i=0;i<10;i++) puff(o.position.x,o.position.y,0,0x39ff88,0.8,3.5); syncHUD();
      }
    } else { // HOUSE: SWEPT solid collision vs the STANDING bricks - the car stops at the first brick on its path (no tunnelling, no pass-through)
      const gx=o.position.x; let best=null, bb=null;
      for(const b of ud.bricks){ if(b.hit) continue;                              // a knocked brick is no longer solid
        const bx=gx+b.mesh.position.x, by=b.mesh.position.y;
        const hit=sweptBox(px0,py0, car.x-px0, car.y-py0, bx-b.half[0]-CAR_HX, bx+b.half[0]+CAR_HX, by-b.half[1]-CAR_HY, by+b.half[1]+CAR_HY);
        if(hit && (!best || hit.t<best.t)){ best=hit; bb=b; }                     // keep the FIRST brick the car would reach
      }
      if(bb){
        const bx=gx+bb.mesh.position.x, by=bb.mesh.position.y; let impact=0;
        if(best.nx===0 && best.ny===0){                                          // started already overlapping -> push out the shallow axis
          const ox=(bb.half[0]+CAR_HX)-Math.abs(car.x-bx), oy=(bb.half[1]+CAR_HY)-Math.abs(car.y-by);
          if(ox<oy){ const s=Math.sign(car.x-bx)||-1; car.x=bx+s*(bb.half[0]+CAR_HX); impact=Math.abs(car.vx); if(car.vx*s<0) car.vx=-car.vx*0.34; }
          else { const s=Math.sign(car.y-by)||1; car.y=by+s*(bb.half[1]+CAR_HY); impact=Math.abs(car.vy); if(car.vy*s<0) car.vy=-car.vy*0.34; }
        } else {                                                                 // stop the car at the brick face it hits, reflect that axis
          car.x=px0+(car.x-px0)*best.t; car.y=py0+(car.y-py0)*best.t;
          if(best.nx!==0){ impact=Math.abs(car.vx); if(car.vx*best.nx<0) car.vx=-car.vx*0.34; }
          else { impact=Math.abs(car.vy); if(car.vy*best.ny<0) car.vy=-car.vy*0.34; }
        }
        bb.hit=true; let got=1;                                                  // knock the struck brick + the cluster around it
        for(const b of ud.bricks){ if(b.hit) continue;
          if(Math.abs((gx+b.mesh.position.x)-bx)<ud.brick.bw*1.6 && Math.abs(b.hy-bb.hy)<ud.brick.bh*1.6){ b.hit=true; got++; } }
        ud.wakeAll=true; ud.impactVx=Math.max(ud.impactVx||0, impact, Math.abs(car.vx)+8);
        runSmashed+=got; smashCombo++; showCombo();                               // DEMOLITION reward: coins per brick, building combo multiplier
        const mult=Math.min(6, 1+((smashCombo/3)|0)); const gain=Math.round(got*mult*(1+carPerk('smash'))); runCoins+=gain;
        camShake=Math.max(camShake, 0.4+impact*0.02);
        if(!ud.hit){ ud.hit=true; runHazards++; }
        for(let i=0;i<got+3;i++) puff(car.x+(Math.random()-.5)*ud.w*0.4, car.y+(Math.random()-.5)*2, 0, i<got?0x999999:0xffd23f, 0.9, 2.2);
        if(impact>CFG.WRECK_SPEED && !car.wrecked){ wreckCar(impact); flash(loc('WRECKED!  +')+gain, '#ff5a3c'); }   // hard slam -> wreck into the rubble
        else { Audio.crash(); Audio.coin(); flash(loc('SMASH x')+smashCombo+'   +'+gain+(mult>1?'  ('+mult+'x)':''), '#ffd23f'); }
        syncHUD();
      }
    }
  }

  // ---- aerial hazards: birds = light clip (mid band), planes/blimps = hard knockdown (high band) ----
  if(!car.wrecked && obstaclesEnabled) for(const o of airObs){ const u=o.userData; if(u.used) continue;
    if(Math.abs(o.position.x-car.x)>45) continue;
    if(segDist(o.position.x,o.position.y,0, px0,py0,pz0, car.x,car.y,car.z) < u.rad){
      u.used=true; o.visible=false; runHazards++;
      if(u.kind==='bird'){ car.vx*=0.8; car.vy-=2.5; Audio.bounce(8); camShake=Math.max(camShake,0.3); flash(loc('BIRDS!'),'#ffd23f');   // light: scatter + small dip
        for(let i=0;i<7;i++) puff(o.position.x+(Math.random()-.5)*2, o.position.y, 0, 0xe8e2d0, 0.5, 1.6); }
      else if(u.kind==='balloon'){ car.vx*=0.72; car.vy=-Math.abs(car.vy)*0.35 - 4; Audio.bounce(11); camShake=Math.max(camShake,0.45); flash(loc('POP! ↓'),'#ff9e2c');   // medium: pop + knocked down
        for(let i=0;i<10;i++) puff(o.position.x+(Math.random()-.5)*2.5, o.position.y, 0, i<6?(u.col||0xff9e2c):0xffffff, 0.7, 1.5); }
      else { car.vx*=0.5; car.vy=-Math.abs(car.vy)*0.3 - 6; Audio.crash(); camShake=Math.max(camShake,0.7); flash(loc(u.kind==='plane'?'PLANE! ↓':'BLIMP! ↓'),'#ff5a3c');   // hard: knocked out of the sky
        for(let i=0;i<10;i++) puff(o.position.x+(Math.random()-.5)*3, o.position.y, 0, i<5?0xeaf2ff:0xff5a3c, 0.9, 1.4); }
      syncHUD();
    }
  }

  // ---- ground ----
  if(car.y<=CFG.GROUND_Y){
    car.y=CFG.GROUND_Y;
    if(!car.wrecked) wreckCar(Math.abs(car.vy));   // touch the ground -> wreck; the physics body tumbles it to rest
  }

  // visual roll tumble after wreck
  if(car.wrecked) car.roll += car.vx*dt*0.5;
}

/* =================== RENDER UPDATE =================== */
function updateCarMesh(){
  if(car.physWreck && carWreckBody){   // wreck follows its physics body (tumbling)
    carGroup.position.set(carWreckBody.position.x, carWreckBody.position.y, 0);
    carGroup.quaternion.copy(carWreckBody.quaternion);
    flameSprite.visible=false; return;
  }
  carGroup.position.set(car.x, car.y, car.z);
  carGroup.rotation.set(car.wrecked?car.roll*0.3:0, 0, car.wrecked? car.pitch+car.roll : car.pitch);
  // spin wheels
  const roll=car.vx*0.016;
  for(const w of wheels) w.rotation.z-=roll;
  // nozzle glow + flame while boosting
  const showFlame=boosting&&fuel>0;
  flameSprite.visible=showFlame;
  if(showFlame){ const fx=car.x-1.9*Math.cos(car.pitch), fy=car.y-1.9*Math.sin(car.pitch);
    flameSprite.position.set(fx,fy,car.z); flameSprite.lookAt(camera.position);
    flameSprite.scale.set(1.4+Math.random()*0.5, 0.9+Math.random()*0.3, 1); }
}

function stepFrags(dt){
  for(let i=frags.length-1;i>=0;i--){ const f=frags[i]; f.life-=dt; f.vy-=CFG.G*dt;
    f.mesh.position.x+=f.vx*dt; f.mesh.position.y+=f.vy*dt; f.mesh.position.z+=f.vz*dt;
    f.mesh.rotation.x+=f.av.x*dt; f.mesh.rotation.y+=f.av.y*dt; f.mesh.rotation.z+=f.av.z*dt;
    if(f.mesh.position.y<0.2){ f.mesh.position.y=0.2; f.vy*=-0.4; f.vx*=0.7; f.vz*=0.7; f.av.multiplyScalar(0.6); }
    if(f.life<=0){ disposeObj(f.mesh); scene.remove(f.mesh); frags.splice(i,1); }
  }
}

const camTarget=new THREE.Vector3(), camPos=new THREE.Vector3();
function updateCamera(dt){
  let look, pos;
  if(gs==='AIM'){
    look=new THREE.Vector3(3.5,4.2,0); pos=new THREE.Vector3(-6,6.5,22);   // frame the slingshot + room for the aim arc
  } else {
    const sp=Math.hypot(car.vx,car.vy);
    const lead=Math.min(16, 5+sp*0.26);
    const zoom=1 + Math.min(1.5, car.y/55 + sp/110);
    look=new THREE.Vector3(car.x+lead*0.4, car.y+0.5, 0);      // track the car's height -> stays framed at any altitude
    pos =new THREE.Vector3(car.x-4, car.y+6+zoom*3, 15+zoom*7.5);
  }
  camTarget.lerp(look, 1-Math.pow(0.0001,dt));
  camPos.lerp(pos, 1-Math.pow(0.0008,dt));
  camera.position.copy(camPos);
  if(camShake>0){ camShake=Math.max(0,camShake-dt*2.2); const s=camShake*0.6;
    camera.position.x+=(Math.random()-.5)*s; camera.position.y+=(Math.random()-.5)*s; }
  camera.lookAt(camTarget);
  // keep sun shadow near the car
  sun.position.set(car.x-40, 80, 60); sun.target.position.set(car.x, 0, 0);
}

/* =================== MAIN LOOP =================== */
let last=0;
function frame(t){
  requestAnimationFrame(frame);
  const now=t/1000; let dt=last?Math.min(0.05, now-last):0.016; last=now;


  if(gs==='AIM'){
    updateAimDots();
  } else if(gs==='FLY'){
    stepFlight(dt);
    document.getElementById('dist').innerHTML=Math.floor(distance)+'<span style="font-size:15px;color:#8fa6c2;">'+MU()+'</span>';
    updateFuelBar(); updateSpeedo();
  } else if(gs==='SETTLE'){
    settleTimer+=dt;
    if(settleTimer>0.9){ endRun(); }
  }

  // spin pickups + obstacles
  for(const p of pickups){ if(!p.userData.got){ if(p.userData.type==='coin') p.rotation.z+=p.userData.spin*dt; else p.rotation.x+=p.userData.spin*dt; } }
  for(const o of obstacles){ if(o.visible && o.userData.type==='boost') o.rotation.y+=1.4*dt; }
  stepFrags(dt); stepSmoke(dt);
  if(gs==='FLY'||gs==='SETTLE') updatePhysics(dt);   // not RESULT - houses are done collapsing by then
  updateCarMesh(); updateCamera(dt); updateZoneVisuals(dt); updateTutorial(); updateAir(dt);
  Audio.tick(dt);
  renderer.render(scene, camera);
}

function endRun(){
  gs='RESULT'; hideCombo();   // full-screen results: summary, loot box, upgrades, garage
  Platform.gameplayStop(); Platform.progress('Complete','game','z'+zoneAt(Math.floor(distance))); Platform.track('wreck',{value:Math.floor(distance)});
  for(const o of obstacles){ if(o.userData.built) deactivateHouse(o); }   // stop physics while the shop is open
  const d=Math.floor(distance);
  bestThisRun = d>save.best;
  if(bestThisRun) save.best=d;
  const earned=Math.round((Math.floor(d*CFG.COIN_PER_M)+runCoins) * (1+carPerk('coin')));
  save.coins+=earned;
  // lifetime stats feed the quest ladder
  save.lifeSmashed+=runSmashed; save.lifeEarned+=earned; save.lifeGates+=runBoosts;
  let goalBonus=0, goalHit=null;
  while(save.goalsDone<GOALS.length){ const g=GOALS[save.goalsDone]; if(goalStat(g.m)>=g.t){ goalBonus+=g.r; goalHit=g; save.goalsDone++; } else break; }
  save.coins+=goalBonus; persist();
  Audio.boost(false);
  // fill result
  document.getElementById('resTitle').textContent=loc('WRECKED IN ')+loc(ZONES[zoneAt(d)].name);
  document.getElementById('resDist').textContent=d+loc(' m');
  document.getElementById('resNew').textContent = goalHit? ('★ '+loc('GOAL: ')+loc(goalHit.d)+'  +'+goalBonus)
    : bestThisRun? ('★ '+loc('NEW BEST!')) : (loc('best ')+save.best+loc(' m')+' · '+loc(ZONES[save.bestZone].name));
  document.getElementById('resEarn').textContent='+'+(earned+goalBonus)+loc(' coins')+(runSmashed>0?' · '+runSmashed+loc(' smashed'):'');
  document.getElementById('resBank').innerHTML='\u{1F4B0} '+save.coins;
  lastRunEarned=earned+goalBonus; runDoubled=false; renderIap();   // rewarded ×2 offer covers exactly this run's payout
  renderShop(); updateGoalPill();
  if(goalHit) flash(loc('GOAL!  ')+loc(goalHit.d)+'  +'+goalBonus, '#7CFF8A');
  else if(bestThisRun) flash(loc('NEW BEST  ')+d+loc(' m'), '#ffd23f');
  showScreens();
  syncHUD();
}

/* =================== UI: SHOP =================== */
function upCost(u){ const lvl=save.up[u.key]; return Math.round(u.base*Math.pow(u.mul,lvl)); }
function renderShop(){
  const root=document.getElementById('ups'); root.innerHTML='';
  for(const u of UPGRADES){
    const lvl=save.up[u.key]; const maxed=lvl>=u.max; const cost=upCost(u); const afford=save.coins>=cost;
    const el=document.createElement('div'); el.className='up'+(maxed?' max':(afford?'':' cant'));
    let pips=''; for(let i=0;i<u.max;i++) pips+='<span class="pip'+(i<lvl?' on':'')+'"></span>';
    el.innerHTML=
      '<div class="uh"><span class="uic">'+u.ic+'</span><span class="un">'+loc(u.name)+'</span></div>'+

}

    while(h++<260 && gs==='FLY'){ stepFlight(1/60); if(car.y>peak)peak=car.y; if(car.vy>1) climbed=true; if(climbed && car.vy<-1) break; }   // stop once we've crested the zoom
    pitchInput=0; obstaclesEnabled=true;
    return { vBot:+vBot.toFixed(1), yBot:+yBot.toFixed(1), peak:+peak.toFixed(1), climb:+(peak-yBot).toFixed(1) }; },
  restart(){ shopForced=false; resetToAim(); },
  launchAt(p){ if(gs!=='AIM') resetToAim(); aimAngle=CFG.AIM_ANGLE_DEF; meter=Math.max(0,Math.min(1,p==null?1:p)); doLaunch(); },
  boost(on){ if(gs==='FLY'){ boosting=!!on && fuel>0; Audio.boost(boosting); } },
  pitch(v){ pitchInput=v; },
  rocket(){ fireRocket(); },
  setUp(k,l){ if(save.up[k]!=null){ save.up[k]=Math.max(0,Math.min(UPGRADES.find(u=>u.key===k).max,l)); persist(); if(k==='wing'){ buildCar(); } } },
  maxAll(){ for(const u of UPGRADES) save.up[u.key]=u.max; persist(); buildCar(); },
  addCoins(n){ save.coins+=n; persist(); syncHUD(); renderShop(); },
  gacha(){ openGacha(); return save.cars.length; },
  equip(i){ equipCar(i); return save.car; },
  airList(){ return airObs.map(o=>({x:+o.position.x.toFixed(1), y:+o.position.y.toFixed(1), kind:o.userData.kind})); },
  topSpeeds(){ return CARS.map(c=>c.top); },   // per-car base top speed (the "different starting point")
  zoneObstacleCounts(){ const c=ZONES.map(()=>0); for(const o of obstacles) c[o.userData.zone]++; return c; },   // obstacles per biome (should rise)
  buriedCoins(){ this.restart(); let n=0; for(const p of pickups){ if(p.userData.type==='coin' && pointInBlock(p.position.x,p.position.y,0.4)) n++; } return n; },   // coins stuck inside a building (should be 0)
  coll(){ openCollection(); const n=document.getElementById('collGrid').children.length; closeCollection(); return n; },
  showColl(){ openCollection(); }, hideColl(){ closeCollection(); },
  coinTest(){ this.restart(); const coin=pickups.find(p=>p.userData.type==='coin'); if(!coin) return 0;   // deterministic: fly dead through one coin
    aimAngle=CFG.AIM_ANGLE_DEF; meter=1; doLaunch(); car.x=coin.position.x-9; car.y=coin.position.y+2; car.vx=30; car.vy=-2; car.pitch=-0.1; obstaclesEnabled=false;
    for(let i=0;i<90 && !coin.userData.got;i++) stepFlight(1/60); obstaclesEnabled=true; return runCoins; },
  buy(k){ buy(k); },
  toggleMute(){ const m=Audio.toggleMute(); syncHUD(); return m; },
  endNow(){ if(gs!=='FLY'&&gs!=='SETTLE') return; if(!car.wrecked) wreckCar(12); if(carWreckBody){ carWreckBody.velocity.set(0,0,0); carWreckBody.angularVelocity.set(0,0,0); } gs='SETTLE'; settleTimer=1.0; },
  fireInterstitial(){ window.__adResumed=false; Platform.interstitial(function(){ window.__adResumed=true; }); },   // test hook: drive the ad no-fill watchdog path
  fireRewarded(){ window.__adResumed=false; Platform.rewarded(function(){ window.__adResumed=true; }); },
  iap:{ buy(id){ buyProduct(id); }, state(){ return { adsFree:save.adsFree, owned:save.cars.slice(), paymentsReady:Platform.paymentsReady(), lastRunEarned, runDoubled }; },
        x2(){ doubleCoins(); }, adCar(i){ adUnlockCar(i); } },
  audioSamples(){ return Audio.nSamples(); },
  musicTheme(){ return Audio.hasTheme(); },
  obstacleList(){ return obstacles.map(o=>({x:+o.position.x.toFixed(1), y:+o.position.y.toFixed(1), type:o.userData.type, top:o.userData.top!=null?+o.userData.top.toFixed(1):null, base:o.userData.base||0, w:o.userData.w||null})); },
  poseFly(x,y,vx,vy){ resetToAim(); aimAngle=CFG.AIM_ANGLE_DEF; meter=1; doLaunch(); car.x=x; car.y=y; car.z=0; car.vx=vx; car.vy=vy; car.pitch=0.18; car.wrecked=false; boosting=false; },
  // step physics headlessly until at rest (no waiting on rAF); returns distance
  simulate(power, opts){ opts=opts||{}; this.restart(); aimAngle=opts.angle!=null?opts.angle:CFG.AIM_ANGLE_DEF; meter=power==null?1:power; doLaunch();
    if(opts.startAt){ const s=opts.startAt; car.x=s.x; car.y=s.y; car.vx=s.vx; car.vy=s.vy||0; car.pitch=s.pitch!=null?s.pitch:0; }
    obstaclesEnabled = !opts.noObstacles;     // physics-comparison runs can suppress obstacle variance
    let guard=0, peakY=car.y, peakSpeed=0; const dt=1/60;
    while((gs==='FLY'||gs==='SETTLE') && guard++<6000){
      if(opts.boost && fuel>0) boosting=true;
      if(opts.pitch!=null) pitchInput=opts.pitch;
      if(opts.rocketAt && Math.abs(car.x-opts.rocketAt)<1 && rocketsLeft>0) fireRocket();
      stepFlight(dt); updatePhysics(dt);   // step the physics so the wreck tumbles + settles headlessly too
      if(car.y>peakY) peakY=car.y;
      const _s=Math.hypot(car.vx,car.vy); if(_s>peakSpeed) peakSpeed=_s;
      if(opts.stopAtX!=null && car.x>opts.stopAtX) break;   // scope a test to one region (e.g. just past one obstacle)
      if(gs==='SETTLE'){ settleTimer+=dt; if(settleTimer>0.9) break; }   // mirror the frame loop's SETTLE->end dwell
    }
    obstaclesEnabled = true;
    const guardHit = gs==='FLY' && !(opts.stopAtX!=null);   // still actively flying at the step cap = never settled (a slow-glide float)
    return { dist:Math.floor(distance), coins:runCoins, wrecked:car.wrecked, bounces:bounceCount, zone:curZone, zoneName:ZONES[curZone].name, boosts:runBoosts, hazards:runHazards, peakY:+peakY.toFixed(1), peakSpeed:+peakSpeed.toFixed(1), guardHit }; },
  cfg(){ return CFG; },
};
// Browser-game-QA state hook: the harness reads window.__gfState (or render_game_to_text).
// This game already exposes rich, deterministic state under window.__game.state(); alias it
// to the harness's expected name so QA can read gs/dist/coins. Pure alias, no gameplay change.
window.__gfState = function(){ try { return window.__game.state(); } catch (e) { return null; } };
</script>
