    materials: ['Медь','Железо','Золото','Кристалл','Плазма'],
    goods: ['Слиток','Плита','Шестерня','Линза','Ячейка'],
    machines: ['Плавильня','Пресс','Сборщик','Резак','Реактор'],

var SPRITE_NAMES = ['ore_chunk','ingot','smelter','dock'];

// ── TUNABLES (exposed via GF.exposeState) ───────────────────────────────────
var START_LIVES      = 3;
var BACKLOG_MAX      = 12;
var GRID_W           = 6;
var GRID_H           = 8;
var GRID_H_MAX       = 12;
var BELT_SPEED       = 1.6;     // cells/sec (base)
var ORE_SPAWN_SEC    = 2.2;
var MACHINE_TIME     = 1.4;
var CONTRACT_PATIENCE= 14;      // backlog-growth units a contract tolerates
var TIER_COST        = [0, 40, 140, 420, 1100];
var BELT_COST        = 5;
var SELL_BASE        = [3, 8, 20, 55, 140];
var MAX_TIER         = 4;

// per-tier accent colours (material / good glow)
var TIER_COL = ['#e0894a','#c7d0d8','#ffd34d','#7ad6ff','#ff6ad5'];
var TIER_COL_DK = ['#7a4521','#5d6670','#a8842a','#357a9c','#9c2f78'];

// ── GAME STATE ──────────────────────────────────────────────────────────────
var gs = 'MENU';               // MENU | PLAYING | GAMEOVER
var lives = START_LIVES;
var coins = 0;
var coinsAllTime = 0;
var tier = 0;                  // highest unlocked recipe tier
var bestCoins = 0;
var bestTier = 0;
var gridW = GRID_W, gridH = GRID_H;
var backlog = 0;
var beltSlots = 18;           // how many belts the player may own at once
var beltsPlaced = 0;
var speedMul = 1;             // belt speed multiplier (upgrade)
var beltSpeedLvl = 0;
var sources = [];             // [{cx,cy,tier,acc}]
var grid = [];                // grid[y][x] = cell
var items = [];               // items in transit {tier,kind,type,gx,gy,prog,dir}
var contracts = [];           // {goodTier, need, have, patience, pmax, reward}
var ownedMachines = [0];      // which machine tiers the player owns (0=smelter)
var dock = { cx: 0, cy: 0 };
var selTool = 'belt';         // 'belt' | 'erase' | 'm0'.. (machine tier)
var oreTimer = 0;
var contractTimer = 0;
var shopOpen = false;
var seenTut = false;
var helpOpen = false;
var floatCoins = 0;           // smoothed display coins
var surge = 1;                // ore spawn-rate multiplier, climbs with tier
var nextContractDelay = 0;

// layout cache
var CELL = 40, gridX = 0, gridY = 0, hudH = 0, toolbarY = 0;
var toolButtons = [];         // {id, x,y,w,h, label}
var shopBtnRect = null;
var muteRect = null, helpRect = null, menuRect = null;
var shopScroll = null, shopRows = [];

// ── COACH (interactive tutorial) ─────────────────────────────────────────────
var coachActive = false, coachStep = 0, coachT = 0;
var COACH_PLACE_CELL = null;  // {gx,gy} target for place step

// ── HELPERS ──────────────────────────────────────────────────────────────────
function L(arr, i) { var a = GF.t(arr); return (a && a[i]) ? a[i] : '?'; }
function matName(t) { return L('materials', t); }
function goodName(t) { return L('goods', t); }
function machName(t) { return L('machines', t); }

function inGrid(gx, gy) { return gx >= 0 && gx < gridW && gy >= 0 && gy < gridH; }
function cellAt(gx, gy) { return inGrid(gx, gy) ? grid[gy][gx] : null; }

function emptyGrid() {
  grid = [];
  for (var y = 0; y < gridH; y++) {
    var row = [];
    for (var x = 0; x < gridW; x++) row.push(null);
    grid.push(row);
  }
}

// belt directions: 0=down,1=left,2=up,3=right
var DX = [0, -1, 0, 1], DY = [1, 0, -1, 0];

function placeSources() {
  sources = [];
  // primary source top-left-ish
  sources.push({ cx: 1, cy: 0, tier: 0 });
}

// ── LIFECYCLE ────────────────────────────────────────────────────────────────
function startGame() {
  lives = START_LIVES;
  coins = 0; coinsAllTime = 0; floatCoins = 0;
  tier = 0;
  gridW = GRID_W; gridH = GRID_H;
  backlog = 0;
  beltSlots = 18; beltsPlaced = 0;
  speedMul = 1; beltSpeedLvl = 0;
  ownedMachines = [0];   // smelter owned from the start → fast time-to-first-fun
  surge = 1;
  items = [];
  contracts = [];
  selTool = 'belt';
  shopOpen = false; helpOpen = false;
  oreTimer = 0; contractTimer = 0; nextContractDelay = 0;
  emptyGrid();
  placeSources();
  // dock bottom-centre
  dock.cx = Math.floor(gridW / 2); dock.cy = gridH - 1;
  layout();
  addContract();
  gs = 'PLAYING';
  GF.gameStarted();
  GF.saveRun();
  if (!seenTut && !window._silent) startCoach();
}

function gameOver() {
  if (coinsAllTime > bestCoins) { bestCoins = coinsAllTime; persistBest(); }
  if (tier > bestTier) { bestTier = tier; persistBest(); }
  gs = 'GAMEOVER';
  GF.sfx('lose');
  GF.setShake(0.8);
  GF.gameEnded();
  GF.saveRun();
}

function persistBest() {
  try {
    localStorage.setItem('conveyor_tycoon_best', String(bestCoins));
    localStorage.setItem('conveyor_tycoon_besttier', String(bestTier));
  } catch (e) {}
}

function loseLife(reason) {
  if (coachActive) return;   // no-fail during the interactive tutorial
  lives--;
  GF.sfx('hurt');
  GF.setShake(0.5);
  GF.spawnFloat(GF.W / 2, hudH + 30 * GF.S, GF.t(reason), '#ff6b6b');
  if (lives <= 0) gameOver();
  GF.saveRun();
}

// ── CONTRACTS ────────────────────────────────────────────────────────────────
function addContract() {
  // pick a good tier the player can plausibly make (0..tier)
  var gt = Math.min(tier, Math.floor(Math.random() * (tier + 1)));
  var need = 3 + Math.floor(Math.random() * (3 + gt * 2));
  var reward = Math.round(SELL_BASE[gt] * need * (1.4 + gt * 0.25));
  var pat = CONTRACT_PATIENCE + gt * 4;
  contracts.push({ goodTier: gt, need: need, have: 0, patience: pat, pmax: pat, reward: reward });
}

function deliverGood(goodTier) {
  // find an open contract wanting this good tier
  for (var i = 0; i < contracts.length; i++) {
    var c = contracts[i];
    if (c.goodTier === goodTier && c.have < c.need) {
      c.have++;
      gainCoin(Math.max(1, Math.round(SELL_BASE[goodTier] * (0.5 + goodTier * 0.15))));
      GF.sfx('coin');
      if (c.have >= c.need) {
        gainCoin(c.reward);
        GF.sfx('reward');
        GF.setShake(0.35);
        GF.spawnParticles(GF.W / 2, hudH + 20 * GF.S, TIER_COL[goodTier], 18);
        contracts.splice(i, 1);
        nextContractDelay = 0.6;
      }
      return true;
    }
  }
  // no contract wants it → backlog
  backlog++;
  GF.sfx('click');
  if (backlog > BACKLOG_MAX) {
    backlog = Math.floor(BACKLOG_MAX / 2);
    loseLife('sourceFull');
  }
  return false;
}

// Single source of truth for earning: bumps both spendable coins and the
// all-time tally (which gates tier unlocks + is the high score).
function gainCoin(n) {
  coins += n;
  coinsAllTime += n;
  GF.spawnFloat(GF.W / 2, hudH + 44 * GF.S, '+' + n, '#ffe08a');
}

// Tier unlock is surfaced/purchased through the SHOP (the SHOP button glows when
// coinsAllTime crosses TIER_COST[tier+1]); no auto-unlock here.

// ── ORE / MACHINES / FLOW ────────────────────────────────────────────────────
function spawnOre() {
  for (var s = 0; s < sources.length; s++) {
    var src = sources[s];
    // emit onto the cell directly below the source if it's a belt/machine
    var tgt = cellAt(src.cx, src.cy + 1);
    // don't overflow: only spawn if no item is right at the start of that cell
    var crowded = false;
    for (var i = 0; i < items.length; i++) {
      var it = items[i];
      if (it.gx === src.cx && it.gy === src.cy + 1 && it.prog < 0.25) { crowded = true; break; }
    }
    if (!crowded) {
      items.push({ tier: src.tier, kind: 'raw', gx: src.cx, gy: src.cy + 1, prog: 0, dir: 0, alive: true });
    }
  }
}

function nextCellInDir(gx, gy, dir) {
  return { gx: gx + DX[dir], gy: gy + DY[dir] };
}

function updateItems(dt) {
  var spd = BELT_SPEED * speedMul * dt;
  for (var i = items.length - 1; i >= 0; i--) {
    var it = items[i];
    if (!it.alive) { items.splice(i, 1); continue; }
    var cell = cellAt(it.gx, it.gy);

    // arrived at the dock cell center?
    if (it.gx === dock.cx && it.gy === dock.cy) {
      it.prog += spd;
      if (it.prog >= 0.5) {
        // sell / deliver only finished goods; raw ore at dock = wasted → backlog too
        if (it.kind === 'good') {
          deliverGood(it.tier);
        } else {
          // raw ore wasted at dock
          backlog++;
          if (backlog > BACKLOG_MAX) { backlog = Math.floor(BACKLOG_MAX / 2); loseLife('sourceFull'); }
        }
        items.splice(i, 1);
      }
      continue;
    }

    if (!cell) {
      // item on a cell with nothing (e.g. machine removed) → it just sits/dies
      it.prog += spd * 0.5;
      if (it.prog > 1.2) items.splice(i, 1);
      continue;
    }

    if (cell.type === 'belt') {
      it.dir = cell.dir;
      it.prog += spd;
      if (it.prog >= 1) {
        var nx = nextCellInDir(it.gx, it.gy, cell.dir);
        if (canEnter(nx.gx, nx.gy, it)) {
          it.gx = nx.gx; it.gy = nx.gy; it.prog = 0;
        } else {
          it.prog = 1; // blocked, wait at edge
        }
      }
    } else if (cell.type === 'machine') {
      // machine processing handled in updateMachines; item parked here
      it.prog = Math.min(it.prog + spd, 0.5);
    }
  }
}

function canEnter(gx, gy, item) {
  // dock always accepts
  if (gx === dock.cx && gy === dock.cy) return true;
  var c = cellAt(gx, gy);
  if (!c) return false;
  // don't pile two items on same cell start
  for (var i = 0; i < items.length; i++) {
    var it = items[i];
    if (it !== item && it.gx === gx && it.gy === gy && it.prog < 0.35) return false;
  }
  if (c.type === 'belt') return true;
  if (c.type === 'machine') return !c.busy; // machine free
  return false;
}

function updateMachines(dt) {
  for (var y = 0; y < gridH; y++) {
    for (var x = 0; x < gridW; x++) {
      var c = grid[y][x];
      if (!c || c.type !== 'machine') continue;
      if (c.busy) {
        c.proc += dt;
        if (c.proc >= MACHINE_TIME) {
          // output: emit finished good onto output belt (machine's dir)
          var nx = nextCellInDir(x, y, c.dir);
          var outOk = canEnter(nx.gx, nx.gy, null);
          if (outOk) {
            items.push({ tier: c.outTier, kind: 'good', gx: nx.gx, gy: nx.gy, prog: 0, dir: 0, alive: true });
            c.busy = false; c.proc = 0; c.heldKind = null;
            GF.spawnParticles((gridX + x * CELL + CELL / 2), (gridY + y * CELL + CELL / 2), TIER_COL[c.outTier], 7);
            GF.sfx('spawn');
          }
          // else wait (output blocked)
        }
      } else {
        // try to grab a matching incoming item parked on this cell
        for (var i = 0; i < items.length; i++) {
          var it = items[i];
          if (it.gx === x && it.gy === y && it.prog >= 0.3) {
            // machine of tier mt eats material of tier == mt (raw) OR good of tier mt-1
            // smelter (tier0) eats raw copper(0) -> ingot(0)
            // press (tier1) eats ingot(0) -> plate(1)  [chain]
            // generalised: machine tier mt accepts input tier (mt) raw OR (mt-1) good
            var accept = false;
            if (it.kind === 'raw' && it.tier === c.mtier) accept = true;
            else if (it.kind === 'good' && it.tier === c.mtier - 1) accept = true;
            if (accept) {
              c.busy = true; c.proc = 0; c.heldKind = it.kind;
              items.splice(i, 1);
              break;
            }
          }
        }
      }
    }
  }
}

// ── PLACEMENT ────────────────────────────────────────────────────────────────
function countBelts() {
  var n = 0;
  for (var y = 0; y < gridH; y++) for (var x = 0; x < gridW; x++) {
    if (grid[y][x] && grid[y][x].type === 'belt') n++;
  }
  return n;
}

function isReserved(gx, gy) {
  if (gx === dock.cx && gy === dock.cy) return true;
  for (var s = 0; s < sources.length; s++) if (sources[s].cx === gx && sources[s].cy === gy) return true;
  return false;
}

function placeAt(gx, gy) {
  if (!inGrid(gx, gy) || isReserved(gx, gy)) { GF.sfx('error'); return; }
  var c = grid[gy][gx];
  if (selTool === 'erase') {
    if (c) { grid[gy][gx] = null; GF.sfx('click'); GF.saveRun(); }
    return;
  }
  if (selTool === 'belt') {
    if (c && c.type === 'belt') {
      c.dir = (c.dir + 1) % 4; // rotate existing belt (does NOT advance coach)
      GF.sfx('tap');
      GF.saveRun();
      return;
    }
    if (c) { GF.sfx('error'); return; } // occupied by machine
    if (countBelts() >= beltSlots) { GF.sfx('error'); flashNeedBelt(); return; }
    grid[gy][gx] = { type: 'belt', dir: 0 };
    GF.sfx('click');
    GF.spawnParticles(gridX + gx * CELL + CELL / 2, gridY + gy * CELL + CELL / 2, '#8ab4ff', 5);
    GF.saveRun();
    if (coachActive && coachStep === 1) advanceCoach();   // belt placed
    return;
  }
  // machine tool: 'm0'..'m4'
  if (selTool.charAt(0) === 'm') {
    var mt = parseInt(selTool.slice(1), 10);
    if (ownedMachines.indexOf(mt) < 0) { GF.sfx('error'); return; }
    if (c) { GF.sfx('error'); return; }
    grid[gy][gx] = { type: 'machine', mtier: mt, outTier: mt, dir: 0, busy: false, proc: 0, heldKind: null };
    GF.sfx('merge');
    GF.spawnParticles(gridX + gx * CELL + CELL / 2, gridY + gy * CELL + CELL / 2, TIER_COL[mt], 8);
    GF.saveRun();
    if (coachActive && coachStep === 3) advanceCoach();   // smelter placed
    return;
  }
}

var needBeltFlash = 0;
function flashNeedBelt() { needBeltFlash = 1; }

// ── SHOP ─────────────────────────────────────────────────────────────────────
function buildShopRows() {
  shopRows = [];
  // 1. belt slot expansion
  shopRows.push({ id: 'belt', cost: BELT_COST * (1 + Math.floor(beltSlots / 6)),
    label: GF.t('buy_belt'), sub: '+1 ' + GF.t('sel_belt').toLowerCase(), avail: true });
  // 2. belt speed
  var spdCost = 30 + beltSpeedLvl * 45;
  shopRows.push({ id: 'speed', cost: spdCost, label: GF.t('buy_speed'),
    sub: 'x' + (1 + (beltSpeedLvl + 1) * 0.25).toFixed(2), avail: beltSpeedLvl < 6,
    maxed: beltSpeedLvl >= 6 });
  // 3. machines for each unlocked tier not yet owned
  for (var mt = 0; mt <= tier; mt++) {
    if (ownedMachines.indexOf(mt) < 0) {
      var mc = Math.round(SELL_BASE[mt] * 6 + 20);
      shopRows.push({ id: 'machine_' + mt, cost: mc,
        label: GF.t('buy_machine') + ': ' + machName(mt), sub: machName(mt), avail: true });
    }
  }
  // 4. unlock next tier
  if (tier < MAX_TIER) {
    var tc = TIER_COST[tier + 1];
    shopRows.push({ id: 'tier', cost: tc, label: GF.t('buy_tier') + ': ' + matName(tier + 1),
      sub: matName(tier + 1) + ' + ' + machName(tier + 1),
      avail: coinsAllTime >= tc, gate: tc, gateKind: 'allTime' });
  }
  // 5. 2nd ore source
  if (sources.length < 2) {
    shopRows.push({ id: 'source', cost: 80, label: GF.t('buy_source'), sub: '+1 ' + GF.t('raw').toLowerCase(), avail: true });
  }
  // 6. expand grid
  if (gridH < GRID_H_MAX) {
    var gc = 60 + (gridH - GRID_H) * 40;
    shopRows.push({ id: 'grid', cost: gc, label: GF.t('buy_grid'), sub: '+1 row', avail: true });
  } else {
    shopRows.push({ id: 'grid', cost: 0, label: GF.t('buy_grid'), sub: GF.t('maxed'), avail: false, maxed: true });
  }
}

function buyShop(id) {
  buildShopRows();
  var row = null;
  for (var i = 0; i < shopRows.length; i++) if (shopRows[i].id === id) { row = shopRows[i]; break; }
  if (!row || row.maxed) { GF.sfx('error'); return; }
  if (id === 'tier') {
    // tier uses coinsAllTime as gate, costs coins
    if (coinsAllTime < TIER_COST[tier + 1] || coins < row.cost) { GF.sfx('error'); return; }
    coins -= row.cost;
    tier++;
    surge = 1 + tier * 0.18;
    GF.sfx('levelup');
    GF.setShake(0.4);
    GF.spawnParticles(GF.W / 2, GF.H / 2, TIER_COL[tier], 26);
    GF.spawnFloat(GF.W / 2, GF.H * 0.42, GF.t('tierUp'), TIER_COL[tier]);
    // give a starter machine of the new tier? no — must buy. but auto-own first smelter only.
    GF.saveRun();
    buildShopRows();
    return;
  }
  if (coins < row.cost) { GF.sfx('error'); return; }
  coins -= row.cost;
  GF.sfx('coin');
  if (id === 'belt') { beltSlots += 3; }
  else if (id === 'speed') { beltSpeedLvl++; speedMul = 1 + beltSpeedLvl * 0.25; }
  else if (id === 'source') {
    // place 2nd source top-right
    sources.push({ cx: gridW - 2, cy: 0, tier: Math.min(tier, 1) });
  }
  else if (id === 'grid') {
    gridH++;
    // grow grid arrays (append row at bottom, move dock down)
    var newRow = [];
    for (var x = 0; x < gridW; x++) newRow.push(null);
    // dock currently at old bottom; clear it, move dock to new bottom
    grid[dock.cy][dock.cx] = grid[dock.cy][dock.cx] && grid[dock.cy][dock.cx].type === 'belt' ? grid[dock.cy][dock.cx] : null;
    grid.push(newRow);
    dock.cy = gridH - 1; dock.cx = Math.floor(gridW / 2);
    layout();
  }
  else if (id.indexOf('machine_') === 0) {
    var mt = parseInt(id.split('_')[1], 10);
    if (ownedMachines.indexOf(mt) < 0) ownedMachines.push(mt);
    selTool = 'm' + mt;
    layout();   // toolbar grows with the new machine button
  }
  GF.spawnFloat(GF.W / 2, GF.H * 0.4, '-' + row.cost, '#ffd34d');
  GF.saveRun();
  buildShopRows();
}

// ── COACH (interactive, no-fail) ─────────────────────────────────────────────
// 5 steps over LIVE no-fail play (threats frozen until coach ends):
//   0 select belt · 1 place belt under source · 2 select smelter ·
//   3 place smelter below the belt · 4 done.
var COACH_BELT_CELL = null, COACH_SMELTER_CELL = null;
function startCoach() {
  coachActive = true; coachStep = 0; coachT = 0;
  selTool = 'belt';
  COACH_BELT_CELL = { gx: sources[0].cx, gy: sources[0].cy + 1 };
  COACH_SMELTER_CELL = { gx: sources[0].cx, gy: sources[0].cy + 2 };
  COACH_PLACE_CELL = COACH_BELT_CELL;
}
function advanceCoach() {
  coachStep++;
  coachT = 0;
  if (coachStep === 4) {
    // smelter placed — drop a couple belts below it toward the dock so the very
    // first ingot actually reaches the dock and sells (instant first-fun).
    autoFinishStarterLine();
  }
  if (coachStep >= 5) endCoach();
}
function autoFinishStarterLine() {
  var col = COACH_SMELTER_CELL.gx;
  for (var y = COACH_SMELTER_CELL.gy + 1; y < gridH; y++) {
    if (y === dock.cy && col === dock.cx) break;
    if (!grid[y][col] && !isReserved(col, y)) grid[y][col] = { type: 'belt', dir: 0 };
  }
  // if the dock isn't in this column, turn along the bottom row toward it
  var by = gridH - 1;
  if (col !== dock.cx) {
    var step = (col < dock.cx) ? 1 : -1;
    for (var x = col; x !== dock.cx; x += step) {
      if (inGrid(x, by) && !isReserved(x, by)) grid[by][x] = { type: 'belt', dir: (step > 0 ? 3 : 1) };
    }
  }
  GF.saveRun();
}
function endCoach() {
  coachActive = false;
  seenTut = true;
  try { localStorage.setItem('conveyor_tycoon_seen_tutorial', '1'); } catch (e) {}
  GF.saveRun();
}

// ── INPUT ────────────────────────────────────────────────────────────────────
function onPress(px, py) {
  if (gs === 'MENU') { /* overlay button handled by GF.drawOverlay */ return; }
  if (gs === 'GAMEOVER') { return; }

  // help panel open → tap closes
  if (helpOpen) { helpOpen = false; return; }

  // top-right buttons
  if (muteRect && hit(px, py, muteRect)) { GF.toggleMute(); GF.setMusicMuted(GF.muted); GF.saveRun(); return; }
  if (helpRect && hit(px, py, helpRect)) { helpOpen = true; return; }
  if (menuRect && hit(px, py, menuRect)) { gs = 'MENU'; shopOpen = false; GF.saveRun(); return; }

  // shop drawer
  if (shopOpen) {
    // close button
    if (shopBtnRect && hit(px, py, shopBtnRect)) { shopOpen = false; return; }
    handleShopTap(px, py);
    return;
  }

  // toolbar — during the coach only the currently-coached tool button responds
  if (shopBtnRect && hit(px, py, shopBtnRect)) {
    if (coachActive) return;   // shop locked until coach finishes
    shopOpen = true; buildShopRows();
    if (shopScroll) shopScroll.offset = 0;
    return;
  }
  for (var i = 0; i < toolButtons.length; i++) {
    var b = toolButtons[i];
    if (hit(px, py, b)) {
      if (coachActive && coachStep === 0 && b.id !== 'belt') { GF.sfx('error'); return; }
      if (coachActive && coachStep === 2 && b.id !== 'm0') { GF.sfx('error'); return; }
      selTool = b.id;
      GF.sfx('tap');
      if (coachActive && coachStep === 0 && b.id === 'belt') advanceCoach();
      if (coachActive && coachStep === 2 && b.id === 'm0') advanceCoach();
      return;
    }
  }

  // grid tap
  if (px >= gridX && px < gridX + gridW * CELL && py >= gridY && py < gridY + gridH * CELL) {
    var gx = Math.floor((px - gridX) / CELL);
    var gy = Math.floor((py - gridY) / CELL);
    // during coach restrict placement to the highlighted target cell
    if (coachActive && coachStep === 1) {
      if (gx === COACH_BELT_CELL.gx && gy === COACH_BELT_CELL.gy) placeAt(gx, gy);
      else GF.sfx('error');
      return;
    }
    if (coachActive && coachStep === 3) {
      if (gx === COACH_SMELTER_CELL.gx && gy === COACH_SMELTER_CELL.gy) placeAt(gx, gy);
      else GF.sfx('error');
      return;
    }
    if (coachActive) { GF.sfx('error'); return; } // steps 0/2/4 ignore grid
    placeAt(gx, gy);
    return;
  }
}

function handleShopTap(px, py) {
  if (!shopScroll) return;
  if (!shopScroll.contains || !shopScroll.contains(px, py)) {
    // tapping outside list but inside drawer header area: ignore
    return;
  }
  var cy = shopScroll.screenToContentY(py);
  var rowH = 64 * GF.S;
  var idx = Math.floor(cy / rowH);
  if (idx >= 0 && idx < shopRows.length) {
    buyShop(shopRows[idx].id);
  }
}

function hit(px, py, r) { return r && px >= r.x && px <= r.x + r.w && py >= r.y && py <= r.y + r.h; }

// ── UPDATE ───────────────────────────────────────────────────────────────────
function update(dt) {
  if (needBeltFlash > 0) needBeltFlash = Math.max(0, needBeltFlash - dt * 2);
  if (gs !== 'PLAYING') return;
  if (helpOpen) return;

  coachT += dt;

  // smooth coin display
  floatCoins += (coins - floatCoins) * Math.min(1, dt * 8);

  // Coach pacing: hold ore until the smelter is placed (step >= 4) so the player
  // builds the line first; hold contract scheduling until the coach ends. Life
  // loss is suppressed for the whole coach in loseLife() (no-fail tutorial).
  var holdOre = coachActive && coachStep < 4;
  var holdContracts = coachActive;

  if (!holdOre) {
    oreTimer += dt;
    var spawnEvery = ORE_SPAWN_SEC / surge;
    if (oreTimer >= spawnEvery) { oreTimer -= spawnEvery; spawnOre(); }
  }

  updateMachines(dt);
  updateItems(dt);

  if (!holdContracts) {
    contractTimer += dt;
    if (nextContractDelay > 0) {
      nextContractDelay -= dt;
      if (nextContractDelay <= 0 && contracts.length < maxContracts()) addContract();
    } else if (contracts.length < maxContracts() && contractTimer > contractInterval()) {
      contractTimer = 0;
      addContract();
    }
  }

  // shop scroll inertia
  if (shopOpen && shopScroll) shopScroll.update(dt);

  // tier auto-availability already handled in shop
}

var _lastBacklog = 0;
function tickPatience() {
  // called when backlog increases; reduce contracts' patience
  for (var i = contracts.length - 1; i >= 0; i--) {
    contracts[i].patience -= 1;
    if (contracts[i].patience <= 0) {
      contracts.splice(i, 1);
      GF.spawnFloat(GF.W / 2, hudH + 30 * GF.S, GF.t('contractFail'), '#ff6b6b');
      loseLife('contractFail');
      nextContractDelay = 0.8;
    }
  }
}

function maxContracts() { return Math.min(3, 1 + Math.floor(tier / 1.5) + 1); }
function contractInterval() { return Math.max(6, 16 - tier * 2); }

// ── DRAW ─────────────────────────────────────────────────────────────────────
function layout() {
  var W = GF.W, H = GF.H, S = GF.S;
  hudH = Math.round(96 * S);
  var toolbarH = Math.round(74 * S);
  toolbarY = H - toolbarH;
  var availH = toolbarY - hudH - 8 * S;
  var availW = W - 12 * S;
  CELL = Math.floor(Math.min(availW / gridW, availH / gridH));
  CELL = Math.max(24, CELL);
  gridX = Math.round((W - gridW * CELL) / 2);
  gridY = Math.round(hudH + (availH - gridH * CELL) / 2);

  // toolbar buttons
  toolButtons = [];
  var btns = [];
  btns.push({ id: 'belt', label: GF.t('sel_belt') });
  for (var mi = 0; mi < ownedMachines.length; mi++) {
    var mt = ownedMachines[mi];
    btns.push({ id: 'm' + mt, label: machName(mt) });
  }
  btns.push({ id: 'erase', label: GF.t('sel_erase') });
  // shop button reserved at far right
  var shopW = Math.round(78 * S);
  var pad = 6 * S;
  var areaW = W - shopW - pad * 3;
  var bw = Math.min(Math.round(86 * S), (areaW - (btns.length - 1) * pad) / btns.length);
  var bx = pad;
  var by = toolbarY + Math.round(8 * S);
  var bh = toolbarH - Math.round(16 * S);
  for (var i = 0; i < btns.length; i++) {
    toolButtons.push({ id: btns[i].id, label: btns[i].label, x: bx, y: by, w: bw, h: bh });
    bx += bw + pad;
  }
  shopBtnRect = { x: W - shopW - pad, y: by, w: shopW, h: bh };

  // top-right control buttons
  var r = Math.round(15 * S);
  muteRect = { x: W - (r * 2 + 8 * S), y: 8 * S, w: r * 2, h: r * 2 };
  helpRect = { x: W - (r * 4 + 18 * S), y: 8 * S, w: r * 2, h: r * 2 };
  menuRect = { x: W - (r * 6 + 28 * S), y: 8 * S, w: r * 2, h: r * 2 };

  // shop scroll region
  if (!shopScroll) shopScroll = GF.makeScroll('shop', { x: 0, y: 0, w: 10, h: 10 });
}

function draw(ctx) {
  var W = GF.W, H = GF.H, S = GF.S;
  // background
  ctx.fillStyle = '#1a160f';
  ctx.fillRect(0, 0, W, H);

  if (gs === 'MENU') { drawMenu(ctx); return; }

  // playfield
  drawGridFloor(ctx);
  drawBelts(ctx);
  drawSourcesDock(ctx);
  drawItems(ctx);
  drawHUD(ctx);
  drawToolbar(ctx);

  if (shopOpen) drawShop(ctx);
  if (coachActive) drawCoach(ctx);
  if (helpOpen) drawHelp(ctx);

  if (gs === 'GAMEOVER') {
    GF.drawOverlay({
      title: GF.t('gameover'),
      sub: GF.t('best') + ': ' + bestCoins + '  ·  ' + GF.t('tier') + ' ' + (bestTier + 1),
      btnText: GF.t('retry'), btnFn: startGame,
      bestText: GF.t('coins') + ': ' + coinsAllTime,
    });
  }
}

function drawGridFloor(ctx) {
  var S = GF.S;
  // floor panel
  ctx.fillStyle = '#241f17';
  rr(ctx, gridX - 4 * S, gridY - 4 * S, gridW * CELL + 8 * S, gridH * CELL + 8 * S, 8 * S);
  ctx.fill();
  // cells
  for (var y = 0; y < gridH; y++) {
    for (var x = 0; x < gridW; x++) {
      var cxp = gridX + x * CELL, cyp = gridY + y * CELL;
      ctx.fillStyle = ((x + y) % 2 === 0) ? '#2b251b' : '#2f291e';
      ctx.fillRect(cxp + 1, cyp + 1, CELL - 2, CELL - 2);
      var c = grid[y][x];
      if (c && c.type === 'machine') drawMachine(ctx, x, y, c);
    }
  }
}

function rr(ctx, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function drawBelts(ctx) {
  var S = GF.S;
  for (var y = 0; y < gridH; y++) {
    for (var x = 0; x < gridW; x++) {
      var c = grid[y][x];
      if (!c || c.type !== 'belt') continue;
      var cxp = gridX + x * CELL + CELL / 2, cyp = gridY + y * CELL + CELL / 2;
      ctx.save();
      ctx.translate(cxp, cyp);
      ctx.rotate(c.dir * Math.PI / 2); // 0=down
      // belt body
      ctx.fillStyle = '#3a3a44';
      rr(ctx, -CELL * 0.42, -CELL * 0.42, CELL * 0.84, CELL * 0.84, 5 * S);
      ctx.fill();
      // moving chevrons (animated)
      var t = (typeof performance !== 'undefined' ? performance.now() : Date.now()) / 1000;
      var off = ((t * BELT_SPEED * speedMul) % 1);
      ctx.strokeStyle = '#7b8190';
      ctx.lineWidth = 3 * S;
      ctx.lineCap = 'round';
      for (var k = -1; k <= 1; k++) {
        var yy = (-CELL * 0.3) + ((k + off) * CELL * 0.3);
        if (yy > CELL * 0.42 || yy < -CELL * 0.42) continue;
        ctx.beginPath();
        ctx.moveTo(-CELL * 0.16, yy - CELL * 0.06);
        ctx.lineTo(0, yy + CELL * 0.06);
        ctx.lineTo(CELL * 0.16, yy - CELL * 0.06);
        ctx.stroke();
      }
      ctx.restore();
    }
  }
}

function drawMachine(ctx, x, y, c) {
  var S = GF.S;
  var cxp = gridX + x * CELL, cyp = gridY + y * CELL;
  var mid = CELL / 2;
  var col = TIER_COL[c.mtier], dk = TIER_COL_DK[c.mtier];
  // try sprite for smelter (tier0), else vector
  var drewSprite = false;
  if (c.mtier === 0 && GF.sprites && GF.sprites['smelter']) {
    GF.drawSprite('smelter', cxp + mid, cyp + mid, CELL * 0.94, null);
    drewSprite = !!(GF.sprites['smelter']);
  }
  if (!drewSprite) {
    ctx.fillStyle = dk;
    rr(ctx, cxp + 3 * S, cyp + 3 * S, CELL - 6 * S, CELL - 6 * S, 6 * S);
    ctx.fill();
    ctx.fillStyle = col;
    rr(ctx, cxp + 6 * S, cyp + 6 * S, CELL - 12 * S, CELL * 0.5, 4 * S);
    ctx.fill();
    // body slot
    ctx.fillStyle = '#1a160f';
    rr(ctx, cxp + 9 * S, cyp + CELL * 0.55, CELL - 18 * S, CELL * 0.32, 3 * S);
    ctx.fill();
    // machine glyph: gear-ish
    ctx.fillStyle = c.busy ? '#fff' : col;
    ctx.beginPath();
    ctx.arc(cxp + mid, cyp + CELL * 0.7, CELL * 0.1, 0, Math.PI * 2);
    ctx.fill();
  }
  // processing glow
  if (c.busy) {
    var p = c.proc / MACHINE_TIME;
    ctx.strokeStyle = col;
    ctx.lineWidth = 3 * S;
    ctx.beginPath();
    ctx.arc(cxp + mid, cyp + mid, CELL * 0.4, -Math.PI / 2, -Math.PI / 2 + p * Math.PI * 2);
    ctx.stroke();
  }
  // output direction arrow
  drawDirArrow(ctx, cxp + mid, cyp + mid, c.dir, '#ffffff', CELL * 0.16);
}

function drawDirArrow(ctx, x, y, dir, col, sz) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(dir * Math.PI / 2);
  ctx.fillStyle = col;
  ctx.globalAlpha = 0.85;
  ctx.beginPath();
  ctx.moveTo(0, sz);
  ctx.lineTo(-sz * 0.7, sz * 0.2);
  ctx.lineTo(sz * 0.7, sz * 0.2);
  ctx.closePath();
  ctx.fill();
  ctx.globalAlpha = 1;
  ctx.restore();
}

function drawSourcesDock(ctx) {
  var S = GF.S;
  // sources
  for (var s = 0; s < sources.length; s++) {
    var src = sources[s];
    var cxp = gridX + src.cx * CELL, cyp = gridY + src.cy * CELL;
    var mid = CELL / 2;
    ctx.fillStyle = '#3b2f1a';
    rr(ctx, cxp + 2 * S, cyp + 2 * S, CELL - 4 * S, CELL - 4 * S, 6 * S);
    ctx.fill();
    // ore mound
    var oc = TIER_COL[src.tier];
    ctx.fillStyle = oc;
    ctx.beginPath();
    ctx.moveTo(cxp + mid, cyp + CELL * 0.25);
    ctx.lineTo(cxp + CELL * 0.78, cyp + CELL * 0.7);
    ctx.lineTo(cxp + CELL * 0.22, cyp + CELL * 0.7);
    ctx.closePath();
    ctx.fill();
    // glint
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.beginPath();
    ctx.arc(cxp + mid - CELL * 0.08, cyp + CELL * 0.45, CELL * 0.06, 0, Math.PI * 2);
    ctx.fill();
    // down arrow (output)
    drawDirArrow(ctx, cxp + mid, cyp + CELL * 0.82, 0, '#ffd34d', CELL * 0.12);
  }

  // dock
  var dxp = gridX + dock.cx * CELL, dyp = gridY + dock.cy * CELL;
  var dmid = CELL / 2;
  var drew = false;
  if (GF.sprites && GF.sprites['dock']) {
    GF.drawSprite('dock', dxp + dmid, dyp + dmid, CELL * 0.96, null);
    drew = !!GF.sprites['dock'];
  }
  if (!drew) {
    ctx.fillStyle = '#2a2114';
    rr(ctx, dxp + 2 * GF.S, dyp + 2 * GF.S, CELL - 4 * GF.S, CELL - 4 * GF.S, 6 * GF.S);
    ctx.fill();
    // coin pile
    drawCoinIcon(ctx, dxp + dmid, dyp + dmid + CELL * 0.06, CELL * 0.2);
    drawCoinIcon(ctx, dxp + dmid - CELL * 0.16, dyp + dmid + CELL * 0.16, CELL * 0.15);
    drawCoinIcon(ctx, dxp + dmid + CELL * 0.16, dyp + dmid + CELL * 0.16, CELL * 0.15);
  }
  // backlog meter beside dock
  var bw = CELL * 0.7, bh = 6 * GF.S;
  var bx = dxp + (CELL - bw) / 2, by = dyp - bh - 3 * GF.S;
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  rr(ctx, bx, by, bw, bh, bh / 2); ctx.fill();
  var frac = Math.min(1, backlog / BACKLOG_MAX);
  ctx.fillStyle = frac > 0.7 ? '#ff5b5b' : (frac > 0.4 ? '#ffb13b' : '#5bd06a');
  rr(ctx, bx, by, bw * frac, bh, bh / 2); ctx.fill();
}

function drawCoinIcon(ctx, x, y, r) {
  ctx.save();
  ctx.fillStyle = '#ffd34d';
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#e0a92a';
  ctx.beginPath(); ctx.arc(x, y, r * 0.62, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

function drawItems(ctx) {
  var S = GF.S;
  for (var i = 0; i < items.length; i++) {
    var it = items[i];
    var pos = itemScreenPos(it);
    var r = CELL * 0.24;
    var col = TIER_COL[it.tier];
    if (it.kind === 'raw') {
      // glowing ore chunk
      if (GF.sprites && GF.sprites['ore_chunk']) {
        GF.drawSprite('ore_chunk', pos.x, pos.y, CELL * 0.52, function (c, x, y, sz) { oreFallback(c, x, y, sz, col); });
      } else { oreFallback(ctx, pos.x, pos.y, CELL * 0.52, col); }
    } else {
      // finished good = ingot/plate/gear shape
      if (GF.sprites && GF.sprites['ingot'] && it.tier === 0) {
        GF.drawSprite('ingot', pos.x, pos.y, CELL * 0.52, function (c, x, y, sz) { goodFallback(c, x, y, sz, col, it.tier); });
      } else { goodFallback(ctx, pos.x, pos.y, CELL * 0.52, col, it.tier); }
    }
  }
}

function oreFallback(ctx, x, y, sz, col) {
  ctx.save();
  ctx.shadowColor = col; ctx.shadowBlur = 8;
  ctx.fillStyle = col;
  ctx.beginPath();
  var r = sz * 0.42;
  ctx.moveTo(x - r, y);
  ctx.lineTo(x - r * 0.4, y - r);
  ctx.lineTo(x + r * 0.6, y - r * 0.7);
  ctx.lineTo(x + r, y + r * 0.3);
  ctx.lineTo(x, y + r);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

function goodFallback(ctx, x, y, sz, col, t) {
  ctx.save();
  ctx.shadowColor = col; ctx.shadowBlur = 7;
  ctx.fillStyle = col;
  var r = sz * 0.4;
  if (t === 0) { // ingot bar
    rr(ctx, x - r, y - r * 0.55, r * 2, r * 1.1, r * 0.2); ctx.fill();
  } else if (t === 1) { // plate
    rr(ctx, x - r, y - r * 0.7, r * 2, r * 1.4, r * 0.15); ctx.fill();
  } else if (t === 2) { // gear
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#1a160f'; ctx.beginPath(); ctx.arc(x, y, r * 0.35, 0, Math.PI * 2); ctx.fill();
  } else if (t === 3) { // lens (diamond)
    ctx.beginPath(); ctx.moveTo(x, y - r); ctx.lineTo(x + r, y); ctx.lineTo(x, y + r); ctx.lineTo(x - r, y); ctx.closePath(); ctx.fill();
  } else { // cell (hex)
    ctx.beginPath();
    for (var a = 0; a < 6; a++) { var ang = Math.PI / 3 * a - Math.PI / 6; var px = x + Math.cos(ang) * r, py = y + Math.sin(ang) * r; if (a === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py); }
    ctx.closePath(); ctx.fill();
  }
  ctx.fillStyle = 'rgba(255,255,255,0.55)';
  ctx.beginPath(); ctx.arc(x - r * 0.3, y - r * 0.3, r * 0.18, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

function itemScreenPos(it) {
  // position along the cell based on dir + prog
  var baseX = gridX + it.gx * CELL + CELL / 2;
  var baseY = gridY + it.gy * CELL + CELL / 2;
  var d = it.dir;
  // item enters from the opposite side and moves toward dir; prog 0..1
  var ex = DX[d], ey = DY[d];
  var px = baseX + ex * (it.prog - 0.5) * CELL;
  var py = baseY + ey * (it.prog - 0.5) * CELL;
  return { x: px, y: py };
}

// ── HUD ──────────────────────────────────────────────────────────────────────
function drawHUD(ctx) {
  var W = GF.W, S = GF.S;
  // top bar bg
  ctx.fillStyle = '#120f0a';
  ctx.fillRect(0, 0, W, hudH);
  ctx.fillStyle = 'rgba(255,255,255,0.06)';
  ctx.fillRect(0, hudH - 2 * S, W, 2 * S);

  var fs = GF.clamp(20 * S, 15, 26) | 0;
  // coins left
  drawCoinIcon(ctx, 16 * S, 20 * S, 9 * S);
  ctx.fillStyle = '#ffe08a';
  ctx.font = 'bold ' + fs + 'px sans-serif';
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.fillText(String(Math.round(floatCoins)), 30 * S, 20 * S + 1);

  // tier centre
  ctx.textAlign = 'center';
  ctx.fillStyle = TIER_COL[tier];
  ctx.font = 'bold ' + (fs - 2) + 'px sans-serif';
  ctx.fillText(GF.t('tier') + ' ' + (tier + 1) + ' · ' + matName(tier), W / 2, 18 * S);

  // lives = hearts under tier (centre)
  var hx = W / 2 - (START_LIVES - 1) * 11 * S;
  for (var i = 0; i < START_LIVES; i++) {
    drawHeart(ctx, hx + i * 22 * S, 40 * S, 7 * S, i < lives);
  }

  // contract card(s)
  drawContracts(ctx);

  // next tier banner
  if (tier < MAX_TIER) {
    var need = TIER_COST[tier + 1] - coinsAllTime;
    ctx.textAlign = 'left'; ctx.fillStyle = '#9a9088';
    ctx.font = (GF.clamp(12 * S, 10, 15) | 0) + 'px sans-serif';
    var txt = GF.t('next') + ': ' + matName(tier + 1) + (need > 0 ? ' — ' + need : ' ✓');
    ctx.fillText(txt, 16 * S, hudH - 10 * S);
  }

  // top-right buttons
  drawTopButtons(ctx);
}

function drawContracts(ctx) {
  var W = GF.W, S = GF.S;
  var n = contracts.length;
  if (n === 0) return;
  var cardW = Math.min(120 * S, (W - 32 * S) / Math.max(1, n) - 6 * S);
  var totalW = n * cardW + (n - 1) * 6 * S;
  var x0 = W / 2 - totalW / 2;
  var cardY = 54 * S;
  var cardH = 34 * S;
  for (var i = 0; i < n; i++) {
    var c = contracts[i];
    var x = x0 + i * (cardW + 6 * S);
    var pfrac = c.patience / c.pmax;
    // card bg
    ctx.fillStyle = pfrac < 0.34 ? '#3a1c1c' : '#221d15';
    rr(ctx, x, cardY, cardW, cardH, 6 * S); ctx.fill();
    ctx.strokeStyle = TIER_COL[c.goodTier]; ctx.lineWidth = 1.5 * S;
    rr(ctx, x, cardY, cardW, cardH, 6 * S); ctx.stroke();
    // good icon
    goodFallback(ctx, x + 14 * S, cardY + cardH / 2, CELL > 0 ? 18 * S : 18 * S, TIER_COL[c.goodTier], c.goodTier);
    // count
    ctx.fillStyle = '#fff'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    ctx.font = 'bold ' + (GF.clamp(13 * S, 11, 16) | 0) + 'px sans-serif';
    ctx.fillText(c.have + '/' + c.need, x + 26 * S, cardY + 11 * S);
    // fill bar
    var bw = cardW - 30 * S, bh = 4 * S, bx = x + 26 * S, by = cardY + 20 * S;
    ctx.fillStyle = 'rgba(0,0,0,0.5)'; rr(ctx, bx, by, bw, bh, bh / 2); ctx.fill();
    ctx.fillStyle = TIER_COL[c.goodTier]; rr(ctx, bx, by, bw * (c.have / c.need), bh, bh / 2); ctx.fill();
    // patience pips
    ctx.fillStyle = pfrac < 0.34 ? '#ff5b5b' : '#7a8a7a';
    var pipW = (cardW - 30 * S);
    ctx.fillRect(bx, cardY + 27 * S, pipW * pfrac, 2.5 * S);
  }
}

function drawHeart(ctx, x, y, r, filled) {
  ctx.save();
  ctx.fillStyle = filled ? '#ff5b6e' : 'rgba(255,255,255,0.18)';
  ctx.beginPath();
  ctx.moveTo(x, y + r * 0.5);
  ctx.bezierCurveTo(x - r, y - r * 0.6, x - r * 1.3, y + r * 0.4, x, y + r * 1.2);
  ctx.bezierCurveTo(x + r * 1.3, y + r * 0.4, x + r, y - r * 0.6, x, y + r * 0.5);
  ctx.closePath(); ctx.fill();
  ctx.restore();
}

function drawTopButtons(ctx) {
  var S = GF.S;
  // menu
  if (menuRect) {
    drawPill(ctx, menuRect);
    ctx.strokeStyle = '#cfc7bd'; ctx.lineWidth = 2 * S; ctx.lineCap = 'round';
    var c = centerOf(menuRect);
    for (var i = -1; i <= 1; i++) { ctx.beginPath(); ctx.moveTo(c.x - 6 * S, c.y + i * 4 * S); ctx.lineTo(c.x + 6 * S, c.y + i * 4 * S); ctx.stroke(); }
  }
  // help
  if (helpRect) {
    drawPill(ctx, helpRect);
    var hc = centerOf(helpRect);
    ctx.fillStyle = '#cfc7bd'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = 'bold ' + (15 * S | 0) + 'px sans-serif';
    ctx.fillText('?', hc.x, hc.y + 1);
  }
  // mute
  if (muteRect) {
    drawPill(ctx, muteRect);
    var mc = centerOf(muteRect);
    GF.drawMuteIcon(ctx, mc.x, mc.y, 8 * S, GF.muted);
  }
}

function drawPill(ctx, r) {
  ctx.fillStyle = 'rgba(255,255,255,0.08)';
  ctx.beginPath(); ctx.arc(r.x + r.w / 2, r.y + r.h / 2, r.w / 2, 0, Math.PI * 2); ctx.fill();
}
function centerOf(r) { return { x: r.x + r.w / 2, y: r.y + r.h / 2 }; }

// ── TOOLBAR ──────────────────────────────────────────────────────────────────
function drawToolbar(ctx) {
  var W = GF.W, S = GF.S;
  ctx.fillStyle = '#120f0a';
  ctx.fillRect(0, toolbarY, W, GF.H - toolbarY);
  ctx.fillStyle = 'rgba(255,255,255,0.06)';
  ctx.fillRect(0, toolbarY, W, 2 * S);

  for (var i = 0; i < toolButtons.length; i++) {
    var b = toolButtons[i];
    var sel = (selTool === b.id);
    ctx.fillStyle = sel ? '#3a6b8a' : '#2a2419';
    rr(ctx, b.x, b.y, b.w, b.h, 8 * S); ctx.fill();
    if (sel) { ctx.strokeStyle = '#7fd0ff'; ctx.lineWidth = 2 * S; rr(ctx, b.x, b.y, b.w, b.h, 8 * S); ctx.stroke(); }
    // icon
    var icx = b.x + b.w / 2, icy = b.y + b.h * 0.38;
    if (b.id === 'belt') drawBeltIcon(ctx, icx, icy, b.h * 0.22, sel);
    else if (b.id === 'erase') drawEraseIcon(ctx, icx, icy, b.h * 0.2);
    else if (b.id.charAt(0) === 'm') {
      var mt = parseInt(b.id.slice(1), 10);
      ctx.fillStyle = TIER_COL[mt]; rr(ctx, icx - b.h * 0.18, icy - b.h * 0.16, b.h * 0.36, b.h * 0.32, 3 * S); ctx.fill();
    }
    // label
    ctx.fillStyle = sel ? '#fff' : '#b3a89a';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    var lfs = GF.clamp(11 * S, 9, 13) | 0;
    ctx.font = (sel ? 'bold ' : '') + lfs + 'px sans-serif';
    var lab = b.label;
    while (ctx.measureText(lab).width > b.w - 6 * S && lab.length > 3) lab = lab.slice(0, -1);
    ctx.fillText(lab, icx, b.y + b.h * 0.78);
  }

  // belt count badge on belt button
  var beltBtn = toolButtons[0];
  if (beltBtn) {
    var used = countBelts();
    ctx.fillStyle = used >= beltSlots ? '#ff6b6b' : '#9a9088';
    ctx.font = (GF.clamp(9 * S, 8, 11) | 0) + 'px sans-serif';
    ctx.textAlign = 'right'; ctx.textBaseline = 'top';
    ctx.fillText(used + '/' + beltSlots, beltBtn.x + beltBtn.w - 3 * S, beltBtn.y + 2 * S);
  }

  // shop button
  if (shopBtnRect) {
    var sb = shopBtnRect;
    var glow = (tier < MAX_TIER && coinsAllTime >= TIER_COST[tier + 1]) || canAffordAnyMachine();
    ctx.fillStyle = glow ? '#caa23a' : '#3a3320';
    rr(ctx, sb.x, sb.y, sb.w, sb.h, 8 * S); ctx.fill();
    if (glow) {
      var pulse = 0.5 + 0.5 * Math.sin((typeof performance !== 'undefined' ? performance.now() : Date.now()) / 250);
      ctx.strokeStyle = 'rgba(255,225,120,' + (0.4 + pulse * 0.5) + ')'; ctx.lineWidth = 2.5 * S;
      rr(ctx, sb.x, sb.y, sb.w, sb.h, 8 * S); ctx.stroke();
    }
    drawCoinIcon(ctx, sb.x + sb.w / 2, sb.y + sb.h * 0.36, sb.h * 0.16);
    ctx.fillStyle = glow ? '#1a160f' : '#e8dcc2';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = 'bold ' + (GF.clamp(12 * S, 10, 14) | 0) + 'px sans-serif';
    ctx.fillText(GF.t('shop'), sb.x + sb.w / 2, sb.y + sb.h * 0.74);
  }
}

function canAffordAnyMachine() {
  for (var mt = 0; mt <= tier; mt++) {
    if (ownedMachines.indexOf(mt) < 0) {
      var mc = Math.round(SELL_BASE[mt] * 6 + 20);
      if (coins >= mc) return true;
    }
  }
  return false;
}

function drawBeltIcon(ctx, x, y, r, sel) {
  ctx.fillStyle = '#3a3a44';
  rr(ctx, x - r * 1.4, y - r, r * 2.8, r * 2, r * 0.4); ctx.fill();
  ctx.strokeStyle = sel ? '#7fd0ff' : '#7b8190'; ctx.lineWidth = 2; ctx.lineCap = 'round';
  for (var i = -1; i <= 1; i++) {
    ctx.beginPath();
    ctx.moveTo(x + i * r * 0.7 - r * 0.25, y - r * 0.4);
    ctx.lineTo(x + i * r * 0.7, y);
    ctx.lineTo(x + i * r * 0.7 - r * 0.25, y + r * 0.4);
    ctx.stroke();
  }
}

function drawEraseIcon(ctx, x, y, r) {
  ctx.save();
  ctx.translate(x, y); ctx.rotate(-0.4);
  ctx.fillStyle = '#d98b8b';
  rr(ctx, -r, -r * 0.6, r * 2, r * 1.2, r * 0.25); ctx.fill();
  ctx.fillStyle = '#f0d0d0';
  rr(ctx, -r, -r * 0.6, r * 0.7, r * 1.2, r * 0.2); ctx.fill();
  ctx.restore();
}

// ── SHOP DRAWER ──────────────────────────────────────────────────────────────
function drawShop(ctx) {
  var W = GF.W, H = GF.H, S = GF.S;
  // scrim
  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  ctx.fillRect(0, 0, W, H);
  // drawer panel (covers grid area, leaves toolbar)
  var dwY = hudH;
  var dwH = toolbarY - hudH;
  ctx.fillStyle = '#1f1a12';
  ctx.fillRect(0, dwY, W, dwH);

  // header
  var hh = 40 * S;
  ctx.fillStyle = '#2a2417';
  ctx.fillRect(0, dwY, W, hh);
  ctx.fillStyle = '#ffe08a';
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.font = 'bold ' + (18 * S | 0) + 'px sans-serif';
  ctx.fillText(GF.t('shop'), 16 * S, dwY + hh / 2);
  // coins in header
  drawCoinIcon(ctx, W - 90 * S, dwY + hh / 2, 9 * S);
  ctx.fillText(String(coins), W - 78 * S, dwY + hh / 2);
  // close X uses shopBtnRect area? Provide explicit close button in header right
  // (we reuse a tap on shop toolbar btn or the X here)
  ctx.fillStyle = '#cfc7bd';
  ctx.textAlign = 'right';
  ctx.font = 'bold ' + (16 * S | 0) + 'px sans-serif';
  ctx.fillText('✕', W - 16 * S, dwY + hh / 2);
  // make the X tap target = small rect; store on shopBtnRect override? keep shop btn close.

  // scroll list
  var listY = dwY + hh;
  var listH = dwH - hh;
  shopScroll.setViewport({ x: 0, y: listY, w: W, h: listH });
  var rowH = 64 * S;
  shopScroll.setContentHeight(shopRows.length * rowH);
  shopScroll.begin(ctx);
  for (var i = 0; i < shopRows.length; i++) {
    var row = shopRows[i];
    var ry = i * rowH;
    var canBuy = row.avail && !row.maxed && coins >= row.cost && (row.id !== 'tier' || coinsAllTime >= row.gate);
    // row bg
    ctx.fillStyle = (i % 2 === 0) ? '#241f17' : '#221d15';
    ctx.fillRect(4 * S, ry + 4 * S, W - 8 * S, rowH - 8 * S);
    if (canBuy) { ctx.strokeStyle = '#caa23a'; ctx.lineWidth = 1.5 * S; ctx.strokeRect(4 * S, ry + 4 * S, W - 8 * S, rowH - 8 * S); }
    // icon
    drawShopIcon(ctx, row, 30 * S, ry + rowH / 2);
    // label
    ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = '#f2e9d8'; ctx.font = 'bold ' + (15 * S | 0) + 'px sans-serif';
    ctx.fillText(row.label, 56 * S, ry + rowH / 2 - 2 * S);
    ctx.fillStyle = '#9a9088'; ctx.font = (12 * S | 0) + 'px sans-serif';
    ctx.fillText(row.sub, 56 * S, ry + rowH / 2 + 15 * S);
    // price button
    var pbw = 76 * S, pbh = 34 * S, pbx = W - pbw - 12 * S, pby = ry + (rowH - pbh) / 2;
    if (row.maxed) {
      ctx.fillStyle = '#33301f'; rr(ctx, pbx, pby, pbw, pbh, 6 * S); ctx.fill();
      ctx.fillStyle = '#7a7468'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.font = 'bold ' + (13 * S | 0) + 'px sans-serif';
      ctx.fillText(GF.t('maxed'), pbx + pbw / 2, pby + pbh / 2);
    } else if (row.id === 'tier' && coinsAllTime < row.gate) {
      ctx.fillStyle = '#2c2718'; rr(ctx, pbx, pby, pbw, pbh, 6 * S); ctx.fill();
      ctx.fillStyle = '#9a9088'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.font = (11 * S | 0) + 'px sans-serif';
      ctx.fillText(GF.t('need') + ' ' + row.gate, pbx + pbw / 2, pby + pbh / 2);
    } else {
      ctx.fillStyle = canBuy ? '#caa23a' : '#3a3320';
      rr(ctx, pbx, pby, pbw, pbh, 6 * S); ctx.fill();
      drawCoinIcon(ctx, pbx + 16 * S, pby + pbh / 2, 8 * S);
      ctx.fillStyle = canBuy ? '#1a160f' : '#7a7468';
      ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
      ctx.font = 'bold ' + (14 * S | 0) + 'px sans-serif';
      ctx.fillText(String(row.cost), pbx + 28 * S, pby + pbh / 2 + 1);
    }
  }
  shopScroll.end(ctx);
  // tap hint
  ctx.fillStyle = '#6a6458'; ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
  ctx.font = (11 * S | 0) + 'px sans-serif';
}

function drawShopIcon(ctx, row, x, y) {
  var S = GF.S;
  if (row.id === 'belt') drawBeltIcon(ctx, x, y, 9 * S, false);
  else if (row.id === 'speed') { ctx.fillStyle = '#7fd0ff'; ctx.beginPath(); ctx.moveTo(x - 7 * S, y + 7 * S); ctx.lineTo(x + 2 * S, y - 7 * S); ctx.lineTo(x, y); ctx.lineTo(x + 7 * S, y - 2 * S); ctx.lineTo(x - 2 * S, y + 7 * S); ctx.closePath(); ctx.fill(); }
  else if (row.id === 'source') { ctx.fillStyle = TIER_COL[Math.min(tier, 1)]; ctx.beginPath(); ctx.moveTo(x, y - 8 * S); ctx.lineTo(x + 8 * S, y + 6 * S); ctx.lineTo(x - 8 * S, y + 6 * S); ctx.closePath(); ctx.fill(); }
  else if (row.id === 'grid') { ctx.strokeStyle = '#9ad0a0'; ctx.lineWidth = 1.5 * S; ctx.strokeRect(x - 8 * S, y - 8 * S, 16 * S, 16 * S); ctx.beginPath(); ctx.moveTo(x, y - 8 * S); ctx.lineTo(x, y + 8 * S); ctx.moveTo(x - 8 * S, y); ctx.lineTo(x + 8 * S, y); ctx.stroke(); }
  else if (row.id === 'tier') { drawCoinIcon(ctx, x, y, 9 * S); ctx.fillStyle = TIER_COL[Math.min(MAX_TIER, tier + 1)]; ctx.beginPath(); ctx.arc(x, y, 4 * S, 0, Math.PI * 2); ctx.fill(); }
  else if (row.id.indexOf('machine_') === 0) { var mt = parseInt(row.id.split('_')[1], 10); ctx.fillStyle = TIER_COL[mt]; rr(ctx, x - 9 * S, y - 8 * S, 18 * S, 16 * S, 3 * S); ctx.fill(); }
}

// ── COACH OVERLAY ─────────────────────────────────────────────────────────────
function drawCoach(ctx) {
  var W = GF.W, H = GF.H, S = GF.S;
  ctx.fillStyle = 'rgba(0,0,0,0.32)';
  ctx.fillRect(0, 0, W, H);
  var msgKey = ['coach_belt','coach_place','coach_smelter','coach_place_machine','coach_done'][coachStep] || 'coach_done';
  var target = null;
  if (coachStep === 0) target = centerHL(toolBtnById('belt'));
  else if (coachStep === 1 && COACH_BELT_CELL) {
    target = { x: gridX + COACH_BELT_CELL.gx * CELL + CELL / 2, y: gridY + COACH_BELT_CELL.gy * CELL + CELL / 2, r: CELL * 0.5 };
  }
  else if (coachStep === 2) target = centerHL(toolBtnById('m0'));
  else if (coachStep === 3 && COACH_SMELTER_CELL) {
    target = { x: gridX + COACH_SMELTER_CELL.gx * CELL + CELL / 2, y: gridY + COACH_SMELTER_CELL.gy * CELL + CELL / 2, r: CELL * 0.5 };
  }
  else if (coachStep === 4) {
    target = { x: gridX + dock.cx * CELL + CELL / 2, y: gridY + dock.cy * CELL + CELL / 2, r: CELL * 0.55 };
  }

  // pulse highlight
  if (target) {
    var pulse = 0.5 + 0.5 * Math.sin(coachT * 4);
    ctx.save();
    ctx.strokeStyle = '#ffeb3b'; ctx.lineWidth = 3 + pulse * 2; ctx.shadowColor = '#ffeb3b'; ctx.shadowBlur = 14;
    ctx.globalAlpha = 0.9;
    ctx.beginPath(); ctx.arc(target.x, target.y, (target.r || 30) + pulse * 8 * S, 0, Math.PI * 2); ctx.stroke();
    ctx.restore();
  }

  // caption pill
  var txt = GF.t(msgKey);
  var capFs = GF.clamp(15 * S, 12, 19) | 0;
  ctx.font = 'bold ' + capFs + 'px sans-serif';
  var lines = wrapLines(ctx, txt, Math.min(W * 0.84, 420 * S));
  var lineH = capFs * 1.3;
  var padX = 16 * S, padY = 12 * S;
  var boxW = 0;
  for (var i = 0; i < lines.length; i++) boxW = Math.max(boxW, ctx.measureText(lines[i]).width);
  boxW += padX * 2;
  var boxH = lines.length * lineH + padY * 2;
  var boxX = W / 2 - boxW / 2;
  var boxY = (target && target.y < H * 0.5) ? Math.min(H - boxH - 90 * S, target.y + (target.r || 30) + 24 * S) : (H * 0.32);
  boxY = GF.clamp(boxY, hudH + 8 * S, toolbarY - boxH - 8 * S);
  ctx.fillStyle = 'rgba(18,15,10,0.94)';
  rr(ctx, boxX, boxY, boxW, boxH, 10 * S); ctx.fill();
  ctx.strokeStyle = '#caa23a'; ctx.lineWidth = 1.5 * S; rr(ctx, boxX, boxY, boxW, boxH, 10 * S); ctx.stroke();
  ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (var j = 0; j < lines.length; j++) {
    ctx.fillText(lines[j], W / 2, boxY + padY + lineH / 2 + j * lineH);
  }
}

function centerHL(r) { if (!r) return { x: GF.W / 2, y: GF.H - 40 * GF.S, r: 30 * GF.S }; return { x: r.x + r.w / 2, y: r.y + r.h / 2, r: Math.max(r.w, r.h) * 0.6 }; }
function toolBtnById(id) { for (var i = 0; i < toolButtons.length; i++) if (toolButtons[i].id === id) return toolButtons[i]; return null; }

function wrapLines(ctx, text, maxW) {
  var words = String(text).split(/\s+/);
  var lines = [], cur = '';
  for (var i = 0; i < words.length; i++) {
    var probe = cur ? cur + ' ' + words[i] : words[i];
    if (ctx.measureText(probe).width > maxW && cur) { lines.push(cur); cur = words[i]; }
    else cur = probe;
  }
  if (cur) lines.push(cur);
  return lines;
}

// ── HELP PANEL (? button) ─────────────────────────────────────────────────────
function drawHelp(ctx) {
  var W = GF.W, H = GF.H, S = GF.S;
  ctx.fillStyle = 'rgba(0,0,0,0.78)';
  ctx.fillRect(0, 0, W, H);
  var panW = Math.min(W - 32 * S, 460 * S);
  var panX = (W - panW) / 2;
  var titleFs = GF.clamp(22 * S, 17, 28) | 0;
  var bodyFs = GF.clamp(14 * S, 12, 17) | 0;
  var lineH = bodyFs * 1.35;
  // measure
  ctx.font = bodyFs + 'px sans-serif';
  var keys = condensedHelp() ? ['tut_goal','tut_controls','tut_lose'] : ['tut_goal','tut_controls','tut_win','tut_lose','tut_tip'];
  var blocks = [];
  var totalH = titleFs + 24 * S;
  for (var i = 0; i < keys.length; i++) {
    var ls = wrapLines(ctx, GF.t(keys[i]), panW - 36 * S);
    blocks.push(ls);
    totalH += ls.length * lineH + 12 * S;
  }
  totalH += 30 * S;
  var panY = GF.clamp((H - totalH) / 2, 20 * S, H * 0.12);
  ctx.fillStyle = '#1f1a12';
  rr(ctx, panX, panY, panW, totalH, 14 * S); ctx.fill();
  ctx.strokeStyle = '#caa23a'; ctx.lineWidth = 2 * S; rr(ctx, panX, panY, panW, totalH, 14 * S); ctx.stroke();

  var yy = panY + 18 * S;
  ctx.fillStyle = '#ffe08a'; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titleFs + 'px sans-serif';
  ctx.fillText(GF.t('howToTitle'), W / 2, yy);
  yy += titleFs + 14 * S;
  ctx.textAlign = 'left';
  for (var b = 0; b < blocks.length; b++) {
    ctx.fillStyle = '#e8dcc2'; ctx.font = bodyFs + 'px sans-serif';
    for (var k = 0; k < blocks[b].length; k++) {
      ctx.fillText(blocks[b][k], panX + 18 * S, yy);
      yy += lineH;
    }
    yy += 12 * S;
  }
  // tap to close hint
  ctx.fillStyle = '#9a9088'; ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
  ctx.font = (12 * S | 0) + 'px sans-serif';
  ctx.fillText(GF.t('close') + ' ✕', W / 2, panY + totalH - 10 * S);
}

function condensedHelp() {
  // returning players (seenTut) get condensed
  try { return localStorage.getItem('conveyor_tycoon_seen_tutorial') === '1' && !coachActive; } catch (e) { return false; }
}

// ── MENU ──────────────────────────────────────────────────────────────────────
function drawMenu(ctx) {
  var W = GF.W, H = GF.H, S = GF.S;
  // factory-ish backdrop
  ctx.fillStyle = '#1a160f';
  ctx.fillRect(0, 0, W, H);
  // decorative belts
  ctx.save();
  ctx.globalAlpha = 0.18;
  for (var r = 0; r < 5; r++) {
    var yy = H * 0.2 + r * H * 0.13;
    ctx.fillStyle = '#3a3a44';
    ctx.fillRect(0, yy, W, 12 * S);
    drawCoinIcon(ctx, (W * 0.2 + r * W * 0.18) % W, yy + 6 * S, 8 * S);
  }
  ctx.restore();

  var cy = H * 0.16;
  // title
  ctx.fillStyle = '#ffe08a'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  var tfs = GF.clamp(38 * S, 26, 48) | 0;
  ctx.font = 'bold ' + tfs + 'px sans-serif';
  ctx.fillText(GF.t('title'), W / 2, cy);
  cy += tfs * 0.7 + 6 * S;
  ctx.fillStyle = '#b3a89a';
  var sfs = GF.clamp(15 * S, 12, 19) | 0;
  ctx.font = sfs + 'px sans-serif';
  ctx.fillText(GF.t('sub'), W / 2, cy);
  cy += sfs + 20 * S;

  // how-to block (full panel for first-timers, condensed for returners)
  var bodyFs = GF.clamp(13 * S, 11, 16) | 0;
  var lineH = bodyFs * 1.32;
  ctx.font = bodyFs + 'px sans-serif';
  var keys = condensedHelp() ? ['tut_goal','tut_controls','tut_lose'] : ['tut_goal','tut_controls','tut_win','tut_lose','tut_tip'];
  var panW = Math.min(W - 36 * S, 440 * S);
  var panX = (W - panW) / 2;
  var blocks = [];
  var bodyH = 0;
  for (var i = 0; i < keys.length; i++) {
    var ls = wrapLines(ctx, GF.t(keys[i]), panW - 28 * S);
    blocks.push(ls);
    bodyH += ls.length * lineH + 9 * S;
  }
  var panH = bodyH + 22 * S;
  ctx.fillStyle = 'rgba(31,26,18,0.9)';
  rr(ctx, panX, cy, panW, panH, 12 * S); ctx.fill();
  ctx.strokeStyle = 'rgba(202,162,58,0.5)'; ctx.lineWidth = 1.5 * S; rr(ctx, panX, cy, panW, panH, 12 * S); ctx.stroke();
  var yy2 = cy + 14 * S;
  ctx.textAlign = 'left'; ctx.textBaseline = 'top';
  for (var b = 0; b < blocks.length; b++) {
    ctx.fillStyle = '#e8dcc2'; ctx.font = bodyFs + 'px sans-serif';
    for (var k = 0; k < blocks[b].length; k++) { ctx.fillText(blocks[b][k], panX + 14 * S, yy2); yy2 += lineH; }
    yy2 += 9 * S;
  }
  cy += panH + 22 * S;

  // PLAY button (drawn + hit-tested here; LAST interactive element)
  var bw = Math.min(260 * S, W * 0.7), bh = 56 * S;
  var bx = W / 2 - bw / 2, by = Math.min(cy, H - bh - 30 * S);
  menuPlayRect = { x: bx, y: by, w: bw, h: bh };
  var pulse = 0.5 + 0.5 * Math.sin((typeof performance !== 'undefined' ? performance.now() : Date.now()) / 400);
  ctx.fillStyle = '#caa23a';
  rr(ctx, bx, by, bw, bh, bh / 2); ctx.fill();
  ctx.strokeStyle = 'rgba(255,225,120,' + (0.5 + pulse * 0.4) + ')'; ctx.lineWidth = 2.5 * S;
  rr(ctx, bx, by, bw, bh, bh / 2); ctx.stroke();
  ctx.fillStyle = '#1a160f'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = 'bold ' + (GF.clamp(22 * S, 17, 28) | 0) + 'px sans-serif';
  var playLabel = (best => best > 0 ? GF.t('play') : GF.t('play'))(bestCoins);
  ctx.fillText(GF.t('play'), W / 2, by + bh / 2 + 1);

  // best score
  if (bestCoins > 0) {
    ctx.fillStyle = '#9a9088'; ctx.font = (GF.clamp(13 * S, 11, 16) | 0) + 'px sans-serif';
    ctx.fillText(GF.t('best') + ': ' + bestCoins + ' · ' + GF.t('tier') + ' ' + (bestTier + 1), W / 2, by + bh + 18 * S);
  }

  // mute on menu (top-right)
  if (!muteRect) layout();
  drawPill(ctx, muteRect);
  var mc = centerOf(muteRect);
  GF.drawMuteIcon(ctx, mc.x, mc.y, 8 * S, GF.muted);
}

var menuPlayRect = null;

// ── BACKLOG → PATIENCE coupling (poll) ────────────────────────────────────────
// We decrement contract patience whenever backlog grows. Track last value.
function pollBacklog() {
  if (backlog > _lastBacklog) {
    var grew = backlog - _lastBacklog;
    for (var g = 0; g < grew; g++) tickPatience();
  }
  _lastBacklog = backlog;
}

// ── SCREENSHOT / TEST HOOKS ───────────────────────────────────────────────────
window._setupForScreenshot = function (level) {
  window._silent = true; seenTut = true; helpOpen = false; shopOpen = false;
  try { localStorage.setItem('conveyor_tycoon_seen_tutorial', '1'); } catch (e) {}
  var lv = level || 3;
  // jump to a mid-game tier with a populated factory
  startGame();
  coachActive = false;
  tier = Math.min(MAX_TIER, 2 + (lv >= 5 ? 1 : 0));
  ownedMachines = [];
  for (var m = 0; m <= tier; m++) ownedMachines.push(m);
  coins = 240; coinsAllTime = TIER_COST[tier] + 80; floatCoins = coins;
  beltSlots = 40; speedMul = 1.5; beltSpeedLvl = 2; surge = 1 + tier * 0.18;
  // expand grid a bit
  while (gridH < Math.min(GRID_H_MAX, GRID_H + 2)) {
    gridH++;
    var nr = []; for (var x = 0; x < gridW; x++) nr.push(null); grid.push(nr);
  }
  dock.cy = gridH - 1; dock.cx = Math.floor(gridW / 2);
  // add 2nd source
  if (sources.length < 2) sources.push({ cx: gridW - 2, cy: 0, tier: 1 });
  layout();
  emptyGrid();
  // Build a real working two-line factory: source -> belt down -> smelter -> belt -> press -> belt to dock
  buildShowcaseFactory();
  // contracts
  contracts = [];
  addContract(); addContract();
  contracts[0].goodTier = Math.min(tier, 1); contracts[0].have = 2; contracts[0].need = 5;
  if (contracts[1]) { contracts[1].goodTier = Math.min(tier, 2); contracts[1].have = 1; contracts[1].need = 4; }
  // seed items in transit on the belts
  seedTransitItems();
  backlog = 4; _lastBacklog = 4;
  gs = 'PLAYING';
};

function buildShowcaseFactory() {
  // Line A from source 0 (cx,0): straight down column, smelter midway, dock at bottom-centre.
  var s0 = sources[0];
  var col = s0.cx;
  for (var y = s0.cy + 1; y < gridH; y++) {
    if (y === dock.cy && col === dock.cx) break;
    grid[y][col] = { type: 'belt', dir: 0 };
  }
  // smelter at row 3 in that column
  var smY = Math.min(gridH - 3, 3);
  grid[smY][col] = { type: 'machine', mtier: 0, outTier: 0, dir: 0, busy: true, proc: 0.6, heldKind: 'raw' };
  // route from bottom of column toward dock horizontally
  var bottomY = gridH - 1;
  var ry = bottomY;
  // belt row leading to dock
  var x = col;
  var step = (col < dock.cx) ? 1 : -1;
  grid[ry][col] = { type: 'belt', dir: (step > 0 ? 3 : 1) };
  for (x = col + step; x !== dock.cx; x += step) {
    if (!inGrid(x, ry)) break;
    grid[ry][x] = { type: 'belt', dir: (step > 0 ? 3 : 1) };
  }
  // turn the vertical column's last cell before bottom into a belt heading down then sideways:
  grid[bottomY - 1] && (grid[bottomY - 1][col] = { type: 'belt', dir: 0 });

  // Line B from source 1 if present
  if (sources.length > 1) {
    var s1 = sources[1];
    var col2 = s1.cx;
    for (var y2 = s1.cy + 1; y2 < gridH - 2; y2++) grid[y2][col2] = { type: 'belt', dir: 0 };
    var pmY = Math.min(gridH - 4, 4);
    grid[pmY][col2] = { type: 'machine', mtier: Math.min(tier, 1), outTier: Math.min(tier, 1), dir: 0, busy: true, proc: 0.4, heldKind: 'raw' };
    // assembler if tier>=2
    if (tier >= 2) {
      var asY = Math.min(gridH - 6, 2);
      if (asY > s1.cy + 1) grid[asY] && (grid[asY][col2] = { type: 'belt', dir: 0 });
    }
  }
  // a few extra belts to look busy
  for (var e = 0; e < 4; e++) {
    var ex = 1 + ((e * 2) % (gridW - 1));
    var ey = 5 + (e % 2);
    if (inGrid(ex, ey) && !grid[ey][ex] && !isReserved(ex, ey)) grid[ey][ex] = { type: 'belt', dir: (e % 4) };
  }
}

function seedTransitItems() {
  items = [];
  // put ore + goods riding the main columns
  for (var s = 0; s < sources.length; s++) {
    var src = sources[s];
    for (var k = 1; k <= 3; k++) {
      var gy = src.cy + k;
      if (inGrid(src.cx, gy) && grid[gy] && grid[gy][src.cx] && grid[gy][src.cx].type === 'belt') {
        items.push({ tier: src.tier, kind: 'raw', gx: src.cx, gy: gy, prog: 0.2 + k * 0.2, dir: 0, alive: true });
      }
    }
  }
  // finished goods near the dock row
  var by = gridH - 1;
  for (var x = 1; x < gridW - 1; x++) {
    if (grid[by] && grid[by][x] && grid[by][x].type === 'belt' && Math.random() < 0.6) {
      items.push({ tier: Math.min(tier, 1), kind: 'good', gx: x, gy: by, prog: Math.random(), dir: grid[by][x].dir, alive: true });
    }
  }
}

window._jumpLevel = function (n) {
  helpOpen = false;
  if (n === 99) { if (gs !== 'PLAYING') startGame(); lives = 0; gameOver(); return; }
  window._setupForScreenshot(n || 3);
};
window._setLang = function (l) { GF.lang = (l === 'ru' ? 'ru' : 'en'); layout(); };
window._setState = function (s) { if (s) gs = s; };
window._getI18N = function () { return STRINGS; };
window._getFontBody = function () { return 'sans-serif'; };
window.__openTut = function () { helpOpen = true; };
window.__closeTut = function () { helpOpen = false; };

// ── BOOT ──────────────────────────────────────────────────────────────────────
try {
  bestCoins = parseInt(localStorage.getItem('conveyor_tycoon_best') || '0', 10) || 0;
  bestTier = parseInt(localStorage.getItem('conveyor_tycoon_besttier') || '0', 10) || 0;
  seenTut = (localStorage.getItem('conveyor_tycoon_seen_tutorial') === '1');
} catch (e) {}

GF.init({
  designW: 540,
  designH: 960,
  strings: STRINGS,
  sprites: SPRITE_NAMES,
  saveKey: 'conveyor_tycoon',
  onUpdate: function (dt) { update(dt); pollBacklog(); },
  onDraw: draw,
  onReady: function () {
    // Yandex 1.9 — persist run state across reload.
    GF.persist('conveyor_tycoon_run_v1',
      function () {
        if (gs !== 'PLAYING') return { gs: gs };
        return {
          gs: 'PLAYING', lives: lives, coins: coins, coinsAllTime: coinsAllTime, tier: tier,
          gridW: gridW, gridH: gridH, backlog: backlog, beltSlots: beltSlots,
          beltSpeedLvl: beltSpeedLvl, speedMul: speedMul, ownedMachines: ownedMachines.slice(),
          surge: surge, sources: sources.map(function (s) { return { cx: s.cx, cy: s.cy, tier: s.tier }; }),
          dock: { cx: dock.cx, cy: dock.cy }, seenTut: seenTut,
          grid: serializeGrid(), contracts: contracts.map(function (c) { return { goodTier: c.goodTier, need: c.need, have: c.have, patience: c.patience, pmax: c.pmax, reward: c.reward }; }),
        };
      },
      function (s) {
        if (!s) return;
        if (s.gs !== 'PLAYING') { gs = s.gs === 'GAMEOVER' ? 'MENU' : (s.gs || 'MENU'); return; }
        lives = s.lives; coins = s.coins; coinsAllTime = s.coinsAllTime; tier = s.tier;
        gridW = s.gridW; gridH = s.gridH; backlog = s.backlog || 0; beltSlots = s.beltSlots || 18;
        beltSpeedLvl = s.beltSpeedLvl || 0; speedMul = s.speedMul || 1; ownedMachines = s.ownedMachines || [0];
        surge = s.surge || 1; sources = s.sources || [{ cx: 1, cy: 0, tier: 0 }];
        dock = s.dock || { cx: Math.floor(gridW / 2), cy: gridH - 1 };
        seenTut = !!s.seenTut; floatCoins = coins; _lastBacklog = backlog;
        deserializeGrid(s.grid);
        contracts = s.contracts || [];
        gs = 'PLAYING';
        layout();
        window._restored = true;
      }
    );
    if (gs === 'PLAYING' && !window._restored) gs = 'MENU';

    GF.startMusic({ preset: 'idle', muted: GF.muted });

    // Platform autostart (HARD RULE 9) — drop straight into PLAYING on platform builds.
    if (window.__GF_AUTOSTART && !window._silent && gs === 'MENU') startGame();

    layout();

    // ── State exposure for the post-build-tester gate (every DESIGN var) ──
    GF.exposeState(function () {
      return {
        gs: gs, lives: lives, coins: coins, coinsAllTime: coinsAllTime,
        tier: tier, bestCoins: bestCoins, bestTier: bestTier,
        gridW: gridW, gridH: gridH, backlog: backlog, BACKLOG_MAX: BACKLOG_MAX,
        beltSlots: beltSlots, beltsPlaced: countBelts(), speedMul: speedMul, beltSpeedLvl: beltSpeedLvl,
        sources: sources.length, items: items.length, contracts: contracts.length,
        ownedMachines: ownedMachines.slice(), surge: +surge.toFixed(2), seenTut: seenTut,
        selTool: selTool, shopOpen: shopOpen, coachActive: coachActive,
        score: coinsAllTime,
        START_LIVES: START_LIVES, GRID_W: GRID_W, GRID_H: GRID_H, BELT_SPEED: BELT_SPEED,
        ORE_SPAWN_SEC: ORE_SPAWN_SEC, MACHINE_TIME: MACHINE_TIME, CONTRACT_PATIENCE: CONTRACT_PATIENCE,
        BELT_COST: BELT_COST, TIER_COST: TIER_COST, SELL_BASE: SELL_BASE,
      };
    });

    // ── Bot action contract for the autonomous progression probe ──
    GF.exposeBot(
      function () {
        if (gs === 'MENU') return ['start'];
        if (gs === 'GAMEOVER') return ['retry'];
        var acts = [];
        if (coachActive) {
          // advance coach deterministically (5 steps)
          if (coachStep === 0) acts.push('sel_belt');
          else if (coachStep === 1) acts.push('coach_place_belt');
          else if (coachStep === 2) acts.push('sel_smelter');
          else if (coachStep === 3) acts.push('coach_place_machine');
          else acts.push('coach_done');
          return acts;
        }
        // build actions: place a belt on a random empty cell, place machine, buy things
        acts.push('place_belt');
        if (ownedMachines.length) acts.push('place_machine');
        acts.push('rotate_random');
        acts.push('open_shop');
        if (coins >= BELT_COST) acts.push('buy_belt');
        if (canAffordAnyMachine()) acts.push('buy_machine');
        if (tier < MAX_TIER && coinsAllTime >= TIER_COST[tier + 1] && coins >= TIER_COST[tier + 1]) acts.push('buy_tier');
        if (coins >= 80 && sources.length < 2) acts.push('buy_source');
        acts.push('idle');
        return acts;
      },
      function (a) {
        if (a === 'start' || a === 'retry') { startGame(); return; }
        if (a === 'sel_belt') { selTool = 'belt'; if (coachActive && coachStep === 0) advanceCoach(); return; }
        if (a === 'coach_place_belt') { selTool = 'belt'; placeAt(COACH_BELT_CELL.gx, COACH_BELT_CELL.gy); return; }
        if (a === 'sel_smelter') { selTool = 'm0'; if (coachActive && coachStep === 2) advanceCoach(); return; }
        if (a === 'coach_place_machine') { selTool = 'm0'; placeAt(COACH_SMELTER_CELL.gx, COACH_SMELTER_CELL.gy); return; }
        if (a === 'coach_done') { endCoach(); return; }
        if (a === 'open_shop') { shopOpen = true; buildShopRows(); return; }
        if (a === 'place_belt') {
          shopOpen = false;
          var gx = 1 + Math.floor(Math.random() * (gridW - 1));
          var gy = 1 + Math.floor(Math.random() * (gridH - 1));
          selTool = 'belt'; placeAt(gx, gy);
          return;
        }
        if (a === 'place_machine') {
          shopOpen = false;
          var mt = ownedMachines[Math.floor(Math.random() * ownedMachines.length)];
          selTool = 'm' + mt;
          var mx = 1 + Math.floor(Math.random() * (gridW - 1));
          var my = 1 + Math.floor(Math.random() * (gridH - 2));
          placeAt(mx, my);
          return;
        }
        if (a === 'rotate_random') {
          // rotate a random existing belt
          var belts = [];
          for (var y = 0; y < gridH; y++) for (var x = 0; x < gridW; x++) if (grid[y][x] && grid[y][x].type === 'belt') belts.push([x, y]);
          if (belts.length) { var b = belts[Math.floor(Math.random() * belts.length)]; selTool = 'belt'; placeAt(b[0], b[1]); }
          return;
        }
        if (a === 'buy_belt') { buyShop('belt'); return; }
        if (a === 'buy_machine') {
          for (var mt2 = 0; mt2 <= tier; mt2++) if (ownedMachines.indexOf(mt2) < 0) { buyShop('machine_' + mt2); return; }
          return;
        }
        if (a === 'buy_tier') { buyShop('tier'); return; }
        if (a === 'buy_source') { buyShop('source'); return; }
        // idle: no-op
      }
    );

    GF.exposeReach(function () {
      var its = [];
      if (gs === 'PLAYING' && !shopOpen) {
        for (var i = 0; i < toolButtons.length; i++) its.push({ id: 'tool_' + toolButtons[i].id, x: toolButtons[i].x, y: toolButtons[i].y, w: toolButtons[i].w, h: toolButtons[i].h, pinned: true });
        if (shopBtnRect) its.push({ id: 'shop', x: shopBtnRect.x, y: shopBtnRect.y, w: shopBtnRect.w, h: shopBtnRect.h, pinned: true });
      }
      return { screen: gs.toLowerCase() + (shopOpen ? '_shop' : ''), items: its, viewportH: GF.H, screenH: GF.H, scrollMaxY: 0 };
    });
    GF.exposeTour([
      { name: 'menu', go: function () { gs = 'MENU'; shopOpen = false; helpOpen = false; } },
      { name: 'play', go: function () { if (gs !== 'PLAYING') startGame(); coachActive = false; shopOpen = false; } },
      { name: 'shop', go: function () { if (gs !== 'PLAYING') startGame(); coachActive = false; shopOpen = true; buildShopRows(); } },
      { name: 'gameover', go: function () { if (gs !== 'PLAYING') startGame(); lives = 0; gameOver(); } },
    ]);
  },
});

// ── INPUT WIRING (own canvas listeners; gf-lib's init has no onPress hook) ─────
function dispatchPress(x, y) {
  if (gs === 'MENU') {
    if (menuPlayRect && hit(x, y, menuPlayRect)) { startGame(); return; }
    if (muteRect && hit(x, y, muteRect)) { GF.toggleMute(); GF.setMusicMuted(GF.muted); return; }
    return;
  }
  if (gs === 'GAMEOVER') return; // RETRY handled by GF.drawOverlay's own button registry
  onPress(x, y);
}
(function () {
  var cv = GF.canvas;
  if (!cv) return;
  cv.addEventListener('touchstart', function (e) {
    e.preventDefault();
    var t = e.changedTouches[0];
    dispatchPress(t.clientX, t.clientY);
  }, { passive: false });
  cv.addEventListener('mousedown', function (e) { dispatchPress(e.clientX, e.clientY); });
  // keyboard convenience (desktop): 1-9 select tools, S = shop
  document.addEventListener('keydown', function (e) {
    if (gs !== 'PLAYING' || helpOpen) return;
    if (e.key >= '1' && e.key <= '9') {
      var idx = parseInt(e.key, 10) - 1;
      if (toolButtons[idx]) selTool = toolButtons[idx].id;
    } else if (e.key === 's' || e.key === 'S') { shopOpen = !shopOpen; if (shopOpen) buildShopRows(); }
    else if (e.key === 'Escape') { shopOpen = false; helpOpen = false; }
  });
}());
// Relayout on viewport changes (gf-lib resizes the canvas but calls no game hook).
window.addEventListener('resize', function () { layout(); });
window.addEventListener('orientationchange', function () { setTimeout(layout, 80); });

// ── GRID SERIALIZATION (for persist) ──────────────────────────────────────────
function serializeGrid() {
  var out = [];
  for (var y = 0; y < gridH; y++) {
    var row = [];
    for (var x = 0; x < gridW; x++) {
      var c = grid[y][x];
      if (!c) row.push(0);
      else if (c.type === 'belt') row.push('b' + c.dir);
      else row.push('m' + c.mtier + c.dir);
    }
    out.push(row);
  }
  return out;
}
function deserializeGrid(data) {
  emptyGrid();
  if (!data) return;
  for (var y = 0; y < gridH && y < data.length; y++) {
    for (var x = 0; x < gridW && x < data[y].length; x++) {
      var v = data[y][x];
      if (!v || v === 0) continue;
      if (typeof v === 'string') {
        if (v.charAt(0) === 'b') grid[y][x] = { type: 'belt', dir: parseInt(v.slice(1), 10) || 0 };
        else if (v.charAt(0) === 'm') {
          var mt = parseInt(v.charAt(1), 10) || 0;
          var dir = parseInt(v.charAt(2), 10) || 0;
          grid[y][x] = { type: 'machine', mtier: mt, outTier: mt, dir: dir, busy: false, proc: 0, heldKind: null };
        }
      }
    }
  }
}

})();
</script>
