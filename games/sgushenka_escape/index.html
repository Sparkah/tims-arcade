<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    >
    <meta name="theme-color" content="#140905">
    <meta
      name="description"
      content="A first-person creature forcing through a living chimney of condensed milk."
    >
    <title>Сгущёнка — The Drowning Chimney</title>
    <link rel="stylesheet" href="./tokens.css">
  </head>
  <body>
    <main id="game-shell" aria-label="Condensed milk free-swimming movement prototype">
      <canvas
        id="game-canvas"
        tabindex="0"
        aria-label="A first-person three-dimensional view from a tiny creature forcing upward through condensed milk."
        aria-describedby="game-status"
      ></canvas>

      <div class="opening-veil" aria-hidden="true"></div>

      <section id="chapter-card" class="chapter-card" aria-live="polite" aria-hidden="true">
        <p id="chapter-kicker">LEVEL 1</p>
        <h1 id="chapter-title">SWEET TRAP</h1>
        <span id="chapter-subtitle">FEED · BREAK OUT</span>
        <button id="replay-button" type="button">PLAY AGAIN</button>
      </section>

      <div id="nutrient-flash" class="nutrient-flash" aria-hidden="true"></div>

      <div class="air-marker" aria-live="off">
        <span id="objective-label">FEED 0 / 3</span>
        <i id="objective-icon" aria-hidden="true">◇</i>
        <strong id="depth-distance">14.1 m</strong>
      </div>

      <div id="swim-control" class="swim-control" aria-hidden="true">
        <span id="swim-knob"></span>
      </div>

      <div class="depth-controls" aria-label="Vertical swimming controls">
        <button id="ascend-button" type="button" aria-label="Swim upward">↑</button>
        <button id="descend-button" type="button" aria-label="Swim downward">↓</button>
      </div>

      <p id="movement-hint" class="movement-hint">
        <strong>WASD + MOUSE — SWIM</strong>
        <span>SPACE / C — RISE / SINK</span>
        <em>KEEP PUSHING. THE MILK WILL YIELD.</em>
      </p>

      <button id="reset-button" class="reset-button" type="button" aria-label="Reset movement test">
        ↺
      </button>

      <button id="mute-button" class="mute-button" type="button" aria-label="Mute sound" aria-pressed="false">
        SOUND
      </button>

      <p id="game-status" class="sr-only" aria-live="polite">
        The drowning chimney is ready. Use WASD and mouse to swim. Sustained movement compresses
        the condensed milk until it yields.
      </p>
    </main>

    <script src="./game.js"></script>
  </body>
</html>
