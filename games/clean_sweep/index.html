function rr(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function lerp(a, b, t) { return a + (b - a) * t; }
function clamp(v, lo, hi) { return v < lo ? lo : v > hi ? hi : v; }
// Shrink a bold label until it fits maxW, so a longer localisation (Russian
// runs ~40% longer than English here) can never spill outside its pill.
// Returns the px size to use; the caller sets the font.
function fitBoldFs(label, maxW, baseFs, minFs) {
  var fs = baseFs;
  var prev = ctx.font;
  while (fs > minFs) {
    ctx.font = 'bold ' + fs + 'px sans-serif';
    if (ctx.measureText(label).width <= maxW) break;
    fs -= 1;
  }
  ctx.font = prev;
  return Math.max(minFs, fs);
}
function platformSafeInsets() {
  var shortWide = W / Math.max(1, H) > 1.55 && H <= 720;
  return {
    right: shortWide ? clamp(W * 0.075, 52, 150) : 0,
    bottom: (shortWide || H < 620) ? clamp(H * 0.105, 44, 86) : 0
  };
}

window._jumpLevel = function(n) {
  // n=99 is the yandex-testing harness "drop me into GAMEOVER" signal so
  // it can exercise the retry/cycle path without burning 60s. (2026-05-15
  // adapter compatibility - without this Clean Sweep falls back to the
  // 'generic' yandex-testing adapter and skips every click test.)
  if (n === 99) {
    gs = 'GAMEOVER'; timeLeft = 0;
    // iter#11 visual-test hook: seed a plausible yesterday score so the
    // "Yesterday -> Today" pill renders for screenshot harness runs that
    // otherwise have an empty dailyScores map.
    if (yesterdayScore <= 0) { yesterdayScore = 800; }
    if (todayBestScore <= 0 && score > 0) todayBestScore = score;
    // iter#14 visual-test hook: seed a plausible rolling 7-day ceiling so the
    // 7-DAY BEST pill renders for screenshot harness runs that otherwise have
    // an empty dailyScores map. Also flip weekBestIsNew if the seeded score
    // exceeds it, so harness can also capture the gold "NEW 7-DAY BEST!" path.
    if (weekBestScore <= 0) { weekBestScore = 1200; }
    if (score > 0 && score > weekBestScore) weekBestIsNew = true;
    return;
  }
  // iter#10: n=98 is the visual-test "drop me into LEVELEND with 3 stars"
  // signal so the iteration harness can verify the new star UI without
  // physically clearing the level. Harmless in production; no UI exposure.
  if (n === 98) {
    if (!levelStartTime) { startLevel(1); }
    lastLevelStars = 3;
    var priorStars = levelStars[level] || 0;
    if (lastLevelStars > priorStars) { levelStars[level] = lastLevelStars; saveLevelStars(); lastLevelStarsNewBest = true; }
    else { lastLevelStarsNewBest = false; }
    // iter#13 visual-test hook: also seed PERFECT SWEEP so harness paints the stamp
    lastLevelPerfect = true;
    // MCPlay 2026-07-27 visual-test hook: seed the remaining level-end rows
    // (TIME BONUS + sprinkle payout) so the overlap gate can review the panel
    // with EVERY optional row present - the densest frame it can produce.
    if (score <= 0) score = 594;
    if (lastLevelTimeBonus <= 0) lastLevelTimeBonus = 436;
    if (lastLevelSprinkles <= 0) lastLevelSprinkles = 19;
    gs = 'LEVELEND';
    return;
  }
  score = 0;
  startLevel(n);
};

// ── iter#7: Yandex ads (rewarded "Extra Time" + throttled interstitial) ─────
// All ad triggers are user-click only (Yandex 4.4). Interstitial throttled
// to ≥3min between fullscreen ads (Yandex 4.1). When the SDK isn't present
// (gallery preview / local dev) helpers no-op for interstitial and grant
// the revive immediately for rewarded - so the feature stays exercisable.
var INTERSTITIAL_GAP_MS = 3 * 60 * 1000;
var lastInterstitialMs = -INTERSTITIAL_GAP_MS;
var extraTimeUsed = false;     // one "+15s" revive per level
var extraTimeLoading = false;  // disables the button while the ad loads
var reviveBtnRect = null;      // hit-test rect for the EXTRA TIME button
var EXTRA_TIME_SEC = 15;

function showInterstitial(onDone) {
  var now = performance.now();
  if (now - lastInterstitialMs < INTERSTITIAL_GAP_MS) { onDone && onDone(); return; }
  if (window.gp && window.gp.ads && typeof window.gp.ads.showFullscreen === 'function') {
    lastInterstitialMs = now;
    var gpSettled = false;
    function gpDone() {
      if (gpSettled) return; gpSettled = true;
      resumeAudioForAd();
      onDone && onDone();
    }
    try {
      pauseAudioForAd();
      window.gp.ads.showFullscreen().then(gpDone).catch(gpDone);
      setTimeout(gpDone, 30000);
    } catch(e) { gpDone(); }
    return;
  }
  if (!window.ysdk || !window.ysdk.adv || !window.ysdk.adv.showFullscreenAdv) { onDone && onDone(); return; }
  lastInterstitialMs = now;
  var opened = false, settled = false, openTimer = null, maxTimer = null;
  function done() {
    if (settled) return;
    settled = true;
    if (openTimer) { clearTimeout(openTimer); openTimer = null; }
    if (maxTimer) { clearTimeout(maxTimer); maxTimer = null; }
    resumeAudioForAd();
    onDone && onDone();
  }
  // No-fill guard: if Yandex never opens or closes the ad, keep the game moving.
  openTimer = setTimeout(function() { if (!opened) done(); }, 4500);
  try {
    window.ysdk.adv.showFullscreenAdv({
      callbacks: {
        onOpen:  function() {
          opened = true;
          if (openTimer) { clearTimeout(openTimer); openTimer = null; }
          maxTimer = setTimeout(done, 180000);
          pauseAudioForAd();
        },
        onClose: function() { done(); },
        onError: function() { done(); },
      },
    });
  } catch(e) { done(); }
}
// ── iter#15: ad/visibility audio pause (Yandex 4.7 ad-audio + 1.3 pause-on-hide) ──
// One guard so an ad and a tab-hide can't double-toggle. Suspends BOTH the SFX
// AudioContext and the music bed; restores only if the player hasn't muted.
var audioHeld = false;
function pauseAudioForAd() {
  if (audioHeld) return; audioHeld = true;
  try { if (_ac && _ac.state === 'running') _ac.suspend(); } catch(e) {}
  pauseMusic();
}
function resumeAudioForAd() {
  if (!audioHeld) return; audioHeld = false;
  if (sfxMuted) return;
  try { if (_ac && _ac.state === 'suspended') _ac.resume(); } catch(e) {}
  resumeMusic();
}
function showRewardedExtraTime() {
  if (extraTimeUsed || extraTimeLoading) return;
  extraTimeLoading = true;
  if (window.gp && window.gp.ads && typeof window.gp.ads.showRewardedVideo === 'function') {
    var gpSettled = false;
    function gpSettle(grant) {
      if (gpSettled) return; gpSettled = true;
      extraTimeLoading = false;
      resumeAudioForAd();
      if (grant) grantExtraTime();
    }
    try {
      pauseAudioForAd();
      window.gp.ads.showRewardedVideo()
        .then(function(success) { gpSettle(!!success); })
        .catch(function() { gpSettle(true); });
      setTimeout(function() { gpSettle(true); }, 30000);
    } catch(e) { gpSettle(true); }
    return;
  }
  if (!window.ysdk || !window.ysdk.adv || !window.ysdk.adv.showRewardedVideo) {
    extraTimeLoading = false; grantExtraTime(); return;
  }
  var rewarded = false, opened = false, settled = false, adWatchdog = null;
  function settleExtraTime(grant) {
    if (settled) return; settled = true;
    if (adWatchdog) { clearTimeout(adWatchdog); adWatchdog = null; }
    extraTimeLoading = false;
    resumeAudioForAd(); // iter#15: Yandex 4.7 - restore audio after the ad closes
    if (grant) grantExtraTime();
  }
  // No-fill guard: if the rewarded ad never OPENS within 4.5s (no ad fill, as in
  // any draft/preview), grant so the button never sticks dead. Matches no-SDK fallback.
  adWatchdog = setTimeout(function() { if (!opened) settleExtraTime(true); }, 4500);
  try {
    window.ysdk.adv.showRewardedVideo({
      callbacks: {
        onOpen:     function() { opened = true; pauseAudioForAd(); if (adWatchdog) { clearTimeout(adWatchdog); adWatchdog = null; } },
        onRewarded: function() { rewarded = true; },
        onClose:    function() { settleExtraTime(rewarded); },
        onError:    function() { settleExtraTime(true); },
      },
    });
  } catch(e) { settleExtraTime(true); }
}
function grantExtraTime() {
  extraTimeUsed = true;
  timeLeft = EXTRA_TIME_SEC;
  gs = 'PLAYING';
}

// ── BACKGROUND MUSIC (licensed bakery-arcade loop via decodeAudioData) ───────
// 2026-07-30 sound pass: the bed is a Suno Pro track, "Glazed Dash Loop",
// imported by Shared/tools/game-audio/import_music.py (audio/bg_loop.mp3,
// provenance in audio/audio_manifest.json) and looped through a Web
// Audio buffer source into the same MUS.master gain. Dedicated AudioContext +
// master gain, mute/suspend plumbing shared with the SFX engine (toggleMute,
// setPlatformAudioEnabled), started on the first user gesture per the autoplay
// policy.
//
// ONE MUSIC SYSTEM, and the recorded loop is it. There used to be a procedural
// scheduler (kick + bass + bell arp) carrying the bed while the mp3 decoded:
// that is what made old music replay intermittently after a restart. Every boot
// spent the decode window playing the synth, and the handover only cleared the
// scheduler's setTimeout - notes already queued on the graph up to ~0.25s ahead
// kept sounding OVER the recorded track, so a reload could be heard as two beds
// at once. A fetch failure was worse: the synth then owned the bed for the whole
// session. There is no second engine now; a failed fetch retries a bounded
// number of times and otherwise leaves the bed silent rather than substituting a
// different piece of music.

      .then(function(ab) { return MUS.ctx.decodeAudioData(ab); })

// ── iter#11: YESTERDAY'S SCORE (daily-seed delta) ────────────────────────────
// Every player on the same UTC date faces an identical layout (iter#4), so
// today's score is DIRECTLY comparable to yesterday's. Persist the best
// score per UTC date (last 7 kept), then on GAMEOVER show a small
// "Yesterday: N -> Today: M (+/-Δ)" pill beneath the leaderboard. Layers a
// compete-with-yesterday-you loop on top of the shared daily seed -
// orthogonal to leaderboard rank (which is vs. other players) and personal
// best (which is lifetime, not date-aware).
var DAILY_SCORE_KEY = 'clean_sweep_daily_score_v1';   // JSON {YYYY-MM-DD: bestScoreThatDay}
var dailyScores = {};                                  // hydrated from localStorage

  try {

        for (var k in parsed) {

          // basic YYYY-MM-DD sanity + positive score

        }

    }
  } catch(e) {}
  // hydrate "yesterday" + "today" snapshots for fast render lookups
  var today = getDayKey();
  todayBestScore = dailyScores[today] || 0;
  // yesterday key = today's UTC date minus 24h
  var d = new Date();
  d.setUTCDate(d.getUTCDate() - 1);
  var y = d.getUTCFullYear();
  var m = String(d.getUTCMonth() + 1).padStart(2, '0');

function recordDailyScore(s) {
  if (!s || s <= 0) return;

// ── iter#14: ROLLING 7-DAY BEST (no new persistence - reuses iter#11 store) ──
// dailyScores already holds the last 7 UTC days of best-per-day scores (iter#11

// ceiling. Render on GAMEOVER as a small purple pill beneath the
// "Yesterday -> Today" delta. When the current run beats the prior 7-day ceiling
// (excluding today's own entry - we want the comparison to be against the
// previous 6 days), flag it gold + show "NEW 7-DAY BEST!" sub-line. Zero new
// localStorage keys, zero gameplay change.
var weekBestScore = 0;        // current rolling 7-day ceiling
var weekBestIsNew = false;    // true if this run beat the prior 7-day high
function recomputeWeekBest() {
  // Best across all entries in the rolling 7-day window (dailyScores is already
  // GC'd to <= 7 entries by saveDailyScores).
  var b = 0;
  for (var k in dailyScores) {
    if (!Object.prototype.hasOwnProperty.call(dailyScores, k)) continue;

    if (v > b) b = v;
  }

// the store before this is called.
function priorWeekBestExcludingToday() {
  var today = getDayKey();
  var b = 0;
  for (var k in dailyScores) {
    if (!Object.prototype.hasOwnProperty.call(dailyScores, k)) continue;
    if (k === today) continue;

// ── DONUT BOXES (rewarded lootbox + day-7 streak box) ────────────────────────
// Odds and caps live here; the AD plumbing lives in the platform ad runtime so
// the YouTube target can be fail-closed (no ads API -> the chip is never drawn
// and nothing is ever granted) while the Yandex/GamePush target keeps its own
// SDK branches.
//
// LADDER: a box costs a TOKEN, and a token is minted only by CLEARING A LEVEL,
// at most BOX_TOKEN_CAP in hand. That is the guard the 2026-07-27 rejection
// round asked for - a loading flag only stops CONCURRENT ad requests, so
// without an earn-rate the player watches ads back to back and empties the
// whole system in minutes. Here twenty boxes cost twenty cleared levels.
//
// DUPLICATES ARE STRUCTURALLY IMPOSSIBLE: the donut side rolls uniformly over
// the donuts the player does NOT own. When every donut is already owned the
// donut side cannot pay a donut, so it pays DOUBLE sprinkles instead and says
// so on the reveal - a roll is never silently wasted.
//
// ARITHMETIC (deliberate): 20 boxes x 50% is ~10 donuts, so the ad cap alone
// cannot complete a 20-donut case. The best-score ladder (4 donuts) and the
// day-7 streak box (one guaranteed donut per day at a 7-day streak) are the
// other two sources; the case is a multi-week goal, not a twenty-ad purchase.
var BOX_AD_CAP = 20;          // lifetime rewarded ads that may be spent on boxes
var BOX_TOKEN_CAP = 2;        // boxes bankable at once (stops a level-farm burst)
var BOX_DONUT_CHANCE = 0.5;   // 50/50 donut vs sprinkles
var STREAK_BOX_DAYS = 7;      // login streak at which the daily free box starts
var boxReveal = null;         // { kind, id, n, full, free, t } while gs === 'BOXOPEN'
var boxPrevGs = 'MENU';       // state to restore when the reveal closes

function donutTotal() { return DONUT_SKINS.length; }
function donutOwnedCount() {
  var n = 0;
  for (var i = 0; i < DONUT_SKINS.length; i++) if (isSkinUnlocked(DONUT_SKINS[i])) n++;
  return n;
}
function lockedDonuts() {
  var out = [];
  for (var i = 0; i < DONUT_SKINS.length; i++) if (!isSkinUnlocked(DONUT_SKINS[i])) out.push(DONUT_SKINS[i]);
  return out;
}
function boxAdsLeft() { return meta ? Math.max(0, BOX_AD_CAP - meta.boxAds) : 0; }
function boxTokens()  { return meta ? meta.boxTokens : 0; }
// A cleared level mints one box token (the earn side of the ladder).
function earnBoxToken() {
  if (!meta) return;
  if (meta.boxTokens >= BOX_TOKEN_CAP) return;
  meta.boxTokens += 1;
  saveMeta();
}
// The offer, evaluated identically at DRAW time and at CLICK time.
function boxOfferAvailable() { return !!meta && boxTokens() > 0 && boxAdsLeft() > 0; }
// Consumed only after the SDK confirms the reward was actually earned.
function consumeBoxOffer() {
  if (!boxOfferAvailable()) return false;
  meta.boxTokens -= 1;
  meta.boxAds += 1;
  saveMeta();
  return true;
}
function rollBoxReward() {
  var locked = lockedDonuts();
  var wantDonut = Math.random() < BOX_DONUT_CHANCE;
  if (wantDonut && locked.length > 0) {
    return { kind:'donut', id: locked[Math.floor(Math.random() * locked.length)].id };
  }
  var base = 40 + Math.max(1, level) * 10;
  var caseFull = (wantDonut && locked.length === 0);
  return { kind:'sprinkles', n: Math.round(base * (caseFull ? 2 : 1)), full: caseFull };
}
function grantBoxResult(res) {
  if (!res || !meta) return;
  if (res.kind === 'donut') {
    if (!meta.donuts) meta.donuts = {};
    meta.donuts[res.id] = 1;
    markSkinSeen(res.id);
    saveMeta();
    try { sfxSkin(); } catch(e) {}
  } else {
    awardSprinkles(res.n);
    try { sfxBadge(); } catch(e) {}
  }
}
function openBoxReveal(res, free) {
  if (!res) return;
  boxReveal = { kind:res.kind, id:res.id, n:res.n, full:!!res.full, free:!!free, t:0 };
  if (gs !== 'BOXOPEN') boxPrevGs = gs;
  gs = 'BOXOPEN';
}
function closeBoxReveal() {
  boxReveal = null;
  gs = (boxPrevGs === 'BOXOPEN') ? 'MENU' : boxPrevGs;
  try { sfxClick(); } catch(e) {}
}
// Day-7 login streak: one guaranteed donut per day, no ad, no token, outside
// the BOX_AD_CAP budget. This is the source that finishes a case the ad cap
// mathematically cannot.
function streakBoxDue() {
  return !!meta && streak >= STREAK_BOX_DAYS && meta.boxDay !== getDayKey();
}
function claimStreakBox() {
  if (!streakBoxDue()) return false;
  meta.boxDay = getDayKey();
  saveMeta();
  var locked = lockedDonuts();
  var res = locked.length > 0
    ? { kind:'donut', id: locked[Math.floor(Math.random() * locked.length)].id }
    : { kind:'sprinkles', n: 120, full:true };
  grantBoxResult(res);
  openBoxReveal(res, true);
  return true;
}

// ── DAILY SEED (iter#4: shared layout per day) ───────────────────────────────
// Mulberry32 - deterministic seeded PRNG. Used ONLY for level layout
// (debris placement) so that every player on the same UTC date faces the
// EXACT same starting puzzle and the daily leaderboard is a fair race.
// Visual jitter (particles, floats, screen shake) keeps Math.random() so
// every run still feels alive.
function makeRng(seed) {
  var s = seed | 0;
  return function() {
    s = (s + 0x6D2B79F5) | 0;
    var t = s;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function getDaySeed() {
  var d = new Date();
  return d.getUTCFullYear() * 10000 + (d.getUTCMonth()+1) * 100 + d.getUTCDate();
}
var daySeed = 0;        // YYYYMMDD numeric - fixed for the whole calendar day
var levelRng = Math.random; // replaced per startLevel() with mulberry32(daySeed * 100 + level)

// ── DAILY STREAK (iter#5: come-back-tomorrow loop on top of daily seed) ──────
// Tracks consecutive UTC-day visits. Increments when last-played-date is
// exactly yesterday, resets to 1 when the gap is >1 day, no-ops on same-day
// re-launches. Surfaced as a small flame pill above the daily-seed badge so
// players can SEE the streak they're protecting tomorrow.
var STREAK_KEY      = 'clean_sweep_streak';      // integer count
var STREAK_DATE_KEY = 'clean_sweep_streak_date'; // YYYY-MM-DD of last visit
var STREAK_BEST_KEY = 'clean_sweep_streak_best'; // lifetime longest streak
var streak = 0, streakBest = 0;
var streakBumped = false; // true if this session is the one that incremented (drives a one-time flash)

function dayKeyToDate(key) {
  // YYYY-MM-DD -> ms epoch (UTC midnight). Safe for both '2026-05-14' and bad input.
  var parts = String(key).split('-');
  if (parts.length !== 3) return NaN;
  return Date.UTC(parseInt(parts[0],10), parseInt(parts[1],10)-1, parseInt(parts[2],10));
}
function loadStreak() {
  try {
    streak = parseInt(localStorage.getItem(STREAK_KEY) || '0') || 0;
    streakBest = parseInt(localStorage.getItem(STREAK_BEST_KEY) || '0') || 0;
    var lastKey = localStorage.getItem(STREAK_DATE_KEY) || '';
    var today = getDayKey();
    if (lastKey === today) {
      // same UTC day - leave as-is, no flash
      return;
    }
    var lastMs = dayKeyToDate(lastKey);
    var todayMs = dayKeyToDate(today);
    if (isNaN(lastMs) || isNaN(todayMs)) {
      // first ever launch (or corrupted key) - start a streak today
      streak = 1;
    } else {
      var gapDays = Math.round((todayMs - lastMs) / 86400000);
      if (gapDays === 1)      streak = streak + 1;   // consecutive - extend
      else if (gapDays > 1)   streak = 1;            // gap - restart at today
      else                    streak = Math.max(streak, 1); // clock skew / future date - clamp
    }
    streakBumped = true;
    if (streak > streakBest) streakBest = streak;
    localStorage.setItem(STREAK_KEY, String(streak));
    localStorage.setItem(STREAK_BEST_KEY, String(streakBest));
    localStorage.setItem(STREAK_DATE_KEY, today);
  } catch(e) {}
}

// ── PARTICLES & FLOATS ────────────────────────────────────────────────────────
function spawnParticles(x, y, color, n) {
  for (var i = 0; i < n; i++) {
    var a = Math.random() * Math.PI * 2;
    var sp = (1.5 + Math.random() * 3.5) * S;
    particles.push({ x:x, y:y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp,
      r:(2 + Math.random()*4)*S, color:color, life:1 });

function spawnFloat(x, y, txt, col) {

// ── ARENA BOUNDS ──────────────────────────────────────────────────────────────
function arena() {
  var inset = platformSafeInsets();
  var pad = 12 * S;
  var top = (HUD_H + 6) * S;
  return { x: pad, y: top, w: W - pad*2 - inset.right, h: H - top - pad - inset.bottom };
}

// ── LIVE-VIEWPORT WORLD REFLOW (MCPlay 2026-07-30) ───────────────────────────
// Debris and sprinkles are stored as ABSOLUTE pixels, picked from the arena
// that existed when the level started. The MCPlay reviewer's "Aspect ratio"
// step resizes the frame to portrait MID-LEVEL, and nothing used to remap
// them: everything spawned right of the new, narrower arena fell outside it,
// unreachable (the donut is hard-clamped to the LIVE arena), so CLEAN% stuck
// part-way and the level could never be finished - "игровое поле выходит за
// рамки мобильной ориентации и не дает закончить уровень".
//
// The world is therefore re-derived from the live viewport on every size
// change: entities keep their position RELATIVE to the arena, then are held
// inside it. The containment clamp is the invariant that matters - however an
// entity ended up out of bounds, it comes back within the donut's reach.
var _worldArena = null;   // the arena rect the current world coordinates belong to

// Hold a pickup inside the arena, leaving room for the donut to touch it. On a
// viewport so small the margin exceeds half the arena, collapse it to the
// centre line rather than inverting the clamp.
function holdInside(e, ar, m) {
  m = Math.max(0, Math.min(m, ar.w / 2 - 1, ar.h / 2 - 1));
  e.x = clamp(e.x, ar.x + m, ar.x + ar.w - m);
  e.y = clamp(e.y, ar.y + m, ar.y + ar.h - m);
}

function reflowWorld() {
  var to = arena();
  var from = _worldArena;
  _worldArena = to;
  // Called once from the initial resize(), before any world state exists.
  if (!debrisList || !sprinkleList || !donut) return;
  if (!(to.w > 0) || !(to.h > 0)) return;
  var fx = to.x, fy = to.y, kx = 1, ky = 1;
  if (from && from.w > 0 && from.h > 0) {
    fx = from.x; fy = from.y; kx = to.w / from.w; ky = to.h / from.h;
  }
  var mapX = function(x) { return to.x + (x - fx) * kx; };
  var mapY = function(y) { return to.y + (y - fy) * ky; };
  var i, e;
  for (i = 0; i < debrisList.length; i++) {
    e = debrisList[i];
    e.x = mapX(e.x); e.y = mapY(e.y);
    e.r = e.typeR * S;                  // sprite radius follows the live scale
    holdInside(e, to, e.r + 2);
  }
  for (i = 0; i < sprinkleList.length; i++) {
    e = sprinkleList[i];
    e.x = mapX(e.x); e.y = mapY(e.y);
    holdInside(e, to, 14 * S);
  }
  for (i = 0; i < particles.length; i++) { e = particles[i]; e.x = mapX(e.x); e.y = mapY(e.y); }
  for (i = 0; i < floats.length; i++)    { e = floats[i];    e.x = mapX(e.x); e.y = mapY(e.y); }

  donut.x = clamp(mapX(donut.x), to.x + dr, to.x + to.w - dr);
  donut.y = clamp(mapY(donut.y), to.y + dr, to.y + to.h - dr);
}

// ── LEVEL SETUP ───────────────────────────────────────────────────────────────
// `freshRun` marks the start of a NEW run (menu PLAY, game-over RETRY,
// autostart) as opposed to advancing from LEVELEND. It used to be inferred as
// `lvl === 1`, which broke the moment a run could resume at the last cleared
// level (MCPlay 2026-07-27) - a resumed run at level 7 kept the previous run's
// per-run state. Callers now say so explicitly; the old inference remains the
// default so every untouched call site behaves exactly as before.
function startLevel(lvl, freshRun) {
  if (freshRun === undefined) freshRun = (lvl === 1);
  level = lvl;
  debrisList = []; particles = []; floats = []; buttons = [];
  combo = 0; comboTimer = 0; shake = 0;
  // iter#13: per-level reset - combo-break tracker for the PERFECT SWEEP bonus
  chainStartedThisLevel = false; perfectChainAlive = true; lastLevelPerfect = false;
  // newBest is per-RUN, not per-level - only reset when starting a fresh run
  if (freshRun) { newBest = false; bestPulse = 0; lbSubmitted = false; myRank = null; maxComboThisRun = 0; newBestCombo = false; chainPulse = 0; lastLevelStars = 0; lastLevelStarsNewBest = false; sprinkleHudPulse = 0; sprinkleToastTimer = 0; runPlaySec = 0; _runEnded = false; }
  // milestone#1: per-level reset of the one-shot Crumb Shield grace
  window._shieldUsedThisLevel = false;
  // iter#7: reset the "+15s" rewarded-ad slot each level
  extraTimeUsed = false; extraTimeLoading = false; reviveBtnRect = null;
  // Persist the moment a level is REACHED, not just when it is cleared, so a
  // reload part-way through level 7 resumes at level 7 rather than level 1.
  noteLevelReached(lvl);
  // milestone#1: fold equipped Cleaning Tool bonuses into this run.
  applyToolBonuses();
  timeLeft = Math.max(25, 70 - (lvl - 1) * 6) + toolTime; // Fresh Batch tool adds start seconds
  levelStartTime = timeLeft; // iter#10: cache for star-rating denominator on level clear

  // iter#4: seed the level-layout RNG from today's date + level number so
  // every player on the same UTC date faces the EXACT same debris layout
  // for the same level. The wobble/phase decorations stay seeded too so
  // crumb animation phases match (cosmetic - keeps visuals deterministic
  // for screenshot tools, harmless if not).
  daySeed = getDaySeed();
  levelRng = makeRng(daySeed * 100 + lvl);

  var ar = arena();

  // resize remaps them from the right frame of reference.
  _worldArena = ar;
  donut.x = ar.x + ar.w / 2;
  donut.y = ar.y + ar.h / 2;
  donut.vx = 0; donut.vy = 0; donut.angle = 0;

  for (var ti = 0; ti < TYPES.length; ti++) {
    var tp = TYPES[ti];
    var count = tp.base + Math.floor((lvl - 1) * tp.base * 0.5);
    for (var i = 0; i < count; i++) {
      for (var att = 0; att < 60; att++) {
        var mg = (tp.r + 4) * S;
        var dx = ar.x + mg + levelRng() * (ar.w - mg*2);
        var dy = ar.y + mg + levelRng() * (ar.h - mg*2);

        var ok = true;
        for (var j = 0; j < debrisList.length; j++) {
          var dj = debrisList[j];
          var ex = dx-dj.x, ey = dy-dj.y;
          if (Math.sqrt(ex*ex+ey*ey) < (tp.r + dj.typeR)*S*1.4) { ok=false; break; }

          score:tp.score, color:tp.color, shine:tp.shine,
          wobble:levelRng()*Math.PI*2, phase:levelRng()*Math.PI*2 });

  checkAchievementsOnLevel(lvl);

}

// ── UPDATE ────────────────────────────────────────────────────────────────────
var lastTs = 0;
function update(dt) {
  if (gs !== 'PLAYING') return;

  // milestone#1: accrue cumulative playtime + surface tool unlocks LIVE (cheap
  // check; grant happens in-memory, only saveMeta()s on an actual unlock).
  runPlaySec += dt;
  if (sprinkleEarnFlash > 0) sprinkleEarnFlash = Math.max(0, sprinkleEarnFlash - dt * 0.8);

  // is waiting its turn still gets its full time on screen when it gets there.
  if (toolUnlockToast > 0 && pillToastOwner() === 'tool') toolUnlockToast = Math.max(0, toolUnlockToast - dt * 0.3);
  checkToolUnlocks();

  timeLeft -= dt;
  if (timeLeft <= 0) {
    // milestone#1: Crumb Shield tool grants grace seconds before the run ends
    // (consumed once per level so it can't loop forever).
    if (toolShield >= 1 && !window._shieldUsedThisLevel) {
      window._shieldUsedThisLevel = true;
      timeLeft = Math.round(toolShield);

    timeLeft = 0; sfxGameOver(); gs = 'GAMEOVER';try{parent.postMessage({type:'gf:gameEnded'},'*')}catch(_){};
    // milestone#1/#2: fold this run into the persistent meta - playtime, sprinkles
    // earned (score-scaled, boosted by Tip Jar + Bonus Pay event), run count, quests.
    onRunEnd();

    // can detect a fresh 7-day best on this run. recordDailyScore mutates
    // dailyScores; recomputeWeekBest then refreshes the rolling ceiling for
    // the GAMEOVER pill.
    var _priorWB = priorWeekBestExcludingToday();
    submitAndFetchLeaderboard(); recordDailyScore(score);
    recomputeWeekBest();

    return;
    }
  }

  if (comboTimer > 0) { comboTimer -= dt; if (comboTimer <= 0) { combo = 0; if (chainStartedThisLevel) perfectChainAlive = false; } } // iter#13: combo decay also breaks the PERFECT SWEEP chain
  if (shake > 0) shake = Math.max(0, shake - dt * 8);
  if (bestPulse > 0) bestPulse = Math.max(0, bestPulse - dt * 0.6);
  if (chainPulse > 0) chainPulse = Math.max(0, chainPulse - dt * 0.6); // iter#9
  if (sprinkleHudPulse > 0) sprinkleHudPulse = Math.max(0, sprinkleHudPulse - dt * 0.7); // iter#12
  if (sprinkleToastTimer > 0) sprinkleToastTimer = Math.max(0, sprinkleToastTimer - dt * 0.35); // iter#12

  var magR = 70 * S * (1 + toolMagnet * 4); // base small radius, grows with the tool
  for (var spi = 0; spi < sprinkleList.length; spi++) {
    var _sp = sprinkleList[spi];
    _sp.bob += dt * 2.2; _sp.phase += dt * 1.6;

  if (!achToastActive && achToastQueue.length > 0) achToastActive = achToastQueue.shift();
  if (achToastActive && pillToastOwner() === 'badge') {
    achToastActive.life -= dt * 0.4;
    if (achToastActive.life <= 0) achToastActive = null;
  }

  // movement
  var ax = 0, ay = 0;
  if (keys['ArrowLeft']  || keys['KeyA']) ax -= 1;
  if (keys['ArrowRight'] || keys['KeyD']) ax += 1;
  if (keys['ArrowUp']    || keys['KeyW']) ay -= 1;
  if (keys['ArrowDown']  || keys['KeyS']) ay += 1;

      else { combo = 1; comboTimer = comboWin; }

        newBest = true;

    // line and the star row (MCPlay overlap screenshot 2026-07-27). It is now

    lastLevelTimeBonus = bonus;

      // on the level-end button. The panel renders it as its own pill row.
      spawnParticles(donut.x, donut.y, '#FFD700', 18);
      spawnParticles(donut.x, donut.y, '#FFF8C0', 12);
      try { if (typeof sfxBadge === 'function') sfxBadge(); } catch(e) {}

        if (typeof checkSkinUnlocks === 'function') checkSkinUnlocks();

    } else {
      lastLevelStarsNewBest = false;

    // the player spends in the Workshop). Scales with level + stars, boosted by
    // the Tip Jar tool + Bonus Pay event. Bump the "clear N levels" daily quest.
    lastLevelSprinkles = sprinklesForClear(level, lastLevelStars);
    awardSprinkles(lastLevelSprinkles);

    // twenty boxes cost twenty cleared levels, not twenty consecutive ads.
    earnBoxToken();

    if (lastLevelPerfect) bumpQuest('perfect1', 1);

    if (p.life <= 0) particles.splice(i, 1);
  }
  for (var i = floats.length - 1; i >= 0; i--) {
    var f = floats[i];
    f.y += f.vy; f.life -= dt * 1.1;

}

// ── DRAW DONUT ────────────────────────────────────────────────────────────────
function drawDonut(x, y) {
  // Sprite path: AI render with built-in shadow + sprinkles.
  var spriteSize = (DR * 2) * S * 1.15; // slightly bigger than design radius (sprite has shadow padding)
  if (sprites.donut && sprites.donut.complete && sprites.donut.naturalWidth > 0) {
    var skin = getSkin(skinId);

    ctx.translate(x, y);
    ctx.rotate(donut.angle * 0.25); // gentle rotation so it still feels alive

      // composite doesn't bleed onto the main canvas (tested via deep_playtest).

        _skinScratch = document.createElement('canvas');
        _skinScratchCtx = _skinScratch.getContext('2d');

      }
      _skinScratchCtx.clearRect(0, 0, sw, sh);
      _skinScratchCtx.drawImage(sprites.donut, 0, 0, sw, sh);
      _skinScratchCtx.globalCompositeOperation = 'source-atop';
      _skinScratchCtx.fillStyle = skin.tint;
      _skinScratchCtx.fillRect(0, 0, sw, sh);
      _skinScratchCtx.globalCompositeOperation = 'source-over';

var _skinScratch = null, _skinScratchCtx = null;

function drawDonutProcedural(x, y) {
  var r = DR * S, hole = DHOLE * S;

  ctx.shadowColor = 'rgba(0,0,0,0.45)';
  ctx.shadowBlur  = 10 * S;
  ctx.shadowOffsetY = 3 * S;

  ctx.beginPath();
  ctx.arc(0, 0, r, 0, Math.PI*2);
  ctx.arc(0, 0, hole, 0, Math.PI*2, true);
  ctx.fillStyle = '#F5DEB3';
  ctx.fill();
  ctx.shadowColor = 'transparent';

  // icing ring (color comes from selected skin - iter#3)
  ctx.beginPath();
  ctx.arc(0, 0, r*0.88, 0, Math.PI*2);
  ctx.arc(0, 0, hole*1.15, 0, Math.PI*2, true);
  ctx.fillStyle = (getSkin(skinId).ring) || '#FFB7C5';
  ctx.fill();

  // icing highlight
  ctx.beginPath();
  ctx.arc(-r*0.15, -r*0.15, r*0.3, 0, Math.PI*2);
  ctx.fillStyle = 'rgba(255,255,255,0.35)';
  ctx.fill();

  // sprinkles (rotate with movement)
  var spkColors = ['#FF6B6B','#4ECDC4','#FFE66D','#A78BFA','#FB923C'];
  var midR = hole + (r - hole) * 0.52;
  for (var i = 0; i < 7; i++) {
    var a = donut.angle + (i / 7) * Math.PI * 2;
    var sx = Math.cos(a) * midR, sy = Math.sin(a) * midR;
    ctx.save();
    ctx.translate(sx, sy);
    ctx.rotate(a + Math.PI/2);
    ctx.fillStyle = spkColors[i % spkColors.length];
    ctx.fillRect(-3.5*S, -1.2*S, 7*S, 2.4*S);
    ctx.restore();
  }

  // hole (punch through to bg)
  ctx.beginPath();
  ctx.arc(0, 0, hole, 0, Math.PI*2);
  ctx.fillStyle = '#0a0a12';
  ctx.fill();

  ctx.restore();
}

// ── DRAW DEBRIS ───────────────────────────────────────────────────────────────
function drawDebris(d) {
  var wb = Math.sin(d.wobble) * 1.2 * S;

  // Sprite path: scale sprite to ~3x the procedural radius (sprites have padding/glow built in)
  var spriteName = d.typeId; // 'crumb' | 'mud' | 'wrapper' | 'trash'
  var spriteImg = sprites[spriteName];
  if (spriteImg && spriteImg.complete && spriteImg.naturalWidth > 0) {
    var spriteSize = d.r * 2.6;
    ctx.save();
    ctx.translate(d.x, d.y + wb);
    if (spriteName === 'wrapper') ctx.rotate(d.phase);
    ctx.drawImage(spriteImg, -spriteSize/2, -spriteSize/2, spriteSize, spriteSize);
    ctx.restore();
    return;
  }

  // Fallback: procedural drawing
  ctx.save();
  ctx.translate(d.x, d.y + wb);

  if (d.typeId === 'crumb') {
    ctx.beginPath(); ctx.arc(0, 0, d.r, 0, Math.PI*2);
    ctx.fillStyle = d.color; ctx.fill();
    ctx.beginPath(); ctx.arc(-d.r*0.25, -d.r*0.3, d.r*0.45, 0, Math.PI*2);
    ctx.fillStyle = d.shine; ctx.fill();

  } else if (d.typeId === 'mud') {
    ctx.beginPath();
    for (var i = 0; i <= 8; i++) {
      var a = (i/8)*Math.PI*2;
      var br = d.r * (0.78 + Math.sin(d.phase + i*0.9)*0.22);
      if (i===0) ctx.moveTo(Math.cos(a)*br, Math.sin(a)*br);
      else       ctx.lineTo(Math.cos(a)*br, Math.sin(a)*br);
    }
    ctx.closePath(); ctx.fillStyle = d.color; ctx.fill();
    ctx.beginPath(); ctx.arc(-d.r*0.2,-d.r*0.2,d.r*0.35,0,Math.PI*2);
    ctx.fillStyle = d.shine; ctx.fill();

  } else if (d.typeId === 'wrapper') {
    ctx.rotate(d.phase);
    var ww = d.r*2.8, wh = d.r*1.1;
    rr(ctx, -ww/2, -wh/2, ww, wh, 3*S);
    ctx.fillStyle = d.color; ctx.fill();
    // crinkle lines
    ctx.strokeStyle = d.shine; ctx.lineWidth = 1.5*S;
    ctx.beginPath(); ctx.moveTo(-ww*0.3,-wh/2); ctx.lineTo(-ww*0.3,wh/2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo( ww*0.3,-wh/2); ctx.lineTo( ww*0.3,wh/2); ctx.stroke();
    // shine
    ctx.fillStyle = 'rgba(255,255,255,0.25)';
    rr(ctx, -ww/2, -wh/2, ww, wh*0.38, 3*S);
    ctx.fill();

  } else { // trash bag
    ctx.beginPath(); ctx.arc(0, 0, d.r, 0, Math.PI*2);
    ctx.fillStyle = d.color; ctx.fill();
    // bag tie
    ctx.beginPath(); ctx.arc(0, -d.r*0.75, d.r*0.22, 0, Math.PI*2);
    ctx.fillStyle = d.shine; ctx.fill();
    // sheen
    ctx.beginPath(); ctx.arc(-d.r*0.28,-d.r*0.28,d.r*0.38,0,Math.PI*2);
    ctx.fillStyle = 'rgba(255,255,255,0.18)'; ctx.fill();
    // exclamation
    ctx.font = 'bold '+(d.r*0.9)+'px sans-serif';
    ctx.fillStyle = 'rgba(255,255,255,0.6)';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('!', 0, d.r*0.15);
  }
  ctx.restore();
}

// ── iter#12: draw a single golden sprinkle pickup ────────────────────────────
function drawSprinkle(s) {
  var bob = Math.sin(s.bob) * 2.4;
  var twinkle = 0.7 + Math.sin(s.phase * 1.4) * 0.3;
  var r = s.r * S;
  ctx.save();
  ctx.translate(s.x, s.y + bob);
  // outer glow
  ctx.globalAlpha = 0.35 * twinkle;
  ctx.beginPath(); ctx.arc(0, 0, r * 2.0, 0, Math.PI*2);
  ctx.fillStyle = '#FFD700'; ctx.fill();
  ctx.globalAlpha = 1;
  // 4-point star (sprinkle)
  ctx.rotate(s.phase * 0.35);
  ctx.beginPath();
  for (var k = 0; k < 8; k++) {
    var ang = (k / 8) * Math.PI * 2;
    var rad = (k % 2 === 0) ? r * 1.05 : r * 0.42;
    var px = Math.cos(ang) * rad;
    var py = Math.sin(ang) * rad;
    if (k === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  }
  ctx.closePath();
  var grad = ctx.createRadialGradient(-r*0.3, -r*0.3, r*0.1, 0, 0, r);
  grad.addColorStop(0, '#FFF8C0');
  grad.addColorStop(0.6, '#FFD700');
  grad.addColorStop(1, '#B8860B');
  ctx.fillStyle = grad; ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.55)';
  ctx.lineWidth = 1.2 * S; ctx.stroke();
  // tiny center sparkle
  ctx.globalAlpha = twinkle;
  ctx.beginPath(); ctx.arc(0, 0, r*0.22, 0, Math.PI*2);
  ctx.fillStyle = '#FFFFFF'; ctx.fill();
  ctx.globalAlpha = 1;
  ctx.restore();
}

// ── DRAW ARENA ────────────────────────────────────────────────────────────────
function drawArena() {
  var ar = arena();
  ctx.fillStyle = '#16162a';
  ctx.fillRect(ar.x, ar.y, ar.w, ar.h);

  // subtle tile grid
  ctx.strokeStyle = 'rgba(255,255,255,0.025)';
  ctx.lineWidth = 1;
  var gs2 = 44 * S;
  for (var x = ar.x; x <= ar.x+ar.w; x += gs2) {
    ctx.beginPath(); ctx.moveTo(x, ar.y); ctx.lineTo(x, ar.y+ar.h); ctx.stroke();
  }
  for (var y = ar.y; y <= ar.y+ar.h; y += gs2) {
    ctx.beginPath(); ctx.moveTo(ar.x, y); ctx.lineTo(ar.x+ar.w, y); ctx.stroke();
  }
  // border glow
  ctx.strokeStyle = 'rgba(100,180,255,0.12)';
  ctx.lineWidth = 2;
  ctx.strokeRect(ar.x, ar.y, ar.w, ar.h);
}

// ── DRAW HUD ──────────────────────────────────────────────────────────────────
// ── HUD READOUT: "LABEL value" ON ONE LINE ───────────────────────────────────
// The level readout used to be the word LEVEL on one line with the number
// underneath it (label at bh*0.42, value at bh*0.78). On a phone that reads as
// the label having WRAPPED onto a second line, and it was the same for SCORE
// and TIME. Each readout is now a single line whose label and value shrink
// together, and the whole row is measured against the live width before
// anything is drawn - so a long localisation (Cyrillic runs ~40% longer) or a
// five-digit score scales the text down instead of colliding with its
// neighbour (ledger defect classes 1 and 4).
function hudCellWidth(label, value, labFs, valFs) {
  ctx.font = 'bold ' + labFs + 'px sans-serif';
  var w = ctx.measureText(label).width + labFs * 0.42;
  ctx.font = 'bold ' + valFs + 'px sans-serif';
  return w + ctx.measureText(value).width;
}
function drawHudCell(x, midY, label, value, labFs, valFs, valCol, alpha) {
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.font = 'bold ' + labFs + 'px sans-serif';
  ctx.fillStyle = '#6a6a7c';
  ctx.fillText(label, x, midY);
  var lw = ctx.measureText(label).width;
  ctx.font = 'bold ' + valFs + 'px sans-serif';
  ctx.fillStyle = valCol;
  if (alpha !== undefined && alpha < 1) ctx.globalAlpha = alpha;
  ctx.fillText(value, x + lw + labFs * 0.42, midY);
  ctx.globalAlpha = 1;
  ctx.textBaseline = 'alphabetic';
}
function drawHUD() {
  var inset = platformSafeInsets();
  var bh = HUD_H * S;
  ctx.fillStyle = 'rgba(8,8,18,0.92)';
  ctx.fillRect(0, 0, W, bh);
  ctx.strokeStyle = 'rgba(255,255,255,0.06)';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(0, bh); ctx.lineTo(W, bh); ctx.stroke();

  var pad = 14*S, rightX = W - pad - inset.right;
  ctx.textBaseline = 'alphabetic';

  // 1. Declare the row's contents.
  var pct = totalDebris > 0 ? Math.round((1 - debrisList.length/totalDebris)*100) : 100;
  var lvlLbl = t('level'),   lvlVal   = String(level);
  var timeLbl = t('time'),   timeVal  = Math.ceil(timeLeft) + t('secAbbr');
  var scoreLbl = t('score'), scoreVal = String(score);
  var cleanLbl = t('clean') + ' ' + pct + '%';

  var labFs = clamp(12*S, 9, 15);
  var valFs = clamp(19*S, 14, 25);
  var cellGap = clamp(14*S, 8, 22);
  var barH = 9*S;
  var meterMinW = clamp(90*S, 70, 240);
  var rowW = Math.max(40, rightX - pad);
  var midY = bh * 0.46;

  // 2. Measure, then shrink EVERY readout by one factor. Two stages: the first
  //    tries to keep the meter at a readable width, the second only has to stop
  //    the three readouts from touching each other. The second stage is what
  //    makes non-overlap STRUCTURAL rather than true-for-the-widths-we-tested -
  //    a long localisation and a large score both feed straight into it.
  var kh = 1, wl = 0, wt = 0, ws = 0, freeW = 0;
  for (var hp = 0; hp < 40; hp++) {
    wl = hudCellWidth(lvlLbl,   lvlVal,   labFs*kh, valFs*kh);
    wt = hudCellWidth(timeLbl,  timeVal,  labFs*kh, valFs*kh);
    ws = hudCellWidth(scoreLbl, scoreVal, labFs*kh, valFs*kh);
    freeW = rowW - (wl + wt + ws) - cellGap*3;
    if (freeW >= meterMinW) break;
    if (kh <= 0.6 && freeW >= barH * 3) break;
    if (kh <= 0.35) break;
    kh -= 0.05;
  }
  labFs *= kh; valFs *= kh;

  // 3. Place. LEVEL owns the left edge, SCORE the right, TIME sits inside
  //    SCORE, and the meter takes whatever band is left between them.
  drawHudCell(pad, midY, lvlLbl, lvlVal, labFs, valFs, '#fff');
  drawHudCell(rightX - ws, midY, scoreLbl, scoreVal, labFs, valFs, '#FFD700');
  // iter#12: TIME flashes gold for the half-second after a sprinkle pickup
  var tc = timeLeft < 12 ? '#e74c3c' : timeLeft < 25 ? '#f39c12' : '#d8d8e4';
  if (sprinkleHudPulse > 0) tc = '#FFD700';
  drawHudCell(rightX - ws - cellGap - wt, midY, timeLbl, timeVal, labFs, valFs, tc,
              sprinkleHudPulse > 0 ? (0.7 + sprinkleHudPulse * 0.3) : 1);

  // Clean meter - centred in the band the three readouts left behind. If the
  // readouts have eaten the whole row there IS no band, and the meter is
  // dropped rather than drawn on top of TIME.
  var bandL = pad + wl + cellGap;
  var bandR = rightX - ws - cellGap - wt - cellGap;
  var bandW = bandR - bandL;
  if (bandW >= barH * 2) {
    var mw = Math.min(clamp(W*0.35, 120, 240), bandW);
    var mx = bandL + (bandW - mw)/2;
    var meterH = labFs + 4*S + barH;
    var meterTop = midY - meterH/2;
    ctx.font = 'bold ' + fitBoldFs(cleanLbl, mw, labFs, 7) + 'px sans-serif';
    ctx.fillStyle = '#7c7c8e'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(cleanLbl, mx + mw/2, meterTop + labFs/2);
    ctx.textBaseline = 'alphabetic';
    var my = meterTop + labFs + 4*S;
    rr(ctx, mx, my, mw, barH, barH/2); ctx.fillStyle = 'rgba(255,255,255,0.1)'; ctx.fill();
    if (pct > 0) {
      var fg = ctx.createLinearGradient(mx, 0, mx+mw, 0);
      fg.addColorStop(0, '#2ecc71'); fg.addColorStop(1, '#1abc9c');
      rr(ctx, mx, my, mw*pct/100, barH, barH/2); ctx.fillStyle = fg; ctx.fill();
    }
  }

  // Best (small, below score on the right) - pulses gold when score has just beaten it
  if (best > 0) {
    var bestFs = clamp(11*S, 9, 14);
    ctx.font = 'bold '+bestFs+'px sans-serif';
    ctx.textAlign = 'right';
    if (bestPulse > 0) {
      ctx.fillStyle = '#FFD700';
      ctx.globalAlpha = 0.6 + bestPulse * 0.4;
    } else {
      ctx.fillStyle = '#777';
    }
    ctx.fillText(t('best')+': '+best, rightX, bh + topRightReserve() + bestFs + 4*S);
    ctx.globalAlpha = 1;
  }
  // iter#9: persistent best chain under the BEST line (only show after a chain exists)
  if (bestCombo > 1) {
    var chainFs = clamp(11*S, 9, 14);
    ctx.font = 'bold '+chainFs+'px sans-serif';
    ctx.textAlign = 'right';
    if (chainPulse > 0) {
      ctx.fillStyle = '#FFD700';
      ctx.globalAlpha = 0.6 + chainPulse * 0.4;
    } else {
      ctx.fillStyle = '#777';
    }
    var chainY = bh + topRightReserve() + chainFs*2 + 8*S;
    ctx.fillText(t('chain')+' '+t('chainBest')+': x'+bestCombo, W-pad, chainY);
    ctx.globalAlpha = 1;
  }

  // Combo badge
  if (combo > 1 && comboTimer > 0) {
    var alpha = Math.min(1, comboTimer);
    ctx.globalAlpha = alpha;
    var badgeY = H - 55*S;
    ctx.font = 'bold '+clamp(22*S,16,32)+'px sans-serif';
    ctx.fillStyle = '#FFD700'; ctx.textAlign = 'center';
    ctx.fillText(t('combo')+' x'+combo+'!', cx, badgeY);
    ctx.globalAlpha = 1;
  }
}

// ── DRAW MENU / END SCREENS ───────────────────────────────────────────────────
// The rect drawOverlay last drew its primary button at. Everything that
// stacks under that button (the rewarded revive chip, the leaderboard, the
// yesterday / 7-day pills) used to RE-DERIVE it as `cy + 20*S` with a
// clamp(52*S,40,66) height - which is only correct on the narrow path. On any
// window wider than 1.15:1 drawOverlay moves the button and scales it 1.4x,
// so every one of those consumers was positioned against a button that was no
// longer there. They now read the published rect instead.
var lastOverlayBtn = null;
function overlayBtnRect() {
  if (lastOverlayBtn) return lastOverlayBtn;
  var w = clamp(240*S, 160, 320), h = clamp(52*S, 40, 66);
  return { x: cx - w/2, y: cy + 20*S, w: w, h: h };
}
function drawOverlay(title, sub, btnText, btnFn, sub2) {
  buttons = [];
  // OPAQUE, not a translucent scrim. At 0.88 the live HUD and world showed
  // through on GAMEOVER - CLEAN%, TIME and BEST ghosting behind the title. It
  // is legible enough in isolation, but this game has twice been rejected for
  // «есть наложение», and text faintly behind other text is exactly what that
  // reads as in a reviewer screenshot. Nothing is layered under these screens
  // that the player still needs to see.
  ctx.fillStyle = '#080812';
  ctx.fillRect(0, 0, W, H);

  var titleFs = clamp(36*S, 22, 52);
  var subFs   = clamp(16*S, 12, 22);
  var isWide  = W / H > 1.15;
  var btnW    = clamp(240*S, 160, 320), btnH = clamp(52*S, 40, 66);
  if (isWide) { btnW = Math.round(btnW * 1.4); btnH = Math.round(btnH * 1.35); }
  // textBlockBottom: sub2 line or sub line; sub at cy-16*S, sub2 at cy+2*S
  var textBlockBottom = cy + (sub2 ? 2*S + subFs : sub ? -16*S + subFs : -50*S + titleFs);
  var clearMargin = btnH / 2 + 16;
  var wideFloor = H * 0.50;
  // Skin picker is below the button - cap so button bottom stays above H*0.62
  var wideCeil = H * 0.62 - btnH;
  // The cap must never win against the text clearance. On a very short wide
  // window wideCeil drops BELOW wideFloor, and the old
  // min(max(clearance, floor), ceil) then pulled the button UP over the
  // subtitle - at 1600x300 the RETRY pill swallowed the SCORE line entirely.
  var btnMinY = textBlockBottom + clearMargin;
  var btnY = isWide ? Math.max(btnMinY, Math.min(Math.max(btnMinY, wideFloor), Math.max(btnMinY, wideCeil)))
                    : cy + 20*S;
  var btnX    = cx - btnW/2;

  // glow effect behind title
  ctx.shadowColor = 'rgba(46,204,113,0.4)'; ctx.shadowBlur = 30*S;
  ctx.font = 'bold '+titleFs+'px sans-serif';
  ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  ctx.fillText(title, cx, cy - 50*S);
  ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0;

  if (sub) {
    ctx.font = subFs+'px sans-serif'; ctx.fillStyle = '#999';
    ctx.fillText(sub, cx, cy - 16*S);
  }
  if (sub2) {
    ctx.font = subFs+'px sans-serif'; ctx.fillStyle = '#aaa';
    ctx.fillText(sub2, cx, cy + 2*S);
  }

  // Button - hit rect at stable base position; pulse applied visually only on wide
  var drawBtnX = btnX, drawBtnY = btnY, drawBtnW = btnW, drawBtnH = btnH;
  if (isWide) {
    var t_pulse = performance.now() / 1000;
    var pulse = 1 + 0.05 * Math.sin(t_pulse * 2.2);
    var pw = btnW * pulse, ph = btnH * pulse;
    drawBtnX = cx - pw / 2; drawBtnY = btnY + (btnH - ph) / 2;
    drawBtnW = pw; drawBtnH = ph;
    ctx.shadowColor = 'rgba(46,204,113,0.55)';
    ctx.shadowBlur = 18 + 10 * Math.abs(Math.sin(t_pulse * 2.2));
  }
  var grad = ctx.createLinearGradient(drawBtnX, drawBtnY, drawBtnX, drawBtnY+drawBtnH);
  grad.addColorStop(0, '#2ecc71'); grad.addColorStop(1, '#27ae60');
  rr(ctx, drawBtnX, drawBtnY, drawBtnW, drawBtnH, drawBtnH/2);
  ctx.fillStyle = grad; ctx.fill();
  ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0;
  ctx.font = 'bold ' + fitBoldFs(btnText, btnW - 24*S, clamp((isWide?20:16)*S,14,26), 10) + 'px sans-serif';
  ctx.fillStyle = '#fff';
  ctx.textBaseline = 'middle';
  ctx.fillText(btnText, cx, btnY + btnH/2);
  ctx.textBaseline = 'alphabetic';

  lastOverlayBtn = { x: btnX, y: btnY, w: btnW, h: btnH };
  buttons.push({ x:btnX, y:btnY, w:btnW, h:btnH, fn:function(){ sfxClick(); btnFn(); } });

  if (best > 0) {
    ctx.font = clamp(13*S,10,17)+'px sans-serif'; ctx.fillStyle = '#555';
    ctx.fillText(t('best')+': '+best, cx, btnY+btnH+28*S);
  }
}

// ── LEVEL-END PANEL (MCPlay overlap rejection 2026-07-27) ────────────────────
// The level-end screen used to be four independent draws layered over one
// generic drawOverlay(), each positioned by hand-tuned offsets from cy:
//   * the star row was centred at cy-8*S, right on top of the SCORE line;
//   * the 'NEW BEST!' label sat at cy+~44*S - inside the NEXT LEVEL button;
//   * the '+N sprinkles' readout sat at cy+~84*S - also inside the button;
//   * TIME BONUS / PERFECT SWEEP spawned as world floats that bled through
//     the scrim into the same band.
// The reviewer's screenshot caught all four collisions in one frame. This
// replaces the lot with ONE measured vertical stack: every row declares its
// height up front, the stack is centred as a group and uniformly shrunk if the
// viewport is short, and the button owns its own row. No element can land on
// another at any viewport shape.
function drawLevelEndPanel(onNext) {
  buttons = [];
  // Opaque for the same reason as drawOverlay: at 0.92 the HUD behind the
  // level-complete stack stayed readable through it.
  ctx.fillStyle = '#080812';
  ctx.fillRect(0, 0, W, H);

  var isWide = W / H > 1.15;
  var titleFs = clamp(34*S, 20, 48);
  var subFs   = clamp(15*S, 11, 20);
  var tagFs   = clamp(12*S, 10, 16);
  var starSz  = clamp(34*S, 20, 46);
  var btnW    = clamp(240*S, 160, 320), btnH = clamp(52*S, 40, 66);
  if (isWide) { btnW = Math.round(btnW * 1.4); btnH = Math.round(btnH * 1.35); }
  var gap = clamp(10*S, 7, 16);
  var pillPadY = clamp(7*S, 5, 12);
  var boxChipH = clamp(42*S, 34, 54);

  // 1. Declare the rows. Nothing is drawn until the whole stack is measured.
  var rows = [{ kind:'title', h: titleFs * 1.15 }];
  if (lastLevelStars > 0) {
    rows.push({ kind:'stars', h: starSz * 1.3 });
    if (lastLevelStarsNewBest) rows.push({ kind:'newbest', h: tagFs * 1.6 });
  }
  if (lastLevelPerfect) rows.push({ kind:'perfect', h: tagFs + pillPadY*2 });
  rows.push({ kind:'score', h: subFs * 1.5 });
  if (lastLevelTimeBonus > 0)  rows.push({ kind:'bonus',     h: subFs * 1.4 });
  if (lastLevelSprinkles > 0)  rows.push({ kind:'sprinkles', h: subFs * 1.6 });
  rows.push({ kind:'button', h: btnH });
  // The rewarded donut box is offered here because clearing the level is what
  // MINTED the box. It is a row of the measured stack like everything else, so
  // it cannot land on NEXT LEVEL at any viewport.
  if (boxBtnVisible()) rows.push({ kind:'box', h: boxChipH });
  if (best > 0) rows.push({ kind:'best', h: tagFs * 1.9 });

  // 2. Measure, then fit. safeTop clears the WORKSHOP pill / mute button.
  var i, total = 0;
  for (i = 0; i < rows.length; i++) total += rows[i].h + (i ? gap : 0);
  var safeTop = clamp(58*S, 44, 96);
  var safeBot = clamp(16*S, 12, 30);
  var avail = H - safeTop - safeBot;
  // Shrink every row AND every gap by one factor rather than letting rows
  // collide on short viewports.
  var k = (total > avail && total > 0) ? Math.max(0.5, avail / total) : 1;
  if (k !== 1) {
    gap *= k; titleFs *= k; subFs *= k; tagFs *= k;
    starSz *= k; btnH *= k; btnW *= k; pillPadY *= k;
    total = 0;
    for (i = 0; i < rows.length; i++) { rows[i].h *= k; total += rows[i].h + (i ? gap : 0); }
  }

  // 3. Draw top-down. Each row only ever paints inside its own band.
  var y = safeTop + Math.max(0, (avail - total) / 2);
  ctx.textAlign = 'center';
  for (i = 0; i < rows.length; i++) {
    var r = rows[i], top = y, mid = y + r.h / 2;
    ctx.textBaseline = 'middle';
    if (r.kind === 'title') {
      ctx.shadowColor = 'rgba(46,204,113,0.4)'; ctx.shadowBlur = 30*S;
      ctx.font = 'bold ' + titleFs + 'px sans-serif';
      ctx.fillStyle = '#fff';
      ctx.fillText(t('complete'), cx, mid);
      ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0;
    } else if (r.kind === 'stars') {
      _starPulseT += 0.05;
      // Pulse stays <= 1 so a pulsing star can never grow into its neighbours.
      var pulse = 1 - (lastLevelStarsNewBest ? 0.06 : 0.02) * (0.5 + 0.5*Math.sin(_starPulseT * 4));
      var sGap = starSz * 0.34;
      var startX = cx - (starSz*3 + sGap*2)/2 + starSz/2;
      for (var si = 0; si < 3; si++) {
        var filled = (si < lastLevelStars);
        var sz = starSz * 0.92 * (filled ? pulse : 1);
        if (filled) { ctx.shadowColor = 'rgba(255,215,0,0.7)'; ctx.shadowBlur = 18*S; }
        drawStar(startX + si*(starSz + sGap), mid, sz, filled ? '#FFD700' : 'rgba(255,255,255,0.18)', null);
        ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0;
      }
    } else if (r.kind === 'newbest') {
      ctx.font = 'bold ' + tagFs + 'px sans-serif';
      ctx.fillStyle = '#FFD700';
      ctx.fillText(t('starsNewBest'), cx, mid);
    } else if (r.kind === 'perfect') {
      var pLabel = t('perfectSweep') + '  ' + t('perfectBonus');
      ctx.font = 'bold ' + tagFs + 'px sans-serif';
      var pw = ctx.measureText(pLabel).width + clamp(14*S, 10, 22) * 2;
      rr(ctx, cx - pw/2, top, pw, r.h, r.h/2);
      ctx.fillStyle = '#FFD700'; ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.4)'; ctx.lineWidth = 1.3 * S; ctx.stroke();
      ctx.fillStyle = '#1a1a2e';
      ctx.fillText(pLabel, cx, mid);
    } else if (r.kind === 'score') {
      ctx.font = 'bold ' + subFs + 'px sans-serif'; ctx.fillStyle = '#e8e8f0';
      ctx.fillText(t('score') + ': ' + score, cx, mid);
    } else if (r.kind === 'bonus') {
      ctx.font = subFs + 'px sans-serif'; ctx.fillStyle = '#2ecc71';
      ctx.fillText(t('bonus') + ' +' + lastLevelTimeBonus, cx, mid);
    } else if (r.kind === 'sprinkles') {
      ctx.font = 'bold ' + subFs + 'px sans-serif';
      var sLbl = '+' + lastLevelSprinkles;
      var sIc = subFs * 1.2;
      var sTw = ctx.measureText(sLbl).width;
      drawSprinkleIcon(cx - (sTw + sIc*0.9)/2 + sIc*0.4, mid, sIc, '#FFD700');
      ctx.fillStyle = '#FFE066'; ctx.textAlign = 'left';
      ctx.fillText(sLbl, cx - (sTw + sIc*0.9)/2 + sIc*1.1, mid);
      ctx.textAlign = 'center';
    } else if (r.kind === 'button') {
      var bx = cx - btnW/2;
      var grad = ctx.createLinearGradient(bx, top, bx, top + r.h);
      grad.addColorStop(0, '#2ecc71'); grad.addColorStop(1, '#27ae60');
      rr(ctx, bx, top, btnW, r.h, r.h/2);
      ctx.fillStyle = grad; ctx.fill();
      ctx.font = 'bold ' + fitBoldFs(t('next'), btnW - 24*S, clamp((isWide?20:16)*S*k, 13, 26), 10) + 'px sans-serif';
      ctx.fillStyle = '#fff';
      ctx.fillText(t('next'), cx, mid);
      buttons.push({ x:bx, y:top, w:btnW, h:r.h, fn:function(){ sfxClick(); onNext(); } });
    } else if (r.kind === 'box') {
      drawBoxChip(cx - btnW/2, top, btnW, r.h);
    } else if (r.kind === 'best') {
      ctx.font = tagFs + 'px sans-serif'; ctx.fillStyle = '#666';
      ctx.fillText(t('best') + ': ' + best, cx, mid);
    }
    y += r.h + gap;
  }
  ctx.textBaseline = 'alphabetic';
}

// Small "start over" text link under the MENU button, shown only once the
// player has progress to resume from (MCPlay 2026-07-27). Keeps CONTINUE from
// being a one-way door without adding a second competing pill.
function drawRestartLink() {
  var fs = clamp(12*S, 10, 15);
  var y = cy + 20*S + clamp(52*S, 40, 66) + clamp(48*S, 38, 62);
  ctx.font = fs + 'px sans-serif';
  ctx.fillStyle = '#7a7a8c';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  var label = t('startOver');
  var tw = ctx.measureText(label).width;
  ctx.fillText(label, cx, y);
  var padX = clamp(12*S, 8, 18), padY = clamp(8*S, 6, 12);
  buttons.push({ x: cx - tw/2 - padX, y: y - fs/2 - padY, w: tw + padX*2, h: fs + padY*2,
    fn: function() {
      sfxClick();
      // Resets the record on purpose. CONTINUE is the only entry point, so a
      // non-destructive "start over" would silently resume at the abandoned
      // level on the next reload - which is exactly the behaviour the save fix
      // exists to remove.
      progressLevel = 1; saveProgress();
      score = 0; maybeStartTutorial(); startLevel(1, true);
    } });
  ctx.textBaseline = 'alphabetic';
}

// iter#10: Big 3-star row drawn on LEVELEND between the title and the NEXT
// button. Filled gold stars for stars earned this clear; outline stars for
// the remainder. Subtle pulse + 'NEW BEST!' label when this clear beat the
// previously-saved best for this level.
// (Superseded on LEVELEND by drawLevelEndPanel above - kept for any other
// caller and because the star geometry is shared.)
var _starPulseT = 0;
function drawLevelEndStars() {
  if (!lastLevelStars) return;
  _starPulseT += 0.05;
  var size = clamp(38*S, 22, 54);
  var gap  = clamp(14*S, 10, 22);
  var totalW = size*3 + gap*2;
  var startX = cx - totalW/2 + size/2;
  var y = cy - 8*S;
  var pulse = 1 + Math.sin(_starPulseT * 4) * (lastLevelStarsNewBest ? 0.08 : 0.02);
  for (var i = 0; i < 3; i++) {
    var filled = (i < lastLevelStars);
    var px = startX + i*(size + gap);
    ctx.save();
    ctx.translate(px, y);
    ctx.scale(filled ? pulse : 1, filled ? pulse : 1);
    if (filled) {
      ctx.shadowColor = 'rgba(255,215,0,0.7)';
      ctx.shadowBlur = 18*S;
      drawStar(0, 0, size*0.92, '#FFD700', null);
      ctx.shadowColor = 'transparent';
    } else {
      drawStar(0, 0, size*0.92, 'rgba(255,255,255,0.18)', null);
    }
    ctx.restore();
  }
  if (lastLevelStarsNewBest) {
    var fs = clamp(13*S, 10, 16);
    ctx.font = 'bold ' + fs + 'px sans-serif';
    ctx.fillStyle = '#FFD700';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'alphabetic';
    ctx.fillText(t('starsNewBest'), cx, y + size*0.7 + fs);
  }
}

// iter#13: PERFECT SWEEP stamp drawn on LEVELEND. Renders only when the player
// cleared the level without ever letting the combo timer expire after the first
// pickup. Sits BELOW the star row and ABOVE the NEXT button so it doesn't fight
// either UI. Gold pill with subtle pulse - matches the +50 score bonus already
// granted on level clear.
var _perfectPulseT = 0;
function drawPerfectSweepStamp() {
  if (!lastLevelPerfect) return;
  _perfectPulseT += 0.07;
  var size = clamp(38*S, 22, 54);
  // Y mirrors drawLevelEndStars: stars centred at cy - 8*S; this stamp goes
  // ~size*1.0 below the stars so the NEW BEST sub-line (if present) doesn't
  // get sat-on. Stays well above the NEXT button (at cy + ~30*S).
  var y = cy - 8*S + size * 1.05;
  var fs = clamp(15*S, 12, 20);
  var pulse = 1 + Math.sin(_perfectPulseT * 5) * 0.04;
  var label = t('perfectSweep') + '  ' + t('perfectBonus');
  ctx.save();
  ctx.font = 'bold ' + fs + 'px sans-serif';
  ctx.textBaseline = 'middle';
  ctx.textAlign = 'center';
  var tw = ctx.measureText(label).width;
  var padX = clamp(14*S, 10, 22);
  var padY = clamp(7*S, 5, 12);
  var pw = (tw + padX * 2) * pulse;
  var ph = (fs + padY * 2) * pulse;
  var px = cx - pw/2;
  var py = y - ph/2;
  rr(ctx, px, py, pw, ph, ph/2);
  ctx.shadowColor = 'rgba(255,215,0,0.5)';
  ctx.shadowBlur = 14*S;
  ctx.fillStyle = '#FFD700';
  ctx.fill();
  ctx.shadowColor = 'transparent';
  ctx.strokeStyle = 'rgba(255,255,255,0.4)';
  ctx.lineWidth = 1.3 * S;
  ctx.stroke();
  ctx.fillStyle = '#1a1a2e';
  ctx.fillText(label, cx, y);
  ctx.restore();
}

// iter#10: Tiny *N/30 pill drawn on MENU near the top to show lifetime stars
// collected across all 10 levels (3 stars per level × 10 levels = 30 max).
// Sits in the top-left so it doesn't fight day-seed (centred-top), streak
// (above day-seed), mute (top-right), or the daily leaderboard cluster.
function drawTotalStarsPill() { drawTotalStarsPillAt(14*S, 14*S); }
function drawTotalStarsPillAt(px, py) {
  var total = totalLevelStars();
  if (total <= 0) return;
  var max = STARS_MAX_LEVEL * 3;
  var fs = clamp(13*S, 11, 16);
  var padX = clamp(10*S, 7, 14), padY = clamp(6*S, 4, 10);
  var label = total + '/' + max;
  var iconSz = fs * 1.15;
  ctx.save();
  ctx.font = 'bold ' + fs + 'px sans-serif';
  ctx.textBaseline = 'middle';
  ctx.textAlign = 'left';
  var tw = ctx.measureText(label).width;
  var pw = tw + iconSz + 5*S + padX*2;
  var ph = fs + padY*2;
  rr(ctx, px, py, pw, ph, ph/2);
  ctx.fillStyle = 'rgba(40,30,8,0.7)';
  ctx.fill();
  ctx.strokeStyle = 'rgba(255,215,0,0.5)';
  ctx.lineWidth = 1.2 * S;
  ctx.stroke();
  drawStar(px + padX + iconSz/2, py + ph/2, iconSz, '#FFD700', null);
  ctx.fillStyle = '#FFD700';
  ctx.fillText(label, px + padX + iconSz + 5*S, py + ph/2);
  ctx.restore();
}

// iter#9: Small max-chain summary line drawn on GAMEOVER only. Sits to the
// LEFT of the title row so it doesn't fight the leaderboard / NEW BEST banner
// / skin picker. Uses tiny font; only renders when player actually built a
// chain this run.
function drawChainSummary(yTop, measure) {
  if (maxComboThisRun < 2) return 0;
  var fs = clamp(13*S, 10, 16);
  var mH = fs * 1.45;
  if (measure) return mH;
  var y = (yTop !== undefined) ? (yTop + mH - fs*0.30) : (cy - 75*S);
  ctx.save();
  ctx.font = 'bold '+fs+'px sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'alphabetic';
  if (newBestCombo) {
    // gold treatment when this run set a new lifetime ceiling
    ctx.shadowColor = 'rgba(255,215,0,0.6)';
    ctx.shadowBlur = 14*S;
    ctx.fillStyle = '#FFD700';
    ctx.fillText(t('chain')+' x'+maxComboThisRun+'  '+t('chainNew'), cx, y);
    ctx.shadowColor = 'transparent';
  } else {
    ctx.fillStyle = '#aaa';
    var line = t('chain')+' x'+maxComboThisRun;
    if (bestCombo > 1) line += '  ('+t('chainBest')+' x'+bestCombo+')';
    ctx.fillText(line, cx, y);
  }
  ctx.restore();
  return mH;
}

// Yellow celebratory NEW BEST! banner - drawn over the GAMEOVER overlay when
// the player just beat their saved high score this run.
var newBestAnim = 0;
function drawNewBestBanner(yTop, measure) {
  var mH = clamp(28*S, 18, 40) * 1.30;   // includes the pulse headroom
  if (measure) return mH;
  newBestAnim += 0.04;
  var pulse = 1 + Math.sin(newBestAnim * 3) * 0.06;
  var bannerFs = clamp(28*S, 18, 40) * pulse;
  var bannerY = (yTop !== undefined) ? (yTop + mH/2) : (cy - 110*S);

  ctx.save();
  // soft glow halo
  ctx.shadowColor = 'rgba(255,215,0,0.85)';
  ctx.shadowBlur = 30*S;
  ctx.font = 'bold '+bannerFs+'px sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  // outline
  ctx.strokeStyle = 'rgba(120,80,0,0.9)';
  ctx.lineWidth = 5*S;
  ctx.strokeText(t('newbest'), cx, bannerY);
  // gold fill
  ctx.fillStyle = '#FFD700';
  ctx.fillText(t('newbest'), cx, bannerY);
  ctx.restore();

  // sparkle particles around banner
  if (Math.random() < 0.4) {
    var ax = cx + (Math.random()-0.5) * 240*S;
    var ay = bannerY + (Math.random()-0.5) * 50*S;
    spawnParticles(ax, ay, '#FFD700', 1);
  }
  return mH;
}

// ── DRAW DAY SEED BADGE (iter#4) ─────────────────────────────────────────────
// Tiny, low-key label that prints today's UTC date + the seed number so
// players see "everyone's playing the same layout today". Drawn near the top
// of the MENU/GAMEOVER overlay so it sits naturally above the title.
function drawDaySeedBadge(yTop, measure) {
  // height includes the "same layout for everyone today" sub-line
  var mH = clamp(11*S, 9, 14) + 5*S*2 + clamp(10*S, 8, 13) + 4*S;
  if (measure) return mH;
  var dateKey = getDayKey();
  var seedNum = getDaySeed();
  var fs = clamp(11*S, 9, 14);
  ctx.save();
  ctx.font = 'bold '+fs+'px sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'alphabetic';
  // teal pill bg
  var label = t('daySeed') + ' · ' + dateKey;
  var padX = 12*S, padY = 5*S;
  var w = ctx.measureText(label).width + padX*2;
  var h = fs + padY*2;
  var bx = cx - w/2, by = (yTop !== undefined) ? yTop : cy - 130*S;
  ctx.fillStyle = 'rgba(72,201,176,0.18)';
  rr(ctx, bx, by, w, h, h/2);
  ctx.fill();
  ctx.fillStyle = '#48c9b0';
  ctx.fillText(label, cx, by + h - padY - 1*S);
  // sub-line
  var subFs = clamp(10*S, 8, 13);
  ctx.font = subFs+'px sans-serif';
  ctx.fillStyle = '#666';
  ctx.fillText(t('sameLayout'), cx, by + h + subFs + 4*S);
  ctx.restore();
  return mH;
}

// ── DRAW STREAK PILL (iter#5) ────────────────────────────────────────────────
// Small flame-orange pill above the day-seed badge. Shows current streak count
// + "come back tomorrow" sub-line. Pulses on first frame of the visit that
// incremented the streak. No-op when streak is 0 (defensive).
var _streakAnim = 0;
// `yTop` overrides the legacy fixed offset so the GAMEOVER cluster can stack
// these pills without them landing on each other; `measure` returns the height
// without drawing. Called with no arguments (MENU) it behaves exactly as before.
function drawStreakPill(yTop, measure) {
  if (streak <= 0) return 0;
  var mFs = clamp(11*S, 9, 14);
  var mH = mFs + 5*S*2 + (streakBumped ? clamp(10*S, 8, 13) + 4*S : 0);
  if (measure) return mH;
  _streakAnim += 0.06;
  var pulse = streakBumped ? (1 + Math.sin(_streakAnim * 4) * 0.07) : 1;
  var fs = clamp(11*S, 9, 14) * pulse;
  ctx.save();
  ctx.font = 'bold '+fs+'px sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'alphabetic';
  // flame icon (vector) + count text
  var label = streak + ' ' + t('streakDays');
  var iconSz = fs * 1.3;
  var padX = 12*S, padY = 5*S;
  var w = ctx.measureText(label).width + iconSz + 6*S + padX*2;
  var h = fs + padY*2;
  var bx = cx - w/2;
  var by = (yTop !== undefined) ? yTop : cy - 170*S;
  // pill bg - flame orange, slightly stronger when bumped
  ctx.fillStyle = streakBumped ? 'rgba(255,140,50,0.32)' : 'rgba(255,140,50,0.18)';
  rr(ctx, bx, by, w, h, h/2);
  ctx.fill();
  drawFlameIcon(bx + padX + iconSz/2, by + h/2, iconSz, '#ff944d');
  ctx.fillStyle = '#ff944d';
  ctx.textAlign = 'left';
  ctx.fillText(label, bx + padX + iconSz + 6*S, by + h - padY - 1*S);
  ctx.textAlign = 'center';
  // sub-line only on first visit of the day (don't shout at returning players)
  if (streakBumped) {
    var subFs = clamp(10*S, 8, 13);
    ctx.font = subFs+'px sans-serif';
    ctx.fillStyle = '#888';
    ctx.fillText(t('comeBack'), cx, by + h + subFs + 4*S);
  }
  ctx.restore();
  return mH;
}

// ── DRAW ACHIEVEMENT ROW (iter#6) ────────────────────────────────────────────
// Compact 5-icon row drawn at a given vertical centre. Unlocked badges glow,
// locked ones are dimmed + monochrome. Pure display - no input wiring (badges
// are passive milestone markers, tapping them shouldn't do anything).
function drawAchievementRow(yCenter) {
  var iconFs = clamp(20*S, 14, 26);
  var labelFs = clamp(10*S, 8, 13);
  var slotW = iconFs * 2.2;
  var totalW = slotW * (ACHIEVEMENTS.length - 1);
  var startX = cx - totalW / 2;

  // header label "BADGES  3/5"
  ctx.save();
  ctx.font = 'bold '+labelFs+'px sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = '#888';
  ctx.fillText(t('badges') + '  ' + achUnlockedCount() + '/' + ACHIEVEMENTS.length,
               cx, yCenter - iconFs - 4*S);

  for (var i = 0; i < ACHIEVEMENTS.length; i++) {
    var a = ACHIEVEMENTS[i];
    var unlocked = !!achUnlocked[a.id];
    var bx = startX + i * slotW;
    if (unlocked) {
      ctx.globalAlpha = 1;
      ctx.shadowColor = 'rgba(255,200,80,0.55)';
      ctx.shadowBlur = 12*S;
      drawBadgeIcon(a.id, bx, yCenter, iconFs, '#ffd57a');
      ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0;
    } else {
      ctx.globalAlpha = 0.32;
      drawBadgeIcon(a.id, bx, yCenter, iconFs, '#888');
      ctx.globalAlpha = 1;
    }
  }
  ctx.restore();
}

// ── DRAW ACHIEVEMENT TOAST (iter#6) ──────────────────────────────────────────
// In-run popup on the frame an unlock fires. Sits high on the screen so it
// doesn't collide with the day-seed/streak pills on the menus, or the score HUD.
function drawAchievementToast() {
  if (!achToastActive) return;
  var ach = null;
  for (var i=0;i<ACHIEVEMENTS.length;i++) if (ACHIEVEMENTS[i].id === achToastActive.id) ach = ACHIEVEMENTS[i];
  if (!ach) return;
  var life = achToastActive.life;
  var alpha = life < 0.15 ? life / 0.15 : 1;
  var fs = clamp(13*S, 10, 17);
  var iconFs = clamp(20*S, 14, 26);
  var headFs = clamp(11*S, 9, 14);
  var label = t(ach.tKey);
  var heading = t('badgeUnlocked');
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.font = 'bold '+fs+'px sans-serif';
  var w1 = ctx.measureText(label).width;
  ctx.font = 'bold '+headFs+'px sans-serif';
  var w2 = ctx.measureText(heading).width;
  var w = Math.max(w1, w2) + iconFs + 28*S;
  var h = iconFs + fs + 22*S;
  var bx = cx - w/2, by = toastBandY();
  // warm glow pill
  ctx.shadowColor = 'rgba(255,200,80,0.55)';
  ctx.shadowBlur = 20*S;
  ctx.fillStyle = 'rgba(20,16,8,0.92)';
  rr(ctx, bx, by, w, h, h/2);
  ctx.fill();
  ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0;
  // border accent
  ctx.strokeStyle = '#ffd57a';
  ctx.lineWidth = 2*S;
  rr(ctx, bx, by, w, h, h/2);
  ctx.stroke();
  // icon (vector)
  drawBadgeIcon(ach.id, bx + 14*S + iconFs/2, by + h/2, iconFs, '#ffd57a');
  // heading + label
  ctx.textAlign = 'left';
  ctx.font = 'bold '+headFs+'px sans-serif';
  ctx.fillStyle = '#ffd57a';
  ctx.textBaseline = 'alphabetic';
  ctx.fillText(heading, bx + 14*S + iconFs + 10*S, by + headFs + 4*S);
  ctx.font = 'bold '+fs+'px sans-serif';
  ctx.fillStyle = '#fff';
  ctx.fillText(label, bx + 14*S + iconFs + 10*S, by + h - 7*S);
  ctx.restore();
}

// ════════════════════════════════════════════════════════════════════════════
// ── VECTOR ICONS (milestone#1 - replace ALL emoji; emoji = tofu on headless/
//    Android per Game Build Hygiene #1). Each draws centred at (x,y), size sz.
// ════════════════════════════════════════════════════════════════════════════
function drawSpeakerIcon(x, y, sz, muted) {
  ctx.save(); ctx.translate(x, y);
  var s = sz / 2;
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.moveTo(-s*0.7, -s*0.28); ctx.lineTo(-s*0.28, -s*0.28);
  ctx.lineTo(s*0.05, -s*0.6); ctx.lineTo(s*0.05, s*0.6);
  ctx.lineTo(-s*0.28, s*0.28); ctx.lineTo(-s*0.7, s*0.28); ctx.closePath(); ctx.fill();
  if (muted) {
    ctx.strokeStyle = '#ff8080'; ctx.lineWidth = Math.max(2, sz*0.08); ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(s*0.28, -s*0.32); ctx.lineTo(s*0.72, s*0.32);
    ctx.moveTo(s*0.72, -s*0.32); ctx.lineTo(s*0.28, s*0.32); ctx.stroke();
  } else {
    ctx.strokeStyle = '#fff'; ctx.lineWidth = Math.max(1.5, sz*0.06); ctx.lineCap = 'round';
    ctx.beginPath(); ctx.arc(s*0.18, 0, s*0.4, -Math.PI/3, Math.PI/3); ctx.stroke();
    ctx.beginPath(); ctx.arc(s*0.18, 0, s*0.62, -Math.PI/3.2, Math.PI/3.2); ctx.stroke();
  }
  ctx.restore();
}
function drawPlayTvIcon(x, y, sz, col) {
  // a small "rewarded video" glyph: rounded screen + play triangle
  ctx.save(); ctx.translate(x, y);
  var w = sz, h = sz * 0.74;
  rr(ctx, -w/2, -h/2, w, h, sz*0.14);
  ctx.fillStyle = col || '#1a1a2e'; ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.55)'; ctx.lineWidth = Math.max(1.4, sz*0.06); ctx.stroke();
  ctx.fillStyle = col || '#1a1a2e';
  ctx.beginPath();
  ctx.moveTo(-sz*0.12, -sz*0.18); ctx.lineTo(sz*0.2, 0); ctx.lineTo(-sz*0.12, sz*0.18); ctx.closePath();
  ctx.fillStyle = 'rgba(255,255,255,0.92)'; ctx.fill();
  ctx.restore();
}
function drawFlameIcon(x, y, sz, col) {
  ctx.save(); ctx.translate(x, y);
  var s = sz / 2;
  ctx.beginPath();
  ctx.moveTo(0, -s);
  ctx.bezierCurveTo(s*0.9, -s*0.2, s*0.5, s*0.9, 0, s);
  ctx.bezierCurveTo(-s*0.55, s*0.9, -s*0.85, -s*0.05, 0, -s);
  ctx.closePath();
  ctx.fillStyle = col || '#ff944d'; ctx.fill();
  ctx.beginPath();
  ctx.moveTo(0, -s*0.1);
  ctx.bezierCurveTo(s*0.42, s*0.2, s*0.22, s*0.7, 0, s*0.75);
  ctx.bezierCurveTo(-s*0.28, s*0.7, -s*0.36, s*0.12, 0, -s*0.1);
  ctx.closePath();
  ctx.fillStyle = 'rgba(255,235,120,0.9)'; ctx.fill();
  ctx.restore();
}
// Sprinkle (the currency) - a chunky rounded capsule like a real sprinkle, gold.
function drawSprinkleIcon(x, y, sz, col) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(-0.5);
  var w = sz, h = sz * 0.42;
  rr(ctx, -w/2, -h/2, w, h, h/2);
  var g = ctx.createLinearGradient(-w/2, 0, w/2, 0);
  g.addColorStop(0, '#FFF1A8'); g.addColorStop(0.5, col || '#FFD700'); g.addColorStop(1, '#E0A800');
  ctx.fillStyle = g; ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.5)';
  rr(ctx, -w*0.34, -h*0.28, w*0.5, h*0.26, h*0.13); ctx.fill();
  ctx.restore();
}
// Per-tool vector icon, switched on tool id. Drawn centred at (x,y), size sz.
function drawToolIcon(id, x, y, sz, col) {
  ctx.save(); ctx.translate(x, y);
  var s = sz / 2;
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.strokeStyle = col; ctx.fillStyle = col; ctx.lineWidth = Math.max(2, sz*0.085);
  if (id === 'mop') {                    // mop: handle + fan of strands
    ctx.beginPath(); ctx.moveTo(-s*0.5, -s*0.7); ctx.lineTo(s*0.2, s*0.1); ctx.stroke();
    ctx.beginPath();
    for (var i=-2;i<=2;i++){ ctx.moveTo(s*0.2, s*0.1); ctx.lineTo(s*0.2 + i*s*0.16, s*0.72); }
    ctx.stroke();
  } else if (id === 'wax') {             // wax: shine sparkle (4-point)
    ctx.beginPath();
    ctx.moveTo(0,-s*0.85); ctx.lineTo(s*0.18,-s*0.18); ctx.lineTo(s*0.85,0); ctx.lineTo(s*0.18,s*0.18);
    ctx.lineTo(0,s*0.85); ctx.lineTo(-s*0.18,s*0.18); ctx.lineTo(-s*0.85,0); ctx.lineTo(-s*0.18,-s*0.18);
    ctx.closePath(); ctx.fill();
  } else if (id === 'timer') {           // fresh batch: clock
    ctx.beginPath(); ctx.arc(0,0,s*0.8,0,Math.PI*2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(0,-s*0.5); ctx.moveTo(0,0); ctx.lineTo(s*0.4,s*0.2); ctx.stroke();
  } else if (id === 'magnet') {          // magnet: horseshoe
    ctx.lineWidth = Math.max(2.5, sz*0.13);
    ctx.beginPath(); ctx.arc(0,-s*0.1,s*0.55,Math.PI,0); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-s*0.55,-s*0.1); ctx.lineTo(-s*0.55,s*0.6);
    ctx.moveTo(s*0.55,-s*0.1); ctx.lineTo(s*0.55,s*0.6); ctx.stroke();
  } else if (id === 'combo') {           // combo glaze: chain links
    ctx.beginPath(); ctx.arc(-s*0.3,0,s*0.34,0,Math.PI*2); ctx.stroke();
    ctx.beginPath(); ctx.arc(s*0.3,0,s*0.34,0,Math.PI*2); ctx.stroke();
  } else if (id === 'earn') {            // tip jar: sprinkle on a jar
    rr(ctx, -s*0.5, -s*0.2, s, s*0.95, s*0.18); ctx.stroke();
    drawSprinkleIcon(0, -s*0.55, sz*0.55, col);
  } else if (id === 'shield') {          // crumb shield: shield outline
    ctx.beginPath();
    ctx.moveTo(0,-s*0.85); ctx.lineTo(s*0.7,-s*0.5); ctx.lineTo(s*0.7,s*0.1);
    ctx.bezierCurveTo(s*0.7,s*0.6,0,s*0.9,0,s*0.9);
    ctx.bezierCurveTo(0,s*0.9,-s*0.7,s*0.6,-s*0.7,s*0.1);
    ctx.lineTo(-s*0.7,-s*0.5); ctx.closePath(); ctx.stroke();
  } else if (id === 'golden') {          // golden roller: 5-point star
    ctx.beginPath();
    for (var k=0;k<10;k++){ var a=-Math.PI/2+k*Math.PI/5; var rr2=(k%2===0)?s*0.85:s*0.38; var px=Math.cos(a)*rr2, py=Math.sin(a)*rr2; if(k===0)ctx.moveTo(px,py); else ctx.lineTo(px,py); }
    ctx.closePath(); ctx.fill();
  } else {                                // fallback: filled dot
    ctx.beginPath(); ctx.arc(0,0,s*0.6,0,Math.PI*2); ctx.fill();
  }
  ctx.restore();
}
// 5-point star (vector) - replaces the * glyph (load-bearing star ratings).
function drawStar(x, y, sz, fill, stroke) {
  ctx.save(); ctx.translate(x, y);
  var s = sz / 2;
  ctx.beginPath();
  for (var k = 0; k < 10; k++) {
    var a = -Math.PI/2 + k * Math.PI/5;
    var rad = (k % 2 === 0) ? s : s * 0.42;
    var px = Math.cos(a) * rad, py = Math.sin(a) * rad;
    if (k === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  }
  ctx.closePath();
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = Math.max(1.4, sz*0.06); ctx.stroke(); }
  ctx.restore();
}
// Badge icons (iter#6) as vector shapes - replaces emoji badges.
function drawBadgeIcon(id, x, y, sz, col) {
  ctx.save(); ctx.translate(x, y);
  var s = sz / 2;
  ctx.strokeStyle = col; ctx.fillStyle = col; ctx.lineWidth = Math.max(2, sz*0.085);
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  if (id === 'first_sweep') { drawToolIcon('mop', 0, 0, sz, col); }
  else if (id === 'combo_5') { drawFlameIcon(0, 0, sz*0.95, col); }
  else if (id === 'combo_10') {            // bolt
    ctx.beginPath();
    ctx.moveTo(s*0.15,-s*0.85); ctx.lineTo(-s*0.4,s*0.12); ctx.lineTo(0,s*0.12);
    ctx.lineTo(-s*0.15,s*0.85); ctx.lineTo(s*0.45,-s*0.18); ctx.lineTo(0,-s*0.18); ctx.closePath(); ctx.fill();
  } else if (id === 'level_3') {           // target
    ctx.beginPath(); ctx.arc(0,0,s*0.8,0,Math.PI*2); ctx.stroke();
    ctx.beginPath(); ctx.arc(0,0,s*0.42,0,Math.PI*2); ctx.stroke();
    ctx.beginPath(); ctx.arc(0,0,s*0.1,0,Math.PI*2); ctx.fill();
  } else if (id === 'level_5') {           // crown
    ctx.beginPath();
    ctx.moveTo(-s*0.75,s*0.5); ctx.lineTo(-s*0.75,-s*0.35); ctx.lineTo(-s*0.3,s*0.05);
    ctx.lineTo(0,-s*0.55); ctx.lineTo(s*0.3,s*0.05); ctx.lineTo(s*0.75,-s*0.35);
    ctx.lineTo(s*0.75,s*0.5); ctx.closePath(); ctx.fill();
  } else { ctx.beginPath(); ctx.arc(0,0,s*0.6,0,Math.PI*2); ctx.fill(); }
  ctx.restore();
}

// ── DRAW SKIN SELECTOR (iter#3) ──────────────────────────────────────────────
// iter#8: Mute button - 36×36 circle in top-right corner of the canvas.
// Drawn on MENU + GAMEOVER overlays ONLY (never during PLAYING so it
// can't overlap the HUD or compete with the combo badge). Sits in the
// top-right where no existing UI ever renders. Click toggles SFX.
function drawMuteButton() {
  var inset = platformSafeInsets();
  var sz   = clamp(36*S, 28, 48);
  var pad  = clamp(14*S, 10, 20);
  var bx   = W - inset.right - pad - sz;
  var by   = pad;
  muteBtnRect = { x: bx, y: by, w: sz, h: sz };
  // background pill
  ctx.save();
  rr(ctx, bx, by, sz, sz, sz/2);
  ctx.fillStyle = sfxMuted ? 'rgba(60,20,28,0.85)' : 'rgba(20,40,60,0.85)';
  ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.22)';
  ctx.lineWidth = 1.4 * S;
  ctx.stroke();
  // icon (vector - no emoji tofu)
  drawSpeakerIcon(bx + sz/2, by + sz/2, sz*0.52, sfxMuted);
  ctx.restore();
  buttons.push({ x: bx, y: by, w: sz, h: sz, fn: toggleMute });
}

// Renders the cosmetic donut row on MENU + GAMEOVER - now a single CASE pill
// rather than one swatch per donut. The roster grew from 4 to 20 (donut boxes),
// and the old row laid every skin out at a fixed 90px pitch centred on cx: at
// twenty entries that is 1710px of swatches, i.e. guaranteed off-screen clipping
// at every viewport a reviewer uses (ledger defect class 4). The pill shows the
// equipped donut plus "COLLECTED n / 20" and opens the browsable case.
var SPRINKLE_PALETTE = ['#FF6B6B','#4ECDC4','#FFE66D','#A78BFA','#FB923C'];
// One donut renderer, shared by the case grid, the reveal panel and the pill,
// so a donut looks the same everywhere it appears. Deterministic - no
// per-frame randomness, which a reviewer reads as flicker.
function drawDonutTopping(x, y, r, hole, skin) {
  var midR = hole + (r - hole) * 0.55;
  var i, a;
  if (skin.top === 'sprinkles') {
    for (i = 0; i < 8; i++) {
      a = (i / 8) * Math.PI * 2 + 0.4;
      ctx.save();
      ctx.translate(x + Math.cos(a)*midR, y + Math.sin(a)*midR);
      ctx.rotate(a + Math.PI/2);
      ctx.fillStyle = skin.top2 || SPRINKLE_PALETTE[i % SPRINKLE_PALETTE.length];
      ctx.fillRect(-r*0.13, -r*0.045, r*0.26, r*0.09);
      ctx.restore();
    }
  } else if (skin.top === 'dots') {
    for (i = 0; i < 7; i++) {
      a = (i / 7) * Math.PI * 2;
      ctx.beginPath();
      ctx.arc(x + Math.cos(a)*midR, y + Math.sin(a)*midR, r*0.09, 0, Math.PI*2);
      ctx.fillStyle = skin.top2 || '#fff'; ctx.fill();
    }
