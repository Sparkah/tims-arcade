  } else if (skin.top === 'drizzle') {
    ctx.strokeStyle = skin.top2 || '#fff';
    ctx.lineWidth = Math.max(1, r*0.09); ctx.lineCap = 'round';
    for (i = 0; i < 5; i++) {
      a = (i / 5) * Math.PI * 2 + 0.3;
      ctx.beginPath();
      ctx.moveTo(x + Math.cos(a)*hole*1.3, y + Math.sin(a)*hole*1.3);
      ctx.lineTo(x + Math.cos(a + 0.55)*r*0.85, y + Math.sin(a + 0.55)*r*0.85);
      ctx.stroke();
    }
  } else if (skin.top === 'stripe') {
    ctx.strokeStyle = skin.top2 || '#fff';
    ctx.lineWidth = Math.max(1, r*0.12); ctx.lineCap = 'butt';
    for (i = 0; i < 6; i++) {
      a = (i / 6) * Math.PI * 2;
      ctx.beginPath();
      ctx.moveTo(x + Math.cos(a)*hole*1.25, y + Math.sin(a)*hole*1.25);
      ctx.lineTo(x + Math.cos(a)*r*0.85, y + Math.sin(a)*r*0.85);
      ctx.stroke();
    }
  } else if (skin.top === 'crumbs') {
    for (i = 0; i < 11; i++) {
      a = (i / 11) * Math.PI * 3.4;
      var cr = hole*1.3 + ((i * 37) % 100) / 100 * (r*0.80 - hole*1.3);
      ctx.beginPath();
      ctx.arc(x + Math.cos(a)*cr, y + Math.sin(a)*cr, r*0.055, 0, Math.PI*2);
      ctx.fillStyle = skin.top2 || '#fff'; ctx.fill();
    }
  } else if (skin.top === 'swirl') {
    ctx.strokeStyle = skin.top2 || '#fff';
    ctx.lineWidth = Math.max(1, r*0.09); ctx.lineCap = 'round';
    ctx.beginPath();
    for (i = 0; i <= 40; i++) {
      var f = i / 40, ang = f * Math.PI * 4;
      var rad = hole*1.3 + f * (r*0.83 - hole*1.3);
      var px = x + Math.cos(ang)*rad, py = y + Math.sin(ang)*rad;
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.stroke();
  } else if (skin.top === 'stars') {
    for (i = 0; i < 6; i++) {
      a = (i / 6) * Math.PI * 2 + 0.25;
      drawStar(x + Math.cos(a)*midR, y + Math.sin(a)*midR, r*0.26, skin.top2 || '#FFD700', null);
    }
  }
}
function drawDonutSwatch(x, y, r, skin, alpha) {
  var hole = r * 0.40;
  ctx.save();
  ctx.globalAlpha = (alpha === undefined ? 1 : alpha);
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2);
  ctx.arc(x, y, hole, 0, Math.PI*2, true);
  ctx.fillStyle = '#F5DEB3'; ctx.fill();
  ctx.beginPath(); ctx.arc(x, y, r*0.88, 0, Math.PI*2);
  ctx.arc(x, y, hole*1.18, 0, Math.PI*2, true);
  ctx.fillStyle = skin.ring; ctx.fill();
  ctx.beginPath(); ctx.arc(x - r*0.24, y - r*0.26, r*0.22, 0, Math.PI*2);
  ctx.fillStyle = 'rgba(255,255,255,0.30)'; ctx.fill();
  drawDonutTopping(x, y, r, hole, skin);
  ctx.restore();
}
// A locked slot: donut silhouette + a small GIFT BOX telling the player this
// one arrives in a donut box. It used to draw a literal '?' glyph, which is the
// one symbol a reviewer reads as a help button - and a help affordance that does
// nothing reads as broken. The requirement itself lives in the case header,
// which states both the count and where boxes come from (ledger defect class 7).
// Vector-drawn, never emoji (Game Build Hygiene #1: emoji are tofu on headless
// and on some Android builds).
function drawLockedSlot(x, y, r) {
  ctx.save();
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2);
  ctx.arc(x, y, r*0.40, 0, Math.PI*2, true);
  ctx.fillStyle = 'rgba(255,255,255,0.07)'; ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.16)'; ctx.lineWidth = Math.max(1, r*0.07);
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2); ctx.stroke();
  drawGiftIcon(x, y, r * 0.86, 'rgba(255,215,0,0.42)');
  ctx.restore();
}
// Gift box: lid, body, one vertical ribbon and a small bow. `sz` is the full
// footprint, so it scales with whatever slot or pill hosts it.
function drawGiftIcon(x, y, sz, col) {
  var w = sz * 0.62, h = sz * 0.54;
  var lidH = h * 0.30;
  var bodyTop = y - h/2 + lidH;
  ctx.save();
  ctx.fillStyle = col;
  // body + lid
  ctx.fillRect(x - w/2, bodyTop, w, h - lidH);
  ctx.fillRect(x - w*0.58, y - h/2, w*1.16, lidH);
  // ribbon down the body, punched out so it reads at small sizes
  ctx.fillStyle = 'rgba(0,0,0,0.34)';
  ctx.fillRect(x - w*0.09, bodyTop, w*0.18, h - lidH);
  // bow: two loops above the lid
  ctx.fillStyle = col;
  ctx.beginPath();
  ctx.ellipse(x - w*0.20, y - h/2 - lidH*0.42, w*0.20, lidH*0.46, -0.35, 0, Math.PI*2);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(x + w*0.20, y - h/2 - lidH*0.42, w*0.20, lidH*0.46, 0.35, 0, Math.PI*2);
  ctx.fill();
  ctx.restore();
}
function drawCasePill(yCenter) {
  var fs = clamp(12*S, 10, 15);
  var swR = clamp(13*S, 10, 17);
  var label = t('caseCount') + ' ' + donutOwnedCount() + ' / ' + donutTotal();
  ctx.font = 'bold ' + fs + 'px sans-serif';
  var padX = clamp(13*S, 10, 18);
  var w = ctx.measureText(label).width + swR*2 + 8*S + padX*2;
  var h = Math.max(fs + clamp(14*S, 10, 20), swR*2 + 8*S);
  var x = cx - w/2, y = yCenter - h/2;
  rr(ctx, x, y, w, h, h/2);
  ctx.fillStyle = 'rgba(255,215,0,0.12)'; ctx.fill();
  ctx.strokeStyle = 'rgba(255,215,0,0.45)'; ctx.lineWidth = 1.2*S; ctx.stroke();
  drawDonutSwatch(x + padX + swR, y + h/2, swR, getSkin(skinId), 1);
  ctx.fillStyle = '#FFE066'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.fillText(label, x + padX + swR*2 + 8*S, y + h/2);
  // A box waiting to be opened gets a dot, same language as the quest badge.
  if (boxBtnVisible()) {
    var bdR = clamp(6*S, 5, 9);
    ctx.beginPath(); ctx.arc(x + w - bdR - 2*S, y + bdR + 1*S, bdR, 0, Math.PI*2);
    ctx.fillStyle = '#2ecc71'; ctx.fill();
  }
  ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  buttons.push({ x:x, y:y, w:w, h:h, fn: function(){ workshopTab = 'case'; openWorkshop(); } });
}

// ── THE UNDER-HUD BAND, MEASURED ONCE ────────────────────────────────────────
// The strip below the HUD bar is shared by the WORKSHOP pill, the sprinkle
// bank, the tutorial SKIP button, the BEST / CHAIN readout and the unlock
// toasts. Every one of them used to pick its own constant offset from
// HUD_H*S, so whichever combination happened to be on screen collided: the
// badge toast printed over the sprinkle bank, and "BEST: 1" was drawn straight
// through the SKIP button on the very first screen a reviewer sees. These
// three helpers are the single source of that geometry.
function metaRowBottom() {           // bottom of the WORKSHOP pill / bank row
  return HUD_H * S + 8*S + clamp(26*S, 20, 34);
}
function topRightReserve() {         // height the tutorial SKIP button owns
  if (!tut || !tut.active || gs !== 'PLAYING') return 0;
  return clamp(11*S, 9, 14) + 12*S + 10*S;
}
function toastBandY() {              // top of the single pill-toast row
  return metaRowBottom() + 8*S;
}

// ── ONE PILL TOAST AT A TIME (MCPlay ledger defect class 2) ──────────────────
// The badge, skin-unlock and tool-unlock pills each sat at their OWN fixed
// offset in the same band under the HUD (HUD_H*S + 10/30/44*S) and were drawn
// independently, so any two firing together printed text straight over text -
// a level clear that unlocked a donut AND a badge rendered both pills on top of
// each other and neither could be read. Exactly one owns the band at a time;
// the losers keep their full duration (their timers are frozen in update()) and
// take their turn afterwards.
function pillToastOwner() {
  // The box reveal is a full-screen modal; a pill toast printed over it is the
  // same text-over-text class as the toasts this function already serialises.
  if (gs === 'BOXOPEN') return null;
  var inRun = (gs === 'PLAYING' || gs === 'LEVELEND');
  if (inRun && toolUnlockToast > 0 && toolUnlockToastId) return 'tool';
  if (inRun && skinUnlockToast > 0 && skinUnlockToastId) return 'skin';
  if (gs !== 'MENU' && gs !== 'WORKSHOP' && achToastActive) return 'badge';
  return null;
}

function drawSkinUnlockToast() {
  if (skinUnlockToast <= 0 || !skinUnlockToastId) return;
  var skin = getSkin(skinUnlockToastId);
  var alpha = Math.min(1, skinUnlockToast * 1.2);
  var fs = clamp(15*S, 12, 20);
  var nameFs = clamp(13*S, 10, 17);
  var toastY = toastBandY() + fs;   // rr() below draws from toastY - fs
  ctx.save();
  ctx.globalAlpha = alpha;
  // pill bg
  ctx.font = 'bold '+fs+'px sans-serif';
  var label = t('unlockedToast');
  var dispName = (lang === 'ru' ? skin.nameRu : skin.name);
  var w = Math.max(ctx.measureText(label).width, ctx.measureText(dispName).width) + 32*S;
  rr(ctx, cx - w/2, toastY - fs, w, fs * 2.6, fs);
  ctx.fillStyle = 'rgba(255,215,0,0.92)';
  ctx.fill();
  // label
  ctx.fillStyle = '#3b2a00';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(label, cx, toastY);
  ctx.font = 'bold '+nameFs+'px sans-serif';
  ctx.fillText(dispName, cx, toastY + fs * 1.1);
  ctx.restore();
}

// ── DRAW LEADERBOARD (iter#2) ────────────────────────────────────────────────
// Renders the cached top-N below the game-over button. Highlights current
// player's row. Skips silently when offline / list empty.
function drawLeaderboard() {
  if (!leaderboard || leaderboard.length === 0) return;

  // Show up to 5 rows on the overlay (top-10 cached, top-5 displayed for space)
  var rows = leaderboard.slice(0, 5);
  var _ob = overlayBtnRect();
  var btnH = _ob.h, btnY = _ob.y;
  var startY = btnY + btnH + 60*S;
  var rowH = clamp(20*S, 16, 26);
  var headerFs = clamp(13*S, 11, 17);
  var rowFs = clamp(12*S, 10, 16);

  // Header
  var headerTxt = t('leaderboard');
  if (myRank) headerTxt += ' - ' + t('rank') + ': #' + myRank;
  ctx.font = 'bold '+headerFs+'px sans-serif';
  ctx.fillStyle = '#48c9b0';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'alphabetic';
  ctx.fillText(headerTxt, cx, startY);

  // Rows
  ctx.font = rowFs+'px sans-serif';
  for (var i = 0; i < rows.length; i++) {
    var entry = rows[i];
    var rowY = startY + (i + 1) * rowH + 4*S;
    var isMe = entry.name && entry.name === playerName;
    ctx.fillStyle = isMe ? '#FFD700' : '#aaa';
    var rank = '#' + (i + 1);
    // Never '?' for a missing name - a lone question mark in a UI reads as a
    // help affordance. Matches the default offered by the name prompt.
    var name = (entry.name || 'Player').slice(0, 12);
    if (isMe) name += ' (' + t('you') + ')';
    var sc = entry.score;
    // simple 3-column row centered around cx
    ctx.textAlign = 'left';
    ctx.fillText(rank, cx - 110*S, rowY);
    ctx.textAlign = 'left';
    ctx.fillText(name, cx - 80*S, rowY);
    ctx.textAlign = 'right';
    ctx.fillText(String(sc), cx + 110*S, rowY);
  }
}

// iter#11: GAMEOVER "Yesterday -> Today" pill - daily-seed delta loop.
// Renders below the leaderboard (or, if no leaderboard, below the retry/revive
// stack). Stays compact + single-line on mobile to avoid clipping bottom of
// viewport. Gold delta if today > yesterday, dim if today < yesterday, neutral
// if equal. If there's no yesterday entry (first-day player) we show a
// one-line "come back tomorrow" hint instead - closes the loop without
// pretending data exists.
function drawYesterdayPill() {
  // Y anchor: stack BELOW the leaderboard if it rendered, else below the
  // revive button. Same math as drawLeaderboard for the base Y.
  var _ob = overlayBtnRect();
  var btnH = _ob.h, btnY = _ob.y;
  var lbHasRows = (leaderboard && leaderboard.length > 0);
  var rowH = clamp(20*S, 16, 26);
  var startY;
  if (lbHasRows) {
    var rows = Math.min(5, leaderboard.length);
    var lbStartY = btnY + btnH + 60*S;
    startY = lbStartY + (rows + 1) * rowH + 22*S;
  } else {
    // below revive button (if shown) or below retry
    startY = btnY + btnH + (extraTimeUsed ? 30*S : (clamp(42*S,34,54) + 30*S));
  }

  // Compose the line
  var fs = clamp(12*S, 10, 16);
  ctx.font = 'bold ' + fs + 'px sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'alphabetic';

  if (yesterdayScore <= 0) {
    // first-day player - short hint, low chroma so it doesn't fight the LB
    ctx.fillStyle = '#7a7a8a';
    ctx.font = fs + 'px sans-serif';
    ctx.fillText(t('firstDailyRun'), cx, startY);
    return;
  }

  // Use the higher of today's run vs today's saved (in case multiple runs today)
  var todayShown = Math.max(todayBestScore, score);
  var delta = todayShown - yesterdayScore;
  var deltaStr = (delta >= 0 ? '+' : '') + delta;
  var col = delta > 0 ? '#FFD700' : (delta < 0 ? '#c97070' : '#aaaaaa');

  // Single line: "Yesterday: 1240 -> Today: 1320 (+80)"
  var line = t('yesterday') + ': ' + yesterdayScore + '  ' + String.fromCharCode(0x2192) + '  ' +
             t('today') + ': ' + todayShown + '  (' + deltaStr + ')';
  // measure to make sure it fits the canvas - if not, downsize one notch
  var widthGuess = ctx.measureText(line).width;
  if (widthGuess > W - 24*S) {
    fs = Math.max(10, fs - 2);
    ctx.font = 'bold ' + fs + 'px sans-serif';
  }
  ctx.fillStyle = col;
  ctx.fillText(line, cx, startY);
}

// ── iter#14: GAMEOVER 7-day rolling best pill ────────────────────────────────
// Sits BELOW the yesterday pill (which already sits below the leaderboard).
// Renders nothing while we have no data points (weekBestScore === 0). Purple
// because every other meta pill already claimed a colour (teal=seed,
// orange=streak, gold=newbest, grey=neutral). Gold pulse + sub-line when
// weekBestIsNew (this run beat the prior 6-day high).
var _weekPillAnim = 0;
function drawWeekBestPill() {
  if (weekBestScore <= 0) return;
  // Compute Y by stacking under the yesterday pill. The yesterday pill uses
  // the same anchor math as drawLeaderboard - replicate so we stay in sync.
  var _ob = overlayBtnRect();
  var btnH = _ob.h, btnY = _ob.y;
  var lbHasRows = (leaderboard && leaderboard.length > 0);
  var rowH = clamp(20*S, 16, 26);
  var yesterdayY;
  if (lbHasRows) {
    var rows = Math.min(5, leaderboard.length);
    var lbStartY = btnY + btnH + 60*S;
    yesterdayY = lbStartY + (rows + 1) * rowH + 22*S;
  } else {
    yesterdayY = btnY + btnH + (extraTimeUsed ? 30*S : (clamp(42*S,34,54) + 30*S));
  }
  // Our Y: ~22*S below the yesterday line
  var startY = yesterdayY + clamp(22*S, 16, 28);
  // Pulse animation on new 7-day best
  _weekPillAnim += 0.06;
  var pulse = weekBestIsNew ? (1 + Math.sin(_weekPillAnim * 4) * 0.06) : 1;
  var fs = clamp(11*S, 9, 14) * pulse;
  ctx.save();
  ctx.font = 'bold '+fs+'px sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'alphabetic';
  var label = t('weekBest') + ': ' + weekBestScore;
  var padX = 12*S, padY = 5*S;
  var w = ctx.measureText(label).width + padX*2;
  var h = fs + padY*2;
  var bx = cx - w/2, by = startY - h + padY;
  // Purple pill bg, gold tint when fresh best
  if (weekBestIsNew) {
    ctx.fillStyle = 'rgba(255,215,0,0.22)';
  } else {
    ctx.fillStyle = 'rgba(155,120,210,0.18)';
  }
  rr(ctx, bx, by, w, h, h/2);
  ctx.fill();
  ctx.fillStyle = weekBestIsNew ? '#FFD700' : '#b89df0';
  ctx.fillText(label, cx, by + h - padY - 1*S);
  // Sub-line only when this run set a new ceiling
  if (weekBestIsNew) {
    var subFs = clamp(10*S, 8, 13);
    ctx.font = 'bold '+subFs+'px sans-serif';
    ctx.fillStyle = '#FFD700';
    ctx.fillText(t('weekBestNew'), cx, by + h + subFs + 4*S);
  }
  ctx.restore();
}

// ════════════════════════════════════════════════════════════════════════════
// ── WORKSHOP OVERLAY (milestone#1/#2/#3) - the meta hub ──────────────────────
//   Fully OPAQUE fullscreen panel (Build Hygiene #12) reachable mid-run (pause),
//   from the MENU, and from GAMEOVER. Two tabs: TOOLS (equip + upgrade the
//   playtime-item ladder) and QUESTS (claim daily quests). Closes back to where
//   it was opened (prevGs). All buttons register into the shared buttons[] array.
// ════════════════════════════════════════════════════════════════════════════
var prevGs = 'MENU';        // state to return to when the workshop closes
var workshopTab = 'tools';  // 'tools' | 'quests'
function openWorkshop() {
  if (gs === 'WORKSHOP') return;
  prevGs = gs; gs = 'WORKSHOP';
  ensureDailyQuests();
  try { sfxClick(); } catch(e) {}
}
function closeWorkshop() {
  gs = (prevGs === 'WORKSHOP') ? 'MENU' : prevGs;
  try { sfxClick(); } catch(e) {}
}

// Top sprinkle-balance chip used across overlays. Returns the bottom Y.
function drawSprinkleBalance(centerX, topY) {
  var fs = clamp(15*S, 12, 20);
  var iconSz = fs * 1.25;
  var label = String(meta ? meta.sprinkles : 0);
  ctx.font = 'bold ' + fs + 'px sans-serif';
  var tw = ctx.measureText(label).width;
  var padX = clamp(12*S, 9, 16), padY = clamp(7*S, 5, 11);
  var w = tw + iconSz + 7*S + padX*2, h = fs + padY*2;
  var bx = centerX - w/2;
  rr(ctx, bx, topY, w, h, h/2);
  ctx.fillStyle = 'rgba(255,215,0,0.12)'; ctx.fill();
  ctx.strokeStyle = 'rgba(255,215,0,0.45)'; ctx.lineWidth = 1.2*S; ctx.stroke();
  drawSprinkleIcon(bx + padX + iconSz/2, topY + h/2, iconSz, '#FFD700');
  ctx.fillStyle = '#FFE066'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  if (sprinkleEarnFlash > 0) ctx.globalAlpha = 0.7 + sprinkleEarnFlash * 0.3;
  ctx.fillText(label, bx + padX + iconSz + 7*S, topY + h/2);
  ctx.globalAlpha = 1; ctx.textBaseline = 'alphabetic';
  return topY + h;
}

function drawWorkshop() {
  buttons = [];
  // OPAQUE fullscreen fill (#12 - no bleed-through of the menu/gameplay behind).
  ctx.fillStyle = '#13101e'; ctx.fillRect(0, 0, W, H);
  // soft top vignette
  var vg = ctx.createLinearGradient(0, 0, 0, H);
  vg.addColorStop(0, 'rgba(46,204,113,0.10)'); vg.addColorStop(0.25, 'rgba(46,204,113,0)');
  ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);

  var marginX = clamp(W * 0.07, 16, W * 0.16);
  var titleFs = clamp(24*S, 18, 34);
  // Title
  ctx.fillStyle = '#fff'; ctx.font = 'bold ' + titleFs + 'px sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  ctx.fillText(t('workshop'), cx, 44*S);

  // Close (X) - top-right
  var xSz = clamp(34*S, 28, 44), xPad = clamp(12*S, 9, 18);
  var xX = W - xPad - xSz, xY = xPad;
  rr(ctx, xX, xY, xSz, xSz, xSz*0.28);
  ctx.fillStyle = 'rgba(255,255,255,0.10)'; ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.3)'; ctx.lineWidth = Math.max(2, xSz*0.07);
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(xX + xSz*0.32, xY + xSz*0.32); ctx.lineTo(xX + xSz*0.68, xY + xSz*0.68);
  ctx.moveTo(xX + xSz*0.68, xY + xSz*0.32); ctx.lineTo(xX + xSz*0.32, xY + xSz*0.68);
  ctx.stroke();
  buttons.push({ x: xX, y: xY, w: xSz, h: xSz, fn: closeWorkshop });

  // Sprinkle balance chip (centered under title)
  var balBottom = drawSprinkleBalance(cx, 60*S);

  // Tab switcher (TOOLS / QUESTS / CASE). The strip is measured from the live
  // width rather than assuming two fixed-width tabs, so adding the case tab
  // cannot push a tab off-screen at 320px (ledger defect class 4).
  var tabY = balBottom + 12*S;
  var tabH = clamp(34*S, 28, 44);
  var tabGap = 8*S;
  var tabDefs = [ ['tools', t('tools')], ['quests', t('quests')], ['case', t('caseTab')] ];
  var tabW = Math.min(clamp(120*S, 90, 160),
                      (W - marginX*2 - tabGap*(tabDefs.length-1)) / tabDefs.length);
  var tabsX = cx - (tabW*tabDefs.length + tabGap*(tabDefs.length-1)) / 2;
  for (var ti = 0; ti < tabDefs.length; ti++) {
    var tabX = tabsX + ti * (tabW + tabGap);
    var active = (workshopTab === tabDefs[ti][0]);
    rr(ctx, tabX, tabY, tabW, tabH, tabH/2);
    ctx.fillStyle = active ? 'rgba(46,204,113,0.85)' : 'rgba(255,255,255,0.07)';
    ctx.fill();
    ctx.fillStyle = active ? '#06200f' : '#bbb';
    ctx.font = 'bold ' + clamp(13*S, 11, 17) + 'px sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    // quest claimable badge
    var lbl = tabDefs[ti][1];
    ctx.fillText(lbl, tabX + tabW/2, tabY + tabH/2);
    if (tabDefs[ti][0] === 'quests') {
      var qc = questClaimable();
      if (qc > 0) {
        var bdR = clamp(9*S, 7, 12);
        var bdX = tabX + tabW - bdR - 4*S, bdY = tabY + bdR + 3*S;
        ctx.beginPath(); ctx.arc(bdX, bdY, bdR, 0, Math.PI*2);
        ctx.fillStyle = '#FFD700'; ctx.fill();
        ctx.fillStyle = '#1a1a2e'; ctx.font = 'bold ' + clamp(11*S,9,13) + 'px sans-serif';
        ctx.fillText(String(qc), bdX, bdY + 0.5*S);
      }
    }
    ctx.textBaseline = 'alphabetic';
    (function(tab){ buttons.push({ x: tabX, y: tabY, w: tabW, h: tabH, fn: function(){ workshopTab = tab; try{sfxClick();}catch(e){} } }); })(tabDefs[ti][0]);
  }
  ctx.textAlign = 'center';

  var bodyTop = tabY + tabH + 16*S;
  if (workshopTab === 'case')       drawWorkshopCase(marginX, bodyTop);
  else if (workshopTab === 'tools') drawWorkshopTools(marginX, bodyTop);
  else                              drawWorkshopQuests(marginX, bodyTop);
}

// CASE tab - the browsable 20-donut collection. Laid out as a MEASURED stack
// (ledger defect class 6): the header, the grid and the box chip each declare a
// height, the remainder is what the grid may use, and the cell size is derived
// from that rather than from a constant. Nothing here is positioned relative to
// cy, so no combination of states can put two rows on each other.
function drawWorkshopCase(marginX, top) {
  var owned = donutOwnedCount(), total = donutTotal();
  var headFs = clamp(13*S, 11, 17);
  var subFs  = clamp(11*S, 9, 14);
  var chipH  = clamp(44*S, 36, 56);
  var gapY   = clamp(10*S, 7, 15);
  var bottomPad = clamp(14*S, 10, 22);

  // 1. Header: the count AND where more come from - never a bare number.
  ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  ctx.font = 'bold ' + headFs + 'px sans-serif'; ctx.fillStyle = '#FFE066';
  ctx.fillText(t('caseCount') + '  ' + owned + ' / ' + total, cx, top + headFs);
  var subLabel;
  if (boxTokens() > 0 && boxAdsLeft() > 0)      subLabel = boxTokens() + ' ' + t('boxReadyLbl') + '  -  ' + boxAdsLeft() + ' ' + t('boxLeftLbl');
  else if (boxAdsLeft() <= 0)                   subLabel = t('boxNoneLeft');
  else                                          subLabel = t('caseEmpty');
  ctx.font = subFs + 'px sans-serif'; ctx.fillStyle = '#8c8ca0';
  ctx.fillText(subLabel, cx, top + headFs + subFs + 6*S);
  var headBottom = top + headFs + subFs + 6*S + gapY;

  // 2. The chip owns its own row at the bottom; the grid gets what is left.
  var showChip = boxBtnVisible();
  var gridTop = headBottom;
  var gridBottom = H - bottomPad - (showChip ? (chipH + gapY) : 0);
  var gridH = Math.max(40, gridBottom - gridTop);
  var gridW = W - marginX*2;

  var cols = (W / Math.max(1, H) > 1.15) ? 7 : 4;
  var rows = Math.ceil(total / cols);
  var nameFs = clamp(9*S, 8, 12);
  var cellW = gridW / cols;
  var cellH = gridH / rows;
  var swR = Math.max(6, Math.min(cellW * 0.34, (cellH - nameFs - 6*S) * 0.42));

  for (var i = 0; i < total; i++) {
    var skin = DONUT_SKINS[i];
    var col = i % cols, row = Math.floor(i / cols);
    var sxC = cx - gridW/2 + cellW * (col + 0.5);
    var syC = gridTop + cellH * row + swR + 3*S;
    var unlocked = isSkinUnlocked(skin);
    var selected = unlocked && (skin.id === skinId);
    if (selected) {
      ctx.beginPath(); ctx.arc(sxC, syC, swR + 4*S, 0, Math.PI*2);
      ctx.strokeStyle = '#FFD700'; ctx.lineWidth = 2.2*S; ctx.stroke();
    }
    if (unlocked) {
      drawDonutSwatch(sxC, syC, swR, skin, 1);
      ctx.fillStyle = selected ? '#FFD700' : '#9a9aae';
      ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
      var nm = (lang === 'ru' ? skin.nameRu : skin.name);
      // Measured bold, drawn regular - it can only come out narrower than the
      // budget, never wider (Cyrillic names run ~40% longer than English).
      ctx.font = fitBoldFs(nm, cellW - 6*S, nameFs, 7) + 'px sans-serif';
      ctx.fillText(nm, sxC, syC + swR + nameFs + 3*S);
      (function(targetId){
        buttons.push({ x: sxC - swR, y: syC - swR, w: swR*2, h: swR*2, fn: function() {
          if (skinId !== targetId) { skinId = targetId; saveSkin(); try { sfxClick(); } catch(e) {} }
        } });
      })(skin.id);
    } else {
      drawLockedSlot(sxC, syC, swR);
      ctx.font = nameFs + 'px sans-serif'; ctx.fillStyle = '#5a5a6a';
      ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
      ctx.fillText(t('lockedSlot'), sxC, syC + swR + nameFs + 3*S);
    }
  }
  ctx.textAlign = 'center';

  // 3. The rewarded box chip, in its own reserved row.
  if (showChip) {
    drawBoxChip(cx - Math.min(gridW, clamp(300*S, 200, 360))/2,
                gridBottom + gapY,
                Math.min(gridW, clamp(300*S, 200, 360)),
                chipH);
  }
}

// The rewarded "open a donut box" chip. Drawn ONLY when boxBtnVisible() - on
// the YouTube target that is fail-closed on ytgame.ads, so no ads API means the
// chip never exists and no reward can be granted.
function drawBoxChip(x, y, w, h) {
  rr(ctx, x, y, w, h, h/2);
  var g = ctx.createLinearGradient(x, y, x, y + h);
  g.addColorStop(0, '#FFD700'); g.addColorStop(1, '#8a6a00');
  ctx.fillStyle = g; ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.lineWidth = 1.4*S; ctx.stroke();
  var label = t('boxChip');
  // The icon rides the chip's own height so a shrunk row cannot outgrow it.
  var iconSz = Math.min(clamp(18*S, 14, 22), h * 0.5);
  var fs = fitBoldFs(label, w - iconSz*2.2 - 20*S, Math.min(clamp(14*S, 11, 18), h * 0.42), 9);
  ctx.font = 'bold ' + fs + 'px sans-serif';
  ctx.fillStyle = '#1a1a2e';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  var tw = ctx.measureText(label).width;
  drawPlayTvIcon(x + w/2 - tw/2 - iconSz*0.7, y + h/2, iconSz, '#1a1a2e');
  ctx.fillText(label, x + w/2 + iconSz*0.45, y + h/2);
  ctx.textBaseline = 'alphabetic';
  buttons.push({ x:x, y:y, w:w, h:h, fn: showRewardedDonutBox });
}

// ── DONUT BOX REVEAL (modal state 'BOXOPEN') ─────────────────────────────────
// Opaque full-screen panel, one measured vertical stack, one button. It is its
// own game state so nothing else owns buttons[] while it is up.
function drawBoxRevealPanel() {
  if (!boxReveal) { closeBoxReveal(); return; }
  buttons = [];
  ctx.fillStyle = '#13101e'; ctx.fillRect(0, 0, W, H);
  var vg = ctx.createLinearGradient(0, 0, 0, H);
  vg.addColorStop(0, 'rgba(255,215,0,0.12)'); vg.addColorStop(0.35, 'rgba(255,215,0,0)');
  ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);

  var isDonut = (boxReveal.kind === 'donut');
  var skin = isDonut ? getSkin(boxReveal.id) : null;
  var titleFs = clamp(26*S, 18, 38);
  var nameFs  = clamp(18*S, 14, 26);
  var subFs   = clamp(12*S, 10, 16);
  var tagFs   = clamp(11*S, 9, 14);
  var artR    = clamp(52*S, 34, 74);
  var btnW    = clamp(220*S, 160, 300), btnH = clamp(50*S, 40, 64);
  var gap     = clamp(12*S, 8, 18);

  var rows = [];
  if (boxReveal.free) rows.push({ kind:'tag',   h: tagFs * 1.7 });
  rows.push({ kind:'title', h: titleFs * 1.2 });
  rows.push({ kind:'art',   h: artR * 2.2 });
  rows.push({ kind:'name',  h: nameFs * 1.4 });
  if (boxReveal.full) rows.push({ kind:'note', h: subFs * 1.5 });
  rows.push({ kind:'prog',  h: subFs * 1.5 });
  rows.push({ kind:'button', h: btnH });
  if (boxOfferAvailable() || boxAdsLeft() > 0) rows.push({ kind:'hint', h: subFs * 1.6 });

  var i, total = 0;
  for (i = 0; i < rows.length; i++) total += rows[i].h + (i ? gap : 0);
  var safeTop = clamp(44*S, 32, 72), safeBot = clamp(16*S, 12, 30);
  var avail = H - safeTop - safeBot;
  var k = (total > avail && total > 0) ? Math.max(0.45, avail / total) : 1;
  if (k !== 1) {
    gap *= k; titleFs *= k; nameFs *= k; subFs *= k; tagFs *= k;
    artR *= k; btnH *= k; btnW *= k;
    total = 0;
    for (i = 0; i < rows.length; i++) { rows[i].h *= k; total += rows[i].h + (i ? gap : 0); }
  }

  boxReveal.t += 0.05;
  var pop = Math.min(1, boxReveal.t * 3);
  var y = safeTop + Math.max(0, (avail - total) / 2);
  ctx.textAlign = 'center';
  for (i = 0; i < rows.length; i++) {
    var r = rows[i], top = y, mid = y + r.h / 2;
    ctx.textBaseline = 'middle';
    if (r.kind === 'tag') {
      ctx.font = 'bold ' + tagFs + 'px sans-serif';
      var tagLbl = t('boxStreakTag');
      var tw = ctx.measureText(tagLbl).width + clamp(14*S, 10, 20) * 2;
      rr(ctx, cx - tw/2, top, tw, r.h, r.h/2);
      ctx.fillStyle = 'rgba(255,148,77,0.9)'; ctx.fill();
      ctx.fillStyle = '#2a1400'; ctx.fillText(tagLbl, cx, mid);
    } else if (r.kind === 'title') {
      ctx.shadowColor = 'rgba(255,215,0,0.45)'; ctx.shadowBlur = 26*S;
      ctx.font = 'bold ' + fitBoldFs(isDonut ? t('boxGotDonut') : t('boxGotCoins'), W - 32*S, titleFs, 12) + 'px sans-serif';
      ctx.fillStyle = '#FFD700';
      ctx.fillText(isDonut ? t('boxGotDonut') : t('boxGotCoins'), cx, mid);
      ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0;
    } else if (r.kind === 'art') {
      if (isDonut) drawDonutSwatch(cx, mid, artR * pop, skin, 1);
      else {
        drawSprinkleIcon(cx, mid, artR * 1.5 * pop, '#FFD700');
      }
    } else if (r.kind === 'name') {
      ctx.font = 'bold ' + nameFs + 'px sans-serif'; ctx.fillStyle = '#fff';
      var nameLbl = isDonut ? (lang === 'ru' ? skin.nameRu : skin.name) : ('+' + boxReveal.n);
      ctx.font = 'bold ' + fitBoldFs(nameLbl, W - 40*S, nameFs, 10) + 'px sans-serif';
      ctx.fillText(nameLbl, cx, mid);
    } else if (r.kind === 'note') {
      ctx.font = subFs + 'px sans-serif'; ctx.fillStyle = '#8c8ca0';
      ctx.fillText(t('boxFullCase'), cx, mid);
    } else if (r.kind === 'prog') {
      ctx.font = 'bold ' + subFs + 'px sans-serif'; ctx.fillStyle = '#9a9aae';
      ctx.fillText(t('caseCount') + '  ' + donutOwnedCount() + ' / ' + donutTotal(), cx, mid);
    } else if (r.kind === 'button') {
      var bx = cx - btnW/2;
      var bg = ctx.createLinearGradient(bx, top, bx, top + r.h);
      bg.addColorStop(0, '#2ecc71'); bg.addColorStop(1, '#27ae60');
      rr(ctx, bx, top, btnW, r.h, r.h/2);
      ctx.fillStyle = bg; ctx.fill();
      ctx.font = 'bold ' + fitBoldFs(t('boxClose'), btnW - 24*S, clamp(16*S, 12, 22) * k, 10) + 'px sans-serif';
      ctx.fillStyle = '#fff';
      ctx.fillText(t('boxClose'), cx, mid);
      buttons.push({ x:bx, y:top, w:btnW, h:r.h, fn: closeBoxReveal });
    } else if (r.kind === 'hint') {
      ctx.font = subFs + 'px sans-serif'; ctx.fillStyle = '#6f6f82';
      ctx.fillText(boxOfferAvailable() ? t('boxChip') : t('boxEarnHint'), cx, mid);
    }
    y += r.h + gap;
  }
  ctx.textBaseline = 'alphabetic';
}

// TOOLS tab - the playtime-item ladder: each tool row shows icon, name, level,
// equip toggle, and an upgrade button (cost in sprinkles). Locked rows show the
// "play N min to unlock" hint. Scroll-free: rows are sized to fit the column.
function drawWorkshopTools(marginX, top) {
  // equipped-slots strip
  var slotSz = clamp(46*S, 36, 60), slotGap = clamp(12*S, 8, 18);
  var slotsW = slotSz * 3 + slotGap * 2;
  var slotsX = cx - slotsW/2;
  ctx.font = 'bold ' + clamp(11*S,9,14) + 'px sans-serif';
  ctx.fillStyle = '#888'; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  ctx.fillText(t('equipped'), cx, top);
  var slotsY = top + 8*S;
  for (var si = 0; si < 3; si++) {
    var sX = slotsX + si * (slotSz + slotGap);
    rr(ctx, sX, slotsY, slotSz, slotSz, slotSz*0.22);
    ctx.fillStyle = 'rgba(255,255,255,0.05)'; ctx.fill();
    ctx.strokeStyle = 'rgba(46,204,113,0.5)'; ctx.setLineDash([4*S,4*S]); ctx.lineWidth = 1.4*S;
    ctx.stroke(); ctx.setLineDash([]);
    var eid = meta && meta.equipped[si];
    if (eid && TOOL_BY_ID[eid]) {
      drawToolIcon(eid, sX + slotSz/2, slotSz/2 + slotsY, slotSz*0.56, TOOL_BY_ID[eid].col);
      (function(id){ buttons.push({ x: sX, y: slotsY, w: slotSz, h: slotSz, fn: function(){ toggleEquip(id); } }); })(eid);
    }
  }

  // tool ladder list
  var listTop = slotsY + slotSz + 16*S;
  var rowH = clamp(50*S, 40, 62), rowGap = 7*S;
  var rowW = W - marginX*2;
  var n = TOOL_DEFS.length;
  // shrink rows if they'd overflow the viewport bottom
  var avail = H - listTop - 14*S;
  var totalNeeded = n * rowH + (n-1) * rowGap;
  if (totalNeeded > avail) { rowH = Math.max(30, (avail - (n-1)*rowGap) / n); }
  var mins = totalPlayMin();
  for (var i = 0; i < n; i++) {
    var def = TOOL_DEFS[i];
    var owned = meta && meta.tools[def.id];
    var rowY = listTop + i * (rowH + rowGap);
    if (rowY > H - 10*S) break;
    rr(ctx, marginX, rowY, rowW, rowH, clamp(10*S,7,14));
    ctx.fillStyle = owned ? 'rgba(255,255,255,0.055)' : 'rgba(255,255,255,0.02)';
    ctx.fill();
    var iconCX = marginX + rowH*0.5;
    ctx.globalAlpha = owned ? 1 : 0.4;
    // icon disc
    ctx.beginPath(); ctx.arc(iconCX, rowY + rowH/2, rowH*0.32, 0, Math.PI*2);
    ctx.fillStyle = 'rgba(0,0,0,0.25)'; ctx.fill();
    drawToolIcon(def.id, iconCX, rowY + rowH/2, rowH*0.42, owned ? def.col : '#777');
    ctx.globalAlpha = 1;
    // name + desc
    var nameFs = clamp(13*S, 11, 16), descFs = clamp(10*S, 8, 12);
    var textX = iconCX + rowH*0.42;
    ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
    ctx.font = 'bold ' + nameFs + 'px sans-serif';
    ctx.fillStyle = owned ? '#fff' : '#999';
    var nm = (lang === 'ru' ? def.ru : def.en);
    var c = owned ? meta.tools[def.id] : null;
    // Locked rows carry a third line (the unlock progress bar), so their name
    // and description sit higher to keep every line clear of the others.
    ctx.fillText(nm + (c ? '  ' + t('lvlAbbr') + c.lvl : ''), textX, rowY + rowH*(owned ? 0.42 : 0.34));
    ctx.font = descFs + 'px sans-serif'; ctx.fillStyle = '#9a9aaa';
    ctx.fillText((lang === 'ru' ? def.descRu : def.descEn), textX, rowY + rowH*(owned ? 0.72 : 0.60));

    // right side: equip toggle + upgrade button (owned) OR unlock hint (locked)
    var btnH = clamp(rowH*0.56, 22, 34);
    var btnY = rowY + (rowH - btnH)/2;
    if (owned) {
      var isEq = meta.equipped.indexOf(def.id) >= 0;
      // upgrade button
      var maxed = c.lvl >= TOOL_MAX_LVL;
      var upW = clamp(76*S, 58, 100);
      var upX = marginX + rowW - upW - 8*S;
      rr(ctx, upX, btnY, upW, btnH, btnH/2);
      var canAfford = !maxed && meta.sprinkles >= upCost(def.id);
      ctx.fillStyle = maxed ? 'rgba(255,255,255,0.08)' : (canAfford ? 'rgba(255,215,0,0.85)' : 'rgba(255,215,0,0.22)');
      ctx.fill();
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.font = 'bold ' + clamp(11*S,9,13) + 'px sans-serif';
      if (maxed) { ctx.fillStyle = '#888'; ctx.fillText(t('maxed'), upX + upW/2, btnY + btnH/2); }
      else {
        ctx.fillStyle = canAfford ? '#3a2a00' : '#8a7320';
        var costSz = btnH*0.5;
        var costLbl = String(upCost(def.id));
        var ctw = ctx.measureText(costLbl).width;
        drawSprinkleIcon(upX + upW/2 - ctw/2 - costSz*0.6, btnY + btnH/2, costSz, canAfford ? '#3a2a00' : '#8a7320');
        ctx.fillText(costLbl, upX + upW/2 + costSz*0.35, btnY + btnH/2);
      }
      if (!maxed) (function(id){ buttons.push({ x: upX, y: btnY, w: upW, h: btnH, fn: function(){ buyToolUpgrade(id); } }); })(def.id);
      // equip toggle
      var eqW = clamp(72*S, 54, 96);
      var eqX = upX - eqW - 7*S;
      rr(ctx, eqX, btnY, eqW, btnH, btnH/2);
      ctx.fillStyle = isEq ? 'rgba(46,204,113,0.85)' : 'rgba(255,255,255,0.10)';
      ctx.fill();
      ctx.fillStyle = isEq ? '#06200f' : '#ccc';
      ctx.font = 'bold ' + clamp(11*S,9,13) + 'px sans-serif';
      ctx.fillText(isEq ? t('unequip') : t('equip'), eqX + eqW/2, btnY + btnH/2);
      (function(id){ buttons.push({ x: eqX, y: btnY, w: eqW, h: btnH, fn: function(){ toggleEquip(id); } }); })(def.id);
      ctx.textBaseline = 'alphabetic';
    } else {
      // LOCKED (MCPlay 2026-07-27: "it isn't clear when the boosts open").
      // The row used to show a bare "2m" over "Play to unlock", which reads as
      // a price as easily as a countdown. It now states the requirement, the
      // progress towards it, and a filled bar - plus, on the NEXT tool in the
      // ladder, a rewarded-ad shortcut, exactly as Mediacube suggested.
      var adDef = adUnlockableTool();
      var showAd = !!(adDef && adDef.id === def.id);
      var adW = clamp(96*S, 74, 128);
      var adX = marginX + rowW - adW - 8*S;
      // progress bar spans from the text column to whatever the right side left
      var barRight = (showAd ? adX : marginX + rowW) - 12*S;
      var barX = textX, barW = Math.max(24, barRight - barX);
      var barH = clamp(5*S, 4, 8);
      var barY = rowY + rowH*0.84 - barH/2;
      var frac = def.min > 0 ? clamp(mins / def.min, 0, 1) : 1;
      rr(ctx, barX, barY, barW, barH, barH/2);
      ctx.fillStyle = 'rgba(255,255,255,0.10)'; ctx.fill();
      if (frac > 0) {
        rr(ctx, barX, barY, Math.max(barH, barW * frac), barH, barH/2);
        ctx.fillStyle = '#FFD700'; ctx.fill();
      }
      // "12 / 15m played" - unambiguous about what the number means. Sits
      // right-aligned on the DESCRIPTION baseline (the row's free right half)
      // rather than on its own line above the bar, where the longer Russian
      // description ran straight into it.
      var progLbl = Math.floor(mins) + ' / ' + def.min + t('minAbbr') + ' ' + t('playedLbl');
      ctx.font = 'bold ' + clamp(9.5*S,8,12) + 'px sans-serif';
      var descW = 0;
      ctx.save();
      ctx.font = descFs + 'px sans-serif';
      descW = ctx.measureText(lang === 'ru' ? def.descRu : def.descEn).width;
      ctx.restore();
      ctx.font = 'bold ' + clamp(9.5*S,8,12) + 'px sans-serif';
      // Only draw it if it genuinely clears the description text.
      if (barX + barW - ctx.measureText(progLbl).width > textX + descW + 12*S) {
        ctx.textAlign = 'right'; ctx.textBaseline = 'alphabetic';
        ctx.fillStyle = '#FFD700';
        ctx.fillText(progLbl, barX + barW, rowY + rowH*0.60);
      }
      if (showAd) {
        var adH = clamp(rowH*0.56, 22, 34);
        var adY = rowY + (rowH - adH)/2;
        rr(ctx, adX, adY, adW, adH, adH/2);
        ctx.fillStyle = 'rgba(255,215,0,0.85)'; ctx.fill();
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.font = 'bold ' + clamp(10*S,8,12) + 'px sans-serif';
        ctx.fillStyle = '#3a2a00';
        var adLbl = t('unlockNow');
        var adIc = adH * 0.5;
        var adTw = ctx.measureText(adLbl).width;
        drawPlayTvIcon(adX + adW/2 - (adTw + adIc*0.9)/2 + adIc*0.35, adY + adH/2, adIc, '#3a2a00');
        ctx.textAlign = 'left';
        ctx.fillText(adLbl, adX + adW/2 - (adTw + adIc*0.9)/2 + adIc*1.05, adY + adH/2);
        ctx.textAlign = 'center';
        (function(id){ buttons.push({ x: adX, y: adY, w: adW, h: adH, fn: function(){ showRewardedToolUnlock(id); } }); })(def.id);
      }
      ctx.textBaseline = 'alphabetic';
    }
  }
  ctx.textAlign = 'center';
}

// QUESTS tab - 3 daily quests with progress bars + claim buttons.
function drawWorkshopQuests(marginX, top) {
  ensureDailyQuests();
  var items = (meta && meta.quests.items) || [];
  var rowW = W - marginX*2;
  var rowH = clamp(64*S, 50, 82), rowGap = 12*S;
  for (var i = 0; i < items.length; i++) {
    var q = items[i];
    var def = questDef(q.id); if (!def) continue;
    var rowY = top + i * (rowH + rowGap);
    rr(ctx, marginX, rowY, rowW, rowH, clamp(12*S,8,16));
    ctx.fillStyle = q.done ? 'rgba(46,204,113,0.10)' : 'rgba(255,255,255,0.045)';
    ctx.fill();
    // label
    ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
    ctx.font = 'bold ' + clamp(13*S,11,16) + 'px sans-serif';
    ctx.fillStyle = '#fff';
    ctx.fillText((lang === 'ru' ? def.ru : def.en), marginX + 14*S, rowY + 22*S);
    // progress bar
    var barX = marginX + 14*S, barW = rowW - 28*S - clamp(86*S,64,110), barH = 9*S;
    var barY = rowY + rowH - 22*S;
    rr(ctx, barX, barY, barW, barH, barH/2);
    ctx.fillStyle = 'rgba(255,255,255,0.12)'; ctx.fill();
    var prog = Math.min(1, q.prog / q.goal);
    if (prog > 0) {
      rr(ctx, barX, barY, barW * prog, barH, barH/2);
      ctx.fillStyle = q.done ? '#FFD700' : '#2ecc71'; ctx.fill();
    }
    ctx.font = clamp(11*S,9,13) + 'px sans-serif'; ctx.fillStyle = '#aaa';
    ctx.fillText(Math.min(q.prog, q.goal) + ' / ' + q.goal, barX, rowY + rowH - 28*S);
    // reward / claim button
    var rw = clamp(86*S, 64, 110), rh = clamp(36*S, 28, 46);
    var rX = marginX + rowW - rw - 12*S, rY = rowY + (rowH - rh)/2;
    rr(ctx, rX, rY, rw, rh, rh/2);
    var claimable = q.done && !q.claimed;
    ctx.fillStyle = q.claimed ? 'rgba(255,255,255,0.06)' : (claimable ? 'rgba(255,215,0,0.9)' : 'rgba(255,255,255,0.08)');
    ctx.fill();
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = 'bold ' + clamp(11*S,9,13) + 'px sans-serif';
    if (q.claimed) { ctx.fillStyle = '#777'; ctx.fillText(t('claimed'), rX + rw/2, rY + rh/2); }
    else if (claimable) {
      ctx.fillStyle = '#3a2a00';
      var rSz = rh*0.5; var rLbl = '+25';
      var rtw = ctx.measureText(rLbl).width;
      drawSprinkleIcon(rX + rw/2 - rtw/2 - rSz*0.55, rY + rh/2, rSz, '#3a2a00');
      ctx.fillText(rLbl, rX + rw/2 + rSz*0.35, rY + rh/2);
      (function(id){ buttons.push({ x: rX, y: rY, w: rw, h: rh, fn: function(){ claimQuest(id); } }); })(q.id);
    } else {
      ctx.fillStyle = '#bbb';
      var rSz2 = rh*0.5; var rLbl2 = '+25';
      var rtw2 = ctx.measureText(rLbl2).width;
      drawSprinkleIcon(rX + rw/2 - rtw2/2 - rSz2*0.55, rY + rh/2, rSz2, '#bbb');
      ctx.fillText(rLbl2, rX + rw/2 + rSz2*0.35, rY + rh/2);
    }
    ctx.textBaseline = 'alphabetic';
  }
  // Baker's Pass + 2x-ad card below the quests (milestone#3 monetization).
  var passY = top + items.length * (rowH + rowGap) + 6*S;
  drawPassCard(marginX, passY, rowW);
  ctx.textAlign = 'center';
}

// milestone#3: one-time Baker's Pass + a rewarded 2x-sprinkle button. Never
// punishing; if not owned, shows the offer; if owned, shows ACTIVE.
function drawPassCard(marginX, y, rowW) {
  if (y > H - 60*S) return; // skip if it would overflow (mobile)
  var h = clamp(58*S, 46, 72);
  rr(ctx, marginX, y, rowW, h, clamp(12*S,8,16));
  var owned = meta && meta.pass;
  ctx.fillStyle = owned ? 'rgba(255,215,0,0.12)' : 'rgba(167,139,250,0.14)';
  ctx.fill();
  ctx.strokeStyle = owned ? 'rgba(255,215,0,0.5)' : 'rgba(167,139,250,0.5)';
  ctx.lineWidth = 1.3*S; ctx.stroke();
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  ctx.font = 'bold ' + clamp(13*S,11,16) + 'px sans-serif';
  ctx.fillStyle = owned ? '#FFD700' : '#c4b5fd';
  ctx.fillText(t('bakerPass'), marginX + 14*S, y + 22*S);
  ctx.font = clamp(10*S,8,12) + 'px sans-serif'; ctx.fillStyle = '#9a9aaa';
  ctx.fillText(t('passDesc'), marginX + 14*S, y + h - 14*S);
  var bw = clamp(96*S, 72, 124), bh = clamp(34*S, 28, 44);
  var bX = marginX + rowW - bw - 12*S, bY = y + (h - bh)/2;
  rr(ctx, bX, bY, bw, bh, bh/2);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = 'bold ' + clamp(11*S,9,13) + 'px sans-serif';
  if (owned) { ctx.fillStyle = 'rgba(255,215,0,0.25)'; ctx.fill(); ctx.fillStyle = '#FFD700'; ctx.fillText(t('passOwned'), bX + bw/2, bY + bh/2); }
  else { ctx.fillStyle = 'rgba(167,139,250,0.9)'; ctx.fill(); ctx.fillStyle = '#1a0f2e'; ctx.fillText(t('getPass'), bX + bw/2, bY + bh/2);
    buttons.push({ x: bX, y: bY, w: bw, h: bh, fn: buyBakerPass }); }
  ctx.textBaseline = 'alphabetic';
}

// ── WELCOME-BACK / DAILY LOGIN CARD ──────────────────────────────────────────
// Shown on MENU when there's an unclaimed login/overnight reward. A single
// CLAIM button banks the sprinkles. Non-RV recovery from dead-broke (1.15) -
// this always grants the player currency just for opening the game.
// Rebuilt as a MEASURED stack (ledger defect class 6). It used to place five
// elements at hand-tuned offsets from cardY (38/86/118/134 and a button pinned
// to the card's bottom) while cardH was clamped independently - so at 393x852
// with any streak above 1 the "x1.50 day streak bonus" line was drawn INSIDE
// the CLAIM button (line at cardY+109.7, button top at cardY+106.5). Adding the
// day-7 box line to that layout would have made it three-deep. Every row now
// declares a height, the card is sized from the measured total, and the button
// owns its own row.
function drawLoginCard() {
  if (pendingLogin <= 0) return;
  // The card LOOKED modal (full scrim, drawn last) but was not: checkButtons()
  // returns the FIRST registered hit, and the menu's PLAY button is registered
  // long before this one and sits right on top of CLAIM at every viewport
  // (measured 393x852: PLAY 442-485, CLAIM 474-510, same x band). Tapping CLAIM
  // therefore started a run instead, which is why the reward had to be made
  // survive-a-dismiss in the first place. The card now owns input outright -
  // it is drawn LAST on MENU, so clearing here deregisters everything behind it
  // and CLAIM is the only target while a reward is waiting.
  buttons = [];
  // dim scrim so the card reads as a modal
  ctx.fillStyle = 'rgba(6,5,15,0.78)'; ctx.fillRect(0, 0, W, H);

  var titleFs = clamp(20*S, 15, 28);
  var amtFs   = clamp(34*S, 24, 46);
  var subFs   = clamp(11*S, 9, 14);
  var tagFs   = clamp(10*S, 8, 13);
  var bw = clamp(180*S, 140, 240), bh = clamp(44*S, 36, 56);
  var gap = clamp(9*S, 6, 14);
  var padY = clamp(20*S, 14, 28);
  var cardW = clamp(300*S, 220, 380);

  var rows = [ { kind:'title', h: titleFs * 1.25 },
               { kind:'amount', h: amtFs * 1.25 },
               { kind:'sub', h: subFs * 1.5 } ];
  if (streak > 1)     rows.push({ kind:'mult', h: tagFs * 1.5 });
  if (streakBoxDue()) rows.push({ kind:'day7', h: tagFs * 1.6 });
  rows.push({ kind:'button', h: bh });

  var i, total = 0;
  for (i = 0; i < rows.length; i++) total += rows[i].h + (i ? gap : 0);
  // Shrink the whole card (not just the text) if the viewport cannot hold it.
  var maxCardH = H - clamp(24*S, 16, 40) * 2;
  var k = (total + padY*2 > maxCardH) ? Math.max(0.5, (maxCardH - padY*2) / total) : 1;
  if (k !== 1) {
    gap *= k; titleFs *= k; amtFs *= k; subFs *= k; tagFs *= k; bh *= k; bw *= k;
    total = 0;
    for (i = 0; i < rows.length; i++) { rows[i].h *= k; total += rows[i].h + (i ? gap : 0); }
  }

  var cardH = total + padY*2;
  var cardX = cx - cardW/2, cardY = cy - cardH/2;
  rr(ctx, cardX, cardY, cardW, cardH, clamp(18*S,12,24));
  ctx.fillStyle = '#1a1630'; ctx.fill();
  ctx.strokeStyle = 'rgba(255,215,0,0.45)'; ctx.lineWidth = 1.6*S; ctx.stroke();

  var y = cardY + padY;
  ctx.textAlign = 'center';
  for (i = 0; i < rows.length; i++) {
    var r = rows[i], top = y, mid = y + r.h / 2;
    ctx.textBaseline = 'middle';
    if (r.kind === 'title') {
      ctx.fillStyle = '#FFD700';
      ctx.font = 'bold ' + fitBoldFs(t('welcomeBack'), cardW - 28*S, titleFs, 11) + 'px sans-serif';
      ctx.fillText(t('welcomeBack'), cx, mid);
    } else if (r.kind === 'amount') {
      var amtLbl = '+' + pendingLogin;
      ctx.font = 'bold ' + amtFs + 'px sans-serif';
      var iw = amtFs * 1.1, tw = ctx.measureText(amtLbl).width;
      var startX = cx - (iw + 8*S + tw) / 2;
      drawSprinkleIcon(startX + iw/2, mid, iw, '#FFD700');
      ctx.fillStyle = '#fff'; ctx.textAlign = 'left';
      ctx.fillText(amtLbl, startX + iw + 8*S, mid);
      ctx.textAlign = 'center';
    } else if (r.kind === 'sub') {
      var sub = (pendingOvernight > 0) ? (t('overnight') + ' +' + pendingOvernight) : t('loginReward');
      ctx.font = fitBoldFs(sub, cardW - 28*S, subFs, 8) + 'px sans-serif';
      ctx.fillStyle = '#9a9aaa';
      ctx.fillText(sub, cx, mid);
    } else if (r.kind === 'mult') {
      var mLbl = 'x' + (1 + Math.min(streak,7)*0.25).toFixed(2) + ' ' + t('dayStreakLbl');
      ctx.font = fitBoldFs(mLbl, cardW - 28*S, tagFs, 7) + 'px sans-serif';
      ctx.fillStyle = '#ff944d';
      ctx.fillText(mLbl, cx, mid);
    } else if (r.kind === 'day7') {
      ctx.font = 'bold ' + fitBoldFs(t('streakBoxDue'), cardW - 28*S, tagFs, 7) + 'px sans-serif';
      ctx.fillStyle = '#7fe6a8';
      ctx.fillText(t('streakBoxDue'), cx, mid);
    } else if (r.kind === 'button') {
      var bX = cx - bw/2;
      rr(ctx, bX, top, bw, r.h, r.h/2);
      var g = ctx.createLinearGradient(bX, top, bX, top + r.h);
      g.addColorStop(0, '#FFE066'); g.addColorStop(1, '#E0A800');
      ctx.fillStyle = g; ctx.fill();
      ctx.fillStyle = '#3a2a00';

// ── HANDS-ON TUTORIAL (milestone - action-gated, animated demo hand) ─────────
// The game had NO interactive tutorial (just static menu strings shown nowhere).
// This is action-gated per Game Build Hygiene #10: the tutorial ends only after
// the player performs the REAL action. An animated vector HAND demonstrates the
// gesture; a slim caption pill sits above it; a SKIP button is always available.
//   clean the first 3 debris objects (drag/roll) - then tutorial is done
var TUT_KEY = 'clean_sweep_seen_tut_v2';
var tut = { active:false, step:0, t:0, startCleans:0 };
function maybeStartTutorial() {
  var seen = false;
  try { seen = localStorage.getItem(TUT_KEY) === '1'; } catch(e) {}
  if (seen) return;
  tut.active = true; tut.step = 0; tut.t = 0; tut.startCleans = 0;
}
function endTutorial() {
  tut.active = false;
  try { localStorage.setItem(TUT_KEY, '1'); } catch(e) {}
}
function drawTutorial() {
  if (!tut.active || gs !== 'PLAYING') return;
  tut.t += 0.016;
  var capKey = 'tut_drag';
  // dim scrim (light - keep the board visible, per the demo-hand UX note)
  ctx.save();
  ctx.fillStyle = 'rgba(6,5,15,0.22)'; ctx.fillRect(0, 0, W, H);
  // animated hand: a looping drag near the donut toward the nearest crumb
  var hx = donut.x, hy = donut.y;
  var tx = hx + 70*S, ty = hy; // default direction
  // aim at the nearest debris if any
  var best = 1e9, bd = null;
  for (var i = 0; i < debrisList.length; i++) {
    var d = debrisList[i]; var dx = d.x - hx, dy = d.y - hy; var dd = dx*dx+dy*dy;
    if (dd < best) { best = dd; bd = d; }
  }
  if (bd) { tx = bd.x; ty = bd.y; }
  var loop = (tut.t % 1.8) / 1.8;
  var px = lerp(hx, tx, Math.min(1, loop * 1.4));
  var py = lerp(hy, ty, Math.min(1, loop * 1.4));
  // dashed path
  ctx.strokeStyle = 'rgba(255,255,255,0.4)'; ctx.lineWidth = 2*S; ctx.setLineDash([6*S, 6*S]);
  ctx.beginPath(); ctx.moveTo(hx, hy); ctx.lineTo(tx, ty); ctx.stroke(); ctx.setLineDash([]);
  // rings: grab (yellow) at start, target (green) at end
  ctx.strokeStyle = 'rgba(255,215,0,0.8)'; ctx.lineWidth = 2.5*S;
  ctx.beginPath(); ctx.arc(hx, hy, 22*S, 0, Math.PI*2); ctx.stroke();
  ctx.strokeStyle = 'rgba(46,204,113,0.8)';
  ctx.beginPath(); ctx.arc(tx, ty, 16*S, 0, Math.PI*2); ctx.stroke();
  drawHand(px, py, 30*S);
  ctx.restore();
  // Caption pill. It used to sit a fixed 60*S above the MOVING hand, so as the
  // hand travelled it drifted straight over the donut and the target ring - the
  // ledger's "tutorial caption anchored with no reserved band" class, and very
  // visible at wide shapes. Reserve a band clear of BOTH the donut and the
  // target: directly above the higher of the two when there is room, otherwise
  // below the lower one, and never down in the drag-hint / next-tool strip.
  var capFs = clamp(15*S, 12, 20);
  ctx.font = 'bold ' + capFs + 'px sans-serif';
  var cap = t(capKey);
  var cw = ctx.measureText(cap).width + 28*S, ch = capFs + 18*S;
  var clearR = 30*S;                                  // covers both rings + the donut sprite
  var capLo = HUD_H*S + 50*S, capHi = H - 62*S - ch;
  var cyy = Math.min(hy, ty) - clearR - 14*S - ch;    // above both
  if (cyy < capLo) cyy = Math.max(hy, ty) + clearR + 14*S;  // no room above -> below both
  cyy = clamp(cyy, capLo, Math.max(capLo, capHi));
  var cxx = clamp(px, cw/2 + 8, W - cw/2 - 8);
  rr(ctx, cxx - cw/2, cyy, cw, ch, ch/2);
  ctx.fillStyle = 'rgba(12,12,24,0.92)'; ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.18)'; ctx.lineWidth = 1.2*S; ctx.stroke();
  ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(cap, cxx, cyy + ch/2);
  ctx.textBaseline = 'alphabetic';
  // SKIP button - top-right under the HUD
  var skFs = clamp(11*S, 9, 14);
  ctx.font = 'bold ' + skFs + 'px sans-serif';
  var skLbl = t('tutSkip');
  var skW = ctx.measureText(skLbl).width + 22*S, skH = skFs + 12*S;
  var skX = W - skW - 12*S, skY = HUD_H*S + 8*S;
  rr(ctx, skX, skY, skW, skH, skH/2);
  ctx.fillStyle = 'rgba(255,255,255,0.10)'; ctx.fill();
  ctx.fillStyle = '#bbb'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(skLbl, skX + skW/2, skY + skH/2);
  ctx.textBaseline = 'alphabetic'; ctx.textAlign = 'center';
  buttons.push({ x: skX, y: skY, w: skW, h: skH, fn: endTutorial });
}
// Vector hand (pointing) - reused by the tutorial demo.
function drawHand(x, y, sz) {
  ctx.save(); ctx.translate(x, y);
  ctx.fillStyle = 'rgba(255,255,255,0.95)';
  ctx.strokeStyle = 'rgba(0,0,0,0.35)'; ctx.lineWidth = Math.max(1.2, sz*0.04);
  var s = sz;
  // palm
  rr(ctx, -s*0.22, -s*0.05, s*0.5, s*0.62, s*0.18);
  ctx.fill(); ctx.stroke();
  // index finger pointing up-left
  ctx.save(); ctx.rotate(-0.35);
  rr(ctx, -s*0.16, -s*0.5, s*0.18, s*0.55, s*0.09);
  ctx.fill(); ctx.stroke();
  ctx.restore();
  ctx.restore();
}

// ── MAIN LOOP ─────────────────────────────────────────────────────────────────
function frame(ts) {
  var dt = Math.min((ts - lastTs) / 1000, 0.08);
  lastTs = ts;

  // A container can be resized without a window `resize` event ever reaching
  // us (the MCPlay test frame swaps its own aspect ratio). Two property reads
  // a frame guarantee the world is never left sized to a viewport that is gone.
  if (W !== window.innerWidth || H !== window.innerHeight) resize();

  update(dt);

  // Rebuild live gameplay targets once per frame. Previously tutorial Skip
  // accumulated a duplicate button every RAF while the visible Workshop pill
  // had no target at all.
  if (gs === 'PLAYING') buttons = [];

  var sx = 0, sy = 0;
  if (shake > 0) { sx=(Math.random()-0.5)*shake*12*S; sy=(Math.random()-0.5)*shake*12*S; }

  ctx.save();
  ctx.translate(sx, sy);
  ctx.fillStyle = '#0a0a12';
  ctx.fillRect(-20, -20, W+40, H+40);

  if (gs === 'PLAYING' || gs === 'LEVELEND') {
    drawArena();

    // debris
    for (var i = 0; i < debrisList.length; i++) drawDebris(debrisList[i]);
    // iter#12: golden sprinkle pickups (drawn after debris so they sit on top)
    for (var spi2 = 0; spi2 < sprinkleList.length; spi2++) drawSprinkle(sprinkleList[spi2]);

    // particles
    for (var i = 0; i < particles.length; i++) {
      var p = particles[i];
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
      ctx.fillStyle = p.color; ctx.fill();
    }
    ctx.globalAlpha = 1;

    // floating texts
    for (var i = 0; i < floats.length; i++) {
      var f = floats[i];
      ctx.globalAlpha = Math.max(0, f.life);
      ctx.font = 'bold '+clamp(14*S,11,20)+'px sans-serif';
      ctx.fillStyle = f.col; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
      ctx.fillText(f.txt, f.x, f.y);
    }
    ctx.globalAlpha = 1;

    drawDonut(donut.x, donut.y);
    drawHUD();
    // milestone#1/#2: meta HUD - WORKSHOP pill + sprinkle bank + "next tool in Nm"
    if (gs === 'PLAYING') drawMetaHud();
  }

  ctx.restore();

  if (gs === 'MENU') {
    ctx.fillStyle = '#0a0a12'; ctx.fillRect(0,0,W,H);
    // The button resumes at the last unlocked level and SAYS so, and the
    // tutorial never replays for a returning player (MCPlay 2026-07-27).
    var _resume = resumeLevel();
    drawOverlay(t('title'), t('sub'),
      _resume > 1 ? (t('continueBtn') + '  ' + t('lvlAbbr') + ' ' + _resume) : t('play'),
      function() { score=0; if (_resume <= 1) maybeStartTutorial(); startLevel(_resume, true); });
    // Secondary "start over" link so resuming is never a trap.
    if (_resume > 1) drawRestartLink();
    // iter#5: streak pill above the day-seed badge
    drawStreakPill();
    // iter#4: daily-seed badge above the title
    drawDaySeedBadge();
    // iter#3: cosmetic donut picker below the BEST: line - one CASE pill that
    // opens the browsable 20-slot case (the 4-wide swatch row could not scale).
    drawCasePill(cy + 20*S + clamp(52*S, 40, 66) + 80*S);
    // iter#6: achievement badge row near the bottom of the menu
    drawAchievementRow(H - 36*S);
    // milestone#3: limited-time event banner - between the skin picker and badges
    drawEventBanner(cy + 20*S + clamp(52*S, 40, 66) + 80*S + clamp(20*S,14,26) + 30*S);
    // milestone#1/#2: WORKSHOP button (opens the meta hub) - top-left, fixed slot
    drawWorkshopButton(14*S, 14*S);
    // iter#10: *N/30 lifetime stars pill - below the workshop button when present
    drawTotalStarsPillAt(14*S, 14*S + clamp(30*S, 24, 40) + 8*S);
    // iter#8: mute toggle (top-right corner)
    drawMuteButton();
    // milestone#2: welcome-back / daily-login card (drawn LAST = on top, modal)
    drawLoginCard();
  }
  if (gs === 'LEVELEND') {
    // One measured stack owns this screen now - the star row, NEW BEST label,
    // PERFECT SWEEP pill, score/bonus/sprinkle lines and the NEXT button are
    // all rows inside it, so none can overlap another (MCPlay 2026-07-27).
    drawLevelEndPanel(function() { startLevel(level+1); });
    drawWorkshopButton(14*S, 14*S);
    drawMuteButton();
  }
  if (gs === 'GAMEOVER') {
    // (best is already live-tracked during play; saveBest also runs on each new high)
    // iter#7: RETRY now routes through a throttled interstitial (Yandex 4.1)
    // RETRY resumes at the last cleared level, not level 1 (MCPlay 2026-07-27:
    // "after a loss, restart begins from the start, not the last level").
    drawOverlay(t('gameover'), t('score')+': '+score, t('retry'),
      function() { showInterstitial(function() { score=0; startLevel(resumeLevel(), true); }); });

    // iter#7: EXTRA TIME (rewarded ad). One revive per level; user-click only.
    if (!extraTimeUsed) {
      var _ob = overlayBtnRect();
      var rW = _ob.w, rH = clamp(42*S, 34, 54);
      var rX = _ob.x;
      var rY = _ob.y + _ob.h + Math.max(12, 14*S);
      reviveBtnRect = { x: rX, y: rY, w: rW, h: rH };
      rr(ctx, rX, rY, rW, rH, rH/2);
      var gradR = ctx.createLinearGradient(rX, rY, rX, rY+rH);
      gradR.addColorStop(0, '#FFD700'); gradR.addColorStop(1, '#8a6a00');
      ctx.fillStyle = gradR; ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.35)';
      ctx.lineWidth = 1.4 * S;
      ctx.stroke();
      ctx.font = 'bold ' + clamp(14*S, 11, 18) + 'px sans-serif';
      ctx.fillStyle = '#1a1a2e';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      var _etLabel = t('extraTime');
      var _etIconSz = clamp(18*S, 14, 22);
      var _etTw = ctx.measureText(_etLabel).width;
      drawPlayTvIcon(cx - _etTw/2 - _etIconSz*0.7, rY + rH/2, _etIconSz, '#1a1a2e');
      ctx.fillText(_etLabel, cx + _etIconSz*0.45, rY + rH/2);
      ctx.textBaseline = 'alphabetic';
      buttons.push({ x: rX, y: rY, w: rW, h: rH, fn: showRewardedExtraTime });
    }

    // Measured cluster ABOVE the "TIME'S UP!" title. These four used to be
    // drawn at fixed offsets from cy that each assumed the others were absent;
    // a run that set a streak AND a new best AND a new best chain stacked all
    // of them on each other and on the title (MCPlay 2026-07-27 - the same
    // "наложение" defect class the reviewer cited on the level-end screen).
    // Now they are measured and stacked upward from the title's visual top.
    var goGap = clamp(7*S, 5, 12);
    var goStack = [];
    if (streak > 0)            goStack.push({ fn: drawStreakPill,    h: drawStreakPill(0, true) });
    goStack.push({ fn: drawDaySeedBadge, h: drawDaySeedBadge(0, true) });
    if (newBest)               goStack.push({ fn: drawNewBestBanner, h: drawNewBestBanner(0, true) });
    if (maxComboThisRun >= 2)  goStack.push({ fn: drawChainSummary,  h: drawChainSummary(0, true) });
    var goTotal = 0;
    for (var gi = 0; gi < goStack.length; gi++) goTotal += goStack[gi].h + (gi ? goGap : 0);
    // Title baseline is cy-50*S with font clamp(36*S,22,52) - keep clear of it.
    var goBottom = cy - 50*S - clamp(36*S, 22, 52) * 0.86;
    var goY = Math.max(clamp(10*S, 8, 18), goBottom - goTotal);
    for (var gj = 0; gj < goStack.length; gj++) {
      goStack[gj].fn(goY, false);
      goY += goStack[gj].h + goGap;
    }
    drawLeaderboard();
    drawYesterdayPill(); // iter#11
    drawWeekBestPill();  // iter#14
    // iter#3: case pill on GAMEOVER (only on desktop - mobile portrait
    // is too tight; the pill IS still on MENU for everyone).
    // Achievement row is MENU-only - on GAMEOVER it stacked under the skin
    // labels and made visual mess (2026-05-15 layout audit).
    if (H >= 720) {
      drawCasePill(H - 80*S);
    }
    // milestone#1/#2: WORKSHOP shortcut from GAMEOVER (top-left, away from the
    // leaderboard / NEW BEST cluster).
    drawWorkshopButton(14*S, 14*S);
    // iter#8: mute toggle (top-right corner)
    drawMuteButton();
  }

  // milestone#1/#2/#3: the WORKSHOP overlay (drawn over a fully-opaque fill).
  if (gs === 'WORKSHOP') {
    drawWorkshop();
  }

  // The donut-box reveal is its own modal state over an opaque fill, so it owns
  // buttons[] outright and nothing behind it stays clickable.
  if (gs === 'BOXOPEN') {
    drawBoxRevealPanel();
  }

  // The three unlock pills share one band, so exactly one is drawn (see
  // pillToastOwner) - otherwise they print over each other.
  var toastOwner = pillToastOwner();
  // iter#3: in-run toast when a new donut tier unlocks during play
  if (toastOwner === 'skin') {
    drawSkinUnlockToast();
  }
  // milestone#1: in-run toast when a Cleaning Tool unlocks from playtime
  if (toastOwner === 'tool') {
    drawToolUnlockToast();
  }
  // milestone - hands-on action-gated tutorial (PLAYING only, drawn on top)
  drawTutorial();
  // iter#6: in-run toast when an achievement unlocks (any state, sits high so
  // it doesn't fight the score HUD or the gameover overlay; off-by-default
  // for MENU so first-load isn't noisy)
  if (toastOwner === 'badge') {
    drawAchievementToast();
  }

  // mobile joystick hint (first 3 seconds of level 1). Localized (Yandex 8.2.3)
  // and raised ABOVE the "next tool in" pill so the two bottom-center hints never
  // overlap (Yandex 1.10.3) - the pill lives at ~H-33*S..H-10*S.
  if (gs === 'PLAYING' && level === 1 && timeLeft > 57 && 'ontouchstart' in window) {
    ctx.globalAlpha = Math.min(1, (timeLeft-57)*3);
    ctx.font = clamp(13*S,10,16)+'px sans-serif';
    ctx.fillStyle = '#888'; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
    ctx.fillText(t('dragHint'), cx, H - 44*S);
    ctx.globalAlpha = 1;
  }

  requestAnimationFrame(frame);
}

// ── SPRITES ──────────────────────────────────────────────────────────────────
// AI-generated sprites under ./sprites/. Loaded once on boot. drawSprite()
// falls back to the procedural drawing functions if a sprite isn't loaded
// (works locally during dev without sprites/, and survives any 404).
var SPRITE_NAMES = ['donut', 'crumb', 'mud', 'wrapper', 'trash'];
var sprites = {};
function loadSprites() {
  return Promise.all(SPRITE_NAMES.map(function(name) {
    return new Promise(function(resolve) {
      var img = new Image();
      img.onload  = function() { sprites[name] = img;  resolve(); };
      img.onerror = function() { sprites[name] = null; resolve(); };
      img.src = './sprites/' + name + '.png';
    });
  }));
}
function drawSpriteAt(name, x, y, size, fallbackFn) {
  var img = sprites[name];
  if (img && img.complete && img.naturalWidth > 0) {
    ctx.drawImage(img, x - size/2, y - size/2, size, size);
  } else if (typeof fallbackFn === 'function') {
    fallbackFn();
  }
}

// ── BOOT ──────────────────────────────────────────────────────────────────────
var started = false;
// Expose game state for the post-build-tester / yandex-testing harness.
// Without this, __gfState() returns null and every state-aware check skips,
// degrading the suite to "generic" adapter mode (2026-05-15 audit).
window.__gfState = function () {
  try {
    return {
      gs: gs,
      level: level,
      score: score,
      best: best,
      timeLeft: timeLeft,
      combo: combo,
      achEarned: (typeof achUnlockedCount === 'number') ? achUnlockedCount : Object.keys(achUnlocked || {}).length,
      achTotal: (typeof ACHIEVEMENTS !== 'undefined') ? ACHIEVEMENTS.length : 5,
      sfxMuted: sfxMuted,
      bestCombo: bestCombo,
      maxComboThisRun: maxComboThisRun,
      lastLevelStars: lastLevelStars,
      totalLevelStars: (typeof totalLevelStars === 'function') ? totalLevelStars() : 0,
      yesterdayScore: yesterdayScore,
      todayBestScore: todayBestScore,
      sprinklesCollected: sprinklesCollected,
      sprinklesOnField: sprinkleList.length,
      lastLevelPerfect: lastLevelPerfect,
      perfectChainAlive: perfectChainAlive,
      chainStartedThisLevel: chainStartedThisLevel,
      weekBestScore: weekBestScore,
      weekBestIsNew: weekBestIsNew,
      // milestone#1/#2 meta
      sprinkles: meta ? meta.sprinkles : 0,
      totalPlayMin: Math.round(totalPlayMin() * 10) / 10,
      toolsOwned: meta ? Object.keys(meta.tools).length : 0,
      equipped: meta ? meta.equipped.slice() : [],
      questsClaimable: questClaimable(),
      pendingLogin: pendingLogin,
      donut: { x: donut.x, y: donut.y, vx: donut.vx, vy: donut.vy },
      pointerActive: pointer.active,
      touchActive: touch.active,
      tutActive: tut.active,
      tutStep: tut.step,
      activeEvent: activeEvent().id,
    };
  } catch (e) { return { __error: String(e) }; }
};

window.render_game_to_text = function () {
  var state = window.__gfState();
  return JSON.stringify({
    coordinateSystem: 'Canvas pixels; origin top-left; +x right; +y down',
    mode: state.gs,
    level: state.level,
    score: state.score,
    timeLeft: state.timeLeft,
    donut: state.donut,
    input: { pointerActive: state.pointerActive, touchActive: state.touchActive },
    tutorialActive: state.tutActive
  });
};
window.advanceTime = function (ms) {
  if (window.__ytPaused) return;
  var steps = Math.max(1, Math.round(Math.max(0, ms) / (1000 / 60)));
  for (var i = 0; i < steps; i++) update(1 / 60);
};

// ── milestone#1/#2 test seams (verify-by-playing; harmless in production) ─────
// Drive the meta in headless Puppeteer: fast-forward playtime, grant currency,
// open the workshop, read state. Mirrors the beast_bazaar/devourling pattern.
window._csInfo = function () {
  return {
    gs: gs, sprinkles: meta ? meta.sprinkles : 0, totalPlayMin: totalPlayMin(),
    toolsOwned: meta ? Object.keys(meta.tools).length : 0,
    equipped: meta ? meta.equipped.slice() : [], nextTool: nextTool() ? nextTool().id : null,
    questsClaimable: questClaimable(), pendingLogin: pendingLogin,
    workshopPill: workshopPillRect, buttons: buttons.map(function(b){ return {x:b.x,y:b.y,w:b.w,h:b.h}; }),
  };
};
window._csSetPlay = function (mins) { if (meta) { meta.totalPlaySec = (mins||0)*60; runPlaySec = 0; checkToolUnlocks(); saveMeta(); } };
window._csGrant = function (n) { awardSprinkles(n||100); };
window._csOpenWorkshop = function () { openWorkshop(); };
window._csTab = function (tab) { workshopTab = (tab === 'quests' ? 'quests' : 'tools'); };

function boot() {
  if (started) return;
  started = true;
  try {
    best = parseInt(localStorage.getItem(BEST_KEY)||'0')||0;
    // Migrate from pre-iter#1 key 'cs_best' if present and larger
    var legacy = parseInt(localStorage.getItem('cs_best')||'0')||0;
    if (legacy > best) { best = legacy; saveBest(); }
  } catch(e) {}
  loadSkinState();      // iter#3
  loadStreak();         // iter#5
  loadAchievements();   // iter#6
  loadMute();           // iter#8
  loadBestCombo();      // iter#9
  loadLevelStars();     // iter#10
  loadProgress();       // MCPlay 2026-07-27 - resume at the last unlocked level
  loadDailyScores();    // iter#11
  recomputeWeekBest();  // iter#14 - seed rolling 7-day ceiling from loaded daily scores
  loadSprinkleStats();  // iter#12
  loadMeta();                  // milestone#1 - the Bakery / tools / sprinkles
  // streak is loaded just above; the login reward scales with it.
  processLoginAndOvernight();  // milestone#2 - overnight accrual + daily login
  ensureDailyQuests();         // milestone#2 - today's 3 quests
  // If lifetime best already crosses higher tiers, mark them seen on first
  // boot so we don't dump multiple toasts on a returning player. checkSkinUnlocks
  // would otherwise fire all of them on the next collect.
  // `unlock` is null for the sixteen box-only donuts. `best >= null` coerces to
  // `best >= 0`, which is true for every player - without the typeof guard a
  // fresh install would mark all twenty as already seen and the first box would
  // open in silence.
  for (var __i=0;__i<DONUT_SKINS.length;__i++) {
    var __s = DONUT_SKINS[__i];
    if (typeof __s.unlock === 'number' && best >= __s.unlock) skinSeen[__s.id] = true;
    if (meta && meta.donuts && meta.donuts[__s.id]) skinSeen[__s.id] = true;
  }
  // Persist in case this was a brand-new install
  try {
    var __ids = Object.keys(skinSeen).filter(function(k){ return skinSeen[k]; });
    localStorage.setItem(SKIN_SEEN_KEY, __ids.join(','));
  } catch(e) {}
  // Guard: if persisted skin is locked (e.g. localStorage tampering, best was
  // reset), revert to strawberry rather than render a tinted donut the player
  // hasn't earned.
  if (!isSkinUnlocked(getSkin(skinId))) { skinId = 'strawberry'; saveSkin(); }
  Promise.race([
    loadSprites(),
    new Promise(function(resolve) { setTimeout(resolve, 3000); })
  ]).then(function() {
    if (window.ysdk && window.ysdk.features && window.ysdk.features.LoadingAPI) {
      window.ysdk.features.LoadingAPI.ready();
    }
    gs = 'MENU';
    lastTs = performance.now();
    requestAnimationFrame(frame);
    // pre-warm today's leaderboard so it shows instantly on first game-over
    fetchLeaderboard();
    // CLAUDE.md #9 - platform builds (Yandex/CrazyGames/GD/GP) inject
    // window.__GF_AUTOSTART so the player drops STRAIGHT into gameplay; the
    // gallery never gets the flag and keeps its MENU. The WORKSHOP / login card
    // stay reachable in-run (the HUD pill) so autostart players aren't stranded.
    if (window.__GF_AUTOSTART && !window._silent && gs === 'MENU') {
      score = 0;
      // Returning players resume at their last unlocked level and skip the
      // coach; only a genuine first-timer (level 1) still gets it. This is the
      // exact path MCPlay boots into, and the exact symptom the reviewer hit
      // on 2026-07-27 ("on reload it starts from the tutorial and level 1").
      var _auto = resumeLevel();
      if (_auto <= 1) maybeStartTutorial();
      startLevel(_auto, true);
    }
    // Signal platform readiness only after the first interactive game frame.
    requestAnimationFrame(function() {
      if (window.__ytSignalGameReady) window.__ytSignalGameReady();
    });
  });
}

// Expose tracked state to window for the deep_playtest harness (and any
// debug overlay). Read-only snapshot via getters so internal mutation still
// drives the values.
Object.defineProperty(window, 'gs',         { get: function(){ return gs; } });
Object.defineProperty(window, 'score',      { get: function(){ return score; } });
Object.defineProperty(window, 'best',       { get: function(){ return best; } });
Object.defineProperty(window, 'level',      { get: function(){ return level; } });
Object.defineProperty(window, 'timeLeft',   { get: function(){ return timeLeft; } });
Object.defineProperty(window, 'combo',      { get: function(){ return combo; } });
Object.defineProperty(window, 'newBest',    { get: function(){ return newBest; } });
Object.defineProperty(window, 'myRank',     { get: function(){ return myRank; } });
Object.defineProperty(window, 'lbCount',    { get: function(){ return leaderboard ? leaderboard.length : 0; } });
Object.defineProperty(window, 'skinId',     { get: function(){ return skinId; } });
// Counts BOTH sources (score ladder + donut case). The old form compared
// `best >= unlock` directly, which is true for every box-only donut because
// their `unlock` is null and `best >= null` is `best >= 0`.
Object.defineProperty(window, 'skinUnlockCount', { get: function(){ return donutOwnedCount(); } });
Object.defineProperty(window, 'donutTotal',   { get: function(){ return donutTotal(); } });
Object.defineProperty(window, 'boxTokens',    { get: function(){ return meta ? meta.boxTokens : 0; } });
Object.defineProperty(window, 'boxAdsUsed',   { get: function(){ return meta ? meta.boxAds : 0; } });
Object.defineProperty(window, 'boxAdsLeft',   { get: function(){ return boxAdsLeft(); } });
Object.defineProperty(window, 'sprinkleBank', { get: function(){ return meta ? meta.sprinkles : 0; } });
Object.defineProperty(window, 'streakBoxDue', { get: function(){ return streakBoxDue(); } });
Object.defineProperty(window, 'daySeed',    { get: function(){ return daySeed; } });
Object.defineProperty(window, 'streak',     { get: function(){ return streak; } });
Object.defineProperty(window, 'streakBest', { get: function(){ return streakBest; } });
// iter#6: badge tracker - playtest can verify unlock-on-collect / unlock-on-level
Object.defineProperty(window, 'achUnlockedCount', { get: function(){ return achUnlockedCount(); } });
Object.defineProperty(window, 'achTotal',         { get: function(){ return ACHIEVEMENTS.length; } });
// iter#8: sfx mute state - playtest can verify persisted toggle
Object.defineProperty(window, 'sfxMuted',         { get: function(){ return sfxMuted; } });
Object.defineProperty(window, 'sfxReady',         { get: function(){ return !!_ac; } });
// iter#9: persistent best-chain tracker - playtest can verify run-max + lifetime
Object.defineProperty(window, 'bestCombo',        { get: function(){ return bestCombo; } });
Object.defineProperty(window, 'maxComboThisRun',  { get: function(){ return maxComboThisRun; } });
// iter#10: per-level star ratings - playtest can verify clear->stars->persist
Object.defineProperty(window, 'lastLevelStars',   { get: function(){ return lastLevelStars; } });
Object.defineProperty(window, 'totalLevelStars',  { get: function(){ return totalLevelStars(); } });
// iter#11: yesterday-vs-today daily-seed delta - playtest can verify record+render
Object.defineProperty(window, 'yesterdayScore',   { get: function(){ return yesterdayScore; } });
Object.defineProperty(window, 'todayBestScore',   { get: function(){ return todayBestScore; } });
// iter#13: PERFECT SWEEP bonus - playtest can verify chain-break detection + bonus award
Object.defineProperty(window, 'lastLevelPerfect',     { get: function(){ return lastLevelPerfect; } });
Object.defineProperty(window, 'perfectChainAlive',    { get: function(){ return perfectChainAlive; } });
Object.defineProperty(window, 'chainStartedThisLevel',{ get: function(){ return chainStartedThisLevel; } });
// iter#14: rolling 7-day best - playtest can verify ceiling recomputes + new-best flag
Object.defineProperty(window, 'weekBestScore',        { get: function(){ return weekBestScore; } });
Object.defineProperty(window, 'weekBestIsNew',        { get: function(){ return weekBestIsNew; } });

(function() {
  if (typeof YaGames === 'undefined') { boot(); return; }
  YaGames.init().then(function(ysdk) {
    window.ysdk = ysdk;
    try {
      var l = ysdk.environment && ysdk.environment.i18n && ysdk.environment.i18n.lang;
      if (l) lang = l.startsWith('ru') ? 'ru' : 'en';
    } catch(e) {}
    boot();
  }).catch(function() { boot(); });
  setTimeout(boot, 3000);
})();

})();
</script>
