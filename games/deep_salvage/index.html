// In-game art is fully procedural - no sprite files.
var SPRITE_NAMES = [];

// ── TUNABLES (every one exposed via GF.exposeState) ────────────────────────
var AIR_MAX               = 100;
var AIR_DRAIN_DIG         = 8;     // air spent fanning one treasure out
var AIR_DRAIN_DEPTH_PER_S = [1.0, 1.6, 2.4, 3.2];   // ambient drain/sec by tier
var DETECTOR_RANGE        = 90;    // design px the ping reacts within
var LOCK_RADIUS           = 26;    // design px to LOCK a hotspot
var DIG_TIME              = 1.4;   // seconds to fan a treasure out
var LOOT_MULT             = 1.0;   // payout multiplier
var UNBANKED_LOSS         = 0.5;   // fraction of unbanked haul lost on forced ascent
var SITE_UNLOCK           = [0, 6, 14, 24];   // uniqueFinds needed per tier
var ITEMS_PER_DIVE        = 6;     // buried items kept active
var COST_SCALE            = 1.85;  // per-level upgrade cost growth

// Hitboxes / sizes (design space 450x800)
var DET_R = 22, ITEM_R = 19;

// ── TREASURE TYPES (gold vector icons, no emoji) ───────────────────────────
var TYPES = [
  { id:'coin',    base:6,  key:'t_coin' },
  { id:'ring',    base:14, key:'t_ring' },
  { id:'cannon',  base:9,  key:'t_cannon' },
  { id:'watch',   base:22, key:'t_watch' },
  { id:'pearl',   base:32, key:'t_pearl' },
  { id:'anchor',  base:26, key:'t_anchor' },
  { id:'gem',     base:40, key:'t_gem' },
  { id:'chalice', base:55, key:'t_chalice' },
  { id:'crown',   base:80, key:'t_crown' },
];
var NT = TYPES.length;

// Per-site loot weights (index matches TYPES). Deeper = richer; all collectable.
var SITES = [
  { key:'site_shallows', payout:1.0, weights:[38,16,22,10, 7, 5, 1.5,0.4,0.1] },
  { key:'site_reef',     payout:1.5, weights:[20,20,12,16,11, 8, 9,  3,  1  ] },
  { key:'site_galleon',  payout:2.2, weights:[ 6,14, 5,16,11,11,16, 14,  7  ] },
  { key:'site_abyss',    payout:3.2, weights:[ 2, 7, 3, 9,12,11,20, 19, 17  ] },
];

// ── UPGRADE SPINE (banked-coin sink) ───────────────────────────────────────
var UPGRADES = [
  { id:'air',    nameKey:'u_air',    descKey:'ud_air',    base:42, max:10 },
  { id:'coil',   nameKey:'u_coil',   descKey:'ud_coil',   base:38, max:10 },
  { id:'dredge', nameKey:'u_dredge', descKey:'ud_dredge', base:52, max:10 },
  { id:'appr',   nameKey:'u_appr',   descKey:'ud_appr',   base:58, max:10 },
];
var lvl = { air:0, coil:0, dredge:0, appr:0 };

function upgradeCost(id) {
  var u = null;
  for (var i = 0; i < UPGRADES.length; i++) if (UPGRADES[i].id === id) u = UPGRADES[i];
  if (!u || lvl[id] >= u.max) return Infinity;
  return Math.round(u.base * Math.pow(COST_SCALE, lvl[id]));
}
function recompute() {
  AIR_MAX        = 100 + lvl.air * 16;
  DETECTOR_RANGE = 90 + lvl.coil * 11;
  LOCK_RADIUS    = 26 + lvl.coil * 3;
  DIG_TIME       = Math.max(0.5, 1.4 - lvl.dredge * 0.12);
  LOOT_MULT      = 1.0 + lvl.appr * 0.2;
}

// ── PERSISTENT META ────────────────────────────────────────────────────────
var coins = 0;           // banked, persisted
var bestHaul = 0;        // persisted
var collected = {};      // "site:typeIdx" -> true, persisted
var site = 0;            // selected site tier

function uniqueFindsCount() { var n = 0; for (var k in collected) if (collected[k]) n++; return n; }
function unlockedSites() {
  var u = uniqueFindsCount(), n = 1;
  for (var i = 1; i < SITE_UNLOCK.length; i++) if (u >= SITE_UNLOCK[i]) n = i + 1;
  return n;
}
function nextUnlockInfo() {
  var u = uniqueFindsCount(), un = unlockedSites();
  if (un >= SITES.length) return null;
  return { need: Math.max(0, SITE_UNLOCK[un] - u), siteIdx: un };
}

// ── GAME STATE ─────────────────────────────────────────────────────────────
var gs = 'MENU';         // MENU | PLAYING | GAMEOVER | UPGRADES | COLLECTION
var air = AIR_MAX;
var haul = 0;            // unbanked coins this dive
var diveFinds = 0;       // treasures recovered this dive
var diveNewUniques = 0;  // new collection entries this dive
var lastBanked = 0, lastLost = 0, lastForced = false;
var items = [];          // buried: { nx, ny, type, shim }
var locked = null;       // current locked item
var digProg = 0;         // 0..1
var detX = 0, detY = 0;  // detector position (px)
var pointerDown = false;
var proximity = 0;       // 0..1 to nearest buried item
var nearAng = 0;         // heading to nearest buried item (drives the directional homing cue)
var pingTimer = 0;
var lowAirBeat = 0;
var glints = [];         // recovered treasure fly-to-haul anim
var T = 0;               // world time accumulator
var forScreenshot = false;

// ── DECOR (procedural, normalized so resize is free) ───────────────────────
var snow = [], bubbles = [], rays = [], wreck = [];
function initDecor() {
  snow = []; bubbles = []; rays = []; wreck = [];
  var i;
  for (i = 0; i < 46; i++) snow.push({ nx:Math.random(), ny:Math.random(), r:0.4+Math.random()*1.4, spd:0.012+Math.random()*0.03, sway:0.3+Math.random()*0.8, ph:Math.random()*6.28 });
  for (i = 0; i < 18; i++) bubbles.push({ nx:Math.random(), ny:Math.random(), r:1+Math.random()*2.6, spd:0.04+Math.random()*0.08, sway:0.6+Math.random()*1.2, ph:Math.random()*6.28 });
  for (i = 0; i < 4; i++) rays.push({ nx:0.15+i*0.24+Math.random()*0.06, w:0.05+Math.random()*0.05, drift:0.01+Math.random()*0.02, ph:Math.random()*6.28 });
  for (i = 0; i < 7; i++) wreck.push({ nx:Math.random(), h:0.12+Math.random()*0.26, w:0.04+Math.random()*0.06, kind:(Math.random()<0.5?0:1) });
}

// ── PLAY AREA ──────────────────────────────────────────────────────────────
function playArea() {
  var S = GF.S;
  var top = GF.clamp(98 * S, 80, 150);
  var bot = GF.clamp(92 * S, 74, 140);
  return { x: 12 * S, y: top, w: GF.W - 24 * S, h: Math.max(60, GF.H - top - bot) };
}
function itemPx(it) { var pa = playArea(); return { x: pa.x + it.nx * pa.w, y: pa.y + it.ny * pa.h }; }

// ── ITEM SPAWN ─────────────────────────────────────────────────────────────
function pickType() {
  var w = SITES[site].weights, tot = 0, i;
  for (i = 0; i < NT; i++) tot += w[i];
  var r = Math.random() * tot;
  for (i = 0; i < NT; i++) { r -= w[i]; if (r <= 0) return i; }
  return 0;
}
function spawnItem(nearDet) {
  var nx, ny;
  if (nearDet) {
    var pa = playArea();
    nx = GF.clamp((detX - pa.x) / pa.w + (Math.random() - 0.5) * 0.24, 0.1, 0.9);
    ny = GF.clamp((detY - pa.y) / pa.h + (Math.random() - 0.5) * 0.24, 0.12, 0.9);
  } else {
    nx = 0.08 + Math.random() * 0.84;
    ny = 0.12 + Math.random() * 0.78;
  }
  items.push({ nx:nx, ny:ny, type:pickType(), shim:Math.random() * 6.28 });
}
function topUpItems() { while (items.length < ITEMS_PER_DIVE) spawnItem(false); }

// ── DIVE LIFECYCLE ─────────────────────────────────────────────────────────
function startDive() {
  recompute();
  site = GF.clamp(site, 0, unlockedSites() - 1);
  air = AIR_MAX;
  haul = 0; diveFinds = 0; diveNewUniques = 0;
  items = []; locked = null; digProg = 0;
  glints = [];
  var pa = playArea();
  detX = pa.x + pa.w * 0.5; detY = pa.y + pa.h * 0.34;
  pointerDown = false; proximity = 0;
  gs = 'PLAYING';
  var firstDive = false;
  try { firstDive = !localStorage.getItem('deep_salvage_seen_tutorial'); } catch (e) {}
  if (firstDive && !forScreenshot) {
    spawnItem(true);           // seed a find right by the detector for the tutorial
    topUpItems();
    GF.tutorial.start([
      { text: GF.t('tut_sweep'), advance:'manual', gesture:'drag',
        target: function () { return { x: detX, y: detY, r: DET_R * GF.S }; },
        target2: function () { var p = items.length ? itemPx(items[0]) : { x: detX, y: detY }; return { x: p.x, y: p.y, r: 30 * GF.S }; } },
      { text: GF.t('tut_dig'), advance:'manual',
        target: function () { var it = locked || items[0]; if (!it) return { x: detX, y: detY, r: 28 * GF.S }; var p = itemPx(it); return { x: p.x, y: p.y, r: 30 * GF.S }; } },
      { text: GF.t('tut_surf'), advance:'auto', after: 2800,
        target: function () { return _surfBtn ? { x: _surfBtn.x + _surfBtn.w / 2, y: _surfBtn.y + _surfBtn.h / 2, r: _surfBtn.h * 0.6 } : { x: GF.W / 2, y: GF.H - 60 * GF.S, r: 30 * GF.S }; } },
    ], { storageKey: 'deep_salvage_seen_tutorial', force: true });
  } else {
    topUpItems();
  }
  GF.sfx('spawn');
  GF.gameStarted();
  GF.saveRun();
}

function surfaceDive(forced) {
  if (gs !== 'PLAYING') return;
  lastForced = !!forced;
  if (forced) {
    lastLost = Math.round(haul * UNBANKED_LOSS);
    lastBanked = haul - lastLost;
    GF.sfx('lose');
    GF.setShake(0.6); GF.juice.flash('#ff3b24', 220, 0.4);
    GF.spawnParticles(GF.W / 2, GF.H * 0.4, '#ff5a3c', 26);
  } else {
    lastLost = 0; lastBanked = haul;
    GF.sfx('win');
    GF.juice.flash('#7fe0ff', 160, 0.25);
  }
  coins += lastBanked;
  if (haul > bestHaul) { bestHaul = haul; if (!forced) GF.happytime(); }
  persistMeta();
  gs = 'GAMEOVER';
  GF.gameEnded();
  GF.saveRun();
}

function recover(it) {
  var p = itemPx(it);
  var val = Math.max(1, Math.round(TYPES[it.type].base * SITES[site].payout * LOOT_MULT));
  haul += val; diveFinds++;
  var key = site + ':' + it.type;
  var isNew = !collected[key];
  if (isNew) { collected[key] = true; diveNewUniques++; }
  var idx = items.indexOf(it); if (idx >= 0) items.splice(idx, 1);
  if (locked === it) { locked = null; digProg = 0; }
  glints.push({ x:p.x, y:p.y, type:it.type, t:0, val:val, isNew:isNew });
  GF.spawnParticles(p.x, p.y, '#ffe9a8', isNew ? 22 : 14);
  GF.spawnFloat(p.x, p.y - 16 * GF.S, '+' + val, '#ffe27a');
  if (isNew) GF.spawnFloat(p.x, p.y - 38 * GF.S, GF.t('new_find'), '#7fffd4');
  if (isNew) GF.sfx('unlock');
  else if (val >= 35) GF.sfx('reward');
  else GF.sfx('coin');
  persistMeta();
  topUpItems();
  GF.saveRun();
}

function buyUpgrade(id) {
  var cost = upgradeCost(id);
  if (!isFinite(cost) || coins < cost) { GF.sfx('error'); GF.setShake(0.18); return; }
  coins -= cost; lvl[id] = (lvl[id] || 0) + 1;
  recompute();
  GF.sfx('levelup');
  GF.spawnFloat(GF.W / 2, GF.H * 0.5, GF.t('new_find'), '#7fffd4');
  persistMeta();
  GF.saveRun();
}

function persistMeta() {
  try {
    localStorage.setItem('deep_salvage_coins', String(Math.floor(coins)));
    localStorage.setItem('deep_salvage_best', String(Math.floor(bestHaul)));
    localStorage.setItem('deep_salvage_coll', JSON.stringify(collected));
    localStorage.setItem('deep_salvage_lvl', JSON.stringify(lvl));
    localStorage.setItem('deep_salvage_site', String(site));
  } catch (e) {}
}

function toMenu() { gs = 'MENU'; GF.saveRun(); }
function toUpgrades() { gs = 'UPGRADES'; GF.saveRun(); }
function toCollection() { gs = 'COLLECTION'; GF.saveRun(); }
function selectSite(s) { if (s >= 0 && s < unlockedSites()) { site = s; GF.sfx('tap'); persistMeta(); } }

// ── UPDATE ─────────────────────────────────────────────────────────────────
function update(dt) {
  T += dt;
  GF.tutorial.update(dt);
  GF.juice.update(dt);

  for (var gi = glints.length - 1; gi >= 0; gi--) { glints[gi].t += dt * 1.9; if (glints[gi].t >= 1) glints.splice(gi, 1); }

  if (gs !== 'PLAYING') return;

  var tutBusy = GF.tutorial.active;
  var range = DETECTOR_RANGE * GF.S, lockR = LOCK_RADIUS * GF.S;

  // nearest buried item -> proximity + lock
  var nearest = null, nd = 1e9;
  for (var i = 0; i < items.length; i++) {
    var p = itemPx(items[i]);
    var d = GF.dist(detX, detY, p.x, p.y);
    if (d < nd) { nd = d; nearest = items[i]; }
  }
  proximity = nearest ? GF.clamp(1 - nd / range, 0, 1) : 0;
  if (nearest) { var nap = itemPx(nearest); nearAng = Math.atan2(nap.y - detY, nap.x - detX); }
  if (nearest && nd <= lockR) locked = nearest;
  else if (locked) { var lp = itemPx(locked); if (GF.dist(detX, detY, lp.x, lp.y) > range * 1.6) locked = null; }

  // Promo capture: freeze a rich mid-dig scene (decor keeps drifting via T, the
  // ping rings + locked shimmer stay live); never set during real play.
  if (forScreenshot) return;

  // tutorial step 0 advances once the player sweeps near the ping
  if (tutBusy && GF.tutorial.step === 0 && proximity > 0.55) GF.tutorial.next();

  // DIG: hold detector over the locked hotspot
  var digging = false;
  if (locked) {
    var lp2 = itemPx(locked);
    var dl = GF.dist(detX, detY, lp2.x, lp2.y);
    if (pointerDown && dl <= lockR * 1.3) {
      digging = true;
      digProg += dt / DIG_TIME;
      if (!tutBusy) air -= (AIR_DRAIN_DIG / DIG_TIME) * dt;
      if (Math.random() < dt * 18) GF.spawnParticles(detX, detY + 6 * GF.S, '#9c8a6a', 2);
      if (digProg >= 1) {
        var done = locked;
        recover(done);
        if (tutBusy && GF.tutorial.step === 1) GF.tutorial.next();
      }
    }
  }
  if (!digging) digProg = Math.max(0, digProg - dt * 0.7);

  // PING audio - rises in rate and pitch with proximity
  pingTimer -= dt;
  if (pingTimer <= 0 && proximity > 0.08) {
    pingTimer = GF.lerp(0.85, 0.1, proximity);
    var freq = 320 + proximity * 980 + (locked ? 140 : 0);
    GF.tone(freq, 0.045, 'sine', 0.05 + proximity * 0.05);
  }

  // ambient air drain by depth (frozen during the tutorial)
  if (!tutBusy) {
    air -= AIR_DRAIN_DEPTH_PER_S[site] * dt;
    if (air < 25) {
      lowAirBeat -= dt;
      if (lowAirBeat <= 0) { lowAirBeat = GF.lerp(0.85, 0.4, GF.clamp((25 - air) / 25, 0, 1)); GF.tone(120, 0.12, 'sine', 0.09, 70); }
    }
    if (air <= 0) { air = 0; surfaceDive(true); return; }
  }
}

// ── DRAW ───────────────────────────────────────────────────────────────────
var _surfBtn=null, _muteBtn=null, _helpBtn=null;        // PLAYING
var _diveBtn=null, _upBtn=null, _collBtn=null, _siteSel=null;   // MENU
var _upCards=[], _upDiveBtn=null, _upBackBtn=null;      // UPGRADES
var _collBackBtn=null;                                  // COLLECTION
var _contBtn=null, _againBtn=null;                      // GAMEOVER

function draw(ctx) {
  drawBg(ctx);
  if (gs === 'PLAYING' || gs === 'GAMEOVER') {
    drawSeabedDecor(ctx);
    drawItems(ctx);
    drawDetector(ctx);
    drawGlints(ctx);
    drawHUD(ctx);
    drawLowAirVignette(ctx);
  }
  if (gs === 'MENU')       drawMenu(ctx);
  if (gs === 'UPGRADES')   drawUpgrades(ctx);
  if (gs === 'COLLECTION') drawCollection(ctx);
  if (gs === 'GAMEOVER')   drawSummary(ctx);
  GF.juice.drawFlash(ctx);
  GF.tutorial.draw(ctx);
}

function siteCols(s) {
  return [['#1f6f7e','#06121f'], ['#1a5e6e','#05101c'], ['#134a5c','#040c17'], ['#0c2c40','#02070f']][s];
}
function drawBg(ctx) {
  var s = Math.min(Math.max(site, 0), SITES.length - 1);
  var c = siteCols(s);
  var g = ctx.createLinearGradient(0, 0, 0, GF.H);
  g.addColorStop(0, c[0]); g.addColorStop(0.35, c[0]); g.addColorStop(1, c[1]);
  ctx.fillStyle = g; ctx.fillRect(0, 0, GF.W, GF.H);
  // drifting caustic god-rays from the surface
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (var i = 0; i < rays.length; i++) {
    var r = rays[i];
    var x = (r.nx + Math.sin(T * r.drift + r.ph) * 0.04) * GF.W;
    var w = r.w * GF.W;
    var rg = ctx.createLinearGradient(x, 0, x + w * 0.6, GF.H);
    rg.addColorStop(0, 'rgba(150,230,245,0.10)');
    rg.addColorStop(1, 'rgba(150,230,245,0)');
    ctx.fillStyle = rg;
    ctx.beginPath();
    ctx.moveTo(x, 0); ctx.lineTo(x + w, 0); ctx.lineTo(x + w * 1.7, GF.H); ctx.lineTo(x + w * 0.7, GF.H);
    ctx.closePath(); ctx.fill();
  }
  ctx.restore();
}

function drawSeabedDecor(ctx) {
  var pa = playArea(), S = GF.S;
  var floorY = pa.y + pa.h;
  ctx.save();
  ctx.fillStyle = 'rgba(2,8,14,0.55)';
  for (var i = 0; i < wreck.length; i++) {
    var wk = wreck[i];
    var x = wk.nx * GF.W + Math.sin(T * 0.05 + i) * 4 * S;
    var h = wk.h * GF.H, w = wk.w * GF.W;
    if (wk.kind === 0) {
      ctx.beginPath(); ctx.ellipse(x, floorY + h * 0.2, w, h, 0, Math.PI, 0); ctx.fill();
    } else {
      ctx.save(); ctx.strokeStyle = 'rgba(2,8,14,0.5)'; ctx.lineWidth = Math.max(3, 5 * S); ctx.lineCap = 'round';
      ctx.beginPath(); ctx.arc(x, floorY + h * 0.7, h, Math.PI * 1.15, Math.PI * 1.85); ctx.stroke();
      ctx.beginPath(); ctx.arc(x + w * 0.5, floorY + h * 0.7, h * 0.8, Math.PI * 1.15, Math.PI * 1.85); ctx.stroke();
      ctx.restore();
    }
  }
  var sg = ctx.createLinearGradient(0, floorY - 8 * S, 0, GF.H);
  sg.addColorStop(0, 'rgba(40,46,40,0)'); sg.addColorStop(1, 'rgba(28,30,26,0.5)');
  ctx.fillStyle = sg; ctx.fillRect(0, floorY - 8 * S, GF.W, GF.H - floorY + 8 * S);
  ctx.restore();
  // marine snow
  ctx.save();
  for (var j = 0; j < snow.length; j++) {
    var sn = snow[j];
    var sy = ((sn.ny + T * sn.spd) % 1) * GF.H;
    var sx = sn.nx * GF.W + Math.sin(T * sn.sway + sn.ph) * 10 * S;
    ctx.globalAlpha = 0.16 + 0.12 * Math.sin(T * 2 + sn.ph);
    ctx.fillStyle = '#cfe6ff';
    ctx.beginPath(); ctx.arc(sx, sy, sn.r * S, 0, 6.283); ctx.fill();
  }
  ctx.globalAlpha = 1;
  // ambient bubbles rising
  for (var b = 0; b < bubbles.length; b++) {
    var bb = bubbles[b];
    var by = (1 - ((bb.ny + T * bb.spd) % 1)) * GF.H;
    var bx = bb.nx * GF.W + Math.sin(T * bb.sway + bb.ph) * 8 * S;
    ctx.strokeStyle = 'rgba(180,225,240,0.22)'; ctx.lineWidth = Math.max(1, S);
    ctx.beginPath(); ctx.arc(bx, by, bb.r * S, 0, 6.283); ctx.stroke();
  }
  ctx.restore();
}

function drawItems(ctx) {
  // buried items are invisible; only a faint "getting warmer" glow when very close.
  for (var i = 0; i < items.length; i++) {
    var it = items[i];
    if (it === locked) continue;
    var p = itemPx(it);
    if (forScreenshot) { drawTreasure(ctx, TYPES[it.type].id, p.x, p.y, ITEM_R * GF.S, 0.82); continue; }
    var d = GF.dist(detX, detY, p.x, p.y);
    var prox = GF.clamp(1 - d / (DETECTOR_RANGE * GF.S), 0, 1);
    if (prox > 0.62) {
      var a = (prox - 0.62) / 0.38;
      ctx.save();
      ctx.globalAlpha = 0.10 + a * 0.28 * (0.6 + 0.4 * Math.sin(T * 6 + it.shim));
      var rg = ctx.createRadialGradient(p.x, p.y, 1, p.x, p.y, 22 * GF.S);
      rg.addColorStop(0, '#ffe9a8'); rg.addColorStop(1, 'rgba(255,233,168,0)');
      ctx.fillStyle = rg; ctx.beginPath(); ctx.arc(p.x, p.y, 22 * GF.S, 0, 6.283); ctx.fill();
      ctx.restore();
    }
  }
  // locked hotspot: shimmer ring + a faint treasure hint that clears as it is fanned
  if (locked) {
    var lp = itemPx(locked), S = GF.S;
    var pul = 0.5 + 0.5 * Math.sin(T * 7);
    ctx.save();
    ctx.globalAlpha = 0.5 + 0.4 * pul;
    ctx.strokeStyle = '#ffe9a8'; ctx.lineWidth = 2.5 * S; ctx.shadowColor = '#ffd34d'; ctx.shadowBlur = 14 * S;
    ctx.beginPath(); ctx.arc(lp.x, lp.y, (14 + 4 * pul) * S, 0, 6.283); ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.globalAlpha = 1;
    var rev = GF.clamp(0.32 + digProg * 0.68, 0, 1);
    var clipR = GF.lerp(9, 17, GF.clamp(digProg, 0, 1)) * S;
    ctx.save();
    ctx.beginPath(); ctx.arc(lp.x, lp.y, clipR, 0, 6.283); ctx.clip();
    drawTreasure(ctx, TYPES[locked.type].id, lp.x, lp.y, ITEM_R * S, rev);
    ctx.restore();
    if (digProg > 0.02) {
      ctx.globalAlpha = 0.9; ctx.strokeStyle = '#7fffd4'; ctx.lineWidth = 3 * S;
      ctx.beginPath(); ctx.arc(lp.x, lp.y, 20 * S, -1.57, -1.57 + 6.283 * GF.clamp(digProg, 0, 1)); ctx.stroke();
    }
    ctx.restore();
  }
}

// signal-strength colour ramp: cyan (cold) -> amber -> gold (hot), so proximity
// reads visually on the coil even with audio muted.
function proxRGB(prox) {
  var c0 = [111, 233, 255], c1 = [255, 180, 74], c2 = [255, 224, 150], r, g, b, t;
  if (prox < 0.6) { t = prox / 0.6; r = c0[0] + (c1[0] - c0[0]) * t; g = c0[1] + (c1[1] - c0[1]) * t; b = c0[2] + (c1[2] - c0[2]) * t; }
  else { t = (prox - 0.6) / 0.4; r = c1[0] + (c2[0] - c1[0]) * t; g = c1[1] + (c2[1] - c1[1]) * t; b = c1[2] + (c2[2] - c1[2]) * t; }
  return [r | 0, g | 0, b | 0];
}
function rgba(c, a) { return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')'; }

function drawDetector(ctx) {
  var S = GF.S;
  var col = locked ? [255, 224, 150] : proxRGB(proximity);
  // swelling proximity halo behind the coil — grows + warms as you home in
  if (proximity > 0.04 || locked) {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    var hr = (DET_R * (1.1 + proximity * 1.7)) * S;
    var hg = ctx.createRadialGradient(detX, detY, 1, detX, detY, hr);
    hg.addColorStop(0, rgba(col, 0.10 + proximity * 0.45));
    hg.addColorStop(1, rgba(col, 0));
    ctx.fillStyle = hg; ctx.beginPath(); ctx.arc(detX, detY, hr, 0, 6.283); ctx.fill();
    ctx.restore();
  }
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  var speed = GF.lerp(0.7, 2.4, proximity);
  for (var k = 0; k < 2; k++) {
    var ph = ((T * speed + k * 0.5) % 1);
    var rr = ph * (DETECTOR_RANGE * 0.7) * S;
    ctx.globalAlpha = (1 - ph) * (0.12 + proximity * 0.55);
    ctx.strokeStyle = rgba(col, 1);
    ctx.lineWidth = (2 + proximity * 2) * S;
    ctx.beginPath(); ctx.arc(detX, detY, Math.max(2, rr), 0, 6.283); ctx.stroke();
  }
  ctx.restore();
  ctx.save();
  var glow = 0.5 + proximity * 0.5;
  ctx.shadowColor = rgba(col, 0.85);
  ctx.shadowBlur = (12 + proximity * 20) * S;
  ctx.strokeStyle = rgba(col, 1);
  ctx.lineWidth = (4 + proximity * 1.5) * S;
  ctx.beginPath(); ctx.arc(detX, detY, DET_R * S, 0, 6.283); ctx.stroke();
  ctx.globalAlpha = 0.35 + 0.3 * glow;
  ctx.strokeStyle = '#cffaff'; ctx.lineWidth = 1.6 * S;
  ctx.beginPath(); ctx.arc(detX, detY, DET_R * S * 0.62, 0, 6.283); ctx.stroke();
  ctx.shadowBlur = 0; ctx.globalAlpha = 1;
  // directional "warmer" cue: an arrowhead on the rim aimed at the nearest buried item
  if (!locked && proximity > 0.12) {
    ctx.save();
    var er = DET_R * S * 1.5;
    ctx.translate(detX + Math.cos(nearAng) * er, detY + Math.sin(nearAng) * er);
    ctx.rotate(nearAng);
    ctx.globalAlpha = 0.2 + proximity * 0.7;
    ctx.fillStyle = rgba(col, 1); ctx.shadowColor = rgba(col, 0.9); ctx.shadowBlur = 8 * S;
    var a = (5 + proximity * 3) * S;
    ctx.beginPath(); ctx.moveTo(a, 0); ctx.lineTo(-a * 0.7, a * 0.8); ctx.lineTo(-a * 0.7, -a * 0.8); ctx.closePath(); ctx.fill();
    ctx.restore();
  }
  // handle stem
  ctx.strokeStyle = 'rgba(180,210,225,0.5)'; ctx.lineWidth = 3 * S;
  ctx.beginPath(); ctx.moveTo(detX, detY - DET_R * S); ctx.lineTo(detX + 6 * S, detY - DET_R * S - 18 * S); ctx.stroke();
  ctx.restore();
}

function drawGlints(ctx) {
  for (var i = 0; i < glints.length; i++) {
    var g = glints[i];
    var t = GF.clamp(g.t, 0, 1);
    var ease = t * t * (3 - 2 * t);
    var tx = GF.W - 30 * GF.S, ty = 40 * GF.S;
    var x = GF.lerp(g.x, tx, ease);
    var y = GF.lerp(g.y, ty, ease) - Math.sin(ease * Math.PI) * 44 * GF.S;
    var sz = (ITEM_R * GF.S) * (1 - t * 0.45);
    ctx.save(); ctx.globalAlpha = 1 - t * 0.25;
    drawTreasure(ctx, TYPES[g.type].id, x, y, sz, 1);
    if (t < 0.4) { ctx.globalAlpha = (0.4 - t) / 0.4; ctx.strokeStyle = '#fff'; ctx.lineWidth = 2 * GF.S;
      ctx.beginPath(); ctx.arc(x, y, sz * (1 + t * 2), 0, 6.283); ctx.stroke(); }
    ctx.restore();
  }
}

// ── TREASURE ICONS (gold vector, reveal 0..1) ──────────────────────────────
function goldGrad(ctx, x, y, r) {
  var g = ctx.createRadialGradient(x - r * 0.3, y - r * 0.3, r * 0.1, x, y, r);
  g.addColorStop(0, '#fff6cf'); g.addColorStop(0.5, '#ffd34d'); g.addColorStop(1, '#b8860b');
  return g;
}
function drawTreasure(ctx, id, x, y, r, reveal) {
  reveal = reveal == null ? 1 : reveal;
  ctx.save();
  ctx.globalAlpha *= GF.clamp(0.25 + reveal * 0.75, 0, 1);
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  var gold = goldGrad(ctx, x, y, r);
  if (id === 'coin') {
    ctx.fillStyle = gold; ctx.beginPath(); ctx.arc(x, y, r, 0, 6.283); ctx.fill();
    ctx.strokeStyle = 'rgba(120,80,10,0.6)'; ctx.lineWidth = r * 0.12; ctx.beginPath(); ctx.arc(x, y, r * 0.72, 0, 6.283); ctx.stroke();
    ctx.fillStyle = 'rgba(120,80,10,0.55)'; ctx.font = 'bold ' + (r * 1.1) + 'px serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('S', x, y + r * 0.05);
  } else if (id === 'ring') {
    ctx.strokeStyle = gold; ctx.lineWidth = r * 0.42; ctx.beginPath(); ctx.arc(x, y + r * 0.2, r * 0.7, 0, 6.283); ctx.stroke();
    ctx.fillStyle = '#8fe6ff'; ctx.beginPath(); ctx.arc(x, y - r * 0.55, r * 0.34, 0, 6.283); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.7)'; ctx.beginPath(); ctx.arc(x - r * 0.1, y - r * 0.65, r * 0.12, 0, 6.283); ctx.fill();
  } else if (id === 'cannon') {
    var ig = ctx.createRadialGradient(x - r * 0.3, y - r * 0.3, r * 0.1, x, y, r);
    ig.addColorStop(0, '#6b7079'); ig.addColorStop(1, '#1c1f24');
    ctx.fillStyle = ig; ctx.beginPath(); ctx.arc(x, y, r * 0.95, 0, 6.283); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.4)'; ctx.beginPath(); ctx.arc(x - r * 0.35, y - r * 0.35, r * 0.18, 0, 6.283); ctx.fill();
  } else if (id === 'watch') {
    ctx.fillStyle = gold; ctx.beginPath(); ctx.arc(x, y + r * 0.1, r * 0.85, 0, 6.283); ctx.fill();
    ctx.fillStyle = '#2a2410'; ctx.beginPath(); ctx.arc(x, y + r * 0.1, r * 0.62, 0, 6.283); ctx.fill();
    ctx.strokeStyle = gold; ctx.lineWidth = r * 0.16;
    ctx.beginPath(); ctx.moveTo(x, y + r * 0.1); ctx.lineTo(x, y - r * 0.3); ctx.moveTo(x, y + r * 0.1); ctx.lineTo(x + r * 0.3, y + r * 0.1); ctx.stroke();
    ctx.fillStyle = gold; ctx.beginPath(); ctx.arc(x, y - r * 0.78, r * 0.18, 0, 6.283); ctx.fill();
  } else if (id === 'pearl') {
    ctx.fillStyle = gold;
    ctx.beginPath(); ctx.arc(x, y + r * 0.2, r, Math.PI, 0); ctx.fill();
    ctx.strokeStyle = 'rgba(120,80,10,0.5)'; ctx.lineWidth = r * 0.1;
    for (var f = -2; f <= 2; f++) { ctx.beginPath(); ctx.moveTo(x, y + r * 0.2); ctx.lineTo(x + f * r * 0.42, y - r * 0.7); ctx.stroke(); }
    var pg = ctx.createRadialGradient(x - r * 0.2, y - r * 0.1, r * 0.1, x, y + r * 0.1, r * 0.5);
    pg.addColorStop(0, '#ffffff'); pg.addColorStop(1, '#cfd8e6');
    ctx.fillStyle = pg; ctx.beginPath(); ctx.arc(x, y + r * 0.08, r * 0.4, 0, 6.283); ctx.fill();
  } else if (id === 'anchor') {
    ctx.strokeStyle = gold; ctx.lineWidth = r * 0.22;
    ctx.beginPath(); ctx.arc(x, y - r * 0.6, r * 0.28, 0, 6.283); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x, y - r * 0.32); ctx.lineTo(x, y + r * 0.7); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x - r * 0.5, y + r * 0.1); ctx.lineTo(x + r * 0.5, y + r * 0.1); ctx.stroke();
    ctx.beginPath(); ctx.arc(x, y + r * 0.2, r * 0.6, Math.PI * 0.15, Math.PI * 0.85); ctx.stroke();
  } else if (id === 'gem') {
    var gg = ctx.createLinearGradient(x, y - r, x, y + r);
    gg.addColorStop(0, '#bff6ff'); gg.addColorStop(0.5, '#4ad6f0'); gg.addColorStop(1, '#1f8fb0');
    ctx.fillStyle = gg;
    ctx.beginPath(); ctx.moveTo(x, y - r); ctx.lineTo(x + r * 0.85, y - r * 0.1); ctx.lineTo(x, y + r); ctx.lineTo(x - r * 0.85, y - r * 0.1); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.6)'; ctx.lineWidth = r * 0.08;
    ctx.beginPath(); ctx.moveTo(x - r * 0.85, y - r * 0.1); ctx.lineTo(x + r * 0.85, y - r * 0.1); ctx.moveTo(x, y - r); ctx.lineTo(x, y + r); ctx.stroke();
  } else if (id === 'chalice') {
    ctx.fillStyle = gold;
    ctx.beginPath(); ctx.moveTo(x - r * 0.6, y - r * 0.6); ctx.lineTo(x + r * 0.6, y - r * 0.6); ctx.lineTo(x + r * 0.36, y + r * 0.05); ctx.lineTo(x - r * 0.36, y + r * 0.05); ctx.closePath(); ctx.fill();
    ctx.fillRect(x - r * 0.1, y + r * 0.05, r * 0.2, r * 0.5);
    ctx.beginPath(); ctx.ellipse(x, y + r * 0.72, r * 0.5, r * 0.16, 0, 0, 6.283); ctx.fill();
    ctx.fillStyle = '#e8455f'; ctx.beginPath(); ctx.arc(x, y - r * 0.36, r * 0.14, 0, 6.283); ctx.fill();
  } else if (id === 'crown') {
    ctx.fillStyle = gold;
    ctx.beginPath();
    ctx.moveTo(x - r * 0.85, y + r * 0.5); ctx.lineTo(x - r * 0.85, y - r * 0.3);
    ctx.lineTo(x - r * 0.42, y + r * 0.1); ctx.lineTo(x, y - r * 0.6); ctx.lineTo(x + r * 0.42, y + r * 0.1);
    ctx.lineTo(x + r * 0.85, y - r * 0.3); ctx.lineTo(x + r * 0.85, y + r * 0.5); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#e8455f'; ctx.beginPath(); ctx.arc(x, y + r * 0.28, r * 0.13, 0, 6.283); ctx.fill();
    ctx.fillStyle = '#5ad6f0';
    ctx.beginPath(); ctx.arc(x - r * 0.5, y + r * 0.3, r * 0.1, 0, 6.283); ctx.arc(x + r * 0.5, y + r * 0.3, r * 0.1, 0, 6.283); ctx.fill();
  } else {
    ctx.fillStyle = gold; ctx.beginPath(); ctx.arc(x, y, r, 0, 6.283); ctx.fill();
  }
  ctx.restore();
}

function drawCoinIcon(ctx, x, y, r) {
  ctx.save();
  ctx.fillStyle = goldGrad(ctx, x, y, r); ctx.beginPath(); ctx.arc(x, y, r, 0, 6.283); ctx.fill();
  ctx.strokeStyle = 'rgba(120,80,10,0.55)'; ctx.lineWidth = Math.max(1, r * 0.16); ctx.beginPath(); ctx.arc(x, y, r * 0.66, 0, 6.283); ctx.stroke();
  ctx.restore();
}

// ── HUD ────────────────────────────────────────────────────────────────────
function fitFont(ctx, text, maxW, basePx, weight) {
  var px = basePx; weight = weight || 'bold ';
  ctx.font = weight + px + 'px sans-serif';
  while (px > 9 && ctx.measureText(text).width > maxW) { px--; ctx.font = weight + px + 'px sans-serif'; }
  return px;
}
function hit(b, x, y) { return b && x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h; }

function drawHUD(ctx) {
  var S = GF.S, W = GF.W, H = GF.H;
  var pad = GF.clamp(12 * S, 8, 16);
  var btn = GF.clamp(34 * S, 30, 44);

  // top-center AIR gauge
  var barW = GF.clamp(W * 0.42, 140, 250), barH = GF.clamp(15 * S, 12, 20);
  var bx = (W - barW) / 2, by = pad;
  GF.rr(ctx, bx, by, barW, barH, barH / 2); ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fill();
  var af = GF.clamp(air / AIR_MAX, 0, 1);
  GF.rr(ctx, bx, by, Math.max(barH, barW * af), barH, barH / 2);
  var ag = ctx.createLinearGradient(bx, by, bx + barW, by);
  if (af < 0.25) { ag.addColorStop(0, '#ff3b24'); ag.addColorStop(1, '#ff7a4a'); }
  else { ag.addColorStop(0, '#36c9ff'); ag.addColorStop(1, '#7fe6c0'); }
  ctx.fillStyle = ag; ctx.fill();
  ctx.lineWidth = Math.max(1.4 * S, 1.1);
  ctx.strokeStyle = af < 0.25 ? 'rgba(255,80,50,' + (0.5 + 0.5 * Math.sin(T * 9)) + ')' : 'rgba(200,240,255,0.4)';
  ctx.stroke();
  ctx.fillStyle = '#fff'; ctx.font = 'bold ' + GF.clamp(10 * S, 9, 13) + 'px sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(GF.t('air'), bx + barW / 2, by + barH / 2);

  // (proximity/"signal strength" now reads off the detector coil itself — colour
  // ramp + swelling halo + directional arrow — so no second bar under AIR to be
  // misread as a resource gauge.)

  // top-left: site + next unlock
  ctx.textAlign = 'left'; ctx.textBaseline = 'top';
  ctx.font = 'bold ' + GF.clamp(15 * S, 12, 20) + 'px sans-serif'; ctx.fillStyle = '#cde6ff';
  ctx.fillText(GF.t(SITES[site].key), pad, pad);
  var nu = nextUnlockInfo();
  ctx.font = GF.clamp(11 * S, 9, 14) + 'px sans-serif'; ctx.fillStyle = '#8fb6c8';
  if (nu) ctx.fillText(GF.t('unlocks_in') + ' ' + nu.need + ' ' + GF.t('need_finds'), pad, pad + GF.clamp(18 * S, 14, 24));

  // top-right: ? + coins + haul
  _helpBtn = { x: W - pad - btn, y: pad, w: btn, h: btn };
  hudIconBtn(ctx, _helpBtn);
  ctx.fillStyle = '#cde6ff'; ctx.font = 'bold ' + (btn * 0.5) + 'px sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('?', _helpBtn.x + btn / 2, _helpBtn.y + btn / 2 + btn * 0.02);

  ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
  var cy2 = pad + btn + 12 * S;
  drawCoinIcon(ctx, W - pad - GF.clamp(8 * S, 6, 11), cy2, GF.clamp(8 * S, 6, 11));
  ctx.font = 'bold ' + GF.clamp(15 * S, 12, 20) + 'px sans-serif'; ctx.fillStyle = '#ffd86a';
  ctx.fillText(String(Math.floor(coins)), W - pad - GF.clamp(20 * S, 16, 26), cy2);
  ctx.font = 'bold ' + GF.clamp(13 * S, 10, 17) + 'px sans-serif'; ctx.fillStyle = '#9fe8c5';
  ctx.fillText(GF.t('haul') + ' +' + Math.floor(haul), W - pad, cy2 + GF.clamp(20 * S, 16, 26));

  // bottom-center SURFACE button
  var sw = GF.clamp(170 * S, 130, 240), sh = GF.clamp(52 * S, 44, 64);
  _surfBtn = { x: (W - sw) / 2, y: H - sh - GF.clamp(16 * S, 10, 24), w: sw, h: sh };
  var sg = ctx.createLinearGradient(_surfBtn.x, _surfBtn.y, _surfBtn.x, _surfBtn.y + sh);
  sg.addColorStop(0, '#2fb6c9'); sg.addColorStop(1, '#1a6e8e');
  GF.rr(ctx, _surfBtn.x, _surfBtn.y, sw, sh, sh / 2); ctx.fillStyle = sg; ctx.fill();
  ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  fitFont(ctx, GF.t('surface'), sw - 30 * S, GF.clamp(20 * S, 15, 26));
  ctx.fillText(GF.t('surface'), W / 2, _surfBtn.y + sh / 2);

  // bottom-left mute
  var mb = GF.clamp(34 * S, 30, 44);
  _muteBtn = { x: pad, y: H - pad - mb, w: mb, h: mb };
  hudIconBtn(ctx, _muteBtn);

function drawLowAirVignette(ctx) {

// ── OVERLAYS ───────────────────────────────────────────────────────────────
function wrapLines(ctx, text, maxW) {

}

  GF.rr(ctx, bx, y, bw, bh, bh / 2); ctx.fillStyle = g; ctx.fill();

function drawUpgrades(ctx) {

    else {

  var bb = GF.clamp(34 * S, 30, 44);
  _upBackBtn = backButton(ctx, GF.clamp(12 * S, 8, 18), hy, bb);
}

  ctx.strokeStyle = '#cdeaff'; ctx.lineWidth = Math.max(2.4 * GF.S, 1.8); ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  var c2x = x + bb / 2, c2y = y + bb / 2;

function drawCollection(ctx) {
  drawScrim(ctx, 0.94);
  var S = GF.S, W = GF.W, H = GF.H, cx = W / 2;
  ctx.font = 'bold ' + GF.clamp(26 * S, 19, 34) + 'px sans-serif'; ctx.fillStyle = '#dff4ff';
  ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  var hy = GF.clamp(14 * S, 10, 22);
  ctx.fillText(GF.t('collection'), cx, hy);
  ctx.font = GF.clamp(12 * S, 10, 15) + 'px sans-serif'; ctx.fillStyle = '#8fb6c8';
  ctx.fillText(uniqueFindsCount() + ' / ' + (NT * SITES.length) + '   ' + GF.t('finds_word'), cx, hy + GF.clamp(32 * S, 24, 42));

// ── INPUT ──────────────────────────────────────────────────────────────────
function canvasXY(clientX, clientY) {
  var rect = GF.canvas.getBoundingClientRect();
  var sx = GF.canvas.width / rect.width, sy = GF.canvas.height / rect.height;
  return { x: (clientX - rect.left) * sx, y: (clientY - rect.top) * sy };
}
function inPlay(x, y) { var pa = playArea(); return x >= pa.x && x <= pa.x + pa.w && y >= pa.y && y <= pa.y + pa.h; }
function clampDet(x, y) { var pa = playArea(); detX = GF.clamp(x, pa.x, pa.x + pa.w); detY = GF.clamp(y, pa.y, pa.y + pa.h); }

var _lastTs = 0, _lpx = -999, _lpy = -999;
function pressDown(x, y) {
  var now = Date.now();
  if (now - _lastTs < 250 && Math.abs(x - _lpx) < 22 && Math.abs(y - _lpy) < 22) return;
  _lastTs = now; _lpx = x; _lpy = y;

  if (GF.tutorial.active) {
    var sb = GF.tutorial._skipBtn;
    if (sb && x >= sb.x && x <= sb.x + sb.w && y >= sb.y && y <= sb.y + sb.h) {
      GF.tutorial.active = false;
      try { localStorage.setItem('deep_salvage_seen_tutorial', '1'); } catch (e) {}
      return;
    }
  }

  if (gs === 'MENU') {
    if (hit(_helpBtn, x, y)) { GF.tutorial.reopen(); return; }
    if (hit(_muteBtn, x, y)) { GF.toggleMute(); return; }
    if (hit(_diveBtn, x, y)) { startDive(); return; }
    if (hit(_upBtn, x, y)) { toUpgrades(); return; }
    if (hit(_collBtn, x, y)) { toCollection(); return; }
    if (hit(_siteSel, x, y)) { var un = unlockedSites(); if (un > 1) selectSite((site + 1) % un); return; }
    return;
  }
  if (gs === 'UPGRADES') {
    if (hit(_upBackBtn, x, y)) { toMenu(); return; }
    if (hit(_upDiveBtn, x, y)) { startDive(); return; }
    for (var j = 0; j < _upCards.length; j++) if (hit(_upCards[j], x, y) && !_upCards[j].maxed) { buyUpgrade(_upCards[j].id); return; }
    return;
  }
  if (gs === 'COLLECTION') { if (hit(_collBackBtn, x, y)) { toMenu(); return; } return; }
  if (gs === 'GAMEOVER') {
    if (hit(_againBtn, x, y)) { startDive(); return; }
    if (hit(_contBtn, x, y)) { toMenu(); return; }
    return;
  }
  if (gs === 'PLAYING') {
    if (hit(_helpBtn, x, y)) { GF.tutorial.reopen(); return; }
    if (hit(_muteBtn, x, y)) { GF.toggleMute(); return; }
    if (hit(_surfBtn, x, y)) { surfaceDive(false); return; }
    if (inPlay(x, y)) { pointerDown = true; clampDet(x, y); }
  }
}
function pressMove(x, y) { if (gs === 'PLAYING' && inPlay(x, y)) clampDet(x, y); }
function pressUp() { pointerDown = false; }

var _pointerSeen = false;
GF.canvas.addEventListener('pointerdown', function (e) { _pointerSeen = true; var p = canvasXY(e.clientX, e.clientY); pressDown(p.x, p.y); });
GF.canvas.addEventListener('pointermove', function (e) { _pointerSeen = true; var p = canvasXY(e.clientX, e.clientY); pressMove(p.x, p.y); });
GF.canvas.addEventListener('pointerup', function () { pressUp(); });
GF.canvas.addEventListener('pointercancel', function () { pressUp(); });
window.addEventListener('blur', function () { pressUp(); });
GF.canvas.addEventListener('touchstart', function (e) {
  if (_pointerSeen) return;
  if (e.changedTouches && e.changedTouches.length) { var t = e.changedTouches[0], p = canvasXY(t.clientX, t.clientY); pressDown(p.x, p.y); }
}, { passive: false });
GF.canvas.addEventListener('touchmove', function (e) {
  if (_pointerSeen) return;
  if (e.changedTouches && e.changedTouches.length) { var t = e.changedTouches[0], p = canvasXY(t.clientX, t.clientY); pressMove(p.x, p.y); }
}, { passive: false });
GF.canvas.addEventListener('touchend', function () { if (_pointerSeen) return; pressUp(); }, { passive: false });
GF.canvas.addEventListener('touchcancel', function () { if (_pointerSeen) return; pressUp(); }, { passive: false });

// ── STATE / GATE HOOKS ─────────────────────────────────────────────────────
GF.exposeState(function () {
  return {
    gs: gs,
    coins: Math.floor(coins),
    bestHaul: Math.floor(bestHaul),
    air: Math.round(air),
    AIR_MAX: AIR_MAX,
    haul: Math.floor(haul),
    diveFinds: diveFinds,
    uniqueFinds: uniqueFindsCount(),
    site: site,
    detX: Math.round(detX),
    detY: Math.round(detY),
    proximity: Math.round(proximity * 100) / 100,
    locked: !!locked,
    digProg: Math.round(digProg * 100) / 100,
    AIR_DRAIN_DIG: AIR_DRAIN_DIG,
    AIR_DRAIN_DEPTH_PER_S: AIR_DRAIN_DEPTH_PER_S,
    DETECTOR_RANGE: DETECTOR_RANGE,
    LOCK_RADIUS: LOCK_RADIUS,
    DIG_TIME: DIG_TIME,
    LOOT_MULT: LOOT_MULT,
    UNBANKED_LOSS: UNBANKED_LOSS,
    SITE_UNLOCK: SITE_UNLOCK,
    ITEMS_PER_DIVE: ITEMS_PER_DIVE,
    COST_SCALE: COST_SCALE,
    upAir: lvl.air, upCoil: lvl.coil, upDredge: lvl.dredge, upAppr: lvl.appr,
  };
});

// Bot driver for the autonomous progression probe (decision/management game).
GF.exposeBot(
  function () {
    if (gs === 'PLAYING') { var a = ['sweep']; if (locked) a.push('dig'); if (haul > 0) a.push('surface'); return a; }
    if (gs === 'GAMEOVER') return ['continue'];
    if (gs === 'MENU' || gs === 'UPGRADES') {
      var acts = ['dive'];
      for (var i = 0; i < UPGRADES.length; i++) { var c = upgradeCost(UPGRADES[i].id); if (isFinite(c) && coins >= c) acts.push('buy_' + UPGRADES[i].id); }
      return acts;
    }
    return [];
  },
  function (a) {
    if (a === 'dive') { startDive(); return; }
    if (a === 'continue') { toMenu(); return; }
    if (a === 'surface') { surfaceDive(false); return; }
    if (a && a.indexOf('buy_') === 0) { buyUpgrade(a.slice(4)); return; }
    if (a === 'sweep') {
      var nearest = null, nd = 1e9;
      for (var i = 0; i < items.length; i++) { var p = itemPx(items[i]); var d = GF.dist(detX, detY, p.x, p.y); if (d < nd) { nd = d; nearest = items[i]; } }
      if (nearest) { var np = itemPx(nearest); detX = np.x; detY = np.y; pointerDown = true; }
      return;
    }
    if (a === 'dig') { if (locked) { var lp = itemPx(locked); detX = lp.x; detY = lp.y; pointerDown = true; } return; }
  }
);

function _reachItem(arr, id, b) { if (b) arr.push({ id: id, x: b.x, y: b.y, w: b.w, h: b.h, pinned: true }); }
GF.exposeReach(function () {
  var it = [];
  if (gs === 'MENU') {
    _reachItem(it, 'dive', _diveBtn); _reachItem(it, 'upgrades', _upBtn); _reachItem(it, 'collection', _collBtn);
    _reachItem(it, 'help', _helpBtn); _reachItem(it, 'mute', _muteBtn); _reachItem(it, 'site', _siteSel);
  } else if (gs === 'UPGRADES') {
    _reachItem(it, 'back', _upBackBtn); _reachItem(it, 'dive', _upDiveBtn);
    for (var j = 0; j < _upCards.length; j++) _reachItem(it, 'card' + j, _upCards[j]);
  } else if (gs === 'COLLECTION') { _reachItem(it, 'back', _collBackBtn); }
  else if (gs === 'GAMEOVER') { _reachItem(it, 'again', _againBtn); _reachItem(it, 'continue', _contBtn); }
  else if (gs === 'PLAYING') { _reachItem(it, 'surface', _surfBtn); _reachItem(it, 'help', _helpBtn); _reachItem(it, 'mute', _muteBtn); }
  return { screen: gs, items: it, viewportH: GF.H, screenH: GF.H };
});
GF.exposeTour([
  { name: 'menu', go: function () { gs = 'MENU'; } },
  { name: 'upgrades', go: function () { gs = 'UPGRADES'; } },
  { name: 'collection', go: function () { gs = 'COLLECTION'; } },
  { name: 'gameover', go: function () { lastForced = false; lastBanked = 120; gs = 'GAMEOVER'; } },
  { name: 'playing', go: function () { if (gs !== 'PLAYING') startDive(); } },
]);

window._setState = function (s) { gs = s; };
window._getI18N = function () { return STRINGS; };
window._getFontBody = function () { return 'sans-serif'; };

// Deterministic PLAY/CTA locator for the QA gates (DIVE on MENU / DIVE AGAIN on summary).
window.__gfPlayRect = function () {
  try {
    var b = (gs === 'MENU') ? _diveBtn : (gs === 'GAMEOVER') ? _againBtn : null;
    if (!b) return null;
    var r = GF.canvas.getBoundingClientRect();
    var sx = r.width / GF.canvas.width, sy = r.height / GF.canvas.height;
    return { x: r.left + b.x * sx, y: r.top + b.y * sy, w: b.w * sx, h: b.h * sy,
             cx: r.left + (b.x + b.w / 2) * sx, cy: r.top + (b.y + b.h / 2) * sy };
  } catch (e) { return null; }
};

// ── SCREENSHOT / GATE HOOKS ────────────────────────────────────────────────
function _seedRichDive(siteParam) {
  forScreenshot = true;
  try { localStorage.setItem('deep_salvage_seen_tutorial', '1'); } catch (e) {}
  GF.tutorial.active = false;
  lvl = { air:3, coil:3, dredge:3, appr:3 }; recompute();
  collected = {};
  for (var s = 0; s < 3; s++) for (var t = 0; t < 8; t++) collected[s + ':' + t] = true;
  site = GF.clamp(siteParam, 0, SITES.length - 1);
  startDive();
  haul = 280 + site * 90; diveFinds = 7;
  items = [];
  var pa = playArea();
  detX = pa.x + pa.w * 0.5; detY = pa.y + pa.h * 0.46;
  // a field of high-value treasures spread across the seabed (revealed only in
  // capture mode), plus a locked, mostly-fanned crown right under the detector.
  var spread = [[0.18,0.2,8],[0.78,0.28,7],[0.3,0.74,6],[0.7,0.7,8],[0.5,0.18,4],[0.86,0.56,6],[0.14,0.56,5]];
  for (var o = 0; o < spread.length; o++) items.push({ nx: spread[o][0], ny: spread[o][1], type: spread[o][2], shim: Math.random() * 6.28 });
  items.push({ nx: (detX - pa.x) / pa.w, ny: (detY - pa.y) / pa.h, type: site >= 2 ? 8 : 6, shim: 0 });
  locked = items[items.length - 1];
  digProg = 0.9; proximity = 0.95; pointerDown = false;
  gs = 'PLAYING';
}
window._setupForScreenshot = function (level) { _seedRichDive(GF.clamp((level || 3) - 1, 0, 2)); };
window._jumpLevel = function (n) {
  try { localStorage.setItem('deep_salvage_seen_tutorial', '1'); } catch (e) {}
  GF.tutorial.active = false;
  if (n >= 90) {
    lvl = { air:2, coil:2, dredge:2, appr:2 }; recompute();
    collected = {}; for (var s = 0; s < 2; s++) for (var t = 0; t < 6; t++) collected[s + ':' + t] = true;
    site = 1; startDive(); haul = 320; diveFinds = 8; air = 0; surfaceDive(true);
    return;
  }
  _seedRichDive(GF.clamp((n || 1) - 1, 0, 2));
};

// ── ECONOMY SIM HOOK (econ_sim_check; only when __gfSimMode set pre-boot) ───
if (window.__gfSimMode) {
  // Realistic dive-and-air-bounded economy: a dive recovers an AIR-limited number
  // of finds, then surfaces and banks. Income/sec = haulPerDive / diveSeconds, all
  // wired to the SHIPPED constants (air, dig cost, depth drain, payouts, upgrade
  // effects). Deeper sites pay far more but drain air faster; upgrades deepen the
  // sink for ~20 min before the tree is exhausted.
  window.__gfEcon = {
    genre: 'merge',
    params: {
      costs: { air: 42, coil: 38, dredge: 52, appr: 58 }, max: 10, COST_SCALE: COST_SCALE,
      payout: [1.0, 1.5, 2.2, 3.2], avgBase: [13, 20, 32, 42], SITE_UNLOCK: SITE_UNLOCK,
      AIR_DRAIN_DIG: 8, depthDrain: [1.0, 1.6, 2.4, 3.2],
      airPerLvl: 16, apprStep: 0.2, dredgeStep: 0.12, overhead: 9, sweepSec: 3,
    },
    initialState: function () { return { coins: 0, lvl: { air: 0, coil: 0, dredge: 0, appr: 0 }, finds: 0, t: 0 }; },
    actions: function (st) {
      var P = this.params, out = [], lines = ['air', 'coil', 'dredge', 'appr'];
      for (var i = 0; i < lines.length; i++) {
        var id = lines[i];
        if (st.lvl[id] >= P.max) continue;
        var c = Math.round(P.costs[id] * Math.pow(P.COST_SCALE, st.lvl[id]));
        out.push({ id: id, cost: c, ready: st.coins >= c });
      }
      return out;
    },
    _site: function (st) { var u = 0; for (var i = 1; i < this.params.SITE_UNLOCK.length; i++) if (st.finds >= this.params.SITE_UNLOCK[i]) u = i; return u; },
    _dive: function (st) {
      var P = this.params, s = this._site(st);
      var airMax = 100 + P.airPerLvl * st.lvl.air;
      var digTime = Math.max(0.5, 1.4 - P.dredgeStep * st.lvl.dredge);
      var secPerFind = P.sweepSec + digTime;
      var airPerFind = P.AIR_DRAIN_DIG + P.depthDrain[s] * secPerFind;
      var finds = Math.min(8, airMax / airPerFind);
      var lootMult = 1 + P.apprStep * st.lvl.appr;
      var haul = finds * P.avgBase[s] * P.payout[s] * lootMult;
      var secs = finds * secPerFind + P.overhead;
      return { incomePerSec: haul / secs, findsPerSec: finds / secs };
    },
    step: function (st, action) {
      if (action.id === 'wait') {
        var dt = action.dt || 1, d = this._dive(st);
        st.coins += d.incomePerSec * dt;
        st.finds = Math.min(46, st.finds + d.findsPerSec * dt * Math.max(0.14, 1 - st.finds / 46) * 1.7);
        st.t += dt;
      } else if (action.id && action.cost != null) {
        st.coins -= action.cost; st.lvl[action.id] = (st.lvl[action.id] || 0) + 1;
      }
      return st;
    },
    metrics: function (st) {
      return { currency: st.coins, progress: st.finds + (st.lvl.air + st.lvl.coil + st.lvl.dredge + st.lvl.appr) };
    },
  };
}

// ── BOOT ───────────────────────────────────────────────────────────────────
GF.init({
  designW: 450,
  designH: 800,
  strings: STRINGS,
  sprites: SPRITE_NAMES,
  saveKey: 'deep_salvage',
  onReady: function () {
    initDecor();
    try { coins = parseFloat(localStorage.getItem('deep_salvage_coins') || '0') || 0; } catch (e) {}
    try { bestHaul = parseFloat(localStorage.getItem('deep_salvage_best') || '0') || 0; } catch (e) {}
    try { var cj = JSON.parse(localStorage.getItem('deep_salvage_coll') || 'null'); if (cj && typeof cj === 'object') collected = cj; } catch (e) {}
    try { var lj = JSON.parse(localStorage.getItem('deep_salvage_lvl') || 'null'); if (lj) { lvl.air = lj.air || 0; lvl.coil = lj.coil || 0; lvl.dredge = lj.dredge || 0; lvl.appr = lj.appr || 0; } } catch (e) {}
    try { site = parseInt(localStorage.getItem('deep_salvage_site') || '0') || 0; } catch (e) {}
    site = GF.clamp(site, 0, unlockedSites() - 1);
    recompute();

    GF.persist('deep_salvage_run_v1',
      function () { return { coins: coins, bestHaul: bestHaul, collected: collected, lvl: lvl, site: site }; },
      function (s) {
        if (!s) return;
        if (typeof s.coins === 'number') coins = s.coins;
        if (typeof s.bestHaul === 'number') bestHaul = s.bestHaul;
        if (s.collected && typeof s.collected === 'object') collected = s.collected;
        if (s.lvl) { lvl.air = s.lvl.air || 0; lvl.coil = s.lvl.coil || 0; lvl.dredge = s.lvl.dredge || 0; lvl.appr = s.lvl.appr || 0; }
        if (typeof s.site === 'number') site = s.site;
        recompute();
        gs = 'MENU';   // never resume mid-dive
      }
    );

    GF.bgMusic({ file: 'audio/bg_loop.mp3', preset: 'calm', muted: GF.muted });

    if (window.__GF_AUTOSTART && !window._silent && gs === 'MENU') {
      startDive();
    }
  },
  onUpdate: update,
  onDraw: draw,
});

})();
</script>
