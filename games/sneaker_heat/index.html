// ════════════════════════════════════════════════════════════════════════════
// HELPERS
// ════════════════════════════════════════════════════════════════════════════
function skById(id) { for (var i = 0; i < SNEAKERS.length; i++) if (SNEAKERS[i].id === id) return SNEAKERS[i]; return SNEAKERS[0]; }
function prof(id) { return collection[id]; }
function ownedList() { return SNEAKERS.filter(function (s) { return prof(s.id).owned; }); }
function lockedList() { return SNEAKERS.filter(function (s) { return !prof(s.id).owned; }); }
function ownedCount() { return ownedList().length; }
function totalBond() { var t = 0; for (var i = 0; i < SNEAKERS.length; i++) t += prof(SNEAKERS[i].id).bond; return t; }
function collectionValue() { var v = 0; for (var i = 0; i < SNEAKERS.length; i++) { var p = prof(SNEAKERS[i].id); if (p.owned) v += RARITY[SNEAKERS[i].rarity].val + p.bond; } return v; }
function rarityColor(r) { return RARITY[r].color; }
function fmt(n) { return Math.floor(n).toLocaleString('en-US'); }
function rint(min, max) { return min + Math.floor(Math.random() * (max - min + 1)); }
function skName(sk) { return GF.lang === 'ru' ? sk.name_ru : sk.name; }
function dropName(d) { return GF.lang === 'ru' ? d.name_ru : d.name; }
function dropSub(d) { return GF.lang === 'ru' ? d.sub_ru : d.sub; }
function todayKey() { return new Date().toDateString(); }
function dailyAvailable() { return lastDaily !== todayKey(); }
function dropUnlocked(d) { return !d.unlock || ownedCount() >= d.unlock; }

function hexA(hex, a) {
  var h = hex.replace('#', '');
  var r = parseInt(h.substring(0, 2), 16), g = parseInt(h.substring(2, 4), 16), b = parseInt(h.substring(4, 6), 16);
  return 'rgba(' + r + ',' + g + ',' + b + ',' + a + ')';
}
function weightedChoice(entries, wOf) {
  var total = 0, i;
  for (i = 0; i < entries.length; i++) total += wOf(entries[i]);
  var roll = Math.random() * total;
  for (i = 0; i < entries.length; i++) { roll -= wOf(entries[i]); if (roll <= 0) return entries[i]; }
  return entries[entries.length - 1];
}
function hypePct() {
  var host = skById(showcaseId);
  var hb = prof(showcaseId).owned ? RARITY[host.rarity].hostBonus : 0;
  return ownedCount() * HYPE_PER_SNEAKER + totalBond() * HYPE_PER_BOND + hb;
}
function toast(text, gold) { toasts.push({ text: text, t: 0, gold: !!gold }); while (toasts.length > 3) toasts.shift(); }

    marketHistory: marketHistory.slice(-10), bestMult: bestMult,
    totalWagered: totalWagered, totalWon: totalWon

}
function restore(s) {
  if (!s) return;
  credits = typeof s.credits === 'number' ? s.credits : START_CREDITS;
  bet = s.bet || 25;
  var base = freshCollection();
  if (s.collection) { for (var i = 0; i < SNEAKERS.length; i++) { var id = SNEAKERS[i].id; base[id] = Object.assign(base[id], s.collection[id] || {}); } }
  collection = base;
  casesOpened = s.casesOpened || 0;
  pityNew = s.pityNew || 0;
  compsTaken = s.compsTaken || 0;
  lastDaily = s.lastDaily || '';
  showcaseId = (s.showcaseId && prof(s.showcaseId) && prof(s.showcaseId).owned) ? s.showcaseId : 'court';
  marketHistory = Array.isArray(s.marketHistory) ? s.marketHistory.slice(-10) : [];
  bestMult = s.bestMult || 0;
  totalWagered = s.totalWagered || 0; totalWon = s.totalWon || 0;
}
function save() { GF.saveRun(); }

// ════════════════════════════════════════════════════════════════════════════
// LAYOUT (recomputed each frame → hit rects in screen space)
// ════════════════════════════════════════════════════════════════════════════
var L = {}, hit = {};
function layout() {
  var W = GF.W, H = GF.H, S = GF.S;
  L.W = W; L.H = H; L.S = S;
  // Centered portrait play column (portrait-first). On a wide/landscape viewport
  // the content is a centered column matching the 440x900 design aspect, so the
  // layout never stretches into giant overflowing cards; sides letterbox.
  var colW = Math.min(W, Math.round(H * (440 / 900)));
  L.appX = Math.round((W - colW) / 2); L.appW = colW; L.acx = L.appX + colW / 2;
  L.topH = Math.max(48, 56 * S);
  L.navH = Math.max(52, 60 * S);
  L.pad = 14 * S;
  L.y0 = L.topH; L.y1 = H - L.navH; L.ch = L.y1 - L.y0;
  var AX = L.appX, AW = L.appW;
  var mr = 40 * S;
  hit.mute = { x: AX + AW - mr - 8 * S, y: (L.topH - mr) / 2, w: mr, h: mr };
  hit.help = { x: AX + AW - mr * 2 - 16 * S, y: (L.topH - mr) / 2, w: mr, h: mr };
  hit.comp = null;
  hit.nav = [];
  var tabs = ['drops', 'market', 'album'];
  var tw = AW / 3;
  for (var i = 0; i < 3; i++) hit.nav.push({ x: AX + i * tw, y: L.y1, w: tw, h: L.navH, id: tabs[i] });
}

// ════════════════════════════════════════════════════════════════════════════
// VECTOR ICONS + SNEAKER ART (no emoji anywhere)

function drawCoin(c, x, y, r, col) {
  col = col || '#f2c14e';
  c.save();
  var g = c.createRadialGradient(x - r * 0.32, y - r * 0.32, r * 0.15, x, y, r);
  g.addColorStop(0, '#ffe9a8'); g.addColorStop(1, col);
  c.fillStyle = g; c.strokeStyle = hexA('#7a5a12', 0.65); c.lineWidth = Math.max(1, r * 0.1);
  c.beginPath(); c.arc(x, y, r, 0, Math.PI * 2); c.fill(); c.stroke();
  if (r > 10) { // chip edge notches only when big enough to read
    c.strokeStyle = hexA('#7a5a12', 0.35); c.lineWidth = Math.max(1, r * 0.12);
    for (var i = 0; i < 8; i++) { var a = i / 8 * Math.PI * 2; c.beginPath(); c.moveTo(x + Math.cos(a) * r * 0.84, y + Math.sin(a) * r * 0.84); c.lineTo(x + Math.cos(a) * r * 0.98, y + Math.sin(a) * r * 0.98); c.stroke(); }
  }
  c.strokeStyle = hexA('#fff6d8', 0.7); c.lineWidth = Math.max(1, r * 0.08);
  c.beginPath(); c.arc(x, y, r * 0.58, 0, Math.PI * 2); c.stroke();
  c.fillStyle = hexA('#ffffff', 0.4); c.beginPath(); c.arc(x - r * 0.3, y - r * 0.3, r * 0.2, 0, Math.PI * 2); c.fill();
  c.restore();
}
function drawShard(c, x, y, r, col) {
  col = col || '#7fe0ff';
  c.save();
  c.translate(x, y);
  var g = c.createLinearGradient(-r, -r, r, r);
  g.addColorStop(0, '#ffffff'); g.addColorStop(0.5, col); g.addColorStop(1, hexA(col, 0.7));
  c.fillStyle = g; c.strokeStyle = hexA('#0a2a33', 0.4); c.lineWidth = Math.max(1, r * 0.1);
  c.beginPath(); c.moveTo(0, -r); c.lineTo(r * 0.8, 0); c.lineTo(0, r); c.lineTo(-r * 0.8, 0); c.closePath();
  c.fill(); c.stroke();
  c.strokeStyle = hexA('#ffffff', 0.6); c.beginPath(); c.moveTo(0, -r); c.lineTo(0, r); c.stroke();
  c.restore();
}
function roundRectPath(c, x, y, w, h, r) { GF.rr(c, x, y, w, h, r); }

// Side-profile sneaker (facing right). box ≈ overall width; rarity glow optional.
function drawSneaker(c, sk, cx, cy, box, opts) {

  var u = box / 100;
  c.save();
  c.translate(cx, cy + box * 0.06);
  var high = sk.shape === 'high', chunky = sk.shape === 'chunky';
  var rc = rarityColor(sk.rarity);
  // rarity glow halo
  if (opts.glow) {
    var gg = c.createRadialGradient(0, 0, box * 0.08, 0, 0, box * 0.68);
    gg.addColorStop(0, hexA(rc, opts.glowA != null ? opts.glowA : 0.45));
    gg.addColorStop(1, hexA(rc, 0));
    c.fillStyle = gg; c.beginPath(); c.arc(0, -box * 0.02, box * 0.68, 0, Math.PI * 2); c.fill();
  }
  var ground = 27 * u;
  var soleH = chunky ? 15 * u : 10 * u;
  var soleTop = ground - soleH;
  var bodyTop = high ? -30 * u : -21 * u;

  c.lineJoin = 'round'; c.lineCap = 'round';
  c.shadowColor = hexA('#000000', 0.28); c.shadowBlur = 6 * u; c.shadowOffsetY = 4 * u;

  // --- sole (midsole) ---
  c.fillStyle = sk.sole;
  c.beginPath();
  c.moveTo(-46 * u, soleTop + soleH * 0.35);
  c.quadraticCurveTo(-49 * u, ground, -40 * u, ground);
  c.lineTo(38 * u, ground);
  c.quadraticCurveTo(50 * u, ground, 49 * u, soleTop + soleH * 0.2);
  c.quadraticCurveTo(48 * u, soleTop, 40 * u, soleTop + 1 * u);
  c.lineTo(-40 * u, soleTop + 1 * u);
  c.quadraticCurveTo(-47 * u, soleTop + 1 * u, -46 * u, soleTop + soleH * 0.35);
  c.closePath(); c.fill();
  c.shadowColor = 'transparent'; c.shadowBlur = 0; c.shadowOffsetY = 0;

  // outsole accent strip
  c.fillStyle = sk.accent;
  c.beginPath();
  c.moveTo(-44 * u, ground - 3 * u);
  c.lineTo(40 * u, ground - 3 * u);
  c.quadraticCurveTo(49 * u, ground - 3 * u, 47 * u, ground - 1 * u);
  c.quadraticCurveTo(44 * u, ground, 38 * u, ground);
  c.lineTo(-40 * u, ground);
  c.quadraticCurveTo(-47 * u, ground, -44 * u, ground - 3 * u);
  c.closePath(); c.fill();

  // --- upper body ---
  var bg = c.createLinearGradient(0, bodyTop, 0, soleTop);
  bg.addColorStop(0, sk.base);
  bg.addColorStop(1, shade(sk.base, -0.14));
  c.fillStyle = bg;
  c.strokeStyle = shade(sk.base, -0.28); c.lineWidth = 1.4 * u;
  c.beginPath();
  c.moveTo(-42 * u, soleTop);
  c.lineTo(-41 * u, bodyTop + (high ? 4 * u : 9 * u));            // heel back
  c.quadraticCurveTo(-40 * u, bodyTop, -32 * u, bodyTop);          // heel top
  c.quadraticCurveTo(-24 * u, bodyTop - (high ? 5 * u : 1 * u), -17 * u, bodyTop + 7 * u); // collar dip
  c.lineTo(-11 * u, bodyTop + 3 * u);                              // tongue base
  c.quadraticCurveTo(-4 * u, bodyTop - 3 * u, 5 * u, bodyTop + 4 * u); // tongue top
  c.quadraticCurveTo(28 * u, bodyTop + 7 * u, 45 * u, soleTop - 8 * u); // forefoot to toe
  c.quadraticCurveTo(48 * u, soleTop - 2 * u, 44 * u, soleTop);    // toe corner
  c.lineTo(-42 * u, soleTop);                                      // back along sole
  c.closePath(); c.fill(); c.stroke();

  // toe cap
  c.fillStyle = shade(sk.base, -0.1);
  c.beginPath();
  c.moveTo(30 * u, soleTop);
  c.quadraticCurveTo(30 * u, soleTop - 9 * u, 40 * u, soleTop - 7 * u);
  c.quadraticCurveTo(48 * u, soleTop - 2 * u, 44 * u, soleTop);
  c.closePath(); c.fill();

  // collar padding (back)
  c.fillStyle = shade(sk.base, 0.08);
  c.beginPath();
  c.moveTo(-40 * u, bodyTop + (high ? 4 * u : 9 * u));
  c.quadraticCurveTo(-40 * u, bodyTop - 2 * u, -32 * u, bodyTop - 1 * u);
  c.quadraticCurveTo(-27 * u, bodyTop, -30 * u, bodyTop + 8 * u);
  c.closePath(); c.fill();

  // swoosh / signature stripe (accent)
  c.strokeStyle = sk.accent; c.lineWidth = 4.4 * u; c.lineCap = 'round';
  c.beginPath();
  c.moveTo(38 * u, soleTop - 9 * u);
  c.quadraticCurveTo(6 * u, soleTop - 2 * u, -20 * u, bodyTop + 12 * u);
  c.stroke();

  // laces
  c.strokeStyle = sk.lace; c.lineWidth = 2 * u;
  for (var i = 0; i < 3; i++) {
    var lx = -8 * u + i * 6 * u;
    c.beginPath();
    c.moveTo(lx, bodyTop + 5 * u + i * 1.5 * u);
    c.lineTo(lx + 6 * u, bodyTop + 9 * u + i * 1.5 * u);
    c.stroke();
  }
  // heel tab (rarity chip)
  c.fillStyle = rc;
  roundRectPath(c, -41 * u, bodyTop + 1 * u, 6 * u, 5 * u, 1.5 * u); c.fill();

  // prism shimmer
  if (sk.prism) {
    var pg = c.createLinearGradient(-40 * u, 0, 45 * u, 0);
    pg.addColorStop(0, hexA('#ff6fb5', 0.0)); pg.addColorStop(0.4, hexA('#6fe3ff', 0.35));
    pg.addColorStop(0.6, hexA('#c58bff', 0.35)); pg.addColorStop(1, hexA('#ffd76f', 0.0));
    c.fillStyle = pg;
    c.beginPath();
    c.moveTo(-42 * u, soleTop); c.lineTo(45 * u, soleTop - 8 * u); c.lineTo(30 * u, bodyTop + 6 * u); c.lineTo(-30 * u, bodyTop);
    c.closePath(); c.fill();
  }
  c.restore();
}
function shade(hex, amt) {
  var h = hex.replace('#', '');
  var r = parseInt(h.substring(0, 2), 16), g = parseInt(h.substring(2, 4), 16), b = parseInt(h.substring(4, 6), 16);
  if (amt >= 0) { r = r + (255 - r) * amt; g = g + (255 - g) * amt; b = b + (255 - b) * amt; }
  else { r = r * (1 + amt); g = g * (1 + amt); b = b * (1 + amt); }
  return 'rgb(' + Math.round(r) + ',' + Math.round(g) + ',' + Math.round(b) + ')';
}
function drawShoebox(c, x, y, w, h, col, accent, lidOpen) {
  c.save();
  // box body
  c.fillStyle = col; c.strokeStyle = hexA('#000000', 0.25); c.lineWidth = Math.max(1, w * 0.02);
  roundRectPath(c, x, y + h * 0.28, w, h * 0.72, w * 0.06); c.fill(); c.stroke();
  // band
  c.fillStyle = accent;
  c.fillRect(x, y + h * 0.5, w, h * 0.12);
  // lid
  c.fillStyle = shade(col, 0.1); c.strokeStyle = hexA('#000000', 0.25);
  var ly = lidOpen ? y : y + h * 0.18;
  c.save();
  if (lidOpen) c.translate(x + w * 0.5, ly + h * 0.12), c.rotate(-0.12), c.translate(-(x + w * 0.5), -(ly + h * 0.12));
  roundRectPath(c, x - w * 0.03, ly, w * 1.06, h * 0.22, w * 0.05); c.fill(); c.stroke();
  c.restore();
  c.restore();
}

// ════════════════════════════════════════════════════════════════════════════
// DROP LOGIC - roll, atomic settle, reel
// ════════════════════════════════════════════════════════════════════════════
function rollRarity(def) {
  var entries = [];
  for (var k in def.rarities) entries.push({ r: k, w: def.rarities[k] });
  return weightedChoice(entries, function (e) { return e.w; }).r;
}
function rollOutcome(def) {
  // Pity: fire the guarantee when the miss counter reaches CAP-1 (the >= CAP-1
  // off-by-one lesson from the Velvet Room engine).
  if (pityNew >= PITY_CAP - 1 && lockedList().length) {
    var pool = lockedList();
    var sk = weightedChoice(pool, function (s) { return def.rarities[s.rarity] || 1; });
    return { kind: 'sneaker', sk: sk, isNew: true, pity: true };
  }
  var slot = weightedChoice(def.kinds, function (k) { return k.weight; });
  if (slot.kind === 'credits') return { kind: 'credits', amount: rint(slot.min, slot.max) };
  if (slot.kind === 'shards') {
    var op = ownedList(); var t = op[Math.floor(Math.random() * op.length)] || SNEAKERS[0];
    return { kind: 'shards', amount: rint(slot.min, slot.max), sk: t };
  }
  var rarity = rollRarity(def);
  var rp = SNEAKERS.filter(function (s) { return s.rarity === rarity; });
  if (!rp.length) rp = SNEAKERS;
  var chosen = rp[Math.floor(Math.random() * rp.length)];
  return { kind: 'sneaker', sk: chosen, isNew: !prof(chosen.id).owned };
}
function addShards(sk, amount) {
  var p = prof(sk.id);
  p.shards += amount;
  while (p.shards >= SHARDS_PER_BOND && p.bond < BOND_MAX) {
    p.shards -= SHARDS_PER_BOND; p.bond += 1;
    if (p.bond === 3) toast(skName(sk) + ': ' + GF.t('signedUnlock'), true);
    else toast(skName(sk) + ' ' + GF.t('deadstockUp') + ' ' + p.bond + ' - +1% ' + GF.t('hype'), true);
  }
}
function applyOutcome(o) {
  casesOpened += 1;
  if (o.kind === 'sneaker') {
    var p = prof(o.sk.id);
    if (o.isNew) {
      p.owned = true; p.copies = 1; p.bond = Math.max(1, p.bond); pityNew = 0;
      if (ownedCount() === SNEAKERS.length) { winFlash = 3.2; }
      return;
    }
    p.copies += 1; pityNew += 1; addShards(o.sk, RARITY[o.sk.rarity].shards);
    return;
  }
  pityNew += 1;
  if (o.kind === 'credits') credits += o.amount;
  if (o.kind === 'shards' && o.sk) addShards(o.sk, o.amount);
}

function reelEntryRandom(def) {
  var slot = weightedChoice(def.kinds, function (k) { return k.weight; });
  if (slot.kind === 'credits') return { kind: 'credits', amount: rint(slot.min, slot.max) };
  if (slot.kind === 'shards') return { kind: 'shards', amount: rint(slot.min, slot.max) };
  var rarity = rollRarity(def);
  var rp = SNEAKERS.filter(function (s) { return s.rarity === rarity; });
  return { kind: 'sneaker', sk: rp[Math.floor(Math.random() * rp.length)] || SNEAKERS[0] };
}
function openDrop(dropId, free) {
  if (reel || reveal) return;
  var def = null; for (var i = 0; i < DROPS.length; i++) if (DROPS[i].id === dropId) def = DROPS[i];
  if (!def) return;
  if (!dropUnlocked(def)) { toast(GF.t('hypeVaultLocked')); GF.sfx('error'); return; }
  if (!free) {
    if (credits < def.cost) { toast(GF.t('notEnough')); GF.sfx('error'); return; }
    credits -= def.cost;
  }
  // NOTE: `free` only means "no charge" - it does NOT consume the daily. The daily
  // (claimDaily) sets lastDaily itself, so the rewarded free-drop never burns it.
  var outcome = rollOutcome(def);
  // ── Atomic settlement: apply + save BEFORE the reel animates, so a mid-spin
  //    reload never burns the drop cost. The reel is pure presentation. ──
  applyOutcome(outcome);
  save();

  var entries = [];
  for (var e = 0; e < REEL_COUNT; e++) entries.push(e === REEL_FINAL ? outcome : reelEntryRandom(def));
  reel = { dropId: dropId, free: !!free, outcome: outcome, entries: entries, t: 0, dur: 4.6, skip: false, done: false, tickIdx: -1 };
  overlay = null;
  GF.sfx('click');
  // tutorial: opening advances step 0
  if (GF.tutorial.active && GF.tutorial.step === 0) GF.tutorial.next();
}
function updateReel(dt) {
  if (!reel || reel.done) return;
  if (reel.skip) reel.t = reel.dur;
  else reel.t += dt;
  var p = Math.min(1, reel.t / reel.dur);
  var S = GF.S;
  var TILE = 104 * S;
  var vpW = Math.min(GF.W - 28 * S, 380 * S);
  var jitter = reel._jit != null ? reel._jit : (reel._jit = (Math.random() - 0.5) * TILE * 0.5);
  var target = REEL_FINAL * TILE + TILE / 2 - vpW / 2 + jitter;
  var x = target * easeOutQuint(p);
  var centerIdx = Math.floor((x + vpW / 2) / TILE);
  if (centerIdx !== reel.tickIdx) { reel.tickIdx = centerIdx; if (p < 0.985) GF.sfx('tap'); }
  reel._x = x;
  if (p >= 1) { reel.done = true; landReel(); }
}
function easeOutQuint(t) { return 1 - Math.pow(1 - t, 5); }
function landReel() {
  GF.sfx('coin');
  var o = reel.outcome;
  reveal = { outcome: o, dropId: reel.dropId, t: 0 };
  // juice by rarity / payout
  if (o.kind === 'sneaker' && o.sk.rarity === 'SSR') { flash('#fff2c0', 0.5); GF.setShake(9); GF.sfx('win'); burstAt(GF.cx, GF.y0Reveal(), rarityColor('SSR'), 26); }
  else if (o.kind === 'sneaker' && o.isNew) { GF.sfx('unlock'); burstAt(GF.cx, GF.y0Reveal(), rarityColor(o.sk.rarity), 18); }
  else if (o.kind === 'credits') { GF.sfx('coin'); }
  else { GF.sfx('reward'); }
  if (GF.tutorial.active && GF.tutorial.step === 1) GF.tutorial.next();
}
function keepReveal() {
  if (!reveal) return;
  var wasSneaker = reveal.outcome.kind === 'sneaker';
  reveal = null; reel = null;
  GF.sfx('click');
  save();
  if (GF.tutorial.active && GF.tutorial.step === 2) GF.tutorial.next();
}
function openAgain() {
  if (!reveal) return;
  var id = reveal.dropId; reveal = null; reel = null;
  openDrop(id, false);
}

// ════════════════════════════════════════════════════════════════════════════
// HYPE MARKET (crash)
// ════════════════════════════════════════════════════════════════════════════
function sampleBust() { var u = Math.random(); var b = HOUSE_EDGE / (1 - u); return Math.max(1.0, Math.min(BUST_MAX, b)); }
function startMarket() {
  if (market.phase === 'running') return;
  if (credits < bet) { toast(GF.t('notEnough')); GF.sfx('error'); return; }
  credits -= bet; totalWagered += bet;
  market.bet = bet; market.bust = sampleBust(); market.phase = 'running';
  market.elapsed = 0; market.mult = 1; market.points = [{ t: 0, m: 1 }]; market.won = null; market.doneT = 0;
  GF.sfx('click'); save();
}
function updateMarket(dt) {
  if (market.phase !== 'running') return;
  market.elapsed += dt;
  market.mult = Math.exp(CRASH_K * market.elapsed);
  if (market.mult >= market.bust) { market.mult = market.bust; market.points.push({ t: market.elapsed, m: market.bust }); endMarket(false); return; }
  market.points.push({ t: market.elapsed, m: market.mult });
  if (market.points.length > 400) market.points.splice(0, market.points.length - 400);
}
function cashOut() { if (market.phase === 'running') endMarket(true); }
function endMarket(won) {
  market.phase = 'done'; market.doneT = 0;
  marketHistory.push(market.bust); marketHistory = marketHistory.slice(-10);
  if (won) {
    var bonus = hypePct();
    var win = Math.round(market.bet * market.mult * (1 + bonus / 100));
    credits += win; totalWon += win; market.lastWin = win; market.won = true;
    bestMult = Math.max(bestMult, market.mult);
    GF.sfx('reward'); if (market.mult >= 3) { GF.sfx('win'); flash('#c9ffd6', 0.4); }
    burstAt(GF.cx, GF.y0 ? GF.y0 : GF.cy, '#5fe08a', 20);
    toast(GF.t('bank') + ' +' + fmt(win) + ' (' + GF.t('hype') + ' +' + bonus + '%)', true);
  } else {
    market.won = false; market.lastWin = 0;
    GF.sfx('lose'); GF.setShake(10); flash('#ff6b6b', 0.35);
    gs = 'GAMEOVER';  // soft round-loss = the lose condition the harness reads
  }
  save();
}

// ════════════════════════════════════════════════════════════════════════════
// FX
// ════════════════════════════════════════════════════════════════════════════
function flash(col, a) { flashCol = col; flashT = a || 0.4; }
function burstAt(x, y, col, n) { GF.spawnParticles(x, y, col, n || 14); }
// convenience: where the reveal art sits (for particle bursts)
GF.y0Reveal = function () { return GF.H * 0.4; };

// ════════════════════════════════════════════════════════════════════════════
// COMP + daily + showcase + nav
// ════════════════════════════════════════════════════════════════════════════
function takeComp() {
  GF.showAd('rewarded').then(function (res) {
    var doubled = !!(res && res.rewarded);
    credits += doubled ? COMP_AMOUNT * 2 : COMP_AMOUNT;
    compsTaken += 1; GF.sfx('coin');
    toast(GF.t(doubled ? 'compBigNote' : 'compNote'), true);
    save();
  });
}
// Rewarded-video helper: onReward grants; a no-fill / no-SDK result still honors
// the base reward (Yandex 1.15 - progress never blocks on an ad). Single-grant guarded.
function watchRewarded(grantFn) {
  var done = false, g = function () { if (done) return; done = true; grantFn(); };
  GF.ads.rewarded({ onReward: g }).then(function (r) { if (!r || !r.shown) g(); });
}
function watchFreeDrop() { // rewarded "+1 free Street Drop" - once per session
  if (rewardedDropUsed || reel || reveal) return;
  watchRewarded(function () { if (rewardedDropUsed) return; rewardedDropUsed = true; openDrop('street', true); });
}
function claimDaily() { if (!dailyAvailable()) return; lastDaily = todayKey(); openDrop('heat', true); }
function setShowcase(id) { if (!prof(id).owned) { toast(GF.t('lockedTip')); return; } showcaseId = id; GF.sfx('click'); toast(skName(skById(id)) + ' ' + GF.t('hostingNow'), true); save(); }
function setView(v) {
  if (view === v) return;
  view = v; GF.sfx('tap'); save();
  if (v === 'market' && GF.tutorial.active && GF.tutorial.step === 3) GF.tutorial.next();
}
function startPlaying() {
  gs = 'PLAYING';
  if (!seenTutorial()) startTutorial();
  GF.gameStarted();
  save();
}
function seenTutorial() { try { return !!localStorage.getItem(TUT_KEY); } catch (e) { return false; } }

// ════════════════════════════════════════════════════════════════════════════
// TUTORIAL (interactive, action-gated; advances from the real action code)
// ════════════════════════════════════════════════════════════════════════════
function tutTargetDrop() { var r = hit.drops && hit.drops[0]; return r ? { x: r.x + r.w * 0.5, y: r.y + r.h * 0.5, r: r.h * 0.42 } : { x: GF.cx, y: GF.H * 0.4, r: 40 }; }
function tutTargetReel() { return { x: GF.cx, y: GF.H * 0.42, r: 60 * GF.S }; }
function tutTargetKeep() { var r = hit.keep; return r ? { x: r.x + r.w * 0.5, y: r.y + r.h * 0.5, r: r.h * 0.7 } : { x: GF.cx, y: GF.H * 0.78, r: 44 }; }
function tutTargetMarket() { var r = hit.nav && hit.nav[1]; return r ? { x: r.x + r.w * 0.5, y: r.y + r.h * 0.5, r: r.h * 0.5 } : { x: GF.cx, y: GF.H - 30, r: 40 }; }
function startTutorial() {
  GF.tutorial.start([
    { text: GF.t('tut_open'), target: tutTargetDrop, advance: 'manual', gesture: 'tap' },
    { text: GF.t('tut_skip'), target: tutTargetReel, advance: 'manual', gesture: 'tap' },
    { text: GF.t('tut_keep'), target: tutTargetKeep, advance: 'manual', gesture: 'tap' },
    { text: GF.t('tut_market'), target: tutTargetMarket, advance: 'auto', after: 4200, gesture: 'tap' }
  ], { storageKey: TUT_KEY });
}

// ════════════════════════════════════════════════════════════════════════════
// INPUT
// ════════════════════════════════════════════════════════════════════════════
function evtXY(e) {
  if (e.touches && e.touches.length) return { x: e.touches[0].clientX, y: e.touches[0].clientY };
  if (e.changedTouches && e.changedTouches.length) return { x: e.changedTouches[0].clientX, y: e.changedTouches[0].clientY };
  return { x: e.clientX, y: e.clientY };
}
function inRect(x, y, r) { return r && x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h; }
function onTap(x, y) {
  // MENU: any tap starts (robust for the 9-point gate sweep)
  if (gs === 'MENU') { startPlaying(); GF.sfx('click'); return; }
  // GAMEOVER (soft market bust): any tap returns to play
  if (gs === 'GAMEOVER') {
    gs = 'PLAYING'; GF.sfx('click');
    var nowAd = performance.now();
    if (nowAd - lastInterAt > 180000) { lastInterAt = nowAd; GF.showAd('midgame'); }
    return;
  }

  // top-bar controls (available on the hub, not over an overlay)
  if (!reel && !reveal && !overlay) {
    if (inRect(x, y, hit.mute)) { GF.toggleMute(); GF.sfx('tap'); save(); return; }
    if (inRect(x, y, hit.help)) { GF.tutorial.reopen(); GF.sfx('tap'); return; }
    if (hit.comp && inRect(x, y, hit.comp)) { takeComp(); return; }
  }

  // First-step forgiveness: while the opening coach ("tap a shoebox") is up, ANY
  // tap in the play area opens the highlighted Street Drop - no hunting for the
  // exact card. Keeps time-to-first-fun fast for new players and the boot probe.
  if (GF.tutorial.active && GF.tutorial.step === 0 && !reel && !reveal && !overlay &&
      y > L.y0 && y < L.y1 && x >= L.appX && x <= L.appX + L.appW) {
    openDrop('street', false); return;
  }

  // odds / help overlays
  if (overlay) {
    if (inRect(x, y, hit.oddsClose)) { overlay = null; GF.sfx('tap'); return; }
    return; // tap elsewhere keeps it open
  }

  // reveal decision
  if (reveal) {
    if (inRect(x, y, hit.keep)) { keepReveal(); return; }
    if (hit.again && inRect(x, y, hit.again)) { openAgain(); return; }
    return;
  }
  // reel spinning: tap = skip
  if (reel) { if (!reel.done) { reel.skip = true; GF.sfx('tap'); } return; }

  // nav tabs
  for (var i = 0; i < hit.nav.length; i++) if (inRect(x, y, hit.nav[i])) { setView(hit.nav[i].id); return; }

  if (view === 'drops') {
    if (hit.daily && inRect(x, y, hit.daily)) { claimDaily(); return; }
    if (hit.freeDrop && inRect(x, y, hit.freeDrop)) { watchFreeDrop(); return; }
    if (hit.drops) for (var d = 0; d < hit.drops.length; d++) {
      var r = hit.drops[d];
      if (inRect(x, y, r.oddsBtn)) { overlay = 'ODDS'; oddsDropId = r.id; GF.sfx('tap'); return; }
      if (inRect(x, y, r)) { openDrop(r.id, false); return; }
    }
  } else if (view === 'market') {
    if (hit.betBtns) for (var b = 0; b < hit.betBtns.length; b++) if (inRect(x, y, hit.betBtns[b])) { bet = hit.betBtns[b].val; GF.sfx('tap'); save(); return; }
    if (inRect(x, y, hit.marketAction)) { if (market.phase === 'running') cashOut(); else startMarket(); return; }
  } else if (view === 'album') {
    if (hit.albumCards) for (var a = 0; a < hit.albumCards.length; a++) if (inRect(x, y, hit.albumCards[a])) { setShowcase(hit.albumCards[a].id); return; }
  }
}
var ptr = { down: false, sx: 0, sy: 0, moved: false };

document.addEventListener('keydown', function (e) {

    if (reveal) { keepReveal(); return; }
    if (reel && !reel.done) { reel.skip = true; return; }
    if (view === 'market') { if (market.phase === 'running') cashOut(); else startMarket(); return; }
  }
  if (e.code === 'Escape') { if (overlay) overlay = null; }
});

// ════════════════════════════════════════════════════════════════════════════
// UPDATE
// ════════════════════════════════════════════════════════════════════════════
function update(dt) {
  GF.tutorial.update(dt);
  // __shotFreeze (screenshot tooling only) holds the reel/market on an exact
  // frame so a promo capture is deterministic; normal play + gates never set it.
  var frozen = !!window.__shotFreeze;
  if (reel && !reel.done && !frozen) updateReel(dt);
  if (market.phase === 'running' && !frozen) updateMarket(dt);
  else if (market.phase === 'done') { market.doneT += dt; if (market.doneT > 1.3 && gs !== 'GAMEOVER') market.phase = 'idle'; }
  if (flashT > 0) flashT = Math.max(0, flashT - dt);
  if (winFlash > 0) winFlash = Math.max(0, winFlash - dt);
  for (var i = toasts.length - 1; i >= 0; i--) { toasts[i].t += dt; if (toasts[i].t > 2.6) toasts.splice(i, 1); }
}

// ════════════════════════════════════════════════════════════════════════════
// DRAW
// ════════════════════════════════════════════════════════════════════════════
function draw(c) {
  var W = GF.W, H = GF.H, S = GF.S;
  layout();
  GF.y0 = L.y0;
  drawBackground(c, W, H);
  if (gs === 'MENU') { drawMenu(c); drawFlash(c); return; }

  // hub (PLAYING or soft-GAMEOVER both render the hub)
  if (view === 'drops') drawDrops(c);
  else if (view === 'market') drawMarket(c);
  else drawAlbum(c);

  drawTopBar(c);
  drawNav(c);

  if (reel) drawReelOverlay(c);
  if (reveal) drawReveal(c);
  if (overlay === 'ODDS') drawOdds(c);

  drawToasts(c);
  if (GF.tutorial.active) GF.tutorial.draw(c);
  if (winFlash > 0) drawWin(c);
  drawFlash(c);
}

function drawBackground(c, W, H) {

  // overfill by the max shake offset so a screen-shake never bleeds stale edge pixels
  c.fillStyle = g; c.fillRect(-16, -16, W + 32, H + 32);
  // subtle street grid

  var step = 46 * GF.S;
  for (var x = 0; x < W; x += step) { c.beginPath(); c.moveTo(x, 0); c.lineTo(x, H); c.stroke(); }
  for (var y = 0; y < H; y += step) { c.beginPath(); c.moveTo(0, y); c.lineTo(W, y); c.stroke(); }

  if (c.measureText(txt).width <= maxW) return txt;
  var s = txt; while (s.length > 1 && c.measureText(s + '…').width > maxW) s = s.slice(0, -1);
  return s + '…';
}
function pill(c, x, y, w, h, col, txt, txtCol, px, glow) {
  c.save(); if (glow) { c.shadowColor = hexA(col, 0.5); c.shadowBlur = 12 * GF.S; }
  c.fillStyle = col; roundRectPath(c, x, y, w, h, h / 2); c.fill(); c.restore();
  c.fillStyle = txtCol; c.textAlign = 'center'; c.textBaseline = 'middle'; c.font = 'bold ' + fs(px) + 'px sans-serif';
  c.fillText(txt, x + w / 2, y + h / 2 + 1);
}
function wrapText(c, text, x, y, maxW, lineH, maxLines, align) {
  c.textAlign = align || 'left'; c.textBaseline = 'middle';
  var words = String(text).split(/\s+/), lines = [], cur = '';
  for (var i = 0; i < words.length; i++) {
    var probe = cur ? cur + ' ' + words[i] : words[i];
    if (c.measureText(probe).width > maxW && cur) { lines.push(cur); cur = words[i]; if (lines.length >= (maxLines || 99) - 1) break; }
    else cur = probe;
  }
  if (cur && lines.length < (maxLines || 99)) lines.push(cur);
  var startY = y - ((lines.length - 1) * lineH) / 2;
  for (var j = 0; j < lines.length; j++) c.fillText(lines[j], x, startY + j * lineH);
  return lines.length * lineH;
}

// ════════════════════════════════════════════════════════════════════════════
// BOOT
// ════════════════════════════════════════════════════════════════════════════
GF.init({
  designW: 440, designH: 900,
  strings: STRINGS,
  sprites: [],
  saveKey: SAVE_KEY,
  onReady: function () {
    GF.persist(SAVE_KEY, snapshot, restore);
    // normalise the entry screen (gallery = MENU; platform autostart = PLAYING)
    gs = 'MENU'; view = 'drops';
    reel = null; reveal = null; overlay = null; market.phase = 'idle'; market.mult = 1; market.points = [{ t: 0, m: 1 }];

    GF.bgMusic({ file: 'audio/bg_track.mp3', preset: 'synth', muted: GF.muted });

    if (window.__GF_AUTOSTART && !window._silent && gs === 'MENU') {
      startPlaying();
    }
  },
  onUpdate: update,
  onDraw: draw
});

// ════════════════════════════════════════════════════════════════════════════
// TEST HOOKS
// ════════════════════════════════════════════════════════════════════════════
GF.exposeState(function () {
  return {
    gs: gs, view: view, credits: Math.floor(credits), bet: bet,
    ownedCount: ownedCount(), totalBond: totalBond(), pityNew: pityNew,
    casesOpened: casesOpened, collectionValue: collectionValue(),
    hypePct: hypePct(), showcase: showcaseId, dailyAvailable: dailyAvailable(),
    reelActive: !!reel && !reel.done, revealOpen: !!reveal,
    market: { phase: market.phase, mult: Number(market.mult.toFixed(3)), won: market.won, bust: Number(market.bust.toFixed(2)) },
    best: Number(bestMult.toFixed(2))
  };
});
GF.exposeBot(
  function () {
    var a = [];
    if (reveal) { a.push('keep'); return a; }
    if (reel) { a.push('skip'); return a; }
    if (view !== 'drops') a.push('go_drops');
    if (view !== 'market') a.push('go_market');
    if (credits >= 150) a.push('open_street');
    if (credits >= 400 && dropUnlocked(DROPS[1])) a.push('open_heat');
    if (credits >= 1000 && dropUnlocked(DROPS[2])) a.push('open_hype');
    if (view === 'market') { if (market.phase === 'running') a.push('cash'); else if (credits >= bet) a.push('bet'); }
    if (credits < COMP_THRESHOLD) a.push('comp');
    return a;
  },
  function (action) {
    if (gs === 'MENU') startPlaying();
    switch (action) {
      case 'keep': keepReveal(); break;
      case 'skip': if (reel) reel.skip = true; break;
      case 'go_drops': setView('drops'); break;
      case 'go_market': setView('market'); break;
      case 'open_street': openDrop('street', false); break;
      case 'open_heat': openDrop('heat', false); break;
      case 'open_hype': openDrop('hype', false); break;
      case 'bet': startMarket(); break;
      case 'cash': cashOut(); break;
      case 'comp': takeComp(); break;
    }
  }
);

// Reachability gate hook - every interactive item sits within the viewport (no
// scroll region; the layout fits all three views between the top bar and nav).
GF.exposeReach(function () {
  var items = [];
  function add(id, r) { if (r && r.w) items.push({ id: id, x: r.x, y: r.y, w: r.w, h: r.h, pinned: true }); }
  if (gs === 'MENU') { add('play', hit.menuPlay); return { screen: 'menu', items: items, viewportH: GF.H, scrollMaxY: 0 }; }
  add('mute', hit.mute); add('help', hit.help); add('comp', hit.comp);
  for (var i = 0; i < (hit.nav || []).length; i++) add('nav_' + hit.nav[i].id, hit.nav[i]);
  if (reveal) { add('keep', hit.keep); add('again', hit.again); }
  else if (overlay === 'ODDS') { add('odds_close', hit.oddsClose); }
  else if (view === 'drops') { if (hit.daily) add('daily', hit.daily); if (hit.freeDrop) add('freedrop', hit.freeDrop); for (var d = 0; d < (hit.drops || []).length; d++) { add('drop_' + d, hit.drops[d]); add('odds_' + d, hit.drops[d].oddsBtn); } }
  else if (view === 'market') { add('action', hit.marketAction); for (var b = 0; b < (hit.betBtns || []).length; b++) add('bet_' + b, hit.betBtns[b]); }
  else if (view === 'album') { for (var a = 0; a < (hit.albumCards || []).length; a++) add('card_' + a, hit.albumCards[a]); }
  return { screen: (reveal ? 'reveal' : overlay === 'ODDS' ? 'odds' : view), items: items, viewportH: GF.H, scrollMaxY: 0 };
});

// Screenshot / harness hooks
function grantSneaker(id, bond) { var p = prof(id); p.owned = true; p.copies = Math.max(1, p.copies); p.bond = Math.max(bond || 1, p.bond); }
window._setupForScreenshot = function (n) {
  reveal = null; reel = null; overlay = null; gs = 'PLAYING';
  try { localStorage.setItem(TUT_KEY, '1'); } catch (e) {}
  GF.tutorial.active = false;
  n = n || 1;
  credits = 2400;
  if (n === 1) { // mid-spin reel - early enough that easeOutQuint still shows motion
    view = 'drops'; grantSneaker('court', 3); grantSneaker('wave', 2); grantSneaker('hoop', 1); grantSneaker('skate', 1);
    credits = 3200;
    openDrop('heat', false);
    if (reel) {
      reel.t = reel.dur * 0.24; reel._jit = 0;
      // decorative-only: seed the tiles around the marker with sneakers so the
      // promo mid-spin frame shows grails, not a run of coins (settled outcome unchanged).
      var showTiles = ['prism', 'neon', 'hoop', 'gold', 'wave', 'skate', 'trail', 'court', 'neon', 'prism'];
      for (var si = 26; si <= 35; si++) { if (reel.entries[si]) reel.entries[si] = { kind: 'sneaker', sk: skById(showTiles[(si - 26) % showTiles.length]) }; }
      updateReel(0);
    }
  } else if (n === 2) { // SSR reveal
    view = 'drops'; grantSneaker('court', 3); grantSneaker('hoop', 2); grantSneaker('wave', 1);
    reveal = { outcome: { kind: 'sneaker', sk: SNEAKERS[6], isNew: true, pity: false }, dropId: 'hype', t: 0.5 };
    burstAt(GF.cx, GF.H * 0.4, rarityColor('SSR'), 22);
  } else if (n === 3) { // album populated
    view = 'album'; grantSneaker('court', 4); grantSneaker('trail', 2); grantSneaker('hoop', 3); grantSneaker('wave', 2); grantSneaker('skate', 1);
  } else if (n === 4) { // market mid-run
    view = 'market'; grantSneaker('court', 3); grantSneaker('hoop', 2); grantSneaker('neon', 1);
    bet = 100; startMarket(); market.elapsed = 4.6; market.mult = Math.exp(CRASH_K * 4.6); market.bust = 20;
    for (var i = 0; i <= 20; i++) { var tt = i * 0.23; market.points.push({ t: tt, m: Math.exp(CRASH_K * tt) }); }
  } else { // deep late-game: rich album + credits
    view = 'album';
    grantSneaker('court', 6); grantSneaker('trail', 4); grantSneaker('hoop', 5); grantSneaker('wave', 3); grantSneaker('skate', 4); grantSneaker('neon', 3); grantSneaker('gold', 2);
    showcaseId = 'gold'; credits = 8600; bestMult = 12.4;
  }
  save();
};
window._jumpLevel = function (n) {
  if (n >= 99) { reveal = null; reel = null; overlay = null; credits = Math.max(credits, 1000); gs = 'GAMEOVER'; return; }
  window._setupForScreenshot(n || 1);
  gs = 'PLAYING';
};
window._setState = function (s) { if (s === 'PLAYING') gs = 'PLAYING'; else if (s === 'GAMEOVER' || s === 'GAME_OVER') gs = 'GAMEOVER'; else if (s === 'MENU') gs = 'MENU'; return gs; };
// Layout rect locator for the QA playtest - returns live button rects (screen
// px) so a test can dispatch REAL pointer events at real buttons (not fake state).
window.__rects = function () {
  return {
    nav: hit.nav, drops: hit.drops, daily: hit.daily, keep: hit.keep, again: hit.again,
    marketAction: hit.marketAction, betBtns: hit.betBtns, albumCards: hit.albumCards,
    mute: hit.mute, help: hit.help, comp: hit.comp, oddsClose: hit.oddsClose, freeDrop: hit.freeDrop, reelActive: !!reel && !reel.done
  };
};
// nav test seams (locale/overflow audit)
window.__navTo = function (v) { if (v === 'drops' || v === 'market' || v === 'album') { view = v; } };
window.__openOdds = function (id) { overlay = 'ODDS'; oddsDropId = id; };
window.render_game_to_text = function () {
  return JSON.stringify({
    mode: 'sneaker_heat', gs: gs, view: view, credits: Math.floor(credits), bet: bet,
    ownedCount: ownedCount(), totalBond: totalBond(), collectionValue: collectionValue(),
    pityNew: pityNew, casesOpened: casesOpened, hypePct: hypePct(), showcase: showcaseId,
    dailyAvailable: dailyAvailable(), reelActive: !!reel && !reel.done, revealOpen: !!reveal,
    market: { phase: market.phase, mult: Number(market.mult.toFixed(3)), won: market.won },
    collection: SNEAKERS.map(function (s) { var p = prof(s.id); return { id: s.id, rarity: s.rarity, owned: p.owned, bond: p.bond, shards: p.shards, copies: p.copies }; })
  });
};

})();
