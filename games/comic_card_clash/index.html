    * { scrollbar-width: none; }

var ISSUE_COUNT = 6;
var PLAYER_MAX_HP = 32;
var BASE_INK = 3;
var MAX_MOMENTUM = 10;
var BASE_RIVAL_HP = 22;
var RIVAL_HP_PER_ISSUE = 7;
var RIVAL_BASE_DAMAGE = 4;
var RIVAL_HEAT_CAP = 9;
var HAND_SIZE = 4;
var PANEL_HISTORY_MAX = 5;

var CARD_DEFS = {
  strike: { key: 'card_strike', desc: 'desc_strike', cost: 1, color: '#e84b4b', ink: '#fff1d1', role: 'attack' },
  setup:  { key: 'card_setup',  desc: 'desc_setup',  cost: 1, color: '#f0c24d', ink: '#241b0e', role: 'setup' },
  guard:  { key: 'card_guard',  desc: 'desc_guard',  cost: 1, color: '#49a7d8', ink: '#eafdff', role: 'guard' },
  splash: { key: 'card_splash', desc: 'desc_splash', cost: 2, color: '#8d57d9', ink: '#fff0ff', role: 'finisher' },
  twist:  { key: 'card_twist',  desc: 'desc_twist',  cost: 1, color: '#55b96f', ink: '#07150a', role: 'trick' },
  heal:   { key: 'card_heal',   desc: 'desc_heal',   cost: 1, color: '#ef8cb6', ink: '#271019', role: 'heal' },
  ink:    { key: 'card_ink',    desc: 'desc_ink',    cost: 0, color: '#2d2b3d', ink: '#ebf0ff', role: 'resource' }
};

var CARD_ORDER = ['strike', 'setup', 'guard', 'splash', 'twist', 'heal', 'ink'];
var scene = { ui: 1, top: 0, bottom: 0, page: { x: 0, y: 0, w: 0, h: 0 }, handY: 0, narrow: false };
var uiRects = { cards: [] };
var statusEl = document.getElementById('game-status');
var gs = 'PLAYING';
var score = 0;
var best = 0;
var highestIssue = 1;
var issue = 1;
var panel = 1;
var playerHp = PLAYER_MAX_HP;
var rivalMaxHp = 1;
var rivalHp = 1;
var ink = BASE_INK;
var momentum = 0;
var shield = 0;
var rivalHeat = 0;
var stagger = 0;
var rivalIntent = null;
var hand = [];
var chain = [];
var panelHistory = [];
var usedCards = {};
var message = '';
var messageTimer = 0;
var bannerTimer = 0;
var flash = 0;
var shake = 0;
var time = 0;
var rngSeed = 232232;
var nextCardUid = 1;
var tutorialDone = false;
var coachStep = 0;
var coachPulse = 0;
var helpOpen = false;
var started = false;
var screenshotMode = false;
var gameOverReason = 'reason_hp';
var bursts = [];
var floats = [];

function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
function rand() {
  rngSeed = (rngSeed * 1664525 + 1013904223) >>> 0;
  return rngSeed / 4294967296;
}
function pick(list) { return list[Math.floor(rand() * list.length) % list.length]; }
function fs(px) { return Math.max(10, Math.round(px * scene.ui)); }
function rr(c, x, y, w, h, r) { GF.rr(c, x, y, w, h, r); }
function tCard(id) { return GF.t(CARD_DEFS[id].key); }

function getMeta() {
  return {
    best: best,
    highestIssue: highestIssue,
    usedCards: usedCards
  };
}

function applyMeta(s) {
  if (!s) return;
  best = Number(s.best) || 0;
  highestIssue = Math.max(1, Number(s.highestIssue) || 1);
  usedCards = s.usedCards && typeof s.usedCards === 'object' ? s.usedCards : {};
}

function saveMeta() {
  try { GF.saveRun(); } catch (e) {}
}

function loadTutorialFlag() {
  try { tutorialDone = localStorage.getItem('comic_card_clash_tutorial_v1') === '1'; } catch (e) { tutorialDone = false; }
}

function completeTutorial() {
  tutorialDone = true;
  coachStep = 99;
  try { localStorage.setItem('comic_card_clash_tutorial_v1', '1'); } catch (e) {}
}

function layout() {
  var ui = Math.min(GF.W / 440, GF.H / 760);
  scene.ui = clamp(ui, 0.72, 1.38);
  scene.narrow = GF.W < 620;
  scene.top = scene.narrow ? Math.max(106 * scene.ui, Math.min(126 * scene.ui, GF.H * 0.20)) : Math.max(86 * scene.ui, Math.min(112 * scene.ui, GF.H * 0.17));
  scene.bottom = scene.narrow ? Math.max(176 * scene.ui, Math.min(220 * scene.ui, GF.H * 0.31)) : Math.max(132 * scene.ui, Math.min(170 * scene.ui, GF.H * 0.23));
  scene.page.x = 10 * scene.ui;
  scene.page.y = scene.top + 8 * scene.ui;
  scene.page.w = GF.W - 20 * scene.ui;
  scene.page.h = Math.max(180 * scene.ui, GF.H - scene.top - scene.bottom - 16 * scene.ui);
  scene.handY = GF.H - scene.bottom + 10 * scene.ui;
  uiRects.help = { x: GF.W - 88 * scene.ui, y: 12 * scene.ui, w: 34 * scene.ui, h: 34 * scene.ui };
  uiRects.mute = { x: GF.W - 46 * scene.ui, y: 12 * scene.ui, w: 34 * scene.ui, h: 34 * scene.ui };
  uiRects.cards = [];
  if (scene.narrow) {
    var gap = 8 * scene.ui;
    var cardW = (GF.W - 28 * scene.ui - gap) / 2;
    var cardH = Math.max(58 * scene.ui, Math.min(70 * scene.ui, scene.bottom * 0.35));
    for (var i = 0; i < HAND_SIZE; i++) {
      var col = i % 2;
      var row = Math.floor(i / 2);
      uiRects.cards.push({
        x: 10 * scene.ui + col * (cardW + gap),
        y: scene.handY + row * (cardH + 7 * scene.ui),
        w: cardW,
        h: cardH
      });
    }
    uiRects.end = { x: 10 * scene.ui, y: GF.H - 43 * scene.ui, w: GF.W - 20 * scene.ui, h: 34 * scene.ui };
  } else {
    var endW = 116 * scene.ui;
    var gapWide = 9 * scene.ui;
    var cardArea = GF.W - 28 * scene.ui - endW - gapWide * 4;
    var wideCardW = clamp(cardArea / 4, 92 * scene.ui, 150 * scene.ui);
    var wideCardH = Math.max(86 * scene.ui, Math.min(108 * scene.ui, scene.bottom - 28 * scene.ui));
    var totalW = wideCardW * 4 + gapWide * 3 + endW + gapWide;
    var startX = Math.max(10 * scene.ui, (GF.W - totalW) / 2);
    for (var j = 0; j < HAND_SIZE; j++) {
      uiRects.cards.push({ x: startX + j * (wideCardW + gapWide), y: scene.handY + 6 * scene.ui, w: wideCardW, h: wideCardH });
    }
    uiRects.end = { x: startX + 4 * (wideCardW + gapWide), y: scene.handY + 6 * scene.ui, w: endW, h: wideCardH };
  }
  uiRects.retry = { x: GF.cx - 78 * scene.ui, y: GF.cy + 88 * scene.ui, w: 156 * scene.ui, h: 42 * scene.ui };
}

function makeCard(id) {
  return { id: id, uid: nextCardUid++ };
}

function cardPool() {
  var pool = ['strike', 'strike', 'setup', 'guard', 'splash'];
  if (issue >= 2) pool.push('guard', 'strike');
  if (issue >= 3) pool.push('twist', 'twist');
  if (issue >= 4) pool.push('splash', 'setup');
  if (issue >= 5) pool.push('ink', 'ink');
  if (playerHp <= PLAYER_MAX_HP - 8 || issue >= 4) pool.push('heal');
  return pool;
}

function drawRandomCard() {
  return makeCard(pick(cardPool()));
}

function refillHand() {
  hand = [];
  if (!tutorialDone && issue === 1 && panel === 1 && !screenshotMode) {
    hand.push(makeCard('strike'), makeCard('setup'), makeCard('guard'), makeCard('splash'));
    return;
  }
  for (var i = 0; i < HAND_SIZE; i++) hand.push(drawRandomCard());
  var playable = false;
  for (var j = 0; j < hand.length; j++) if (CARD_DEFS[hand[j].id].cost <= ink) playable = true;
  if (!playable) hand[0] = makeCard('strike');
  ensureCoachCard();
}

function ensureCoachCard() {
  if (tutorialDone || screenshotMode || coachStep > 3) return;
  var wanted = ['strike', 'setup', 'guard', 'splash'][coachStep];
  for (var i = 0; i < hand.length; i++) if (hand[i] && hand[i].id === wanted) return;
  if (hand.length < HAND_SIZE) hand.push(makeCard(wanted));
  else hand[Math.min(coachStep, hand.length - 1)] = makeCard(wanted);
}

function chooseIntent() {
  var dmg = RIVAL_BASE_DAMAGE + issue + Math.floor(rivalHeat / 3);
  if (issue >= 6 && panel % 3 === 0) {
    return { type: 'finale', key: 'intent_finale', damage: dmg + 4, heatGain: 2, pierce: 0.35, color: '#ff6978' };
  }
  if (rivalHeat >= 7 || (issue >= 2 && panel % 4 === 0)) {
    return { type: 'heavy', key: 'intent_heavy', damage: dmg + 5, heatGain: -2, pierce: 0, color: '#f16f3f' };
  }
  if (issue >= 3 && panel % 3 === 0) {
    return { type: 'break', key: 'intent_break', damage: dmg + 2, heatGain: 1, pierce: 0.55, color: '#b563d9' };
  }
  if (issue >= 4 && panel % 2 === 0) {
    return { type: 'heat', key: 'intent_heat', damage: Math.max(2, dmg - 2), heatGain: 3, pierce: 0, color: '#f0c24d' };
  }
  return { type: 'attack', key: 'intent_attack', damage: dmg, heatGain: 1, pierce: 0, color: '#e84b4b' };
}

function setMessage(keyOrText, seconds) {
  message = keyOrText || '';
  messageTimer = seconds || 1.2;
  updateStatus();
}

function updateStatus() {
  if (!statusEl) return;
  var intentText = rivalIntent ? GF.t(rivalIntent.key) + ' ' + String(rivalIntent.damage) : '';
  statusEl.textContent = GF.t('title') + '. ' + GF.t('issue') + ' ' + String(issue) + '. ' + GF.t('hero') + ' ' + String(Math.max(0, playerHp)) + ' ' + GF.t('hp') + '. ' + GF.t('rival') + ' ' + String(Math.max(0, rivalHp)) + ' ' + GF.t('hp') + '. ' + intentText;
}

function startGame(opts) {
  opts = opts || {};
  rngSeed = opts.seed || 232232;
  gs = 'PLAYING';
  score = 0;
  issue = 1;
  panel = 1;
  playerHp = PLAYER_MAX_HP;
  momentum = 0;
  shield = 0;
  rivalHeat = 0;
  stagger = 0;
  panelHistory = [];
  chain = [];
  gameOverReason = 'reason_hp';
  screenshotMode = !!opts.screenshot;
  helpOpen = false;
  startIssue(1);
  setMessage(GF.t('title'), 1.2);
  GF.gameStarted();
  saveMeta();
}

function startIssue(n) {
  issue = clamp(Math.round(n), 1, ISSUE_COUNT);
  panel = 1;
  rivalMaxHp = BASE_RIVAL_HP + issue * RIVAL_HP_PER_ISSUE;
  rivalHp = rivalMaxHp;
  ink = BASE_INK + (issue >= 5 ? 1 : 0);
  shield = 0;
  stagger = 0;
  chain = [];
  rivalHeat = clamp(issue - 1, 0, RIVAL_HEAT_CAP);
  rivalIntent = chooseIntent();
  refillHand();
  updateStatus();
}

function startPlayerPanel() {
  panel++;
  shield = 0;
  chain = [];
  ink = BASE_INK + (issue >= 5 ? 1 : 0);
  if (momentum >= 8) ink += 1;
  rivalIntent = chooseIntent();
  refillHand();
  updateStatus();
}

function spawnBurst(x, y, color, n) {
  for (var i = 0; i < n; i++) {
    bursts.push({
      x: x,
      y: y,
      vx: (rand() - 0.5) * 180 * scene.ui,
      vy: (rand() - 0.5) * 150 * scene.ui - 30 * scene.ui,
      life: 0.55 + rand() * 0.35,
      max: 0.7,
      color: color
    });
  }
}

function spawnFloat(text, x, y, color) {
  floats.push({ text: String(text), x: x, y: y, vy: -28 * scene.ui, life: 1.0, color: color || '#fff2bc' });
}

function hitRival(dmg, color) {
  dmg = Math.max(0, Math.round(dmg));
  if (dmg <= 0 || gs !== 'PLAYING') return;
  rivalHp = Math.max(0, rivalHp - dmg);
  score += dmg * 9 + chain.length * 4;
  var p = rivalPoint();
  spawnBurst(p.x, p.y, color || '#ffdf66', 18);
  spawnFloat('-' + String(dmg), p.x, p.y - 26 * scene.ui, '#ffe184');
  flash = 0.18;
  shake = Math.max(shake, 0.18);
  GF.sfx('hit');
  if (rivalHp <= 0) clearIssue();
}

function heroPoint() {
  return { x: scene.page.x + scene.page.w * 0.25, y: scene.page.y + scene.page.h * 0.50 };
}

function rivalPoint() {
  return { x: scene.page.x + scene.page.w * 0.75, y: scene.page.y + scene.page.h * 0.46 };
}

function playCardIndex(idx) {
  if (gs !== 'PLAYING' || helpOpen) return false;
  if (idx < 0 || idx >= hand.length) return false;
  var card = hand[idx];
  var def = CARD_DEFS[card.id];
  if (!def) return false;
  if (def.cost > ink) {
    setMessage(GF.t('no_ink'), 0.8);
    GF.sfx('error');
    return false;
  }
  ink -= def.cost;
  usedCards[card.id] = true;
  chain.push(card.id);
  panelHistory.unshift({ id: card.id, combo: chain.length, age: 0 });
  if (panelHistory.length > PANEL_HISTORY_MAX) panelHistory.pop();
  hand.splice(idx, 1);
  var combo = chain.length;
  var lastWasSetup = chain.length >= 2 && chain[chain.length - 2] === 'setup';
  var p = heroPoint();
  var rp = rivalPoint();
  score += 12 + combo * issue;

  if (card.id === 'strike') {
    momentum = clamp(momentum + 1, 0, MAX_MOMENTUM);
    hitRival(4 + Math.floor(momentum / 3) + Math.floor(combo / 2), def.color);
  } else if (card.id === 'setup') {
    momentum = clamp(momentum + 3, 0, MAX_MOMENTUM);
    spawnBurst(p.x, p.y, def.color, 14);
    spawnFloat('+' + GF.t('momentum'), p.x, p.y - 32 * scene.ui, '#ffe48c');
    GF.sfx('merge');
  } else if (card.id === 'guard') {
    shield += 6 + Math.floor(momentum / 2) + Math.floor(issue / 2);
    momentum = clamp(momentum + 1, 0, MAX_MOMENTUM);
    spawnBurst(p.x, p.y, def.color, 13);
    spawnFloat('+' + GF.t('shield'), p.x, p.y - 36 * scene.ui, '#bff3ff');
    GF.sfx('reward');
  } else if (card.id === 'splash') {
    var spent = momentum;
    var dmg = 6 + spent + combo * 2 + (lastWasSetup ? 4 : 0);
    momentum = clamp(momentum - 2, 0, MAX_MOMENTUM);
    hitRival(dmg, def.color);
    spawnBurst(rp.x, rp.y, '#fff0a6', 14);
    GF.sfx('evolve');
  } else if (card.id === 'twist') {
    rivalHeat = clamp(rivalHeat - 2, 0, RIVAL_HEAT_CAP);
    stagger = Math.max(stagger, 3 + Math.floor(issue / 2));
    momentum = clamp(momentum + 1, 0, MAX_MOMENTUM);
    hitRival(3 + combo, def.color);
  } else if (card.id === 'heal') {
    var heal = 4 + Math.floor(momentum / 4);
    playerHp = Math.min(PLAYER_MAX_HP, playerHp + heal);
    momentum = clamp(momentum + 1, 0, MAX_MOMENTUM);
    spawnBurst(p.x, p.y, def.color, 12);
    spawnFloat('+' + String(heal), p.x, p.y - 34 * scene.ui, '#ffd4ec');
    GF.sfx('unlock');
  } else if (card.id === 'ink') {
    ink = clamp(ink + 2, 0, 5);
    momentum = clamp(momentum + 1, 0, MAX_MOMENTUM);
    spawnBurst(p.x, p.y, '#dfe6ff', 10);
    spawnFloat('+2 ' + GF.t('ink'), p.x, p.y - 34 * scene.ui, '#dfe6ff');
    GF.sfx('coin');
  }

  advanceCoachForCard(card.id);
  if (gs === 'PLAYING' && hand.length < HAND_SIZE && ink > 0) hand.push(drawRandomCard());
  if (gs === 'PLAYING') ensureCoachCard();
  if (gs === 'PLAYING' && !hasPlayableCard()) endPlayerPanel();
  saveMeta();
  updateStatus();
  return true;
}

function hasPlayableCard() {
  for (var i = 0; i < hand.length; i++) if (CARD_DEFS[hand[i].id].cost <= ink) return true;
  return false;
}

function endPlayerPanel() {
  if (gs !== 'PLAYING') return false;
  resolveRival();
  if (gs !== 'PLAYING') return true;
  startPlayerPanel();
  saveMeta();
  return true;
}

function resolveRival() {
  if (!rivalIntent) rivalIntent = chooseIntent();
  var raw = Math.max(0, rivalIntent.damage - stagger);
  var effectiveShield = rivalIntent.pierce ? Math.floor(shield * (1 - rivalIntent.pierce)) : shield;
  var taken = Math.max(0, raw - effectiveShield);
  if (!tutorialDone && !screenshotMode) taken = 0;
  playerHp = Math.max(0, playerHp - taken);
  rivalHeat = clamp(rivalHeat + rivalIntent.heatGain + (taken > 0 ? 1 : 0), 0, RIVAL_HEAT_CAP);
  var hp = heroPoint();
  if (taken > 0) {
    spawnBurst(hp.x, hp.y, rivalIntent.color, 18);
    spawnFloat('-' + String(taken), hp.x, hp.y - 28 * scene.ui, '#ffb2a6');
    GF.sfx('hurt');
    shake = Math.max(shake, 0.14);
  } else {
    spawnBurst(hp.x, hp.y, '#9edcff', 10);
    spawnFloat(GF.t('shield'), hp.x, hp.y - 28 * scene.ui, '#c8f4ff');
    GF.sfx('tap');
  }
  shield = 0;
  stagger = 0;
  if (playerHp <= 0) gameOver('reason_hp');
  updateStatus();
}

function clearIssue() {
  if (gs !== 'PLAYING') return;
  score += issue * 180 + playerHp * 4 + momentum * 12;
  highestIssue = Math.max(highestIssue, issue);
  bannerTimer = 1.8;
  setMessage(GF.t('issue_clear') + ' ' + String(issue), 1.4);
  GF.sfx(issue >= ISSUE_COUNT ? 'win' : 'levelup');
  if (issue >= ISSUE_COUNT) {
    winGame();
    return;
  }
  issue++;
  playerHp = Math.min(PLAYER_MAX_HP, playerHp + 7);
  momentum = clamp(momentum + 2, 0, MAX_MOMENTUM);
  startIssue(issue);
  saveMeta();
}

function gameOver(reason) {
  gs = 'GAMEOVER';
  gameOverReason = reason || 'reason_hp';
  best = Math.max(best, score);
  highestIssue = Math.max(highestIssue, issue);
  GF.sfx('lose');
  GF.gameEnded();
  saveMeta();
  updateStatus();
}

function winGame() {
  gs = 'WON';
  best = Math.max(best, score);
  highestIssue = Math.max(highestIssue, ISSUE_COUNT);
  GF.happytime();
  GF.gameEnded();
  saveMeta();
  updateStatus();
}

function advanceCoachForCard(id) {
  if (tutorialDone || screenshotMode) return;
  if (coachStep === 0 && id === 'strike') coachStep = 1;
  else if (coachStep === 1 && id === 'setup') coachStep = 2;
  else if (coachStep === 2 && id === 'guard') coachStep = 3;
  else if (coachStep === 3 && id === 'splash') completeTutorial();
}

function update(dt) {
  dt = Math.min(0.08, Math.max(0, dt || 0));
  time += dt;
  coachPulse += dt;
  if (messageTimer > 0) messageTimer -= dt;
  if (bannerTimer > 0) bannerTimer -= dt;
  if (flash > 0) flash -= dt;
  if (shake > 0) shake -= dt;
  for (var i = bursts.length - 1; i >= 0; i--) {
    var b = bursts[i];
    b.life -= dt;
    b.x += b.vx * dt;
    b.y += b.vy * dt;
    b.vy += 110 * scene.ui * dt;
    if (b.life <= 0) bursts.splice(i, 1);
  }
  for (var j = floats.length - 1; j >= 0; j--) {
    var f = floats[j];
    f.life -= dt;
    f.y += f.vy * dt;
    if (f.life <= 0) floats.splice(j, 1);
  }
  for (var k = 0; k < panelHistory.length; k++) panelHistory[k].age += dt;
}

function ptrPos(e) {
  var r = GF.canvas.getBoundingClientRect();
  return {
    x: (e.clientX - r.left) * (GF.W / Math.max(1, r.width)),
    y: (e.clientY - r.top) * (GF.H / Math.max(1, r.height))
  };
}

function hitRect(p, r) {
  return r && p.x >= r.x && p.x <= r.x + r.w && p.y >= r.y && p.y <= r.y + r.h;
}

function onPointerDown(e) {
  layout();
  var p = ptrPos(e);
  if (hitRect(p, uiRects.mute)) {
    GF.toggleMute();
    GF.sfx('click');
    e.preventDefault();
    return;
  }
  if (hitRect(p, uiRects.help)) {
    helpOpen = !helpOpen;
    GF.sfx('click');
    e.preventDefault();
    return;
  }
  if (helpOpen) {
    if (hitRect(p, uiRects.helpClose)) helpOpen = false;
    else helpOpen = false;
    GF.sfx('click');
    e.preventDefault();
    return;
  }
  if (gs === 'GAMEOVER' || gs === 'WON') {
    if (hitRect(p, uiRects.retry)) {
      startGame({ seed: 232232 + Math.floor(time * 1000) });
      GF.sfx('spawn');
    }
    e.preventDefault();
    return;
  }
  for (var i = 0; i < uiRects.cards.length; i++) {
    if (hitRect(p, uiRects.cards[i])) {
      playCardIndex(i);
      e.preventDefault();
      return;
    }
  }
  if (hitRect(p, uiRects.end)) {
    endPlayerPanel();
    GF.sfx('click');
    e.preventDefault();
    return;
  }
}

function onKeyDown(e) {
  if (e.code === 'Digit1') { playCardIndex(0); e.preventDefault(); }
  if (e.code === 'Digit2') { playCardIndex(1); e.preventDefault(); }
  if (e.code === 'Digit3') { playCardIndex(2); e.preventDefault(); }
  if (e.code === 'Digit4') { playCardIndex(3); e.preventDefault(); }
  if (e.code === 'Space') { endPlayerPanel(); e.preventDefault(); }
  if (e.code === 'KeyR' && (gs === 'GAMEOVER' || gs === 'WON')) startGame({ seed: 232232 + Math.floor(time * 1000) });
  if (e.code === 'KeyF') toggleFullscreen();
}

function toggleFullscreen() {
  var el = document.documentElement;
  try {
    if (!document.fullscreenElement && el.requestFullscreen) el.requestFullscreen();
    else if (document.exitFullscreen) document.exitFullscreen();
  } catch (e) {}
}

function drawText(c, txt, x, y, size, color, align, weight) {
  c.font = (weight || '700') + ' ' + String(size) + 'px system-ui, -apple-system, Segoe UI, sans-serif';
  c.fillStyle = color || '#fff5d6';
  c.textAlign = align || 'left';
  c.textBaseline = 'alphabetic';
  c.fillText(String(txt), x, y);
}

function fitText(c, txt, x, y, maxW, size, color, align, weight) {
  var s = size;
  c.font = (weight || '700') + ' ' + String(s) + 'px system-ui, -apple-system, Segoe UI, sans-serif';
  while (s > 9 && c.measureText(String(txt)).width > maxW) {
    s -= 1;
    c.font = (weight || '700') + ' ' + String(s) + 'px system-ui, -apple-system, Segoe UI, sans-serif';
  }
  c.fillStyle = color || '#fff5d6';
  c.textAlign = align || 'left';
  c.textBaseline = 'alphabetic';
  c.fillText(String(txt), x, y);
}

function wrapLines(c, text, maxW, size, weight) {
  c.font = (weight || '650') + ' ' + String(size) + 'px system-ui, -apple-system, Segoe UI, sans-serif';
  var words = String(text).split(/\s+/);
  var lines = [];
  var line = '';
  for (var i = 0; i < words.length; i++) {
    var test = line ? line + ' ' + words[i] : words[i];
    if (c.measureText(test).width > maxW && line) {
      lines.push(line);
      line = words[i];
    } else {
      line = test;
    }
  }
  if (line) lines.push(line);
  return lines;
}

function drawBackground(c) {
  var g = c.createLinearGradient(0, 0, GF.W, GF.H);
  g.addColorStop(0, '#fbdf7e');
  g.addColorStop(0.52, '#f4f0d8');
  g.addColorStop(1, '#55b6d6');
  c.fillStyle = g;
  c.fillRect(0, 0, GF.W, GF.H);
  c.fillStyle = 'rgba(30,24,34,0.10)';
  var step = Math.max(13, 18 * scene.ui);
  for (var y = 0; y < GF.H + step; y += step) {
    for (var x = (Math.floor(y / step) % 2) * step * 0.5; x < GF.W + step; x += step) {
      c.beginPath();
      c.arc(x, y, 1.5 * scene.ui, 0, Math.PI * 2);
      c.fill();
    }
  }
}

function drawPage(c) {

  c.translate(dx, dy);

  rr(c, p.x, p.y, p.w, p.h, 7 * ui);

  c.lineWidth = Math.max(1, 2 * ui);
  c.stroke();
  for (var i = 0; i < lines.length; i++) drawText(c, lines[i], x + 13 * ui, y + 24 * ui + i * (size + 4 * ui), size, '#fff0ba', 'left', '800');
  var idx = -1;
  for (var j = 0; j < hand.length; j++) if (hand[j].id === wanted) idx = j;
  if (idx >= 0 && uiRects.cards[idx]) {
    var r = uiRects.cards[idx];
    c.strokeStyle = 'rgba(255,240,186,0.94)';
    c.lineWidth = Math.max(3, 4 * ui);
    var pulse = Math.sin(coachPulse * 6) * 4 * ui;
    rr(c, r.x - 4 * ui - pulse, r.y - 4 * ui - pulse, r.w + 8 * ui + pulse * 2, r.h + 8 * ui + pulse * 2, 10 * ui);
    c.stroke();
  }
}

function drawHelp(c) {
  if (!helpOpen) return;
  var ui = scene.ui;
  var w = Math.min(GF.W - 28 * ui, 540 * ui);
  var x = (GF.W - w) / 2;
  var size = fs(13);
  var entries = [
    ['tut_goal', '#fff0ba'],
    ['tut_controls', '#d8f5ff'],
    ['tut_win', '#d8ffd9'],
    ['tut_lose', '#ffc1b8'],
    ['tut_tip', '#f6ddff']
  ];
  var lineData = [];
  var h = 50 * ui;
  for (var i = 0; i < entries.length; i++) {
    var lines = wrapLines(c, GF.t(entries[i][0]), w - 30 * ui, size, '680');
    lineData.push({ lines: lines, color: entries[i][1] });
    h += lines.length * (size + 4 * ui) + 10 * ui;
  }
  h += 48 * ui;
  h = Math.min(h, GF.H - 24 * ui);
  var y = (GF.H - h) / 2;
  c.fillStyle = 'rgba(23,18,27,0.94)';
  rr(c, x, y, w, h, 9 * ui);
  c.fill();
  c.strokeStyle = 'rgba(255,255,255,0.22)';
  c.lineWidth = Math.max(1, 2 * ui);
  c.stroke();
  drawText(c, GF.t('help_title'), x + 16 * ui, y + 31 * ui, fs(18), '#fff0ba', 'left', '900');
  var yy = y + 61 * ui;
  for (var j = 0; j < lineData.length; j++) {
    for (var k = 0; k < lineData[j].lines.length; k++) {
      drawText(c, lineData[j].lines[k], x + 16 * ui, yy, size, lineData[j].color, 'left', '680');
      yy += size + 4 * ui;
    }
    yy += 10 * ui;
  }
  uiRects.helpClose = { x: GF.cx - 70 * ui, y: y + h - 42 * ui, w: 140 * ui, h: 32 * ui };
  c.fillStyle = '#fff0ba';
  rr(c, uiRects.helpClose.x, uiRects.helpClose.y, uiRects.helpClose.w, uiRects.helpClose.h, 8 * ui);
  c.fill();
  fitText(c, GF.t('close'), GF.cx, uiRects.helpClose.y + 22 * ui, uiRects.helpClose.w - 10 * ui, fs(13), '#17121b', 'center', '900');
}

function drawTerminal(c) {
  if (gs !== 'GAMEOVER' && gs !== 'WON') return;
  var ui = scene.ui;
  c.fillStyle = 'rgba(23,18,27,0.86)';
  c.fillRect(0, 0, GF.W, GF.H);
  var title = gs === 'WON' ? GF.t('won') : GF.t('gameover');
  drawText(c, title, GF.cx, GF.cy - 75 * ui, fs(26), '#fff0ba', 'center', '950');
  var sub = gs === 'WON' ? GF.t('final_score') + ' ' + score : GF.t(gameOverReason);
  fitText(c, sub, GF.cx, GF.cy - 41 * ui, Math.min(GF.W - 30 * ui, 420 * ui), fs(14), '#f4e9ff', 'center', '760');
  fitText(c, GF.t('score') + ' ' + score + '  ' + GF.t('best') + ' ' + best + '  ' + GF.t('highest') + ' ' + highestIssue, GF.cx, GF.cy - 12 * ui, Math.min(GF.W - 30 * ui, 450 * ui), fs(13), '#d8f5ff', 'center', '760');
  fitText(c, GF.t('used_cards') + ': ' + usedCardSummary(), GF.cx, GF.cy + 16 * ui, Math.min(GF.W - 30 * ui, 450 * ui), fs(12), '#fff4d3', 'center', '700');
  c.fillStyle = '#fff0ba';
  rr(c, uiRects.retry.x, uiRects.retry.y, uiRects.retry.w, uiRects.retry.h, 8 * ui);
  c.fill();
  c.strokeStyle = '#17121b';
  c.lineWidth = Math.max(2, 3 * ui);
  c.stroke();
  fitText(c, gs === 'WON' ? GF.t('replay') : GF.t('retry'), GF.cx, uiRects.retry.y + 28 * ui, uiRects.retry.w - 12 * ui, fs(15), '#17121b', 'center', '950');
}

function usedCardSummary() {
  var names = [];
  for (var i = 0; i < CARD_ORDER.length; i++) if (usedCards[CARD_ORDER[i]]) names.push(tCard(CARD_ORDER[i]));
  return names.length ? names.join(', ') : '-';
}

function drawParticles(c) {
  for (var i = 0; i < bursts.length; i++) {
    var b = bursts[i];
    var a = clamp(b.life / b.max, 0, 1);
    c.fillStyle = b.color.replace(')', ',' + String(a) + ')');
    if (b.color.charAt(0) === '#') c.fillStyle = b.color;
    c.globalAlpha = a;
    c.beginPath();
    c.arc(b.x, b.y, (3 + a * 3) * scene.ui, 0, Math.PI * 2);
    c.fill();
    c.globalAlpha = 1;
  }
  for (var j = 0; j < floats.length; j++) {
    var f = floats[j];
    c.globalAlpha = clamp(f.life, 0, 1);
    drawText(c, f.text, f.x, f.y, fs(15), f.color, 'center', '900');
    c.globalAlpha = 1;
  }
}

function draw(c) {
  layout();
  c.clearRect(0, 0, GF.W, GF.H);
  drawBackground(c);
  drawPage(c);
  drawParticles(c);
  drawHud(c);
  drawHand(c);
  drawCoach(c);
  drawHelp(c);
  drawTerminal(c);
}

function stateObject() {
  return {
    gs: gs,
    score: score,
    best: best,
    issue: issue,
    panel: panel,
    playerHp: playerHp,
    rivalHp: rivalHp,
    rivalMaxHp: rivalMaxHp,
    ink: ink,
    momentum: momentum,
    shield: shield,
    rivalHeat: rivalHeat,
    rivalIntent: rivalIntent ? { key: rivalIntent.key, damage: rivalIntent.damage, type: rivalIntent.type } : null,
    hand: hand.map(function(card) { return card.id; }),
    chain: chain.slice(),
    highestIssue: highestIssue,
    tutorialDone: tutorialDone || screenshotMode
  };
}

function renderText() {
  return JSON.stringify({
    note: 'Canvas origin is top-left; x increases right and y increases down.',
    mode: gs,
    issue: issue,
    panel: panel,
    score: score,
    player: { hp: playerHp, shield: shield, ink: ink, momentum: momentum },
    rival: { hp: rivalHp, maxHp: rivalMaxHp, heat: rivalHeat, intent: rivalIntent ? GF.t(rivalIntent.key) : '' },
    hand: hand.map(function(card, i) {
      return { slot: i + 1, id: card.id, name: tCard(card.id), cost: CARD_DEFS[card.id].cost };
    }),
    chain: chain.slice(),
    helpOpen: helpOpen
  });
}

function setupForScreenshot(level) {
  screenshotMode = true;
  helpOpen = false;
  gs = 'PLAYING';
  playerHp = PLAYER_MAX_HP - 5;
  score = 820 + (Number(level) || 4) * 160;
  momentum = 7;
  usedCards.strike = true;
  usedCards.setup = true;
  usedCards.guard = true;
  usedCards.splash = true;
  startIssue(clamp(Number(level) || 4, 1, ISSUE_COUNT));
  rivalHp = Math.max(8, Math.floor(rivalMaxHp * 0.45));
  ink = 4;
  shield = 5;
  hand = [makeCard('setup'), makeCard('splash'), makeCard('guard'), makeCard(issue >= 5 ? 'ink' : 'twist')];
  panelHistory = [
    { id: 'setup', combo: 1, age: 0.2 },
    { id: 'strike', combo: 2, age: 0.4 },
    { id: 'guard', combo: 3, age: 0.6 }
  ];
  rivalIntent = chooseIntent();
  updateStatus();
}

function botActions() {
  if (gs === 'GAMEOVER' || gs === 'WON') return ['retry'];
  var actions = ['play_best', 'end_panel', 'wait'];
  for (var i = 0; i < hand.length; i++) actions.push('play_' + hand[i].id);
  if (issue < ISSUE_COUNT) actions.push('jump_late');
  return actions;
}

function botAct(action) {
  if (action === 'retry') { startGame({ seed: 232232 }); return true; }
  if (action === 'wait') { window.advanceTime(900); return true; }
  if (action === 'end_panel') return endPlayerPanel();
  if (action === 'jump_late') { setupForScreenshot(5); return true; }
  if (action === 'play_best') return playBestCard();
  if (action.indexOf('play_') === 0) {
    var id = action.slice(5);
    for (var i = 0; i < hand.length; i++) if (hand[i].id === id) return playCardIndex(i);
  }
  return false;
}

function playBestCard() {
  var incoming = rivalIntent ? rivalIntent.damage : 0;
  var order = [];
  if (incoming >= 9 && shield < incoming) order.push('guard');
  if (momentum >= 5 && ink >= 2) order.push('splash');
  if (momentum < 4) order.push('setup');
  order.push('strike', 'twist', 'heal', 'ink', 'guard', 'splash');
  for (var o = 0; o < order.length; o++) {
    for (var i = 0; i < hand.length; i++) {
      if (hand[i].id === order[o] && CARD_DEFS[hand[i].id].cost <= ink) return playCardIndex(i);
    }
  }
  return endPlayerPanel();
}

window._jumpLevel = function(n) { setupForScreenshot(Number(n) || 5); };
window._setupForScreenshot = function(level) { setupForScreenshot(Number(level) || 4); };
window.advanceTime = function(ms) {
  var total = Math.max(0, Number(ms) || 0);
  var step = 1 / 30;
  var count = Math.ceil(total / 1000 / step);
  for (var i = 0; i < count; i++) update(step);
  draw(GF.ctx);
  return stateObject();
};
window.render_game_to_text = renderText;

GF.canvas.addEventListener('pointerdown', onPointerDown, { passive: false });
GF.canvas.addEventListener('pointermove', function(e) { e.preventDefault(); }, { passive: false });
GF.canvas.addEventListener('pointerup', function(e) { e.preventDefault(); }, { passive: false });
GF.canvas.addEventListener('pointercancel', function(e) { e.preventDefault(); }, { passive: false });
document.addEventListener('keydown', onKeyDown);

GF.exposeState(stateObject);
GF.exposeBot(botActions, botAct);
GF.exposeReach(function() {
  layout();
  var items = [
    { id: 'help', x: uiRects.help.x, y: uiRects.help.y, w: uiRects.help.w, h: uiRects.help.h, pinned: true },
    { id: 'mute', x: uiRects.mute.x, y: uiRects.mute.y, w: uiRects.mute.w, h: uiRects.mute.h, pinned: true },
    { id: 'end_panel', x: uiRects.end.x, y: uiRects.end.y, w: uiRects.end.w, h: uiRects.end.h, pinned: true }
  ];
  for (var i = 0; i < uiRects.cards.length; i++) {
    items.push({ id: 'card_' + String(i + 1), x: uiRects.cards[i].x, y: uiRects.cards[i].y, w: uiRects.cards[i].w, h: uiRects.cards[i].h });
  }
  if (helpOpen && uiRects.helpClose) items.push({ id: 'help_close', x: uiRects.helpClose.x, y: uiRects.helpClose.y, w: uiRects.helpClose.w, h: uiRects.helpClose.h, pinned: true });
  if (gs === 'GAMEOVER' || gs === 'WON') items.push({ id: 'retry', x: uiRects.retry.x, y: uiRects.retry.y, w: uiRects.retry.w, h: uiRects.retry.h, pinned: true });
  return { screen: helpOpen ? 'help' : gs, viewportW: GF.W, viewportH: GF.H, screenH: GF.H, scrollMaxY: 0, items: items };
});
GF.exposeTour([
  { name: 'play', go: function() { if (gs !== 'PLAYING') startGame({ seed: 232232 }); helpOpen = false; } },
  { name: 'help', go: function() { if (gs !== 'PLAYING') startGame({ seed: 232232 }); helpOpen = true; } },
  { name: 'gameover', go: function() { gameOver('reason_hp'); helpOpen = false; } }
]);

GF.init({
  designW: 440,
  designH: 760,
  strings: STRINGS,
  saveKey: 'comic_card_clash',
  onReady: function() {
    loadTutorialFlag();
    GF.persist('comic_card_clash_meta_v1', getMeta, applyMeta);
    GF.bgMusic({ file: 'audio/bg_track.mp3', preset: 'synthwave', muted: GF.muted });
    if (!started) {
      started = true;
      startGame({ seed: 232232 });
    }
  },
  onUpdate: update,
  onDraw: draw
});

})();
</script>
</body>
