<body>
<canvas id="c"></canvas>
<script src="./gf-lib.js"></script>
<script>
(function() {
'use strict';

// ── STRINGS ──────────────────────────────────────────────────────────────
var STRINGS = {
  en: {
    title: 'Deep Vein',
    sub: 'Hold to drill - pulse so it never overheats',
    play: 'PLAY', dive: 'DIVE', cont: 'CONTINUE', shop: 'UPGRADES', back: 'MENU',
    depth: 'DEPTH', cash: 'CASH', heat: 'HEAT', best: 'BEST', haul: 'HAUL',
    diveover: 'DIVE OVER', seized: 'DRILL SEIZED!',
    next: 'NEXT', lvl: 'Lv', max: 'MAX', cost: 'COST',
    hold_prompt: 'HOLD TO DRILL',
    u_drill: 'Drill Power', u_cool: 'Coolant', u_auto: 'Auto-Drill',
    u_cargo: 'Cargo Hold', u_charge: 'Depth Charge',
    ud_drill: 'Break harder rock, more ore', ud_cool: 'Cool faster, bigger heat bar',
    ud_auto: 'Chips rock while you cool', ud_cargo: 'More cash per ore',
    ud_charge: 'Start each dive deeper',
    st_topsoil: 'Topsoil', st_bedrock: 'Bedrock', st_crystal: 'Crystal', st_magma: 'Magma',
    tut_goal: 'Goal: Drill deep, bank ore for cash, upgrade, and reach ever-richer veins.',
    tut_controls: 'Controls: Press and HOLD anywhere to drill down. Release to cool the drill.',
    tut_win: 'Win: Endless - beat your best depth and unlock new ore the deeper you go.',
    tut_lose: 'Lose: The drill SEIZES if heat fills the bar - that dive ends (you keep all cash).',
    tut_tip: 'Tip: Pulse - drill in bursts and release to cool. Gas pockets spike heat: let go fast!',
  },
  ru: {
    title: 'Глубокая жила',
    sub: 'Держи, чтобы бурить - рывками, чтобы не перегреть',
    play: 'ИГРАТЬ', dive: 'НЫРОК', cont: 'ДАЛЕЕ', shop: 'УЛУЧШЕНИЯ', back: 'МЕНЮ',
    depth: 'ГЛУБИНА', cash: 'ДЕНЬГИ', heat: 'ЖАР', best: 'РЕКОРД', haul: 'ДОБЫЧА',
    diveover: 'ЗАПЛЫВ ОКОНЧЕН', seized: 'БУР ЗАКЛИНИЛО!',
    next: 'ДАЛЬШЕ', lvl: 'Ур', max: 'МАКС', cost: 'ЦЕНА',
    hold_prompt: 'ДЕРЖИ, ЧТОБЫ БУРИТЬ',
    u_drill: 'Мощь бура', u_cool: 'Охлаждение', u_auto: 'Автобур',
    u_cargo: 'Трюм', u_charge: 'Заряд глубины',
    ud_drill: 'Твёрже порода, больше руды', ud_cool: 'Быстрее остыть, шире шкала',
    ud_auto: 'Бурит, пока ты остываешь', ud_cargo: 'Больше денег за руду',
    ud_charge: 'Начинай заплыв глубже',
    st_topsoil: 'Почва', st_bedrock: 'Скала', st_crystal: 'Кристалл', st_magma: 'Магма',
    tut_goal: 'Цель: Бури вглубь, собирай руду за деньги, улучшай бур и добирайся до богатых жил.',
    tut_controls: 'Управление: Нажми и УДЕРЖИВАЙ в любом месте, чтобы бурить вниз. Отпусти - бур остынет.',
    tut_win: 'Победа: Бесконечно - побей рекорд глубины и открывай новую руду глубже.',
    tut_lose: 'Поражение: Если шкала жара заполнится, бур ЗАКЛИНИТ - заплыв окончен (деньги остаются).',
    tut_tip: 'Совет: Бури рывками и отпускай для охлаждения. Газовые карманы резко греют - отпускай сразу!',
  },
};

var SPRITE_NAMES = ['drill', 'coal', 'iron', 'gem', 'relic', 'lava'];

// ── TUNABLES (every one exposed via GF.exposeState) ────────────────────────
var HEAT_MAX            = 100;   // seize threshold (base; +20 per Coolant level)
var HEAT_RISE_PER_TICK  = 6.5;   // heat/sec drilling soft rock (scales w/ hardness)
var COOL_RATE           = 22;    // heat/sec shed while NOT drilling (+6 per Coolant)
var DRILL_POWER         = 1;     // base break power & ore-per-hit (+1 per Drill level)
var GAS_HEAT_SPIKE      = 34;    // instant heat on a gas-pocket break
var LAVA_HEAT_PER_TICK  = 14;    // extra heat/sec while tip inside a lava seam
var AUTO_DRILL_RATE     = 0;     // tiles/sec auto-chipped while idle (+0.7 per Auto level)
var CARGO_MULT          = 1;     // cash multiplier on haul (+0.35 per Cargo level)
var COST_SCALE          = 1.55;  // per-level upgrade cost growth
var STRATUM_DEPTHS      = [0, 50, 150, 300]; // metre thresholds
var ORE_VALUES          = { dirt:0, coal:3, iron:8, silver:20, gold:45, gem:110, ruby:240, diamond:520, relic:1500 };

// Hitboxes / sizes (design space 540×960)
var TILE_PX   = 46;
var SHAFT_COLS = 5;
var DRILL_W = 40, DRILL_H = 52;

var METERS_PER_TILE = 1.4;   // depth gained per tile broken
var BREAK_BASE_SEC  = 0.42;  // seconds to break a hardness-1 tile at DRILL_POWER 1

// ── ORE COLOURS / DROP TABLES ──────────────────────────────────────────────
var ORE_COL = {
  dirt:'#6b4a2e', coal:'#2c2c34', iron:'#b6a48c', silver:'#d9e2ec',
  gold:'#f5c542', gem:'#49d6c0', ruby:'#e84a6f', diamond:'#7fdcff', relic:'#ffd34d',
};
var ORE_SPRITE = { coal:'coal', iron:'iron', silver:'gem', gold:'gem', gem:'gem', ruby:'gem', diamond:'gem', relic:'relic' };

// Per-stratum: rock hardness, ore drop weights, hazard probabilities.
var STRATA = [
  { key:'st_topsoil', rock:['#7a5536','#5e3f27'], hard:1,
    drops:[['dirt',58],['coal',42]], gas:0, lava:0 },
  { key:'st_bedrock', rock:['#6d6f76','#4b4d54'], hard:2,
    drops:[['dirt',30],['coal',34],['iron',36]], gas:0.13, lava:0 },
  { key:'st_crystal', rock:['#3d6b6b','#274a4a'], hard:3,
    drops:[['dirt',16],['iron',26],['silver',26],['gold',20],['gem',12]], gas:0.10, lava:0.16 },
  { key:'st_magma', rock:['#7a352a','#4d1f18'], hard:4,
    drops:[['iron',14],['gold',24],['gem',24],['ruby',20],['diamond',14],['relic',4]], gas:0.08, lava:0.20 },
];

function stratumIndexForDepth(m) {
  var idx = 0;
  for (var i = 0; i < STRATUM_DEPTHS.length; i++) if (m >= STRATUM_DEPTHS[i]) idx = i;
  return idx;
}
function isRu() { try { return GF.t('play') === STRINGS.ru.play; } catch (e) { return false; } }

// ── UPGRADE SPINE ───────────────────────────────────────────────────────────
var UPGRADES = [
  { id:'drill',  nameKey:'u_drill',  descKey:'ud_drill',  base:25,  max:9 },
  { id:'cool',   nameKey:'u_cool',   descKey:'ud_cool',   base:30,  max:9 },
  { id:'auto',   nameKey:'u_auto',   descKey:'ud_auto',   base:60,  max:8 },
  { id:'cargo',  nameKey:'u_cargo',  descKey:'ud_cargo',  base:45,  max:9 },
  { id:'charge', nameKey:'u_charge', descKey:'ud_charge', base:55,  max:8 },
];
var lvl = { drill:0, cool:0, auto:0, cargo:0, charge:0 };  // persisted upgrade levels

function upgradeCost(id) {
  var u = null;
  for (var i = 0; i < UPGRADES.length; i++) if (UPGRADES[i].id === id) u = UPGRADES[i];
  if (!u) return Infinity;
  if (lvl[id] >= u.max) return Infinity;
  return Math.round(u.base * Math.pow(COST_SCALE, lvl[id]));
}
// Apply all upgrade levels to the live tunables.
function recompute() {
  DRILL_POWER     = 1 + lvl.drill;
  HEAT_MAX        = 100 + lvl.cool * 20;
  COOL_RATE       = 22 + lvl.cool * 6;
  AUTO_DRILL_RATE = lvl.auto * 0.7;
  CARGO_MULT      = 1 + lvl.cargo * 0.35;
}
function startDepthForCharge() { return lvl.charge * 22; } // metres deeper per Depth Charge level

// ── PERSISTENT META ─────────────────────────────────────────────────────────
var cash = 0;          // persisted
var bestDepth = 0;     // persisted (metres)

// ── GAME STATE ───────────────────────────────────────────────────────────────
var gs = 'MENU';       // MENU | SHOP | PLAYING | GAMEOVER
var depth = 0;         // current dive depth in metres
var heat = 0;          // current heat 0..HEAT_MAX
var drilling = false;  // is the player holding?
var holdEver = false;  // has the player held at least once this dive (kills HOLD prompt)
var diveHaul = 0;      // cash earned THIS dive
var diveOreCount = 0;  // ore chunks banked this dive
var rows = [];         // active shaft rows: each { depth, cells[SHAFT_COLS], stratum }
var nextRowDepth = 0;  // metre depth of the next row to spawn at bottom
var breakProg = 0;     // 0..1 progress breaking the tile directly below
var ores = [];         // flying ore chunks {x,y,tx,ty,col,sprite,t,val,big}
var camTopDepth = 0;   // metre depth shown at top edge of play area (camera)
var heatPulseT = 0;    // for heat-warning pulse
var seizeFlash = 0;    // brief flash on seize
var topRelic = false;  // relic seen this dive (results flair)

var DRILL_COL = (SHAFT_COLS - 1) >> 1; // centre column = 2

// ── ROW / TILE GENERATION ─────────────────────────────────────────────────────
// Only the centre column is drilled; side columns are decorative wall rock so
// the shaft reads as a cross-section. Centre cells carry the gameplay.
function makeCell(stratum, isCenter, mDepth) {
  var s = STRATA[stratum];
  var cell = { kind:'rock', hard:s.hard, ore:null, lava:false, gas:false };
  var ramp = Math.min(2, Math.floor(mDepth / 90));
  if (Math.random() < 0.18 * ramp) cell.hard += 1;
  if (stratum >= 3) cell.hard += Math.max(0, Math.floor((mDepth - 300) / 220)); // endless magma densifies
  cell.hard = Math.max(1, cell.hard);
  if (!isCenter) {
    // decorative wall: occasional embedded ore fleck (drawn dimmer, never drilled)
    if (Math.random() < 0.22) {
      var fr = pickDrop(s.drops);
      if (fr && fr !== 'dirt') cell.wallOre = fr;
    }
    return cell;
  }
  if (s.lava && Math.random() < s.lava) { cell.lava = true; }
  if (s.gas && !cell.lava && Math.random() < s.gas) { cell.gas = true; }
  if (!cell.gas && !cell.lava) {
    var roll = pickDrop(s.drops);
    if (roll && roll !== 'dirt') cell.ore = roll;
    if (stratum >= 3 && !cell.ore && Math.random() < 0.012) cell.ore = 'relic';
  }
  return cell;
}
function pickDrop(drops) {
  var tot = 0, i;
  for (i = 0; i < drops.length; i++) tot += drops[i][1];
  var r = Math.random() * tot;
  for (i = 0; i < drops.length; i++) { r -= drops[i][1]; if (r <= 0) return drops[i][0]; }
  return drops[0][0];
}
function spawnRow(mDepth) {
  var stratum = stratumIndexForDepth(mDepth);
  var cells = [];
  for (var c = 0; c < SHAFT_COLS; c++) cells.push(makeCell(stratum, c === DRILL_COL, mDepth));
  return { depth: mDepth, cells: cells, stratum: stratum };
}
// Populate rows from camera top to below the screen.
function ensureRows() {
  while (rows.length && rows[0].depth < camTopDepth - METERS_PER_TILE * 2) rows.shift();
  var bottomNeeded = camTopDepth + (GF.H / (TILE_PX * GF.S)) * METERS_PER_TILE + METERS_PER_TILE * 4;
  while (nextRowDepth < bottomNeeded) {
    rows.push(spawnRow(nextRowDepth));
    nextRowDepth += METERS_PER_TILE;
  }
}
// The center cell the drill is currently biting (first center row at/below depth).
function currentTargetRow() {
  for (var i = 0; i < rows.length; i++) {
    if (rows[i].cells[DRILL_COL].kind === 'rock' && rows[i].depth >= depth - 0.01) return rows[i];
  }
  return null;
}

// ── DIVE LIFECYCLE ─────────────────────────────────────────────────────────
var _lastStratumSfx = -1;

function startDive() {
  recompute();
  depth = startDepthForCharge();
  heat = 0;
  drilling = false;
  holdEver = false;
  diveHaul = 0;
  diveOreCount = 0;
  breakProg = 0;
  ores = [];
  topRelic = false;
  rows = [];
  _lastStratumSfx = -1;
  nextRowDepth = Math.floor(depth / METERS_PER_TILE) * METERS_PER_TILE;
  camTopDepth = depth - 2.2 * METERS_PER_TILE;
  ensureRows();
  gs = 'PLAYING';
  GF.sfx('spawn');
  GF.gameStarted();
  GF.saveRun();
}

function seize() {
  drilling = false;
  seizeFlash = 1;
  GF.sfx('lose');
  if (depth > bestDepth) { bestDepth = depth; try { localStorage.setItem('deep_vein_best', String(Math.floor(bestDepth))); } catch (e) {} }
  gs = 'GAMEOVER';
  GF.gameEnded();
  GF.setShake(0.6);
  GF.spawnParticles(GF.W / 2, GF.H * 0.4, '#ff5a3c', 30);
  if (topRelic) GF.happytime();
  GF.saveRun();
}

function bankOre(type, fromX, fromY) {
  var base = ORE_VALUES[type] || 0;
  var val = Math.round(base * CARGO_MULT);
  if (val > 0) {
    cash += val;
    diveHaul += val;
    diveOreCount++;
    try { localStorage.setItem('deep_vein_cash', String(Math.floor(cash))); } catch (e) {}
    if (type === 'relic' || type === 'diamond') { GF.sfx('reward'); }
    else if (val >= 40) { GF.sfx('coin'); }
    else { GF.sfx('pickup'); }
  }
  if (type === 'relic') topRelic = true;
  ores.push({
    x: fromX, y: fromY,
    tx: GF.W - 54 * GF.S, ty: 44 * GF.S,
    col: ORE_COL[type] || '#fff', sprite: ORE_SPRITE[type] || null,
    t: 0, val: val, big: (type === 'relic' || type === 'diamond'),
  });
  if (val > 0) GF.spawnFloat(fromX, fromY - 14 * GF.S, '+$' + val, ORE_COL[type] || '#ffe27a');
}

function toShop() { gs = 'SHOP'; GF.saveRun(); }
function toMenu() { gs = 'MENU'; GF.saveRun(); }

function buyUpgrade(id) {
  var cost = upgradeCost(id);
  if (!isFinite(cost) || cash < cost) { GF.sfx('error'); GF.setShake(0.18); return; }
  cash -= cost;
  lvl[id] = (lvl[id] || 0) + 1;
  recompute();
  try {
    localStorage.setItem('deep_vein_cash', String(Math.floor(cash)));
    localStorage.setItem('deep_vein_lvl', JSON.stringify(lvl));
  } catch (e) {}
  GF.sfx('levelup');
  GF.spawnFloat(GF.W / 2, GF.H * 0.5, isRu() ? 'УЛУЧШЕНО!' : 'UPGRADED!', '#7fffd4');
  GF.saveRun();
}

// ── SCREENSHOT / GATE HOOKS ──────────────────────────────────────────────────
// _jumpLevel(99) must reach a terminal (GAMEOVER) for the gate; lower values
// land mid-dive in a populated later stratum.
window._jumpLevel = function(n) {
  GF.tutorial.active = false;
  try { localStorage.setItem('deep_vein_seen_tutorial', '1'); } catch (e) {}
  if (n >= 90) {
    lvl = { drill:3, cool:2, auto:2, cargo:2, charge:3 }; recompute();
    startDive();
    depth = 360; diveHaul = 880; diveOreCount = 14; topRelic = true;
    heat = HEAT_MAX; seize();
    return;
  }
  lvl = { drill:3, cool:2, auto:2, cargo:2, charge:2 }; recompute();
  startDive();
  var target = [10, 70, 200, 360][GF.clamp((n || 3) - 1, 0, 3)];
  depth = target;
  camTopDepth = depth - 2.2 * METERS_PER_TILE;
  nextRowDepth = Math.floor(depth / METERS_PER_TILE) * METERS_PER_TILE;
  rows = []; ensureRows();
  heat = HEAT_MAX * 0.62;
  diveHaul = 240; diveOreCount = 6;
  gs = 'PLAYING';
};
window._setupForScreenshot = function(level) {
  try { localStorage.setItem('deep_vein_seen_tutorial', '1'); } catch (e) {}
  GF.tutorial.active = false;
  lvl = { drill:4, cool:3, auto:3, cargo:3, charge:3 }; recompute();
  startDive();
  var target = [60, 180, 330, 430][GF.clamp((level || 3) - 1, 0, 3)];
  depth = target;
  // drill sits high (~16% down) so the rich shaft below fills the frame
  camTopDepth = depth - 1.2 * METERS_PER_TILE;
  nextRowDepth = Math.floor(depth / METERS_PER_TILE) * METERS_PER_TILE;
  rows = []; ensureRows();
  // seed the visible center column with a dense, varied, ore-heavy run + hazards
  var stratHere = stratumIndexForDepth(target);
  var oreMenu = stratHere >= 3 ? ['gem','gold','ruby','diamond','gem','gold']
              : stratHere >= 2 ? ['gem','silver','gold','iron','gem','silver']
              : stratHere >= 1 ? ['iron','coal','iron','coal','iron','coal']
              :                  ['coal','coal','coal','coal','coal','coal'];
  var oi2 = 0;
  for (var i = 0; i < rows.length; i++) {
    var ctr = rows[i].cells[DRILL_COL];
    ctr.kind = 'rock'; ctr.gas = false; ctr.lava = false; ctr.ore = null;
    if (i === 0) continue; // tile the bit is about to break stays plain
    // every 4th visible row a lava seam (stratum 2+), else cycle the ore menu
    if (stratHere >= 2 && i % 4 === 3) { ctr.lava = true; }
    else { ctr.ore = oreMenu[oi2 % oreMenu.length]; oi2++; }
  }
  drilling = true; holdEver = true;
  heat = HEAT_MAX * 0.66;
  diveHaul = 520; diveOreCount = 9; topRelic = true;
  bankOre('gem', GF.W * 0.5, GF.H * 0.55);
  bankOre('gold', GF.W * 0.45, GF.H * 0.62);
  ores[0].t = 0.3; if (ores[1]) ores[1].t = 0.55;
  gs = 'PLAYING';
};

// ── UPDATE ───────────────────────────────────────────────────────────────────
function update(dt) {
  GF.tutorial.update(dt);
  if (seizeFlash > 0) seizeFlash = Math.max(0, seizeFlash - dt * 2);
  heatPulseT += dt;

  // animate flying ore in any state so RESULTS still settles them
  for (var oi = ores.length - 1; oi >= 0; oi--) {
    ores[oi].t += dt * 2.6;
    if (ores[oi].t >= 1) ores.splice(oi, 1);
  }

  if (gs !== 'PLAYING') return;
  if (GF.tutorial.active) return;

  ensureRows();

  var target = currentTargetRow();
  var inLava = target && target.cells[DRILL_COL] && target.cells[DRILL_COL].lava;

  if (drilling) {
    holdEver = true;
    var trow = target ? target.cells[DRILL_COL] : null;
    var hard = trow ? trow.hard : 1;
    var powerRatio = DRILL_POWER / hard;            // >=1 efficient, <1 struggling
    var heatMul = powerRatio >= 1 ? 1 : (1 + (1 - powerRatio) * 1.6);
    heat += HEAT_RISE_PER_TICK * heatMul * dt;
    if (inLava) heat += LAVA_HEAT_PER_TICK * dt;
    var breakRate = (1 / (BREAK_BASE_SEC * hard)) * Math.min(1.6, Math.max(0.4, powerRatio));
    breakProg += breakRate * dt;
    if (breakProg >= 1) { breakTile(target); breakProg = 0; }
  } else {
    heat -= COOL_RATE * dt;
    if (heat < 0) heat = 0;
    if (inLava) heat += LAVA_HEAT_PER_TICK * 0.5 * dt;
    if (AUTO_DRILL_RATE > 0 && target) {
      breakProg += AUTO_DRILL_RATE * dt / target.cells[DRILL_COL].hard;
      if (breakProg >= 1) { breakTile(target); breakProg = 0; }
    }
  }

  // camera follows drill (~32% down the screen)
  var wantTop = depth - (GF.H * 0.32) / (TILE_PX * GF.S) * METERS_PER_TILE;
  camTopDepth += (wantTop - camTopDepth) * Math.min(1, dt * 9);

  if (depth > bestDepth) bestDepth = depth;

  if (heat >= HEAT_MAX) { heat = HEAT_MAX; seize(); return; }
}

function breakTile(row) {
  if (!row) return;
  var cell = row.cells[DRILL_COL];
  var cx = laneX(DRILL_COL);
  var cy = depthToY(row.depth);
  var prevStratum = stratumIndexForDepth(depth);
  if (cell.gas) {
    heat += GAS_HEAT_SPIKE;
    GF.sfx('hurt');
    GF.setShake(0.4);
    GF.spawnParticles(cx, cy, '#8ef07a', 22);
    GF.spawnFloat(cx, cy - 18 * GF.S, '+' + GAS_HEAT_SPIKE + '°', '#9dff7a');
  } else {
    var pc = cell.ore ? (ORE_COL[cell.ore] || '#fff') : STRATA[row.stratum].rock[0];
    GF.spawnParticles(cx, cy, pc, cell.ore ? 16 : 9);
    if (cell.ore) { bankOre(cell.ore, cx, cy); } else { GF.sfx('hit'); }
  }
  cell.kind = 'broken';
  cell.ore = null; cell.gas = false; cell.lava = false;
  depth += METERS_PER_TILE;
  var newStratum = stratumIndexForDepth(depth);
  if (newStratum > prevStratum && newStratum !== _lastStratumSfx) {
    _lastStratumSfx = newStratum;
    GF.sfx('unlock');
  }
}

// ── LAYOUT HELPERS ───────────────────────────────────────────────────────────
function shaftMetrics() {
  var tw = TILE_PX * GF.S;
  var totalW = tw * SHAFT_COLS;
  var x0 = (GF.W - totalW) / 2;
  return { tw: tw, x0: x0, totalW: totalW };
}
function laneX(col) { var m = shaftMetrics(); return m.x0 + col * m.tw + m.tw / 2; }
function depthToY(mDepth) {
  var tw = TILE_PX * GF.S;
  return (mDepth - camTopDepth) / METERS_PER_TILE * tw;
}

// ── DRAW ───────────────────────────────────────────────────────────────────
var _playBtn=null, _diveBtn=null, _contBtn=null, _shopBackBtn=null, _helpBtn=null, _muteBtn=null, _menuShopBtn=null, _goShopBtn=null;
var _upBtns=[];

function draw(ctx) {
  drawBg(ctx);
  if (gs === 'PLAYING' || gs === 'GAMEOVER') {
    drawShaft(ctx);
    drawDrill(ctx);
    drawFlyingOre(ctx);
    drawHUD(ctx);
    if (gs === 'PLAYING' && !holdEver && !GF.tutorial.active) drawHoldPrompt(ctx);
  }
  if (seizeFlash > 0) { ctx.fillStyle = 'rgba(255,70,40,' + (seizeFlash * 0.4) + ')'; ctx.fillRect(0,0,GF.W,GF.H); }
  if (gs === 'MENU')     drawMenu(ctx);
  if (gs === 'SHOP')     drawShop(ctx);
  if (gs === 'GAMEOVER') drawResults(ctx);
  GF.tutorial.draw(ctx);
}

function drawBg(ctx) {
  var si = stratumIndexForDepth(Math.max(0, camTopDepth + 3));
  var top = ['#2a1d12','#23262b','#16302f','#2e1410'][si];
  var bot = ['#140d09','#101216','#0a1a19','#160907'][si];
  var g = ctx.createLinearGradient(0, 0, 0, GF.H);
  g.addColorStop(0, top); g.addColorStop(1, bot);
  ctx.fillStyle = g; ctx.fillRect(0, 0, GF.W, GF.H);
}

function drawShaft(ctx) {
  var m = shaftMetrics();
  var tw = m.tw;
  for (var ri = 0; ri < rows.length; ri++) {
    var row = rows[ri];
    var y = depthToY(row.depth);
    if (y < -tw || y > GF.H + tw) continue;
    var s = STRATA[row.stratum];
    for (var c = 0; c < SHAFT_COLS; c++) {
      var cell = row.cells[c];
      var x = m.x0 + c * tw;
      var isCenter = (c === DRILL_COL);
      if (isCenter && cell.kind === 'broken') {
        ctx.fillStyle = 'rgba(0,0,0,0.55)';
        ctx.fillRect(x, y, tw, tw);
        continue;
      }
      drawRockCell(ctx, cell, x, y, tw, s);
    }
  }
}

function drawRockCell(ctx, cell, x, y, tw, s) {
  if (cell.lava) {
    GF.drawSprite('lava', x + tw/2, y + tw/2, tw, function(c) {
      var g = c.createRadialGradient(x+tw/2, y+tw/2, tw*0.1, x+tw/2, y+tw/2, tw*0.6);
      g.addColorStop(0, '#ffd34d'); g.addColorStop(0.5, '#ff7a1a'); g.addColorStop(1, '#7a1f0c');
      c.fillStyle = g; c.fillRect(x, y, tw, tw);
    });
    return;
  }
  var hard = cell.hard;
  var g = ctx.createLinearGradient(x, y, x, y + tw);
  g.addColorStop(0, s.rock[0]); g.addColorStop(1, s.rock[1]);
  ctx.fillStyle = g;
  ctx.fillRect(x, y, tw, tw);
  ctx.fillStyle = 'rgba(0,0,0,' + Math.min(0.32, 0.05 * hard) + ')';
  ctx.fillRect(x, y, tw, tw);
  ctx.strokeStyle = 'rgba(0,0,0,0.22)';
  ctx.lineWidth = Math.max(1, GF.S);
  ctx.strokeRect(x + 0.5, y + 0.5, tw - 1, tw - 1);
  if (cell.gas) {
    ctx.fillStyle = 'rgba(120,240,120,0.85)';
    ctx.beginPath(); ctx.arc(x + tw/2, y + tw/2, tw*0.26, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = 'rgba(180,255,180,0.5)';
    ctx.beginPath(); ctx.arc(x + tw*0.42, y + tw*0.42, tw*0.1, 0, Math.PI*2); ctx.fill();
  } else if (cell.ore) {
    drawOreInRock(ctx, cell.ore, x + tw/2, y + tw/2, tw * 0.62);
  } else if (cell.wallOre) {
    // dim embedded fleck in the wall (decorative depth)
    ctx.save();
    ctx.globalAlpha = 0.5;
    drawOreInRock(ctx, cell.wallOre, x + tw/2, y + tw/2, tw * 0.4);
    ctx.restore();
  }
}

function drawOreInRock(ctx, type, cx, cy, sz) {
  var spr = ORE_SPRITE[type];
  GF.drawSprite(spr || '___none', cx, cy, sz, function(c, x, y, s2) {
    c.save();
    c.fillStyle = ORE_COL[type] || '#fff';
    var r = s2 * 0.5;
    c.beginPath();
    c.moveTo(x, y - r);
    c.lineTo(x + r*0.85, y - r*0.2);
    c.lineTo(x + r*0.55, y + r*0.8);
    c.lineTo(x - r*0.55, y + r*0.8);
    c.lineTo(x - r*0.85, y - r*0.2);
    c.closePath(); c.fill();
    c.fillStyle = 'rgba(255,255,255,0.45)';
    c.beginPath();
    c.moveTo(x, y - r);
    c.lineTo(x + r*0.85, y - r*0.2);
    c.lineTo(x, y + r*0.1);
    c.closePath(); c.fill();
    c.restore();
  });
}

function drawDrill(ctx) {
  if (!rows.length) return;
  var x = laneX(DRILL_COL);
  var y = depthToY(depth);
  var s = GF.S;
  var w = DRILL_W * s, h = DRILL_H * s;
  var jx = drilling ? (Math.random() - 0.5) * 3 * s : 0;
  var jy = drilling ? (Math.random() - 0.5) * 3 * s : 0;
  var hotFrac = heat / HEAT_MAX;
  GF.drawSprite('drill', x + jx, y - h * 0.05 + jy, h, function() {
    ctx.save();
    ctx.translate(jx, jy);
    ctx.fillStyle = '#c9ccd6';
    GF.rr(ctx, x - w/2, y - h*0.55, w, h*0.7, 6 * s); ctx.fill();
    ctx.fillStyle = '#8a8f9c';
    ctx.fillRect(x - w/2, y - h*0.1, w, h*0.18);
    var bitTop = y + h*0.02;
    var grad = ctx.createLinearGradient(x, bitTop, x, bitTop + h*0.5);
    grad.addColorStop(0, '#d6d9e0');
    grad.addColorStop(1, hotFrac > 0.5 ? '#ff5a2a' : '#9aa0ad');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.moveTo(x - w*0.46, bitTop);
    ctx.lineTo(x + w*0.46, bitTop);
    ctx.lineTo(x, bitTop + h*0.55);
    ctx.closePath(); ctx.fill();
    if (hotFrac > 0.45) {
      ctx.globalAlpha = (hotFrac - 0.45) * 1.6;
      ctx.fillStyle = '#ff7a3c';
      ctx.beginPath(); ctx.arc(x, bitTop + h*0.4, w*0.5, 0, Math.PI*2); ctx.fill();
      ctx.globalAlpha = 1;
    }
    ctx.restore();
  });
}

function drawFlyingOre(ctx) {
  for (var i = 0; i < ores.length; i++) {
    var o = ores[i];
    var t = GF.clamp(o.t, 0, 1);
    var ease = t * t * (3 - 2 * t);
    var x = GF.lerp(o.x, o.tx, ease);
    var y = GF.lerp(o.y, o.ty, ease) - Math.sin(ease * Math.PI) * 40 * GF.S;
    var sz = (o.big ? 22 : 15) * GF.S * (1 - t * 0.4);
    ctx.save();
    ctx.globalAlpha = 1 - t * 0.2;
    if (o.sprite) {
      GF.drawSprite(o.sprite, x, y, sz * 1.6, function() {
        ctx.fillStyle = o.col; ctx.beginPath(); ctx.arc(x, y, sz, 0, Math.PI*2); ctx.fill();
      });
    } else {
      ctx.fillStyle = o.col; ctx.beginPath(); ctx.arc(x, y, sz, 0, Math.PI*2); ctx.fill();
    }
    ctx.restore();
  }
}

// ── HUD ──────────────────────────────────────────────────────────────────────
function drawHUD(ctx) {
  var S = GF.S, W = GF.W;
  var pad = GF.clamp(12 * S, 8, 18);
  var fs = GF.clamp(17 * S, 13, 23);
  ctx.textBaseline = 'top';

  // top-left: depth + stratum
  ctx.font = 'bold ' + fs + 'px sans-serif';
  ctx.fillStyle = '#ffe6b0';
  ctx.textAlign = 'left';
  ctx.fillText(GF.t('depth') + ' ' + Math.floor(depth) + 'm', pad, pad);
  var si = stratumIndexForDepth(depth);
  ctx.font = GF.clamp(12 * S, 10, 16) + 'px sans-serif';
  ctx.fillStyle = '#cdbfa6';
  ctx.fillText(GF.t(STRATA[si].key), pad, pad + fs + 2 * S);

  // top-right: ? button, total cash, dive haul
  var btn = GF.clamp(34 * S, 30, 44);
  _helpBtn = { x: W - pad - btn, y: pad, w: btn, h: btn };
  GF.rr(ctx, _helpBtn.x, _helpBtn.y, btn, btn, btn * 0.26);
  ctx.fillStyle = 'rgba(60,45,30,0.85)'; ctx.fill();
  ctx.strokeStyle = 'rgba(230,200,150,0.4)'; ctx.lineWidth = Math.max(1.4*S,1.1); ctx.stroke();
  ctx.fillStyle = '#ffe6b0'; ctx.font = 'bold ' + (btn*0.55) + 'px sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('?', _helpBtn.x + btn/2, _helpBtn.y + btn/2 + btn*0.02);

  ctx.textBaseline = 'top'; ctx.textAlign = 'right';
  ctx.font = 'bold ' + fs + 'px sans-serif';
  ctx.fillStyle = '#ffd34d';
  ctx.fillText('$ ' + Math.floor(cash), W - pad, pad + btn + 4 * S);
  ctx.font = GF.clamp(12 * S, 10, 16) + 'px sans-serif';
  ctx.fillStyle = '#9fe8b5';
  ctx.fillText(GF.t('haul') + ' +$' + Math.floor(diveHaul), W - pad, pad + btn + 4 * S + fs + 2 * S);

  // center-top: HEAT BAR
  var barW = GF.clamp(W * 0.5, 150, 320);
  var barH = GF.clamp(16 * S, 12, 22);
  var bx = (W - barW) / 2;
  var by = pad + 2 * S;
  GF.rr(ctx, bx, by, barW, barH, barH/2);
  ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fill();
  var hf = GF.clamp(heat / HEAT_MAX, 0, 1);
  var fillW = Math.max(barH, barW * hf);
  GF.rr(ctx, bx, by, fillW, barH, barH/2);
  var hg = ctx.createLinearGradient(bx, by, bx + barW, by);
  hg.addColorStop(0, '#3fb86a'); hg.addColorStop(0.55, '#f6c531'); hg.addColorStop(1, '#ff3b24');
  ctx.fillStyle = hg; ctx.fill();
  ctx.lineWidth = Math.max(2*S, 1.6);
  if (hf > 0.7) {
    var pulse = 0.5 + 0.5 * Math.sin(heatPulseT * 9);
    ctx.strokeStyle = 'rgba(255,80,50,' + (0.5 + pulse*0.5) + ')';
  } else {
    ctx.strokeStyle = 'rgba(255,230,180,0.4)';
  }
  ctx.stroke();
  ctx.font = 'bold ' + GF.clamp(11*S,9,15) + 'px sans-serif';
  ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(GF.t('heat'), bx + barW/2, by + barH/2);
  ctx.textBaseline = 'top';

  drawNextBanner(ctx, by + barH + 6 * S);

  // bottom-left mute button
  var mb = GF.clamp(34 * S, 30, 44);
  _muteBtn = { x: pad, y: GF.H - pad - mb, w: mb, h: mb };
  GF.rr(ctx, _muteBtn.x, _muteBtn.y, mb, mb, mb * 0.26);
  ctx.fillStyle = 'rgba(60,45,30,0.85)'; ctx.fill();
  ctx.strokeStyle = 'rgba(230,200,150,0.4)'; ctx.lineWidth = Math.max(1.4*S,1.1); ctx.stroke();
  GF.drawMuteIcon(ctx, _muteBtn.x + mb/2, _muteBtn.y + mb/2, mb * 0.36, GF.muted);
}

function drawNextBanner(ctx, y) {
  var si = stratumIndexForDepth(depth);
  var W = GF.W, S = GF.S;
  ctx.textAlign = 'center';
  if (si < STRATUM_DEPTHS.length - 1) {
    var nextD = STRATUM_DEPTHS[si + 1];
    var togo = Math.max(0, Math.ceil(nextD - depth));
    var nextName = GF.t(STRATA[si + 1].key);
    ctx.font = 'bold ' + GF.clamp(13 * S, 11, 18) + 'px sans-serif';
    ctx.fillStyle = '#ffd9a0';
    ctx.fillText(GF.t('next') + ': ' + nextName.toUpperCase() + ' - ' + togo + 'm', W / 2, y);
  } else {
    ctx.font = 'bold ' + GF.clamp(13 * S, 11, 18) + 'px sans-serif';
    ctx.fillStyle = '#ff9c6e';
    ctx.fillText('v ' + (isRu() ? 'БЕЗДНА' : 'THE DEEP') + ' v', W / 2, y);
  }
  ctx.textAlign = 'left';
}

function drawHoldPrompt(ctx) {
  var W = GF.W, H = GF.H, S = GF.S;
  var pulse = 0.6 + 0.4 * Math.sin(heatPulseT * 4);
  var yc = GF.clamp(depthToY(depth) + 70 * S, H * 0.5, H * 0.74);
  ctx.save();
  ctx.globalAlpha = pulse;
  ctx.font = 'bold ' + GF.clamp(26 * S, 18, 38) + 'px sans-serif';
  ctx.fillStyle = '#ffe27a';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.shadowColor = 'rgba(0,0,0,0.8)'; ctx.shadowBlur = 8 * S;
  ctx.fillText(GF.t('hold_prompt'), W / 2, yc);
  ctx.beginPath();
  var ay = yc + 34 * S;
  ctx.moveTo(W/2 - 16*S, ay); ctx.lineTo(W/2 + 16*S, ay); ctx.lineTo(W/2, ay + 22*S);
  ctx.closePath(); ctx.fill();
  ctx.restore();
  ctx.textBaseline = 'top'; ctx.textAlign = 'left';
}

// ── OVERLAYS ─────────────────────────────────────────────────────────────────
function wrapLines(ctx, text, maxW) {
  var words = String(text).split(/\s+/), lines = [], cur = '';
  for (var i = 0; i < words.length; i++) {
    var probe = cur ? cur + ' ' + words[i] : words[i];
    if (ctx.measureText(probe).width > maxW && cur) { lines.push(cur); cur = words[i]; }
    else cur = probe;
  }
  if (cur) lines.push(cur);
  return lines;
}
function drawScrim(ctx, a) { ctx.fillStyle = 'rgba(10,7,4,' + (a || 0.9) + ')'; ctx.fillRect(0,0,GF.W,GF.H); }

function drawButton(ctx, label, cx, y, accent, wMul) {
  var S = GF.S;
  var bw = GF.clamp(250 * S * (wMul||1), 160, 360), bh = GF.clamp(58 * S, 46, 72);
  var bx = cx - bw/2;
  var g = ctx.createLinearGradient(bx, y, bx, y + bh);
  if (accent === 'amber') { g.addColorStop(0, '#f6a531'); g.addColorStop(1, '#c4640f'); }
  else { g.addColorStop(0, '#e0913a'); g.addColorStop(1, '#9a5212'); }
  GF.rr(ctx, bx, y, bw, bh, bh/2);
  ctx.fillStyle = g; ctx.fill();
  ctx.font = 'bold ' + GF.clamp(20 * S, 16, 26) + 'px sans-serif';
  ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(label, cx, y + bh/2);
  ctx.textBaseline = 'top';
  return { x: bx, y: y, w: bw, h: bh };
}

function drawMenu(ctx) {
  drawScrim(ctx, 0.93);
  var S = GF.S, W = GF.W, H = GF.H, cx = W/2;
  var maxW = Math.min(W * 0.88, 460);

  ctx.shadowColor = 'rgba(246,165,49,0.55)'; ctx.shadowBlur = 26 * S;
  ctx.font = 'bold ' + GF.clamp(44 * S, 28, 58) + 'px sans-serif';
  ctx.fillStyle = '#ffd9a0'; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  var titleY = H * 0.06;
  ctx.fillText(GF.t('title'), cx, titleY);
  ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0;

  drawTitleArt(ctx, cx, titleY + GF.clamp(54 * S, 38, 70));

  var y = titleY + GF.clamp(150 * S, 110, 210);
  var fs = GF.clamp(15 * S, 12, 18);
  var lineH = fs * 1.26;
  ctx.font = fs + 'px sans-serif';
  ctx.textAlign = 'left';
  var lx = cx - maxW / 2;
  var keys = ['tut_goal', 'tut_controls', 'tut_win', 'tut_lose', 'tut_tip'];
  var cols = ['#9fe8b5', '#cfe0ff', '#ffd9a0', '#ff9c8e', '#ffe27a'];
  for (var ki = 0; ki < keys.length; ki++) {
    var lines = wrapLines(ctx, GF.t(keys[ki]), maxW);
    ctx.fillStyle = cols[ki];
    for (var j = 0; j < lines.length; j++) { ctx.fillText(lines[j], lx, y); y += lineH; }
    y += lineH * 0.26;
  }

  var btnY = Math.min(y + GF.clamp(12 * S, 8, 20), H - GF.clamp(130 * S, 100, 160));
  _playBtn = drawButton(ctx, GF.t('play'), cx, btnY, 'amber');
  var shopBtnY = btnY + _playBtn.h + GF.clamp(8 * S, 6, 12);
  var shopBtnW = GF.clamp(180 * S * 0.82, 120, 220), shopBtnH = GF.clamp(44 * S, 34, 54);
  var shopBtnX = cx - shopBtnW / 2;
  var sg = ctx.createLinearGradient(shopBtnX, shopBtnY, shopBtnX, shopBtnY + shopBtnH);
  sg.addColorStop(0, 'rgba(120,90,50,0.85)'); sg.addColorStop(1, 'rgba(70,50,28,0.85)');
  GF.rr(ctx, shopBtnX, shopBtnY, shopBtnW, shopBtnH, shopBtnH / 2);
  ctx.fillStyle = sg; ctx.fill();
  ctx.strokeStyle = 'rgba(200,160,90,0.5)'; ctx.lineWidth = Math.max(1.3*S,1); ctx.stroke();
  ctx.font = 'bold ' + GF.clamp(15 * S, 12, 20) + 'px sans-serif';
  ctx.fillStyle = '#ffd9a0'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(GF.t('shop'), cx, shopBtnY + shopBtnH / 2);
  ctx.textBaseline = 'top';
  _menuShopBtn = { x: shopBtnX, y: shopBtnY, w: shopBtnW, h: shopBtnH };
  if (bestDepth > 0) {
    var infoY = shopBtnY + shopBtnH + GF.clamp(6 * S, 4, 10);
    ctx.font = GF.clamp(12 * S, 10, 15) + 'px sans-serif';
    ctx.fillStyle = '#bda77f'; ctx.textAlign = 'center';
    ctx.fillText(GF.t('best') + ': ' + Math.floor(bestDepth) + 'm   $' + Math.floor(cash), cx, infoY);
  }
}

function drawTitleArt(ctx, cx, y) {
  var S = GF.S;
  var w = GF.clamp(150 * S, 110, 200);
  var h = GF.clamp(70 * S, 52, 92);
  var x = cx - w/2;
  var bands = ['#7a5536', '#6d6f76', '#3d6b6b', '#7a352a'];
  for (var i = 0; i < bands.length; i++) {
    ctx.fillStyle = bands[i];
    ctx.fillRect(x, y + i * (h/4), w, h/4);
  }
  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  ctx.fillRect(cx - w*0.08, y, w*0.16, h);
  ctx.fillStyle = '#c9ccd6';
  GF.rr(ctx, cx - w*0.06, y + h*0.2, w*0.12, h*0.3, 3*S); ctx.fill();
  ctx.fillStyle = '#ff5a2a';
  ctx.beginPath();
  ctx.moveTo(cx - w*0.06, y + h*0.5); ctx.lineTo(cx + w*0.06, y + h*0.5); ctx.lineTo(cx, y + h*0.72);
  ctx.closePath(); ctx.fill();
}

function drawShop(ctx) {
  drawScrim(ctx, 0.95);
  var S = GF.S, W = GF.W, H = GF.H, cx = W/2;
  ctx.font = 'bold ' + GF.clamp(26 * S, 19, 34) + 'px sans-serif';
  ctx.fillStyle = '#ffd9a0'; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  var hy = GF.clamp(14 * S, 10, 22);
  ctx.fillText(GF.t('shop'), cx, hy);
  ctx.font = 'bold ' + GF.clamp(18 * S, 14, 24) + 'px sans-serif';
  ctx.fillStyle = '#ffd34d';
  ctx.fillText('$ ' + Math.floor(cash), cx, hy + GF.clamp(30 * S, 22, 40));

  _upBtns = [];
  var topY = hy + GF.clamp(62 * S, 46, 82);
  var diveH = GF.clamp(60 * S, 48, 74);
  var areaBot = H - diveH - GF.clamp(40 * S, 28, 56);
  var n = UPGRADES.length;
  var gap = GF.clamp(8 * S, 5, 12);
  var cardH = Math.min(GF.clamp(78 * S, 56, 96), (areaBot - topY - (n-1)*gap) / n);
  var cardW = Math.min(W * 0.9, 440);
  var cardX = cx - cardW/2;
  for (var i = 0; i < n; i++) {
    var u = UPGRADES[i];
    var y = topY + i * (cardH + gap);
    var cost = upgradeCost(u.id);
    var maxed = lvl[u.id] >= u.max;
    var afford = isFinite(cost) && cash >= cost;
    GF.rr(ctx, cardX, y, cardW, cardH, 10 * S);
    ctx.fillStyle = afford ? 'rgba(70,52,32,0.92)' : 'rgba(45,38,30,0.9)';
    ctx.fill();
    ctx.lineWidth = Math.max(1.6*S,1.2);
    ctx.strokeStyle = afford ? 'rgba(255,200,120,0.7)' : 'rgba(120,100,75,0.45)';
    ctx.stroke();
    var ifs = GF.clamp(16 * S, 12, 21);
    ctx.textAlign = 'left'; ctx.textBaseline = 'top';
    ctx.font = 'bold ' + ifs + 'px sans-serif';
    ctx.fillStyle = '#ffe6b0';
    ctx.fillText(GF.t(u.nameKey), cardX + 12 * S, y + 8 * S);
    ctx.font = GF.clamp(11 * S, 9, 15) + 'px sans-serif';
    ctx.fillStyle = '#cdbfa6';
    ctx.fillText(GF.t('lvl') + ' ' + lvl[u.id] + '/' + u.max, cardX + 12 * S, y + 8 * S + ifs + 2 * S);
    ctx.font = GF.clamp(11 * S, 9, 14) + 'px sans-serif';
    ctx.fillStyle = '#a99a82';
    var dlines = wrapLines(ctx, GF.t(u.descKey), cardW * 0.56);
    ctx.fillText(dlines[0], cardX + 12 * S, y + cardH - GF.clamp(18*S,13,22));
    var pillW = GF.clamp(96 * S, 74, 130), pillH = cardH - 16 * S;
    var px = cardX + cardW - pillW - 10 * S, py = y + 8 * S;
    GF.rr(ctx, px, py, pillW, pillH, 8 * S);
    if (maxed) { ctx.fillStyle = 'rgba(90,80,60,0.8)'; }
    else { var pg = ctx.createLinearGradient(px,py,px,py+pillH); pg.addColorStop(0, afford?'#e0913a':'#5a4a32'); pg.addColorStop(1, afford?'#9a5212':'#3a3022'); ctx.fillStyle = pg; }
    ctx.fill();
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    if (maxed) {
      ctx.font = 'bold ' + GF.clamp(14*S,11,18) + 'px sans-serif';
      ctx.fillStyle = '#cdbfa6';
      ctx.fillText(GF.t('max'), px + pillW/2, py + pillH/2);
    } else {
      ctx.font = 'bold ' + GF.clamp(15*S,12,20) + 'px sans-serif';
      ctx.fillStyle = afford ? '#fff' : '#9a8a70';
      ctx.fillText('$' + cost, px + pillW/2, py + pillH/2);
    }
    ctx.textBaseline = 'top';
    _upBtns.push({ x: cardX, y: y, w: cardW, h: cardH, id: u.id, maxed: maxed });
  }

  _diveBtn = drawButton(ctx, GF.t('dive'), cx, H - diveH - GF.clamp(16*S,10,24), 'amber', 1.05);
  var bb = GF.clamp(34 * S, 30, 44);
  _shopBackBtn = { x: GF.clamp(12*S,8,18), y: hy, w: bb, h: bb };
  GF.rr(ctx, _shopBackBtn.x, _shopBackBtn.y, bb, bb, bb*0.26);
  ctx.fillStyle = 'rgba(60,45,30,0.85)'; ctx.fill();
  ctx.strokeStyle = 'rgba(230,200,150,0.4)'; ctx.lineWidth = Math.max(1.4*S,1.1); ctx.stroke();
  ctx.strokeStyle = '#ffe6b0'; ctx.lineWidth = Math.max(2.4*S,1.8);
  var c2x = _shopBackBtn.x + bb/2, c2y = _shopBackBtn.y + bb/2;
  ctx.beginPath(); ctx.moveTo(c2x + bb*0.12, c2y - bb*0.16); ctx.lineTo(c2x - bb*0.14, c2y); ctx.lineTo(c2x + bb*0.12, c2y + bb*0.16); ctx.stroke();
}

function drawResults(ctx) {
  drawScrim(ctx, 0.9);
  var S = GF.S, W = GF.W, H = GF.H, cx = W/2;
  ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  ctx.shadowColor = 'rgba(255,70,40,0.6)'; ctx.shadowBlur = 26 * S;
  ctx.font = 'bold ' + GF.clamp(34 * S, 23, 46) + 'px sans-serif';
  ctx.fillStyle = '#ff6a4c';
  ctx.fillText(GF.t('seized'), cx, H * 0.16);
  ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0;

  var y = H * 0.16 + GF.clamp(56 * S, 42, 72);
  ctx.font = 'bold ' + GF.clamp(20 * S, 15, 27) + 'px sans-serif';
  ctx.fillStyle = '#ffd9a0';
  ctx.fillText(GF.t('depth') + ': ' + Math.floor(depth) + 'm', cx, y);
  y += GF.clamp(34 * S, 26, 44);
  ctx.font = GF.clamp(16 * S, 12, 21) + 'px sans-serif';
  ctx.fillStyle = '#9fe8b5';
  ctx.fillText(GF.t('haul') + ': +$' + Math.floor(diveHaul) + '  (' + diveOreCount + ' ' + (isRu() ? 'руды' : 'ore') + ')', cx, y);
  y += GF.clamp(28 * S, 22, 38);
  ctx.fillStyle = '#ffd34d';
  ctx.fillText(GF.t('cash') + ': $' + Math.floor(cash), cx, y);
  y += GF.clamp(26 * S, 20, 34);
  ctx.fillStyle = '#bda77f'; ctx.font = GF.clamp(13 * S, 10, 17) + 'px sans-serif';
  ctx.fillText(GF.t('best') + ': ' + Math.floor(bestDepth) + 'm', cx, y);
  if (topRelic) {
    y += GF.clamp(24 * S, 18, 32);
    ctx.fillStyle = '#ffd34d'; ctx.font = 'bold ' + GF.clamp(15*S,12,20) + 'px sans-serif';
    ctx.fillText('* ' + (isRu() ? 'РЕЛИКВИЯ ДОБЫТА!' : 'RELIC RECOVERED!') + ' *', cx, y);
  }

  _contBtn = drawButton(ctx, GF.t('dive'), cx, H * 0.62, 'amber', 1.15);
  var upBtnH = GF.clamp(44 * S, 34, 54);
  var upBtnW = GF.clamp(200 * S, 130, 240), upBtnX = cx - upBtnW / 2;
  var upBtnY = H * 0.62 + _contBtn.h + GF.clamp(8 * S, 6, 12);
  var ug = ctx.createLinearGradient(upBtnX, upBtnY, upBtnX, upBtnY + upBtnH);
  ug.addColorStop(0, 'rgba(110,82,44,0.9)'); ug.addColorStop(1, 'rgba(62,44,22,0.9)');
  GF.rr(ctx, upBtnX, upBtnY, upBtnW, upBtnH, upBtnH / 2);
  ctx.fillStyle = ug; ctx.fill();
  ctx.strokeStyle = 'rgba(200,160,90,0.5)'; ctx.lineWidth = Math.max(1.3*S,1); ctx.stroke();
  ctx.font = 'bold ' + GF.clamp(14 * S, 11, 18) + 'px sans-serif';
  ctx.fillStyle = '#ffd9a0'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(GF.t('shop'), cx, upBtnY + upBtnH / 2);
  ctx.textBaseline = 'top';
  _goShopBtn = { x: upBtnX, y: upBtnY, w: upBtnW, h: upBtnH };
}

// ── INPUT ──────────────────────────────────────────────────────────────────
function hit(b, x, y) { return b && x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h; }

var testInputNoise = 0;
var platformBreakAdBusy = false;
function withPlatformInterstitial(next) {
  if (platformBreakAdBusy) return;
  if (!window.__GF_AUTOSTART) { next(); return; }
  platformBreakAdBusy = true;
  function done() {
    if (!platformBreakAdBusy) return;
    platformBreakAdBusy = false;
    next();
  }
  try {
    if (window.GF && GF.ads && typeof GF.ads.interstitial === 'function') {
      var p = GF.ads.interstitial({});
      if (p && typeof p.then === 'function') p.then(done, done);
      else done();
      return;
    }
    if (window.GF && typeof GF.showAd === 'function') {
      var q = GF.showAd('midgame');
      if (q && typeof q.then === 'function') q.then(done, done);
      else done();
      return;
    }
  } catch (e) {}
  done();
}
window.__gfAdTest = window.__gfAdTest || {};
window.__gfAdTest.rewardedNoFill = function () {
  return Promise.resolve({ verdict: 'PASS', detail: 'no rewarded ad path in Deep Vein' });
};
window.__gfAdTest.fullscreenNoFill = function () {
  return new Promise(function (resolve) {
    var settled = false;
    function finish(res) { if (!settled) { settled = true; resolve(res); } }
    withPlatformInterstitial(function () {
      finish({ verdict: 'PASS', detail: 'interstitial no-fill settled without freezing Deep Vein' });
    });
    setTimeout(function () {
      finish({ verdict: 'FAIL', detail: 'interstitial no-fill did not settle within 6.5s' });
    }, 6500);
  });
};

function pressDown(x, y) {
  if (gs === 'PLAYING') testInputNoise++;
  if (GF.tutorial.active) { if (GF.tutorial.handleClick(x, y)) return; }
  if (gs === 'MENU') { if (hit(_playBtn, x, y)) { withPlatformInterstitial(startDive); return; } if (hit(_menuShopBtn, x, y)) { toShop(); return; } return; }
  if (gs === 'SHOP') {
    if (hit(_shopBackBtn, x, y)) { toMenu(); return; }
    if (hit(_diveBtn, x, y)) { withPlatformInterstitial(startDive); return; }
    for (var i = 0; i < _upBtns.length; i++) {
      if (hit(_upBtns[i], x, y) && !_upBtns[i].maxed) { buyUpgrade(_upBtns[i].id); return; }
    }
    return;
  }
  if (gs === 'GAMEOVER') {
    if (hit(_contBtn, x, y)) { withPlatformInterstitial(startDive); return; }
    if (hit(_goShopBtn, x, y)) { toShop(); return; }
    return;
  }
  if (gs === 'PLAYING') {
    if (hit(_helpBtn, x, y)) { GF.tutorial.reopen(); return; }
    if (_muteBtn && hit(_muteBtn, x, y)) { GF.toggleMute(); GF.setMusicMuted(GF.muted); return; }
    drilling = true;
    holdEver = true;
  }
}
function pressUp() { if (gs === 'PLAYING') drilling = false; }

function canvasXY(clientX, clientY) {
  var rect = GF.canvas.getBoundingClientRect();
  var sx = GF.canvas.width / rect.width;
  var sy = GF.canvas.height / rect.height;
  return { x: (clientX - rect.left) * sx, y: (clientY - rect.top) * sy };
}
GF.canvas.addEventListener('pointerdown', function(e) {
  var p = canvasXY(e.clientX, e.clientY); pressDown(p.x, p.y);
});
GF.canvas.addEventListener('pointerup', function() { pressUp(); });
GF.canvas.addEventListener('pointercancel', function() { pressUp(); });
GF.canvas.addEventListener('pointerleave', function() { pressUp(); });
window.addEventListener('blur', function() { pressUp(); });
// Touch fallbacks (some mobile browsers don't deliver pointer events under the
// gf-lib touch listeners that preventDefault).
GF.canvas.addEventListener('touchstart', function(e) {
  if (e.changedTouches && e.changedTouches.length) {
    var t = e.changedTouches[0]; var p = canvasXY(t.clientX, t.clientY); pressDown(p.x, p.y);
  }
}, { passive: false });
GF.canvas.addEventListener('touchend', function() { pressUp(); }, { passive: false });
GF.canvas.addEventListener('touchcancel', function() { pressUp(); }, { passive: false });

document.addEventListener('keydown', function(e) {
  if (gs === 'PLAYING' && (e.code === 'Space' || e.code === 'ArrowDown')) { drilling = true; holdEver = true; }
});
document.addEventListener('keyup', function(e) {
  if (e.code === 'Space' || e.code === 'ArrowDown') drilling = false;
});

// ── STATE EXPOSURE (runtime gate cross-checks DESIGN.md) ───────────────────
GF.exposeState(function() {
  return {
    gs: gs,
    noise: testInputNoise,
    depth: Math.floor(depth),
    bestDepth: Math.floor(bestDepth),
    cash: Math.floor(cash),
    heat: Math.round(heat),
    drilling: drilling,
    diveHaul: Math.floor(diveHaul),
    diveOreCount: diveOreCount,
    stratum: stratumIndexForDepth(depth),
    upDrill: lvl.drill, upCool: lvl.cool, upAuto: lvl.auto, upCargo: lvl.cargo, upCharge: lvl.charge,
    HEAT_MAX: HEAT_MAX,
    HEAT_RISE_PER_TICK: HEAT_RISE_PER_TICK,
    COOL_RATE: COOL_RATE,
    DRILL_POWER: DRILL_POWER,
    GAS_HEAT_SPIKE: GAS_HEAT_SPIKE,
    LAVA_HEAT_PER_TICK: LAVA_HEAT_PER_TICK,
    AUTO_DRILL_RATE: AUTO_DRILL_RATE,
    CARGO_MULT: CARGO_MULT,
    COST_SCALE: COST_SCALE,
    STRATUM_DEPTHS: STRATUM_DEPTHS,
    ORE_VALUES: ORE_VALUES,
  };
});

function _reachItem(items, id, b) {
  if (b) items.push({ id: id, x: b.x, y: b.y, w: b.w, h: b.h, pinned: true });
}
GF.exposeReach(function() {
  var items = [];
  if (gs === 'MENU') { _reachItem(items, 'play', _playBtn); _reachItem(items, 'shop', _menuShopBtn); }
  else if (gs === 'SHOP') { _reachItem(items, 'back', _shopBackBtn); _reachItem(items, 'dive', _diveBtn); }
  else if (gs === 'GAMEOVER') { _reachItem(items, 'continue', _contBtn); _reachItem(items, 'shop', _goShopBtn); }
  else if (gs === 'PLAYING') { _reachItem(items, 'help', _helpBtn); _reachItem(items, 'mute', _muteBtn); }
  return { screen: gs, items: items, viewportH: GF.H, screenH: GF.H };
});
GF.exposeTour([
  { name: 'menu', go: function() { gs = 'MENU'; } },
  { name: 'shop', go: function() { toShop(); } },
  { name: 'gameover', go: function() { gs = 'GAMEOVER'; } },
  { name: 'playing', go: function() { if (gs !== 'PLAYING') startDive(); } },
]);

window._setState = function(s) { gs = s; };
window._getI18N = function() { return STRINGS; };
window._getFontBody = function() { return 'sans-serif'; };

// ── BOOT ────────────────────────────────────────────────────────────────────
GF.init({
  designW: 540,
  designH: 960,
  strings: STRINGS,
  sprites: SPRITE_NAMES,
  saveKey: 'deep_vein',
  onReady: function() {
    try { cash = parseFloat(localStorage.getItem('deep_vein_cash') || '0') || 0; } catch (e) {}
    try { bestDepth = parseFloat(localStorage.getItem('deep_vein_best') || '0') || 0; } catch (e) {}
    try {
      var L = JSON.parse(localStorage.getItem('deep_vein_lvl') || 'null');
      if (L) { lvl.drill=L.drill||0; lvl.cool=L.cool||0; lvl.auto=L.auto||0; lvl.cargo=L.cargo||0; lvl.charge=L.charge||0; }
    } catch (e) {}
    recompute();

    GF.persist('deep_vein_run_v1',
      function() {
        return { gs: (gs === 'PLAYING' ? 'SHOP' : gs), cash: cash, bestDepth: bestDepth, lvl: lvl };
      },
      function(s) {
        if (!s) return;
        cash = (typeof s.cash === 'number') ? s.cash : cash;
        bestDepth = (typeof s.bestDepth === 'number') ? s.bestDepth : bestDepth;
        if (s.lvl) { lvl.drill=s.lvl.drill||0; lvl.cool=s.lvl.cool||0; lvl.auto=s.lvl.auto||0; lvl.cargo=s.lvl.cargo||0; lvl.charge=s.lvl.charge||0; }
        recompute();
        // never resume mid-dive — bounce to MENU so the player can see tutorial/info
        gs = 'MENU';
      }
    );

    GF.bgMusic({ file: 'audio/bg_loop.mp3', preset: 'synth' });

    if (window.__GF_AUTOSTART && !window._silent) {
      try { localStorage.setItem('deep_vein_seen_tutorial', '1'); } catch (e) {}
      startDive();
    } else {
      GF.tutorial.start([
        { text: GF.t('tut_goal') + ' ' + GF.t('tut_controls'), advance: 'click_any' },
        { text: GF.t('tut_win') + ' ' + GF.t('tut_lose'), advance: 'click_any' },
        { text: GF.t('tut_tip'), advance: 'click_any' },
      ], { storageKey: 'deep_vein_seen_tutorial' });
    }
  },
  onUpdate: update,
  onDraw: draw,
});

})();
</script>
