<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Dummy Crash Lab</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #17212b;
        --panel: rgba(249, 250, 252, 0.92);
        --line: rgba(23, 33, 43, 0.18);
        --accent: #e94f37;
        --cool: #137c8b;
        --gold: #f7b32b;
        --lime: #4a9f4f;
        --violet: #6653b6;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #dde4eb;
        color: var(--ink);
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
      }

      button {
        min-width: 44px;
        min-height: 44px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #ffffff;
        color: var(--ink);
        font: inherit;
        font-weight: 800;
        cursor: pointer;
        box-shadow: 0 2px 0 rgba(23, 33, 43, 0.08);
      }

      button:focus-visible {
        outline: 3px solid rgba(19, 124, 139, 0.45);
        outline-offset: 2px;
      }

      button:disabled {
        cursor: default;
        opacity: 0.48;
      }

      #gameShell {
        position: relative;
        width: 100vw;
        height: 100dvh;
        min-height: 520px;
        content-visibility: auto;
        contain-intrinsic-size: auto 720px;
      }

      #gameCanvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
        background: #dde4eb;
      }

      .hud {
        position: absolute;
        z-index: 4;
        pointer-events: none;
      }

      .hud > * {
        pointer-events: auto;
      }

      #topHud {
        top: 12px;
        left: 12px;
        right: 12px;
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto auto;
        gap: 8px;
        align-items: start;
      }

      .statusPanel,
      .actionPanel,
      .toolPanel,
      .upgradePanel {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        box-shadow: 0 10px 28px rgba(23, 33, 43, 0.12);
        backdrop-filter: blur(10px);
      }

      .statusPanel {
        display: grid;
        gap: 4px;
        padding: 10px 12px;
      }

      .titleRow {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: baseline;
      }

      .gameTitle {
        font-size: clamp(18px, 2vw, 28px);
        font-weight: 950;
        line-height: 1;
        letter-spacing: 0;
      }

      .levelLabel {
        color: #5c6671;
        font-size: 12px;
        font-weight: 850;
        text-transform: uppercase;
      }

      #contractText {
        max-width: 680px;
        color: #34404b;
        font-size: 13px;
        font-weight: 720;
        line-height: 1.25;
      }

      .meters {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }

      .pill {
        display: inline-flex;
        align-items: center;
        min-height: 28px;
        padding: 4px 9px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.76);
        border: 1px solid rgba(23, 33, 43, 0.12);
        color: #26313d;
        font-size: 12px;
        font-variant-numeric: tabular-nums;
        font-weight: 850;
      }

      .actionPanel {
        display: flex;
        gap: 6px;
        padding: 8px;
      }

      .primary {
        background: var(--accent);
        border-color: rgba(120, 35, 22, 0.28);
        color: #fff;
      }

      #bottomHud {
        left: 12px;
        right: 12px;
        bottom: 12px;
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 8px;
        align-items: end;
      }

      .toolPanel {
        display: grid;
        grid-template-columns: repeat(5, minmax(72px, 1fr));
        gap: 8px;
        padding: 8px;
      }

      .toolBtn {
        display: grid;
        grid-template-rows: auto auto;
        gap: 2px;
        padding: 7px 6px;
        line-height: 1;
      }

      .toolBtn .icon {
        font-size: 18px;
      }

      .toolBtn .label {
        font-size: 11px;
        font-weight: 900;
      }

      .toolBtn .count {
        color: #5c6671;
        font-size: 10px;
        font-weight: 800;
      }

      .toolBtn[data-selected="true"] {
        border-color: rgba(19, 124, 139, 0.72);
        background: #dff3f5;
        box-shadow:
          0 0 0 2px rgba(19, 124, 139, 0.14),
          0 2px 0 rgba(23, 33, 43, 0.08);
      }

      .upgradePanel {
        display: grid;
        grid-template-columns: repeat(3, 72px);
        gap: 6px;
        padding: 8px;
      }

      .upgradePanel button {
        padding: 6px 4px;
        font-size: 11px;
        line-height: 1.05;
      }

      .srOnly {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      @media (max-width: 760px) {
        #gameShell {
          min-height: 100dvh;
        }

        #topHud {
          grid-template-columns: 1fr;
          gap: 6px;
        }

        .statusPanel {
          padding: 8px;
        }

        .gameTitle {
          font-size: 19px;
        }

        #contractText {
          font-size: 12px;
        }

        .actionPanel {
          justify-self: stretch;
        }

        .actionPanel button {
          flex: 1 1 0;
          padding-inline: 6px;
          font-size: 12px;
        }

        #bottomHud {
          grid-template-columns: 1fr;
        }

        .toolPanel {
          grid-template-columns: repeat(5, minmax(56px, 1fr));
          gap: 6px;
        }

        .toolBtn {
          min-width: 0;
          padding-inline: 3px;
        }

        .toolBtn .label {
          font-size: 10px;
        }

        .upgradePanel {
          grid-template-columns: repeat(3, 1fr);
        }
      }
    </style>
  </head>
  <body>
    <main id="gameShell" aria-label="Dummy Crash Lab game">
      <canvas id="gameCanvas"></canvas>
      <section id="topHud" class="hud" aria-label="Game controls and status">
        <div class="statusPanel">
          <div class="titleRow">
            <div class="gameTitle">Dummy Crash Lab</div>
            <div id="levelLabel" class="levelLabel">Level 1</div>
          </div>
          <div id="contractText">Build a trap chain, then launch the crash dummy.</div>
          <div class="meters">
            <span id="scorePill" class="pill">Score 0</span>
            <span id="comboPill" class="pill">Combo x1.0</span>
            <span id="tokenPill" class="pill">Coins 0</span>
            <span id="goalPill" class="pill">Targets 0/0</span>
          </div>
        </div>
        <div class="actionPanel">
          <button id="releaseBtn" class="primary" type="button" title="Launch the crash dummy">Launch</button>
          <button id="resetBtn" type="button" title="Reset the level">Reset</button>
          <button id="nextBtn" type="button" title="Next contract">Next</button>
        </div>
      </section>
      <section id="bottomHud" class="hud" aria-label="Build tools and upgrades">
        <div id="toolPanel" class="toolPanel" aria-label="Gadget tools"></div>
        <div class="upgradePanel" aria-label="Lab upgrades">
          <button id="massUpgrade" type="button" title="Upgrade dummy weight">Dummy<br />3</button>
          <button id="pulseUpgrade" type="button" title="Upgrade bomb blast radius">Bomb<br />3</button>
          <button id="springUpgrade" type="button" title="Upgrade spring force">Spring<br />3</button>
        </div>
      </section>
      <div id="accessibleState" class="srOnly" aria-live="polite"></div>
    </main>
    <script src="./game.js"></script>
  <script>
/* Suno bg music loop (audio-overhaul): self-contained WebAudio player.
   Arms on first gesture; polls `muted`/GF.muted so existing mute toggles
   silence it; suspends on tab-hide (Yandex 1.3). */
(function(){var st=0,g=null;function m(){try{if(typeof muted!=="undefined")return !!muted;if(window.GF&&"muted" in GF)return !!GF.muted;}catch(e){}return false;}function go(){if(st)return;st=1;try{var C=window.AudioContext||window.webkitAudioContext;var x=new C();fetch("audio/bg_loop.mp3").then(function(r){return r.arrayBuffer()}).then(function(b){return x.decodeAudioData(b)}).then(function(buf){g=x.createGain();g.gain.value=m()?0:0.4;g.connect(x.destination);var s=x.createBufferSource();s.buffer=buf;s.loop=true;s.connect(g);s.start();setInterval(function(){try{g.gain.value=m()?0:0.4;}catch(e){}},300);document.addEventListener("visibilitychange",function(){try{document.hidden?x.suspend():(!m()&&x.resume());}catch(e){}});});}catch(e){}}
["pointerdown","keydown","touchstart"].forEach(function(ev){document.addEventListener(ev,go,true)});})();
</script>
</body>
</html>
