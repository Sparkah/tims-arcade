function seededRandom() {
  rngSeed = (rngSeed * 1664525 + 1013904223) >>> 0;
  return rngSeed / 4294967296;
}

function clamp(v, lo, hi) { return v < lo ? lo : v > hi ? hi : v; }
function lerp(a, b, t) { return a + (b - a) * t; }

function layout() {
  var minSide = Math.max(1, Math.min(GF.W, GF.H));
  var raw = Math.min(GF.W / 440, GF.H / 760);
  var ui = clamp(raw, 0.72, 1.22);
  if (minSide < 420) ui = Math.max(ui, 0.82);
  var top = Math.round(clamp(86 * ui, 66, 110));
  var bottom = Math.round(clamp(106 * ui, 78, 124));
  if (GF.W < 520) top = Math.round(clamp(128 * ui, 102, 122));
  scene.x = 0;
  scene.y = top;
  scene.w = GF.W;
  scene.h = Math.max(160, GF.H - top - bottom);
  scene.ui = ui;
  scene.top = top;
  scene.bottom = bottom;
  uiRects.help = { x: GF.W - 44 * ui, y: 9 * ui, w: 32 * ui, h: 32 * ui };
  uiRects.mute = { x: GF.W - 82 * ui, y: 9 * ui, w: 32 * ui, h: 32 * ui };
  uiRects.retry = { x: GF.cx - 76 * ui, y: GF.cy + 92 * ui, w: 152 * ui, h: 44 * ui };
  uiRects.helpClose = { x: GF.cx - 70 * ui, y: GF.cy + 150 * ui, w: 140 * ui, h: 38 * ui };
}

function fs(base) {
  var boost = Math.min(GF.W, GF.H) < 430 ? 1.08 : 1;
  return Math.max(10, Math.round(base * scene.ui * boost));
}

function worldToScreen(x, y) {
  return { x: scene.x + x * scene.w, y: scene.y + y * scene.h };
}

function screenToWorld(x, y) {
  return { x: clamp((x - scene.x) / Math.max(1, scene.w), 0, 1), y: clamp((y - scene.y) / Math.max(1, scene.h), 0, 1) };
}

function worldDist(a, b) {
  var dx = (a.x - b.x) * scene.w;
  var dy = (a.y - b.y) * scene.h;
  return Math.sqrt(dx * dx + dy * dy);
}

function ptrPos(e) {
  var r = GF.canvas.getBoundingClientRect();
  var sx = GF.W / Math.max(1, r.width);
  var sy = GF.H / Math.max(1, r.height);
  return { x: (e.clientX - r.left) * sx, y: (e.clientY - r.top) * sy };
}

function hitRect(p, r) {
  return r && p.x >= r.x && p.x <= r.x + r.w && p.y >= r.y && p.y <= r.y + r.h;
}

function sfx(name, gapMs) {
  var now = Date.now();
  var gap = gapMs || 90;
  if (lastSfx[name] && now - lastSfx[name] < gap) return;
  lastSfx[name] = now;
  GF.sfx(name);
}

function saveMeta() {
  GF.saveRun();
}

function getMeta() {
  return {
    best: best,
    bestSector: bestSector,
    speciesSeen: speciesSeen,
    tutorialDone: tutorialDone
  };
}

function applyMeta(s) {
  if (!s || typeof s !== 'object') return;
  best = Math.max(0, Number(s.best) || 0);
  bestSector = Math.max(1, Number(s.bestSector) || 1);
  speciesSeen = s.speciesSeen && typeof s.speciesSeen === 'object' ? s.speciesSeen : {};
  tutorialDone = !!s.tutorialDone;
}

function typeName(type) {
  return GF.t(TYPES[type] ? TYPES[type].key : 'species_none');
}

function shortTypeName(type) {
  return GF.t(TYPES[type] ? 'short_' + type : 'species_none');
}

function availableTypes(n) {
  var out = ['frond', 'grazer', 'polyp'];
  if (n >= 3) out.push('burrow');
  return out;
}

function targetsForSector(n) {
  if (n <= 1) return { frond: 2, grazer: 1, polyp: 1 };
  if (n === 2) return { frond: 1, grazer: 1, polyp: 2 };
  if (n === 3) return { frond: 1, grazer: 1, polyp: 1, burrow: 2 };
  if (n === 4) return { frond: 1, grazer: 2, polyp: 1, burrow: 2 };
  if (n === 5) return { frond: 2, grazer: 2, polyp: 2, burrow: 2 };
  return { frond: 2, grazer: 2, polyp: 2, burrow: 3 };
}

function targetLeft(type) {
  return Math.max(0, (targetCounts[type] || 0) - (journalProgress[type] || 0));
}

function targetSummary() {
  var parts = [];
  var keys = ['frond', 'grazer', 'polyp', 'burrow'];
  for (var i = 0; i < keys.length; i++) {
    var k = keys[i];
    if (!targetCounts[k]) continue;
    parts.push(typeName(k) + ' ' + String(journalProgress[k] || 0) + '/' + String(targetCounts[k]));
  }
  return parts.join('  ');
}

function nextTargetCompact() {
  var keys = ['frond', 'grazer', 'polyp', 'burrow'];
  for (var i = 0; i < keys.length; i++) {
    var k = keys[i];
    if (targetLeft(k) <= 0) continue;
    return shortTypeName(k) + ' ' + String(journalProgress[k] || 0) + '/' + String(targetCounts[k]);
  }
  return GF.t('return_lander');
}

function journalText() {
  var names = [];
  var keys = ['frond', 'grazer', 'polyp', 'burrow'];
  for (var i = 0; i < keys.length; i++) if (speciesSeen[keys[i]]) names.push(typeName(keys[i]));
  return names.length ? names.join(', ') : GF.t('species_none');
}

function resetFlags() {
  movementFlag = false;
  scanFlag = false;
  returnFlag = false;
  balanceFlag = false;
}

function startGame(opts) {
  opts = opts || {};
  score = 0;
  sector = 1;
  disturbance = 0;
  player.x = 0.20;
  player.y = 0.50;
  player.vx = 0;
  player.vy = 0;
  player.face = 0;
  moveTarget = null;
  cards = [];
  pulses = [];
  helpOpen = false;
  screenshotMode = false;
  gameOverReason = 'reason_oxygen';
  runTime = 0;
  rngSeed = 237 + Math.floor(Date.now() % 1009);
  resetFlags();
  try {
    tutorialDone = opts.suppressTutorial ? true : (localStorage.getItem('exo_naturalists_tutorial_v1') === '1' || tutorialDone);
  } catch (e) {
    tutorialDone = !!opts.suppressTutorial || tutorialDone;
  }
  coachStep = tutorialDone ? 99 : 0;
  startSector(1, true);
  gs = 'PLAYING';
  GF.gameStarted();
  saveMeta();
}

function startSector(n, freshRun) {
  sector = clamp(Math.floor(n), 1, MAX_SECTORS);
  oxygen = Math.min(START_OXYGEN + 18, START_OXYGEN + Math.max(0, sector - 1) * 3);
  energy = Math.min(START_ENERGY + 18, START_ENERGY + Math.max(0, sector - 1) * 2);
  if (freshRun) disturbance = 0;
  else disturbance = Math.max(0, disturbance - 22);
  targetCounts = targetsForSector(sector);
  journalProgress = {};
  journalTarget = 0;
  var keys = Object.keys(targetCounts);
  for (var i = 0; i < keys.length; i++) {
    journalProgress[keys[i]] = 0;
    journalTarget += targetCounts[keys[i]];
  }
  journalDone = 0;
  organisms = [];
  spores = [];
  pulses = [];
  spawnSectorOrganisms();
  tutorialSafeUntil = tutorialDone ? 0 : 10;
  bestSector = Math.max(bestSector, sector);
  if (bestSector > 1) saveMeta();
}

function spawnSectorOrganisms() {
  var types = availableTypes(sector);
  for (var i = 0; i < types.length; i++) {
    var type = types[i];
    var count = Math.max(1, targetCounts[type] || 0) + (sector >= 5 ? 1 : 0);
    for (var n = 0; n < count; n++) {
      var baseX = 0.30 + seededRandom() * 0.60;
      var baseY = 0.18 + seededRandom() * 0.62;
      if (i === 0 && n === 0) { baseX = 0.42; baseY = 0.48; }
      organisms.push(makeOrganism(type, baseX, baseY));
    }
  }
  if (sector >= 4) {
    var sporeCount = sector >= 6 ? 5 : 3;
    for (var s = 0; s < sporeCount; s++) {
      spores.push({
        x: 0.26 + seededRandom() * 0.66,
        y: 0.18 + seededRandom() * 0.70,
        vx: (seededRandom() - 0.5) * 0.028,
        vy: (seededRandom() - 0.5) * 0.026,
        phase: seededRandom() * Math.PI * 2,
        cd: 0
      });
    }
  }
}

function makeOrganism(type, x, y) {
  var angle = seededRandom() * Math.PI * 2;
  var speed = type === 'grazer' ? 0.038 : type === 'polyp' ? 0.024 : type === 'burrow' ? 0.010 : 0.006;
  return {
    type: type,
    x: clamp(x, 0.08, 0.94),
    y: clamp(y, 0.12, 0.88),
    vx: Math.cos(angle) * speed,
    vy: Math.sin(angle) * speed,
    phase: seededRandom() * Math.PI * 2,
    scanGlow: 0,
    disturbCd: 0,
    visible: true
  };
}

function addCard(type, label, pts, good) {
  cards.unshift({ type: type, label: label, pts: pts || 0, good: !!good, age: 0 });
  if (cards.length > 5) cards.length = 5;
}

function addDisturbance(amount, x, y) {
  disturbance = clamp(disturbance + amount, 0, MAX_DISTURBANCE);
  balanceFlag = true;
  if (x != null && y != null) {
    var p = worldToScreen(x, y);
    GF.spawnFloat(p.x, p.y - 8 * scene.ui, '+' + String(Math.round(amount)), '#ffb39a');
    GF.spawnParticles(p.x, p.y, '#ff8f70', 12);
  }
  sfx('hit', 180);
  if (disturbance >= MAX_DISTURBANCE && journalDone < journalTarget) gameOver('reason_disturb');
}

function updateCards(dt) {
  for (var i = cards.length - 1; i >= 0; i--) {
    cards[i].age += dt;
    if (cards[i].age > 8 && cards.length > 3) cards.splice(i, 1);
  }
  for (var j = pulses.length - 1; j >= 0; j--) {
    pulses[j].life -= dt;
    if (pulses[j].life <= 0) pulses.splice(j, 1);
  }
}

function updateCoach(dt) {
  if (tutorialDone || screenshotMode) return;
  coachPulse += dt;
  if (coachStep === 0 && movementFlag) coachStep = 1;
  if (coachStep === 1 && scanFlag && journalDone > 0) coachStep = 2;
  if (coachStep === 2 && returnFlag) coachStep = 3;
  if (coachStep === 3 && (balanceFlag || sector >= 2 || runTime > 34)) {
    tutorialDone = true;
    coachStep = 99;
    try { localStorage.setItem('exo_naturalists_tutorial_v1', '1'); } catch (e) {}
    saveMeta();
  }
}

function updateResources(dt) {
  if (gs !== 'PLAYING') return;
  if (runTime < tutorialSafeUntil && !tutorialDone) return;
  var drain = OXYGEN_DRAIN * (0.56 + sector * 0.035);
  oxygen = Math.max(0, oxygen - drain * dt);
  if (oxygen <= 0 && journalDone < journalTarget) gameOver('reason_oxygen');
  if (energy <= 0 && journalDone < journalTarget) gameOver('reason_energy');
}

function updateMovement(dt) {
  var ax = 0;
  var ay = 0;
  if (GF.keys.ArrowLeft || GF.keys.KeyA) ax -= 1;
  if (GF.keys.ArrowRight || GF.keys.KeyD) ax += 1;
  if (GF.keys.ArrowUp || GF.keys.KeyW) ay -= 1;
  if (GF.keys.ArrowDown || GF.keys.KeyS) ay += 1;
  if (pointer && pointer.active && moveTarget) {
    var dxp = (moveTarget.x - player.x) * scene.w;
    var dyp = (moveTarget.y - player.y) * scene.h;
    var dp = Math.sqrt(dxp * dxp + dyp * dyp);
    if (dp > 6) {
      ax += dxp / Math.max(1, dp);
      ay += dyp / Math.max(1, dp);
    }
  }
  var len = Math.sqrt(ax * ax + ay * ay);
  if (len > 0) {
    ax /= len;
    ay /= len;
    player.face = Math.atan2(ay, ax);
    movementFlag = true;
  }
  var scaleX = MOVE_SPEED / Math.max(1, scene.w);
  var scaleY = MOVE_SPEED / Math.max(1, scene.h);
  player.vx = (player.vx + ax * scaleX * 7.2 * dt) * Math.pow(0.002, dt);
  player.vy = (player.vy + ay * scaleY * 7.2 * dt) * Math.pow(0.002, dt);
  player.x = clamp(player.x + player.vx * dt, 0.04, 0.96);
  player.y = clamp(player.y + player.vy * dt, 0.08, 0.94);
}

function updateOrganisms(dt) {
  for (var i = 0; i < organisms.length; i++) {
    var o = organisms[i];
    o.scanGlow = Math.max(0, o.scanGlow - dt * 2.6);
    o.disturbCd = Math.max(0, o.disturbCd - dt);
    if (o.type === 'burrow') {
      o.visible = Math.sin(runTime * 1.35 + o.phase) > -0.18;
      if (!o.visible) continue;
    } else {
      o.visible = true;
    }
    if (o.type === 'grazer') {
      var d = worldDist(player, o);
      if (d < 82 * scene.ui) {
        var awayX = o.x - player.x;
        var awayY = o.y - player.y;
        var al = Math.sqrt(awayX * awayX + awayY * awayY) || 1;
        o.vx += awayX / al * dt * 0.030;
        o.vy += awayY / al * dt * 0.030;
        if (d < (PLAYER_RADIUS + ORGANISM_RADIUS_LARGE + 6) * scene.ui && o.disturbCd <= 0) {
          addDisturbance(10 + sector, o.x, o.y);
          o.disturbCd = 1.2;
        }
      }
    }
    if (o.type === 'polyp') {
      o.vx += Math.sin(runTime * 1.8 + o.phase) * dt * 0.006;
      o.vy += Math.cos(runTime * 1.4 + o.phase) * dt * 0.005;
    }
    if (o.type === 'frond') {
      o.vx += Math.sin(runTime * 0.9 + o.phase) * dt * 0.002;
      o.vy += Math.cos(runTime * 0.7 + o.phase) * dt * 0.002;
    }
    o.vx *= Math.pow(0.70, dt);
    o.vy *= Math.pow(0.70, dt);
    o.x += o.vx * dt;
    o.y += o.vy * dt;
    if (o.x < 0.08 || o.x > 0.94) o.vx *= -1;
    if (o.y < 0.12 || o.y > 0.88) o.vy *= -1;
    o.x = clamp(o.x, 0.08, 0.94);
    o.y = clamp(o.y, 0.12, 0.88);
  }
}

function updateSpores(dt) {
  for (var i = 0; i < spores.length; i++) {
    var s = spores[i];
    s.cd = Math.max(0, s.cd - dt);
    s.x += s.vx * dt + Math.sin(runTime * 1.7 + s.phase) * dt * 0.004;
    s.y += s.vy * dt + Math.cos(runTime * 1.2 + s.phase) * dt * 0.004;
    if (s.x < 0.08 || s.x > 0.94) s.vx *= -1;
    if (s.y < 0.12 || s.y > 0.88) s.vy *= -1;
    s.x = clamp(s.x, 0.08, 0.94);
    s.y = clamp(s.y, 0.12, 0.88);
    if (s.cd <= 0 && worldDist(player, s) < (PLAYER_RADIUS + SPORE_RADIUS + 5) * scene.ui) {
      s.cd = 1.4;
      addDisturbance(12 + sector, s.x, s.y);
      energy = Math.max(0, energy - 3);
      GF.setShake(0.18);
    }
  }
}

function checkSectorComplete() {
  if (gs !== 'PLAYING' || journalDone < journalTarget) return;
  if (worldDist(player, lander) <= (LANDER_RADIUS + PLAYER_RADIUS + 6) * scene.ui) {
    returnFlag = true;
    completeSector();
  }
}

function completeSector() {
  if (gs !== 'PLAYING') return;
  score += 180 + sector * 55 + Math.round(oxygen + energy) + Math.max(0, 100 - Math.round(disturbance));
  best = Math.max(best, score);
  bestSector = Math.max(bestSector, sector);
  sfx('levelup', 260);
  GF.setShake(0.28);
  var lp = worldToScreen(lander.x, lander.y);
  GF.spawnParticles(lp.x, lp.y, '#e5f18f', 34);
  GF.spawnFloat(lp.x, lp.y - 24 * scene.ui, GF.t('new_sector'), '#edf59b');
  if (sector >= MAX_SECTORS) {
    winGame();
    saveMeta();
    return;
  }
  startSector(sector + 1, false);
  saveMeta();
}

function gameOver(reasonKey) {
  if (gs === 'GAMEOVER' || gs === 'WON') return;
  gameOverReason = reasonKey || 'reason_oxygen';
  best = Math.max(best, score);
  bestSector = Math.max(bestSector, sector);
  gs = 'GAMEOVER';
  helpOpen = false;
  sfx('lose', 500);
  GF.setShake(0.52);
  GF.gameEnded();
  saveMeta();
  GF.ads.interstitial();
}

function winGame() {
  if (gs === 'WON') return;
  gs = 'WON';
  helpOpen = false;
  sfx('win', 500);
  GF.happytime();
  GF.gameEnded();
}

function currentScanTarget() {
  var bestO = null;
  var bestD = Infinity;
  var bestRank = Infinity;
  for (var i = 0; i < organisms.length; i++) {
    var o = organisms[i];
    if (!o.visible) continue;
    var d = worldDist(player, o);
    var rank = d + (targetLeft(o.type) > 0 ? 0 : 10000);
    if (d <= SCAN_RADIUS * scene.ui && rank < bestRank) {
      bestD = d;
      bestRank = rank;
      bestO = o;
    }
  }
  return { organism: bestO, dist: bestD };
}

function scanQuality(d) {
  var norm = clamp(d / Math.max(1, SCAN_RADIUS * scene.ui), 0, 1);
  return clamp(1 - Math.abs(norm - 0.58) * 1.32, 0, 1);
}

function scan() {
  if (gs !== 'PLAYING' || helpOpen) return false;
  if (energy <= 0) {
    gameOver('reason_energy');
    return false;
  }
  energy = Math.max(0, energy - SCAN_COST);
  var hit = currentScanTarget();
  pulses.push({ x: player.x, y: player.y, life: 0.45, good: !!hit.organism });
  scanFlag = true;
  if (!hit.organism) {
    addCard('none', GF.t('no_target'), -3, false);
    score = Math.max(0, score - 3);
    sfx('click', 120);
    if (energy <= 0 && journalDone < journalTarget) gameOver('reason_energy');
    return false;
  }
  var o = hit.organism;
  var q = scanQuality(hit.dist);
  if (hit.dist < (PLAYER_RADIUS + TYPES[o.type].radius + 8) * scene.ui) {
    addDisturbance(DISTURB_CLOSE_GAIN, o.x, o.y);
    q *= 0.82;
  }
  if (o.type === 'burrow' && !o.visible) q = 0;
  o.scanGlow = 1;
  var good = q >= TYPES[o.type].need;
  var wasTarget = targetLeft(o.type) > 0;
  var pts = 0;
  if (good) {
    pts = TYPES[o.type].score + Math.round(q * 90) + sector * 15 + (wasTarget ? 45 : 0);
    score += pts;
    speciesSeen[o.type] = true;
    if (wasTarget) {
      journalProgress[o.type] = (journalProgress[o.type] || 0) + 1;
      journalDone++;
    }
    addCard(o.type, (wasTarget ? typeName(o.type) : GF.t('duplicate')) + ' ' + Math.round(q * 100) + '%', pts, true);
    var p = worldToScreen(o.x, o.y);
    GF.spawnParticles(p.x, p.y, o.type === 'burrow' ? '#e48cff' : '#a9f4b7', 20);
    GF.spawnFloat(p.x, p.y - 10 * scene.ui, '+' + String(pts), '#eef59a');
    sfx(wasTarget ? 'reward' : 'coin', 150);
    if (journalDone >= journalTarget) GF.spawnFloat(GF.cx, scene.y + scene.h * 0.22, GF.t('return_lander'), '#f7e58d');
  } else {
    pts = 8;
    score += pts;
    addCard(o.type, GF.t('weak_scan') + ' ' + Math.round(q * 100) + '%', pts, false);
    var wp = worldToScreen(o.x, o.y);
    GF.spawnFloat(wp.x, wp.y - 8 * scene.ui, GF.t('weak_scan'), '#ffc0a0');
    sfx('hit', 140);
  }
  best = Math.max(best, score);
  saveMeta();
  if (energy <= 0 && journalDone < journalTarget) gameOver('reason_energy');
  return good;
}

function update(dt) {
  layout();
  if (gs !== 'PLAYING') return;
  runTime += dt;
  updateCoach(dt);
  updateMovement(dt);
  updateResources(dt);
  updateOrganisms(dt);
  updateSpores(dt);
  updateCards(dt);
  checkSectorComplete();
}

function onPointerDown(e) {
  layout();
  var p = ptrPos(e);
  if (hitRect(p, uiRects.mute)) {
    GF.toggleMute();
    sfx('click', 80);
    e.preventDefault();
    return;
  }
  if (hitRect(p, uiRects.help)) {
    helpOpen = !helpOpen;
    sfx('click', 80);
    e.preventDefault();
    return;
  }
  if (helpOpen && hitRect(p, uiRects.helpClose)) {
    helpOpen = false;
    sfx('click', 80);
    e.preventDefault();
    return;
  }
  if (gs === 'GAMEOVER' || gs === 'WON') {
    if (hitRect(p, uiRects.retry)) {
      startGame({ suppressTutorial: true });
      sfx('spawn', 140);
    }
    e.preventDefault();
    return;
  }
  if (helpOpen) {
    helpOpen = false;
    e.preventDefault();
    return;
  }
  if (p.y >= scene.y && p.y <= scene.y + scene.h) {
    moveTarget = screenToWorld(p.x, p.y);
    pointer = { active: true, sx: p.x, sy: p.y, x: p.x, y: p.y, moved: false };
    e.preventDefault();
  }
}

function onPointerMove(e) {
  if (!pointer || !pointer.active || gs !== 'PLAYING') return;
  var p = ptrPos(e);
  pointer.x = p.x;
  pointer.y = p.y;
  var dx = p.x - pointer.sx;
  var dy = p.y - pointer.sy;
  if (Math.sqrt(dx * dx + dy * dy) > 8) pointer.moved = true;
  moveTarget = screenToWorld(p.x, p.y);
  e.preventDefault();
}

function onPointerUp(e) {
  if (!pointer) return;
  if (!pointer.moved) scan();
  pointer.active = false;
  pointer = null;
  e.preventDefault();
}

function toggleFullscreen() {
  var el = document.fullscreenElement || document.webkitFullscreenElement;
  if (el) {
    if (document.exitFullscreen) document.exitFullscreen().catch(function() {});
    else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
    return;
  }
  var c = GF.canvas;
  if (c.requestFullscreen) c.requestFullscreen().catch(function() {});
  else if (c.webkitRequestFullscreen) c.webkitRequestFullscreen();
}

function onKeyDown(e) {
  if (e.code === 'Space') {
    scan();
    e.preventDefault();
  }
  if (e.code === 'KeyH') {
    helpOpen = !helpOpen;
    e.preventDefault();
  }
  if (e.code === 'KeyR' && (gs === 'GAMEOVER' || gs === 'WON')) {
    startGame({ suppressTutorial: true });
    e.preventDefault();
  }
  if (e.code === 'KeyF') {
    toggleFullscreen();
    e.preventDefault();
  }
}

function drawText(c, txt, x, y, size, color, align, weight) {
  c.font = (weight || '600') + ' ' + String(size) + 'px system-ui, -apple-system, Segoe UI, sans-serif';
  c.fillStyle = color || '#f5f1df';
  c.textAlign = align || 'left';
  c.textBaseline = 'alphabetic';
  c.fillText(String(txt), x, y);
}

function fitText(c, txt, x, y, maxW, size, color, align, weight) {
  var s = size;
  c.font = (weight || '600') + ' ' + String(s) + 'px system-ui, -apple-system, Segoe UI, sans-serif';
  while (s > 8 && c.measureText(String(txt)).width > maxW) {
    s--;
    c.font = (weight || '600') + ' ' + String(s) + 'px system-ui, -apple-system, Segoe UI, sans-serif';
  }
  c.fillStyle = color || '#f5f1df';
  c.textAlign = align || 'left';
  c.textBaseline = 'alphabetic';
  c.fillText(String(txt), x, y);
}

function wrapLines(c, text, maxW, size, weight) {
  c.font = (weight || '600') + ' ' + String(size) + 'px system-ui, -apple-system, Segoe UI, sans-serif';
  var words = String(text).split(/\s+/);
  var lines = [];
  var line = '';
  for (var i = 0; i < words.length; i++) {
    var test = line ? line + ' ' + words[i] : words[i];
    if (c.measureText(test).width > maxW && line) {
      lines.push(line);
      line = words[i];
    } else {
      line = test;
    }
  }
  if (line) lines.push(line);
  return lines;
}

function roundRect(c, x, y, w, h, r) {
  GF.rr(c, x, y, w, h, r);
}

function hasArt(key) {
  var image = ART[key];
  return !!(image && image.complete && image.naturalWidth > 0);
}

function drawArt(c, key, x, y, w, h, rotation, alpha, filter, flipX) {
  if (!hasArt(key)) return false;
  c.save();
  c.translate(x, y);
  if (rotation) c.rotate(rotation);
  if (flipX) c.scale(-1, 1);
  c.globalAlpha = alpha == null ? 1 : alpha;
  if (filter) c.filter = filter;
  c.imageSmoothingEnabled = true;
  c.drawImage(ART[key], -w / 2, -h / 2, w, h);
  c.restore();
  return true;
}

function drawSpecimenArt(c, type, x, y, size, rotation, alpha) {
  if (type === 'frond') {
    var sway = Math.sin(runTime * 1.5 + x * 0.01) * 0.07;
    var drewBase = drawArt(c, 'bush', x, y + size * 0.10, size * 1.02, size * 1.02, rotation || 0, alpha, 'hue-rotate(18deg) saturate(1.18)');
    var drewLeft = drawArt(c, 'frond', x - size * 0.16, y - size * 0.14, size * 0.70, size * 0.70, -0.24 + sway, alpha, 'hue-rotate(42deg) saturate(1.28)');
    var drewRight = drawArt(c, 'frond', x + size * 0.18, y - size * 0.10, size * 0.62, size * 0.62, 0.31 - sway, alpha, 'hue-rotate(5deg) saturate(1.24)');
    var drewCore = drawArt(c, 'gemGreen', x, y - size * 0.20, size * 0.30, size * 0.30, runTime * 0.12, alpha, 'hue-rotate(32deg) saturate(1.30)');
    return drewBase || drewLeft || drewRight || drewCore;
  }
  var key = TYPES[type] ? TYPES[type].art : '';
  var flip = type === 'grazer' && Math.cos(rotation || 0) < 0;
  return drawArt(c, key, x, y, size, size, type === 'grazer' ? 0 : rotation || 0, alpha, '', flip);
}

function drawHabitatPatch(c, x, y, rx, ry, inner, outer, rotation) {
  var p = worldToScreen(x, y);
  var gx = p.x - rx * scene.w * 0.12;
  var gy = p.y - ry * scene.h * 0.18;
  var radius = Math.max(rx * scene.w, ry * scene.h);
  var glow = c.createRadialGradient(gx, gy, 2, p.x, p.y, radius);
  glow.addColorStop(0, inner);
  glow.addColorStop(0.62, outer);
  glow.addColorStop(1, 'rgba(5,16,18,0)');
  c.fillStyle = glow;
  c.beginPath();
  c.ellipse(p.x, p.y, rx * scene.w, ry * scene.h, rotation || 0, 0, Math.PI * 2);
  c.fill();
  c.strokeStyle = 'rgba(180,244,220,0.12)';
  c.lineWidth = Math.max(1, 1.5 * scene.ui);
  c.stroke();
}

function drawFieldDecor(c) {
  for (var i = 0; i < FIELD_DECOR.length; i++) {
    var item = FIELD_DECOR[i];
    var p = worldToScreen(item.x, item.y);
    var size = item.size * scene.ui;
    var bob = (item.key === 'flowerBlue' || item.key === 'flowerPurple' || item.key === 'sproutBlue')
      ? Math.sin(runTime * 0.65 + i * 1.7) * 1.4 * scene.ui
      : 0;
    var filter = item.hue ? 'hue-rotate(' + String(item.hue) + 'deg) saturate(1.12)' : '';
    c.fillStyle = 'rgba(2,9,12,' + String(0.10 + item.alpha * 0.13) + ')';
    c.beginPath();
    c.ellipse(p.x, p.y + size * 0.31, size * 0.34, size * 0.12, item.rot || 0, 0, Math.PI * 2);
    c.fill();
    drawArt(c, item.key, p.x, p.y + bob, size, size, item.rot || 0, item.alpha, filter);
  }
}

function drawBackground(c) {
  var g = c.createLinearGradient(0, scene.y, GF.W, scene.y + scene.h);
  g.addColorStop(0, '#071c1d');
  g.addColorStop(0.42, '#12352e');
  g.addColorStop(0.72, '#182e35');
  g.addColorStop(1, '#211a39');
  c.fillStyle = g;
  c.fillRect(0, scene.y, GF.W, scene.h);

  var aurora = c.createRadialGradient(GF.W * 0.62, scene.y + scene.h * 0.35, 10, GF.W * 0.62, scene.y + scene.h * 0.35, GF.W * 0.68);
  aurora.addColorStop(0, 'rgba(66,224,194,0.14)');
  aurora.addColorStop(0.45, 'rgba(74,142,160,0.07)');
  aurora.addColorStop(1, 'rgba(75,53,129,0)');
  c.fillStyle = aurora;
  c.fillRect(0, scene.y, GF.W, scene.h);

  drawHabitatPatch(c, 0.18, 0.27, 0.23, 0.18, 'rgba(31,118,97,0.34)', 'rgba(7,38,35,0.04)', -0.18);
  drawHabitatPatch(c, 0.68, 0.24, 0.27, 0.16, 'rgba(37,143,130,0.30)', 'rgba(11,49,54,0.03)', 0.14);
  drawHabitatPatch(c, 0.36, 0.75, 0.29, 0.17, 'rgba(112,68,156,0.28)', 'rgba(41,28,74,0.02)', 0.09);
  drawHabitatPatch(c, 0.84, 0.72, 0.19, 0.14, 'rgba(170,117,67,0.18)', 'rgba(53,33,42,0.02)', -0.16);

  c.save();
  c.strokeStyle = 'rgba(148,235,208,0.045)';
  c.lineWidth = 1;
  var step = Math.max(34, 48 * scene.ui);
  for (var x = -step; x < GF.W + step; x += step) {
    c.beginPath();
    c.moveTo(x + Math.sin(runTime * 0.08 + x) * 8 * scene.ui, scene.y);
    c.lineTo(x - 60 * scene.ui, scene.y + scene.h);
    c.stroke();
  }
  for (var y = scene.y; y < scene.y + scene.h + step; y += step) {
    c.beginPath();
    c.moveTo(0, y);
    c.lineTo(GF.W, y + Math.cos(runTime * 0.06 + y) * 5 * scene.ui);
    c.stroke();
  }
  c.restore();

  c.save();
  c.setLineDash([9 * scene.ui, 14 * scene.ui]);
  c.strokeStyle = 'rgba(166,233,208,0.10)';
  c.lineWidth = Math.max(1, 2 * scene.ui);
  c.beginPath();
  c.moveTo(-20 * scene.ui, scene.y + scene.h * 0.57);
  c.bezierCurveTo(GF.W * 0.23, scene.y + scene.h * 0.37, GF.W * 0.62, scene.y + scene.h * 0.79, GF.W + 20 * scene.ui, scene.y + scene.h * 0.49);
  c.stroke();
  c.restore();

  drawFieldDecor(c);

  for (var i = 0; i < 44; i++) {
    var px = scene.x + ((i * 83) % Math.max(1, scene.w));
    var py = scene.y + ((i * 137) % Math.max(1, scene.h));
    var hue = i % 4;
    c.fillStyle = hue === 0 ? 'rgba(111,234,156,0.18)' : hue === 1 ? 'rgba(125,210,255,0.14)' : hue === 2 ? 'rgba(244,184,110,0.12)' : 'rgba(214,126,239,0.12)';
    c.beginPath();
    c.ellipse(px, py, (2 + (i % 5)) * scene.ui, (1 + (i % 3)) * scene.ui, i, 0, Math.PI * 2);
    c.fill();
  }

  var vignette = c.createLinearGradient(0, scene.y, 0, scene.y + scene.h);
  vignette.addColorStop(0, 'rgba(2,8,10,0.14)');
  vignette.addColorStop(0.45, 'rgba(2,8,10,0)');
  vignette.addColorStop(1, 'rgba(2,6,9,0.22)');
  c.fillStyle = vignette;
  c.fillRect(0, scene.y, GF.W, scene.h);
}

function drawPool(c, x, y, w, h, color) {
  var p = worldToScreen(x, y);
  var rx = scene.w * w;
  var ry = scene.h * h;
  var g = c.createRadialGradient(p.x, p.y, 4, p.x, p.y, Math.max(rx, ry));
  g.addColorStop(0, color);
  g.addColorStop(0.64, 'rgba(45, 128, 122, 0.80)');
  g.addColorStop(1, 'rgba(10, 22, 28, 0.20)');
  c.fillStyle = g;
  c.beginPath();
  c.ellipse(p.x, p.y, rx, ry, 0.1, 0, Math.PI * 2);
  c.fill();
  c.strokeStyle = 'rgba(226,248,206,0.24)';
  c.lineWidth = Math.max(1, 2 * scene.ui);
  c.stroke();
}

function drawLander(c) {
  var p = worldToScreen(lander.x, lander.y);
  var r = LANDER_RADIUS * scene.ui;
  var active = journalDone >= journalTarget;
  c.save();
  c.fillStyle = active ? 'rgba(244,228,127,0.22)' : 'rgba(157,202,226,0.12)';
  c.beginPath();
  c.arc(p.x, p.y, r * (active ? 1.72 + Math.sin(runTime * 5) * 0.08 : 1.42), 0, Math.PI * 2);
  c.fill();
  c.strokeStyle = active ? 'rgba(255,239,143,0.72)' : 'rgba(168,216,235,0.24)';
  c.lineWidth = Math.max(1, 2 * scene.ui);
  c.beginPath();
  c.arc(p.x, p.y, r * (active ? 1.34 + Math.sin(runTime * 4.2) * 0.07 : 1.12), 0, Math.PI * 2);
  c.stroke();
  c.restore();
  if (!drawArt(c, 'lander', p.x, p.y - 2 * scene.ui, 68 * scene.ui, 68 * scene.ui, 0, 1, active ? 'saturate(1.15) brightness(1.08)' : '')) {
    c.fillStyle = '#d8e3d0';
    roundRect(c, p.x - 20 * scene.ui, p.y - 16 * scene.ui, 40 * scene.ui, 28 * scene.ui, 8 * scene.ui);
    c.fill();
    c.fillStyle = '#30414a';
    c.fillRect(p.x - 13 * scene.ui, p.y - 8 * scene.ui, 26 * scene.ui, 9 * scene.ui);
  }
  fitText(c, GF.t('lander'), p.x, p.y + 48 * scene.ui, 84 * scene.ui, fs(11), active ? '#fff0a3' : '#cfe6e8', 'center', '800');
}

function drawOrganism(c, o) {
  if (!o.visible && o.type === 'burrow') {
    var hp = worldToScreen(o.x, o.y);
    if (!drawArt(c, 'burrowHidden', hp.x, hp.y + 3 * scene.ui, 44 * scene.ui, 44 * scene.ui, 0, 0.58, 'hue-rotate(24deg) saturate(1.12)')) {
      c.fillStyle = 'rgba(123,74,132,0.26)';
      c.beginPath();
      c.ellipse(hp.x, hp.y + 7 * scene.ui, 18 * scene.ui, 7 * scene.ui, 0, 0, Math.PI * 2);
      c.fill();
    }
    return;
  }
  var spec = TYPES[o.type];
  var p = worldToScreen(o.x, o.y);
  var r = spec.radius * scene.ui;
  var spriteSize = (o.type === 'grazer' ? 58 : o.type === 'polyp' ? 38 : o.type === 'burrow' ? 48 : 46) * scene.ui;
  c.save();
  c.translate(p.x, p.y);
  if (o.scanGlow > 0) {
    c.strokeStyle = 'rgba(255,255,210,' + String(0.75 * o.scanGlow) + ')';
    c.lineWidth = Math.max(2, 3 * scene.ui);
    c.beginPath();
    c.arc(0, 0, r * (2.0 - o.scanGlow * 0.35), 0, Math.PI * 2);
    c.stroke();
  }
  c.restore();

  var artRotation = o.type === 'grazer'
    ? Math.atan2(o.vy, o.vx)
    : Math.sin(runTime * 0.72 + o.phase) * 0.05;
  var artY = p.y + (o.type === 'polyp' ? Math.sin(runTime * 1.9 + o.phase) * 2.2 * scene.ui : 0);
  var drewArt = drawSpecimenArt(c, o.type, p.x, artY, spriteSize, artRotation, 1);

  c.save();
  c.translate(p.x, p.y);
  if (!drewArt) {
  if (o.type === 'frond') {
    c.strokeStyle = spec.dark;
    c.lineWidth = Math.max(3, 5 * scene.ui);
    c.beginPath();
    c.moveTo(0, r * 0.8);
    c.lineTo(Math.sin(runTime * 1.7 + o.phase) * r * 0.4, -r * 0.6);
    c.stroke();
    c.fillStyle = spec.color;
    for (var i = 0; i < 5; i++) {
      var a = -1.1 + i * 0.55 + Math.sin(runTime * 1.3 + o.phase) * 0.08;
      c.beginPath();
      c.ellipse(Math.cos(a) * r * 0.55, Math.sin(a) * r * 0.55, r * 0.32, r * 0.72, a, 0, Math.PI * 2);
      c.fill();
    }
  } else if (o.type === 'grazer') {
    c.rotate(Math.atan2(o.vy, o.vx));
    c.fillStyle = spec.color;
    c.beginPath();
    c.ellipse(0, 0, r * 1.25, r * 0.72, 0, 0, Math.PI * 2);
    c.fill();
    c.fillStyle = spec.dark;
    c.beginPath();
    c.moveTo(r * 0.5, -r * 0.6);
    c.lineTo(r * 1.35, 0);
    c.lineTo(r * 0.5, r * 0.6);
    c.closePath();
    c.fill();
    c.fillStyle = '#f2e2a0';
    c.fillRect(-r * 0.80, -r * 0.12, r * 0.44, r * 0.22);
  } else if (o.type === 'polyp') {
    c.fillStyle = spec.color;
    for (var j = 0; j < 4; j++) {
      var ox = Math.cos(o.phase + j * 1.7 + runTime * 0.8) * r * 0.55;
      var oy = Math.sin(o.phase + j * 1.4 + runTime * 0.7) * r * 0.42;
      c.beginPath();
      c.arc(ox, oy, r * 0.58, 0, Math.PI * 2);
      c.fill();
    }
    c.fillStyle = spec.dark;
    c.beginPath();
    c.arc(0, 0, r * 0.48, 0, Math.PI * 2);
    c.fill();
  } else {
    c.fillStyle = 'rgba(92,48,102,0.72)';
    c.beginPath();
    c.ellipse(0, r * 0.48, r * 1.25, r * 0.42, 0, 0, Math.PI * 2);
    c.fill();
    c.fillStyle = spec.color;
    for (var k = 0; k < 6; k++) {
      var aa = k / 6 * Math.PI * 2 + Math.sin(runTime * 1.8 + o.phase) * 0.08;
      c.beginPath();
      c.moveTo(0, 0);
      c.lineTo(Math.cos(aa - 0.12) * r * 0.65, Math.sin(aa - 0.12) * r * 0.65);
      c.lineTo(Math.cos(aa) * r * 1.22, Math.sin(aa) * r * 1.22);
      c.lineTo(Math.cos(aa + 0.12) * r * 0.65, Math.sin(aa + 0.12) * r * 0.65);
      c.closePath();
      c.fill();
    }
    c.fillStyle = spec.dark;
    c.beginPath();
    c.arc(0, 0, r * 0.42, 0, Math.PI * 2);
    c.fill();
  }
  }
  if (targetLeft(o.type) > 0) {
    c.strokeStyle = 'rgba(255,238,132,0.82)';
    c.lineWidth = Math.max(1, 2 * scene.ui);
    c.beginPath();
    c.arc(0, 0, Math.max(r * 1.78, spriteSize * 0.60), 0, Math.PI * 2);
    c.stroke();
  }
  c.restore();
}

function drawSpores(c) {
  for (var i = 0; i < spores.length; i++) {
    var s = spores[i];
    var p = worldToScreen(s.x, s.y);
    var r = SPORE_RADIUS * scene.ui * (1 + Math.sin(runTime * 2.3 + s.phase) * 0.12);
    c.fillStyle = 'rgba(255,118,112,0.20)';
    c.beginPath();
    c.arc(p.x, p.y, r * 2.0, 0, Math.PI * 2);
    c.fill();
    var drewSpore = drawArt(
      c,
      'spore',
      p.x,
      p.y + Math.sin(runTime * 2.3 + s.phase) * 2 * scene.ui,
      r * 3.8,
      r * 3.8,
      runTime * 0.16,
      0.96,
      'sepia(0.72) saturate(2.3) hue-rotate(318deg) brightness(1.08)'
    );
    if (!drewSpore) {
      c.fillStyle = '#ff9a70';
      c.beginPath();
      c.arc(p.x, p.y, r, 0, Math.PI * 2);
      c.fill();
    }
    c.strokeStyle = 'rgba(255,208,168,0.72)';
    c.lineWidth = Math.max(1, 1.5 * scene.ui);
    for (var j = 0; j < 6; j++) {
      var a = j / 6 * Math.PI * 2 + runTime * 0.8;
      c.beginPath();
      c.moveTo(p.x + Math.cos(a) * r * 0.6, p.y + Math.sin(a) * r * 0.6);
      c.lineTo(p.x + Math.cos(a) * r * 1.6, p.y + Math.sin(a) * r * 1.6);
      c.stroke();
    }
  }
}

function drawPlayer(c) {
  var p = worldToScreen(player.x, player.y);
  var ring = SCAN_RADIUS * scene.ui;
  var target = currentScanTarget();
  c.strokeStyle = target.organism ? 'rgba(235,244,149,0.70)' : 'rgba(151,219,225,0.36)';
  c.lineWidth = Math.max(1, 2 * scene.ui);
  c.beginPath();
  c.arc(p.x, p.y, ring, 0, Math.PI * 2);
  c.stroke();
  c.fillStyle = target.organism ? 'rgba(235,244,149,0.08)' : 'rgba(151,219,225,0.05)';
  c.beginPath();
  c.arc(p.x, p.y, ring, 0, Math.PI * 2);
  c.fill();
  for (var i = 0; i < pulses.length; i++) {
    var pulse = pulses[i];
    var pp = worldToScreen(pulse.x, pulse.y);
    var a = clamp(pulse.life / 0.45, 0, 1);
    c.strokeStyle = pulse.good ? 'rgba(241,246,142,' + String(a) + ')' : 'rgba(255,151,125,' + String(a) + ')';
    c.lineWidth = Math.max(2, 4 * scene.ui);
    c.beginPath();
    c.arc(pp.x, pp.y, ring * (1.0 + (1 - a) * 0.45), 0, Math.PI * 2);
    c.stroke();
    if (pulse.good) {
      drawArt(c, 'scanBurst', pp.x, pp.y, ring * 1.18, ring * 0.70, 0, 0.18 + a * 0.48, 'hue-rotate(35deg) saturate(1.45)');
    }
  }
  var drewRover = drawArt(c, 'rover', p.x, p.y - 2 * scene.ui, 50 * scene.ui, 50 * scene.ui, 0, 1, target.organism ? 'saturate(1.12) brightness(1.06)' : '');
  if (!drewRover) {
    c.save();
    c.translate(p.x, p.y);
    c.rotate(player.face);
    c.fillStyle = '#d8f3ea';
    roundRect(c, -16 * scene.ui, -12 * scene.ui, 32 * scene.ui, 24 * scene.ui, 8 * scene.ui);
    c.fill();
    c.fillStyle = '#25354a';
    roundRect(c, 2 * scene.ui, -8 * scene.ui, 16 * scene.ui, 16 * scene.ui, 6 * scene.ui);
    c.fill();
    c.restore();
  }
  c.save();
  c.translate(p.x, p.y);
  c.rotate(player.face);
  c.fillStyle = target.organism ? '#eff78f' : '#8de9ff';
  c.beginPath();
  c.moveTo(28 * scene.ui, 0);
  c.lineTo(21 * scene.ui, -4 * scene.ui);
  c.lineTo(21 * scene.ui, 4 * scene.ui);
  c.closePath();
  c.fill();
  c.restore();
}

function drawHUD(c) {
  var ui = scene.ui;
  var narrow = GF.W < 520;
  c.fillStyle = '#091612';
  c.fillRect(0, 0, GF.W, scene.top);
  c.fillStyle = '#101812';
  c.fillRect(0, scene.y + scene.h, GF.W, scene.bottom);
  c.strokeStyle = 'rgba(226,248,206,0.10)';
  c.lineWidth = 1;
  c.beginPath();
  c.moveTo(0, scene.top - 0.5);
  c.lineTo(GF.W, scene.top - 0.5);
  c.moveTo(0, scene.y + scene.h + 0.5);
  c.lineTo(GF.W, scene.y + scene.h + 0.5);
  c.stroke();

  var journal = GF.t('journal') + ' ' + String(journalDone) + '/' + String(journalTarget);
  var objective = journalDone >= journalTarget ? GF.t('return_lander') : (narrow ? GF.t('objective') + ' ' + nextTargetCompact() : targetSummary());
  if (narrow) {
    fitText(c, GF.t('title'), 10 * ui, 20 * ui, GF.W - 112 * ui, fs(16), '#f0f5d1', 'left', '850');
    fitText(c, GF.t('sector') + ' ' + String(sector) + '  ' + GF.t('score') + ' ' + String(score), 10 * ui, 43 * ui, GF.W - 20 * ui, fs(12), '#cfe8db', 'left', '700');
    var compact = GF.t('oxygen') + ' ' + Math.ceil(oxygen) + '  ' + GF.t('energy') + ' ' + Math.ceil(energy) + '  ' + GF.t('disturbance') + ' ' + Math.round(disturbance);
    fitText(c, compact, GF.cx, 65 * ui, GF.W - 18 * ui, fs(11), disturbance >= 76 || oxygen < 22 ? '#ffbba6' : '#d9ead3', 'center', '750');
    fitText(c, journal, GF.cx, 86 * ui, GF.W - 18 * ui, fs(14), '#f5e783', 'center', '850');
    fitText(c, objective, GF.cx, 106 * ui, GF.W - 18 * ui, fs(10), '#cad5bc', 'center', '650');
  } else {
    drawText(c, GF.t('title'), 12 * ui, 23 * ui, fs(16), '#f0f5d1', 'left', '850');
    fitText(c, GF.t('sector') + ' ' + String(sector) + '  ' + GF.t('score') + ' ' + String(score), 12 * ui, 47 * ui, Math.max(120, GF.W * 0.34), fs(13), '#cfe8db', 'left', '700');
    fitText(c, journal, GF.cx, 24 * ui, Math.max(110, GF.W * 0.30), fs(15), '#f5e783', 'center', '850');
    fitText(c, objective, GF.cx, 50 * ui, Math.max(160, GF.W * 0.46), fs(12), '#cad5bc', 'center', '650');
    var rightX = GF.W - 94 * ui;
    fitText(c, GF.t('oxygen') + ' ' + Math.ceil(oxygen), rightX, 25 * ui, 92 * ui, fs(12), oxygen < 22 ? '#ff9b83' : '#d7efdf', 'right', '750');
    fitText(c, GF.t('energy') + ' ' + Math.ceil(energy), rightX, 46 * ui, 92 * ui, fs(12), energy < 18 ? '#ffcf8a' : '#c7e8ff', 'right', '750');
    fitText(c, GF.t('disturbance') + ' ' + Math.round(disturbance), rightX, 67 * ui, 92 * ui, fs(12), disturbance >= 76 ? '#ff9b83' : '#e7d7f3', 'right', '750');
  }

  drawIconButton(c, uiRects.help, GF.t('help_btn'));
  GF.drawMuteIcon(c, uiRects.mute.x + uiRects.mute.w / 2, uiRects.mute.y + uiRects.mute.h / 2, uiRects.mute.w * 0.48, GF.muted);

  var bottomY = scene.y + scene.h;
  var target = currentScanTarget();
  var scanText = GF.t('scan') + ': ' + (energy >= SCAN_COST ? GF.t('ready') : GF.t('low_energy'));
  var hint = target.organism ? typeName(target.organism.type) + '  ' + GF.t('quality') + ' ' + Math.round(scanQuality(target.dist) * 100) + '%' : GF.t('no_target');
  fitText(c, scanText, 12 * ui, bottomY + 27 * ui, Math.max(150, GF.W * 0.42), fs(14), energy < SCAN_COST ? '#ffbd8a' : '#eef6d0', 'left', '850');
  fitText(c, hint, 12 * ui, bottomY + 51 * ui, Math.max(150, GF.W * 0.46), fs(12), target.organism ? '#c6eec8' : '#9fb3ad', 'left', '700');
  drawCardStrip(c, bottomY, ui);
}

function drawIconButton(c, r, label) {
  c.fillStyle = 'rgba(238,246,219,0.10)';
  roundRect(c, r.x, r.y, r.w, r.h, 8 * scene.ui);
  c.fill();
  c.strokeStyle = 'rgba(238,246,219,0.34)';
  c.lineWidth = 1;
  c.stroke();
  drawText(c, label, r.x + r.w / 2, r.y + r.h * 0.68, fs(18), '#f4efd1', 'center', '850');
}

function drawCardStrip(c, bottomY, ui) {
  var startX = Math.max(160 * ui, GF.W * 0.48);
  var count = GF.W < 420 ? 2 : 3;
  var gap = 7 * ui;
  var available = Math.max(90 * ui, GF.W - startX - 12 * ui - gap * (count - 1));
  var cardW = clamp(available / count, 58 * ui, 122 * ui);
  var cardH = 55 * ui;
  for (var i = 0; i < count; i++) {
    var x = startX + i * (cardW + gap);
    var y = bottomY + 14 * ui;
    var card = cards[i];
    c.fillStyle = card ? (card.good ? '#dbe8be' : '#dfc0ad') : 'rgba(219,232,190,0.10)';
    roundRect(c, x, y, cardW, cardH, 7 * ui);
    c.fill();
    c.strokeStyle = card ? 'rgba(30,35,26,0.34)' : 'rgba(219,232,190,0.20)';
    c.stroke();
    if (!card) continue;
    var label = (GF.W < 420 && TYPES[card.type]) ? shortTypeName(card.type) : card.label;
    if (GF.W < 420 && !TYPES[card.type]) label = card.good ? GF.t('discovered') : GF.t('weak_scan');
    var thumbDrawn = false;
    var thumbX = x + Math.min(cardW * 0.24, 28 * ui);
    if (TYPES[card.type]) {
      thumbDrawn = drawSpecimenArt(c, card.type, thumbX, y + cardH * 0.51, Math.min(34 * ui, cardW * 0.32), 0, card.good ? 1 : 0.68);
    }
    var textX = thumbDrawn ? x + cardW * 0.66 : x + cardW / 2;
    var textW = thumbDrawn ? cardW * 0.60 - 7 * ui : cardW - 8 * ui;
    fitText(c, label, textX, y + 22 * ui, textW, fs(10), card.good ? '#1f3727' : '#5f2a22', 'center', '850');
    var pts = card.pts > 0 ? '+' + String(card.pts) : String(card.pts);
    fitText(c, pts, textX, y + 42 * ui, textW, fs(12), card.good ? '#1f6538' : '#8a3328', 'center', '850');
  }
}

function drawCoach(c) {
  if (tutorialDone || screenshotMode || coachStep > 3) return;
  var key = ['coach_move', 'coach_scan', 'coach_return', 'coach_balance'][coachStep] || 'coach_move';
  var ui = scene.ui;
  var w = Math.min(GF.W - 24 * ui, 430 * ui);
  var size = fs(13);
  var lines = wrapLines(c, GF.t(key), w - 28 * ui, size, '750');
  var h = 25 * ui + lines.length * (size + 4 * ui);
  var x = 12 * ui;
  var y = scene.y + scene.h - h - 12 * ui;
  c.fillStyle = 'rgba(8,18,15,0.88)';
  roundRect(c, x, y, w, h, 8 * ui);
  c.fill();
  c.strokeStyle = 'rgba(245,231,131,0.55)';
  c.lineWidth = Math.max(1, 2 * ui);
  c.stroke();
  for (var i = 0; i < lines.length; i++) {
    drawText(c, lines[i], x + 14 * ui, y + 24 * ui + i * (size + 4 * ui), size, '#fff0b6', 'left', '750');
  }
  drawCoachTarget(c);
}

function drawCoachTarget(c) {
  var p;
  if (coachStep === 0) {
    var first = organisms[0] || { x: 0.42, y: 0.48 };
    p = worldToScreen(first.x, first.y);
  } else if (coachStep === 1) {
    p = worldToScreen(player.x, player.y);
  } else if (coachStep === 2) {
    p = worldToScreen(lander.x, lander.y);
  } else {
    p = worldToScreen(organisms[1] ? organisms[1].x : player.x, organisms[1] ? organisms[1].y : player.y);
  }
  var r = (34 + Math.sin(coachPulse * 6) * 5) * scene.ui;
  c.strokeStyle = 'rgba(245,231,131,0.95)';
  c.lineWidth = Math.max(2, 3 * scene.ui);
  c.beginPath();
  c.arc(p.x, p.y, r, 0, Math.PI * 2);
  c.stroke();
}

function drawHelp(c) {
  if (!helpOpen) return;
  var ui = scene.ui;
  var w = Math.min(GF.W - 28 * ui, 530 * ui);
  var x = (GF.W - w) / 2;
  var y = Math.max(12 * ui, scene.y + 10 * ui);
  var size = fs(13);
  var entries = [
    ['tut_goal', '#f4df99'],
    ['tut_controls', '#dfebd4'],
    ['tut_win', '#d5f0c2'],
    ['tut_lose', '#ffbeaa'],
    ['tut_tip', '#d6e4ff']
  ];
  var lineData = [];
  var total = 48 * ui;
  for (var i = 0; i < entries.length; i++) {
    var lines = wrapLines(c, GF.t(entries[i][0]), w - 28 * ui, size, '650');
    lineData.push({ lines: lines, color: entries[i][1] });
    total += lines.length * (size + 4 * ui) + 9 * ui;
  }
  total += 56 * ui;
  if (total > GF.H - 24 * ui) {
    y = 12 * ui;
    total = GF.H - 24 * ui;
  }
  c.fillStyle = 'rgba(6,14,12,0.95)';
  roundRect(c, x, y, w, total, 8 * ui);
  c.fill();
  c.strokeStyle = 'rgba(238,246,219,0.35)';
  c.stroke();
  drawText(c, GF.t('help_title'), x + 16 * ui, y + 29 * ui, fs(17), '#f8edc8', 'left', '850');
  var yy = y + 58 * ui;
  for (var j = 0; j < lineData.length; j++) {
    for (var k = 0; k < lineData[j].lines.length; k++) {
      drawText(c, lineData[j].lines[k], x + 16 * ui, yy, size, lineData[j].color, 'left', '650');
      yy += size + 4 * ui;
    }
    yy += 9 * ui;
  }
  uiRects.helpClose = { x: GF.cx - 70 * ui, y: y + total - 48 * ui, w: 140 * ui, h: 34 * ui };
  c.fillStyle = '#e6d68c';
  roundRect(c, uiRects.helpClose.x, uiRects.helpClose.y, uiRects.helpClose.w, uiRects.helpClose.h, 8 * ui);
  c.fill();
  fitText(c, GF.t('close'), GF.cx, uiRects.helpClose.y + 23 * ui, uiRects.helpClose.w - 12 * ui, fs(13), '#172014', 'center', '850');
}

function drawTerminal(c) {

function draw(c) {
  layout();
  c.clearRect(0, 0, GF.W, GF.H);
  drawBackground(c);
  drawLander(c);
  drawSpores(c);
  for (var i = 0; i < organisms.length; i++) drawOrganism(c, organisms[i]);
  drawPlayer(c);
  drawHUD(c);
  drawCoach(c);
  drawHelp(c);
  drawTerminal(c);
}

function stateObject() {
  return {
    gs: gs,
    score: score,
    best: best,
    sector: sector,
    bestSector: bestSector,
    oxygen: Math.round(oxygen),
    energy: Math.round(energy),
    disturbance: Math.round(disturbance),
    journalDone: journalDone,
    journalTarget: journalTarget,
    speciesSeen: Object.keys(speciesSeen).filter(function(k) { return speciesSeen[k]; }),
    visibleOrganisms: organisms.filter(function(o) { return o.visible; }).length,
    spores: spores.length,
    targetSummary: targetSummary(),
    player: { x: Number(player.x.toFixed(3)), y: Number(player.y.toFixed(3)) }
  };
}

function renderGameToText() {
  var visible = organisms.filter(function(o) { return o.visible; }).slice(0, 8).map(function(o) {
    return {
      type: o.type,
      x: Number(o.x.toFixed(3)),
      y: Number(o.y.toFixed(3)),
      targetLeft: targetLeft(o.type)
    };
  });
  return JSON.stringify({
    coordinate_system: 'world x/y are normalized 0..1, origin top-left of playfield, y increases downward',
    state: stateObject(),
    player: { x: Number(player.x.toFixed(3)), y: Number(player.y.toFixed(3)), scanRadiusPx: Math.round(SCAN_RADIUS * scene.ui) },
    lander: { x: lander.x, y: lander.y, active: journalDone >= journalTarget },
    organisms: visible,
    next_action_hint: journalDone >= journalTarget ? 'return_to_lander' : 'scan_target_organisms'
  });
}

function setupForScreenshot(level) {
  screenshotMode = true;
  tutorialDone = true;
  coachStep = 99;
  helpOpen = false;
  gs = 'PLAYING';
  score = 720 + Math.max(0, level || 4) * 130;
  disturbance = Math.min(58, Math.max(18, (level || 4) * 8));
  player.x = 0.50;
  player.y = 0.48;
  player.vx = 0;
  player.vy = 0;
  startSector(Math.max(1, Math.min(MAX_SECTORS, Number(level) || 5)), false);
  player.x = 0.50;
  player.y = 0.48;
  oxygen = START_OXYGEN - 12;
  energy = START_ENERGY - 10;
  if (targetCounts.frond) { journalProgress.frond = Math.min(1, targetCounts.frond); journalDone += journalProgress.frond; speciesSeen.frond = true; }
  if (targetCounts.grazer) { journalProgress.grazer = Math.min(1, targetCounts.grazer); journalDone += journalProgress.grazer; speciesSeen.grazer = true; }
  cards = [
    { type: 'frond', label: typeName('frond') + ' 92%', pts: 175, good: true, age: 1 },
    { type: 'grazer', label: typeName('grazer') + ' 81%', pts: 198, good: true, age: 2 },
    { type: 'polyp', label: GF.t('weak_scan') + ' 36%', pts: 8, good: false, age: 2.8 }
  ];
}

function botMoveTo(o) {
  layout();
  var ideal = SCAN_RADIUS * scene.ui * 0.58;
  var dx = ideal / Math.max(1, scene.w);
  var dy = ideal / Math.max(1, scene.h) * 0.35;
  var px = o.x - dx;
  if (px < 0.06) px = o.x + dx;
  player.x = clamp(px, 0.05, 0.95);
  player.y = clamp(o.y + dy, 0.08, 0.92);
  movementFlag = true;
}

function botActions() {
  if (gs === 'GAMEOVER' || gs === 'WON') return ['retry'];
  var a = ['wait', 'scan_nearest', 'move_to_target', 'return_lander'];
  if (sector < MAX_SECTORS) a.push('jump_late');
  a.push('force_disturbance');
  return a;
}

function botAct(action) {
  if (action === 'retry') { startGame({ suppressTutorial: true }); return true; }
  if (action === 'wait') { window.advanceTime(1200); return true; }
  if (action === 'move_to_target') {
    var hit = organisms.filter(function(o) { return o.visible && targetLeft(o.type) > 0; })[0] || organisms[0];
    if (hit) botMoveTo(hit);
    return true;
  }
  if (action === 'scan_nearest') {
    var scanHit = organisms.filter(function(o) { return o.visible && targetLeft(o.type) > 0; })[0] || organisms[0];
    if (scanHit) botMoveTo(scanHit);
    scan();
    return true;
  }
  if (action === 'return_lander') {
    player.x = lander.x;
    player.y = lander.y;
    checkSectorComplete();
    return true;
  }
  if (action === 'jump_late') { setupForScreenshot(5); return true; }
  if (action === 'force_disturbance') { addDisturbance(30, player.x, player.y); return true; }
  return false;
}

window._jumpLevel = function(n) { setupForScreenshot(Number(n) || 5); };
window._setupForScreenshot = function(level) { setupForScreenshot(Number(level) || 5); };
window.advanceTime = function(ms) {
  var total = Math.max(0, Number(ms) || 0);
  var step = 1 / 30;
  var count = Math.ceil(total / 1000 / step);
  for (var i = 0; i < count; i++) update(step);
  draw(GF.ctx);
  return stateObject();
};
window.render_game_to_text = renderGameToText;
window._setState = function(s) {
  if (s === 'help') { helpOpen = true; return; }
  if (s === 'gameover') { gameOver('reason_disturb'); return; }
  if (s === 'won') { winGame(); return; }
  if (s === 'playing') { if (gs !== 'PLAYING') startGame({ suppressTutorial: true }); helpOpen = false; }
};
window._getI18N = function() { return STRINGS; };
window._getFontBody = function() { return 'system-ui, -apple-system, Segoe UI, sans-serif'; };

GF.canvas.addEventListener('pointerdown', onPointerDown, { passive: false });
GF.canvas.addEventListener('pointermove', onPointerMove, { passive: false });
GF.canvas.addEventListener('pointerup', onPointerUp, { passive: false });
GF.canvas.addEventListener('pointercancel', onPointerUp, { passive: false });
document.addEventListener('keydown', onKeyDown);

GF.exposeState(stateObject);
GF.exposeBot(botActions, botAct);
GF.exposeReach(function() {
  layout();
  var items = [
    { id: 'help', x: uiRects.help.x, y: uiRects.help.y, w: uiRects.help.w, h: uiRects.help.h, pinned: true },
    { id: 'mute', x: uiRects.mute.x, y: uiRects.mute.y, w: uiRects.mute.w, h: uiRects.mute.h, pinned: true }
  ];
  var pp = worldToScreen(player.x, player.y);
  items.push({ id: 'player_scan', x: pp.x - SCAN_RADIUS * scene.ui, y: pp.y - SCAN_RADIUS * scene.ui, w: SCAN_RADIUS * scene.ui * 2, h: SCAN_RADIUS * scene.ui * 2 });
  var lp = worldToScreen(lander.x, lander.y);
  items.push({ id: 'lander', x: lp.x - 34 * scene.ui, y: lp.y - 34 * scene.ui, w: 68 * scene.ui, h: 68 * scene.ui });
  if (gs === 'GAMEOVER' || gs === 'WON') items.push({ id: 'retry', x: uiRects.retry.x, y: uiRects.retry.y, w: uiRects.retry.w, h: uiRects.retry.h, pinned: true });
  if (helpOpen) items.push({ id: 'help_close', x: uiRects.helpClose.x, y: uiRects.helpClose.y, w: uiRects.helpClose.w, h: uiRects.helpClose.h, pinned: true });
  return { screen: helpOpen ? 'help' : gs, viewportW: GF.W, viewportH: GF.H, screenH: GF.H, scrollMaxY: 0, items: items };
});
GF.exposeTour([
  { name: 'play', go: function() { if (gs !== 'PLAYING') startGame({ suppressTutorial: true }); helpOpen = false; } },
  { name: 'help', go: function() { if (gs !== 'PLAYING') startGame({ suppressTutorial: true }); helpOpen = true; } },
  { name: 'gameover', go: function() { gameOver('reason_disturb'); helpOpen = false; } },
  { name: 'won', go: function() { winGame(); helpOpen = false; } }
]);

GF.init({
  designW: 440,
  designH: 760,
  strings: STRINGS,
  saveKey: 'exo_naturalists',
  onReady: function() {
    GF.persist('exo_naturalists_meta_v1', getMeta, applyMeta);
    GF.bgMusic({ file: 'audio/bg_track.mp3', preset: 'synth', muted: GF.muted });
    if (!started) {
      started = true;
      startGame({ suppressTutorial: !!(window.__GF_AUTOSTART && !window._silent) });
    }
  },
  onUpdate: update,
  onDraw: draw
});

})();
</script>
</body>
</html>
