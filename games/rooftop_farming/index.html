var GRID_W = 6;
var GRID_H = 5;
var START_WATER = 12;
var START_SEEDS = 11;
var START_COMPOST = 3;
var MAX_STRESS = 8;
var MAX_ROOF_LOAD = 34;
var BASE_HARVEST_TARGET = 9;
var WATER_TICK_SEC = 3.2;
var PEST_TICK_SEC = 6.5;
var TANK_LOAD = 7;
var COMPOST_LOAD = 3;
var SAVE_KEY = 'rooftop_farming_run_v1';

var CROP_TYPES = {
  basil:  { key: 'basil',  unlock: 1, seedCost: 1, waterCost: 1, load: 2, value: 3, grow: 0.070, thirst: 0.046, color: '#61ba6d', dark: '#2d7c44' },
  tomato: { key: 'tomato', unlock: 2, seedCost: 2, waterCost: 2, load: 3, value: 5, grow: 0.052, thirst: 0.058, color: '#e56758', dark: '#9e3a30' },
  berry:  { key: 'berry',  unlock: 5, seedCost: 3, waterCost: 2, load: 4, value: 8, grow: 0.042, thirst: 0.052, color: '#8d71df', dark: '#533c98' }
};
var TOOL_ORDER = ['basil', 'tomato', 'berry', 'tank', 'compost', 'remove'];

var gs = 'PLAYING';
var started = false;
var score = 0;
var best = 0;
var week = 1;
var water = START_WATER;
var seeds = START_SEEDS;
var compost = START_COMPOST;
var harvest = 0;
var harvestTarget = BASE_HARVEST_TARGET;
var stress = 0;
var roofLoad = 0;
var gameTime = 0;
var weekCompleteTimer = 0;
var waterTimer = WATER_TICK_SEC;
var pestTimer = PEST_TICK_SEC;
var gameOverReason = 'reason_stress';
var selectedTool = 'basil';
var cursor = { x: 2, y: 2 };
var tiles = [];
var tutorialDone = false;
var coachStep = 0;
var helpOpen = false;
var screenshotMode = false;
var lastPointer = null;
var dragMoved = false;
var ranFirstSave = false;

var scene = {
  ui: 1,
  top: 112,
  bottom: 112,
  x: 0,
  y: 0,
  w: 0,
  h: 0,
  tile: 48,
  gridX: 0,
  gridY: 0
};
var uiRects = {
  help: { x: 0, y: 0, w: 0, h: 0 },
  mute: { x: 0, y: 0, w: 0, h: 0 },
  retry: { x: 0, y: 0, w: 0, h: 0 },
  helpClose: { x: 0, y: 0, w: 0, h: 0 },
  tools: []
};

function clamp(v, lo, hi) { return v < lo ? lo : v > hi ? hi : v; }
function lerp(a, b, t) { return a + (b - a) * t; }
function irand(n) { return Math.floor(Math.random() * n); }
function tileIndex(x, y) { return y * GRID_W + x; }
function tileAt(x, y) { return tiles[tileIndex(x, y)]; }
function toolLabel(tool) {
  if (tool === 'compost') return GF.t('compost_bin');
  if (tool === 'tank') return GF.t('tank');
  if (tool === 'remove') return GF.t('remove');
  return GF.t(CROP_TYPES[tool].key);
}
function currentMaxLoad() { return Math.max(26, MAX_ROOF_LOAD - Math.max(0, week - 5)); }
function waterCap() { return 16 + countObjects('tank') * 5 + Math.floor(week / 3); }

function layout() {
  var raw = Math.min(GF.W / 440, GF.H / 760);
  scene.ui = clamp(raw, 0.72, 1.35);
  var ui = scene.ui;
  var narrow = GF.W < 520;
  scene.top = Math.round((narrow ? 128 : 98) * ui);
  scene.bottom = Math.round((narrow ? 120 : 112) * ui);
  scene.x = 0;
  scene.y = scene.top;
  scene.w = GF.W;
  scene.h = Math.max(140, GF.H - scene.top - scene.bottom);
  scene.tile = Math.floor(Math.min((scene.w - 24 * ui) / GRID_W, (scene.h - 26 * ui) / GRID_H));
  scene.tile = clamp(scene.tile, 36 * ui, 98 * ui);
  var gridW = scene.tile * GRID_W;
  var gridH = scene.tile * GRID_H;
  scene.gridX = Math.round((GF.W - gridW) / 2);
  scene.gridY = Math.round(scene.y + (scene.h - gridH) / 2 + 4 * ui);
  uiRects.help = { x: GF.W - 44 * ui, y: 9 * ui, w: 32 * ui, h: 32 * ui };
  uiRects.mute = { x: GF.W - 82 * ui, y: 9 * ui, w: 32 * ui, h: 32 * ui };
  uiRects.retry = { x: GF.cx - 78 * ui, y: GF.cy + 84 * ui, w: 156 * ui, h: 44 * ui };
  layoutTools();
}

function layoutTools() {
  var ui = scene.ui;
  var count = TOOL_ORDER.length;
  var gap = 6 * ui;
  var maxW = Math.min(GF.W - 18 * ui, 620 * ui);
  var bw = Math.floor((maxW - gap * (count - 1)) / count);
  bw = clamp(bw, 46 * ui, 88 * ui);
  var bh = clamp(54 * ui, 44, 66 * ui);
  var total = bw * count + gap * (count - 1);
  var x = Math.round((GF.W - total) / 2);
  var y = Math.round(GF.H - bh - 14 * ui);
  uiRects.tools = [];
  for (var i = 0; i < count; i++) {
    uiRects.tools.push({ tool: TOOL_ORDER[i], x: x + i * (bw + gap), y: y, w: bw, h: bh });
  }
}

function screenToTile(x, y) {
  var gx = Math.floor((x - scene.gridX) / scene.tile);
  var gy = Math.floor((y - scene.gridY) / scene.tile);
  if (gx < 0 || gy < 0 || gx >= GRID_W || gy >= GRID_H) return null;
  return { x: gx, y: gy, tile: tileAt(gx, gy) };
}

function makeTiles() {
  tiles = [];
  for (var y = 0; y < GRID_H; y++) {
    for (var x = 0; x < GRID_W; x++) {
      var edge = (x === 0 || x === GRID_W - 1 || y === 0 || y === GRID_H - 1) ? 1 : 0;
      var sun = ((x * 2 + y + 1) % 4 === 0 || y <= 1) ? 2 : ((x + y) % 3 === 0 ? 0 : 1);
      tiles.push({
        x: x,
        y: y,
        sun: sun,
        limit: 7 - edge - (sun === 0 ? 1 : 0),
        obj: null,
        pulse: Math.random() * 2
      });
    }
  }
}

function cropList() {
  var out = [];
  for (var i = 0; i < tiles.length; i++) {
    if (tiles[i].obj && tiles[i].obj.type === 'crop') out.push({ tile: tiles[i], obj: tiles[i].obj });
  }
  return out;
}

function countObjects(type) {
  var n = 0;
  for (var i = 0; i < tiles.length; i++) {
    if (tiles[i].obj && tiles[i].obj.type === type) n++;
  }
  return n;
}

function recalcLoad() {
  var n = 0;
  for (var i = 0; i < tiles.length; i++) {
    var o = tiles[i].obj;
    if (!o) continue;
    if (o.type === 'crop') n += CROP_TYPES[o.crop].load;
    else if (o.type === 'tank') n += TANK_LOAD;
    else if (o.type === 'compost') n += COMPOST_LOAD;
  }
  roofLoad = n;
}

function harvestTargetForWeek(n) {
  return BASE_HARVEST_TARGET + Math.max(0, n - 1) * 4 + (n >= 5 ? 4 : 0);
}

function startGame(opts) {
  opts = opts || {};
  gs = 'PLAYING';
  score = 0;
  week = 1;
  water = START_WATER;
  seeds = START_SEEDS;
  compost = START_COMPOST;
  harvest = 0;
  harvestTarget = harvestTargetForWeek(week);
  stress = 0;
  roofLoad = 0;
  gameTime = 0;
  weekCompleteTimer = 0;
  waterTimer = WATER_TICK_SEC;
  pestTimer = PEST_TICK_SEC;
  gameOverReason = 'reason_stress';
  selectedTool = 'basil';
  cursor.x = 2;
  cursor.y = 2;
  helpOpen = false;
  coachStep = (tutorialDone || opts.suppressTutorial) ? 99 : 0;
  makeTiles();
  recalcLoad();
  started = true;
  GF.gameStarted();
  saveRun();
}

function gameOver(reason) {
  if (gs === 'GAMEOVER') return;
  gameOverReason = reason || 'reason_stress';
  gs = 'GAMEOVER';
  var newBest = score > best;
  if (newBest) {
    best = score;
    GF.happytime();
  }
  GF.sfx('lose');
  GF.gameEnded();
  GF.setShake(0.45);
  GF.spawnParticles(GF.cx, scene.y + scene.h * 0.42, '#ff9b7f', 28);
  saveRun();
}

function saveRun() {
  if (!ranFirstSave && !started) return;
  ranFirstSave = true;
  GF.saveRun();
}

function serializeTiles() {
  var data = [];
  for (var i = 0; i < tiles.length; i++) {
    var o = tiles[i].obj;
    data.push(o ? {
      type: o.type,
      crop: o.crop || '',
      growth: o.growth || 0,
      water: o.water || 0,
      pest: !!o.pest,
      pestAge: o.pestAge || 0,
      dryHits: o.dryHits || 0
    } : null);
  }
  return data;
}

function applySerializedTiles(data) {
  makeTiles();
  if (!Array.isArray(data)) return;
  for (var i = 0; i < Math.min(data.length, tiles.length); i++) {
    var s = data[i];
    if (!s || !s.type) continue;
    if (s.type === 'crop' && CROP_TYPES[s.crop]) {
      tiles[i].obj = {
        type: 'crop',
        crop: s.crop,
        growth: clamp(Number(s.growth) || 0, 0, 1),
        water: clamp(Number(s.water) || 0, 0, 1),
        pest: !!s.pest,
        pestAge: Math.max(0, Number(s.pestAge) || 0),
        dryHits: Math.max(0, Number(s.dryHits) || 0)
      };
    } else if (s.type === 'tank') {
      tiles[i].obj = { type: 'tank' };
    } else if (s.type === 'compost') {
      tiles[i].obj = { type: 'compost' };
    }
  }
}

function getPersistState() {
  return {
    v: 1,
    gs: gs,
    score: score,
    best: best,
    week: week,
    water: water,
    seeds: seeds,
    compost: compost,
    harvest: harvest,
    harvestTarget: harvestTarget,
    stress: stress,
    selectedTool: selectedTool,
    cursor: { x: cursor.x, y: cursor.y },
    tutorialDone: tutorialDone,
    coachStep: coachStep,
    gameOverReason: gameOverReason,
    tiles: serializeTiles()
  };
}

function applyPersistState(s) {
  if (!s || s.v !== 1) return;
  best = Math.max(0, Number(s.best) || 0);
  tutorialDone = !!s.tutorialDone;
  if (s.gs !== 'PLAYING') return;
  gs = 'PLAYING';
  score = Math.max(0, Number(s.score) || 0);
  week = clamp(Math.floor(Number(s.week) || 1), 1, 99);
  water = clamp(Number(s.water) || START_WATER, 0, 99);
  seeds = clamp(Math.floor(Number(s.seeds) || START_SEEDS), 0, 99);
  compost = clamp(Math.floor(Number(s.compost) || START_COMPOST), 0, 99);
  harvest = clamp(Number(s.harvest) || 0, 0, 999);
  harvestTarget = Math.max(1, Number(s.harvestTarget) || harvestTargetForWeek(week));
  stress = clamp(Number(s.stress) || 0, 0, MAX_STRESS - 1);
  selectedTool = TOOL_ORDER.indexOf(s.selectedTool) >= 0 ? s.selectedTool : 'basil';
  if (s.cursor) {
    cursor.x = clamp(Math.floor(Number(s.cursor.x) || 0), 0, GRID_W - 1);
    cursor.y = clamp(Math.floor(Number(s.cursor.y) || 0), 0, GRID_H - 1);
  }
  coachStep = tutorialDone ? 99 : clamp(Math.floor(Number(s.coachStep) || 0), 0, 99);
  gameOverReason = s.gameOverReason || 'reason_stress';
  applySerializedTiles(s.tiles);
  recalcLoad();
  started = true;
}

function canUseTool(tool) {
  if (CROP_TYPES[tool]) return week >= CROP_TYPES[tool].unlock;
  return true;
}

function hasCompostNeighbor(tile) {
  var dirs = [[1,0],[-1,0],[0,1],[0,-1]];
  for (var i = 0; i < dirs.length; i++) {
    var nx = tile.x + dirs[i][0];
    var ny = tile.y + dirs[i][1];
    if (nx < 0 || ny < 0 || nx >= GRID_W || ny >= GRID_H) continue;
    var o = tileAt(nx, ny).obj;
    if (o && o.type === 'compost') return true;
  }
  return false;
}

function selectTool(tool) {
  if (TOOL_ORDER.indexOf(tool) < 0) return;
  if (!canUseTool(tool)) {
    GF.sfx('hit');
    GF.spawnFloat(GF.cx, GF.H - 92 * scene.ui, GF.t('locked'), '#ffc06a');
    return;
  }
  selectedTool = tool;
  GF.sfx('click');
}

function addStress(amount, x, y) {
  if (coachStep < 2 && !tutorialDone && !screenshotMode) return;
  stress = clamp(stress + amount, 0, MAX_STRESS);
  GF.sfx('hit');
  if (x !== undefined) GF.spawnFloat(x, y, GF.t('stress') + ' +' + amount, '#ff9b7f');
  if (stress >= MAX_STRESS) gameOver('reason_stress');
  saveRun();
}

function plantCrop(tile, crop) {
  var spec = CROP_TYPES[crop];
  if (!spec || !canUseTool(crop)) return false;
  if (tile.obj) return tendTile(tile);
  if (seeds < spec.seedCost) {
    GF.sfx('hit');
    GF.spawnFloat(tileCenterX(tile), tileCenterY(tile), GF.t('not_enough'), '#ffc06a');
    return false;
  }
  if (roofLoad + spec.load > currentMaxLoad() + 4) {
    GF.sfx('hit');
    GF.spawnFloat(tileCenterX(tile), tileCenterY(tile), GF.t('too_heavy'), '#ff9b7f');
    return false;
  }
  seeds -= spec.seedCost;
  tile.obj = { type: 'crop', crop: crop, growth: 0, water: 0.42, pest: false, pestAge: 0, dryHits: 0 };
  recalcLoad();
  GF.sfx('spawn');
  GF.spawnParticles(tileCenterX(tile), tileCenterY(tile), spec.color, 16);
  GF.spawnFloat(tileCenterX(tile), tileCenterY(tile) - 8 * scene.ui, GF.t('planted'), '#d4f19f');
  advanceCoach('plant');
  if (roofLoad > currentMaxLoad()) gameOver('reason_load');
  saveRun();
  return true;
}

function placeTank(tile) {
  if (tile.obj) return false;
  if (roofLoad + TANK_LOAD > currentMaxLoad() + 2) {
    GF.sfx('hit');
    GF.spawnFloat(tileCenterX(tile), tileCenterY(tile), GF.t('too_heavy'), '#ff9b7f');
    return false;
  }
  tile.obj = { type: 'tank' };
  water = clamp(water + 3, 0, waterCap() + 5);
  recalcLoad();
  GF.sfx('unlock');
  GF.spawnParticles(tileCenterX(tile), tileCenterY(tile), '#7bc9ef', 18);
  GF.spawnFloat(tileCenterX(tile), tileCenterY(tile), GF.t('built'), '#bfeaff');
  advanceCoach('build');
  if (roofLoad > currentMaxLoad()) gameOver('reason_load');
  saveRun();
  return true;
}

function placeCompost(tile) {
  if (tile.obj) return false;
  if (compost <= 0) {
    GF.sfx('hit');
    GF.spawnFloat(tileCenterX(tile), tileCenterY(tile), GF.t('not_enough'), '#ffc06a');
    return false;
  }
  if (roofLoad + COMPOST_LOAD > currentMaxLoad() + 2) {
    GF.sfx('hit');
    GF.spawnFloat(tileCenterX(tile), tileCenterY(tile), GF.t('too_heavy'), '#ff9b7f');
    return false;
  }
  compost -= 1;
  tile.obj = { type: 'compost' };
  recalcLoad();
  GF.sfx('unlock');
  GF.spawnParticles(tileCenterX(tile), tileCenterY(tile), '#9b6a42', 16);
  GF.spawnFloat(tileCenterX(tile), tileCenterY(tile), GF.t('built'), '#e2c391');
  advanceCoach('build');
  saveRun();
  return true;
}

function removeObject(tile) {
  if (!tile.obj) return false;
  var o = tile.obj;
  if (o.type === 'crop' && o.growth > 0.72) {
    seeds += 1;
  } else if (o.type === 'compost') {
    compost += 1;
  }
  tile.obj = null;
  recalcLoad();
  GF.sfx('click');
  GF.spawnParticles(tileCenterX(tile), tileCenterY(tile), '#cfc6aa', 12);
  GF.spawnFloat(tileCenterX(tile), tileCenterY(tile), GF.t('cleared'), '#e8dfc7');
  saveRun();
  return true;
}

function tendTile(tile) {
  if (!tile.obj) return false;
  var o = tile.obj;
  if (o.type !== 'crop') return false;
  var x = tileCenterX(tile);
  var y = tileCenterY(tile);
  if (o.pest) {
    o.pest = false;
    o.pestAge = 0;
    o.growth = clamp(o.growth + (hasCompostNeighbor(tile) ? 0.08 : 0.04), 0, 1);
    GF.sfx('hit');
    GF.spawnParticles(x, y, '#f6d45f', 14);
    GF.spawnFloat(x, y, GF.t('cleared'), '#f7e38a');
    saveRun();
    return true;
  }
  if (o.growth >= 1) {
    harvestCrop(tile);
    return true;
  }
  var spec = CROP_TYPES[o.crop];
  if (water < spec.waterCost) {
    GF.sfx('hit');
    GF.spawnFloat(x, y, GF.t('not_enough'), '#ffc06a');
    return false;
  }
  water -= spec.waterCost;
  o.water = 1;
  o.dryHits = 0;
  o.growth = clamp(o.growth + (hasCompostNeighbor(tile) ? 0.12 : 0.07), 0, 1);
  GF.sfx('click');
  GF.spawnParticles(x, y, '#79c6e8', 12);
  GF.spawnFloat(x, y - 8 * scene.ui, GF.t('watered'), '#bfeaff');
  advanceCoach('water');
  if (o.growth >= 1) {
    GF.spawnFloat(x, y - 22 * scene.ui, GF.t('ready'), '#f6e88e');
  }
  saveRun();
  return true;
}

function harvestCrop(tile) {
  var o = tile.obj;
  if (!o || o.type !== 'crop') return;
  var spec = CROP_TYPES[o.crop];
  var bonus = tile.sun === 2 ? 1 : tile.sun === 0 ? -1 : 0;
  var value = Math.max(1, spec.value + bonus + (hasCompostNeighbor(tile) ? 1 : 0));
  harvest += value;
  score += value * 12 + week * 3;
  seeds += o.crop === 'berry' ? 0 : 1;
  if (Math.random() < 0.18 || week >= 6) compost += Math.random() < 0.5 ? 1 : 0;
  tile.obj = null;
  recalcLoad();
  GF.sfx('coin');
  GF.spawnParticles(tileCenterX(tile), tileCenterY(tile), spec.color, 26);
  GF.spawnFloat(tileCenterX(tile), tileCenterY(tile) - 12 * scene.ui, '+' + value + ' ' + GF.t('harvest'), '#f7e38a');
  advanceCoach('harvest');
  if (harvest >= harvestTarget) completeWeek();
  saveRun();
}

function completeWeek() {
  weekCompleteTimer = 2.2;
  GF.sfx('levelup');
  GF.setShake(0.22);
  GF.spawnParticles(GF.cx, scene.y + scene.h * 0.38, '#f7df7a', 32);
  GF.spawnFloat(GF.cx, scene.y + 58 * scene.ui, GF.t('week_done'), '#f8e996');
  week += 1;
  harvest = 0;
  harvestTarget = harvestTargetForWeek(week);
  water = clamp(water + 6 + countObjects('tank') * 2, 0, waterCap());
  seeds += 4 + Math.floor(week / 2);
  compost += week >= 4 ? 1 : 0;
  stress = Math.max(0, stress - 2);
  pestTimer = Math.max(2.2, PEST_TICK_SEC - week * 0.35);
}

function applyTileAction(tile) {
  if (!tile || gs !== 'PLAYING') return false;
  cursor.x = tile.x;
  cursor.y = tile.y;
  if (tile.obj && tile.obj.type === 'crop') return tendTile(tile);
  if (selectedTool === 'tank') return placeTank(tile);
  if (selectedTool === 'compost') return placeCompost(tile);
  if (selectedTool === 'remove') return removeObject(tile);
  if (CROP_TYPES[selectedTool]) return plantCrop(tile, selectedTool);
  return false;
}

function update(dt) {
  if (gs !== 'PLAYING') return;
  dt = Math.min(dt, 0.08);
  gameTime += dt;
  if (weekCompleteTimer > 0) weekCompleteTimer -= dt;
  updateCrops(dt);
  updateWaterEconomy(dt);
  updatePests(dt);
  recalcLoad();
  if (roofLoad > currentMaxLoad()) gameOver('reason_load');
}

function updateCrops(dt) {
  var c = cropList();
  for (var i = 0; i < c.length; i++) {
    var tile = c[i].tile;
    var obj = c[i].obj;
    var spec = CROP_TYPES[obj.crop];
    obj.water = clamp(obj.water - spec.thirst * dt * (obj.pest ? 1.65 : 1), 0, 1);
    if (obj.water > 0.03 && !obj.pest) {
      var sunBoost = tile.sun === 2 ? 1.22 : tile.sun === 0 ? 0.76 : 1;
      var compostBoost = hasCompostNeighbor(tile) ? 1.30 : 1;
      var coachBoost = (!tutorialDone && coachStep < 3) ? 1.9 : 1;
      obj.growth = clamp(obj.growth + spec.grow * sunBoost * compostBoost * coachBoost * dt, 0, 1);
    }
  }
}

function updateWaterEconomy(dt) {
  waterTimer -= dt;
  if (waterTimer > 0) return;
  waterTimer += WATER_TICK_SEC;
  water = clamp(water + 1 + countObjects('tank'), 0, waterCap());
  var crops = cropList();
  for (var i = 0; i < crops.length; i++) {
    var tile = crops[i].tile;
    var obj = crops[i].obj;
    if (obj.water <= 0.02 && obj.growth < 1) {
      obj.dryHits += 1;
      addStress(1, tileCenterX(tile), tileCenterY(tile));
      if (obj.dryHits >= 3) {
        GF.spawnFloat(tileCenterX(tile), tileCenterY(tile), GF.t('dry'), '#ffb089');
        tile.obj = null;
        recalcLoad();
      }
    }
  }
}

function updatePests(dt) {
  var crops = cropList();
  for (var i = 0; i < crops.length; i++) {
    var o = crops[i].obj;
    if (!o.pest) continue;
    o.pestAge += dt;
    if (o.pestAge > 6.8) {
      o.pestAge = 0;
      addStress(1, tileCenterX(crops[i].tile), tileCenterY(crops[i].tile));
      o.growth = Math.max(0, o.growth - 0.12);
    }
  }
  if (week < 3 || crops.length === 0) return;
  if (!tutorialDone && coachStep < 3) return;
  pestTimer -= dt;
  if (pestTimer > 0) return;
  pestTimer = Math.max(2.6, PEST_TICK_SEC - week * 0.42 + Math.random() * 2.2);
  var choices = [];
  for (var j = 0; j < crops.length; j++) {
    if (!crops[j].obj.pest && crops[j].obj.growth < 1) choices.push(crops[j]);
  }
  if (!choices.length) return;
  var pick = choices[irand(choices.length)];
  var resist = hasCompostNeighbor(pick.tile) ? 0.45 : 0;
  if (Math.random() < resist) return;
  pick.obj.pest = true;
  pick.obj.pestAge = 0;
  GF.sfx('hit');
  GF.spawnFloat(tileCenterX(pick.tile), tileCenterY(pick.tile), GF.t('pest'), '#f5d66c');
}

function advanceCoach(action) {
  if (tutorialDone || screenshotMode) return;
  if (coachStep === 0 && action === 'plant') coachStep = 1;
  else if (coachStep === 1 && action === 'water') coachStep = 2;
  else if (coachStep === 2 && action === 'harvest') coachStep = 3;
  else if (coachStep === 3 && action === 'build') {
    coachStep = 99;
    tutorialDone = true;
  } else {
    return;
  }
  saveRun();
}

function tileCenterX(tile) { return scene.gridX + tile.x * scene.tile + scene.tile / 2; }
function tileCenterY(tile) { return scene.gridY + tile.y * scene.tile + scene.tile / 2; }

function draw(ctx) {
  layout();
  ctx.clearRect(0, 0, GF.W, GF.H);
  drawBackground(ctx);
  drawRoof(ctx);
  drawHUD(ctx);
  drawToolbar(ctx);
  drawWeekBanner(ctx);
  drawCoach(ctx);
  drawHelp(ctx);
  drawGameOver(ctx);
}

function roundRect(c, x, y, w, h, r) {
  GF.rr(c, x, y, w, h, r);
}

function fs(px) {
  return Math.max(9, Math.round(px * scene.ui));
}

function drawText(c, text, x, y, size, color, align, weight) {
  c.font = (weight || '700') + ' ' + size + 'px sans-serif';
  c.textAlign = align || 'left';
  c.textBaseline = 'middle';
  c.fillStyle = color;
  c.fillText(text, x, y);
}

function fitText(c, text, x, y, maxW, size, color, align, weight) {
  var s = size;
  c.textAlign = align || 'left';
  c.textBaseline = 'middle';
  c.fillStyle = color;
  while (s > 8) {
    c.font = (weight || '700') + ' ' + s + 'px sans-serif';
    if (c.measureText(text).width <= maxW) break;
    s -= 1;
  }
  c.fillText(text, x, y);
}

function wrapLines(c, text, maxW, size, weight) {
  c.font = (weight || '650') + ' ' + size + 'px sans-serif';
  var words = String(text).split(/\s+/);
  var lines = [];
  var line = '';
  for (var i = 0; i < words.length; i++) {
    var test = line ? line + ' ' + words[i] : words[i];
    if (line && c.measureText(test).width > maxW) {
      lines.push(line);
      line = words[i];
    } else {
      line = test;
    }
  }
  if (line) lines.push(line);
  return lines;
}

function drawBackground(c) {
  var g = c.createLinearGradient(0, 0, 0, GF.H);
  g.addColorStop(0, '#8dc6d0');
  g.addColorStop(0.34, '#f2b172');
  g.addColorStop(0.62, '#31444b');
  g.addColorStop(1, '#202f2f');
  c.fillStyle = g;
  c.fillRect(0, 0, GF.W, GF.H);

  c.fillStyle = 'rgba(23, 40, 48, 0.75)';
  var baseY = scene.y + scene.h * 0.18;
  for (var i = 0; i < 12; i++) {
    var w = (42 + (i % 4) * 22) * scene.ui;
    var h = (60 + (i % 5) * 28) * scene.ui;
    var x = (i * GF.W / 10.5) - 40 * scene.ui;
    c.fillRect(x, baseY - h, w, h);
    c.fillStyle = i % 2 ? 'rgba(23, 40, 48, 0.68)' : 'rgba(14, 30, 38, 0.82)';
  }

  c.fillStyle = '#5b5f50';
  c.fillRect(0, scene.y + scene.h - 18 * scene.ui, GF.W, 20 * scene.ui);
  c.fillStyle = 'rgba(255,255,255,0.08)';
  c.fillRect(0, scene.y, GF.W, 1);
  c.fillRect(0, scene.y + scene.h, GF.W, 1);
}

function drawRoof(c) {
  var ui = scene.ui;
  var pad = 10 * ui;
  var x = scene.gridX - pad;
  var y = scene.gridY - pad;
  var w = scene.tile * GRID_W + pad * 2;
  var h = scene.tile * GRID_H + pad * 2;
  c.fillStyle = 'rgba(25, 33, 30, 0.34)';
  roundRect(c, x + 7 * ui, y + 10 * ui, w, h, 8 * ui);
  c.fill();
  c.fillStyle = '#536250';
  roundRect(c, x, y, w, h, 8 * ui);
  c.fill();
  c.strokeStyle = 'rgba(255,255,255,0.18)';
  c.lineWidth = Math.max(1, 2 * ui);
  c.stroke();

  drawRoofDetails(c, x, y, w, h);

  for (var i = 0; i < tiles.length; i++) drawTile(c, tiles[i]);
}

function drawRoofDetails(c, x, y, w, h) {
  var ui = scene.ui;
  c.strokeStyle = 'rgba(37, 47, 43, 0.55)';
  c.lineWidth = Math.max(1, 2 * ui);
  for (var i = 0; i < 4; i++) {
    c.beginPath();
    c.moveTo(x + 18 * ui + i * 36 * ui, y + h + 3 * ui);
    c.lineTo(x + 36 * ui + i * 42 * ui, y + h + 16 * ui);
    c.stroke();
  }
  c.fillStyle = '#6f776c';
  roundRect(c, x + w - 72 * ui, y - 18 * ui, 46 * ui, 20 * ui, 5 * ui);
  c.fill();
  c.fillStyle = '#414d4f';
  roundRect(c, x + 24 * ui, y - 15 * ui, 32 * ui, 18 * ui, 5 * ui);
  c.fill();
}

function drawTile(c, tile) {
  var ui = scene.ui;
  var x = scene.gridX + tile.x * scene.tile;
  var y = scene.gridY + tile.y * scene.tile;
  var s = scene.tile;
  var sunColor = tile.sun === 2 ? '#7c8e62' : tile.sun === 0 ? '#495d5a' : '#64735b';
  var g = c.createLinearGradient(x, y, x, y + s);
  g.addColorStop(0, sunColor);
  g.addColorStop(1, '#404c44');
  c.fillStyle = g;
  roundRect(c, x + 2 * ui, y + 2 * ui, s - 4 * ui, s - 4 * ui, 7 * ui);
  c.fill();
  c.strokeStyle = 'rgba(28,37,33,0.55)';
  c.lineWidth = Math.max(1, 1.5 * ui);
  c.stroke();

  if (tile.sun === 2) drawSunMark(c, x + s - 16 * ui, y + 15 * ui, 5 * ui, '#f7d56d');
  if (tile.sun === 0) drawShadeMark(c, x + s - 17 * ui, y + 16 * ui, 7 * ui);

  var o = tile.obj;
  if (o && o.type === 'crop') drawCrop(c, tile, o);
  else if (o && o.type === 'tank') drawTank(c, tile);
  else if (o && o.type === 'compost') drawCompost(c, tile);
  else drawEmptyHint(c, tile);

  if (tile.x === cursor.x && tile.y === cursor.y && gs === 'PLAYING') {
    c.strokeStyle = '#f8e991';
    c.lineWidth = Math.max(2, 3 * ui);
    roundRect(c, x + 4 * ui, y + 4 * ui, s - 8 * ui, s - 8 * ui, 7 * ui);
    c.stroke();
  }
}

function drawEmptyHint(c, tile) {
  var ui = scene.ui;
  var x = scene.gridX + tile.x * scene.tile;
  var y = scene.gridY + tile.y * scene.tile;
  var s = scene.tile;
  c.fillStyle = 'rgba(255,255,255,0.08)';
  c.fillRect(x + s * 0.26, y + s * 0.58, s * 0.48, Math.max(2, 3 * ui));
  c.fillRect(x + s * 0.32, y + s * 0.38, s * 0.36, Math.max(2, 3 * ui));
}

function drawCrop(c, tile, obj) {
  var ui = scene.ui;
  var spec = CROP_TYPES[obj.crop];
  var cx = tileCenterX(tile);
  var cy = tileCenterY(tile);
  var s = scene.tile;
  var mature = obj.growth >= 1;
  c.fillStyle = '#6b4d32';
  roundRect(c, cx - s * 0.28, cy + s * 0.08, s * 0.56, s * 0.21, 6 * ui);
  c.fill();
  c.fillStyle = '#453326';
  roundRect(c, cx - s * 0.23, cy + s * 0.02, s * 0.46, s * 0.15, 4 * ui);
  c.fill();

  var leafCount = obj.crop === 'basil' ? 5 : obj.crop === 'tomato' ? 6 : 7;
  var spread = lerp(0.16, 0.42, obj.growth);
  for (var i = 0; i < leafCount; i++) {
    var a = -Math.PI / 2 + (i - (leafCount - 1) / 2) * 0.45;
    var len = s * spread * (0.75 + (i % 2) * 0.22);
    c.save();
    c.translate(cx, cy + s * 0.04);
    c.rotate(a);
    c.fillStyle = i % 2 ? spec.color : spec.dark;
    c.beginPath();
    c.ellipse(0, -len * 0.44, s * 0.08 + obj.growth * s * 0.035, len * 0.42, 0, 0, Math.PI * 2);
    c.fill();
    c.restore();
  }

  if (obj.crop === 'tomato' && obj.growth > 0.55) drawFruitDots(c, cx, cy - s * 0.13, '#e95b4f', Math.floor(2 + obj.growth * 4), s * 0.19);
  if (obj.crop === 'berry' && obj.growth > 0.55) drawFruitDots(c, cx, cy - s * 0.13, '#765fd6', Math.floor(3 + obj.growth * 5), s * 0.20);

  drawBar(c, cx - s * 0.32, cy + s * 0.34, s * 0.64, 4 * ui, obj.growth, '#dfe58f');
  drawBar(c, cx - s * 0.32, cy + s * 0.42, s * 0.64, 4 * ui, obj.water, '#77d2ef');
  if (obj.water <= 0.12 && obj.growth < 1) drawWarningRing(c, cx, cy, s * 0.38, '#ffae7d');
  if (mature) drawWarningRing(c, cx, cy, s * 0.42, '#f9e87d');
  if (obj.pest) drawPest(c, cx + s * 0.23, cy - s * 0.18, s * 0.10);
}

function drawFruitDots(c, cx, cy, color, n, r) {
  c.fillStyle = color;
  for (var i = 0; i < n; i++) {
    var a = i * 2.399;
    var d = r * (0.25 + (i % 3) * 0.22);
    c.beginPath();
    c.arc(cx + Math.cos(a) * d, cy + Math.sin(a) * d, Math.max(2, scene.tile * 0.035), 0, Math.PI * 2);
    c.fill();
  }
}

function drawTank(c, tile) {
  var ui = scene.ui;
  var cx = tileCenterX(tile);
  var cy = tileCenterY(tile);
  var s = scene.tile;
  var grad = c.createLinearGradient(cx - s * 0.2, cy - s * 0.32, cx + s * 0.2, cy + s * 0.26);
  grad.addColorStop(0, '#d6eef5');
  grad.addColorStop(0.42, '#7dbfd2');
  grad.addColorStop(1, '#477f98');
  c.fillStyle = grad;
  roundRect(c, cx - s * 0.24, cy - s * 0.32, s * 0.48, s * 0.62, 10 * ui);
  c.fill();
  c.strokeStyle = '#2e5867';
  c.stroke();
  c.fillStyle = 'rgba(255,255,255,0.32)';
  c.fillRect(cx - s * 0.16, cy - s * 0.24, s * 0.08, s * 0.43);
  drawWarningRing(c, cx, cy, s * 0.42, roofLoad > currentMaxLoad() - 5 ? '#ffae7d' : '#86d8ef');
}

function drawCompost(c, tile) {
  var ui = scene.ui;
  var cx = tileCenterX(tile);
  var cy = tileCenterY(tile);
  var s = scene.tile;
  c.fillStyle = '#72513a';
  roundRect(c, cx - s * 0.28, cy - s * 0.18, s * 0.56, s * 0.42, 7 * ui);
  c.fill();
  c.fillStyle = '#9b6a42';
  roundRect(c, cx - s * 0.23, cy - s * 0.25, s * 0.46, s * 0.13, 5 * ui);
  c.fill();
  c.strokeStyle = '#3f3125';
  c.stroke();
  c.fillStyle = '#acd68b';
  c.beginPath();
  c.arc(cx - s * 0.11, cy - s * 0.01, s * 0.045, 0, Math.PI * 2);
  c.arc(cx + s * 0.08, cy + s * 0.05, s * 0.04, 0, Math.PI * 2);
  c.fill();
}

function drawPest(c, x, y, r) {
  c.fillStyle = '#322b1f';
  c.beginPath();
  c.arc(x, y, r, 0, Math.PI * 2);
  c.fill();
  c.strokeStyle = '#f6d45f';
  c.lineWidth = Math.max(1, 2 * scene.ui);
  for (var i = 0; i < 4; i++) {
    var a = i * Math.PI / 2 + 0.5;
    c.beginPath();
    c.moveTo(x + Math.cos(a) * r * 0.4, y + Math.sin(a) * r * 0.4);
    c.lineTo(x + Math.cos(a) * r * 1.7, y + Math.sin(a) * r * 1.7);
    c.stroke();
  }
}

function drawSunMark(c, x, y, r, color) {
  c.fillStyle = color;
  c.beginPath();
  c.arc(x, y, r, 0, Math.PI * 2);
  c.fill();
  c.strokeStyle = color;
  c.lineWidth = Math.max(1, 1.4 * scene.ui);
  for (var i = 0; i < 8; i++) {
    var a = i * Math.PI / 4;
    c.beginPath();
    c.moveTo(x + Math.cos(a) * r * 1.45, y + Math.sin(a) * r * 1.45);
    c.lineTo(x + Math.cos(a) * r * 2.05, y + Math.sin(a) * r * 2.05);
    c.stroke();
  }
}

function drawShadeMark(c, x, y, r) {
  c.fillStyle = '#b2c9ca';
  c.beginPath();
  c.arc(x, y, r, Math.PI * 0.15, Math.PI * 1.85);
  c.arc(x + r * 0.45, y - r * 0.2, r * 0.78, Math.PI * 1.6, Math.PI * 0.55, true);
  c.fill();
}

function drawBar(c, x, y, w, h, value, color) {
  roundRect(c, x, y, w, h, h / 2);
  c.fillStyle = 'rgba(12,18,16,0.42)';
  c.fill();
  roundRect(c, x, y, w * clamp(value, 0, 1), h, h / 2);
  c.fillStyle = color;
  c.fill();
}

function drawWarningRing(c, x, y, r, color) {
  var pulse = 0.5 + Math.sin(gameTime * 5) * 0.25;
  c.globalAlpha = clamp(pulse, 0.25, 0.8);
  c.strokeStyle = color;
  c.lineWidth = Math.max(2, 3 * scene.ui);
  c.beginPath();
  c.arc(x, y, r, 0, Math.PI * 2);
  c.stroke();
  c.globalAlpha = 1;
}

function drawHUD(c) {
  var ui = scene.ui;
  var narrow = GF.W < 520;
  c.fillStyle = 'rgba(22, 34, 32, 0.88)';
  c.fillRect(0, 0, GF.W, scene.top);
  c.fillStyle = 'rgba(20, 30, 27, 0.92)';
  c.fillRect(0, scene.y + scene.h, GF.W, scene.bottom);

  drawIconButton(c, uiRects.help, GF.t('help_btn'));
  GF.drawMuteIcon(c, uiRects.mute.x + uiRects.mute.w / 2, uiRects.mute.y + uiRects.mute.h / 2, uiRects.mute.w * 0.48, GF.muted);

  var title = GF.t('short_title');
  if (narrow) {
    fitText(c, title, 10 * ui, 23 * ui, GF.W - 112 * ui, fs(16), '#f7e9b3', 'left', '850');
    fitText(c, GF.t('week') + ' ' + week + '  ' + GF.t('score') + ' ' + score, 10 * ui, 47 * ui, GF.W - 20 * ui, fs(12), '#dce8c9', 'left', '750');
    drawProgress(c, 12 * ui, 66 * ui, GF.W - 24 * ui, 13 * ui);
    var row1 = GF.t('water') + ' ' + Math.floor(water) + '/' + waterCap() + '  ' + GF.t('seeds') + ' ' + seeds + '  ' + GF.t('compost') + ' ' + compost;
    fitText(c, row1, GF.cx, 92 * ui, GF.W - 18 * ui, fs(11), '#d3e7dc', 'center', '700');
    var row2 = GF.t('stress') + ' ' + stress + '/' + MAX_STRESS + '  ' + GF.t('load') + ' ' + roofLoad + '/' + currentMaxLoad();
    fitText(c, row2, GF.cx, 112 * ui, GF.W - 18 * ui, fs(11), roofLoad > currentMaxLoad() - 5 || stress >= 6 ? '#ffbc91' : '#e4debf', 'center', '800');
  } else {
    fitText(c, title, 14 * ui, 24 * ui, GF.W * 0.30, fs(17), '#f7e9b3', 'left', '850');
    fitText(c, GF.t('week') + ' ' + week + '  ' + GF.t('score') + ' ' + score + '  ' + GF.t('best') + ' ' + best, 14 * ui, 52 * ui, GF.W * 0.34, fs(13), '#dce8c9', 'left', '750');
    drawProgress(c, GF.W * 0.36, 27 * ui, GF.W * 0.28, 17 * ui);
    fitText(c, GF.t('harvest') + ' ' + harvest + '/' + harvestTarget, GF.cx, 63 * ui, GF.W * 0.28, fs(13), '#f8e996', 'center', '800');
    var right = GF.W - 96 * ui;
    fitText(c, GF.t('water') + ' ' + Math.floor(water) + '/' + waterCap(), right, 24 * ui, 92 * ui, fs(12), '#bfeaff', 'right', '800');
    fitText(c, GF.t('seeds') + ' ' + seeds + '  ' + GF.t('compost') + ' ' + compost, right, 47 * ui, 128 * ui, fs(12), '#dce8c9', 'right', '800');
    fitText(c, GF.t('stress') + ' ' + stress + '/' + MAX_STRESS + '  ' + GF.t('load') + ' ' + roofLoad + '/' + currentMaxLoad(), right, 70 * ui, 150 * ui, fs(12), roofLoad > currentMaxLoad() - 5 || stress >= 6 ? '#ffbc91' : '#e4debf', 'right', '800');
  }
}

function drawProgress(c, x, y, w, h) {
  roundRect(c, x, y, w, h, h / 2);
  c.fillStyle = 'rgba(10,18,15,0.58)';
  c.fill();
  var pct = clamp(harvest / Math.max(1, harvestTarget), 0, 1);
  roundRect(c, x, y, w * pct, h, h / 2);
  var g = c.createLinearGradient(x, y, x + w, y);
  g.addColorStop(0, '#7ecb6e');
  g.addColorStop(0.55, '#f4df72');
  g.addColorStop(1, '#efac52');
  c.fillStyle = g;
  c.fill();
  c.strokeStyle = 'rgba(255,255,255,0.22)';
  c.stroke();
}

function drawIconButton(c, r, label) {
  c.fillStyle = 'rgba(241,230,166,0.18)';
  roundRect(c, r.x, r.y, r.w, r.h, 8 * scene.ui);
  c.fill();
  c.strokeStyle = 'rgba(255,255,255,0.18)';
  c.stroke();
  fitText(c, label, r.x + r.w / 2, r.y + r.h / 2 + 1 * scene.ui, r.w - 8 * scene.ui, fs(15), '#fff3b8', 'center', '850');
}

function drawToolbar(c) {
  var ui = scene.ui;
  for (var i = 0; i < uiRects.tools.length; i++) {
    var r = uiRects.tools[i];
    var selected = r.tool === selectedTool;
    var locked = !canUseTool(r.tool);
    c.fillStyle = selected ? '#f4dc72' : 'rgba(230, 226, 182, 0.16)';
    roundRect(c, r.x, r.y, r.w, r.h, 8 * ui);
    c.fill();
    c.strokeStyle = selected ? '#fff1a5' : 'rgba(255,255,255,0.18)';
    c.lineWidth = selected ? Math.max(2, 2.2 * ui) : 1;
    c.stroke();
    drawToolIcon(c, r.tool, r.x + r.w / 2, r.y + r.h * 0.35, Math.min(r.w, r.h) * 0.22, locked);
    var col = selected ? '#203018' : locked ? '#9fa29a' : '#e9edcf';
    fitText(c, locked ? GF.t('locked') : toolLabel(r.tool), r.x + r.w / 2, r.y + r.h * 0.76, r.w - 6 * ui, fs(10), col, 'center', '800');
  }
  var tile = tileAt(cursor.x, cursor.y);
  var info = GF.t('tool') + ': ' + toolLabel(selectedTool) + '   ';
  if (tile && tile.obj && tile.obj.type === 'crop') {
    info += GF.t(CROP_TYPES[tile.obj.crop].key) + ' ' + Math.round(tile.obj.growth * 100) + '%';
  } else if (tile && tile.obj) {
    info += toolLabel(tile.obj.type === 'compost' ? 'compost' : tile.obj.type);
  } else {
    info += GF.t('empty');
  }
  fitText(c, info, GF.cx, GF.H - 10 * ui, GF.W - 18 * ui, fs(11), '#e7edd5', 'center', '700');
}

function drawToolIcon(c, tool, x, y, r, locked) {
  c.save();
  c.globalAlpha = locked ? 0.42 : 1;
  if (CROP_TYPES[tool]) {
    var spec = CROP_TYPES[tool];
    c.fillStyle = '#60442d';
    roundRect(c, x - r * 1.25, y + r * 0.45, r * 2.5, r * 0.7, r * 0.18);
    c.fill();
    c.fillStyle = spec.color;
    c.beginPath();
    c.ellipse(x - r * 0.25, y, r * 0.55, r * 0.9, -0.6, 0, Math.PI * 2);
    c.ellipse(x + r * 0.35, y, r * 0.5, r * 0.82, 0.55, 0, Math.PI * 2);
    c.fill();
  } else if (tool === 'tank') {
    c.fillStyle = '#8fd4e8';
    roundRect(c, x - r * 0.85, y - r, r * 1.7, r * 2.0, r * 0.35);
    c.fill();
    c.fillStyle = 'rgba(255,255,255,0.35)';
    c.fillRect(x - r * 0.42, y - r * 0.65, r * 0.22, r * 1.15);
  } else if (tool === 'compost') {
    c.fillStyle = '#9b6a42';
    roundRect(c, x - r, y - r * 0.55, r * 2, r * 1.35, r * 0.25);
    c.fill();
    c.fillStyle = '#afd48b';
    c.beginPath();
    c.arc(x - r * 0.28, y, r * 0.22, 0, Math.PI * 2);
    c.arc(x + r * 0.35, y + r * 0.12, r * 0.18, 0, Math.PI * 2);
    c.fill();
  } else {
    c.strokeStyle = '#e9ddc9';
    c.lineWidth = Math.max(2, r * 0.22);
    c.beginPath();
    c.moveTo(x - r, y - r);
    c.lineTo(x + r, y + r);
    c.moveTo(x + r, y - r);
    c.lineTo(x - r, y + r);
    c.stroke();
  }
  c.restore();
}

function drawWeekBanner(c) {
  if (weekCompleteTimer <= 0 || gs !== 'PLAYING') return;
  var ui = scene.ui;
  var a = clamp(weekCompleteTimer / 2.2, 0, 1);
  c.globalAlpha = a;
  c.fillStyle = 'rgba(21, 31, 24, 0.84)';
  roundRect(c, GF.cx - 142 * ui, scene.y + 26 * ui, 284 * ui, 56 * ui, 8 * ui);
  c.fill();
  fitText(c, GF.t('next_week') + ' ' + week, GF.cx, scene.y + 55 * ui, 250 * ui, fs(20), '#f8e996', 'center', '850');
  c.globalAlpha = 1;
}

function drawCoach(c) {
  if (tutorialDone || coachStep >= 99 || gs !== 'PLAYING' || helpOpen) return;
  var key = coachStep === 0 ? 'coach_plant' : coachStep === 1 ? 'coach_water' : coachStep === 2 ? 'coach_harvest' : 'coach_build';
  drawPromptPanel(c, key, scene.y + 12 * scene.ui, '#f8e996');
  var target = coachTarget();
  if (target) drawWarningRing(c, tileCenterX(target), tileCenterY(target), scene.tile * 0.47, '#f8e996');
}

function coachTarget() {
  if (coachStep === 0) return tileAt(2, 2);
  var crops = cropList();
  if (crops.length) return crops[0].tile;
  return tileAt(2, 2);
}

function drawPromptPanel(c, key, y, accent) {
  var ui = scene.ui;
  var w = Math.min(GF.W - 24 * ui, 430 * ui);
  var x = (GF.W - w) / 2;
  var size = fs(12);
  var lines = wrapLines(c, GF.t(key), w - 24 * ui, size, '750');
  var h = 22 * ui + lines.length * (size + 4 * ui);
  c.fillStyle = 'rgba(20, 32, 25, 0.90)';
  roundRect(c, x, y, w, h, 8 * ui);
  c.fill();
  c.strokeStyle = accent;
  c.stroke();
  var yy = y + 17 * ui;
  for (var i = 0; i < lines.length; i++) {
    drawText(c, lines[i], x + 12 * ui, yy, size, '#fff5bf', 'left', '750');
    yy += size + 4 * ui;
  }
}

function drawHelp(c) {
  if (!helpOpen) return;
  var ui = scene.ui;
  c.fillStyle = 'rgba(8, 14, 13, 0.68)';
  c.fillRect(0, 0, GF.W, GF.H);
  var w = Math.min(GF.W - 28 * ui, 560 * ui);
  var x = (GF.W - w) / 2;
  var entries = ['tut_goal', 'tut_controls', 'tut_win', 'tut_lose', 'tut_tip'];
  var size = fs(12);
  var lineData = [];
  var total = 52 * ui;
  for (var i = 0; i < entries.length; i++) {
    var lines = wrapLines(c, GF.t(entries[i]), w - 30 * ui, size, '650');
    lineData.push(lines);
    total += lines.length * (size + 4 * ui) + 9 * ui;
  }
  total += 48 * ui;
  total = Math.min(total, GF.H - 22 * ui);
  var y = Math.max(10 * ui, (GF.H - total) / 2);
  c.fillStyle = 'rgba(28, 43, 34, 0.96)';
  roundRect(c, x, y, w, total, 10 * ui);
  c.fill();
  c.strokeStyle = 'rgba(255,255,255,0.18)';
  c.stroke();
  fitText(c, GF.t('help_title'), x + 15 * ui, y + 28 * ui, w - 30 * ui, fs(17), '#f8e996', 'left', '850');
  var yy = y + 58 * ui;
  for (var j = 0; j < lineData.length; j++) {
    for (var k = 0; k < lineData[j].length; k++) {
      drawText(c, lineData[j][k], x + 15 * ui, yy, size, '#e7edd5', 'left', '650');
      yy += size + 4 * ui;
    }
    yy += 8 * ui;
  }
  uiRects.helpClose = { x: GF.cx - 70 * ui, y: y + total - 42 * ui, w: 140 * ui, h: 32 * ui };
  c.fillStyle = '#f4dc72';
  roundRect(c, uiRects.helpClose.x, uiRects.helpClose.y, uiRects.helpClose.w, uiRects.helpClose.h, 8 * ui);
  c.fill();
  fitText(c, GF.t('close'), GF.cx, uiRects.helpClose.y + 17 * ui, uiRects.helpClose.w - 12 * ui, fs(12), '#223018', 'center', '850');
}

function drawGameOver(c) {
  if (gs !== 'GAMEOVER') return;
  var ui = scene.ui;
  c.fillStyle = 'rgba(10, 16, 13, 0.82)';
  c.fillRect(0, 0, GF.W, GF.H);
  fitText(c, GF.t('gameover'), GF.cx, GF.cy - 72 * ui, Math.min(GF.W - 24 * ui, 430 * ui), fs(25), '#ffddbf', 'center', '850');
  fitText(c, GF.t(gameOverReason), GF.cx, GF.cy - 38 * ui, Math.min(GF.W - 28 * ui, 470 * ui), fs(14), '#f4bfae', 'center', '750');
  fitText(c, GF.t('score') + ' ' + score + '  ' + GF.t('best') + ' ' + best, GF.cx, GF.cy - 8 * ui, Math.min(GF.W - 28 * ui, 430 * ui), fs(14), '#e7edd5', 'center', '800');
  fitText(c, GF.t('week') + ' ' + week + '  ' + GF.t('harvest') + ' ' + harvest + '/' + harvestTarget, GF.cx, GF.cy + 22 * ui, Math.min(GF.W - 28 * ui, 430 * ui), fs(12), '#d9dcc3', 'center', '700');
  var r = uiRects.retry;
  c.fillStyle = '#f4dc72';
  roundRect(c, r.x, r.y, r.w, r.h, 8 * ui);
  c.fill();
  c.strokeStyle = 'rgba(255,255,255,0.28)';
  c.stroke();
  fitText(c, GF.t('retry'), GF.cx, r.y + r.h / 2 + 1 * ui, r.w - 12 * ui, fs(15), '#203018', 'center', '850');
}

function pointerPos(e) {
  var r = GF.canvas.getBoundingClientRect();
  var sx = GF.W / Math.max(1, r.width);
  var sy = GF.H / Math.max(1, r.height);
  return { x: (e.clientX - r.left) * sx, y: (e.clientY - r.top) * sy };
}

function pointInRect(p, r) {
  return p.x >= r.x && p.x <= r.x + r.w && p.y >= r.y && p.y <= r.y + r.h;
}

function onPointerDown(e) {
  e.preventDefault();
  layout();
  var p = pointerPos(e);
  lastPointer = p;
  dragMoved = false;

  if (helpOpen) {
    if (pointInRect(p, uiRects.helpClose)) {
      helpOpen = false;
      GF.sfx('click');
      saveRun();
    }
    return;
  }
  if (gs === 'GAMEOVER') {
    if (pointInRect(p, uiRects.retry)) startGame({ suppressTutorial: tutorialDone });
    return;
  }
  if (pointInRect(p, uiRects.help)) {
    helpOpen = true;
    GF.sfx('click');
    saveRun();
    return;
  }
  if (pointInRect(p, uiRects.mute)) {
    GF.toggleMute();
    saveRun();
    return;
  }
  for (var i = 0; i < uiRects.tools.length; i++) {
    if (pointInRect(p, uiRects.tools[i])) {
      selectTool(uiRects.tools[i].tool);
      saveRun();
      return;
    }
  }
  var hit = screenToTile(p.x, p.y);
  if (hit) applyTileAction(hit.tile);
}

function onPointerMove(e) {
  if (!lastPointer || gs !== 'PLAYING' || helpOpen) return;
  var p = pointerPos(e);
  if (Math.abs(p.x - lastPointer.x) + Math.abs(p.y - lastPointer.y) > 18 * scene.ui) dragMoved = true;
  var hit = screenToTile(p.x, p.y);
  if (hit) {
    cursor.x = hit.x;
    cursor.y = hit.y;
  }
}

function onPointerUp(e) {
  e.preventDefault();
  lastPointer = null;
  dragMoved = false;
}

function onKeyDown(e) {
  if (e.code === 'KeyF') {
    if (!document.fullscreenElement && GF.canvas.requestFullscreen) GF.canvas.requestFullscreen().catch(function() {});
    else if (document.exitFullscreen) document.exitFullscreen().catch(function() {});
    return;
  }
  if (e.code === 'Slash' || e.code === 'KeyH') {
    helpOpen = !helpOpen;
    saveRun();
    return;
  }
  if (e.code === 'KeyM') {
    GF.toggleMute();
    return;
  }
  var n = e.code && e.code.indexOf('Digit') === 0 ? parseInt(e.code.slice(5), 10) : 0;
  if (n >= 1 && n <= TOOL_ORDER.length) {
    selectTool(TOOL_ORDER[n - 1]);
    saveRun();
    return;
  }
  if (e.code === 'ArrowLeft') { cursor.x = Math.max(0, cursor.x - 1); e.preventDefault(); return; }
  if (e.code === 'ArrowRight') { cursor.x = Math.min(GRID_W - 1, cursor.x + 1); e.preventDefault(); return; }
  if (e.code === 'ArrowUp') { cursor.y = Math.max(0, cursor.y - 1); e.preventDefault(); return; }
  if (e.code === 'ArrowDown') { cursor.y = Math.min(GRID_H - 1, cursor.y + 1); e.preventDefault(); return; }
  if (e.code === 'Space' || e.code === 'Enter') {
    e.preventDefault();
    applyTileAction(tileAt(cursor.x, cursor.y));
  }
}

function botFindEmpty(preferSun) {
  var bestTile = null;
  var bestScore = -999;
  for (var i = 0; i < tiles.length; i++) {
    var t = tiles[i];
    if (t.obj) continue;
    var sc = (preferSun ? t.sun * 5 : 0) + t.limit - Math.abs(t.x - 2.5);
    if (sc > bestScore) {
      bestScore = sc;
      bestTile = t;
    }
  }
  return bestTile || tileAt(2, 2);
}

function botBestCropTile() {
  var crops = cropList();
  if (!crops.length) return null;
  crops.sort(function(a, b) {
    var ap = (a.obj.pest ? 100 : 0) + (a.obj.growth >= 1 ? 80 : 0) + (1 - a.obj.water) * 30 + a.obj.growth * 10;
    var bp = (b.obj.pest ? 100 : 0) + (b.obj.growth >= 1 ? 80 : 0) + (1 - b.obj.water) * 30 + b.obj.growth * 10;
    return bp - ap;
  });
  return crops[0].tile;
}

function botActions() {
  if (gs === 'GAMEOVER') return ['retry'];
  var a = ['wait', 'tend_best', 'plant_basil'];
  if (week >= 2) a.push('plant_tomato');
  if (week >= 5) a.push('plant_berry');
  a.push('place_tank');
  a.push('place_compost');
  a.push('remove_heavy');
  if (week < 6) a.push('jump_late');
  return a;
}

function botAct(action) {
  if (action === 'retry') { startGame({ suppressTutorial: true }); return true; }
  if (action === 'wait') { window.advanceTime(1200); return true; }
  if (action === 'tend_best') {
    var t = botBestCropTile();
    if (t) return applyTileAction(t);
    return false;
  }
  if (action === 'plant_basil' || action === 'plant_tomato' || action === 'plant_berry') {
    var crop = action.replace('plant_', '');
    selectedTool = crop;
    return plantCrop(botFindEmpty(true), crop);
  }
  if (action === 'place_tank') {
    selectedTool = 'tank';
    return placeTank(botFindEmpty(false));
  }
  if (action === 'place_compost') {
    selectedTool = 'compost';
    return placeCompost(botFindEmpty(false));
  }
  if (action === 'remove_heavy') {
    for (var i = 0; i < tiles.length; i++) {
      if (tiles[i].obj && tiles[i].obj.type === 'tank') return removeObject(tiles[i]);
    }
    return false;
  }
  if (action === 'jump_late') {
    setupForScreenshot(6);
    return true;
  }
  return false;
}

function stateObject() {
  recalcLoad();
  return {
    gs: gs,
    score: score,
    best: best,
    week: week,
    water: Math.round(water),
    seeds: seeds,
    compost: compost,
    stress: stress,
    roofLoad: roofLoad,
    maxRoofLoad: currentMaxLoad(),
    harvest: harvest,
    harvestTarget: harvestTarget,
    selectedTool: selectedTool,
    tutorialDone: tutorialDone,
    crops: cropList().length,
    tanks: countObjects('tank'),
    compostBins: countObjects('compost')
  };
}

function renderText() {
  var visible = [];
  for (var i = 0; i < tiles.length; i++) {
    var t = tiles[i];
    if (!t.obj) continue;
    var item = { x: t.x, y: t.y, sun: t.sun, type: t.obj.type };
    if (t.obj.type === 'crop') {
      item.crop = t.obj.crop;
      item.growth = Math.round(t.obj.growth * 100);
      item.water = Math.round(t.obj.water * 100);
      item.pest = !!t.obj.pest;
    }
    visible.push(item);
  }
  return JSON.stringify({
    coordinateSystem: 'grid origin top-left, x right, y down, 6 by 5 roof tiles',
    state: stateObject(),
    cursor: { x: cursor.x, y: cursor.y },
    tiles: visible
  });
}

function setupForScreenshot(level) {
  screenshotMode = true;
  tutorialDone = true;
  coachStep = 99;
  helpOpen = false;
  gs = 'PLAYING';
  score = 280 + Math.max(1, level || 4) * 95;
  week = Math.max(1, level || 5);
  water = 13;
  seeds = 8;
  compost = 2;
  harvest = Math.floor(harvestTargetForWeek(week) * 0.52);
  harvestTarget = harvestTargetForWeek(week);
  stress = week >= 5 ? 4 : 2;
  selectedTool = week >= 5 ? 'berry' : 'tomato';
  makeTiles();
  tileAt(1, 1).obj = { type: 'crop', crop: 'basil', growth: 1, water: 0.8, pest: false, pestAge: 0, dryHits: 0 };
  tileAt(2, 1).obj = { type: 'crop', crop: 'tomato', growth: 0.72, water: 0.42, pest: week >= 3, pestAge: 1.2, dryHits: 0 };
  tileAt(3, 2).obj = { type: 'tank' };
  tileAt(4, 2).obj = { type: 'compost' };
  tileAt(2, 3).obj = { type: 'crop', crop: week >= 5 ? 'berry' : 'basil', growth: 0.48, water: 0.26, pest: false, pestAge: 0, dryHits: 0 };
  tileAt(4, 3).obj = { type: 'crop', crop: week >= 5 ? 'berry' : 'tomato', growth: 1, water: 0.58, pest: false, pestAge: 0, dryHits: 0 };
  cursor.x = 2;
  cursor.y = 1;
  recalcLoad();
}

window._jumpLevel = function(n) { setupForScreenshot(Number(n) || 5); return stateObject(); };
window._setupForScreenshot = function(level) { setupForScreenshot(Number(level) || 5); return stateObject(); };
window.advanceTime = function(ms) {
  var total = Math.max(0, Number(ms) || 0);
  var step = 1 / 30;
  var count = Math.ceil(total / 1000 / step);
  for (var i = 0; i < count; i++) update(step);
  return stateObject();
};
window.render_game_to_text = renderText;

GF.canvas.addEventListener('pointerdown', onPointerDown, { passive: false });
GF.canvas.addEventListener('pointermove', onPointerMove, { passive: false });
GF.canvas.addEventListener('pointerup', onPointerUp, { passive: false });
GF.canvas.addEventListener('pointercancel', onPointerUp, { passive: false });
document.addEventListener('keydown', onKeyDown);

GF.exposeState(stateObject);
GF.exposeBot(botActions, botAct);
GF.exposeReach(function() {
  layout();
  var items = [
    { id: 'help', x: uiRects.help.x, y: uiRects.help.y, w: uiRects.help.w, h: uiRects.help.h, pinned: true },
    { id: 'mute', x: uiRects.mute.x, y: uiRects.mute.y, w: uiRects.mute.w, h: uiRects.mute.h, pinned: true }
  ];
  for (var i = 0; i < uiRects.tools.length; i++) {
    items.push({ id: 'tool_' + uiRects.tools[i].tool, x: uiRects.tools[i].x, y: uiRects.tools[i].y, w: uiRects.tools[i].w, h: uiRects.tools[i].h, pinned: true });
  }
  for (var t = 0; t < tiles.length; t++) {
    items.push({
      id: 'tile_' + tiles[t].x + '_' + tiles[t].y,
      x: scene.gridX + tiles[t].x * scene.tile,
      y: scene.gridY + tiles[t].y * scene.tile,
      w: scene.tile,
      h: scene.tile
    });
  }
  if (gs === 'GAMEOVER') items.push({ id: 'retry', x: uiRects.retry.x, y: uiRects.retry.y, w: uiRects.retry.w, h: uiRects.retry.h, pinned: true });
  if (helpOpen) items.push({ id: 'help_close', x: uiRects.helpClose.x, y: uiRects.helpClose.y, w: uiRects.helpClose.w, h: uiRects.helpClose.h, pinned: true });
  return { screen: helpOpen ? 'help' : gs, viewportW: GF.W, viewportH: GF.H, screenH: GF.H, scrollMaxY: 0, items: items };
});
GF.exposeTour([
  { name: 'play', go: function() { if (gs !== 'PLAYING') startGame({ suppressTutorial: true }); helpOpen = false; } },
  { name: 'help', go: function() { if (gs !== 'PLAYING') startGame({ suppressTutorial: true }); helpOpen = true; } },
  { name: 'gameover', go: function() { gameOver('reason_stress'); helpOpen = false; } },
  { name: 'late', go: function() { setupForScreenshot(6); } }
]);

GF.init({
  designW: 440,
  designH: 760,
  strings: STRINGS,
  saveKey: 'rooftop_farming',
  onReady: function() {
    makeTiles();
    var restored = GF.persist(SAVE_KEY, getPersistState, applyPersistState);
    GF.bgMusic({ file: 'audio/bg_track.mp3', preset: 'calm', muted: GF.muted });
    if (!restored || !started || gs !== 'PLAYING') {
      startGame({ suppressTutorial: !!(window.__GF_AUTOSTART && !window._silent) });
    }
  },
  onUpdate: update,
  onDraw: draw
});

})();
</script>
