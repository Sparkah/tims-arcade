// Remote-config defaults (live-ops tuning hole; DATA only).

  tuning: { speed_mult: 1, spawn_mult: 1 },
  events: { double_goo: false },
  daily:  { seed: 0 },
  motd:   { en: '', ru: '' },

// ── TUNABLES (DESIGN.md is the source of truth) ──────────────────────────
var CAKE_HP_MAX0      = 5;
var CAKE_RADIUS       = 54;
var SMASH_RADIUS0     = 44;
var BEAT_BPM          = 120;   // fixed: the beat ring + smash-drums stay locked to the bed
var ON_BEAT_WINDOW0   = 0.14;
var COMBO_DECAY_BEATS = 2;
var WAVE_BASE_BUGS    = 6;
var WAVE_BUGS_PER_WAVE= 3;
var BUG_SPEED_BASE    = 60;
var BUG_SPEED_PER_WAVE= 6;
var FEVER_MAX0        = 12;
var FEVER_SEC         = 6;
var GOO_PER_BUG       = 2;

// Musical: C major pentatonic, bright register. Always-consonant notes so a
// frantic smash run sounds melodic over the backing bed.
var NOTE_ROOT = 523.25;            // C5
var SCALE = [0, 2, 4, 7, 9];       // major pentatonic semitones
// 16th-note grid order the auto-tapper frogs fill in: downbeats, then backbeats,
// then offbeats, then 16ths — so each frog bought adds another note to the groove.
var FROG_PATTERN = [0, 8, 4, 12, 2, 6, 10, 14, 1, 5, 9, 13, 3, 7, 11, 15];
var FROG_MAX = 16;
var FROG_COOLDOWN = 0.34;   // each frog snaps this often at bugs inside the ring

// ── BUG TYPES (each = its own instrument timbre + octave) ────────────────
var BUGS = {
  ant:    { hp:1,  r:16, speed:1.00, score:10,  goo:2,  body:'#c0533f', dark:'#7c2f24', glow:'#ff8a63', wave:'triangle', oct:0,  drum:'hat'   },
  beetle: { hp:2,  r:20, speed:0.66, score:20,  goo:4,  body:'#4a9152', dark:'#264f2c', glow:'#86f59c', wave:'sawtooth', oct:-1, drum:'kick'  },
  fly:    { hp:1,  r:14, speed:1.75, score:16,  goo:3,  body:'#74849a', dark:'#3c4654', glow:'#c8e6ff', wave:'square',   oct:1,  drum:'snare', flyer:true },
  grub:   { hp:1,  r:18, speed:0.85, score:14,  goo:3,  body:'#e6c25a', dark:'#a8862f', glow:'#ffe89a', wave:'triangle', oct:-1, drum:'tom',   splitter:true },
  firefly:{ hp:1,  r:15, speed:1.18, score:26,  goo:5,  body:'#ffd34d', dark:'#b8902a', glow:'#fff2a8', wave:'sine',     oct:1,  drum:'clap',  bonus:true },
  wasp:   { hp:1,  r:15, speed:2.05, score:24,  goo:5,  body:'#e0a82e', dark:'#5a4010', glow:'#ffe08a', wave:'square',   oct:1,  drum:'ohat',  flyer:true },
  queen:  { hp:10, r:54, speed:0.40, score:120, goo:40, body:'#c04bd0', dark:'#7a2d86', glow:'#f3b8ff', wave:'sawtooth', oct:-1, drum:'crash', boss:true },
};

// ── PERSISTENT META ──────────────────────────────────────────────────────
var best = 0, bestWave = 0, conductorLevel = 0, everPlayed = 0;

// ── RUN STATE ──────────────────────────────────────────────────────────────
var gs = 'PLAYING';            // PLAYING | SHOP | PAUSE | GAMEOVER
var score = 0, wave = 1, goo = 0;
var cakeHPmax = CAKE_HP_MAX0, cakeHP = CAKE_HP_MAX0;
var smashRadius = SMASH_RADIUS0, onBeatWindow = ON_BEAT_WINDOW0, feverMax = FEVER_MAX0, frogs = 0;
var combo = 0, maxCombo = 0, feverCharge = 0, feverActive = false, feverT = 0;
var bugs = [], spawnQueue = [], spawnTimer = 0, spawnGap = 0.7, queen = null;
var decals = [];   // fading goo splats left on the blanket (juice + sense of place)
var tongues = [];  // frog auto-tapper tongue flicks (visual)
var rings = [];    // expanding shockwave rings on on-beat smashes (juice)
var frogAnim = [], frogAim = [], frogCD = [];   // per-frog lunge timer + aim angle + catch cooldown
var powerups = [], slowT = 0, frenzyT = 0, frenzyTimer = 0;   // power-up drops + active effects
var POWERUPS = { spray: { col: '#e0563a' }, slow: { col: '#4aa6e0' }, frenzy: { col: '#f5c542' } };
var POWERUP_KEYS = ['spray', 'slow', 'frenzy'];
var pendingDrums = [], silentTimer = 0;   // auto-kill drums queued to the 16th grid + silent-wave spawn timer
var dying = [], deb = [];   // bugs mid death-animation (spin + squash + fly off + fade) + pixel debris
// ── EXTRA DEFENDER CREATURES (auto-destroyers) — the frog is the starter; these are
//    the idle-defense roster. Each: cooldown, range (x defenseR), placement, colour. ──
var extras = { spider: 0, hedgehog: 0, bird: 0 };
var EXTRA_DEFS = {
  spider:   { cd: 0.6,  rmul: 1.4, place: 'inner', col: '#9a5fb0', cost: 35, mul: 20, label: 'Web Spider', d: 'wide-range sniper' },
  hedgehog: { cd: 0.42, rmul: 1.05, place: 'outer', col: '#b07a40', cost: 55, mul: 28, label: 'Spike Roller', d: 'fast ring patrol' },
  bird:     { cd: 1.0,  rmul: 3.2, place: 'top',   col: '#56a0e0', cost: 90, mul: 50, label: 'Swoop Bird', d: 'hunts ANY bug on screen' },
};
var EXTRA_KEYS = ['spider', 'hedgehog', 'bird'];
// persistent per-unit actors (position/velocity/state) so defenders MOVE smoothly
// instead of snapping to recomputed slots. Grown/shrunk by syncUnits() to match `extras`.
var extraUnits = { spider: [], hedgehog: [], bird: [] };

// ── PROGRESSION / UPGRADE TRACKS (TD-idler redesign 2026-06-23) ──────────────
// Each defender has 3 deep stat tracks (Damage / Fire-Rate / Range) on top of a small
// copy count. Frog DAMAGE is UNBOUNDED (the endless spine), paired against geometric
// enemy-HP growth so there's always a meaningful next buy. Grounded in The Tower
// (per-stat tracks), Bloons (per-unit builds), Cookie Clicker (unbounded geometric).
var ENEMY_HP_GROWTH = 1.13;   // geometric enemy-HP per wave (single balance knob; lower = colonies push deeper)
var DEFENDER_KEYS = ['frog', 'spider', 'hedgehog', 'bird'];
var DEF_BASE = {                                  // base damage / cooldown / range-mult(xdefenseR)
  frog:     { dmg: 1,   cd: FROG_COOLDOWN, rmul: 1.0  },
  spider:   { dmg: 1.4, cd: 0.6,           rmul: 1.4  },
  hedgehog: { dmg: 0.8, cd: 0.42,          rmul: 1.05 },
  bird:     { dmg: 2,   cd: 1.0,           rmul: 3.2  },
};
var TRACK = {   // per track: [costBase, costRatio, cap]  (cap null = unbounded)
  dmg: { frog: [20, 1.16, null], spider: [45, 1.16, 40], hedgehog: [60, 1.16, 40], bird: [110, 1.16, 40] },
  spd: { frog: [30, 1.19, 30],   spider: [55, 1.19, 30], hedgehog: [50, 1.19, 30], bird: [90, 1.19, 30] },
  rng: { frog: [25, 1.22, 20],   spider: [40, 1.22, 20], hedgehog: [40, 1.22, 20], bird: [70, 1.22, 20] },
};
var COPY = { frog: [15, 1.13, 4], spider: [70, 1.15, 3], hedgehog: [200, 1.17, 3], bird: [450, 1.19, 2] };
var dlvl = { frog: { dmg: 0, spd: 0, rng: 0 }, spider: { dmg: 0, spd: 0, rng: 0 }, hedgehog: { dmg: 0, spd: 0, rng: 0 }, bird: { dmg: 0, spd: 0, rng: 0 } };
// PRESTIGE meta — Royal Jelly (RJ) earned per run buys permanent upgrades that survive resets.
var rj = 0, meta = { hive: 0, fatcake: 0, vet: 0 }, lastRJgain = 0;
var totalGooThisRun = 0, bestWaveThisRun = 1, shopTab = 'frog';
function copies(t) { return t === 'frog' ? frogs : extras[t]; }
function gooMult() { return 1 + 0.10 * meta.hive; }                                 // Hive Bounty
function addGoo(n) { var g = n * gooMult(); goo += g; totalGooThisRun += g; }       // every goo gain routes here
function defDmg(t) { return DEF_BASE[t].dmg * Math.pow(1.18, dlvl[t].dmg); }        // per-shot damage
function defCd(t)  { return Math.max(0.12, DEF_BASE[t].cd * Math.pow(0.97, dlvl[t].spd)); }
function defRange(t) { return DEF_BASE[t].rmul * defenseR() * (1 + 0.06 * dlvl[t].rng); }
function smashDmg(onBeat) { return (onBeat ? 2 : 1) * (1 + smashLevel() * 0.6 + wave * 0.08); }  // player stays relevant vs rising HP
function rjFor(w, g) { return Math.floor(Math.pow(Math.max(0, w), 1.5) / 8 + Math.sqrt(Math.max(0, g)) / 25); }
var beatLen = 60 / BEAT_BPM, beatT = 0, beatPhase = 0, beatIndex = -1, beatPulse = 0, lastOnBeatIndex = -99, lastSub = -1;
var cake = { scale: 1, hitT: 0 };
var helpOpen = false, banner = null, firstUpgradeDone = false, firstDeathDone = false, screenshotMode = false, welcomeGoo = 0, welcomePanel = false;
var shopItems = [];
var coachActive = false, coachStep = 0, coachTimer = 0;

// HUD / button rects (game coords), filled by layout()
var R = {};
var WT = { groundPat: null, patKey: '' };

// ════════════════════════════════════════════════════════════════════════
//  AUDIO — the musical hook (all on the SHARED gf-lib WebAudio context)
// ════════════════════════════════════════════════════════════════════════
function noteFreq(deg, oct) {
  var semi = SCALE[((deg % SCALE.length) + SCALE.length) % SCALE.length] + 12 * oct;
  return NOTE_ROOT * Math.pow(2, semi / 12);
}
// The bug "sings" a soft pitched note under its DRUM hit, so smashing layers a
// little melody over the bass while the drum is the star of the groove.
function playBugNote(b, onBeat) {
  var def = BUGS[b.type];
  var f = noteFreq(b.note, def.oct);
  var g = onBeat ? 0.085 : 0.04;
  GF.tone(f, onBeat ? 0.22 : 0.13, def.wave, g);
  if (onBeat) GF.tone(f * 1.5, 0.18, 'sine', g * 0.5);     // perfect-fifth sparkle on beat
}
function beatTick() { /* no metronome — kills make the music */ }
// auto-kills (frogs / silent wave / frenzy) queue their drum to the next 16th so the
// emergent groove stays ON the grid; the player's own smashes play immediately.
function schedDrum(name) { if (pendingDrums.length < 6) pendingDrums.push(name); }

// ════════════════════════════════════════════════════════════════════════
//  LAYOUT
// ════════════════════════════════════════════════════════════════════════
function cakePos() { return { x: GF.cx, y: GF.cy + 14 * GF.S }; }
// the frogs' defense perimeter — they only smash bugs INSIDE this ring around the cake
function defenseR() { return GF.clamp(Math.min(GF.W, GF.H) * 0.33, 130, 300); }
function layout() {
  var W = GF.W, H = GF.H, S = GF.S, pad = 12 * S;
  var btn = GF.clamp(34 * S, 28, 46);
  R.mute  = { x: W - pad - btn, y: pad, w: btn, h: btn };
  R.help  = { x: W - pad * 2 - btn * 2, y: pad, w: btn, h: btn };
  R.pause = { x: W - pad * 3 - btn * 3, y: pad, w: btn, h: btn };
}

// ════════════════════════════════════════════════════════════════════════
//  WAVES + SPAWNING
// ════════════════════════════════════════════════════════════════════════
function typesForWave(w) {
  var t = ['ant'];
  if (w >= 2) t.push('beetle');
  if (w >= 3) t.push('fly');
  if (w >= 4) t.push('grub');
  if (w >= 6) t.push('firefly');
  if (w >= 7) t.push('wasp');
  return t;
}
function spawnEdgePos() {
  var W = GF.W, H = GF.H, m = 30 * GF.S, side = (Math.random() * 4) | 0, x, y;
  if (side === 0) { x = Math.random() * W; y = -m; }
  else if (side === 1) { x = Math.random() * W; y = H + m; }
  else if (side === 2) { x = -m; y = Math.random() * H; }
  else { x = W + m; y = Math.random() * H; }
  return { x: x, y: y };
}
function makeBug(type, pos) {
  var def = BUGS[type];
  var p = pos || spawnEdgePos();
  var hp = Math.max(1, Math.round(def.hp * Math.pow(ENEMY_HP_GROWTH, wave - 1)));   // geometric HP growth -> upgrading stays mandatory
  return {
    type: type, x: p.x, y: p.y, r: def.r,
    hp: hp, maxhp: hp,
    note: (Math.random() * SCALE.length) | 0,
    wob: Math.random() * 6.28, t: 0,
    spawnT: 0, riffT: 2 + Math.random() * 2,
    scale: 0.2, // pop-in
  };
}
function speedFor(type) {
  return (BUG_SPEED_BASE + wave * BUG_SPEED_PER_WAVE) * BUGS[type].speed * (CFG.tuning.speed_mult || 1) * GF.S;
}
function startWave(w) {
  wave = w;
  bugs = []; queen = null; spawnQueue = [];
  spawnGap = Math.max(0.10, 0.72 - w * 0.05);   // late-game spawn (~10/s) outpaces even maxed frogs (~8/s) -> you must tap again
  spawnTimer = 0;
  combo = 0;
  if (w % 5 === 0) {
    queen = makeBug('queen', { x: GF.cx, y: -70 * GF.S });
    queen.hp = queen.maxhp = Math.round((9 + w) * Math.pow(ENEMY_HP_GROWTH, w - 1) * 0.6);   // scales with the HP curve (0.6 = hard but not a wall)
    for (var i = 0; i < 4 + ((w / 5) | 0); i++) spawnQueue.push('ant');
  } else {
    var pool = typesForWave(w), n = Math.round((WAVE_BASE_BUGS + w * WAVE_BUGS_PER_WAVE) * (CFG.tuning.spawn_mult || 1));
    for (var k = 0; k < n; k++) spawnQueue.push(pool[(Math.random() * pool.length) | 0]);
  }
  gs = 'PLAYING';
  GF.saveRun();
}
function waveComplete() {
  var bonus = 40 + wave * 12;
  score += bonus;
  addGoo(6 + wave * 2);
  cakeHP = Math.min(cakeHP + 1, cakeHPmax);
  if (wave > bestWave) bestWave = wave;
  if (wave > bestWaveThisRun) bestWaveThisRun = wave;
  // cross-run unlock: new instrument/sound family at milestone waves
  var unlocked = false;
  var nextUnlock = (conductorLevel + 1) * 5;
  if (wave >= nextUnlock) { conductorLevel++; unlocked = true; }
  saveMeta();
  showBanner(unlocked ? GF.t('newsong') : GF.t('waveclr') + ' ' + wave, unlocked ? '#ffd34d' : '#fff');
  GF.sfx('levelup');
  buildShop();
  bugs = []; pendingDrums = []; silentTimer = 0;   // fresh start for the between-wave silent music wave
  gs = 'SHOP';
  GF.saveRun();
}

// ════════════════════════════════════════════════════════════════════════
//  SHOP
// ════════════════════════════════════════════════════════════════════════
// GEOMETRIC upgrade cost (cost = base * ratio^owned) — the idle-game standard, so costs
// outrun income and there's a real progression curve (was linear -> "buy everything instantly").
// Tuned from balance research (Cookie Clicker 1.15 / AdVenture Capitalist per-tier 1.07-1.19):
// cheap Frog scales slow, premium Bird scales steep. See Backlog / DESIGN iteration log.
function geoCost(base, ratio, owned) { return Math.round(base * Math.pow(ratio, owned)); }
var SHOP_TABS = ['frog', 'spider', 'hedgehog', 'bird', 'colony'];
function smashLevel() { return Math.round((smashRadius - SMASH_RADIUS0) / 8); }
function beatLevel()  { return Math.round((onBeatWindow - ON_BEAT_WINDOW0) / 0.02); }
function feverLevel() { return Math.round((FEVER_MAX0 - feverMax) / 2); }
function cakeUtilLevel() { return cakeHPmax - CAKE_HP_MAX0 - meta.fatcake; }
function trackRow(key, tr) {
  var t = TRACK[tr][key], lvl = dlvl[key][tr], cap = t[2];
  return { id: key + ':' + tr, kind: 'track', title: GF.t('t_' + tr), desc: GF.t('t_' + tr + '_d'), lvl: lvl, cost: geoCost(t[0], t[1], lvl), max: cap != null && lvl >= cap, curr: 'goo' };

function nearestBugAt(x, y) {

    var b = bugs[i], hit = rr + b.r * GF.S, dx = b.x - x, dy = b.y - y, d = dx * dx + dy * dy;
    if (d <= hit * hit && d < bestD) { bestD = d; best = b; }

  if (queen) {

    if (dq <= hq * hq && dq < bestD) { best = queen; }
  }
  return best;
}
function isOnBeat() {
  var d = Math.min(beatPhase, 1 - beatPhase) * beatLen;   // seconds to nearest beat
  return d <= onBeatWindow;
}
function smashAt(x, y) {
  var b = nearestBugAt(x, y);

    GF.juice.particles.burst(x, y, { count: 3, color: '#ffffff', speed: 60, gravity: 200, size: 2, life: 0.18 });
    return false;

}

}

  });

}

// ── BEAT + AUTO-TAPPER ticks (shared by live play AND the between-wave silent wave) ──
function tickBeat(dt) {
  if (beatPulse > 0) beatPulse -= dt * 3.2;
  var bi = GF.beatInfo(), crossed = false;
  if (bi.on) { beatLen = bi.beatLen; beatPhase = bi.phase; if (bi.beat !== beatIndex) { beatIndex = bi.beat; crossed = true; } }
  else { beatT += dt; beatPhase = beatT / beatLen; if (beatT >= beatLen) { beatT -= beatLen; beatIndex++; crossed = true; } }
  if (crossed) { beatPulse = 1; GF.juice.punch(cake, 'scale', 0.06, 180); if (beatIndex - lastOnBeatIndex > COMBO_DECAY_BEATS) combo = 0; if (feverActive) feverBeatHit(); }
  // flush quantized auto-kill drums on the 16th-note grid -> the emergent groove stays rhythmic
  var sub = beatIndex * 4 + Math.floor(GF.clamp(beatPhase, 0, 0.999) * 4);
  if (sub !== lastSub) { lastSub = sub; for (var i = 0; i < pendingDrums.length; i++) GF.drum(pendingDrums[i]); pendingDrums.length = 0; }
}

    for (var qi = 0; qi < bugs.length; qi++) { var dq = GF.dist(bugs[qi].x, bugs[qi].y, cpf.x, cpf.y); if (dq <= Rf && dq < td) { td = dq; tgt = bugs[qi]; } }
    if (queen && isFinite(queen.x)) { var dqn = GF.dist(queen.x, queen.y, cpf.x, cpf.y); if (dqn <= Rf && dqn < td) { td = dqn; tgt = queen; } }   // frogs hit the boss when it's in the ring
    if (tgt) { frogFire(fi, tgt); hitBug(tgt, true, true, defDmg('frog')); frogCD[fi] = defCd('frog'); }
  }
}

}

function tickSilentWave(dt) {

  tickBeat(dt);

  var cp = cakePos(), inner = defenseR() * 0.55;

    var dx = cp.x - bug.x, dy = cp.y - bug.y, d = Math.sqrt(dx * dx + dy * dy) || 1;

// ════════════════════════════════════════════════════════════════════════
//  UPDATE
// ════════════════════════════════════════════════════════════════════════
function update(dt) {
  GF.juice.update(dt);
  if (screenshotMode) { beatPulse = 1; return; }   // freeze a stable busy frame for promo capture
  if (GF.tutorial.active) GF.tutorial.update(dt);
  if (coachActive && !GF.tutorial.active) endCoach();   // skip / auto-finish
  if (banner) { banner.t -= dt; if (banner.t <= 0) banner = null; }
  if (cake.hitT > 0) cake.hitT -= dt;
  for (var di = decals.length - 1; di >= 0; di--) { decals[di].life -= dt; if (decals[di].life <= 0) decals.splice(di, 1); }
  for (var tgi = tongues.length - 1; tgi >= 0; tgi--) { tongues[tgi].t -= dt; if (tongues[tgi].t <= 0) tongues.splice(tgi, 1); }
  for (var ri = rings.length - 1; ri >= 0; ri--) { rings[ri].t += dt; if (rings[ri].t >= rings[ri].dur) rings.splice(ri, 1); }
  for (var fa = 0; fa < frogAnim.length; fa++) { if (frogAnim[fa] > 0) frogAnim[fa] -= dt; }
  for (var dyi = dying.length - 1; dyi >= 0; dyi--) { dying[dyi].t += dt; if (dying[dyi].t >= dying[dyi].dur) dying.splice(dyi, 1); }
  for (var dbi = deb.length - 1; dbi >= 0; dbi--) { deb[dbi].t += dt; if (deb[dbi].t >= deb[dbi].dur) deb.splice(dbi, 1); }
  updateFXList(dt);
  if (helpOpen || gs === 'PAUSE' || gs === 'GAMEOVER') return;
  if (gs === 'SHOP') { tickSilentWave(dt); return; }   // between-wave music: frogs drum on a silent wave
  if (gs !== 'PLAYING') return;

  // coach backstop: always advance after a few seconds so neither a confused
  // player nor the headless gate can stall on the interactive tutorial.
  if (coachActive) { coachTimer += dt; if (coachStep <= 1 && coachTimer > 6) advanceCoach(); }

  tickBeat(dt);
  tickFrogs(dt);
  tickExtras(dt);

  // ── power-ups (drops + active effects) ──
  for (var pwi = powerups.length - 1; pwi >= 0; pwi--) { powerups[pwi].t -= dt; if (powerups[pwi].t <= 0) powerups.splice(pwi, 1); }
  if (slowT > 0) slowT -= dt;
  if (frenzyT > 0) { frenzyT -= dt; frenzyTimer -= dt; if (frenzyTimer <= 0) { frenzyTimer = 0.13; var ftg = nearestAnyBug(); if (ftg) { pushRing(ftg.x, ftg.y, ftg.r * GF.S, '#ffd34d'); hitBug(ftg, true, true, smashDmg(true)); } } }

  // ── fever timer ──
  if (feverActive) { feverT -= dt; if (feverT <= 0) feverActive = false; }
  var wdt = dt * (feverActive ? 0.55 : 1) * GF.juice.timeScale * (slowT > 0 ? 0.42 : 1);   // Drop slow-mo + hit-stop + power-up SLOW

  // ── spawn trickle ──
  if (!coachActive) {
    spawnTimer += dt;
    if (spawnQueue.length && spawnTimer >= spawnGap) { spawnTimer = 0; bugs.push(makeBug(spawnQueue.shift())); }
  } else if (bugs.length === 0) {
    bugs.push(slowAnt());   // keep a target alive so the coach can never soft-lock
  }

  // ── bugs move toward cake ──
  var cp = cakePos();
  for (var b = bugs.length - 1; b >= 0; b--) {
    var bug = bugs[b], def = BUGS[bug.type];
    bug.t += wdt;
    if (bug.scale < 1) bug.scale = Math.min(1, bug.scale + dt * 4);
    var dx = cp.x - bug.x, dy = cp.y - bug.y, d = Math.sqrt(dx * dx + dy * dy) || 1;
    var sp = speedFor(bug.type);
    var vx = dx / d * sp, vy = dy / d * sp;
    if (def.flyer) { var perp = bug.t * 7; vx += Math.cos(perp + bug.wob) * sp * 0.6; vy += Math.sin(perp + bug.wob) * sp * 0.6; }
    bug.x += vx * wdt; bug.y += vy * wdt;
    bug.ang = Math.atan2(cp.y - bug.y, cp.x - bug.x);
    if (d < CAKE_RADIUS * GF.S + bug.r * GF.S * 0.5) biteCake(bug);
  }
  // ── queen ──
  if (queen) {
    queen.t += wdt;
    if (queen.scale < 1) queen.scale = Math.min(1, queen.scale + dt * 3);
    var qdx = cp.x - queen.x, qdy = cp.y - queen.y, qd = Math.sqrt(qdx * qdx + qdy * qdy) || 1;
    var qsp = speedFor('queen');
    queen.x += qdx / qd * qsp * wdt; queen.y += qdy / qd * qsp * wdt;
    queen.riffT -= wdt;
    if (queen.riffT <= 0) { queen.riffT = 2.6; if (bugs.length < 14) bugs.push(makeBug('ant', { x: queen.x, y: queen.y })); }
    if (qd < CAKE_RADIUS * GF.S + queen.r * GF.S * 0.5) queenBiteCake();
  }

  // ── wave clear ──
  if (!coachActive && gs === 'PLAYING' && spawnQueue.length === 0 && bugs.length === 0 && !queen) waveComplete();
}
function biteCake(bug) {
  if (coachActive) { removeBug(bug); return; }   // cake is safe during the coach
  cakeHP -= 1; cake.hitT = 0.4; combo = 0;
  GF.sfx('hurt');

function draw(ctx, dt) {
  var W = GF.W, H = GF.H, S = GF.S;

  ctx.fillStyle = '#4a8a3f'; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#3e7836'; ctx.fillRect(0, (H * 0.52) | 0, W, H);
  // picnic blanket — chunky hard hem + hard gingham (no blur / gradient / rounded)
  var bm = 18 * S, bx = bm | 0, by = bm | 0, bw = (W - bm * 2) | 0, bh = (H - bm * 2) | 0, hem = (6 * S) | 0;

  ctx.fillStyle = '#efe3c6'; ctx.fillRect(bx - hem, by - hem, bw + hem * 2, bh + hem * 2);
  ctx.fillStyle = buildGround(); ctx.fillRect(bx, by, bw, bh);

  ctx.translate(GF.juice.offsetX, GF.juice.offsetY);
  drawDecals(ctx);
  drawDefenseRing(ctx);
  drawCake(ctx);
  for (var i = 0; i < bugs.length; i++) drawBug(ctx, bugs[i]);
  if (queen) drawBug(ctx, queen);
  drawDying(ctx);
  drawPowerups(ctx);
  drawFrogs(ctx);
  drawExtras(ctx);

  drawFX(ctx);
  drawRings(ctx);
  GF.juice.texts.draw(ctx);
  ctx.restore();

  // vignette for depth (over playfield, under HUD)
  var vg = ctx.createRadialGradient(GF.cx, GF.cy, Math.min(W, H) * 0.32, GF.cx, GF.cy, Math.max(W, H) * 0.64);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,0.26)');
  ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);

  if (gs === 'SHOP') drawShop(ctx);
  if (gs === 'PAUSE') drawPause(ctx);
  if (gs === 'GAMEOVER') drawGameOver(ctx);

  GF.juice.drawFlash(ctx);
}

function drawCake(ctx) {
  var cp = cakePos(), S = GF.S, sc = cake.scale * (cake.hitT > 0 ? 1 - cake.hitT * 0.2 : 1);

  GF.drawSprite('cake', cp.x, cp.y, CAKE_RADIUS * 2.4 * S * sc, function (c, x, y, s) {
    var r = s * 0.42;

    c.fillStyle = '#f3f0ea'; c.beginPath(); c.ellipse(0, r * 0.42, r * 1.15, r * 0.42, 0, 0, 6.28); c.fill();
    // base
    c.fillStyle = '#c98a4b'; c.beginPath(); c.ellipse(0, r * 0.1, r, r * 0.6, 0, 0, 6.28); c.fill();
    c.fillStyle = '#b5651d'; c.fillRect(-r, -r * 0.35, r * 2, r * 0.5);

    for (var d = 0; d < 7; d++) { c.beginPath(); c.arc(-r + (d / 6) * r * 2, -r * 0.35, r * 0.18, 0, 6.28); c.fill(); }
    c.restore();
  });

  var n = cakeHP, spread = CAKE_RADIUS * 1.4 * S;
  for (var i = 0; i < n; i++) {
    var t = n === 1 ? 0.5 : i / (n - 1), cx2 = cp.x - spread / 2 + spread * t, cy2 = cp.y - CAKE_RADIUS * 0.95 * S;
    ctx.fillStyle = i % 2 ? '#5ec6ff' : '#ff8ad0'; ctx.fillRect(cx2 - 2 * S, cy2, 4 * S, 14 * S);
    var fl = 0.6 + 0.4 * Math.sin(beatT * 18 + i);
    ctx.fillStyle = '#ffd34d'; ctx.beginPath(); ctx.ellipse(cx2, cy2 - 4 * S, 3 * S, 6 * S * fl, 0, 0, 6.28); ctx.fill();

}

function drawBug(ctx, b) {
  var def = BUGS[b.type], S = GF.S, flyer = def.flyer || def.bonus;
  var _ga = ctx.globalAlpha; if (b.silent) ctx.globalAlpha = _ga * 0.5;   // dim the silent background wave
  // ── procedural life: crawlers HOP with squash/stretch; flyers HOVER+flutter ──
  var ph = (b.t || 0) * (flyer ? 15 : 8) + (b.wob || 0);
  var hop = Math.abs(Math.sin(ph));
  var sx = 1 + Math.sin(ph * 2) * (flyer ? 0.05 : 0.08);          // squash/stretch
  var sy = 1 - Math.sin(ph * 2) * (flyer ? 0.05 : 0.07);
  var dy = (flyer ? -(4 + hop * 3) : -hop * b.r * 0.35) * S;      // hover vs hop bounce
  var lean = Math.sin(ph) * (flyer ? 0.05 : 0.1);                 // body lean
  var base = b.r * 2 * S * (b.scale || 1) * 2.4;
  shadow(ctx, b.x, b.y, b.r * S * (1 - hop * 0.18));              // shadow shrinks on the up-beat
  ctx.save(); ctx.translate(b.x, b.y + dy); ctx.rotate(lean);
  // 3/4-view character sprites stay upright (don't spin); flip to face the cake.
  var cpx = cakePos().x; if (cpx < b.x) ctx.scale(-1, 1);
  ctx.scale(sx, sy);
  GF.drawSprite(b.type, 0, 0, base, function (c, x, y, sz) {
    var r = sz * 0.3;
    // legs
    c.strokeStyle = def.dark; c.lineWidth = Math.max(1.5, r * 0.12); c.lineCap = 'round';
    for (var L = -1; L <= 1; L++) {
      var ly = r * 0.45 * L;
      c.beginPath(); c.moveTo(-r * 0.6, ly); c.lineTo(-r * 1.25, ly - r * 0.35); c.moveTo(r * 0.6, ly); c.lineTo(r * 1.25, ly - r * 0.35); c.stroke();
    }
    if (def.flyer) { c.fillStyle = 'rgba(220,235,255,0.6)'; c.beginPath(); c.ellipse(-r * 0.5, -r * 0.6, r * 0.7, r * 0.4, -0.6, 0, 6.28); c.ellipse(r * 0.5, -r * 0.6, r * 0.7, r * 0.4, 0.6, 0, 6.28); c.fill(); }
    // body
    c.fillStyle = def.body; c.beginPath(); c.ellipse(0, 0, r * 0.78, r, 0, 0, 6.28); c.fill();
    c.fillStyle = def.dark; c.beginPath(); c.ellipse(0, -r * 0.7, r * 0.55, r * 0.5, 0, 0, 6.28); c.fill();
    if (def.boss) { c.fillStyle = '#ffd34d'; c.beginPath(); c.moveTo(-r * 0.4, -r); c.lineTo(-r * 0.2, -r * 1.4); c.lineTo(0, -r); c.lineTo(r * 0.2, -r * 1.4); c.lineTo(r * 0.4, -r); c.fill(); }
    // eyes
    c.fillStyle = '#fff'; c.beginPath(); c.arc(-r * 0.22, -r * 0.7, r * 0.16, 0, 6.28); c.arc(r * 0.22, -r * 0.7, r * 0.16, 0, 6.28); c.fill();
    c.fillStyle = '#222'; c.beginPath(); c.arc(-r * 0.22, -r * 0.68, r * 0.08, 0, 6.28); c.arc(r * 0.22, -r * 0.68, r * 0.08, 0, 6.28); c.fill();
  });

  if (b.maxhp > 1 && b.hp < b.maxhp && !b.silent) {
    var w = b.r * 2 * S, hx = b.x - w / 2, hy = b.y - b.r * S - 10 * S;
    ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(hx, hy, w, 4 * S);
    ctx.fillStyle = def.glow; ctx.fillRect(hx, hy, w * (b.hp / b.maxhp), 4 * S);
  }

}

function txt(ctx, s, x, y, size, col, align) {

  ctx.fillStyle = feverActive ? '#ff5ad0' : '#ffd34d'; GF.rr(ctx, fx, fy, fw * GF.clamp(fr, 0, 1), 8 * S, 4 * S); ctx.fill();

function drawShop(ctx) {
  var W = GF.W, H = GF.H, S = GF.S, isColony = shopTab === 'colony';

  for (var t = 0; t < SHOP_TABS.length; t++) {

  }

  function tapThreat() {
    var cp = cakePos(), best = null, bd = 1e9;
    for (var i = 0; i < bugs.length; i++) { var d = GF.dist(bugs[i].x, bugs[i].y, cp.x, cp.y); if (d < bd) { bd = d; best = bugs[i]; } }
    if (queen && queen.y > -40 * GF.S) { var dq = GF.dist(queen.x, queen.y, cp.x, cp.y); if (dq < bd) { bd = dq; best = queen; } }
    if (best) smashAt(best.x, best.y);
    return !!best;
  }
  while (iters++ < maxIters && gameSec < maxGameSec && colonies <= maxColonies) {
    if (gs === 'GAMEOVER') {
      if (firstColonyDeath == null) firstColonyDeath = { wave: bestWaveThisRun, rj: lastRJgain };
      colonyLog.push({ wave: bestWaveThisRun, rj: lastRJgain });
      spendRJ(); newGame(); colonies++; continue;   // start a fresh colony with stronger meta
    }
    if (welcomePanel) welcomePanel = false;
    if (gs === 'SHOP') {
      buyPass();
      if (coreMaxed()) { coreDoneMin = +(gameSec / 60).toFixed(1); break; }
      startWave(wave + 1);
      continue;   // next wave is instant (shop dwell excluded from active-play minutes)
    }
    if (gs !== 'PLAYING') { gs = 'PLAYING'; continue; }
    if (wave > waveReached) waveReached = wave;
    tapBudget += tapRate * dt;
    var guard2 = 0;
    while (tapBudget >= 1 && guard2++ < 50) { tapBudget -= 1; if (!tapThreat()) { tapBudget = 0; break; } }
    update(dt);
    gameSec += dt;
  }
  var rows = allShopRows();
  var unbounded = { frogDmgLvl: dlvl.frog.dmg, hiveLvl: meta.hive };   // these never "max" by design
  return {
    tapRate: tapRate, coreMaxedAllCapped: coreMaxed(), coreMaxedAtMin: coreDoneMin,
    gameMinutes: +(gameSec / 60).toFixed(1), colonies: colonies, waveReached: waveReached, bestWave: bestWave,
    firstColony: firstColonyDeath, totalRJ: rj, meta: { hive: meta.hive, fatcake: meta.fatcake, vet: meta.vet },
    unbounded: unbounded,
    colonyWaves: colonyLog.slice(0, 24).map(function (c) { return c.wave; }),   // best wave per colony -> shows prestige speedup
    cappedRemaining: cappedGooRows(rows).filter(function (r) { return !r.max; }).length,
    iters: iters,
  };
};

// ════════════════════════════════════════════════════════════════════════
//  BOOT
// ════════════════════════════════════════════════════════════════════════
GF.init({
  designW: 800, designH: 600,
  strings: STRINGS, sprites: SPRITE_NAMES, saveKey: 'bug_beat',
  onReady: function () {
    loadMeta();
    layout();
    // real frame-animated FX spritesheets (CC0) — synced via sprites/
    loadFX('splat', 'sprites/fx_splat.png', 4, 4, 11, 28, 3);   // green goo burst (skip faint intro frames)
    loadFX('pow', 'sprites/fx_pow.png', 4, 4, 12, 44, 0);       // on-beat star/pow flash
    loadFX('poof', 'sprites/fx_poof.png', 6, 5, 26, 44, 0);     // puff (boss vanish)
    try { if (document.fonts && document.fonts.load) { document.fonts.load('16px Silk'); document.fonts.load('bold 16px Silk'); } } catch (e) {}
    GF.exposeState(function () { return { gs: gs, noise: testInputNoise, score: score, wave: wave, cakeHP: cakeHP, combo: combo, fever: Math.round(feverActive ? feverT : feverCharge), bugs: bugs.length, goo: goo, frogs: frogs, defenders: totalDefenders(), spider: extras.spider, hedgehog: extras.hedgehog, bird: extras.bird, dying: dying.length, deb: deb.length }; });

    // Reachability gate (Yandex 1.10.x): report each screen's interactive rects so
    // the checker can prove no button hides under platform chrome. Rects are filled
    // by draw(); exposeTour lets the gate visit each screen first.
    GF.exposeReach(function () {
      var items = [];
      function push(b, id) { if (b) items.push({ id: id, x: b.x, y: b.y, w: b.w, h: b.h, pinned: true }); }
      if (welcomePanel) { push(R.wcollect, 'collect'); push(R.mute, 'mute'); return { screen: 'WELCOME', items: items, viewportH: GF.H, screenH: GF.H }; }
      if (gs === 'SHOP') {
        for (var ti = 0; ti < (R.tabs || []).length; ti++) { var tb = R.tabs[ti]; items.push({ id: 'tab_' + tb.tab, x: tb.x, y: tb.y, w: tb.w, h: tb.h, pinned: true }); }
        for (var i = 0; i < shopItems.length; i++) { var it = shopItems[i]; if (it.rect) items.push({ id: 'shop_' + it.id.replace(/:/g, '_'), x: it.rect.x, y: it.rect.y, w: it.rect.w, h: it.rect.h, pinned: true }); }
        push(R.prestige, 'prestige'); push(R.next, 'next');
      }
      else if (gs === 'PAUSE') { push(R.resume, 'resume'); push(R.prestart, 'restart'); push(R.phelp, 'help'); }
      else if (gs === 'GAMEOVER') { push(R.retry, 'retry'); }
      else if (helpOpen) { push(R.helpclose, 'close'); }
      else { push(R.pause, 'pause'); push(R.help, 'help'); }
      push(R.mute, 'mute');
      return { screen: helpOpen ? 'HELP' : gs, items: items, viewportH: GF.H, screenH: GF.H };
    });
    GF.exposeTour([
      { name: 'playing', go: function () { coachActive = false; GF.tutorial.active = false; helpOpen = false; gs = 'PLAYING'; } },
      { name: 'shop', go: function () { coachActive = false; GF.tutorial.active = false; goo = 40; buildShop(); gs = 'SHOP'; } },
      { name: 'pause', go: function () { helpOpen = false; gs = 'PAUSE'; } },
      { name: 'help', go: function () { helpOpen = true; } },
      { name: 'gameover', go: function () { helpOpen = false; if (!score) score = 120; gs = 'GAMEOVER'; } },
    ]);

    // Yandex 1.9 — persist + restore run across reload (bounce to a SAFE screen).
    GF.persist('bug_beat_run_v1',
      function () { return { gs: gs === 'PLAYING' ? 'SHOP' : gs, score: score, wave: wave, goo: goo, cakeHP: cakeHP, cakeHPmax: cakeHPmax, smashRadius: smashRadius, onBeatWindow: onBeatWindow, feverMax: feverMax, frogs: frogs, spider: extras.spider, hedgehog: extras.hedgehog, bird: extras.bird, dlvl: dlvl, tgr: totalGooThisRun, bwr: bestWaveThisRun, lastPlayed: Date.now() }; },
      function (s) {
        if (!s || !s.wave) return;
        score = s.score || 0; wave = s.wave || 1; goo = s.goo || 0;
        cakeHPmax = s.cakeHPmax || CAKE_HP_MAX0; cakeHP = s.cakeHP || cakeHPmax;
        smashRadius = s.smashRadius || SMASH_RADIUS0; onBeatWindow = s.onBeatWindow || ON_BEAT_WINDOW0;
        feverMax = s.feverMax || FEVER_MAX0; frogs = s.frogs || 0;
        extras = { spider: s.spider || 0, hedgehog: s.hedgehog || 0, bird: s.bird || 0 };
        if (s.dlvl) { for (var dk in dlvl) { if (s.dlvl[dk]) { dlvl[dk].dmg = s.dlvl[dk].dmg || 0; dlvl[dk].spd = s.dlvl[dk].spd || 0; dlvl[dk].rng = s.dlvl[dk].rng || 0; } } }
        totalGooThisRun = s.tgr || 0; bestWaveThisRun = s.bwr || wave;
        _restored = (s.gs === 'GAMEOVER') ? 'GAMEOVER' : 'SHOP';
        // IDLE: while you were away, your defenders kept earning goo (capped 3h).
        // Only a live run (cake intact) keeps earning — a dead run earns nothing.
        if (_restored !== 'GAMEOVER' && totalDefenders() > 0) {
          // idle pays a BOUNDED welcome-back bonus (~2-4 upgrades), never "buy everything":
          // rate 0.04 goo/defender/sec, capped at 3h (balance research vs The Tower / idle-TD).
          var elapsed = Math.max(0, Date.now() - (s.lastPlayed || Date.now())) / 1000;  // clamp clock skew
          var off = Math.floor(Math.min(elapsed, 3 * 3600) * totalDefenders() * 0.04 * gooMult());
          if (off > 0) { goo += off; welcomeGoo = off; }
        }
      }
    );

    // Drumless melodic bed at OUR beat tempo; the player's smashes supply the
    // percussion (snare/kick/etc.). startMusic binds its own first-gesture start.
    // NO background music bed (Tim 2026-06-23) — the SMASHES make the music: every
    // bug kill plays a drum (+ a note from your own smashes), quantized to the beat
    // grid. The beat clock runs free (GF.beatInfo off -> RAF fallback). audioCtx
    // resumes on the first smash gesture. (music = emergent; loop = the beat grid.)
    GF.remoteConfig('bug_beat', CFG, {
      clamps: { 'tuning.speed_mult': [0.6, 1.6], 'tuning.spawn_mult': [0.6, 1.6] },
      onUpdate: function (c) { CFG = c; },
    }).then(function (c) { CFG = c; });

    if (window._silent) { gs = 'PLAYING'; startWave(Math.max(1, wave)); return; }

    if (_restored === 'GAMEOVER') { gs = 'GAMEOVER'; }
    else if (_restored === 'SHOP') { buildShop(); gs = 'SHOP'; if (welcomeGoo > 0) { welcomePanel = true; GF.saveRun(); } }   // re-stamp lastPlayed NOW so a reload can't re-farm the offline reward
    else { GF.gameStarted(); startCoach(); }   // boots STRAIGHT into play + interactive coach

    // HARD RULE 9 — platform builds must open IN gameplay, never on a static screen.
    // This game already boots into PLAYING; on a platform autostart, force a fresh
    // live run (suppressing the coach) if a restore left it on a non-play screen.
    if (window.__GF_AUTOSTART && !window._silent && gs !== 'PLAYING') { coachActive = false; GF.tutorial.active = false; newGame(); }
  },
  onUpdate: update,
  onDraw: draw,
});
var _restored = null;

// pointer input — single unified handler (mouse + touch), game coords
GF.canvas.addEventListener('pointerdown', function (e) {
  e.preventDefault();
  var p = toGame(e);
  onPress(p.x, p.y);
}, { passive: false });
window.addEventListener('resize', layout);
window.addEventListener('orientationchange', function () { setTimeout(layout, 80); });

// PLAY/RETRY locator for QA gates (no menu game → point them at the active button)
window.__gfPlayRect = function () {
  try {
    var b = gs === 'GAMEOVER' ? R.retry : (gs === 'SHOP' ? R.next : null);
    if (!b) return null;
    var rct = GF.canvas.getBoundingClientRect(), sx = rct.width / GF.canvas.width, sy = rct.height / GF.canvas.height;
    return { x: rct.left + b.x * sx, y: rct.top + b.y * sy, w: b.w * sx, h: b.h * sy, cx: rct.left + (b.x + b.w / 2) * sx, cy: rct.top + (b.y + b.h / 2) * sy };
  } catch (e) { return null; }
};

})();
</script>
