// ── PROCEDURAL SYNTH ENGINE (BACKGROUND AUDIO CHANNELS) ────────────────────
var SYNTH = { ctx: null, master: null, on: false, step: 0, nextT: 0, timer: null, bpm: 120 };

function synthEnsure() {
  if (SYNTH.ctx) return;
  try {
    SYNTH.ctx = new (window.AudioContext || window.webkitAudioContext)();
    SYNTH.master = SYNTH.ctx.createGain();
    SYNTH.master.gain.value = 0;
    SYNTH.master.connect(SYNTH.ctx.destination);
  } catch (e) {
    console.error("WebAudio not supported or blocked");
  }
}

function playSynthOsc(freq, t, dur, type, gain, slideTo) {
  if (!SYNTH.ctx || GF.muted) return;
  try {
    var o = SYNTH.ctx.createOscillator(), g = SYNTH.ctx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    if (slideTo) {
      o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
    }
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(gain, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g);
    g.connect(SYNTH.master);
    o.start(t);
    o.stop(t + dur + 0.02);
  } catch (e) {}
}

function playProceduralSlamSfx() {
  if (!SYNTH.ctx || GF.muted) return;
  try {
    var now = SYNTH.ctx.currentTime;

    playSynthOsc(70, now, 0.60, 'sine', 0.40, 20);

    for (var i = 0; i < 6; i++) {

    }
  } catch (e) {}
}

// Epic celestial rhythm bed: Deep ritualistic drums and mystical chords
function synthSchedule() {
  if (!SYNTH.ctx) return;
  SYNTH.master.gain.value = GF.muted ? 0 : 0.14;
  
  if (SYNTH.nextT < SYNTH.ctx.currentTime) {
    SYNTH.nextT = SYNTH.ctx.currentTime + 0.05;
  }
  
  var spb = 60 / SYNTH.bpm / 2; // 8th note seconds
  
  while (SYNTH.nextT < SYNTH.ctx.currentTime + 0.15) {
    var s = SYNTH.step % 16;
    if (s === 0) {
      // Bar starter chord
      if (gs === 'PLAYING') {
        var baseNotes = [110, 130, 146, 165]; // E2..G2..A2..B2
        var root = baseNotes[eraIndex % baseNotes.length];
        playSynthOsc(root, SYNTH.nextT, spb * 6, 'sine', 0.18);
        playSynthOsc(root * 1.5, SYNTH.nextT, spb * 4, 'triangle', 0.08); // fifth
        if (eraIndex === 2) { // Sci-Fi NeoTokyo neon pad
          playSynthOsc(root * 2.0, SYNTH.nextT, spb * 6, 'square', 0.03);
        }
      }
    }
    
    // Tribal thunder beats (Kicks / deep rumbles)
    if (gs === 'PLAYING') {
      if (s === 0 || s === 4 || s === 8 || s === 12) {
        // Heavy drum kick
        var fq = s === 0 ? 90 : 70;
        playSynthOsc(fq, SYNTH.nextT, 0.16, 'sine', 0.30, 35);
      }
      if (s === 6 || s === 14) {
        // Deep ritual snare rumble
        playSynthOsc(120, SYNTH.nextT, 0.08, 'sawtooth', 0.08, 40);
      }
    }
    
    SYNTH.nextT += spb;
    SYNTH.step++;
  }
  
  SYNTH.timer = setTimeout(synthSchedule, 30);
}

function startDivineRhythm() {
  synthEnsure();
  if (!SYNTH.ctx) return;
  if (SYNTH.ctx.state === 'suspended') {
    try { SYNTH.ctx.resume(); } catch (e) {}
  }
  if (SYNTH.on) return;
  SYNTH.on = true;
  SYNTH.step = 0;
  SYNTH.nextT = SYNTH.ctx.currentTime + 0.05;
  synthSchedule();
}

function resumeAudio() {
  if (SYNTH.ctx && !GF.muted) {
    try { SYNTH.ctx.resume(); } catch (e) {}
  }
}

    // Direct gesture triggers for sound activation

    window.addEventListener('touchstart', unlockAudio, { passive: true });

      function() { return { meta: meta, score: score, eraIndex: eraIndex }; },
      function(data) {
        if (!data) return;
        if (data.meta) {
          meta = data.meta;
          highScore = meta.highScore || 0;
          mana = meta.mana || 0;
        }
        if (data.score) score = data.score;
        if (data.eraIndex !== undefined) {
          eraIndex = data.eraIndex;
          currentEra = ERAS[eraIndex];
        }
      }
    );
    
    // Setup inputs
    setupPointerListeners();
    
    // Initialize first world layout
    resetEraWorld();
    
    gs = 'MENU';
    GF.gameStarted();
  },
  onUpdate: update,
  onDraw: draw
});

// ── SAVE / LOAD CONTROLLER ────────────────────────────────────────────────
function loadMetaData() {
  try {
    var raw = localStorage.getItem('gods_finger_meta');
    if (raw) {
      var parse = JSON.parse(raw);
      if (parse) {
        meta = Object.assign(meta, parse);
        highScore = meta.highScore || 0;
        mana = meta.mana || 0;
      }
    }
  } catch (e) {}
}

function saveMetaData() {
  try {
    meta.highScore = highScore;
    meta.mana = mana;
    localStorage.setItem('gods_finger_meta', JSON.stringify(meta));
  } catch (e) {}
}

function checkpoint() {
  saveMetaData();
  GF.saveRun();
}

// ── PROCEDURAL WORLD GENERATION ───────────────────────────────────────────
function resetEraWorld() {
  buildings = [];
  citizens = [];
  shards = [];
  craters = [];
  explosions = [];
  shockwaves = [];
  cameraX = 0;
  targetCameraX = 0;
  
  eraTotalBuildings = currentEra.density;
  eraDestroyedBuildings = 0;
  clearPercentage = 0;
  
  var spacing = 160;
  var startX = 200;
  
  for (var i = 0; i < currentEra.density; i++) {
    var bX = startX + i * (120 + Math.random() * 80);
    var bW = 70 + Math.random() * 50;
    
    // Random height / segment structure per era
    var floorsCount = 2 + Math.floor(Math.random() * 3);
    if (currentEra.id === 'medieval') {
      floorsCount = 1 + Math.floor(Math.random() * 2);
    } else if (currentEra.id === 'modern' || currentEra.id === 'neotokyo') {
      floorsCount = 3 + Math.floor(Math.random() * 4); // tall skyscrapers!
    }
    
    var bH = floorsCount * (28 + Math.random() * 12);
    
    // Construct floors
    var floors = [];
    var floorH = bH / floorsCount;
    for (var f = 0; f < floorsCount; f++) {
      floors.push({
        id: f,
        hp: 1,
        maxHp: 1,
        h: floorH,
        yOffset: f * floorH, // offset off floor bottom
        targetYOffset: f * floorH, // collapsing target
        currentYOffset: f * floorH,
        destroyed: false
      });
    }
    
    // Building structure
    var bType = currentEra.types[Math.floor(Math.random() * currentEra.types.length)];
    var isExplosive = (currentEra.id === 'modern' && Math.random() < 0.25) || (currentEra.id === 'neotokyo' && Math.random() < 0.20);
    
    buildings.push({
      id: i,
      x: bX,
      w: bW,
      h: bH,
      maxH: bH,
      type: bType,
      color: currentEra.colors[Math.floor(Math.random() * currentEra.colors.length)],
      material: getEraMaterial(currentEra.id, bType),
      floors: floors,
      destroyed: false,
      onFire: false,
      fireTimer: 0,
      explosive: isExplosive,
      collapseDelay: 0
    });
    
    // Add citizens around buildings
    var citizenCount = 2 + Math.floor(Math.random() * 3);
    for (var cNum = 0; cNum < citizenCount; cNum++) {
      citizens.push({
        id: citizens.length,
        x: bX + Math.random() * bW,
        y: groundY(),
        vx: (Math.random() > 0.5 ? 1 : -1) * (0.3 + Math.random() * 0.4),
        state: 'WALK', // WALK, PANIC, FLY
        panicTimer: 0,
        flyX: 0, flyY: 0, flyVx: 0, flyVy: 0, flyRot: 0, flyVRot: 0,
        color: ['#ff6b6b', '#4dadf7', '#ffd43b', '#69db7c', '#da77f2', '#ff922b'][Math.floor(Math.random() * 6)]
      });
    }
  }
}

function getEraMaterial(era, type) {
  if (era === 'medieval') {
    return (type === 'castle' || type === 'tower') ? 'stone' : 'wood';
  } else if (era === 'modern') {
    return (type === 'skyscrape' || type === 'office') ? 'glass' : 'brick';
  } else if (era === 'neotokyo') {
    return 'neon';
  } else if (era === 'pantheon') {
    return 'stone';
  } else if (era === 'alien') {
    return 'organic';
  }
  return 'stone';
}

// ── POINTER INPUT CONTROLLER ──────────────────────────────────────────────
function setupPointerListeners() {
  var cv = GF.canvas;
  
  // Custom pointer movement to support perfect desktop hover
  cv.addEventListener('pointerdown', function(e) {
    if (gs !== 'PLAYING') return;
    
    // Calculate relative mouse coordinates inside the DESIGN canvas boundaries
    var rect = cv.getBoundingClientRect();
    var S = GF.S;
    var clientX = e.clientX - rect.left;
    var clientY = e.clientY - rect.top;
    
    // Scale down from client size to design canvas size
    var mx = clientX / S;
    var my = clientY / S;
    
    if (checkInGameButtonsClick(mx, my)) return;
    
    isPressing = true;
    fX = mx + cameraX;
    fTargetY = groundY();
    
    lastPressX = mx;
    lastPressY = my;
    lastSweepX = fX;
    dragSweepDist = 0;
    
    // Trigger the slam action
    slamFingerAt(fX, fTargetY);
  });
  
  cv.addEventListener('pointermove', function(e) {
    var rect = cv.getBoundingClientRect();
    var S = GF.S;
    var clientX = e.clientX - rect.left;
    var clientY = e.clientY - rect.top;
    
    var mx = clientX / S;
    var my = clientY / S;
    
    // Move finger coordinates
    fX = mx + cameraX;
    
    if (isPressing) {
      // Continuously scrape/crush the ground as the finger drags
      fTargetY = groundY();
      
      dragSweepDist += Math.abs(fX - lastSweepX);
      
      // Multi-shatter trace during active drag
      if (Math.abs(fX - lastSweepX) > 15) {
        dragSweepFingerSlam(fX);
        lastSweepX = fX;
      }
    } else {
      fTargetY = my < groundY() - 120 ? my : groundY() - 120;
    }
  });
  
  cv.addEventListener('pointerup', function(e) {
    isPressing = false;
    fTargetY = fHoverY; // Rest back in clouds
    checkpoint();
  });
}

function checkInGameButtonsClick(mx, my) {
  // If overlay is open, block gameplay clicks
  if (shopOpen || skinsOpen) return true;
  
  var screenW = visibleDesignW();
  var screenH = visibleDesignH();
  
  // Spell buttons
  // Meteor: bottom left
  if (mx >= 20 && mx <= 150 && my >= screenH - 80 && my <= screenH - 20) {
    if (cooldowns.meteor <= 0) {
      triggerMeteorShower();
    } else {
      GF.sfx('error');
    }
    return true;
  }
  
  // Earthquake: second button on bottom
  if (mx >= 170 && mx <= 300 && my >= screenH - 80 && my <= screenH - 20) {
    if (cooldowns.quake <= 0) {
      triggerEarthquake();
    } else {
      GF.sfx('error');
    }
    return true;
  }
  
  // Powers button (bottom-right drawer)
  if (mx >= screenW - 140 && mx <= screenW - 20 && my >= screenH - 80 && my <= screenH - 20) {
    GF.sfx('click');
    shopOpen = true;
    return true;
  }
  
  // Mute Button: top right
  if (mx >= screenW - 60 && mx <= screenW - 20 && my >= 20 && my <= 60) {
    GF.toggleMute();
    return true;
  }
  
  return false;
}

// ── DESTRUCTION CONTROLLERS ───────────────────────────────────────────────
function slamFingerAt(worldX, worldY) {
  // Spawn shock impact and start visual descend
  fY = -120; // drop finger fast from top cloud line
  
  // Meow skin flavor sfx
  if (meta.equippedSkin === 'cat') {
    playProceduralMeowSfx();
  } else {
    playProceduralSlamSfx();
  }
  
  executeCrushStrike(worldX, groundY());
}

function dragSweepFingerSlam(worldX) {
  // Smaller continuous friction strike as the giant hand sweeps/drags
  executeCrushStrike(worldX, groundY(), true);
}

function executeCrushStrike(hitX, hitY, isDragSweep) {
  var sizeLvl = meta.upgrades.radius;
  var rValue = UPGRADES.radius.vals[sizeLvl];
  var smashR = isDragSweep ? rValue * 0.75 : rValue;
  
  GF.setShake(isDragSweep ? 0.4 : 1.4);
  
  // Spawn spark impact clouds
  var flashCol = SKINS.find(s => s.id === meta.equippedSkin).auraColor;
  GF.spawnParticles(hitX - cameraX, hitY, flashCol, isDragSweep ? 4 : 15);
  spawnGroundDust(hitX, hitY, isDragSweep ? 6 : 18);
  
  // Create permanent ground crater
  if (!isDragSweep || Math.random() < 0.25) {
    craters.push({
      x: hitX,
      y: hitY,
      r: smashR * (0.6 + Math.random() * 0.4),
      alpha: 1.0,
      lava: meta.upgrades.lava > 0,
      type: SKINS.find(s => s.id === meta.equippedSkin).craterType
    });
  }
  
  // Shockwave ring (Upgrade dependent)
  if (!isDragSweep && meta.upgrades.shockwave > 0) {
    var swLvl = meta.upgrades.shockwave;
    var maxSwR = UPGRADES.shockwave.vals[swLvl];
    shockwaves.push({
      x: hitX,
      y: hitY,
      r: 10,
      maxR: maxSwR,
      dmg: swLvl * 0.4
    });
  }
  
  // Check building collisions
  var hitCount = 0;
  for (var i = 0; i < buildings.length; i++) {
    var b = buildings[i];
    if (b.destroyed) continue;
    
    // Check overlapping bounding box
    var nearestB_X = Math.max(b.x, Math.min(hitX, b.x + b.w));
    var distToB = Math.abs(nearestB_X - hitX);
    
    if (distToB <= smashR) {
      // Damage the building floors
      damageBuildingAtHeight(b, hitY - 30, isDragSweep ? 1 : 2);
      hitCount++;
    }
  }
  
  // Citizens reaction inside smash radius
  for (var k = 0; k < citizens.length; k++) {
    var c = citizens[k];
    if (c.state === 'FLY') continue;
    
    var dToCitizen = Math.abs(c.x - hitX);
    if (dToCitizen <= smashR) {
      launchCitizen(c, hitX);
    } else if (dToCitizen <= smashR * 3.5) {
      // Scare them!
      c.state = 'PANIC';
      c.panicTimer = 4.0;
      c.vx = (c.x > hitX ? 1 : -1) * (1.8 + Math.random() * 1.5);
    }
  }
  
  // Play crumbling sound if we slammed a building
  if (hitCount > 0) {
    GF.sfx('hit');
  }
}

function damageBuildingAtHeight(b, strikeY, damageAmount) {
  var bBottom = groundY();
  
  // Find which floor was struck
  var relativeStrikeY = bBottom - strikeY; // height from the building foundation
  
  // Find floor closest to hit height
  var hitFloor = null;
  for (var i = 0; i < b.floors.length; i++) {
    var fl = b.floors[i];
    if (fl.destroyed) continue;
    var flBottomHeight = fl.currentYOffset;
    var flTopHeight = fl.currentYOffset + fl.h;
    
    if (relativeStrikeY >= flBottomHeight - 15 && relativeStrikeY <= flTopHeight + 15) {
      hitFloor = fl;
      break;
    }
  }
  
  // Default to highest standing floor if nothing matched directly
  if (!hitFloor) {
    for (var i = b.floors.length - 1; i >= 0; i--) {
      if (!b.floors[i].destroyed) {
        hitFloor = b.floors[i];
        break;
      }
    }
  }
  
  if (hitFloor) {
    hitFloor.hp -= damageAmount;
    
    // Spawn gorgeous flying shards
    spawnDebrisShards(b.x + b.w / 2, bBottom - hitFloor.currentYOffset - hitFloor.h / 2, b.material, 12);
    
    // Lava upgrade: Ignite chance!
    if (meta.upgrades.lava > 0 && Math.random() < UPGRADES.lava.vals[meta.upgrades.lava]) {
      igniteBuilding(b);
    }
    
    if (hitFloor.hp <= 0) {
      hitFloor.destroyed = true;
      triggerFloorCollapse(b, hitFloor);
    }
  }
  
  recalcBuildingVisualHeights(b);
}

function igniteBuilding(b) {
  if (b.onFire) return;
  b.onFire = true;
  b.fireTimer = 0;
  GF.spawnFloat(b.x + b.w/2 - cameraX, groundY() - b.h - 10, "IGNITED!", "#ff4500");
}

function triggerFloorCollapse(b, collapsedFl) {
  // Sfx feedback
  GF.sfx('hurt');
  
  // Add collapse dust at floor layer
  var bBottom = groundY();
  spawnFloorDust(b.x + b.w / 2, bBottom - collapsedFl.currentYOffset, b.w, 10);
  
  // Reward mana + points
  var gain = 15;
  if (b.material === 'glass' || b.material === 'neon') gain = 25;
  if (b.material === 'organic') gain = 35;
  score += gain;
  mana += Math.floor(gain * 0.4);
  GF.spawnFloat(b.x + b.w / 2 - cameraX, bBottom - collapsedFl.currentYOffset - collapsedFl.h, "+" + gain, "#ffd700");
  
  // Chain reaction: explosive buildings trigger actual screen blast on collapse!
  if (b.explosive && !b.exploded) {
    b.exploded = true;
    b.onFire = false; // fire consumed by explosion
    triggerHugeExplosion(b.x + b.w/2, bBottom - collapsedFl.currentYOffset, 120);
  }
}

function triggerHugeExplosion(worldX, worldY, radius) {
  explosions.push({
    x: worldX,
    y: worldY,
    r: 10,
    maxR: radius,
    timer: 0,
    life: 0.5 // half second
  });
  
  GF.setShake(1.6);
  GF.sfx('evolve'); // dynamic explosion sound pitch
  
  // Blow up surrounding buildings
  for (var i = 0; i < buildings.length; i++) {
    var otherB = buildings[i];
    if (otherB.destroyed) continue;
    
    var nearestX = Math.max(otherB.x, Math.min(worldX, otherB.x + otherB.w));
    var bBottom = groundY();
    var dist = GF.dist(worldX, worldY, nearestX, bBottom - otherB.h / 2);
    
    if (dist <= radius) {
      // Sledge damage all floors
      otherB.floors.forEach(function(fl) {
        if (!fl.destroyed) {
          fl.hp -= 3;
          if (fl.hp <= 0) {
            fl.destroyed = true;
            triggerFloorCollapse(otherB, fl);
          }
        }
      });
      igniteBuilding(otherB);
      recalcBuildingVisualHeights(otherB);
    }
  }
  
  // Launch citizens
  for (var k = 0; k < citizens.length; k++) {
    var c = citizens[k];
    if (c.state === 'FLY') continue;
    var dToC = Math.abs(c.x - worldX);
    if (dToC <= radius) {
      launchCitizen(c, worldX);
    }
  }
}

function recalcBuildingVisualHeights(b) {
  // Update target offsets of active floors based on what crumbled below them
  var currentYOffset = 0;
  var allDead = true;
  
  for (var i = 0; i < b.floors.length; i++) {
    var fl = b.floors[i];
    if (!fl.destroyed) {
      fl.targetYOffset = currentYOffset;
      currentYOffset += fl.h;
      allDead = false;
    }
  }
  
  b.h = currentYOffset; // new total height
  
  if (allDead && !b.destroyed) {
    b.destroyed = true;
    eraDestroyedBuildings++;
    clearPercentage = (eraDestroyedBuildings / eraTotalBuildings) * 100;
    
    // Check if highscore or complete
    if (score > highScore) {
      highScore = score;
    }
    
    // Sfx reward
    GF.sfx('levelup');
    GF.spawnFloat(b.x + b.w/2 - cameraX, groundY() - 12, "DESTROYED!", "#00ff7f");
    
    // High destruction state check
    if (eraDestroyedBuildings === eraTotalBuildings) {
      gs = 'COMPLETED';
      GF.sfx('win');
      GF.happytime();
    }
  }
}

function launchCitizen(c, sourceX) {
  c.state = 'FLY';
  c.flyX = c.x;
  c.flyY = c.y - 4;
  
  // Launch upward and outward!
  var dir = c.x > sourceX ? 1 : -1;
  c.flyVx = dir * (2 + Math.random() * 6);
  c.flyVy = -(6 + Math.random() * 11);
  c.flyRot = 0;
  c.flyVRot = (Math.random() > 0.5 ? 1 : -1) * (0.05 + Math.random() * 0.15);
  
  playProceduralScreamSfx();
  
  // Big mana points fly up!
  score += 10;
  mana += 5;
  GF.spawnFloat(c.x - cameraX, c.y - 40, "+5 Mana", "#00ffff");
}

// ── ACTIVE DIVINE SPELLS ──────────────────────────────────────────────────

  meteorActiveTimer = 3.5; // active meteors falling for 3.5s

}

function triggerEarthquake() {

}

function spawnRandomMeteor() {
  var bBottom = groundY();
  // Choose target X within visible bounds
  var targetX = cameraX + 50 + Math.random() * (visibleDesignW() - 100);
  
  var meteor = {
    x: targetX - 250, // launch from angle top-left
    y: -80,
    tx: targetX,

  });

// ── DRAWING SYSTEM (RENDERING ROUTINES) ───────────────────────────────────
function draw() {
  var ctx = GF.ctx;
  var S = GF.S;
  var screenW = visibleDesignW();
  var screenH = visibleDesignH();
  
  ctx.save();
  ctx.scale(S, S);
  
  // Apply visual screen shakes
  var shakeOffset = GF.setShake ? GF.setShake : function(){ return 0; };
  // Let's implement local camera shake offset
  var shkX = (Math.random() - 0.5) * currentShakeAmt * 12;
  var shkY = (Math.random() - 0.5) * currentShakeAmt * 12;
  ctx.translate(shkX, shkY);
  
  // 1. Sky background gradient
  var skyGrad = ctx.createLinearGradient(0, 0, 0, screenH);
  skyGrad.addColorStop(0, currentEra.sky[0]);
  skyGrad.addColorStop(GROUND_Y_RATIO, currentEra.sky[1]);
  ctx.fillStyle = skyGrad;
  ctx.fillRect(0, 0, screenW, screenH);
  
  // 2. Draw stars/glowing clouds for atmosphere
  drawSkyAtmosphere(ctx);
  
  // 3. Mountains parallax
  drawParallaxMountains(ctx);
  
  // Translate camera for gameplay layers
  ctx.save();
  ctx.translate(-cameraX, 0);
  
  // 4. Ground base landscape
  drawGroundLandscape(ctx);
  
  // 5. Craters
  drawCraters(ctx);
  
  // 6. Buildings and collateral collapses
  drawBuildings(ctx);
  
  // 7. Citizens (NPCs)
  drawCitizens(ctx);
  
  // 8. Custom Debris Shards
  drawDebrisShardsList(ctx);
  
  // 9. Explosions & shockwaves
  drawExplosionsAndShockwaves(ctx);
  
  // 10. Spell indicators (Meteors, Lightning)
  drawActiveSpells(ctx);
  
  ctx.restore(); // end camera transform
  
  // 11. God's Finger (Shadow casting & actual descending limb)
  drawGodsFinger(ctx);
  
  // 12. Float texts
  drawFloatTextsList(ctx);
  
  // 13. Main Heads Up Display & Overlays
  drawHUD(ctx);

  if (gs === 'MENU') {
    drawMenuScreen(ctx);
  } else if (gs === 'GAMEOVER') {
    drawGameOverScreen(ctx, false);
  } else if (gs === 'COMPLETED') {
    drawGameOverScreen(ctx, true);
  }

  if (shopOpen) {
    drawShopDrawer(ctx);
  }

  if (showInstructions) {
    drawInstructionsPanel(ctx);
  }
  
  ctx.restore(); // end scaling
}

function drawSkyAtmosphere(ctx) {
  // Drift clouds
  ctx.fillStyle = 'rgba(255, 255, 255, 0.08)';
  for (var i = 0; i < backgroundClouds.length; i++) {
    var cl = backgroundClouds[i];
    // Draw cloud puffs
    ctx.beginPath();
    ctx.arc(cl.x - cameraX * 0.2, cl.y, cl.w * 0.4, 0, Math.PI * 2);
    ctx.arc(cl.x - cameraX * 0.2 + cl.w * 0.3, cl.y - 10, cl.w * 0.3, 0, Math.PI * 2);
    ctx.arc(cl.x - cameraX * 0.2 - cl.w * 0.3, cl.y + 5, cl.w * 0.28, 0, Math.PI * 2);
    ctx.fill();
  }
  
  // Era-specific neon stars/lightning
  if (currentEra.id === 'neotokyo') {
    // Cyber Grid
    ctx.strokeStyle = 'rgba(255, 0, 127, 0.12)';
    ctx.lineWidth = 1;
    for (var col = 0; col < visibleDesignW(); col += 60) {
      ctx.beginPath();
      ctx.moveTo(col, 200);
      ctx.lineTo(col, groundY());
      ctx.stroke();
    }
  }
}

function drawParallaxMountains(ctx) {
  var bBottom = groundY();
  var screenW = visibleDesignW();
  
  // Far layer (30% camera speed)
  ctx.fillStyle = currentEra.mountains[0];
  ctx.beginPath();
  ctx.moveTo(0, bBottom);
  ctx.lineTo(0, bBottom - 100);
  ctx.quadraticCurveTo(screenW * 0.25 - cameraX * 0.1, bBottom - 180, screenW * 0.5 - cameraX * 0.1, bBottom - 110);
  ctx.quadraticCurveTo(screenW * 0.75 - cameraX * 0.1, bBottom - 190, screenW - cameraX * 0.1, bBottom - 90);
  ctx.lineTo(screenW, bBottom);
  ctx.closePath();
  ctx.fill();
  
  // Near layer (50% camera speed)
  ctx.fillStyle = currentEra.mountains[1];
  ctx.beginPath();
  ctx.moveTo(0, bBottom);
  ctx.lineTo(0, bBottom - 70);
  ctx.quadraticCurveTo(screenW * 0.15 - cameraX * 0.25, bBottom - 130, screenW * 0.4 - cameraX * 0.25, bBottom - 80);
  ctx.quadraticCurveTo(screenW * 0.7 - cameraX * 0.25, bBottom - 150, screenW - cameraX * 0.25, bBottom - 60);
  ctx.lineTo(screenW, bBottom);
  ctx.closePath();
  ctx.fill();
}

function drawGroundLandscape(ctx) {
  var gY = groundY();
  var totalW = Math.max(currentEra.density * 260 + 800, cameraX + visibleDesignW() + 800);
  
  // Base soil layer
  ctx.fillStyle = currentEra.ground;
  ctx.fillRect(0, gY, totalW, visibleDesignH() - gY);
  
  // Landscape highlight/border grass/neon line
  ctx.fillStyle = 'rgba(255,255,255,0.15)';
  ctx.fillRect(0, gY, totalW, 6);
  
  if (currentEra.id === 'neotokyo') {
    // Glowing neon highway trace
    ctx.fillStyle = '#ff007f';
    ctx.fillRect(0, gY + 14, totalW, 4);
    ctx.strokeStyle = '#00ffff';
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (var dx = 0; dx < totalW; dx += 80) {
      ctx.moveTo(dx, gY + 25);
      ctx.lineTo(dx + 40, gY + 25);
    }
    ctx.stroke();
  }
}

function drawCraters(ctx) {
  for (var i = 0; i < craters.length; i++) {
    var cr = craters[i];
    
    // Draw dark impact crater
    ctx.fillStyle = 'rgba(12, 6, 18, 0.75)';
    ctx.beginPath();
    ctx.arc(cr.x, cr.y + 4, cr.r, 0, Math.PI, false);
    ctx.fill();
    
    // Crack outlines
    if (cr.lava) {
      ctx.strokeStyle = '#ff4500';
      ctx.lineWidth = 3;
    } else if (cr.type === 'laser') {
      ctx.strokeStyle = '#00ffff';
      ctx.lineWidth = 2;
    } else {
      ctx.strokeStyle = 'rgba(0,0,0,0.4)';
      ctx.lineWidth = 2;
    }
    
    ctx.beginPath();
    ctx.arc(cr.x, cr.y, cr.r, 0, Math.PI, false);
    ctx.stroke();
    
    // Inner glows/lava cracks
    if (cr.lava || cr.type === 'lava') {
      ctx.fillStyle = '#ff8c00';
      ctx.beginPath();
      ctx.arc(cr.x, cr.y + 2, cr.r * 0.6, 0, Math.PI, false);
      ctx.fill();
    }
    
    // Cat paw details
    if (cr.type === 'paw') {
      ctx.fillStyle = 'rgba(255, 105, 180, 0.4)';
      // Four smaller toe craters above the main pad
      for (var d = -2; d <= 2; d++) {
        if (d === 0) continue;
        var tX = cr.x + d * (cr.r * 0.35);
        var tY = cr.y - cr.r * 0.25;
        ctx.beginPath();
        ctx.arc(tX, tY, cr.r * 0.20, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }
}

function drawBuildings(ctx) {
  var bBottom = groundY();
  
  for (var i = 0; i < buildings.length; i++) {
    var b = buildings[i];
    if (b.destroyed) {
      // Draw crushed rubble heap
      ctx.fillStyle = '#3a3a3d';
      ctx.beginPath();
      ctx.ellipse(b.x + b.w / 2, bBottom, b.w * 0.6, 12, 0, 0, Math.PI * 2);
      ctx.fill();
      
      ctx.fillStyle = '#1c1c1f';
      ctx.beginPath();
      ctx.ellipse(b.x + b.w / 2 - 10, bBottom, b.w * 0.3, 8, 0, 0, Math.PI * 2);
      ctx.ellipse(b.x + b.w / 2 + 15, bBottom, b.w * 0.4, 6, 0, 0, Math.PI * 2);
      ctx.fill();
      continue;
    }
    
    // Draw each floor segment from bottom to top
    for (var f = 0; f < b.floors.length; f++) {
      var fl = b.floors[f];
      if (fl.destroyed) continue;
      
      var flY = bBottom - fl.currentYOffset;
      var flH = fl.h;
      
      ctx.fillStyle = b.color;
      ctx.fillRect(b.x, flY - flH, b.w, flH);
      
      // Structural details (Era appropriate architectural layouts)
      drawBuildingStyleFeatures(ctx, b, fl, flY, flH);
    }
    
    // Render dynamic building fires
    if (b.onFire) {
      ctx.fillStyle = '#ff4500';
      for (var fL = 0; fL < 6; fL++) {
        var fireX = b.x + Math.random() * b.w;
        var fireY = bBottom - Math.random() * b.h;
        var fireR = 5 + Math.random() * 8;
        ctx.beginPath();
        ctx.arc(fireX, fireY, fireR, 0, Math.PI * 2);
        ctx.fill();
        
        // Yellow embers
        ctx.fillStyle = '#ffd700';
        ctx.beginPath();
        ctx.arc(fireX, fireY - 3, fireR * 0.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#ff4500';
      }
      playProceduralBurningSfx();
    }
    
    // Explosive sub-station hazard details
    if (b.explosive) {
      // Blinking warning light
      var blink = (Math.floor(Date.now() / 300) % 2 === 0);
      ctx.fillStyle = blink ? '#ff0000' : '#4a0000';
      ctx.beginPath();
      ctx.arc(b.x + b.w / 2, bBottom - b.h - 6, 4, 0, Math.PI * 2);
      ctx.fill();
      
      // HAZARD warning stripes on base floor
      if (!b.floors[0].destroyed) {
        ctx.fillStyle = '#ffd700';
        ctx.fillRect(b.x + 4, bBottom - 8, b.w - 8, 8);
        ctx.fillStyle = '#000000';
        for (var sx = b.x + 10; sx < b.x + b.w - 10; sx += 14) {
          ctx.beginPath();
          ctx.moveTo(sx, bBottom);
          ctx.lineTo(sx + 6, bBottom - 8);
          ctx.lineTo(sx + 10, bBottom - 8);
          ctx.lineTo(sx + 4, bBottom);
          ctx.fill();
        }
      }
    }
  }
}

function drawBuildingStyleFeatures(ctx, b, fl, flY, flH) {
  var bBottom = groundY();
  
  if (currentEra.id === 'medieval') {
    // Shingles/stone borders
    ctx.strokeStyle = 'rgba(0,0,0,0.25)';
    ctx.lineWidth = 2;
    ctx.strokeRect(b.x, flY - flH, b.w, flH);
    
    // Wooden crossbeams on houses
    if (b.type === 'house') {
      ctx.fillStyle = '#4a2511';
      ctx.fillRect(b.x, flY - flH, 4, flH);
      ctx.fillRect(b.x + b.w - 4, flY - flH, 4, flH);
      // X-beams
      ctx.beginPath();
      ctx.moveTo(b.x, flY);
      ctx.lineTo(b.x + b.w, flY - flH);
      ctx.moveTo(b.x + b.w, flY);
      ctx.lineTo(b.x, flY - flH);
      ctx.stroke();
    }
    // Windmill rotating sails
    if (b.type === 'mill' && fl.id === b.floors.length - 1) {
      var rot = (Date.now() * 0.001) % (Math.PI * 2);
      var mX = b.x + b.w / 2;
      var mY = flY - flH / 2;
      ctx.save();
      ctx.translate(mX, mY);
      ctx.rotate(rot);
      ctx.fillStyle = '#dfd5b1';
      ctx.strokeStyle = '#4a2511';
      ctx.lineWidth = 3;
      for (var s = 0; s < 4; s++) {
        ctx.rotate(Math.PI / 2);
        ctx.fillRect(4, -8, 55, 14);
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(55, 0);
        ctx.stroke();
      }
      ctx.restore();
    }
  } else if (currentEra.id === 'modern') {
    // Glass skyscraper layout
    ctx.fillStyle = 'rgba(255,255,255,0.1)';
    ctx.fillRect(b.x, flY - flH, b.w, flH);
    
    // Draw window grid
    ctx.fillStyle = '#e0f7fa';
    var winSize = 5;
    var winSpace = 8;
    for (var wx = b.x + 8; wx < b.x + b.w - 8; wx += winSize + winSpace) {
      for (var wy = flY - flH + 5; wy < flY - 5; wy += winSize + winSpace) {
        if (Math.random() < 0.88) { // some lights off
          ctx.fillStyle = '#ffd700';
        } else {
          ctx.fillStyle = '#263238';
        }
        ctx.fillRect(wx, wy, winSize, winSize);
      }
    }
  } else if (currentEra.id === 'neotokyo') {
    // Cyberpunk Neon ARC / Holo panels
    ctx.fillStyle = 'rgba(0,255,255,0.06)';
    ctx.fillRect(b.x, flY - flH, b.w, flH);
    
    // Draw neon accent stripes
    ctx.fillStyle = '#ff007f';
    ctx.fillRect(b.x, flY - flH, 3, flH);
    ctx.fillStyle = '#00ffff';
    ctx.fillRect(b.x + b.w - 3, flY - flH, 3, flH);
    
    // Moving holo-sign overlay
    if (b.type === 'holocenter' && fl.id === b.floors.length - 1) {
      var txtOffset = (Date.now() * 0.04) % (b.w + 60);
      ctx.save();
      ctx.rect(b.x + 4, flY - flH + 4, b.w - 8, flH - 8);
      ctx.clip();
      ctx.fillStyle = '#00ff55';
      ctx.font = 'bold 9px ' + FONT;
      ctx.fillText("NEO-TOK", b.x + b.w - txtOffset, flY - flH / 2 + 3);
      ctx.restore();
    }
  } else if (currentEra.id === 'pantheon') {
    // Marble Shrine / Columns
    ctx.strokeStyle = '#8b7e66';
    ctx.lineWidth = 1.5;
    ctx.strokeRect(b.x, flY - flH, b.w, flH);
    
    // Column details
    if (b.type === 'pantheon' || b.type === 'shrine') {
      ctx.fillStyle = '#eed8ae';
      for (var colX = b.x + 8; colX < b.x + b.w - 8; colX += 20) {
        ctx.fillRect(colX, flY - flH + 2, 8, flH - 4);
        ctx.fillStyle = '#cdb79e';
        ctx.fillRect(colX + 6, flY - flH + 2, 2, flH - 4);
        ctx.fillStyle = '#eed8ae';
      }
    }
  } else if (currentEra.id === 'alien') {
    // Organic fleshy spires & bioluminescent glow
    var pulsingR = 4 + Math.sin(Date.now() * 0.005) * 2;
    ctx.fillStyle = '#a020f0';
    ctx.beginPath();
    ctx.arc(b.x + b.w / 2, flY - flH / 2, pulsingR, 0, Math.PI * 2);
    ctx.fill();
    
    // Veins
    ctx.strokeStyle = '#39ff14'; // acid green
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(b.x + 4, flY);
    ctx.quadraticCurveTo(b.x + b.w/2, flY - flH/2, b.x + b.w - 4, flY - flH);
    ctx.stroke();
  }
}

function drawCitizens(ctx) {
  for (var i = 0; i < citizens.length; i++) {
    var c = citizens[i];
    
    if (c.state === 'FLY') {
      // Draw spinning flying citizen
      ctx.save();
      ctx.translate(c.flyX, c.flyY);
      ctx.rotate(c.flyRot);
      ctx.fillStyle = c.color;
      // Body
      ctx.fillRect(-2, -6, 4, 12);
      // Head
      ctx.beginPath();
      ctx.arc(0, -9, 3, 0, Math.PI * 2);
      ctx.fill();
      // Flailing arms
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(-2, -3); ctx.lineTo(-6, -10);
      ctx.moveTo(2, -3); ctx.lineTo(6, -10);
      ctx.stroke();
      ctx.restore();
    } else {
      // Normal or panicking citizen
      ctx.fillStyle = c.color;
      ctx.fillRect(c.x - 2, c.y - 10, 4, 10); // body
      ctx.beginPath();
      ctx.arc(c.x, c.y - 13, 2.5, 0, Math.PI * 2); // head
      ctx.fill();
      
      // Arm flailing animation when panicked
      if (c.state === 'PANIC') {
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 1.2;
        var armY = c.y - 9 + Math.sin(Date.now() * 0.03) * 3;
        ctx.beginPath();
        ctx.moveTo(c.x - 2, c.y - 8);
        ctx.lineTo(c.x - 6, armY - 3);
        ctx.moveTo(c.x + 2, c.y - 8);
        ctx.lineTo(c.x + 6, armY - 3);
        ctx.stroke();
      }
    }
  }
}

function drawDebrisShardsList(ctx) {
  for (var i = 0; i < shards.length; i++) {
    var sh = shards[i];
    ctx.save();
    ctx.translate(sh.x, sh.y);
    ctx.rotate(sh.angle);
    ctx.fillStyle = sh.color;
    ctx.fillRect(-sh.w / 2, -sh.h / 2, sh.w, sh.h);
    ctx.restore();
  }
}

function drawExplosionsAndShockwaves(ctx) {
  // Shockwaves
  for (var i = 0; i < shockwaves.length; i++) {
    var sw = shockwaves[i];
    ctx.strokeStyle = 'rgba(255,255,255,' + (1.0 - sw.r / sw.maxR) + ')';
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.ellipse(sw.x, sw.y, sw.r, sw.r * 0.35, 0, 0, Math.PI * 2);
    ctx.stroke();
  }
  
  // Explosions
  for (var i = 0; i < explosions.length; i++) {
    var ex = explosions[i];
    var progress = ex.timer / ex.life;
    var currentR = ex.maxR * progress;
    
    // Outer fiery plume
    var orangeG = ctx.createRadialGradient(ex.x, ex.y, currentR * 0.1, ex.x, ex.y, currentR);
    orangeG.addColorStop(0, '#ffd700');
    orangeG.addColorStop(0.35, '#ff4500');
    orangeG.addColorStop(0.8, 'rgba(139, 0, 0, 0.45)');
    orangeG.addColorStop(1.0, 'rgba(0,0,0,0)');
    
    ctx.fillStyle = orangeG;
    ctx.beginPath();
    ctx.arc(ex.x, ex.y, currentR, 0, Math.PI * 2);
    ctx.fill();
    
    // Shrapnels rising
    ctx.fillStyle = '#ff8c00';
    for (var pIdx = 0; pIdx < 4; pIdx++) {
      var pX = ex.x + Math.sin(pIdx + Date.now() * 0.01) * currentR * 0.6;
      var pY = ex.y - currentR * 0.5;
      ctx.beginPath();
      ctx.arc(pX, pY, 4, 0, Math.PI * 2);
      ctx.fill();
    }
  }
}

function drawActiveSpells(ctx) {
  // Draw Meteor particles
  for (var i = 0; i < particles.length; i++) {
    var pt = particles[i];
    if (pt.type === 'meteor') {
      var m = pt.m;
      
      // Draw meteor body
      ctx.fillStyle = '#e65100';
      ctx.beginPath();
      ctx.arc(m.x, m.y, m.r, 0, Math.PI * 2);
      ctx.fill();
      
      // Draw tail smoke
      var tailG = ctx.createLinearGradient(m.x, m.y, m.x - m.vx * 3, m.y - m.vy * 3);
      tailG.addColorStop(0, '#ff9100');
      tailG.addColorStop(0.5, '#ff3d00');
      tailG.addColorStop(1, 'rgba(0,0,0,0)');
      
      ctx.strokeStyle = tailG;
      ctx.lineWidth = m.r * 1.5;
      ctx.beginPath();
      ctx.moveTo(m.x, m.y);
      ctx.lineTo(m.x - m.vx * 6, m.y - m.vy * 6);
      ctx.stroke();
    }
  }
  
  // Draw lightning bolt bolts (Upgrade dependent aurastrike)
  if (meta.upgrades.lightning > 0 && isPressing && lightningStrikeCooldown <= 0) {
    // We render dynamic shock arcs on the screen
    drawStormLightningStrikes(ctx);
  }
}

function drawStormLightningStrikes(ctx) {
  var activeLvl = meta.upgrades.lightning;
  var boltsCount = UPGRADES.lightning.vals[activeLvl];
  
  // Find closest live building roofs
  var live = buildings.filter(b => !b.destroyed);
  if (!live.length) return;
  
  // Strike 1 random building within 220px of hand hover
  var bIdx = Math.floor(Math.random() * live.length);
  var tb = live[bIdx];
  var bTopY = groundY() - tb.h;
  
  if (Math.abs(tb.x + tb.w/2 - fX) <= 220) {
    // Play sound & strike
    playProceduralLightningSfx();
    lightningStrikeCooldown = 0.45; // seconds
    
    // Draw lightning line
    ctx.strokeStyle = '#00ffff';
    ctx.lineWidth = 3;
    ctx.shadowColor = '#00ffff';
    ctx.shadowBlur = 10;
    
    ctx.beginPath();
    var sX = fX;
    var sY = fY + 180;
    ctx.moveTo(sX, sY);
    
    // Procedural jagged lightning line
    var segments = 6;
    var prevX = sX, prevY = sY;
    for (var k = 1; k < segments; k++) {
      var ratio = k / segments;
      var curY = sY + (bTopY - sY) * ratio;
      var curX = sX + (tb.x + tb.w/2 - sX) * ratio + (Math.random() - 0.5) * 35;
      ctx.lineTo(curX, curY);
      prevX = curX; prevY = curY;
    }
    ctx.lineTo(tb.x + tb.w/2, bTopY);
    ctx.stroke();
    
    ctx.shadowBlur = 0; // reset
    
    // Apply damage to target building
    damageBuildingAtHeight(tb, bTopY + 10, 1);
  }
}

function drawGodsFinger(ctx) {
  // Render finger hovered shadow on town below
  var cloudY = fY;
  var bBottom = groundY();
  
  var skinCfg = SKINS.find(s => s.id === meta.equippedSkin);
  
  // Render shadow hover disk
  ctx.fillStyle = skinCfg.shadowColor;
  ctx.beginPath();
  var sizeLvl = meta.upgrades.radius;
  var smR = UPGRADES.radius.vals[sizeLvl];
  ctx.ellipse(fX - cameraX, bBottom + 4, smR, smR * 0.35, 0, 0, Math.PI * 2);
  ctx.fill();
  
  // Glow aura ring around target shadow
  ctx.strokeStyle = skinCfg.auraColor;
  ctx.lineWidth = isPressing ? 3 : 1.2;
  ctx.beginPath();
  ctx.ellipse(fX - cameraX, bBottom + 4, smR * (isPressing ? 1.0 : 0.6), smR * 0.35 * (isPressing ? 1.0 : 0.6), 0, 0, Math.PI * 2);
  ctx.stroke();
  
  // Draw Celestial Hand pointing down
  ctx.save();
  ctx.translate(fX - cameraX, cloudY);
  
  // Finger path rendering depending on Skin equipped
  drawLimbSkinPath(ctx, skinCfg.id, isPressing);
  
  ctx.restore();
}

function drawLimbSkinPath(ctx, skinId, pressing) {
  // Drawing oriented down. Root of pointing finger sits at bottom center (0, 0 relative)
  var fingerW = 44;
  var fingerH = 150;
  var pOff = pressing ? 10 : 0;
  
  if (skinId === 'celestial') {
    // Beautiful divine golden finger with a white flowing toga wrist cloud
    ctx.fillStyle = '#ffd700';
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 2;
    
    // Main Finger pointing down
    ctx.beginPath();
    ctx.moveTo(-fingerW * 0.5, -fingerH);
    ctx.lineTo(-fingerW * 0.5, -15);
    ctx.quadraticCurveTo(-fingerW * 0.5, 0, 0, 20); // fingernail tip pointing down
    ctx.quadraticCurveTo(fingerW * 0.5, 0, fingerW * 0.5, -15);
    ctx.lineTo(fingerW * 0.5, -fingerH);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    
    // Fingernail
    ctx.fillStyle = '#ffec8b';
    ctx.beginPath();
    ctx.ellipse(0, 5, 8, 11, 0, 0, Math.PI * 2);
    ctx.fill();
    
    // Knuckles wrinkle lines
    ctx.strokeStyle = '#b8860b';
    ctx.lineWidth = 1.5;
    for (var kY = -45; kY >= -110; kY -= 30) {
      ctx.beginPath();
      ctx.moveTo(-10, kY);
      ctx.quadraticCurveTo(0, kY - 4, 10, kY);
      ctx.stroke();
    }
    
    // Clouds at base/wrist
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(-25, -fingerH, 30, 0, Math.PI * 2);
    ctx.arc(25, -fingerH, 30, 0, Math.PI * 2);
    ctx.arc(0, -fingerH - 12, 35, 0, Math.PI * 2);
    ctx.fill();
    
  } else if (skinId === 'lava') {
    // Dark volcanic igneous rock finger with burning magma veins
    ctx.fillStyle = '#1c1c1c';
    ctx.strokeStyle = '#3a3a3a';
    ctx.lineWidth = 3;
    
    // Outline
    ctx.beginPath();
    ctx.moveTo(-fingerW * 0.5, -fingerH);
    ctx.lineTo(-fingerW * 0.5, -10);
    ctx.quadraticCurveTo(-fingerW * 0.4, 15, 0, 25);
    ctx.quadraticCurveTo(fingerW * 0.4, 15, fingerW * 0.5, -10);
    ctx.lineTo(fingerW * 0.5, -fingerH);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    
    // Magma cracking veins
    ctx.strokeStyle = '#ff3d00';
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(-12, -120);
    ctx.lineTo(-4, -90);
    ctx.lineTo(12, -75);
    ctx.lineTo(-6, -40);
    ctx.lineTo(0, -5);
    ctx.stroke();
    
    ctx.strokeStyle = '#ff9100';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(10, -100);
    ctx.lineTo(-8, -80);
    ctx.lineTo(6, -55);
    ctx.stroke();
    
    // Glow nail
    ctx.fillStyle = '#ff3d00';
    ctx.beginPath();
    ctx.ellipse(0, 10, 6, 9, 0, 0, Math.PI * 2);
    ctx.fill();
    
    // Ash clouds
    ctx.fillStyle = '#4a4a4a';
    ctx.beginPath();
    ctx.arc(-25, -fingerH, 32, 0, Math.PI * 2);
    ctx.arc(25, -fingerH, 32, 0, Math.PI * 2);
    ctx.fill();
    
  } else if (skinId === 'cyber') {
    // Cybernetic armored steel panel segments with neon gridlines
    ctx.fillStyle = '#37474f';
    ctx.strokeStyle = '#00ffff';
    ctx.lineWidth = 2;
    
    // Steel joints
    ctx.fillRect(-fingerW*0.48, -fingerH, fingerW*0.96, fingerH);
    
    // Cyber overlay plates
    ctx.fillStyle = '#78909c';
    ctx.fillRect(-fingerW*0.4, -130, fingerW*0.8, 30);
    ctx.fillRect(-fingerW*0.4, -90, fingerW*0.8, 30);
    ctx.fillRect(-fingerW*0.4, -50, fingerW*0.8, 30);
    
    // Tip angle
    ctx.fillStyle = '#cfd8dc';
    ctx.beginPath();
    ctx.moveTo(-fingerW*0.4, -15);
    ctx.lineTo(0, 18);
    ctx.lineTo(fingerW*0.4, -15);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    
    // Laser crosshair guidance dot
    ctx.fillStyle = '#00ffff';
    ctx.beginPath();
    ctx.arc(0, 8, 3, 0, Math.PI*2);
    ctx.fill();
    
  } else if (skinId === 'death') {
    // Grim reaper bone claw finger
    ctx.fillStyle = '#eceff1';
    ctx.strokeStyle = '#37474f';
    ctx.lineWidth = 2.5;
    
    // Skeletal narrow bone path
    ctx.beginPath();
    ctx.moveTo(-14, -fingerH);
    ctx.lineTo(-14, -110);
    // Knuckle bulge 1
    ctx.arc(0, -100, 18, Math.PI, 0);
    ctx.lineTo(10, -50);
    // Knuckle bulge 2
    ctx.arc(0, -45, 16, Math.PI, 0);
    ctx.lineTo(6, -10);
    // Sharp bone nail claw pointing down
    ctx.lineTo(0, 32);
    ctx.lineTo(-6, -10);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    
    // Shadows on bone
    ctx.fillStyle = '#b0bec5';
    ctx.beginPath();
    ctx.moveTo(0, -100);
    ctx.lineTo(0, 30);
    ctx.lineTo(5, -10);
    ctx.lineTo(8, -45);
    ctx.fill();
    
    // Black shroud
    ctx.fillStyle = '#111111';
    ctx.beginPath();
    ctx.arc(-26, -fingerH, 26, 0, Math.PI * 2);
    ctx.arc(26, -fingerH, 26, 0, Math.PI * 2);
    ctx.fill();
    
  } else if (skinId === 'cat') {
    // Gigantic soft fuzzy orange striped cat paw with cute pink toe pads
    ctx.fillStyle = '#ff922b'; // orange fur
    ctx.strokeStyle = '#d9480f';
    ctx.lineWidth = 2;
    
    // Thick paw body
    ctx.beginPath();
    ctx.moveTo(-fingerW * 0.8, -fingerH);
    ctx.lineTo(-fingerW * 0.8, -25);
    ctx.quadraticCurveTo(-fingerW * 0.9, 10, 0, 20); // bottom pad curve
    ctx.quadraticCurveTo(fingerW * 0.9, 10, fingerW * 0.8, -25);
    ctx.lineTo(fingerW * 0.8, -fingerH);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

function renderUpgradesList(ctx, sX, sY, sW, sH) {
  var rowY = sY + 70;

    ctx.font = '11px ' + FONT;
    ctx.fillText(GF.t(up.descKey), sX + 40, rowY + 50);
    
    // Upgrade button
    var btnW = 120;
    var btnH = 36;
    var btnX = sX + sW - 164;
    var btnY = rowY + 20;
    
    var canAfford = mana >= cost && !isMax;
    ctx.fillStyle = isMax ? '#2e7d32' : (canAfford ? '#6200ea' : '#37474f');
    GF.rr(ctx, btnX, btnY, btnW, btnH, 6);
    ctx.fill();
    
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 11px ' + FONT;
    var btnText = isMax ? GF.t('level_max') : GF.t('btn_buy') + " (" + cost + ")";
    ctx.fillText(btnText, btnX + 12, btnY + 22);
    
    // Buy actions hooks
    (function(k, cst, maxState) {
      addTemporaryButtonClick(btnX, btnY, btnW, btnH, function() {
        if (maxState) return;
        if (mana >= cst) {
          mana -= cst;
          meta.upgrades[k]++;
          GF.sfx('levelup');
          checkpoint();
        } else {
          GF.sfx('error');
        }
      });
    })(key, cost, isMax);
    
    rowY += 88;
    iIdx++;
  }
}

function renderSkinsList(ctx, sX, sY, sW, sH) {
  var rowY = sY + 70;
  
  for (var i = 0; i < SKINS.length; i++) {
    var sk = SKINS[i];
    var isUnlocked = meta.unlockedSkins.includes(sk.id);
    var isEquipped = meta.equippedSkin === sk.id;
    var cost = sk.cost;
    
    ctx.fillStyle = '#110c21';
    GF.rr(ctx, sX + 24, rowY, sW - 48, 68, 8);
    ctx.fill();
    
    // Tiny preview circle of skin color
    ctx.fillStyle = sk.auraColor;
    ctx.beginPath();
    ctx.arc(sX + 48, rowY + 34, 12, 0, Math.PI * 2);
    ctx.fill();
    
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 13px ' + FONT;
    ctx.fillText(GF.t(sk.nameKey), sX + 72, rowY + 26);
    
    ctx.fillStyle = '#b0bec5';
    ctx.font = '10px ' + FONT;
    ctx.fillText(GF.t(sk.descKey), sX + 72, rowY + 46);
    
    // Button Action
    var btnW = 120;
    var btnH = 34;
    var btnX = sX + sW - 164;
    var btnY = rowY + 17;
    
    var btnCol = '#37474f';
    var btnTxt = "";
    
    if (isEquipped) {
      btnCol = '#2e7d32'; // Green Equipped
      btnTxt = GF.t('btn_equipped');
    } else if (isUnlocked) {
      btnCol = '#6200ea'; // Purple Equip
      btnTxt = GF.t('btn_equip');
    } else {
      var canAfford = mana >= cost;
      btnCol = canAfford ? '#e65100' : '#37474f';
      btnTxt = GF.t('btn_buy') + " (" + cost + ")";
    }
    
    ctx.fillStyle = btnCol;
    GF.rr(ctx, btnX, btnY, btnW, btnH, 6);
    ctx.fill();
    
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 11px ' + FONT;
    ctx.fillText(btnTxt, btnX + 12, btnY + 21);
    
    // Skin actions hooks
    (function(skinItem, unlocked, equipped, canAffordCost) {
      addTemporaryButtonClick(btnX, btnY, btnW, btnH, function() {
        if (equipped) return;
        if (unlocked) {
          meta.equippedSkin = skinItem.id;
          GF.sfx('click');
          checkpoint();
        } else if (mana >= skinItem.cost) {
          mana -= skinItem.cost;
          meta.unlockedSkins.push(skinItem.id);
          meta.equippedSkin = skinItem.id;
          GF.sfx('unlock');
          checkpoint();
        } else {
          GF.sfx('error');
        }
      });
    })(sk, isUnlocked, isEquipped, mana >= cost);
    
    rowY += 76;
  }
}

// ── TEMPORARY HUD CLICK HANDLERS ──────────────────────────────────────────
var tempButtons = [];
function addTemporaryButtonClick(x, y, w, h, fn) {
  tempButtons.push({ x: x, y: y, w: w, h: h, fn: fn });
}

// Intercept clicks to verify HUD buttons
function checkButtons(clientX, clientY) {
  // Convert standard client coords to DESIGN coordinates
  var rect = GF.canvas.getBoundingClientRect();
  var S = GF.S;
  var mx = (clientX - rect.left) / S;
  var my = (clientY - rect.top) / S;
  
  for (var i = 0; i < tempButtons.length; i++) {
    var b = tempButtons[i];
    if (mx >= b.x && mx <= b.x + b.w && my >= b.y && my <= b.y + b.h) {
      b.fn();
      return true;
    }
  }
  return false;
}

// Override canvas.onclick to integrate perfectly with library's overlays
window.addEventListener('click', function(e) {
  checkButtons(e.clientX, e.clientY);
});

      vAngle: (Math.random() - 0.5) * 0.3,

}

// ── GAME LOOP CONTROLLER (UPDATER) ────────────────────────────────────────
var lastTime = Date.now();
var currentShakeAmt = 0;

function update() {
  var now = Date.now();
  var dt = (now - lastTime) / 1000;
  lastTime = now;
  
  if (dt > 0.1) dt = 0.1; // clamp lag spikes
  
  // Dynamic screen shake decrease
  if (currentShakeAmt > 0) {
    currentShakeAmt = Math.max(0, currentShakeAmt - dt * 4.5);
  }
  
  // Always update background clouds
  for (var i = 0; i < backgroundClouds.length; i++) {
    var cl = backgroundClouds[i];
    cl.x += cl.spd;
    if (cl.x > DESIGN_W * 2.2) {
      cl.x = -cl.w;
    }
  }
  
  if (gs === 'PLAYING') {
    // Cooldown reductions
    if (cooldowns.meteor > 0) cooldowns.meteor = Math.max(0, cooldowns.meteor - dt);
    if (cooldowns.quake > 0) cooldowns.quake = Math.max(0, cooldowns.quake - dt);
    if (lightningStrikeCooldown > 0) lightningStrikeCooldown = Math.max(0, lightningStrikeCooldown - dt);
    
    // Spell activation timings
    if (meteorActiveTimer > 0) {
      meteorActiveTimer -= dt;
      if (Math.random() < 0.15) {
        spawnRandomMeteor();
      }
    }
    
    if (quakeActiveTimer > 0) {
      quakeActiveTimer -= dt;
      currentShakeAmt = Math.max(currentShakeAmt, 0.75);
      
      // Damage random floors
      if (Math.random() < 0.35) {
        var live = buildings.filter(b => !b.destroyed);
        if (live.length) {
          var randomB = live[Math.floor(Math.random() * live.length)];
          damageBuildingAtHeight(randomB, groundY() - 10, 1);
        }
      }
    }
    
    // Smooth camera tracking fX pointer position to allow endless landscape scroll
    var scrollBoundary = 250;
    var screenW = visibleDesignW();
    if (fX - cameraX > screenW - scrollBoundary) {
      targetCameraX = Math.min(currentEra.density * 260 - screenW + 600, targetCameraX + SCROLL_SPEED);
    } else if (fX - cameraX < scrollBoundary) {
      targetCameraX = Math.max(0, targetCameraX - SCROLL_SPEED);
    }
    cameraX += (targetCameraX - cameraX) * 0.1;
    
    // Giant Finger interpolation
    fY += (fTargetY - fY) * (isPressing ? FINGER_DESCEND_SPEED : FINGER_RETRACT_SPEED);
    
    // Update active buildings
    for (var i = 0; i < buildings.length; i++) {
      var b = buildings[i];
      if (b.destroyed) continue;
      
      // Fire damage ticks
      if (b.onFire) {
        b.fireTimer += dt;
        if (b.fireTimer >= 1.0) { // damage every second
          b.fireTimer = 0;
          damageBuildingAtHeight(b, groundY() - Math.random() * b.h, 1);
        }
      }
      
      // Collapse floors smoothing (visual gravity collapse)
      for (var f = 0; f < b.floors.length; f++) {
        var fl = b.floors[f];
        if (fl.currentYOffset > fl.targetYOffset) {
          fl.currentYOffset = Math.max(fl.targetYOffset, fl.currentYOffset - dt * 140);
        }
      }
    }
    
    // Update citizens
    for (var i = 0; i < citizens.length; i++) {
      var c = citizens[i];
      if (c.state === 'FLY') {
        c.flyX += c.flyVx;
        c.flyY += c.flyVy;
        c.flyVy += 0.42; // Gravity
        c.flyRot += c.flyVRot;
        
        // Remove once offscreen bottom
        if (c.flyY > visibleDesignH() + 40) {
          citizens.splice(i, 1);
          i--;
        }
      } else {
        // Normal walking or running panic
        c.x += c.vx;
        
        // Boundaries bounce
        var totalW = currentEra.density * 260 + 800;
        if (c.x < 10 || c.x > totalW - 10) {
          c.vx *= -1;
        }
        
        // Calm down after panic
        if (c.state === 'PANIC') {
          c.panicTimer -= dt;
          if (c.panicTimer <= 0) {
            c.state = 'WALK';
            c.vx = (c.vx > 0 ? 1 : -1) * (0.3 + Math.random() * 0.4);
          }
        }
      }
    }
    
    // Update dynamic debris shards
    for (var i = shards.length - 1; i >= 0; i--) {
      var sh = shards[i];
      sh.x += sh.vx;
      sh.y += sh.vy;
      sh.vy += 0.35; // gravity
      sh.angle += sh.vAngle;
      sh.life -= dt * 0.45;
      
      // Rubble collision with ground
      var bBottom = groundY();
      if (sh.y >= bBottom - 2 && sh.vy > 0) {
        sh.y = bBottom - 2;
        sh.vy = -sh.vy * 0.45; // bounce
        sh.vx *= 0.7;
        sh.vAngle *= 0.7;
      }
      
      if (sh.life <= 0) {
        shards.splice(i, 1);
      }
    }
    
    // Update active shockwaves
    for (var i = shockwaves.length - 1; i >= 0; i--) {
      var sw = shockwaves[i];
      sw.r += dt * 380;
      if (sw.r >= sw.maxR) {
        shockwaves.splice(i, 1);
      }
    }
    
    // Update active explosion plumes
    for (var i = explosions.length - 1; i >= 0; i--) {
      var ex = explosions[i];
      ex.timer += dt;
      if (ex.timer >= ex.life) {
        explosions.splice(i, 1);
      }
    }
    
    // Update active active particles (Spells/Meteors)
    for (var i = particles.length - 1; i >= 0; i--) {
      var pt = particles[i];
      if (pt.type === 'meteor') {
        var m = pt.m;
        m.x += m.vx;
        m.y += m.vy;
        
        // Ground strike
        if (m.y >= m.ty) {
          triggerHugeExplosion(m.tx, m.ty, 130);
          particles.splice(i, 1);
        }
      }
    }
  }
  
  // Libraries floating HUD texts update
  if (GF.updateFloats) {
    GF.updateFloats(dt);
  }
  
  // Clear temporary click targets declarations
  tempButtons = [];
}

function startGame() {
  GF.sfx('win');
  startDivineRhythm();
  gs = 'PLAYING';
  fY = fHoverY;
  score = 0;
  resetEraWorld();
  GF.gameStarted();
}

// ── EXPOSE SHAKE METHOD TO GLOBAL ──────────────────────────────────────────
// Ensure shake can be triggered and combined cleanly
window.GF.setShake = function(amt) {
  currentShakeAmt = Math.max(currentShakeAmt, amt);
};

})();
</script>
