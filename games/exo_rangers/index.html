var MIN_LASSO_PERIM = 90;
var CLOSE_DIST      = 60;
var BOND_PER_LOOP   = 1;
var TAP_MIN         = 26;    // a release with less path than this is a harmless tap, not a botched lasso

};

// ── OBSTACLES (needs -> tool that clears it) ──────────────────────────────

  thorn:  { key: 'thorn',  name: 'ob_thorn',  needs: 'fire',  tint: '#7a3d12', phrase: 'ph_burn'  },

};

  { par: 120, creatures: [['ember',2],['lumen',3],['tortoise',2],['gale',3],['spore',3],['grazer',2]], obstacles: [['thorn',0.24,0.7],['cavern',0.76,0.68],['geyser',0.3,0.52],['spore',0.7,0.5],['alpha',0.5,0.33]] },

var styler = STYLER_MAX;
var startle = 0;

// ── HELPERS ───────────────────────────────────────────────────────────────
function S() { return GF.S; }
function fieldTop() { return GF.H * 0.20; }
function fieldBot() { return GF.H * 0.74; }
function fieldMargin() { return 36 * S(); }
function pointInPoly(px, py, poly) {
  var inside = false;
  for (var i = 0, j = poly.length - 1; i < poly.length; j = i++) {
    var xi = poly[i].x, yi = poly[i].y, xj = poly[j].x, yj = poly[j].y;
    var hit = ((yi > py) !== (yj > py)) && (px < (xj - xi) * (py - yi) / (yj - yi) + xi);
    if (hit) inside = !inside;
  }
  return inside;
}
function distSeg(px, py, ax, ay, bx, by) {
  var dx = bx - ax, dy = by - ay, l2 = dx * dx + dy * dy;
  var tt = l2 > 0 ? ((px - ax) * dx + (py - ay) * dy) / l2 : 0;
  tt = tt < 0 ? 0 : tt > 1 ? 1 : tt;
  var cxp = ax + tt * dx, cyp = ay + tt * dy;
  return Math.hypot(px - cxp, py - cyp);
}
function traySlotXY(i) {
  var slot = TRAY_SLOT * S(), gap = 8 * S();
  var x0 = 16 * S() + slot / 2;
  return { x: x0 + i * (slot + gap), y: GF.H - 14 * S() - slot / 2, r: slot / 2 };
}
function beaconXY() { return { x: GF.W * 0.5, y: GF.H * 0.12 }; }
function rangerXY() {
  var b = beaconXY();
  var prog = sectorObstacleCount > 0 ? obstaclesCleared / sectorObstacleCount : 1;
  var y = GF.lerp(GF.H * 0.80, b.y + BEACON_R * S() + 26 * S(), prog);
  return { x: GF.W * 0.5, y: y };
}

// ── SECTOR SETUP ──────────────────────────────────────────────────────────
function spawnCreature(speciesKey, variant) {
  var sp = SPECIES[speciesKey];
  var c = {
    sp: sp, x: 0, y: 0, vx: 0, vy: 0, tx: 0, ty: 0,
    phase: Math.random() * Math.PI * 2, baseY: 0, bond: 0,
    sheltered: false, shellT: Math.random() * 4, retimer: 0,
    fast: variant === 'fast', pop: 0, wig: Math.random() * Math.PI * 2,
    facing: 1, frozen: false,
  };
  var m = fieldMargin();
  c.x = m + Math.random() * (GF.W - 2 * m);
  c.y = fieldTop() + Math.random() * (fieldBot() - fieldTop());
  c.baseY = c.y; c.tx = c.x; c.ty = c.y;
  return c;
}
function loadSector(n, keepProgress) {
  sector = GF.clamp(n, 1, SECTOR_COUNT);
  var def = SECTORS[sector - 1];
  creatures = [];
  obstacles = [];
  var i, j;
  for (i = 0; i < def.obstacles.length; i++) {
    var od = def.obstacles[i];
    obstacles.push({ type: OBSTACLES[od[0]], x: GF.W * od[1], y: GF.H * od[2], cleared: false, wob: 0, clearT: 0 });
  }
  sectorObstacleCount = obstacles.length;
  for (i = 0; i < def.creatures.length; i++) {
    var cd = def.creatures[i];
    for (j = 0; j < cd[1]; j++) creatures.push(spawnCreature(cd[0], cd[2]));
  }
  // Sector 1 (the gentle intro / tutorial sector): a single docile, stationary
  // Ember Beetle at a fixed spot — deterministic first befriend for every player.
  if (sector === 1) {
    var beetle = spawnCreature('ember');
    beetle.x = GF.W * 0.5; beetle.y = GF.H * 0.34; beetle.tx = beetle.x; beetle.ty = beetle.y;
    beetle.baseY = beetle.y; beetle.frozen = true;
    // A lively intro field, not one bug in an empty meadow (Tim 2026-07-23).
    // Grazers only: they wander, they wiggle through the line, they never
    // snap it - nothing in sector 1 can punish a learner's sloppy circle.
    creatures = [beetle, spawnCreature('grazer'), spawnCreature('grazer'), spawnCreature('grazer')];
  }
  if (!keepProgress) {
    obstaclesCleared = 0;
    party = [];
    startle = 0;
    styler = STYLER_MAX;
  }
  sectorSeen = {};
  sectorStartT = t;
  sectorElapsed = 0;
  trail = []; isDrawing = false; carrying = null;
}

// ── LIFECYCLE ─────────────────────────────────────────────────────────────
function startRun() {
  var startSector = GF.clamp(sectorsUnlocked, 1, SECTOR_COUNT);
  if (!tutorialSeen()) startSector = 1;
  gs = 'PLAYING';
  missCoachLeft = 2; // fresh run, fresh coaching budget
  if (startSector === 1 && !tutorialSeen()) startTutorial();
  loadSector(startSector, false);
  GF.gameStarted();
  saveRun();
}
function retrySector() {
  gs = 'PLAYING';
  loadSector(sector, false);
  GF.gameStarted();
  saveRun();
}
function completeSector() {
  sectorElapsed = t - sectorStartT;
  var st = 1;
  var present = presentSpecies(sector);
  var allSeen = present.length > 0 && present.every(function (k) { return sectorSeen[k]; });
  if (allSeen) st++;
  if (sectorElapsed <= SECTORS[sector - 1].par) st++;
  lastStars = st;
  stars[sector] = Math.max(stars[sector] || 0, st);
  var prevBest = bestTimes[sector];
  if (prevBest == null || sectorElapsed < prevBest) bestTimes[sector] = sectorElapsed;
  sectorsUnlocked = Math.max(sectorsUnlocked, Math.min(sector + 1, SECTOR_COUNT));
  GF.sfx('win');
  GF.juice.flash('#bff7d0', 320, 0.4);
  var b = beaconXY();
  GF.juice.particles.burst(b.x, b.y, { count: 34, colors: ['#bff7d0', '#8ef0ff', '#ffe08a'], speed: 230, gravity: 120, life: 1.1, size: 5 });
  GF.happytime();
  saveRun();
  gs = (sector >= SECTOR_COUNT) ? 'WON' : 'JOURNAL';
}
function presentSpecies(n) {
  var def = SECTORS[n - 1], set = {}, out = [];
  if (n === 1) { return ['ember']; }
  for (var i = 0; i < def.creatures.length; i++) { var k = def.creatures[i][0]; if (!set[k]) { set[k] = 1; out.push(k); } }
  return out;
}

// ── BEFRIEND / CAPTURE ────────────────────────────────────────────────────
function befriend(c) {
  befriends++;
  GF.sfx('evolve');
  GF.juice.particles.burst(c.x, c.y, { count: 22, colors: [c.sp.glow, '#ffffff', c.sp.accent], speed: 210, gravity: -40, life: 0.8, size: 5 });
  spawnHeart(c.x, c.y - 14 * S(), c.sp.glow);
  startle = Math.max(0, startle - STARTLE_RELIEF);
  if (!journal[c.sp.key]) { journal[c.sp.key] = true; if (lastNewSpecies.indexOf(c.sp.key) < 0) lastNewSpecies.push(c.sp.key); }
  sectorSeen[c.sp.key] = true;
  recomputeJournal();
  // Only TOOL species join the party tray; specimens (no tool) are documented to
  // the journal and released with a heart — this keeps the tray useful and makes
  // a party-clog softlock impossible.
  if (c.sp.tool && party.length < PARTY_MAX) { party.push({ sp: c.sp }); }
  else { spawnHeart(c.x, c.y - 24 * S(), '#ff8fb0'); }
  var idx = creatures.indexOf(c);
  if (idx >= 0) creatures.splice(idx, 1);
  if (GF.tutorial.active && GF.tutorial.step === 0) GF.tutorial.next();
  saveRun();
}
function recomputeJournal() {
  var n = 0;
  for (var i = 0; i < SPECIES_ORDER.length; i++) if (journal[SPECIES_ORDER[i]]) n++;
  journalPct = Math.round((n / SPECIES_ORDER.length) * 100);
}
function evaluateLasso() {
  // Open-path length: a barely-moved release is a harmless tap (exploring), not a
  // botched lasso — never stress the wildlife for it.
  var pathLen = 0;
  for (var p = 1; p < trail.length; p++) pathLen += Math.hypot(trail[p].x - trail[p - 1].x, trail[p].y - trail[p - 1].y);
  if (trail.length < 2 || pathLen < TAP_MIN * S()) { return; }
  var perim = pathLen + Math.hypot(trail[0].x - trail[trail.length - 1].x, trail[0].y - trail[trail.length - 1].y);
  if (perim < MIN_LASSO_PERIM * S()) { fizzle(); return; }
  var caught = [];
  for (var k = 0; k < creatures.length; k++) {
    var c = creatures[k];
    if (c.sheltered) continue;
    if (pointInPoly(c.x, c.y, trail)) caught.push(c);
  }
  if (!caught.length) {
    fizzle();
    // First couple of misses get a coaching nudge - the gap between "I drew
    // a line" and "I enclosed it" is where trackpad players give up.
    if (missCoachLeft > 0 && trail.length) {
      missCoachLeft--;
      var mid = trail[Math.floor(trail.length / 2)];
      showHint(GF.t('hint_close_loop'), mid.x, mid.y - 30 * S());
    }
    return;
  }
  for (var m = 0; m < caught.length; m++) {
    var cc = caught[m];
    cc.bond += BOND_PER_LOOP;
    if (cc.bond >= cc.sp.loops) { befriend(cc); }
    else {
      GF.sfx('merge');
      GF.juice.particles.burst(cc.x, cc.y, { count: 10, color: cc.sp.glow, speed: 130, gravity: -20, life: 0.5, size: 4 });
      cc.pop = 0.3;
    }
  }
}
function addStartle(amount) {
  if (GF.tutorial.active) return; // coach is a no-fail safe zone (Yandex-friendly onboarding)
  if (sector === 1) return;       // the whole intro sector too - learning the lasso must be free
  startle = Math.min(STARTLE_MAX, startle + amount * (CFG.tuning.startle_mult || 1));
  lastStartleT = t;               // decay pauses briefly so rapid spam still accumulates
  checkStartleOut();
}
function fizzle() {
  GF.sfx('error');

}
function breakTrail() {
  isDrawing = false;
  var last = trail.length ? trail[trail.length - 1] : null;
  trail = [];
  GF.sfx('error');
  if (last) GF.juice.particles.burst(last.x, last.y, { count: 10, color: '#ff9db0', speed: 120, gravity: 60, life: 0.45, size: 3 });

}
function checkStartleOut() {
  if (startle >= STARTLE_MAX && gs === 'PLAYING') {

// ── DEPLOY ────────────────────────────────────────────────────────────────
function canDeploy(sp, ob) {
  if (sp.tool === ob.type.needs) return true;
  if (ob.type.needs === 'calm' && sp.key === 'lumen') return true; // lumen also calms
  return false;
}
function deployOnObstacle(partyIdx, ob) {
  var member = party[partyIdx];
  if (!member || ob.cleared) return;
  if (canDeploy(member.sp, ob)) {
    ob.cleared = true; ob.clearT = 0.6;
    obstaclesCleared++; clears++;
    party.splice(partyIdx, 1);
    GF.sfx('unlock');
    var col = member.sp.glow;
    GF.juice.particles.burst(ob.x, ob.y, { count: 26, colors: [col, '#ffffff', ob.type.tint], speed: 200, gravity: 60, life: 0.8, size: 5 });
    spawnHeart(ob.x, ob.y - 18 * S(), '#ff8fb0');
    showHint(GF.t(ob.type.name) + ' ' + GF.t(ob.type.phrase), ob.x, ob.y - 40 * S());
    startle = Math.max(0, startle - 6);
    if (GF.tutorial.active && GF.tutorial.step === 1) GF.tutorial.next();
    saveRun();
    if (obstaclesCleared >= sectorObstacleCount) completeSector();
  } else {
    ob.wob = 0.5;
    GF.sfx('error');
    showHint(GF.t('hint_wrong'), ob.x, ob.y - 40 * S());
    GF.juice.shake(5, 150);
    addStartle(WRONG_STARTLE);
    saveRun();
  }
}
function showHint(txt, x, y) { hintText = txt; hintT = 1.6; hintX = x; hintY = y; }

// hearts (drawn as vector) ---------------------------------------------------
var hearts = [];
function spawnHeart(x, y, col) { hearts.push({ x: x, y: y, vy: -60 * S(), life: 0.9, life0: 0.9, col: col || '#ff8fb0' }); }
function updateHearts(dt) {
  for (var i = hearts.length - 1; i >= 0; i--) {
    var h = hearts[i]; h.life -= dt; h.y += h.vy * dt; h.vy *= 0.96;
    if (h.life <= 0) hearts.splice(i, 1);
  }
}
function drawHeart(c, x, y, r, col, a) {
  c.save(); c.globalAlpha = a; c.fillStyle = col; c.shadowColor = col; c.shadowBlur = 8 * S();
  c.beginPath();
  c.moveTo(x, y + r * 0.35);
  c.bezierCurveTo(x + r, y - r * 0.5, x + r * 0.5, y - r, x, y - r * 0.35);
  c.bezierCurveTo(x - r * 0.5, y - r, x - r, y - r * 0.5, x, y + r * 0.35);
  c.fill(); c.restore();
}

// ── TUTORIAL ──────────────────────────────────────────────────────────────
function tutorialSeen() { try { return !!localStorage.getItem('exo_rangers_seen_tutorial'); } catch (e) { return false; } }
function startTutorial() {
  GF.tutorial.start([
    { text: GF.t('tut_loop'), advance: 'manual' },
    { text: GF.t('tut_deploy'), advance: 'manual' },
  ], { storageKey: 'exo_rangers_seen_tutorial' });
}

// ── UPDATE ────────────────────────────────────────────────────────────────
function update(dt) {
  t += dt;
  GF.juice.update(dt);
  updateHearts(dt);
  if (hintT > 0) hintT -= dt;
  GF.tutorial.update(dt);

  if (gs !== 'PLAYING') return;
  sectorElapsed = t - sectorStartT;

  if (!isDrawing && styler < STYLER_MAX) styler = Math.min(STYLER_MAX, styler + STYLER_REGEN * dt);
  // Calm returns fast, but only after a short quiet gap: careless spam still
  // adds up (roughly 13 rapid misses = scatter), while a player who pauses to
  // think recovers fully. Without the gap, 12/s decay outran every miss and
  // the lose state was unreachable.
  if (!GF.tutorial.active && startle > 0 && (t - lastStartleT) > STARTLE_DECAY_GRACE) {
    startle = Math.max(0, startle - STARTLE_DECAY * dt * (CFG.tuning.startle_mult || 1));
  }

  var pointer = isDrawing && trail.length ? trail[trail.length - 1] : (carrying ? carryPos : null);
  for (var i = 0; i < creatures.length; i++) moveCreature(creatures[i], dt, pointer);

  for (var o = 0; o < obstacles.length; o++) {
    if (obstacles[o].wob > 0) obstacles[o].wob = Math.max(0, obstacles[o].wob - dt);
    if (obstacles[o].clearT > 0) obstacles[o].clearT = Math.max(0, obstacles[o].clearT - dt);
  }
}
function moveCreature(c, dt, pointer) {
  if (c.frozen) { c.wig += dt * 4; return; }
  c.wig += dt * (c.fast ? 10 : 6);
  var m = fieldMargin(), top = fieldTop(), bot = fieldBot();
  var base = c.fast ? 1.5 : 1;
  var sp = c.sp.move;
  if (sp === 'shell') {
    c.shellT -= dt;
    if (c.shellT <= 0) { c.sheltered = !c.sheltered; c.shellT = c.sheltered ? 2.0 : 3.5 + Math.random() * 2; }
  }
  var speed = 0, fleeAmp = 0;
  if (sp === 'wander') { speed = 34; }
  else if (sp === 'skitter') { speed = 74; fleeAmp = 0.5; }
  else if (sp === 'drift') { speed = 40; }
  else if (sp === 'shell') { speed = c.sheltered ? 0 : 16; }
  else if (sp === 'flee') { speed = 96; fleeAmp = 1.3; }
  else if (sp === 'floaty') { speed = 46; }
  speed *= base * S();

  c.retimer -= dt;
  if (c.retimer <= 0) {
    c.retimer = (sp === 'skitter' || sp === 'flee') ? 0.6 + Math.random() * 0.5 : 1.6 + Math.random() * 1.6;
    c.tx = m + Math.random() * (GF.W - 2 * m);
    c.ty = top + Math.random() * (bot - top);
  }
  var dx = c.tx - c.x, dy = c.ty - c.y, d = Math.hypot(dx, dy) || 1;
  var ax = (dx / d) * speed, ay = (dy / d) * speed;

  if (fleeAmp && pointer) {
    var pdx = c.x - pointer.x, pdy = c.y - pointer.y, pd = Math.hypot(pdx, pdy);
    var range = (sp === 'flee' ? 220 : 130) * S();
    if (pd < range && pd > 0.01) { var f = (1 - pd / range) * speed * fleeAmp; ax += (pdx / pd) * f; ay += (pdy / pd) * f; }
  }
  if (sp === 'drift') { ay += Math.sin(t * 1.6 + c.phase) * 22 * S(); ax += Math.cos(t * 0.7 + c.phase) * 10 * S(); }
  if (sp === 'floaty') { ax += Math.cos(t * 1.3 + c.phase) * 20 * S(); ay += Math.sin(t * 1.1 + c.phase) * 20 * S(); }

  c.vx = c.vx * 0.82 + ax * dt * 6;
  c.vy = c.vy * 0.82 + ay * dt * 6;
  if (Math.abs(c.vx) > 0.3) c.facing = c.vx > 0 ? 1 : -1;
  c.x += c.vx * dt; c.y += c.vy * dt;
  if (c.x < m) { c.x = m; c.vx = Math.abs(c.vx); }
  if (c.x > GF.W - m) { c.x = GF.W - m; c.vx = -Math.abs(c.vx); }
  if (c.y < top) { c.y = top; c.vy = Math.abs(c.vy); }
  if (c.y > bot) { c.y = bot; c.vy = -Math.abs(c.vy); }
  if (c.pop > 0) c.pop = Math.max(0, c.pop - dt);
}

// ── POINTER INPUT ─────────────────────────────────────────────────────────
var _rect = { left: 0, top: 0 };
function evXY(e) { return { x: e.clientX - _rect.left, y: e.clientY - _rect.top }; }
function onPress(x, y) {
  if (gs === 'MENU') { hitUi(x, y); return; }
  if (gs === 'PAUSE' || gs === 'GAMEOVER' || gs === 'JOURNAL' || gs === 'WON') { hitUi(x, y); return; }
  if (gs !== 'PLAYING') return;

  if (GF.tutorial.active && skipBtn && inRect(x, y, skipBtn)) { endTutorial(); return; }
  if (!GF.tutorial.active) {
    if (muteBtn && inCircle(x, y, muteBtn)) { toggleMute(); return; }
    if (helpBtn && inCircle(x, y, helpBtn)) { startTutorialReopen(); return; }
    if (pauseBtn && inCircle(x, y, pauseBtn)) { gs = 'PAUSE'; return; }
  }
  for (var i = 0; i < party.length; i++) {
    var s = traySlotXY(i);
    if (Math.hypot(x - s.x, y - s.y) <= s.r + 6 * S()) { carrying = { idx: i }; carryPos = { x: x, y: y }; GF.sfx('tap'); return; }
  }
  if (styler > 4) { isDrawing = true; trail = [{ x: x, y: y }]; }
}
function onMove(x, y) {
  if (carrying) { carryPos = { x: x, y: y }; return; }
  if (!isDrawing || gs !== 'PLAYING') return;
  var last = trail[trail.length - 1];
  var dd = Math.hypot(x - last.x, y - last.y);
  if (dd < 4 * S()) return;
  styler -= dd * STYLER_DRAIN / S();
  if (styler <= 0) { styler = 0; trail.push({ x: x, y: y }); breakTrail(); return; }
  trail.push({ x: x, y: y });
  if (Math.random() < 0.5) GF.juice.particles.burst(x, y, { count: 1, color: '#bfefff', speed: 30, gravity: -10, life: 0.4, size: 2 });
  for (var k = 0; k < creatures.length; k++) {
    var c = creatures[k];
    if (c.sheltered || c.frozen) continue;
    if (distSeg(c.x, c.y, last.x, last.y, x, y) < TRAIL_HIT * S()) {
      // Only genuinely flighty species snap the line; gentle ones wiggle
      // through it. Breaking on every touch made sloppy human circles
      // (trackpads especially) feel impossible.
      if (c.sp.move === 'skitter' || c.sp.move === 'flee') { breakTrail(); return; }
      c.pop = 0.25;
    }
  }
}
function onRelease() {
  if (carrying) {
    var hit = -1;
    for (var o = 0; o < obstacles.length; o++) {
      var ob = obstacles[o];
      if (ob.cleared) continue;
      if (Math.hypot(carryPos.x - ob.x, carryPos.y - ob.y) <= OBSTACLE_R * S() + 22 * S()) { hit = o; break; }
    }
    if (hit >= 0) deployOnObstacle(carrying.idx, obstacles[hit]);
    carrying = null;
    return;
  }
  if (isDrawing) { isDrawing = false; evaluateLasso(); trail = []; }
}
function inCircle(x, y, b) { return Math.hypot(x - b.x, y - b.y) <= b.r + 6 * S(); }
function inRect(x, y, b) { return x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h; }
function hitUi(x, y) { for (var i = 0; i < uiButtons.length; i++) { var b = uiButtons[i]; if (inRect(x, y, b)) { b.fn(); return; } } }
function endTutorial() { while (GF.tutorial.active) GF.tutorial.next(); }
function startTutorialReopen() { if (!GF.tutorial.steps || !GF.tutorial.steps.length) startTutorial(); else GF.tutorial.reopen(); }
function toggleMute() { GF.toggleMute(); try { localStorage.setItem('exo_rangers_muted', GF.muted ? '1' : '0'); } catch (e) {} }

// ── DRAW ──────────────────────────────────────────────────────────────────
function draw(ctx) {
  ctx.save();
  ctx.translate(GF.juice.offsetX, GF.juice.offsetY);
  drawBackground(ctx);
  if (gs !== 'MENU') {
    drawObstacles(ctx);
    drawBeacon(ctx);
    drawRanger(ctx);
    drawCreatures(ctx);
    drawTrail(ctx);
    drawHearts(ctx);
    GF.juice.particles.draw(ctx);
    GF.juice.texts.draw(ctx);
    if (gs === 'PLAYING') drawHUD(ctx);
    if (carrying) drawCarry(ctx);
  }
  ctx.restore();

  if (gs === 'PLAYING' && GF.tutorial.active) drawCoach(ctx);
  if (gs === 'MENU') drawMenu(ctx);
  if (gs === 'PAUSE') drawPause(ctx);
  if (gs === 'GAMEOVER') drawGameOver(ctx);
  if (gs === 'JOURNAL') drawJournal(ctx);
  if (gs === 'WON') drawWon(ctx);
  GF.juice.drawFlash(ctx);
}

// backdrop: bioluminescent alien meadow, parallax
var _flora = null;
function ensureFlora() {
  if (_flora) return;
  _flora = [];
  for (var i = 0; i < 26; i++) _flora.push({ xr: Math.random(), yr: 0.5 + Math.random() * 0.45, h: 20 + Math.random() * 60, hue: Math.random(), layer: Math.random() < 0.5 ? 0 : 1 });
}
function drawBackground(c) {
  var W = GF.W, H = GF.H;
  var g = c.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#0a1030'); g.addColorStop(0.45, '#123047'); g.addColorStop(0.8, '#0f3a3f'); g.addColorStop(1, '#0b2a2e');
  c.fillStyle = g; c.fillRect(0, 0, W, H);
  c.fillStyle = 'rgba(200,230,255,0.5)';
  for (var i = 0; i < 40; i++) { var sx = (i * 97.3) % W, sy = ((i * 53.7) % (H * 0.42)); var tw = 0.5 + 0.5 * Math.sin(t * 1.3 + i); c.globalAlpha = 0.25 + 0.5 * tw; c.fillRect(sx, sy, 2, 2); }
  c.globalAlpha = 1;
  c.fillStyle = 'rgba(40,90,120,0.5)';
  c.beginPath(); c.moveTo(0, H * 0.5);
  for (var x = 0; x <= W; x += 40) c.lineTo(x, H * 0.5 + Math.sin(x * 0.006 + 1) * 26 - 10);
  c.lineTo(W, H); c.lineTo(0, H); c.closePath(); c.fill();
  var g2 = c.createLinearGradient(0, H * 0.55, 0, H);
  g2.addColorStop(0, 'rgba(20,70,66,0.55)'); g2.addColorStop(1, 'rgba(10,40,40,0.85)');
  c.fillStyle = g2;
  c.beginPath(); c.moveTo(0, H * 0.62);
  for (var x2 = 0; x2 <= W; x2 += 30) c.lineTo(x2, H * 0.62 + Math.sin(x2 * 0.01 + 3) * 18);
  c.lineTo(W, H); c.lineTo(0, H); c.closePath(); c.fill();
  ensureFlora();
  for (var f = 0; f < _flora.length; f++) {
    var fl = _flora[f]; var fx = fl.xr * W, fy = fl.yr * H, fh = fl.h * S() * (fl.layer ? 1 : 0.7);
    var col = fl.hue < 0.4 ? '#4dd0e1' : fl.hue < 0.7 ? '#b07cff' : '#7cff9a';
    c.strokeStyle = 'rgba(30,60,70,0.6)'; c.lineWidth = 3 * S();
    var bx = fx + Math.sin(t * 0.8 + f) * 4 * S(), by = fy - fh;
    c.beginPath(); c.moveTo(fx, fy); c.lineTo(bx, by); c.stroke();
    c.save(); c.shadowColor = col; c.shadowBlur = 10 * S(); c.fillStyle = col; c.globalAlpha = 0.85;
    c.beginPath(); c.arc(bx, by, 3.5 * S() * (fl.layer ? 1.2 : 0.9), 0, Math.PI * 2); c.fill(); c.restore();
  }
}

function drawBeacon(c) {
  var b = beaconXY(); var ready = obstaclesCleared >= sectorObstacleCount; var s = S();
  c.save();
  c.fillStyle = ready ? '#2ee07a' : '#3a5566';
  c.shadowColor = ready ? '#2ee07a' : '#25506a'; c.shadowBlur = (ready ? 22 : 10) * s;
  var pw = 14 * s, ph = 40 * s;
  GF.rr(c, b.x - pw / 2, b.y - 6 * s, pw, ph, 5 * s); c.fill();
  var pulse = 0.5 + 0.5 * Math.sin(t * 3);
  c.fillStyle = ready ? '#bff7d0' : '#8fb8cc'; c.globalAlpha = ready ? (0.7 + 0.3 * pulse) : 0.8;
  c.beginPath(); c.arc(b.x, b.y - 10 * s, BEACON_R * s * 0.5, 0, Math.PI * 2); c.fill();
  c.globalAlpha = 1;
  c.strokeStyle = ready ? 'rgba(46,224,122,0.8)' : 'rgba(120,160,180,0.4)'; c.lineWidth = 2.5 * s;
  c.beginPath(); c.arc(b.x, b.y - 10 * s, (BEACON_R * 0.7 + pulse * 6) * s, 0, Math.PI * 2); c.stroke();
  c.restore();
  var n = sectorObstacleCount;
  if (n > 0) {
    var gap = 14 * s, totW = (n - 1) * gap;
    for (var i = 0; i < n; i++) {
      var px = b.x - totW / 2 + i * gap, py = b.y + 30 * s;
      c.fillStyle = i < obstaclesCleared ? '#2ee07a' : 'rgba(255,255,255,0.25)';
      c.beginPath(); c.arc(px, py, 4 * s, 0, Math.PI * 2); c.fill();
    }
  }
}
function drawRanger(c) {
  var r = rangerXY(); var s = S(); var bob = Math.sin(t * 4) * 2 * s;
  c.save(); c.translate(r.x, r.y + bob);
  c.fillStyle = '#e8f3ff'; c.strokeStyle = '#2a4f66'; c.lineWidth = 2 * s;
  GF.rr(c, -8 * s, -6 * s, 16 * s, 20 * s, 6 * s); c.fill(); c.stroke();
  c.fillStyle = '#bfe9ff'; c.shadowColor = '#8ef0ff'; c.shadowBlur = 8 * s;
  c.beginPath(); c.arc(0, -12 * s, 8 * s, 0, Math.PI * 2); c.fill(); c.shadowBlur = 0;
  c.fillStyle = '#26506a'; c.beginPath(); c.arc(2 * s, -12 * s, 4 * s, 0, Math.PI * 2); c.fill();
  c.restore();
}

function drawObstacles(c) {
  for (var i = 0; i < obstacles.length; i++) {
    var ob = obstacles[i]; var s = S();
    var wob = ob.wob > 0 ? Math.sin(ob.wob * 40) * 4 * s : 0;
    c.save(); c.translate(ob.x + wob, ob.y);
    if (ob.cleared) c.globalAlpha = Math.max(0, ob.clearT / 0.6) * 0.5;
    var kind = ob.type.key;
    if (kind === 'thorn') drawThorn(c, s);
    else if (kind === 'cavern') drawCavern(c, s);
    else if (kind === 'geyser') drawGeyser(c, s);
    else if (kind === 'spore') drawSporeCloud(c, s);

    c.restore();
  }
}
function drawThorn(c, s) {
  for (var i = 0; i < 7; i++) {
    var a = (i / 7) * Math.PI * 2; var r = OBSTACLE_R * s * 0.9;
    c.save(); c.rotate(a);
    c.beginPath(); c.moveTo(-5 * s, 0); c.lineTo(0, -r); c.lineTo(5 * s, 0); c.closePath();
    c.fillStyle = '#4a2f1a'; c.strokeStyle = '#6a4a2a'; c.lineWidth = 2 * s; c.fill(); c.stroke();
    c.restore();
  }
  c.fillStyle = '#2a1a10'; c.beginPath(); c.arc(0, 0, OBSTACLE_R * s * 0.35, 0, Math.PI * 2); c.fill();
}
function drawCavern(c, s) {
  c.save(); c.shadowColor = '#000'; c.shadowBlur = 16 * s;

  c.fillStyle = g; c.beginPath(); c.arc(0, 0, OBSTACLE_R * s, 0, Math.PI * 2); c.fill();
  c.restore();
  c.fillStyle = 'rgba(120,90,180,0.5)';
  for (var i = 0; i < 3; i++) { var a = t * 0.6 + i * 2.1; c.beginPath(); c.arc(Math.cos(a) * 10 * s, Math.sin(a) * 8 * s, 2 * s, 0, Math.PI * 2); c.fill(); }
}
function drawGeyser(c, s) {
  c.fillStyle = '#26506a'; c.strokeStyle = '#3a7090'; c.lineWidth = 2 * s;
  GF.rr(c, -OBSTACLE_R * s * 0.6, -4 * s, OBSTACLE_R * s * 1.2, OBSTACLE_R * s * 0.7, 6 * s); c.fill(); c.stroke();
  c.save(); c.globalAlpha = 0.6 + 0.3 * Math.sin(t * 6); c.fillStyle = '#bfe9ff'; c.shadowColor = '#bfe9ff'; c.shadowBlur = 10 * s;
  var hh = (24 + Math.sin(t * 6) * 8) * s;
  c.beginPath(); c.moveTo(-6 * s, 0); c.lineTo(0, -hh); c.lineTo(6 * s, 0); c.closePath(); c.fill();

}
function drawSporeCloud(c, s) {
  c.save(); c.shadowColor = '#b07cff'; c.shadowBlur = 12 * s;
  for (var i = 0; i < 9; i++) { var a = (i / 9) * Math.PI * 2 + t * 0.5; var rr = OBSTACLE_R * s * (0.4 + 0.5 * ((i % 3) / 3)); c.fillStyle = 'rgba(176,124,255,0.5)'; c.beginPath(); c.arc(Math.cos(a) * rr, Math.sin(a) * rr * 0.7, 8 * s, 0, Math.PI * 2); c.fill(); }

function drawAlpha(c, s) {

  c.fillStyle = '#7a2a3a'; c.shadowColor = '#ff5a6e'; c.shadowBlur = 14 * s;
  c.beginPath(); c.arc(0, 0, OBSTACLE_R * s * 0.85, 0, Math.PI * 2); c.fill(); c.shadowBlur = 0;
  c.fillStyle = '#ffd24a';
  c.beginPath(); c.arc(-10 * s, -6 * s, 5 * s, 0, Math.PI * 2); c.arc(10 * s, -6 * s, 5 * s, 0, Math.PI * 2); c.fill();
  c.fillStyle = '#2a1015';
  c.beginPath(); c.arc(-10 * s, -6 * s, 2 * s, 0, Math.PI * 2); c.arc(10 * s, -6 * s, 2 * s, 0, Math.PI * 2); c.fill();

// creatures (procedural, characterful) --------------------------------------
function drawCreatures(c) {
  for (var i = 0; i < creatures.length; i++) {
    var cr = creatures[i]; var s = S();
    var r = CREATURE_R * s * (1 + (cr.pop || 0) * 0.6);

// coach (custom demo hand + caption; uses GF.tutorial state) -----------------
function drawCoach(c) {
  var step = GF.tutorial.steps[GF.tutorial.step]; if (!step) return;
  var s = S();
  c.save(); c.fillStyle = 'rgba(4,8,18,0.35)'; c.fillRect(0, 0, GF.W, GF.H); c.restore();
  var txt = step.text || '';
  c.font = 'bold ' + (14 * s | 0) + 'px system-ui, sans-serif';
  var cw = c.measureText(txt).width, maxw = GF.W * 0.86;
  var cx = GF.W / 2, cy = GF.H * 0.205;
  if (cw > maxw) {
    var words = txt.split(' '), l1 = '', l2 = '';
    for (var i = 0; i < words.length; i++) { if (c.measureText(l1 + words[i]).width < maxw && !l2) l1 += words[i] + ' '; else l2 += words[i] + ' '; }
    pill2(c, cx, cy, [l1.trim(), l2.trim()], s);
  } else { pill2(c, cx, cy, [txt], s); }
  if (GF.tutorial.step === 0) {
    var target = creatures.length ? creatures[0] : { x: GF.W * 0.5, y: GF.H * 0.34 };
    var rr = 62 * s;
    c.save(); c.strokeStyle = 'rgba(142,240,255,0.7)'; c.lineWidth = 3 * s; c.setLineDash([8 * s, 8 * s]); c.lineDashOffset = -t * 40;
    c.beginPath(); c.arc(target.x, target.y, rr, 0, Math.PI * 2); c.stroke(); c.restore();
    var ang = t * 1.6;
    drawHand(c, target.x + Math.cos(ang) * rr, target.y + Math.sin(ang) * rr, s, true);
  } else {
    var from = traySlotXY(0);
    var to = obstacles.length ? obstacles[0] : { x: GF.W * 0.5, y: GF.H * 0.62 };
    c.save(); c.strokeStyle = 'rgba(126,252,154,0.8)'; c.lineWidth = 3 * s; c.setLineDash([7 * s, 7 * s]); c.lineDashOffset = -t * 36;
    c.beginPath(); c.moveTo(from.x, from.y); c.lineTo(to.x, to.y); c.stroke(); c.restore();
    var cyc = 2.4, tt = (t % cyc) / cyc, hx2, hy2, pr;
    if (tt < 0.15) { hx2 = from.x; hy2 = from.y; pr = true; }
    else if (tt < 0.8) { var k = (tt - 0.15) / 0.65; hx2 = GF.lerp(from.x, to.x, k); hy2 = GF.lerp(from.y, to.y, k); pr = true; }
    else { hx2 = to.x; hy2 = to.y; pr = false; }
    drawHand(c, hx2, hy2, s, pr);
  }
}
function pill2(c, cx, cy, lines, s) {
  c.font = 'bold ' + (14 * s | 0) + 'px system-ui, sans-serif';
  var w = 0; for (var i = 0; i < lines.length; i++) w = Math.max(w, c.measureText(lines[i]).width);
  var pw = w + 28 * s, ph = 16 * s + lines.length * 18 * s;
  c.save(); c.fillStyle = 'rgba(12,18,30,0.92)'; c.shadowColor = 'rgba(0,0,0,0.4)'; c.shadowBlur = 10 * s;
  GF.rr(c, cx - pw / 2, cy - ph / 2, pw, ph, 12 * s); c.fill(); c.restore();
  c.fillStyle = '#eaf6ff'; c.textAlign = 'center'; c.textBaseline = 'middle';

}

  scrim(c, 0.86);
  titleText(c, GF.t('won_title'), W / 2, H * 0.3, Math.min(40, 28 * s), '#bff7d0');
  c.fillStyle = '#bcd3dd'; c.font = (Math.min(16, 13 * s) | 0) + 'px system-ui'; c.textAlign = 'center'; c.textBaseline = 'middle';
  wrapCenter(c, GF.t('won_sub'), W / 2, H * 0.38, W * 0.8, 20 * s);
  c.fillStyle = '#9fd0c8'; c.font = 'bold ' + (Math.min(18, 15 * s) | 0) + 'px system-ui';
  c.fillText(GF.t('journal') + ': ' + journalPct + '%', W / 2, H * 0.47);
  var bw = GF.clamp(240 * s, 180, 340), bh = GF.clamp(54 * s, 44, 70);
  bigBtn(c, W / 2, H * 0.57, bw, bh, GF.t('again'), true, function () { sectorsUnlocked = 1; startRun(); });
  bigBtn(c, W / 2, H * 0.57 + bh + 16 * s, bw, bh, GF.t('menu'), false, function () { gs = 'MENU'; saveRun(); });
}
function drawJournal(c) {
  uiButtons = []; var W = GF.W, H = GF.H, s = S();
  scrim(c, 0.9);
  titleText(c, GF.t('j_title'), W / 2, H * 0.13, Math.min(32, 24 * s), '#bff7d0');
  c.textAlign = 'center'; c.textBaseline = 'middle';
  drawStars(c, W / 2, H * 0.19, lastStars, 12 * s);
  var startY = H * 0.27, rowH = Math.min(64 * s, (H * 0.56) / SPECIES_ORDER.length);
  for (var i = 0; i < SPECIES_ORDER.length; i++) {
    var k = SPECIES_ORDER[i]; var have = journal[k]; var yy = startY + i * rowH;
    var isNew = lastNewSpecies.indexOf(k) >= 0;
    c.fillStyle = have ? (isNew ? 'rgba(46,224,122,0.16)' : 'rgba(255,255,255,0.05)') : 'rgba(255,255,255,0.02)';
    GF.rr(c, W * 0.08, yy - rowH * 0.42, W * 0.84, rowH * 0.84, 10 * s); c.fill();
    c.save(); c.translate(W * 0.16, yy);
    if (have) drawSpecies(c, { sp: SPECIES[k], wig: t * 4 + i, facing: 1, sheltered: false, bond: 0 }, 15 * s, s);
    else { c.fillStyle = 'rgba(255,255,255,0.12)'; c.beginPath(); c.arc(0, 0, 14 * s, 0, Math.PI * 2); c.fill(); c.fillStyle = '#556'; c.font = 'bold ' + (16 * s | 0) + 'px system-ui'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText('?', 0, 1 * s); }
    c.restore();
    c.textAlign = 'left'; c.textBaseline = 'middle';
    c.fillStyle = have ? '#eaf6ff' : '#63788a'; c.font = 'bold ' + (13 * s | 0) + 'px system-ui';
    c.fillText(have ? GF.t(SPECIES[k].name) : '? ? ?', W * 0.26, yy - 10 * s);
    if (have) { c.fillStyle = '#9fb8c4'; c.font = (11 * s | 0) + 'px system-ui'; wrapLeft(c, GF.t(SPECIES[k].note), W * 0.26, yy + 6 * s, W * 0.66, 13 * s, 2); }
    if (isNew) { c.fillStyle = '#2ee07a'; c.font = 'bold ' + (10 * s | 0) + 'px system-ui'; c.textAlign = 'right'; c.fillText(GF.t('j_new'), W * 0.9, yy - rowH * 0.3); c.textAlign = 'left'; }
  }
  var bw = GF.clamp(240 * s, 180, 340), bh = GF.clamp(52 * s, 42, 66);
  bigBtn(c, W / 2, H * 0.92, bw, bh, GF.t('cont'), true, function () { lastNewSpecies = []; nextSector(); });
}
function nextSector() {
  try { GF.ads.interstitial(); } catch (e) {}
  if (sector >= SECTOR_COUNT) { gs = 'WON'; return; }
  gs = 'PLAYING';
  loadSector(sector + 1, false);
  GF.gameStarted();
  saveRun();
}
function drawStars(c, cx, cy, n, r) {
  for (var i = 0; i < 3; i++) drawStar(c, cx + (i - 1) * (r * 2.6), cy, r, i < n ? '#ffd24a' : 'rgba(255,255,255,0.18)');
}
function drawStar(c, x, y, r, col) {
  c.save(); c.translate(x, y); c.fillStyle = col; c.shadowColor = col; c.shadowBlur = 8 * S(); c.beginPath();
  for (var i = 0; i < 5; i++) { var a = -Math.PI / 2 + i * Math.PI * 2 / 5; c.lineTo(Math.cos(a) * r, Math.sin(a) * r); var a2 = a + Math.PI / 5; c.lineTo(Math.cos(a2) * r * 0.45, Math.sin(a2) * r * 0.45); }
  c.closePath(); c.fill(); c.restore();
}
function wrapCenter(c, txt, cx, cy, maxw, lh) {
  var words = txt.split(' '), line = '', lines = [];
  for (var i = 0; i < words.length; i++) { if (c.measureText(line + words[i]).width > maxw && line) { lines.push(line); line = ''; } line += words[i] + ' '; }
  if (line) lines.push(line);
  for (var j = 0; j < lines.length; j++) c.fillText(lines[j].trim(), cx, cy + j * lh);
}
function wrapLeft(c, txt, x, y, maxw, lh, maxLines) {
  var words = txt.split(' '), line = '', lines = [];
  for (var i = 0; i < words.length; i++) { if (c.measureText(line + words[i]).width > maxw && line) { lines.push(line); line = ''; if (lines.length >= maxLines) break; } line += words[i] + ' '; }
  if (line && lines.length < maxLines) lines.push(line);
  for (var j = 0; j < lines.length; j++) c.fillText(lines[j].trim(), x, y + j * lh);
}

// ── PERSISTENCE ───────────────────────────────────────────────────────────
function runSnapshot() {
  return {
    gs: (gs === 'PAUSE' ? 'PLAYING' : gs), sector: sector, obstaclesCleared: obstaclesCleared,
    party: party.map(function (p) { return p.sp.key; }), startle: startle, styler: styler,
    sectorsUnlocked: sectorsUnlocked, befriends: befriends, clears: clears,
    journal: journal, stars: stars, bestTimes: bestTimes,
  };
}
function applySnapshot(sv) {
  if (!sv) return;
  sectorsUnlocked = sv.sectorsUnlocked || 1;
  befriends = sv.befriends || 0; clears = sv.clears || 0;
  journal = sv.journal || {}; stars = sv.stars || {}; bestTimes = sv.bestTimes || {};
  recomputeJournal();
  var rgs = sv.gs || 'MENU';
  if (rgs === 'PLAYING' || rgs === 'GAMEOVER') {
    sector = sv.sector || 1;
    loadSector(sector, true);
    obstaclesCleared = Math.min(sv.obstaclesCleared || 0, sectorObstacleCount);
    party = (sv.party || []).map(function (k) { return { sp: SPECIES[k] }; }).filter(function (p) { return p.sp; });
    startle = sv.startle || 0; styler = (sv.styler != null ? sv.styler : STYLER_MAX);
    gs = 'PLAYING';
  } else if (rgs === 'WON') { gs = 'WON'; }
  else { gs = 'MENU'; }
}
function saveRun() { GF.saveRun(); }

// ── SCREENSHOT / TEST HOOKS ───────────────────────────────────────────────
window._jumpLevel = function () { window._setupForScreenshot(3); };
window._setupForScreenshot = function (level) {
  try { localStorage.setItem('exo_rangers_seen_tutorial', '1'); } catch (e) {}
  if (GF.tutorial) GF.tutorial.active = false;
  gs = 'PLAYING';
  var lv = GF.clamp(level || 3, 2, SECTOR_COUNT);
  loadSector(lv, false);
  var def = SECTORS[lv - 1];
  party = [];
  for (var i = 0; i < def.creatures.length && party.length < 3; i++) party.push({ sp: SPECIES[def.creatures[i][0]] });
  obstaclesCleared = Math.min(1, sectorObstacleCount);
  if (creatures.length) {
    var c0 = creatures[0]; trail = [];
    for (var a = 0; a < 12; a++) { var ang = a / 12 * Math.PI * 1.6; trail.push({ x: c0.x + Math.cos(ang) * 60 * S(), y: c0.y + Math.sin(ang) * 60 * S() }); }
    isDrawing = true;
  }
};

// ── LOCALE-AUDIT HOOKS (used by tools/locale_overflow_check.js) ────────────
window._getI18N = function () { return STRINGS; };
window._getFontBody = function () { return 'system-ui, sans-serif'; };
window._setState = function (n) {
  try { localStorage.setItem('exo_rangers_seen_tutorial', '1'); } catch (e) {}
  if (GF.tutorial) GF.tutorial.active = false;
  if (n === 1) { gs = 'MENU'; }
  else if (n === 2) { if (!obstacles.length || sector === 1) loadSector(2, false); party = [{ sp: SPECIES.ember }, { sp: SPECIES.lumen }]; gs = 'PLAYING'; }
  else if (n === 3) { if (!obstacles.length) loadSector(2, false); gs = 'PAUSE'; }
  else if (n === 4) { gs = 'GAMEOVER'; }
  else if (n === 5) { lastStars = 3; lastNewSpecies = ['ember']; journal = { ember: true, lumen: true }; recomputeJournal(); gs = 'JOURNAL'; }
  else if (n === 6) { gs = 'WON'; }
};

// ── BALANCE-PROBE BOT (progression/balance only; not a QA sign-off path) ───
function botActions() {
  var acts = [];
  if (creatures.some(function (c) { return !c.sheltered; })) acts.push('capture');
  for (var i = 0; i < party.length; i++) { var found = false; for (var o = 0; o < obstacles.length; o++) { if (!obstacles[o].cleared && canDeploy(party[i].sp, obstacles[o])) { found = true; break; } } if (found) { acts.push('deploy'); break; } }
  return acts;
}
function botDo(action) {
  if (gs !== 'PLAYING') { if (gs === 'JOURNAL') nextSector(); else if (gs === 'GAMEOVER') retrySector(); return; }
  if (action === 'capture') {
    // Prefer a wild TOOL species that some uncleared obstacle still needs and we
    // are not already holding — so the bot (balance probe) never clogs the tray.
    function needed(sp) { if (!sp.tool) return false; for (var o = 0; o < obstacles.length; o++) { if (!obstacles[o].cleared && canDeploy(sp, obstacles[o])) return true; } return false; }
    function held(sp) { for (var q = 0; q < party.length; q++) if (party[q].sp.key === sp.key) return true; return false; }
    var best = null, bd = 1e9, i, c, d;
    for (i = 0; i < creatures.length; i++) { c = creatures[i]; if (c.sheltered || !needed(c.sp) || held(c.sp)) continue; d = Math.hypot(c.x - GF.W / 2, c.y - GF.H / 2); if (d < bd) { bd = d; best = c; } }
    if (!best) { for (i = 0; i < creatures.length; i++) { c = creatures[i]; if (c.sheltered) continue; d = Math.hypot(c.x - GF.W / 2, c.y - GF.H / 2); if (d < bd) { bd = d; best = c; } } }
    if (best) { best.bond = best.sp.loops; befriend(best); }
  } else if (action === 'deploy') {
    for (var p = 0; p < party.length; p++) { for (var o = 0; o < obstacles.length; o++) { if (!obstacles[o].cleared && canDeploy(party[p].sp, obstacles[o])) { deployOnObstacle(p, obstacles[o]); return; } } }
  }
}

// ── REACHABILITY (Yandex 1.10 — every interactive item stays on-screen) ────
function bcx(x, y, w, h, id) { return { id: id, x: x - w / 2, y: y - h / 2, w: w, h: h }; }
function reachItems() {
  var s = S(), W = GF.W, H = GF.H, items = [];
  var bw = GF.clamp(240 * s, 180, 340), bh = GF.clamp(54 * s, 44, 70);
  if (gs === 'MENU') { items.push(bcx(W / 2, H * 0.62, bw, bh, 'play')); }
  else if (gs === 'PLAYING') {
    var r = 15 * s;
    items.push(bcx(W - 22 * s, 24 * s, 2 * r, 2 * r, 'pause'));
    items.push(bcx(W - 22 * s - 38 * s, 24 * s, 2 * r, 2 * r, 'help'));
    items.push(bcx(W - 22 * s - 76 * s, 24 * s, 2 * r, 2 * r, 'mute'));
    var slot = TRAY_SLOT * s;
    for (var i = 0; i < PARTY_MAX; i++) { var sl = traySlotXY(i); items.push(bcx(sl.x, sl.y, slot, slot, 'tray' + i)); }
  }
  else if (gs === 'PAUSE') { items.push(bcx(W / 2, H * 0.5, bw, bh, 'resume')); items.push(bcx(W / 2, H * 0.5 + bh + 16 * s, bw, bh, 'menu')); }
  else if (gs === 'GAMEOVER') { items.push(bcx(W / 2, H * 0.55, bw, bh, 'retry')); items.push(bcx(W / 2, H * 0.55 + bh + 16 * s, bw, bh, 'menu')); }
  else if (gs === 'WON') { items.push(bcx(W / 2, H * 0.57, bw, bh, 'again')); items.push(bcx(W / 2, H * 0.57 + bh + 16 * s, bw, bh, 'menu')); }
  else if (gs === 'JOURNAL') { items.push(bcx(W / 2, H * 0.92, GF.clamp(240 * s, 180, 340), GF.clamp(52 * s, 42, 66), 'continue')); }
  return items;
}

// ── BOOT ──────────────────────────────────────────────────────────────────
GF.init({
  designW: 393,
  designH: 852,
  strings: STRINGS,
  sprites: SPRITE_NAMES,
  saveKey: 'exo_rangers',
  onReady: function () {
    try { if (localStorage.getItem('exo_rangers_muted') === '1' && !GF.muted) GF.toggleMute(); } catch (e) {}

    GF.exposeState(function () {
      return {
        coordinateSystem: 'canvas origin top-left; +x right; +y down',
        gs: gs, sector: sector, SECTOR_COUNT: SECTOR_COUNT, sectorsUnlocked: sectorsUnlocked,
        styler: Math.round(styler), STYLER_MAX: STYLER_MAX,
        startle: Math.round(startle), STARTLE_MAX: STARTLE_MAX,
        befriends: befriends, clears: clears,
        obstaclesCleared: obstaclesCleared, sectorObstacleCount: sectorObstacleCount,
        partyCount: party.length, PARTY_MAX: PARTY_MAX,
        journalPct: journalPct, isDrawing: isDrawing, carrying: !!carrying,
        tutorialActive: GF.tutorial.active, tutorialStep: GF.tutorial.step,
        // Visible entities so QA (and any bot) can aim like a player who can
        // see the field - the state contract wants enemies/collectibles listed.
        creatures: creatures.map(function (c) { return { species: c.sp.key, x: Math.round(c.x), y: Math.round(c.y), frozen: !!c.frozen, sheltered: !!c.sheltered, bond: c.bond }; }),
        obstacles: obstacles.map(function (o) { return { type: o.type.key, x: Math.round(o.x), y: Math.round(o.y), cleared: !!o.cleared }; }),
      };
    });
    GF.exposeBot(botActions, botDo);
    GF.exposeReach(function () { return { screen: gs, items: reachItems(), viewportH: GF.H, scrollMaxY: 0 }; });
    GF.exposeTour([
      { name: 'MENU', go: function () { gs = 'MENU'; } },
      { name: 'PLAYING', go: function () { try { localStorage.setItem('exo_rangers_seen_tutorial', '1'); } catch (e) {} if (GF.tutorial) GF.tutorial.active = false; if (!obstacles.length) loadSector(1, false); gs = 'PLAYING'; } },
      { name: 'PAUSE', go: function () { if (!obstacles.length) loadSector(1, false); gs = 'PAUSE'; } },
      { name: 'JOURNAL', go: function () { lastStars = 3; gs = 'JOURNAL'; } },
      { name: 'GAMEOVER', go: function () { gs = 'GAMEOVER'; } },
      { name: 'WON', go: function () { gs = 'WON'; } },
    ]);

    GF.persist('exo_rangers_run_v1', runSnapshot, applySnapshot);
    if (gs !== 'PLAYING' && gs !== 'WON') gs = 'MENU';

    GF.bgMusic({ file: 'audio/bg_track.mp3', preset: 'cozy', muted: GF.muted });

    GF.remoteConfig('exo_rangers', CFG, {
      clamps: { 'tuning.styler_regen_mult': [0.5, 2], 'tuning.startle_mult': [0.5, 2] },
      onUpdate: function (cfg) { CFG = cfg; },
    }).then(function (cfg) { CFG = cfg; });

    var cv = GF.canvas;
    function refreshRect() { var r = cv.getBoundingClientRect(); _rect.left = r.left; _rect.top = r.top; }
    refreshRect();
    window.addEventListener('resize', refreshRect);
    window.addEventListener('orientationchange', function () { setTimeout(refreshRect, 80); });
    cv.addEventListener('pointerdown', function (e) { refreshRect(); var p = evXY(e); try { cv.setPointerCapture(e.pointerId); } catch (_) {} onPress(p.x, p.y); });
    window.addEventListener('pointermove', function (e) { if (!isDrawing && !carrying) return; var p = evXY(e); onMove(p.x, p.y); });
    window.addEventListener('pointerup', function (e) { var p = evXY(e); onRelease(p.x, p.y); });
    window.addEventListener('pointercancel', function () { if (isDrawing) { isDrawing = false; trail = []; } carrying = null; });
    window.addEventListener('keydown', function (e) {
      if (e.code === 'KeyM') toggleMute();
      else if (e.code === 'KeyP' || e.code === 'Escape') { if (gs === 'PLAYING') gs = 'PAUSE'; else if (gs === 'PAUSE') gs = 'PLAYING'; }
    });

    if (window.__GF_AUTOSTART && !window._silent && gs === 'MENU') { startRun(); }
  },
  onUpdate: update,
  onDraw: draw,
});

})();
</script>
