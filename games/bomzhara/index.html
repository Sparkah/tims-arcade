<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Bullet Hell Bomzhara</title>
  <script src="/sdk.js"></script>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #060504; touch-action: none; }
    #gl, #hud { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
    #hud { pointer-events: none; }
    #fallback { position: fixed; inset: 0; display: none; place-items: center; padding: 24px; color: #ffd9c5; background: #080605; text-align: center; font-family: ui-monospace, monospace; }
  </style>
</head>
<body>
  <canvas id="gl"></canvas>
  <canvas id="hud"></canvas>
  <div id="fallback">WebGL2 required.</div>
  <script>
    // Right-click / long-press must not open the browser menu or start a text
    // selection over the game field (Yandex 1.6.2.7 desktop, 1.6.1.8 mobile).
    // Paired with -webkit-touch-callout:none above.
    ['contextmenu', 'selectstart', 'dragstart'].forEach(function (ev) {
      document.addEventListener(ev, function (e) { e.preventDefault(); }, { passive: false });
    });
  </script>
  <script type="module" src="main.js?v=20260801a"></script>
</body>
</html>
