var START_ENERGY = 18;
var MAX_CONFUSION = 5;
var BASE_LESSON_TARGET = 6;
var WRONG_ENERGY_COST = 2;
var NEED_DRAIN_COST = 1;
var CORRECT_SCORE = 100;
var STREAK_BONUS = 18;
var PRESSURE_BASE = 8.5;
var PRESSURE_MIN = 4.4;
var REPEAT_COST = 0.6;
var ANSWER_TILE_COUNT = 4;
var NOTEBOOK_SIZE = 8;

var MEANINGS = {

};

var SPECIES = [

];

var HABITAT_PALETTES = [
  { top: '#31482f', mid: '#526f42', low: '#22352a', accent: '#e6d28b' },
  { top: '#263f4d', mid: '#4d756d', low: '#1d3035', accent: '#92d8e0' },

  { top: '#24313d', mid: '#40566d', low: '#141d2b', accent: '#abc8ff' }

var pressure = PRESSURE_BASE;

var gameOverReason = 'reason_energy';

var answerFlashGood = true;
var wrongShake = 0;

var screenshotMode = false;

function clamp(v, lo, hi) { return v < lo ? lo : v > hi ? hi : v; }
function lerp(a, b, t) { return a + (b - a) * t; }
function seededRandom() {
  rngSeed = (rngSeed * 1664525 + 1013904223) >>> 0;
  return rngSeed / 4294967296;
}
function choice(arr) { return arr[Math.floor(seededRandom() * arr.length) % arr.length]; }
function copyArray(arr) { return arr.slice(0); }
function shuffle(arr) {
  for (var i = arr.length - 1; i > 0; i--) {
    var j = Math.floor(seededRandom() * (i + 1));
    var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
  }
  return arr;
}
function tMeaning(id) { return GF.t(MEANINGS[id] ? MEANINGS[id].key : 'meaning_hungry'); }
function tSpecies(sp) { return GF.t((sp || activeSpecies).key); }
function lensKey() { return LENSES[currentLens]; }
function fs(n) { return Math.round(clamp(n * scene.ui, n * 0.72, n * 1.18)); }

function availableSpecies() {
  var count = clamp(2 + Math.floor((habitat - 1) * 0.9), 2, SPECIES.length);
  return SPECIES.slice(0, count);
}
function availableMeanings() {
  var count = clamp(4 + Math.floor((habitat - 1) * 0.85), 4, MEANING_IDS.length);
  return MEANING_IDS.slice(0, count);
}
function currentPalette() {
  return HABITAT_PALETTES[(habitat - 1) % HABITAT_PALETTES.length];
}

function layout() {
  var raw = Math.min(GF.W / 440, GF.H / 760);
  var ui = clamp(raw, 0.74, 1.20);
  if (Math.min(GF.W, GF.H) < 430) ui = Math.max(ui, 0.82);
  var narrow = GF.W < 540;
  var top = narrow ? Math.round(clamp(118 * ui, 96, 124)) : Math.round(clamp(82 * ui, 70, 104));
  var bottom = narrow ? Math.round(clamp(218 * ui, 188, 242)) : Math.round(clamp(186 * ui, 150, 214));
  scene.x = 0;
  scene.y = top;
  scene.w = GF.W;
  scene.h = Math.max(150, GF.H - top - bottom);
  scene.top = top;
  scene.bottom = bottom;
  scene.ui = ui;

  uiRects.help = { x: GF.W - 44 * ui, y: 9 * ui, w: 32 * ui, h: 32 * ui };
  uiRects.mute = { x: GF.W - 82 * ui, y: 9 * ui, w: 32 * ui, h: 32 * ui };
  uiRects.retry = { x: GF.cx - 78 * ui, y: GF.cy + 88 * ui, w: 156 * ui, h: 44 * ui };
  uiRects.signal = {
    x: Math.max(14 * ui, GF.cx - 182 * ui),
    y: scene.y + scene.h - 80 * ui,
    w: Math.min(GF.W - 28 * ui, 364 * ui),
    h: 58 * ui
  };

  var bottomY = scene.y + scene.h;
  var noteH = 36 * ui;
  uiRects.notebook = { x: 12 * ui, y: bottomY + 8 * ui, w: GF.W - 24 * ui, h: noteH };
  var gridY = bottomY + 52 * ui;
  var gap = 8 * ui;
  var tileH = Math.max(52 * ui, (scene.bottom - 64 * ui - gap) / 2);
  var tileW = (GF.W - 24 * ui - gap) / 2;
  uiRects.tiles = [];
  for (var i = 0; i < ANSWER_TILE_COUNT; i++) {
    var col = i % 2;
    var row = Math.floor(i / 2);
    uiRects.tiles.push({
      x: 12 * ui + col * (tileW + gap),
      y: gridY + row * (tileH + gap),
      w: tileW,
      h: tileH
    });
  }
  uiRects.helpClose = { x: GF.cx - 70 * ui, y: GF.cy + 148 * ui, w: 140 * ui, h: 38 * ui };
}

function ptrPos(e) {
  var r = GF.canvas.getBoundingClientRect();
  var sx = GF.W / Math.max(1, r.width);
  var sy = GF.H / Math.max(1, r.height);
  return { x: (e.clientX - r.left) * sx, y: (e.clientY - r.top) * sy };
}
function hitRect(p, r) {
  return r && p.x >= r.x && p.x <= r.x + r.w && p.y >= r.y && p.y <= r.y + r.h;
}

function makeOptions(correct) {
  var pool = availableMeanings().filter(function(id) { return id !== correct; });
  while (pool.length < 3) {
    for (var i = 0; i < MEANING_IDS.length && pool.length < 3; i++) {
      if (MEANING_IDS[i] !== correct && pool.indexOf(MEANING_IDS[i]) < 0) pool.push(MEANING_IDS[i]);
    }
  }
  var picks = shuffle(copyArray(pool)).slice(0, 3);
  picks.push(correct);
  return shuffle(picks);
}

function newLesson(forceMeaning) {
  activeSpecies = choice(availableSpecies());
  activeMeaning = forceMeaning || choice(availableMeanings());
  options = makeOptions(activeMeaning);
  currentLens = Math.floor(seededRandom() * LENSES.length) % LENSES.length;
  pressureMax = clamp(PRESSURE_BASE - (habitat - 1) * 0.42, PRESSURE_MIN, PRESSURE_BASE);
  pressure = pressureMax;
  repeatPulse = 0;
  lessonSerial++;
}

function saveMeta() {
  GF.saveRun();
}

function getMeta() {
  return {
    best: best,
    bestHabitat: bestHabitat,
    notebook: notebook.slice(0, NOTEBOOK_SIZE),
    tutorialDone: tutorialDone
  };
}

function applyMeta(s) {
  if (!s || typeof s !== 'object') return;
  best = Math.max(0, Number(s.best) || 0);
  bestHabitat = Math.max(1, Number(s.bestHabitat) || 1);
  notebook = Array.isArray(s.notebook) ? s.notebook.slice(0, NOTEBOOK_SIZE) : [];
  tutorialDone = !!s.tutorialDone;
  if (tutorialDone) coachStep = 99;
}

function startGame(opts) {
  opts = opts || {};
  gs = 'PLAYING';
  score = 0;
  habitat = 1;
  energy = START_ENERGY;
  confusion = 0;
  streak = 0;
  lessonsCleared = 0;
  lessonTarget = BASE_LESSON_TARGET;
  completeTimer = 0;
  answerFlash = 0;
  wrongShake = 0;
  rngSeed = 233 + Math.floor(Date.now() % 997);
  flags = { answered: false, rotated: false, repeated: false, correctAfterCoach: false };
  if (opts.suppressTutorial || tutorialDone) coachStep = 99;
  else coachStep = 0;
  helpOpen = false;
  newLesson('hungry');
  GF.gameStarted();
}

function gameOver(reason) {
  if (gs === 'GAMEOVER') return;
  gameOverReason = reason || 'reason_energy';
  gs = 'GAMEOVER';
  if (score > best) {
    best = score;
    GF.happytime();
  }
  if (habitat > bestHabitat) bestHabitat = habitat;
  saveMeta();
  GF.sfx('lose');
  GF.gameEnded();
  GF.ads.interstitial();
}

function addNotebook() {
  var entry = {
    species: activeSpecies.id,
    speciesKey: activeSpecies.key,
    meaning: activeMeaning,
    habitat: habitat
  };
  notebook.unshift(entry);
  var seen = {};
  notebook = notebook.filter(function(n) {
    var key = n.species + ':' + n.meaning;
    if (seen[key]) return false;
    seen[key] = true;
    return true;
  }).slice(0, NOTEBOOK_SIZE);
}

function completeHabitat() {
  completeTimer = 2.2;
  habitat++;
  bestHabitat = Math.max(bestHabitat, habitat);
  lessonsCleared = 0;
  lessonTarget = BASE_LESSON_TARGET + Math.floor((habitat - 1) / 2);
  energy = Math.min(START_ENERGY + 6, energy + 4);
  confusion = Math.max(0, confusion - 1);
  streak++;
  GF.sfx('levelup');
  GF.spawnParticles(GF.cx, scene.y + scene.h * 0.42, currentPalette().accent, 34);
  GF.spawnFloat(GF.cx, scene.y + scene.h * 0.42, GF.t('habitat_clear') + ' ' + String(habitat - 1), '#fff1a5');
  saveMeta();
  newLesson();
}

function answer(id) {
  if (gs !== 'PLAYING' || helpOpen || !id) return false;
  flags.answered = true;
  var good = id === activeMeaning;
  answerFlash = 0.55;
  answerFlashGood = good;
  if (good) {
    var gain = CORRECT_SCORE + habitat * 7 + streak * STREAK_BONUS;
    score += gain;
    streak++;
    lessonsCleared++;
    flags.correctAfterCoach = true;
    addNotebook();
    GF.sfx(streak >= 4 ? 'reward' : 'coin');
    GF.spawnParticles(GF.cx, scene.y + scene.h * 0.46, MEANINGS[activeMeaning].color, 22);
    GF.spawnFloat(GF.cx, scene.y + scene.h * 0.40, '+' + String(gain), '#f8ed9f');
    if (score > best) best = score;
    if (!tutorialDone && coachStep === 0) coachStep = 1;
    else if (!tutorialDone && coachStep === 3) { tutorialDone = true; coachStep = 99; }
    if (lessonsCleared >= lessonTarget) completeHabitat();
    else newLesson();
    saveMeta();
  } else {
    energy -= WRONG_ENERGY_COST;
    confusion++;
    streak = 0;
    wrongShake = 0.42;
    pressure = Math.min(pressureMax, pressure + 1.2);
    options = makeOptions(activeMeaning);
    GF.sfx('hurt');
    GF.spawnFloat(GF.cx, scene.y + scene.h * 0.42, GF.t('wrong'), '#ffad91');
    if (energy <= 0) gameOver('reason_energy');
    else if (confusion >= MAX_CONFUSION) gameOver('reason_confusion');
    saveMeta();
  }
  return good;
}

function rotateLens(dir) {
  if (gs !== 'PLAYING') return;
  currentLens = (currentLens + dir + LENSES.length) % LENSES.length;
  flags.rotated = true;
  if (!tutorialDone && coachStep === 1) coachStep = 2;
  GF.sfx('tap');
}

function repeatCall() {
  if (gs !== 'PLAYING' || helpOpen) return;
  currentLens = 0;
  energy = Math.max(0, energy - REPEAT_COST);
  pressure = Math.min(pressureMax, pressure + 1.6);
  repeatPulse = 0.55;
  flags.repeated = true;
  if (!tutorialDone && coachStep === 2) coachStep = 3;
  GF.sfx('spawn');
  if (energy <= 0) gameOver('reason_energy');
  saveMeta();
}

function updateCoach() {
  if (tutorialDone || coachStep >= 99) return;
  if (coachStep === 1 && flags.rotated) coachStep = 2;
  if (coachStep === 2 && flags.repeated) coachStep = 3;
  if (coachStep === 3 && flags.correctAfterCoach) {
    tutorialDone = true;
    coachStep = 99;
    saveMeta();
  }
}

function update(dt) {
  dt = clamp(dt, 0, 0.12);
  pulse += dt;
  answerFlash = Math.max(0, answerFlash - dt);
  wrongShake = Math.max(0, wrongShake - dt * 2.2);
  repeatPulse = Math.max(0, repeatPulse - dt);
  completeTimer = Math.max(0, completeTimer - dt);
  updateCoach();
  if (gs !== 'PLAYING' || helpOpen || completeTimer > 0) return;
  pressure -= dt;
  if (pressure <= 0) {
    pressure = pressureMax;
    energy -= NEED_DRAIN_COST;
    streak = 0;
    wrongShake = 0.32;
    GF.sfx('hit');
    GF.spawnFloat(GF.cx, scene.y + scene.h * 0.38, GF.t('drained') + ' -' + String(NEED_DRAIN_COST), '#ffb48f');
    if (energy <= 0) gameOver('reason_energy');
    saveMeta();
  }
}

function drawText(c, txt, x, y, size, color, align, weight) {
  c.font = (weight || '650') + ' ' + String(size) + 'px system-ui, -apple-system, Segoe UI, sans-serif';
  c.fillStyle = color || '#f5f1df';
  c.textAlign = align || 'left';
  c.textBaseline = 'alphabetic';
  c.fillText(String(txt), x, y);
}

function fitText(c, txt, x, y, maxW, size, color, align, weight) {
  var s = size;
  txt = String(txt);
  c.font = (weight || '650') + ' ' + String(s) + 'px system-ui, -apple-system, Segoe UI, sans-serif';
  while (s > 9 && c.measureText(txt).width > maxW) {
    s--;
    c.font = (weight || '650') + ' ' + String(s) + 'px system-ui, -apple-system, Segoe UI, sans-serif';
  }
  c.fillStyle = color || '#f5f1df';
  c.textAlign = align || 'left';
  c.textBaseline = 'alphabetic';
  c.fillText(txt, x, y);
}

function wrapLines(c, text, maxW, size, weight) {
  c.font = (weight || '650') + ' ' + String(size) + 'px system-ui, -apple-system, Segoe UI, sans-serif';
  var words = String(text).split(/\s+/);
  var lines = [];
  var line = '';
  for (var i = 0; i < words.length; i++) {
    var test = line ? line + ' ' + words[i] : words[i];
    if (c.measureText(test).width > maxW && line) {
      lines.push(line);
      line = words[i];
    } else {
      line = test;
    }
  }
  if (line) lines.push(line);
  return lines;
}

function roundRect(c, x, y, w, h, r) {
  GF.rr(c, x, y, w, h, r);
}

function drawBackground(c) {
  var p = currentPalette();
  var g = c.createLinearGradient(0, scene.y, 0, scene.y + scene.h);
  g.addColorStop(0, p.top);
  g.addColorStop(0.56, p.mid);
  g.addColorStop(1, p.low);
  c.fillStyle = g;
  c.fillRect(0, scene.y, GF.W, scene.h);

  c.save();
  c.globalAlpha = 0.25;
  for (var i = 0; i < 18; i++) {
    var x = ((i * 97 + habitat * 31) % Math.max(1, GF.W));
    var y = scene.y + ((i * 71 + habitat * 43) % Math.max(1, scene.h));
    var w = (26 + (i % 5) * 9) * scene.ui;
    var h = (7 + (i % 3) * 4) * scene.ui;
    c.fillStyle = i % 2 ? '#f4df9d' : '#21402e';
    c.beginPath();
    c.ellipse(x, y, w, h, (i * 0.7) % Math.PI, 0, Math.PI * 2);
    c.fill();
  }
  c.restore();

  c.strokeStyle = 'rgba(255,255,255,0.10)';
  c.lineWidth = Math.max(1, 2 * scene.ui);
  c.beginPath();
  c.moveTo(0, scene.y + scene.h * 0.70);
  c.bezierCurveTo(GF.W * 0.25, scene.y + scene.h * 0.62, GF.W * 0.68, scene.y + scene.h * 0.80, GF.W, scene.y + scene.h * 0.68);
  c.stroke();
}

function drawHUD(c) {
  var ui = scene.ui;
  var narrow = GF.W < 540;
  c.fillStyle = '#141a16';
  c.fillRect(0, 0, GF.W, scene.top);
  c.fillStyle = '#101510';
  c.fillRect(0, scene.y + scene.h, GF.W, scene.bottom);
  c.strokeStyle = 'rgba(255,255,255,0.11)';
  c.beginPath();
  c.moveTo(0, scene.top - 0.5);
  c.lineTo(GF.W, scene.top - 0.5);
  c.moveTo(0, scene.y + scene.h + 0.5);
  c.lineTo(GF.W, scene.y + scene.h + 0.5);
  c.stroke();

  var quota = GF.t('lesson') + ' ' + String(lessonsCleared) + '/' + String(lessonTarget);
  var stat = GF.t('energy') + ' ' + String(Math.ceil(energy)) + '  ' + GF.t('confusion') + ' ' + String(confusion) + '/' + String(MAX_CONFUSION);
  if (narrow) {
    fitText(c, GF.t('title'), 10 * ui, 22 * ui, GF.W - 112 * ui, fs(16), '#f8edc8', 'left', '850');
    fitText(c, GF.t('habitat') + ' ' + String(habitat) + '  ' + GF.t('score') + ' ' + String(score), 10 * ui, 45 * ui, GF.W - 20 * ui, fs(12), '#dce6d2', 'left', '750');
    fitText(c, quota + '  ' + GF.t('streak') + ' ' + String(streak), GF.cx, 70 * ui, GF.W - 20 * ui, fs(14), '#f3da83', 'center', '850');
    fitText(c, stat, GF.cx, 94 * ui, GF.W - 20 * ui, fs(12), energy <= 5 || confusion >= 3 ? '#ffb093' : '#d6e6c8', 'center', '750');
  } else {
    fitText(c, GF.t('title'), 12 * ui, 24 * ui, GF.W * 0.32, fs(17), '#f8edc8', 'left', '850');
    fitText(c, GF.t('habitat') + ' ' + String(habitat) + '  ' + GF.t('score') + ' ' + String(score), 12 * ui, 49 * ui, GF.W * 0.34, fs(12), '#dce6d2', 'left', '750');
    fitText(c, quota, GF.cx, 28 * ui, GF.W * 0.32, fs(15), '#f3da83', 'center', '850');
    fitText(c, GF.t('active') + ': ' + tSpecies(activeSpecies), GF.cx, 52 * ui, GF.W * 0.38, fs(12), '#dfe4ce', 'center', '700');
    fitText(c, stat, GF.W - 94 * ui, 29 * ui, 122 * ui, fs(12), energy <= 5 || confusion >= 3 ? '#ffb093' : '#d6e6c8', 'right', '750');
    fitText(c, GF.t('streak') + ' ' + String(streak) + '  ' + GF.t('best') + ' ' + String(best), GF.W - 94 * ui, 52 * ui, 132 * ui, fs(12), '#e6dcb6', 'right', '750');
  }

  drawIconButton(c, uiRects.help, GF.t('help_btn'));
  GF.drawMuteIcon(c, uiRects.mute.x + uiRects.mute.w / 2, uiRects.mute.y + uiRects.mute.h / 2, uiRects.mute.w * 0.48, GF.muted);
}

function drawIconButton(c, r, label) {
  c.fillStyle = 'rgba(255,255,255,0.11)';
  roundRect(c, r.x, r.y, r.w, r.h, 8 * scene.ui);
  c.fill();
  c.strokeStyle = 'rgba(255,255,255,0.22)';
  c.stroke();
  fitText(c, label, r.x + r.w / 2, r.y + r.h * 0.68, r.w - 8 * scene.ui, fs(14), '#f5edcf', 'center', '850');
}

function animalCenter() {
  var dx = wrongShake > 0 ? Math.sin(pulse * 42) * 5 * wrongShake * scene.ui : 0;
  return { x: GF.cx + dx, y: scene.y + scene.h * 0.39 };
}

function drawAnimal(c) {
  var p = animalCenter();
  var ui = scene.ui;
  var sp = activeSpecies || SPECIES[0];
  var meaning = MEANINGS[activeMeaning] || MEANINGS.hungry;
  var bob = Math.sin(pulse * 3 + lessonSerial) * 3 * ui;
  c.save();
  c.translate(p.x, p.y + bob);
  c.lineWidth = Math.max(2, 3 * ui);
  if (sp.id === 'hare') {
    c.fillStyle = sp.color;
    c.beginPath(); c.ellipse(0, 10 * ui, 42 * ui, 30 * ui, 0, 0, Math.PI * 2); c.fill();
    c.beginPath(); c.arc(30 * ui, -8 * ui, 20 * ui, 0, Math.PI * 2); c.fill();
    c.fillStyle = sp.dark;
    c.beginPath(); c.ellipse(22 * ui, -35 * ui, 7 * ui, 28 * ui, -0.18, 0, Math.PI * 2); c.fill();
    c.beginPath(); c.ellipse(38 * ui, -34 * ui, 7 * ui, 26 * ui, 0.14, 0, Math.PI * 2); c.fill();
  } else if (sp.id === 'otter') {
    c.fillStyle = sp.color;
    c.beginPath(); c.ellipse(0, 8 * ui, 54 * ui, 24 * ui, -0.1, 0, Math.PI * 2); c.fill();
    c.beginPath(); c.arc(42 * ui, -4 * ui, 18 * ui, 0, Math.PI * 2); c.fill();
    c.fillStyle = sp.dark;
    c.beginPath(); c.ellipse(-55 * ui, 14 * ui, 25 * ui, 9 * ui, 0.1, 0, Math.PI * 2); c.fill();
  } else if (sp.id === 'fox') {
    c.fillStyle = sp.color;
    c.beginPath(); c.ellipse(0, 10 * ui, 50 * ui, 25 * ui, 0, 0, Math.PI * 2); c.fill();
    c.beginPath(); c.moveTo(34 * ui, -4 * ui); c.lineTo(66 * ui, 7 * ui); c.lineTo(36 * ui, 20 * ui); c.closePath(); c.fill();
    c.beginPath(); c.arc(36 * ui, -11 * ui, 18 * ui, 0, Math.PI * 2); c.fill();
    c.fillStyle = sp.dark;
    c.beginPath(); c.moveTo(24 * ui, -25 * ui); c.lineTo(30 * ui, -50 * ui); c.lineTo(39 * ui, -24 * ui); c.closePath(); c.fill();
    c.beginPath(); c.moveTo(45 * ui, -24 * ui); c.lineTo(58 * ui, -47 * ui); c.lineTo(58 * ui, -16 * ui); c.closePath(); c.fill();
  } else if (sp.id === 'crane') {
    c.strokeStyle = sp.dark;
    c.beginPath(); c.moveTo(-6 * ui, 30 * ui); c.lineTo(-13 * ui, 65 * ui); c.moveTo(9 * ui, 30 * ui); c.lineTo(18 * ui, 65 * ui); c.stroke();
    c.fillStyle = sp.color;
    c.beginPath(); c.ellipse(-6 * ui, 8 * ui, 34 * ui, 24 * ui, -0.2, 0, Math.PI * 2); c.fill();
    c.strokeStyle = sp.color;
    c.lineWidth = Math.max(5, 8 * ui);
    c.beginPath(); c.moveTo(14 * ui, -4 * ui); c.quadraticCurveTo(33 * ui, -46 * ui, 56 * ui, -34 * ui); c.stroke();
    c.fillStyle = '#d66c4f';
    c.beginPath(); c.moveTo(58 * ui, -34 * ui); c.lineTo(82 * ui, -28 * ui); c.lineTo(58 * ui, -22 * ui); c.closePath(); c.fill();
  } else if (sp.id === 'tortoise') {
    c.fillStyle = sp.dark;
    c.beginPath(); c.ellipse(0, 16 * ui, 56 * ui, 25 * ui, 0, 0, Math.PI * 2); c.fill();
    c.fillStyle = sp.color;
    c.beginPath(); c.ellipse(0, 1 * ui, 46 * ui, 35 * ui, 0, 0, Math.PI * 2); c.fill();
    c.strokeStyle = 'rgba(20,38,22,0.42)';
    c.beginPath(); c.moveTo(-28 * ui, -7 * ui); c.lineTo(28 * ui, 24 * ui); c.moveTo(0, -33 * ui); c.lineTo(0, 34 * ui); c.stroke();
    c.fillStyle = sp.color;
    c.beginPath(); c.arc(53 * ui, 5 * ui, 16 * ui, 0, Math.PI * 2); c.fill();
  } else {
    c.fillStyle = sp.color;
    c.beginPath(); c.ellipse(0, 10 * ui, 50 * ui, 25 * ui, 0.05, 0, Math.PI * 2); c.fill();
    c.beginPath(); c.arc(38 * ui, -8 * ui, 20 * ui, 0, Math.PI * 2); c.fill();
    c.fillStyle = sp.dark;
    c.beginPath(); c.moveTo(25 * ui, -22 * ui); c.lineTo(27 * ui, -47 * ui); c.lineTo(40 * ui, -25 * ui); c.closePath(); c.fill();
    c.beginPath(); c.moveTo(47 * ui, -25 * ui); c.lineTo(58 * ui, -47 * ui); c.lineTo(59 * ui, -19 * ui); c.closePath(); c.fill();
    c.strokeStyle = sp.dark;
    c.beginPath(); c.arc(-42 * ui, 2 * ui, 18 * ui, -0.4, 1.5); c.stroke();
  }
  c.fillStyle = '#111611';
  c.beginPath(); c.arc(43 * ui, -10 * ui, 2.8 * ui, 0, Math.PI * 2); c.fill();
  if (activeMeaning === 'sleepy' || activeMeaning === 'cold') {
    c.strokeStyle = '#111611';
    c.beginPath(); c.moveTo(38 * ui, -9 * ui); c.lineTo(47 * ui, -9 * ui); c.stroke();
  }
  c.strokeStyle = meaning.color;
  c.globalAlpha = 0.75 + Math.sin(pulse * 6) * 0.10;
  c.beginPath(); c.arc(0, 4 * ui, (72 + 6 * (1 - pressure / Math.max(0.01, pressureMax))) * ui, 0, Math.PI * 2); c.stroke();
  c.globalAlpha = 1;
  c.restore();
}

function drawLensRing(c) {
  var p = animalCenter();
  var ui = scene.ui;
  var radius = Math.min(scene.w, scene.h) < 260 ? 88 * ui : 102 * ui;
  for (var i = 0; i < LENSES.length; i++) {
    var a0 = -Math.PI / 2 + i * Math.PI / 2 + 0.04;
    var a1 = a0 + Math.PI / 2 - 0.08;
    c.beginPath();
    c.arc(p.x, p.y, radius, a0, a1);
    c.strokeStyle = i === currentLens ? MEANINGS[activeMeaning].color : 'rgba(255,255,255,0.24)';
    c.lineWidth = i === currentLens ? Math.max(4, 5 * ui) : Math.max(2, 3 * ui);
    c.stroke();
    var mid = (a0 + a1) / 2;
    var lx = p.x + Math.cos(mid) * (radius + 18 * ui);
    var ly = p.y + Math.sin(mid) * (radius + 18 * ui);
    fitText(c, GF.t(LENSES[i]), lx, ly + 4 * ui, 78 * ui, fs(10), i === currentLens ? '#fff2b7' : '#c9d2c0', 'center', '800');
  }
}

function drawSignalPanel(c) {
  var r = uiRects.signal;
  var ui = scene.ui;
  var meaning = MEANINGS[activeMeaning] || MEANINGS.hungry;
  c.fillStyle = 'rgba(18, 24, 19, 0.84)';
  roundRect(c, r.x, r.y, r.w, r.h, 8 * ui);
  c.fill();
  c.strokeStyle = repeatPulse > 0 ? meaning.color : 'rgba(255,255,255,0.18)';
  c.lineWidth = Math.max(1, 2 * ui);
  c.stroke();

  var label = GF.t(lensKey()).toUpperCase();
  var clue = clueText(lensKey(), meaning);
  fitText(c, label, r.x + 15 * ui, r.y + 22 * ui, 88 * ui, fs(11), meaning.color, 'left', '850');
  fitText(c, clue, r.x + 15 * ui, r.y + 46 * ui, r.w - 30 * ui, fs(15), '#f6efd6', 'left', '850');

  var iconX = r.x + r.w - 42 * ui;
  var iconY = r.y + r.h / 2;
  drawLensIcon(c, lensKey(), iconX, iconY, 20 * ui, meaning);
}

function clueText(kind, meaning) {
  if (kind === 'call') return meaning.call;
  if (kind === 'posture') return meaning.posture;
  if (kind === 'tracks') return meaning.tracks;
  return meaning.need;
}

function drawLensIcon(c, kind, x, y, s, meaning) {
  c.save();
  c.translate(x, y);
  c.strokeStyle = meaning.color;
  c.fillStyle = meaning.color;
  c.lineWidth = Math.max(2, s * 0.12);
  if (kind === 'call') {
    for (var i = -2; i <= 2; i++) {
      c.beginPath();
      c.arc(i * s * 0.22, 0, s * (0.18 + Math.abs(i) * 0.07), -0.9, 0.9);
      c.stroke();
    }
  } else if (kind === 'posture') {
    c.beginPath(); c.arc(-s * 0.12, -s * 0.15, s * 0.20, 0, Math.PI * 2); c.fill();
    c.beginPath(); c.ellipse(0, s * 0.18, s * 0.45, s * 0.22, -0.25, 0, Math.PI * 2); c.stroke();
  } else if (kind === 'tracks') {
    for (var j = 0; j < 3; j++) {
      c.beginPath();
      c.ellipse(-s * 0.35 + j * s * 0.35, -s * 0.18 + j * s * 0.16, s * 0.16, s * 0.23, -0.5, 0, Math.PI * 2);
      c.fill();
    }
  } else {
    c.beginPath(); c.moveTo(0, -s * 0.55); c.lineTo(s * 0.46, s * 0.36); c.lineTo(-s * 0.46, s * 0.36); c.closePath(); c.stroke();
    c.beginPath(); c.arc(0, 0, s * 0.16, 0, Math.PI * 2); c.fill();
  }
  c.restore();
}

function drawPressure(c) {
  var ui = scene.ui;
  var w = Math.min(GF.W - 44 * ui, 260 * ui);
  var x = GF.cx - w / 2;
  var y = scene.y + 14 * ui;
  var pct = clamp(pressure / Math.max(0.01, pressureMax), 0, 1);
  c.fillStyle = 'rgba(9,12,10,0.52)';
  roundRect(c, x, y, w, 12 * ui, 6 * ui);
  c.fill();
  c.fillStyle = pct < 0.28 ? '#ff9b77' : pct < 0.55 ? '#f2cf64' : '#81d489';
  roundRect(c, x, y, w * pct, 12 * ui, 6 * ui);
  c.fill();
}

function drawNotebook(c) {
  var r = uiRects.notebook;
  var ui = scene.ui;
  c.fillStyle = 'rgba(255,255,255,0.07)';
  roundRect(c, r.x, r.y, r.w, r.h, 8 * ui);
  c.fill();
  fitText(c, GF.t('notebook'), r.x + 10 * ui, r.y + 23 * ui, 86 * ui, fs(11), '#d7dfc2', 'left', '800');
  var x = r.x + 92 * ui;
  var max = Math.min(notebook.length, GF.W < 440 ? 2 : 4);
  if (max === 0) {
    fitText(c, GF.t('press_space'), x, r.y + 23 * ui, r.w - 106 * ui, fs(10), '#aebba7', 'left', '650');
    return;
  }
  for (var i = 0; i < max; i++) {
    var n = notebook[i];
    var label = tMeaning(n.meaning);
    var w = Math.min(96 * ui, Math.max(58 * ui, c.measureText(label).width + 20 * ui));
    c.fillStyle = 'rgba(255,255,255,0.10)';
    roundRect(c, x, r.y + 7 * ui, w, 22 * ui, 7 * ui);
    c.fill();
    fitText(c, label, x + w / 2, r.y + 23 * ui, w - 10 * ui, fs(10), '#fff1bc', 'center', '800');
    x += w + 7 * ui;
    if (x > r.x + r.w - 52 * ui) break;
  }
}

function drawTiles(c) {
  var ui = scene.ui;
  for (var i = 0; i < uiRects.tiles.length; i++) {
    var r = uiRects.tiles[i];
    var id = options[i] || MEANING_IDS[i];
    var meaning = MEANINGS[id] || MEANINGS.hungry;
    var lit = answerFlash > 0 && id === activeMeaning;
    c.fillStyle = lit && answerFlashGood ? 'rgba(129,212,137,0.30)' : 'rgba(26,33,27,0.95)';
    roundRect(c, r.x, r.y, r.w, r.h, 8 * ui);
    c.fill();
    c.strokeStyle = lit ? meaning.color : 'rgba(255,255,255,0.16)';
    c.lineWidth = lit ? Math.max(2, 3 * ui) : Math.max(1, 2 * ui);
    c.stroke();
    c.fillStyle = meaning.color;
    c.beginPath();
    c.arc(r.x + 21 * ui, r.y + r.h / 2, 8 * ui, 0, Math.PI * 2);
    c.fill();
    fitText(c, String(i + 1) + '. ' + tMeaning(id), r.x + 38 * ui, r.y + r.h * 0.58, r.w - 48 * ui, fs(14), '#f5efd8', 'left', '850');
  }
}

function drawCoach(c) {
  if (tutorialDone || coachStep >= 99 || helpOpen || gs !== 'PLAYING') return;
  var key = coachStep === 0 ? 'coach_answer' : coachStep === 1 ? 'coach_lens' : coachStep === 2 ? 'coach_repeat' : 'coach_streak';
  var ui = scene.ui;
  var w = Math.min(GF.W - 26 * ui, 392 * ui);
  var x = GF.cx - w / 2;
  var y = scene.y + 42 * ui;
  c.fillStyle = 'rgba(9,13,10,0.74)';
  roundRect(c, x, y, w, 46 * ui, 8 * ui);
  c.fill();
  c.strokeStyle = 'rgba(245,215,118,0.50)';
  c.stroke();
  fitText(c, GF.t(key), GF.cx, y + 29 * ui, w - 24 * ui, fs(12), '#f7e7a6', 'center', '800');
}

function drawHelp(c) {
  if (!helpOpen) return;
  var ui = scene.ui;
  c.fillStyle = 'rgba(7,10,8,0.82)';
  c.fillRect(0, 0, GF.W, GF.H);
  var w = Math.min(GF.W - 28 * ui, 520 * ui);
  var x = (GF.W - w) / 2;
  var y = Math.max(18 * ui, GF.cy - 194 * ui);
  var entries = ['tut_goal', 'tut_controls', 'tut_win', 'tut_lose', 'tut_tip'];
  var size = fs(12);
  var rows = [];
  var total = 58 * ui;
  for (var i = 0; i < entries.length; i++) {
    var lines = wrapLines(c, GF.t(entries[i]), w - 32 * ui, size, '650');
    rows.push(lines);
    total += lines.length * (size + 4 * ui) + 11 * ui;
  }
  total += 52 * ui;
  if (y + total > GF.H - 12 * ui) y = Math.max(12 * ui, GF.H - total - 12 * ui);
  c.fillStyle = '#172018';
  roundRect(c, x, y, w, total, 10 * ui);
  c.fill();
  c.strokeStyle = 'rgba(255,255,255,0.20)';
  c.stroke();
  drawText(c, GF.t('help_title'), x + 16 * ui, y + 31 * ui, fs(18), '#fff0bf', 'left', '850');
  var yy = y + 60 * ui;
  for (var j = 0; j < rows.length; j++) {
    for (var k = 0; k < rows[j].length; k++) {
      drawText(c, rows[j][k], x + 16 * ui, yy, size, '#dce7cf', 'left', '650');
      yy += size + 4 * ui;
    }
    yy += 10 * ui;
  }
  uiRects.helpClose = { x: GF.cx - 70 * ui, y: y + total - 46 * ui, w: 140 * ui, h: 34 * ui };
  c.fillStyle = '#e8d278';
  roundRect(c, uiRects.helpClose.x, uiRects.helpClose.y, uiRects.helpClose.w, uiRects.helpClose.h, 8 * ui);
  c.fill();
  fitText(c, GF.t('close'), GF.cx, uiRects.helpClose.y + 23 * ui, uiRects.helpClose.w - 14 * ui, fs(13), '#182014', 'center', '850');
}

function drawCompleteBanner(c) {
  if (completeTimer <= 0 || gs !== 'PLAYING') return;
  var ui = scene.ui;
  var a = clamp(completeTimer / 2.2, 0, 1);
  var y = scene.y + scene.h * 0.27;
  c.fillStyle = 'rgba(11,15,11,' + String(0.76 * a) + ')';
  roundRect(c, GF.cx - 150 * ui, y - 34 * ui, 300 * ui, 68 * ui, 8 * ui);
  c.fill();
  fitText(c, GF.t('habitat_clear') + ' ' + String(habitat - 1), GF.cx, y + 7 * ui, 270 * ui, fs(20), '#ffe58f', 'center', '850');
}

function notebookText() {
  if (!notebook.length) return 'none';
  return notebook.slice(0, 4).map(function(n) {
    return tSpecies(SPECIES.filter(function(sp) { return sp.id === n.species; })[0] || activeSpecies) + ' ' + tMeaning(n.meaning);
  }).join(', ');
}

function drawGameOver(c) {
  if (gs !== 'GAMEOVER') return;
  var ui = scene.ui;
  c.fillStyle = 'rgba(8, 10, 8, 0.84)';
  c.fillRect(0, 0, GF.W, GF.H);
  drawText(c, GF.t('gameover'), GF.cx, GF.cy - 76 * ui, fs(25), '#ffdfbd', 'center', '850');
  fitText(c, GF.t(gameOverReason), GF.cx, GF.cy - 42 * ui, Math.min(GF.W - 30 * ui, 430 * ui), fs(14), '#f2bba9', 'center', '700');
  fitText(c, GF.t('score') + ' ' + String(score) + '  ' + GF.t('best') + ' ' + String(best), GF.cx, GF.cy - 10 * ui, Math.min(GF.W - 30 * ui, 430 * ui), fs(14), '#e4eed2', 'center', '750');
  fitText(c, GF.t('best_habitat') + ' ' + String(bestHabitat), GF.cx, GF.cy + 17 * ui, Math.min(GF.W - 30 * ui, 430 * ui), fs(12), '#d9d4bd', 'center', '700');
  fitText(c, GF.t('notebook') + ': ' + notebookText(), GF.cx, GF.cy + 44 * ui, Math.min(GF.W - 30 * ui, 480 * ui), fs(11), '#cedabf', 'center', '650');
  var r = uiRects.retry;
  c.fillStyle = '#e9d77a';
  roundRect(c, r.x, r.y, r.w, r.h, 8 * ui);
  c.fill();
  c.strokeStyle = 'rgba(255,255,255,0.28)';
  c.stroke();
  fitText(c, GF.t('retry'), GF.cx, r.y + 29 * ui, r.w - 12 * ui, fs(15), '#172014', 'center', '850');
}

function draw(c) {
  layout();
  c.clearRect(0, 0, GF.W, GF.H);
  drawBackground(c);
  drawPressure(c);
  drawLensRing(c);
  drawAnimal(c);
  drawSignalPanel(c);
  drawHUD(c);
  drawNotebook(c);
  drawTiles(c);
  drawCompleteBanner(c);
  drawCoach(c);
  drawHelp(c);
  drawGameOver(c);
}

function onPointerDown(e) {
  layout();
  pointer = ptrPos(e);
  pointer.t = Date.now();
  e.preventDefault();
}

function onPointerMove(e) {
  if (!pointer) return;
  var p = ptrPos(e);
  pointer.mx = p.x;
  pointer.my = p.y;
  e.preventDefault();
}

function onPointerUp(e) {
  if (!pointer) return;
  layout();
  var p = ptrPos(e);
  var down = pointer;
  pointer = null;
  var dx = p.x - down.x;
  var dy = p.y - down.y;

  if (hitRect(p, uiRects.mute)) {
    GF.toggleMute();
    GF.sfx('click');
    e.preventDefault();
    return;
  }
  if (hitRect(p, uiRects.help)) {
    helpOpen = !helpOpen;
    GF.sfx('click');
    e.preventDefault();
    return;
  }
  if (helpOpen) {
    if (hitRect(p, uiRects.helpClose)) helpOpen = false;
    else helpOpen = false;
    GF.sfx('click');
    e.preventDefault();
    return;
  }
  if (gs === 'GAMEOVER') {
    if (hitRect(p, uiRects.retry)) startGame();
    e.preventDefault();
    return;
  }
  if (Math.abs(dx) > 34 * scene.ui && Math.abs(dx) > Math.abs(dy) * 1.2) {
    rotateLens(dx > 0 ? 1 : -1);
    e.preventDefault();
    return;
  }
  for (var i = 0; i < uiRects.tiles.length; i++) {
    if (hitRect(p, uiRects.tiles[i])) {
      answer(options[i]);
      e.preventDefault();
      return;
    }
  }
  if (hitRect(p, uiRects.signal)) {
    repeatCall();
    e.preventDefault();
    return;
  }
  e.preventDefault();
}

function onKeyDown(e) {
  if (e.code === 'ArrowLeft') { rotateLens(-1); e.preventDefault(); return; }
  if (e.code === 'ArrowRight') { rotateLens(1); e.preventDefault(); return; }
  if (e.code === 'Space') { repeatCall(); e.preventDefault(); return; }
  if (e.code === 'KeyH') { helpOpen = !helpOpen; e.preventDefault(); return; }
  if (e.code === 'KeyR' && gs === 'GAMEOVER') { startGame(); e.preventDefault(); return; }
  if (e.code.indexOf('Digit') === 0) {
    var n = Number(e.code.replace('Digit', '')) - 1;
    if (n >= 0 && n < options.length) {
      answer(options[n]);
      e.preventDefault();
    }
  }
}

function botActions() {
  if (gs === 'GAMEOVER') return ['retry'];
  return ['answer_correct', 'answer_wrong', 'rotate_left', 'rotate_right', 'repeat', 'wait', 'setup_late', 'force_gameover'];
}

function botAct(action) {
  if (action === 'retry') { startGame({ suppressTutorial: true }); return true; }
  if (action === 'answer_correct') { answer(activeMeaning); return true; }
  if (action === 'answer_wrong') {
    var wrong = options.filter(function(id) { return id !== activeMeaning; })[0] || MEANING_IDS[0];
    answer(wrong);
    return true;
  }
  if (action === 'rotate_left') { rotateLens(-1); return true; }
  if (action === 'rotate_right') { rotateLens(1); return true; }
  if (action === 'repeat') { repeatCall(); return true; }
  if (action === 'wait') { window.advanceTime(1200); return true; }
  if (action === 'setup_late') { setupForScreenshot(6); return true; }
  if (action === 'force_gameover') { gameOver('reason_confusion'); return true; }
  return false;
}

function stateObject() {
  return {
    gs: gs,
    score: score,
    best: best,
    habitat: habitat,
    bestHabitat: bestHabitat,
    energy: Math.round(energy * 10) / 10,
    confusion: confusion,
    streak: streak,
    lessonsCleared: lessonsCleared,
    lessonTarget: lessonTarget,
    currentLens: lensKey(),
    activeMeaning: activeMeaning,
    activeSpecies: activeSpecies ? activeSpecies.id : 'hare',
    options: options.slice(0),
    pressure: Math.round(pressure * 10) / 10,
    notebook: notebook.map(function(n) { return n.species + ':' + n.meaning; })
  };
}

function renderText() {
  layout();
  return JSON.stringify({
    coordinateSystem: 'screen pixels, origin top-left, +x right, +y down',
    state: stateObject(),
    visible: {
      animal: { x: Math.round(animalCenter().x), y: Math.round(animalCenter().y), r: Math.round(74 * scene.ui) },
      signal: {
        lens: lensKey(),
        clue: clueText(lensKey(), MEANINGS[activeMeaning]),
        rect: rectSummary(uiRects.signal)
      },
      tiles: uiRects.tiles.map(function(r, i) {
        return { index: i + 1, meaning: options[i], label: tMeaning(options[i]), rect: rectSummary(r) };
      })
    }
  });
}

function rectSummary(r) {
  return { x: Math.round(r.x), y: Math.round(r.y), w: Math.round(r.w), h: Math.round(r.h) };
}

function setupForScreenshot(level) {
  screenshotMode = true;
  tutorialDone = true;
  coachStep = 99;
  helpOpen = false;
  gs = 'PLAYING';
  score = 560 + Math.max(1, Number(level) || 4) * 130;
  habitat = Math.max(1, Number(level) || 4);
  best = Math.max(best, score);
  bestHabitat = Math.max(bestHabitat, habitat);
  energy = START_ENERGY - 3;
  confusion = 1;
  streak = 4;
  lessonsCleared = Math.max(1, BASE_LESSON_TARGET - 2);
  lessonTarget = BASE_LESSON_TARGET + Math.floor((habitat - 1) / 2);
  notebook = [
    { species: 'hare', speciesKey: 'species_hare', meaning: 'hungry', habitat: 1 },
    { species: 'otter', speciesKey: 'species_otter', meaning: 'thirsty', habitat: 2 },
    { species: 'fox', speciesKey: 'species_fox', meaning: 'danger', habitat: 3 },
    { species: 'crane', speciesKey: 'species_crane', meaning: 'lost', habitat: 4 }
  ];
  rngSeed = 2330 + habitat;
  newLesson(level >= 5 ? 'playful' : 'danger');
  currentLens = level >= 4 ? 2 : 1;
  pressure = pressureMax * 0.62;
}

window._jumpLevel = function(n) { setupForScreenshot(Number(n) || 5); };
window._setupForScreenshot = function(level) { setupForScreenshot(Number(level) || 5); };
window.advanceTime = function(ms) {
  var total = Math.max(0, Number(ms) || 0);
  var step = 1 / 30;
  var count = Math.ceil(total / 1000 / step);
  for (var i = 0; i < count; i++) update(step);
  draw(GF.ctx);
  return stateObject();
};
window.__gfStep = window.advanceTime;
window.render_game_to_text = renderText;

GF.canvas.addEventListener('pointerdown', onPointerDown, { passive: false });
GF.canvas.addEventListener('pointermove', onPointerMove, { passive: false });
GF.canvas.addEventListener('pointerup', onPointerUp, { passive: false });
GF.canvas.addEventListener('pointercancel', onPointerUp, { passive: false });
document.addEventListener('keydown', onKeyDown);

GF.exposeState(stateObject);
GF.exposeBot(botActions, botAct);
GF.exposeReach(function() {
  layout();
  var items = [
    { id: 'help', x: uiRects.help.x, y: uiRects.help.y, w: uiRects.help.w, h: uiRects.help.h, pinned: true },
    { id: 'mute', x: uiRects.mute.x, y: uiRects.mute.y, w: uiRects.mute.w, h: uiRects.mute.h, pinned: true },
    { id: 'signal_repeat', x: uiRects.signal.x, y: uiRects.signal.y, w: uiRects.signal.w, h: uiRects.signal.h }
  ];
  for (var i = 0; i < uiRects.tiles.length; i++) {
    items.push({ id: 'answer_' + String(i + 1), x: uiRects.tiles[i].x, y: uiRects.tiles[i].y, w: uiRects.tiles[i].w, h: uiRects.tiles[i].h });
  }
  if (gs === 'GAMEOVER') items.push({ id: 'retry', x: uiRects.retry.x, y: uiRects.retry.y, w: uiRects.retry.w, h: uiRects.retry.h, pinned: true });
  if (helpOpen) items.push({ id: 'help_close', x: uiRects.helpClose.x, y: uiRects.helpClose.y, w: uiRects.helpClose.w, h: uiRects.helpClose.h, pinned: true });
  return { screen: helpOpen ? 'help' : gs, viewportW: GF.W, viewportH: GF.H, screenH: GF.H, scrollMaxY: 0, items: items };
});
GF.exposeTour([
  { name: 'play', go: function() { if (gs !== 'PLAYING') startGame({ suppressTutorial: true }); helpOpen = false; } },
  { name: 'help', go: function() { if (gs !== 'PLAYING') startGame({ suppressTutorial: true }); helpOpen = true; } },
  { name: 'gameover', go: function() { gameOver('reason_confusion'); helpOpen = false; } },
  { name: 'late', go: function() { setupForScreenshot(6); helpOpen = false; } }
]);

GF.init({
  designW: 440,
  designH: 760,
  strings: STRINGS,
  saveKey: 'animal_lingo',
  onReady: function() {
    GF.persist('animal_lingo_meta_v1', getMeta, applyMeta);
    GF.bgMusic({ file: 'audio/bg_track.mp3', preset: 'calm', muted: GF.muted });
    if (!started) {
      started = true;
      startGame({ suppressTutorial: !!(window.__GF_AUTOSTART && !window._silent) });
    }
  },
  onUpdate: update,
  onDraw: draw
});

})();
</script>
</body>
</html>
