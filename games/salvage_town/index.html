<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<title>Salvage Town</title>
<style>
  :root{
    --bg:#15110d; --panel:#241a12; --panel2:#2e2117; --line:#3d2c1d;
    --gold:#f4c560; --gold2:#caa244; --ink:#f3e7d4; --dim:#b59a78;
    --green:#7ec96b; --red:#d76b56; --spark:#7fd0ff; --good:#9be37a; --worker:#ff9d3c;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
  html,body{margin:0;height:100%;background:#000;font-family:-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink);overscroll-behavior:none;touch-action:manipulation}
  #wrap{position:fixed;inset:0;display:flex;justify-content:center;background:#000}
  #game{position:relative;width:100%;max-width:460px;height:100%;background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
  #hud{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line);z-index:5}
  .cur{display:flex;align-items:center;gap:6px;font-weight:800;font-size:15px}
  .cur .ic{width:18px;height:18px;border-radius:50%;display:inline-block}
  .ic.scrip{background:radial-gradient(circle at 35% 30%,#ffe49a,var(--gold2))}
  .ic.spark{background:radial-gradient(circle at 35% 30%,#cdeeff,var(--spark));box-shadow:0 0 7px var(--spark)}
  #ips{font-size:11px;color:var(--good);font-weight:700;text-align:center;line-height:1.1}
  #ips b{font-size:15px;display:block}
  #scene{display:block;width:100%;flex:1 1 auto;background:#1a130d}
  /* bottom bar */
  #bar{flex:0 0 auto;display:flex;gap:7px;padding:8px;background:var(--panel);border-top:1px solid var(--line)}
  .bbtn{flex:1;border:none;border-radius:11px;padding:9px 6px;font-weight:800;font-size:12px;color:#fff;display:flex;flex-direction:column;align-items:center;gap:2px;background:var(--panel2);border:1px solid var(--line)}
  .bbtn small{font-size:10px;font-weight:700;opacity:.92;color:var(--gold)}
  .bbtn.hire{background:linear-gradient(#43a062,#2f6f43);border:none}
  .bbtn.hire:disabled{background:#33271b;color:#7a6244}.bbtn.hire:disabled small{color:#7a6244}
  .bbtn.rally{background:linear-gradient(#e6913a,#c06f24);border:none}
  .bbtn.rally.on{background:linear-gradient(#7ec96b,#4f9a3e)}
  .bbtn.rally:disabled{filter:saturate(.5) brightness(.7)}
  .bbtn .bdg{position:absolute;top:-4px;right:-4px;background:var(--red);color:#fff;font-size:10px;border-radius:9px;padding:0 5px;font-weight:800}
  .bbtn{position:relative}
  /* popover + sheets */
  .pop{position:absolute;z-index:30;background:var(--panel2);border:1px solid var(--gold);border-radius:14px;padding:11px;width:248px;box-shadow:0 10px 36px #000c}
  .pop h3{margin:0 0 2px;font-size:15px;color:var(--gold)}
  .pop .meta{font-size:11px;color:var(--dim);margin-bottom:8px;line-height:1.4}
  .pop .ug{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:7px;margin-bottom:6px}
  .pop .ug .t{flex:1;min-width:0}
  .pop .ug .t b{font-size:13px}.pop .ug .t span{display:block;font-size:10px;color:var(--dim)}
  .pop .ug button{border:none;border-radius:8px;background:linear-gradient(#43a062,#2f6f43);color:#fff;font-weight:800;font-size:12px;padding:7px 9px;min-width:74px;text-align:center;line-height:1.1}
  .pop .ug button small{display:block;font-size:10px;opacity:.9}
  .pop .ug button:disabled{background:#33271b;color:#7a6244}
  .sheet{position:absolute;inset:0;background:#000a;display:flex;align-items:flex-end;z-index:40}
  .sheet .inner{background:var(--panel2);width:100%;max-height:74%;overflow-y:auto;border-radius:18px 18px 0 0;padding:14px;border-top:2px solid var(--gold)}
  .sheet h2{margin:2px 0 10px;color:var(--gold);font-size:17px;text-align:center}
  .prow{display:flex;align-items:center;gap:9px;background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:9px;margin-bottom:8px}
  .prow .pi{width:40px;height:40px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:#16110d;font-weight:900;font-size:18px}
  .prow .pm{flex:1;min-width:0}.prow .pm b{font-size:13px}.prow .pm span{display:block;font-size:11px;color:var(--dim)}
  .prow .pm .cur2{color:var(--spark);font-size:11px}
  .prow button{border:none;border-radius:9px;background:linear-gradient(#3aa7d6,#2b80aa);color:#fff;font-weight:800;font-size:12px;padding:8px 9px;min-width:78px}
  .prow button:disabled{background:#33271b;color:#7a6244}
  .closex{position:absolute;top:8px;right:12px;font-size:24px;color:var(--dim)}
  /* modal */
  .modal{position:absolute;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;z-index:50;padding:18px}
  .card{background:var(--panel2);border:1px solid var(--gold);border-radius:16px;padding:18px;max-width:320px;width:100%;text-align:center}
  .card h2{margin:0 0 6px;color:var(--gold);font-size:19px}
  .card p{margin:5px 0;font-size:13px}
  .card .big{font-size:24px;font-weight:900;color:var(--good);margin:8px 0}
  .cbtn{border:none;border-radius:11px;padding:11px;font-weight:800;font-size:14px;color:#fff;background:linear-gradient(#43a062,#2f6f43);width:100%;margin-top:8px}
  .cbtn.gold{background:linear-gradient(#f4c560,#caa244);color:#16110d}
  #toast{position:absolute;left:50%;top:14%;transform:translateX(-50%);background:#2e2117ee;border:1px solid var(--gold);color:var(--gold);font-weight:800;padding:9px 15px;border-radius:12px;font-size:13px;opacity:0;transition:opacity .25s;text-align:center;max-width:86%;pointer-events:none;z-index:60}
  #toast.show{opacity:1}
  #topbtns{position:absolute;top:52px;right:8px;display:flex;flex-direction:column;gap:6px;z-index:6}
  .mini{width:30px;height:30px;border-radius:8px;background:#241a12cc;border:1px solid var(--line);color:var(--gold);font-size:15px;display:flex;align-items:center;justify-content:center}
  #mult{position:absolute;top:50px;left:50%;transform:translateX(-50%);font-size:12px;font-weight:900;color:#16110d;background:var(--gold);border-radius:9px;padding:2px 9px;display:none;z-index:6;box-shadow:0 0 12px var(--gold)}
</style>
</head>
<body>
<div id="wrap"><div id="game">
  <div id="hud">
    <div class="cur"><span class="ic scrip"></span><span id="scrip">0</span></div>
    <div id="ips"><b id="ipsv">0</b>scrip / sec</div>
    <div class="cur"><span class="ic spark"></span><span id="spark">0</span></div>
  </div>
  <div id="mult"></div>
  <div id="topbtns">
    <div class="mini" id="muteBtn">&#9835;</div>
    <div class="mini" id="resetBtn">&#8635;</div>
  </div>
  <canvas id="scene"></canvas>
  <div id="bar">
    <button class="bbtn hire" id="hireBtn"><span>&#128101; Hire Hand</span><small id="hireCost">--</small></button>
    <button class="bbtn" id="charterBtn"><span>&#9733; Charter</span><small id="charterSub">perks</small><span class="bdg" id="charterBdg" style="display:none">!</span></button>
    <button class="bbtn rally" id="rallyBtn"><span>&#9889; Rally</span><small id="rallySub">x2 5m</small></button>
  </div>
  <div id="toast"></div>
</div></div>
<script>
"use strict";
//============================================================================
// SALVAGE TOWN — real-time service/management sim rebuilt to the Last Haven
// loop: drifters arrive & queue at stalls, your Hands carry goods to serve
// them for scrip; upgrade stalls, hire Hands, draw more drifters, expand.
// Economy curves + offline/perks/boost are the extracted model, retuned.
//============================================================================
const $=s=>document.querySelector(s), $$=s=>document.querySelectorAll(s);
const now=()=>Date.now();
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const SUF=["","k","M","B","T","aa","ab","ac","ad","ae","af"];
function fmt(n){ if(n<1000)return (n<10&&n%1!==0)?n.toFixed(1):Math.floor(n).toString(); let t=0; while(n>=1000&&t<SUF.length-1){n/=1000;t++;} return (n<10?n.toFixed(2):n<100?n.toFixed(1):Math.floor(n).toString())+SUF[t]; }
function fmtTime(s){s=Math.floor(s);if(s<60)return s+"s";if(s<3600)return Math.floor(s/60)+"m "+(s%60)+"s";return Math.floor(s/3600)+"h "+Math.floor(s%3600/60)+"m";}

// ---- STALLS (the service stations) ----------------------------------------
// value(lvl)=base*pm^(lvl-1)*2^stars per serve ; upgrade cost=upg*cm^(lvl-1)
const STALLS=[
  {id:"water", name:"Water Stall", c:"#6fb6d8", base:4,     pm:1.10,  upg:8,     cm:1.18, pt:1.5, cap:4, arr:26, at:0,     uc:0},
  {id:"fuel",  name:"Fuel Depot",  c:"#d76b56", base:14,    pm:1.11,  upg:75,    cm:1.20, pt:1.7, cap:4, arr:22, at:75,    uc:65},
  {id:"tools", name:"Tool Bench",  c:"#c7a24a", base:52,    pm:1.115, upg:680,   cm:1.22, pt:1.9, cap:5, arr:20, at:680,   uc:600},
  {id:"med",   name:"Med Stall",   c:"#e7e7e7", base:200,   pm:1.12,  upg:7200,  cm:1.24, pt:2.1, cap:5, arr:18, at:7.2e3, uc:6.4e3},
  {id:"ammo",  name:"Ammo Crate",  c:"#9aa0a8", base:820,   pm:1.125, upg:8.8e4, cm:1.26, pt:2.3, cap:6, arr:16, at:8.8e4, uc:7.8e4},
  {id:"gear",  name:"Gear Shop",   c:"#b07fd0", base:3500,  pm:1.13,  upg:1.15e6,cm:1.28, pt:2.5, cap:6, arr:15, at:1.15e6,uc:1e6},
  {id:"trade", name:"Trade Post",  c:"#8de0c0", base:1.7e4, pm:1.135, upg:1.6e7, cm:1.30, pt:2.7, cap:7, arr:14, at:1.6e7, uc:1.4e7}
];
const STAR_LEVELS=[10,25,50,100,175,300];

// ---- META perks (Charter, bought with Sparks) -----------------------------
const PERKS=[
  {id:"trade",name:"Trade Routes", desc:"+20% scrip per serve / lvl", c:"#f4c560",cost:30,cs:25,init:1.2, step:0.2, max:25,kind:"mul"},
  {id:"hands",name:"Quick Hands",  desc:"Hands move & serve faster",  c:"#ff9d3c",cost:40,cs:35,init:1.15,step:0.15,max:18,kind:"wspeed"},
  {id:"draw", name:"Big Draw",     desc:"+18% drifters arrive / lvl",  c:"#7ec96b",cost:35,cs:30,init:1.18,step:0.18,max:20,kind:"arr"},
  {id:"stash",name:"Deep Stash",   desc:"Bigger offline cap / lvl",    c:"#6fb6d8",cost:45,cs:40,init:1.5, step:0.5, max:20,kind:"offcap"},
  {id:"idle", name:"Night Crew",   desc:"Higher offline rate / lvl",   c:"#b07fd0",cost:60,cs:55,init:1.2, step:0.2, max:15,kind:"offrate"}
];
const OFFLINE_CAP=7200, OFFLINE_RATE=0.10, BOOST_ADD=300, BOOST_MAX=3600, BOOST_MULT=2, BOOST_CD=3, TIP_CHANCE=0.30;
const DRIP={ offline:120, charter:260, rally:200, fuel:75 };
const HIRE_BASE=55, HIRE_MUL=12, MAX_HANDS=6;
const PATIENCE=14;        // seconds a drifter waits before leaving
const MAXQ=6;             // max drifters queued per stall

// ---- STATE ----------------------------------------------------------------
const SAVE_KEY="salvageTown_sim_v1";
let S;
function fresh(){ return {
  scrip:12, spark:12, earned:0, lastSeen:now(), hands:1,
  st:STALLS.map((s,i)=>({lvl:i===0?1:0,stars:0,prod:0,stock:0,drift:0})),
  perk:Object.fromEntries(PERKS.map(p=>[p.id,0])),
  seen:{}, boostUntil:0, boostCdUntil:0, muted:false, tut:true
};}
function load(){ try{const r=JSON.parse(localStorage.getItem(SAVE_KEY)); if(r&&r.st){S=Object.assign(fresh(),r);
  S.perk=Object.assign(Object.fromEntries(PERKS.map(p=>[p.id,0])),r.perk||{});
  STALLS.forEach((s,i)=>{if(!S.st[i])S.st[i]={lvl:0,stars:0,prod:0,stock:0,drift:0}; S.st[i].stock=0;}); return;}}catch(e){} S=fresh(); }
function save(){ S.lastSeen=now(); try{localStorage.setItem(SAVE_KEY,JSON.stringify(S));}catch(e){} }

// ---- derived --------------------------------------------------------------
function perkVal(id){const p=PERKS.find(x=>x.id===id),l=S.perk[id]||0;return l<=0?1:p.init+p.step*(l-1);}
function stallValue(i){const d=STALLS[i],s=S.st[i];if(s.lvl<1)return 0;return d.base*Math.pow(d.pm,s.lvl-1)*Math.pow(2,s.stars);}
function servePay(i){return stallValue(i)*perkVal("trade")*(now()<S.boostUntil?BOOST_MULT:1);}
function prodTime(i){const d=STALLS[i],s=S.st[i];return d.pt/(1+0.08*s.prod);}
function stockCap(i){return STALLS[i].cap+ (S.st[i].stockExtra||0);}
function arrivalRate(i){const d=STALLS[i],s=S.st[i];return d.arr*1.8*(1+0.15*s.drift)*perkVal("draw");} // drifters/min
function workerSpeedMul(){return perkVal("hands");}
function upgCost(i){const d=STALLS[i],s=S.st[i];return s.lvl<1?d.uc:d.upg*Math.pow(d.cm,s.lvl-1);}
function prodCost(i){const d=STALLS[i],s=S.st[i];return (d.upg*0.6)*Math.pow(1.5,s.prod);}
function driftCost(i){const d=STALLS[i],s=S.st[i];return (d.upg*0.8)*Math.pow(1.7,s.drift);}
function hireCost(){return HIRE_BASE*Math.pow(HIRE_MUL,S.hands-1);}
function boostMul(){return now()<S.boostUntil?BOOST_MULT:1;}

// ---- SIM entities ---------------------------------------------------------
// lanes (one per unlocked stall), each with queue[] of drifters; workers[] global
let lanes=[];     // {i, customers:[{x,tx,patience,claimed,happy,leave}]}
let workers=[];   // {x,y,lane,cust,state,carry,t}
function syncLanes(){
  lanes = [];
  for(let i=0;i<STALLS.length;i++){ if(S.st[i].lvl>0){ lanes.push(laneFor(i)); } }
  // ensure workers exist = S.hands
  while(workers.length<S.hands) workers.push({x:120,y:0,lane:-1,cust:null,state:"idle",carry:null,t:0});
  workers.length=S.hands;
}
function laneFor(i){ let ex=lanes.find(l=>l.i===i); if(ex)return ex; return {i, customers:[]}; }

// ---- DRIP -----------------------------------------------------------------
function checkDrip(){
  for(const k in DRIP){ if(!S.seen[k]&&S.earned>=DRIP[k]){ S.seen[k]=true; onDrip(k); } }
  for(let i=0;i<STALLS.length;i++){ const key="see_"+STALLS[i].id; if(!S.seen[key]&&S.earned>=STALLS[i].at){ S.seen[key]=true; if(i>0)toast("New stall site: "+STALLS[i].name+" (tap the + to build)"); } }
}
function onDrip(k){ const m={offline:"Night Crew online — your town earns while you're away.",charter:"Town Charter unlocked — permanent upgrades!",rally:"Rally unlocked — tap it for a x2 surge.",fuel:""}[k];
  if(m)toast(m); if(k==="charter")$("#charterBdg").style.display=""; if(k==="rally")$("#rallyBtn").style.display=""; }

//============================================================================
// CANVAS SCENE — the readable service sim
//============================================================================
const cv=$("#scene"), cx=cv.getContext("2d"); let SW=0,SH=0,DPR=1;
function resize(){const r=cv.getBoundingClientRect();DPR=Math.min(2,devicePixelRatio||1);cv.width=r.width*DPR;cv.height=r.height*DPR;cx.setTransform(DPR,0,0,DPR,0,0);SW=r.width;SH=r.height;}
addEventListener("resize",resize);
// layout: vertical lanes. geometry helpers computed per frame from lane count.
function laneGeo(){ const n=Math.max(1,lanes.length); const skyH=Math.min(116,SH*0.15); const top=skyH+4; const h=clamp((SH-top-6)/n,120,168); return {top,h,n,skyH}; }
function laneY(idx){const g=laneGeo();return g.top+g.h*idx+g.h/2;}
const STALL_X=8, STALL_W=78, SERVE_X=104, Q0=128, QGAP=30;

function drawScene(t){
  cx.clearRect(0,0,SW,SH);
  const g=laneGeo();
  // backdrop: sky + horizon ruins + ground (fills the scene so it reads as a place)
  const skyH=g.skyH;
  let sky=cx.createLinearGradient(0,0,0,skyH);sky.addColorStop(0,"#3b2d1e");sky.addColorStop(1,"#4d3823");cx.fillStyle=sky;cx.fillRect(0,0,SW,skyH);
  cx.fillStyle="rgba(247,212,135,.20)";cx.beginPath();cx.arc(SW*.8,skyH*.52,28,0,6.283);cx.fill();
  cx.fillStyle="rgba(0,0,0,.26)";
  for(let k=0;k<8;k++){const bx=k*56+(k%2?12:0),bw=30+(k%3)*12,bh=12+(k%4)*15;cx.fillRect(bx,skyH-bh,bw,bh);}
  let gr=cx.createLinearGradient(0,skyH,0,SH);gr.addColorStop(0,"#241a12");gr.addColorStop(1,"#14100b");cx.fillStyle=gr;cx.fillRect(0,skyH,SW,SH-skyH);
  cx.strokeStyle="rgba(0,0,0,.35)";cx.beginPath();cx.moveTo(0,skyH+.5);cx.lineTo(SW,skyH+.5);cx.stroke();
  // foreground debris (so the dirt isn't empty)
  cx.fillStyle="rgba(0,0,0,.18)";
  const dbg=[[40,.93,16,5],[120,.97,10,3],[300,.95,20,6],[540,.92,14,4],[680,.96,12,4],[210,.9,9,3]];
  dbg.forEach(r=>{cx.beginPath();cx.ellipse(r[0],SH*r[1],r[2],r[3],0,0,6.283);cx.fill();});
  lanes.forEach((ln,idx)=>{
    const i=ln.i, s=S.st[i], d=STALLS[i], cy=laneY(idx), h=g.h;
    // lane band + shared floor line where drifters & hands meet
    cx.fillStyle=idx%2?"rgba(255,255,255,.02)":"rgba(255,255,255,.04)"; cx.fillRect(0,cy-h/2+1,SW,h-2);
    cx.strokeStyle="rgba(180,150,110,.10)"; cx.setLineDash([5,7]); cx.lineWidth=2; cx.beginPath(); cx.moveTo(SERVE_X+4,cy+16); cx.lineTo(SW,cy+16); cx.stroke(); cx.setLineDash([]); cx.lineWidth=1;
    // STALL
    const sw=84, sx=10, shgt=Math.min(h-34,68), sy=cy-shgt/2;
    cx.fillStyle=d.c; roundRect(sx,sy,sw,shgt,8); cx.fill();
    cx.fillStyle="rgba(255,255,255,.16)"; roundRect(sx,sy,sw,12,6); cx.fill();            // awning highlight
    cx.fillStyle="rgba(0,0,0,.22)"; cx.fillRect(sx,sy+shgt-8,sw,8);                        // counter shadow
    cx.fillStyle="#16110d"; cx.textAlign="left";
    cx.font="bold 19px sans-serif"; cx.fillText(d.name[0],sx+9,cy+3);
    cx.font="bold 10px sans-serif"; cx.fillText(d.name.split(" ")[0],sx+9,sy+shgt-7);
    cx.textAlign="right"; cx.font="bold 10px sans-serif"; cx.fillText("Lv"+s.lvl,sx+sw-7,sy+13);
    if(s.stars){ cx.fillText("★".repeat(s.stars),sx+sw-7,sy+25); }
    // production ring
    const ph=s.prodT||0; cx.lineWidth=3;
    cx.strokeStyle="rgba(0,0,0,.28)"; cx.beginPath(); cx.arc(sx+sw-16,sy+shgt-15,8,0,6.283); cx.stroke();
    cx.strokeStyle="#2b6f3f"; cx.beginPath(); cx.arc(sx+sw-16,sy+shgt-15,8,-1.57,-1.57+6.283*ph); cx.stroke(); cx.lineWidth=1;
    // STOCK shelf (goods ready, vertical, just right of the stall)
    const cap=stockCap(i), shelfX=sx+sw+8;
    for(let k=0;k<cap;k++){ const yy=cy+(cap/2-k-0.5)*9; cx.fillStyle=k<s.stock?"#ffe49a":"rgba(255,255,255,.10)"; roundRect(shelfX-3.5,yy-3.5,7,7,2); cx.fill(); }
    const waiting=ln.customers.filter(c=>!c.happy&&!c.leave).length;
    if(waiting>0&&s.stock===0){ cx.fillStyle="#d76b56"; cx.font="bold 10px sans-serif"; cx.textAlign="left"; cx.fillText("making…",shelfX+9,cy+4); }
    if(waiting>0){ cx.fillStyle="#e7d3ad"; cx.font="bold 11px sans-serif"; cx.textAlign="right"; cx.fillText(waiting+" waiting",SW-8,cy-h/2+15); }
    // DRIFTERS on the floor (y=cy)
    ln.customers.forEach(c=>{
      const x=c.x, y=cy + (c.happy?-18*c.hp:0);
      cx.globalAlpha=(c.leave||c.happy)?clamp(c.fade,0,1):1;
      cx.fillStyle="rgba(0,0,0,.25)"; cx.beginPath(); cx.ellipse(x,y+13,6,2.5,0,0,6.283); cx.fill();
      cx.fillStyle=c.happy?"#9be37a":(c.patience<4?"#d76b56":"#d8c8aa");
      cx.beginPath(); cx.arc(x,y-9,6,0,6.283); cx.fill();          // head
      roundRect(x-5,y-3,10,14,3); cx.fill();                        // body
      if(!c.happy&&!c.leave){
        cx.fillStyle="#fff"; roundRect(x-10,y-32,20,14,4); cx.fill();
        cx.beginPath(); cx.moveTo(x-3,y-19); cx.lineTo(x+3,y-19); cx.lineTo(x,y-15); cx.closePath(); cx.fill();
        cx.fillStyle=d.c; roundRect(x-5,y-29,10,8,2); cx.fill();    // wants this good
        cx.fillStyle="rgba(0,0,0,.45)"; cx.fillRect(x-10,y+14,20,3.5);
        cx.fillStyle=c.patience<4?"#d76b56":"#7ec96b"; cx.fillRect(x-10,y+14,20*clamp(c.patience/PATIENCE,0,1),3.5);
      }
      cx.globalAlpha=1;
    });
  });
  // WORKERS (Hands) — drawn on the same floor
  workers.forEach(w=>{
    if(w.lane<0) return; const cy=laneIdxY(w.lane), wy=w.y||cy;
    cx.fillStyle="rgba(0,0,0,.28)"; cx.beginPath(); cx.ellipse(w.x,wy+13,7,3,0,0,6.283); cx.fill();
    cx.fillStyle="#ff9d3c"; cx.beginPath(); cx.arc(w.x,wy-7,7,0,6.283); cx.fill();   // head
    roundRect(w.x-6,wy-1,12,15,3); cx.fill();                                        // body
    cx.fillStyle="#6b3d12"; roundRect(w.x-7,wy-14,14,4,2); cx.fill();                // hat
    if(w.carry!=null){ cx.fillStyle=STALLS[w.carry].c; roundRect(w.x+5,wy-13,11,11,2); cx.fill(); cx.strokeStyle="rgba(0,0,0,.3)"; cx.stroke(); }
  });
  // coin pops
  for(let k=pops.length-1;k>=0;k--){const p=pops[k];p.t+=0.018;p.y-=0.8;cx.globalAlpha=clamp(1.1-p.t,0,1);cx.fillStyle=p.spark?"#7fd0ff":"#ffe49a";cx.font="bold 14px sans-serif";cx.textAlign="center";cx.fillText(p.txt,p.x,p.y);cx.globalAlpha=1;if(p.t>1.1)pops.splice(k,1);}
}
function laneIdxY(i){ const idx=lanes.findIndex(l=>l.i===i); return idx<0? SH-12 : laneY(idx); }
function roundRect(x,y,w,h,r){cx.beginPath();cx.moveTo(x+r,y);cx.arcTo(x+w,y,x+w,y+h,r);cx.arcTo(x+w,y+h,x,y+h,r);cx.arcTo(x,y+h,x,y,r);cx.arcTo(x,y,x+w,y,r);cx.closePath();}
let pops=[];
function pop(x,y,txt,spark){pops.push({x,y,txt,spark,t:0});}

//============================================================================
// SIM UPDATE
//============================================================================
let ipsEMA=0;
function update(dt){
  let earnedFrame=0;
  // production + spawning per lane
  lanes.forEach((ln,idx)=>{
    const i=ln.i,s=S.st[i];
    // production
    s.prodT=(s.prodT||0)+dt/prodTime(i);
    if(s.prodT>=1){ s.prodT=0; if(s.stock<stockCap(i))s.stock++; }
    // spawning drifters
    s.spawnT=(s.spawnT||0)+dt;
    const interval=60/arrivalRate(i);
    if(s.spawnT>=interval && ln.customers.filter(c=>!c.leave).length<MAXQ){ s.spawnT=0; ln.customers.push({x:SW+10,tx:0,patience:PATIENCE,claimed:false,happy:false,leave:false,hp:0,fade:1}); }
    // position queue + patience
    let slot=0;
    ln.customers.forEach(c=>{
      if(c.happy){ c.hp=Math.min(1,c.hp+dt*2); c.x=lerp(c.x,c.x-40,dt*3); c.fade-=dt*1.2; return; }
      if(c.leave){ c.fade-=dt*1.5; c.x=lerp(c.x,SW+20,dt*2); return; }
      c.tx=Q0+slot*QGAP; slot++;
      c.x=lerp(c.x,c.tx,dt*4);
      if(!c.claimed){ c.patience-=dt; if(c.patience<=0){ c.leave=true; } }
    });
    ln.customers=ln.customers.filter(c=>c.fade>-0.1);
  });
  // workers
  workers.forEach(w=>{
    const speed=115*workerSpeedMul();
    if(w.state==="idle"){
      w.cust=null; w.carry=null;
      const task=pickTask(w); if(task){ w.lane=task.i; w.cust=task.c; task.c.claimed=true; w.state="toStall"; }
      else { // wait in-lane by the counter (visible, not parked off-screen)
        if(w.lane<0||!lanes.find(l=>l.i===w.lane)) w.lane=lanes.length?lanes[0].i:-1;
        if(w.lane>=0){ const cy=laneIdxY(w.lane); w.y=lerp(w.y||cy,cy,clamp(dt*4,0,1)); w.x=lerp(w.x||SERVE_X,SERVE_X-12,clamp(dt*3,0,1)); }
      }
    }
    if(w.state==="toStall"){
      const cy=laneIdxY(w.lane); w.y=cy; w.x=approach(w.x,SERVE_X-2,speed,dt);
      if(Math.abs(w.x-(SERVE_X-2))<2){ const s=S.st[w.lane];
        if(s.stock>0){ s.stock--; w.carry=w.lane; w.state="toCust"; }
        else if(!w.cust||w.cust.leave||w.cust.happy){ w.state="idle"; }
        // else wait for stock
      }
    } else if(w.state==="toCust"){
      const c=w.cust; if(!c||c.leave){ if(w.carry!=null){S.st[w.lane].stock=Math.min(stockCap(w.lane),S.st[w.lane].stock+1);} w.carry=null; w.state="idle"; return; }
      const cy=laneIdxY(w.lane); w.y=cy; w.x=approach(w.x,c.x,speed,dt);
      if(Math.abs(w.x-c.x)<6){ // serve
        const pay=servePay(w.lane); S.scrip+=pay; S.earned+=pay; earnedFrame+=pay;
        c.happy=true; c.hp=0; w.carry=null; pop(c.x,laneIdxY(w.lane)-22,"+"+fmt(pay));
        // tip
        if(S.seen.fuel&&Math.random()<TIP_CHANCE){ const tip=pay*0.25; S.scrip+=tip; S.earned+=tip; pop(c.x+10,laneIdxY(w.lane)-30,"+"+fmt(tip),false); }
        blip(520+Math.min(S.st[w.lane].lvl,40)*4,.04); w.state="idle";
      }
    }
  });
  // economy meta
  checkDrip();
  // ips EMA
  const inst=earnedFrame/Math.max(dt,0.001);
  ipsEMA=ipsEMA+(inst-ipsEMA)*clamp(dt*0.6,0,1);
}
function approach(x,tx,speed,dt){const d=tx-x,step=speed*dt;if(Math.abs(d)<=step)return tx;return x+Math.sign(d)*step;}
function pickTask(w){
  // serve front un-claimed drifter in the lane with the longest waiting queue that has/will have stock
  let best=null,bestN=-1;
  lanes.forEach(ln=>{ const s=S.st[ln.i];
    const front=ln.customers.find(c=>!c.happy&&!c.leave&&!c.claimed);
    if(!front) return;
    const waiting=ln.customers.filter(c=>!c.happy&&!c.leave).length;
    // prefer lanes with stock ready; still allow if producing soon
    const score=waiting + (s.stock>0?100:0);
    if(score>bestN){ bestN=score; best={i:ln.i,c:front}; }
  });
  return best;
}

cv.addEventListener("click",e=>{

  // which lane row?
  const g=laneGeo();
  // tap on a stall block (or its build slot)
  for(let idx=0; idx<=lanes.length; idx++){
    const cy=g.top+g.h*idx+g.h/2;

      if(idx<lanes.length){ openPopover(lanes[idx].i,e); return; }

    if(my>cy-g.h/2&&my<cy+g.h/2){ tryBuild(nb); return; } }

  popEl.querySelector("#pmeta").innerHTML=`Lv ${s.lvl}${s.stars?" "+"★".repeat(s.stars):""} &middot; ${fmt(servePay(i))}/serve<br>stock ${s.stock}/${stockCap(i)} &middot; ${arrivalRate(i).toFixed(0)} drifters/min &middot; next ★ Lv ${nextStar(s.lvl)||"max"}`;
  const set=(a,cost)=>{const b=popEl.querySelector(`button[data-a=${a}]`);b.innerHTML=(a==="upg"?"Up":a==="prod"?"Speed":"Draw")+"<small>"+fmt(cost)+"</small>";b.disabled=S.scrip<cost;};

function offlineEarnings(){
  const cap=OFFLINE_CAP*perkVal("stash"); const away=clamp((now()-S.lastSeen)/1000,0,cap);
  if(!S.seen.offline||away<30)return;
  // estimate live throughput from current setup
  let rate=estimateIPS()*OFFLINE_RATE*perkVal("idle"); const gain=rate*away;
  if(gain<1)return;
  const m=document.createElement("div");m.className="modal";
  m.innerHTML=`<div class="card"><h2>While you were away</h2><p>Your Night Crew kept the stalls running for ${fmtTime(away)}.</p><div class="big">+${fmt(gain)} scrip</div><p style="color:var(--dim);font-size:11px">offline earns ${Math.round(OFFLINE_RATE*perkVal("idle")*100)}% of live throughput, capped at ${fmtTime(cap)}</p><button class="cbtn gold" id="oc">Collect</button><button class="cbtn" id="oc2">Collect x2 (Rally)</button></div>`;
  document.querySelector("#game").appendChild(m);
  m.querySelector("#oc").onclick=()=>{S.scrip+=gain;S.earned+=gain;blip(720,.12);m.remove();};
  m.querySelector("#oc2").onclick=()=>{const gg=gain*2;S.scrip+=gg;S.earned+=gg;toast("Doubled!");blip(940,.14);S.boostUntil=Math.max(S.boostUntil,now())+60000;m.remove();};
}
function estimateIPS(){ // throughput = min(production, serving, arrival) * value, summed
  let total=0;
  for(let i=0;i<STALLS.length;i++){ const s=S.st[i]; if(s.lvl<1)continue;
    const prodPerSec=1/prodTime(i); const arrPerSec=arrivalRate(i)/60;
    const servePerSec=Math.min(prodPerSec,arrPerSec); total+=servePerSec*stallValue(i)*perkVal("trade"); }
  // workers cap total serves: each worker ~ 1 serve / (travel+serve ~1.1s) * speed
  const workerCap=S.hands*(1/1.1)*workerSpeedMul();
  // approximate: if total implied serves/sec exceeds worker capacity, scale down by avg value
  return total; // simplified estimate for offline
}
