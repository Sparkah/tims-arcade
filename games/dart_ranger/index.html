var START_DARTS = 14;
var MAX_STRESS = 100;
var STRESS_MISS = 12;
var STRESS_BAD_DOSE = 18;
var STRESS_ZONE_ESCAPE = 10;
var BASE_WIND = 42;
var SAFE_ZONE_RADIUS = 70;
var DART_SPEED = 680;
var CAPTURE_RADIUS = 20;
var SHIFT_WIN_TARGET = 6;
var WORLD_W = 800;
var WORLD_H = 600;
var GAME_KEY = 'dart_ranger';

var DOSES = [
  { key: 'low', color: '#9de685' },
  { key: 'med', color: '#f1d06b' },
  { key: 'high', color: '#f08b7e' }
];
var SPECIES = {
  impala: { key: 'animal_impala', radius: 14, dose: 0, score: 90, speed: 108, color: '#c99a58', unlock: 1 },
  zebra:  { key: 'animal_zebra', radius: 18, dose: 1, score: 135, speed: 76, color: '#e7e7db', unlock: 2 },
  rhino:  { key: 'animal_rhino', radius: 23, dose: 2, score: 190, speed: 52, color: '#8fa099', unlock: 4 }
};

var gs = 'BOOT';
var score = 0;
var best = 0;
var shift = 1;
var darts = START_DARTS;
var stress = 0;
var captures = 0;
var quotaTarget = 3;
var doseIndex = 1;
var animals = [];
var dartShots = [];
var safeZones = [];
var cards = [];
var wind = { x: 0, target: 0, timer: 0, gust: 0 };
var aim = { x: 400, y: 270 };
var ranger = { x: 400, y: 558 };
var fieldLog = { impala: 0, zebra: 0, rhino: 0 };
var runLog = { impala: 0, zebra: 0, rhino: 0 };
var spawnTimer = 0;
var shotCooldown = 0;
var gameOverReason = 'reason_darts';
var helpOpen = false;
var pointerAiming = false;
var tutorialDone = false;
var coachActive = false;
var coachStep = 0;
var wonExpertReady = false;
var persistReady = false;
var screenshotMode = false;
var ui = 1;
var scene = { x: 0, y: 0, w: 0, h: 0, top: 0, bottom: 0 };
var uiRects = {
  help: null,
  mute: null,
  retry: null,
  continue: null,
  helpClose: null,
  doses: []
};

function clamp(v, lo, hi) { return GF.clamp(v, lo, hi); }
function rnd(a, b) { return a + Math.random() * (b - a); }
function sign(v) { return v < 0 ? -1 : 1; }
function dist(a, b, c, d) { var x = a - c, y = b - d; return Math.sqrt(x * x + y * y); }
function pointSegmentDist(px, py, ax, ay, bx, by) {
  var vx = bx - ax, vy = by - ay;
  var wx = px - ax, wy = py - ay;
  var len2 = vx * vx + vy * vy;
  var t = len2 > 0 ? clamp((wx * vx + wy * vy) / len2, 0, 1) : 0;
  var cx = ax + vx * t, cy = ay + vy * t;
  return dist(px, py, cx, cy);
}

function layout() {
  ui = clamp(Math.min(GF.W / 820, GF.H / 620), 0.72, 1.35);
  var narrow = GF.W < 520;
  scene.top = Math.round((narrow ? 126 : 96) * ui);
  scene.bottom = Math.round((narrow ? 112 : 94) * ui);
  scene.x = 0;
  scene.y = scene.top;
  scene.w = GF.W;
  scene.h = Math.max(180, GF.H - scene.top - scene.bottom);
  uiRects.help = { x: GF.W - 44 * ui, y: 10 * ui, w: 32 * ui, h: 32 * ui };
  uiRects.mute = { x: GF.W - 82 * ui, y: 10 * ui, w: 32 * ui, h: 32 * ui };
  uiRects.retry = { x: GF.cx - 78 * ui, y: GF.cy + 84 * ui, w: 156 * ui, h: 44 * ui };
  uiRects.continue = { x: GF.cx - 96 * ui, y: GF.cy + 86 * ui, w: 192 * ui, h: 46 * ui };
  var doseY = GF.H - scene.bottom + 42 * ui;
  var gap = 7 * ui;
  var totalW = Math.min(GF.W - 22 * ui, 292 * ui);
  var dw = (totalW - gap * 2) / 3;
  var startX = (GF.W - totalW) / 2;
  uiRects.doses = [
    { x: startX, y: doseY, w: dw, h: 38 * ui },
    { x: startX + dw + gap, y: doseY, w: dw, h: 38 * ui },
    { x: startX + (dw + gap) * 2, y: doseY, w: dw, h: 38 * ui }
  ];
}

function worldToScreen(x, y) {
  return {
    x: scene.x + (x / WORLD_W) * scene.w,
    y: scene.y + (y / WORLD_H) * scene.h
  };
}

function screenToWorld(x, y) {
  return {
    x: clamp(((x - scene.x) / Math.max(1, scene.w)) * WORLD_W, 20, WORLD_W - 20),
    y: clamp(((y - scene.y) / Math.max(1, scene.h)) * WORLD_H, 30, WORLD_H - 26)
  };
}

function worldScale() {
  return Math.min(scene.w / WORLD_W, scene.h / WORLD_H);
}

function font(size, weight) {
  return String(weight || 700) + ' ' + Math.round(size) + 'px system-ui, -apple-system, Segoe UI, sans-serif';
}

function drawText(c, text, x, y, size, color, align, weight) {
  c.font = font(size, weight);
  c.textAlign = align || 'left';
  c.textBaseline = 'middle';
  c.fillStyle = color;
  c.fillText(text, x, y);
}

function fitText(c, text, x, y, maxW, size, color, align, weight) {
  var s = size;
  c.font = font(s, weight);
  while (s > 9 && c.measureText(text).width > maxW) {
    s -= 1;
    c.font = font(s, weight);
  }
  drawText(c, text, x, y, s, color, align, weight);
}

function wrapLines(c, text, maxW, size, weight) {
  c.font = font(size, weight);
  var words = String(text).split(/\s+/);
  var lines = [];
  var line = '';
  for (var i = 0; i < words.length; i++) {
    var test = line ? line + ' ' + words[i] : words[i];
    if (c.measureText(test).width > maxW && line) {
      lines.push(line);
      line = words[i];
    } else {
      line = test;
    }
  }
  if (line) lines.push(line);
  return lines;
}

function rectHit(r, x, y) {
  return r && x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h;
}

function roundRect(c, x, y, w, h, r) {
  GF.rr(c, x, y, w, h, r);
}

function saveGame() {
  if (persistReady) GF.saveRun();
}

function getSaveState() {
  return {
    best: best,
    fieldLog: fieldLog,
    tutorialDone: tutorialDone,
    run: {
      gs: gs,
      score: score,
      shift: shift,
      darts: darts,
      stress: stress,
      captures: captures,
      quotaTarget: quotaTarget,
      doseIndex: doseIndex,
      runLog: runLog
    }
  };
}

function applySaveState(s) {
  if (!s) return;
  best = Number(s.best) || 0;
  fieldLog = normalizeLog(s.fieldLog);
  tutorialDone = !!s.tutorialDone;
  var r = s.run || {};
  if (r.gs === 'PLAYING' && Number(r.shift) > 0) {
    score = Number(r.score) || 0;
    shift = Math.max(1, Number(r.shift) || 1);
    darts = clamp(Number(r.darts) || START_DARTS, 0, 99);
    stress = clamp(Number(r.stress) || 0, 0, MAX_STRESS);
    captures = clamp(Number(r.captures) || 0, 0, 99);
    quotaTarget = Math.max(1, Number(r.quotaTarget) || quotaForShift(shift));
    doseIndex = clamp(Number(r.doseIndex) || 0, 0, 2);
    runLog = normalizeLog(r.runLog);
    setupShift(shift, true);
    gs = 'PLAYING';
  }
}

function normalizeLog(src) {
  src = src || {};
  return {
    impala: Number(src.impala) || 0,
    zebra: Number(src.zebra) || 0,
    rhino: Number(src.rhino) || 0
  };
}

function quotaForShift(n) {
  return Math.min(7, 2 + Math.ceil(n * 0.65));
}

function startRun(expertShift) {
  gs = 'PLAYING';
  score = 0;
  stress = 0;
  shift = expertShift || 1;
  doseIndex = 1;
  runLog = { impala: 0, zebra: 0, rhino: 0 };
  helpOpen = false;
  wonExpertReady = false;
  screenshotMode = false;
  coachActive = !tutorialDone;
  coachStep = coachActive ? 0 : 99;
  setupShift(shift, false);
  GF.gameStarted();
  saveGame();
}

function setupShift(n, keepCounters) {
  shift = Math.max(1, n);
  quotaTarget = quotaForShift(shift);
  captures = keepCounters ? captures : 0;
  darts = keepCounters ? darts : START_DARTS + Math.min(4, Math.floor(shift / 2));
  animals = [];
  dartShots = [];
  cards = [];
  spawnTimer = 0.35;
  shotCooldown = 0;
  wind.x = rnd(-BASE_WIND, BASE_WIND) * (0.35 + shift * 0.08);
  wind.target = wind.x;
  wind.timer = 2.5;
  resetSafeZones();
  if (coachActive && !keepCounters) {
    doseIndex = 1;
    animals.push(makeAnimal('impala', safeZones[0].x - 42, safeZones[0].y, 1, true));
  } else {
    spawnAnimal();
  }
}

function resetSafeZones() {
  safeZones = [];
  if (shift >= 5) {
    safeZones.push({ x: 250, y: 280, r: SAFE_ZONE_RADIUS });
    safeZones.push({ x: 560, y: 344, r: SAFE_ZONE_RADIUS });
  } else if (shift >= 3) {
    safeZones.push({ x: 540, y: 310, r: SAFE_ZONE_RADIUS });
  } else {
    safeZones.push({ x: 330, y: 300, r: SAFE_ZONE_RADIUS });
  }
}

function availableSpecies() {
  var list = ['impala'];
  if (shift >= 2) list.push('zebra');
  if (shift >= 4) list.push('rhino');
  return list;
}

function pickSpecies() {
  var list = availableSpecies();
  if (shift >= 4 && Math.random() < 0.25) return 'rhino';
  if (shift >= 2 && Math.random() < 0.42) return 'zebra';
  return list[Math.floor(Math.random() * list.length)] || 'impala';
}

function makeAnimal(kind, x, y, dir, tutorial) {
  var sp = SPECIES[kind] || SPECIES.impala;
  return {
    kind: kind,
    x: x,
    y: y,
    dir: dir,
    vx: tutorial ? 0 : dir * sp.speed * rnd(0.88, 1.14) * (1 + Math.min(0.45, shift * 0.035)),
    wobble: rnd(0, Math.PI * 2),
    age: 0,
    radius: sp.radius,
    targetDose: sp.dose,
    tutorial: !!tutorial,
    paused: 0
  };
}

function spawnAnimal() {
  var kind = pickSpecies();
  var zone = safeZones[Math.floor(Math.random() * safeZones.length)] || { x: 400, y: 300 };
  var dir = Math.random() < 0.5 ? 1 : -1;
  var x = dir > 0 ? -40 : WORLD_W + 40;
  var y = clamp(zone.y + rnd(-74, 74), 115, 455);
  animals.push(makeAnimal(kind, x, y, dir, false));
}

function update(dt) {
  GF.juice.update(dt);
  var gdt = dt * GF.juice.timeScale;
  if (gdt <= 0) return;
  layout();
  updateKeyboardAim(gdt);
  updateCards(gdt);
  if (gs !== 'PLAYING' || helpOpen) return;
  shotCooldown = Math.max(0, shotCooldown - gdt);
  updateWind(gdt);
  updateAnimals(gdt);
  updateDarts(gdt);
  updateSpawns(gdt);
  if (darts <= 0 && dartShots.length === 0 && captures < quotaTarget) {
    endGame('reason_darts');
  }
}

function updateKeyboardAim(dt) {
  if (gs !== 'PLAYING') return;
  var speed = 260 * dt;
  var moved = false;
  if (GF.keys.ArrowLeft || GF.keys.KeyA) { aim.x -= speed; moved = true; }
  if (GF.keys.ArrowRight || GF.keys.KeyD) { aim.x += speed; moved = true; }
  if (GF.keys.ArrowUp || GF.keys.KeyW) { aim.y -= speed; moved = true; }
  if (GF.keys.ArrowDown || GF.keys.KeyS) { aim.y += speed; moved = true; }
  if (moved) {
    aim.x = clamp(aim.x, 20, WORLD_W - 20);
    aim.y = clamp(aim.y, 40, WORLD_H - 38);
    advanceCoach(0);
  }
}

function updateWind(dt) {
  wind.timer -= dt;
  if (wind.timer <= 0) {
    var cap = BASE_WIND * (0.6 + Math.min(1.6, shift * 0.16));
    wind.target = rnd(-cap, cap);
    wind.timer = rnd(2.4, 4.2);
  }
  wind.gust += dt * (shift >= 3 ? 2.1 : 0.8);
  var gust = shift >= 3 ? Math.sin(wind.gust) * BASE_WIND * 0.26 : 0;
  wind.x = GF.lerp(wind.x, wind.target + gust, 0.035);
}

function updateAnimals(dt) {
  for (var i = animals.length - 1; i >= 0; i--) {
    var a = animals[i];
    a.age += dt;
    if (a.kind === 'zebra' && shift >= 2 && a.paused <= 0 && Math.random() < dt * 0.24) a.paused = rnd(0.25, 0.65);
    if (a.paused > 0) {
      a.paused -= dt;
    } else {
      a.x += a.vx * dt;
      a.y += Math.sin(a.age * 2.2 + a.wobble) * 10 * dt;
    }
    if (!a.tutorial && (a.x < -72 || a.x > WORLD_W + 72)) {
      animals.splice(i, 1);
      if (!coachActive) addStress(STRESS_ZONE_ESCAPE, 'result_zone', a.x, a.y);
    }
  }
}

function updateDarts(dt) {
  for (var i = dartShots.length - 1; i >= 0; i--) {
    var d = dartShots[i];
    d.age += dt;
    d.prevX = d.x;
    d.prevY = d.y;
    d.vx += wind.x * 0.48 * dt;
    d.x += d.vx * dt;
    d.y += d.vy * dt;
    d.trail.push({ x: d.x, y: d.y, age: d.age });
    if (d.trail.length > 10) d.trail.shift();
    var hitIndex = findAnimalHit(d);
    if (hitIndex >= 0) {
      resolveHit(d, animals[hitIndex]);
      animals.splice(hitIndex, 1);
      dartShots.splice(i, 1);
      continue;
    }
    if (d.age > 1.55 || d.x < -60 || d.x > WORLD_W + 60 || d.y < -60 || d.y > WORLD_H + 70) {
      dartShots.splice(i, 1);
      addStress(STRESS_MISS, 'result_miss', d.x, d.y);
      addCard('result_miss', null, -STRESS_MISS);
      GF.sfx('error');
    }
  }
}

function updateSpawns(dt) {
  if (coachActive && coachStep < 3) return;
  spawnTimer -= dt;
  var limit = shift >= 6 ? 5 : shift >= 3 ? 4 : 3;
  if (spawnTimer <= 0 && animals.length < limit) {
    spawnAnimal();
    spawnTimer = Math.max(0.75, 2.0 - shift * 0.11 + rnd(-0.22, 0.28));
  }
}

function updateCards(dt) {
  for (var i = cards.length - 1; i >= 0; i--) {
    cards[i].age += dt;
    if (cards[i].age > 3.8) cards.splice(i, 1);
  }
}

function findAnimalHit(d) {
  for (var i = 0; i < animals.length; i++) {
    var a = animals[i];
    var hitR = a.radius + CAPTURE_RADIUS * 0.72;
    if (dist(d.x, d.y, a.x, a.y) <= hitR) return i;
    if (isFinite(d.prevX) && pointSegmentDist(a.x, a.y, d.prevX, d.prevY, d.x, d.y) <= hitR) return i;
  }
  return -1;
}

function animalInSafeZone(a) {
  for (var i = 0; i < safeZones.length; i++) {
    var z = safeZones[i];
    if (dist(a.x, a.y, z.x, z.y) <= z.r) return true;
  }
  return false;
}

function resolveHit(dart, animal) {
  var sp = SPECIES[animal.kind] || SPECIES.impala;
  var inZone = animalInSafeZone(animal);
  var doseGood = doseIndex === sp.dose;
  var p = worldToScreen(animal.x, animal.y);
  if (inZone && doseGood) {
    captures += 1;
    var pts = sp.score + Math.max(0, Math.round((MAX_STRESS - stress) * 0.35)) + Math.round(Math.abs(wind.x) * 0.18);
    score += pts;
    fieldLog[animal.kind] = (fieldLog[animal.kind] || 0) + 1;
    runLog[animal.kind] = (runLog[animal.kind] || 0) + 1;
    addCard('result_safe', animal.kind, pts);
    GF.sfx('reward');
    GF.juice.particles.burst(p.x, p.y, { color: '#a6ef93', count: 30, speed: 210 * ui, life: 0.62, size: 4 * ui });
    GF.juice.floatText(p.x, p.y - 16 * ui, '+' + String(pts), { color: '#f7e58a', size: 19 * ui });
    GF.juice.shake(0.08);
    if (captures >= quotaTarget) completeShift();
  } else if (!inZone) {
    addStress(STRESS_ZONE_ESCAPE, 'result_zone', animal.x, animal.y);
    addCard('result_zone', animal.kind, -STRESS_ZONE_ESCAPE);
    GF.sfx('hit');
    GF.juice.particles.burst(p.x, p.y, { color: '#f0bd6e', count: 18, speed: 145 * ui, life: 0.45, size: 3 * ui });
  } else {
    addStress(STRESS_BAD_DOSE, 'result_dose', animal.x, animal.y);
    addCard('result_dose', animal.kind, -STRESS_BAD_DOSE);
    GF.sfx('hurt');
    GF.juice.flash('#ff8d7a', 160, 0.18);
  }
  saveGame();
}

function addStress(amount, reason, wx, wy) {
  if (coachActive && coachStep < 3) return;
  stress = clamp(stress + amount, 0, MAX_STRESS);
  if (isFinite(wx) && isFinite(wy)) {
    var p = worldToScreen(wx, wy);
    GF.juice.floatText(p.x, p.y - 8 * ui, GF.t(reason), { color: '#ffb089', size: 13 * ui });
  }
  if (stress >= MAX_STRESS) endGame('reason_stress');
  saveGame();
}

function addCard(resultKey, kind, value) {
  cards.unshift({ resultKey: resultKey, kind: kind, value: value, age: 0 });
  if (cards.length > 4) cards.pop();
}

function completeShift() {
  score += 40 + shift * 15;
  stress = Math.max(0, stress - 16);
  GF.sfx('levelup');
  GF.juice.particles.burst(GF.cx, scene.y + scene.h * 0.42, { color: '#f7df82', count: 42, speed: 250 * ui, life: 0.8, size: 4 * ui });
  GF.juice.floatText(GF.cx, scene.y + scene.h * 0.37, GF.t('next_shift'), { color: '#f7df82', size: 20 * ui });
  if (shift >= SHIFT_WIN_TARGET && !wonExpertReady) {
    wonExpertReady = true;
    gs = 'WON';
    if (score > best) best = score;
    GF.gameEnded();
    GF.happytime();
    saveGame();
    return;
  }
  shift += 1;
  setupShift(shift, false);
  saveGame();
}

function endGame(reason) {
  if (gs !== 'PLAYING') return;
  gs = 'GAMEOVER';
  gameOverReason = reason;
  if (score > best) {
    best = score;
    GF.happytime();
  }
  GF.sfx('lose');
  GF.juice.flash('#552d28', 260, 0.28);
  GF.gameEnded();
  saveGame();
}

function setDose(idx, fromPlayer) {
  idx = clamp(idx, 0, 2);
  if (doseIndex === idx && fromPlayer) return;
  doseIndex = idx;
  if (fromPlayer) {
    GF.sfx('tap');
    GF.juice.punch(DOSES[doseIndex], 'pulse', 0.55, 180);
    if (idx === 0) advanceCoach(1);
    saveGame();
  }
}

function fireDart() {
  if (gs !== 'PLAYING' || helpOpen || shotCooldown > 0 || darts <= 0) return false;
  var dx = aim.x - ranger.x;
  var dy = aim.y - ranger.y;
  var len = Math.max(1, Math.sqrt(dx * dx + dy * dy));
  darts -= 1;
  shotCooldown = 0.22;
  dartShots.push({
    x: ranger.x,
    y: ranger.y,
    vx: dx / len * DART_SPEED,
    vy: dy / len * DART_SPEED,
    age: 0,
    trail: []
  });
  GF.sfx('click');
  var p = worldToScreen(ranger.x, ranger.y);
  GF.juice.particles.burst(p.x, p.y - 10 * ui, { color: DOSES[doseIndex].color, count: 10, speed: 120 * ui, life: 0.28, size: 2.6 * ui });
  advanceCoach(2);
  saveGame();
  return true;
}

function advanceCoach(step) {
  if (!coachActive || coachStep !== step) return;
  coachStep += 1;
  if (coachStep >= 3) {
    coachActive = false;
    tutorialDone = true;
    try { localStorage.setItem(GAME_KEY + '_tutorial_done', '1'); } catch (e) {}
  }
  saveGame();
}

function draw(c) {
  layout();
  c.clearRect(0, 0, GF.W, GF.H);
  c.save();
  c.translate(GF.juice.offsetX, GF.juice.offsetY);
  drawWorld(c);
  drawSafeZones(c);
  drawWindStreaks(c);
  drawAnimals(c);
  drawDarts(c);
  drawRanger(c);
  drawSight(c);
  GF.juice.particles.draw(c);
  GF.juice.texts.draw(c);
  c.restore();
  drawHUD(c);
  drawCards(c);
  if (coachActive) drawCoach(c);
  if (helpOpen) drawHelp(c);
  if (gs === 'GAMEOVER') drawTerminal(c, false);
  if (gs === 'WON') drawTerminal(c, true);
  GF.juice.drawFlash(c);
}

function drawWorld(c) {
  var sky = c.createLinearGradient(0, scene.y, 0, scene.y + scene.h);
  sky.addColorStop(0, '#c2d9b5');
  sky.addColorStop(0.32, '#8eb77d');
  sky.addColorStop(1, '#426940');
  c.fillStyle = '#0d1713';
  c.fillRect(0, 0, GF.W, GF.H);
  c.fillStyle = sky;
  c.fillRect(scene.x, scene.y, scene.w, scene.h);
  c.save();
  c.beginPath();
  c.rect(scene.x, scene.y, scene.w, scene.h);
  c.clip();
  for (var i = 0; i < 7; i++) {
    var yy = scene.y + scene.h * (0.18 + i * 0.12);
    c.strokeStyle = i % 2 ? 'rgba(45,84,45,0.18)' : 'rgba(236,214,141,0.13)';
    c.lineWidth = Math.max(2, 5 * ui);
    c.beginPath();
    c.moveTo(0, yy);
    c.bezierCurveTo(GF.W * 0.28, yy - 26 * ui, GF.W * 0.72, yy + 34 * ui, GF.W, yy - 8 * ui);
    c.stroke();
  }
  drawAcacia(c, worldToScreen(90, 130), 0.8);
  drawAcacia(c, worldToScreen(725, 118), 0.65);
  drawAcacia(c, worldToScreen(645, 474), 0.55);
  c.restore();
  c.strokeStyle = 'rgba(255,255,255,0.22)';
  c.lineWidth = Math.max(1, 2 * ui);
  c.strokeRect(scene.x + 0.5, scene.y + 0.5, scene.w - 1, scene.h - 1);
}

function drawAcacia(c, p, scale) {
  c.save();
  c.translate(p.x, p.y);
  c.scale(scale * ui, scale * ui);
  c.fillStyle = 'rgba(47,66,39,0.72)';
  c.fillRect(-4, 0, 8, 64);
  c.beginPath();
  c.ellipse(0, -6, 56, 22, -0.08, 0, Math.PI * 2);
  c.ellipse(-38, 4, 32, 16, 0.1, 0, Math.PI * 2);
  c.ellipse(40, 6, 36, 17, -0.18, 0, Math.PI * 2);
  c.fill();
  c.restore();
}

function drawSafeZones(c) {
  for (var i = 0; i < safeZones.length; i++) {
    var z = safeZones[i];
    var p = worldToScreen(z.x, z.y);
    var r = z.r * worldScale();
    var pulse = 1 + Math.sin(Date.now() / 360 + i) * 0.035;
    c.fillStyle = 'rgba(114,220,119,0.16)';
    c.strokeStyle = 'rgba(180,255,171,0.68)';
    c.lineWidth = Math.max(2, 3 * ui);
    c.beginPath();
    c.arc(p.x, p.y, r * pulse, 0, Math.PI * 2);
    c.fill();
    c.stroke();
    c.setLineDash([8 * ui, 7 * ui]);
    c.strokeStyle = 'rgba(42,91,42,0.45)';
    c.beginPath();
    c.arc(p.x, p.y, r * 0.72, 0, Math.PI * 2);
    c.stroke();
    c.setLineDash([]);
  }
}

function drawWindStreaks(c) {
  var dir = sign(wind.x || 1);
  var mag = Math.min(1, Math.abs(wind.x) / 105);
  c.strokeStyle = 'rgba(232,246,210,' + (0.12 + mag * 0.18) + ')';
  c.lineWidth = Math.max(1, 1.5 * ui);
  for (var i = 0; i < 12; i++) {
    var y = scene.y + scene.h * ((i * 0.083 + Date.now() / 10000) % 1);
    var x = (GF.W * ((i * 0.237 + Date.now() / 13000) % 1));
    c.beginPath();
    c.moveTo(x, y);
    c.lineTo(x + dir * (24 + mag * 36) * ui, y - 4 * ui);
    c.stroke();
  }
}

function drawAnimals(c) {
  for (var i = 0; i < animals.length; i++) {
    var a = animals[i];
    var p = worldToScreen(a.x, a.y);
    var s = Math.max(0.62, worldScale()) * ui;
    if (a.kind === 'zebra') drawZebra(c, p.x, p.y, a.dir, s);
    else if (a.kind === 'rhino') drawRhino(c, p.x, p.y, a.dir, s);
    else drawImpala(c, p.x, p.y, a.dir, s);
  }
}

function drawImpala(c, x, y, dir, s) {
  c.save();
  c.translate(x, y);
  c.scale(dir * s, s);
  c.fillStyle = '#c99a58';
  c.beginPath(); c.ellipse(0, 0, 22, 12, 0, 0, Math.PI * 2); c.fill();
  c.fillStyle = '#ead5a7';
  c.beginPath(); c.ellipse(5, 4, 13, 6, 0, 0, Math.PI * 2); c.fill();
  c.fillStyle = '#b57d42';
  c.beginPath(); c.ellipse(24, -8, 10, 7, -0.2, 0, Math.PI * 2); c.fill();
  c.strokeStyle = '#774f2f';
  c.lineWidth = 3;
  c.beginPath(); c.moveTo(27, -14); c.lineTo(32, -25); c.moveTo(21, -14); c.lineTo(22, -25); c.stroke();
  c.strokeStyle = '#6d4b32';
  c.lineWidth = 3;
  for (var i = -1; i <= 1; i += 2) {
    c.beginPath(); c.moveTo(-10 + i * 6, 9); c.lineTo(-13 + i * 6, 25); c.moveTo(8 + i * 3, 9); c.lineTo(9 + i * 4, 24); c.stroke();
  }
  c.restore();
}

function drawZebra(c, x, y, dir, s) {
  c.save();
  c.translate(x, y);
  c.scale(dir * s, s);
  c.fillStyle = '#e7e7db';
  c.beginPath(); c.ellipse(0, 0, 27, 14, 0, 0, Math.PI * 2); c.fill();
  c.fillStyle = '#dcdccf';
  c.beginPath(); c.ellipse(25, -8, 12, 8, -0.15, 0, Math.PI * 2); c.fill();
  c.strokeStyle = '#27302c';
  c.lineWidth = 3;
  for (var i = -18; i <= 18; i += 9) {
    c.beginPath(); c.moveTo(i, -12); c.lineTo(i + 4, 12); c.stroke();
  }
  c.beginPath(); c.moveTo(30, -11); c.lineTo(36, -19); c.moveTo(22, -13); c.lineTo(23, -21); c.stroke();
  c.lineWidth = 4;
  c.beginPath(); c.moveTo(-23, 4); c.lineTo(-34, 10); c.stroke();
  c.restore();
}

function drawRhino(c, x, y, dir, s) {
  c.save();
  c.translate(x, y);
  c.scale(dir * s, s);
  c.fillStyle = '#8fa099';
  c.beginPath(); c.ellipse(0, 2, 34, 18, 0, 0, Math.PI * 2); c.fill();
  c.fillStyle = '#9cada5';
  c.beginPath(); c.ellipse(29, -4, 15, 11, -0.08, 0, Math.PI * 2); c.fill();
  c.fillStyle = '#d6d2bc';
  c.beginPath(); c.moveTo(41, -8); c.lineTo(55, -13); c.lineTo(42, -2); c.closePath(); c.fill();
  c.strokeStyle = '#6d7d77';
  c.lineWidth = 5;
  c.beginPath(); c.moveTo(-18, 14); c.lineTo(-20, 28); c.moveTo(9, 15); c.lineTo(11, 29); c.stroke();
  c.restore();
}

function drawDarts(c) {
  for (var i = 0; i < dartShots.length; i++) {
    var d = dartShots[i];
    c.strokeStyle = DOSES[doseIndex].color;
    c.lineWidth = Math.max(1.5, 2.5 * ui);
    c.globalAlpha = 0.38;
    c.beginPath();
    for (var j = 0; j < d.trail.length; j++) {
      var tp = worldToScreen(d.trail[j].x, d.trail[j].y);
      if (j === 0) c.moveTo(tp.x, tp.y);
      else c.lineTo(tp.x, tp.y);
    }
    c.stroke();
    c.globalAlpha = 1;
    var p = worldToScreen(d.x, d.y);
    c.fillStyle = '#f9f3d4';
    c.strokeStyle = '#39453f';
    c.lineWidth = Math.max(1, 1.2 * ui);
    c.beginPath();
    c.arc(p.x, p.y, Math.max(3, 5 * ui), 0, Math.PI * 2);
    c.fill();
    c.stroke();
  }
}

function drawRanger(c) {
  var p = worldToScreen(ranger.x, ranger.y);
  c.save();
  c.translate(p.x, p.y);
  c.fillStyle = '#203b31';
  roundRect(c, -46 * ui, -24 * ui, 92 * ui, 42 * ui, 8 * ui);
  c.fillStyle = '#2f5a44';
  roundRect(c, -34 * ui, -38 * ui, 68 * ui, 24 * ui, 7 * ui);
  c.strokeStyle = '#d4c384';
  c.lineWidth = Math.max(3, 5 * ui);
  var a = Math.atan2(aim.y - ranger.y, aim.x - ranger.x);
  c.rotate(a);
  c.beginPath();
  c.moveTo(6 * ui, 0);
  c.lineTo(52 * ui, 0);
  c.stroke();
  c.restore();
}

function drawSight(c) {
  if (gs !== 'PLAYING') return;
  var start = worldToScreen(ranger.x, ranger.y);
  var end = worldToScreen(aim.x, aim.y);
  c.strokeStyle = DOSES[doseIndex].color;
  c.lineWidth = Math.max(1, 2 * ui);
  c.globalAlpha = 0.72;
  c.beginPath();
  c.moveTo(start.x, start.y);
  c.quadraticCurveTo((start.x + end.x) / 2 + wind.x * ui * 0.20, (start.y + end.y) / 2, end.x, end.y);
  c.stroke();
  c.globalAlpha = 1;
  c.strokeStyle = '#f8f7d7';
  c.lineWidth = Math.max(1, 2 * ui);
  c.beginPath();
  c.arc(end.x, end.y, 13 * ui, 0, Math.PI * 2);
  c.moveTo(end.x - 20 * ui, end.y); c.lineTo(end.x - 7 * ui, end.y);
  c.moveTo(end.x + 7 * ui, end.y); c.lineTo(end.x + 20 * ui, end.y);
  c.moveTo(end.x, end.y - 20 * ui); c.lineTo(end.x, end.y - 7 * ui);
  c.moveTo(end.x, end.y + 7 * ui); c.lineTo(end.x, end.y + 20 * ui);
  c.stroke();
}

function drawHUD(c) {
  c.fillStyle = '#13251e';
  c.fillRect(0, 0, GF.W, scene.top);
  c.fillStyle = '#182c23';
  c.fillRect(0, scene.y + scene.h, GF.W, scene.bottom);
  c.strokeStyle = 'rgba(238,233,187,0.22)';
  c.lineWidth = 1;
  c.beginPath(); c.moveTo(0, scene.top - 0.5); c.lineTo(GF.W, scene.top - 0.5); c.stroke();
  c.beginPath(); c.moveTo(0, scene.y + scene.h + 0.5); c.lineTo(GF.W, scene.y + scene.h + 0.5); c.stroke();

  var narrow = GF.W < 520;
  var titleW = GF.W - (narrow ? 110 * ui : 620 * ui);
  if (narrow) {
    fitText(c, GF.t('title'), 10 * ui, 23 * ui, GF.W - 112 * ui, 17 * ui, '#f7edc9', 'left', 850);
    fitText(c, GF.t('shift') + ' ' + String(shift) + '  ' + GF.t('score') + ' ' + String(score), 10 * ui, 48 * ui, GF.W - 24 * ui, 13 * ui, '#dbe8cc', 'left', 760);
    fitText(c, GF.t('quota') + ' ' + String(captures) + '/' + String(quotaTarget), GF.cx, 73 * ui, GF.W - 22 * ui, 15 * ui, '#f5dc82', 'center', 850);
    fitText(c, GF.t('darts') + ' ' + String(darts) + '  ' + GF.t('stress') + ' ' + String(Math.round(stress)) + '/' + String(MAX_STRESS), GF.cx, 96 * ui, GF.W - 22 * ui, 13 * ui, stress > 70 ? '#ffb08d' : '#cce3c3', 'center', 760);
    fitText(c, GF.t('wind') + ' ' + windLabel(), GF.cx, 116 * ui, GF.W - 28 * ui, 11 * ui, '#b9d8e4', 'center', 700);
  } else {
    fitText(c, GF.t('title'), 14 * ui, 25 * ui, Math.max(140, titleW), 18 * ui, '#f7edc9', 'left', 850);
    fitText(c, GF.t('shift') + ' ' + String(shift) + '  ' + GF.t('score') + ' ' + String(score), 14 * ui, 54 * ui, 250 * ui, 14 * ui, '#dbe8cc', 'left', 760);
    fitText(c, GF.t('quota') + ' ' + String(captures) + '/' + String(quotaTarget), GF.cx, 28 * ui, 270 * ui, 17 * ui, '#f5dc82', 'center', 850);
    fitText(c, targetSummary(), GF.cx, 56 * ui, 320 * ui, 13 * ui, '#d4dbc0', 'center', 680);
    fitText(c, GF.t('darts') + ' ' + String(darts), GF.W - 96 * ui, 25 * ui, 112 * ui, 13 * ui, '#efe3c4', 'right', 760);
    fitText(c, GF.t('stress') + ' ' + String(Math.round(stress)) + '/' + String(MAX_STRESS), GF.W - 96 * ui, 49 * ui, 116 * ui, 13 * ui, stress > 70 ? '#ffb08d' : '#cce3c3', 'right', 760);
    fitText(c, GF.t('wind') + ' ' + windLabel(), GF.W - 96 * ui, 73 * ui, 116 * ui, 12 * ui, '#b9d8e4', 'right', 700);
  }
  drawIconButton(c, uiRects.help, GF.t('help_btn'));
  drawIconButton(c, uiRects.mute, '');
  GF.drawMuteIcon(c, uiRects.mute.x + uiRects.mute.w / 2, uiRects.mute.y + uiRects.mute.h / 2, uiRects.mute.w * 0.46, GF.muted);
  drawDoseControls(c);
}

function drawIconButton(c, r, label) {
  c.fillStyle = 'rgba(238,229,177,0.12)';
  c.strokeStyle = 'rgba(238,229,177,0.42)';
  c.lineWidth = Math.max(1, 1.5 * ui);
  roundRect(c, r.x, r.y, r.w, r.h, 8 * ui);
  c.fill();
  c.stroke();
  if (label) fitText(c, label, r.x + r.w / 2, r.y + r.h / 2 + 1 * ui, r.w - 6 * ui, 16 * ui, '#f7edc9', 'center', 850);
}

function drawDoseControls(c) {
  var bottomTop = scene.y + scene.h;
  fitText(c, GF.t('dose') + ' ' + GF.t(DOSES[doseIndex].key), 12 * ui, bottomTop + 24 * ui, Math.max(150, GF.W * 0.38), 15 * ui, DOSES[doseIndex].color, 'left', 850);
  fitText(c, GF.t('dose_guide'), GF.W - 12 * ui, bottomTop + 24 * ui, Math.max(150, GF.W * 0.54), 11 * ui, '#d6d7bd', 'right', 650);
  for (var i = 0; i < uiRects.doses.length; i++) {
    var r = uiRects.doses[i];
    c.fillStyle = i === doseIndex ? DOSES[i].color : 'rgba(239,229,180,0.10)';
    c.strokeStyle = i === doseIndex ? '#fff3bd' : 'rgba(239,229,180,0.32)';
    c.lineWidth = Math.max(1, 2 * ui);
    roundRect(c, r.x, r.y, r.w, r.h, 8 * ui);
    c.fill();
    c.stroke();
    fitText(c, GF.t(DOSES[i].key), r.x + r.w / 2, r.y + r.h / 2 + 1 * ui, r.w - 8 * ui, 13 * ui, i === doseIndex ? '#142117' : '#eadfbd', 'center', 850);
  }
}

function drawCards(c) {
  var startX = 12 * ui;
  var y = scene.y + scene.h - 18 * ui;
  for (var i = 0; i < cards.length; i++) {
    var card = cards[i];
    var alpha = clamp(1 - Math.max(0, card.age - 2.7), 0, 1);
    var w = Math.min(185 * ui, (GF.W - 28 * ui) / 2);
    var x = startX + i * (w + 8 * ui);
    if (x + w > GF.W - 10 * ui) break;
    c.globalAlpha = alpha;
    c.fillStyle = 'rgba(22,38,31,0.86)';
    c.strokeStyle = card.value >= 0 ? 'rgba(166,239,147,0.55)' : 'rgba(255,176,137,0.55)';
    roundRect(c, x, y - 42 * ui, w, 34 * ui, 7 * ui);
    c.fill();
    c.stroke();
    var label = card.kind ? GF.t((SPECIES[card.kind] || SPECIES.impala).key) + ' ' + GF.t(card.resultKey) : GF.t(card.resultKey);
    fitText(c, label, x + 8 * ui, y - 25 * ui, w - 16 * ui, 11 * ui, '#f3eac5', 'left', 750);
    c.globalAlpha = 1;
  }
}

function drawCoach(c) {
  var key = coachStep === 0 ? 'coach_aim' : coachStep === 1 ? 'coach_dose' : coachStep === 2 ? 'coach_fire' : 'coach_done';
  var p = worldToScreen(animals[0] ? animals[0].x : aim.x, animals[0] ? animals[0].y : aim.y);
  c.strokeStyle = 'rgba(255,239,160,0.9)';
  c.lineWidth = Math.max(2, 3 * ui);
  c.beginPath();
  c.arc(p.x, p.y, (32 + Math.sin(Date.now() / 140) * 4) * ui, 0, Math.PI * 2);
  c.stroke();
  var w = Math.min(GF.W - 24 * ui, 390 * ui);
  var x = (GF.W - w) / 2;
  var y = scene.y + 14 * ui;
  var size = 13 * ui;
  var lines = wrapLines(c, GF.t(key), w - 24 * ui, size, 760);
  var h = 30 * ui + lines.length * size * 1.28;
  c.fillStyle = 'rgba(20,34,28,0.92)';
  c.strokeStyle = 'rgba(244,225,139,0.58)';
  roundRect(c, x, y, w, h, 9 * ui);
  c.fill();
  c.stroke();
  for (var i = 0; i < lines.length; i++) {
    drawText(c, lines[i], x + 12 * ui, y + 20 * ui + i * size * 1.28, size, '#f5e7b2', 'left', 760);
  }
}

function drawHelp(c) {
  c.fillStyle = 'rgba(5,9,8,0.58)';
  c.fillRect(0, 0, GF.W, GF.H);
  var w = Math.min(GF.W - 26 * ui, 560 * ui);
  var x = (GF.W - w) / 2;
  var size = GF.W < 430 ? 12 * ui : 13 * ui;
  var keys = ['tut_goal', 'tut_controls', 'tut_win', 'tut_lose', 'tut_tip', 'calm_note'];
  var blocks = [];
  var total = 50 * ui;
  for (var i = 0; i < keys.length; i++) {
    var lines = wrapLines(c, GF.t(keys[i]), w - 28 * ui, size, 650);
    blocks.push(lines);
    total += lines.length * size * 1.24 + 9 * ui;
  }
  total += 48 * ui;
  var h = Math.min(total, GF.H - 28 * ui);
  var y = (GF.H - h) / 2;
  c.fillStyle = '#182a22';
  c.strokeStyle = 'rgba(239,225,169,0.55)';
  c.lineWidth = Math.max(1, 2 * ui);
  roundRect(c, x, y, w, h, 10 * ui);
  c.fill();
  c.stroke();
  drawText(c, GF.t('help_title'), x + 16 * ui, y + 25 * ui, 17 * ui, '#f5e7b2', 'left', 850);
  var cy = y + 50 * ui;
  for (var b = 0; b < blocks.length; b++) {
    for (var j = 0; j < blocks[b].length; j++) {
      if (cy > y + h - 58 * ui) break;
      drawText(c, blocks[b][j], x + 15 * ui, cy, size, '#dce5c8', 'left', 650);
      cy += size * 1.24;
    }
    cy += 9 * ui;
  }
  uiRects.helpClose = { x: GF.cx - 72 * ui, y: y + h - 43 * ui, w: 144 * ui, h: 32 * ui };
  c.fillStyle = '#e8d98e';
  c.strokeStyle = '#fff3bd';
  roundRect(c, uiRects.helpClose.x, uiRects.helpClose.y, uiRects.helpClose.w, uiRects.helpClose.h, 8 * ui);
  c.fill();
  c.stroke();
  fitText(c, GF.t('close'), GF.cx, uiRects.helpClose.y + uiRects.helpClose.h / 2 + 1 * ui, uiRects.helpClose.w - 10 * ui, 12 * ui, '#172118', 'center', 850);
}

function drawTerminal(c, won) {
  c.fillStyle = 'rgba(5,9,8,0.65)';
  c.fillRect(0, 0, GF.W, GF.H);
  var w = Math.min(GF.W - 28 * ui, 460 * ui);
  var x = (GF.W - w) / 2;
  var h = 230 * ui;
  var y = (GF.H - h) / 2;
  c.fillStyle = '#182a22';
  c.strokeStyle = won ? 'rgba(166,239,147,0.62)' : 'rgba(255,176,137,0.62)';
  c.lineWidth = Math.max(1, 2 * ui);
  roundRect(c, x, y, w, h, 10 * ui);
  c.fill();
  c.stroke();
  fitText(c, won ? GF.t('won') : GF.t('gameover'), GF.cx, y + 36 * ui, w - 28 * ui, 24 * ui, won ? '#d9ffbd' : '#ffd1b8', 'center', 850);
  fitText(c, won ? GF.t('reason_win') : GF.t(gameOverReason), GF.cx, y + 72 * ui, w - 32 * ui, 13 * ui, '#dfe7ca', 'center', 700);
  fitText(c, GF.t('score') + ' ' + String(score) + '  ' + GF.t('best') + ' ' + String(best), GF.cx, y + 104 * ui, w - 32 * ui, 14 * ui, '#f2df9a', 'center', 800);
  fitText(c, GF.t('log') + ': ' + logSummary(), GF.cx, y + 132 * ui, w - 36 * ui, 12 * ui, '#d8e4c9', 'center', 650);
  var r = won ? uiRects.continue : uiRects.retry;
  c.fillStyle = won ? '#aeea93' : '#e8d98e';
  c.strokeStyle = '#fff3bd';
  roundRect(c, r.x, r.y, r.w, r.h, 9 * ui);
  c.fill();
  c.stroke();
  fitText(c, won ? GF.t('expert') : GF.t('retry'), r.x + r.w / 2, r.y + r.h / 2 + 1 * ui, r.w - 16 * ui, 14 * ui, '#142017', 'center', 850);
}

function targetSummary() {
  var list = availableSpecies().map(function(k) { return GF.t(SPECIES[k].key); });
  return GF.t('target') + ' ' + list.join(', ');
}

function logSummary() {
  var parts = [];
  if (fieldLog.impala) parts.push(GF.t('animal_impala') + ' ' + String(fieldLog.impala));
  if (fieldLog.zebra) parts.push(GF.t('animal_zebra') + ' ' + String(fieldLog.zebra));
  if (fieldLog.rhino) parts.push(GF.t('animal_rhino') + ' ' + String(fieldLog.rhino));
  return parts.length ? parts.join(', ') : GF.t('species_none');
}

function windLabel() {
  var mag = Math.round(Math.abs(wind.x));
  if (mag < 8) return GF.t('wind_calm');
  return (wind.x < 0 ? GF.t('wind_left') : GF.t('wind_right')) + ' ' + String(mag);
}

function handleUi(x, y) {
  if (helpOpen) {
    if (rectHit(uiRects.helpClose, x, y)) {
      helpOpen = false;
      GF.sfx('tap');
      return true;
    }
    return true;
  }
  if (rectHit(uiRects.help, x, y)) {
    helpOpen = true;
    GF.sfx('tap');
    return true;
  }
  if (rectHit(uiRects.mute, x, y)) {
    GF.toggleMute();
    GF.sfx('tap');
    return true;
  }
  if (gs === 'GAMEOVER' && rectHit(uiRects.retry, x, y)) {
    startRun(1);
    return true;
  }
  if (gs === 'WON' && rectHit(uiRects.continue, x, y)) {
    startRun(SHIFT_WIN_TARGET + 1);
    return true;
  }
  if (gs === 'PLAYING') {
    for (var i = 0; i < uiRects.doses.length; i++) {
      if (rectHit(uiRects.doses[i], x, y)) {
        setDose(i, true);
        return true;
      }
    }
  }
  return false;
}

function pointerWorld(e) {
  var r = GF.canvas.getBoundingClientRect();
  var sx = GF.W / Math.max(1, r.width);
  var sy = GF.H / Math.max(1, r.height);
  return screenToWorld((e.clientX - r.left) * sx, (e.clientY - r.top) * sy);
}

function pointerScreen(e) {
  var r = GF.canvas.getBoundingClientRect();
  var sx = GF.W / Math.max(1, r.width);
  var sy = GF.H / Math.max(1, r.height);
  return { x: (e.clientX - r.left) * sx, y: (e.clientY - r.top) * sy };
}

function onPointerDown(e) {
  if (e.cancelable) e.preventDefault();
  layout();
  var s = pointerScreen(e);
  if (handleUi(s.x, s.y)) {
    pointerAiming = false;
    return;
  }
  if (gs !== 'PLAYING') return;
  pointerAiming = true;
  var w = pointerWorld(e);
  aim.x = w.x;
  aim.y = w.y;
  advanceCoach(0);
}

function onPointerMove(e) {
  if (gs !== 'PLAYING') return;
  var w = pointerWorld(e);
  aim.x = w.x;
  aim.y = w.y;
  if (pointerAiming || e.pointerType === 'mouse') advanceCoach(0);
}

function onPointerUp(e) {
  if (e.cancelable) e.preventDefault();
  if (!pointerAiming) return;
  pointerAiming = false;
  var w = pointerWorld(e);
  aim.x = w.x;
  aim.y = w.y;
  fireDart();
}

function onKeyDown(e) {
  if (e.code === 'Digit1') { setDose(0, true); return; }
  if (e.code === 'Digit2') { setDose(1, true); return; }
  if (e.code === 'Digit3') { setDose(2, true); return; }
  if (e.code === 'Space' && !e.repeat) {
    if (e.cancelable) e.preventDefault();
    fireDart();
    return;
  }
  if (e.code === 'KeyF' && !e.repeat) {
    try {
      if (!document.fullscreenElement && GF.canvas.requestFullscreen) GF.canvas.requestFullscreen();
      else if (document.exitFullscreen) document.exitFullscreen();
    } catch (err) {}
  }
}

function stateObject() {
  return {
    gs: gs,
    score: score,
    best: best,
    shift: shift,
    darts: darts,
    stress: Math.round(stress),
    captures: captures,
    quotaTarget: quotaTarget,
    wind: Math.round(wind.x),
    dose: GF.t(DOSES[doseIndex].key),
    doseIndex: doseIndex,
    animals: animals.map(function(a) { return { kind: a.kind, x: Math.round(a.x), y: Math.round(a.y), safe: animalInSafeZone(a), targetDose: a.targetDose }; }).slice(0, 6),
    activeDarts: dartShots.length,
    safeZones: safeZones.map(function(z) { return { x: z.x, y: z.y, r: z.r }; }),
    fieldLog: fieldLog,
    coachActive: coachActive,
    coachStep: coachStep
  };
}

function renderText() {
  var s = stateObject();
  return JSON.stringify({
    note: 'World coordinates are 0..800 left-to-right and 0..600 top-to-bottom.',
    state: s
  });
}

function botActions() {
  var out = ['wait'];
  if (gs === 'PLAYING') {
    out.push('aim_animal', 'dose_low', 'dose_med', 'dose_high', 'fire', 'advance_shift');
  }
  if (gs === 'GAMEOVER' || gs === 'WON') out.push('restart');
  return out;
}

function botAct(action) {
  if (action === 'wait') { window.advanceTime(1000); return true; }
  if (action === 'restart') { startRun(1); return true; }
  if (action === 'dose_low') { setDose(0, true); return true; }
  if (action === 'dose_med') { setDose(1, true); return true; }
  if (action === 'dose_high') { setDose(2, true); return true; }
  if (action === 'aim_animal') {
    var a = animals[0];
    if (a) {
      aim.x = clamp(a.x - wind.x * 0.10, 20, WORLD_W - 20);
      aim.y = a.y;
      setDose((SPECIES[a.kind] || SPECIES.impala).dose, true);
      advanceCoach(0);
    }
    return true;
  }
  if (action === 'fire') return fireDart();
  if (action === 'advance_shift') {
    captures = quotaTarget;
    completeShift();
    return true;
  }
  return false;
}

function setupForScreenshot(level) {
  screenshotMode = true;
  tutorialDone = true;
  coachActive = false;
  helpOpen = false;
  gs = 'PLAYING';
  score = 520 + Math.max(0, level || 4) * 140;
  stress = 24;
  shift = Math.max(1, level || 5);
  runLog = { impala: 2, zebra: 1, rhino: shift >= 4 ? 1 : 0 };
  fieldLog.impala = Math.max(fieldLog.impala, 2);
  fieldLog.zebra = Math.max(fieldLog.zebra, 1);
  if (shift >= 4) fieldLog.rhino = Math.max(fieldLog.rhino, 1);
  setupShift(shift, false);
  captures = Math.max(1, Math.min(quotaTarget - 1, 2));
  darts = START_DARTS - 3;
  doseIndex = shift >= 4 ? 2 : 1;
  animals = [
    makeAnimal('impala', safeZones[0].x - 25, safeZones[0].y, 1, false),
    makeAnimal('zebra', safeZones[0].x + 120, safeZones[0].y + 45, -1, false)
  ];
  if (shift >= 4) animals.push(makeAnimal('rhino', 610, 378, -1, false));
  cards = [
    { resultKey: 'result_safe', kind: 'impala', value: 126, age: 0.8 },
    { resultKey: 'result_dose', kind: 'zebra', value: -18, age: 1.8 }
  ];
  aim.x = animals[0].x;
  aim.y = animals[0].y;
  wind.x = 66;
  wind.target = 66;
  draw(GF.ctx);
}

window._jumpLevel = function(n) { setupForScreenshot(Number(n) || 5); };
window._setupForScreenshot = function(level) { setupForScreenshot(Number(level) || 5); };
window.advanceTime = function(ms) {
  var total = Math.max(0, Number(ms) || 0);
  var step = 1 / 30;
  var count = Math.max(1, Math.ceil(total / 1000 / step));
  for (var i = 0; i < count; i++) update(step);
  draw(GF.ctx);
  return stateObject();
};
window.render_game_to_text = renderText;

GF.canvas.addEventListener('pointerdown', onPointerDown, { passive: false });
GF.canvas.addEventListener('pointermove', onPointerMove, { passive: false });
GF.canvas.addEventListener('pointerup', onPointerUp, { passive: false });
GF.canvas.addEventListener('pointercancel', function(e) { pointerAiming = false; if (e.cancelable) e.preventDefault(); }, { passive: false });
document.addEventListener('keydown', onKeyDown);

GF.exposeState(stateObject);
GF.exposeBot(botActions, botAct);
GF.exposeReach(function() {
  layout();
  var items = [
    { id: 'help', x: uiRects.help.x, y: uiRects.help.y, w: uiRects.help.w, h: uiRects.help.h, pinned: true },
    { id: 'mute', x: uiRects.mute.x, y: uiRects.mute.y, w: uiRects.mute.w, h: uiRects.mute.h, pinned: true }
  ];
  for (var i = 0; i < uiRects.doses.length; i++) {
    var d = uiRects.doses[i];
    items.push({ id: 'dose_' + String(i + 1), x: d.x, y: d.y, w: d.w, h: d.h, pinned: true });
  }
  if (gs === 'GAMEOVER') items.push({ id: 'retry', x: uiRects.retry.x, y: uiRects.retry.y, w: uiRects.retry.w, h: uiRects.retry.h, pinned: true });
  if (gs === 'WON') items.push({ id: 'continue', x: uiRects.continue.x, y: uiRects.continue.y, w: uiRects.continue.w, h: uiRects.continue.h, pinned: true });
  if (helpOpen) items.push({ id: 'help_close', x: uiRects.helpClose.x, y: uiRects.helpClose.y, w: uiRects.helpClose.w, h: uiRects.helpClose.h, pinned: true });
  return { screen: helpOpen ? 'help' : gs, viewportW: GF.W, viewportH: GF.H, screenH: GF.H, scrollMaxY: 0, items: items };
});
GF.exposeTour([
  { action: 'aim_animal', expect: 'coachStep >= 1' },
  { action: 'dose_low', expect: 'doseIndex == 0' },
  { action: 'fire', expect: 'darts < START_DARTS' }
]);

GF.init({
  designW: 800,
  designH: 600,
  strings: STRINGS,
  sprites: [],
  saveKey: GAME_KEY,
  onReady: function() {
    try { tutorialDone = localStorage.getItem(GAME_KEY + '_tutorial_done') === '1'; } catch (e) {}
    var loaded = GF.persist(GAME_KEY + '_run_v1', getSaveState, applySaveState);
    persistReady = true;
    GF.bgMusic({ file: 'audio/bg_track.mp3', preset: 'calm', muted: GF.muted });
    if (!loaded || gs !== 'PLAYING') startRun(1);
    else {
      coachActive = !tutorialDone;
      GF.gameStarted();
      saveGame();
    }
  },
  onUpdate: update,
  onDraw: draw
});

})();
</script>
</body>
</html>
