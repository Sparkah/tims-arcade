<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#031009">
<title>Megaton</title>
<meta name="description" content="Drop one warhead, level the city, tune your nuke, and buy optional boosts with Telegram Stars.">
<meta property="og:image" content="https://game-factory.tech/tg-megaton/cover.png">
<script src="./vendor/telegram-web-app.js"></script>
<!-- PLATFORM_SDK -->
<script src="./config.js"></script>
<script src="./data/economy-missions.js?v=20260701"></script>
<link rel="stylesheet" href="./css/app.css">
</head>
<body>
<div id="app">
  <iframe id="game" data-src="./game/index.html?tg=1" allow="autoplay; fullscreen; gamepad"></iframe>
  <div class="fab-stack">
    <button class="shop-fab missions" type="button" id="missionsBtn">MISSIONS</button>
    <button class="shop-fab" type="button" id="shopBtn">SHOP</button>
  </div>
</div>

<section class="screen" id="skinsScreen" hidden>
  <div class="panel skin-panel">
    <div class="skin-shell">
      <div class="skin-hero">
        <div id="equippedArt"></div>
        <div>
          <h1 id="skinTitle">Shop</h1>
          <p class="lede" id="skinLede">Open payload boxes, buy boosts, and equip one visual bonus.</p>
          <div class="skin-equipped" id="equippedLabel">No payload equipped</div>
        </div>
      </div>
      <div class="skin-tabs">
        <button class="seg-btn active" type="button" data-skin-tab="boxes">Shop</button>
        <button class="seg-btn" type="button" data-skin-tab="missions">Missions</button>
        <button class="seg-btn" type="button" data-skin-tab="collection">Collection</button>
        <button class="seg-btn" type="button" data-skin-tab="leaders">Leaders</button>
      </div>
      <div class="skin-body">
        <div class="skin-view" id="skinBoxesView">
          <div class="box-grid" id="boxGrid"></div>
          <div class="reveal-tray" id="revealTray"></div>
          <div class="ton-connect" id="tonConnectButton"></div>
          <div class="ton-credit" id="tonCreditBar" hidden></div>
          <div class="shop-list arsenal-shop-list" id="shopList"></div>
          <div class="local-test-panel" id="localTestPanel" hidden></div>
          <p class="fine"><span id="fineCopy">Digital items are optional.</span> <a id="termsLink" href="./terms.html" target="_blank" rel="noopener">Terms</a></p>
        </div>
        <div class="skin-view" id="skinMissionsView" hidden>
          <div class="mission-list" id="missionList"></div>
        </div>
        <div class="skin-view" id="skinCollectionView" hidden>
          <div class="collection-tools" id="skinFilters"></div>
          <div class="skin-grid" id="skinGrid"></div>
        </div>
        <div class="skin-view" id="skinLeadersView" hidden>
          <div class="leader-list" id="leaderList"></div>
        </div>
      </div>
      <div class="skin-footer single">
        <button class="wide" type="button" id="demoResetSkinsBtn" hidden>Reset</button>
        <button class="wide" type="button" id="closeSkinsBtn">Close<span class="shop-close-guide" id="shopCloseGuide" hidden aria-hidden="true"></span></button>
      </div>
    </div>
  </div>
</section>

<div id="toast" hidden></div>

<script type="module" src="./js/app.js"></script>

</body>
</html>
